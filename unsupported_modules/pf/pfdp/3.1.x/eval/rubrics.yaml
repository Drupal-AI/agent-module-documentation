rubrics:
- id: pfdp_pfdp_directory_entity
  version: '1.0'
  applicable_bundles:
  - pfdp
  checks:
  - kind: must_contain_any
    values:
    - pfdp_directory
    - pfdp.pfdp_directory
    - file_private_path
  scoring:
    combine: all_pass
- id: pfdp_pfdp_permissions
  version: '1.0'
  applicable_bundles:
  - pfdp
  checks:
  - kind: must_contain_any
    values:
    - bypass pfdp
    - administer pfdp
  scoring:
    combine: all_pass
- id: pfdp_pfdp_unregistered_path
  version: '1.0'
  applicable_bundles:
  - pfdp
  checks:
  - kind: must_contain_any
    values:
    - deny
    - denied
    - '-1'
    - '403'
  scoring:
    combine: all_pass
- id: pfdp_pfdp_known_directory
  version: '1.0'
  applicable_bundles:
  - pfdp
  checks:
  - kind: must_contain_any
    values:
    - pfdp_intro_role
  scoring:
    combine: all_pass
- id: pfdp_pfdp_known_user
  version: '1.0'
  applicable_bundles:
  - pfdp
  checks:
  - kind: must_contain_any
    values:
    - pfdp_intro_reader
  scoring:
    combine: all_pass
- id: pfdp_pfdp_secure_directory
  version: '1.0'
  applicable_bundles:
  - pfdp
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
- id: pfdp_pfdp_settings_init
  version: '1.0'
  applicable_bundles:
  - pfdp
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
