metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: acquia_perz_push
  version: 4.1.x
  note: 'acquia_perz_push is the export engine submodule of acquia_perz. It adds Drush commands (QueueCommands:
    acquia:perz-enqueue-content, acquia:perz-process-queue, acquia:perz-queue-items, acquia:perz-purge-queue,
    acquia:perz-purge-current, acquia:perz-purge-all), two admin forms gated by ''administer acquia perz
    push'', two queue workers, a tracking table acquia_perz_push_export_tracking, and config object acquia_perz_push.settings
    with cis.queue_bulk_max_size (default 20) and cis.endpoint_timeout (default 2). Medium reads back
    a known cis.queue_bulk_max_size; hard sets cis.endpoint_timeout to a target value and verifies against
    live config.'
questions:
- id: acquia_perz_push-drush-export
  input: Using the acquia_perz_push module, which Drush commands do I run to (a) scan and enqueue all
    personalization-eligible content, and (b) push the queued content to Acquia Personalization?
  criteria: Run 'drush acquia:perz-enqueue-content' (alias ap-ec) to rescan and enqueue content, then
    'drush acquia:perz-process-queue' to export the queued items to CIS. Use 'drush acquia:perz-queue-items'
    to see the queue count.
  bundle: acquia_perz_push
  rubric_ref: rubric/acquia_perz_push_acquia_perz_push_drush_export@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: acquia_perz_push-config-keys
  input: Which configuration object and keys control the bulk export chunk size and the CIS request timeout
    in acquia_perz_push, and what are the default values?
  criteria: Config object acquia_perz_push.settings holds cis.queue_bulk_max_size (default 20) and cis.endpoint_timeout
    (default 2 seconds). There is no settings form; set them with drush cset.
  bundle: acquia_perz_push
  rubric_ref: rubric/acquia_perz_push_acquia_perz_push_config_keys@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: acquia_perz_push-tracking-table
  input: How does acquia_perz_push know which entities have already been exported to Acquia Personalization?
    Name the database table and the service that manages it.
  criteria: It records every export in the acquia_perz_push_export_tracking table (created in hook_schema),
    managed by the ExportTracker service (acquia_perz_push.tracker) with statuses exported/export_timeout/deleted/delete_timeout/failed.
  bundle: acquia_perz_push
  rubric_ref: rubric/acquia_perz_push_acquia_perz_push_tracking_table@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: acquia_perz_push-known-bulk-size
  input: This site has acquia_perz_push installed and its bulk export chunk size has been customized.
    Inspect the live configuration and tell me the current bulk queue max size.
  criteria: The bulk queue max size is 37, at acquia_perz_push.settings -> cis.queue_bulk_max_size (drush
    cget acquia_perz_push.settings cis.queue_bulk_max_size).
  bundle: acquia_perz_push
  rubric_ref: rubric/acquia_perz_push_acquia_perz_push_known_bulk_size@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/acquia_perz_push-known-bulk-size-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/acquia_perz_push-known-bulk-size-cleanup.sh
- id: acquia_perz_push-set-timeout
  input: On this site the Acquia Personalization exports are timing out on a slow network. Using acquia_perz_push,
    raise the CIS endpoint timeout to 10 seconds in the live configuration.
  criteria: acquia_perz_push.settings -> cis.endpoint_timeout is set to 10 (drush cset acquia_perz_push.settings
    cis.endpoint_timeout 10 -y).
  bundle: acquia_perz_push
  rubric_ref: rubric/acquia_perz_push_acquia_perz_push_set_timeout@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/acquia_perz_push-set-timeout-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/acquia_perz_push-set-timeout-reset.sh
    verify: agent-module-documentation/evaluation/verify/acquia_perz_push-set-timeout-verify.sh
