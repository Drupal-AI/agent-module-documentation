rubrics:
- id: acquia_perz_push_acquia_perz_push_drush_export
  version: '1.0'
  applicable_bundles:
  - acquia_perz_push
  checks:
  - kind: must_contain_any
    values:
    - acquia:perz-enqueue-content
    - acquia:perz-process-queue
    - ap-ec
  scoring:
    combine: all_pass
- id: acquia_perz_push_acquia_perz_push_config_keys
  version: '1.0'
  applicable_bundles:
  - acquia_perz_push
  checks:
  - kind: must_contain_any
    values:
    - acquia_perz_push.settings
    - queue_bulk_max_size
    - endpoint_timeout
  scoring:
    combine: all_pass
- id: acquia_perz_push_acquia_perz_push_tracking_table
  version: '1.0'
  applicable_bundles:
  - acquia_perz_push
  checks:
  - kind: must_contain_any
    values:
    - acquia_perz_push_export_tracking
    - ExportTracker
  scoring:
    combine: all_pass
- id: acquia_perz_push_acquia_perz_push_known_bulk_size
  version: '1.0'
  applicable_bundles:
  - acquia_perz_push
  checks:
  - kind: must_contain_any
    values:
    - '37'
  scoring:
    combine: all_pass
- id: acquia_perz_push_acquia_perz_push_set_timeout
  version: '1.0'
  applicable_bundles:
  - acquia_perz_push
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
