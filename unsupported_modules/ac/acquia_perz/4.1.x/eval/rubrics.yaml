rubrics:
- id: acquia_perz_acquia_perz_config_objects
  version: '1.0'
  applicable_bundles:
  - acquia_perz
  checks:
  - kind: must_contain_any
    values:
    - acquia_perz.settings
    - acquia_perz.admin_settings
    - admin/config/services/acquia-perz/settings
  scoring:
    combine: all_pass
- id: acquia_perz_acquia_perz_view_mode_optin
  version: '1.0'
  applicable_bundles:
  - acquia_perz
  checks:
  - kind: must_contain_any
    values:
    - acquia_perz.entity_config
    - Manage display
    - view_modes
    - entity_view_display
  scoring:
    combine: all_pass
- id: acquia_perz_acquia_perz_push_required
  version: '1.0'
  applicable_bundles:
  - acquia_perz
  checks:
  - kind: must_contain_any
    values:
    - acquia_perz_push
    - hook_requirements
    - status report
    - Push module
  scoring:
    combine: all_pass
- id: acquia_perz_acquia_perz_known_site_id
  version: '1.0'
  applicable_bundles:
  - acquia_perz
  checks:
  - kind: must_contain_any
    values:
    - perzintro_known_site
  scoring:
    combine: all_pass
- id: acquia_perz_acquia_perz_enable_article_personalization
  version: '1.0'
  applicable_bundles:
  - acquia_perz
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
