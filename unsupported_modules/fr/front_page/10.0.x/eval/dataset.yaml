metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: front_page
  version: 10.0.x
  note: 'Front Page (project ''front'', module machine name front_page) is a config-driven redirect layer.
    All state is the front_page.settings config object: enabled (master switch), disable_for_administrators,
    home_link_path (used by the outbound path processor to rewrite <front>), and roles.<role_id> = {enabled,
    weight, path} (lowest weight wins). Redirect is a runtime RedirectResponse from FrontPageSubscriber
    on the front page only. Settings form route front_page.settings (/admin/config/system/front/settings),
    permission ''administer front page''. Medium cases read back configured role redirect path / home_link_path;
    hard cases enable the override + set an anonymous redirect and set home_link_path, verified against
    live config.'
questions:
- id: front_page-mechanism
  input: How does the Drupal 'front' module (front_page) decide where to send a visitor from the front
    page, and where are the per-role targets stored?
  criteria: On a front-page request, FrontPageSubscriber (a REQUEST subscriber) picks the enabled role
    override with the lowest weight for the current user and issues a RedirectResponse to its path. Targets
    live in front_page.settings under roles.<role_id> = {enabled, weight, path}, gated by the master 'enabled'
    switch.
  bundle: front_page
  rubric_ref: rubric/front_page_front_page_mechanism@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: front_page-master-switch-and-admins
  input: In front_page, which setting turns the whole feature on, and how do I stop administrators from
    ever being redirected?
  criteria: The boolean 'enabled' in front_page.settings is the master switch. Set 'disable_for_administrators'
    to true so users with the administrator role are never redirected.
  bundle: front_page
  rubric_ref: rubric/front_page_front_page_master_switch_and_admins@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: front_page-home-link
  input: Besides role-based redirects, front_page can change where the site's Home link points. Which
    setting controls that and how does it take effect?
  criteria: front_page.settings.home_link_path. The FrontPagePathProcessor outbound path processor rewrites
    '/<front>' (or an empty path) to '/'.home_link_path, so the theme's Home link and url('<front>') resolve
    to that path.
  bundle: front_page
  rubric_ref: rubric/front_page_front_page_home_link@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: front_page-known-redirect
  input: On this Drupal site, Front Page override is enabled and anonymous visitors are redirected away
    from the front page. Inspect the live configuration and state the path anonymous users are sent to.
  criteria: 'front_page.settings has enabled: true and roles.anonymous = {enabled: true, weight: 0, path:
    /user/login}, so anonymous users are redirected to /user/login.'
  bundle: front_page
  rubric_ref: rubric/front_page_front_page_known_redirect@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/front_page-known-redirect-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/front_page-known-redirect-cleanup.sh
- id: front_page-home-link-value
  input: On this site, front_page has been configured to rewrite the site's Home link. Inspect the live
    configuration and give the configured home link path.
  criteria: front_page.settings.home_link_path is 'welcome' (so <front> links resolve to /welcome).
  bundle: front_page
  rubric_ref: rubric/front_page_front_page_home_link_value@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/front_page-home-link-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/front_page-home-link-cleanup.sh
- id: front_page-set-redirect
  input: On this Drupal site, use the Front Page (front_page) module to redirect anonymous visitors from
    the front page to /user/login. Turn on the front-page override and configure the anonymous role's
    redirect. Apply the change to the live site.
  criteria: 'In front_page.settings set enabled = TRUE and roles.anonymous = {enabled: TRUE, weight: 0,
    path: ''/user/login''} and save.'
  bundle: front_page
  rubric_ref: rubric/front_page_front_page_set_redirect@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/front_page-set-redirect-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/front_page-set-redirect-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/front_page-set-redirect-verify.sh
- id: front_page-set-home-link
  input: On my Drupal site I want the little 'Home' link in the menu to take people to /welcome instead
    of the normal front page. Using the Front Page module, set that up on the live site (use 'welcome'
    as the target).
  criteria: Set front_page.settings.home_link_path = 'welcome' (via the Home links form at /admin/config/system/front/home-links
    or config). The outbound path processor then rewrites <front> links to /welcome.
  bundle: front_page
  rubric_ref: rubric/front_page_front_page_set_home_link@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-layman
    reset: agent-module-documentation/evaluation/verify/front_page-set-home-link-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/front_page-set-home-link-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/front_page-set-home-link-verify.sh
