rubrics:
- id: front_page_front_page_mechanism
  version: '1.0'
  applicable_bundles:
  - front_page
  checks:
  - kind: must_contain_any
    values:
    - front_page.settings
    - roles
    - weight
    - redirect
  scoring:
    combine: all_pass
- id: front_page_front_page_master_switch_and_admins
  version: '1.0'
  applicable_bundles:
  - front_page
  checks:
  - kind: must_contain_any
    values:
    - enabled
    - disable_for_administrators
  scoring:
    combine: all_pass
- id: front_page_front_page_home_link
  version: '1.0'
  applicable_bundles:
  - front_page
  checks:
  - kind: must_contain_any
    values:
    - home_link_path
    - <front>
    - path processor
  scoring:
    combine: all_pass
- id: front_page_front_page_known_redirect
  version: '1.0'
  applicable_bundles:
  - front_page
  checks:
  - kind: must_contain_any
    values:
    - /user/login
  scoring:
    combine: all_pass
- id: front_page_front_page_home_link_value
  version: '1.0'
  applicable_bundles:
  - front_page
  checks:
  - kind: must_contain_any
    values:
    - welcome
  scoring:
    combine: all_pass
- id: front_page_front_page_set_redirect
  version: '1.0'
  applicable_bundles:
  - front_page
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
- id: front_page_front_page_set_home_link
  version: '1.0'
  applicable_bundles:
  - front_page
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
