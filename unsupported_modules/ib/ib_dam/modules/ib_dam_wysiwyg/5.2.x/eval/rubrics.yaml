rubrics:
- id: ib_dam_wysiwyg_ib_dam_wysiwyg_deprecated
  version: '1.0'
  applicable_bundles:
  - ib_dam_wysiwyg
  checks:
  - kind: must_contain_any
    values:
    - deprecated
    - unchanged
    - no alternative
    - '6.0'
    - no-op
    - removed
  scoring:
    combine: all_pass
- id: ib_dam_wysiwyg_ib_dam_wysiwyg_filter_id
  version: '1.0'
  applicable_bundles:
  - ib_dam_wysiwyg
  checks:
  - kind: must_contain_any
    values:
    - ib_dam_wysiwyg
    - TYPE_MARKUP_LANGUAGE
    - filter
  scoring:
    combine: all_pass
- id: ib_dam_wysiwyg_ib_dam_wysiwyg_migration
  version: '1.0'
  applicable_bundles:
  - ib_dam_wysiwyg
  checks:
  - kind: must_contain_any
    values:
    - drupal-media
    - migrat
    - JSON
    - convert
  scoring:
    combine: all_pass
- id: ib_dam_wysiwyg_ib_dam_wysiwyg_which_format
  version: '1.0'
  applicable_bundles:
  - ib_dam_wysiwyg
  checks:
  - kind: must_contain_any
    values:
    - ibw_probe_fmt
  scoring:
    combine: all_pass
- id: ib_dam_wysiwyg_ib_dam_wysiwyg_build_enable
  version: '1.0'
  applicable_bundles:
  - ib_dam_wysiwyg
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
