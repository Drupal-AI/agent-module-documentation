metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: ib_dam_wysiwyg
  version: 5.2.x
  note: 'ib_dam_wysiwyg (submodule of ib_dam) is DEPRECATED (removed in 6.0.0). It provides one text-format
    filter id ib_dam_wysiwyg (TYPE_MARKUP_LANGUAGE) whose process() now returns the text UNCHANGED and
    triggers an E_USER_DEPRECATED notice; hook_requirements adds a runtime deprecation warning. Its migration
    hook ib_dam_wysiwyg_update_9000 removes the filter from all formats and converts legacy inline IB
    JSON markup into <drupal-media> tags. No config, no schema, no permissions. Enablement state lives
    in filter.format.<id> -> filters.ib_dam_wysiwyg.status. Cases grounded in the filter plugin and the
    filter.format config. Glue/deprecated submodule: 3 easy / 1 medium / 1 hard.'
questions:
- id: ib_dam_wysiwyg-deprecated
  input: Is the ib_dam_wysiwyg module still functional, and what does its text filter do to field content
    in the current release?
  criteria: It is deprecated (removed in 6.0.0). Its filter's process() now returns the text unchanged
    and triggers an E_USER_DEPRECATED notice; the module also raises a runtime 'deprecated' requirement
    warning. Use ib_dam_media instead.
  bundle: ib_dam_wysiwyg
  rubric_ref: rubric/ib_dam_wysiwyg_ib_dam_wysiwyg_deprecated@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: ib_dam_wysiwyg-filter-id
  input: What is the plugin id and filter type of the text-format filter provided by the ib_dam_wysiwyg
    module?
  criteria: The filter plugin id is ib_dam_wysiwyg (title 'IntelligenceBank DAM WYSIWYG'), of type TYPE_MARKUP_LANGUAGE.
  bundle: ib_dam_wysiwyg
  rubric_ref: rubric/ib_dam_wysiwyg_ib_dam_wysiwyg_filter_id@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: ib_dam_wysiwyg-migration
  input: What does the ib_dam_wysiwyg update hook (ib_dam_wysiwyg_update_9000) do to legacy IntelligenceBank
    content?
  criteria: ib_dam_wysiwyg_update_9000() removes the ib_dam_wysiwyg filter from all text formats and converts
    legacy inline IB custom-JSON markup in text fields into standard <drupal-media> tags, creating real
    media entities (via ib_dam_media's MediaStorage / MediaTypeMatcher).
  bundle: ib_dam_wysiwyg
  rubric_ref: rubric/ib_dam_wysiwyg_ib_dam_wysiwyg_migration@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: ib_dam_wysiwyg-which-format
  input: On this Drupal site, the deprecated ib_dam_wysiwyg filter is enabled on exactly one text format.
    Inspect the live filter format configuration and give the machine name of that format.
  criteria: filter.format.ibw_probe_fmt has filters.ib_dam_wysiwyg.status = true, so the deprecated ib_dam_wysiwyg
    filter is enabled on the ibw_probe_fmt format.
  bundle: ib_dam_wysiwyg
  rubric_ref: rubric/ib_dam_wysiwyg_ib_dam_wysiwyg_which_format@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/ib_dam_wysiwyg-which-format-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/ib_dam_wysiwyg-which-format-cleanup.sh
- id: ib_dam_wysiwyg-build-enable
  input: On this Drupal site, create a text format with machine name ibw_build_fmt (label 'IBW Build')
    and enable the ib_dam_wysiwyg filter on it, applying the change to the live configuration.
  criteria: A filter.format.ibw_build_fmt config entity exists with filters.ib_dam_wysiwyg.status = true
    (e.g. FilterFormat::create then setFilterConfig('ib_dam_wysiwyg', ['status' => TRUE])->save()).
  bundle: ib_dam_wysiwyg
  rubric_ref: rubric/ib_dam_wysiwyg_ib_dam_wysiwyg_build_enable@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/ib_dam_wysiwyg-build-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/ib_dam_wysiwyg-build-reset.sh
    verify: agent-module-documentation/evaluation/verify/ib_dam_wysiwyg-build-verify.sh
