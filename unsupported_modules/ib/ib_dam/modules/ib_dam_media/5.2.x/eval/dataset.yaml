metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: ib_dam_media
  version: 5.2.x
  note: ib_dam_media (submodule of ib_dam) provides the ib_dam_embed media source/type (source field field_media_ib_dam_embed,
    a link field) and an IntelligenceBank asset browser at /ib-dam-browser added to the core media_library_add_form_upload
    form. Config object ib_dam_media.settings (keys upload_location, media_types = sequence of {source_type,
    media_type}) edited at /admin/config/services/ib_dam/media behind 'administer intelligencebank configuration'.
    NO config ships by default. MediaTypeMatcher service (ib_dam_media.media_type_matcher) resolves IB
    source type -> local media type; MediaStorage persists assets as media. Cases grounded in ib_dam_media.settings,
    the media type, and the source field.
questions:
- id: ib_dam_media-media-type
  input: In the ib_dam_media module, what is the machine name of the media type/source it provides, and
    what is the source field that stores the IntelligenceBank asset link?
  criteria: The media source and media type id is ib_dam_embed, and the source field is field_media_ib_dam_embed
    (a core link field).
  bundle: ib_dam_media
  rubric_ref: rubric/ib_dam_media_ib_dam_media_media_type@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: ib_dam_media-config-form
  input: What does the ib_dam_media configuration form at /admin/config/services/ib_dam/media let you
    configure, and in which config object is it stored?
  criteria: It maps IntelligenceBank source asset types to local media types (and sets the upload_location
    for downloaded files). It is stored in the ib_dam_media.settings config object (keys upload_location
    and media_types, a sequence of {source_type, media_type}).
  bundle: ib_dam_media
  rubric_ref: rubric/ib_dam_media_ib_dam_media_config_form@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: ib_dam_media-asset-browser
  input: How do editors reach the IntelligenceBank asset browser when adding media with ib_dam_media,
    and what route/path does it use?
  criteria: ib_dam_media adds an 'Open IntelligenceBank Browser' button to the core Media Library upload
    form; it opens the asset browser in a modal at /ib-dam-browser (route id_dam_media.asset_browser_form).
    The embed option only shows when ib_dam.settings.allow_embedding is enabled.
  bundle: ib_dam_media
  rubric_ref: rubric/ib_dam_media_ib_dam_media_asset_browser@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: ib_dam_media-upload-location
  input: On this Drupal site, where does ib_dam_media save downloaded IntelligenceBank files? Inspect
    the live configuration and give the upload location.
  criteria: ib_dam_media.settings.upload_location is 'public://ib_dam_assets_probe' on this site.
  bundle: ib_dam_media
  rubric_ref: rubric/ib_dam_media_ib_dam_media_upload_location@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/ib_dam_media-upload-location-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/ib_dam_media-upload-location-cleanup.sh
- id: ib_dam_media-mapping
  input: On this Drupal site, ib_dam_media has a media-type mapping configured. Inspect the live configuration
    and state which local Drupal media type the IntelligenceBank 'document' source type is mapped to.
  criteria: In ib_dam_media.settings.media_types the 'document' source_type is mapped to the local media
    type 'video' on this site.
  bundle: ib_dam_media
  rubric_ref: rubric/ib_dam_media_ib_dam_media_mapping@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/ib_dam_media-mapping-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/ib_dam_media-mapping-cleanup.sh
- id: ib_dam_media-build-upload-location
  input: Configure ib_dam_media so that downloaded IntelligenceBank files are stored in public://ib-dam-files,
    and apply the change to the live configuration.
  criteria: ib_dam_media.settings.upload_location = 'public://ib-dam-files'.
  bundle: ib_dam_media
  rubric_ref: rubric/ib_dam_media_ib_dam_media_build_upload_location@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/ib_dam_media-build-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/ib_dam_media-build-reset.sh
    verify: agent-module-documentation/evaluation/verify/ib_dam_media-build-upload-location-verify.sh
- id: ib_dam_media-build-mapping
  input: Configure ib_dam_media so that the IntelligenceBank 'image' source type is mapped to the local
    'image' media type, and apply the mapping to the live configuration.
  criteria: 'ib_dam_media.settings.media_types contains an entry {source_type: image, media_type: image}.'
  bundle: ib_dam_media
  rubric_ref: rubric/ib_dam_media_ib_dam_media_build_mapping@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/ib_dam_media-build-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/ib_dam_media-build-reset.sh
    verify: agent-module-documentation/evaluation/verify/ib_dam_media-build-mapping-verify.sh
