rubrics:
- id: ib_dam_media_ib_dam_media_media_type
  version: '1.0'
  applicable_bundles:
  - ib_dam_media
  checks:
  - kind: must_contain_any
    values:
    - ib_dam_embed
    - field_media_ib_dam_embed
  scoring:
    combine: all_pass
- id: ib_dam_media_ib_dam_media_config_form
  version: '1.0'
  applicable_bundles:
  - ib_dam_media
  checks:
  - kind: must_contain_any
    values:
    - ib_dam_media.settings
    - media_types
    - mapping
    - upload_location
  scoring:
    combine: all_pass
- id: ib_dam_media_ib_dam_media_asset_browser
  version: '1.0'
  applicable_bundles:
  - ib_dam_media
  checks:
  - kind: must_contain_any
    values:
    - /ib-dam-browser
    - Open IntelligenceBank Browser
    - media library
    - id_dam_media.asset_browser_form
  scoring:
    combine: all_pass
- id: ib_dam_media_ib_dam_media_upload_location
  version: '1.0'
  applicable_bundles:
  - ib_dam_media
  checks:
  - kind: must_contain_any
    values:
    - public://ib_dam_assets_probe
  scoring:
    combine: all_pass
- id: ib_dam_media_ib_dam_media_mapping
  version: '1.0'
  applicable_bundles:
  - ib_dam_media
  checks:
  - kind: must_contain_any
    values:
    - video
  scoring:
    combine: all_pass
- id: ib_dam_media_ib_dam_media_build_upload_location
  version: '1.0'
  applicable_bundles:
  - ib_dam_media
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
- id: ib_dam_media_ib_dam_media_build_mapping
  version: '1.0'
  applicable_bundles:
  - ib_dam_media
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
