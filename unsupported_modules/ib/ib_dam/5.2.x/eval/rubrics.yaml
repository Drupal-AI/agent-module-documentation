rubrics:
- id: ib_dam_ib_dam_overview
  version: '1.0'
  applicable_bundles:
  - ib_dam
  checks:
  - kind: must_contain_any
    values:
    - ib_dam_media
    - ib_dam_wysiwyg
    - embed
    - IntelligenceBank
  scoring:
    combine: all_pass
- id: ib_dam_ib_dam_config_perm
  version: '1.0'
  applicable_bundles:
  - ib_dam
  checks:
  - kind: must_contain_any
    values:
    - ib_dam.settings
    - /admin/config/services/ib_dam
    - administer intelligencebank configuration
  scoring:
    combine: all_pass
- id: ib_dam_ib_dam_plugin_type
  version: '1.0'
  applicable_bundles:
  - ib_dam
  checks:
  - kind: must_contain_any
    values:
    - IbDamAssetValidation
    - AssetValidation
    - plugin.manager.ib_dam.asset_validation
    - Plugin/IbDam/AssetValidation
  scoring:
    combine: all_pass
- id: ib_dam_ib_dam_platform_url
  version: '1.0'
  applicable_bundles:
  - ib_dam
  checks:
  - kind: must_contain_any
    values:
    - acme.intelligencebank.com
  scoring:
    combine: all_pass
- id: ib_dam_ib_dam_embedding_enabled
  version: '1.0'
  applicable_bundles:
  - ib_dam
  checks:
  - kind: must_contain_any
    values:
    - allow_embedding
    - 'true'
    - enabled
    - 'yes'
    - allowed
  scoring:
    combine: all_pass
- id: ib_dam_ib_dam_build_embed_url
  version: '1.0'
  applicable_bundles:
  - ib_dam
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
- id: ib_dam_ib_dam_build_sso
  version: '1.0'
  applicable_bundles:
  - ib_dam
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
