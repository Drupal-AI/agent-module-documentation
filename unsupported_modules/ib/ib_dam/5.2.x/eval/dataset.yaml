metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: ib_dam
  version: 5.2.x
  note: ib_dam (project intelligencebank) is the base bridge to the IntelligenceBank DAM platform. Config
    object ib_dam.settings (schema keys debug, staging, allow_embedding, login_url, login_enable_custom_url,
    login_enable_browser_login) edited at /admin/config/services/ib_dam behind permission 'administer
    intelligencebank configuration'. NO config ships by default. It defines the AssetValidation plugin
    type (Plugin/IbDam/AssetValidation, annotation @IbDamAssetValidation, manager plugin.manager.ib_dam.asset_validation,
    built-in ids file/resource/api), services ib_dam.api (IbDamApi, sends IB session id as sid header)
    and ib_dam.downloader, an asset object model, and the ib_dam_embed link field formatter. User-facing
    integration lives in submodules ib_dam_media and (deprecated) ib_dam_wysiwyg. Cases are grounded in
    ib_dam.settings, the permission, and the plugin type.
questions:
- id: ib_dam-overview
  input: What does the IntelligenceBank DAM (ib_dam) Drupal module do, and which submodules provide the
    actual Media Library / editor integration?
  criteria: 'ib_dam bridges Drupal to the IntelligenceBank DAM platform so editors can import assets into
    Drupal or embed public CDN links. The base module is plumbing; the integration surface is in submodules:
    ib_dam_media (Media + Media Library, ib_dam_embed source and asset browser) and the deprecated ib_dam_wysiwyg
    (legacy CKEditor filter).'
  bundle: ib_dam
  rubric_ref: rubric/ib_dam_ib_dam_overview@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: ib_dam-config-perm
  input: For the ib_dam module, what is the configuration object, at what admin path is it configured,
    and which permission is required?
  criteria: The config object is ib_dam.settings, configured at /admin/config/services/ib_dam (route ib_dam.settings_form),
    and it requires the 'administer intelligencebank configuration' permission.
  bundle: ib_dam
  rubric_ref: rubric/ib_dam_ib_dam_config_perm@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: ib_dam-plugin-type
  input: What plugin type does the ib_dam module define for validating assets, what annotation and manager
    service does it use, and where do plugin classes live?
  criteria: 'ib_dam defines the AssetValidation plugin type: classes in src/Plugin/IbDam/AssetValidation/,
    annotation @IbDamAssetValidation, manager service plugin.manager.ib_dam.asset_validation (AssetValidationManager).
    Built-in ids are file, resource, and api.'
  bundle: ib_dam
  rubric_ref: rubric/ib_dam_ib_dam_plugin_type@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: ib_dam-platform-url
  input: On this Drupal site the IntelligenceBank DAM connection has a default Platform URL configured.
    Inspect the live ib_dam configuration and state that URL.
  criteria: ib_dam.settings.login_url is 'acme.intelligencebank.com' on this site (the default Platform
    URL used for login).
  bundle: ib_dam
  rubric_ref: rubric/ib_dam_ib_dam_platform_url@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/ib_dam-platform-url-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/ib_dam-platform-url-cleanup.sh
- id: ib_dam-embedding-enabled
  input: On this Drupal site, does the IntelligenceBank DAM integration allow embedding assets (public
    CDN links) in addition to downloading them? Inspect the live configuration to answer.
  criteria: Yes — ib_dam.settings.allow_embedding is TRUE on this site, so asset embedding is enabled
    in addition to download.
  bundle: ib_dam
  rubric_ref: rubric/ib_dam_ib_dam_embedding_enabled@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/ib_dam-embedding-enabled-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/ib_dam-embedding-enabled-cleanup.sh
- id: ib_dam-build-embed-url
  input: Configure the ib_dam module on this site so that asset embedding is allowed (in addition to download)
    and the default IntelligenceBank Platform URL is set to acme.intelligencebank.com. Apply the change
    to the live configuration.
  criteria: ib_dam.settings has allow_embedding = true and login_url = 'acme.intelligencebank.com' (e.g.
    drush cset ib_dam.settings allow_embedding 1 and login_url acme.intelligencebank.com).
  bundle: ib_dam
  rubric_ref: rubric/ib_dam_ib_dam_build_embed_url@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/ib_dam-build-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/ib_dam-build-reset.sh
    verify: agent-module-documentation/evaluation/verify/ib_dam-build-embed-url-verify.sh
- id: ib_dam-build-sso
  input: I connected my Drupal site to IntelligenceBank. I want my editors to sign in to IntelligenceBank
    through their browser using single sign-on. Please switch on that browser SSO login option in the
    IntelligenceBank settings.
  criteria: ib_dam.settings.login_enable_browser_login = true (the 'Enable browser login (for SSO)' option),
    e.g. drush cset ib_dam.settings login_enable_browser_login 1.
  bundle: ib_dam
  rubric_ref: rubric/ib_dam_ib_dam_build_sso@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-layman
    reset: agent-module-documentation/evaluation/verify/ib_dam-build-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/ib_dam-build-reset.sh
    verify: agent-module-documentation/evaluation/verify/ib_dam-build-sso-verify.sh
