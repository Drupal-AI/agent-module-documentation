    values:
    - event_log_track_log_alternative
    - syslog
    - watchdog
  scoring:
    combine: all_pass
- id: event_log_track_syslog_event_log_track_syslog_config
  version: '1.0'
  applicable_bundles:
  - event_log_track_syslog
  checks:
