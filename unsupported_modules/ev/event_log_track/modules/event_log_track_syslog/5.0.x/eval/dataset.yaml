metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: event_log_track_syslog
  version: 5.0.x
  note: event_log_track_syslog is an output-backend submodule of Events Log Track (no handler, no tracked
    entity). It implements hook_event_log_track_log_alternative() to re-emit each event to syslog/watchdog
    per config event_log_track_syslog.settings (keys format + output_type). Medium cases set a known config
    (output_type=syslog, format marker ELT_SYSLOG_SENT) and read it back; hard cases change output_type
    to syslog and set a custom format, verified against live config. Requires core **Syslog** (and Token).
    It adds fields to the system logging settings form (/admin/config/development/logging).
questions:
- id: event_log_track_syslog-what
  input: What does the event_log_track_syslog submodule do with Events Log Track events, and via which
    hook does it receive them?
  criteria: Implements `hook_event_log_track_log_alternative()` to pass each prepared log to `EventLog`,
    which renders it with the configured token `format` and calls `syslog()` when `output_type` is `syslog`,
    otherwise logs to watchdog.
  bundle: event_log_track_syslog
  rubric_ref: rubric/event_log_track_syslog_event_log_track_syslog_what@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: event_log_track_syslog-config
  input: Where and how do you configure the event_log_track_syslog submodule's log line format and where
    its output goes?
  criteria: 'In event_log_track_syslog.settings: ''format'' is a token string (event-log token type) and
    ''output_type'' is ''watchdog'' or ''syslog''. The fields are added to the system logging settings
    form.'
  bundle: event_log_track_syslog
  rubric_ref: rubric/event_log_track_syslog_event_log_track_syslog_config@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: event_log_track_syslog-output-types
  input: What are the two output_type options for event_log_track_syslog and what does each do?
  criteria: '''watchdog'' (default) logs each event through Drupal''s logger using the configured format;
    ''syslog'' writes the rendered format directly to syslog.'
  bundle: event_log_track_syslog
  rubric_ref: rubric/event_log_track_syslog_event_log_track_syslog_output_types@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: event_log_track_syslog-known-output
  input: On this site, inspect the event_log_track_syslog.settings configuration and report the currently
    configured output_type for the event_log_track_syslog submodule.
  criteria: output_type is 'syslog' (drush config:get event_log_track_syslog.settings output_type).
  bundle: event_log_track_syslog
  rubric_ref: rubric/event_log_track_syslog_event_log_track_syslog_known_output@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/event_log_track_syslog-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/event_log_track_syslog-restore.sh
- id: event_log_track_syslog-known-format
  input: Inspect the event_log_track_syslog.settings configuration on this site and report whether its
    'format' contains the marker 'ELT_SYSLOG_SENT'.
  criteria: Yes — the format string ends with the marker 'ELT_SYSLOG_SENT' (drush config:get event_log_track_syslog.settings
    format).
  bundle: event_log_track_syslog
  rubric_ref: rubric/event_log_track_syslog_event_log_track_syslog_known_format@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/event_log_track_syslog-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/event_log_track_syslog-restore.sh
- id: event_log_track_syslog-set-raw
  input: Configure the event_log_track_syslog submodule so Events Log Track events are written as raw
    syslog rather than to watchdog. Apply the change to the live site.
  criteria: In event_log_track_syslog.settings, output_type = 'syslog' (drush config:set event_log_track_syslog.settings
    output_type syslog).
  bundle: event_log_track_syslog
  rubric_ref: rubric/event_log_track_syslog_event_log_track_syslog_set_raw@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/event_log_track_syslog-restore.sh
    cleanup: agent-module-documentation/evaluation/verify/event_log_track_syslog-restore.sh
    verify: agent-module-documentation/evaluation/verify/event_log_track_syslog-verifya.sh
- id: event_log_track_syslog-set-format
  input: 'Set the event_log_track_syslog submodule''s log format to exactly: ELT_CUSTOM [event-log:type]
    [event-log:description]. Apply it to the live site.'
  criteria: In event_log_track_syslog.settings, format contains 'ELT_CUSTOM' (drush config:set event_log_track_syslog.settings
    format 'ELT_CUSTOM [event-log:type] [event-log:description]').
  bundle: event_log_track_syslog
  rubric_ref: rubric/event_log_track_syslog_event_log_track_syslog_set_format@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/event_log_track_syslog-restore.sh
    cleanup: agent-module-documentation/evaluation/verify/event_log_track_syslog-restore.sh
    verify: agent-module-documentation/evaluation/verify/event_log_track_syslog-verifyb.sh
