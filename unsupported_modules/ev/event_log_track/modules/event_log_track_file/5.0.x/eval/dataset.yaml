metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: event_log_track_file
  version: 5.0.x
  note: 'event_log_track_file is a submodule of Events Log Track that logs file events under handler type
    ''file'' (operations insert, update, delete) via entity hooks calling event_log_track.manager->insert().
    Medium cases insert a known sentinel row (ref_char ELT_FILE_MED) into the event_log_track table and
    read it back; hard cases require writing a ''file'' row (ref_char ELT_FILE_HA/ELT_FILE_HB) to the
    live table, grounded in this submodule''s real type/operation vocabulary and the base logging API. '
questions:
- id: event_log_track_file-what
  input: On a Drupal site, what does the event_log_track_file submodule of Events Log Track log, and what
    handler type and operations does it register?
  criteria: It logs file events, registering the handler type 'file' with operations [insert, update,
    delete] via hook_event_log_track_handlers(); rows are written to the event_log_track table.
  bundle: event_log_track_file
  rubric_ref: rubric/event_log_track_file_event_log_track_file_what@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: event_log_track_file-how
  input: How does event_log_track_file hook into Drupal to capture file events, and what does it depend
    on?
  criteria: '`file_insert` / `_update` / `_delete` hooks call the manager. It depends on the base event_log_track
    module, calling event_log_track.manager->insert() with type ''file''.'
  bundle: event_log_track_file
  rubric_ref: rubric/event_log_track_file_event_log_track_file_how@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: event_log_track_file-refs
  input: For a 'file' event logged by event_log_track_file, what is stored in the ref_numeric and ref_char
    columns of the event_log_track table?
  criteria: '`ref_numeric` = file id, `ref_char` = filename; description = the file URI.'
  bundle: event_log_track_file
  rubric_ref: rubric/event_log_track_file_event_log_track_file_refs@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: event_log_track_file-known-op
  input: This site's Events Log Track log contains one 'file' row with the distinctive ref_char 'ELT_FILE_MED'.
    Inspect the event_log_track table and report the operation recorded on that row.
  criteria: The row with ref_char='ELT_FILE_MED' has operation='insert' (SELECT operation FROM event_log_track
    WHERE ref_char='ELT_FILE_MED').
  bundle: event_log_track_file
  rubric_ref: rubric/event_log_track_file_event_log_track_file_known_op@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/event_log_track_file-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/event_log_track_file-clear.sh
- id: event_log_track_file-known-desc
  input: In this site's event_log_track log there is a 'file' row whose ref_char is 'ELT_FILE_MED'. Report
    the exact description text stored on that row.
  criteria: The description of the ref_char='ELT_FILE_MED' row is 'ELT_FILE_DESC'.
  bundle: event_log_track_file
  rubric_ref: rubric/event_log_track_file_event_log_track_file_known_desc@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/event_log_track_file-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/event_log_track_file-clear.sh
- id: event_log_track_file-log-a
  input: Record a 'file' event (operation 'insert') in the Events Log Track log on this site, using ref_char
    'ELT_FILE_HA'. Use the module's logging service (event_log_track.manager->insert(); if you run it
    from the CLI, first enable the log_cli setting) or otherwise persist the row. Apply it to the live
    site.
  criteria: A row exists in event_log_track with type='file' and ref_char='ELT_FILE_HA' (e.g. via event_log_track.manager->insert(['type'=>'file','operation'=>'insert','description'=>'...','ref_char'=>'ELT_FILE_HA'])).
  bundle: event_log_track_file
  rubric_ref: rubric/event_log_track_file_event_log_track_file_log_a@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/event_log_track_file-clear.sh
    cleanup: agent-module-documentation/evaluation/verify/event_log_track_file-clear.sh
    verify: agent-module-documentation/evaluation/verify/event_log_track_file-verifya.sh
- id: event_log_track_file-log-b
  input: Record a 'file' event for the 'delete' operation in Events Log Track using ref_char 'ELT_FILE_HB'.
    Apply it to the live site.
  criteria: A row exists in event_log_track with type='file', operation='delete' and ref_char='ELT_FILE_HB'.
  bundle: event_log_track_file
  rubric_ref: rubric/event_log_track_file_event_log_track_file_log_b@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/event_log_track_file-clear.sh
    cleanup: agent-module-documentation/evaluation/verify/event_log_track_file-clear.sh
    verify: agent-module-documentation/evaluation/verify/event_log_track_file-verifyb.sh
