metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: event_log_track_clear_cache
  version: 5.0.x
  note: 'event_log_track_clear_cache is a submodule of Events Log Track that logs clear cache events under
    handler type ''cache_clear'' (operations cache_clear) via entity hooks calling event_log_track.manager->insert().
    Medium cases insert a known sentinel row (ref_char ELT_CACHE_MED) into the event_log_track table and
    read it back; hard cases require writing a ''cache_clear'' row (ref_char ELT_CACHE_HA/ELT_CACHE_HB)
    to the live table, grounded in this submodule''s real type/operation vocabulary and the base logging
    API. '
questions:
- id: event_log_track_clear_cache-what
  input: On a Drupal site, what does the event_log_track_clear_cache submodule of Events Log Track log,
    and what handler type and operations does it register?
  criteria: It logs clear cache events, registering the handler type 'cache_clear' with operations [cache_clear]
    via hook_event_log_track_handlers(); rows are written to the event_log_track table.
  bundle: event_log_track_clear_cache
  rubric_ref: rubric/event_log_track_clear_cache_event_log_track_clear_cache_what@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: event_log_track_clear_cache-how
  input: How does event_log_track_clear_cache hook into Drupal to capture clear cache events, and what
    does it depend on?
  criteria: '`hook_cache_flush()` logs a single `cache_clear` event with the current user as the reference.
    It depends on the base event_log_track module, calling event_log_track.manager->insert() with type
    ''cache_clear''.'
  bundle: event_log_track_clear_cache
  rubric_ref: rubric/event_log_track_clear_cache_event_log_track_clear_cache_how@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: event_log_track_clear_cache-refs
  input: For a 'cache_clear' event logged by event_log_track_clear_cache, what is stored in the ref_numeric
    and ref_char columns of the event_log_track table?
  criteria: '`ref_numeric` = current uid, `ref_char` = current username; description is ''Cache cleared''.'
  bundle: event_log_track_clear_cache
  rubric_ref: rubric/event_log_track_clear_cache_event_log_track_clear_cache_refs@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: event_log_track_clear_cache-known-op
  input: This site's Events Log Track log contains one 'cache_clear' row with the distinctive ref_char
    'ELT_CACHE_MED'. Inspect the event_log_track table and report the operation recorded on that row.
  criteria: The row with ref_char='ELT_CACHE_MED' has operation='cache_clear' (SELECT operation FROM event_log_track
    WHERE ref_char='ELT_CACHE_MED').
  bundle: event_log_track_clear_cache
  rubric_ref: rubric/event_log_track_clear_cache_event_log_track_clear_cache_known_op@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/event_log_track_clear_cache-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/event_log_track_clear_cache-clear.sh
- id: event_log_track_clear_cache-known-desc
  input: In this site's event_log_track log there is a 'cache_clear' row whose ref_char is 'ELT_CACHE_MED'.
    Report the exact description text stored on that row.
  criteria: The description of the ref_char='ELT_CACHE_MED' row is 'ELT_CACHE_DESC'.
  bundle: event_log_track_clear_cache
  rubric_ref: rubric/event_log_track_clear_cache_event_log_track_clear_cache_known_desc@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/event_log_track_clear_cache-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/event_log_track_clear_cache-clear.sh
- id: event_log_track_clear_cache-log-a
  input: Record a 'cache_clear' event (operation 'cache_clear') in the Events Log Track log on this site,
    using ref_char 'ELT_CACHE_HA'. Use the module's logging service (event_log_track.manager->insert();
    if you run it from the CLI, first enable the log_cli setting) or otherwise persist the row. Apply
    it to the live site.
  criteria: A row exists in event_log_track with type='cache_clear' and ref_char='ELT_CACHE_HA' (e.g.
    via event_log_track.manager->insert(['type'=>'cache_clear','operation'=>'cache_clear','description'=>'...','ref_char'=>'ELT_CACHE_HA'])).
  bundle: event_log_track_clear_cache
  rubric_ref: rubric/event_log_track_clear_cache_event_log_track_clear_cache_log_a@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/event_log_track_clear_cache-clear.sh
    cleanup: agent-module-documentation/evaluation/verify/event_log_track_clear_cache-clear.sh
    verify: agent-module-documentation/evaluation/verify/event_log_track_clear_cache-verifya.sh
- id: event_log_track_clear_cache-log-b
  input: Record a 'cache_clear' event for the 'cache_clear' operation in Events Log Track using ref_char
    'ELT_CACHE_HB'. Apply it to the live site.
  criteria: A row exists in event_log_track with type='cache_clear', operation='cache_clear' and ref_char='ELT_CACHE_HB'.
  bundle: event_log_track_clear_cache
  rubric_ref: rubric/event_log_track_clear_cache_event_log_track_clear_cache_log_b@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/event_log_track_clear_cache-clear.sh
    cleanup: agent-module-documentation/evaluation/verify/event_log_track_clear_cache-clear.sh
    verify: agent-module-documentation/evaluation/verify/event_log_track_clear_cache-verifyb.sh
