metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: event_log_track_group_membership
  version: 5.0.x
  note: event_log_track_group_membership is a submodule of Events Log Track that logs group membership
    events under handler type 'group_membership' (operations insert, update, delete) via entity hooks
    calling event_log_track.manager->insert(). Medium cases insert a known sentinel row (ref_char ELT_GMEMBER_MED)
    into the event_log_track table and read it back; hard cases require writing a 'group_membership' row
    (ref_char ELT_GMEMBER_HA/ELT_GMEMBER_HB) to the live table, grounded in this submodule's real type/operation
    vocabulary and the base logging API. Requires the contrib **Group** module (supports Group 2.x `group_content`
    and 3.x `group_relationship` hooks).
questions:
- id: event_log_track_group_membership-what
  input: On a Drupal site, what does the event_log_track_group_membership submodule of Events Log Track
    log, and what handler type and operations does it register?
  criteria: It logs group membership events, registering the handler type 'group_membership' with operations
    [insert, update, delete] via hook_event_log_track_handlers(); rows are written to the event_log_track
    table.
  bundle: event_log_track_group_membership
  rubric_ref: rubric/event_log_track_group_membership_event_log_track_group_membership_what@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: event_log_track_group_membership-how
  input: How does event_log_track_group_membership hook into Drupal to capture group membership events,
    and what does it depend on?
  criteria: '`group_content_*` (Group 2.x) and `group_relationship_*` (Group 3.x) hooks log membership
    add/role-change/remove, recording user, group and roles. It depends on the base event_log_track module
    and group, calling event_log_track.manager->insert() with type ''group_membership''.'
  bundle: event_log_track_group_membership
  rubric_ref: rubric/event_log_track_group_membership_event_log_track_group_membership_how@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: event_log_track_group_membership-refs
  input: For a 'group_membership' event logged by event_log_track_group_membership, what is stored in
    the ref_numeric and ref_char columns of the event_log_track table?
  criteria: '`ref_numeric` = membership id, `ref_char` = user/label; description names the user, group
    and roles.'
  bundle: event_log_track_group_membership
  rubric_ref: rubric/event_log_track_group_membership_event_log_track_group_membership_refs@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: event_log_track_group_membership-known-op
  input: This site's Events Log Track log contains one 'group_membership' row with the distinctive ref_char
    'ELT_GMEMBER_MED'. Inspect the event_log_track table and report the operation recorded on that row.
  criteria: The row with ref_char='ELT_GMEMBER_MED' has operation='insert' (SELECT operation FROM event_log_track
    WHERE ref_char='ELT_GMEMBER_MED').
  bundle: event_log_track_group_membership
  rubric_ref: rubric/event_log_track_group_membership_event_log_track_group_membership_known_op@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/event_log_track_group_membership-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/event_log_track_group_membership-clear.sh
- id: event_log_track_group_membership-known-desc
  input: In this site's event_log_track log there is a 'group_membership' row whose ref_char is 'ELT_GMEMBER_MED'.
    Report the exact description text stored on that row.
  criteria: The description of the ref_char='ELT_GMEMBER_MED' row is 'ELT_GMEMBER_DESC'.
  bundle: event_log_track_group_membership
  rubric_ref: rubric/event_log_track_group_membership_event_log_track_group_membership_known_desc@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/event_log_track_group_membership-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/event_log_track_group_membership-clear.sh
- id: event_log_track_group_membership-log-a
  input: Record a 'group_membership' event (operation 'insert') in the Events Log Track log on this site,
    using ref_char 'ELT_GMEMBER_HA'. Use the module's logging service (event_log_track.manager->insert();
    if you run it from the CLI, first enable the log_cli setting) or otherwise persist the row. Apply
    it to the live site.
  criteria: A row exists in event_log_track with type='group_membership' and ref_char='ELT_GMEMBER_HA'
    (e.g. via event_log_track.manager->insert(['type'=>'group_membership','operation'=>'insert','description'=>'...','ref_char'=>'ELT_GMEMBER_HA'])).
  bundle: event_log_track_group_membership
  rubric_ref: rubric/event_log_track_group_membership_event_log_track_group_membership_log_a@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/event_log_track_group_membership-clear.sh
    cleanup: agent-module-documentation/evaluation/verify/event_log_track_group_membership-clear.sh
    verify: agent-module-documentation/evaluation/verify/event_log_track_group_membership-verifya.sh
- id: event_log_track_group_membership-log-b
  input: Record a 'group_membership' event for the 'delete' operation in Events Log Track using ref_char
    'ELT_GMEMBER_HB'. Apply it to the live site.
  criteria: A row exists in event_log_track with type='group_membership', operation='delete' and ref_char='ELT_GMEMBER_HB'.
  bundle: event_log_track_group_membership
  rubric_ref: rubric/event_log_track_group_membership_event_log_track_group_membership_log_b@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/event_log_track_group_membership-clear.sh
    cleanup: agent-module-documentation/evaluation/verify/event_log_track_group_membership-clear.sh
    verify: agent-module-documentation/evaluation/verify/event_log_track_group_membership-verifyb.sh
