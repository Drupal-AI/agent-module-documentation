metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: event_log_track_menu
  version: 5.0.x
  note: 'event_log_track_menu is a submodule of Events Log Track that logs menu events under handler type
    ''menu'' (operations insert, update, delete, link insert, link update, link delete) via entity hooks
    calling event_log_track.manager->insert(). Medium cases insert a known sentinel row (ref_char ELT_MENU_MED)
    into the event_log_track table and read it back; hard cases require writing a ''menu'' row (ref_char
    ELT_MENU_HA/ELT_MENU_HB) to the live table, grounded in this submodule''s real type/operation vocabulary
    and the base logging API. '
questions:
- id: event_log_track_menu-what
  input: On a Drupal site, what does the event_log_track_menu submodule of Events Log Track log, and what
    handler type and operations does it register?
  criteria: It logs menu events, registering the handler type 'menu' with operations [insert, update,
    delete, link insert] via hook_event_log_track_handlers(); rows are written to the event_log_track
    table.
  bundle: event_log_track_menu
  rubric_ref: rubric/event_log_track_menu_event_log_track_menu_what@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: event_log_track_menu-how
  input: How does event_log_track_menu hook into Drupal to capture menu events, and what does it depend
    on?
  criteria: '`menu_*` (menu entity) and `menu_link_content_*` hooks log menu and menu-item CUD; a form-submit
    callback on the menu-link add/edit/delete forms logs `link insert`/`link update`/`link delete`. It
    depends on the base event_log_track module and menu_link_content, calling event_log_track.manager->insert()
    with type ''menu''.'
  bundle: event_log_track_menu
  rubric_ref: rubric/event_log_track_menu_event_log_track_menu_how@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: event_log_track_menu-refs
  input: For a 'menu' event logged by event_log_track_menu, what is stored in the ref_numeric and ref_char
    columns of the event_log_track table?
  criteria: 'For menus: `ref_char` = menu id. For links: `ref_numeric` = link id, `ref_char` = label/menu.'
  bundle: event_log_track_menu
  rubric_ref: rubric/event_log_track_menu_event_log_track_menu_refs@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: event_log_track_menu-known-op
  input: This site's Events Log Track log contains one 'menu' row with the distinctive ref_char 'ELT_MENU_MED'.
    Inspect the event_log_track table and report the operation recorded on that row.
  criteria: The row with ref_char='ELT_MENU_MED' has operation='insert' (SELECT operation FROM event_log_track
    WHERE ref_char='ELT_MENU_MED').
  bundle: event_log_track_menu
  rubric_ref: rubric/event_log_track_menu_event_log_track_menu_known_op@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/event_log_track_menu-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/event_log_track_menu-clear.sh
- id: event_log_track_menu-known-desc
  input: In this site's event_log_track log there is a 'menu' row whose ref_char is 'ELT_MENU_MED'. Report
    the exact description text stored on that row.
  criteria: The description of the ref_char='ELT_MENU_MED' row is 'ELT_MENU_DESC'.
  bundle: event_log_track_menu
  rubric_ref: rubric/event_log_track_menu_event_log_track_menu_known_desc@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/event_log_track_menu-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/event_log_track_menu-clear.sh
- id: event_log_track_menu-log-a
  input: Record a 'menu' event (operation 'insert') in the Events Log Track log on this site, using ref_char
    'ELT_MENU_HA'. Use the module's logging service (event_log_track.manager->insert(); if you run it
    from the CLI, first enable the log_cli setting) or otherwise persist the row. Apply it to the live
    site.
  criteria: A row exists in event_log_track with type='menu' and ref_char='ELT_MENU_HA' (e.g. via event_log_track.manager->insert(['type'=>'menu','operation'=>'insert','description'=>'...','ref_char'=>'ELT_MENU_HA'])).
  bundle: event_log_track_menu
  rubric_ref: rubric/event_log_track_menu_event_log_track_menu_log_a@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/event_log_track_menu-clear.sh
    cleanup: agent-module-documentation/evaluation/verify/event_log_track_menu-clear.sh
    verify: agent-module-documentation/evaluation/verify/event_log_track_menu-verifya.sh
- id: event_log_track_menu-log-b
  input: Record a 'menu' event for the 'delete' operation in Events Log Track using ref_char 'ELT_MENU_HB'.
    Apply it to the live site.
  criteria: A row exists in event_log_track with type='menu', operation='delete' and ref_char='ELT_MENU_HB'.
  bundle: event_log_track_menu
  rubric_ref: rubric/event_log_track_menu_event_log_track_menu_log_b@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/event_log_track_menu-clear.sh
    cleanup: agent-module-documentation/evaluation/verify/event_log_track_menu-clear.sh
    verify: agent-module-documentation/evaluation/verify/event_log_track_menu-verifyb.sh
