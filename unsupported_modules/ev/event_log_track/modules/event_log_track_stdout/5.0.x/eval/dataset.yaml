metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: event_log_track_stdout
  version: 5.0.x
  note: event_log_track_stdout is an output-backend submodule of Events Log Track (no handler, no tracked
    entity). It implements hook_event_log_track_log_alternative() to re-emit each event to stdout/watchdog
    per config event_log_track_stdout.settings (keys format + output_type). Medium cases set a known config
    (output_type=stdout, format marker ELT_STDOUT_SENT) and read it back; hard cases change output_type
    to stdout and set a custom format, verified against live config. Requires the contrib **Log Stdout**
    module (and Token). It adds fields to the Log Stdout config form.
questions:
- id: event_log_track_stdout-what
  input: What does the event_log_track_stdout submodule do with Events Log Track events, and via which
    hook does it receive them?
  criteria: Implements `hook_event_log_track_log_alternative()` to pass each prepared log to `EventLogStdout`,
    which renders it with the configured token `format` and writes to `php://stdout` (or `php://stderr`
    for warnings) when `output_type` is `stdout`, otherwise to watchdog.
  bundle: event_log_track_stdout
  rubric_ref: rubric/event_log_track_stdout_event_log_track_stdout_what@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: event_log_track_stdout-config
  input: Where and how do you configure the event_log_track_stdout submodule's log line format and where
    its output goes?
  criteria: 'In event_log_track_stdout.settings: ''format'' is a token string (event-log token type) and
    ''output_type'' is ''watchdog'' or ''stdout''. The fields are added to the log_stdout config form.'
  bundle: event_log_track_stdout
  rubric_ref: rubric/event_log_track_stdout_event_log_track_stdout_config@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: event_log_track_stdout-output-types
  input: What are the two output_type options for event_log_track_stdout and what does each do?
  criteria: '''watchdog'' (default) logs each event through Drupal''s logger using the configured format;
    ''stdout'' writes the rendered format directly to stdout.'
  bundle: event_log_track_stdout
  rubric_ref: rubric/event_log_track_stdout_event_log_track_stdout_output_types@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: event_log_track_stdout-known-output
  input: On this site, inspect the event_log_track_stdout.settings configuration and report the currently
    configured output_type for the event_log_track_stdout submodule.
  criteria: output_type is 'stdout' (drush config:get event_log_track_stdout.settings output_type).
  bundle: event_log_track_stdout
  rubric_ref: rubric/event_log_track_stdout_event_log_track_stdout_known_output@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/event_log_track_stdout-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/event_log_track_stdout-restore.sh
- id: event_log_track_stdout-known-format
  input: Inspect the event_log_track_stdout.settings configuration on this site and report whether its
    'format' contains the marker 'ELT_STDOUT_SENT'.
  criteria: Yes — the format string ends with the marker 'ELT_STDOUT_SENT' (drush config:get event_log_track_stdout.settings
    format).
  bundle: event_log_track_stdout
  rubric_ref: rubric/event_log_track_stdout_event_log_track_stdout_known_format@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/event_log_track_stdout-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/event_log_track_stdout-restore.sh
- id: event_log_track_stdout-set-raw
  input: Configure the event_log_track_stdout submodule so Events Log Track events are written as raw
    stdout rather than to watchdog. Apply the change to the live site.
  criteria: In event_log_track_stdout.settings, output_type = 'stdout' (drush config:set event_log_track_stdout.settings
    output_type stdout).
  bundle: event_log_track_stdout
  rubric_ref: rubric/event_log_track_stdout_event_log_track_stdout_set_raw@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/event_log_track_stdout-restore.sh
    cleanup: agent-module-documentation/evaluation/verify/event_log_track_stdout-restore.sh
    verify: agent-module-documentation/evaluation/verify/event_log_track_stdout-verifya.sh
- id: event_log_track_stdout-set-format
  input: 'Set the event_log_track_stdout submodule''s log format to exactly: ELT_CUSTOM [event-log:type]
    [event-log:description]. Apply it to the live site.'
  criteria: In event_log_track_stdout.settings, format contains 'ELT_CUSTOM' (drush config:set event_log_track_stdout.settings
    format 'ELT_CUSTOM [event-log:type] [event-log:description]').
  bundle: event_log_track_stdout
  rubric_ref: rubric/event_log_track_stdout_event_log_track_stdout_set_format@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/event_log_track_stdout-restore.sh
    cleanup: agent-module-documentation/evaluation/verify/event_log_track_stdout-restore.sh
    verify: agent-module-documentation/evaluation/verify/event_log_track_stdout-verifyb.sh
