metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: event_log_track_node
  version: 5.0.x
  note: 'event_log_track_node is a submodule of Events Log Track that logs node events under handler type
    ''node'' (operations insert, update, delete) via entity hooks calling event_log_track.manager->insert().
    Medium cases insert a known sentinel row (ref_char ELT_NODE_MED) into the event_log_track table and
    read it back; hard cases require writing a ''node'' row (ref_char ELT_NODE_HA/ELT_NODE_HB) to the
    live table, grounded in this submodule''s real type/operation vocabulary and the base logging API. '
questions:
- id: event_log_track_node-what
  input: On a Drupal site, what does the event_log_track_node submodule of Events Log Track log, and what
    handler type and operations does it register?
  criteria: It logs node events, registering the handler type 'node' with operations [insert, update,
    delete] via hook_event_log_track_handlers(); rows are written to the event_log_track table.
  bundle: event_log_track_node
  rubric_ref: rubric/event_log_track_node_event_log_track_node_what@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: event_log_track_node-how
  input: How does event_log_track_node hook into Drupal to capture node events, and what does it depend
    on?
  criteria: '`node_insert` / `_update` / `_delete` hooks call the manager; a `views_data` hook adds the
    `elt_node_join` relationship to `node_field_data`. It depends on the base event_log_track module and
    node, calling event_log_track.manager->insert() with type ''node''.'
  bundle: event_log_track_node
  rubric_ref: rubric/event_log_track_node_event_log_track_node_how@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: event_log_track_node-refs
  input: For a 'node' event logged by event_log_track_node, what is stored in the ref_numeric and ref_char
    columns of the event_log_track table?
  criteria: '`ref_numeric` = node id, `ref_char` = node title; description includes content type and published
    status.'
  bundle: event_log_track_node
  rubric_ref: rubric/event_log_track_node_event_log_track_node_refs@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: event_log_track_node-known-op
  input: This site's Events Log Track log contains one 'node' row with the distinctive ref_char 'ELT_NODE_MED'.
    Inspect the event_log_track table and report the operation recorded on that row.
  criteria: The row with ref_char='ELT_NODE_MED' has operation='insert' (SELECT operation FROM event_log_track
    WHERE ref_char='ELT_NODE_MED').
  bundle: event_log_track_node
  rubric_ref: rubric/event_log_track_node_event_log_track_node_known_op@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/event_log_track_node-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/event_log_track_node-clear.sh
- id: event_log_track_node-known-desc
  input: In this site's event_log_track log there is a 'node' row whose ref_char is 'ELT_NODE_MED'. Report
    the exact description text stored on that row.
  criteria: The description of the ref_char='ELT_NODE_MED' row is 'ELT_NODE_DESC'.
  bundle: event_log_track_node
  rubric_ref: rubric/event_log_track_node_event_log_track_node_known_desc@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/event_log_track_node-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/event_log_track_node-clear.sh
- id: event_log_track_node-log-a
  input: Record a 'node' event (operation 'insert') in the Events Log Track log on this site, using ref_char
    'ELT_NODE_HA'. Use the module's logging service (event_log_track.manager->insert(); if you run it
    from the CLI, first enable the log_cli setting) or otherwise persist the row. Apply it to the live
    site.
  criteria: A row exists in event_log_track with type='node' and ref_char='ELT_NODE_HA' (e.g. via event_log_track.manager->insert(['type'=>'node','operation'=>'insert','description'=>'...','ref_char'=>'ELT_NODE_HA'])).
  bundle: event_log_track_node
  rubric_ref: rubric/event_log_track_node_event_log_track_node_log_a@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/event_log_track_node-clear.sh
    cleanup: agent-module-documentation/evaluation/verify/event_log_track_node-clear.sh
    verify: agent-module-documentation/evaluation/verify/event_log_track_node-verifya.sh
- id: event_log_track_node-log-b
  input: Record a 'node' event for the 'delete' operation in Events Log Track using ref_char 'ELT_NODE_HB'.
    Apply it to the live site.
  criteria: A row exists in event_log_track with type='node', operation='delete' and ref_char='ELT_NODE_HB'.
  bundle: event_log_track_node
  rubric_ref: rubric/event_log_track_node_event_log_track_node_log_b@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/event_log_track_node-clear.sh
    cleanup: agent-module-documentation/evaluation/verify/event_log_track_node-clear.sh
    verify: agent-module-documentation/evaluation/verify/event_log_track_node-verifyb.sh
