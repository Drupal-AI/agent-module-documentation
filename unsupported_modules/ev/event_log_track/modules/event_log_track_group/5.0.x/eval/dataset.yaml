metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: event_log_track_group
  version: 5.0.x
  note: event_log_track_group is a submodule of Events Log Track that logs group events under handler
    type 'group' (operations insert, update, delete) via entity hooks calling event_log_track.manager->insert().
    Medium cases insert a known sentinel row (ref_char ELT_GROUP_MED) into the event_log_track table and
    read it back; hard cases require writing a 'group' row (ref_char ELT_GROUP_HA/ELT_GROUP_HB) to the
    live table, grounded in this submodule's real type/operation vocabulary and the base logging API.
    Requires the contrib **Group** module; enable it (and this submodule) to log group events.
questions:
- id: event_log_track_group-what
  input: On a Drupal site, what does the event_log_track_group submodule of Events Log Track log, and
    what handler type and operations does it register?
  criteria: It logs group events, registering the handler type 'group' with operations [insert, update,
    delete] via hook_event_log_track_handlers(); rows are written to the event_log_track table.
  bundle: event_log_track_group
  rubric_ref: rubric/event_log_track_group_event_log_track_group_what@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: event_log_track_group-how
  input: How does event_log_track_group hook into Drupal to capture group events, and what does it depend
    on?
  criteria: '`group_insert` / `_update` / `_delete` hooks call the manager; the description includes any
    revision log message. It depends on the base event_log_track module and group, calling event_log_track.manager->insert()
    with type ''group''.'
  bundle: event_log_track_group
  rubric_ref: rubric/event_log_track_group_event_log_track_group_how@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: event_log_track_group-refs
  input: For a 'group' event logged by event_log_track_group, what is stored in the ref_numeric and ref_char
    columns of the event_log_track table?
  criteria: '`ref_numeric` = group id, `ref_char` = group label.'
  bundle: event_log_track_group
  rubric_ref: rubric/event_log_track_group_event_log_track_group_refs@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: event_log_track_group-known-op
  input: This site's Events Log Track log contains one 'group' row with the distinctive ref_char 'ELT_GROUP_MED'.
    Inspect the event_log_track table and report the operation recorded on that row.
  criteria: The row with ref_char='ELT_GROUP_MED' has operation='insert' (SELECT operation FROM event_log_track
    WHERE ref_char='ELT_GROUP_MED').
  bundle: event_log_track_group
  rubric_ref: rubric/event_log_track_group_event_log_track_group_known_op@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/event_log_track_group-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/event_log_track_group-clear.sh
- id: event_log_track_group-known-desc
  input: In this site's event_log_track log there is a 'group' row whose ref_char is 'ELT_GROUP_MED'.
    Report the exact description text stored on that row.
  criteria: The description of the ref_char='ELT_GROUP_MED' row is 'ELT_GROUP_DESC'.
  bundle: event_log_track_group
  rubric_ref: rubric/event_log_track_group_event_log_track_group_known_desc@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/event_log_track_group-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/event_log_track_group-clear.sh
- id: event_log_track_group-log-a
  input: Record a 'group' event (operation 'insert') in the Events Log Track log on this site, using ref_char
    'ELT_GROUP_HA'. Use the module's logging service (event_log_track.manager->insert(); if you run it
    from the CLI, first enable the log_cli setting) or otherwise persist the row. Apply it to the live
    site.
  criteria: A row exists in event_log_track with type='group' and ref_char='ELT_GROUP_HA' (e.g. via event_log_track.manager->insert(['type'=>'group','operation'=>'insert','description'=>'...','ref_char'=>'ELT_GROUP_HA'])).
  bundle: event_log_track_group
  rubric_ref: rubric/event_log_track_group_event_log_track_group_log_a@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/event_log_track_group-clear.sh
    cleanup: agent-module-documentation/evaluation/verify/event_log_track_group-clear.sh
    verify: agent-module-documentation/evaluation/verify/event_log_track_group-verifya.sh
- id: event_log_track_group-log-b
  input: Record a 'group' event for the 'delete' operation in Events Log Track using ref_char 'ELT_GROUP_HB'.
    Apply it to the live site.
  criteria: A row exists in event_log_track with type='group', operation='delete' and ref_char='ELT_GROUP_HB'.
  bundle: event_log_track_group
  rubric_ref: rubric/event_log_track_group_event_log_track_group_log_b@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/event_log_track_group-clear.sh
    cleanup: agent-module-documentation/evaluation/verify/event_log_track_group-clear.sh
    verify: agent-module-documentation/evaluation/verify/event_log_track_group-verifyb.sh
