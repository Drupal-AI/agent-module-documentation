metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: event_log_track_config
  version: 5.0.x
  note: 'event_log_track_config is a submodule of Events Log Track that logs config events under handler
    type ''config'' (operations save, delete) via an event subscriber / entity hooks calling event_log_track.manager->insert().
    Medium cases insert a known sentinel row (ref_char ELT_CONFIG_MED) into the event_log_track table
    and read it back; hard cases require writing a ''config'' row (ref_char ELT_CONFIG_HA/ELT_CONFIG_HB)
    to the live table, grounded in this submodule''s real type/operation vocabulary and the base logging
    API. '
questions:
- id: event_log_track_config-what
  input: On a Drupal site, what does the event_log_track_config submodule of Events Log Track log, and
    what handler type and operations does it register?
  criteria: It logs config events, registering the handler type 'config' with operations [save, delete]
    via hook_event_log_track_handlers(); rows are written to the event_log_track table.
  bundle: event_log_track_config
  rubric_ref: rubric/event_log_track_config_event_log_track_config_what@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: event_log_track_config-how
  input: How does event_log_track_config hook into Drupal to capture config events, and what does it depend
    on?
  criteria: A `ConfigCrudEvent` subscriber on `ConfigEvents::SAVE` / `DELETE` logs `save`/`delete`; on
    save it builds a concise human diff of the changed keys (ignoring dependencies, uuid, _core, langcode,
    third_party_settings). It depends on the base event_log_track module, calling event_log_track.manager->insert()
    with type 'config'.
  bundle: event_log_track_config
  rubric_ref: rubric/event_log_track_config_event_log_track_config_how@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: event_log_track_config-refs
  input: For a 'config' event logged by event_log_track_config, what is stored in the ref_numeric and
    ref_char columns of the event_log_track table?
  criteria: '`ref_char` = the config object name; description is the diff (or ''Config added'' / ''Config
    removed'').'
  bundle: event_log_track_config
  rubric_ref: rubric/event_log_track_config_event_log_track_config_refs@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: event_log_track_config-known-op
  input: This site's Events Log Track log contains one 'config' row with the distinctive ref_char 'ELT_CONFIG_MED'.
    Inspect the event_log_track table and report the operation recorded on that row.
  criteria: The row with ref_char='ELT_CONFIG_MED' has operation='save' (SELECT operation FROM event_log_track
    WHERE ref_char='ELT_CONFIG_MED').
  bundle: event_log_track_config
  rubric_ref: rubric/event_log_track_config_event_log_track_config_known_op@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/event_log_track_config-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/event_log_track_config-clear.sh
- id: event_log_track_config-known-desc
  input: In this site's event_log_track log there is a 'config' row whose ref_char is 'ELT_CONFIG_MED'.
    Report the exact description text stored on that row.
  criteria: The description of the ref_char='ELT_CONFIG_MED' row is 'ELT_CONFIG_DESC'.
  bundle: event_log_track_config
  rubric_ref: rubric/event_log_track_config_event_log_track_config_known_desc@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/event_log_track_config-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/event_log_track_config-clear.sh
- id: event_log_track_config-log-a
  input: Record a 'config' event (operation 'save') in the Events Log Track log on this site, using ref_char
    'ELT_CONFIG_HA'. Use the module's logging service (event_log_track.manager->insert(); if you run it
    from the CLI, first enable the log_cli setting) or otherwise persist the row. Apply it to the live
    site.
  criteria: A row exists in event_log_track with type='config' and ref_char='ELT_CONFIG_HA' (e.g. via
    event_log_track.manager->insert(['type'=>'config','operation'=>'save','description'=>'...','ref_char'=>'ELT_CONFIG_HA'])).
  bundle: event_log_track_config
  rubric_ref: rubric/event_log_track_config_event_log_track_config_log_a@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/event_log_track_config-clear.sh
    cleanup: agent-module-documentation/evaluation/verify/event_log_track_config-clear.sh
    verify: agent-module-documentation/evaluation/verify/event_log_track_config-verifya.sh
- id: event_log_track_config-log-b
  input: Record a 'config' event for the 'delete' operation in Events Log Track using ref_char 'ELT_CONFIG_HB'.
    Apply it to the live site.
  criteria: A row exists in event_log_track with type='config', operation='delete' and ref_char='ELT_CONFIG_HB'.
  bundle: event_log_track_config
  rubric_ref: rubric/event_log_track_config_event_log_track_config_log_b@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/event_log_track_config-clear.sh
    cleanup: agent-module-documentation/evaluation/verify/event_log_track_config-clear.sh
    verify: agent-module-documentation/evaluation/verify/event_log_track_config-verifyb.sh
