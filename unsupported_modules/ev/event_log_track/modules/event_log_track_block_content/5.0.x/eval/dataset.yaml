metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: event_log_track_block_content
  version: 5.0.x
  note: 'event_log_track_block_content is a submodule of Events Log Track that logs block content events
    under handler type ''block_content'' (operations insert, update, delete) via entity hooks calling
    event_log_track.manager->insert(). Medium cases insert a known sentinel row (ref_char ELT_BLOCK_MED)
    into the event_log_track table and read it back; hard cases require writing a ''block_content'' row
    (ref_char ELT_BLOCK_HA/ELT_BLOCK_HB) to the live table, grounded in this submodule''s real type/operation
    vocabulary and the base logging API. '
questions:
- id: event_log_track_block_content-what
  input: On a Drupal site, what does the event_log_track_block_content submodule of Events Log Track log,
    and what handler type and operations does it register?
  criteria: It logs block content events, registering the handler type 'block_content' with operations
    [insert, update, delete] via hook_event_log_track_handlers(); rows are written to the event_log_track
    table.
  bundle: event_log_track_block_content
  rubric_ref: rubric/event_log_track_block_content_event_log_track_block_content_what@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: event_log_track_block_content-how
  input: How does event_log_track_block_content hook into Drupal to capture block content events, and
    what does it depend on?
  criteria: '`block_content_insert` / `_update` / `_delete` entity hooks call `EventLogTrackManager::insert()`.
    It depends on the base event_log_track module and block_content, calling event_log_track.manager->insert()
    with type ''block_content''.'
  bundle: event_log_track_block_content
  rubric_ref: rubric/event_log_track_block_content_event_log_track_block_content_how@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: event_log_track_block_content-refs
  input: For a 'block_content' event logged by event_log_track_block_content, what is stored in the ref_numeric
    and ref_char columns of the event_log_track table?
  criteria: '`ref_numeric` = block id, `ref_char` = block label; description includes bundle and published
    status.'
  bundle: event_log_track_block_content
  rubric_ref: rubric/event_log_track_block_content_event_log_track_block_content_refs@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: event_log_track_block_content-known-op
  input: This site's Events Log Track log contains one 'block_content' row with the distinctive ref_char
    'ELT_BLOCK_MED'. Inspect the event_log_track table and report the operation recorded on that row.
  criteria: The row with ref_char='ELT_BLOCK_MED' has operation='insert' (SELECT operation FROM event_log_track
    WHERE ref_char='ELT_BLOCK_MED').
  bundle: event_log_track_block_content
  rubric_ref: rubric/event_log_track_block_content_event_log_track_block_content_known_op@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/event_log_track_block_content-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/event_log_track_block_content-clear.sh
- id: event_log_track_block_content-known-desc
  input: In this site's event_log_track log there is a 'block_content' row whose ref_char is 'ELT_BLOCK_MED'.
    Report the exact description text stored on that row.
  criteria: The description of the ref_char='ELT_BLOCK_MED' row is 'ELT_BLOCK_DESC'.
  bundle: event_log_track_block_content
  rubric_ref: rubric/event_log_track_block_content_event_log_track_block_content_known_desc@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/event_log_track_block_content-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/event_log_track_block_content-clear.sh
- id: event_log_track_block_content-log-a
  input: Record a 'block_content' event (operation 'insert') in the Events Log Track log on this site,
    using ref_char 'ELT_BLOCK_HA'. Use the module's logging service (event_log_track.manager->insert();
    if you run it from the CLI, first enable the log_cli setting) or otherwise persist the row. Apply
    it to the live site.
  criteria: A row exists in event_log_track with type='block_content' and ref_char='ELT_BLOCK_HA' (e.g.
    via event_log_track.manager->insert(['type'=>'block_content','operation'=>'insert','description'=>'...','ref_char'=>'ELT_BLOCK_HA'])).
  bundle: event_log_track_block_content
  rubric_ref: rubric/event_log_track_block_content_event_log_track_block_content_log_a@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/event_log_track_block_content-clear.sh
    cleanup: agent-module-documentation/evaluation/verify/event_log_track_block_content-clear.sh
    verify: agent-module-documentation/evaluation/verify/event_log_track_block_content-verifya.sh
- id: event_log_track_block_content-log-b
  input: Record a 'block_content' event for the 'delete' operation in Events Log Track using ref_char
    'ELT_BLOCK_HB'. Apply it to the live site.
  criteria: A row exists in event_log_track with type='block_content', operation='delete' and ref_char='ELT_BLOCK_HB'.
  bundle: event_log_track_block_content
  rubric_ref: rubric/event_log_track_block_content_event_log_track_block_content_log_b@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/event_log_track_block_content-clear.sh
    cleanup: agent-module-documentation/evaluation/verify/event_log_track_block_content-clear.sh
    verify: agent-module-documentation/evaluation/verify/event_log_track_block_content-verifyb.sh
