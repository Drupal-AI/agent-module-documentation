metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: event_log_track_media
  version: 5.0.x
  note: 'event_log_track_media is a submodule of Events Log Track that logs media events under handler
    type ''media'' (operations insert, update, delete) via entity hooks calling event_log_track.manager->insert().
    Medium cases insert a known sentinel row (ref_char ELT_MEDIA_MED) into the event_log_track table and
    read it back; hard cases require writing a ''media'' row (ref_char ELT_MEDIA_HA/ELT_MEDIA_HB) to the
    live table, grounded in this submodule''s real type/operation vocabulary and the base logging API. '
questions:
- id: event_log_track_media-what
  input: On a Drupal site, what does the event_log_track_media submodule of Events Log Track log, and
    what handler type and operations does it register?
  criteria: It logs media events, registering the handler type 'media' with operations [insert, update,
    delete] via hook_event_log_track_handlers(); rows are written to the event_log_track table.
  bundle: event_log_track_media
  rubric_ref: rubric/event_log_track_media_event_log_track_media_what@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: event_log_track_media-how
  input: How does event_log_track_media hook into Drupal to capture media events, and what does it depend
    on?
  criteria: '`media_insert` / `_update` / `_delete` hooks call the manager; a `views_data` hook adds the
    `elt_media_join` relationship to `media_field_data`. It depends on the base event_log_track module
    and media, calling event_log_track.manager->insert() with type ''media''.'
  bundle: event_log_track_media
  rubric_ref: rubric/event_log_track_media_event_log_track_media_how@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: event_log_track_media-refs
  input: For a 'media' event logged by event_log_track_media, what is stored in the ref_numeric and ref_char
    columns of the event_log_track table?
  criteria: '`ref_numeric` = media id, `ref_char` = media label; description includes bundle and revision
    log.'
  bundle: event_log_track_media
  rubric_ref: rubric/event_log_track_media_event_log_track_media_refs@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: event_log_track_media-known-op
  input: This site's Events Log Track log contains one 'media' row with the distinctive ref_char 'ELT_MEDIA_MED'.
    Inspect the event_log_track table and report the operation recorded on that row.
  criteria: The row with ref_char='ELT_MEDIA_MED' has operation='insert' (SELECT operation FROM event_log_track
    WHERE ref_char='ELT_MEDIA_MED').
  bundle: event_log_track_media
  rubric_ref: rubric/event_log_track_media_event_log_track_media_known_op@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/event_log_track_media-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/event_log_track_media-clear.sh
- id: event_log_track_media-known-desc
  input: In this site's event_log_track log there is a 'media' row whose ref_char is 'ELT_MEDIA_MED'.
    Report the exact description text stored on that row.
  criteria: The description of the ref_char='ELT_MEDIA_MED' row is 'ELT_MEDIA_DESC'.
  bundle: event_log_track_media
  rubric_ref: rubric/event_log_track_media_event_log_track_media_known_desc@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/event_log_track_media-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/event_log_track_media-clear.sh
- id: event_log_track_media-log-a
  input: Record a 'media' event (operation 'insert') in the Events Log Track log on this site, using ref_char
    'ELT_MEDIA_HA'. Use the module's logging service (event_log_track.manager->insert(); if you run it
    from the CLI, first enable the log_cli setting) or otherwise persist the row. Apply it to the live
    site.
  criteria: A row exists in event_log_track with type='media' and ref_char='ELT_MEDIA_HA' (e.g. via event_log_track.manager->insert(['type'=>'media','operation'=>'insert','description'=>'...','ref_char'=>'ELT_MEDIA_HA'])).
  bundle: event_log_track_media
  rubric_ref: rubric/event_log_track_media_event_log_track_media_log_a@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/event_log_track_media-clear.sh
    cleanup: agent-module-documentation/evaluation/verify/event_log_track_media-clear.sh
    verify: agent-module-documentation/evaluation/verify/event_log_track_media-verifya.sh
- id: event_log_track_media-log-b
  input: Record a 'media' event for the 'delete' operation in Events Log Track using ref_char 'ELT_MEDIA_HB'.
    Apply it to the live site.
  criteria: A row exists in event_log_track with type='media', operation='delete' and ref_char='ELT_MEDIA_HB'.
  bundle: event_log_track_media
  rubric_ref: rubric/event_log_track_media_event_log_track_media_log_b@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/event_log_track_media-clear.sh
    cleanup: agent-module-documentation/evaluation/verify/event_log_track_media-clear.sh
    verify: agent-module-documentation/evaluation/verify/event_log_track_media-verifyb.sh
