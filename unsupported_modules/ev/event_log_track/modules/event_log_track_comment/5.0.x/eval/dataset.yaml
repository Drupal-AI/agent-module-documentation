metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: event_log_track_comment
  version: 5.0.x
  note: 'event_log_track_comment is a submodule of Events Log Track that logs comment events under handler
    type ''comment'' (operations insert, update, delete) via entity hooks calling event_log_track.manager->insert().
    Medium cases insert a known sentinel row (ref_char ELT_COMMENT_MED) into the event_log_track table
    and read it back; hard cases require writing a ''comment'' row (ref_char ELT_COMMENT_HA/ELT_COMMENT_HB)
    to the live table, grounded in this submodule''s real type/operation vocabulary and the base logging
    API. '
questions:
- id: event_log_track_comment-what
  input: On a Drupal site, what does the event_log_track_comment submodule of Events Log Track log, and
    what handler type and operations does it register?
  criteria: It logs comment events, registering the handler type 'comment' with operations [insert, update,
    delete] via hook_event_log_track_handlers(); rows are written to the event_log_track table.
  bundle: event_log_track_comment
  rubric_ref: rubric/event_log_track_comment_event_log_track_comment_what@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: event_log_track_comment-how
  input: How does event_log_track_comment hook into Drupal to capture comment events, and what does it
    depend on?
  criteria: '`comment_insert` / `_update` / `_delete` hooks call the manager. It depends on the base event_log_track
    module and comment, calling event_log_track.manager->insert() with type ''comment''.'
  bundle: event_log_track_comment
  rubric_ref: rubric/event_log_track_comment_event_log_track_comment_how@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: event_log_track_comment-refs
  input: For a 'comment' event logged by event_log_track_comment, what is stored in the ref_numeric and
    ref_char columns of the event_log_track table?
  criteria: '`ref_numeric` = comment id, `ref_char` = comment subject; description includes the comment
    type.'
  bundle: event_log_track_comment
  rubric_ref: rubric/event_log_track_comment_event_log_track_comment_refs@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: event_log_track_comment-known-op
  input: This site's Events Log Track log contains one 'comment' row with the distinctive ref_char 'ELT_COMMENT_MED'.
    Inspect the event_log_track table and report the operation recorded on that row.
  criteria: The row with ref_char='ELT_COMMENT_MED' has operation='insert' (SELECT operation FROM event_log_track
    WHERE ref_char='ELT_COMMENT_MED').
  bundle: event_log_track_comment
  rubric_ref: rubric/event_log_track_comment_event_log_track_comment_known_op@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/event_log_track_comment-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/event_log_track_comment-clear.sh
- id: event_log_track_comment-known-desc
  input: In this site's event_log_track log there is a 'comment' row whose ref_char is 'ELT_COMMENT_MED'.
    Report the exact description text stored on that row.
  criteria: The description of the ref_char='ELT_COMMENT_MED' row is 'ELT_COMMENT_DESC'.
  bundle: event_log_track_comment
  rubric_ref: rubric/event_log_track_comment_event_log_track_comment_known_desc@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/event_log_track_comment-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/event_log_track_comment-clear.sh
- id: event_log_track_comment-log-a
  input: Record a 'comment' event (operation 'insert') in the Events Log Track log on this site, using
    ref_char 'ELT_COMMENT_HA'. Use the module's logging service (event_log_track.manager->insert(); if
    you run it from the CLI, first enable the log_cli setting) or otherwise persist the row. Apply it
    to the live site.
  criteria: A row exists in event_log_track with type='comment' and ref_char='ELT_COMMENT_HA' (e.g. via
    event_log_track.manager->insert(['type'=>'comment','operation'=>'insert','description'=>'...','ref_char'=>'ELT_COMMENT_HA'])).
  bundle: event_log_track_comment
  rubric_ref: rubric/event_log_track_comment_event_log_track_comment_log_a@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/event_log_track_comment-clear.sh
    cleanup: agent-module-documentation/evaluation/verify/event_log_track_comment-clear.sh
    verify: agent-module-documentation/evaluation/verify/event_log_track_comment-verifya.sh
- id: event_log_track_comment-log-b
  input: Record a 'comment' event for the 'delete' operation in Events Log Track using ref_char 'ELT_COMMENT_HB'.
    Apply it to the live site.
  criteria: A row exists in event_log_track with type='comment', operation='delete' and ref_char='ELT_COMMENT_HB'.
  bundle: event_log_track_comment
  rubric_ref: rubric/event_log_track_comment_event_log_track_comment_log_b@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/event_log_track_comment-clear.sh
    cleanup: agent-module-documentation/evaluation/verify/event_log_track_comment-clear.sh
    verify: agent-module-documentation/evaluation/verify/event_log_track_comment-verifyb.sh
