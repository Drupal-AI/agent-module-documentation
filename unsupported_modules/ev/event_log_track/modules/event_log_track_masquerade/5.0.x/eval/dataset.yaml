metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: event_log_track_masquerade
  version: 5.0.x
  note: event_log_track_masquerade is a submodule of Events Log Track that logs masquerade events under
    handler type 'masquerade' (operations masquerade, unmasquerade) via an event subscriber / entity hooks
    calling event_log_track.manager->insert(). Medium cases insert a known sentinel row (ref_char ELT_MASQ_MED)
    into the event_log_track table and read it back; hard cases require writing a 'masquerade' row (ref_char
    ELT_MASQ_HA/ELT_MASQ_HB) to the live table, grounded in this submodule's real type/operation vocabulary
    and the base logging API. Requires the contrib **Masquerade** module.
questions:
- id: event_log_track_masquerade-what
  input: On a Drupal site, what does the event_log_track_masquerade submodule of Events Log Track log,
    and what handler type and operations does it register?
  criteria: It logs masquerade events, registering the handler type 'masquerade' with operations [masquerade,
    unmasquerade] via hook_event_log_track_handlers(); rows are written to the event_log_track table.
  bundle: event_log_track_masquerade
  rubric_ref: rubric/event_log_track_masquerade_event_log_track_masquerade_what@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: event_log_track_masquerade-how
  input: How does event_log_track_masquerade hook into Drupal to capture masquerade events, and what does
    it depend on?
  criteria: A kernel REQUEST subscriber watches the `entity.user.masquerade` and `masquerade.unmasquerade`
    routes and logs the start/stop, naming the admin and target user. It depends on the base event_log_track
    module and masquerade, calling event_log_track.manager->insert() with type 'masquerade'.
  bundle: event_log_track_masquerade
  rubric_ref: rubric/event_log_track_masquerade_event_log_track_masquerade_how@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: event_log_track_masquerade-refs
  input: For a 'masquerade' event logged by event_log_track_masquerade, what is stored in the ref_numeric
    and ref_char columns of the event_log_track table?
  criteria: No entity refs; the description carries the admin and target usernames and uids.
  bundle: event_log_track_masquerade
  rubric_ref: rubric/event_log_track_masquerade_event_log_track_masquerade_refs@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: event_log_track_masquerade-known-op
  input: This site's Events Log Track log contains one 'masquerade' row with the distinctive ref_char
    'ELT_MASQ_MED'. Inspect the event_log_track table and report the operation recorded on that row.
  criteria: The row with ref_char='ELT_MASQ_MED' has operation='masquerade' (SELECT operation FROM event_log_track
    WHERE ref_char='ELT_MASQ_MED').
  bundle: event_log_track_masquerade
  rubric_ref: rubric/event_log_track_masquerade_event_log_track_masquerade_known_op@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/event_log_track_masquerade-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/event_log_track_masquerade-clear.sh
- id: event_log_track_masquerade-known-desc
  input: In this site's event_log_track log there is a 'masquerade' row whose ref_char is 'ELT_MASQ_MED'.
    Report the exact description text stored on that row.
  criteria: The description of the ref_char='ELT_MASQ_MED' row is 'ELT_MASQ_DESC'.
  bundle: event_log_track_masquerade
  rubric_ref: rubric/event_log_track_masquerade_event_log_track_masquerade_known_desc@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/event_log_track_masquerade-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/event_log_track_masquerade-clear.sh
- id: event_log_track_masquerade-log-a
  input: Record a 'masquerade' event (operation 'masquerade') in the Events Log Track log on this site,
    using ref_char 'ELT_MASQ_HA'. Use the module's logging service (event_log_track.manager->insert();
    if you run it from the CLI, first enable the log_cli setting) or otherwise persist the row. Apply
    it to the live site.
  criteria: A row exists in event_log_track with type='masquerade' and ref_char='ELT_MASQ_HA' (e.g. via
    event_log_track.manager->insert(['type'=>'masquerade','operation'=>'masquerade','description'=>'...','ref_char'=>'ELT_MASQ_HA'])).
  bundle: event_log_track_masquerade
  rubric_ref: rubric/event_log_track_masquerade_event_log_track_masquerade_log_a@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/event_log_track_masquerade-clear.sh
    cleanup: agent-module-documentation/evaluation/verify/event_log_track_masquerade-clear.sh
    verify: agent-module-documentation/evaluation/verify/event_log_track_masquerade-verifya.sh
- id: event_log_track_masquerade-log-b
  input: Record a 'masquerade' event for the 'unmasquerade' operation in Events Log Track using ref_char
    'ELT_MASQ_HB'. Apply it to the live site.
  criteria: A row exists in event_log_track with type='masquerade', operation='unmasquerade' and ref_char='ELT_MASQ_HB'.
  bundle: event_log_track_masquerade
  rubric_ref: rubric/event_log_track_masquerade_event_log_track_masquerade_log_b@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/event_log_track_masquerade-clear.sh
    cleanup: agent-module-documentation/evaluation/verify/event_log_track_masquerade-clear.sh
    verify: agent-module-documentation/evaluation/verify/event_log_track_masquerade-verifyb.sh
