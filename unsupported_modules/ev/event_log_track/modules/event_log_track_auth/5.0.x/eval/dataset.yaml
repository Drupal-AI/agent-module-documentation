metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: event_log_track_auth
  version: 5.0.x
  note: 'event_log_track_auth is a submodule of Events Log Track that logs auth events under handler type
    ''authentication'' (operations login, logout, request password, fail) via an event subscriber / entity
    hooks calling event_log_track.manager->insert(). Medium cases insert a known sentinel row (ref_char
    ELT_AUTH_MED) into the event_log_track table and read it back; hard cases require writing a ''authentication''
    row (ref_char ELT_AUTH_HA/ELT_AUTH_HB) to the live table, grounded in this submodule''s real type/operation
    vocabulary and the base logging API. '
questions:
- id: event_log_track_auth-what
  input: On a Drupal site, what does the event_log_track_auth submodule of Events Log Track log, and what
    handler type and operations does it register?
  criteria: It logs auth events, registering the handler type 'authentication' with operations [login,
    logout, request password, fail] via hook_event_log_track_handlers(); rows are written to the event_log_track
    table.
  bundle: event_log_track_auth
  rubric_ref: rubric/event_log_track_auth_event_log_track_auth_what@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: event_log_track_auth-how
  input: How does event_log_track_auth hook into Drupal to capture auth events, and what does it depend
    on?
  criteria: '`user_login` / `user_logout` hooks log `login`/`logout`; a `user_login_form` validate handler
    logs `fail`; the `user_pass` form-submit callback logs `request password`; and a kernel TERMINATE
    subscriber logs `authorization`/`fail` on any 403 response. It depends on the base event_log_track
    module, calling event_log_track.manager->insert() with type ''authentication''.'
  bundle: event_log_track_auth
  rubric_ref: rubric/event_log_track_auth_event_log_track_auth_how@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: event_log_track_auth-refs
  input: For a 'authentication' event logged by event_log_track_auth, what is stored in the ref_numeric
    and ref_char columns of the event_log_track table?
  criteria: '`ref_numeric` = uid, `ref_char` = username. The login/logout descriptions include a live
    session count.'
  bundle: event_log_track_auth
  rubric_ref: rubric/event_log_track_auth_event_log_track_auth_refs@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: event_log_track_auth-known-op
  input: This site's Events Log Track log contains one 'authentication' row with the distinctive ref_char
    'ELT_AUTH_MED'. Inspect the event_log_track table and report the operation recorded on that row.
  criteria: The row with ref_char='ELT_AUTH_MED' has operation='login' (SELECT operation FROM event_log_track
    WHERE ref_char='ELT_AUTH_MED').
  bundle: event_log_track_auth
  rubric_ref: rubric/event_log_track_auth_event_log_track_auth_known_op@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/event_log_track_auth-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/event_log_track_auth-clear.sh
- id: event_log_track_auth-known-desc
  input: In this site's event_log_track log there is a 'authentication' row whose ref_char is 'ELT_AUTH_MED'.
    Report the exact description text stored on that row.
  criteria: The description of the ref_char='ELT_AUTH_MED' row is 'ELT_AUTH_DESC'.
  bundle: event_log_track_auth
  rubric_ref: rubric/event_log_track_auth_event_log_track_auth_known_desc@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/event_log_track_auth-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/event_log_track_auth-clear.sh
- id: event_log_track_auth-log-a
  input: Record a 'authentication' event (operation 'login') in the Events Log Track log on this site,
    using ref_char 'ELT_AUTH_HA'. Use the module's logging service (event_log_track.manager->insert();
    if you run it from the CLI, first enable the log_cli setting) or otherwise persist the row. Apply
    it to the live site.
  criteria: A row exists in event_log_track with type='authentication' and ref_char='ELT_AUTH_HA' (e.g.
    via event_log_track.manager->insert(['type'=>'authentication','operation'=>'login','description'=>'...','ref_char'=>'ELT_AUTH_HA'])).
  bundle: event_log_track_auth
  rubric_ref: rubric/event_log_track_auth_event_log_track_auth_log_a@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/event_log_track_auth-clear.sh
    cleanup: agent-module-documentation/evaluation/verify/event_log_track_auth-clear.sh
    verify: agent-module-documentation/evaluation/verify/event_log_track_auth-verifya.sh
- id: event_log_track_auth-log-b
  input: Record a 'authentication' event for the 'logout' operation in Events Log Track using ref_char
    'ELT_AUTH_HB'. Apply it to the live site.
  criteria: A row exists in event_log_track with type='authentication', operation='logout' and ref_char='ELT_AUTH_HB'.
  bundle: event_log_track_auth
  rubric_ref: rubric/event_log_track_auth_event_log_track_auth_log_b@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/event_log_track_auth-clear.sh
    cleanup: agent-module-documentation/evaluation/verify/event_log_track_auth-clear.sh
    verify: agent-module-documentation/evaluation/verify/event_log_track_auth-verifyb.sh
