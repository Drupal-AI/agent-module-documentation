metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: event_log_track_taxonomy
  version: 5.0.x
  note: 'event_log_track_taxonomy is a submodule of Events Log Track that logs taxonomy events under handler
    type ''taxonomy'' (operations vocabulary insert, vocabulary update, vocabulary delete, term insert,
    term update, term delete) via entity hooks calling event_log_track.manager->insert(). Medium cases
    insert a known sentinel row (ref_char ELT_TAX_MED) into the event_log_track table and read it back;
    hard cases require writing a ''taxonomy'' row (ref_char ELT_TAX_HA/ELT_TAX_HB) to the live table,
    grounded in this submodule''s real type/operation vocabulary and the base logging API. '
questions:
- id: event_log_track_taxonomy-what
  input: On a Drupal site, what does the event_log_track_taxonomy submodule of Events Log Track log, and
    what handler type and operations does it register?
  criteria: It logs taxonomy events, registering the handler type 'taxonomy' with operations [vocabulary
    insert, vocabulary update, vocabulary delete, term insert] via hook_event_log_track_handlers(); rows
    are written to the event_log_track table.
  bundle: event_log_track_taxonomy
  rubric_ref: rubric/event_log_track_taxonomy_event_log_track_taxonomy_what@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: event_log_track_taxonomy-how
  input: How does event_log_track_taxonomy hook into Drupal to capture taxonomy events, and what does
    it depend on?
  criteria: '`taxonomy_vocabulary_*` and `taxonomy_term_*` hooks log vocabulary and term CUD via the manager.
    It depends on the base event_log_track module and taxonomy, calling event_log_track.manager->insert()
    with type ''taxonomy''.'
  bundle: event_log_track_taxonomy
  rubric_ref: rubric/event_log_track_taxonomy_event_log_track_taxonomy_how@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: event_log_track_taxonomy-refs
  input: For a 'taxonomy' event logged by event_log_track_taxonomy, what is stored in the ref_numeric
    and ref_char columns of the event_log_track table?
  criteria: 'Terms: `ref_numeric` = tid, `ref_char` = vocabulary id. Vocabularies: `ref_char` = vid.'
  bundle: event_log_track_taxonomy
  rubric_ref: rubric/event_log_track_taxonomy_event_log_track_taxonomy_refs@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: event_log_track_taxonomy-known-op
  input: This site's Events Log Track log contains one 'taxonomy' row with the distinctive ref_char 'ELT_TAX_MED'.
    Inspect the event_log_track table and report the operation recorded on that row.
  criteria: The row with ref_char='ELT_TAX_MED' has operation='term insert' (SELECT operation FROM event_log_track
    WHERE ref_char='ELT_TAX_MED').
  bundle: event_log_track_taxonomy
  rubric_ref: rubric/event_log_track_taxonomy_event_log_track_taxonomy_known_op@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/event_log_track_taxonomy-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/event_log_track_taxonomy-clear.sh
- id: event_log_track_taxonomy-known-desc
  input: In this site's event_log_track log there is a 'taxonomy' row whose ref_char is 'ELT_TAX_MED'.
    Report the exact description text stored on that row.
  criteria: The description of the ref_char='ELT_TAX_MED' row is 'ELT_TAX_DESC'.
  bundle: event_log_track_taxonomy
  rubric_ref: rubric/event_log_track_taxonomy_event_log_track_taxonomy_known_desc@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/event_log_track_taxonomy-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/event_log_track_taxonomy-clear.sh
- id: event_log_track_taxonomy-log-a
  input: Record a 'taxonomy' event (operation 'term insert') in the Events Log Track log on this site,
    using ref_char 'ELT_TAX_HA'. Use the module's logging service (event_log_track.manager->insert();
    if you run it from the CLI, first enable the log_cli setting) or otherwise persist the row. Apply
    it to the live site.
  criteria: A row exists in event_log_track with type='taxonomy' and ref_char='ELT_TAX_HA' (e.g. via event_log_track.manager->insert(['type'=>'taxonomy','operation'=>'term
    insert','description'=>'...','ref_char'=>'ELT_TAX_HA'])).
  bundle: event_log_track_taxonomy
  rubric_ref: rubric/event_log_track_taxonomy_event_log_track_taxonomy_log_a@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/event_log_track_taxonomy-clear.sh
    cleanup: agent-module-documentation/evaluation/verify/event_log_track_taxonomy-clear.sh
    verify: agent-module-documentation/evaluation/verify/event_log_track_taxonomy-verifya.sh
- id: event_log_track_taxonomy-log-b
  input: Record a 'taxonomy' event for the 'term delete' operation in Events Log Track using ref_char
    'ELT_TAX_HB'. Apply it to the live site.
  criteria: A row exists in event_log_track with type='taxonomy', operation='term delete' and ref_char='ELT_TAX_HB'.
  bundle: event_log_track_taxonomy
  rubric_ref: rubric/event_log_track_taxonomy_event_log_track_taxonomy_log_b@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/event_log_track_taxonomy-clear.sh
    cleanup: agent-module-documentation/evaluation/verify/event_log_track_taxonomy-clear.sh
    verify: agent-module-documentation/evaluation/verify/event_log_track_taxonomy-verifyb.sh
