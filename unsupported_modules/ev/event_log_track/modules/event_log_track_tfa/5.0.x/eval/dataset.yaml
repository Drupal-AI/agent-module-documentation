metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: event_log_track_tfa
  version: 5.0.x
  note: event_log_track_tfa is a submodule of Events Log Track that logs tfa events under handler type
    'authentication_tfa' (operations TFA login) via entity hooks calling event_log_track.manager->insert().
    Medium cases insert a known sentinel row (ref_char ELT_TFA_MED) into the event_log_track table and
    read it back; hard cases require writing a 'authentication_tfa' row (ref_char ELT_TFA_HA/ELT_TFA_HB)
    to the live table, grounded in this submodule's real type/operation vocabulary and the base logging
    API. Requires the contrib **TFA** module and the Events Log Track – User Authentication submodule.
questions:
- id: event_log_track_tfa-what
  input: On a Drupal site, what does the event_log_track_tfa submodule of Events Log Track log, and what
    handler type and operations does it register?
  criteria: It logs tfa events, registering the handler type 'authentication_tfa' with operations [TFA
    login] via hook_event_log_track_handlers(); rows are written to the event_log_track table.
  bundle: event_log_track_tfa
  rubric_ref: rubric/event_log_track_tfa_event_log_track_tfa_what@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: event_log_track_tfa-how
  input: How does event_log_track_tfa hook into Drupal to capture tfa events, and what does it depend
    on?
  criteria: A form-submit callback on the `tfa_entry_form` logs a `TFA login` with the current user's
    session count. It depends on the base event_log_track module and event_log_track_auth, tfa, calling
    event_log_track.manager->insert() with type 'authentication_tfa'.
  bundle: event_log_track_tfa
  rubric_ref: rubric/event_log_track_tfa_event_log_track_tfa_how@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: event_log_track_tfa-refs
  input: For a 'authentication_tfa' event logged by event_log_track_tfa, what is stored in the ref_numeric
    and ref_char columns of the event_log_track table?
  criteria: '`ref_numeric` = uid, `ref_char` = username; description carries the session count.'
  bundle: event_log_track_tfa
  rubric_ref: rubric/event_log_track_tfa_event_log_track_tfa_refs@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: event_log_track_tfa-known-op
  input: This site's Events Log Track log contains one 'authentication_tfa' row with the distinctive ref_char
    'ELT_TFA_MED'. Inspect the event_log_track table and report the operation recorded on that row.
  criteria: The row with ref_char='ELT_TFA_MED' has operation='TFA login' (SELECT operation FROM event_log_track
    WHERE ref_char='ELT_TFA_MED').
  bundle: event_log_track_tfa
  rubric_ref: rubric/event_log_track_tfa_event_log_track_tfa_known_op@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/event_log_track_tfa-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/event_log_track_tfa-clear.sh
- id: event_log_track_tfa-known-desc
  input: In this site's event_log_track log there is a 'authentication_tfa' row whose ref_char is 'ELT_TFA_MED'.
    Report the exact description text stored on that row.
  criteria: The description of the ref_char='ELT_TFA_MED' row is 'ELT_TFA_DESC'.
  bundle: event_log_track_tfa
  rubric_ref: rubric/event_log_track_tfa_event_log_track_tfa_known_desc@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/event_log_track_tfa-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/event_log_track_tfa-clear.sh
- id: event_log_track_tfa-log-a
  input: Record a 'authentication_tfa' event (operation 'TFA login') in the Events Log Track log on this
    site, using ref_char 'ELT_TFA_HA'. Use the module's logging service (event_log_track.manager->insert();
    if you run it from the CLI, first enable the log_cli setting) or otherwise persist the row. Apply
    it to the live site.
  criteria: A row exists in event_log_track with type='authentication_tfa' and ref_char='ELT_TFA_HA' (e.g.
    via event_log_track.manager->insert(['type'=>'authentication_tfa','operation'=>'TFA login','description'=>'...','ref_char'=>'ELT_TFA_HA'])).
  bundle: event_log_track_tfa
  rubric_ref: rubric/event_log_track_tfa_event_log_track_tfa_log_a@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/event_log_track_tfa-clear.sh
    cleanup: agent-module-documentation/evaluation/verify/event_log_track_tfa-clear.sh
    verify: agent-module-documentation/evaluation/verify/event_log_track_tfa-verifya.sh
- id: event_log_track_tfa-log-b
  input: Record a 'authentication_tfa' event for the 'TFA login' operation in Events Log Track using ref_char
    'ELT_TFA_HB'. Apply it to the live site.
  criteria: A row exists in event_log_track with type='authentication_tfa', operation='TFA login' and
    ref_char='ELT_TFA_HB'.
  bundle: event_log_track_tfa
  rubric_ref: rubric/event_log_track_tfa_event_log_track_tfa_log_b@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/event_log_track_tfa-clear.sh
    cleanup: agent-module-documentation/evaluation/verify/event_log_track_tfa-clear.sh
    verify: agent-module-documentation/evaluation/verify/event_log_track_tfa-verifyb.sh
