rubrics:
- id: event_log_track_event_log_track_where
  version: '1.0'
  applicable_bundles:
  - event_log_track
  checks:
  - kind: must_contain_any
    values:
    - /admin/reports/events-track
    - admin/config/system/events-log-track
    - event_log_track
  scoring:
    combine: all_pass
- id: event_log_track_event_log_track_auto_delete
  version: '1.0'
  applicable_bundles:
  - event_log_track
  checks:
  - kind: must_contain_any
    values:
    - enable_log_deletion
    - timespan_limit
    - cron
  scoring:
    combine: all_pass
- id: event_log_track_event_log_track_custom_log
  version: '1.0'
  applicable_bundles:
  - event_log_track
  checks:
  - kind: must_contain_any
    values:
    - event_log_track.manager
    - insert
    - log_cli
  scoring:
    combine: all_pass
- id: event_log_track_event_log_track_known_type
  version: '1.0'
  applicable_bundles:
  - event_log_track
  checks:
  - kind: must_contain_any
    values:
    - taxonomy
  scoring:
    combine: all_pass
- id: event_log_track_event_log_track_known_desc
  version: '1.0'
  applicable_bundles:
  - event_log_track
  checks:
  - kind: must_contain_any
    values:
    - SENTINEL_DESC_42
  scoring:
    combine: all_pass
- id: event_log_track_event_log_track_configure_deletion
  version: '1.0'
  applicable_bundles:
  - event_log_track
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
- id: event_log_track_event_log_track_skip_pattern
  version: '1.0'
  applicable_bundles:
  - event_log_track
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
