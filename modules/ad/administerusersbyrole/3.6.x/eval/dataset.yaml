metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: administerusersbyrole
  version: 3.6.x
  note: 'Administer Users by Role delegates scoped user administration via static + dynamically generated
    permissions plus a role-classification settings form. Cases are `recipe` (response-graded): they probe
    documented facts (permission machine names, operations, role classification, the access service) an
    agent would otherwise read source to answer; no site mutation.'
questions:
- id: aubr-purpose
  input: On a Drupal 11 site I want a 'sub-admin' user who can edit and cancel only some users, chosen
    by the target user's roles, without giving them full 'Administer users'. Which contrib module does
    this and what is the core idea?
  criteria: 'Administer Users by Role: replaces core''s all-or-nothing ''administer users'' with per-operation,
    per-role permissions; a sub-admin may act on a user only if they have access to all of that user''s
    roles.'
  bundle: administerusersbyrole
  rubric_ref: rubric/administerusersbyrole_aubr_purpose@1.0
  tags:
  - mode:recipe
- id: aubr-base-permissions
  input: What are the four base per-operation permission machine names Administer Users by Role provides
    for acting on users whose roles are all 'allowed'?
  criteria: edit users by role, cancel users by role, view users by role, role-assign users by role (operations
    edit, cancel, view, assign-roles against allowed roles).
  bundle: administerusersbyrole
  rubric_ref: rubric/administerusersbyrole_aubr_base_permissions@1.0
  tags:
  - mode:recipe
- id: aubr-per-role-permission
  input: In Administer Users by Role, when a role is classified 'Custom', what per-role permission machine
    names get generated? Give the pattern and an example for a role id 'editor'.
  criteria: Pattern '{op} users with role {rid}' for op in edit/cancel/view/role-assign, e.g. 'edit users
    with role editor' — only works combined with the matching base permission.
  bundle: administerusersbyrole
  rubric_ref: rubric/administerusersbyrole_aubr_per_role_permission@1.0
  tags:
  - mode:recipe
- id: aubr-role-classification
  input: How do I control which roles a sub-admin can manage in Administer Users by Role? Name the three
    classification options and where they are set.
  criteria: On the settings form (route administerusersbyrole.settings, Admin > People) classify each
    role Allowed (safe), Forbidden (unsafe) or Custom (perm), stored in the administerusersbyrole.settings
    config 'roles' map.
  bundle: administerusersbyrole
  rubric_ref: rubric/administerusersbyrole_aubr_role_classification@1.0
  tags:
  - mode:recipe
- id: aubr-create-and-overview
  input: Which Administer Users by Role permission lets a sub-admin create new accounts, and which one
    grants access to the People list (showing only editable users)?
  criteria: '''create users'' grants creating new accounts; ''access users overview'' grants the People/manage-users
    list, filtered to only users the sub-admin can edit.'
  bundle: administerusersbyrole
  rubric_ref: rubric/administerusersbyrole_aubr_create_and_overview@1.0
  tags:
  - mode:recipe
- id: aubr-assign-roles-action
  input: In Administer Users by Role, how can a sub-admin assign roles, and which permission governs it?
    Can they assign roles without being able to edit the user?
  criteria: 'Via the user edit form role checkboxes or the core Add/Remove role bulk actions, governed
    by ''role-assign users by role'' (+ per-role variants). Yes: allowed if they can edit the user OR
    can assign all roles the user already has, and can assign every changed role.'
  bundle: administerusersbyrole
  rubric_ref: rubric/administerusersbyrole_aubr_assign_roles_action@1.0
  tags:
  - mode:recipe
- id: aubr-access-service
  input: Programmatically on a Drupal site, which Administer Users by Role service and method check whether
    an account may perform an operation on a user with given roles, and which method lists the roles an
    account may act on?
  criteria: 'The administerusersbyrole.access service (AccessManager): access($roles, $operation, $account)
    returns an AccessResult (allowed only if every role passes); listRoles($operation, $account) returns
    the actionable role ids.'
  bundle: administerusersbyrole
  rubric_ref: rubric/administerusersbyrole_aubr_access_service@1.0
  tags:
  - mode:recipe
- id: aubr-bypass-warning
  input: Why should you NOT give a sub-admin the core 'Administer users' or 'Administer permissions' permission
    when using Administer Users by Role?
  criteria: Holding core 'administer users' (or 'administer permissions') bypasses this module's checks
    entirely — the sub-admin would then be able to manage all users regardless of role classification.
  bundle: administerusersbyrole
  rubric_ref: rubric/administerusersbyrole_aubr_bypass_warning@1.0
  tags:
  - mode:recipe
