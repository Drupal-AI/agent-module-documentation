rubrics:
- id: adsense_adsense_publisher_id_key
  version: '1.0'
  applicable_bundles:
  - adsense
  checks:
  - kind: must_contain_any
    values:
    - adsense_basic_id
    - PublisherId
  scoring:
    combine: all_pass
- id: adsense_adsense_dev_placeholder
  version: '1.0'
  applicable_bundles:
  - adsense
  checks:
  - kind: must_contain_any
    values:
    - adsense_placeholder
    - adsense_disable
    - adsense_test_mode
  scoring:
    combine: all_pass
- id: adsense_adsense_placement_methods
  version: '1.0'
  applicable_bundles:
  - adsense
  checks:
  - kind: must_contain_any
    values:
    - block
    - filter
    - '[adsense:'
    - auto ads
    - page-level
  scoring:
    combine: all_pass
- id: adsense_adsense_known_pubid
  version: '1.0'
  applicable_bundles:
  - adsense
  checks:
  - kind: must_contain_any
    values:
    - ca-pub-1234567890123456
  scoring:
    combine: all_pass
- id: adsense_adsense_known_placeholder_text
  version: '1.0'
  applicable_bundles:
  - adsense
  checks:
  - kind: must_contain_any
    values:
    - ADSENSE EVAL SLOT
  scoring:
    combine: all_pass
- id: adsense_adsense_set_pubid
  version: '1.0'
  applicable_bundles:
  - adsense
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
- id: adsense_adsense_place_block
  version: '1.0'
  applicable_bundles:
  - adsense
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
