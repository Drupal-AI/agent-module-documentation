metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: adsense
  version: 1.5.x
  note: 'AdSense integrates the third-party Google AdSense service, so ALL evals are grounded in LOCAL
    Drupal config and blocks only - never a live ad call. Global state is the adsense.settings config
    object: adsense_basic_id (publisher ID, read by PublisherId::get()), adsense_disable, adsense_test_mode,
    adsense_placeholder (default true -> renders a local placeholder box instead of a real ad), adsense_placeholder_text,
    adsense_managed_page_level_ads_enabled (auto ads). Ads are surfaced as blocks (adsense_managed_ad_block,
    adsense_cse_ad_block), the [adsense:...] input filter (filter_adsense), or auto ads. Medium cases
    set a known adsense.settings value and read it back; hard cases set the publisher ID and place a managed
    ad block, both verified against live local config (placeholder/disable settings keep it dev-safe).'
questions:
- id: adsense-publisher-id-key
  input: In the Drupal AdSense module, which configuration key stores the site's Google AdSense publisher
    ID (ca-pub-...), and which class/method reads it?
  criteria: The publisher ID is stored in adsense.settings under adsense_basic_id and read via Drupal\adsense\PublisherId::get().
  bundle: adsense
  rubric_ref: rubric/adsense_adsense_publisher_id_key@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: adsense-dev-placeholder
  input: I'm developing locally with the Drupal AdSense module and do not want it to make real Google
    ad requests. Which settings let AdSense render a placeholder box (or nothing) instead of calling Google?
  criteria: Keep adsense_placeholder on (default true) so ad units render a local placeholder box (adsense_placeholder_text);
    adsense_disable turns all ads off, and adsense_test_mode flags requests as tests. All are in adsense.settings.
  bundle: adsense
  rubric_ref: rubric/adsense_adsense_dev_placeholder@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: adsense-placement-methods
  input: What are the ways the Drupal AdSense module lets you place an ad unit on a page?
  criteria: 'Three ways: place a block (e.g. adsense_managed_ad_block or adsense_cse_ad_block), use the
    AdSense input filter (filter_adsense) with [adsense:format:slot] / [adsense:block:machine_name] tags
    in body text, or enable auto/page-level ads (adsense_managed_page_level_ads_enabled).'
  bundle: adsense
  rubric_ref: rubric/adsense_adsense_placement_methods@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: adsense-known-pubid
  input: On this Drupal site the AdSense publisher ID has been configured. Inspect the live AdSense configuration
    and report the exact publisher ID value.
  criteria: adsense.settings:adsense_basic_id is 'ca-pub-1234567890123456'.
  bundle: adsense
  rubric_ref: rubric/adsense_adsense_known_pubid@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/adsense-known-pubid-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/adsense-known-pubid-cleanup.sh
- id: adsense-known-placeholder-text
  input: This site shows a custom placeholder text where AdSense ads would appear. Inspect the live AdSense
    configuration and give the exact placeholder text.
  criteria: adsense.settings:adsense_placeholder_text is 'ADSENSE EVAL SLOT'.
  bundle: adsense
  rubric_ref: rubric/adsense_adsense_known_placeholder_text@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/adsense-known-placeholder-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/adsense-known-placeholder-cleanup.sh
- id: adsense-set-pubid
  input: On this Drupal site, configure the AdSense module with the publisher ID 'ca-pub-0000000000000000'.
    Apply the change to the live configuration. (Do not make any live Google request.)
  criteria: Set adsense.settings:adsense_basic_id to 'ca-pub-0000000000000000' (e.g. drush cset adsense.settings
    adsense_basic_id 'ca-pub-0000000000000000' -y, or on the AdSense settings form at /admin/config/services/adsense).
  bundle: adsense
  rubric_ref: rubric/adsense_adsense_set_pubid@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/adsense-set-pubid-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/adsense-set-pubid-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/adsense-set-pubid-verify.sh
- id: adsense-place-block
  input: 'On this Drupal site, place a managed AdSense ad block: create a block named ''adsense_eval_ad''
    using the AdSense managed ad block plugin, with its ad slot (Ad ID) set to 1234567890, in the content
    region of the default theme. Apply it to the live site. (Placeholder mode keeps it dev-safe; do not
    make a live ad request.)'
  criteria: Create a block config entity id 'adsense_eval_ad' with plugin 'adsense_managed_ad_block' and
    settings.ad_slot '1234567890' in the default theme's content region, e.g. Drupal\block\Entity\Block::create(['id'=>'adsense_eval_ad','plugin'=>'adsense_managed_ad_block','theme'=>\Drupal::config('system.theme')->get('default'),'region'=>'content','settings'=>['id'=>'adsense_managed_ad_block','label'=>'Ad','label_display'=>0,'ad_slot'=>'1234567890','ad_format'=>'responsive']])->save();
  bundle: adsense
  rubric_ref: rubric/adsense_adsense_place_block@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/adsense-place-block-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/adsense-place-block-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/adsense-place-block-verify.sh
