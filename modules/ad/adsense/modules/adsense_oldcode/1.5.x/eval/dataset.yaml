metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: adsense_oldcode
  version: 1.5.x
  note: 'adsense_oldcode is a submodule of adsense for legacy pre-2007 Google ad code (deprecated). Config
    object adsense_oldcode.settings, two forms (adsense_oldcode.settings at /admin/config/services/adsense/oldcode
    and adsense_oldsearch.settings at /admin/config/services/adsense/search), both requiring the parent
    ''administer adsense'' permission. Defines five reusable ad styles (adsense_group_title_1.._5 with
    type/colour keys) and legacy search settings (adsense_search_*). Blocks: adsense_oldcode_ad_block
    (ad_format, ad_style, ad_channel, ad_align) and adsense_oldsearch_ad_block (ad_channel); plugins oldcode/oldsearch.
    All evals are grounded in local config and block placement (no live Google request); the parent''s
    placeholder mode keeps it dev-safe.'
questions:
- id: adsense_oldcode-what
  input: What does the Drupal adsense_oldcode submodule do, and why is it not recommended for new sites?
  criteria: It renders AdSense ad units and a search box using Google's pre-2007 ('old') ad code, which
    Google deprecated in 2007; it exists for legacy inventory only.
  bundle: adsense_oldcode
  rubric_ref: rubric/adsense_oldcode_adsense_oldcode_what@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: adsense_oldcode-config-route
  input: Where do you configure the adsense_oldcode module's ad styles, and what permission is required?
  criteria: On the Old Code Ads form at /admin/config/services/adsense/oldcode (route adsense_oldcode.settings),
    stored in the adsense_oldcode.settings config object; it requires the parent 'administer adsense'
    permission.
  bundle: adsense_oldcode
  rubric_ref: rubric/adsense_oldcode_adsense_oldcode_config_route@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: adsense_oldcode-blocks
  input: Which block plugins does the adsense_oldcode submodule provide?
  criteria: adsense_oldcode_ad_block (legacy ad unit; settings ad_format, ad_style, ad_channel, ad_align)
    and adsense_oldsearch_ad_block (legacy search box; setting ad_channel).
  bundle: adsense_oldcode
  rubric_ref: rubric/adsense_oldcode_adsense_oldcode_blocks@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: adsense_oldcode-known-style
  input: On this Drupal site, the first adsense_oldcode ad style has a name configured. Inspect the live
    configuration and give the exact title of ad style 1.
  criteria: adsense_oldcode.settings:adsense_group_title_1 is 'OC Known Style'.
  bundle: adsense_oldcode
  rubric_ref: rubric/adsense_oldcode_adsense_oldcode_known_style@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/adsense_oldcode-known-style-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/adsense_oldcode-known-style-cleanup.sh
- id: adsense_oldcode-known-country
  input: On this Drupal site, the adsense_oldcode legacy search box is set to a specific Google country
    domain. Inspect the live configuration and give that domain.
  criteria: adsense_oldcode.settings:adsense_search_country is 'www.google.co.uk'.
  bundle: adsense_oldcode
  rubric_ref: rubric/adsense_oldcode_adsense_oldcode_known_country@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/adsense_oldcode-known-country-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/adsense_oldcode-known-country-cleanup.sh
- id: adsense_oldcode-set-style
  input: On this Drupal site, name the first adsense_oldcode ad style 'Sidebar Skyscraper'. Apply the
    change to the live configuration.
  criteria: Set adsense_oldcode.settings:adsense_group_title_1 to 'Sidebar Skyscraper' (e.g. drush cset
    adsense_oldcode.settings adsense_group_title_1 'Sidebar Skyscraper' -y, or on the Old Code Ads form).
  bundle: adsense_oldcode
  rubric_ref: rubric/adsense_oldcode_adsense_oldcode_set_style@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/adsense_oldcode-set-style-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/adsense_oldcode-set-style-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/adsense_oldcode-set-style-verify.sh
- id: adsense_oldcode-place-block
  input: 'On this Drupal site, place a legacy AdSense old-code ad block: create a block named ''adsense_oc_eval_ad''
    using the adsense_oldcode ad block plugin, with its AdSense channel set to ''oceval'', in the content
    region of the default theme. Apply it to the live site. (Placeholder mode keeps it dev-safe.)'
  criteria: Create a block config entity id 'adsense_oc_eval_ad' with plugin 'adsense_oldcode_ad_block'
    and settings.ad_channel 'oceval' in the default theme's content region, e.g. Drupal\block\Entity\Block::create(['id'=>'adsense_oc_eval_ad','plugin'=>'adsense_oldcode_ad_block','theme'=>\Drupal::config('system.theme')->get('default'),'region'=>'content','settings'=>['id'=>'adsense_oldcode_ad_block','label'=>'Legacy
    ad','label_display'=>0,'ad_channel'=>'oceval','ad_style'=>'1','ad_format'=>'468x60','ad_align'=>'center']])->save();
  bundle: adsense_oldcode
  rubric_ref: rubric/adsense_oldcode_adsense_oldcode_place_block@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/adsense_oldcode-place-block-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/adsense_oldcode-place-block-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/adsense_oldcode-place-block-verify.sh
