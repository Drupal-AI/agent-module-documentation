rubrics:
- id: advancedqueue_advancedqueue_enqueue_a_job
  version: '1.0'
  applicable_bundles:
  - advancedqueue
  checks:
  - kind: must_contain_any
    values:
    - Job::create
    - enqueueJob
    - Drupal\advancedqueue\Job
  scoring:
    combine: all_pass
- id: advancedqueue_advancedqueue_drush_process
  version: '1.0'
  applicable_bundles:
  - advancedqueue
  checks:
  - kind: must_contain_any
    values:
    - advancedqueue:queue:process
    - advancedqueue:queue:list
  scoring:
    combine: all_pass
- id: advancedqueue_advancedqueue_job_type_plugin_shape
  version: '1.0'
  applicable_bundles:
  - advancedqueue
  checks:
  - kind: must_contain_any
    values:
    - AdvancedQueueJobType
    - JobTypeBase
    - max_retries
    - Plugin/AdvancedQueue/JobType
  scoring:
    combine: all_pass
- id: advancedqueue_advancedqueue_known_queue
  version: '1.0'
  applicable_bundles:
  - advancedqueue
  checks:
  - kind: must_contain_any
    values:
    - daemon
  scoring:
    combine: all_pass
- id: advancedqueue_advancedqueue_failed_job
  version: '1.0'
  applicable_bundles:
  - advancedqueue
  checks:
  - kind: must_contain_any
    values:
    - AQ payment gateway timed out
  scoring:
    combine: all_pass
- id: advancedqueue_advancedqueue_create_queue
  version: '1.0'
  applicable_bundles:
  - advancedqueue
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
- id: advancedqueue_advancedqueue_job_type_plugin
  version: '1.0'
  applicable_bundles:
  - advancedqueue
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
