metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: advanced_datalayer
  version: 2.1.x
  note: 'Advanced Datalayer builds GTM''s window.dataLayer from plugin-defined tags with per-page-type
    defaults. Values are assigned in advanced_datalayer_defaults config entities (one per context: global,
    front, node, taxonomy_term, 403, 404, login, register, pass) via a ''tags'' map of tag_id => value
    (tokens allowed). Output happens in hook_page_attachments (var dataLayer_tags = {...}; window.dataLayer.push(dataLayer_tags)).
    Two plugin types: @AdvancedDatalayerTag (manager plugin.manager.advanced_datalayer.tag) and @AdvancedDatalayerGroup.
    Permission: ''administer advanced datalayer defaults settings''. The base module ships NO tags; example_advanced_datalayer
    is enabled on this site and provides tag ids: event, site_Name, site_Category, page_Name, page_Category,
    response_Code, ga_client_id. All shipped default contexts have tags:{} at baseline. Medium cases set
    a known tag value on a context and read it back; hard cases set a tag value on a context, verified
    against the live advanced_datalayer_defaults config entity.'
questions:
- id: advanced_datalayer-js-target
  input: What does the Drupal 'Advanced Datalayer' module actually output on the page, and what JavaScript
    object does it populate (the one Google Tag Manager reads)?
  criteria: 'In hook_page_attachments it injects two head scripts: ''var dataLayer_tags = {...}'' (the
    resolved tag values as JSON) and ''window.dataLayer = window.dataLayer || []; window.dataLayer.push(dataLayer_tags);''
    — populating GTM''s window.dataLayer.'
  bundle: advanced_datalayer
  rubric_ref: rubric/advanced_datalayer_advanced_datalayer_js_target@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: advanced_datalayer-where-config
  input: In Advanced Datalayer, how do I set different dataLayer variable values for different page types
    (front page vs node pages vs 404)? What kind of configuration object holds those values?
  criteria: Values are stored in advanced_datalayer_defaults config entities, one per page context (global,
    front, node, taxonomy_term, 403, 404, login, register, pass), each with a 'tags' map of tag_id =>
    value. Manage them at /admin/config/search/advanced-datalayer/page-variables.
  bundle: advanced_datalayer
  rubric_ref: rubric/advanced_datalayer_advanced_datalayer_where_config@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: advanced_datalayer-permission
  input: Which permission does the Advanced Datalayer module use to control who can edit the dataLayer
    page-variable defaults?
  criteria: '''administer advanced datalayer defaults settings'' (restricted). It gates the settings form
    and all the advanced_datalayer_defaults add/edit/delete/collection routes.'
  bundle: advanced_datalayer
  rubric_ref: rubric/advanced_datalayer_advanced_datalayer_permission@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: advanced_datalayer-node-value
  input: On this Drupal site, Advanced Datalayer has a value configured for the 'page_Name' dataLayer
    tag on node pages. Inspect the live configuration for the node page context and report the value that
    is set for page_Name.
  criteria: advanced_datalayer.advanced_datalayer_defaults.node -> tags.page_Name = '[node:title]-ADLMARK'
    (drush cget advanced_datalayer.advanced_datalayer_defaults.node tags).
  bundle: advanced_datalayer
  rubric_ref: rubric/advanced_datalayer_advanced_datalayer_node_value@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/advanced_datalayer-node-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/advanced_datalayer-node-cleanup.sh
- id: advanced_datalayer-global-value
  input: On this Drupal site, a global dataLayer variable for the site name has been configured in Advanced
    Datalayer. Inspect the live global page-variable configuration and report the value set for the site_Name
    tag.
  criteria: advanced_datalayer.advanced_datalayer_defaults.global -> tags.site_Name = 'ACME-EVAL'.
  bundle: advanced_datalayer
  rubric_ref: rubric/advanced_datalayer_advanced_datalayer_global_value@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/advanced_datalayer-global-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/advanced_datalayer-global-cleanup.sh
- id: advanced_datalayer-set-front
  input: 'On this Drupal site, use Advanced Datalayer to make the front page push a dataLayer variable:
    set the ''page_Name'' tag to the literal value ''Homepage'' for the front-page context. Apply the
    change to the live site.'
  criteria: advanced_datalayer.advanced_datalayer_defaults.front -> tags.page_Name = 'Homepage'. E.g.
    load the advanced_datalayer_defaults entity 'front', set tags to ['page_Name' => 'Homepage'] and save.
  bundle: advanced_datalayer
  rubric_ref: rubric/advanced_datalayer_advanced_datalayer_set_front@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/advanced_datalayer-front-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/advanced_datalayer-front-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/advanced_datalayer-front-verify.sh
- id: advanced_datalayer-set-event
  input: On this Drupal site, configure Advanced Datalayer so that node pages emit an 'event' dataLayer
    variable with the value 'pageview'. Set the 'event' tag on the node page context and apply it to the
    live site.
  criteria: advanced_datalayer.advanced_datalayer_defaults.node -> tags.event = 'pageview' (load the 'node'
    advanced_datalayer_defaults entity, set tags.event = 'pageview', save).
  bundle: advanced_datalayer
  rubric_ref: rubric/advanced_datalayer_advanced_datalayer_set_event@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/advanced_datalayer-event-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/advanced_datalayer-event-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/advanced_datalayer-event-verify.sh
