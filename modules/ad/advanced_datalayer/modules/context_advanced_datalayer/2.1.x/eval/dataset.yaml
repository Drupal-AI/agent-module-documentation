metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: context_advanced_datalayer
  version: 2.1.x
  note: context_advanced_datalayer adds one Context reaction (@ContextReaction id=context_advanced_datalayer)
    that lets you set Advanced Datalayer tag values inside a Context, so datalayer variables can be applied
    conditionally (path/role/entity). Values are stored at context.context.<name>.reactions.context_advanced_datalayer
    as a tag_id => value map. hook_advanced_datalayer_alter() merges every ACTIVE reaction's values into
    the datalayer before it is pushed (via context.manager->getActiveReactions). Depends on context +
    advanced_datalayer; no routes/permissions/services/config schema of its own. Medium cases create a
    Context with the reaction carrying a known tag value and read it back; hard cases build a Context
    with the reaction, verified against the context config entity. Tag ids come from advanced_datalayer
    tag plugins (example_advanced_datalayer is enabled, providing site_Name, event, etc.).
questions:
- id: context_adl-what
  input: What does the context_advanced_datalayer submodule add on top of Advanced Datalayer, and what
    does it let a site builder do that the base module's per-page-type defaults do not?
  criteria: It adds a Context reaction (context_advanced_datalayer) so you can set dataLayer tag values
    inside a Context and apply them conditionally (by path, role, entity type, etc.), rather than only
    per page type.
  bundle: context_advanced_datalayer
  rubric_ref: rubric/context_advanced_datalayer_context_adl_what@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: context_adl-deps
  input: Which two Drupal modules must be enabled for context_advanced_datalayer to work?
  criteria: It depends on both context and advanced_datalayer (and you need datalayer tags to exist, e.g.
    from example_advanced_datalayer or your own tag plugins).
  bundle: context_advanced_datalayer
  rubric_ref: rubric/context_advanced_datalayer_context_adl_deps@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: context_adl-how-merged
  input: How do the tag values configured in a context_advanced_datalayer Context reaction actually end
    up in the page's dataLayer?
  criteria: 'Via hook_advanced_datalayer_alter(): the module asks context.manager->getActiveReactions(''context_advanced_datalayer'')
    for all currently-active reactions, executes each, and merges their tag_id => value maps into the
    datalayer array before it is pushed.'
  bundle: context_advanced_datalayer
  rubric_ref: rubric/context_advanced_datalayer_context_adl_how_merged@1.0
  tags:
  - mode:recipe
  - difficulty:easy
