metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: example_advanced_datalayer
  version: 2.1.x
  note: 'example_advanced_datalayer provides concrete @AdvancedDatalayerTag / @AdvancedDatalayerGroup
    plugins for the base advanced_datalayer module (which ships none). Groups: site_Information, page_Information
    (+ core root). Tags: event (root); site_Name, site_Category, ga_client_id (site_Information); page_Name,
    page_Category, response_Code (page_Information). Tag runtime values come from advanced_datalayer_defaults
    config (tags map per context), not the plugin class. It also attaches js/example_advanced_datalayer.js
    in hook_page_attachments for client-side values. Medium cases introspect a tag''s group via plugin.manager.advanced_datalayer.tag
    and read a value assigned to an example tag; hard cases assign example-tag values to page contexts,
    verified against advanced_datalayer_defaults config.'
questions:
- id: example_adl-which-tags
  input: The base Drupal 'advanced_datalayer' module ships no dataLayer tags. Which submodule provides
    a ready-made set of example tags, and name a few of the tag ids it defines.
  criteria: 'example_advanced_datalayer provides them: tags event, site_Name, site_Category, ga_client_id,
    page_Name, page_Category, response_Code (grouped under root, site_Information, page_Information).'
  bundle: example_advanced_datalayer
  rubric_ref: rubric/example_advanced_datalayer_example_adl_which_tags@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: example_adl-groups
  input: What dataLayer groups does the example_advanced_datalayer submodule define to organize its tags?
  criteria: 'It defines two @AdvancedDatalayerGroup plugins: site_Information (Site Information Group)
    and page_Information (Page Information Group). The core ''root'' group comes from the base module.'
  bundle: example_advanced_datalayer
  rubric_ref: rubric/example_advanced_datalayer_example_adl_groups@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: example_adl-js
  input: The example_advanced_datalayer module implements hook_page_attachments. What does it attach,
    and why?
  criteria: It attaches js/example_advanced_datalayer.js (when global datalayer tags exist on a supported
    route) so that values which can only be computed in the browser — e.g. device type, GA client id —
    can be added to the dataLayer client-side.
  bundle: example_advanced_datalayer
  rubric_ref: rubric/example_advanced_datalayer_example_adl_js@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: example_adl-tag-group
  input: On this Drupal site, inspect the registered Advanced Datalayer tag plugins and report which datalayer
    group the 'ga_client_id' tag belongs to.
  criteria: ga_client_id belongs to the site_Information group (from the tag plugin definition; e.g. \Drupal::service('plugin.manager.advanced_datalayer.tag')->getDefinition('ga_client_id')['group']).
  bundle: example_advanced_datalayer
  rubric_ref: rubric/example_advanced_datalayer_example_adl_tag_group@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/example_adl-group-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/example_adl-group-cleanup.sh
- id: example_adl-pagecat-value
  input: On this Drupal site, a value has been configured for the example 'page_Category' dataLayer tag
    on node pages. Inspect the live node page-variable configuration and report the value set for page_Category.
  criteria: advanced_datalayer.advanced_datalayer_defaults.node -> tags.page_Category = 'blog-EXMARK'.
  bundle: example_advanced_datalayer
  rubric_ref: rubric/example_advanced_datalayer_example_adl_pagecat_value@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/example_adl-pagecat-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/example_adl-pagecat-cleanup.sh
- id: example_adl-set-sitecat
  input: On this Drupal site, using the example Advanced Datalayer tags, configure node pages so that
    the 'site_Category' dataLayer tag has the value 'news'. Apply the change to the live site.
  criteria: advanced_datalayer.advanced_datalayer_defaults.node -> tags.site_Category = 'news' (load the
    'node' advanced_datalayer_defaults entity, set tags.site_Category = 'news', save).
  bundle: example_advanced_datalayer
  rubric_ref: rubric/example_advanced_datalayer_example_adl_set_sitecat@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/example_adl-sitecat-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/example_adl-sitecat-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/example_adl-sitecat-verify.sh
- id: example_adl-set-frontcat
  input: On this Drupal site, configure the front page so the example 'page_Category' dataLayer tag has
    the value 'landing'. Apply the change to the live site.
  criteria: advanced_datalayer.advanced_datalayer_defaults.front -> tags.page_Category = 'landing'.
  bundle: example_advanced_datalayer
  rubric_ref: rubric/example_advanced_datalayer_example_adl_set_frontcat@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/example_adl-frontcat-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/example_adl-frontcat-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/example_adl-frontcat-verify.sh
