metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: adminimal_admin_toolbar
  version: 2.0.x
  note: Adminimal Admin Toolbar is a CSS/library layer that restyles the Admin Toolbar; it has one boolean
    setting and a hard dependency on admin_toolbar. All cases are `recipe` (response-graded), probing
    documented facts (what it does, its dependency, its single config key, its libraries) rather than
    live site state.
questions:
- id: adminimal-what-it-does
  input: On a Drupal 11 site, what does the adminimal_admin_toolbar module do, and does it add any new
    toolbar features or menu links?
  criteria: It restyles the admin toolbar with the minimalist 'Adminimal' dark look-and-feel. It is a
    pure CSS/styling layer and adds no new toolbar features or menu links.
  bundle: adminimal_admin_toolbar
  rubric_ref: rubric/adminimal_admin_toolbar_adminimal_what_it_does@1.0
  tags:
  - mode:recipe
- id: adminimal-dependency
  input: Which contrib module must be installed for adminimal_admin_toolbar to work, and what core module
    does that pull in?
  criteria: It depends on the contrib admin_toolbar module (declared admin_toolbar:admin_toolbar in info.yml),
    which in turn depends on core's Toolbar (toolbar) module.
  bundle: adminimal_admin_toolbar
  rubric_ref: rubric/adminimal_admin_toolbar_adminimal_dependency@1.0
  tags:
  - mode:recipe
- id: adminimal-css-layer
  input: Is adminimal_admin_toolbar a feature module or a theme/CSS layer? How does it apply its styling
    to the toolbar?
  criteria: It is a CSS/theme layer, not a feature module. It attaches CSS libraries via hook_page_attachments_alter()
    and adds an 'adminimal-admin-toolbar' body class (only for users with the 'access toolbar' permission)
    that scopes the styles.
  bundle: adminimal_admin_toolbar
  rubric_ref: rubric/adminimal_admin_toolbar_adminimal_css_layer@1.0
  tags:
  - mode:recipe
- id: adminimal-enable
  input: How do I install and enable adminimal_admin_toolbar on a Drupal 11 site, and is there anything
    else to configure to make the styling appear?
  criteria: composer require drupal/adminimal_admin_toolbar then drush en adminimal_admin_toolbar -y.
    Simply enabling it applies the styling; no further configuration is required.
  bundle: adminimal_admin_toolbar
  rubric_ref: rubric/adminimal_admin_toolbar_adminimal_enable@1.0
  tags:
  - mode:recipe
- id: adminimal-single-setting
  input: Does adminimal_admin_toolbar have any configuration? If so, what is the one setting and which
    config object holds it?
  criteria: 'Yes, one setting: avoid_custom_font (boolean, default FALSE) on the adminimal_admin_toolbar.settings
    config object. When TRUE it skips loading the Open Sans Google font.'
  bundle: adminimal_admin_toolbar
  rubric_ref: rubric/adminimal_admin_toolbar_adminimal_single_setting@1.0
  tags:
  - mode:recipe
- id: adminimal-settings-route
  input: What admin path and route lead to adminimal_admin_toolbar's settings form, and which permission
    is required?
  criteria: The form is at /admin/config/user-interface/adminimal_admin_toolbar (route adminimal_admin_toolbar.settings),
    guarded by the core 'administer site configuration' permission.
  bundle: adminimal_admin_toolbar
  rubric_ref: rubric/adminimal_admin_toolbar_adminimal_settings_route@1.0
  tags:
  - mode:recipe
- id: adminimal-font-libraries
  input: Which library does adminimal_admin_toolbar attach for the Open Sans font, and how do I stop that
    font from loading?
  criteria: The adminimal_admin_toolbar/google-fonts library (css/font.css) loads Open Sans. Set avoid_custom_font
    to TRUE to stop it from being attached.
  bundle: adminimal_admin_toolbar
  rubric_ref: rubric/adminimal_admin_toolbar_adminimal_font_libraries@1.0
  tags:
  - mode:recipe
