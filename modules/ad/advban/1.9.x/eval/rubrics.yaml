rubrics:
- id: advban_advban_storage_and_service
  version: '1.0'
  applicable_bundles:
  - advban
  checks:
  - kind: must_contain_any
    values:
    - advban.ip_manager
    - banIp
    - advban_ip
  scoring:
    combine: all_pass
- id: advban_advban_range_limitation
  version: '1.0'
  applicable_bundles:
  - advban
  checks:
  - kind: must_contain_any
    values:
    - ip2long
    - IPv4
    - IPv4 only
    - integer
  scoring:
    combine: all_pass
- id: advban_advban_protected_precedence
  version: '1.0'
  applicable_bundles:
  - advban
  checks:
  - kind: must_contain_any
    values:
    - protected
    - advban_protected_ips
    - CIDR
    - override
  scoring:
    combine: all_pass
- id: advban_advban_known_ban
  version: '1.0'
  applicable_bundles:
  - advban
  checks:
  - kind: must_contain_any
    values:
    - '4711'
    - scraping incident
  scoring:
    combine: all_pass
- id: advban_advban_protected_list
  version: '1.0'
  applicable_bundles:
  - advban
  checks:
  - kind: must_contain_any
    values:
    - 198.51.100.0/24
    - 198.51.100.0
  scoring:
    combine: all_pass
- id: advban_advban_range_ban
  version: '1.0'
  applicable_bundles:
  - advban
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
- id: advban_advban_settings_defaults
  version: '1.0'
  applicable_bundles:
  - advban
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
