rubrics:
- id: address_address_field_types
  version: '1.0'
  applicable_bundles:
  - address
  checks:
  - kind: must_contain_any
    values:
    - address_country
    - address_zone
  scoring:
    combine: all_pass
- id: address_address_subfields
  version: '1.0'
  applicable_bundles:
  - address
  checks:
  - kind: must_contain_any
    values:
    - country_code
    - getCountryCode
    - getLocality
  scoring:
    combine: all_pass
- id: address_address_addressing_library
  version: '1.0'
  applicable_bundles:
  - address
  checks:
  - kind: must_contain_any
    values:
    - commerceguys/addressing
    - commerceguys
    - addressing
  scoring:
    combine: all_pass
- id: address_address_repository_services
  version: '1.0'
  applicable_bundles:
  - address
  checks:
  - kind: must_contain_any
    values:
    - address.address_format_repository
    - address.country_repository
    - address.subdivision_repository
  scoring:
    combine: all_pass
- id: address_address_render_element
  version: '1.0'
  applicable_bundles:
  - address
  checks:
  - kind: must_contain_any
    values:
    - '''address'''
    - '#type => ''address'''
    - '#available_countries'
  scoring:
    combine: all_pass
- id: address_address_field_overrides
  version: '1.0'
  applicable_bundles:
  - address
  checks:
  - kind: must_contain_any
    values:
    - field_overrides
    - available_countries
  scoring:
    combine: all_pass
- id: address_address_events
  version: '1.0'
  applicable_bundles:
  - address
  checks:
  - kind: must_contain_any
    values:
    - AVAILABLE_COUNTRIES
    - AvailableCountriesEvent
    - address.available_countries
  scoring:
    combine: all_pass
- id: address_address_plain_theming
  version: '1.0'
  applicable_bundles:
  - address
  checks:
  - kind: must_contain_any
    values:
    - address_plain
    - address-plain.html.twig
    - address_plain__
  scoring:
    combine: all_pass
- id: address_address_article_field
  version: '1.0'
  applicable_bundles:
  - address
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
- id: address_address_page_field
  version: '1.0'
  applicable_bundles:
  - address
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
