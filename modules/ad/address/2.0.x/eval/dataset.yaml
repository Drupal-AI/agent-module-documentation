metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: address
  version: 2.0.x
  note: 'Address is configured through the standard Field UI and exposes its programmatic surface via
    repository services, render elements and events — there is no bespoke admin form, permission set or
    Drush command. The recipe cases are response-graded; the two hard cases exercise live execution: add
    an `address` field to a content type and verify the resulting FieldConfig/FieldStorageConfig.'
questions:
- id: address-field-types
  input: The Drupal contrib `address` module provides more than one field type. Name the three field types
    it adds for capturing address data.
  criteria: address (full compound postal address), address_country (country code only) and address_zone
    (a geographic zone made of territory rules).
  bundle: address
  rubric_ref: rubric/address_address_field_types@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: address-subfields
  input: On a Drupal 11 site I have an `address` field. In custom PHP, given the field item, how do I
    read the country and the city/town portion of the stored value? Name the subfield property that stores
    the country and the getter methods on the address item.
  criteria: The country is the `country_code` property; the item implements AddressInterface with getters
    like getCountryCode() and getLocality() (locality = city/town). Other properties include administrative_area,
    postal_code, dependent_locality, address_line1, given_name, family_name, etc.
  bundle: address
  rubric_ref: rubric/address_address_subfields@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: address-addressing-library
  input: Which third-party PHP library does the Drupal `address` module depend on to supply its country/subdivision
    data and address formats?
  criteria: commerceguys/addressing (Google's i18n address data), a Composer dependency of the module.
  bundle: address
  rubric_ref: rubric/address_address_addressing_library@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: address-repository-services
  input: In custom code on a Drupal site with the `address` module, I need (a) the address format / field
    layout for the US, (b) the list of country names keyed by code, and (c) the subdivisions (states)
    of the US for a cascading dropdown. Which services do I call?
  criteria: address.address_format_repository->get('US'), address.country_repository->getList() / ->get('FR'),
    and address.subdivision_repository->getList(['US']).
  bundle: address
  rubric_ref: rubric/address_address_repository_services@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: address-render-element
  input: In a custom Drupal 11 form (not an entity field) I want the dynamic, country-aware address widget
    with subfields that rebuild when the country changes. What form render element `#type` do I use, and
    how do I restrict it to the US and Canada?
  criteria: Use '#type' => 'address' (Drupal\address\Element\Address) and restrict with '#available_countries'
    => ['US', 'CA']. It rebuilds subfields via AJAX on country change.
  bundle: address
  rubric_ref: rubric/address_address_render_element@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: address-field-overrides
  input: On an `address` field's settings I want to force the Organization property to be required and
    limit the field to EU countries. Which two field setting keys control this, and what override values
    are allowed?
  criteria: field_overrides sets a per-property override of HIDDEN | OPTIONAL | REQUIRED (replaces the
    deprecated `fields`); available_countries is a sequence of allowed country codes (empty = all).
  bundle: address
  rubric_ref: rubric/address_address_field_overrides@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: address-events
  input: The `address` module has no alter hooks. I need to programmatically change which countries are
    offered on an address field. What mechanism does the module use, and which event do I subscribe to?
  criteria: 'Subscribe to a Symfony event: AddressEvents::AVAILABLE_COUNTRIES (address.available_countries,
    AvailableCountriesEvent) via a tagged event_subscriber service, using getAvailableCountries()/setAvailableCountries().
    Other events: ADDRESS_FORMAT and SUBDIVISIONS.'
  bundle: address
  rubric_ref: rubric/address_address_events@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: address-plain-theming
  input: I want to override the markup of the plain address output for a specific field (field_venue on
    nodes) in my Drupal theme. Which formatter renders through a Twig template, what is the base template,
    and what is a valid theme suggestion for that field?
  criteria: The address_plain formatter renders through templates/address-plain.html.twig; override with
    a suggestion like address_plain__node__field_venue (e.g. address-plain--node--field-venue.html.twig).
    The address_default formatter, by contrast, renders country-formatted HTML directly.
  bundle: address
  rubric_ref: rubric/address_address_plain_theming@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: address-article-field
  input: On this Drupal site, add a new field to the Article content type that stores a full postal address,
    using the field type provided by the address module. Name the field field_eval_address and apply it
    to the live site so the field and its storage exist on Article nodes.
  criteria: A FieldStorageConfig node.field_eval_address of type `address` and a FieldConfig on node.article
    referencing it now exist on the live site.
  bundle: address
  rubric_ref: rubric/address_address_article_field@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/address-article-field-reset.sh
    verify: agent-module-documentation/evaluation/verify/address-article-field-verify.sh
- id: address-page-field
  input: On this Drupal site, add a field that stores a full postal address to the Basic page content
    type, using the field type provided by the address module. Name the field field_eval_address_page
    and apply it live so the address field and its storage exist on Basic page nodes.
  criteria: A FieldStorageConfig node.field_eval_address_page of type `address` and a FieldConfig on node.page
    referencing it now exist on the live site (the reset guarantees the Basic page type exists first).
  bundle: address
  rubric_ref: rubric/address_address_page_field@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/address-page-field-reset.sh
    verify: agent-module-documentation/evaluation/verify/address-page-field-verify.sh
