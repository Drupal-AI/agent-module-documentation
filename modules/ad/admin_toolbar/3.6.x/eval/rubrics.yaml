rubrics:
- id: admin_toolbar_admintoolbar_settings_route
  version: '1.0'
  applicable_bundles:
  - admin_toolbar
  checks:
  - kind: must_contain_any
    values:
    - /admin/config/user-interface/admin-toolbar
    - admin_toolbar.settings
  scoring:
    combine: all_pass
- id: admin_toolbar_admintoolbar_menu_depth_drush
  version: '1.0'
  applicable_bundles:
  - admin_toolbar
  checks:
  - kind: must_contain_any
    values:
    - config:set admin_toolbar.settings menu_depth
    - admin_toolbar.settings menu_depth 6
  scoring:
    combine: all_pass
- id: admin_toolbar_admintoolbar_sticky_values
  version: '1.0'
  applicable_bundles:
  - admin_toolbar
  checks:
  - kind: must_contain_any
    values:
    - sticky_behavior
    - hide_on_scroll_down
  scoring:
    combine: all_pass
- id: admin_toolbar_admintoolbar_config_object
  version: '1.0'
  applicable_bundles:
  - admin_toolbar
  checks:
  - kind: must_contain_any
    values:
    - admin_toolbar.settings
    - hoverintent_behavior.timeout
  scoring:
    combine: all_pass
- id: admin_toolbar_admintoolbar_settings_permission
  version: '1.0'
  applicable_bundles:
  - admin_toolbar
  checks:
  - kind: must_contain_any
    values:
    - administer site configuration
  scoring:
    combine: all_pass
- id: admin_toolbar_admintoolbar_tools_submodule
  version: '1.0'
  applicable_bundles:
  - admin_toolbar
  checks:
