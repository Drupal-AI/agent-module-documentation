  scoring:
    combine: all_pass
- id: admin_toolbar_admintoolbar_search_submodule
  version: '1.0'
  applicable_bundles:
  - admin_toolbar
  checks:
  - kind: must_contain_any
    values:
    - admin_toolbar_search
  scoring:
    combine: all_pass
- id: admin_toolbar_admintoolbar_core_dependency
  version: '1.0'
  applicable_bundles:
  - admin_toolbar
  checks:
  - kind: must_contain_any
    values:
    - toolbar
  scoring:
