metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: admin_toolbar
  version: 3.6.x
  note: Admin Toolbar's only configuration surface is a small display-settings form and three optional
    submodules; all cases are `recipe` (response-graded) probing exact route/config-key/drush/submodule
    facts, not `execution` (live-state).
questions:
- id: admintoolbar-settings-route
  input: On a Drupal 11 site with Admin Toolbar installed, what is the admin path and the route machine
    name for Admin Toolbar's own display settings form?
  criteria: The form is at /admin/config/user-interface/admin-toolbar, route admin_toolbar.settings (form
    class AdminToolbarSettingsForm).
  bundle: admin_toolbar
  rubric_ref: rubric/admin_toolbar_admintoolbar_settings_route@1.0
  tags:
  - mode:recipe
- id: admintoolbar-menu-depth-drush
  input: I want to make Admin Toolbar's drop-down menus render 6 levels deep instead of the default. Give
    the exact drush command that sets the correct config key.
  criteria: drush config:set admin_toolbar.settings menu_depth 6 -y (the menu_depth key on admin_toolbar.settings,
    default 4).
  bundle: admin_toolbar
  rubric_ref: rubric/admin_toolbar_admintoolbar_menu_depth_drush@1.0
  tags:
  - mode:recipe
- id: admintoolbar-sticky-values
  input: In Admin Toolbar's settings, which config key controls whether the toolbar hides when scrolling
    down, and what are its allowed values?
  criteria: The sticky_behavior key on admin_toolbar.settings accepts enabled, disabled, or hide_on_scroll_down.
  bundle: admin_toolbar
  rubric_ref: rubric/admin_toolbar_admintoolbar_sticky_values@1.0
  tags:
  - mode:recipe
- id: admintoolbar-config-object
  input: What is the name of the config object where Admin Toolbar stores its display preferences (menu
    depth, sticky behavior, hoverIntent), and what key controls the hoverIntent delay?
  criteria: Config object admin_toolbar.settings; the hoverintent_behavior.timeout key (default 500 ms)
    sets the hoverIntent delay.
  bundle: admin_toolbar
  rubric_ref: rubric/admin_toolbar_admintoolbar_config_object@1.0
  tags:
  - mode:recipe
- id: admintoolbar-settings-permission
  input: Which permission machine name does a user need to access Admin Toolbar's display settings form?
  criteria: The core 'administer site configuration' permission guards the admin_toolbar.settings form.
  bundle: admin_toolbar
  rubric_ref: rubric/admin_toolbar_admintoolbar_settings_permission@1.0
  tags:
  - mode:recipe
- id: admintoolbar-tools-submodule
  input: I want Admin Toolbar to add action links for flushing caches and running cron directly from the
    toolbar. Which submodule do I enable?
  criteria: Enable the admin_toolbar_tools (Admin Toolbar Extra Tools) submodule, which adds cache/cron
    action links.
  bundle: admin_toolbar
  rubric_ref: rubric/admin_toolbar_admintoolbar_tools_submodule@1.0
  tags:
  - mode:recipe
- id: admintoolbar-search-submodule
  input: Which Admin Toolbar submodule adds a search/filter box for admin menu links, and which submodule
    is deprecated?
  criteria: admin_toolbar_search adds the link search/filter box; admin_toolbar_links_access_filter is
    the deprecated submodule.
  bundle: admin_toolbar
  rubric_ref: rubric/admin_toolbar_admintoolbar_search_submodule@1.0
  tags:
  - mode:recipe
- id: admintoolbar-core-dependency
  input: Which single core module must be enabled for Admin Toolbar to work, and does Admin Toolbar itself
    add any new menu links?
  criteria: It depends only on core's Toolbar (toolbar) module and adds no menu links of its own; it just
    re-renders the existing admin menu as drop-downs.
  bundle: admin_toolbar
  rubric_ref: rubric/admin_toolbar_admintoolbar_core_dependency@1.0
  tags:
  - mode:recipe
