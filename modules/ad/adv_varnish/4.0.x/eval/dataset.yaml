metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: adv_varnish
  version: 4.0.x
  note: All configuration is the config object adv_varnish.cache_settings (sections general.*, available.*,
    cache_control.*), edited at /admin/config/development/adv_varnish. Cache invalidation goes through
    adv_varnish.cache_manager (tagged cache_tags_invalidator), which sends HTTP BAN requests to general.varnish_server
    but only when general.varnish_purger is TRUE. The module defines a user_blocks plugin type (namespace
    Plugin/UserBlocks, base UserBlockBase) for ESI per-user fragments. Medium/hard cases are grounded
    in the real adv_varnish.cache_settings config object (no live Varnish server is contacted). Scripts
    write/read config via the config API; cleanup/reset restore the shipped install default (only cache_control.anonymous
    set).
questions:
- id: adv_varnish-config-enable
  input: In the Advanced Varnish cache (adv_varnish) Drupal module, which config object holds all settings,
    at what admin path do you edit them, and which setting is the master switch that turns Varnish caching
    on?
  criteria: Config object adv_varnish.cache_settings, edited at /admin/config/development/adv_varnish
    (route adv_varnish.config_form). The master switch is available.enable_cache.
  bundle: adv_varnish
  rubric_ref: rubric/adv_varnish_adv_varnish_config_enable@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: adv_varnish-ban-purge
  input: How does adv_varnish invalidate cached content on the Varnish server when Drupal cache tags change,
    and which setting must be on for it to happen?
  criteria: The adv_varnish.cache_manager service (tagged cache_tags_invalidator) turns cache-tag invalidations
    into HTTP BAN requests to the configured varnish_server, but only when general.varnish_purger is enabled.
  bundle: adv_varnish
  rubric_ref: rubric/adv_varnish_adv_varnish_ban_purge@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: adv_varnish-user-blocks-plugin
  input: adv_varnish supports keeping per-user page fragments dynamic while the page is cached. What plugin
    type does it define for this, and where do such plugins live / what base class do they extend?
  criteria: It defines the user_blocks plugin type (manager plugin.manager.user_blocks). Plugins live
    in a module's Plugin/UserBlocks namespace, extend UserBlockBase (implement UserBlocksInterface, tagged
    with the UserBlocks attribute), and provide per-user content served via ESI.
  bundle: adv_varnish
  rubric_ref: rubric/adv_varnish_adv_varnish_user_blocks_plugin@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: adv_varnish-server-read
  input: On this Drupal site, Advanced Varnish cache has been pointed at a Varnish server. Inspect the
    live adv_varnish.cache_settings config and report the configured Varnish server host.
  criteria: 'The Varnish server is http://varnish.mdtest:6081: adv_varnish.cache_settings general.varnish_server
    = ''http://varnish.mdtest:6081''.'
  bundle: adv_varnish
  rubric_ref: rubric/adv_varnish_adv_varnish_server_read@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/adv_varnish-server-read-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/adv_varnish-server-read-cleanup.sh
- id: adv_varnish-ttl-read
  input: On this Drupal site, Advanced Varnish cache has a page cache TTL configured. Inspect the live
    adv_varnish.cache_settings config and report the configured page cache maximum age (in seconds).
  criteria: 'The page cache maximum age is 900: adv_varnish.cache_settings general.page_cache_maximum_age
    = ''900''.'
  bundle: adv_varnish
  rubric_ref: rubric/adv_varnish_adv_varnish_ttl_read@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/adv_varnish-ttl-read-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/adv_varnish-ttl-read-cleanup.sh
- id: adv_varnish-enable-cache
  input: On this Drupal site, use Advanced Varnish cache to turn on Varnish caching (the master enable
    switch). Apply the change to the live adv_varnish.cache_settings configuration.
  criteria: adv_varnish.cache_settings available.enable_cache = true (e.g. drush cset adv_varnish.cache_settings
    available.enable_cache 1, or tick 'Enable Varnish cache' on the settings form).
  bundle: adv_varnish
  rubric_ref: rubric/adv_varnish_adv_varnish_enable_cache@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/adv_varnish-enable-cache-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/adv_varnish-enable-cache-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/adv_varnish-enable-cache-verify.sh
- id: adv_varnish-set-server
  input: On this Drupal site, configure Advanced Varnish cache to send purge requests to the Varnish server
    at http://varnish.example.com:6081 and enable the built-in Varnish purger. Apply the change to the
    live adv_varnish.cache_settings configuration.
  criteria: adv_varnish.cache_settings general.varnish_server = 'http://varnish.example.com:6081' and
    general.varnish_purger = true.
  bundle: adv_varnish
  rubric_ref: rubric/adv_varnish_adv_varnish_set_server@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/adv_varnish-set-server-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/adv_varnish-set-server-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/adv_varnish-set-server-verify.sh
