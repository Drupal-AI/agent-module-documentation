metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: addtocal_augment
  version: 1.2.x
  note: 'Add to Calendar Date Augmenter implements ONE date_augmenter plugin (id ''addtocal'', class AddToCal)
    that injects Google / iCal (Apple) / Outlook ''add to calendar'' links into a date field''s rendered
    output. It defines no plugin type (it consumes date_augmenter''s type), no admin page (configure=null),
    no permissions, no Drush. Persistent state = the plugin''s settings stored as field-formatter third-party
    settings under the date_augmenter key: core.entity_view_display.<e>.<b>.<mode> -> content.<field>.third_party_settings.date_augmenter.instances
    = {status:{addtocal:bool}, weights:{order:{addtocal:{weight}}}, settings:{addtocal:{label,event_title,location,description,icons,max_desc,ellipsis,past_events,target,ignore_timezone_if_UTC,retain_spacing}}}
    (schema date_augmenter.plugin.addtocal). Medium/hard cases are grounded in that real config on node.article.default:
    introspection reads back configured settings; execution enables the augmenter (and sets settings)
    on a datetime field''s formatter, verified against the live entity_view_display. NOTE: core datetime_default
    does not itself invoke augmenters, but the config storage is schema-valid and is exactly where the
    setting lives; a real render needs a date_augmenter-aware formatter such as Smart Date.'
questions:
- id: addtocal_augment-what-it-provides
  input: What does the addtocal_augment (Add to Calendar Date Augmenter) module provide on a Drupal 11
    site, and which calendar targets does it generate links for? How is it different from a standalone
    add-to-calendar field formatter?
  criteria: It implements a single Date Augmenter plugin (id 'addtocal') that injects 'Add to calendar'
    links (Google Calendar, iCal/Apple, Outlook) into the output of any date formatter that supports the
    Date Augmenter API (e.g. Smart Date), instead of being a standalone formatter. So you keep a rich
    date formatter and add calendar links to its output, with no external JS library.
  bundle: addtocal_augment
  rubric_ref: rubric/addtocal_augment_addtocal_augment_what_it_provides@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: addtocal_augment-where-configured
  input: There's no settings page for addtocal_augment. How do I turn it on for a date field and where
    are its settings stored?
  criteria: 'There is no configure route. On the entity/bundle Manage display, open the date field''s
    formatter settings (a formatter that supports the Date Augmenter API) and enable ''Add to Calendar
    Links'' in the Date Augmenter section. It is stored as field-formatter third-party settings: core.entity_view_display.<entity>.<bundle>.<mode>
    content.<field>.third_party_settings.date_augmenter.instances (status.addtocal true + settings.addtocal).'
  bundle: addtocal_augment
  rubric_ref: rubric/addtocal_augment_addtocal_augment_where_configured@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: addtocal_augment-modal-and-past
  input: In the addtocal_augment plugin settings, which option makes the links appear as a single button
    that opens a modal dialog instead of an inline list, and which option controls whether links show
    for events that already happened?
  criteria: The 'target' setting = 'modal' shows a single link that opens a modal (and attaches the addtocal_augment/modal
    library); '' (default) shows a list of links. The 'past_events' boolean controls whether the widget
    renders for events whose end time is in the past (default false hides them).
  bundle: addtocal_augment
  rubric_ref: rubric/addtocal_augment_addtocal_augment_modal_and_past@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: addtocal_augment-inspect-label-target
  input: On this site, the Article content type has a Date/time field with the addtocal (Add to Calendar)
    Date Augmenter enabled on its display formatter. Inspect the live default view display for Article
    and tell me the configured links label and whether the links are shown as a list or a modal.
  criteria: 'The addtocal augmenter on field_atc_known has label ''Save the date'' and target ''modal''
    (single link opening a modal): in core.entity_view_display.node.article.default the field_atc_known
    component''s third_party_settings.date_augmenter.instances.settings.addtocal has label=''Save the
    date'', target=''modal''.'
  bundle: addtocal_augment
  rubric_ref: rubric/addtocal_augment_addtocal_augment_inspect_label_target@1.0
  tags:
  - mode:introspection
  - difficulty:medium
