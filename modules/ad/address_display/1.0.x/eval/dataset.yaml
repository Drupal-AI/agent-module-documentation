metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: address_display
  version: 1.0.x
  note: 'Address display provides one field formatter, address_display_formatter (label ''Address Display''),
    for fields of type address (requires the address module). It has no settings form, no configure route
    (configure=null), no permissions, no Drush, and no plugin type. Configuration is per field, per view
    mode, stored on core.entity_view_display.<entity>.<bundle>.<mode> -> content.<field> with type: address_display_formatter
    and settings.address_display.<component>.{display,glue,weight}. Medium/hard cases are grounded in
    that real view-display config on a node.article address field (field_addisp_*). Note the site already
    has an unrelated field_eval_address; these cases use their own field_addisp_addr / field_addisp_task.'
questions:
- id: address_display-formatter-id
  input: I want to control which parts of a Drupal address field are shown (e.g. only city and country)
    and in what order. Which contrib module and which field formatter do I use, and on which field type
    does it work?
  criteria: Use the Address display module's 'Address Display' formatter (id address_display_formatter).
    It is a field formatter for fields of type 'address' (from the Address module), selected on the entity's
    Manage display page.
  bundle: address_display
  rubric_ref: rubric/address_display_address_display_formatter_id@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: address_display-settings-keys
  input: In the Address display formatter, how do you choose which address components are shown, their
    order, and the separator between them? Name the per-component settings.
  criteria: 'Each address component has three settings under settings.address_display.<component>: display
    (boolean, show it or not), glue (a separator string appended after the component), and weight (order).
    Only ticked components render, in weight order, with glue between them (not after the last).'
  bundle: address_display
  rubric_ref: rubric/address_display_address_display_settings_keys@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: address_display-where-stored
  input: There is no admin settings page for the Address display module. Where is the 'Address Display'
    formatter configuration actually stored for a given field, and how would I read it with drush?
  criteria: 'It is stored on the entity''s view display config, core.entity_view_display.<entity>.<bundle>.<view_mode>,
    under content.<field>.type (address_display_formatter) and content.<field>.settings.address_display.
    Read it with: drush cget core.entity_view_display.node.article.default content.<field>.'
  bundle: address_display
  rubric_ref: rubric/address_display_address_display_where_stored@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: address_display-known
  input: On this Drupal site the Article content type has an address field field_addisp_addr whose default
    display uses the Address display formatter. Inspect the live view-display config and state which two
    address components are set to display.
  criteria: locality and country_code are set to display:true (postal_code and address_line1 are display:false).
    In core.entity_view_display.node.article.default, content.field_addisp_addr.type is address_display_formatter
    with settings.address_display.locality.display=true and .country_code.display=true.
  bundle: address_display
  rubric_ref: rubric/address_display_address_display_known@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/address_display-known-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/address_display-known-cleanup.sh
- id: address_display-which-formatter
  input: The Article content type on this site has an address field field_addisp_addr. Inspect the live
    default view display and state which field formatter (by machine id) is applied to it.
  criteria: 'The formatter is address_display_formatter: content.field_addisp_addr.type in core.entity_view_display.node.article.default
    is address_display_formatter.'
  bundle: address_display
  rubric_ref: rubric/address_display_address_display_which_formatter@1.0
  tags:
