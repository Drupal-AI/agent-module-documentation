- id: address_display-set
  input: On this Drupal site the Article content type has an address field field_addisp_task that is currently
    displayed with the core default address formatter. Using the Address display module, change its default
    view display so the field uses the 'Address Display' formatter (address_display_formatter). Apply
    the change to the live site.
  criteria: 'In core.entity_view_display.node.article.default the field_addisp_task component has type:
    address_display_formatter (e.g. $vd->setComponent(''field_addisp_task'', [''type''=>''address_display_formatter'',
    ...])->save(), or pick ''Address Display'' on Manage display and Save).'
  bundle: address_display
  rubric_ref: rubric/address_display_address_display_set@1.0
  tags:
  - mode:execution
