metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: add_content_by_bundle
  version: 2.0.x
  note: 'Add Content by Bundle provides exactly one Views area handler (id add_content_by_bundle, registered
    via hook_views_data on views.add_content_by_bundle). It has no configure route (configure=null), no
    permissions, no Drush, and no plugin types. Its only persistent state lives inside a view''s config
    at display.<display>.display_options.<header|footer>.add_content_by_bundle, with keys type (entity
    type), bundle (plain-string bundle machine name), label, class, target ('''' | tray | modal), width,
    destination, params, login_redirect, group, form_mode. All medium/hard cases are grounded in that
    real view config: introspection reads back a view''s configured target bundle / dialog target; execution
    adds or reconfigures the area handler and is verified against the live views.view.* config.'
questions:
- id: acbb-where-added
  input: In Drupal, the add_content_by_bundle module lets me put an 'add content' link on a view. Where
    in the view do I add it, and what is the Views handler/area called?
  criteria: It is a Views area handler (id add_content_by_bundle). You add it to a view display's Header
    or Footer via the Views UI ('Add Content by Bundle link'), then choose the entity type, bundle, label,
    class and target.
  bundle: add_content_by_bundle
  rubric_ref: rubric/add_content_by_bundle_acbb_where_added@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: acbb-modal
  input: With the add_content_by_bundle Views area, how do I make the 'add content' link open the entity
    add form in a modal dialog instead of a full page, and can I set the dialog width?
  criteria: Set the area's 'target' option to 'modal' (or 'tray' for off-canvas). The link then gets the
    use-ajax class and data-dialog-type=modal, and the 'width' option controls the dialog width in pixels
    (default 600).
  bundle: add_content_by_bundle
  rubric_ref: rubric/add_content_by_bundle_acbb_modal@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: acbb-entity-types
  input: Which entity types can the add_content_by_bundle Views area link to, and which route does it
    use for a node content type?
  criteria: For nodes it uses the node.add route (node_type = bundle). It also supports taxonomy terms
    (entity.taxonomy_term.add_form), ECK entities (eck.entity.add), Group content, and any entity type
    via its add-form/add-page link template.
  bundle: add_content_by_bundle
  rubric_ref: rubric/add_content_by_bundle_acbb_entity_types@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: acbb-known-bundle
  input: This site has a view with machine name 'acbb_known' that includes an Add Content by Bundle link
    in its footer. Inspect the live view configuration and state which entity type and bundle the link
    is configured to create.
  criteria: 'The footer''s add_content_by_bundle handler targets entity type ''node'' and bundle ''article''
    (in views.view.acbb_known display.default.display_options.footer.add_content_by_bundle: type: node,
    bundle: article, label ''Add ACBB Known'').'
  bundle: add_content_by_bundle
  rubric_ref: rubric/add_content_by_bundle_acbb_known_bundle@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/add_content_by_bundle-known-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/add_content_by_bundle-known-cleanup.sh
- id: acbb-modal-known
  input: The view 'acbb_modal_known' on this site has an Add Content by Bundle footer link that opens
    the add form in a dialog. Inspect the live configuration and state whether it opens as a modal or
    an off-canvas tray, and what dialog width is configured.
  criteria: 'It opens as a modal (target: modal) with width 850, per views.view.acbb_modal_known display.default.display_options.footer.add_content_by_bundle.'
  bundle: add_content_by_bundle
  rubric_ref: rubric/add_content_by_bundle_acbb_modal_known@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/add_content_by_bundle-modal-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/add_content_by_bundle-modal-cleanup.sh
- id: acbb-add-area
  input: This site has a view with machine name 'acbb_task' whose default display has an empty footer.
    Using the add_content_by_bundle module, add an Add Content by Bundle link to that view's footer that
    creates a node of the 'page' (Basic page) content type. Apply the change to the live site.
  criteria: 'The default display footer of views.view.acbb_task gains an add_content_by_bundle handler
    with type: node and bundle: page (e.g. set display_options.footer.add_content_by_bundle via config
    or the Views UI and save).'
  bundle: add_content_by_bundle
  rubric_ref: rubric/add_content_by_bundle_acbb_add_area@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/add_content_by_bundle-add-area-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/add_content_by_bundle-add-area-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/add_content_by_bundle-add-area-verify.sh
- id: acbb-tray
  input: The view 'acbb_tray' on this site already has an Add Content by Bundle footer link that currently
    opens the add form as a normal full page. Reconfigure it so the add form instead opens in an off-canvas
    (off-screen) tray, and apply the change to the live site.
  criteria: In views.view.acbb_tray the add_content_by_bundle footer handler has target set to 'tray'
    (off-canvas), giving the link data-dialog-renderer=off_canvas.
  bundle: add_content_by_bundle
  rubric_ref: rubric/add_content_by_bundle_acbb_tray@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/add_content_by_bundle-tray-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/add_content_by_bundle-tray-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/add_content_by_bundle-tray-verify.sh
