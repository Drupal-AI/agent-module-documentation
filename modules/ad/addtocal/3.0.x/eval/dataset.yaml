metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: addtocal
  version: 3.0.x
  note: 'Add to Cal ships two Field API formatters (addtocal_view, addtocal_grouped_view) for date field
    types (date, datestamp, datetime, daterange, daterange_timezone, date_recur, smartdate) that render
    an Add to Calendar button (Google/Yahoo/Outlook.com/Office.com/ics via spatie/calendar-links). Formatter
    settings: event_title, location, description (token-aware), separator (range fields), past_events
    (bool). No config UI (configure=null); configured per field on Manage display (entity_view_display).
    It also defines hook_addtocal_links_alter(), theme hook addtocal_links, and an addtocal-url token
    type. Medium/hard cases are grounded in real entity_view_display components for datetime fields on
    the Article bundle.'
questions:
- id: atc-formatters
  input: In the Drupal addtocal (Add to Cal) module, which field formatters does it provide and which
    date field types can they be used on?
  criteria: Formatters addtocal_view (Add to Cal) and addtocal_grouped_view (grouped button), usable on
    date, datestamp, datetime, daterange, daterange_timezone, date_recur and smartdate fields.
  bundle: addtocal
  rubric_ref: rubric/addtocal_atc_formatters@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: atc-services
  input: What calendar targets does the Add to Cal button link to, and which PHP library generates those
    links?
  criteria: It builds links for Google, Yahoo, Outlook.com (web_outlook), Office.com (web_office) and
    a downloadable iCal/.ics file, using the spatie/calendar-links library.
  bundle: addtocal
  rubric_ref: rubric/addtocal_atc_services@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: atc-settings
  input: Which formatter settings does the Add to Cal (addtocal_view) formatter expose to control the
    generated calendar event, and how do you configure them (is there an admin settings page)?
  criteria: 'There is no admin settings page (configure=null); configure it per field on Manage display.
    Settings: event_title, location, description (token-aware), separator (for range fields) and past_events
    (whether to show the widget for past events).'
  bundle: addtocal
  rubric_ref: rubric/addtocal_atc_settings@1.0
  tags:
  - mode:recipe
  - difficulty:easy
