rubrics:
- id: addtocal_atc_formatters
  version: '1.0'
  applicable_bundles:
  - addtocal
  checks:
  - kind: must_contain_any
    values:
    - addtocal_view
    - addtocal_grouped_view
    - datetime
    - daterange
    - smartdate
  scoring:
    combine: all_pass
- id: addtocal_atc_services
  version: '1.0'
  applicable_bundles:
  - addtocal
  checks:
  - kind: must_contain_any
    values:
    - Google
    - Yahoo
    - Outlook
    - Office
    - ics
    - iCal
    - spatie
    - calendar-links
  scoring:
    combine: all_pass
- id: addtocal_atc_settings
  version: '1.0'
  applicable_bundles:
  - addtocal
  checks:
  - kind: must_contain_any
    values:
    - event_title
    - location
    - description
    - past_events
    - Manage display
  scoring:
    combine: all_pass
- id: addtocal_atc_known_title
  version: '1.0'
  applicable_bundles:
  - addtocal
  checks:
  - kind: must_contain_any
    values:
    - ATC Probe Event
  scoring:
    combine: all_pass
- id: addtocal_atc_past_events
  version: '1.0'
  applicable_bundles:
  - addtocal
  checks:
  - kind: must_contain_any
    values:
    - field_atc_on
  scoring:
    combine: all_pass
- id: addtocal_atc_set_formatter
  version: '1.0'
  applicable_bundles:
  - addtocal
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
- id: addtocal_atc_set_title
  version: '1.0'
  applicable_bundles:
  - addtocal
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
