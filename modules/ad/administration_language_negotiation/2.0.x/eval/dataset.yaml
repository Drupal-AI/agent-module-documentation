metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: administration_language_negotiation
  version: 2.0.x
  note: 'Administration Language Negotiation registers a core interface-language negotiation method id
    ''administration-language-negotiation'' (label ''Administration language''), enabled/ordered under
    language.types negotiation.language_interface.enabled. For users with the permission ''use administration
    language negotiation'' it returns the user''s preferred_admin_langcode on matching admin locations.
    Its settings live in config administration_language_negotiation.negotiation: paths (glob list), admin_routes
    (bool), use_default_lang (bool). It defines a plugin type administration_language_negotiation_condition
    (plugins: paths, admin_routes) and a configure route. Cases are grounded in that real config: introspection
    reads back a custom path / the admin_routes flag; execution enables the negotiation method (writes
    language.types) and turns on admin_routes, both verified against live config.'
questions:
- id: administration_language_negotiation-purpose
  input: What does the administration_language_negotiation module do, and where do I enable its language
    detection method on a Drupal 11 site?
  criteria: It adds an interface-language negotiation method 'Administration language' that forces admin
    pages into each user's preferred admin language. Enable and order it (before other methods) at Configuration
    > Regional and language > Languages > Detection and selection for the Interface text language.
  bundle: administration_language_negotiation
  rubric_ref: rubric/administration_language_negotiation_administration_language_negotiation_purpose@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: administration_language_negotiation-config-keys
  input: Which config object and keys control which pages administration_language_negotiation treats as
    'admin', and what are they?
  criteria: 'Config object administration_language_negotiation.negotiation with keys: paths (a list of
    glob patterns, default /admin, /admin/*, /node/add/*, ...), admin_routes (bool - treat every admin
    route as admin), and use_default_lang (bool fallback to site default language).'
  bundle: administration_language_negotiation
  rubric_ref: rubric/administration_language_negotiation_administration_language_negotiation_config_keys@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: administration_language_negotiation-permission
  input: Which permission does administration_language_negotiation define, and what does it control?
  criteria: The permission 'use administration language negotiation'. Only users with it get the admin-language
    negotiation applied and see the core 'Administration pages language' (preferred_admin_langcode) field
    on their user edit form; it lets non-administrators choose an admin language.
  bundle: administration_language_negotiation
  rubric_ref: rubric/administration_language_negotiation_administration_language_negotiation_permission@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: administration_language_negotiation-custom-path
  input: On this site, an extra admin-language path has been configured in administration_language_negotiation.
    Inspect the live configuration and give the custom path pattern that has been added to its paths list
    (beyond the default /admin and /node paths).
  criteria: The custom path is /aln-probe/* (present in administration_language_negotiation.negotiation:paths
    alongside the defaults).
  bundle: administration_language_negotiation
  rubric_ref: rubric/administration_language_negotiation_administration_language_negotiation_custom_path@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/administration_language_negotiation-path-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/administration_language_negotiation-path-cleanup.sh
- id: administration_language_negotiation-adminroutes-flag
  input: On this Drupal site, inspect the administration_language_negotiation settings and state whether
    the 'admin_routes' option (apply the admin language on every admin route) is currently enabled.
  criteria: Yes - admin_routes is true in administration_language_negotiation.negotiation, so the admin
    language is applied on every admin route.
  bundle: administration_language_negotiation
  rubric_ref: rubric/administration_language_negotiation_administration_language_negotiation_adminroutes_flag@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/administration_language_negotiation-adminroutes-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/administration_language_negotiation-adminroutes-cleanup.sh
- id: administration_language_negotiation-enable-method
  input: On this Drupal site, enable the administration_language_negotiation 'Administration language'
    negotiation method for the interface (interface text) language type, so it participates in interface
    language detection. Apply the change to the live site.
  criteria: In language.types, negotiation.language_interface.enabled now contains the key 'administration-language-negotiation'
    (with a weight). Set it e.g. via the Detection and selection UI or by adding the key to the enabled
    interface methods.
  bundle: administration_language_negotiation
  rubric_ref: rubric/administration_language_negotiation_administration_language_negotiation_enable_method@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/administration_language_negotiation-enable-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/administration_language_negotiation-enable-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/administration_language_negotiation-enable-verify.sh
- id: administration_language_negotiation-enable-adminroutes
  input: Configure administration_language_negotiation on this site so that the admin language is applied
    on every admin route (turn on its 'admin_routes' option). Apply the change to the live site.
  criteria: administration_language_negotiation.negotiation:admin_routes is set to true (e.g. drush cset
    administration_language_negotiation.negotiation admin_routes true, or tick it on the module's settings
    form).
  bundle: administration_language_negotiation
  rubric_ref: rubric/administration_language_negotiation_administration_language_negotiation_enable_adminroutes@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/administration_language_negotiation-adminroutes-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/administration_language_negotiation-adminroutes-execcleanup.sh
    verify: agent-module-documentation/evaluation/verify/administration_language_negotiation-adminroutes-verify.sh
