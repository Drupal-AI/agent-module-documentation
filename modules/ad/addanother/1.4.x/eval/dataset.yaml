metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: addanother
  version: 1.4.x
  note: 'Add Another stores all state in the single config object addanother.settings. Global defaults
    for new content types are default_button/default_message/default_tab/default_tab_edit; per-content-type
    overrides are keyed by node type as button.<type>, message.<type>, tab.<type>, tab_edit.<type>. Two
    permissions: ''administer add another'' (settings form addanother.admin_config -> /admin/config/content/addanother)
    and ''use add another'' (see button/message/tab). Medium/hard cases are grounded in that real config
    object and use existing content types (article, blog_post). The site''s addanother.settings may be
    empty; scripts write explicit values and cleanup restores the shipped install defaults (all default_*
    = true, empty per-type sequences).'
questions:
- id: addanother-config-object
  input: In the Drupal contrib module Add Another (addanother), where is the choice of whether a given
    content type shows the 'Save and add another' button stored? Name the config object and the key used
    for a per-content-type override.
  criteria: It is stored in the config object addanother.settings. The per-content-type override lives
    at button.<type> (e.g. button.article), falling back to the global default_button when unset.
  bundle: addanother
  rubric_ref: rubric/addanother_addanother_config_object@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: addanother-permissions
  input: Which permissions does the Add Another (addanother) Drupal module define, and what does each
    control?
  criteria: '''administer add another'' controls access to the settings form and configuring content types;
    ''use add another'' controls whether a user actually sees and can use the ''Save and add another''
    button, the after-save message, and the ''Add another'' tab.'
  bundle: addanother
  rubric_ref: rubric/addanother_addanother_permissions@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: addanother-settings-route
  input: On a Drupal site with the Add Another module, where do I set the site-wide defaults (button,
    message, tab) that apply to new content types?
  criteria: On the settings form at /admin/config/content/addanother (route addanother.admin_config),
    which edits default_button, default_message, default_tab and default_tab_edit in addanother.settings.
    Per-type overrides are edited on each content type's own edit form.
  bundle: addanother
  rubric_ref: rubric/addanother_addanother_settings_route@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: addanother-button-article
  input: On this Drupal site, the Article content type has an explicit Add Another override for the 'Save
    and add another' button that differs from the site default. Inspect the live addanother.settings configuration
    and state whether the button is enabled or disabled for Article.
  criteria: 'It is disabled: addanother.settings has button.article = false, overriding the default_button
    (true).'
  bundle: addanother
  rubric_ref: rubric/addanother_addanother_button_article@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/addanother-button-article-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/addanother-button-article-cleanup.sh
- id: addanother-message-blogpost
  input: On this site, the Add Another after-save message has been configured specifically for the Blog
    post (blog_post) content type. Inspect the live addanother.settings config and state whether blog_post
    shows the 'Add another' message after a node is saved.
  criteria: 'It does not show it: addanother.settings has message.blog_post = false.'
  bundle: addanother
  rubric_ref: rubric/addanother_addanother_message_blogpost@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/addanother-message-blogpost-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/addanother-message-blogpost-cleanup.sh
- id: addanother-enable-button
  input: On this Drupal site, use the Add Another module to enable the 'Save and add another' button for
    the Article content type. Apply the change to the live site's addanother.settings configuration.
  criteria: addanother.settings has button.article = true (set the key via drush cset addanother.settings
    button.article 1, config API, or by ticking 'Display Add another button on node add form' in the Article
    type's Add another settings).
  bundle: addanother
  rubric_ref: rubric/addanother_addanother_enable_button@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/addanother-enable-button-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/addanother-enable-button-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/addanother-enable-button-verify.sh
- id: addanother-enable-tab
  input: On this Drupal site, use the Add Another module to turn on the 'Add another' local-task tab for
    the Blog post (blog_post) content type, so nodes of that type get an 'Add another' tab. Apply the
    change to the live addanother.settings configuration.
  criteria: addanother.settings has tab.blog_post = true (set via drush cset addanother.settings tab.blog_post
    1, config API, or by ticking 'Display the Add another tab' in the blog_post type's Add another settings).
  bundle: addanother
  rubric_ref: rubric/addanother_addanother_enable_tab@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/addanother-enable-tab-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/addanother-enable-tab-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/addanother-enable-tab-verify.sh
