metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: address_map_link
  version: 2.0.x
  note: 'Address Map Link adds third-party formatter settings to core Address fields that turn a displayed
    address into a link to an external map provider. No field type, widget, settings form, configure route
    (configure=null), permission, or Drush. It defines the MapLink plugin type (manager plugin.manager.map_link)
    with 10 shipped providers (google_maps, google_maps_directions, apple_maps, bing_maps, here_wego_maps,
    mapquest, openstreetmap, yandex_maps, waze_directions, waze_navigate). Its only persistent state is
    third-party settings on the address field''s component in an entity_view_display config entity: content.<field>.third_party_settings.address_map_link.{link_address,map_link_type,map_link_position,map_link_text,map_link_new_window}.
    Medium/hard cases create a namespaced field_aml_* address field on node.article and read/write those
    settings, verified against the live entity_view_display.'
questions:
- id: address_map_link-which-providers
  input: The address_map_link Drupal module links an Address field to an external map site. Name several
    of the map providers it ships and the setting that turns the linking on.
  criteria: It ships google_maps, google_maps_directions, apple_maps, bing_maps, here_wego_maps, mapquest,
    openstreetmap, yandex_maps, waze_directions, waze_navigate. On an address field's formatter you tick
    'Link Address to Map' (third-party setting link_address=TRUE) and pick a provider (map_link_type).
  bundle: address_map_link
  rubric_ref: rubric/address_map_link_address_map_link_which_providers@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: address_map_link-where-stored
  input: In address_map_link, there is no settings page. Where are the map-link options (link on/off,
    provider, position) stored for a given address field, and how do I enable them?
  criteria: There is no configure route. You open the bundle's Manage display, open the Address field's
    formatter settings, tick 'Link Address to Map' and choose a provider. It is stored as third-party
    settings on the field's component in core.entity_view_display.<entity>.<bundle>.<view_mode> -> content.<field>.third_party_settings.address_map_link.{link_address,map_link_type,map_link_position,map_link_text,map_link_new_window}.
  bundle: address_map_link
  rubric_ref: rubric/address_map_link_address_map_link_where_stored@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: address_map_link-service-api
  input: How can I build a map URL from an Address field in custom PHP with the address_map_link module,
    without using the field formatter? Name the service and the method.
  criteria: 'Use the plugin.manager.map_link service: $manager->createInstance(''google_maps_directions'')->getAddressUrl($address)->toString(),
    where $address is an AddressInterface (e.g. $entity->field_address->first()).'
  bundle: address_map_link
  rubric_ref: rubric/address_map_link_address_map_link_service_api@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: address_map_link-known-provider
  input: On this Drupal site the Article content type has an Address field (field_aml_known) that address_map_link
    has turned into a map link. Inspect the live default view display for Article and state which map
    provider (map_link_type) that field is linked to.
  criteria: 'field_aml_known is linked to waze_directions: in core.entity_view_display.node.article.default
    its component has third_party_settings.address_map_link.link_address: true and map_link_type: waze_directions.'
  bundle: address_map_link
  rubric_ref: rubric/address_map_link_address_map_link_known_provider@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/address_map_link-known-provider-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/address_map_link-known-provider-cleanup.sh
- id: address_map_link-newwindow
  input: The Article content type on this site has an Address field field_aml_win with an address_map_link
    map link. Inspect the live view-display configuration and report which map provider it uses and whether
    the link opens in a new window.
  criteria: 'field_aml_win links to openstreetmap and opens in a new window: third_party_settings.address_map_link.map_link_type
    == ''openstreetmap'' and map_link_new_window == true.'
  bundle: address_map_link
  rubric_ref: rubric/address_map_link_address_map_link_newwindow@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/address_map_link-newwindow-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/address_map_link-newwindow-cleanup.sh
- id: address_map_link-enable-directions
  input: On this Drupal site the Article content type has an Address field field_aml_task shown with the
    Address (address_default) formatter, but it is not linked to a map. Using the address_map_link module,
    configure the default view display so this field links to the 'Google Maps - Directions' provider
    (map_link_type google_maps_directions). Apply the change to the live site.
  criteria: 'In core.entity_view_display.node.article.default the field_aml_task component has third_party_settings.address_map_link.link_address:
    true and map_link_type: google_maps_directions.'
  bundle: address_map_link
  rubric_ref: rubric/address_map_link_address_map_link_enable_directions@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/address_map_link-enable-directions-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/address_map_link-enable-directions-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/address_map_link-enable-directions-verify.sh
    unused_text_checks:
      must_not_contain: []
- id: address_map_link-enable-apple
  input: On my site, the Store address on Article pages (the field_aml_store address field) is just plain
    text. Make that address a clickable link that opens Apple Maps. Apply it to the live site.
  criteria: 'In core.entity_view_display.node.article.default the field_aml_store component has third_party_settings.address_map_link.link_address:
    true and map_link_type: apple_maps.'
  bundle: address_map_link
  rubric_ref: rubric/address_map_link_address_map_link_enable_apple@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: site-owner
