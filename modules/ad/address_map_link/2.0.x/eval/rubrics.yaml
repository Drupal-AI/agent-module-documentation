rubrics:
- id: address_map_link_address_map_link_which_providers
  version: '1.0'
  applicable_bundles:
  - address_map_link
  checks:
  - kind: must_contain_any
    values:
    - google_maps
    - apple_maps
    - waze
    - openstreetmap
    - bing_maps
    - link_address
  scoring:
    combine: all_pass
- id: address_map_link_address_map_link_where_stored
  version: '1.0'
  applicable_bundles:
  - address_map_link
  checks:
  - kind: must_contain_any
    values:
    - Manage display
    - entity_view_display
    - third_party_settings
    - formatter
  scoring:
    combine: all_pass
- id: address_map_link_address_map_link_service_api
  version: '1.0'
  applicable_bundles:
  - address_map_link
  checks:
  - kind: must_contain_any
    values:
    - plugin.manager.map_link
    - getAddressUrl
    - createInstance
  scoring:
    combine: all_pass
- id: address_map_link_address_map_link_known_provider
  version: '1.0'
  applicable_bundles:
  - address_map_link
  checks:
  - kind: must_contain_any
    values:
    - waze_directions
  scoring:
    combine: all_pass
- id: address_map_link_address_map_link_newwindow
  version: '1.0'
  applicable_bundles:
  - address_map_link
  checks:
  - kind: must_contain_any
    values:
    - openstreetmap
  scoring:
    combine: all_pass
- id: address_map_link_address_map_link_enable_directions
  version: '1.0'
  applicable_bundles:
  - address_map_link
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
- id: address_map_link_address_map_link_enable_apple
  version: '1.0'
  applicable_bundles:
  - address_map_link
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
