metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: addtocalendar
  version: 3.5.x
  note: 'Add To Calendar has no configure route (configure=null), no permissions, no Drush, no plugin
    manager. It works two ways: (1) a third-party formatter setting ''addtocalendar'' on core datetime/daterange
    formatters, stored on the entity_view_display at content.<field>.third_party_settings.addtocalendar
    (addtocalendar_show + addtocalendar_settings); (2) a dedicated field type add_to_calendar_field (widget
    add_to_calendar_widget_type, formatter add_to_calendar). The button is rendered by the external addtocalendar.com
    JS library (//addtocalendar.com/atc/1.5/atc.min.js) attached via the addtocalendar/base library. Medium
    cases read back real config on node.article; hard cases build the third-party setting on a datetime
    field and add a field of the module''s own type, verified against live config.'
questions:
- id: addtocalendar-how-to-add-button
  input: On a Drupal 11 site with the addtocalendar module enabled, I already have a Date/time field on
    my Event content type. How do I make an 'Add to Calendar' button appear next to that date on the node
    display, and where is that choice stored? There is no admin settings page.
  criteria: 'The module adds a ''Show Add to Calendar'' section to the core datetime/daterange field formatters
    via hook_field_formatter_third_party_settings_form(). On Manage display, open the date field''s formatter
    cog, tick ''Show Add to Calendar'', configure it and Save. It is stored on the entity view display:
    core.entity_view_display.<entity>.<bundle>.<mode> -> content.<field>.third_party_settings.addtocalendar.addtocalendar_show:
    1.'
  bundle: addtocalendar
  rubric_ref: rubric/addtocalendar_addtocalendar_how_to_add_button@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: addtocalendar-field-type
  input: Besides adding a button to an existing date field, the addtocalendar module also provides its
    own field type so you can place an Add-to-Calendar button on any entity and use it in Views. What
    is the machine name (id) of that field type, and what widget and formatter does it use?
  criteria: The field type id is add_to_calendar_field (a boolean-based field). Its default widget is
    add_to_calendar_widget_type (a checkbox 'Show add to calendar widget') and its default formatter is
    add_to_calendar. This lets you add a standalone button to entities without a date field and expose
    it as a Views field.
  bundle: addtocalendar
  rubric_ref: rubric/addtocalendar_addtocalendar_field_type@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: addtocalendar-external-service
  input: How does the addtocalendar module actually turn the event data into the interactive 'Add to Calendar'
    button in the browser? What external service/library does it rely on, and which calendar providers
    can the button target?
  criteria: 'It emits the event data as hidden <var> markup (start/end date, timezone, privacy, title,
    description, location, organizer) and loads the addtocalendar.com JS library (//addtocalendar.com/atc/1.5/atc.min.js,
    via the addtocalendar/base library) which builds the button. Supported providers: iCalendar, Google
    Calendar, Outlook, Outlook Online, and Yahoo Calendar.'
  bundle: addtocalendar
  rubric_ref: rubric/addtocalendar_addtocalendar_external_service@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: addtocalendar-known-field
  input: On this Drupal site, the Article content type has a Date/time field whose display has the addtocalendar
    'Add to Calendar' button enabled. Inspect the live default view display for Article and give the machine
    name of that field.
  criteria: 'The field is field_atc_known: in core.entity_view_display.node.article.default its component
    (formatter datetime_default) has third_party_settings.addtocalendar.addtocalendar_show: 1 (button
    text ''Save this date'').'
  bundle: addtocalendar
  rubric_ref: rubric/addtocalendar_addtocalendar_known_field@1.0
  tags:
  - mode:introspection
  - difficulty:medium
