rubrics:
- id: add_to_head_add_to_head_storage
  version: '1.0'
  applicable_bundles:
  - add_to_head
  checks:
  - kind: must_contain_any
    values:
    - add_to_head.settings
    - add_to_head_profiles
  scoring:
    combine: all_pass
- id: add_to_head_add_to_head_scopes
  version: '1.0'
  applicable_bundles:
  - add_to_head
  checks:
  - kind: must_contain_any
    values:
    - hook_page_attachments_alter
    - page_attachments_alter
  scoring:
    combine: all_pass
- id: add_to_head_add_to_head_admin_route
  version: '1.0'
  applicable_bundles:
  - add_to_head
  checks:
  - kind: must_contain_any
    values:
    - administer add to head
    - /admin/config/development/add-to-head
  scoring:
    combine: all_pass
- id: add_to_head_add_to_head_known_profile
  version: '1.0'
  applicable_bundles:
  - add_to_head
  checks:
  - kind: must_contain_any
    values:
    - ath-known
  scoring:
    combine: all_pass
- id: add_to_head_add_to_head_head_vs_scripts
  version: '1.0'
  applicable_bundles:
  - add_to_head
  checks:
  - kind: must_contain_any
    values:
    - ath-head-scope
  scoring:
    combine: all_pass
- id: add_to_head_add_to_head_verify_head
  version: '1.0'
  applicable_bundles:
  - add_to_head
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
- id: add_to_head_add_to_head_verify_scripts
  version: '1.0'
  applicable_bundles:
  - add_to_head
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
