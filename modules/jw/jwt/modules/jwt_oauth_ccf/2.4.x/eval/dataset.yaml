metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: jwt_oauth_ccf
  version: 2.4.x
  note: 'JWT OAuth Client Credentials issues short-lived JWTs via the OAuth 2.0 client credentials grant
    at POST /oauth2/token (machine-to-machine). Each Drupal account can hold one or more client credentials,
    managed at /user/{user}/oauth-clients; credentials are stored in the core user.data store (module
    key ''jwt_oauth_ccf'') keyed by a globally-unique client_id, as ClientCredential {uid, clientId, label,
    secretHash, created} objects via the jwt_oauth_ccf.client_repository service - only a bcrypt hash
    of the secret is ever persisted. Two permissions gate the management UI: ''manage own oauth client
    credentials'' and the restricted ''administer oauth client credentials''. All cases here are grounded
    in that real repository service and the user.data store, using uid 1 (admin), and never touch the
    shared jwt.config or require an actual HTTP token exchange.'
questions:
- id: jwt_oauth_ccf-token-endpoint
  input: What endpoint does the Drupal jwt_oauth_ccf module expose for machine-to-machine token issuance,
    and which OAuth 2.0 grant does it implement?
  criteria: 'POST /oauth2/token (route jwt_oauth_ccf.token, anonymous access) implements the OAuth 2.0
    client credentials grant (RFC 6749 4.4): a client presents client_id/client_secret (form body or HTTP
    Basic header) and receives a short-lived (3600s) access_token, a signed site JWT built with jwt.transcoder.'
  bundle: jwt_oauth_ccf
  rubric_ref: rubric/jwt_oauth_ccf_jwt_oauth_ccf_token_endpoint@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: jwt_oauth_ccf-permissions
  input: Which permissions does jwt_oauth_ccf define for managing OAuth client credentials on user accounts,
    and which one is marked security-restricted?
  criteria: '''manage own oauth client credentials'' (manage your own account''s credentials) and ''administer
    oauth client credentials'' (manage any account''s credentials). The latter is marked restrict access:
    true, since a credential can mint tokens that fully impersonate its owning account.'
  bundle: jwt_oauth_ccf
  rubric_ref: rubric/jwt_oauth_ccf_jwt_oauth_ccf_permissions@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: jwt_oauth_ccf-storage
  input: Where does jwt_oauth_ccf store OAuth client credentials, and what part of the secret is actually
    persisted to storage?
  criteria: Credentials live in the core user.data key-value store (module key 'jwt_oauth_ccf'), keyed
    by a globally-unique client_id, via the jwt_oauth_ccf.client_repository service. Only a bcrypt hash
    of the secret (password_hash) is stored; the plaintext is shown to the user exactly once, at generation
    time, and cannot be recovered.
  bundle: jwt_oauth_ccf
  rubric_ref: rubric/jwt_oauth_ccf_jwt_oauth_ccf_storage@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: jwt_oauth_ccf-known-client-owner
  input: This Drupal site has an OAuth client credential (jwt_oauth_ccf) with client_id 'jwtccf_eval_client'.
    Inspect the live site via the client repository / user.data and state which user account owns it,
    and its label.
  criteria: It is owned by uid 1 with label 'jwtccf_eval'. Resolve it with \Drupal::service('jwt_oauth_ccf.client_repository')->getClient('jwtccf_eval_client'),
    which returns a ClientCredential with uid === 1 and label === 'jwtccf_eval'.
  bundle: jwt_oauth_ccf
  rubric_ref: rubric/jwt_oauth_ccf_jwt_oauth_ccf_known_client_owner@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/jwt_oauth_ccf-known-client-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/jwt_oauth_ccf-known-client-cleanup.sh
- id: jwt_oauth_ccf-report-client-id
  input: User 1 on this Drupal site has an OAuth client credential registered through jwt_oauth_ccf with
    client_id 'jwtccf_report_client'. Inspect the live site and confirm its label and that it belongs
    to uid 1.
  criteria: Label is 'jwtccf_report', owned by uid 1 - found via \Drupal::service('jwt_oauth_ccf.client_repository')->getUserClients(1)
    (keyed by client_id) or ->getClient('jwtccf_report_client').
  bundle: jwt_oauth_ccf
  rubric_ref: rubric/jwt_oauth_ccf_jwt_oauth_ccf_report_client_id@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/jwt_oauth_ccf-report-client-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/jwt_oauth_ccf-report-client-cleanup.sh
- id: jwt_oauth_ccf-create-client
  input: On this Drupal site, create an OAuth client credential (jwt_oauth_ccf) for user 1 with the client_id
    'jwtccf_task_client', so it can be used with the client-credentials grant. Apply the change to the
    live site via the client credential repository.
  criteria: Call \Drupal::service('jwt_oauth_ccf.client_repository')->createClient(1, '<label>', NULL,
    'jwtccf_task_client') (or use the Generate form at /user/1/oauth-clients/generate, supplying the client
    ID as an administrator). Verify passes when getClient('jwtccf_task_client') returns a ClientCredential
    with uid === 1.
  bundle: jwt_oauth_ccf
  rubric_ref: rubric/jwt_oauth_ccf_jwt_oauth_ccf_create_client@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/jwt_oauth_ccf-create-client-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/jwt_oauth_ccf-create-client-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/jwt_oauth_ccf-create-client-verify.sh
- id: jwt_oauth_ccf-revoke-client
  input: The OAuth client credential 'jwtccf_del_client' on this Drupal site is no longer trusted and
    must be revoked so it can never mint new tokens again. Remove it via jwt_oauth_ccf. Apply the change
    to the live site.
  criteria: 'Delete the credential: \Drupal::service(''jwt_oauth_ccf.client_repository'')->deleteClient(''jwtccf_del_client'')
    (or the delete confirmation form at /user/1/oauth-clients/jwtccf_del_client/delete). Verify passes
    when getClient(''jwtccf_del_client'') returns NULL. Note: any tokens already issued under this credential
    remain valid until they expire - deleting it only stops new tokens.'
  bundle: jwt_oauth_ccf
  rubric_ref: rubric/jwt_oauth_ccf_jwt_oauth_ccf_revoke_client@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/jwt_oauth_ccf-revoke-client-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/jwt_oauth_ccf-revoke-client-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/jwt_oauth_ccf-revoke-client-verify.sh
