rubrics:
- id: jwt_oauth_ccf_jwt_oauth_ccf_token_endpoint
  version: '1.0'
  applicable_bundles:
  - jwt_oauth_ccf
  checks:
  - kind: must_contain_any
    values:
    - /oauth2/token
    - client_credentials
    - client credentials
  scoring:
    combine: all_pass
- id: jwt_oauth_ccf_jwt_oauth_ccf_permissions
  version: '1.0'
  applicable_bundles:
  - jwt_oauth_ccf
  checks:
  - kind: must_contain_any
    values:
    - manage own oauth client credentials
    - administer oauth client credentials
  scoring:
    combine: all_pass
- id: jwt_oauth_ccf_jwt_oauth_ccf_storage
  version: '1.0'
  applicable_bundles:
  - jwt_oauth_ccf
  checks:
  - kind: must_contain_any
    values:
    - user.data
    - hash
    - client_repository
  scoring:
    combine: all_pass
- id: jwt_oauth_ccf_jwt_oauth_ccf_known_client_owner
  version: '1.0'
  applicable_bundles:
  - jwt_oauth_ccf
  checks:
  - kind: must_contain_any
    values:
    - jwtccf_eval
  scoring:
    combine: all_pass
- id: jwt_oauth_ccf_jwt_oauth_ccf_report_client_id
  version: '1.0'
  applicable_bundles:
  - jwt_oauth_ccf
  checks:
  - kind: must_contain_any
    values:
    - jwtccf_report
  scoring:
    combine: all_pass
- id: jwt_oauth_ccf_jwt_oauth_ccf_create_client
  version: '1.0'
  applicable_bundles:
  - jwt_oauth_ccf
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
- id: jwt_oauth_ccf_jwt_oauth_ccf_revoke_client
  version: '1.0'
  applicable_bundles:
  - jwt_oauth_ccf
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
