rubrics:
- id: users_jwt_users_jwt_key_lookup_mechanism
  version: '1.0'
  applicable_bundles:
  - users_jwt
  checks:
  - kind: must_contain_any
    values:
    - kid
    - key id
    - header
  scoring:
    combine: all_pass
- id: users_jwt_users_jwt_request_header
  version: '1.0'
  applicable_bundles:
  - users_jwt
  checks:
  - kind: must_contain_any
    values:
    - UsersJwt
    - JWT-Authorization
  scoring:
    combine: all_pass
- id: users_jwt_users_jwt_key_storage
  version: '1.0'
  applicable_bundles:
  - users_jwt
  checks:
  - kind: must_contain_any
    values:
    - users_jwt.key_repository
    - user.data
  scoring:
    combine: all_pass
- id: users_jwt_users_jwt_known_key
  version: '1.0'
  applicable_bundles:
  - users_jwt
  checks:
  - kind: must_contain_any
    values:
    - usersjwt_eval
  scoring:
    combine: all_pass
- id: users_jwt_users_jwt_max_expiration_value
  version: '1.0'
  applicable_bundles:
  - users_jwt
  checks:
  - kind: must_contain_any
    values:
    - '7200'
  scoring:
    combine: all_pass
- id: users_jwt_users_jwt_register_key
  version: '1.0'
  applicable_bundles:
  - users_jwt
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
- id: users_jwt_users_jwt_cap_lifetime
  version: '1.0'
  applicable_bundles:
  - users_jwt
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
