metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: jwt_auth_consumer
  version: 2.4.x
  note: jwt_auth_consumer is a thin event subscriber (service jwt_auth_consumer.subscriber / JwtAuthConsumerSubscriber)
    on the base module's JwtAuthEvents::VALIDATE and ::VALID. It resolves the acting user from a validated
    token's nested drupal.uid -> drupal.uuid -> drupal.name claim (first populated wins), and invalidates
    the token if the user is missing or blocked. No config, no schema, no permissions, no routes. Medium
    cases are grounded in the real validate() behaviour (a blocked vs active namespaced user); hard cases
    in buildable live state (module enablement in core.extension, and an account's blocked status). None
    require an external token round-trip.
questions:
- id: jwt_auth_consumer-claim-order
  input: With the Drupal jwt_auth_consumer module enabled, which claim(s) in a JWT payload determine which
    Drupal user a request authenticates as, and in what order are they checked?
  criteria: JwtAuthConsumerSubscriber reads the nested claim drupal.uid first, then drupal.uuid, then
    drupal.name (first populated wins). uid loads the user by id; uuid/name load by that property.
  bundle: jwt_auth_consumer
  rubric_ref: rubric/jwt_auth_consumer_jwt_auth_consumer_claim_order@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: jwt_auth_consumer-events
  input: How does the jwt_auth_consumer module hook into the base JWT module to authenticate a token —
    what mechanism does it use?
  criteria: It registers an event subscriber (jwt_auth_consumer.subscriber / JwtAuthConsumerSubscriber)
    on JwtAuthEvents::VALIDATE (validate the user + back-fill drupal.uid) and JwtAuthEvents::VALID (load
    and set the account).
  bundle: jwt_auth_consumer
  rubric_ref: rubric/jwt_auth_consumer_jwt_auth_consumer_events@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: jwt_auth_consumer-rejects
  input: Under what conditions will jwt_auth_consumer refuse to authenticate an otherwise correctly-signed
    JWT?
  criteria: validate() invalidates the token when no drupal.uid/uuid/name claim is present, when the named
    user does not exist, or when that user is blocked.
  bundle: jwt_auth_consumer
  rubric_ref: rubric/jwt_auth_consumer_jwt_auth_consumer_rejects@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: jwt_auth_consumer-blocked-user
  input: This Drupal site has a user account named jwtcons_blocked. If a validly-signed JWT presented
    a drupal.name claim of 'jwtcons_blocked', would jwt_auth_consumer authenticate the request? Inspect
    the live account and explain why or why not.
  criteria: No. The account jwtcons_blocked has status 0 (blocked), and JwtAuthConsumerSubscriber::validate()
    invalidates the token for a blocked user, so authentication fails.
  bundle: jwt_auth_consumer
  rubric_ref: rubric/jwt_auth_consumer_jwt_auth_consumer_blocked_user@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/jwt_auth_consumer-m1-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/jwt_auth_consumer-m1-cleanup.sh
- id: jwt_auth_consumer-active-user
  input: This Drupal site has a user account named jwtcons_active. Inspect the live account and state
    whether jwt_auth_consumer would authenticate a validly-signed JWT naming this user, based on its status.
  criteria: Yes. jwtcons_active has status 1 (active / not blocked) and exists, which is exactly what
    validate() requires, so a token naming it (by uid/uuid/name) would authenticate.
  bundle: jwt_auth_consumer
  rubric_ref: rubric/jwt_auth_consumer_jwt_auth_consumer_active_user@1.0
  tags:
  - mode:introspection
  - difficulty:medium
