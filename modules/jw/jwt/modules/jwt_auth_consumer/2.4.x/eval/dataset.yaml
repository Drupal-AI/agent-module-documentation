    cleanup: agent-module-documentation/evaluation/verify/jwt_auth_consumer-m2-cleanup.sh
- id: jwt_auth_consumer-enable
  input: This Drupal site issues JWTs but does not authenticate them, because the module that consumes
    issuer tokens and logs the user in is currently disabled. Enable the correct module so the site accepts
    and authenticates those JWTs. Apply the change to the live site.
  criteria: Enable jwt_auth_consumer (e.g. `drush en jwt_auth_consumer -y`). Verify passes when core.extension
    lists jwt_auth_consumer and the jwt_auth_consumer.subscriber service is present.
  bundle: jwt_auth_consumer
  rubric_ref: rubric/jwt_auth_consumer_jwt_auth_consumer_enable@1.0
