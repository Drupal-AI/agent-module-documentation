metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: jwt_auth_issuer
  version: 2.4.x
  note: 'jwt_auth_issuer exposes the jwt/token endpoint (route jwt_auth_issuer.jwt_auth_issuer_controller_generateToken,
    _user_is_logged_in) that mints a signed JWT for the current user, adds the drupal.uid claim via a
    GENERATE-event subscriber, and can attach a token to the user-login response. Its only setting is
    the boolean jwt_auth_issuer.config -> jwt_in_login_response (config/install default true). Medium/hard
    cases are grounded in that real config object (never jwt.config): mediums read the live value after
    setup forces it false/true; hards toggle it and verify the strict boolean value.'
questions:
- id: jwt_auth_issuer-endpoint
  input: With the Drupal jwt_auth_issuer module enabled, how does a logged-in user obtain a JWT for their
    account?
  criteria: 'Request the jwt/token route (jwt_auth_issuer.jwt_auth_issuer_controller_generateToken), which
    requires a logged-in user (auth: jwt_auth/basic_auth/cookie) and returns a signed JWT. In code, JwtAuth::generateToken()
    does the same.'
  bundle: jwt_auth_issuer
  rubric_ref: rubric/jwt_auth_issuer_jwt_auth_issuer_endpoint@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: jwt_auth_issuer-login-response-setting
  input: What does the jwt_auth_issuer module's jwt_in_login_response setting control, and what is its
    shipped default?
  criteria: jwt_auth_issuer.config -> jwt_in_login_response (boolean, default true) controls whether a
    jwt token is added to the JSON body of the core user-login response (via JwtLoginSubscriber). It is
    toggled by a checkbox on the base module's config form.
  bundle: jwt_auth_issuer
  rubric_ref: rubric/jwt_auth_issuer_jwt_auth_issuer_login_response_setting@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: jwt_auth_issuer-uid-claim
  input: When jwt_auth_issuer mints a token, what makes that token identify the issuing user to jwt_auth_consumer?
  criteria: Its JwtAuthIssuerSubscriber listens on JwtAuthEvents::GENERATE and stamps the current user's
    id as the nested drupal.uid claim, which jwt_auth_consumer then reads to resolve the account.
  bundle: jwt_auth_issuer
  rubric_ref: rubric/jwt_auth_issuer_jwt_auth_issuer_uid_claim@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: jwt_auth_issuer-login-response-off
  input: On this Drupal site, is jwt_auth_issuer currently configured to include a JWT in the user login
    response? Inspect the live configuration and answer.
  criteria: No — jwt_auth_issuer.config jwt_in_login_response is FALSE on this site, so no token is added
    to the login response. Read it with `drush cget jwt_auth_issuer.config jwt_in_login_response`.
  bundle: jwt_auth_issuer
  rubric_ref: rubric/jwt_auth_issuer_jwt_auth_issuer_login_response_off@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/jwt_auth_issuer-m1-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/jwt_auth_issuer-m1-cleanup.sh
- id: jwt_auth_issuer-login-response-on
  input: On this Drupal site, will a successful user login response include a JWT token? Inspect the live
    jwt_auth_issuer configuration and answer.
  criteria: Yes — jwt_auth_issuer.config jwt_in_login_response is TRUE, so JwtLoginSubscriber adds a jwt
    token to the login response. Read it with `drush cget jwt_auth_issuer.config jwt_in_login_response`.
  bundle: jwt_auth_issuer
  rubric_ref: rubric/jwt_auth_issuer_jwt_auth_issuer_login_response_on@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/jwt_auth_issuer-m2-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/jwt_auth_issuer-m2-cleanup.sh
- id: jwt_auth_issuer-turn-off
  input: This Drupal site currently adds a JWT to the user login response, and we want to stop that. Configure
    jwt_auth_issuer so that no JWT is included in the login response. Apply the change to the live site.
  criteria: Set jwt_auth_issuer.config jwt_in_login_response to FALSE (e.g. `drush cset jwt_auth_issuer.config
    jwt_in_login_response 0`, or untick the checkbox on /admin/config/system/jwt). Verify passes when
    the value is strictly FALSE.
  bundle: jwt_auth_issuer
  rubric_ref: rubric/jwt_auth_issuer_jwt_auth_issuer_turn_off@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/jwt_auth_issuer-h1-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/jwt_auth_issuer-h1-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/jwt_auth_issuer-h1-verify.sh
- id: jwt_auth_issuer-turn-on
  input: A decoupled client needs the login endpoint to return a JWT so it can immediately authenticate
    follow-up requests. Configure jwt_auth_issuer so a JWT is included in the user login response. Apply
    the change to the live site.
  criteria: Set jwt_auth_issuer.config jwt_in_login_response to TRUE (e.g. `drush cset jwt_auth_issuer.config
    jwt_in_login_response 1`, or tick the checkbox on /admin/config/system/jwt). Verify passes when the
    value is strictly TRUE.
  bundle: jwt_auth_issuer
  rubric_ref: rubric/jwt_auth_issuer_jwt_auth_issuer_turn_on@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/jwt_auth_issuer-h2-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/jwt_auth_issuer-h2-cleanup.sh
