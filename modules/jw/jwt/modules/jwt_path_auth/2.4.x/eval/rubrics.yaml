rubrics:
- id: jwt_path_auth_jwt_path_auth_how_token_passed
  version: '1.0'
  applicable_bundles:
  - jwt_path_auth
  checks:
  - kind: must_contain_any
    values:
    - query
    - ?jwt
    - jwt=
    - allowed_path_prefixes
    - path prefix
  scoring:
    combine: all_pass
- id: jwt_path_auth_jwt_path_auth_default_prefix
  version: '1.0'
  applicable_bundles:
  - jwt_path_auth
  checks:
  - kind: must_contain_any
    values:
    - /system/files/
    - allowed_path_prefixes
    - /admin/config/system/jwt/path-auth
  scoring:
    combine: all_pass
- id: jwt_path_auth_jwt_path_auth_claims
  version: '1.0'
  applicable_bundles:
  - jwt_path_auth
  checks:
  - kind: must_contain_any
    values:
    - path_auth
    - drupal.path_auth.uid
    - drupal.path_auth.path
    - path claim
  scoring:
    combine: all_pass
- id: jwt_path_auth_jwt_path_auth_known_prefixes
  version: '1.0'
  applicable_bundles:
  - jwt_path_auth
  checks:
  - kind: must_contain_any
    values:
    - /jwtpa-eval/
  scoring:
    combine: all_pass
- id: jwt_path_auth_jwt_path_auth_single_prefix
  version: '1.0'
  applicable_bundles:
  - jwt_path_auth
  checks:
  - kind: must_contain_any
    values:
    - /jwtpa-report/
  scoring:
    combine: all_pass
- id: jwt_path_auth_jwt_path_auth_add_prefix
  version: '1.0'
  applicable_bundles:
  - jwt_path_auth
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
- id: jwt_path_auth_jwt_path_auth_replace_prefixes
  version: '1.0'
  applicable_bundles:
  - jwt_path_auth
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
