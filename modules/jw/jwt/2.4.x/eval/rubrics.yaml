rubrics:
- id: jwt_jwt_algorithms
  version: '1.0'
  applicable_bundles:
  - jwt
  checks:
  - kind: must_contain_any
    values:
    - HS256
    - RS256
    - jwt_hs
    - jwt_rs
  scoring:
    combine: all_pass
- id: jwt_jwt_config_object
  version: '1.0'
  applicable_bundles:
  - jwt
  checks:
  - kind: must_contain_any
    values:
    - jwt.config
    - key_id
    - /admin/config/system/jwt
    - jwt.jwt_config_form
  scoring:
    combine: all_pass
- id: jwt_jwt_encode_service
  version: '1.0'
  applicable_bundles:
  - jwt
  checks:
  - kind: must_contain_any
    values:
    - jwt.transcoder
    - JwtAuthEvents
    - jwt.generate
    - GENERATE
  scoring:
    combine: all_pass
- id: jwt_jwt_configured_key
  version: '1.0'
  applicable_bundles:
  - jwt
  checks:
  - kind: must_contain_any
    values:
    - jwt_eval_hmac
  scoring:
    combine: all_pass
- id: jwt_jwt_configured_algorithm
  version: '1.0'
  applicable_bundles:
  - jwt
  checks:
  - kind: must_contain_any
    values:
    - HS512
  scoring:
    combine: all_pass
- id: jwt_jwt_set_hmac_key
  version: '1.0'
  applicable_bundles:
  - jwt
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
- id: jwt_jwt_switch_algorithm
  version: '1.0'
  applicable_bundles:
  - jwt
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
