- id: sdc_display_sdc_display_add_group
  version: '1.0'
  applicable_bundles:
  - sdc_display
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
