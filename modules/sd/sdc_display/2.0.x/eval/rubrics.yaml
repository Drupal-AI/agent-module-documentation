rubrics:
- id: sdc_display_sdc_display_component_tags
  version: '1.0'
  applicable_bundles:
  - sdc_display
  checks:
  - kind: must_contain_any
    values:
    - sdc_display:field_formatter
    - sdc_display:view_mode
    - tag
  scoring:
    combine: all_pass
- id: sdc_display_sdc_display_field_group_formatter
  version: '1.0'
  applicable_bundles:
  - sdc_display
  checks:
  - kind: must_contain_any
    values:
    - sdc_display
    - Single Directory Component
    - view
  scoring:
    combine: all_pass
- id: sdc_display_sdc_display_config_location
  version: '1.0'
  applicable_bundles:
  - sdc_display
  checks:
  - kind: must_contain_any
    values:
    - third_party_settings
    - sdc_display
    - machine_name
    - enabled
  scoring:
    combine: all_pass
- id: sdc_display_sdc_display_known_viewmode
  version: '1.0'
