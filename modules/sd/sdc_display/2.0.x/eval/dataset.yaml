metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: sdc_display
  version: 2.0.x
  note: 'SDC Display renders fields, view modes, and field groups through Single Directory Components.
    Config is stored on entity_view_display: per-view-mode/per-field third_party_settings.sdc_display
    = {enabled, component:{machine_name}, mappings:{static,dynamic}} and a field-group formatter with
    id ''sdc_display'' (view context). Component pickers are populated via tags sdc_display:field_formatter
    and sdc_display:view_mode (component_tags.yml). Depends on cl_editorial + sdc_tags. Medium cases read
    a known mapping/group from live display config; hard cases enable a whole-view-mode component mapping
    (verify checks enabled + component.machine_name) and add an sdc_display field group (verify checks
    a group with format_type sdc_display). Grounded in real components on this site (e.g. olivero:teaser).
    All state is display config (no field storage), so cases are verifiable on the shared site.'
questions:
- id: sdc_display-component-tags
  input: In the Drupal sdc_display module, how do you make a single directory component available in the
    field or view-mode configuration pickers? Name the tags involved.
  criteria: Tag the component with sdc_display:field_formatter (to offer it for fields/field groups) or
    sdc_display:view_mode (to offer it for whole view modes) in its *.component.yml; these tags are declared
    in sdc_display.component_tags.yml via cl_editorial's sdc_tags.
  bundle: sdc_display
  rubric_ref: rubric/sdc_display_sdc_display_component_tags@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: sdc_display-field-group-formatter
  input: Does sdc_display provide a Field Group formatter? What is its id and which display context does
    it support?
  criteria: 'Yes: the field_group FieldGroupFormatter with id ''sdc_display'' (label ''Single Directory
    Component''), supported context ''view'' only. It renders a group''s fields through a component.'
  bundle: sdc_display
  rubric_ref: rubric/sdc_display_sdc_display_field_group_formatter@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: sdc_display-config-location
  input: Where does sdc_display store the mapping between a view mode (or field) and its single directory
    component, and what keys does that config carry?
  criteria: 'On the entity_view_display config in third_party_settings.sdc_display: enabled, component.machine_name,
    and mappings (static/dynamic props and slots). Depends on cl_editorial + sdc_tags.'
  bundle: sdc_display
  rubric_ref: rubric/sdc_display_sdc_display_config_location@1.0
  tags:
  - mode:recipe
  - difficulty:easy
