metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: phone_number
  version: 2.0.x
  note: 'Phone Number defines a ''phone_number'' field type (columns value [E.164], country, local_number,
    extension), default widget phone_number_default, default formatter phone_number_international (also
    phone_number_local, phone_number_country), and a PhoneNumber validation constraint backed by giggsey/libphonenumber-for-php.
    Field settings: allowed_countries, allowed_types, extension_field; storage setting: unique; widget
    settings: default_country, country_selection, placeholder, phone_size. All parsing/formatting is in
    the phone_number.util service. No admin settings page (configure=null) - configured per field. Medium/hard
    cases create real phone_number fields on the Article content type (namespaced field_pn_*) and inspect/verify
    the live field config; each reset/cleanup deletes only its own field storage+instance (never an unscoped
    field purge).'
questions:
- id: phone-number-field-type
  input: What field type does the phone_number module provide, what does it store, and what are its default
    widget and formatter?
  criteria: 'It provides the ''phone_number'' field type, storing four columns: value (E.164 number),
    country (ISO code), local_number, and an optional extension. Default widget is phone_number_default
    and default formatter is phone_number_international; a PhoneNumber validation constraint validates
    input via libphonenumber.'
  bundle: phone_number
  rubric_ref: rubric/phone_number_phone_number_field_type@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: phone-number-settings
  input: 'Which settings let me restrict a phone_number field to certain countries, require uniqueness,
    set a default country, and show it as a clickable tel: link?'
  criteria: 'Field setting allowed_countries restricts allowed countries (allowed_types restricts number
    types); storage setting unique enforces uniqueness; widget setting default_country sets the default
    country (with country_selection, placeholder, phone_size); the international/local formatters have
    an as_link setting to render a tel: link.'
  bundle: phone_number
  rubric_ref: rubric/phone_number_phone_number_settings@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: phone-number-util-service
  input: How can I validate or format a phone number programmatically with the phone_number module?
  criteria: 'Use the phone_number.util service (PhoneNumberUtilInterface), which wraps giggsey/libphonenumber-for-php.
    testPhoneNumber() validates (throwing CountryException/ParseException/TypeException on invalid input),
    getCallableNumber() returns the E.164 number, getRfc3966Uri() the tel: URI, and getCountryOptions()/getTypeOptions()
    list countries/types.'
  bundle: phone_number
  rubric_ref: rubric/phone_number_phone_number_util_service@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: phone-number-allowed-countries
  input: The Article content type on this site has a phone_number field named field_pn_known that is restricted
    to certain countries. Inspect the live field configuration and list which countries are allowed.
  criteria: field_pn_known (type phone_number) on node.article has field settings allowed_countries =
    ['US', 'GB'], so only US and GB numbers are allowed.
  bundle: phone_number
  rubric_ref: rubric/phone_number_phone_number_allowed_countries@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/phone_number-allowed-countries-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/phone_number-allowed-countries-cleanup.sh
- id: phone-number-unique-setting
  input: Does the phone_number field field_pn_uniq on the Article content type enforce that a phone number
    can only be used once? Inspect the live field storage configuration and give the value of the relevant
    setting.
  criteria: 'Yes: the field storage field_pn_uniq has setting unique = 1 (PHONE_NUMBER_UNIQUE_YES), so
    the phone number must be unique across entities.'
  bundle: phone_number
  rubric_ref: rubric/phone_number_phone_number_unique_setting@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/phone_number-unique-setting-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/phone_number-unique-setting-cleanup.sh
- id: phone-number-create-field
  input: On this site, add a Phone Number field named field_pn_task to the Article content type (using
    the phone_number module's field type), and apply it to the live site.
  criteria: Create a FieldStorageConfig field_pn_task on node with type 'phone_number', and a FieldConfig
    for the article bundle. Verified by node.article having a field field_pn_task whose type is phone_number.
  bundle: phone_number
  rubric_ref: rubric/phone_number_phone_number_create_field@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/phone_number-create-field-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/phone_number-create-field-reset.sh
    verify: agent-module-documentation/evaluation/verify/phone_number-create-field-verify.sh
- id: phone-number-us-only-field
  input: I need a phone number field on my Articles that only accepts United States phone numbers. Add
