metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: sms_phone_number
  version: 2.0.x
  note: 'SMS Phone Number extends phone_number with SMS verification + TFA. It defines an ''sms_phone_number''
    field type (subclass of PhoneNumberItem) adding field settings verify (none/optional/required) and
    message, and tracking a verified status. Global config object sms_phone_number.settings has tfa_field
    (user phone field for TFA) and verification_secret. Permission ''bypass phone number verification
    requirement''. SMS is sent via a callback (default SMS Framework sms_send), overridable with hook_sms_phone_number_send_sms_callback_alter.
    Actual SMS delivery needs an external gateway, so cases are grounded ONLY in local config: creating
    an sms_phone_number field with a verify setting, and the sms_phone_number.settings.tfa_field value;
    no case sends a real SMS. Fields are namespaced field_spn_* and each reset/cleanup deletes only its
    own field storage+instance. sms_phone_number.settings baseline: absent/empty (reset/cleanup restore
    that).'
questions:
- id: sms-phone-number-what-it-adds
  input: What does the sms_phone_number submodule add on top of the phone_number field, and which field
    setting controls whether a number must be verified?
  criteria: It adds an sms_phone_number field type (extending phone_number) with SMS verification and
    a verified status, plus SMS two-factor authentication (a TFA plugin). The field setting 'verify' controls
    verification and takes none / optional / required.
  bundle: sms_phone_number
  rubric_ref: rubric/sms_phone_number_sms_phone_number_what_it_adds@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: sms-phone-number-sms-sending
  input: How does sms_phone_number actually send a verification code by SMS, and how can I make it use
    my own SMS provider?
  criteria: It sends through an SMS callback that defaults to SMS Framework's sms_send when installed.
    You override it by implementing hook_sms_phone_number_send_sms_callback_alter(&$send_sms_callback)
    to point at your own callback (which receives the international number and message). Without a gateway,
    no code can be delivered (check isSmsEnabled()).
  bundle: sms_phone_number
  rubric_ref: rubric/sms_phone_number_sms_phone_number_sms_sending@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: sms-phone-number-settings-and-permission
  input: Where does sms_phone_number store its global settings for two-factor auth, and what permission
    lets someone save a number that hasn't been verified?
  criteria: Global settings live in the config object sms_phone_number.settings (tfa_field = the user
    phone field used for TFA; verification_secret). The permission 'bypass phone number verification requirement'
    allows saving an unverified number even when verify is required.
  bundle: sms_phone_number
  rubric_ref: rubric/sms_phone_number_sms_phone_number_settings_and_permission@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: sms-phone-number-field-verify-setting
  input: The Article content type on this site has an sms_phone_number field named field_spn_known. Does
    it require the phone number to be SMS-verified? Inspect the live field configuration and give the
    value of the verify setting.
  criteria: field_spn_known (type sms_phone_number) on node.article has field setting verify = 'required',
    so the number must be SMS-verified.
  bundle: sms_phone_number
  rubric_ref: rubric/sms_phone_number_sms_phone_number_field_verify_setting@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/sms_phone_number-field-verify-setting-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/sms_phone_number-field-verify-setting-cleanup.sh
- id: sms-phone-number-tfa-field
  input: Which user phone field is sms_phone_number configured to use for SMS two-factor authentication
    on this site? Inspect the live configuration and give the value.
  criteria: sms_phone_number.settings:tfa_field is 'field_spn_tfa' on this site.
  bundle: sms_phone_number
  rubric_ref: rubric/sms_phone_number_sms_phone_number_tfa_field@1.0
