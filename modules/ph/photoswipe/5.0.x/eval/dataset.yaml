metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: photoswipe
  version: 5.0.x
  note: 'PhotoSwipe exposes two image/media field formatters, a global settings config object, a Twig
    function, an options-alter hook, and requires an external JS library. Cases are `recipe` (response-graded):
    they probe documented facts an agent would otherwise read source to answer; no site mutation.'
questions:
- id: photoswipe-formatter-name
  input: On a Drupal 11 site I want a multi-value image field on my Article content type to open its images
    in a PhotoSwipe lightbox gallery. Which display formatter do I select and where?
  criteria: Select the 'Photoswipe' formatter (photoswipe_field_formatter) as the field's format under
    Manage display for the content type.
  bundle: photoswipe
  rubric_ref: rubric/photoswipe_photoswipe_formatter_name@1.0
  tags:
  - mode:recipe
- id: photoswipe-thumbnail-vs-lightbox-style
  input: In the PhotoSwipe field formatter settings, which two settings control the on-page thumbnail
    image style versus the large image shown inside the lightbox?
  criteria: photoswipe_thumbnail_style sets the on-page thumbnail image style; photoswipe_image_style
    sets the modal/lightbox image style.
  bundle: photoswipe
  rubric_ref: rubric/photoswipe_photoswipe_thumbnail_vs_lightbox_style@1.0
  tags:
  - mode:recipe
- id: photoswipe-library-required
  input: I enabled the PhotoSwipe module but the lightbox does not work and the status report shows a
    library error. The module's composer require is empty — how do I provide the PhotoSwipe JavaScript
    library?
  criteria: 'Provide the PhotoSwipe 5 library yourself: composer require npm-asset/photoswipe:^5 (or bower-asset/photoswipe:^5)
    into /libraries/photoswipe, or enable the CDN option on the settings form.'
  bundle: photoswipe
  rubric_ref: rubric/photoswipe_photoswipe_library_required@1.0
  tags:
  - mode:recipe
- id: photoswipe-gallery-grouping-views
  input: Using the PhotoSwipe formatter on an image field in a View, the images open individually instead
    of as one gallery. How do I group them into a single gallery?
  criteria: Add the CSS class 'photoswipe-gallery' to a wrapper (the field wrapper, or the Views row/inner
    class) so the images form one gallery.
  bundle: photoswipe
  rubric_ref: rubric/photoswipe_photoswipe_gallery_grouping_views@1.0
  tags:
  - mode:recipe
- id: photoswipe-responsive-formatter
  input: I want to use the 'Photoswipe Responsive' display formatter. What core module must be enabled
    first, and what is the formatter id?
  criteria: Enable the core Responsive Image (responsive_image) module first; the formatter is photoswipe_responsive_field_formatter.
  bundle: photoswipe
  rubric_ref: rubric/photoswipe_photoswipe_responsive_formatter@1.0
  tags:
  - mode:recipe
- id: photoswipe-options-alter-hook
  input: In a custom Drupal module I want to change the options passed to the PhotoSwipe JavaScript library
    (e.g. disable share buttons). Which hook do I implement?
  criteria: Implement hook_photoswipe_js_options_alter(array &$settings) to alter the options passed to
    PhotoSwipe.
  bundle: photoswipe
  rubric_ref: rubric/photoswipe_photoswipe_options_alter_hook@1.0
  tags:
  - mode:recipe
- id: photoswipe-settings-route
  input: Where are PhotoSwipe's global JS settings configured, and what is the config object / settings
    route name?
  criteria: At Admin > Config > Media > PhotoSwipe (/admin/config/media/photoswipe), route and config
    object photoswipe.settings.
  bundle: photoswipe
  rubric_ref: rubric/photoswipe_photoswipe_settings_route@1.0
  tags:
  - mode:recipe
- id: photoswipe-twig-attach
  input: How do I attach a PhotoSwipe gallery inside a custom Twig template, and how do I override an
    option like bgOpacity there?
  criteria: 'Use the attach_photoswipe() Twig function; pass an options array to override, e.g. attach_photoswipe({''bgOpacity'':
    0.2}).'
  bundle: photoswipe
  rubric_ref: rubric/photoswipe_photoswipe_twig_attach@1.0
  tags:
  - mode:recipe
