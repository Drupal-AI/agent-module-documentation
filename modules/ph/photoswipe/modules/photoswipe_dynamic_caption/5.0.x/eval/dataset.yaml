metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: photoswipe_dynamic_caption
  version: 5.0.x
  note: Submodule of photoswipe. It adds a caption third-party setting to the PhotoSwipe field formatters,
    a caption-source resolver, and a global settings config object, and needs an external caption JS library.
    Cases are `recipe` (response-graded); no site mutation.
questions:
- id: psdc-enable-captions
  input: I want captions to appear inside the PhotoSwipe lightbox on my Drupal 11 site. Which module do
    I enable, and what does it depend on?
  criteria: Enable the PhotoSwipe Dynamic Caption submodule (photoswipe_dynamic_caption), which depends
    on the main photoswipe module.
  bundle: photoswipe_dynamic_caption
  rubric_ref: rubric/photoswipe_dynamic_caption_psdc_enable_captions@1.0
  tags:
  - mode:recipe
- id: psdc-caption-source
  input: After enabling PhotoSwipe Dynamic Caption, where do I pick what text is used as the lightbox
    caption, and what are the built-in source options?
  criteria: 'In the field formatter''s third-party settings on Manage display, the ''Photoswipe image
    caption'' select: image title, image alt, entity label, media entity name, another field, or custom
    (tokens).'
  bundle: photoswipe_dynamic_caption
  rubric_ref: rubric/photoswipe_dynamic_caption_psdc_caption_source@1.0
  tags:
  - mode:recipe
- id: psdc-custom-token-caption
  input: I want to build the PhotoSwipe caption from a custom token pattern. Which caption option do I
    choose, and what module enables the token browser?
  criteria: Choose the 'Custom (with tokens)' caption option and fill the custom textarea; installing
    the Token module adds a token browser.
  bundle: photoswipe_dynamic_caption
  rubric_ref: rubric/photoswipe_dynamic_caption_psdc_custom_token_caption@1.0
  tags:
  - mode:recipe
- id: psdc-caption-library
  input: The status report says the PhotoSwipe dynamic caption plugin library is missing. How do I install
    it?
  criteria: 'Provide the library: composer require npm-asset/photoswipe-dynamic-caption-plugin:^1.2 into
    /libraries/photoswipe-dynamic-caption-plugin, or enable the CDN option on the main PhotoSwipe settings
    form.'
  bundle: photoswipe_dynamic_caption
  rubric_ref: rubric/photoswipe_dynamic_caption_psdc_caption_library@1.0
  tags:
  - mode:recipe
- id: psdc-caption-position
  input: Which config object and setting controls whether PhotoSwipe captions are placed automatically,
    below, or aside the image, and what is the settings route?
  criteria: The options.type key (auto/below/aside) on the photoswipe_dynamic_caption.settings config
    object, edited at /admin/config/media/photoswipe_dynamic_caption (route photoswipe_dynamic_caption.settings).
  bundle: photoswipe_dynamic_caption
  rubric_ref: rubric/photoswipe_dynamic_caption_psdc_caption_position@1.0
  tags:
  - mode:recipe
- id: psdc-views-limitation
  input: Why does the PhotoSwipe caption setting not show up when I configure the Photoswipe formatter
    for an image field inside a View?
  criteria: 'It is a Drupal core limitation (issue 2686145): formatter third-party settings are missing
    from the Views UI; you must patch core until it is fixed.'
  bundle: photoswipe_dynamic_caption
  rubric_ref: rubric/photoswipe_dynamic_caption_psdc_views_limitation@1.0
  tags:
  - mode:recipe
