metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: phpmailer_smtp
  version: 2.3.x
  note: PHPMailer SMTP provides a single core Mail plugin plus a settings/format config pair and a permission;
    it does not auto-swap the mail system. Cases are `recipe` (response-graded) probing documented facts
    an agent would otherwise read source to answer; no site mutation.
questions:
- id: phpmailer-smtp-mail-plugin-id
  input: On a Drupal 11 site, which mail backend does the PHPMailer SMTP module provide and what is its
    plugin id, so I can route mail through it?
  criteria: It provides a core Mail plugin, PhpMailerSmtp (id `phpmailer_smtp`), which extends the PHPMailer
    library class and implements Drupal's MailInterface.
  bundle: phpmailer_smtp
  rubric_ref: rubric/phpmailer_smtp_phpmailer_smtp_mail_plugin_id@1.0
  tags:
  - mode:recipe
- id: phpmailer-smtp-activate-plugin
  input: I enabled the phpmailer_smtp module but mail still goes out via PHP mail(). How do I make Drupal
    actually send through it?
  criteria: Enabling the module does not auto-swap the mail system. Select PHPMailer SMTP as Sender/Formatter
    via the Mail System (mailsystem) module, or set system.mail interface.default to phpmailer_smtp.
  bundle: phpmailer_smtp
  rubric_ref: rubric/phpmailer_smtp_phpmailer_smtp_activate_plugin@1.0
  tags:
  - mode:recipe
- id: phpmailer-smtp-connection-settings
  input: Which config object and keys hold the SMTP host, port and encryption protocol for the PHPMailer
    SMTP module on Drupal?
  criteria: 'The phpmailer_smtp.settings config object: smtp_host, smtp_port (default 25), and smtp_protocol
    ('''' | ssl | tls) among others.'
  bundle: phpmailer_smtp
  rubric_ref: rubric/phpmailer_smtp_phpmailer_smtp_connection_settings@1.0
  tags:
  - mode:recipe
- id: phpmailer-smtp-authentication
  input: How do I configure username/password authentication versus OAuth2 for outgoing SMTP mail with
    the PHPMailer SMTP module?
  criteria: 'The smtp_authentication_type key: ''basic_auth'' uses smtp_username/smtp_password; any other
    value is a PhpmailerOauth2 plugin id, engaging XOAUTH2 OAuth2 authentication.'
  bundle: phpmailer_smtp
  rubric_ref: rubric/phpmailer_smtp_phpmailer_smtp_authentication@1.0
  tags:
  - mode:recipe
- id: phpmailer-smtp-library-dep
  input: What external PHP library does the Drupal phpmailer_smtp module depend on, and how is it installed?
  criteria: It requires the phpmailer/phpmailer library (^6.11), pulled in automatically by `composer
    require drupal/phpmailer_smtp` (Ludwig is supported without Composer).
  bundle: phpmailer_smtp
  rubric_ref: rubric/phpmailer_smtp_phpmailer_smtp_library_dep@1.0
  tags:
  - mode:recipe
- id: phpmailer-smtp-permission
  input: Which permission controls access to the PHPMailer SMTP configuration forms on a Drupal site?
  criteria: 'The single permission ''administer phpmailer smtp settings'' (restrict access: TRUE) gates
    both the transport settings and format forms.'
  bundle: phpmailer_smtp
  rubric_ref: rubric/phpmailer_smtp_phpmailer_smtp_permission@1.0
  tags:
  - mode:recipe
- id: phpmailer-smtp-vs-smtp-module
  input: How does the phpmailer_smtp module differ from the older smtp module for sending Drupal mail
    via SMTP?
  criteria: Both wrap PHPMailer, but phpmailer_smtp tracks the current PHPMailer 6 release and does NOT
    auto-swap the mail system on enable — you assign its plugin via Mail System or system.mail (unlike
    smtp's smtp_on toggle).
  bundle: phpmailer_smtp
  rubric_ref: rubric/phpmailer_smtp_phpmailer_smtp_vs_smtp_module@1.0
  tags:
  - mode:recipe
