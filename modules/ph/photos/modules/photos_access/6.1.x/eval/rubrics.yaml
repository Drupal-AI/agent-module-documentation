rubrics:
- id: photos_access_photos_access_levels
  version: '1.0'
  applicable_bundles:
  - photos_access
  checks:
  - kind: must_contain_any
    values:
    - Open
    - Locked
    - Password
    - viewid
    - User list
  scoring:
    combine: all_pass
- id: photos_access_photos_access_master_switch
  version: '1.0'
  applicable_bundles:
  - photos_access
  checks:
  - kind: must_contain_any
    values:
    - photos_access_photos
    - photos.settings
    - photos_access_
  scoring:
    combine: all_pass
- id: photos_access_photos_access_enforcement
  version: '1.0'
  applicable_bundles:
  - photos_access
  checks:
  - kind: must_contain_any
    values:
    - node grant
    - node access
    - hook_node_grants
    - /photos_privacy/pass
    - photos_access.page
  scoring:
    combine: all_pass
- id: photos_access_photos_access_is_enabled
  version: '1.0'
  applicable_bundles:
  - photos_access
  checks:
  - kind: must_contain_any
    values:
    - '1'
    - 'true'
    - enabled
    - 'on'
    - photos_access_photos
  scoring:
    combine: all_pass
- id: photos_access_photos_access_enable
  version: '1.0'
  applicable_bundles:
  - photos_access
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
