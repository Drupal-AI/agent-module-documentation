rubrics:
- id: photos_photos_album_model
  version: '1.0'
  applicable_bundles:
  - photos
  checks:
  - kind: must_contain_any
    values:
    - photos
    - photos_image
    - album
  scoring:
    combine: all_pass
- id: photos_photos_settings_route
  version: '1.0'
  applicable_bundles:
  - photos
  checks:
  - kind: must_contain_any
    values:
    - /admin/config/media/photos
    - photos.admin.config
    - photos.settings
  scoring:
    combine: all_pass
- id: photos_photos_permissions
  version: '1.0'
  applicable_bundles:
  - photos
  checks:
  - kind: must_contain_any
    values:
    - create photo
    - view photo
    - edit own photo
    - view original
    - edit any photo
  scoring:
    combine: all_pass
- id: photos_photos_known_num
  version: '1.0'
  applicable_bundles:
  - photos
  checks:
  - kind: must_contain_any
    values:
    - '12'
  scoring:
    combine: all_pass
- id: photos_photos_known_cover
  version: '1.0'
  applicable_bundles:
  - photos
  checks:
  - kind: must_contain_any
    values:
    - medium
  scoring:
    combine: all_pass
- id: photos_photos_list_size
  version: '1.0'
  applicable_bundles:
  - photos
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
- id: photos_photos_set_num
  version: '1.0'
  applicable_bundles:
  - photos
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
