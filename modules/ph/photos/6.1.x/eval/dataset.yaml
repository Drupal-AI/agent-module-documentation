metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: photos
  version: 6.1.x
  note: 'Photos is a photo-album module: an album is a node of type ''photos'' and each picture is a photos_image
    content entity. Global behaviour lives in the config object photos.settings (main form route photos.admin.config
    at /admin/config/media/photos; the ''configure''/field-UI route is photos.admin at /admin/structure/photos).
    It defines 7 permissions (view/create photo, edit/delete own/any photo, view original) and an upload
    service photos.upload. Medium/hard cases are grounded ONLY in the photos.settings config object (safe
    on the shared site); they deliberately avoid creating/deleting album nodes. Baselines: photos_num=5,
    photos_cover_imagesize=thumbnail, photos_display_list_imagesize=large.'
questions:
- id: photos-album-model
  input: In the Drupal Photos module, what content type represents a photo album, and how are the individual
    pictures stored?
  criteria: An album is a node of the 'photos' (Photo album) content type; the individual pictures are
    stored as photos_image content entities that belong to the album node.
  bundle: photos
  rubric_ref: rubric/photos_photos_album_model@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: photos-settings-route
  input: Where do I configure the Photos module's global settings (image sizes, per-page counts, etc.),
    and which config object stores them?
  criteria: Global settings are at /admin/config/media/photos (route photos.admin.config, PhotosAdminSettingsForm)
    and are stored in the photos.settings config object. The structure/field-UI page is /admin/structure/photos
    (route photos.admin).
  bundle: photos
  rubric_ref: rubric/photos_photos_settings_route@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: photos-permissions
  input: Which permissions does the Photos module define for working with individual photos?
  criteria: 'It defines: view photo, create photo, edit own photo, delete own photo, edit any photo (restricted),
    delete any photo (restricted), and view original. Admin/config routes use the core ''administer nodes''
    permission.'
  bundle: photos
  rubric_ref: rubric/photos_photos_permissions@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: photos-known-num
  input: On this Drupal site, how many image upload slots does the Photos upload form show? Inspect the
    live Photos configuration and give the number.
  criteria: 12 - photos.settings:photos_num is set to 12 on this site.
  bundle: photos
  rubric_ref: rubric/photos_photos_known_num@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/photos-known-num-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/photos-known-num-cleanup.sh
- id: photos-known-cover
  input: On this Drupal site, which image style does the Photos module use for album cover images? Inspect
    the live Photos configuration and name the image style.
  criteria: The cover image style is 'medium' - photos.settings:photos_cover_imagesize is set to medium.
  bundle: photos
  rubric_ref: rubric/photos_photos_known_cover@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/photos-known-cover-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/photos-known-cover-cleanup.sh
- id: photos-list-size
  input: On this Drupal site, configure the Photos module so that photos shown in the album LIST view
    use the 'thumbnail' image style. Apply the change to the live site configuration.
  criteria: photos.settings:photos_display_list_imagesize is set to 'thumbnail'.
  bundle: photos
  rubric_ref: rubric/photos_photos_list_size@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
