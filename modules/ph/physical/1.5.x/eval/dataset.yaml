metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: physical
  version: 1.5.x
  note: Physical Fields exposes two field types and a PHP value-object API (Weight/Length/Area/Volume
    + unit classes + Calculator) with unit conversion. It has no admin UI, routes, or permissions. Cases
    are `recipe` (response-graded) since they probe documented facts an agent would otherwise read source
    to answer; no site mutation.
questions:
- id: physical-field-types
  input: On a Drupal 11 site, which two field types does the Physical Fields module provide for storing
    measurements, and what does each store?
  criteria: physical_measurement stores a single number plus a unit (with a measurement_type storage setting);
    physical_dimensions stores length, width, and height sharing one unit.
  bundle: physical
  rubric_ref: rubric/physical_physical_field_types@1.0
  tags:
  - mode:recipe
- id: physical-create-weight
  input: In PHP on a Drupal site, create a weight value object of 100 kilograms using the Physical Fields
    API. Show the code.
  criteria: 'Uses the value object: new Weight(''100'', WeightUnit::KILOGRAM) with the number passed as
    a string.'
  bundle: physical
  rubric_ref: rubric/physical_physical_create_weight@1.0
  tags:
  - mode:recipe
- id: physical-convert-units
  input: Given a Physical Fields Weight value object in kilograms, how do I convert it to pounds in code?
  criteria: Call ->convert(WeightUnit::POUND); convert() returns a new Weight in the target unit.
  bundle: physical
  rubric_ref: rubric/physical_physical_convert_units@1.0
  tags:
  - mode:recipe
- id: physical-add-multiply
  input: Using the Physical Fields value-object API, how do I add two weights together and how do I multiply
    a weight by a quantity? Note anything about units and mutability.
  criteria: $a->add($b) returns a new measurement (add auto-converts $b to $a's unit); $a->multiply('3')
    multiplies by a scalar string. Value objects are immutable — each op returns a new instance.
  bundle: physical
  rubric_ref: rubric/physical_physical_add_multiply@1.0
  tags:
  - mode:recipe
- id: physical-units-available
  input: What weight and length units does Physical Fields support (e.g. metric vs imperial), and which
    class holds the weight unit constants?
  criteria: WeightUnit defines mg, g, kg, oz, lb, ct; LengthUnit defines mm, cm, m, km, in, ft, nautical
    mile (M), etc. Units are class constants on WeightUnit / LengthUnit.
  bundle: physical
  rubric_ref: rubric/physical_physical_units_available@1.0
  tags:
  - mode:recipe
- id: physical-read-field
  input: I have a physical_measurement field on an entity in Drupal. How do I read its value as a measurement
    value object in code?
  criteria: Get the field item and call $item->toMeasurement() to hydrate the matching value object (Weight,
    Length, ...); raw $item->number and $item->unit columns are also available.
  bundle: physical
  rubric_ref: rubric/physical_physical_read_field@1.0
  tags:
  - mode:recipe
- id: physical-commerce-shipping
  input: Why would a Drupal Commerce store install the Physical Fields module?
  criteria: Commerce uses Physical Fields to model product weight and package dimensions (with units and
    conversion) that shipping calculations rely on.
  bundle: physical
  rubric_ref: rubric/physical_physical_commerce_shipping@1.0
  tags:
  - mode:recipe
- id: physical-bcmath-precision
  input: How does Physical Fields perform arithmetic on measurement numbers, and why are numbers passed
    as strings rather than floats?
  criteria: Arithmetic runs through the Calculator helper, a bcmath wrapper that keeps numbers as strings
    to avoid floating-point precision loss (safe for e-commerce); passing a float throws an InvalidArgumentException.
  bundle: physical
  rubric_ref: rubric/physical_physical_bcmath_precision@1.0
  tags:
  - mode:recipe
