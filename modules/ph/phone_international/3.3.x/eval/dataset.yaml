    verify: agent-module-documentation/evaluation/verify/phone_international-set-country-verify.sh
- id: phone_international-enable-cdn
  input: On this Drupal site, configure phone_international to load the intl-tel-input assets from the
    CDN (enable the CDN option). Apply the change live.
  criteria: Set phone_international.settings.cdn = TRUE (via the settings form at /admin/config/phone_international
    or config).
