metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: phone_international
  version: 3.3.x
  note: 'International Phone defines a phone_international field type (varchar 256; preSave reformats
    to E.164 via the phone_international.validate service / libphonenumber), a country-aware widget phone_international_widget
    (settings initial_country [default PT], geolocation, preferred_countries, countries all/exclude/include,
    exclude_countries) and a formatter phone_international_formatter (valid -> tel: link, invalid -> plain
    text). One global setting: phone_international.settings.cdn (bool). Settings route phone_international.settings
    at /admin/config/phone_international (permission ''administer site configuration''). Drush command
    phone_international:plugin (aliases piplugin/pi-plugin) installs intl-tel-input locally. Medium cases
    read a real widget setting and the live cdn value; hard cases set a widget''s default country and
    enable cdn, verified against live config.'
questions:
- id: phone_international-field-plugins
  input: In the phone_international module, what field type, widget, and formatter does it provide, and
    what normalization happens to a phone number when it is saved?
  criteria: 'Field type phone_international, default widget phone_international_widget (intl-tel-input
    country selector), default formatter phone_international_formatter (renders valid numbers as tel:
    links). On save, preSave() reformats the value to E.164 via the phone_international.validate service
    (libphonenumber).'
  bundle: phone_international
  rubric_ref: rubric/phone_international_phone_international_field_plugins@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: phone_international-service
  input: Which service does phone_international expose for validating and formatting phone numbers programmatically,
    and what are its methods?
  criteria: 'The service phone_international.validate (ValidatingService, IsValidInterface): isValidNumber(string)
    returns bool via libphonenumber, and formatNumber(string) returns the number reformatted to E.164.'
  bundle: phone_international
  rubric_ref: rubric/phone_international_phone_international_service@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: phone_international-drush
  input: How do I install the intl-tel-input JavaScript library locally for phone_international instead
    of using the CDN? Name the command.
  criteria: Run the Drush command phone_international:plugin (aliases piplugin / pi-plugin), which downloads
    intl-tel-input into the libraries/ directory. Then set phone_international.settings.cdn = false to
    serve it locally.
  bundle: phone_international
  rubric_ref: rubric/phone_international_phone_international_drush@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: phone_international-known-field
  input: On this Drupal site, the Article content type has an International Phone field named field_pi_known.
    Inspect the live form display and state the default (initial) country configured on its widget.
  criteria: In core.entity_form_display.node.article.default, the field_pi_known component (widget phone_international_widget)
    has settings.initial_country = GB.
  bundle: phone_international
  rubric_ref: rubric/phone_international_phone_international_known_field@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/phone_international-known-field-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/phone_international-known-field-cleanup.sh
- id: phone_international-cdn-value
  input: On this site, is phone_international configured to load the intl-tel-input assets from a CDN?
    Inspect the live configuration and answer with the current value of the CDN setting.
  criteria: phone_international.settings.cdn is true — the CDN option is enabled.
  bundle: phone_international
  rubric_ref: rubric/phone_international_phone_international_cdn_value@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/phone_international-cdn-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/phone_international-cdn-cleanup.sh
- id: phone_international-set-country
  input: On this Drupal site, the Article content type has an International Phone field field_pi_task
    whose widget currently defaults to Portugal. Change the widget so that new phone inputs default to
    the United Kingdom (initial country GB). Apply the change to the live form display.
  criteria: In core.entity_form_display.node.article.default set the field_pi_task widget (phone_international_widget)
    settings.initial_country to 'GB' and save.
  bundle: phone_international
  rubric_ref: rubric/phone_international_phone_international_set_country@1.0
  tags:
