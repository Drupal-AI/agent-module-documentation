rubrics:
- id: phone_international_phone_international_field_plugins
  version: '1.0'
  applicable_bundles:
  - phone_international
  checks:
  - kind: must_contain_any
    values:
    - phone_international_widget
    - phone_international_formatter
    - E164
    - E.164
    - libphonenumber
  scoring:
    combine: all_pass
- id: phone_international_phone_international_service
  version: '1.0'
  applicable_bundles:
  - phone_international
  checks:
  - kind: must_contain_any
    values:
    - phone_international.validate
    - isValidNumber
    - formatNumber
  scoring:
    combine: all_pass
- id: phone_international_phone_international_drush
  version: '1.0'
  applicable_bundles:
  - phone_international
  checks:
  - kind: must_contain_any
    values:
    - phone_international:plugin
    - piplugin
    - pi-plugin
  scoring:
    combine: all_pass
- id: phone_international_phone_international_known_field
  version: '1.0'
  applicable_bundles:
  - phone_international
  checks:
  - kind: must_contain_any
    values:
    - GB
  scoring:
    combine: all_pass
- id: phone_international_phone_international_cdn_value
  version: '1.0'
  applicable_bundles:
  - phone_international
  checks:
  - kind: must_contain_any
    values:
    - 'true'
    - enabled
    - 'yes'
  scoring:
    combine: all_pass
- id: phone_international_phone_international_set_country
  version: '1.0'
  applicable_bundles:
  - phone_international
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
- id: phone_international_phone_international_enable_cdn
  version: '1.0'
  applicable_bundles:
  - phone_international
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
