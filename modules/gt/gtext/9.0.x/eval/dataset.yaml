metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: gtext
  version: 9.0.x
  note: 'gText is a locale STRING-TRANSLATION utility (built on core locale), NOT a fonts/typography module.
    It adds a ''Translating texts'' UI at /admin/config/texts (configure route gtext.translate), a Twig
    gtext() helper / ''gtext'' service, and optional Google Translate machine translation. Its only config
    is gtext.settings:google_api_key (string), with NO config/install (absent by default): with a key
    it uses the official google/cloud-translate client, without a key it uses a free translate.google.com
    fallback (<=1000 chars). Permissions: ''access gtext translate strings'' and ''access gtext translate''.
    The Google key settings form is at /admin/config/gtext/settings. Medium cases seed a known google_api_key
    and read it back; hard cases set the key to a target value or clear it, verified against live config.'
questions:
- id: gtext-what-and-route
  input: What does the Drupal gtext (gText) module do, and where is its main configuration/translation
    page?
  criteria: gText is a locale string-translation utility built on core locale. Its main UI is 'Translating
    texts' at /admin/config/texts (configure route gtext.translate), where you browse translatable source
    strings (grouped by context) and translate them per language. It also adds a Twig gtext() helper and
    optional Google Translate machine translation. It is about text/string translation, not fonts.
  bundle: gtext
  rubric_ref: rubric/gtext_gtext_what_and_route@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: gtext-api-key
  input: In gtext, which config object and key hold the Google Translate API key, and what happens if
    no key is configured?
  criteria: The key is gtext.settings:google_api_key (a string; there is no config/install so the object
    is absent until set). With a key, gText uses the official google/cloud-translate client. With no key
    it falls back to a free unofficial translate.google.com endpoint limited to 1000 characters per request.
  bundle: gtext
  rubric_ref: rubric/gtext_gtext_api_key@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: gtext-permissions
  input: Which permissions does the gtext module define, and what does each control?
  criteria: gText defines 'access gtext translate strings' (access to the /admin/config/texts string-translation
    UI, marked restricted) and 'access gtext translate' (adds the inline 'translate' buttons to config-translation
    and entity-translation forms). The Google key settings page itself is gated by core 'administer site
    configuration'.
  bundle: gtext
  rubric_ref: rubric/gtext_gtext_permissions@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: gtext-known-key
  input: On this Drupal site, gtext has a Google Translate API key configured. Inspect the live configuration
    and report the exact key value.
  criteria: gtext.settings:google_api_key is AIzaSyGTEXT-known-eval-key-123.
  bundle: gtext
  rubric_ref: rubric/gtext_gtext_known_key@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/gtext-apikey-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/gtext-apikey-cleanup.sh
- id: gtext-provider-key
  input: This site's gtext is configured to use the official Google Cloud Translate client rather than
    the free fallback. Inspect the running configuration and report the configured Google API key.
  criteria: gtext.settings:google_api_key is set to AIzaSyGTEXT-provider-key-456, so gText uses the official
    google/cloud-translate client (a non-empty key switches off the free fallback).
  bundle: gtext
  rubric_ref: rubric/gtext_gtext_provider_key@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/gtext-provider-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/gtext-provider-cleanup.sh
- id: gtext-set-key
  input: Configure the gtext module on this Drupal site to use the Google Translate API key AIzaSyGTEXT-task-target-key-789
    . Apply the change to the live site.
  criteria: Set gtext.settings:google_api_key to exactly AIzaSyGTEXT-task-target-key-789 and save (e.g.
    \Drupal::configFactory()->getEditable('gtext.settings')->set('google_api_key', 'AIzaSyGTEXT-task-target-key-789')->save()).
  bundle: gtext
  rubric_ref: rubric/gtext_gtext_set_key@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/gtext-apikey-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/gtext-apikey-execcleanup.sh
    verify: agent-module-documentation/evaluation/verify/gtext-apikey-verify.sh
- id: gtext-clear-key
  input: gtext on this site currently has a Google Translate API key set. Turn off the paid Google client
    so the module uses its free translation fallback instead, by clearing the configured key. Apply the
    change to the live site.
  criteria: Clear gtext.settings:google_api_key (set it to an empty string, or delete the config object)
    so the value is empty/absent; gText then uses the free translate.google.com fallback.
  bundle: gtext
  rubric_ref: rubric/gtext_gtext_clear_key@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-layman
    reset: agent-module-documentation/evaluation/verify/gtext-clear-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/gtext-clear-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/gtext-clear-verify.sh
