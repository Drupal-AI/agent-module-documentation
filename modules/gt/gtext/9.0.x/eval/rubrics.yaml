rubrics:
- id: gtext_gtext_what_and_route
  version: '1.0'
  applicable_bundles:
  - gtext
  checks:
  - kind: must_contain_any
    values:
    - /admin/config/texts
    - gtext.translate
    - string
    - translation
  scoring:
    combine: all_pass
- id: gtext_gtext_api_key
  version: '1.0'
  applicable_bundles:
  - gtext
  checks:
  - kind: must_contain_any
    values:
    - gtext.settings
    - google_api_key
  scoring:
    combine: all_pass
- id: gtext_gtext_permissions
  version: '1.0'
  applicable_bundles:
  - gtext
  checks:
  - kind: must_contain_any
    values:
    - access gtext translate strings
    - access gtext translate
  scoring:
    combine: all_pass
- id: gtext_gtext_known_key
  version: '1.0'
  applicable_bundles:
  - gtext
  checks:
  - kind: must_contain_any
    values:
    - AIzaSyGTEXT-known-eval-key-123
  scoring:
    combine: all_pass
- id: gtext_gtext_provider_key
  version: '1.0'
  applicable_bundles:
  - gtext
  checks:
  - kind: must_contain_any
    values:
    - AIzaSyGTEXT-provider-key-456
  scoring:
    combine: all_pass
- id: gtext_gtext_set_key
  version: '1.0'
  applicable_bundles:
  - gtext
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
- id: gtext_gtext_clear_key
  version: '1.0'
  applicable_bundles:
  - gtext
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
