metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: gtm
  version: 1.10.x
  note: 'GTM is a deliberately minimal module: one settings form (route gtm.settings at /admin/config/system/gtm,
    permission ''administer gtm'') writing a single config object gtm.settings with four keys — enable
    (master switch), google-tag (the GTM-XXXX container ID), admin-pages (also fire on /admin/*, off by
    default) and admin-disable (suppress GTM for uid 1). It ships no config schema, no Drush command,
    no plugins; the snippet is injected by hook_page_attachments() (head gtm.js script) and hook_page_top()
    (noscript iframe). All medium/hard cases are grounded in that real gtm.settings config: introspection
    reads the live container ID and insertion conditions, execution writes them and verifies the live
    config.'
questions:
- id: gtm-container-id-key
  input: On a Drupal 11 site using the contrib GTM module (drupal/gtm), which config object stores the
    settings, and what is the exact config key that holds the Google Tag Manager container ID (the GTM-XXXX
    value)?
  criteria: Settings live in the config object gtm.settings. The container ID is stored under the key
    `google-tag` (shown as 'GTM-ID' on the form). The other keys are enable, admin-pages and admin-disable.
  bundle: gtm
  rubric_ref: rubric/gtm_gtm_container_id_key@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: gtm-insertion-conditions
  input: Using the contrib GTM module on Drupal, what has to be true for the Google Tag Manager snippet
    to be injected on a page, and how do I keep it off admin pages and stop it tracking the superuser
    (uid 1)?
  criteria: The snippet fires only when `enable` is on AND `google-tag` is non-empty AND (admin-pages
    is on OR the route is not an admin route). Leaving admin-pages off (default 0) keeps GTM off /admin/*
    pages; setting admin-disable to 1 suppresses GTM for the superuser (uid 1).
  bundle: gtm
  rubric_ref: rubric/gtm_gtm_insertion_conditions@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: gtm-configure-route
  input: Where do I configure the contrib GTM module on a Drupal 11 site (the settings form path and its
    route name), and which permission gates access to it?
  criteria: The settings form is at /admin/config/system/gtm (route name gtm.settings, form Drupal\gtm\Form\SettingsForm).
    Access is gated by the 'administer gtm' permission.
  bundle: gtm
  rubric_ref: rubric/gtm_gtm_configure_route@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: gtm-current-container-id
  input: This Drupal site has the GTM (Google Tag Manager) module configured. What Google Tag Manager
    container ID is currently set, and is GTM enabled? Inspect the live gtm.settings configuration to
    answer.
  criteria: gtm.settings has google-tag = 'GTM-EVAL01' and enable = 1 (GTM is enabled). It is front-end
    only (admin-pages = 0) and excludes the superuser (admin-disable = 1).
  bundle: gtm
  rubric_ref: rubric/gtm_gtm_current_container_id@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/gtm-container-id-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/gtm-container-id-cleanup.sh
- id: gtm-fires-on-admin
  input: On this Drupal site the GTM module is enabled. Is the Google Tag Manager container currently
    configured to fire on administrative (/admin/*) pages as well as the front end, or only on the front
    end? Inspect the live gtm.settings configuration and explain which key decides it.
  criteria: Yes — it also fires on admin pages. In gtm.settings the key admin-pages is 1, which makes
    GTM load on /admin/* routes in addition to the front end (container ID GTM-ADMIN9, enable = 1).
  bundle: gtm
  rubric_ref: rubric/gtm_gtm_fires_on_admin@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/gtm-admin-pages-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/gtm-admin-pages-cleanup.sh
- id: gtm-enable-container
  input: On this Drupal site the GTM (drupal/gtm) module is installed but not configured. Configure gtm.settings
    so that Google Tag Manager is enabled with the container ID GTM-ABCD123. Apply the change to the live
    site.
  criteria: gtm.settings has enable = 1 and google-tag set to a valid GTM-XXXX container ID (e.g. GTM-ABCD123),
    so the container snippet is injected on the front end.
  bundle: gtm
  rubric_ref: rubric/gtm_gtm_enable_container@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/gtm-enable-container-reset.sh
    verify: agent-module-documentation/evaluation/verify/gtm-enable-container-verify.sh
- id: gtm-frontend-only
  input: On this Drupal site, configure the GTM module (gtm.settings) so that Google Tag Manager is enabled
    with container ID GTM-PROD777, fires ONLY on front-end pages (never on /admin/* pages), and does NOT
    track the superuser (uid 1). Apply the change to the live site.
  criteria: gtm.settings has enable = 1, google-tag = a valid GTM-XXXX ID (e.g. GTM-PROD777), admin-pages
    = 0 (front-end only) and admin-disable = 1 (superuser excluded).
  bundle: gtm
  rubric_ref: rubric/gtm_gtm_frontend_only@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/gtm-frontend-only-reset.sh
    verify: agent-module-documentation/evaluation/verify/gtm-frontend-only-verify.sh
