metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: gtranslate
  version: 3.0.x
  note: 'GTranslate exposes a single Google-Translate widget block plus one settings config object (gtranslate.settings).
    Cases are `recipe` (response-graded): they probe documented facts an agent would otherwise read source
    to answer; no site mutation.'
questions:
- id: gtranslate-what-kind-of-translation
  input: Does the GTranslate Drupal module use Drupal core's Content Translation / i18n system, or something
    else? Briefly explain how it translates pages.
  criteria: It is NOT Drupal core i18n/Content Translation. It is client-side Google machine translation
    done in the browser via JavaScript; no source strings are stored or human-reviewed.
  bundle: gtranslate
  rubric_ref: rubric/gtranslate_gtranslate_what_kind_of_translation@1.0
  tags:
  - mode:recipe
- id: gtranslate-add-widget
  input: How do I add the GTranslate language switcher to my Drupal site's pages? What does the module
    provide to render it?
  criteria: The module provides a block plugin (id gtranslate_block, 'GTranslate'). Place it in a region
    via Block layout (or Layout Builder) to render the widget.
  bundle: gtranslate
  rubric_ref: rubric/gtranslate_gtranslate_add_widget@1.0
  tags:
  - mode:recipe
- id: gtranslate-settings-route
  input: Where is the GTranslate settings form and what permission gates it on a Drupal 11 site?
  criteria: Route gtranslate.settings at /admin/config/regional/gtranslate (Configuration > Regional and
    language > GTranslate), gated by the 'gtranslate settings' permission.
  bundle: gtranslate
  rubric_ref: rubric/gtranslate_gtranslate_settings_route@1.0
  tags:
  - mode:recipe
- id: gtranslate-widget-look
  input: Which config key selects the GTranslate widget appearance, and name a few of the available styles.
  criteria: The widget_look key on gtranslate.settings. Styles include float, dropdown_with_flags, flags_dropdown,
    flags, dropdown, flags_name, flags_code, lang_names, lang_codes, globe, popup, popup_search.
  bundle: gtranslate
  rubric_ref: rubric/gtranslate_gtranslate_widget_look@1.0
  tags:
  - mode:recipe
- id: gtranslate-select-languages
  input: How do I choose and order which languages the GTranslate switcher offers, and where is that stored
    in config?
  criteria: Tick languages in the settings form's Languages table and drag to order them; enabled languages
    are stored in the `languages` key and order in `language_weights` on gtranslate.settings.
  bundle: gtranslate
  rubric_ref: rubric/gtranslate_gtranslate_select_languages@1.0
  tags:
  - mode:recipe
- id: gtranslate-free-vs-paid
  input: In the GTranslate module, what is the difference between the free and paid URL structures, and
    which config key controls it? Which mode is indexable by search engines?
  criteria: 'The url_structure key: ''none'' is free, on-the-fly JS translation NOT indexed by search
    engines; ''sub_directory'' (example.com/fr) and ''sub_domain'' (fr.example.com) are paid and indexable.'
  bundle: gtranslate
  rubric_ref: rubric/gtranslate_gtranslate_free_vs_paid@1.0
  tags:
  - mode:recipe
- id: gtranslate-cdn
  input: Can GTranslate serve its widget JavaScript and flag images without calling an external CDN? Which
    setting controls that?
  criteria: Yes. The enable_cdn key (default on/1) loads assets from the GTranslate CDN; disable it to
    serve JS/flags locally from the module's js/ and flags/ folders.
  bundle: gtranslate
  rubric_ref: rubric/gtranslate_gtranslate_cdn@1.0
  tags:
  - mode:recipe
- id: gtranslate-source-language
  input: Which GTranslate setting tells Google what language the site is originally written in, and what
    is its default?
  criteria: The source_lang key ('Translate from'), default 'en', sets the site's source language.
  bundle: gtranslate
  rubric_ref: rubric/gtranslate_gtranslate_source_language@1.0
  tags:
  - mode:recipe
