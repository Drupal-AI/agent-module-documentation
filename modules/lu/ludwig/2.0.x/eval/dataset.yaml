metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: ludwig
  version: 2.0.x
  note: 'Ludwig is a non-Composer library manager: modules declare libraries in ludwig.json, a Packages
    report downloads them, and a service provider autoloads PSR-4/PSR-0 namespaces. Cases are `recipe`
    (response-graded) probing documented facts an agent would otherwise read source to answer; no site
    mutation.'
questions:
- id: ludwig-purpose-vs-composer
  input: On a Drupal 11 site that deliberately does not use Composer, a contrib module needs a third-party
    PHP library. How can Ludwig install that library, and when would I use it instead of Composer?
  criteria: 'Ludwig is a manual alternative to Composer: the module declares the library in a ludwig.json
    file and Ludwig downloads it into the module''s lib/ directory. Use Ludwig on sites that avoid Composer-managed
    workflows; use Composer otherwise.'
  bundle: ludwig
  rubric_ref: rubric/ludwig_ludwig_purpose_vs_composer@1.0
  tags:
  - mode:recipe
- id: ludwig-declare-library
  input: How does a module tell Ludwig which external PHP library it needs? Show the file and its format.
  criteria: The module ships a ludwig.json in its root with a `require` object keyed by vendor/name, each
    having a `version` and an archive `url` (a .zip).
  bundle: ludwig
  rubric_ref: rubric/ludwig_ludwig_declare_library@1.0
  tags:
  - mode:recipe
- id: ludwig-download-mechanism
  input: I enabled a Ludwig-managed module and its libraries show as Missing. How do I download them on
    a Drupal 11 site running Ludwig 2.0.x?
  criteria: Visit the Packages report at Admin > Reports > Packages (/admin/reports/packages); loading
    it downloads all Missing packages and flushes caches. There is no Drush command in 2.0.x.
  bundle: ludwig
  rubric_ref: rubric/ludwig_ludwig_download_mechanism@1.0
  tags:
  - mode:recipe
- id: ludwig-report-route
  input: Where does Ludwig install a downloaded library, and which route lets me view the package report
    WITHOUT triggering a download?
  criteria: Libraries are copied into the requiring module's lib/<vendor>-<name>/<version>/ directory.
    Use /admin/reports/packages_skip (ludwig.packages_skip) to view the report without downloading.
  bundle: ludwig
  rubric_ref: rubric/ludwig_ludwig_report_route@1.0
  tags:
  - mode:recipe
- id: ludwig-autoloading
  input: After Ludwig downloads a PSR-4 library, what makes its classes autoloadable in Drupal? Which
    class handles it?
  criteria: LudwigServiceProvider::register() reads each installed library's composer.json autoload section
    and merges its PSR-4/PSR-0 namespaces into the container.namespaces parameter at container build time,
    so no package-data cache is needed.
  bundle: ludwig
  rubric_ref: rubric/ludwig_ludwig_autoloading@1.0
  tags:
  - mode:recipe
- id: ludwig-classmap-files
  input: A library I declared uses composer `files`/`classmap` autoloading and Ludwig shows it as 'Not
    installed'. How do I make it load?
  criteria: classmap/files libraries are not autoloaded automatically; call the ludwig.require_once service
    (RequireOnce::requireOnce($package_name, $file, __DIR__)) from the module's .module/.install file
    to require the file. That flips its status to Installed.
  bundle: ludwig
  rubric_ref: rubric/ludwig_ludwig_classmap_files@1.0
  tags:
  - mode:recipe
- id: ludwig-duplicate-versions
  input: Two modules require the same library at different versions via Ludwig. What does Ludwig do, and
    what status appears in the report?
  criteria: Ludwig keeps the highest required version and marks the lower ones 'Overridden' in the Packages
    report.
  bundle: ludwig
  rubric_ref: rubric/ludwig_ludwig_duplicate_versions@1.0
  tags:
  - mode:recipe
