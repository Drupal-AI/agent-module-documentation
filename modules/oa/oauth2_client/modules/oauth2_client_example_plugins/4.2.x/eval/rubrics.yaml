rubrics:
- id: oauth2_client_example_plugins_oauth2_client_example_plugins_list
  version: '1.0'
  applicable_bundles:
  - oauth2_client_example_plugins
  checks:
  - kind: must_contain_any
    values:
    - authcode_example
    - resource_owner_example
    - authcode_redirect_example
    - authcode_access_example
  scoring:
    combine: all_pass
- id: oauth2_client_example_plugins_oauth2_client_example_plugins_redirect
  version: '1.0'
  applicable_bundles:
  - oauth2_client_example_plugins
  checks:
  - kind: must_contain_any
    values:
    - authcode_redirect_example
    - getPostCaptureRedirect
    - Oauth2ClientPluginRedirectInterface
  scoring:
    combine: all_pass
- id: oauth2_client_example_plugins_oauth2_client_example_plugins_storage
  version: '1.0'
  applicable_bundles:
  - oauth2_client_example_plugins
  checks:
  - kind: must_contain_any
    values:
    - StateTokenStorage
    - TempStoreTokenStorage
  scoring:
    combine: all_pass
- id: oauth2_client_example_plugins_oauth2_client_example_plugins_known
  version: '1.0'
  applicable_bundles:
  - oauth2_client_example_plugins
  checks:
  - kind: must_contain_any
    values:
    - authcode_access_example
  scoring:
    combine: all_pass
- id: oauth2_client_example_plugins_oauth2_client_example_plugins_create
  version: '1.0'
  applicable_bundles:
  - oauth2_client_example_plugins
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
