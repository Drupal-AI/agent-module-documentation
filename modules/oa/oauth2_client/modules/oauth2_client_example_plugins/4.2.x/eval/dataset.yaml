metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: oauth2_client_example_plugins
  version: 4.2.x
  note: 'Demonstration submodule of oauth2_client. Registers four oauth2_client plugins: authcode_example
    (authorization_code, StateTokenStorage, success_message TRUE), resource_owner_example (resource_owner,
    StateTokenStorage), authcode_redirect_example (authorization_code, TempStoreTokenStorage, Oauth2ClientPluginRedirectInterface
    -> redirects to <front>), authcode_access_example (authorization_code, TempStoreTokenStorage, Oauth2ClientPluginAccessInterface
    -> requires ''access content''). No client_credentials example exists. The submodule ships no config
    of its own; the four baseline oauth2_client config entities named after these plugins already exist
    and are untouched. Medium/hard cases use a namespaced oauth2_client config entity (o2cex_known, o2cex_eval)
    bound to an example plugin.'
questions:
- id: oauth2_client_example_plugins-list
  input: The oauth2_client_example_plugins submodule provides example OAuth2 Client plugins. Name at least
    two of the example plugin ids and the grant type each demonstrates.
  criteria: It ships authcode_example (authorization_code), resource_owner_example (resource_owner), authcode_redirect_example
    (authorization_code) and authcode_access_example (authorization_code).
  bundle: oauth2_client_example_plugins
  rubric_ref: rubric/oauth2_client_example_plugins_oauth2_client_example_plugins_list@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: oauth2_client_example_plugins-redirect
  input: In the oauth2_client_example_plugins submodule, which example plugin shows how to change where
    a user is sent after the OAuth2 authorization code is captured, and what interface/method does it
    use?
  criteria: authcode_redirect_example implements Oauth2ClientPluginRedirectInterface::getPostCaptureRedirect(),
    returning a RedirectResponse to the front page after the code is captured.
  bundle: oauth2_client_example_plugins
  rubric_ref: rubric/oauth2_client_example_plugins_oauth2_client_example_plugins_redirect@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: oauth2_client_example_plugins-storage
  input: The oauth2_client_example_plugins examples use two different token-storage traits. Which trait
    stores a single token shared across all users, and which stores a token per user?
  criteria: StateTokenStorage stores one shared token in Drupal State (used by authcode_example and resource_owner_example);
    TempStoreTokenStorage stores a per-user token (used by authcode_redirect_example and authcode_access_example).
  bundle: oauth2_client_example_plugins
  rubric_ref: rubric/oauth2_client_example_plugins_oauth2_client_example_plugins_storage@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: oauth2_client_example_plugins-known
  input: On this Drupal site an OAuth2 client with machine id 'o2cex_known' is configured against one
    of the example plugins from oauth2_client_example_plugins. Inspect the live configuration and name
    the plugin it uses.
  criteria: The oauth2_client config entity o2cex_known has oauth2_client_plugin_id = authcode_access_example.
  bundle: oauth2_client_example_plugins
  rubric_ref: rubric/oauth2_client_example_plugins_oauth2_client_example_plugins_known@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/oauth2_client_example_plugins-known-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/oauth2_client_example_plugins-known-cleanup.sh
- id: oauth2_client_example_plugins-create
  input: Using an example plugin from oauth2_client_example_plugins, create an OAuth2 Client configuration
    (oauth2_client config entity) with machine id 'o2cex_eval' that uses the 'resource_owner_example'
    plugin and the module's own (State) credential provider. Apply it to the live site.
  criteria: An oauth2_client config entity o2cex_eval exists with oauth2_client_plugin_id='resource_owner_example'
    (e.g. Oauth2Client::create([...])->save()).
  bundle: oauth2_client_example_plugins
  rubric_ref: rubric/oauth2_client_example_plugins_oauth2_client_example_plugins_create@1.0
