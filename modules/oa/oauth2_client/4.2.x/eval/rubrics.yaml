rubrics:
- id: oauth2_client_oauth2_client_define_plugin
  version: '1.0'
  applicable_bundles:
  - oauth2_client
  checks:
  - kind: must_contain_any
    values:
    - Oauth2Client
    - Oauth2ClientPluginBase
    - attribute
  scoring:
    combine: all_pass
- id: oauth2_client_oauth2_client_grant_types
  version: '1.0'
  applicable_bundles:
  - oauth2_client
  checks:
  - kind: must_contain_any
    values:
    - authorization_code
    - client_credentials
    - resource_owner
    - refresh_token
  scoring:
    combine: all_pass
- id: oauth2_client_oauth2_client_get_token
  version: '1.0'
  applicable_bundles:
  - oauth2_client
  checks:
  - kind: must_contain_any
    values:
    - oauth2_client.service
    - getAccessToken
  scoring:
    combine: all_pass
- id: oauth2_client_oauth2_client_known_client
  version: '1.0'
  applicable_bundles:
  - oauth2_client
  checks:
  - kind: must_contain_any
    values:
    - resource_owner_example
  scoring:
    combine: all_pass
- id: oauth2_client_oauth2_client_known_key
  version: '1.0'
  applicable_bundles:
  - oauth2_client
  checks:
  - kind: must_contain_any
    values:
    - o2c_secret_state
  scoring:
    combine: all_pass
- id: oauth2_client_oauth2_client_create_client
  version: '1.0'
  applicable_bundles:
  - oauth2_client
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
- id: oauth2_client_oauth2_client_enable_client
  version: '1.0'
  applicable_bundles:
  - oauth2_client
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
