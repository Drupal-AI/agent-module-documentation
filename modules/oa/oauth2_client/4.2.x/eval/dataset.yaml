metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: oauth2_client
  version: 4.2.x
  note: 'OAuth2 Client is a developer/API module. Two plugin types: oauth2_client (manager oauth2_client.plugin_manager)
    and oauth2_grant_type (manager plugin.manager.oauth2_grant_type; ids authorization_code, client_credentials,
    resource_owner, refresh_token). Credentials are supplied by an oauth2_client CONFIG ENTITY (config
    prefix oauth2_client.oauth2_client.*) that binds a plugin to a credential_provider (oauth2_client=State,
    or key=Key module) + credential_storage_key; status defaults FALSE. Runtime service oauth2_client.service
    (getClient/getAccessToken/retrieveAccessToken/clearAccessToken). The oauth2_client_example_plugins
    submodule is enabled and provides plugins authcode_example, authcode_redirect_example, authcode_access_example,
    resource_owner_example; four baseline config entities with those ids already exist and are NOT touched
    by these evals. Hard cases create/enable a namespaced config entity (o2c_eval, o2c_toggle) rather
    than hitting a live IdP.'
questions:
- id: oauth2_client-define-plugin
  input: Using the Drupal OAuth2 Client module, how do I define a new OAuth2 provider in code? What attribute/base
    class do I use and what endpoints must I declare?
  criteria: 'Write an oauth2_client plugin: a class in src/Plugin/Oauth2Client extending Oauth2ClientPluginBase
    with the #[Oauth2Client(...)] attribute declaring id, name, grant_type, authorization_uri and token_uri
    (optionally resource_owner_uri, scopes), and use a token-storage trait (StateTokenStorage or TempStoreTokenStorage).'
  bundle: oauth2_client
  rubric_ref: rubric/oauth2_client_oauth2_client_define_plugin@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: oauth2_client-grant-types
  input: Which OAuth2 grant types does the Drupal oauth2_client module ship as grant-type plugins?
  criteria: The oauth2_grant_type plugins are authorization_code, client_credentials, resource_owner,
    and refresh_token.
  bundle: oauth2_client
  rubric_ref: rubric/oauth2_client_oauth2_client_grant_types@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: oauth2_client-get-token
  input: In the Drupal oauth2_client module, which service do I call at runtime to obtain (and refresh)
    an access token for a configured client, and what method do I call?
  criteria: 'Call the oauth2_client.service service (Oauth2ClientServiceInterface): getAccessToken($pluginId,
    $credentials) returns/refreshes the token; retrieveAccessToken() reads storage only; clearAccessToken()
    deletes it.'
  bundle: oauth2_client
  rubric_ref: rubric/oauth2_client_oauth2_client_get_token@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: oauth2_client-known-client
  input: On this Drupal site there is a configured OAuth2 client whose machine id is 'o2c_known'. Inspect
    the live configuration and state which oauth2_client plugin it uses.
  criteria: The oauth2_client config entity o2c_known has oauth2_client_plugin_id = resource_owner_example.
  bundle: oauth2_client
  rubric_ref: rubric/oauth2_client_oauth2_client_known_client@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/oauth2_client-known-client-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/oauth2_client-known-client-cleanup.sh
- id: oauth2_client-known-key
  input: The OAuth2 client 'o2c_known2' configured on this site stores its credentials via the module's
    own State-based provider. Inspect the live configuration and give the credential storage key it uses.
  criteria: The oauth2_client config entity o2c_known2 has credential_provider=oauth2_client and credential_storage_key=o2c_secret_state.
  bundle: oauth2_client
  rubric_ref: rubric/oauth2_client_oauth2_client_known_key@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/oauth2_client-known-key-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/oauth2_client-known-key-cleanup.sh
- id: oauth2_client-create-client
  input: On this Drupal site, create an OAuth2 Client configuration (oauth2_client config entity) with
    machine id 'o2c_eval' that uses the existing 'authcode_example' plugin and stores its credentials
    with the module's own (State) credential provider. Apply it to the live site.
  criteria: An oauth2_client config entity o2c_eval exists with oauth2_client_plugin_id='authcode_example'
    and credential_provider='oauth2_client' (e.g. Oauth2Client::create([...])->save()).
  bundle: oauth2_client
  rubric_ref: rubric/oauth2_client_oauth2_client_create_client@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/oauth2_client-create-client-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/oauth2_client-create-client-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/oauth2_client-create-client-verify.sh
- id: oauth2_client-enable-client
  input: The OAuth2 client 'o2c_toggle' on this site is currently disabled. Enable it (set its status
    to enabled) and apply the change to the live site.
  criteria: The oauth2_client config entity o2c_toggle has status TRUE (e.g. load it, setStatus(TRUE)->save(),
    or enable it from /admin/config/system/oauth2-client).
  bundle: oauth2_client
  rubric_ref: rubric/oauth2_client_oauth2_client_enable_client@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/oauth2_client-enable-client-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/oauth2_client-enable-client-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/oauth2_client-enable-client-verify.sh
