metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: image_url_formatter
  version: 2.1.x
  note: 'Image URL Formatter exposes field formatters (no admin form, no permissions, no services API).
    Cases are `recipe` (response-graded): they probe documented facts an agent would otherwise read source
    to answer; no site mutation.'
questions:
- id: iuf-formatter-purpose
  input: On a Drupal 11 site I have an image field and I want its output to be just the image URL as plain
    text instead of an <img> tag, so I can use it in a template. Which module and which field formatter
    do I use?
  criteria: Install image_url_formatter and set the field's Format to 'Image URL Formatter' (plugin id
    image_url_formatter) on Manage display; it renders the image's URL as plain text.
  bundle: image_url_formatter
  rubric_ref: rubric/image_url_formatter_iuf_formatter_purpose@1.0
  tags:
  - mode:recipe
- id: iuf-image-style
  input: Using the Image URL Formatter, how do I output the URL of a specific image style (e.g. 'thumbnail')
    rather than the original image?
  criteria: Set the formatter's 'Image style' setting (image_style) to the desired style; it builds the
    style derivative URL via buildUrl(). Leaving it empty ('None (original image)') outputs the original
    image URL.
  bundle: image_url_formatter
  rubric_ref: rubric/image_url_formatter_iuf_image_style@1.0
  tags:
  - mode:recipe
- id: iuf-url-type
  input: The Image URL Formatter has a 'URL type' setting. What are the three options and what does each
    produce?
  criteria: url_type 0 = Full URL (scheme + host), 1 = Absolute file path (root-relative, base_url stripped,
    leading slash), 2 = Relative file path (base_url + '/' stripped, no leading slash).
  bundle: image_url_formatter
  rubric_ref: rubric/image_url_formatter_iuf_url_type@1.0
  tags:
  - mode:recipe
- id: iuf-og-image
  input: I want to output an image field's absolute URL into an og:image meta tag / attribute using the
    Image URL Formatter. What do I configure?
  criteria: Apply the Image URL Formatter and set URL type to Full URL (url_type 0) so the field emits
    the full image URL, which you place in the og:image meta tag or attribute via the template/View.
  bundle: image_url_formatter
  rubric_ref: rubric/image_url_formatter_iuf_og_image@1.0
  tags:
  - mode:recipe
- id: iuf-link-option
  input: With the Image URL Formatter, can the printed URL be wrapped in a link, and to what can it link?
  criteria: Yes; the image_link setting wraps the URL in a link to the host Content entity or to the File,
    or 'Nothing' for no link.
  bundle: image_url_formatter
  rubric_ref: rubric/image_url_formatter_iuf_link_option@1.0
  tags:
  - mode:recipe
- id: iuf-dependencies
  input: What are the module dependencies and configuration requirements of the image_url_formatter module?
    Does it add an admin settings page?
  criteria: It depends only on core image (drupal:image), has no admin settings form or permissions; the
    formatter is configured per-field on Manage display (or in a View).
  bundle: image_url_formatter
  rubric_ref: rubric/image_url_formatter_iuf_dependencies@1.0
  tags:
  - mode:recipe
- id: iuf-file-formatter
  input: I have a plain file field (not an image) and want its URL output as text. Does the image_url_formatter
    module help, and how?
  criteria: Yes; the module also provides a 'File URL Formatter' (file_url_formatter) for file fields
    that outputs the file's URL as plain text, with the same URL type / link options.
  bundle: image_url_formatter
  rubric_ref: rubric/image_url_formatter_iuf_file_formatter@1.0
  tags:
  - mode:recipe
