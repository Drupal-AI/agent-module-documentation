  applicable_bundles:
  - image_link_formatter
  checks:
  - kind: must_contain_any
    values:
    - image_link_formatter
    - Image wrapped within link field
    - Manage display
  scoring:
    combine: all_pass
- id: image_link_formatter_ilf_setting_and_delta
  version: '1.0'
  applicable_bundles:
  - image_link_formatter
  checks:
