metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: image_link_formatter
  version: 2.2.x
  note: 'Image Link Formatter provides one image field formatter, id ''image_link_formatter'' (label ''Image
    wrapped within link field''), for image fields. It extends core ImageFormatter via ImageLinkFormatterTrait
    and adds the entity/bundle''s Link fields as options to the core ''image_link'' (Link image to) setting;
    at render it wraps each image in the same-delta Link field''s URL. Configured on core.entity_view_display.<entity>.<bundle>.<mode>:
    content.<image_field>.type = image_link_formatter and settings.image_link = <link field machine name>.
    No configure route, no permission, no Drush, no config schema of its own; requires image + link. Submodule
    responsive_image_link_formatter does the same for responsive images. Medium cases read a live view
    display; hard cases set the formatter/link, verified against entity_view_display config. Fixtures
    create namespaced field_ilf_img (image) + field_ilf_link (link) on Article and delete them (scoped,
    by name) in cleanup/reset.'
questions:
- id: ilf-formatter-id
  input: I want images in a field to be clickable, linking to a URL an editor enters in a separate Link
    field. With the Image Link Formatter module, which formatter do I choose for the image field and what
    is it called in the UI?
  criteria: On the bundle's Manage display, set the image field's formatter to 'Image wrapped within link
    field' (plugin id image_link_formatter). In its settings, the 'Link image to' dropdown now lists the
    entity's Link fields; pick the one whose URL should wrap the image.
  bundle: image_link_formatter
  rubric_ref: rubric/image_link_formatter_ilf_formatter_id@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: ilf-setting-and-delta
  input: Using image_link_formatter, which formatter setting selects the link field, and how are multiple
    images paired with multiple link values?
  criteria: 'The core ''Link image to'' setting (settings.image_link) is extended to accept a Link field
    machine name; select your link field there. Multiple values pair by delta: image delta 0 is wrapped
    by link delta 0, delta 1 by delta 1, and so on. An empty link item leaves that image unwrapped.'
  bundle: image_link_formatter
  rubric_ref: rubric/image_link_formatter_ilf_setting_and_delta@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: ilf-requirements-integrations
  input: What core modules does Image Link Formatter require, and does it respect link options like opening
    in a new tab (target=_blank) added by modules such as Link Attributes or Link Target?
  criteria: It requires the core image and link modules. Yes - attributes set on the Link item (e.g. target="_blank",
    rel) via Link Attributes or Link Target are carried onto the image's link automatically, because the
    link's Url object retains them.
  bundle: image_link_formatter
  rubric_ref: rubric/image_link_formatter_ilf_requirements_integrations@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: ilf-which-formatter
  input: On this site, the Article content type has an image field 'field_ilf_img'. Inspect the live default
    view display for Article and state which field formatter is applied to that image field.
  criteria: 'The formatter is image_link_formatter (''Image wrapped within link field''): in core.entity_view_display.node.article.default
    the field_ilf_img component has type image_link_formatter.'
  bundle: image_link_formatter
  rubric_ref: rubric/image_link_formatter_ilf_which_formatter@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/image_link_formatter-which-formatter-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/image_link_formatter-which-formatter-cleanup.sh
- id: ilf-which-link
  input: On this site the Article image field 'field_ilf_img' is displayed with the Image Link Formatter.
    Inspect the live view display and tell me which Link field's URL is used to wrap the image.
  criteria: 'The link field is field_ilf_link: in core.entity_view_display.node.article.default the field_ilf_img
    component''s settings.image_link = field_ilf_link.'
  bundle: image_link_formatter
  rubric_ref: rubric/image_link_formatter_ilf_which_link@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/image_link_formatter-which-link-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/image_link_formatter-which-link-cleanup.sh
- id: ilf-wrap-image
  input: On this Drupal site the Article content type has an image field 'field_ilf_img' and a link field
    'field_ilf_link'. On the default view display, the image currently uses the core image formatter.
    Using the Image Link Formatter module, change the image field so it renders wrapped in the link from
    field_ilf_link. Apply the change to the live site.
  criteria: In core.entity_view_display.node.article.default set field_ilf_img component type to image_link_formatter
    with settings.image_link = field_ilf_link, then save. Verify checks type === image_link_formatter
    and settings.image_link === field_ilf_link.
  bundle: image_link_formatter
  rubric_ref: rubric/image_link_formatter_ilf_wrap_image@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/image_link_formatter-wrap-image-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/image_link_formatter-wrap-image-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/image_link_formatter-wrap-image-verify.sh
- id: ilf-set-link
  input: On the Article display for this site, the images in the 'field_ilf_img' field are shown with
    the Image Link Formatter but they aren't clickable - they don't link anywhere. There is a link field
    'field_ilf_link' on the same content. Make the images link to the URL from that link field. Apply
    the change to the live site.
  criteria: Set the field_ilf_img component's settings.image_link to field_ilf_link (keeping type image_link_formatter)
    on core.entity_view_display.node.article.default and save. Verify checks type === image_link_formatter
    and settings.image_link === field_ilf_link.
  bundle: image_link_formatter
  rubric_ref: rubric/image_link_formatter_ilf_set_link@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: site-builder
    reset: agent-module-documentation/evaluation/verify/image_link_formatter-set-link-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/image_link_formatter-set-link-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/image_link_formatter-set-link-verify.sh
