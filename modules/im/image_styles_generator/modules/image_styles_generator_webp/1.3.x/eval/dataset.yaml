metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: image_styles_generator_webp
  version: 1.3.x
  note: Trivial glue submodule of image_styles_generator. No command/route/config/permission/plugin of
    its own. A ServiceProvider (ImageStylesGeneratorWebpServiceProvider::alter) rewrites the parent's
    image_styles_generator.derivative_warmer service to class DerivativeWebpWarmer and injects @webp.webp;
    that subclass calls the parent to build a derivative then Webp::createWebpCopy() to write a .webp
    copy. Introspection reads the live service class; execution warms a real file and checks the .webp
    lands on disk. Requires the contrib webp module.
questions:
- id: image_styles_generator_webp-what
  input: What does the image_styles_generator_webp submodule add on top of image_styles_generator, and
    does it introduce its own Drush command?
  criteria: It makes the parent's warm command (drush image:derive:multiple) also write a .webp copy of
    each derivative. It adds no new command; it overrides the parent's derivative_warmer service so existing
    invocations produce WebP copies.
  bundle: image_styles_generator_webp
  rubric_ref: rubric/image_styles_generator_webp_image_styles_generator_webp_what@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: image_styles_generator_webp-mechanism
  input: Technically, how does image_styles_generator_webp change the parent module's behaviour? Name
    the mechanism and the class involved.
  criteria: Its ImageStylesGeneratorWebpServiceProvider::alter() rewrites the image_styles_generator.derivative_warmer
    service definition to class DerivativeWebpWarmer and adds the @webp.webp argument; the subclass calls
    the parent then Webp::createWebpCopy().
  bundle: image_styles_generator_webp
  rubric_ref: rubric/image_styles_generator_webp_image_styles_generator_webp_mechanism@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: image_styles_generator_webp-deps
  input: Which modules must be installed for image_styles_generator_webp to work?
  criteria: It depends on both the parent image_styles_generator module and the contrib webp module (which
    provides the webp.webp service). Both are hard dependencies in its info.yml.
  bundle: image_styles_generator_webp
  rubric_ref: rubric/image_styles_generator_webp_image_styles_generator_webp_deps@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: image_styles_generator_webp-service-class
  input: On this running Drupal site, inspect the container and state which PHP class the image_styles_generator.derivative_warmer
