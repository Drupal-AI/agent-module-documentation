rubrics:
- id: image_styles_generator_webp_image_styles_generator_webp_what
  version: '1.0'
  applicable_bundles:
  - image_styles_generator_webp
  checks:
  - kind: must_contain_any
    values:
    - webp
    - WebP
    - no new command
    - same command
    - image:derive:multiple
  scoring:
    combine: all_pass
- id: image_styles_generator_webp_image_styles_generator_webp_mechanism
  version: '1.0'
  applicable_bundles:
  - image_styles_generator_webp
  checks:
  - kind: must_contain_any
    values:
    - ServiceProvider
    - service provider
    - alter
    - DerivativeWebpWarmer
    - derivative_warmer
  scoring:
    combine: all_pass
- id: image_styles_generator_webp_image_styles_generator_webp_deps
  version: '1.0'
  applicable_bundles:
  - image_styles_generator_webp
  checks:
  - kind: must_contain_any
    values:
    - webp
    - image_styles_generator
  scoring:
    combine: all_pass
- id: image_styles_generator_webp_image_styles_generator_webp_service_class
  version: '1.0'
  applicable_bundles:
  - image_styles_generator_webp
  checks:
  - kind: must_contain_any
    values:
    - DerivativeWebpWarmer
  scoring:
    combine: all_pass
- id: image_styles_generator_webp_image_styles_generator_webp_warm
  version: '1.0'
  applicable_bundles:
  - image_styles_generator_webp
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
