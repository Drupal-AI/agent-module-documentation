metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: image_styles_generator
  version: 1.3.x
  note: 'Image Styles Generator is a CLI-only module: no UI, no configure route (configure=null), no permissions,
    no config schema, no plugins. Its whole surface is the Drush command image:derive:multiple (aliases
    idm, image_derivatives:generate) with options --image-styles=<csv of style ids> and --skip-existing,
    plus the injectable service image_styles_generator.derivative_warmer (DerivativeWarmer::regenerateImageStyleDerivativeFromFile).
    Introspection cases key off real image_style config entities the command warms; execution cases warm
    a real published image file and check the derivative file lands on disk (and that --image-styles limits
    which styles build).'
questions:
- id: image_styles_generator-command
  input: On a Drupal 11 site with the image_styles_generator module, I want to pre-generate (warm) all
    image-style derivatives from the command line, but without rebuilding derivatives that already exist
    on disk. What Drush command do I run and which option makes it skip existing files?
  criteria: Run `drush image:derive:multiple` (aliases idm, image_derivatives:generate) and add `--skip-existing`
    so it skips file/style pairs whose derivative already exists on disk.
  bundle: image_styles_generator
  rubric_ref: rubric/image_styles_generator_image_styles_generator_command@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: image_styles_generator-limit-styles
  input: Using image_styles_generator's Drush command, how do I warm derivatives for only the 'large'
    and 'thumbnail' image styles instead of every style on the site, and which image files does the command
    process?
  criteria: Pass --image-styles=large,thumbnail (comma-separated style IDs) to image:derive:multiple;
    omitting it warms all styles. The command processes every published image file (status=1, filemime
    LIKE image%).
  bundle: image_styles_generator
  rubric_ref: rubric/image_styles_generator_image_styles_generator_limit_styles@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: image_styles_generator-service
  input: In image_styles_generator, which Drupal service and method would I call from custom PHP to regenerate
    a single image-style derivative for one file entity?
  criteria: The service image_styles_generator.derivative_warmer (class DerivativeWarmer, interface DerivativeWarmerInterface);
    call regenerateImageStyleDerivativeFromFile($image_style, $file), which wraps ImageStyle::buildUri()
    + createDerivative() and returns the derivative URI.
  bundle: image_styles_generator
  rubric_ref: rubric/image_styles_generator_image_styles_generator_service@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: image_styles_generator-probe-style
  input: This Drupal site has an image style that image_styles_generator's warm command would target,
    whose human-readable label is 'ISG Probe'. Inspect the live configuration and give the machine name
    of that image style.
  criteria: The image style machine name is isg_probe (config image.style.isg_probe, label 'ISG Probe').
    image:derive:multiple loads every image_style entity, so it would warm this one.
  bundle: image_styles_generator
  rubric_ref: rubric/image_styles_generator_image_styles_generator_probe_style@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/image_styles_generator-probe-style-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/image_styles_generator-probe-style-cleanup.sh
- id: image_styles_generator-effect-width
  input: On this site there is an image style named isg_effect that image_styles_generator can warm. Inspect
    its live configuration and state the pixel width configured on its scale effect.
  criteria: The isg_effect image style has an image_scale effect with width 321 (height 200). Read it
    from config image.style.isg_effect (e.g. drush cget image.style.isg_effect effects).
  bundle: image_styles_generator
  rubric_ref: rubric/image_styles_generator_image_styles_generator_effect_width@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/image_styles_generator-effect-width-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/image_styles_generator-effect-width-cleanup.sh
- id: image_styles_generator-warm
  input: This Drupal site has an image style isg_gen and a published image file public://isg_warm_src.png,
    but no derivative for that file has been generated yet. Using the image_styles_generator module, warm
    the image-style derivatives so the isg_gen derivative of that file is written to disk.
  criteria: Run `drush image:derive:multiple` (optionally --image-styles=isg_gen). Afterwards the derivative
    file public://styles/isg_gen/public/isg_warm_src.png exists on disk.
  bundle: image_styles_generator
  rubric_ref: rubric/image_styles_generator_image_styles_generator_warm@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/image_styles_generator-warm-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/image_styles_generator-warm-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/image_styles_generator-warm-verify.sh
- id: image_styles_generator-selected
  input: This site has two image styles, isg_sela and isg_selb, and a published image public://isg_sel_src.png
    with no derivatives generated. Using image_styles_generator, warm ONLY the isg_sela style for the
    images, leaving isg_selb without a derivative for that file.
  criteria: Run `drush image:derive:multiple --image-styles=isg_sela`. The isg_sela derivative of isg_sel_src.png
    exists while the isg_selb derivative does not, proving --image-styles limited which styles were built.
  bundle: image_styles_generator
  rubric_ref: rubric/image_styles_generator_image_styles_generator_selected@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/image_styles_generator-selected-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/image_styles_generator-selected-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/image_styles_generator-selected-verify.sh
