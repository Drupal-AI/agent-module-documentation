rubrics:
- id: image_styles_generator_image_styles_generator_command
  version: '1.0'
  applicable_bundles:
  - image_styles_generator
  checks:
  - kind: must_contain_any
    values:
    - image:derive:multiple
    - image_derivatives:generate
    - idm
    - skip-existing
  scoring:
    combine: all_pass
- id: image_styles_generator_image_styles_generator_limit_styles
  version: '1.0'
  applicable_bundles:
  - image_styles_generator
  checks:
  - kind: must_contain_any
    values:
    - --image-styles
    - image-styles=large,thumbnail
  scoring:
    combine: all_pass
- id: image_styles_generator_image_styles_generator_service
  version: '1.0'
  applicable_bundles:
  - image_styles_generator
  checks:
  - kind: must_contain_any
    values:
    - image_styles_generator.derivative_warmer
    - regenerateImageStyleDerivativeFromFile
    - DerivativeWarmer
  scoring:
    combine: all_pass
- id: image_styles_generator_image_styles_generator_probe_style
  version: '1.0'
  applicable_bundles:
  - image_styles_generator
  checks:
  - kind: must_contain_any
    values:
    - isg_probe
  scoring:
    combine: all_pass
- id: image_styles_generator_image_styles_generator_effect_width
  version: '1.0'
  applicable_bundles:
  - image_styles_generator
  checks:
  - kind: must_contain_any
    values:
    - '321'
  scoring:
    combine: all_pass
- id: image_styles_generator_image_styles_generator_warm
  version: '1.0'
  applicable_bundles:
  - image_styles_generator
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
- id: image_styles_generator_image_styles_generator_selected
  version: '1.0'
  applicable_bundles:
  - image_styles_generator
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
