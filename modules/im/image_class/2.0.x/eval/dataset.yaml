metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: image_class
  version: 2.0.x
  note: 'Image Class adds a ''Class'' textfield to the image, responsive_image, media_thumbnail and media_responsive_thumbnail
    field FORMATTERS via hook_field_formatter_third_party_settings_form(). The space-separated value is
    stored at third_party_settings.image_class.class on the field''s component inside a core.entity_view_display
    config entity, and hook_preprocess_field() merges it into #item_attributes[''class''] on the rendered
    <img>. No configure route (configure=null), no settings form, no permissions, no plugins. Medium cases
    create image field(s) on Article and set the class so an agent can read it back; hard cases require
    the agent to add/target the class on a live entity_view_display and are verified against it.'
questions:
- id: image_class-where-stored
  input: The image_class Drupal module lets me add a CSS class to images. There is no settings page for
    it - how do I actually set a class for an image field, and where is that value stored in configuration?
  criteria: 'There is no configure route. On the bundle''s Manage display, use the Image (or Responsive
    image / Media thumbnail) formatter, click its cog, and enter space-separated classes in ''Class''.
    It is stored as a third-party setting on the field''s display component: core.entity_view_display.<entity>.<bundle>.<mode>
    -> content.<field>.third_party_settings.image_class.class.'
  bundle: image_class
  rubric_ref: rubric/image_class_image_class_where_stored@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: image_class-which-formatters
  input: On which field formatters does the image_class module add its 'Class' option?
  criteria: Only the image, responsive_image, media_thumbnail and media_responsive_thumbnail formatters
    (image_class checks the plugin id in hook_field_formatter_third_party_settings_form()).
  bundle: image_class
  rubric_ref: rubric/image_class_image_class_which_formatters@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: image_class-how-applied
  input: When I enter multiple classes for an image field with the image_class module, how are they applied
    to the rendered markup, and are any existing classes lost?
  criteria: 'hook_preprocess_field() splits the class string on spaces and merges it with any classes
    already on the item, writing the result to #item_attributes[''class''] so they land on the <img>.
    Existing classes are preserved (merged, not replaced).'
  bundle: image_class
  rubric_ref: rubric/image_class_image_class_how_applied@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: image_class-read-known
  input: On this Drupal site the Article content type has an image field field_ic_known whose Image formatter
    has CSS classes added via the image_class module. Inspect the live display configuration and tell
    me exactly which class(es) are set.
  criteria: field_ic_known's component in core.entity_view_display.node.article.default has third_party_settings.image_class.class
    = 'ic-rounded ic-shadow'.
  bundle: image_class
  rubric_ref: rubric/image_class_image_class_read_known@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/image_class-known-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/image_class-known-cleanup.sh
- id: image_class-onoff
  input: The Article content type on this site has two image fields, field_ic_on and field_ic_off. Exactly
    one of them has a CSS class added through the image_class module. Inspect the live display configuration
    and state which field has an image_class class (and its value).
  criteria: field_ic_on has third_party_settings.image_class.class = 'ic-hero' in core.entity_view_display.node.article.default;
    field_ic_off has no image_class setting.
  bundle: image_class
  rubric_ref: rubric/image_class_image_class_onoff@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/image_class-onoff-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/image_class-onoff-cleanup.sh
- id: image_class-add-class
  input: On this Drupal site, the Article content type has an image field field_ic_task shown with the
    Image formatter on the default view mode. Using the image_class module, add the CSS class 'img-fluid'
    to that image field's rendered output. Apply the change to the live site.
  criteria: Set third_party_settings.image_class.class on field_ic_task's component in core.entity_view_display.node.article.default
    to include 'img-fluid' (via Manage display's Class field, or by editing the entity_view_display component).
  bundle: image_class
  rubric_ref: rubric/image_class_image_class_add_class@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/image_class-addclass-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/image_class-addclass-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/image_class-addclass-verify.sh
- id: image_class-add-class-teaser
  input: On this site the Article image field field_ic_teaser is displayed in both the default and the
    Teaser view modes. Using the image_class module, make it so that ONLY in the Teaser display the image
    gets the CSS class 'teaser-thumb'. Apply the change to the live site.
  criteria: In core.entity_view_display.node.article.teaser (the Teaser view mode, not default) set field_ic_teaser's
    third_party_settings.image_class.class to include 'teaser-thumb'.
  bundle: image_class
  rubric_ref: rubric/image_class_image_class_add_class_teaser@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: site-owner
    reset: agent-module-documentation/evaluation/verify/image_class-teaser-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/image_class-teaser-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/image_class-teaser-verify.sh
