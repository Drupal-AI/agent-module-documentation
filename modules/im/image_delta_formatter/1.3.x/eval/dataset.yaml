metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: image_delta_formatter
  version: 1.3.x
  note: 'Image and Media Delta Formatter provides field formatters that render only specific deltas of
    a multi-value image/media field. image_delta_formatter (Image delta, image fields) is a normal plugin;
    media_delta_formatter (Media delta) and responsive_image_delta_formatter (Responsive image delta)
    are registered conditionally via hook_field_formatter_info_alter() only when core media / responsive_image
    is enabled. Shared ImageDeltaTrait adds two settings: deltas (integer array, required) and deltas_reversed
    (bool). No config route, no permissions. Persistent state is the formatter type + settings.deltas
    on a field component in an entity_view_display config entity (e.g. core.entity_view_display.node.article.default
    -> content.<field>.type/settings.deltas). Medium reads back the configured formatter/deltas/reversed
    on a known field; hard switches an image field''s display formatter to image_delta_formatter with
    specific deltas, verified live. Fixture fields are namespaced field_idf_* (multi-value image fields
    on Article).'
questions:
- id: image_delta_formatter-ids
  input: The Drupal contrib module image_delta_formatter lets you show only certain values of a multi-value
    image or media field. What are the field formatter plugin ids it provides, and which require the core
    media or responsive_image modules?
  criteria: image_delta_formatter (Image delta, for image fields), media_delta_formatter (Media delta,
    for media entity_reference fields, only when core media is enabled), and responsive_image_delta_formatter
    (Responsive image delta, for image fields, only when responsive_image is enabled). The media/responsive
    ones are registered via hook_field_formatter_info_alter().
  bundle: image_delta_formatter
  rubric_ref: rubric/image_delta_formatter_image_delta_formatter_ids@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: image_delta_formatter-settings
  input: When configuring the 'Image delta' formatter from image_delta_formatter, which two settings does
    it add, and how do I make it show only the first image of a multi-value field?
  criteria: It adds deltas (a required comma-separated list of 0-based positions, e.g. '0') and deltas_reversed
    (a checkbox to count from the last value). To show only the first image, set the Delta to 0.
  bundle: image_delta_formatter
  rubric_ref: rubric/image_delta_formatter_image_delta_formatter_settings@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: image_delta_formatter-where
  input: There's no settings page for image_delta_formatter. Where do I configure it and where is the
    delta selection stored?
  criteria: There is no configure route. On the entity bundle's Manage display page choose the Image/Media/Responsive
    image delta format and enter the deltas. It is stored in core.entity_view_display.<entity>.<bundle>.<mode>
    -> content.<field>.type and settings.deltas.
  bundle: image_delta_formatter
  rubric_ref: rubric/image_delta_formatter_image_delta_formatter_where@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: image_delta_formatter-known-gallery
  input: On this Drupal site, the Article content type has a multi-value image field field_idf_gallery
    whose default display uses image_delta_formatter. Inspect the live view display and tell me which
    formatter is applied to field_idf_gallery and which deltas it is configured to show.
  criteria: field_idf_gallery uses the image_delta_formatter formatter showing deltas 0 and 2 (settings.deltas
    = [0, 2]) in core.entity_view_display.node.article.default.
  bundle: image_delta_formatter
  rubric_ref: rubric/image_delta_formatter_image_delta_formatter_known_gallery@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/image_delta_formatter-known-gallery-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/image_delta_formatter-known-gallery-cleanup.sh
- id: image_delta_formatter-known-promo
  input: 'The Article content type has a multi-value image field field_idf_promo using the image delta
    formatter. Inspect its live default display configuration: is the ''reversed'' (deltas_reversed) option
    enabled for it?'
  criteria: Yes. field_idf_promo uses image_delta_formatter with deltas_reversed = true (settings.deltas
    = [0], deltas_reversed = true), so it shows the last image.
  bundle: image_delta_formatter
  rubric_ref: rubric/image_delta_formatter_image_delta_formatter_known_promo@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/image_delta_formatter-known-promo-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/image_delta_formatter-known-promo-cleanup.sh
- id: image_delta_formatter-show-first
  input: On this Drupal site the Article content type has a multi-value image field field_idf_shots currently
    rendered with the core Image formatter. Using image_delta_formatter, change the default display so
    this field shows only its first image (delta 0). Apply the change to the live site.
  criteria: Set the field_idf_shots component in core.entity_view_display.node.article.default to type
    image_delta_formatter with settings.deltas = [0].
  bundle: image_delta_formatter
