metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: improved_multi_select
  version: 1.x
  note: 'Improved Multi Select is a front-end enhancement driven entirely by the config object improved_multi_select.settings
    (route ims.settings at /admin/config/user-interface/ims, gated by ''administer site configuration'').
    It has no field widget of its own (that is the ims_options_widget submodule), no permissions of its
    own, no Drush, no plugin types. Medium/hard cases are grounded in real config keys: isall, url, selectors,
    filtertype (partial|exact|anywords|anywords_partial|allwords|allwords_partial), orderable, groupresetfilter,
    js_regex, remove_required_attr, placeholder_text, buttontext_add/addall/del/delall/moveup/movedown.
    Introspection reads those keys back; execution writes them and verifies against the live config. Scripts
    restore the shipped defaults explicitly (State is unreliable on this site).'
questions:
- id: improved_multi_select-config-route
  input: On a Drupal 11 site I enabled the improved_multi_select module. Where do I configure it (admin
    path and/or route), and what single config object stores all of its settings?
  criteria: Configure it at /admin/config/user-interface/ims (route ims.settings, permission 'administer
    site configuration'). All keys live in one config object, improved_multi_select.settings.
  bundle: improved_multi_select
  rubric_ref: rubric/improved_multi_select_improved_multi_select_config_route@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: improved_multi_select-replace-all
  input: Using improved_multi_select, which config key do I turn on so that EVERY multi-select box on
    the whole site becomes the two-panel widget, and what jQuery selector does it then target by default?
  criteria: Set isall to TRUE (the 'Replace all multi-select lists' option). When on, the module attaches
    the widget to the default selector select[multiple] on every page.
  bundle: improved_multi_select
  rubric_ref: rubric/improved_multi_select_improved_multi_select_replace_all@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: improved_multi_select-filter-modes
  input: In improved_multi_select's settings, which config key controls how the search box matches options,
    and what are its possible values?
  criteria: 'The filtertype key. Values: partial (default), exact, anywords, anywords_partial, allwords,
    allwords_partial. The _partial variants allow substring/partial-word matches.'
  bundle: improved_multi_select
  rubric_ref: rubric/improved_multi_select_improved_multi_select_filter_modes@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: improved_multi_select-known-filtertype
  input: This Drupal site already has improved_multi_select configured. Inspect the live configuration
    and tell me which filter functionality (filtertype) is currently set and what the search-box placeholder
    text is.
  criteria: 'In improved_multi_select.settings, filtertype is ''allwords_partial'' and placeholder_text
    is ''ims_find_here''. Read with: drush cget improved_multi_select.settings.'
  bundle: improved_multi_select
  rubric_ref: rubric/improved_multi_select_improved_multi_select_known_filtertype@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/improved_multi_select-known-filtertype-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/improved_multi_select-known-filtertype-cleanup.sh
- id: improved_multi_select-known-replaceall
  input: On this site, is improved_multi_select currently configured to replace ALL multi-select boxes
    site-wide, and what custom text has been set for the 'Add' button? Inspect the running configuration
    to answer.
  criteria: 'Yes: improved_multi_select.settings has isall=true, and buttontext_add is ''ADDIMS''. Read
    via drush cget improved_multi_select.settings.'
  bundle: improved_multi_select
  rubric_ref: rubric/improved_multi_select_improved_multi_select_known_replaceall@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/improved_multi_select-known-replaceall-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/improved_multi_select-known-replaceall-cleanup.sh
- id: improved_multi_select-set-replaceall
  input: On this Drupal site, configure the improved_multi_select module so that its two-panel widget
    replaces ALL multi-select boxes site-wide, and set the search-box placeholder text to exactly 'Filter
    options'. Apply the change to the live site.
  criteria: In improved_multi_select.settings set isall=TRUE and placeholder_text='Filter options' (e.g.
    via the settings form at /admin/config/user-interface/ims or drush/configFactory).
  bundle: improved_multi_select
  rubric_ref: rubric/improved_multi_select_improved_multi_select_set_replaceall@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/improved_multi_select-set-replaceall-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/improved_multi_select-set-replaceall-reset.sh
    verify: agent-module-documentation/evaluation/verify/improved_multi_select-set-replaceall-verify.sh
- id: improved_multi_select-enable-reorder
  input: Configure improved_multi_select so that editors can re-order selected items with Move up / Move
    down buttons, and change the 'Add' button label to exactly 'ADD'. Apply the change to the live site.
  criteria: In improved_multi_select.settings set orderable=TRUE and buttontext_add='ADD'.
  bundle: improved_multi_select
  rubric_ref: rubric/improved_multi_select_improved_multi_select_enable_reorder@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/improved_multi_select-enable-reorder-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/improved_multi_select-enable-reorder-reset.sh
    verify: agent-module-documentation/evaluation/verify/improved_multi_select-enable-reorder-verify.sh
