metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: ims_options_widget
  version: 1.x
  note: 'IMS Options Widget is a single field widget plugin ImsOptionsWidget (id ''ims_options_select'',
    label ''IMS select list'') extending core OptionsSelectWidget. It moves already-selected options to
    the top of the option list so selection order is preserved (pairs with improved_multi_select ''orderable'').
    Applies to entity_reference, list_integer, list_float, list_string; multiple_values=TRUE; does NOT
    support optgroups. No settings, no configure route, no config schema, no permissions, no Drush, no
    plugin types. Its only persistent state is the widget ''type'' on a field component in an entity_form_display
    config entity. Medium/hard cases are grounded in that real form-display config: introspection reads
    back which field uses the ims_options_select widget; execution switches a list field''s widget to
    ims_options_select, verified against the live entity_form_display. Scripts create/remove namespaced
    list fields (with allowed_values) on Article.'
questions:
- id: ims_options_widget-id
  input: What is the machine name and label of the field widget that the ims_options_widget module adds,
    and which core widget does it extend?
  criteria: It adds the 'IMS select list' widget (id ims_options_select), which extends core's OptionsSelectWidget.
  bundle: ims_options_widget
  rubric_ref: rubric/ims_options_widget_ims_options_widget_id@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: ims_options_widget-behavior
  input: What does the ims_options_widget 'IMS select list' widget do differently from the standard select-list
    widget, and why is that useful with improved_multi_select?
  criteria: It moves the currently selected options to the top of the option list (in stored order), so
    when improved_multi_select's 'Allow re-ordering of selected items' (orderable) is on, the picked order
    is preserved on the edit form.
  bundle: ims_options_widget
  rubric_ref: rubric/ims_options_widget_ims_options_widget_behavior@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: ims_options_widget-field-types
  input: Which field types can use the ims_options_select widget, and does it support optgroups?
  criteria: It applies to entity_reference, list_integer, list_float and list_string fields. It does NOT
    support optgroups (supportsGroups() returns FALSE; grouped values are flattened).
  bundle: ims_options_widget
  rubric_ref: rubric/ims_options_widget_ims_options_widget_field_types@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: ims_options_widget-known-widget
  input: On this Drupal site, the Article content type has a multi-value list field field_imsw_known configured
    with the ims_options_widget module. Inspect the live default form display and give the exact widget
    type (machine name) it uses.
  criteria: In core.entity_form_display.node.article.default the field_imsw_known component uses widget
    type ims_options_select. Read via drush cget core.entity_form_display.node.article.default content.field_imsw_known.
  bundle: ims_options_widget
  rubric_ref: rubric/ims_options_widget_ims_options_widget_known_widget@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/ims_options_widget-known-widget-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/ims_options_widget-known-widget-cleanup.sh
- id: ims_options_widget-known-which
  input: The Article content type on this site has two list fields, field_imsw_a and field_imsw_b. Exactly
    one of them uses the IMS select list widget (ims_options_select); the other uses the core select-list
    widget. Inspect the live form display and state which field uses the IMS select list widget.
  criteria: field_imsw_a uses widget type ims_options_select; field_imsw_b uses options_select. Read core.entity_form_display.node.article.default.
  bundle: ims_options_widget
  rubric_ref: rubric/ims_options_widget_ims_options_widget_known_which@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/ims_options_widget-known-which-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/ims_options_widget-known-which-cleanup.sh
- id: ims_options_widget-set-string
  input: On this Drupal site, the Article content type has a multi-value list (text) field field_imsw_task
    that currently uses the core select-list widget. Using the ims_options_widget module, change its default
    form-display widget to the 'IMS select list' (ims_options_select). Apply the change to the live site.
  criteria: In core.entity_form_display.node.article.default the field_imsw_task component has type=ims_options_select
    (set via Manage form display or setComponent).
  bundle: ims_options_widget
  rubric_ref: rubric/ims_options_widget_ims_options_widget_set_string@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/ims_options_widget-set-string-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/ims_options_widget-set-string-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/ims_options_widget-set-string-verify.sh
- id: ims_options_widget-set-integer
  input: On this Drupal site, the Article content type has a multi-value list (integer) field field_imsw_pri
    currently using the core select-list widget. Use the ims_options_widget module to switch its default
    form-display widget to the IMS select list (ims_options_select). Apply the change to the live site.
  criteria: In core.entity_form_display.node.article.default the field_imsw_pri component has type=ims_options_select.
  bundle: ims_options_widget
  rubric_ref: rubric/ims_options_widget_ims_options_widget_set_integer@1.0
