rubrics:
- id: ims_options_widget_ims_options_widget_id
  version: '1.0'
  applicable_bundles:
  - ims_options_widget
  checks:
  - kind: must_contain_any
    values:
    - ims_options_select
    - IMS select list
    - OptionsSelectWidget
  scoring:
    combine: all_pass
- id: ims_options_widget_ims_options_widget_behavior
  version: '1.0'
  applicable_bundles:
  - ims_options_widget
  checks:
  - kind: must_contain_any
    values:
    - top
    - selected
    - order
  scoring:
    combine: all_pass
- id: ims_options_widget_ims_options_widget_field_types
  version: '1.0'
  applicable_bundles:
  - ims_options_widget
  checks:
  - kind: must_contain_any
    values:
    - entity_reference
    - list_integer
    - list_string
    - list_float
  scoring:
    combine: all_pass
- id: ims_options_widget_ims_options_widget_known_widget
  version: '1.0'
  applicable_bundles:
  - ims_options_widget
  checks:
  - kind: must_contain_any
    values:
    - ims_options_select
  scoring:
    combine: all_pass
- id: ims_options_widget_ims_options_widget_known_which
  version: '1.0'
  applicable_bundles:
  - ims_options_widget
  checks:
  - kind: must_contain_any
    values:
    - field_imsw_a
  scoring:
    combine: all_pass
- id: ims_options_widget_ims_options_widget_set_string
  version: '1.0'
  applicable_bundles:
  - ims_options_widget
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
- id: ims_options_widget_ims_options_widget_set_integer
  version: '1.0'
  applicable_bundles:
  - ims_options_widget
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
