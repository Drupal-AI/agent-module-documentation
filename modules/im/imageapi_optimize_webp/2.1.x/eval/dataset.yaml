metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: imageapi_optimize_webp
  version: 2.1.x
  note: 'imageapi_optimize_webp adds an ImageAPIOptimizeProcessor plugin id imageapi_optimize_webp (label
    ''WebP Deriver'') that clones a styled image to .webp via imagewebp() at a configurable quality (default
    75). You add it to an imageapi_optimize_pipeline (config entity, id key ''name'', config prefix imageapi_optimize.pipeline.*,
    processors keyed by uuid with id/data/weight/uuid). Requires imageapi_optimize. No settings form/configure
    route/permissions/Drush. Introspection reads a pipeline''s processor id and quality; execution builds
    a WebP pipeline and adds the processor to an empty pipeline. NOTE: on this shared site remote_stream_wrapper
    overrides ImageStyle without imageapi_optimize''s hasPipeline(), so deleting a pipeline entity fatals
    during flush; the scripts therefore delete pipeline CONFIG via the config factory (\Drupal::configFactory()->getEditable(''imageapi_optimize.pipeline.X'')->delete())
    which is clean. No node operations.'
questions:
- id: imageapi_optimize_webp-processor-id
  input: I use the ImageAPI Optimize (Image Optimize) module in Drupal and want to also generate WebP
    versions of my styled images. Which processor does the imageapi_optimize_webp module add that I should
    put in my pipeline, and what is its default image quality?
  criteria: It adds the 'WebP Deriver' processor (plugin id imageapi_optimize_webp). Add it to an Image
    Optimize pipeline; its quality setting defaults to 75 (1-100). It clones each styled derivative to
    a .webp file.
  bundle: imageapi_optimize_webp
  rubric_ref: rubric/imageapi_optimize_webp_imageapi_optimize_webp_processor_id@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: imageapi_optimize_webp-how-use
  input: How do I actually turn on WebP output with imageapi_optimize_webp for my image styles?
  criteria: Create an Image Optimize pipeline (Configuration > Media > Image Optimize pipelines), add
    the WebP Deriver processor to it, then assign that pipeline to individual image styles or set it as
    the site-wide default pipeline. The module generates and serves the .webp derivatives automatically.
  bundle: imageapi_optimize_webp
  rubric_ref: rubric/imageapi_optimize_webp_imageapi_optimize_webp_how_use@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: imageapi_optimize_webp-serving
  input: Once imageapi_optimize_webp has generated a .webp derivative, how does Drupal serve it, and what
    happens to the .webp when the image style is flushed?
  criteria: 'It overrides the image.style_public / image.style_private route controller (ImageStyleDownloadController::deliver):
    a request for <derivative>.webp derives the source, generates the normal derivative, and returns the
    .webp with Content-Type image/webp when it exists. hook_image_style_flush deletes the matching .webp
    when the derivative is flushed.'
  bundle: imageapi_optimize_webp
  rubric_ref: rubric/imageapi_optimize_webp_imageapi_optimize_webp_serving@1.0
  tags:
  - mode:recipe
  - difficulty:easy
