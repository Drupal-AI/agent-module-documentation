rubrics:
- id: image_style_warmer_image_style_warmer_upload_vs_queue
  version: '1.0'
  applicable_bundles:
  - image_style_warmer
  checks:
  - kind: must_contain_any
    values:
    - initial_image_styles
    - queue_image_styles
    - image_style_warmer_pregenerator
    - queue worker
  scoring:
    combine: all_pass
- id: image_style_warmer_image_style_warmer_config_location
  version: '1.0'
  applicable_bundles:
  - image_style_warmer
  checks:
  - kind: must_contain_any
    values:
    - image_style_warmer.settings
    - admin/config/development/performance/image-style-warmer
    - Performance
  scoring:
    combine: all_pass
- id: image_style_warmer_image_style_warmer_warm_existing
  version: '1.0'
  applicable_bundles:
  - image_style_warmer
  checks:
  - kind: must_contain_any
    values:
    - isw:wu
    - image-style-warmer:warm-up
    - drush
  scoring:
    combine: all_pass
- id: image_style_warmer_image_style_warmer_which_queued
  version: '1.0'
  applicable_bundles:
  - image_style_warmer
  checks:
  - kind: must_contain_any
    values:
    - large
  scoring:
    combine: all_pass
- id: image_style_warmer_image_style_warmer_which_initial
  version: '1.0'
  applicable_bundles:
  - image_style_warmer
  checks:
  - kind: must_contain_any
    values:
    - medium
  scoring:
    combine: all_pass
- id: image_style_warmer_image_style_warmer_split_styles
  version: '1.0'
  applicable_bundles:
  - image_style_warmer
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
- id: image_style_warmer_image_style_warmer_warm_thumbnail
  version: '1.0'
  applicable_bundles:
  - image_style_warmer
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
