metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: image_style_warmer
  version: 1.3.x
  note: 'Image Style Warmer pre-generates image style derivatives. Its entire persistent config is the
    config object image_style_warmer.settings with two sequence keys: initial_image_styles (styles built
    synchronously at request end via the service''s destruct()) and queue_image_styles (styles built by
    the image_style_warmer_pregenerator cron QueueWorker). There is no per-field config. Medium/hard cases
    are grounded in that real config object and core image styles (thumbnail/medium/large exist by default).
    Introspection reads back which style is initial vs queued; execution sets the two lists and is verified
    against the live config.'
questions:
- id: image_style_warmer-upload-vs-queue
  input: In the Drupal contrib module Image Style Warmer, what is the difference between the two lists
    of image styles you can configure, and how does each list get generated? Name the two config keys.
  criteria: image_style_warmer.settings has initial_image_styles (generated synchronously at the end of
    the request, via the warmer service's destruct()) and queue_image_styles (pushed to the image_style_warmer_pregenerator
    queue and generated later by its cron QueueWorker).
  bundle: image_style_warmer
  rubric_ref: rubric/image_style_warmer_image_style_warmer_upload_vs_queue@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: image_style_warmer-config-location
  input: I enabled Image Style Warmer on a Drupal 11 site. Where is its settings page and which config
    object stores the chosen image styles?
  criteria: Settings are at /admin/config/development/performance/image-style-warmer (route image_style_warmer.settings,
    under Configuration > Development > Performance, permission 'administer site configuration'), and
    the values are stored in the image_style_warmer.settings config object.
  bundle: image_style_warmer
  rubric_ref: rubric/image_style_warmer_image_style_warmer_config_location@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: image_style_warmer-warm-existing
  input: I just added Image Style Warmer and configured some initial image styles, but there are already
    thousands of images on the site. How do I generate the derivatives for all the existing images without
    waiting for visitors?
  criteria: Run the Drush command image-style-warmer:warm-up (alias isw:wu), which batches over every
    existing file and warms it with the initial_image_styles list. For queue_image_styles, run the image_style_warmer_pregenerator
    queue via cron or 'drush queue:run image_style_warmer_pregenerator'.
  bundle: image_style_warmer
  rubric_ref: rubric/image_style_warmer_image_style_warmer_warm_existing@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: image_style_warmer-which-queued
  input: On this Drupal site, Image Style Warmer is configured. Which image style is set to be generated
    in the background via the cron queue worker (not synchronously on upload)? Give the image style machine
    name.
  criteria: The 'large' image style is in image_style_warmer.settings queue_image_styles, so it is generated
    by the image_style_warmer_pregenerator cron queue worker. (The 'thumbnail' style is in initial_image_styles
    and is generated synchronously on upload.)
  bundle: image_style_warmer
  rubric_ref: rubric/image_style_warmer_image_style_warmer_which_queued@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/image_style_warmer-queue-style-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/image_style_warmer-queue-style-cleanup.sh
- id: image_style_warmer-which-initial
  input: On this Drupal site, Image Style Warmer is configured. Which image style is generated immediately
    (synchronously) when an image file is uploaded? Give the image style machine name.
  criteria: The 'medium' image style is listed in image_style_warmer.settings initial_image_styles, so
    it is generated during the request when a file is saved.
  bundle: image_style_warmer
  rubric_ref: rubric/image_style_warmer_image_style_warmer_which_initial@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/image_style_warmer-initial-style-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/image_style_warmer-initial-style-cleanup.sh
- id: image_style_warmer-split-styles
  input: On this Drupal site, configure Image Style Warmer so that the 'medium' image style is generated
    immediately when an image is uploaded (synchronously), and the 'large' image style is generated later
    in the background via the cron queue worker. Apply the change to the live site.
  criteria: In image_style_warmer.settings, initial_image_styles contains 'medium' and queue_image_styles
    contains 'large' (e.g. set both keys on the config object and save, or tick the checkboxes on the
    settings form).
  bundle: image_style_warmer
  rubric_ref: rubric/image_style_warmer_image_style_warmer_split_styles@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/image_style_warmer-split-styles-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/image_style_warmer-split-styles-reset.sh
    verify: agent-module-documentation/evaluation/verify/image_style_warmer-split-styles-verify.sh
- id: image_style_warmer-warm-thumbnail
  input: My Drupal site has Image Style Warmer installed. I want the small thumbnail version of every
    image to be built as soon as the image is uploaded, so pages never have to wait to create it. Set
    that up on the live site.
  criteria: Add the 'thumbnail' image style to initial_image_styles in image_style_warmer.settings so
    it is generated synchronously on upload (via the settings form's Initial image styles checkboxes,
    or by setting the config key and saving).
  bundle: image_style_warmer
  rubric_ref: rubric/image_style_warmer_image_style_warmer_warm_thumbnail@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: site-owner
    reset: agent-module-documentation/evaluation/verify/image_style_warmer-warm-thumbnail-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/image_style_warmer-warm-thumbnail-reset.sh
    verify: agent-module-documentation/evaluation/verify/image_style_warmer-warm-thumbnail-verify.sh
