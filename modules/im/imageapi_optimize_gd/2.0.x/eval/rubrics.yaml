rubrics:
- id: imageapi_optimize_gd_imageapi_optimize_gd_plugin_basics
  version: '1.0'
  applicable_bundles:
  - imageapi_optimize_gd
  checks:
  - kind: must_contain_any
    values:
    - GD
    - processor
    - imageapi_optimize_gd
  scoring:
    combine: all_pass
- id: imageapi_optimize_gd_imageapi_optimize_gd_how_to_use
  version: '1.0'
  applicable_bundles:
  - imageapi_optimize_gd
  checks:
  - kind: must_contain_any
    values:
    - pipeline
    - Image Optimize
    - imageapi_optimize.pipeline
  scoring:
    combine: all_pass
- id: imageapi_optimize_gd_imageapi_optimize_gd_requires_gd
  version: '1.0'
  applicable_bundles:
  - imageapi_optimize_gd
  checks:
  - kind: must_contain_any
    values:
    - GD
    - imagegd2
    - GD library
  scoring:
    combine: all_pass
- id: imageapi_optimize_gd_imageapi_optimize_gd_known_quality
  version: '1.0'
  applicable_bundles:
  - imageapi_optimize_gd
  checks:
  - kind: must_contain_any
    values:
    - '42'
  scoring:
    combine: all_pass
- id: imageapi_optimize_gd_imageapi_optimize_gd_build_pipeline
  version: '1.0'
  applicable_bundles:
  - imageapi_optimize_gd
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
- id: imageapi_optimize_gd_imageapi_optimize_gd_build_pipeline_layman
  version: '1.0'
  applicable_bundles:
  - imageapi_optimize_gd
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
