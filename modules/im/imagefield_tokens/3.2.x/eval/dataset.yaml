metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: imagefield_tokens
  version: 3.2.x
  note: 'Image Field Tokens extends the core Image field with token-aware widgets/formatters (no field
    type, no settings, no permission, no config schema). Code-grounded facts: widget ''imagefield_tokens''
    (extends core image_image) shows a token-tree link and lets editors put tokens like [node:title] into
    Alt/Title; widget ''imagefield_tokens_widget_crop'' only exists when image_widget_crop is enabled;
    formatter ''imagefield_tokens'' (extends core image formatter) runs token->replace() on alt/title
    at render with BubbleableMetadata cache info; formatter ''imagefield_tokens_colorbox'' only when colorbox
    is enabled; depends on token, image, media_library. IMPORTANT (verified live on this Drupal 11.4 site):
    the imagefield_tokens FORMATTER is currently incompatible - ImageFieldTokensFormatter::create() passes
    the pre-11.4 argument list to core ImageFormatter::__construct() (which gained an 11th arg $imageDerivativeUtilities
    in 11.4), so selecting the formatter throws ArgumentCountError. The WIDGET works fine. Therefore all
    medium/hard cases here exercise the working WIDGET (selecting it on Manage form display and its preview_image_style
    setting), not the formatter. Fixtures namespaced field_ift_*.'
questions:
- id: imagefield_tokens-what-it-adds
  input: I want editors to be able to put tokens like [node:title] into the Alt and Title text of a core
    Image field, using the imagefield_tokens module. Which field widget do I select, and what does it
    add to the image widget?
  criteria: Select the 'imagefield_tokens' field widget on the Image field's Manage form display. It extends
    the core image_image widget and adds a token-tree link so editors can insert entity tokens (e.g. [node:title])
    into the Alt and Title fields; the module also provides an imagefield_tokens formatter that replaces
    those tokens on display.
  bundle: imagefield_tokens
  rubric_ref: rubric/imagefield_tokens_imagefield_tokens_what_it_adds@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: imagefield_tokens-conditional
  input: The imagefield_tokens module provides an extra crop widget and a Colorbox formatter, but they
    don't always appear. What controls whether imagefield_tokens_widget_crop and imagefield_tokens_colorbox
    are available?
  criteria: The imagefield_tokens_widget_crop widget is only available when the image_widget_crop module
    is enabled (hook_field_widget_info_alter removes it otherwise), and the imagefield_tokens_colorbox
    formatter is only available when the colorbox module is enabled (hook_field_formatter_info_alter removes
    it otherwise).
  bundle: imagefield_tokens
  rubric_ref: rubric/imagefield_tokens_imagefield_tokens_conditional@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: imagefield_tokens-replacement
  input: In the imagefield_tokens module, where are the tokens that an editor types into an image's Alt/Title
    actually stored, and when/how are they turned into real text?
  criteria: The raw token text is stored verbatim in the core image field item's alt/title values (no
    new columns). The imagefield_tokens formatter's viewElements() runs the token service ($this->tokenService->replace())
    against the host entity at render time (also merging BubbleableMetadata for cache correctness); the
    widget likewise previews the replacement using \Drupal::token()->replace().
  bundle: imagefield_tokens
  rubric_ref: rubric/imagefield_tokens_imagefield_tokens_replacement@1.0
  tags:
  - mode:recipe
  - difficulty:easy
