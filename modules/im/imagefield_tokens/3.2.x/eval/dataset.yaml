  criteria: 'field_ift_wid: in core.entity_form_display.node.article.default its component uses widget
    type ''imagefield_tokens''.'
  bundle: imagefield_tokens
  rubric_ref: rubric/imagefield_tokens_imagefield_tokens_known_widget@1.0
