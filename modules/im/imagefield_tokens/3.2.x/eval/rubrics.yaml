rubrics:
- id: imagefield_tokens_imagefield_tokens_what_it_adds
  version: '1.0'
  applicable_bundles:
  - imagefield_tokens
  checks:
  - kind: must_contain_any
    values:
    - imagefield_tokens
    - token
    - widget
  scoring:
    combine: all_pass
- id: imagefield_tokens_imagefield_tokens_conditional
  version: '1.0'
  applicable_bundles:
  - imagefield_tokens
  checks:
  - kind: must_contain_any
    values:
    - image_widget_crop
    - colorbox
    - imagefield_tokens_widget_crop
    - imagefield_tokens_colorbox
  scoring:
    combine: all_pass
- id: imagefield_tokens_imagefield_tokens_replacement
  version: '1.0'
  applicable_bundles:
  - imagefield_tokens
  checks:
  - kind: must_contain_any
    values:
    - token
    - replace
    - viewElements
    - render
  scoring:
    combine: all_pass
- id: imagefield_tokens_imagefield_tokens_known_widget
  version: '1.0'
  applicable_bundles:
  - imagefield_tokens
  checks:
  - kind: must_contain_any
    values:
    - field_ift_wid
  scoring:
    combine: all_pass
- id: imagefield_tokens_imagefield_tokens_known_style
  version: '1.0'
  applicable_bundles:
  - imagefield_tokens
  checks:
  - kind: must_contain_any
    values:
    - medium
  scoring:
    combine: all_pass
- id: imagefield_tokens_imagefield_tokens_set_widget
  version: '1.0'
  applicable_bundles:
  - imagefield_tokens
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
- id: imagefield_tokens_imagefield_tokens_set_widget_style
  version: '1.0'
  applicable_bundles:
  - imagefield_tokens
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
