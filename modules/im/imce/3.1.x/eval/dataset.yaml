metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: imce
  version: 3.1.x
  note: Imce's configuration surface (profiles, role assignment, folder permissions) is standard config,
    and integration (field widgets, editor dialogs, plugins, the Imce facade) is code/config guidance,
    so all cases are `recipe` (response-graded), not `execution` (live-state).
questions:
- id: imce-profile-entity
  input: On a Drupal 11 site with Imce, I want to define a file-manager configuration that limits uploads
    to a per-user personal folder. Which config entity type stores this, and what is the config object
    id prefix for an exported profile? Name them.
  criteria: The `imce_profile` config entity (exported as `imce.profile.<id>`), which holds extensions,
    maxsize, quota, image limits, and a `folders` tree with per-folder permissions.
  bundle: imce
  rubric_ref: rubric/imce_imce_profile_entity@1.0
  tags:
  - mode:recipe
- id: imce-personal-folder-token
  input: In an Imce profile I want every user to get their own private folder tree. What do I put in the
    folder path so each user gets a separate directory? Show the value.
  criteria: Use a token in the folder path, e.g. `users/user[user:uid]`, so `folders[].path` resolves
    to a per-user personal directory.
  bundle: imce
  rubric_ref: rubric/imce_imce_personal_folder_token@1.0
  tags:
  - mode:recipe
- id: imce-role-profile-mapping
  input: Where does Imce store which profile applies to a user's role for a given stream wrapper scheme,
    and which method resolves the profile for the current user at runtime? Name the config object/key
    and the method.
  criteria: Role-to-profile mapping lives in the `imce.settings` config object under `roles_profiles`
    (role -> profile per scheme); `Imce::userProfile()` resolves the profile for the user's roles.
  bundle: imce
  rubric_ref: rubric/imce_imce_role_profile_mapping@1.0
  tags:
  - mode:recipe
- id: imce-enable-file-widget
  input: I want to enable the Imce file browser on a file/image field widget in Drupal so editors can
    pick existing server files. Show the third-party settings config to add to the field widget.
  criteria: 'Add Imce as a widget third-party setting: `third_party_settings.imce.enabled: true` (Imce
    attaches its browser to enabled file/image widgets).'
  bundle: imce
  rubric_ref: rubric/imce_imce_enable_file_widget@1.0
  tags:
  - mode:recipe
- id: imce-plugin-type
  input: I want to add a brand-new file operation (like "rename") to Imce's file manager on Drupal 11.
    What plugin type do I implement, which annotation and namespace/directory does it use, and what base
    class do I extend?
  criteria: 'Implement the `ImcePlugin` plugin type: a class in `Plugin/ImcePlugin/` with the `@ImcePlugin`
    annotation (declaring an `operations` map) extending `ImcePluginBase`.'
  bundle: imce
  rubric_ref: rubric/imce_imce_plugin_type@1.0
  tags:
  - mode:recipe
- id: imce-plugin-folder-permission
  input: In a custom Imce plugin, how do I add a new folder-level permission checkbox (like "rename files")
    that shows up per folder in the profile form? Which method do I implement?
  criteria: Implement `permissionInfo()` on the ImcePlugin; the returned keys become per-folder permission
    checkboxes stored on each folder in the profile.
  bundle: imce
  rubric_ref: rubric/imce_imce_plugin_folder_permission@1.0
  tags:
  - mode:recipe
- id: imce-admin-route-permission
  input: Where is the Imce settings page (to manage profiles and role assignments) in a Drupal 11 site,
    what is its route name, and what permission is required to reach it?
  criteria: The settings page is at `/admin/config/media/imce` (route `imce.admin`), gated by the `administer
    imce` permission.
  bundle: imce
  rubric_ref: rubric/imce_imce_admin_route_permission@1.0
  tags:
  - mode:recipe
- id: imce-access-file-uri
  input: In custom PHP on a Drupal site, I need to check whether the current user is allowed to access
    a given file URI through Imce (e.g. from hook_file_download). Which Imce facade method do I call?
  criteria: Call the static facade `Imce::accessFileUri($uri, $user)` (used by Imce's `hook_file_download`
    to grant file access).
  bundle: imce
  rubric_ref: rubric/imce_imce_access_file_uri@1.0
  tags:
  - mode:recipe
