rubrics:
- id: imce_imce_profile_entity
  version: '1.0'
  applicable_bundles:
  - imce
  checks:
  - kind: must_contain_any
    values:
    - imce_profile
    - imce.profile.
  scoring:
    combine: all_pass
- id: imce_imce_personal_folder_token
  version: '1.0'
  applicable_bundles:
  - imce
  checks:
  - kind: must_contain_any
    values:
    - users/user[user:uid]
    - '[user:uid]'
  scoring:
    combine: all_pass
- id: imce_imce_role_profile_mapping
  version: '1.0'
  applicable_bundles:
  - imce
  checks:
  - kind: must_contain_any
    values:
    - roles_profiles
    - imce.settings
    - Imce::userProfile
    - userProfile
  scoring:
    combine: all_pass
- id: imce_imce_enable_file_widget
  version: '1.0'
  applicable_bundles:
  - imce
  checks:
  - kind: must_contain_any
    values:
    - third_party_settings
    - 'imce:'
    - 'enabled: true'
  scoring:
    combine: all_pass
- id: imce_imce_plugin_type
  version: '1.0'
  applicable_bundles:
  - imce
  checks:
  - kind: must_contain_any
    values:
    - ImcePlugin
    - '@ImcePlugin'
    - ImcePluginBase
    - Plugin/ImcePlugin
  scoring:
    combine: all_pass
- id: imce_imce_plugin_folder_permission
  version: '1.0'
  applicable_bundles:
  - imce
  checks:
  - kind: must_contain_any
    values:
    - permissionInfo
  scoring:
    combine: all_pass
- id: imce_imce_admin_route_permission
  version: '1.0'
  applicable_bundles:
  - imce
  checks:
  - kind: must_contain_any
    values:
    - imce.admin
    - /admin/config/media/imce
    - administer imce
  scoring:
    combine: all_pass
- id: imce_imce_access_file_uri
  version: '1.0'
  applicable_bundles:
  - imce
  checks:
  - kind: must_contain_any
    values:
    - Imce::accessFileUri
    - accessFileUri
  scoring:
    combine: all_pass
