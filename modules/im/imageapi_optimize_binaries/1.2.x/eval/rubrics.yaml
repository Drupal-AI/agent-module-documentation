rubrics:
- id: imageapi_optimize_binaries_imageapi_optimize_binaries_png_processors
  version: '1.0'
  applicable_bundles:
  - imageapi_optimize_binaries
  checks:
  - kind: must_contain_any
    values:
    - pngquant
    - optipng
    - pngcrush
    - pngout
    - advpng
    - advdef
  scoring:
    combine: all_pass
- id: imageapi_optimize_binaries_imageapi_optimize_binaries_executable_path
  version: '1.0'
  applicable_bundles:
  - imageapi_optimize_binaries
  checks:
  - kind: must_contain_any
    values:
    - manual_executable_path
    - configure imageapi_optimize_binary paths
    - Manually set path
  scoring:
    combine: all_pass
- id: imageapi_optimize_binaries_imageapi_optimize_binaries_shipped_pipeline
  version: '1.0'
  applicable_bundles:
  - imageapi_optimize_binaries
  checks:
  - kind: must_contain_any
    values:
    - local_binaries
    - default_pipeline
  scoring:
    combine: all_pass
- id: imageapi_optimize_binaries_imageapi_optimize_binaries_known_quality
  version: '1.0'
  applicable_bundles:
  - imageapi_optimize_binaries
  checks:
  - kind: must_contain_any
    values:
    - '77'
  scoring:
    combine: all_pass
- id: imageapi_optimize_binaries_imageapi_optimize_binaries_known_path
  version: '1.0'
  applicable_bundles:
  - imageapi_optimize_binaries
  checks:
  - kind: must_contain_any
    values:
    - /opt/custom/bin/pngquant
  scoring:
    combine: all_pass
- id: imageapi_optimize_binaries_imageapi_optimize_binaries_build_pipeline
  version: '1.0'
  applicable_bundles:
  - imageapi_optimize_binaries
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
- id: imageapi_optimize_binaries_imageapi_optimize_binaries_default_pipeline
  version: '1.0'
  applicable_bundles:
  - imageapi_optimize_binaries
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
