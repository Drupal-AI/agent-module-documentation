- id: imageapi_optimize_binaries-build-pipeline
  input: Using the imageapi_optimize_binaries module, create an Image Optimize pipeline with machine name
    imageapi_bin_eval that contains a single jpegoptim processor configured with a JPEG quality of 82.
    Apply the change to the live site.
  criteria: Create the imageapi_optimize_pipeline config entity named imageapi_bin_eval and add a processor
