    with.
  criteria: '77: in imageapi_optimize.pipeline.imageapi_bin_evalq the jpegoptim processor''s data.quality
    is 77 (readable via `drush cget imageapi_optimize.pipeline.imageapi_bin_evalq processors`).'
  bundle: imageapi_optimize_binaries
  rubric_ref: rubric/imageapi_optimize_binaries_imageapi_optimize_binaries_known_quality@1.0
