metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: imageapi_optimize_binaries
  version: 1.2.x
  note: Image Optimize - Binaries provides nine ImageAPIOptimizeProcessor plugin instances (advdef, advpng,
    jfifremove, jpegoptim, jpegtran, optipng, pngcrush, pngout, pngquant) that shell out to local binaries;
    the ImageAPIOptimizeProcessor plugin TYPE and the pipeline config entity are defined by the parent
    imageapi_optimize module, so provides_plugin_types=[]. It has no configure route (configure=null).
    All state is grounded in imageapi_optimize_pipeline config entities (config name imageapi_optimize.pipeline.<name>)
    whose processors[] carry {id, weight, uuid, data}, plus the shared imageapi_optimize.settings:default_pipeline
    (ships null) and the shipped optional pipeline imageapi_optimize.pipeline.local_binaries. Medium cases
    read back a known processor setting from a namespaced pipeline; hard cases build a namespaced pipeline
    (and set the default) verified against live config. Binaries need not be installed for config to be
    created/verified.
questions:
- id: imageapi_optimize_binaries-png-processors
  input: The Drupal module imageapi_optimize_binaries adds Image Optimize processor plugins that call
    local command-line binaries. Name at least three of the processor plugin ids it ships for optimizing
    PNG images.
  criteria: For PNGs it ships optipng, pngquant, pngcrush, pngout, advpng and advdef (advdef/advpng recompress
    the deflate stream). For JPEGs it ships jpegoptim, jpegtran and jfifremove.
  bundle: imageapi_optimize_binaries
  rubric_ref: rubric/imageapi_optimize_binaries_imageapi_optimize_binaries_png_processors@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: imageapi_optimize_binaries-executable-path
  input: In imageapi_optimize_binaries, if a processor's binary (say jpegoptim) is not auto-detected on
    the server's PATH, how can an administrator tell it where the executable is, and which permission
    controls that?
  criteria: Each binary processor has a manual_executable_path setting (the 'Manually set path' textfield
    on the processor form). That field is only shown to users with the 'configure imageapi_optimize_binary
    paths' permission; getFullPathToBinary() returns manual_executable_path if set, otherwise the auto-detected
    path.
  bundle: imageapi_optimize_binaries
  rubric_ref: rubric/imageapi_optimize_binaries_imageapi_optimize_binaries_executable_path@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: imageapi_optimize_binaries-shipped-pipeline
  input: imageapi_optimize_binaries ships a ready-made Image Optimize pipeline containing all of its processors.
    What is that pipeline's machine name, and which configuration setting makes a pipeline the site-wide
    default used by image styles?
  criteria: The shipped optional pipeline is local_binaries (config imageapi_optimize.pipeline.local_binaries,
    label 'Local Binaries'). The site default is set in imageapi_optimize.settings:default_pipeline (ships
    as null); set it with e.g. `drush cset imageapi_optimize.settings default_pipeline local_binaries`.
  bundle: imageapi_optimize_binaries
  rubric_ref: rubric/imageapi_optimize_binaries_imageapi_optimize_binaries_shipped_pipeline@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: imageapi_optimize_binaries-known-quality
  input: This Drupal site has an Image Optimize pipeline with machine name imageapi_bin_evalq. Inspect
