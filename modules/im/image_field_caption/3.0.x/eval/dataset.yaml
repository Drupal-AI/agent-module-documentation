metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: image_field_caption
  version: 3.0.x
  note: Image Field Caption extends the core image field (re-classing its field item) to add an optional
    rich-text caption entered per image, displayed via an 'Image with caption' formatter, with caption
    text kept in standalone DB tables rather than the field columns. Cases are `recipe` (response-graded)
    probing documented facts an agent would otherwise read source to answer; no site mutation.
questions:
- id: ifc-enable-caption
  input: On Drupal 11 I want editors to add a caption under each image on an existing image field. Using
    the Image Field Caption module, what do I turn on in field settings and which display formatter do
    I choose?
  criteria: In the image field's settings enable the 'Enable Caption field' checkbox (setting key caption_field).
    Then on Manage display set the field's format to 'Image with caption' (formatter plugin id image_caption).
    Optionally set caption_field_required to make it mandatory.
  bundle: image_field_caption
  rubric_ref: rubric/image_field_caption_ifc_enable_caption@1.0
  tags:
  - mode:recipe
- id: ifc-no-settings-page
  input: Where is the global admin settings page for the Image Field Caption module, and does it add any
    permissions or Drush commands?
  criteria: There is no global settings page — the module has no configure route. Configuration is per
    image field (field settings + Manage display formatter). It provides no permissions, no Drush commands,
    and no config schema.
  bundle: image_field_caption
  rubric_ref: rubric/image_field_caption_ifc_no_settings_page@1.0
  tags:
  - mode:recipe
- id: ifc-storage-tables
  input: In Image Field Caption, where is the caption text stored — in the image field's own columns or
    elsewhere? Name the storage.
  criteria: Captions are stored in standalone database tables (image_field_caption and image_field_caption_revision),
    not in the field columns, via the image_field_caption.storage service (ImageCaptionStorage), keyed
    by entity_type, bundle, field_name, entity_id, revision_id, language and delta.
  bundle: image_field_caption
  rubric_ref: rubric/image_field_caption_ifc_storage_tables@1.0
  tags:
  - mode:recipe
- id: ifc-formatter-class
  input: How does Image Field Caption implement its display — does it define a new field type? Name the
    formatter plugin id and what it extends.
  criteria: It does not define a new field type. It re-classes the core image field item to ImageCaptionItem
    via hook_field_info_alter, and provides a formatter plugin id 'image_caption' (ImageCaptionFormatter
    extends core ImageFormatter) that swaps the theme hook to image_caption_formatter.
  bundle: image_field_caption
  rubric_ref: rubric/image_field_caption_ifc_formatter_class@1.0
  tags:
  - mode:recipe
- id: ifc-theme-markup
  input: I want to change the HTML wrapper and CSS around an Image Field Caption caption. Which Twig template
    do I override and what element/class wraps the caption by default?
  criteria: Override templates/image-caption-formatter.html.twig in your theme (then clear caches). By
    default the caption is wrapped in <blockquote class="image-field-caption">, which you can also target
    with the CSS selector blockquote.image-field-caption.
  bundle: image_field_caption
  rubric_ref: rubric/image_field_caption_ifc_theme_markup@1.0
  tags:
  - mode:recipe
- id: ifc-read-caption-api
  input: From custom code, how do I read a stored caption for a given entity/field/delta in Image Field
    Caption? Name the service and method.
  criteria: Use the image_field_caption.storage service and call getCaption($entity_type, $bundle, $field_name,
    $entity_id, $revision_id, $language, $delta), which returns ['caption' => ..., 'caption_format' =>
    ...] or an empty array.
  bundle: image_field_caption
  rubric_ref: rubric/image_field_caption_ifc_read_caption_api@1.0
  tags:
  - mode:recipe
- id: ifc-revisions-limitation
  input: Does Image Field Caption keep a separate caption per entity revision?
  criteria: Not effectively. An image_field_caption_revision table exists but the module's revision insert/delete
    logic is commented out, so captions are stored/loaded for the current revision only.
  bundle: image_field_caption
  rubric_ref: rubric/image_field_caption_ifc_revisions_limitation@1.0
  tags:
  - mode:recipe
