rubrics:
- id: image_style_quality_isq_effect
  version: '1.0'
  applicable_bundles:
  - image_style_quality
  checks:
  - kind: must_contain_any
    values:
    - image_style_quality
    - image effect
    - quality
    - image style
  scoring:
    combine: all_pass
- id: image_style_quality_isq_default
  version: '1.0'
  applicable_bundles:
  - image_style_quality
  checks:
  - kind: must_contain_any
    values:
    - '75'
    - 0 to 100
    - 0-100
    - 0 and 100
  scoring:
    combine: all_pass
- id: image_style_quality_isq_toolkits
  version: '1.0'
  applicable_bundles:
  - image_style_quality
  checks:
  - kind: must_contain_any
    values:
    - gd
    - imagemagick
    - imagick
    - mutable_quality_toolkits
    - setModuleOverride
  scoring:
    combine: all_pass
- id: image_style_quality_isq_known_quality
  version: '1.0'
  applicable_bundles:
  - image_style_quality
  checks:
  - kind: must_contain_any
    values:
    - '42'
  scoring:
    combine: all_pass
- id: image_style_quality_isq_named_style
  version: '1.0'
  applicable_bundles:
  - image_style_quality
  checks:
  - kind: must_contain_any
    values:
    - isq_named_style
  scoring:
    combine: all_pass
- id: image_style_quality_isq_add_effect
  version: '1.0'
  applicable_bundles:
  - image_style_quality
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
- id: image_style_quality_isq_change_quality
  version: '1.0'
  applicable_bundles:
  - image_style_quality
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
