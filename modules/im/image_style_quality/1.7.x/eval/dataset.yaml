metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: image_style_quality
  version: 1.7.x
  note: 'Image Style Quality provides a configurable image effect (plugin id image_style_quality, config
    schema image.effect.image_style_quality with one key quality: integer 0-100, default 75) that sets
    output quality per image style by overriding the active toolkit''s quality config at apply time. It
    defines a mutable_quality_toolkits YAML plugin type (service image_style_quality.mutable_quality_toolkit_manager)
    shipped for gd (system.image.gd:jpeg_quality), imagemagick (imagemagick.settings:quality) and imagick
    (imagick.config:jpeg_quality). No routes, permissions, or Drush. Medium/hard cases are grounded in
    real ImageStyle config entities carrying the image_style_quality effect.'
questions:
- id: isq-effect
  input: What does the Drupal image_style_quality module add, and how do I use it to control the quality
    of a particular image style?
  criteria: It adds a configurable image effect (plugin id image_style_quality) that you add to an image
    style; its single setting 'quality' (0-100) sets that style's output/compression quality.
  bundle: image_style_quality
  rubric_ref: rubric/image_style_quality_isq_effect@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: isq-default
  input: For the image_style_quality image effect, what is the default quality value and the allowed range?
  criteria: The default quality is 75; valid values range from 0 to 100 (higher = better quality, larger
    files).
  bundle: image_style_quality
  rubric_ref: rubric/image_style_quality_isq_default@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: isq-toolkits
  input: How does image_style_quality actually change the image quality, and which image toolkits does
    it support out of the box?
  criteria: At apply time the effect overrides the active toolkit's quality config (setModuleOverride).
    The toolkit->config mapping comes from the mutable_quality_toolkits plugin type, shipped for gd (system.image.gd:jpeg_quality),
    imagemagick (imagemagick.settings:quality) and imagick (imagick.config:jpeg_quality).
  bundle: image_style_quality
  rubric_ref: rubric/image_style_quality_isq_toolkits@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: isq-known-quality
  input: On this site there is an image style called isq_probe_style that uses the image_style_quality
    effect. Inspect its live configuration and report the quality value that is set.
  criteria: The image_style_quality effect on isq_probe_style is configured with quality = 42 (image.style.isq_probe_style
    effects data.quality).
  bundle: image_style_quality
  rubric_ref: rubric/image_style_quality_isq_known_quality@1.0
  tags:
  - mode:introspection
  - difficulty:medium
