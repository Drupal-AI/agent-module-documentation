metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: imagefield_slideshow
  version: 2.0.x
  note: 'Imagefield Slideshow is purely a field formatter (id imagefield_slideshow_field_formatter, class
    ImagefieldSlideshowFieldFormatter, field type image). It has no settings form, no configure route,
    no permissions, no Drush, no config schema. Its only persistent state is the formatter''s settings
    inside an entity_view_display config entity: core.entity_view_display.<entity>.<bundle>.<mode> ->
    content.<field>.{type, settings}. Setting keys are prefixed imagefield_slideshow_* (style, style_effects,
    style_pause, prev_next, transition_speed, timeout, pager, pager_image, link_image_to). Effects: none,
    fade, fadeout, scrollHorz, flipHorz, flipVert, shuffle. All medium/hard cases create a namespaced
    multi-value image field (field_ifs_*) on the Article content type and read/write the display component;
    cleanup deletes the field.'
questions:
- id: imagefield_slideshow-formatter-id
  input: Using the imagefield_slideshow Drupal module, how do I make a multi-image field render as a slideshow?
    Which field formatter do I choose and where?
  criteria: On the bundle's Manage display page pick the 'Imagefield Slideshow' formatter (id imagefield_slideshow_field_formatter)
    for the image field. It only applies to image fields and needs a multi-value field for the slideshow
    controls to appear.
  bundle: imagefield_slideshow
  rubric_ref: rubric/imagefield_slideshow_imagefield_slideshow_formatter_id@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: imagefield_slideshow-effects
  input: Which transition effects can I choose for the imagefield_slideshow formatter, and what config
    key stores the chosen effect?
  criteria: The selectable effects are none, fade, fadeout, scrollHorz, flipHorz, flipVert and shuffle,
    stored in the formatter setting imagefield_slideshow_style_effects (default fade).
  bundle: imagefield_slideshow
  rubric_ref: rubric/imagefield_slideshow_imagefield_slideshow_effects@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: imagefield_slideshow-multivalue
  input: Why does the imagefield_slideshow slideshow (prev/next buttons and pager) not show up on my image
    field, even though I selected the formatter? What library does it use?
  criteria: The slideshow controls (prev/next, pagers) only activate when the field holds more than one
    image, so the image field must allow multiple values. The formatter renders via the bundled jQuery
    Cycle2 library (imagefield_slideshow/imagefield_slideshow).
  bundle: imagefield_slideshow
  rubric_ref: rubric/imagefield_slideshow_imagefield_slideshow_multivalue@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: imagefield_slideshow-effect
  input: On this Drupal site, the Article content type has a slideshow image field (field_ifs_gallery)
    using the imagefield_slideshow formatter on its default display. Inspect the live view-display configuration
    and state which transition effect is configured for it.
  criteria: 'The effect is scrollHorz: in core.entity_view_display.node.article.default the field_ifs_gallery
    component has settings.imagefield_slideshow_style_effects = scrollHorz.'
  bundle: imagefield_slideshow
  rubric_ref: rubric/imagefield_slideshow_imagefield_slideshow_effect@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/imagefield_slideshow-effect-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/imagefield_slideshow-effect-cleanup.sh
- id: imagefield_slideshow-style
  input: On this Drupal site, the Article content type has an image field field_ifs_promo displayed as
    an imagefield_slideshow slideshow. Inspect the live display configuration and state which image style
    the slides are rendered with.
  criteria: 'The image style is ''thumbnail'': field_ifs_promo''s component has settings.imagefield_slideshow_style
    = thumbnail on core.entity_view_display.node.article.default.'
  bundle: imagefield_slideshow
  rubric_ref: rubric/imagefield_slideshow_imagefield_slideshow_style@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/imagefield_slideshow-style-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/imagefield_slideshow-style-cleanup.sh
- id: imagefield_slideshow-enable
  input: On this Drupal site, the Article content type has a multi-value image field field_ifs_task that
    is currently displayed with the plain core Image formatter on the default view display. Using the
    imagefield_slideshow module, change that field's default display so it renders as a slideshow. Apply
    the change to the live site.
  criteria: In core.entity_view_display.node.article.default set the field_ifs_task component type to
    imagefield_slideshow_field_formatter (e.g. via setComponent() or the Manage display UI).
  bundle: imagefield_slideshow
  rubric_ref: rubric/imagefield_slideshow_imagefield_slideshow_enable@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/imagefield_slideshow-enable-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/imagefield_slideshow-enable-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/imagefield_slideshow-enable-verify.sh
- id: imagefield_slideshow-set-effect
  input: On this Drupal site, the Article field field_ifs_effect already uses the imagefield_slideshow
    slideshow formatter, but its transition effect is set to 'fade'. Change the slideshow's transition
    effect to 'flipHorz' on the default view display, and apply the change to the live site.
  criteria: Set the field_ifs_effect component's settings.imagefield_slideshow_style_effects to 'flipHorz'
    (keeping type imagefield_slideshow_field_formatter) in core.entity_view_display.node.article.default.
  bundle: imagefield_slideshow
  rubric_ref: rubric/imagefield_slideshow_imagefield_slideshow_set_effect@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/imagefield_slideshow-effect-set-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/imagefield_slideshow-effect-set-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/imagefield_slideshow-effect-set-verify.sh
