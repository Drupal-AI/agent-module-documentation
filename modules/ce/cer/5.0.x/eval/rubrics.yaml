rubrics:
- id: cer_cer_preset_basics
  version: '1.0'
  applicable_bundles:
  - cer
  checks:
  - kind: must_contain_any
    values:
    - corresponding_reference
    - /admin/config/content/cer
    - preset
  scoring:
    combine: all_pass
- id: cer_cer_when_it_syncs
  version: '1.0'
  applicable_bundles:
  - cer
  checks:
  - kind: must_contain_any
    values:
    - hook_entity_insert
    - hook_entity_update
    - hook_entity_delete
    - re-save
    - resave
  scoring:
    combine: all_pass
- id: cer_cer_alter_hook
  version: '1.0'
  applicable_bundles:
  - cer
  checks:
  - kind: must_contain_any
    values:
    - hook_cer_differences_alter
    - cer_differences
  scoring:
    combine: all_pass
- id: cer_cer_known_preset
  version: '1.0'
  applicable_bundles:
  - cer
  checks:
  - kind: must_contain_any
    values:
    - field_cer_known_a
    - field_cer_known_b
  scoring:
    combine: all_pass
- id: cer_cer_enabled_preset
  version: '1.0'
  applicable_bundles:
  - cer
  checks:
  - kind: must_contain_any
    values:
    - cer_on
  scoring:
    combine: all_pass
- id: cer_cer_two_way
  version: '1.0'
  applicable_bundles:
  - cer
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
- id: cer_cer_self_reference
  version: '1.0'
  applicable_bundles:
  - cer
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
