metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: blockgroup
  version: 2.0.x
  note: 'Block Group bundles several blocks into one placeable block. Creating a `block_group_content`
    config entity (config name blockgroup.block_group_content.<id>; only id + label exported) registers
    a derived block plugin `block_group:<id>` and, via hook_system_info_alter(), a theme region named
    after the group id. Cases span three tiers: easy/recipe (response-graded facts from 2.0.x/agent/),
    medium/introspection (a setup script installs a KNOWN block_group_content entity, the agent inspects
    the running site via drush to answer, a cleanup script removes it), and hard/execution (a reset script
    deletes any matching group, the agent creates the block_group_content entity on the live site, a verify
    script checks live state — reset -> model -> verify). Grounded in module source; the module ships
    no Drush commands or services, so hard cases use the entity storage API.'
questions:
- id: blockgroup-config-entity-type
  input: On a Drupal 11 site with the Block Group (`blockgroup`) module, what kind of Drupal object represents
    a block group, what is its entity type id, and which fields does it store?
  criteria: 'A block group is a config entity of type `block_group_content` (config name blockgroup.block_group_content.<id>).
    It exports only two meaningful keys: `id` (machine name) and `label` (human name); there are no other
    configurable fields.'
  bundle: blockgroup
  rubric_ref: rubric/blockgroup_blockgroup_config_entity_type@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: blockgroup-derived-block
  input: How does the Block Group module turn a saved block group into something you can place on the
    block layout page? What block plugin id is produced for a group whose machine name is `header`?
  criteria: The module defines a single `block_group` block plugin with a deriver (BlockGroups) that emits
    one derivative per block_group_content entity. A group with id `header` yields the placeable block
    plugin `block_group:header`, whose admin label is the group's label.
  bundle: blockgroup
  rubric_ref: rubric/blockgroup_blockgroup_derived_block@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: blockgroup-region-grouping
  input: With the Block Group module, how are individual blocks actually grouped together, and where do
    child blocks get placed so they render inside the group block?
  criteria: Each block group adds a theme region named after the group id (via hook_system_info_alter()).
    On the block layout page you place the group's own block into a normal region, then drag other blocks
    into the group's region; when the group block renders it collects every enabled block assigned to
    that region (in weight order, access-checked) and outputs them together. Groups can be nested by placing
    one group's block into another group's region.
  bundle: blockgroup
  rubric_ref: rubric/blockgroup_blockgroup_region_grouping@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: blockgroup-introspect-label
  input: This Drupal site already has a block group configured whose machine name (id) is `eval_footer_group`
    (drush available). Inspect the running site and tell me its exact human-readable label.
  criteria: The block_group_content config entity `eval_footer_group` (config blockgroup.block_group_content.eval_footer_group)
    has the label `Eval Footer Group`.
  bundle: blockgroup
  rubric_ref: rubric/blockgroup_blockgroup_introspect_label@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    persona: drupal-expert
    setup: agent-module-documentation/evaluation/verify/blockgroup-known-label-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/blockgroup-known-label-cleanup.sh
- id: blockgroup-introspect-derived-block
  input: On this Drupal site a block group is configured (drush available). Inspect the running site,
    find every block_group_content config entity, and tell me the placeable block plugin id that the Block
    Group deriver produces for it.
  criteria: There is a block_group_content entity `eval_promo_sidebar`, so the deriver produces the placeable
    block plugin `block_group:eval_promo_sidebar` (admin label 'Eval Promo Sidebar').
  bundle: blockgroup
  rubric_ref: rubric/blockgroup_blockgroup_introspect_derived_block@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    persona: drupal-expert
    setup: agent-module-documentation/evaluation/verify/blockgroup-known-derived-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/blockgroup-known-derived-cleanup.sh
- id: blockgroup-create-header
  input: On this Drupal site (drush available), use the Block Group module to create a new block group
    with machine name `header` and label `Header`. Apply it to the live site as a `block_group_content`
    config entity so its placeable block becomes available; don't just describe it. One-line summary.
  criteria: A block_group_content config entity `header` (label Header) exists on the live site and the
    deriver has registered the placeable block plugin `block_group:header`. Verified against live site
    state.
  bundle: blockgroup
  rubric_ref: rubric/blockgroup_blockgroup_create_header@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/blockgroup-create-header-reset.sh
    verify: agent-module-documentation/evaluation/verify/blockgroup-create-header-verify.sh
- id: blockgroup-create-region
  input: On this Drupal site (drush available), create a block group named `sidebar_promo` with label
    `Sidebar Promo` using the Block Group module, so that a new theme region for the group appears and
    other blocks can be dragged into it. Create it as a `block_group_content` config entity on the live
    site; don't just describe it. One-line summary.
  criteria: A block_group_content config entity `sidebar_promo` (label Sidebar Promo) exists and Block
    Group has added a `sidebar_promo` region to the active theme (via hook_system_info_alter). Verified
    against live site state.
  bundle: blockgroup
  rubric_ref: rubric/blockgroup_blockgroup_create_region@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/blockgroup-create-region-reset.sh
    verify: agent-module-documentation/evaluation/verify/blockgroup-create-region-verify.sh
