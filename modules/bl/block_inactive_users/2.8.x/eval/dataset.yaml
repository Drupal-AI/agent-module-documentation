metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: block_inactive_users
  version: 2.8.x
  note: 'Block Inactive Users blocks accounts idle for N months on cron (with warn + reactivation emails)
    and offers a separate bulk Cancel Users tool. Two config objects: block_inactive_users.settings (key
    block_inactive_users_idle_time = idle months as a STRING; send_email bool; email_subject; exclude_roles;
    warn keys; days_until_blocked) and block_inactive_users.settings_cancel_users (idle_time; disable_account_method
    = a core user_cancel method id; include_roles/status; whitelists; cancel_email). Shipped defaults:
    settings idle_time ''3'', send_email false, email_subject ''User disabled.''; settings_cancel_users
    idle_time ''0'', disable_account_method ''user_cancel_delete''. Settings forms at /admin/config/people/block_inactive_users
    (+ /cancel_users) gated by ''administer site configuration''. Medium/hard cases read and write those
    real config keys (no users are actually blocked).'
questions:
- id: biu-trigger-and-idle
  input: In the block_inactive_users module, what triggers inactive accounts to actually get blocked,
    and which config key sets the inactivity threshold (and in what unit)?
  criteria: hook_cron runs the block sweep (or the 'Disable inactive users' button runs it immediately).
    The threshold is block_inactive_users_idle_time, measured in whole MONTHS; users whose last access
    is at least that many months old are blocked.
  bundle: block_inactive_users
  rubric_ref: rubric/block_inactive_users_biu_trigger_and_idle@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: biu-two-forms
  input: block_inactive_users provides two admin screens under People. What are they and how do they differ?
  criteria: The main settings form (/admin/config/people/block_inactive_users, config block_inactive_users.settings)
    configures the cron auto-block. A separate Cancel Users tool (/admin/config/people/block_inactive_users/cancel_users,
    config block_inactive_users.settings_cancel_users) bulk-cancels accounts via core user_cancel() by
    role/status/whitelist rules.
  bundle: block_inactive_users
  rubric_ref: rubric/block_inactive_users_biu_two_forms@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: biu-reactivation
  input: When block_inactive_users blocks a user and email is enabled, how can that user get their account
    back?
  criteria: The block email (using the [activation-link] token) contains a signed reactivation URL (route
    block_inactive_users.reactivate_confirm at /reactivate/{user}/confirm/{timestamp}/{hashed_pass}) the
    user can follow to request re-activation.
  bundle: block_inactive_users
  rubric_ref: rubric/block_inactive_users_biu_reactivation@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: biu-idle-known
  input: On this Drupal site, the block_inactive_users auto-block settings have been customized. Inspect
    the live configuration and report the inactivity threshold (idle time, in months) currently configured
    for automatically blocking users.
  criteria: block_inactive_users.settings:block_inactive_users_idle_time is '9' (months), and email notification
    is enabled. Read with `drush cget block_inactive_users.settings block_inactive_users_idle_time`.
  bundle: block_inactive_users
  rubric_ref: rubric/block_inactive_users_biu_idle_known@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/biu-idle-known-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/biu-idle-known-cleanup.sh
- id: biu-cancel-method-known
