rubrics:
- id: block_inactive_users_biu_trigger_and_idle
  version: '1.0'
  applicable_bundles:
  - block_inactive_users
  checks:
  - kind: must_contain_any
    values:
    - cron
    - block_inactive_users_idle_time
    - month
  scoring:
    combine: all_pass
- id: block_inactive_users_biu_two_forms
  version: '1.0'
  applicable_bundles:
  - block_inactive_users
  checks:
  - kind: must_contain_any
    values:
    - /admin/config/people/block_inactive_users
    - cancel
    - settings_cancel_users
  scoring:
    combine: all_pass
- id: block_inactive_users_biu_reactivation
  version: '1.0'
  applicable_bundles:
  - block_inactive_users
  checks:
  - kind: must_contain_any
    values:
    - reactivat
    - activation-link
    - /reactivate
  scoring:
    combine: all_pass
- id: block_inactive_users_biu_idle_known
  version: '1.0'
  applicable_bundles:
  - block_inactive_users
  checks:
  - kind: must_contain_any
    values:
    - '9'
  scoring:
    combine: all_pass
- id: block_inactive_users_biu_cancel_method_known
  version: '1.0'
  applicable_bundles:
  - block_inactive_users
  checks:
  - kind: must_contain_any
    values:
    - user_cancel_block
  scoring:
    combine: all_pass
- id: block_inactive_users_biu_configure_block
  version: '1.0'
  applicable_bundles:
  - block_inactive_users
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
- id: block_inactive_users_biu_configure_cancel
  version: '1.0'
  applicable_bundles:
  - block_inactive_users
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
