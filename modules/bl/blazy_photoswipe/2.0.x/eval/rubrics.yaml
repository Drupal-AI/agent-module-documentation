rubrics:
- id: blazy_photoswipe_blazy_photoswipe_how_to_open_lightbox
  version: '1.0'
  applicable_bundles:
  - blazy_photoswipe
  checks:
  - kind: must_contain_any
    values:
    - media_switch
    - Media switch
    - Image to PhotoSwipe
    - photoswipe
  scoring:
    combine: all_pass
- id: blazy_photoswipe_blazy_photoswipe_switch_to_ps5
  version: '1.0'
  applicable_bundles:
  - blazy_photoswipe
  checks:
  - kind: must_contain_any
    values:
    - extras.photoswipe
    - blazy.settings
    - PhotoSwipe 5
    - admin/config/media/blazy
  scoring:
    combine: all_pass
- id: blazy_photoswipe_blazy_photoswipe_options_hook
  version: '1.0'
  applicable_bundles:
  - blazy_photoswipe
  checks:
  - kind: must_contain_any
    values:
    - hook_blazy_photoswipe_js_options_alter
    - blazy_photoswipe_js_options_alter
  scoring:
    combine: all_pass
- id: blazy_photoswipe_blazy_photoswipe_active_ps_version
  version: '1.0'
  applicable_bundles:
  - blazy_photoswipe
  checks:
  - kind: must_contain_any
    values:
    - PhotoSwipe 5
    - '5'
  scoring:
    combine: all_pass
- id: blazy_photoswipe_blazy_photoswipe_which_field_uses_photoswipe
  version: '1.0'
  applicable_bundles:
  - blazy_photoswipe
  checks:
  - kind: must_contain_any
    values:
    - field_bps_img
  scoring:
    combine: all_pass
- id: blazy_photoswipe_blazy_photoswipe_enable_switch
  version: '1.0'
  applicable_bundles:
  - blazy_photoswipe
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
- id: blazy_photoswipe_blazy_photoswipe_switch_ps5
  version: '1.0'
  applicable_bundles:
  - blazy_photoswipe
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
