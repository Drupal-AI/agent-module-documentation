metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: blazy_photoswipe
  version: 2.0.x
  note: 'Blazy PhotoSwipe is a thin Blazy<->PhotoSwipe integration with no formatter, field type, configure
    route, permissions, Drush, or plugins. It registers the ''photoswipe'' lightbox via hook_blazy_lightboxes_alter(),
    so a display opts in by setting a Blazy-family formatter component''s settings.media_switch to ''photoswipe''
    in an entity_view_display config entity. The PhotoSwipe major (4 default, 5 opt-in) is chosen in Blazy''s
    OWN settings form and stored as an integer at blazy.settings extras.photoswipe (5 = PS5). Options
    reach the browser via drupalSettings.photoswipe.options and are alterable with hook_blazy_photoswipe_js_options_alter().
    Medium/hard cases are grounded in those two real config locations: the formatter''s media_switch and
    blazy.settings extras.photoswipe.'
questions:
- id: blazy_photoswipe-how-to-open-lightbox
  input: I use the Blazy formatter to display an image field in Drupal and I have the Blazy PhotoSwipe
    module enabled. How do I make those images open in a PhotoSwipe lightbox? What option do I set on
    the formatter?
  criteria: 'On the field''s Blazy formatter (Manage display), set the ''Media switch'' option to ''Image
    to PhotoSwipe''. In config this is the component''s settings.media_switch: photoswipe. Blazy PhotoSwipe
    registers the photoswipe lightbox via hook_blazy_lightboxes_alter().'
  bundle: blazy_photoswipe
  rubric_ref: rubric/blazy_photoswipe_blazy_photoswipe_how_to_open_lightbox@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: blazy_photoswipe-switch-to-ps5
  input: Blazy PhotoSwipe defaults to PhotoSwipe 4. How do I switch a Drupal site to PhotoSwipe 5, and
    where is that choice stored in configuration?
  criteria: The module adds a 'PhotoSwipe' select to Blazy's own settings form at /admin/config/media/blazy
    (Extra settings). Choosing PhotoSwipe 5 stores the integer 5 at blazy.settings extras.photoswipe (empty
    = PhotoSwipe 4). Then clear cache.
  bundle: blazy_photoswipe
  rubric_ref: rubric/blazy_photoswipe_blazy_photoswipe_switch_to_ps5@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: blazy_photoswipe-options-hook
  input: Which Drupal hook does the Blazy PhotoSwipe module invite me to implement so I can customise
    the options (like bgOpacity or loop) passed to the PhotoSwipe JavaScript library?
  criteria: Implement hook_blazy_photoswipe_js_options_alter(array &$options). The module calls the 'blazy_photoswipe_js_options'
    alter on the options before exposing them as drupalSettings.photoswipe.options.
  bundle: blazy_photoswipe
  rubric_ref: rubric/blazy_photoswipe_blazy_photoswipe_options_hook@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: blazy_photoswipe-active-ps-version
  input: On this Drupal site, which PhotoSwipe major version is Blazy PhotoSwipe configured to use — PhotoSwipe
    4 or PhotoSwipe 5? Inspect the live Blazy configuration to determine the answer.
  criteria: PhotoSwipe 5. blazy.settings extras.photoswipe is set to 5 (an integer 5 means PhotoSwipe
    5; an absent/empty value would mean PhotoSwipe 4).
  bundle: blazy_photoswipe
  rubric_ref: rubric/blazy_photoswipe_blazy_photoswipe_active_ps_version@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/blazy_photoswipe-ps-version-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/blazy_photoswipe-ps-version-cleanup.sh
- id: blazy_photoswipe-which-field-uses-photoswipe
  input: On the Article content type, one image field is configured with a Blazy formatter that opens
    its images in a PhotoSwipe lightbox. Inspect the live default view display for Article and give the
    machine name of that field.
  criteria: 'field_bps_img: in core.entity_view_display.node.article.default its component uses the blazy
    formatter with settings.media_switch: photoswipe.'
  bundle: blazy_photoswipe
  rubric_ref: rubric/blazy_photoswipe_blazy_photoswipe_which_field_uses_photoswipe@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/blazy_photoswipe-which-field-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/blazy_photoswipe-which-field-cleanup.sh
- id: blazy_photoswipe-enable-switch
  input: On this Drupal site, the Article content type has an image field field_bps_task shown with the
    Blazy formatter in the default view display. Using Blazy PhotoSwipe, configure that formatter so the
    images open in a PhotoSwipe lightbox. Apply the change to the live site.
  criteria: 'In core.entity_view_display.node.article.default the field_bps_task component (a Blazy-family
    formatter) carries settings.media_switch: photoswipe (set via Manage display ''Media switch'' -> ''Image
    to PhotoSwipe'', or by editing the component settings).'
  bundle: blazy_photoswipe
  rubric_ref: rubric/blazy_photoswipe_blazy_photoswipe_enable_switch@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/blazy_photoswipe-enable-switch-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/blazy_photoswipe-enable-switch-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/blazy_photoswipe-enable-switch-verify.sh
- id: blazy_photoswipe-switch-ps5
  input: This Drupal site currently uses PhotoSwipe 4 with Blazy PhotoSwipe. Switch the whole site to
    PhotoSwipe 5 and apply the change to the live configuration.
  criteria: Set blazy.settings extras.photoswipe to the integer 5 (via the PhotoSwipe select in Blazy's
    settings form at /admin/config/media/blazy, or drush cset blazy.settings extras.photoswipe 5), then
    clear cache.
  bundle: blazy_photoswipe
  rubric_ref: rubric/blazy_photoswipe_blazy_photoswipe_switch_ps5@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
