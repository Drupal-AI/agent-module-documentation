metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: block_region_permissions
  version: 1.6.x
  note: Block Region Permissions dynamically generates one permission per theme region (administer {theme}
    {region}) and filters the Block layout form, block add/edit form, block_access, and the edit/delete
    routes so a role can only manage blocks in permitted regions. Cases are `recipe` (response-graded)
    probing documented facts an agent would otherwise read source to answer; no site mutation.
questions:
- id: brp-purpose
  input: On Drupal 11, core's 'Administer blocks' permission lets a role manage blocks in every region.
    I want a role that can only manage blocks in specific theme regions. Which contrib module does this
    and how does it expose the control?
  criteria: Use the Block Region Permissions module. It dynamically generates one permission per enabled
    theme's region so you can grant block administration on a per-theme, per-region basis instead of the
    all-or-nothing 'Administer blocks' permission.
  bundle: block_region_permissions
  rubric_ref: rubric/block_region_permissions_brp_purpose@1.0
  tags:
  - mode:recipe
- id: brp-permission-name
  input: In Block Region Permissions, what is the machine-name pattern and title of the permission generated
    for a theme region, for example the Content region of the Claro theme?
  criteria: 'The permission machine name is ''administer {theme_key} {region_key}'' (e.g. ''administer
    claro content''), titled ''Administer: {Theme name} - {Region name}'' (e.g. ''Administer: Claro -
    Content''). They are generated by Permissions::get() from each enabled, non-hidden theme''s regions.'
  bundle: block_region_permissions
  rubric_ref: rubric/block_region_permissions_brp_permission_name@1.0
  tags:
  - mode:recipe
- id: brp-core-permission-still-required
  input: If I grant a role only the per-region permissions from Block Region Permissions, can they use
    the Block layout page? Is any core permission still needed, and what is the caveat?
  criteria: 'The core ''administer blocks'' permission is still required to reach the Block layout UI
    at all; the module only filters within that page. Caveat: ''Administer blocks'' still exposes block
    pages this module does not manage (disable/enable, place-block library, add), so pair it with Block
    Content Permissions to restrict the rest.'
  bundle: block_region_permissions
  rubric_ref: rubric/block_region_permissions_brp_core_permission_still_required@1.0
  tags:
  - mode:recipe
- id: brp-enforcement
  input: How does Block Region Permissions stop a user from editing or deleting a block in a region they
    lack permission for, even if they hit the edit URL directly? Name the mechanisms.
  criteria: It implements hook_block_access() forbidding the 'update' and 'delete' operations for blocks
    whose region the user cannot administer, and a RouteSubscriber adds a _custom_access requirement (AccessControlHandler::blockFormAccess)
    to the entity.block.edit_form and entity.block.delete_form routes, so direct URLs are access-checked,
    not just hidden.
  bundle: block_region_permissions
  rubric_ref: rubric/block_region_permissions_brp_enforcement@1.0
  tags:
  - mode:recipe
- id: brp-form-filtering
  input: On the Block layout page and the block configure form, what does Block Region Permissions hide
    from a user who can only administer some regions?
  criteria: Via hook_form_FORM_ID_alter on block_admin_display_form and block_form it removes the block
    rows for regions the user cannot administer and strips those regions from the region-select dropdown
    options, so the user can neither see nor move blocks into disallowed regions.
  bundle: block_region_permissions
  rubric_ref: rubric/block_region_permissions_brp_form_filtering@1.0
  tags:
  - mode:recipe
- id: brp-config-and-deps
  input: Does Block Region Permissions have a settings/configuration form, Drush commands, or module dependencies
    I need to install?
  criteria: No. It has no configuration form, no settings, no config schema, and no Drush commands; it
    requires no modules beyond core's Block module. You configure it entirely on People > Permissions.
    Block Content Permissions is only a suggested companion, not a dependency.
  bundle: block_region_permissions
  rubric_ref: rubric/block_region_permissions_brp_config_and_deps@1.0
  tags:
  - mode:recipe
- id: brp-dynamic-generation
  input: If I enable a new theme or a theme adds a new region, do I have to register new permissions in
    Block Region Permissions? How are the permissions produced?
  criteria: No manual registration. Permissions are generated dynamically by Permissions::get() (declared
    via permission_callbacks in the .permissions.yml), which reads each enabled, non-hidden theme's regions
    from theme info; new themes/regions automatically produce new 'administer {theme} {region}' permissions.
  bundle: block_region_permissions
  rubric_ref: rubric/block_region_permissions_brp_dynamic_generation@1.0
  tags:
  - mode:recipe
