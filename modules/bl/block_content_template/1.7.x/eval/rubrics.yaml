rubrics:
- id: block_content_template_bct_what_template
  version: '1.0'
  applicable_bundles:
  - block_content_template
  checks:
  - kind: must_contain_any
    values:
    - block-content.html.twig
    - block_content
    - block-content
  scoring:
    combine: all_pass
- id: block_content_template_bct_suggestions
  version: '1.0'
  applicable_bundles:
  - block_content_template
  checks:
  - kind: must_contain_any
    values:
    - block-content--
    - block_content__
    - bundle
    - view_mode
    - view mode
  scoring:
    combine: all_pass
- id: block_content_template_bct_variables
  version: '1.0'
  applicable_bundles:
  - block_content_template
  checks:
  - kind: must_contain_any
    values:
    - bundle
    - view_mode
    - label
    - block-content--type-
    - block-content__content
  scoring:
    combine: all_pass
- id: block_content_template_bct_bundle_template
  version: '1.0'
  applicable_bundles:
  - block_content_template
  checks:
  - kind: must_contain_any
    values:
    - block-content--bct-probe
    - bct-probe
    - bct_probe
  scoring:
    combine: all_pass
- id: block_content_template_bct_bundle_viewmode_template
  version: '1.0'
  applicable_bundles:
  - block_content_template
  checks:
  - kind: must_contain_any
    values:
    - block-content--bct-probe--full
    - bct-probe--full
    - bct_probe
  scoring:
    combine: all_pass
- id: block_content_template_bct_install_expert
  version: '1.0'
  applicable_bundles:
  - block_content_template
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
- id: block_content_template_bct_install_layman
  version: '1.0'
  applicable_bundles:
  - block_content_template
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
