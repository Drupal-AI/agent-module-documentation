  criteria: 'The block_styles config entity block_styles.blocks.bstyleknown has classes: ''bstyles-highlight''
    (its theme is block__clean).'
  bundle: block_styles
  rubric_ref: rubric/block_styles_block_styles_known_classes@1.0
