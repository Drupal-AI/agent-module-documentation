metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: block_styles
  version: 2.0.x
  note: 'Block Styles adds a ''Block Styles Template'' fieldset to every block config form; the choice
    (a Styles API type:block style/template-suggestion, CSS classes, and an optional button label) is
    stored in a block_styles config entity named block_styles.blocks.<block_id> with keys theme/classes/text.
    hook_theme_suggestions_block_alter() injects the template suggestion and hook_preprocess_block() adds
    the classes. Bundled style: block__clean (Clean Wrapper). No settings page (configure=null). Medium
    cases seed a known block_styles config entity and the agent introspects its stored theme/classes.
    Hard cases require creating/updating the block_styles config entity (theme + classes) for a given
    block id, verified against the saved entity via the block_styles storage. Config-entity reads/writes
    are used (not block placement) so nothing depends on an active theme or region.'
questions:
- id: block_styles-how-apply
  input: Using the block_styles module, how do I apply a custom wrapper template and some extra CSS classes
    to a single placed block in Drupal?
  criteria: Edit the block; in the 'Block Styles Template' fieldset on the block's configuration form
    pick a style (a Styles API type:block template suggestion such as 'Clean Wrapper'), optionally set
    a button label, and enter space-separated classes in 'Add classes to block wrapper', then save. There
    is no central settings page.
  bundle: block_styles
  rubric_ref: rubric/block_styles_block_styles_how_apply@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: block_styles-storage
  input: Where does the block_styles module store the style/classes chosen for a block, and what is the
    config object called?
  criteria: In a block_styles config entity whose id is the block's id and whose config name is block_styles.blocks.<block_id>.
    It stores theme (the chosen style / template-suggestion id, e.g. block__clean), classes (space-separated
    wrapper CSS classes) and text (button label).
  bundle: block_styles
  rubric_ref: rubric/block_styles_block_styles_storage@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: block_styles-styles-source
  input: Where do the block style options in block_styles come from, and how would I register a new one?
    Also what style ships with the module out of the box?
  criteria: 'The options are Styles API styles with type: block, discovered from <extension>.themes.yml
    files. To add one, ship a themes.yml entry (id like block__myname, type: block, configuration path/base
    hook/render element) plus a block--myname.html.twig template. The module ships one style, Clean Wrapper
    (block__clean).'
  bundle: block_styles
  rubric_ref: rubric/block_styles_block_styles_styles_source@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: block_styles-known-classes
  input: On this site, block_styles already has a style configured for a block with id 'bstyleknown'.
