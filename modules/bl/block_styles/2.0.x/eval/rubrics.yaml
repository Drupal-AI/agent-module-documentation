rubrics:
- id: block_styles_block_styles_how_apply
  version: '1.0'
  applicable_bundles:
  - block_styles
  checks:
  - kind: must_contain_any
    values:
    - Block Styles Template
    - block form
    - Select block style
    - Add classes
    - block configuration
  scoring:
    combine: all_pass
- id: block_styles_block_styles_storage
  version: '1.0'
  applicable_bundles:
  - block_styles
  checks:
  - kind: must_contain_any
    values:
    - block_styles.blocks.
    - block_styles config entity
    - theme
    - classes
  scoring:
    combine: all_pass
- id: block_styles_block_styles_styles_source
  version: '1.0'
  applicable_bundles:
  - block_styles
  checks:
  - kind: must_contain_any
    values:
    - styles_api
    - themes.yml
    - 'type: block'
    - block__clean
    - Clean Wrapper
  scoring:
    combine: all_pass
- id: block_styles_block_styles_known_classes
  version: '1.0'
  applicable_bundles:
  - block_styles
  checks:
  - kind: must_contain_any
    values:
    - bstyles-highlight
  scoring:
    combine: all_pass
- id: block_styles_block_styles_known_template
  version: '1.0'
  applicable_bundles:
  - block_styles
  checks:
  - kind: must_contain_any
    values:
    - block__clean
  scoring:
    combine: all_pass
- id: block_styles_block_styles_apply_clean
  version: '1.0'
  applicable_bundles:
  - block_styles
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
- id: block_styles_block_styles_add_classes
  version: '1.0'
  applicable_bundles:
  - block_styles
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
