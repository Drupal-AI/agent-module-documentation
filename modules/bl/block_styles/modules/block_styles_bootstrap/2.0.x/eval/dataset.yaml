metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: block_styles_bootstrap
  version: 2.0.x
  note: 'Block Styles Bootstrap is a glue submodule of block_styles: it ships block_styles_bootstrap.themes.yml
    declaring five Styles API type:block styles (block__bootstrap__card/collapse/dropdown/modal/popover)
    with Twig templates and a CSS/JS library; the .module is empty. All but card set extras.label:1 (which
    enables the block form''s button-label ''text'' field). Styles are applied like any Block Styles style:
    stored as the ''theme'' of a block_styles.blocks.<block_id> config entity. The medium case seeds a
    block_styles entity using a bootstrap style and the agent reads the style id; the hard case requires
    applying a bootstrap style (with a button label) to a block via the block_styles config entity, verified
    against the saved entity.'
questions:
- id: block_styles_bootstrap-styles-list
  input: What block styles does the block_styles_bootstrap submodule add, and where do they show up?
  criteria: 'It registers five Bootstrap styles (type: block) selectable in a block''s ''Block Styles
    Template'' fieldset: Bootstrap Card, Collapse, Dropdown, Modal and Popover (ids block__bootstrap__card,
    block__bootstrap__collapse, block__bootstrap__dropdown, block__bootstrap__modal, block__bootstrap__popover).'
  bundle: block_styles_bootstrap
  rubric_ref: rubric/block_styles_bootstrap_block_styles_bootstrap_styles_list@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: block_styles_bootstrap-card-id
  input: I want to wrap a Drupal block in a Bootstrap card using block_styles_bootstrap. What is the style
    / template-suggestion id, and which template file backs it?
  criteria: The style id is block__bootstrap__card (label 'Bootstrap Card'), backed by templates/bootstrap_card/block--bootstrap--card.html.twig.
    Select it in the block's Block Styles Template fieldset.
  bundle: block_styles_bootstrap
  rubric_ref: rubric/block_styles_bootstrap_block_styles_bootstrap_card_id@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: block_styles_bootstrap-button-label
  input: For the block_styles_bootstrap styles, which ones let me set a button label, and why? Does the
    card style?
  criteria: 'The collapse, dropdown, modal and popover styles set extras.label: 1, which makes Block Styles
    enable the ''Text for button label'' field on the block form (stored as the entity''s text). The card
    style has no extras.label, so it has no button label field.'
  bundle: block_styles_bootstrap
  rubric_ref: rubric/block_styles_bootstrap_block_styles_bootstrap_button_label@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: block_styles_bootstrap-known-style
  input: On this site, block_styles is configured to apply a Bootstrap style from block_styles_bootstrap
    to a block with id 'bsboot_known'. Inspect the live configuration and report which Bootstrap style
    id is applied.
  criteria: 'The block_styles config entity block_styles.blocks.bsboot_known has theme: block__bootstrap__card.'
  bundle: block_styles_bootstrap
  rubric_ref: rubric/block_styles_bootstrap_block_styles_bootstrap_known_style@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/block_styles_bootstrap-known-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/block_styles_bootstrap-known-cleanup.sh
- id: block_styles_bootstrap-apply-modal
  input: On this Drupal site, use block_styles with the block_styles_bootstrap submodule to make the block
    with id 'bsboot_task' render as a Bootstrap Modal, with the trigger button labelled 'Open'. Apply
    it to the live site.
  criteria: Create/save a block_styles config entity with id bsboot_task, theme block__bootstrap__modal
    and text 'Open'. Verify checks theme == block__bootstrap__modal and text == 'Open'.
  bundle: block_styles_bootstrap
  rubric_ref: rubric/block_styles_bootstrap_block_styles_bootstrap_apply_modal@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/block_styles_bootstrap-apply-modal-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/block_styles_bootstrap-apply-modal-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/block_styles_bootstrap-apply-modal-verify.sh
