metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: block_aria_landmark_roles
  version: 3.0.x
  note: 'The module has no configure route, no settings form, no permission of its own, no Drush and no
    plugins. Its entire persistent state is two third-party settings on the block config entity: block.block.<id>
    -> third_party_settings.block_aria_landmark_roles.role (constrained by schema to none|application|banner|complementary|contentinfo|form|main|navigation|search)
    and .label. hook_preprocess_block() turns them into $variables[''attributes''][''role''] (skipped
    for ''none''/empty) and [''aria-label'']. All medium/hard cases are therefore grounded in real block
    config on the live site; the default theme here is olivero (regions include sidebar and footer_bottom).'
questions:
- id: block_aria_landmark_roles-available-roles
  input: Which ARIA landmark roles can the Drupal contrib module block_aria_landmark_roles assign to a
    block, and what happens if I leave the selector on '- None -'?
  criteria: application, banner, complementary, contentinfo, form, main, navigation and search (plus the
    '- None -' option, stored as 'none'). With 'none' — or no value at all — block_aria_landmark_roles_preprocess_block()
    does not add a role attribute to the block.
  bundle: block_aria_landmark_roles
  rubric_ref: rubric/block_aria_landmark_roles_block_aria_landmark_roles_available_roles@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: block_aria_landmark_roles-storage
  input: Where does the Drupal block_aria_landmark_roles module store the landmark role and label for
    a block? There is no settings page for the module — give the exact config path.
  criteria: 'On the block config entity itself: block.block.<block_id> -> third_party_settings.block_aria_landmark_roles.role
    and .label, set from the block configuration form (/admin/structure/block/manage/<id>) or with $block->setThirdPartySetting(''block_aria_landmark_roles'',
    ''role'', ''navigation''). The module declares configure: null and has no settings form.'
  bundle: block_aria_landmark_roles
  rubric_ref: rubric/block_aria_landmark_roles_block_aria_landmark_roles_storage@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: block_aria_landmark_roles-rendering
  input: How does the Drupal block_aria_landmark_roles module actually get the role and aria-label onto
    the rendered block markup?
  criteria: block_aria_landmark_roles_preprocess_block() loads the Block entity for $variables['elements']['#id'],
    and sets $variables['attributes']['role'] (only when the stored role is non-empty and not 'none')
    and $variables['attributes']['aria-label'] from the stored label — so the attributes appear wherever
    the theme's block.html.twig prints {{ attributes }}.
  bundle: block_aria_landmark_roles
  rubric_ref: rubric/block_aria_landmark_roles_block_aria_landmark_roles_rendering@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: block_aria_landmark_roles-known-role
  input: One block on this Drupal site has been given an ARIA landmark role with the block_aria_landmark_roles
    module. Inspect the live block configuration and report which landmark role and which ARIA label it
    carries.
  criteria: block.block.barl_eval_block (Olivero, sidebar region) has third_party_settings.block_aria_landmark_roles.role
    = complementary and .label = 'Site extras'.
  bundle: block_aria_landmark_roles
  rubric_ref: rubric/block_aria_landmark_roles_block_aria_landmark_roles_known_role@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/block_aria_landmark_roles-known-role-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/block_aria_landmark_roles-known-role-cleanup.sh
- id: block_aria_landmark_roles-role-vs-none
  input: This Drupal site has two blocks whose ids start with barl_eval_ and both have block_aria_landmark_roles
    settings saved. Inspect the live configuration and say which of them will actually render a role attribute
    on its markup, and why the other one will not.
  criteria: barl_eval_on renders role="banner". barl_eval_off has role stored as the literal string 'none',
    and block_aria_landmark_roles_preprocess_block() only sets the attribute when the role is non-empty
    AND not 'none', so it renders no role (it still gets aria-label="Nothing special").
  bundle: block_aria_landmark_roles
  rubric_ref: rubric/block_aria_landmark_roles_block_aria_landmark_roles_role_vs_none@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/block_aria_landmark_roles-role-vs-none-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/block_aria_landmark_roles-role-vs-none-cleanup.sh
- id: block_aria_landmark_roles-menu-landmark
  input: This Drupal site has a main menu block placed in Olivero with the machine id barl_task_menu.
