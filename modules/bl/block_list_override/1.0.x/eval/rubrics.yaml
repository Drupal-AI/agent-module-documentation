rubrics:
- id: block_list_override_block_list_override_config_keys
  version: '1.0'
  applicable_bundles:
  - block_list_override
  checks:
  - kind: must_contain_any
    values:
    - block_list_override.settings
    - system_match
    - /admin/config/block_list_override/settings
  scoring:
    combine: all_pass
- id: block_list_override_block_list_override_matching_methods
  version: '1.0'
  applicable_bundles:
  - block_list_override
  checks:
  - kind: must_contain_any
    values:
    - prefix
    - regex
    - match
  scoring:
    combine: all_pass
- id: block_list_override_block_list_override_allow_only
  version: '1.0'
  applicable_bundles:
  - block_list_override
  checks:
  - kind: must_contain_any
    values:
    - negate
    - Allow only
    - system_negate
  scoring:
    combine: all_pass
- id: block_list_override_block_list_override_known_match
  version: '1.0'
  applicable_bundles:
  - block_list_override
  checks:
  - kind: must_contain_any
    values:
    - system_powered_by_block
  scoring:
    combine: all_pass
- id: block_list_override_block_list_override_known_prefix
  version: '1.0'
  applicable_bundles:
  - block_list_override
  checks:
  - kind: must_contain_any
    values:
    - views_block
  scoring:
    combine: all_pass
- id: block_list_override_block_list_override_remove_match
  version: '1.0'
  applicable_bundles:
  - block_list_override
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
- id: block_list_override_block_list_override_remove_regex
  version: '1.0'
  applicable_bundles:
  - block_list_override
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
