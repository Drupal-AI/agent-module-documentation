rubrics:
- id: blog_blog_content_type_fields
  version: '1.0'
  applicable_bundles:
  - blog
  checks:
  - kind: must_contain_any
    values:
    - blog_post
    - Blog post
  scoring:
    combine: all_pass
- id: blog_blog_listing_paths
  version: '1.0'
  applicable_bundles:
  - blog
  checks:
  - kind: must_contain_any
    values:
    - /blog
    - blog/{arg_0}
    - /blog/{uid}
    - blog/%
  scoring:
    combine: all_pass
- id: blog_blog_rss_feed
  version: '1.0'
  applicable_bundles:
  - blog
  checks:
  - kind: must_contain_any
    values:
    - /blog/feed
    - blog/feed
    - blog/%/feed
    - /blog/{uid}/feed
  scoring:
    combine: all_pass
- id: blog_blog_no_settings_form
  version: '1.0'
  applicable_bundles:
  - blog
  checks:
  - kind: must_contain_any
    values:
    - no settings form
    - no configuration
    - no config
    - does not provide
    - 'null'
    - no admin form
  scoring:
    combine: all_pass
- id: blog_blog_authoring_permission
  version: '1.0'
  applicable_bundles:
  - blog
  checks:
  - kind: must_contain_any
    values:
    - create blog_post content
  scoring:
    combine: all_pass
- id: blog_blog_count_helper
  version: '1.0'
  applicable_bundles:
  - blog
  checks:
  - kind: must_contain_any
    values:
    - blog_post_counter
  scoring:
    combine: all_pass
- id: blog_blog_user_title_service
  version: '1.0'
  applicable_bundles:
  - blog
  checks:
  - kind: must_contain_any
    values:
    - blog.lister
    - userBlogTitle
  scoring:
    combine: all_pass
- id: blog_blog_uninstall_blocked
  version: '1.0'
  applicable_bundles:
  - blog
  checks:
  - kind: must_contain_any
    values:
    - delete all
    - blog post
    - blog_post
    - uninstall validator
    - content exists
  scoring:
    combine: all_pass
