# Generated from evals.json by evaluation/to_commons.py.
# Edit evals.json and rerun the script; do not edit this file.
metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: blog
  version: 3.1.x
  note: Blog ships only default config (a content type + Views) and implements a few hooks; it has no
    settings form. All cases are `recipe` (response-graded), probing the content model, the View routes/paths,
    the permission model, the services/helper API, and the uninstall behavior.
questions:
- id: blog-content-type-fields
  input: After enabling the Drupal Blog module, what content type does it create and which fields does
    that type include?
  criteria: It creates the `blog_post` ("Blog post") node type with a Body field, a Blog comments comment
    field (field_blog_comments), and an unlimited Blog tags taxonomy reference field (field_blog_tags).
  bundle: blog
  rubric_ref: rubric/blog_blog_content_type_fields@1.0
  tags:
  - mode:recipe
- id: blog-listing-paths
  input: On a Drupal site with the Blog module, what URL shows all blog posts site-wide, and what URL
    shows a single user's blog?
  criteria: All posts are at /blog (View display blog_all, route view.blog.blog_all); a single user's
    posts are at /blog/{uid} (display blog_user_all, route view.blog.blog_user_all, param arg_0 = uid).
  bundle: blog
  rubric_ref: rubric/blog_blog_listing_paths@1.0
  tags:
  - mode:recipe
- id: blog-rss-feed
  input: Where does the Blog module expose an RSS feed of all blog posts, and where is the per-user RSS
    feed?
  criteria: All-posts feed at /blog/feed (display feed_1); per-user feed at /blog/{uid}/feed (display
    feed_2).
  bundle: blog
  rubric_ref: rubric/blog_blog_rss_feed@1.0
  tags:
  - mode:recipe
- id: blog-no-settings-form
  input: Where is the admin settings form for the Drupal Blog module?
  criteria: There is none — Blog ships no *.routing.yml and its info.yml `configure` is null. It only
    installs default config (content type + Views); configuration is done via the standard node type,
    field, Views, and block UIs.
  bundle: blog
  rubric_ref: rubric/blog_blog_no_settings_form@1.0
  tags:
  - mode:recipe
- id: blog-authoring-permission
  input: I want to let only a specific role write blog posts with the Drupal Blog module. Which permission
    do I grant, and does the module define its own permissions?
  criteria: Grant the standard node bundle permission `create blog_post content`. Blog defines no permissions
    of its own (no permissions.yml); it relies entirely on node bundle permissions for blog_post.
  bundle: blog
  rubric_ref: rubric/blog_blog_authoring_permission@1.0
  tags:
  - mode:recipe
- id: blog-count-helper
  input: In Drupal Blog module code, which helper function counts published blog posts, and how do I count
    them for just one user?
  criteria: 'Call blog_post_counter(): with no argument it returns the count of all published blog_post
    nodes; pass a user object (blog_post_counter($account)) to scope the count to that author via a uid
    condition.'
  bundle: blog
  rubric_ref: rubric/blog_blog_count_helper@1.0
  tags:
  - mode:recipe
- id: blog-user-title-service
  input: Which service in the Drupal Blog module builds a "{username}'s blog" title, and what method do
    I call?
  criteria: The blog.lister service (Drupal\blog\BlogLister); call userBlogTitle($user) with a UserInterface
    to get a TranslatableMarkup "@username's blog".
  bundle: blog
  rubric_ref: rubric/blog_blog_user_title_service@1.0
  tags:
  - mode:recipe
- id: blog-uninstall-blocked
  input: Why won't the Drupal Blog module uninstall, and how do I make it uninstallable?
  criteria: Its uninstall validator (blog.uninstall_validator) blocks uninstall while any blog_post nodes
    exist (blog_post_counter() != 0). Delete all Blog Post content first, then uninstall.
  bundle: blog
  rubric_ref: rubric/blog_blog_uninstall_blocked@1.0
  tags:
  - mode:recipe
