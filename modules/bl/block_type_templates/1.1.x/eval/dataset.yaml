metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: block_type_templates
  version: 1.1.x
  note: Block Type Templates is a pure theming helper (no config, permissions, services or plugins). hook_theme_suggestions_block_alter
    adds block__block_content_<block_type> and block__block_content_<block_type>__<view_mode> suggestions
    (files block--block-content-<block-type>.html.twig etc.) for blocks whose content is a BlockContentInterface.
    template_preprocess_block adds CSS classes block-content + block-type--<bundle> (block_content) and
    inline-block + block-type--<derivative> (inline_block/Layout Builder). Its behaviour keys off the
    existence of a block content type (bundle); medium/hard cases create real block content types and
    the hard verify actually invokes the module's suggestion hook to confirm the per-type/view-mode suggestion
    is emitted.
questions:
- id: block_type_templates-suggestions
  input: With the Block Type Templates module enabled, what Twig template file name can I create to theme
    all content blocks of a block type whose machine name is 'testimonial', and how do I also target the
    'teaser' view mode?
  criteria: Create block--block-content-testimonial.html.twig (suggestion block__block_content_testimonial);
    for a view mode add block--block-content-testimonial--teaser.html.twig (block__block_content_testimonial__teaser).
    Underscores in the machine name become hyphens in the filename.
  bundle: block_type_templates
  rubric_ref: rubric/block_type_templates_block_type_templates_suggestions@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: block_type_templates-classes
  input: Besides template suggestions, what CSS classes does the Block Type Templates module add to a
    rendered content block (and to a Layout Builder inline block) so I can style blocks per type?
  criteria: For content blocks it adds block-content and block-type--<bundle>; for Layout Builder inline
    blocks it adds inline-block and block-type--<derivative> (bundle run through Html::cleanCssIdentifier).
  bundle: block_type_templates
  rubric_ref: rubric/block_type_templates_block_type_templates_classes@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: block_type_templates-known-type
  input: On this Drupal site a custom block (content) type has been added. Inspect the site, give its
