metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: block_visibility_groups_admin
  version: 2.0.x
  note: 'block_visibility_groups_admin is the optional UI-helper submodule of block_visibility_groups.
    It defines a ConditionCreator plugin type and a ''create a group from the current page'' form; it
    declares no permissions, config or config schema. Cases are `recipe` (response-graded): they probe
    documented facts an agent would otherwise read source to answer; no site mutation.'
questions:
- id: bvga-plugin-type
  input: On a Drupal 11 site using block_visibility_groups_admin, what plugin type does this submodule
    define, and in which src namespace/directory do implementations live? Name the manager service too.
  criteria: It defines the ConditionCreator plugin type; plugins live in Plugin/ConditionCreator (src/Plugin/ConditionCreator/),
    discovered by the plugin.manager.block_visibility_groups_admin.condition_creator manager (a DefaultPluginManager)
    using the @ConditionCreator annotation.
  bundle: block_visibility_groups_admin
  rubric_ref: rubric/block_visibility_groups_admin_bvga_plugin_type@1.0
  tags:
  - mode:recipe
- id: bvga-add-creator
  input: I want to add my own guided condition builder to block_visibility_groups_admin. What class do
    I extend, what annotation do I use, and which annotation property ties it to a core Condition plugin?
  criteria: Extend ConditionCreatorBase (implementing ConditionCreatorInterface), annotate with @ConditionCreator(id,
    label, condition_plugin) where condition_plugin is the id of the core Condition plugin the creator
    produces config for, and place it in src/Plugin/ConditionCreator/.
  bundle: block_visibility_groups_admin
  rubric_ref: rubric/block_visibility_groups_admin_bvga_add_creator@1.0
  tags:
  - mode:recipe
- id: bvga-bundled-creators
  input: Which ConditionCreator plugins ship with block_visibility_groups_admin, and which core Condition
    plugin does each wrap?
  criteria: 'Three: route (wraps core request_path), roles (wraps user_role), node_type (wraps node_type).'
  bundle: block_visibility_groups_admin
  rubric_ref: rubric/block_visibility_groups_admin_bvga_bundled_creators@1.0
  tags:
  - mode:recipe
- id: bvga-create-form-route
  input: In block_visibility_groups_admin, which form/route creates a new block visibility group from
    the current page, and what does it do on submit?
  criteria: ConditionCreatorForm at route block_visibility_groups_admin.group_create (/admin/structure/block/block-visibility-group-new/{route_name}/{parameters});
    on submit it creates a BlockVisibilityGroup, addCondition()s each selected condition config, and redirects
    to the group's edit form.
  bundle: block_visibility_groups_admin
  rubric_ref: rubric/block_visibility_groups_admin_bvga_create_form_route@1.0
  tags:
  - mode:recipe
- id: bvga-layer-relationship
  input: How does block_visibility_groups_admin relate to block_visibility_groups, and what does it depend
    on?
  criteria: It is the optional UI/authoring helper layer on top of the base block_visibility_groups module
    (an 'development helper'); its info.yml depends only on block_visibility_groups:block_visibility_groups
    and it adds no config, permissions or schema of its own.
  bundle: block_visibility_groups_admin
  rubric_ref: rubric/block_visibility_groups_admin_bvga_layer_relationship@1.0
  tags:
  - mode:recipe
- id: bvga-permissions
  input: What permission is needed to create a block visibility group via block_visibility_groups_admin's
    form, and does the submodule define any permissions of its own?
  criteria: The core 'administer blocks' permission gates the group_create form; the submodule defines
    no permissions of its own (the active-group list route only needs core 'access content').
  bundle: block_visibility_groups_admin
  rubric_ref: rubric/block_visibility_groups_admin_bvga_permissions@1.0
  tags:
  - mode:recipe
- id: bvga-createinstance-route
  input: When instantiating a ConditionCreator plugin from block_visibility_groups_admin's manager in
    code, what configuration key is required and what happens if it is missing?
  criteria: createInstance() requires a 'route_name' in configuration; the manager resolves it into a
    RouteMatch under the 'route' key, and throws an \Exception if route_name is missing.
  bundle: block_visibility_groups_admin
  rubric_ref: rubric/block_visibility_groups_admin_bvga_createinstance_route@1.0
  tags:
  - mode:recipe
