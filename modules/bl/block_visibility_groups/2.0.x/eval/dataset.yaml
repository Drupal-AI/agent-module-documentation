metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: block_visibility_groups
  version: 2.0.x
  note: Block Visibility Groups exposes a `block_visibility_group` config entity, a `condition_group`
    block visibility plugin, a group evaluator service, and an admin UI under Block Layout. Cases are
    `recipe` (response-graded) — they probe documented facts an agent would otherwise read source to answer;
    no site mutation.
questions:
- id: bvg-config-entity
  input: On a Drupal 11 site, which config entity type does Block Visibility Groups define to hold a reusable,
    named set of block visibility conditions?
  criteria: The `block_visibility_group` config entity (class BlockVisibilityGroup) stores a group's label,
    logic, conditions and allow_other_conditions flag.
  bundle: block_visibility_groups
  rubric_ref: rubric/block_visibility_groups_bvg_config_entity@1.0
  tags:
  - mode:recipe
- id: bvg-assign-block
  input: How do I make a specific Drupal block use a block visibility group's conditions? Which visibility
    plugin on the block form is involved?
  criteria: Edit the block's Visibility settings and pick the group in the Condition Group section, which
    is the `condition_group` visibility plugin the module adds to every block.
  bundle: block_visibility_groups
  rubric_ref: rubric/block_visibility_groups_bvg_assign_block@1.0
  tags:
  - mode:recipe
- id: bvg-shared-conditions-plugins
  input: Which condition plugins can I add to a Block Visibility Group, and is the CTools module required
    to use the module?
  criteria: A group uses core's condition plugin manager, so any core or contrib condition plugin works.
    CTools is only a recommended module (it ships extra conditions); the module's sole dependency is core
    `block`.
  bundle: block_visibility_groups
  rubric_ref: rubric/block_visibility_groups_bvg_shared_conditions_plugins@1.0
  tags:
  - mode:recipe
- id: bvg-and-or-logic
  input: In a Block Visibility Group, which config key decides whether ALL conditions must pass versus
    only one, and what are its values?
  criteria: 'The `logic` key on the group: `and` (all conditions must pass, the default) or `or` (only
    one condition must pass).'
  bundle: block_visibility_groups
  rubric_ref: rubric/block_visibility_groups_bvg_and_or_logic@1.0
  tags:
  - mode:recipe
- id: bvg-admin-route
  input: What is the admin path (and route name) for managing block visibility groups on a Drupal site?
  criteria: Manage them at /admin/structure/block/block-visibility-group (route entity.block_visibility_group.collection),
    shown under Structure → Block Layout.
  bundle: block_visibility_groups
  rubric_ref: rubric/block_visibility_groups_bvg_admin_route@1.0
  tags:
  - mode:recipe
- id: bvg-permission
  input: Which permission does a user need to create and manage block visibility groups through the UI
    on a Drupal site?
  criteria: The core `administer blocks` permission gates all of the module's routes (the module also
    declares `administer block visibility groups` as the entity admin_permission).
  bundle: block_visibility_groups
  rubric_ref: rubric/block_visibility_groups_bvg_permission@1.0
  tags:
  - mode:recipe
- id: bvg-evaluate-service
  input: In PHP on a Drupal 11 site, which service evaluates whether a block visibility group's conditions
    currently pass, and which method do I call?
  criteria: The `block_visibility_groups.group_evaluator` service (GroupEvaluator); call evaluateGroup($block_visibility_group)
    which returns a bool after applying contexts and resolving conditions with the group's logic.
  bundle: block_visibility_groups
  rubric_ref: rubric/block_visibility_groups_bvg_evaluate_service@1.0
  tags:
  - mode:recipe
- id: bvg-allow-other-conditions
  input: In Block Visibility Groups, what does the `allow_other_conditions` setting on a group do?
  criteria: When off, blocks placed in the group have their per-block visibility options removed so the
    group is the only source of visibility rules; when on, blocks may add extra conditions on top of the
    group's.
  bundle: block_visibility_groups
  rubric_ref: rubric/block_visibility_groups_bvg_allow_other_conditions@1.0
  tags:
  - mode:recipe
