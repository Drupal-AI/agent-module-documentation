metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: block_access
  version: 1.2.x
  note: Block Access has no config entity, no settings form, no configure route (configure=null), no Drush
    and no plugins. Its only surface is permissions generated dynamically per block_content type by \Drupal\block_access\Permissions::get
    (permission_callbacks), plus a route subscriber that swaps block_content.add_form to the _block_content_access_create
    check (allow if 'administer blocks' OR 'create <type> block_content'). The active, non-deprecated
    permissions are 'update own <type> block_content' and 'delete own <type> block_content'; the create/update
    any/delete any variants are deprecated in 8.x-1.2 and removed in 2.0.0. Medium/hard cases are grounded
    in real user.role config and the dynamic per-type permission generation (the default 'basic' block
    content type exists on this site).
questions:
- id: block_access-perms-own
  input: On a Drupal 11 site with the contrib module block_access enabled, I want an editor role to be
    able to edit and delete only the content blocks (block_content) it created, WITHOUT giving it the
    site-wide 'Administer blocks' permission. Which permissions provided by block_access should I grant
    for the 'basic' block content type?
  criteria: Grant 'update own basic block_content' and 'delete own basic block_content'. block_access
    generates these per block_content type via Permissions::get(); they scope editing/deleting to blocks
    the user authored, so you do not need 'administer blocks'.
  bundle: block_access
  rubric_ref: rubric/block_access_block_access_perms_own@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: block_access-perms-deprecated
  input: In block_access 8.x-1.2, which of its permissions are deprecated and what should I use instead?
    Name at least one deprecated permission and its core replacement.
  criteria: 'The ''create <type> block_content'', ''update any <type> block_content'' and ''delete any
    <type> block_content'' permissions are deprecated in 8.x-1.2 and removed in 2.0.0. Use core Block
    Content''s own permissions instead: ''create <type> block content'', ''edit any <type> block content'',
    ''delete any <type> block content'' (note ''block content'' with a space, not ''block_content'').
    The ''update own'' / ''delete own'' permissions remain active.'
  bundle: block_access
  rubric_ref: rubric/block_access_block_access_perms_deprecated@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: block_access-add-access
  input: How does block_access change access to the 'Add content block' form (route block_content.add_form),
    and what determines whether a user may create a content block of a given type?
  criteria: 'A route subscriber (block_access.route_subscriber) removes the default ''_permission: administer
    blocks'' requirement on block_content.add_form and replaces it with the custom access check ''_block_content_access_create''.
    CreateBlockContentTypeCheck then allows access if the user has ''administer blocks'' OR ''create <type>
    block_content'' (checked with OR).'
  bundle: block_access
  rubric_ref: rubric/block_access_block_access_add_access@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: block_access-role-perm
  input: On this Drupal site there is a user role with machine name 'ba_known_editor'. Inspect the live
    role configuration and state which block_access permission (for the 'basic' block content type) it
    has been granted.
  criteria: The ba_known_editor role has the 'update own basic block_content' permission granted (visible
    in user.role.ba_known_editor config / via drush role:perm).
  bundle: block_access
  rubric_ref: rubric/block_access_block_access_role_perm@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/block_access-role-perm-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/block_access-role-perm-cleanup.sh
- id: block_access-type-perms
  input: This site has a block content type with machine name 'ba_promo'. block_access generates per-type
    permissions dynamically. Inspect the live permission list and give one of the OWN-scoped block_access
    permissions that exists for the ba_promo block content type.
  criteria: Because Permissions::get() iterates over every block_content type, the ba_promo type yields
    'update own ba_promo block_content' and 'delete own ba_promo block_content' (plus deprecated create/any
    variants). These appear in the permission list once the ba_promo block content type exists.
  bundle: block_access
  rubric_ref: rubric/block_access_block_access_type_perms@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/block_access-type-perms-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/block_access-type-perms-cleanup.sh
- id: block_access-grant-edit-own
  input: This site has a user role 'ba_edit_role' that currently has no block permissions. Using block_access,
    grant that role the ability to edit ONLY the 'basic' content blocks its members authored (not all
    blocks, and no 'administer blocks'). Apply the change to the live site.
  criteria: Grant 'update own basic block_content' to the ba_edit_role role (e.g. drush role:perm:add
    ba_edit_role 'update own basic block_content', or add it to user.role.ba_edit_role permissions). The
    role must NOT be given 'administer blocks'.
  bundle: block_access
  rubric_ref: rubric/block_access_block_access_grant_edit_own@1.0
  tags:
