  input: I have a role called 'ba_delete_role' on my site. I want people in that role to be able to delete
    the reusable content blocks they created themselves, but nothing else. Set that up using the block_access
    module's permissions for the 'basic' block type.
  criteria: Grant 'delete own basic block_content' to the ba_delete_role role. The role must NOT receive
    'administer blocks'.
  bundle: block_access
