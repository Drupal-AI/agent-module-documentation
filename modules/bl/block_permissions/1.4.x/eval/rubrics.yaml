rubrics:
- id: block_permissions_block_permissions_permission_names
  version: '1.0'
  applicable_bundles:
  - block_permissions
  checks:
  - kind: must_contain_any
    values:
    - administer block settings for theme
    - administer blocks provided by
    - permission_callbacks
  scoring:
    combine: all_pass
- id: block_permissions_block_permissions_block_layout_403
  version: '1.0'
  applicable_bundles:
  - block_permissions
  checks:
  - kind: must_contain_any
    values:
    - administer block settings for theme
    - default theme
  scoring:
    combine: all_pass
- id: block_permissions_block_permissions_routes_altered
