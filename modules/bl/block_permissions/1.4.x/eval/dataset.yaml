metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: block_permissions
  version: 1.4.x
  note: 'Block Permissions owns no configuration object at all - its entire surface is dynamic permissions
    generated by BlockPermissionsPermissions::permissions() via permission_callbacks, plus _custom_access
    requirements bolted onto six core block routes by its RouteSubscriber. So every medium/hard case is
    grounded in real user.role.* config and the exact permission strings ''administer block settings for
    theme <theme>'' and ''administer blocks provided by <provider>''. The themes used (olivero, claro)
    are the two installed, non-hidden themes on this site, which are exactly the ones the callback emits
    permissions for. The missing-theme introspection case exercises the module''s documented gotcha: ''administer
    blocks'' plus a provider permission is still a 403 on /admin/structure/block without the default theme''s
    permission.'
questions:
- id: block_permissions-permission-names
  input: The Drupal contrib module block_permissions adds finer-grained block permissions. What are the
    two families of permission names it generates, and how are they generated?
  criteria: 'They are generated dynamically: block_permissions.permissions.yml contains only a permission_callbacks
    entry pointing at BlockPermissionsPermissions::permissions(). That emits ''administer block settings
    for theme <theme_machine_name>'' for every installed non-hidden theme, and ''administer blocks provided
    by <provider>'' for every distinct provider in the block plugin definitions.'
  bundle: block_permissions
  rubric_ref: rubric/block_permissions_block_permissions_permission_names@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: block_permissions-block-layout-403
  input: A Drupal role has the core 'administer blocks' permission but still gets access denied on /admin/structure/block
    after the block_permissions module was enabled. What is missing?
  criteria: The route block.admin_display gets an extra _custom_access requirement, BlockPermissionsAccessControlHandler::blockListAccess,
    which checks 'administer block settings for theme ' . config('system.theme')->get('default'). So the
    role also needs the permission for the site's default theme, e.g. 'administer block settings for theme
    olivero'.
  bundle: block_permissions
  rubric_ref: rubric/block_permissions_block_permissions_block_layout_403@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: block_permissions-routes-altered
  input: Which core block routes does the Drupal block_permissions module alter, and what does it change
    on each of them?
  criteria: Its RouteSubscriber adds _custom_access requirements to block.admin_display (blockListAccess),
    block.admin_display_theme and block.admin_library (blockThemeListAccess), block.admin_add (blockAddFormAccess
    - needs both provider and theme permission), and entity.block.edit_form / entity.block.delete_form
    (blockFormAccess - provider permission). block.admin_library additionally gets its controller replaced
    with BlockPermissionsBlockLibraryController::listBlocks, which filters out blocks the user cannot
    add.
  bundle: block_permissions
  rubric_ref: rubric/block_permissions_block_permissions_routes_altered@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: block_permissions-known-role
  input: This Drupal site has a role with the machine name bp_known_role that was set up using the block_permissions
    module. Inspect the live site and tell me which theme's block layout that role may administer, and
    which block provider's blocks it is allowed to manage.
  criteria: 'Theme claro and provider views: user.role.bp_known_role holds ''administer blocks'', ''administer
    block settings for theme claro'' and ''administer blocks provided by views''. `drush cget user.role.bp_known_role
    permissions` shows all three.'
  bundle: block_permissions
  rubric_ref: rubric/block_permissions_block_permissions_known_role@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/block_permissions-known-role-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/block_permissions-known-role-cleanup.sh
- id: block_permissions-missing-theme
  input: On this Drupal site the role bp_locked_role has the 'administer blocks' permission, but users
    in it still get access denied on /admin/structure/block. Inspect the live site (its permissions and
    the site's theme settings) and tell me exactly which permission has to be added to fix it.
  criteria: '''administer block settings for theme olivero''. system.theme:default is olivero, and block_permissions
    adds a _custom_access check (blockListAccess) to block.admin_display that requires ''administer block
    settings for theme '' . the default theme. bp_locked_role only has ''administer blocks'' and ''administer
    blocks provided by system''.'
  bundle: block_permissions
  rubric_ref: rubric/block_permissions_block_permissions_missing_theme@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/block_permissions-missing-theme-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/block_permissions-missing-theme-cleanup.sh
- id: block_permissions-editor-role
  input: On this Drupal site, create a user role with the machine name bp_task_role, labelled 'BP task
    role'. Using the block_permissions module, give it the ability to manage the block layout of the Olivero
    theme and to manage blocks provided by the block_content module, and nothing more (it must not be
    able to administer blocks on the Claro theme). Apply the change to the live site.
  criteria: Role bp_task_role holds 'administer block settings for theme olivero' and 'administer blocks
    provided by block_content' (plus core's 'administer blocks'), and does NOT hold 'administer block
    settings for theme claro'.
  bundle: block_permissions
  rubric_ref: rubric/block_permissions_block_permissions_editor_role@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/block_permissions-editor-role-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/block_permissions-editor-role-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/block_permissions-editor-role-verify.sh
- id: block_permissions-admin-theme
  input: This Drupal site has a role called 'BP claro role' (machine name bp_claro_role). People in it
    should be able to move blocks around on the administration pages - the Claro theme - but only the
    blocks that come from Drupal's user module, and they must not be able to touch the blocks on our public
