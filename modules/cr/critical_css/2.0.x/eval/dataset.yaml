metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: critical_css
  version: 2.0.x
  note: 'Critical CSS inlines a per-request critical CSS file into the head and loads other CSS async.
    Config object critical_css.settings (has schema, but NO config/install defaults, so it does not exist
    until saved): enabled (bool), dir_path (string, must start with ''/'', relative to active theme, no
    ''..''), excluded_ids (newline-separated entity ids), enabled_for_logged_in_users (bool), preload_non_critical_css
    (bool). Form route critical_css.settings at /admin/config/development/performance/critical-css (permission:
    core administer site configuration). File match order ends in default-critical.css. Disabled on admin
    routes and AJAX; disabled for logged-in users unless enabled_for_logged_in_users. Medium/hard cases
    write/read the critical_css.settings config; baseline is ''config absent'', so cleanup deletes the
    object.'
questions:
- id: cc-enable-and-dir
  input: How do I switch on the Critical CSS module and tell it which directory holds my critical CSS
    files? Name the config object/keys and the settings page path.
  criteria: 'Enable it on /admin/config/development/performance/critical-css (route critical_css.settings)
    and set the ''Critical CSS base directory'' (dir_path, must start with ''/'', relative to the active
    theme). Config keys live in critical_css.settings: enabled, dir_path, excluded_ids, enabled_for_logged_in_users,
    preload_non_critical_css.'
  bundle: critical_css
  rubric_ref: rubric/critical_css_cc_enable_and_dir@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: cc-filenames
  input: Inside the critical CSS directory, what filenames does critical_css look for to match a page,
    and what is the final fallback filename if nothing more specific exists?
  criteria: 'It tries, most specific first: {entity_id}.css, path-{path}.css, {path}.css, path-{path_info}.css,
    {path_info}.css, {bundle}.css (e.g. article.css), and finally the fallback default-critical.css.'
  bundle: critical_css
  rubric_ref: rubric/critical_css_cc_filenames@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: cc-when-disabled
  input: On which requests does critical_css never inline critical CSS, even when enabled - think admin
    pages, AJAX, and logged-in users?
  criteria: It is disabled on admin routes (for users who can view the admin theme), on AJAX/XHR requests,
    and for authenticated users unless enabled_for_logged_in_users is on; entities listed in excluded_ids
    are also skipped.
  bundle: critical_css
  rubric_ref: rubric/critical_css_cc_when_disabled@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: cc-known-dir
  input: Critical CSS is configured on this site. Inspect the live critical_css.settings configuration
    and report the directory path (relative to the theme) where it looks for critical CSS files.
  criteria: dir_path is /css/ccss-known in critical_css.settings.
  bundle: critical_css
  rubric_ref: rubric/critical_css_cc_known_dir@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/critical_css-known-dir-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/critical_css-known-dir-cleanup.sh
- id: cc-excluded-ids
  input: On this site, Critical CSS has been told to skip processing for certain entity ids. Read the
    live critical_css.settings and report which entity ids are excluded from critical CSS.
  criteria: critical_css.settings excluded_ids lists 42 and 99 (one id per line).
  bundle: critical_css
  rubric_ref: rubric/critical_css_cc_excluded_ids@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/critical_css-excluded-ids-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/critical_css-excluded-ids-cleanup.sh
- id: cc-turn-on
  input: On this Drupal site, configure the Critical CSS module so it is enabled and looks for critical
    CSS files in the directory '/css/critical' (relative to the active theme). Apply the change to the
    live site.
  criteria: In critical_css.settings set enabled = true and dir_path = '/css/critical' (via the settings
    form or \Drupal::configFactory()->getEditable('critical_css.settings')->set('enabled', TRUE)->set('dir_path',
    '/css/critical')->save()).
  bundle: critical_css
  rubric_ref: rubric/critical_css_cc_turn_on@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/critical_css-turn-on-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/critical_css-turn-on-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/critical_css-turn-on-verify.sh
- id: cc-exclude-entity
  input: Critical CSS is already on for this site, but I need node 7 to load its CSS the normal way instead
    of using critical CSS. Configure Critical CSS to exclude entity id 7 from critical CSS processing,
    and apply it to the live site.
  criteria: Add 7 to critical_css.settings excluded_ids (one id per line), e.g. \Drupal::configFactory()->getEditable('critical_css.settings')->set('excluded_ids',
    "7")->save(), or enter 7 in the 'Exclude entity ids' textarea on the settings form.
  bundle: critical_css
  rubric_ref: rubric/critical_css_cc_exclude_entity@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: site-owner
    reset: agent-module-documentation/evaluation/verify/critical_css-exclude-entity-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/critical_css-exclude-entity-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/critical_css-exclude-entity-verify.sh
