metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: crazyegg
  version: 1.7.x
  note: 'Crazy Egg is a third-party JS snippet integration. All state is the crazyegg.settings config
    object: crazyegg_enabled (int), crazyegg_account_id (numeric account number), crazyegg_js_scope (''header''|''footer''),
    crazyegg_paths (path patterns, empty=all), crazyegg_roles_excluded (role ids not tracked). Settings
    form /admin/config/system/crazyegg (route crazyegg.config, permission ''administer crazy egg''). The
    account id is padded to 8 digits and split NNNN/NNNN to form the external script URL script.crazyegg.com/pages/scripts/NNNN/NNNN.js;
    the snippet only runs client-side. Evals are grounded purely in this config (no external network calls).'
questions:
- id: crazyegg-account-config
  input: I installed the crazyegg module on Drupal. Where do I enter my Crazy Egg account number, which
    config object stores it, and how is that number turned into the tracking script URL?
  criteria: Enter it on the settings form at /admin/config/system/crazyegg; it is stored as crazyegg_account_id
    in the crazyegg.settings config object. The numeric id is left-padded to 8 digits and split NNNN/NNNN
    to build the external async script URL https://script.crazyegg.com/pages/scripts/NNNN/NNNN.js (e.g.
    1234567 -> 0123/4567).
  bundle: crazyegg
  rubric_ref: rubric/crazyegg_crazyegg_account_config@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: crazyegg-inject-conditions
  input: For the crazyegg Drupal module, under what conditions is the tracking script actually added to
    a page, and what does the crazyegg_js_scope setting change?
  criteria: 'hook_page_attachments attaches the crazyegg/crazyegg library only when: crazyegg_enabled
    > 0, a numeric crazyegg_account_id is set, the current path matches crazyegg_paths (empty = every
    page), and the current user is in none of crazyegg_roles_excluded. crazyegg_js_scope (''header'' or
    ''footer'') controls whether the script tag is placed in the header or footer.'
  bundle: crazyegg
  rubric_ref: rubric/crazyegg_crazyegg_inject_conditions@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: crazyegg-exclude-roles-paths
  input: Using the crazyegg module, how do I stop logged-in administrators from being tracked, and how
    do I limit Crazy Egg tracking to only certain pages?
  criteria: Add the role (e.g. administrator) to crazyegg_roles_excluded so users in that role are not
    tracked, and list the desired path patterns (one per line, wildcards allowed) in crazyegg_paths to
    restrict tracking to those pages; leaving crazyegg_paths empty tracks every page.
  bundle: crazyegg
  rubric_ref: rubric/crazyegg_crazyegg_exclude_roles_paths@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: crazyegg-introspect-account
  input: On this Drupal site, the crazyegg module has been configured. Inspect the live configuration
    and report the Crazy Egg account number currently set and whether the tracking script is set to load
    in the header or the footer.
  criteria: In crazyegg.settings, crazyegg_account_id is 7654321 and crazyegg_js_scope is 'footer'.
  bundle: crazyegg
  rubric_ref: rubric/crazyegg_crazyegg_introspect_account@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/crazyegg-introspect-account-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/crazyegg-introspect-account-cleanup.sh
- id: crazyegg-introspect-exclusion
  input: The crazyegg module on this site has been set up to skip tracking for one particular user role.
    Inspect the live configuration and state which role is excluded from Crazy Egg tracking.
  criteria: crazyegg.settings crazyegg_roles_excluded contains 'administrator', so users with the administrator
    role are not tracked.
  bundle: crazyegg
  rubric_ref: rubric/crazyegg_crazyegg_introspect_exclusion@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/crazyegg-introspect-exclusion-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/crazyegg-introspect-exclusion-cleanup.sh
- id: crazyegg-set-account
  input: On this Drupal site, configure the crazyegg module to use Crazy Egg account number 1234567 and
    to load the tracking script in the footer. Apply the change to the live site.
  criteria: Set crazyegg.settings crazyegg_account_id to 1234567 and crazyegg_js_scope to 'footer' (e.g.
    drush cset crazyegg.settings crazyegg_account_id 1234567 -y; drush cset crazyegg.settings crazyegg_js_scope
    footer -y, or via the settings form).
  bundle: crazyegg
  rubric_ref: rubric/crazyegg_crazyegg_set_account@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/crazyegg-set-account-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/crazyegg-set-account-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/crazyegg-set-account-verify.sh
- id: crazyegg-exclude-role
  input: I use Crazy Egg on my Drupal site but I don't want my site administrators' visits to show up
    in the heatmaps. Using the crazyegg module, stop users with the administrator role from being tracked,
    and save it on the live site.
  criteria: Add 'administrator' to crazyegg.settings crazyegg_roles_excluded (a sequence of role ids),
    e.g. set crazyegg_roles_excluded to include administrator via config, so crazyegg_is_role_allowed()
    returns FALSE for admins.
  bundle: crazyegg
  rubric_ref: rubric/crazyegg_crazyegg_exclude_role@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-layman
    reset: agent-module-documentation/evaluation/verify/crazyegg-exclude-role-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/crazyegg-exclude-role-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/crazyegg-exclude-role-verify.sh
