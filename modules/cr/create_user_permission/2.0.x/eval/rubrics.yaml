rubrics:
- id: create_user_permission_cup_what_permission
  version: '1.0'
  applicable_bundles:
  - create_user_permission
  checks:
  - kind: must_contain_any
    values:
    - create users
    - administer users
  scoring:
    combine: all_pass
- id: create_user_permission_cup_which_route
  version: '1.0'
  applicable_bundles:
  - create_user_permission
  checks:
  - kind: must_contain_any
    values:
    - user.admin_create
    - /admin/people/create
    - admin/people/create
  scoring:
    combine: all_pass
- id: create_user_permission_cup_programmatic_access
  version: '1.0'
  applicable_bundles:
  - create_user_permission
  checks:
  - kind: must_contain_any
    values:
    - hook_entity_create_access
    - entity_create_access
    - create users
  scoring:
    combine: all_pass
- id: create_user_permission_cup_known_role
  version: '1.0'
  applicable_bundles:
  - create_user_permission
  checks:
  - kind: must_contain_any
    values:
    - cup_known_creator
  scoring:
    combine: all_pass
- id: create_user_permission_cup_two_roles
  version: '1.0'
  applicable_bundles:
  - create_user_permission
  checks:
  - kind: must_contain_any
    values:
    - cup_role_on
  scoring:
    combine: all_pass
- id: create_user_permission_cup_grant_role
  version: '1.0'
  applicable_bundles:
  - create_user_permission
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
- id: create_user_permission_cup_editor_role
  version: '1.0'
  applicable_bundles:
  - create_user_permission
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
