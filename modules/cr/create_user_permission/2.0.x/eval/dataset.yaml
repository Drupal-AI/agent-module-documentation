metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: create_user_permission
  version: 2.0.x
  note: Create User Permission adds one permission, 'create users', and enforces it via a route subscriber
    that rewrites the core user.admin_create route requirement (/admin/people/create) and via hook_entity_create_access()
    for the user entity type. It also alters the register form for delegated creators. There is no configure
    route, no settings, no config schema, no Drush commands and no plugins. The only persistent state
    is which roles hold 'create users' (in user.role.<id> config). Medium cases seed roles with/without
    the permission and read them back; hard cases have the agent grant the permission to an empty role,
    verified against live role config.
questions:
- id: cup-what-permission
  input: In Drupal, what problem does the create_user_permission module solve, and what is the machine
    name of the permission it adds that lets a role create new accounts without full user administration?
  criteria: It lets you grant account creation without granting 'administer users'. It adds one permission
    with machine name 'create users' (title 'Create users'); a holder can create accounts but cannot edit,
    block, delete, or assign roles to existing users.
  bundle: create_user_permission
  rubric_ref: rubric/create_user_permission_cup_what_permission@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: cup-which-route
  input: Which core route/path does create_user_permission make reachable with its 'create users' permission
    instead of 'administer users', and how does it change that route?
  criteria: 'Its RouteSubscriber::alterRoutes() rewrites the core user.admin_create route (path /admin/people/create)
    requirement to _permission: ''create users'', so the Add user form opens for holders of that permission.'
  bundle: create_user_permission
  rubric_ref: rubric/create_user_permission_cup_which_route@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: cup-programmatic-access
  input: Besides the admin Add user form, how does create_user_permission make sure that programmatic
    or REST creation of a user entity also honours the 'create users' permission? Which hook does it use?
  criteria: 'It implements hook_entity_create_access(): for the ''user'' entity type it returns AccessResult::allowedIfHasPermission($account,
    ''create users''), so any user-entity create path (UI, programmatic, REST) is governed by the permission,
    not just the route.'
  bundle: create_user_permission
  rubric_ref: rubric/create_user_permission_cup_programmatic_access@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: cup-known-role
  input: On this Drupal site, exactly one custom role has been granted the create_user_permission 'create
    users' permission. Inspect the live role configuration and give the machine name (id) of that role.
  criteria: 'The role is cup_known_creator: its user.role.cup_known_creator config lists ''create users''
    under permissions.'
  bundle: create_user_permission
  rubric_ref: rubric/create_user_permission_cup_known_role@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
