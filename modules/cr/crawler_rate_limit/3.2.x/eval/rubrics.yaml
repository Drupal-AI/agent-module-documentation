rubrics:
- id: crawler_rate_limit_crl_http_code
  version: '1.0'
  applicable_bundles:
  - crawler_rate_limit
  checks:
  - kind: must_contain_any
    values:
    - '429'
    - middleware
  scoring:
    combine: all_pass
- id: crawler_rate_limit_crl_where_config
  version: '1.0'
  applicable_bundles:
  - crawler_rate_limit
  checks:
  - kind: must_contain_any
    values:
    - settings.php
    - crawler_rate_limit.settings
    - backend
    - enabled
  scoring:
    combine: all_pass
- id: crawler_rate_limit_crl_three_limits
  version: '1.0'
  applicable_bundles:
  - crawler_rate_limit
  checks:
  - kind: must_contain_any
    values:
    - bot_traffic
    - regular_traffic
    - regular_traffic_asn
    - ASN
    - interval
  scoring:
    combine: all_pass
- id: crawler_rate_limit_crl_bot_limit_value
  version: '1.0'
  applicable_bundles:
  - crawler_rate_limit
  checks:
  - kind: must_contain_any
    values:
    - '137'
  scoring:
    combine: all_pass
- id: crawler_rate_limit_crl_regular_limit_value
  version: '1.0'
  applicable_bundles:
  - crawler_rate_limit
  checks:
  - kind: must_contain_any
    values:
    - '242'
  scoring:
    combine: all_pass
- id: crawler_rate_limit_crl_configure_bot
  version: '1.0'
  applicable_bundles:
  - crawler_rate_limit
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
- id: crawler_rate_limit_crl_configure_regular
  version: '1.0'
  applicable_bundles:
  - crawler_rate_limit
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
