metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: crawler_rate_limit
  version: 3.2.x
  note: 'Crawler Rate Limit is configured entirely in settings.php under $settings[''crawler_rate_limit.settings'']
    (no admin UI, config entity, permission, Drush, or config schema). It needs enabled=TRUE plus a supported
    backend (redis|apcu|memcached) to do anything, then applies up to three independent limits (bot_traffic,
    regular_traffic, regular_traffic_asn), each interval+requests. An HTTP middleware (priority 240) returns
    429 on limit / 403 on asn_blocklist. Effective config is read via \Drupal\crawler_rate_limit\RateLimitManager::getSettings().
    Medium/hard cases write a delimited, php -l-guarded block to settings.php: introspection reads back
    the configured request limits; execution configures a bot limit (150/300s) or a visitor limit (275/900s)
    with the apcu backend enabled, verified via getSettings().'
questions:
- id: crl-http-code
  input: When Crawler Rate Limit blocks a bot for exceeding its request limit, what HTTP status code does
    it return, and via what mechanism does it intercept the request so early?
  criteria: It returns HTTP 429 (Too many requests) with a Retry-After header, from its http_middleware
    (crawler_rate_limit.middleware, priority 240) that decorates the kernel before routing. A blocked
    ASN gets 403 'Blocked.' instead.
  bundle: crawler_rate_limit
  rubric_ref: rubric/crawler_rate_limit_crl_http_code@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: crl-where-config
  input: There is no admin page for Crawler Rate Limit. Where do I configure it, and which two keys are
    required for it to do anything at all?
  criteria: Configure it in settings.php under $settings['crawler_rate_limit.settings']. It requires enabled
    = TRUE and a supported backend (redis, apcu or memcached); otherwise the limiter is force-disabled
    (fails open).
  bundle: crawler_rate_limit
  rubric_ref: rubric/crawler_rate_limit_crl_where_config@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: crl-three-limits
  input: What are the three independent rate limits Crawler Rate Limit can enforce, and what two values
    does each one need?
  criteria: bot_traffic (crawlers by User-Agent), regular_traffic (visitor level, keyed by IP + User-Agent),
    and regular_traffic_asn (per autonomous system, needs geoip2/geoip2 + an ASN database). Each needs
    an interval (seconds) and a requests count, and is only active when both are > 0.
  bundle: crawler_rate_limit
  rubric_ref: rubric/crawler_rate_limit_crl_three_limits@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: crl-bot-limit-value
  input: This Drupal site has Crawler Rate Limit configured in settings.php. Inspect the running site's
    effective configuration and state how many requests a crawler/bot is allowed within its interval (the
    bot_traffic requests value).
  criteria: 137. RateLimitManager::getSettings() shows bot_traffic.requests = 137 (interval 600, backend
    apcu, enabled).
  bundle: crawler_rate_limit
  rubric_ref: rubric/crawler_rate_limit_crl_bot_limit_value@1.0
  tags:
  - mode:introspection
  - difficulty:medium
