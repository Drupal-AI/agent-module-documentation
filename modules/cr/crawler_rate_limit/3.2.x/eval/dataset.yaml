- id: crl-configure-bot
  input: On this Drupal site, configure Crawler Rate Limit so it is enabled with the apcu backend and
    limits bot/crawler traffic to 150 requests per 300 seconds. Apply the change to the live site (its
    configuration lives in settings.php).
  criteria: settings.php sets $settings['crawler_rate_limit.settings']['enabled'] = TRUE, ['backend']
