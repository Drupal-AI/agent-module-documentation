metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: eca_crowdsec
  version: 1.2.x
  note: 'eca_crowdsec is a trivial glue submodule of crowdsec that exposes CrowdSec''s events to ECA.
    It ships one ECA event plugin (id ''crowdsec'', class CrowdSecEvent, deriver CrowdSecEventDeriver)
    with six derivatives: crowdsec:scenariolist, crowdsec:signalscenariolist, crowdsec:blocked, crowdsec:banned,
    crowdsec:unbanned, crowdsec:signalled — each mapped to a Drupal\crowdsec\Event\CrowdSecEvents constant.
    It exposes tokens crowdsec_ip, crowdsec_scenario, crowdsec_scenario_list. No config form (configure=null),
    no permissions, no services, no Drush. Depends on crowdsec + eca (^3). Medium/hard cases are grounded
    in real eca config entities that use a crowdsec:* event plugin.'
questions:
- id: eca_crowdsec-events
  input: The eca_crowdsec submodule integrates CrowdSec with ECA. List the CrowdSec events it makes available
    to ECA (the derivative event plugin ids), for example the one that fires when an IP is banned.
  criteria: 'It provides six ECA event derivatives from a single ''crowdsec'' event plugin: crowdsec:scenariolist,
    crowdsec:signalscenariolist, crowdsec:blocked, crowdsec:banned, crowdsec:unbanned, crowdsec:signalled
    (mapped to CrowdSecEvents constants like crowdsec.ip.banned).'
  bundle: eca_crowdsec
  rubric_ref: rubric/eca_crowdsec_eca_crowdsec_events@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: eca_crowdsec-tokens
  input: When I react to a CrowdSec event in ECA using the eca_crowdsec submodule, which tokens can I
    use in my ECA actions to get the IP address and the scenario?
  criteria: eca_crowdsec exposes the tokens crowdsec_ip (the IP, on the IP events), crowdsec_scenario
    (on crowdsec:signalled) and crowdsec_scenario_list (on the scenario-list events).
  bundle: eca_crowdsec
  rubric_ref: rubric/eca_crowdsec_eca_crowdsec_tokens@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: eca_crowdsec-deps
  input: What does the eca_crowdsec module do, and which modules must be enabled for it to work?
  criteria: It is a thin glue module that exposes the CrowdSec module's events to ECA (Event-Condition-Action)
    so you can build no-code automations reacting to CrowdSec bans/blocks/signals. It requires both the
    crowdsec and eca (^3) modules.
  bundle: eca_crowdsec
  rubric_ref: rubric/eca_crowdsec_eca_crowdsec_deps@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: eca_crowdsec-known-model
  input: This site has an ECA model that reacts to a CrowdSec event exposed by eca_crowdsec. Inspect the
    live ECA configuration for the model 'eca_crowdsec_known' and state which crowdsec:* event plugin
    it is triggered by.
  criteria: The eca_crowdsec_known ECA model's event uses the plugin crowdsec:signalled (fires when an
    IP is signalled upstream).
  bundle: eca_crowdsec
  rubric_ref: rubric/eca_crowdsec_eca_crowdsec_known_model@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/eca_crowdsec-known-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/eca_crowdsec-known-cleanup.sh
- id: eca_crowdsec-build-model
  input: On this Drupal site, create an ECA model with the machine id 'eca_crowdsec_task' that is triggered
    by the eca_crowdsec 'IP banned' event (event plugin crowdsec:banned). Save it to the live site. It
    does not need conditions or actions.
  criteria: Create an eca config entity id eca_crowdsec_task whose events contain a component with plugin
    'crowdsec:banned' (e.g. via Eca::create([...'events'=>['e1'=>['plugin'=>'crowdsec:banned',...]]])->save(),
    or by building the model in the ECA UI with the 'IP banned' CrowdSec event).
  bundle: eca_crowdsec
  rubric_ref: rubric/eca_crowdsec_eca_crowdsec_build_model@1.0
  tags:
  - mode:execution
  - difficulty:hard
