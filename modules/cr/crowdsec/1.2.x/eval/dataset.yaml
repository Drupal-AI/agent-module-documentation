metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: crowdsec
  version: 1.2.x
  note: 'CrowdSec integrates Drupal with the CrowdSec security network. It is driven by one config object
    crowdsec.settings (log_level, env dev|prod, api_timeout, cti_api_key, signal_scenarios[], scenarios[],
    plugins.<id>.{enable,ban_duration,leak_speed,bucket_capacity}). Ban plugins are a crowdsec_scenario
    plugin type (dir src/Plugin/CrowdsecScenario, attribute Drupal\crowdsec\Attribute\Scenario, base ScenarioPluginBase,
    manager plugin.manager.crowdsec_scenario). Three ship in-box: flood (drupal/auth-bruteforce), core-ban
    (drupal/core-ban), whisper (drupal/4xx-scan, buffered default; only whisper uses leak_speed+bucket_capacity).
    Config UI: /admin/config/services/crowdsec (route crowdsec.settings, permission ''administer site
    configuration''). Drush: crowdsec:enroll|signal|collect|test:signal|test:ip. Events under Drupal\crowdsec\Event\CrowdSecEvents
    (crowdsec.ip.banned etc). This site has NO live CrowdSec API/agent, so all medium/hard cases are grounded
    purely in local crowdsec.settings config reads/writes (no upstream calls).'
questions:
- id: crowdsec-ban-plugins
  input: The Drupal CrowdSec module ships three built-in ban plugins that detect bad behaviour locally.
    Name them and say briefly what each one detects.
  criteria: flood (Flood control bans, scenario drupal/auth-bruteforce) — IPs hitting Drupal flood control
    such as failed logins; core-ban (Administrator bans, drupal/core-ban) — IPs manually banned via core
    Ban / Advanced Ban; whisper (4xx response bans, drupal/4xx-scan) — IPs causing many 4xx responses
    within a time window.
  bundle: crowdsec
  rubric_ref: rubric/crowdsec_crowdsec_ban_plugins@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: crowdsec-custom-scenario
  input: How do I add a custom CrowdSec 'scenario' (ban) plugin in my own Drupal module? What plugin directory,
    attribute and base class are involved, and how do I emit a signal for an IP?
  criteria: 'Create a class in my_module/src/Plugin/CrowdsecScenario/ annotated with the #[Scenario(id,
    scenario, label, description, buffer)] attribute (Drupal\crowdsec\Attribute\Scenario) extending ScenarioPluginBase.
    Emit signals via ScenarioPluginManager::getPlugin(''id'')->addSignal($ip, $status, $targetUser). Its
    settings are auto-added under crowdsec.settings plugins.<id>.'
  bundle: crowdsec
  rubric_ref: rubric/crowdsec_crowdsec_custom_scenario@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: crowdsec-config-and-drush
  input: Where is the CrowdSec module configured in the Drupal admin (route/path), and which Drush command
    forces it to download and enforce the subscribed CrowdSec blocklists?
  criteria: Configure it at /admin/config/services/crowdsec (route crowdsec.settings, permission 'administer
    site configuration'). drush crowdsec:collect refreshes/downloads the subscribed blocklists (Client::refresh());
    it also runs on cron.
  bundle: crowdsec
  rubric_ref: rubric/crowdsec_crowdsec_config_and_drush@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: crowdsec-env-value
  input: 'On this Drupal site, inspect the live CrowdSec configuration and report: which environment (dev
    or prod) is CrowdSec set to, and what is the ban duration (in seconds) configured for the 4xx response
    ban plugin?'
  criteria: In crowdsec.settings, env is 'prod' and plugins.whisper.ban_duration (the 4xx-scan / whisper
    plugin) is 7200 seconds.
  bundle: crowdsec
  rubric_ref: rubric/crowdsec_crowdsec_env_value@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/crowdsec-env-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/crowdsec-env-cleanup.sh
- id: crowdsec-disabled-plugin
  input: One of CrowdSec's built-in ban plugins has been turned off on this site. Inspect the live crowdsec.settings
    configuration and state which ban plugin is currently disabled.
  criteria: 'The flood plugin is disabled: crowdsec.settings plugins.flood.enable is FALSE (the core-ban
    and whisper plugins remain enabled).'
  bundle: crowdsec
  rubric_ref: rubric/crowdsec_crowdsec_disabled_plugin@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/crowdsec-flood-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/crowdsec-flood-cleanup.sh
- id: crowdsec-set-threshold
  input: On this Drupal site, configure the CrowdSec 4xx response ban plugin (whisper) so its threshold
    (bucket_capacity) is 25, meaning 25 bad requests in the time window are needed to ban an IP. Apply
    the change to the live crowdsec.settings configuration.
  criteria: Set crowdsec.settings -> plugins.whisper.bucket_capacity to 25 (via the 'Threshold' field
    on the 4xx response bans plugin in the CrowdSec settings form, or drush cset crowdsec.settings plugins.whisper.bucket_capacity
    25).
  bundle: crowdsec
  rubric_ref: rubric/crowdsec_crowdsec_set_threshold@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/crowdsec-threshold-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/crowdsec-threshold-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/crowdsec-threshold-verify.sh
- id: crowdsec-disable-flood
  input: On this Drupal site, disable CrowdSec's flood-control ban plugin (the one that locally bans IPs
    triggering Drupal flood control) while leaving the other ban plugins enabled. Apply the change to
    the live site.
  criteria: Set crowdsec.settings -> plugins.flood.enable to FALSE (untick 'Enable' on the Flood control
    bans plugin in the CrowdSec settings form, or drush cset crowdsec.settings plugins.flood.enable 0).
  bundle: crowdsec
  rubric_ref: rubric/crowdsec_crowdsec_disable_flood@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/crowdsec-disable-flood-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/crowdsec-disable-flood-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/crowdsec-disable-flood-verify.sh
