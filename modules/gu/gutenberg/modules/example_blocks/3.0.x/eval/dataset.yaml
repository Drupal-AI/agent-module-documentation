  criteria: The example_blocks module is installed/enabled (drush en example_blocks -y), so \Drupal::moduleHandler()->moduleExists('example_blocks')
    is TRUE.
  bundle: example_blocks
  rubric_ref: rubric/example_blocks_example_blocks_install@1.0
