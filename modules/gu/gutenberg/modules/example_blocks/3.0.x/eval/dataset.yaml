metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: example_blocks
  version: 3.0.x
  note: 'Example Blocks is a JS learning submodule of gutenberg (no PHP/config/permissions). It registers
    two custom Gutenberg blocks via example_blocks.gutenberg.yml: example-blocks/card (client-side, has
    save.js) and example-blocks/dynamic-card (server-rendered via templates/gutenberg-block--example-blocks--dynamic-card.html.twig).
    The discovery file declares libraries-edit/libraries-view (example_blocks/blocks), dynamic-blocks
    (example-blocks/dynamic-card) and custom-blocks under the Media category. The example_blocks/blocks
    asset library (dist/blocks.js, dist/style-blocks.css) depends on gutenberg/react, gutenberg/block-editor,
    gutenberg/blocks, gutenberg/components; blocks/index.js calls registerBlockType(). Recipe cases cover
    the block ids, the static-vs-dynamic distinction, and the registration mechanism. Introspection ensures
    the module is enabled and reads the blocks it registers. Execution installs the module, verified via
    the module list and via discovery of its example_blocks/blocks asset library.'
questions:
- id: example_blocks-which-blocks
  input: Which Gutenberg blocks does the example_blocks submodule provide?
  criteria: 'Two blocks: example-blocks/card (''Card'') and example-blocks/dynamic-card (''Dynamic Card''),
    both added to the editor''s Media category via example_blocks.gutenberg.yml.'
  bundle: example_blocks
  rubric_ref: rubric/example_blocks_example_blocks_which_blocks@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: example_blocks-static-vs-dynamic
  input: In the example_blocks submodule, which block is rendered server-side, and how is that server
    rendering done?
  criteria: example-blocks/dynamic-card is dynamic (listed under dynamic-blocks) and is rendered server-side
    from templates/gutenberg-block--example-blocks--dynamic-card.html.twig. example-blocks/card is a static
    block (client-side save.js).
  bundle: example_blocks
  rubric_ref: rubric/example_blocks_example_blocks_static_vs_dynamic@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: example_blocks-registration
  input: How does example_blocks register its blocks with Gutenberg and the editor JS, and which libraries
    do they depend on?
  criteria: It declares them in example_blocks.gutenberg.yml (libraries-edit/libraries-view = example_blocks/blocks,
    dynamic-blocks, custom-blocks) and registers them in JS with registerBlockType() (blocks/index.js).
    The example_blocks/blocks library depends on gutenberg/react, gutenberg/block-editor, gutenberg/blocks
    and gutenberg/components.
  bundle: example_blocks
  rubric_ref: rubric/example_blocks_example_blocks_registration@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: example_blocks-enabled-blocks
  input: On this Drupal site, inspect the example_blocks submodule and list the custom Gutenberg block
    ids it registers.
  criteria: It registers example-blocks/card and example-blocks/dynamic-card (see example_blocks.gutenberg.yml
    on the enabled module).
  bundle: example_blocks
  rubric_ref: rubric/example_blocks_example_blocks_enabled_blocks@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/example_blocks-enabled-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/example_blocks-enabled-cleanup.sh
- id: example_blocks-dynamic-template
  input: On this Drupal site, which block does the example_blocks submodule render with a server-side
    Twig template, and what is the template file name?
  criteria: example-blocks/dynamic-card is server-rendered from templates/gutenberg-block--example-blocks--dynamic-card.html.twig
    (declared under dynamic-blocks in example_blocks.gutenberg.yml).
  bundle: example_blocks
  rubric_ref: rubric/example_blocks_example_blocks_dynamic_template@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/example_blocks-enabled-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/example_blocks-enabled-cleanup.sh
- id: example_blocks-install
