metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: gutenberg
  version: 3.0.x
  note: 'Gutenberg is the WordPress block editor as a Drupal @Editor + @Filter on a ''gutenberg'' text
    format, enabled PER CONTENT TYPE. The ''Enable Gutenberg experience'' checkbox on the content-type
    form writes gutenberg.settings:<node_type>_enable_full = true (read by GutenbergContentTypeManager::isContentTypeSupported).
    Sibling keys: <type>_template, <type>_template_lock, <type>_allowed_image_styles. Blocks are discovered
    from the module''s gutenberg.blocks.yml plus any MODULE.gutenberg.yml (libraries-edit/libraries-view/dynamic-blocks/custom-blocks);
    editor JS plugins are a real plugin type (@GutenbergPlugin, manager plugin.manager.gutenberg.plugin,
    e.g. DrupalImage). Field formatter gutenberg_text. Permissions: use gutenberg, manage blocks lock,
    create and edit custom gutenberg content blocks. Introspection reads gutenberg.settings for a namespaced
    content type; execution enables Gutenberg on a content type and sets a template lock, both verified
    against live gutenberg.settings config. Evals ground in the text-format/editor config and per-content-type
    enablement, not the browser JS.'
questions:
- id: gutenberg-enable-how
  input: How do you turn the Gutenberg editor on for a Drupal content type, and where is that choice stored?
    There is no global settings page.
  criteria: On the content type's add/edit form tick 'Enable Gutenberg experience'; this stores gutenberg.settings:<node_type>_enable_full
    = true (read by GutenbergContentTypeManager::isContentTypeSupported). There is no configure route
    (configure=null).
  bundle: gutenberg
  rubric_ref: rubric/gutenberg_gutenberg_enable_how@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: gutenberg-text-format
  input: Which text format and editor does the Gutenberg module ship, and what plugin ids implement the
    editor and filter?
  criteria: It ships the 'gutenberg' text format (filter.format.gutenberg, 'Gutenberg Blocks text format')
    paired with editor.editor.gutenberg. The Editor plugin id is 'gutenberg' and the Filter plugin id
    is 'gutenberg' (a required TYPE_TRANSFORM_REVERSIBLE filter). It also provides the gutenberg_text
    field formatter.
  bundle: gutenberg
  rubric_ref: rubric/gutenberg_gutenberg_text_format@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: gutenberg-add-blocks
  input: How can a module or theme register its own Gutenberg editor blocks, and how are editor JS plugins
    added?
  criteria: 'Provide a MODULE.gutenberg.yml (or THEME.gutenberg.yml) discovery file with libraries-edit,
    libraries-view, dynamic-blocks and custom-blocks sections (discovered by GutenbergLibraryManager/BlocksLibraryManager).
    Editor JS plugins are a plugin type: @GutenbergPlugin (manager plugin.manager.gutenberg.plugin, namespace
    Plugin/GutenbergPlugin, base GutenbergPluginBase), e.g. DrupalImage.'
  bundle: gutenberg
  rubric_ref: rubric/gutenberg_gutenberg_add_blocks@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: gutenberg-which-type-enabled
  input: On this Drupal site, exactly one content type has the Gutenberg editor enabled. Inspect the live
    gutenberg configuration and give the machine name of that content type.
  criteria: 'gutenberg_probe is enabled: gutenberg.settings:gutenberg_probe_enable_full is true.'
  bundle: gutenberg
  rubric_ref: rubric/gutenberg_gutenberg_which_type_enabled@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/gutenberg-probe-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/gutenberg-probe-cleanup.sh
- id: gutenberg-template-lock
  input: On this Drupal site, the Gutenberg-enabled content type 'gutenberg_probe' has a block template
    lock configured. Inspect the live gutenberg configuration and state the template lock mode.
  criteria: The template lock is 'insert' (gutenberg.settings:gutenberg_probe_template_lock).
  bundle: gutenberg
  rubric_ref: rubric/gutenberg_gutenberg_template_lock@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/gutenberg-probe-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/gutenberg-probe-cleanup.sh
- id: gutenberg-enable-on-type
  input: On this Drupal site there is a content type with machine name 'gutenberg_task'. Enable the Gutenberg
    editor experience for it, and apply the change to the live site.
  criteria: gutenberg.settings:gutenberg_task_enable_full is set to true (via the content type form's
    'Enable Gutenberg experience' checkbox, or drush cset gutenberg.settings gutenberg_task_enable_full
    true -y).
  bundle: gutenberg
  rubric_ref: rubric/gutenberg_gutenberg_enable_on_type@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/gutenberg-enable-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/gutenberg-enable-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/gutenberg-enable-verify.sh
- id: gutenberg-set-template-lock
  input: On this Drupal site, the Gutenberg-enabled content type 'gutenberg_lock' should have its block
    template fully locked. Configure Gutenberg so its template lock mode is 'all', and apply the change
    to the live site.
  criteria: gutenberg.settings:gutenberg_lock_template_lock is set to 'all' (drush cset gutenberg.settings
    gutenberg_lock_template_lock all -y).
  bundle: gutenberg
  rubric_ref: rubric/gutenberg_gutenberg_set_template_lock@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/gutenberg-lock-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/gutenberg-lock-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/gutenberg-lock-verify.sh
