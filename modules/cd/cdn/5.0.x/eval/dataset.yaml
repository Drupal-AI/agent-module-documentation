metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: cdn
  version: 5.0.x
  note: 'All cases are grounded in the cdn.settings config object. Baseline (config/install/cdn.settings.yml):
    status=false, mapping={type:simple, domain:null, conditions:{not:{extensions:[css,js]}}}, scheme=''//'',
    farfuture.status=true, stream_wrappers=[public]. Medium/hard cases only read/write local Drupal config
    (no real CDN is contacted). Reset/cleanup scripts restore that shipped baseline explicitly.'
questions:
- id: cdn-enable-flag
  input: I installed the Drupal cdn module and set a CDN domain, but files are still served from my own
    server. Which single config setting actually turns CDN URL rewriting on, and in which config object
    does it live?
  criteria: Set cdn.settings:status to TRUE (the master 'Serve files from CDN' switch). It ships as false.
  bundle: cdn
  rubric_ref: rubric/cdn_cdn_enable_flag@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: cdn-mapping-types
  input: What are the three CDN mapping types the cdn module supports for deciding which files go to which
    CDN domain?
  criteria: simple (one domain, optional extension conditions), complex (a fallback_domain plus nested
    per-extension mappings), and auto-balanced (spread matching extensions across several domains via
    consistent hashing).
  bundle: cdn
  rubric_ref: rubric/cdn_cdn_mapping_types@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: cdn-scheme
  input: The cdn module has a 'scheme' setting for the file URLs it generates. What are its allowed values
    and which is the default?
  criteria: cdn.settings:scheme is one of '//' (scheme-relative, the default), 'https://', or 'http://'.
    It is validated by a Choice constraint.
  bundle: cdn
  rubric_ref: rubric/cdn_cdn_scheme@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: cdn-known-domain
  input: On this Drupal site the cdn module is enabled and actively serving files from a CDN. Inspect
    the live configuration and tell me the CDN domain that files are being served from.
  criteria: 'cdn-medium.example.com: cdn.settings has status=true and mapping.domain=''cdn-medium.example.com''
    (simple mapping).'
  bundle: cdn
  rubric_ref: rubric/cdn_cdn_known_domain@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/cdn-known-domain-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/cdn-known-domain-cleanup.sh
- id: cdn-scheme-value
  input: On this Drupal site, inspect the cdn module configuration and tell me which URL scheme it is
    configured to use for CDN file URLs.
  criteria: https:// — cdn.settings:scheme is 'https://'.
  bundle: cdn
  rubric_ref: rubric/cdn_cdn_scheme_value@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/cdn-scheme-value-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/cdn-scheme-value-cleanup.sh
- id: cdn-serve-all-from-domain
  input: On this Drupal site, configure the cdn module to actually serve files from the CDN domain cdn-hard.example.com
    using a simple mapping, and turn CDN serving on. Apply the change to the live configuration.
  criteria: cdn.settings has status=TRUE, mapping.type='simple', and mapping.domain='cdn-hard.example.com'.
  bundle: cdn
  rubric_ref: rubric/cdn_cdn_serve_all_from_domain@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/cdn-serve-all-from-domain-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/cdn-serve-all-from-domain-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/cdn-serve-all-from-domain-verify.sh
- id: cdn-set-https-scheme
  input: On this Drupal site, configure the cdn module so that it generates absolute https:// URLs for
    CDN files (instead of scheme-relative URLs). Apply the change to the live configuration.
  criteria: cdn.settings:scheme is set to 'https://'.
  bundle: cdn
  rubric_ref: rubric/cdn_cdn_set_https_scheme@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: site-builder
    reset: agent-module-documentation/evaluation/verify/cdn-set-https-scheme-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/cdn-set-https-scheme-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/cdn-set-https-scheme-verify.sh
