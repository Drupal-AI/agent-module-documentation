metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: cdn_ui
  version: 5.0.x
  note: cdn_ui is the admin UI submodule for CDN. It has no config of its own; it edits cdn.settings.
    Easy cases cover its route/permission/target config. Medium/hard cases are grounded in the cdn.settings
    values the UI form writes (status, mapping.domain, farfuture.status) — the end state a UI save produces
    — and only touch local config. Baseline restored explicitly by cleanup/reset.
questions:
- id: cdn_ui-route-permission
  input: The Drupal cdn module has no settings page of its own. Its cdn_ui submodule adds one. What is
    the admin path of that CDN settings form, and which permission controls access to it?
  criteria: The form is at /admin/config/services/cdn (route cdn_ui.settings) and is gated by the 'administer
    CDN configuration' permission.
  bundle: cdn_ui
  rubric_ref: rubric/cdn_ui_cdn_ui_route_permission@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: cdn_ui-target-config
  input: When I save the CDN UI settings form, which configuration object does it actually write to?
  criteria: It writes cdn.settings (the config object owned by the cdn module). cdn_ui has no config of
    its own.
  bundle: cdn_ui
  rubric_ref: rubric/cdn_ui_cdn_ui_target_config@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: cdn_ui-uninstallable
  input: After I finish configuring the CDN through the CDN UI submodule, can I uninstall CDN UI without
    losing my CDN configuration? Why?
  criteria: Yes. CDN UI stores no configuration of its own — it only edits cdn.settings — so uninstalling
    it leaves the CDN configuration intact and the cdn module keeps working.
  bundle: cdn_ui
  rubric_ref: rubric/cdn_ui_cdn_ui_uninstallable@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: cdn_ui-known-domain
  input: On this Drupal site the CDN has been configured through the admin UI. Inspect the live configuration
    and tell me the CDN domain that the CDN UI Mapping tab currently shows.
  criteria: 'cdn-ui-medium.example.com: cdn.settings:mapping.domain is ''cdn-ui-medium.example.com''.'
  bundle: cdn_ui
  rubric_ref: rubric/cdn_ui_cdn_ui_known_domain@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/cdn_ui-known-domain-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/cdn_ui-known-domain-cleanup.sh
- id: cdn_ui-scheme-value
  input: On this Drupal site, inspect the CDN configuration that the CDN UI manages and tell me which
    URL scheme is currently configured for CDN file URLs.
  criteria: http:// — cdn.settings:scheme is 'http://'.
  bundle: cdn_ui
  rubric_ref: rubric/cdn_ui_cdn_ui_scheme_value@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/cdn_ui-scheme-value-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/cdn_ui-scheme-value-cleanup.sh
- id: cdn_ui-enable-with-domain
  input: On this Drupal site, use the CDN configuration (as the CDN UI settings form would) to turn CDN
    serving ON and set the CDN domain to cdn-ui-hard.example.com with a simple mapping. Apply the change
    to the live configuration.
  criteria: cdn.settings has status=TRUE, mapping.type='simple', mapping.domain='cdn-ui-hard.example.com'.
  bundle: cdn_ui
  rubric_ref: rubric/cdn_ui_cdn_ui_enable_with_domain@1.0
