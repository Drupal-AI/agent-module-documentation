metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: ui_icons
  version: 1.1.x
  note: UI Icons is a generic icon manager built on Drupal core's Icon API (11.1+). The base module ships
    the icon_autocomplete form element, an IconSearch service, an IconPreview/Twig helper, and consumes
    core's icon_pack + extractor plugin managers. Cases are `recipe` (response-graded) — they probe documented
    facts an agent would otherwise read source to answer; no site mutation.
questions:
- id: ui-icons-declare-pack
  input: On Drupal 11, how do I make a directory of SVG files available as selectable icons with the UI
    Icons module? What file do I create and what are its required keys?
  criteria: Create an EXTENSION_NAME.icons.yml at the module/theme root. Each top-level key is a pack_id
    and must have an `extractor` (e.g. `svg`), a `template` (Twig), and for path/svg/svg_sprite a `config.sources`
    list of glob paths/URLs.
  bundle: ui_icons
  rubric_ref: rubric/ui_icons_ui_icons_declare_pack@1.0
  tags:
  - mode:recipe
- id: ui-icons-extractors
  input: Which icon extractor plugins are available out of the box for a UI Icons icon pack, and where
    are they defined?
  criteria: 'Core provides three extractors: `path`, `svg`, and `svg_sprite`. They are core Icon API plugins
    (#[IconExtractor] attribute), not defined by ui_icons itself; contrib can add more (e.g. the font
    extractor in ui_icons_font).'
  bundle: ui_icons
  rubric_ref: rubric/ui_icons_ui_icons_extractors@1.0
  tags:
  - mode:recipe
- id: ui-icons-form-element
  input: How do I add an icon picker/autocomplete to a custom Drupal form using UI Icons, limited to one
    icon pack?
  criteria: 'Use a render element of ''#type'' => ''icon_autocomplete'' and set ''#allowed_icon_pack''
    => [''my_pack'']. Other props: #default_value (pack_id:icon_id), #result_format (list|grid), #show_settings,
    #return_id.'
  bundle: ui_icons
  rubric_ref: rubric/ui_icons_ui_icons_form_element@1.0
  tags:
  - mode:recipe
- id: ui-icons-value-format
  input: How is an individual icon addressed/identified in UI Icons, e.g. as a form default value?
  criteria: As a combined string `pack_id:icon_id` (e.g. `my_pack:home`). It can be parsed with IconDefinition::getIconDataFromId().
  bundle: ui_icons
  rubric_ref: rubric/ui_icons_ui_icons_value_format@1.0
  tags:
  - mode:recipe
- id: ui-icons-twig
  input: How do I render an icon inline inside a Twig template with UI Icons?
  criteria: Use the Twig function {{ icon_preview(pack_id, icon_id, settings) }} provided by ui_icons.twig_extension.
    Core's {'#type':'icon'} render element is another option.
  bundle: ui_icons
  rubric_ref: rubric/ui_icons_ui_icons_twig@1.0
  tags:
  - mode:recipe
- id: ui-icons-search-service
  input: Which service do I call to search available icons by keyword in code with UI Icons?
  criteria: The `ui_icons.search` service (\Drupal\ui_icons\IconSearch); call ->search($query, $allowed_icon_pack,
    $max_result, $result_callback).
  bundle: ui_icons
  rubric_ref: rubric/ui_icons_ui_icons_search_service@1.0
  tags:
  - mode:recipe
- id: ui-icons-configure
  input: Where is the settings/configuration page for the base UI Icons module?
  criteria: The base ui_icons module has no configuration UI (no `configure` route) and no permissions;
    it only exposes two AJAX routes (autocomplete, preview). Configuration lives in each icon pack's icons.yml
    and in the integration submodules.
  bundle: ui_icons
  rubric_ref: rubric/ui_icons_ui_icons_configure@1.0
  tags:
  - mode:recipe
- id: ui-icons-ckeditor-submodule
  input: I want editors to insert icons into CKEditor 5 rich text. Which UI Icons submodule do I enable?
  criteria: Enable the ui_icons_ckeditor5 submodule (depends on ui_icons and ui_icons_text) and add its
    icon button to the CKEditor 5 toolbar.
  bundle: ui_icons
  rubric_ref: rubric/ui_icons_ui_icons_ckeditor_submodule@1.0
  tags:
  - mode:recipe
- id: ui-icons-font-submodule
  input: How can I define an icon pack based on an icon web font (like Font Awesome) with UI Icons?
  criteria: Enable ui_icons_font, which provides a `font` FontExtractor plugin; reference it as the `extractor`
    in your icons.yml and attach the font CSS via the pack `library` key.
  bundle: ui_icons
  rubric_ref: rubric/ui_icons_ui_icons_font_submodule@1.0
  tags:
  - mode:recipe
