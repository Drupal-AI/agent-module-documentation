metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: ui_patterns_settings
  version: 2.4.x
  note: 'UI Patterns Settings adds typed ''settings'' to ui_patterns components (requires ui_patterns
    + token). Each setting type is a UiPatternsSettingType plugin (Plugin/UiPatterns/SettingType/, manager
    plugin.manager.ui_patterns_settings): built-ins include textfield, select, radios, checkboxes, boolean,
    number, token, url, links, attributes, machine_name, media_library, colorwidget, coloriswidget, enumeration,
    value, group, publish. A second plugin type UiPatternsSettingDataProvider (ids menu, breadcrumb) feeds
    dynamic option lists. The module''s only config object is ui_patterns_settings.settings with a ''mapping''
    key binding {entity--field: ''pattern_id::setting_id''} (written by ConfigManager::addMapping; a setting_id
    of ''variant'' drives the pattern variant). No configure route. Medium/hard cases are grounded in
    that real mapping config: introspection reads mapping entries; execution writes field->setting and
    field->variant bindings, verified against the live ui_patterns_settings.settings config. Baseline
    mapping is empty.'
questions:
- id: ui_patterns_settings-plugin-type
  input: In UI Patterns Settings, how do you add a new kind of configurable setting to UI Patterns components
    (what plugin type), and do you still need hook_preprocess to pass the value to the template?
  criteria: Implement a UiPatternsSettingType plugin (in Plugin/UiPatterns/SettingType/, manager plugin.manager.ui_patterns_settings).
    It renders the form element and normalizes the value, so hook_preprocess is not needed - the setting
    value is passed straight to the Twig template.
  bundle: ui_patterns_settings
  rubric_ref: rubric/ui_patterns_settings_ui_patterns_settings_plugin_type@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: ui_patterns_settings-builtin-types
  input: Name several built-in setting types provided by UI Patterns Settings that I can use as a setting's
    'type' in a pattern definition.
  criteria: Built-in setting type ids include textfield, select, radios, checkboxes, boolean, number,
    token, url, links, attributes, machine_name, media_library, colorwidget, coloriswidget, enumeration,
    value, group, and publish.
  bundle: ui_patterns_settings
  rubric_ref: rubric/ui_patterns_settings_ui_patterns_settings_builtin_types@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: ui_patterns_settings-mapping-config
  input: In UI Patterns Settings, which config object stores the binding between an entity field and a
    pattern setting, and what is the key and value format?
  criteria: 'The config object is ui_patterns_settings.settings, under the ''mapping'' key. Each entry
    maps {entity_type}--{field_name} (the field id with dots replaced by --) to a string "{pattern_id}::{setting_id}",
    e.g. node--field_promo: ''card::title''. Managed by ConfigManager::addMapping().'
  bundle: ui_patterns_settings
  rubric_ref: rubric/ui_patterns_settings_ui_patterns_settings_mapping_config@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: ui_patterns_settings-which-setting
  input: On this site, inspect the UI Patterns Settings configuration and tell me which pattern setting
    the entity field key node--field_promo is bound to.
  criteria: node--field_promo is mapped to card::title (in ui_patterns_settings.settings under mapping),
    i.e. the 'title' setting of the 'card' pattern.
  bundle: ui_patterns_settings
  rubric_ref: rubric/ui_patterns_settings_ui_patterns_settings_which_setting@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/ui_patterns_settings-mapping-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/ui_patterns_settings-mapping-cleanup.sh
- id: ui_patterns_settings-which-variant-field
  input: In this site's UI Patterns Settings mapping, one field is bound to a pattern's variant. Inspect
    the live configuration and tell me which entity field key is mapped to a '::variant' setting.
  criteria: node--field_style is mapped to card::variant in ui_patterns_settings.settings mapping, so
    that field drives the card pattern's variant.
  bundle: ui_patterns_settings
  rubric_ref: rubric/ui_patterns_settings_ui_patterns_settings_which_variant_field@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/ui_patterns_settings-mapping-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/ui_patterns_settings-mapping-cleanup.sh
- id: ui_patterns_settings-add-mapping
  input: Using UI Patterns Settings, configure the live site so that the entity field key node--field_promo
    is bound to the 'title' setting of the 'card' pattern.
  criteria: Add mapping['node--field_promo'] = 'card::title' to the ui_patterns_settings.settings config
    (via ConfigManager::addMapping('node.field_promo', 'card::title') or the config API). \Drupal::config('ui_patterns_settings.settings')->get('mapping')['node--field_promo']
    is then 'card::title'.
  bundle: ui_patterns_settings
  rubric_ref: rubric/ui_patterns_settings_ui_patterns_settings_add_mapping@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/ui_patterns_settings-add-mapping-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/ui_patterns_settings-add-mapping-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/ui_patterns_settings-add-mapping-verify.sh
- id: ui_patterns_settings-add-variant-mapping
  input: Configure UI Patterns Settings on the live site so that the entity field key node--field_variant
    drives the 'card' pattern's variant (the '::variant' setting).
  criteria: Add mapping['node--field_variant'] = 'card::variant' to ui_patterns_settings.settings. Because
    the setting_id is 'variant', ConfigManager::findVariantMappings() treats that field as the pattern
    variant source. \Drupal::config('ui_patterns_settings.settings')->get('mapping')['node--field_variant']
    is then 'card::variant'.
  bundle: ui_patterns_settings
  rubric_ref: rubric/ui_patterns_settings_ui_patterns_settings_add_variant_mapping@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/ui_patterns_settings-variant-mapping-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/ui_patterns_settings-variant-mapping-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/ui_patterns_settings-variant-mapping-verify.sh
