metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: ui_styles_layout_builder
  version: 1.21.x
  note: 'UI Styles Layout Builder adds ui_styles_styles selectors to Layout Builder''s Configure section
    form (section + one per region) and to block-component config. Section styles are stored on the Section
    object third-party settings (ui_styles provider): ''selected''/''extra'' for the section, ''regions''
    map for regions (schema layout_builder.section.third_party.ui_styles). Component styles: SectionComponent
    keys ui_styles_<part> and ui_styles_<part>_extra. Sections live in an entity override or in core.entity_view_display.<...>
    defaults. Classes injected at render by BlockComponentRenderArraySubscriber / EntityViewAlter / PreprocessBlock
    via addClasses(). Medium/hard cases are grounded in a real LB-enabled node.page.default display and
    its first section.'
questions:
- id: ui_styles_lb-targets
  input: With UI Styles Layout Builder, which parts of a Layout Builder layout can I apply UI Styles classes
    to?
  criteria: 'Three targets: the whole section, each region inside a section, and individual block components
    placed in the layout. Selectors are added to Layout Builder''s Configure section form and to block-component
    config forms.'
  bundle: ui_styles_layout_builder
  rubric_ref: rubric/ui_styles_layout_builder_ui_styles_lb_targets@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: ui_styles_lb-section-storage
  input: In UI Styles Layout Builder, where on a Layout Builder Section object are the chosen section
    and region styles stored?
  criteria: 'On the Section''s third-party settings under the ''ui_styles'' provider: ''selected'' and
    ''extra'' for the section, and a ''regions'' map (region name => {selected, extra}) for regions. Schema
    type layout_builder.section.third_party.ui_styles.'
  bundle: ui_styles_layout_builder
  rubric_ref: rubric/ui_styles_layout_builder_ui_styles_lb_section_storage@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: ui_styles_lb-render
  input: How does UI Styles Layout Builder actually add the configured classes to the rendered section,
    region and block markup?
  criteria: At render time it calls StylePluginManager::addClasses() from an event subscriber (BlockComponentRenderArraySubscriber)
    for components and from EntityViewAlter / PreprocessBlock for sections, regions and blocks, injecting
    the classes onto the appropriate render arrays.
  bundle: ui_styles_layout_builder
  rubric_ref: rubric/ui_styles_layout_builder_ui_styles_lb_render@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: ui_styles_lb-known
  input: On this Drupal site, the node 'page' default view display uses Layout Builder and its first section
    has a UI Styles section-level style applied. Inspect the live layout and give the extra CSS class
    on that section.
  criteria: 'The class is ui-styles-eval-lb: in core.entity_view_display.node.page.default the first Layout
    Builder Section has third_party_settings.ui_styles.extra = ''ui-styles-eval-lb''. Load the display,
    get the section, then $section->getThirdPartySetting(''ui_styles'',''extra'').'
  bundle: ui_styles_layout_builder
  rubric_ref: rubric/ui_styles_layout_builder_ui_styles_lb_known@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/ui_styles_layout_builder-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/ui_styles_layout_builder-cleanup.sh
- id: ui_styles_lb-apply
  input: On this Drupal site, the node 'page' default display uses Layout Builder with one section. Using
    UI Styles Layout Builder, apply the CSS class 'ui-styles-eval-lb2' as a section-level style on that
    first section, and save it to the live site.
  criteria: On the first Section of core.entity_view_display.node.page.default set $section->setThirdPartySetting('ui_styles','extra','ui-styles-eval-lb2')
    (or add it via selected), then save the display (or use the Configure section form's UI Styles Extra
    classes field).
  bundle: ui_styles_layout_builder
  rubric_ref: rubric/ui_styles_layout_builder_ui_styles_lb_apply@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
