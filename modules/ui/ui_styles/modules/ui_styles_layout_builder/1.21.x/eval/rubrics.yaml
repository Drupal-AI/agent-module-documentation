rubrics:
- id: ui_styles_layout_builder_ui_styles_lb_targets
  version: '1.0'
  applicable_bundles:
  - ui_styles_layout_builder
  checks:
  - kind: must_contain_any
    values:
    - section
    - region
    - block
  scoring:
    combine: all_pass
- id: ui_styles_layout_builder_ui_styles_lb_section_storage
  version: '1.0'
  applicable_bundles:
  - ui_styles_layout_builder
  checks:
  - kind: must_contain_any
    values:
    - third_party
    - third party
    - ui_styles
    - regions
  scoring:
    combine: all_pass
- id: ui_styles_layout_builder_ui_styles_lb_render
  version: '1.0'
  applicable_bundles:
  - ui_styles_layout_builder
  checks:
  - kind: must_contain_any
    values:
    - addClasses
    - BlockComponentRenderArraySubscriber
    - preprocess
    - render
  scoring:
    combine: all_pass
- id: ui_styles_layout_builder_ui_styles_lb_known
  version: '1.0'
  applicable_bundles:
  - ui_styles_layout_builder
  checks:
  - kind: must_contain_any
    values:
    - ui-styles-eval-lb
  scoring:
    combine: all_pass
- id: ui_styles_layout_builder_ui_styles_lb_apply
  version: '1.0'
  applicable_bundles:
  - ui_styles_layout_builder
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
