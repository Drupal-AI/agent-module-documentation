metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: ui_styles_views
  version: 1.21.x
  note: UI Styles Views registers a Views display extender 'ui_styles' (Plugin\views\display_extender\Styles).
    hook_install appends 'ui_styles' to views.settings display_extenders (hook_uninstall removes it).
    Its options form has three ui_styles_styles selectors stored per display under display_options.display_extenders.ui_styles.{exposed_form_options,
    style_options, pager_options} (each a ui_styles.selected_mapping). preprocess_views_view injects classes
    onto exposed/rows/pager via addClasses(). No route/permission/settings form. Medium/hard cases are
    grounded in the module's real install effect on views.settings.display_extenders.
questions:
- id: ui_styles_views-parts
  input: With UI Styles Views, which three parts of a view can I apply UI Styles classes to?
  criteria: 'Three parts: the exposed (filter) form, the Style/rows (result format), and the pager. They
    map to the display-extender option keys exposed_form_options, style_options and pager_options.'
  bundle: ui_styles_views
  rubric_ref: rubric/ui_styles_views_ui_styles_views_parts@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: ui_styles_views-mechanism
  input: How does UI Styles Views hook into Views, and what does it change in configuration when it is
    installed?
  criteria: It provides a Views display extender plugin with id 'ui_styles'. On install it appends 'ui_styles'
    to views.settings > display_extenders so the extender is available on every view display; uninstall
    removes it.
  bundle: ui_styles_views
  rubric_ref: rubric/ui_styles_views_ui_styles_views_mechanism@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: ui_styles_views-storage
  input: In UI Styles Views, where on a view display are the chosen style classes for the rows/pager/exposed
    form stored?
  criteria: Under the display's display_options.display_extenders.ui_styles, in the keys exposed_form_options,
    style_options and pager_options, each a {selected, extra} mapping.
  bundle: ui_styles_views
  rubric_ref: rubric/ui_styles_views_ui_styles_views_storage@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: ui_styles_views-registered
  input: On this Drupal site, determine whether the UI Styles Views display extender is active for views,
    and name the config object and key that lists it.
  criteria: 'Yes: the display extender ''ui_styles'' is listed in views.settings under display_extenders.
    Read with drush cget views.settings display_extenders.'
  bundle: ui_styles_views
  rubric_ref: rubric/ui_styles_views_ui_styles_views_registered@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/ui_styles_views-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/ui_styles_views-cleanup.sh
- id: ui_styles_views-enable
  input: On this Drupal site, make the UI Styles Views display extender available to all views by enabling
    the correct module. Apply the change to the live site.
  criteria: Enable the ui_styles_views module (drush en ui_styles_views -y). Its hook_install adds 'ui_styles'
    to views.settings > display_extenders, so afterwards that list contains 'ui_styles'.
  bundle: ui_styles_views
  rubric_ref: rubric/ui_styles_views_ui_styles_views_enable@1.0
