metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: ui_styles_block
  version: 1.21.x
  note: UI Styles Block adds three ui_styles_styles selectors (block/title/content) to the block-layout
    config form and stores them on block.block.<id> under third_party_settings.ui_styles.{block,title,content},
    each a ui_styles.selected_mapping {selected, extra}. PreprocessBlock merges the classes onto attributes/title_attributes/content_attributes.
    No routes/permissions/settings form. Medium/hard cases are grounded in a real placed block (ui_styles_eval_block)
    and its third-party settings.
questions:
- id: ui_styles_block-parts
  input: With the UI Styles Block module, which three parts of a placed block can I apply UI Styles classes
    to, and where are those selections stored?
  criteria: 'Three parts: block (wrapper), title, and content. They are stored on the block config entity
    block.block.<id> under third_party_settings.ui_styles.{block,title,content}, each a {selected, extra}
    mapping, and rendered onto attributes / title_attributes / content_attributes.'
  bundle: ui_styles_block
  rubric_ref: rubric/ui_styles_block_ui_styles_block_parts@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: ui_styles_block-where-configure
  input: There is no dedicated settings page for UI Styles Block. Where in the Drupal admin do I actually
    apply UI Styles classes to a specific block?
  criteria: On the block's own configuration form, reached from Structure > Block layout (/admin/structure/block)
    by configuring or placing the block. UI Styles selectors for Block, Title and Content appear on that
    form.
  bundle: ui_styles_block
  rubric_ref: rubric/ui_styles_block_ui_styles_block_where_configure@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: ui_styles_block-render
  input: In UI Styles Block, how do the classes chosen for a block's content actually reach the rendered
    HTML?
  criteria: 'PreprocessBlock (a block preprocess hook) reads the block''s third_party_settings.ui_styles
    and merges each part''s classes onto the corresponding template variable: attributes (block), title_attributes
    (title) and content_attributes (content) using AttributeHelper::mergeCollections.'
  bundle: ui_styles_block
  rubric_ref: rubric/ui_styles_block_ui_styles_block_render@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: ui_styles_block-known
  input: On this Drupal site a placed block with id 'ui_styles_eval_block' has UI Styles applied to its
    content. Inspect the live block configuration and give the extra CSS class applied to its content.
  criteria: 'The class is ui-styles-eval-content: block.block.ui_styles_eval_block has third_party_settings.ui_styles.content.extra
    = ''ui-styles-eval-content''. Read with: drush cget block.block.ui_styles_eval_block third_party_settings.ui_styles'
  bundle: ui_styles_block
  rubric_ref: rubric/ui_styles_block_ui_styles_block_known@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/ui_styles_block-styles-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/ui_styles_block-styles-cleanup.sh
- id: ui_styles_block-apply
  input: 'On this Drupal site there is a placed block with id ''ui_styles_eval_block''. Using UI Styles
    Block, apply the CSS class ''ui-styles-eval-applied'' to that block (any part: block wrapper, title
    or content) and save it to the live site.'
  criteria: Set a ui_styles third-party setting on block.block.ui_styles_eval_block, e.g. $block->setThirdPartySetting('ui_styles',
    'block', ['selected' => [], 'extra' => 'ui-styles-eval-applied'])->save(); (or via the block config
    form's Extra classes field). The class ends up in one of third_party_settings.ui_styles.{block,title,content}.
  bundle: ui_styles_block
  rubric_ref: rubric/ui_styles_block_ui_styles_block_apply@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/ui_styles_block-apply-reset.sh
    verify: agent-module-documentation/evaluation/verify/ui_styles_block-apply-verify.sh
