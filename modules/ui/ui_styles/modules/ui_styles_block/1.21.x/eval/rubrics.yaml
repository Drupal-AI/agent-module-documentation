rubrics:
- id: ui_styles_block_ui_styles_block_parts
  version: '1.0'
  applicable_bundles:
  - ui_styles_block
  checks:
  - kind: must_contain_any
    values:
    - third_party_settings
    - third party settings
    - block.block
    - content_attributes
  scoring:
    combine: all_pass
- id: ui_styles_block_ui_styles_block_where_configure
  version: '1.0'
  applicable_bundles:
  - ui_styles_block
  checks:
  - kind: must_contain_any
    values:
    - Block layout
    - block layout
    - /admin/structure/block
    - configure
  scoring:
    combine: all_pass
- id: ui_styles_block_ui_styles_block_render
  version: '1.0'
  applicable_bundles:
  - ui_styles_block
  checks:
  - kind: must_contain_any
    values:
    - content_attributes
    - preprocess
    - attributes
  scoring:
    combine: all_pass
- id: ui_styles_block_ui_styles_block_known
  version: '1.0'
  applicable_bundles:
  - ui_styles_block
  checks:
  - kind: must_contain_any
    values:
    - ui-styles-eval-content
  scoring:
    combine: all_pass
- id: ui_styles_block_ui_styles_block_apply
  version: '1.0'
  applicable_bundles:
  - ui_styles_block
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
