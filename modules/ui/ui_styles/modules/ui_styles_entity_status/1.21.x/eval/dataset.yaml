metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: ui_styles_entity_status
  version: 1.21.x
  note: 'UI Styles Entity Status applies UI Styles classes to content entities rendered while unpublished.
    Configured via an ''Unpublished entity styles'' selector added to the core theme settings form (FormSystemThemeSettingsAlter);
    stored in <theme>.settings under third_party_settings.ui_styles_entity_status.unpublished (a ui_styles.selected_mapping);
    constant UNPUBLISHED_CLASSES_THEME_SETTING_KEY. EntityView::alter merges classes onto #attributes
    only for EntityPublishedInterface content entities that are not published. No route/permission of
    its own. Medium/hard cases are grounded in the live default-theme settings.'
questions:
- id: ui_styles_entity_status-what
  input: What does the UI Styles Entity Status module let me do, and to which entities does it apply the
    chosen classes?
  criteria: It applies a chosen set of UI Styles CSS classes to any content entity (implementing EntityPublishedInterface)
    that is rendered while UNPUBLISHED, so unpublished content is visually flagged. Published content
    is untouched.
  bundle: ui_styles_entity_status
  rubric_ref: rubric/ui_styles_entity_status_ui_styles_entity_status_what@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: ui_styles_entity_status-where
  input: There is no separate settings page for UI Styles Entity Status. Where do I configure the unpublished
    styling, and where is the value stored?
  criteria: On the theme settings form (Appearance > Settings > your theme, /admin/appearance/settings/{theme})
    it adds an 'Unpublished entity styles' selector. The value is stored in <theme>.settings under third_party_settings.ui_styles_entity_status.unpublished
    as a {selected, extra} mapping.
  bundle: ui_styles_entity_status
  rubric_ref: rubric/ui_styles_entity_status_ui_styles_entity_status_where@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: ui_styles_entity_status-render
  input: Under what exact condition does UI Styles Entity Status add its classes to a rendered entity?
  criteria: EntityView::alter adds the classes to $build['#attributes'] only when the entity is a ContentEntityInterface
    implementing EntityPublishedInterface and isPublished() is FALSE.
  bundle: ui_styles_entity_status
  rubric_ref: rubric/ui_styles_entity_status_ui_styles_entity_status_render@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: ui_styles_entity_status-known
  input: On this Drupal site, UI Styles Entity Status is configured to style unpublished content on the
    default theme. Inspect the live theme settings and give the extra CSS class applied to unpublished
    entities.
  criteria: 'The class is ui-styles-eval-unpub: <default-theme>.settings has third_party_settings.ui_styles_entity_status.unpublished.extra
    = ''ui-styles-eval-unpub''. Read with drush cget olivero.settings third_party_settings.ui_styles_entity_status.unpublished'
  bundle: ui_styles_entity_status
  rubric_ref: rubric/ui_styles_entity_status_ui_styles_entity_status_known@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/ui_styles_entity_status-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/ui_styles_entity_status-cleanup.sh
- id: ui_styles_entity_status-apply
  input: On this Drupal site, use UI Styles Entity Status to make unpublished content on the default theme
    carry the CSS class 'ui-styles-eval-unpub2'. Apply the change to the live site.
  criteria: 'Set <default-theme>.settings third_party_settings.ui_styles_entity_status.unpublished to
    {selected: [], extra: ''ui-styles-eval-unpub2''} (via the theme settings ''Unpublished entity styles''
    Extra classes field, or config), then flush caches.'
  bundle: ui_styles_entity_status
  rubric_ref: rubric/ui_styles_entity_status_ui_styles_entity_status_apply@1.0
