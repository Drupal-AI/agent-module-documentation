rubrics:
- id: ui_styles_ckeditor5_ui_styles_ckeditor5_buttons
  version: '1.0'
  applicable_bundles:
  - ui_styles_ckeditor5
  checks:
  - kind: must_contain_any
    values:
    - block
    - inline
    - UiStylesBlock
    - UiStylesInline
  scoring:
    combine: all_pass
- id: ui_styles_ckeditor5_ui_styles_ckeditor5_configure
  version: '1.0'
  applicable_bundles:
  - ui_styles_ckeditor5
  checks:
  - kind: must_contain_any
    values:
    - enabled_styles
    - text format
    - editor.editor
    - toolbar
  scoring:
    combine: all_pass
- id: ui_styles_ckeditor5_ui_styles_ckeditor5_elements
  version: '1.0'
  applicable_bundles:
  - ui_styles_ckeditor5
  checks:
  - kind: must_contain_any
    values:
    - span
    - class
    - stylesheet
  scoring:
    combine: all_pass
- id: ui_styles_ckeditor5_ui_styles_ckeditor5_known
  version: '1.0'
  applicable_bundles:
  - ui_styles_ckeditor5
  checks:
  - kind: must_contain_any
    values:
    - ui_styles_eval_ckstyle
  scoring:
    combine: all_pass
- id: ui_styles_ckeditor5_ui_styles_ckeditor5_enable
  version: '1.0'
  applicable_bundles:
  - ui_styles_ckeditor5
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
