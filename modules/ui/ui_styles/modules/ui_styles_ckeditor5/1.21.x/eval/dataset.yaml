metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: ui_styles_ckeditor5
  version: 1.21.x
  note: UI Styles CKEditor 5 provides two CKEditor 5 plugins ui_styles_ckeditor5_uiStylesBlock and ui_styles_ckeditor5_uiStylesInline
    (toolbar items UiStylesBlock/UiStylesInline) that apply UI Styles classes to a block element or an
    inline <span>. Which styles a button offers is configured per text format and stored in editor.editor.<format>
    under settings.plugins.ui_styles_ckeditor5_uiStyles{Block,Inline}.enabled_styles (a sequence of style
    plugin ids; schema ui_styles_ckeditor5_ckeditor5_plugin, NotBlank). No route/permission/settings page.
    Medium/hard cases are grounded in the live basic_html editor config.
questions:
- id: ui_styles_ckeditor5-buttons
  input: What does UI Styles CKEditor 5 add to the editor, and what is the difference between its two
    buttons?
  criteria: 'It adds two CKEditor 5 toolbar buttons: UI Styles (block) which applies a class to the current
    block element, and UI Styles (inline) which wraps the selection in a styled <span>. Plugins ui_styles_ckeditor5_uiStylesBlock
    / ...uiStylesInline.'
  bundle: ui_styles_ckeditor5
  rubric_ref: rubric/ui_styles_ckeditor5_ui_styles_ckeditor5_buttons@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: ui_styles_ckeditor5-configure
  input: How do I choose which UI Styles a CKEditor 5 UI Styles button offers, and where is that stored?
  criteria: Add the button to a text format's CKEditor 5 toolbar, then tick the styles in its settings.
    The chosen style plugin ids are stored in editor.editor.<format> under settings.plugins.ui_styles_ckeditor5_uiStyles{Block,Inline}.enabled_styles.
  bundle: ui_styles_ckeditor5
  rubric_ref: rubric/ui_styles_ckeditor5_ui_styles_ckeditor5_configure@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: ui_styles_ckeditor5-elements
  input: What HTML does the UI Styles CKEditor 5 inline button produce, and where do the editor previews
    get their CSS?
  criteria: The inline plugin wraps the selection in a <span> carrying the selected style's CSS class
    (allowed elements include <span> and <$any-html5-element class>). Editor iframe previews use the UI
    Styles stylesheet generator (/ui_styles/stylesheet).
  bundle: ui_styles_ckeditor5
  rubric_ref: rubric/ui_styles_ckeditor5_ui_styles_ckeditor5_elements@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: ui_styles_ckeditor5-known
  input: On this Drupal site, the 'basic_html' text format has a UI Styles CKEditor 5 button configured
    to offer a specific style. Inspect the live editor configuration and give the style id listed in that
    button's enabled_styles.
  criteria: 'The style id is ui_styles_eval_ckstyle: editor.editor.basic_html settings.plugins.ui_styles_ckeditor5_uiStylesInline.enabled_styles
    = [''ui_styles_eval_ckstyle'']. Read with drush cget editor.editor.basic_html settings.plugins.'
  bundle: ui_styles_ckeditor5
  rubric_ref: rubric/ui_styles_ckeditor5_ui_styles_ckeditor5_known@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/ui_styles_ckeditor5-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/ui_styles_ckeditor5-cleanup.sh
- id: ui_styles_ckeditor5-enable
  input: On this Drupal site, configure the 'basic_html' text format so that a UI Styles CKEditor 5 button
    (block or inline) offers the style with id 'ui_styles_eval_ck2'. Apply the change to the live site.
  criteria: On editor.editor.basic_html, add a UI Styles toolbar button (e.g. UiStylesInline) and set
    settings.plugins.ui_styles_ckeditor5_uiStylesInline.enabled_styles to include 'ui_styles_eval_ck2'
    (via the text format's CKEditor 5 settings, or config).
  bundle: ui_styles_ckeditor5
  rubric_ref: rubric/ui_styles_ckeditor5_ui_styles_ckeditor5_enable@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/ui_styles_ckeditor5-enable-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/ui_styles_ckeditor5-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/ui_styles_ckeditor5-enable-verify.sh
