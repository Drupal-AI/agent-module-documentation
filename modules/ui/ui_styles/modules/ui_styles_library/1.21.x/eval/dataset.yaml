metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: ui_styles_library
  version: 1.21.x
  note: 'UI Styles Library exposes a read-only styleguide page at /admin/appearance/ui/styles (route ui_styles_library.overview,
    StylesLibraryController::overview) gated by the module permission access_ui_styles_library. It renders
    getGroupedDefinitions() via theme hook ui_styles_overview_page (ui-styles-overview-page.html.twig)
    with stylesheet-generator-backed previews. It stores no config, so medium/hard cases are grounded
    in the module''s observable effect: enabling it registers the styles library route and permission.
    (Role-based grounding was avoided because this shared site''s group module config makes Role::save()
    throw.)'
questions:
- id: ui_styles_library-route
  input: After enabling UI Styles Library, at what URL do I find the styles library page, and what permission
    controls access to it?
  criteria: The page is at /admin/appearance/ui/styles (route ui_styles_library.overview) and is gated
    by the permission access_ui_styles_library.
  bundle: ui_styles_library
  rubric_ref: rubric/ui_styles_library_ui_styles_library_route@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: ui_styles_library-what
  input: What does the UI Styles Library page display and where does it get the list from?
  criteria: It lists every declared UI Styles style and its options with live previews, acting as a styleguide.
    The controller pulls the list from the style plugin manager via getGroupedDefinitions() and renders
    it with the ui_styles_overview_page theme hook, using the generated stylesheet for previews.
  bundle: ui_styles_library
  rubric_ref: rubric/ui_styles_library_ui_styles_library_what@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: ui_styles_library-config
  input: Does UI Styles Library store any configuration of its own, and where does its menu link appear?
  criteria: It stores no configuration; it is a read-only page. Its menu link appears under Appearance
    > UI libraries (ui_suite.index at /admin/appearance/ui) as the 'Styles' link.
  bundle: ui_styles_library
  rubric_ref: rubric/ui_styles_library_ui_styles_library_config@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: ui_styles_library-available
  input: On this Drupal site, is the UI Styles styles library page available? Inspect the live routing
    and give the route name, its path, and the permission that gates it.
  criteria: 'Yes: route ui_styles_library.overview at path /admin/appearance/ui/styles, gated by the permission
    access_ui_styles_library. Confirm with drush ev to look up the route, or drush role:list for the permission.'
  bundle: ui_styles_library
  rubric_ref: rubric/ui_styles_library_ui_styles_library_available@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/ui_styles_library-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/ui_styles_library-cleanup.sh
- id: ui_styles_library-enable
  input: On this Drupal site, make the UI Styles styles library page (at /admin/appearance/ui/styles)
    available by enabling the correct module. Apply the change to the live site.
  criteria: Enable the ui_styles_library module (drush en ui_styles_library -y). Afterwards the route
    ui_styles_library.overview (path /admin/appearance/ui/styles) is registered and the access_ui_styles_library
    permission exists.
  bundle: ui_styles_library
  rubric_ref: rubric/ui_styles_library_ui_styles_library_enable@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/ui_styles_library-enable-reset.sh
    verify: agent-module-documentation/evaluation/verify/ui_styles_library-enable-verify.sh
