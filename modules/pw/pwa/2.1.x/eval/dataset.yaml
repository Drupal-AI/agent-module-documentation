# Generated from evals.json by evaluation/to_commons.py.
# Edit evals.json and rerun the script; do not edit this file.
metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: pwa
  version: 2.1.x
  note: PWA generates a web app manifest at /manifest.json from the pwa.config config object (name, short_name,
    start_url, display, theme_color, background_color, scope, orientation, icons from file fids, manifest_path_mode/manifest_paths).
    Form at /admin/config/services/pwa/manifest (route pwa.config_manifest, permission administer pwa);
    manifest route pwa.manifest (permission access pwa). Service pwa.manifest::toArray(); hook_pwa_manifest_alter.
    Medium/hard cases are grounded in real pwa.config keys read/written via drush.
questions:
- id: pwa-manifest-path
  input: On a Drupal site using the PWA module, at what URL is the web app manifest served, and which
    config object / admin form configures it?
  criteria: The manifest is served at /manifest.json (route pwa.manifest). It is built from the pwa.config
    config object and edited at /admin/config/services/pwa/manifest (route pwa.config_manifest, permission
    'administer pwa').
  bundle: pwa
  rubric_ref: rubric/pwa_pwa_manifest_path@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: pwa-access-permission
  input: Which permission must a role have so that the PWA manifest link (and the service worker) attach
    to pages for those users?
  criteria: The 'access pwa' permission. pwa_page_attachments() returns early unless the current user
    has 'access pwa'; it should usually be granted to all roles with 'access content'.
  bundle: pwa
  rubric_ref: rubric/pwa_pwa_access_permission@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: pwa-path-rules
  input: How does the PWA module control which pages the manifest link is added to? Name the config keys
    involved.
  criteria: manifest_path_mode (default 'all_except_listed' = add everywhere except the listed patterns;
    the include mode adds only on listed patterns) together with manifest_paths (newline-separated path
    patterns). Empty manifest_paths adds on all pages.
  bundle: pwa
  rubric_ref: rubric/pwa_pwa_path_rules@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: pwa-known-display
  input: On this Drupal site the PWA app's display mode has been changed from its default. Inspect the
    live PWA configuration and state the current display mode.
  criteria: pwa.config display is 'fullscreen' (default is 'standalone'); read with `drush cget pwa.config
    display`.
  bundle: pwa
  rubric_ref: rubric/pwa_pwa_known_display@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/pwa-known-display-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/pwa-known-display-cleanup.sh
- id: pwa-known-theme-color
  input: On this Drupal site the PWA theme color has been customized. Inspect the live PWA configuration
    and state the configured theme_color value.
  criteria: pwa.config theme_color is '#123456' (default '#ffffff'); read with `drush cget pwa.config
    theme_color`.
  bundle: pwa
  rubric_ref: rubric/pwa_pwa_known_theme_color@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/pwa-known-theme-color-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/pwa-known-theme-color-cleanup.sh
- id: pwa-set-name
  input: On this Drupal site, configure the PWA manifest so the web app name is 'My PWA App' and the short
    name is 'MyPWA'. Apply the change to the live site.
  criteria: Set pwa.config name to 'My PWA App' and short_name to 'MyPWA' (e.g. drush cset pwa.config
    name 'My PWA App' -y; drush cset pwa.config short_name MyPWA -y).
  bundle: pwa
  rubric_ref: rubric/pwa_pwa_set_name@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/pwa-set-name-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/pwa-set-name-reset.sh
    verify: agent-module-documentation/evaluation/verify/pwa-set-name-verify.sh
- id: pwa-set-start-url
  input: On this Drupal site, configure the PWA manifest so the installed app launches at '/home' (set
    the manifest start_url to /home). Apply the change to the live site.
  criteria: Set pwa.config start_url to '/home' (e.g. drush cset pwa.config start_url /home -y).
  bundle: pwa
  rubric_ref: rubric/pwa_pwa_set_start_url@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/pwa-set-start-url-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/pwa-set-start-url-reset.sh
    verify: agent-module-documentation/evaluation/verify/pwa-set-start-url-verify.sh
