metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: pwa_extras
  version: 2.1.x
  note: 'pwa_extras injects Apple/iOS PWA tags from the config object pwa_extras.settings.apple (touch_icons,
    mask_color default #0678be, meta_tags, color_select in {default,black,black_translucent}, home_screen_icons).
    Form at /admin/config/pwa/pwa_extras (route pwa_extras.settings, permission administer pwa). Depends
    on pwa. Medium/hard cases are grounded in real pwa_extras.settings.apple config keys read/written
    via drush.'
questions:
- id: pwa_extras-what
  input: What does the pwa_extras module add to a Drupal PWA, and in which config object are its settings
    stored?
  criteria: It adds Apple/iOS-specific PWA metadata (apple-touch-icons, status-bar style, pinned-tab mask
    color, home-screen splash icons). Settings are stored in the pwa_extras.settings.apple config object.
  bundle: pwa_extras
  rubric_ref: rubric/pwa_extras_pwa_extras_what@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: pwa_extras-form
  input: At what admin path is the PWA Extras settings form, and which permission controls it?
  criteria: The form is at /admin/config/pwa/pwa_extras (route pwa_extras.settings); it uses the base
    module's 'administer pwa' permission (pwa_extras defines no permissions of its own).
  bundle: pwa_extras
  rubric_ref: rubric/pwa_extras_pwa_extras_form@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: pwa_extras-mask-color
  input: Which pwa_extras setting controls the color of the Safari pinned-tab (mask) icon, and what is
    its default value?
  criteria: 'The ''mask_color'' setting in pwa_extras.settings.apple; its default is #0678be.'
  bundle: pwa_extras
  rubric_ref: rubric/pwa_extras_pwa_extras_mask_color@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: pwa_extras-known-mask
  input: On this Drupal site the PWA Extras pinned-tab mask icon color has been customized. Inspect the
    live configuration and state the current mask_color value.
  criteria: 'pwa_extras.settings.apple mask_color is ''#abcdef'' (default #0678be); read with `drush cget
    pwa_extras.settings.apple mask_color`.'
  bundle: pwa_extras
  rubric_ref: rubric/pwa_extras_pwa_extras_known_mask@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/pwa_extras-known-mask-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/pwa_extras-known-mask-cleanup.sh
- id: pwa_extras-known-statusbar
  input: On this Drupal site the PWA Extras iOS status-bar style has been changed from its default. Inspect
    the live configuration and state the current color_select value.
  criteria: pwa_extras.settings.apple color_select is 'black' (default 'default'); read with `drush cget
    pwa_extras.settings.apple color_select`.
  bundle: pwa_extras
  rubric_ref: rubric/pwa_extras_pwa_extras_known_statusbar@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/pwa_extras-known-statusbar-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/pwa_extras-known-statusbar-cleanup.sh
- id: pwa_extras-set-mask
  input: On this Drupal site, configure PWA Extras so the Safari pinned-tab mask icon color is '#ff0000'.
    Apply the change to the live site.
  criteria: Set pwa_extras.settings.apple mask_color to '#ff0000' (e.g. drush cset pwa_extras.settings.apple
    mask_color '#ff0000' -y).
  bundle: pwa_extras
  rubric_ref: rubric/pwa_extras_pwa_extras_set_mask@1.0
