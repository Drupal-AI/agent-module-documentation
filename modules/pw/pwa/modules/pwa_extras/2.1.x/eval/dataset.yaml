  input: On this Drupal site, configure PWA Extras so the iOS status-bar style is set to black-translucent
    (the color_select value 'black_translucent'). Apply the change to the live site.
  criteria: Set pwa_extras.settings.apple color_select to 'black_translucent' (e.g. drush cset pwa_extras.settings.apple
