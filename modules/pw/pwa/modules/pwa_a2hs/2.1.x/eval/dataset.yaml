metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: pwa_a2hs
  version: 2.1.x
  note: pwa_a2hs adds one block plugin, pwa_add_to_home_screen, with settings button_text (default 'Install
    app') and intro_text (formatted text); it attaches pwa_a2hs/pwa_a2hs_prompt JS and passes button_text
    via drupalSettings.pwaA2hs. Depends on pwa. Medium/hard cases are grounded in real block config entities
    (block.block.*) placing the pwa_add_to_home_screen plugin in the default theme's content region, namespaced
    'pwa_a2hs_'.
questions:
- id: pwa_a2hs-block-id
  input: Which block does the pwa_a2hs module provide, what is its plugin id, and what does it do?
  criteria: It provides the pwa_add_to_home_screen block (admin label 'PWA Add to Home Screen', category
    PWA) which renders intro text and an install button that triggers the browser's add-to-home-screen
    prompt.
  bundle: pwa_a2hs
  rubric_ref: rubric/pwa_a2hs_pwa_a2hs_block_id@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: pwa_a2hs-button-setting
  input: In the pwa_a2hs Add to Home Screen block, which setting controls the install button label and
    what is its default value?
  criteria: The block setting 'button_text' controls the button label; its default is 'Install app' (from
    defaultConfiguration()).
  bundle: pwa_a2hs
  rubric_ref: rubric/pwa_a2hs_pwa_a2hs_button_setting@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: pwa_a2hs-dependency
  input: What module does pwa_a2hs depend on, and how is the Add to Home Screen prompt shown to users?
  criteria: It depends on the pwa module. You place the pwa_add_to_home_screen block in a region; the
    block attaches JS (pwa_a2hs/pwa_a2hs_prompt) that hooks the browser install prompt so its button triggers
    add-to-home-screen.
  bundle: pwa_a2hs
  rubric_ref: rubric/pwa_a2hs_pwa_a2hs_dependency@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: pwa_a2hs-known-button
  input: On this Drupal site a PWA Add to Home Screen block has been placed with a custom button label.
    Inspect the live block configuration and state the button text it uses.
  criteria: The placed pwa_add_to_home_screen block's button_text is 'Get the App' (read block.block.pwa_a2hs_probe
    settings.button_text).
  bundle: pwa_a2hs
  rubric_ref: rubric/pwa_a2hs_pwa_a2hs_known_button@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/pwa_a2hs-known-button-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/pwa_a2hs-known-button-cleanup.sh
- id: pwa_a2hs-which-block
  input: On this Drupal site, which block config entity places the PWA Add to Home Screen block? Inspect
    the live site and give the block's machine id.
  criteria: The block config entity id is pwa_a2hs_named (a block.block.* entity whose plugin is pwa_add_to_home_screen).
  bundle: pwa_a2hs
  rubric_ref: rubric/pwa_a2hs_pwa_a2hs_which_block@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/pwa_a2hs-which-block-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/pwa_a2hs-which-block-cleanup.sh
- id: pwa_a2hs-place-block
  input: On this Drupal site, place a PWA Add to Home Screen block (id 'pwa_a2hs_task') in the default
    theme's content region with the button label set to 'Install now'. Apply the change to the live site.
  criteria: Create a block config entity id 'pwa_a2hs_task' with plugin 'pwa_add_to_home_screen' in the
    default theme, region 'content', settings.button_text 'Install now' (e.g. Block::create([...])->save()).
  bundle: pwa_a2hs
  rubric_ref: rubric/pwa_a2hs_pwa_a2hs_place_block@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/pwa_a2hs-place-block-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/pwa_a2hs-place-block-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/pwa_a2hs-place-block-verify.sh
- id: pwa_a2hs-change-button
  input: On this Drupal site there is a PWA Add to Home Screen block with id 'pwa_a2hs_switch' whose button
    currently reads 'Install app'. Change its button text to 'Add to phone'. Apply the change to the live
    site.
  criteria: Set the button_text setting of block.block.pwa_a2hs_switch to 'Add to phone' and save (e.g.
    $b = Block::load('pwa_a2hs_switch'); $s = $b->get('settings'); $s['button_text']='Add to phone'; $b->set('settings',$s)->save()).
  bundle: pwa_a2hs
  rubric_ref: rubric/pwa_a2hs_pwa_a2hs_change_button@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/pwa_a2hs-change-button-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/pwa_a2hs-change-button-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/pwa_a2hs-change-button-verify.sh
