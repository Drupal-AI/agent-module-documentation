rubrics:
- id: pwa_a2hs_pwa_a2hs_block_id
  version: '1.0'
  applicable_bundles:
  - pwa_a2hs
  checks:
  - kind: must_contain_any
    values:
    - pwa_add_to_home_screen
    - Add to Home Screen
  scoring:
    combine: all_pass
- id: pwa_a2hs_pwa_a2hs_button_setting
  version: '1.0'
  applicable_bundles:
  - pwa_a2hs
  checks:
  - kind: must_contain_any
    values:
    - button_text
    - Install app
  scoring:
    combine: all_pass
- id: pwa_a2hs_pwa_a2hs_dependency
  version: '1.0'
  applicable_bundles:
  - pwa_a2hs
  checks:
  - kind: must_contain_any
    values:
    - pwa
    - block
    - home screen
  scoring:
    combine: all_pass
- id: pwa_a2hs_pwa_a2hs_known_button
  version: '1.0'
  applicable_bundles:
  - pwa_a2hs
  checks:
  - kind: must_contain_any
    values:
    - Get the App
  scoring:
    combine: all_pass
- id: pwa_a2hs_pwa_a2hs_which_block
  version: '1.0'
  applicable_bundles:
  - pwa_a2hs
  checks:
  - kind: must_contain_any
    values:
    - pwa_a2hs_named
  scoring:
    combine: all_pass
- id: pwa_a2hs_pwa_a2hs_place_block
  version: '1.0'
  applicable_bundles:
  - pwa_a2hs
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
- id: pwa_a2hs_pwa_a2hs_change_button
  version: '1.0'
  applicable_bundles:
  - pwa_a2hs
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
