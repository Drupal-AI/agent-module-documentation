rubrics:
- id: handy_cache_tags_handy_cache_tags_tag_format
  version: '1.0'
  applicable_bundles:
  - handy_cache_tags
  checks:
  - kind: must_contain_any
    values:
    - handy_cache_tags:node
    - handy_cache_tags:node:article
  scoring:
    combine: all_pass
- id: handy_cache_tags_handy_cache_tags_service
  version: '1.0'
  applicable_bundles:
  - handy_cache_tags
  checks:
  - kind: must_contain_any
    values:
    - handy_cache_tags.manager
    - getBundleTag
    - getTag
    - getEntityTags
  scoring:
    combine: all_pass
- id: handy_cache_tags_handy_cache_tags_auto_invalidate
  version: '1.0'
  applicable_bundles:
  - handy_cache_tags
  checks:
  - kind: must_contain_any
    values:
    - insert
    - update
    - delete
    - created
    - saved
    - hook_entity
  scoring:
    combine: all_pass
- id: handy_cache_tags_handy_cache_tags_known_bundle
  version: '1.0'
  applicable_bundles:
  - handy_cache_tags
  checks:
  - kind: must_contain_any
    values:
    - handy_cache_tags:node:hct_probe
  scoring:
    combine: all_pass
- id: handy_cache_tags_handy_cache_tags_invalidate
  version: '1.0'
  applicable_bundles:
  - handy_cache_tags
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
- id: handy_cache_tags_handy_cache_tags_known_bundle2
  version: '1.0'
