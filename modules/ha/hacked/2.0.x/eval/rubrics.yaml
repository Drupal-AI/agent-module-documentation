rubrics:
- id: hacked_hacked_what_it_does
  version: '1.0'
  applicable_bundles:
  - hacked
  checks:
  - kind: must_contain_any
    values:
    - /admin/reports/hacked
    - changed
    - official release
    - modified
  scoring:
    combine: all_pass
- id: hacked_hacked_drush
  version: '1.0'
  applicable_bundles:
  - hacked
  checks:
  - kind: must_contain_any
    values:
    - hacked:list-projects
    - hlp
  scoring:
    combine: all_pass
- id: hacked_hacked_hasher_setting
  version: '1.0'
  applicable_bundles:
  - hacked
  checks:
  - kind: must_contain_any
    values:
    - selected_file_hasher
    - hacked_ignore_line_endings
    - hacked_include_line_endings
  scoring:
    combine: all_pass
- id: hacked_hacked_current_hasher
  version: '1.0'
  applicable_bundles:
  - hacked
  checks:
  - kind: must_contain_any
    values:
    - hacked_include_line_endings
  scoring:
    combine: all_pass
- id: hacked_hacked_diffperm_role
  version: '1.0'
  applicable_bundles:
  - hacked
  checks:
  - kind: must_contain_any
    values:
    - hacked_auditor
  scoring:
    combine: all_pass
- id: hacked_hacked_set_hasher
  version: '1.0'
  applicable_bundles:
  - hacked
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
- id: hacked_hacked_grant_diffperm
  version: '1.0'
  applicable_bundles:
  - hacked
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
