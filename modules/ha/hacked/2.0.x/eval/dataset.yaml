metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: hacked
  version: 2.0.x
  note: Hacked! detects whether Drupal core/contrib has been changed from its official release by re-downloading
    each release and comparing file hashes; report at /admin/reports/hacked and via Drush (hacked:list-projects/hlp,
    hacked:details/hd, hacked:diff). Its only config is hacked.settings:selected_file_hasher (hacked_ignore_line_endings
    default, or hacked_include_line_endings), chosen at /admin/reports/hacked/settings. It defines the
    restricted permission 'view diffs of changed files' and reuses core 'administer site configuration'
    for the report. Depends on core update module. Medium cases read back the configured hasher and which
    role holds the diff permission; hard cases switch the hasher and grant the diff permission, verified
    against live config. Cases avoid the network-bound report itself.
questions:
- id: hacked-what-it-does
  input: What does the Drupal 'Hacked!' module do, and where does it show its results in the admin UI?
  criteria: It reports whether Drupal core or any contrib project has been changed from its official packaged
    release, by downloading each release and comparing file hashes. Results appear at /admin/reports/hacked
    (statuses Unchanged/Changed/Unchecked). It only reports drift; it does not revert code.
  bundle: hacked
  rubric_ref: rubric/hacked_hacked_what_it_does@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: hacked-drush
  input: Which Drush command lists all projects Hacked! can analyse along with whether each has been changed,
    and what is its short alias?
  criteria: 'drush hacked:list-projects (alias hlp) prints a table of every project with its version and
    status (Unchanged/Changed/Unchecked) plus changed/deleted file counts; --force-rebuild bypasses the
    cache. Related: hacked:details (hd) and hacked:diff.'
  bundle: hacked
  rubric_ref: rubric/hacked_hacked_drush@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: hacked-hasher-setting
  input: Hacked! can ignore or include line-ending differences when comparing files. Which config object/key
    controls the file hasher, and what are the two values?
  criteria: Config hacked.settings key selected_file_hasher, either hacked_ignore_line_endings (default,
    ignores newline differences) or hacked_include_line_endings; set on /admin/reports/hacked/settings.
  bundle: hacked
  rubric_ref: rubric/hacked_hacked_hasher_setting@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: hacked-current-hasher
  input: Which file hasher is Hacked! currently configured to use on this site? Inspect the live configuration
    and give its machine name.
  criteria: It is hacked_include_line_endings (config hacked.settings key selected_file_hasher).
  bundle: hacked
  rubric_ref: rubric/hacked_hacked_current_hasher@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/hacked-hasher-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/hacked-hasher-cleanup.sh
- id: hacked-diffperm-role
  input: On this site, one custom role has been granted Hacked!'s permission to view diffs of changed
    files. Inspect the live role configuration and give that role's machine name.
  criteria: 'The role is hacked_auditor: its role config includes the ''view diffs of changed files''
    permission.'
  bundle: hacked
  rubric_ref: rubric/hacked_hacked_diffperm_role@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/hacked-diffperm-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/hacked-diffperm-cleanup.sh
- id: hacked-set-hasher
  input: On this Drupal site, configure Hacked! so that its file comparison includes (does not ignore)
    line-ending differences. Apply the change to the live site.
  criteria: config hacked.settings selected_file_hasher is set to hacked_include_line_endings, e.g. drush
    cset hacked.settings selected_file_hasher hacked_include_line_endings, or the 'Include line endings'
    radio on /admin/reports/hacked/settings.
  bundle: hacked
  rubric_ref: rubric/hacked_hacked_set_hasher@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/hacked-set-hasher-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/hacked-set-hasher-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/hacked-set-hasher-verify.sh
- id: hacked-grant-diffperm
  input: I have a role called hacked_diff_role on my Drupal site. I want people in it to be able to view
    the file diffs that the Hacked! module produces. Grant that ability on the live site.
  criteria: Role hacked_diff_role is granted the 'view diffs of changed files' permission (e.g. drush
    role:perm:add hacked_diff_role 'view diffs of changed files'). Note viewing the diff pages also needs
    the diff module and administer site configuration to reach the report.
  bundle: hacked
  rubric_ref: rubric/hacked_hacked_grant_diffperm@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: site-owner
    reset: agent-module-documentation/evaluation/verify/hacked-grantdiff-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/hacked-grantdiff-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/hacked-grantdiff-verify.sh
