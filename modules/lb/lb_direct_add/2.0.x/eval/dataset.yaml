metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: lb_direct_add
  version: 2.0.x
  note: 'Layout Builder Direct Add replaces the Layout Builder ''Add block'' link with a dropbutton (or
    popover) of inline block types via hook_element_info_alter() adding LayoutBuilder::preRender to the
    layout_builder element. Its only persistent state is the config object lb_direct_add.settings with
    two keys: use_label (0 = dropbutton, 1 = popover menu) and label (popover trigger text, default ''Add
    block''). Shipped defaults: use_label=0, label=''Add block''. Medium/hard cases read/write those keys
    (fast, deterministic). Two permissions exist (administer layout builder direct add settings; access
    layout builder direct add more options). Note: info.yml declares configure route lb_direct_add.settings
    but the real route is lb_direct_add.settings_form at /admin/config/content/layout-builder-direct-add.'
questions:
- id: lbda-switch-popover
  input: With the lb_direct_add (Layout Builder Direct Add) module enabled, how do I change the Add-block
    widget from a dropbutton to a popover menu with a custom trigger label, and which config keys control
    that?
  criteria: 'Edit config lb_direct_add.settings: set use_label to 1 for the popover menu (0 = dropbutton)
    and set label to the trigger text. Reachable on the settings form at /admin/config/content/layout-builder-direct-add
    (route lb_direct_add.settings_form).'
  bundle: lb_direct_add
  rubric_ref: rubric/lb_direct_add_lbda_switch_popover@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: lbda-what-it-does
  input: What does lb_direct_add change about the Layout Builder 'Add block' experience, and how is the
    original block chooser still reachable?
  criteria: It replaces the single 'Add block' link in each region with a dropbutton (or popover) listing
    the inline/custom block types so you can add one in a click. A permission-gated 'More...' link falls
    back to the core layout_builder.choose_block off-canvas chooser.
  bundle: lb_direct_add
  rubric_ref: rubric/lb_direct_add_lbda_what_it_does@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: lbda-more-permission
  input: In lb_direct_add, which permission controls whether an editor sees the 'More...' link to the
    full block chooser, and what happens to editors who lack it?
  criteria: The permission 'access layout builder direct add more options'. Editors without it still get
    the direct-add dropbutton/popover of inline block types but do not see the 'More...' fallback link
    to the core block chooser.
  bundle: lb_direct_add
  rubric_ref: rubric/lb_direct_add_lbda_more_permission@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: lbda-active-style
  input: On this Drupal site, how is the Layout Builder Direct Add widget currently configured to display
    - as a dropbutton or a popover menu? Inspect the live configuration to answer.
  criteria: 'It is configured as a popover menu: lb_direct_add.settings:use_label is 1 (0 would be the
    dropbutton), with label ''Add content''.'
  bundle: lb_direct_add
  rubric_ref: rubric/lb_direct_add_lbda_active_style@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/lb_direct_add-popover-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/lb_direct_add-popover-cleanup.sh
- id: lbda-trigger-label
  input: The Layout Builder Direct Add widget on this site is set to popover mode. Inspect the live configuration
    and report the exact trigger label text an editor clicks to reveal the block list.
  criteria: The trigger label is 'Insert block' (lb_direct_add.settings:label = 'Insert block', with use_label
    = 1).
  bundle: lb_direct_add
  rubric_ref: rubric/lb_direct_add_lbda_trigger_label@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/lb_direct_add-label-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/lb_direct_add-label-cleanup.sh
- id: lbda-set-popover
  input: On this Drupal site, configure Layout Builder Direct Add to display as a popover menu whose trigger
    label is exactly 'Add widget'. Apply the change to the live site.
  criteria: Set lb_direct_add.settings:use_label to 1 and label to 'Add widget' (e.g. drush cset lb_direct_add.settings
    use_label 1; drush cset lb_direct_add.settings label 'Add widget', or via the settings form / configFactory).
  bundle: lb_direct_add
  rubric_ref: rubric/lb_direct_add_lbda_set_popover@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/lb_direct_add-set-popover-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/lb_direct_add-popover-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/lb_direct_add-set-popover-verify.sh
- id: lbda-set-dropbutton
  input: The Layout Builder 'add block' control on this site is currently showing as a popover menu. Change
    it back so it shows as the standard dropbutton instead. Apply the change to the live site.
  criteria: Set lb_direct_add.settings:use_label to 0 (the dropbutton display). drush cset lb_direct_add.settings
    use_label 0, or via the settings form.
  bundle: lb_direct_add
  rubric_ref: rubric/lb_direct_add_lbda_set_dropbutton@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: site-owner
    reset: agent-module-documentation/evaluation/verify/lb_direct_add-set-dropbutton-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/lb_direct_add-popover-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/lb_direct_add-set-dropbutton-verify.sh
