metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: lb_copy_section
  version: 1.0.x
  note: 'Copy Layout Builder section adds Copy/Paste links to Layout Builder sections; it deep-clones
    the section (new component UUIDs, duplicated inline block_content + paragraphs) via a private tempstore
    buffer (collection lb_copy_section, key copied_section). No settings/schema/plugins/Drush; its only
    persistent surface is the single permission ''copy paste sections'' (lb_copy_section.permissions.yml),
    which gates both the links (CopySectionRender::preRender) and the routes lb_copy_section.copy / lb_copy_section.paste.
    Depends on layout_builder. Copy/paste itself is user-interactive over AJAX and not scriptable in a
    stable verify, so medium/hard cases are grounded in the permission: medium seeds roles and the agent
    reads which role has the permission; hard has the agent grant the permission / create a role with
    it, verified via Role::hasPermission. All roles namespaced lbcs_*.'
questions:
- id: lb_copy_section-permission
  input: I installed the lb_copy_section (Copy Layout Builder section) module but editors don't see any
    Copy/Paste links in Layout Builder. What permission do I need to grant, and what is its machine name?
  criteria: Grant the 'copy paste sections' permission (label 'Copy/paste sections') to the editor role.
    It is the module's only permission and gates both the Copy/Paste links and the copy/paste routes.
    There is no other configuration.
  bundle: lb_copy_section
  rubric_ref: rubric/lb_copy_section_lb_copy_section_permission@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: lb_copy_section-what-duplicated
  input: When I paste a Layout Builder section copied with lb_copy_section, is the pasted section's inline
    (custom) block the same entity as the original, or a new independent one? How does the module handle
    that?
  criteria: 'It becomes a new, independent copy. The paste path deep-clones the section (DeepCloningTrait):
    every SectionComponent gets a new UUID and each InlineBlock''s referenced block_content entity is
    createDuplicate()d (recursively, including referenced paragraphs), stored back as block_serialized,
    so the pasted inline block is a separate entity from the original.'
  bundle: lb_copy_section
  rubric_ref: rubric/lb_copy_section_lb_copy_section_what_duplicated@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: lb_copy_section-where-buffer
  input: In the lb_copy_section module, where is a copied Layout Builder section stored between clicking
    Copy and Paste, and does that let you paste onto a different page?
  criteria: The copied Section is stored in the current user's private tempstore (collection 'lb_copy_section',
    key 'copied_section'). Because the buffer is per-user and not tied to a page, you can paste the copied
    section onto any other page you edit in the same session. Requires the layout_builder module.
  bundle: lb_copy_section
  rubric_ref: rubric/lb_copy_section_lb_copy_section_where_buffer@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: lb_copy_section-which-role
  input: On this Drupal site, which non-administrator role has been given the ability to copy and paste
    Layout Builder sections (the lb_copy_section feature)? Inspect the live roles/permissions to answer.
  criteria: The lbcs_editor role has the 'copy paste sections' permission (user.role.lbcs_editor lists
    it), so its members see the Copy/Paste links. (The administrator role also has it implicitly as a
    superuser.)
  bundle: lb_copy_section
  rubric_ref: rubric/lb_copy_section_lb_copy_section_which_role@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/lb_copy_section-which-role-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/lb_copy_section-which-role-cleanup.sh
- id: lb_copy_section-two-roles
  input: This site has two custom roles, lbcs_can and lbcs_cannot. Exactly one of them can copy/paste
    Layout Builder sections via lb_copy_section. Inspect the live permission configuration and state which
    role has that ability.
  criteria: lbcs_can has the 'copy paste sections' permission; lbcs_cannot does not. So only lbcs_can
    members get the Copy/Paste links.
  bundle: lb_copy_section
  rubric_ref: rubric/lb_copy_section_lb_copy_section_two_roles@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/lb_copy_section-two-roles-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/lb_copy_section-two-roles-cleanup.sh
- id: lb_copy_section-grant
  input: This site has a role 'lbcs_grant' that cannot yet copy/paste Layout Builder sections. Using the
    lb_copy_section module's permission, grant that role the ability to copy and paste sections, and apply
    the change to the live site.
  criteria: Grant the 'copy paste sections' permission to the lbcs_grant role (e.g. drush role:perm:add
    lbcs_grant 'copy paste sections', or Role::load('lbcs_grant')->grantPermission('copy paste sections')->save()).
    Role::hasPermission('copy paste sections') then returns TRUE.
  bundle: lb_copy_section
  rubric_ref: rubric/lb_copy_section_lb_copy_section_grant@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/lb_copy_section-grant-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/lb_copy_section-grant-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/lb_copy_section-grant-verify.sh
- id: lb_copy_section-create-role
  input: Create a new user role with the machine name 'lbcs_paster' and give it exactly the ability to
    copy and paste Layout Builder sections provided by the lb_copy_section module. Apply the change to
    the live site.
  criteria: Create the role lbcs_paster and grant it the 'copy paste sections' permission (Role::create(['id'=>'lbcs_paster','label'=>'...'])->grantPermission('copy
    paste sections')->save()). The role then exists and hasPermission('copy paste sections') is TRUE.
  bundle: lb_copy_section
  rubric_ref: rubric/lb_copy_section_lb_copy_section_create_role@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/lb_copy_section-create-role-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/lb_copy_section-create-role-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/lb_copy_section-create-role-verify.sh
