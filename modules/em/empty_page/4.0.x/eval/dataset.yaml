    and state its page title.
  criteria: The page title for the callback at ep-title-path is 'EP Title Page' (in empty_page.settings).
  bundle: empty_page
  rubric_ref: rubric/empty_page_empty_page_known_title@1.0
  tags:
  - mode:introspection
