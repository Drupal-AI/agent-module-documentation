metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: empty_page
  version: 4.0.x
  note: Empty Page creates blank menu callbacks (dynamic routes rendering an empty page with an optional
    title) for block-built or blanked-out pages. Admin at /admin/structure/empty-page (route empty_page.administration,
    perm 'administer empty pages'). Each callback stored in config empty_page.settings as callback_<cid>
    = {cid, path, page_title, created, updated} plus a new_id counter; EmptyPages::routes (route_callbacks)
    registers a dynamic route empty_page.page_<cid> per callback, gated by 'view empty pages'. Saving
    a callback rebuilds the router. Medium/hard cases are grounded in empty_page.settings; reset/cleanup
    restore the shipped baseline (new_id:1, no callbacks).
questions:
- id: empty_page-purpose
  input: What is the Drupal empty_page module for, and where do you manage its callbacks (admin path /
    route)?
  criteria: empty_page creates blank menu callbacks (routes that render an empty page with an optional
    title), useful for pages built entirely from blocks or to blank out a path. You manage callbacks at
    /admin/structure/empty-page (route empty_page.administration).
  bundle: empty_page
  rubric_ref: rubric/empty_page_empty_page_purpose@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: empty_page-config
  input: In empty_page, where is each callback stored and what fields does a callback record hold? What
    dynamic route name is generated per callback?
  criteria: Each callback is stored in the config object empty_page.settings as a callback_<cid> entry
    {cid, path, page_title, created, updated}, alongside a new_id counter. EmptyPages::routes registers
    a dynamic route empty_page.page_<cid> at the callback's path.
  bundle: empty_page
  rubric_ref: rubric/empty_page_empty_page_config@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: empty_page-permissions
  input: Which permissions does empty_page define, and what does each gate?
  criteria: '''administer empty pages'' gates the admin screens (add/edit/delete callbacks); ''view empty
    pages'' gates viewing the generated empty pages (each empty_page.page_<cid> route requires it).'
  bundle: empty_page
  rubric_ref: rubric/empty_page_empty_page_permissions@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: empty_page-known-path
  input: On this Drupal site an Empty Page callback has been configured. Inspect the live empty_page configuration
    and state the internal path it serves.
  criteria: The callback's internal path is 'ep-eval-path' (empty_page.settings callback_991 with path
    ep-eval-path, title 'EP Eval').
  bundle: empty_page
  rubric_ref: rubric/empty_page_empty_page_known_path@1.0
  tags:
