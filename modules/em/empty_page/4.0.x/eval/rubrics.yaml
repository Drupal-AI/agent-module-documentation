rubrics:
- id: empty_page_empty_page_purpose
  version: '1.0'
  applicable_bundles:
  - empty_page
  checks:
  - kind: must_contain_any
    values:
    - /admin/structure/empty-page
    - empty_page.administration
    - blocks
  scoring:
    combine: all_pass
- id: empty_page_empty_page_config
  version: '1.0'
  applicable_bundles:
  - empty_page
  checks:
  - kind: must_contain_any
    values:
    - empty_page.settings
    - callback_
    - empty_page.page_
  scoring:
    combine: all_pass
- id: empty_page_empty_page_permissions
  version: '1.0'
  applicable_bundles:
  - empty_page
  checks:
  - kind: must_contain_any
    values:
    - administer empty pages
    - view empty pages
  scoring:
    combine: all_pass
- id: empty_page_empty_page_known_path
  version: '1.0'
  applicable_bundles:
  - empty_page
  checks:
  - kind: must_contain_any
    values:
    - ep-eval-path
  scoring:
    combine: all_pass
- id: empty_page_empty_page_known_title
  version: '1.0'
  applicable_bundles:
  - empty_page
  checks:
  - kind: must_contain_any
    values:
    - EP Title Page
  scoring:
    combine: all_pass
- id: empty_page_empty_page_create
  version: '1.0'
  applicable_bundles:
  - empty_page
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
- id: empty_page_empty_page_create_titled
  version: '1.0'
  applicable_bundles:
  - empty_page
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
