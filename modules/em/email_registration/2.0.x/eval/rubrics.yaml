rubrics:
- id: email_registration_email_registration_login_by_email
  version: '1.0'
  applicable_bundles:
  - email_registration
  checks:
  - kind: must_contain_any
    values:
    - login_with_username
    - email_registration.settings
  scoring:
    combine: all_pass
- id: email_registration_email_registration_username_pattern
  version: '1.0'
  applicable_bundles:
  - email_registration
  checks:
  - kind: must_contain_any
    values:
    - strip_mail_and_cleanup
    - before the @
    - part of the email
    - local part
  scoring:
    combine: all_pass
- id: email_registration_email_registration_customize_username_hook
  version: '1.0'
  applicable_bundles:
  - email_registration
  checks:
  - kind: must_contain_any
    values:
    - hook_email_registration_name_alter
    - email_registration_name_alter
  scoring:
    combine: all_pass
- id: email_registration_email_registration_generator_service
  version: '1.0'
  applicable_bundles:
  - email_registration
  checks:
  - kind: must_contain_any
    values:
    - email_registration.username_generator
    - UsernameGenerator
    - generateRandomUsername
  scoring:
    combine: all_pass
- id: email_registration_email_registration_bulk_action
  version: '1.0'
  applicable_bundles:
  - email_registration
  checks:
  - kind: must_contain_any
    values:
    - Update username
    - email_registration_update_username
  scoring:
    combine: all_pass
- id: email_registration_email_registration_configure_route
  version: '1.0'
  applicable_bundles:
  - email_registration
  checks:
  - kind: must_contain_any
    values:
    - entity.user.admin_form
    - /admin/config/people/accounts
    - Account settings
  scoring:
    combine: all_pass
- id: email_registration_email_registration_hidden_username_field
  version: '1.0'
  applicable_bundles:
  - email_registration
  checks:
  - kind: must_contain_any
    values:
    - change own username
    - administer users
  scoring:
    combine: all_pass
