metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: email_registration_username
  version: 2.0.x
  note: 'Submodule of email_registration. Makes the full email the username, keeps both in sync, and can
    override the displayed name. Cases are `recipe` (response-graded): they probe documented facts (the
    username strategy, the sync rule, the display-override setting/modes, the permission that bypasses
    it, the swapped bulk action) an agent would otherwise read source to answer; no site mutation.'
questions:
- id: eru-full-email-username
  input: How does the Email Registration Username submodule differ from the main Email Registration module
    in what it stores as the username?
  criteria: It stores the full email address as the username (via hook_email_registration_name_alter setting
    $newAccountName to $account->getEmail()), whereas the main module stores only the part before the
    @.
  bundle: email_registration_username
  rubric_ref: rubric/email_registration_username_eru_full_email_username@1.0
  tags:
  - mode:recipe
- id: eru-sync-rule
  input: With Email Registration Username enabled, if an admin changes an existing user's email address,
    does the username change too? Under what condition?
  criteria: It re-syncs the username to the new email only if the old username was already equal to the
    old email; a user who chose a different custom username keeps it.
  bundle: email_registration_username
  rubric_ref: rubric/email_registration_username_eru_sync_rule@1.0
  tags:
  - mode:recipe
- id: eru-display-override-setting
  input: Which config key and modes let Email Registration Username hide the email from other users' view
    of the display name?
  criteria: username_display_override_mode on email_registration_username.settings, with modes disabled
    / email_registration (part before @) / custom (username_display_custom, supports tokens).
  bundle: email_registration_username
  rubric_ref: rubric/email_registration_username_eru_display_override_setting@1.0
  tags:
  - mode:recipe
- id: eru-view-email-permission-bypass
  input: In the Email Registration Username submodule, which permission causes the display-name override
    to be skipped so the viewer sees the real name/email?
  criteria: The core 'view user email addresses' permission — hook_user_format_name_alter returns early
    (no override) for a current user who has it.
  bundle: email_registration_username
  rubric_ref: rubric/email_registration_username_eru_view_email_permission_bypass@1.0
  tags:
  - mode:recipe
- id: eru-custom-tokens
  input: I want to display '****' or a token-based value instead of users' email addresses with Email
    Registration Username. Which mode and config key do I use, and does it support tokens?
  criteria: Set username_display_override_mode to 'custom' and put the text or token in username_display_custom
    (e.g. '****' or [user:...]); it is passed through the token service, so tokens are supported (the
    module depends on token).
  bundle: email_registration_username
  rubric_ref: rubric/email_registration_username_eru_custom_tokens@1.0
  tags:
  - mode:recipe
- id: eru-bulk-action-swap
  input: With the Email Registration Username submodule enabled, what does the 'Update username (from
    email_registration)' bulk action do differently?
  criteria: It swaps the action class (via hook_action_info_alter) to UpdateUsernameWithMailAction, which
    sets each selected user's username to their full email address rather than a stripped/generated name.
  bundle: email_registration_username
  rubric_ref: rubric/email_registration_username_eru_bulk_action_swap@1.0
  tags:
  - mode:recipe
