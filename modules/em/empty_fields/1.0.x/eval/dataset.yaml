metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: empty_fields
  version: 1.0.x
  note: 'empty_fields adds an ''Empty value behavior'' handler to a field formatter, stored as a third-party
    setting on the field''s display component: core.entity_view_display.<entity>.<bundle>.<mode> content.<field>.third_party_settings.empty_fields.handler
    (+ .settings). Shipped handler plugins: nbsp, text (settings.empty_text, token-aware), and a hidden
    ''broken''. It defines the empty_fields plugin type (@EmptyField / EmptyFieldsPluginManager). Medium
    cases create a string field field_ef on Article with a known handler/settings and the agent reads
    it back via drush cget; hard cases create the field without an empty handler and the agent must set
    it, verified against the live entity_view_display. Artifacts are namespaced field_ef and removed on
    cleanup.'
questions:
- id: ef-how-to-configure
  input: On a Drupal site with the Empty Fields module, how do I make a field show a placeholder when
    it is empty instead of being hidden, and where is that choice stored?
  criteria: 'On the field''s formatter (Manage display) set ''Empty value behavior'' to a handler. It
    is stored as a third-party setting on the field''s display component: core.entity_view_display.<entity>.<bundle>.<mode>
    content.<field>.third_party_settings.empty_fields.handler (with optional .settings).'
  bundle: empty_fields
  rubric_ref: rubric/empty_fields_ef_how_to_configure@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: ef-shipped-handlers
  input: Which empty-field handler plugins ship with the Empty Fields module out of the box, and what
    does each do?
  criteria: It ships 'nbsp' (renders a non-breaking space) and 'text' (renders custom, token-replaced
    text via its empty_text setting), plus a hidden 'broken' fallback that is not selectable.
  bundle: empty_fields
  rubric_ref: rubric/empty_fields_ef_shipped_handlers@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: ef-plugin-type
  input: The Empty Fields module lets you add your own empty-field renderer. What plugin type / infrastructure
    does it define for that?
  criteria: 'It defines the ''empty_fields'' plugin type: manager service plugin.manager.empty_fields
    (EmptyFieldsPluginManager), the @EmptyField annotation, base class EmptyFieldPluginBase, in the Plugin/EmptyFields
    namespace. Implement react() and settingsSummary().'
  bundle: empty_fields
  rubric_ref: rubric/empty_fields_ef_plugin_type@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: ef-known-text
  input: On this Drupal site, the Article content type has a field field_ef whose display is configured
    (via the Empty Fields module) to show custom text when the field is empty. Inspect the live display
    configuration and tell me exactly what that empty-value text is.
  criteria: In core.entity_view_display.node.article.default the field_ef component has third_party_settings.empty_fields.handler
    = text and settings.empty_text = 'EF_KNOWN_TEXT'.
  bundle: empty_fields
  rubric_ref: rubric/empty_fields_ef_known_text@1.0
  tags:
  - mode:introspection
  - difficulty:medium
