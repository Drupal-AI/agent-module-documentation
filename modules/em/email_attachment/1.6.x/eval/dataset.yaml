    setup: agent-module-documentation/evaluation/verify/email_attachment-spec2-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/email_attachment-spec2-cleanup.sh
- id: email_attachment-build-multipart
  input: On this Drupal site, use the email_attachment module to build an email message that carries a
    single text attachment named report.txt whose content is the text 'hello'. Run the message through
    email_attachment's mail-alter processing and store the resulting message array in Drupal State under
    the key email_attachment_eval.result so it can be verified.
  criteria: 'Build $message = [''headers'' => [''Content-Type'' => ''text/plain''], ''body'' => [''...''],
    ''params'' => [''attachment'' => [''filename'' => ''report.txt'', ''filecontent'' => ''hello'']]];
    call \Drupal::service(\Drupal\email_attachment\Hook\EmailAttachmentHooks::class)->mailAlter($message);
    then \Drupal::state()->set(''email_attachment_eval.result'', $message). The result must be multipart/mixed
    with a Content-Disposition: attachment part named report.txt containing base64 aGVsbG8=.'
  bundle: email_attachment
  rubric_ref: rubric/email_attachment_email_attachment_build_multipart@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/email_attachment-multipart-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/email_attachment-multipart-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/email_attachment-multipart-verify.sh
- id: email_attachment-build-multi
  input: 'Using the email_attachment module on this site, build one email that carries TWO text attachments:
    a.txt containing ''AAA'' and b.txt containing ''BBB''. Run it through email_attachment''s mail-alter
    processing and store the resulting message array in Drupal State under the key email_attachment_eval.result2.'
  criteria: Build $message with params['attachments'] => [['filename' => 'a.txt', 'filecontent' => 'AAA'],
    ['filename' => 'b.txt', 'filecontent' => 'BBB']] plus headers Content-Type text/plain and a body;
    run EmailAttachmentHooks::mailAlter($message); store in State email_attachment_eval.result2. Result
    must be multipart/mixed carrying a.txt (base64 QUFB) and b.txt (base64 QkJC).
  bundle: email_attachment
  rubric_ref: rubric/email_attachment_email_attachment_build_multi@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/email_attachment-multi-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/email_attachment-multi-cleanup.sh
