metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: email_attachment
  version: 1.6.x
  note: 'email_attachment is a stateless developer helper: hook_mail_alter() rewrites a mail into multipart/mixed
    when $message[''params''][''attachment''] or [''attachments''] is set. An attachment is an array with
    required ''filename'', optional ''filecontent'' (raw bytes; else the file at filename is read) and
    optional ''filemime''. It runs its mail_alter last so other modules can add attachments first. No
    config/routes/permissions. The module has no persistent site state, so medium cases seed a State fixture
    describing an attachment spec (email_attachment_eval.spec / .spec2) for introspection, and hard cases
    have the agent build a message array, run it through the module''s mailAlter, and store the resulting
    message in State (email_attachment_eval.result / .result2) which the verify inspects for a multipart/mixed
    body carrying the expected base64 attachment(s).'
questions:
- id: email_attachment-how
  input: Using the Drupal email_attachment module, how do I attach a file to an email I send through the
    mail manager? What do I put in the message params?
  criteria: Set $params['attachment'] (or $params['attachments'] for several) when calling MailManager::mail().
    Each attachment is an array with a required 'filename', optional 'filecontent' (raw bytes; if omitted
    the file at filename is read), and optional 'filemime' (guessed if omitted). The module's hook_mail_alter
    then converts the message to multipart/mixed.
  bundle: email_attachment
  rubric_ref: rubric/email_attachment_email_attachment_how@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: email_attachment-multipart
  input: What does the email_attachment module change about an outgoing email's structure when an attachment
    is present, and how is the attachment encoded?
  criteria: 'It rewrites the message into a multipart/mixed body (setting headers Content-Type to multipart/mixed
    with a boundary). The original body becomes the first MIME part; each attachment is appended with
    Content-Transfer-Encoding: base64 and a Content-Disposition: attachment header, base64-encoded.'
  bundle: email_attachment
  rubric_ref: rubric/email_attachment_email_attachment_multipart@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: email_attachment-fields
  input: In email_attachment, which field of an attachment array is mandatory, and what happens if I omit
    filecontent or filemime?
  criteria: filename is mandatory (omitting it throws InvalidArgumentException). If filecontent is omitted,
    the module reads the file at filename from disk (throwing FileNotExistsException if it is not a real
    file). If filemime is omitted, it is guessed via the file mime-type guesser services.
  bundle: email_attachment
  rubric_ref: rubric/email_attachment_email_attachment_fields@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: email_attachment-known-spec
  input: On this Drupal site, an email attachment specification has been stored in State under the key
    email_attachment_eval.spec. Inspect the live site and report the attachment's filename and its MIME
    type.
  criteria: The State value email_attachment_eval.spec is ['filename' => 'quarterly-report.pdf', 'filemime'
    => 'application/pdf'].
  bundle: email_attachment
  rubric_ref: rubric/email_attachment_email_attachment_known_spec@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/email_attachment-spec-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/email_attachment-spec-cleanup.sh
- id: email_attachment-known-spec2
  input: This site has a multi-attachment email spec stored in State under email_attachment_eval.spec2.
    Inspect the running site and list the filenames of all attachments in that spec.
  criteria: email_attachment_eval.spec2 has attachments with filenames summary.csv and details.csv (['attachments'
    => [['filename' => 'summary.csv'], ['filename' => 'details.csv']]]).
  bundle: email_attachment
  rubric_ref: rubric/email_attachment_email_attachment_known_spec2@1.0
  tags:
  - mode:introspection
