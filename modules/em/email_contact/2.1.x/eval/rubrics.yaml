rubrics:
- id: email_contact_email_contact_formatters
  version: '1.0'
  applicable_bundles:
  - email_contact
  checks:
  - kind: must_contain_any
    values:
    - email_contact_link
    - email_contact_inline
    - Email contact link
    - Email contact inline
  scoring:
    combine: all_pass
- id: email_contact_email_contact_how_apply
  version: '1.0'
  applicable_bundles:
  - email_contact
  checks:
  - kind: must_contain_any
    values:
    - Manage display
    - manage-display
    - entity_view_display
    - formatter
    - Format column
  scoring:
    combine: all_pass
- id: email_contact_email_contact_modal_and_recipient
  version: '1.0'
  applicable_bundles:
  - email_contact
  checks:
  - kind: must_contain_any
    values:
    - modal
    - field
    - reply-to
    - recipient
    - hook_mail
  scoring:
    combine: all_pass
- id: email_contact_email_contact_known_link
  version: '1.0'
  applicable_bundles:
  - email_contact
