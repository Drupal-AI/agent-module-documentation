metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: emptyparagraphkiller
  version: 2.1.x
  note: 'emptyparagraphkiller provides ONE text-format filter plugin (id ''emptyparagraphkiller'', ''Empty
    Paragraph filter'', type TYPE_TRANSFORM_REVERSIBLE, extends FilterBase) that strips empty <p> tags
    (whitespace/&nbsp; only) from rendered output, non-destructively. No settings form, no schema, no
    permissions, no Drush, no plugin types (configure=null). Its only state is whether the filter is enabled
    (and its weight) on a text format, stored in filter.format.<id> under filters.emptyparagraphkiller
    (status, weight). Medium cases create text formats with the filter on/off and the agent reads filter.format.*
    config; hard cases enable the filter on / create a text format with the filter, verified against the
    live filter.format config. Facts grounded in src/Plugin/Filter/EmptyParagraphKiller.php (regex #<p[^>]*>(\s|&nbsp;?)*</p>#)
    and README.'
questions:
- id: epk-what-and-enable
  input: What does the Drupal 'Empty Paragraph Killer' (emptyparagraphkiller) module do, and how do I
    switch it on?
  criteria: It provides a text-format filter that non-destructively removes empty <p> paragraphs (whitespace/&nbsp;
    only) from rendered output. Enable it at /admin/config/content/formats by editing a text format and
    checking 'Empty paragraph filter'.
  bundle: emptyparagraphkiller
  rubric_ref: rubric/emptyparagraphkiller_epk_what_and_enable@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: epk-plugin-id-type
  input: For the emptyparagraphkiller module, what is the filter plugin id and what filter type is it
    (e.g. how does it behave in the filter pipeline)?
  criteria: The filter plugin id is 'emptyparagraphkiller' (title 'Empty Paragraph filter'), extending
    FilterBase with type FilterInterface::TYPE_TRANSFORM_REVERSIBLE. prepare() swaps empty paragraphs
    for a [empty-para] placeholder and process() removes it, so the source is never altered.
  bundle: emptyparagraphkiller
  rubric_ref: rubric/emptyparagraphkiller_epk_plugin_id_type@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: epk-ordering
  input: Where in a text format's filter processing order should I place the Empty paragraph killer filter,
    and why?
  criteria: Per the maintainers, place Empty paragraph killer at (or near) the bottom of the Filter processing
    order so other filters run first, unless you know a later filter must process its output.
  bundle: emptyparagraphkiller
  rubric_ref: rubric/emptyparagraphkiller_epk_ordering@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: epk-inspect-known
  input: This Drupal site has a text format with machine name 'epk_known'. Inspect its live configuration
    and tell me the id of the filter plugin that is enabled on it.
  criteria: The enabled filter is 'emptyparagraphkiller' — filter.format.epk_known has filters.emptyparagraphkiller.status
    = true.
  bundle: emptyparagraphkiller
  rubric_ref: rubric/emptyparagraphkiller_epk_inspect_known@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/emptyparagraphkiller-known-format-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/emptyparagraphkiller-known-format-cleanup.sh
- id: epk-inspect-on-vs-off
  input: This site has two text formats, 'epk_on' and 'epk_off'. Exactly one of them strips empty paragraphs
    with the emptyparagraphkiller filter. Inspect the live filter configuration and tell me which format
    has it enabled.
  criteria: epk_on has the emptyparagraphkiller filter enabled (filter.format.epk_on -> filters.emptyparagraphkiller.status
    true); epk_off does not have the filter.
  bundle: emptyparagraphkiller
  rubric_ref: rubric/emptyparagraphkiller_epk_inspect_on_vs_off@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/emptyparagraphkiller-on-vs-off-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/emptyparagraphkiller-on-vs-off-cleanup.sh
- id: epk-enable-on-format
  input: On this Drupal site there is a text format with machine name 'epk_task'. Enable the Empty Paragraph
    Killer (emptyparagraphkiller) filter on that text format and apply it to the live site.
  criteria: filter.format.epk_task has filters.emptyparagraphkiller.status === true (the filter enabled
    on that format).
  bundle: emptyparagraphkiller
  rubric_ref: rubric/emptyparagraphkiller_epk_enable_on_format@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/emptyparagraphkiller-enable-on-format-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/emptyparagraphkiller-enable-on-format-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/emptyparagraphkiller-enable-on-format-verify.sh
- id: epk-new-format-layman
  input: My editors keep leaving blank empty lines in content. Create a new text format on my site called
    'epk_new' that automatically strips out those empty paragraphs, using the module I installed for that.
    Make it live.
  criteria: A text format 'epk_new' exists (filter.format.epk_new) with the emptyparagraphkiller filter
    enabled (filters.emptyparagraphkiller.status true).
  bundle: emptyparagraphkiller
  rubric_ref: rubric/emptyparagraphkiller_epk_new_format_layman@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: site-owner
    reset: agent-module-documentation/evaluation/verify/emptyparagraphkiller-new-format-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/emptyparagraphkiller-new-format-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/emptyparagraphkiller-new-format-verify.sh
