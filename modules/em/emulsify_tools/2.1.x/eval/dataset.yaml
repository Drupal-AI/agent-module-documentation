metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: emulsify_tools
  version: 2.1.x
  note: Emulsify Tools provides Twig helpers (bem(), add_attributes(), {% switch %}), theme-defined Twig
    namespaces (components.namespaces in a theme .info.yml, referenced as @atoms/button.twig), Drush child-theme
    generation (emulsify_tools:bake alias emulsify) and favicon deployment commands. Its only persistent
    config is emulsify_tools.settings.admin_theme_favicon_themes (a sequence of theme machine names whose
    generated favicon also applies on admin pages; default []). No configure route, no permissions, no
    plugin types. Medium cases seed known theme names into admin_theme_favicon_themes and read them back;
    hard cases require adding/replacing entries in that list, verified against live config. Baseline restored
    to [] (install default). Favicon commands need an Emulsify 7.x theme (absent here), so execution cases
    stay grounded in the config the module owns.
questions:
- id: emulsify-tools-bem
  input: Using the Emulsify Tools Twig helpers, which function produces BEM class names in a template,
    and what class string does bem('title', ['small', 'red'], 'card') generate?
  criteria: The bem() Twig function. bem('title', ['small','red'], 'card') => class="card__title card__title--small
    card__title--red".
  bundle: emulsify_tools
  rubric_ref: rubric/emulsify_tools_emulsify_tools_bem@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: emulsify-tools-bake
  input: Which Drush command does Emulsify Tools provide to generate an Emulsify child theme, and what
    is its alias?
  criteria: 'drush emulsify_tools:bake <name> (alias: drush emulsify <name>); it generates a child theme
    under themes/custom/<name>.'
  bundle: emulsify_tools
  rubric_ref: rubric/emulsify_tools_emulsify_tools_bake@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: emulsify-tools-namespaces
  input: How does a theme register component Twig namespaces so Emulsify Tools resolves them (e.g. so
    templates can be referenced like @atoms/button.twig)?
  criteria: 'Declare them in the theme''s .info.yml under components.namespaces (same structure as the
    Components module), e.g. `components: { namespaces: { atoms: components/01-atoms } }`; then reference
    @atoms/button/button.twig.'
  bundle: emulsify_tools
  rubric_ref: rubric/emulsify_tools_emulsify_tools_namespaces@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: emulsify-tools-known-admin-favicon
  input: On this Drupal site, Emulsify Tools is configured so that a theme's generated favicon is also
    applied on admin pages. Inspect the live configuration and give the machine name of that theme.
  criteria: emulsify_tools.settings.admin_theme_favicon_themes contains 'emulsify_child_known'.
  bundle: emulsify_tools
  rubric_ref: rubric/emulsify_tools_emulsify_tools_known_admin_favicon@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/emulsify_tools-known-admin-favicon-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/emulsify_tools-known-admin-favicon-cleanup.sh
- id: emulsify-tools-known-admin-favicon-multi
  input: Inspect the Emulsify Tools configuration on this site and list every theme configured to also
    use its generated favicon on admin pages.
  criteria: emulsify_tools.settings.admin_theme_favicon_themes is ['olivero', 'claro_child_known'].
  bundle: emulsify_tools
  rubric_ref: rubric/emulsify_tools_emulsify_tools_known_admin_favicon_multi@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/emulsify_tools-known-admin-favicon-multi-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/emulsify_tools-known-admin-favicon-multi-cleanup.sh
- id: emulsify-tools-enable-admin-favicon
  input: Configure Emulsify Tools so that the 'olivero' theme's generated favicon package is also applied
    on admin pages. Apply the change to the live site.
  criteria: Add 'olivero' to emulsify_tools.settings.admin_theme_favicon_themes.
  bundle: emulsify_tools
  rubric_ref: rubric/emulsify_tools_emulsify_tools_enable_admin_favicon@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/emulsify_tools-enable-admin-favicon-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/emulsify_tools-enable-admin-favicon-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/emulsify_tools-enable-admin-favicon-verify.sh
- id: emulsify-tools-replace-admin-favicon
  input: Emulsify Tools currently lists a placeholder theme for admin-page favicons. Reconfigure it so
    that the ONLY theme whose generated favicon applies on admin pages is 'canvas_stark' (remove any other
    entries). Apply the change to the live site.
  criteria: Set emulsify_tools.settings.admin_theme_favicon_themes to ['canvas_stark'] (containing canvas_stark
    and not the placeholder).
  bundle: emulsify_tools
  rubric_ref: rubric/emulsify_tools_emulsify_tools_replace_admin_favicon@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/emulsify_tools-replace-admin-favicon-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/emulsify_tools-replace-admin-favicon-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/emulsify_tools-replace-admin-favicon-verify.sh
