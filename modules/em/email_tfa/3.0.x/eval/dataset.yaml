metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: email_tfa
  version: 3.0.x
  note: 'Email TFA is email-based two-factor auth: it overrides the core user.login form (and user.login.http
    REST endpoint) via a route subscriber, emails a one-time numeric code (hook_mail key send_email_tfa,
    [user:email_tfa] token), and requires the user to verify it at /tfa/verify/{uid}/{hash}. All state
    is the config object email_tfa.settings (status bool default FALSE; tracks globally_enabled|optionally_by_users;
    role_exclusion_type disable_for|force_for + ignore_role list; user_one; security_code_length 4-9 default
    4; timeouts seconds min 60 default 300; dev_mode; log_events; flood_threshold 5 / flood_window 3600;
    subject/body). Config route email_tfa.settings at /admin/config/people/email-tfa (perm ''administer
    email tfa''). A boolean user base field email_tfa_status enables per-user opt-in. Requires hash_salt
    in settings.php. Actually sending/verifying a code needs a working mail transport (external), so ALL
    eval cases are grounded in the local email_tfa.settings config only (never a real email round-trip):
    introspection reads back a planted setting; execution writes settings verified against the live config.'
questions:
- id: etfa-enable-how
  input: In the Drupal email_tfa module, which configuration object and keys turn on email two-factor
    authentication and choose between forcing it on everyone versus letting each user opt in? What does
    the module override so the challenge happens at login?
  criteria: 'Config object email_tfa.settings: the boolean ''status'' is the master switch and ''tracks''
    chooses globally_enabled (all users) vs optionally_by_users (per-user opt-in via the email_tfa_status
    field). The module''s route subscriber overrides the core user.login form (and user.login.http REST
    endpoint) so login triggers the emailed code + /tfa/verify/{uid}/{hash} step.'
  bundle: email_tfa
  rubric_ref: rubric/email_tfa_etfa_enable_how@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: etfa-email-token
  input: How do I customize the one-time-password email that email_tfa sends, and which token inserts
    the actual code into the email body? What must be set in settings.php for the module to work?
  criteria: Edit the 'subject' and 'body' keys of email_tfa.settings; the [user:email_tfa] token is replaced
    with the generated code (alongside standard tokens like [user:name], [site:name]). The email is sent
    via hook_mail key send_email_tfa. A non-empty hash_salt must be set in settings.php because the code
    hash depends on it.
  bundle: email_tfa
  rubric_ref: rubric/email_tfa_etfa_email_token@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: etfa-code-and-roles
  input: With the email_tfa module, what are the allowed values for the security code length and the code
    timeout, and how do I make TFA apply only to users with certain roles?
  criteria: security_code_length is 4-9 digits (default 4); timeouts is in seconds and must be >= 60 (default
    300). To require TFA only for specific roles set role_exclusion_type to 'force_for' and list those
    roles in ignore_role (whereas 'disable_for' exempts the listed roles). user_one can exclude user 1.
  bundle: email_tfa
  rubric_ref: rubric/email_tfa_etfa_code_and_roles@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: etfa-known-codelen
  input: On this Drupal site, the email_tfa module has been configured with a specific security code length.
    Inspect the live configuration and report how many digits the one-time code will have.
  criteria: 'The security code length is 8 digits: email_tfa.settings -> security_code_length is 8 (drush
    cget email_tfa.settings security_code_length).'
  bundle: email_tfa
  rubric_ref: rubric/email_tfa_etfa_known_codelen@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/email_tfa-known-codelen-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/email_tfa-known-codelen-cleanup.sh
- id: etfa-known-subject
  input: The email_tfa module on this site uses a customized subject line for its one-time-password email.
    Inspect the live configuration and report the exact email subject that is configured.
  criteria: 'The OTP email subject is ''EMAILTFA Custom Subject 88'': email_tfa.settings -> subject (drush
    cget email_tfa.settings subject).'
  bundle: email_tfa
  rubric_ref: rubric/email_tfa_etfa_known_subject@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/email_tfa-known-subject-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/email_tfa-known-subject-cleanup.sh
- id: etfa-enable-global
  input: On this site, turn on the email_tfa module's email two-factor authentication for all users (global
    mode) and apply the change to the live site.
  criteria: Set email_tfa.settings -> status to TRUE and tracks to 'globally_enabled' (e.g. `drush cset
    email_tfa.settings status true -y` and `drush cset email_tfa.settings tracks globally_enabled -y`,
    or via the settings form at /admin/config/people/email-tfa).
  bundle: email_tfa
  rubric_ref: rubric/email_tfa_etfa_enable_global@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/email_tfa-enable-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/email_tfa-enable-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/email_tfa-enable-verify.sh
- id: etfa-code-policy
  input: For the email login-code feature (email_tfa), make the code 6 digits long and have it stay valid
    for 10 minutes. Save the change to the site.
  criteria: In email_tfa.settings set security_code_length to 6 and timeouts to 600 (10 minutes in seconds;
    must be >= 60). E.g. `drush cset email_tfa.settings security_code_length 6 -y` and `drush cset email_tfa.settings
    timeouts 600 -y`.
  bundle: email_tfa
  rubric_ref: rubric/email_tfa_etfa_code_policy@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-layman
    reset: agent-module-documentation/evaluation/verify/email_tfa-code-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/email_tfa-code-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/email_tfa-code-verify.sh
