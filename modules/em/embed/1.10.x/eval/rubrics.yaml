rubrics:
- id: embed_embed_role
  version: '1.0'
  applicable_bundles:
  - embed
  checks:
  - kind: must_contain_any
    values:
    - embed_button
    - EmbedType
    - framework
    - Entity Embed
    - Media
  scoring:
    combine: all_pass
- id: embed_embed_button_config_entity
  version: '1.0'
  applicable_bundles:
  - embed
  checks:
  - kind: must_contain_any
    values:
    - embed_button
    - entity.embed_button.collection
    - /admin/config/content/embed
    - Content authoring
  scoring:
    combine: all_pass
- id: embed_embed_type_plugin
  version: '1.0'
  applicable_bundles:
  - embed
  checks:
  - kind: must_contain_any
    values:
    - EmbedType
    - Plugin/EmbedType
    - plugin.manager.embed.type
    - EmbedTypeManager
    - Annotation\EmbedType
  scoring:
    combine: all_pass
- id: embed_embed_type_form_class
  version: '1.0'
  applicable_bundles:
  - embed
  checks:
  - kind: must_contain_any
    values:
    - embed_form_class
  scoring:
    combine: all_pass
- id: embed_embed_ckeditor_integration
  version: '1.0'
  applicable_bundles:
  - embed
  checks:
  - kind: must_contain_any
    values:
    - EmbedCKEditorPluginBase
    - EmbedCKEditor5PluginBase
    - EmbedCKEditor5PluginDeriver
    - derived
  scoring:
    combine: all_pass
- id: embed_embed_preview_endpoint
  version: '1.0'
  applicable_bundles:
  - embed
  checks:
  - kind: must_contain_any
    values:
    - /embed/preview/{filter_format}
    - embed.preview
    - EmbedController
    - EmbedInsertCommand
  scoring:
    combine: all_pass
- id: embed_embed_alter_hook
  version: '1.0'
  applicable_bundles:
  - embed
  checks:
  - kind: must_contain_any
    values:
    - hook_embed_type_plugins_alter
  scoring:
    combine: all_pass
- id: embed_embed_admin_permission
  version: '1.0'
  applicable_bundles:
  - embed
  checks:
  - kind: must_contain_any
    values:
    - administer embed buttons
  scoring:
    combine: all_pass
