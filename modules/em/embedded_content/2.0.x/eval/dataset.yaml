metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: embedded_content
  version: 2.0.x
  note: 'Embedded Content defines an embedded_content plugin type (annotation @EmbeddedContent, base EmbeddedContentPluginBase,
    Plugin/EmbeddedContent namespace, build()+isInline()) and embedded_content_button config entities
    (config name embedded_content.button.<id>, config_prefix ''button'', settings: icon/label_singular/submit_button_text/modal_title/conditions/dialog_settings).
    Each button becomes a CKEditor 5 toolbar item embeddedContent__<id>; the embedded_content text filter
    renders <embedded-content data-plugin-id data-plugin-config> tags on output. Permissions: administer
    embedded content + dynamic ''use <button_id> embedded content button''. Ships zero concrete plugins
    by default. Medium cases seed a known button config entity and the agent reads its settings. Hard
    cases create a button config entity and enable the embedded_content filter on a new text format, verified
    against live config. Execution is done through config entities (buttons, filter format) rather than
    authoring a PHP plugin (which would require a throwaway module on this shared site).'
questions:
- id: embedded_content-plugin-howto
  input: In the embedded_content Drupal module, how do I define a new embeddable component in code? Which
    annotation, base class and namespace do I use, and which methods are required?
  criteria: Create a class in src/Plugin/EmbeddedContent/ annotated @EmbeddedContent(id, label) that extends
    EmbeddedContentPluginBase and implements EmbeddedContentInterface. Implement build() (render array)
    and isInline() (bool); optionally defaultConfiguration(), buildConfigurationForm(), massageFormValues(),
    getAttachments().
  bundle: embedded_content
  rubric_ref: rubric/embedded_content_embedded_content_plugin_howto@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: embedded_content-editor-setup
  input: How do editors actually insert an embedded_content component into CKEditor 5, and what has to
    be enabled on the text format for it to work — without giving editors raw HTML permission?
  criteria: Create an Embedded content button, add its CKEditor 5 toolbar item (embeddedContent__<button_id>)
    to the format's toolbar, and enable the 'Embedded content' filter on that text format. The CKEditor
    plugin declares the <embedded-content> elements, so no extra allowed-HTML/raw-HTML permission is needed.
  bundle: embedded_content
  rubric_ref: rubric/embedded_content_embedded_content_editor_setup@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: embedded_content-permission
  input: What permission controls whether a user can use a particular embedded_content button, and how
    is it named?
  criteria: There is a dynamic per-button permission named 'use <button_id> embedded content button' (e.g.
    'use default embedded content button'), generated by EmbeddedContentPermissions. Managing buttons
    themselves uses the 'administer embedded content' permission.
  bundle: embedded_content
  rubric_ref: rubric/embedded_content_embedded_content_permission@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: embedded_content-known-modal
  input: This site has an embedded_content button config entity with id 'ec_known'. Inspect the live configuration
    and report the modal title configured for that button.
  criteria: The button config entity embedded_content.button.ec_known has settings.modal_title = 'EC Known
    Modal'.
  bundle: embedded_content
  rubric_ref: rubric/embedded_content_embedded_content_known_modal@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/embedded_content-known-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/embedded_content-known-cleanup.sh
- id: embedded_content-known-singular
  input: For the embedded_content button 'ec_known' configured on this site, inspect the running configuration
    and report the singular label (label_singular) it uses for the content being embedded.
  criteria: embedded_content.button.ec_known has settings.label_singular = 'gadget'.
  bundle: embedded_content
  rubric_ref: rubric/embedded_content_embedded_content_known_singular@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/embedded_content-known-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/embedded_content-known-cleanup.sh
- id: embedded_content-create-button
  input: On this Drupal site, use the embedded_content module to create a new Embedded content button
    with machine id 'ec_task', label 'EC Task', and a singular content name (label_singular) of 'component'.
    Save it to the live site.
  criteria: Create an embedded_content_button config entity (embedded_content.button.ec_task) with label
    'EC Task' and settings.label_singular = 'component'. Verify checks the entity exists with that label
    and label_singular.
  bundle: embedded_content
  rubric_ref: rubric/embedded_content_embedded_content_create_button@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/embedded_content-create-button-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/embedded_content-create-button-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/embedded_content-create-button-verify.sh
- id: embedded_content-enable-filter
  input: I need a new text format on my site called 'ec_task_format' where the embedded_content module's
    component embedding works. Create that text format and turn on the 'Embedded content' filter for it,
    then save.
  criteria: Create a filter_format 'ec_task_format' with the embedded_content filter enabled (filters.embedded_content.status
    = true) and save. Verify checks the format exists and its embedded_content filter status is true.
  bundle: embedded_content
  rubric_ref: rubric/embedded_content_embedded_content_enable_filter@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: site-owner
    reset: agent-module-documentation/evaluation/verify/embedded_content-enable-filter-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/embedded_content-enable-filter-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/embedded_content-enable-filter-verify.sh
