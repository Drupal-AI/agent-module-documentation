rubrics:
- id: embedded_content_embedded_content_plugin_howto
  version: '1.0'
  applicable_bundles:
  - embedded_content
  checks:
  - kind: must_contain_any
    values:
    - '@EmbeddedContent'
    - EmbeddedContentPluginBase
    - Plugin/EmbeddedContent
    - build()
    - isInline
  scoring:
    combine: all_pass
- id: embedded_content_embedded_content_editor_setup
  version: '1.0'
  applicable_bundles:
  - embedded_content
  checks:
  - kind: must_contain_any
    values:
    - filter
    - embedded_content
    - toolbar
    - button
    - CKEditor
  scoring:
    combine: all_pass
- id: embedded_content_embedded_content_permission
  version: '1.0'
  applicable_bundles:
  - embedded_content
  checks:
  - kind: must_contain_any
    values:
    - 'use '
    - embedded content button
    - administer embedded content
  scoring:
    combine: all_pass
- id: embedded_content_embedded_content_known_modal
  version: '1.0'
  applicable_bundles:
  - embedded_content
  checks:
  - kind: must_contain_any
    values:
    - EC Known Modal
  scoring:
    combine: all_pass
- id: embedded_content_embedded_content_known_singular
  version: '1.0'
  applicable_bundles:
  - embedded_content
  checks:
  - kind: must_contain_any
    values:
    - gadget
  scoring:
    combine: all_pass
- id: embedded_content_embedded_content_create_button
  version: '1.0'
  applicable_bundles:
  - embedded_content
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
- id: embedded_content_embedded_content_enable_filter
  version: '1.0'
  applicable_bundles:
  - embedded_content
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
