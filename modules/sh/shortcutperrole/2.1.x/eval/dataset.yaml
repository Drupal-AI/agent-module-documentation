metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: shortcutperrole
  version: 2.1.x
  note: 'Shortcut per Role maps a core Shortcut set to each user role. Its only persistent state is the
    simple config object shortcutperrole.settings with keys role.<role_id>: <shortcut_set_id>. Behavior
    comes from hook_shortcut_default_set(), which returns the set for the account''s highest-weight (last-loaded)
    matching role, or ''default'' when unset. Config form is route shortcutperrole.admin_config at admin/config/user-interface/shortcut/roles
    (permission ''administer shortcut per role''). All medium/hard cases are grounded in shortcutperrole.settings:
    introspection reads back the configured set id for a role; execution assigns the core ''default''
    set to a role and verifies the stored config value. (Shortcut-set config entities cannot be created
    on this shared site because entity creation triggers a route rebuild that a pre-existing broken commerce_giftcard
    state makes fatal; the existing ''default'' set is used instead.)'
questions:
- id: shortcutperrole-config-location
  input: In the Drupal contrib module shortcutperrole, where is the role-to-shortcut-set assignment stored?
    Name the config object and the key structure.
  criteria: 'It is stored in the simple config object shortcutperrole.settings under role.<role_id>: <shortcut_set_id>
    (e.g. role.content_editor: editors_set). No entities or fields are involved.'
  bundle: shortcutperrole
  rubric_ref: rubric/shortcutperrole_shortcutperrole_config_location@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: shortcutperrole-multi-role-rule
  input: With shortcutperrole enabled, a user has two roles that are each mapped to a different shortcut
    set. Which set does the user actually get, and which hook decides it?
  criteria: hook_shortcut_default_set() intersects the account's roles with all roles in role order and
    returns the set mapped to the last / highest-weight matching role (falling back to 'default' if none
    is set).
  bundle: shortcutperrole
  rubric_ref: rubric/shortcutperrole_shortcutperrole_multi_role_rule@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: shortcutperrole-config-route
  input: Where is the admin form for shortcutperrole, and what permission protects it?
  criteria: The form is at admin/config/user-interface/shortcut/roles (route shortcutperrole.admin_config),
    gated by the 'administer shortcut per role' permission.
  bundle: shortcutperrole
  rubric_ref: rubric/shortcutperrole_shortcutperrole_config_route@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: shortcutperrole-known-editor-mapping
  input: On this Drupal site, shortcutperrole has a shortcut set assigned to the 'content_editor' role.
    Inspect the live configuration and state the shortcut set id configured for that role.
  criteria: shortcutperrole.settings has role.content_editor = spr_editors.
  bundle: shortcutperrole
  rubric_ref: rubric/shortcutperrole_shortcutperrole_known_editor_mapping@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/shortcutperrole-known-mapping-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/shortcutperrole-known-mapping-cleanup.sh
- id: shortcutperrole-known-admin-mapping
  input: This site has shortcutperrole mappings configured for both the administrator and content_editor
    roles. Which shortcut set id is assigned to the administrator role?
  criteria: shortcutperrole.settings has role.administrator = spr_admin_set (and role.content_editor =
    spr_editor_set).
  bundle: shortcutperrole
  rubric_ref: rubric/shortcutperrole_shortcutperrole_known_admin_mapping@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/shortcutperrole-admin-mapping-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/shortcutperrole-admin-mapping-cleanup.sh
- id: shortcutperrole-assign-editor
  input: On this Drupal site, use the shortcutperrole module to assign the core 'default' shortcut set
    as the default for the content_editor role. Apply the change to the live site.
  criteria: shortcutperrole.settings has role.content_editor explicitly set to 'default' (e.g. via the
    Shortcuts Per Role form or by setting the config key).
  bundle: shortcutperrole
  rubric_ref: rubric/shortcutperrole_shortcutperrole_assign_editor@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/shortcutperrole-assign-editor-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/shortcutperrole-assign-editor-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/shortcutperrole-assign-editor-verify.sh
- id: shortcutperrole-assign-authenticated
  input: I want every logged-in user on my site to start with the standard set of toolbar quick links
    (the 'default' shortcuts). Using the shortcut-per-role feature, make that the default for the logged-in
    (authenticated) user role.
  criteria: shortcutperrole.settings has role.authenticated explicitly set to 'default'.
  bundle: shortcutperrole
  rubric_ref: rubric/shortcutperrole_shortcutperrole_assign_authenticated@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: site-owner
    reset: agent-module-documentation/evaluation/verify/shortcutperrole-assign-auth-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/shortcutperrole-assign-auth-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/shortcutperrole-assign-auth-verify.sh
