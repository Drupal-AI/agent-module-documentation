rubrics:
- id: shortcode_example_shortcode_example_col_plugin
  version: '1.0'
  applicable_bundles:
  - shortcode_example
  checks:
  - kind: must_contain_any
    values:
    - col-md
    - col-xs
    - col-sm
    - col-lg
    - bootstrap column
    - id = "col"
  scoring:
    combine: all_pass
- id: shortcode_example_shortcode_example_teaching_purpose
  version: '1.0'
  applicable_bundles:
  - shortcode_example
  checks:
  - kind: must_contain_any
    values:
    - BootstrapColumnShortcode
    - working example
    - teaching
    - how to implement
    - example module illustrating
  scoring:
    combine: all_pass
- id: shortcode_example_shortcode_example_base_helpers
  version: '1.0'
  applicable_bundles:
  - shortcode_example
  checks:
  - kind: must_contain_any
    values:
    - getAttributes
    - addClass
  scoring:
    combine: all_pass
- id: shortcode_example_shortcode_example_filter_weight
  version: '1.0'
  applicable_bundles:
  - shortcode_example
  checks:
  - kind: must_contain_any
    values:
    - '9'
  scoring:
    combine: all_pass
- id: shortcode_example_shortcode_example_col_vs_block
  version: '1.0'
  applicable_bundles:
  - shortcode_example
  checks:
  - kind: must_contain_any
    values:
    - col
  scoring:
    combine: all_pass
- id: shortcode_example_shortcode_example_enable_col
  version: '1.0'
  applicable_bundles:
  - shortcode_example
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
- id: shortcode_example_shortcode_example_toggle_col
  version: '1.0'
  applicable_bundles:
  - shortcode_example
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
