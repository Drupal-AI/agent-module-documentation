  module: shortcode_example
  version: 2.0.x
  note: 'Shortcode Example is a teaching module: it ships exactly one @Shortcode plugin, id `col` (BootstrapColumnShortcode,
    title "Bootstrap column"), as the parent shortcode module''s own documented reference implementation.
    No config UI, no permissions, no services. Like any shortcode, `col` must be enabled per text format
    (parent shortcode filter status + filter.format.<format>.filters.shortcode.settings.col) before [col]
    markup is parsed. All medium/hard cases are grounded in that real config on namespaced `sce_*` text
    formats.'
questions:
- id: shortcode_example-col-plugin
  input: The Drupal submodule shortcode_example ships exactly one shortcode plugin. What is its plugin
    id, and what does its process() method build around the wrapped text?
  criteria: Its id is `col` (title "Bootstrap column", class BootstrapColumnShortcode). process() wraps
    the content in a <div> whose class is built from optional xs/sm/md/lg size attributes (e.g. md="4"
    adds col-md-4) plus any custom `class` attribute.
  bundle: shortcode_example
  rubric_ref: rubric/shortcode_example_shortcode_example_col_plugin@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: shortcode_example-teaching-purpose
  input: Why does the Drupal `shortcode` module ship a separate shortcode_example submodule at all — what
    is its purpose, and which class does it hold up as the canonical example?
  criteria: shortcode_example exists purely as a teaching/reference module showing how to implement a
    Shortcode plugin. The parent module's own annotation doc comment (Drupal\shortcode\Annotation\Shortcode)
    explicitly points to BootstrapColumnShortcode as "a working example".
  bundle: shortcode_example
  rubric_ref: rubric/shortcode_example_shortcode_example_teaching_purpose@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: shortcode_example-base-helpers
  input: In shortcode_example's `col` plugin, which two ShortcodeBase helper methods does process() call
    to (a) merge/whitelist the tag's attributes and (b) build up the CSS class string?
  criteria: getAttributes($defaults, $attributes) merges user-supplied attributes with the plugin's defaults
    (dropping anything unrecognized); addClass($classes, $newClass) appends a CSS class to the running
    class string, escaping and de-duplicating.
  bundle: shortcode_example
  rubric_ref: rubric/shortcode_example_shortcode_example_base_helpers@1.0
