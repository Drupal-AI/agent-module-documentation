metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: shortcode_basic_tags
  version: 2.0.x
  note: 'Shortcode Basic Tags ships ten @Shortcode plugins (ids = tokens): block, button, clear, dropcap,
    highlight, img, item, link, quote, random. No config UI, no permissions, no services of its own. Every
    tag still requires the parent module''s `shortcode` filter to be enabled on a text format, plus that
    specific shortcode id set to true in filter.format.<format>.filters.shortcode.settings, before its
    [tag] markup is parsed instead of shown literally. All medium/hard cases are grounded in that real
    config on namespaced `sbt_*` text formats.'
questions:
- id: shortcode_basic_tags-quote-rendering
  input: The Drupal submodule shortcode_basic_tags ships a `[quote]` shortcode. What HTML element does
    it wrap the text in, and name one optional attribute it accepts that lets you attribute the quote
    to someone.
  criteria: '[quote] renders as a <span class="quote"> (via the shortcode_quote theme hook / shortcode-quote.html.twig).
    The optional `author` attribute prepends "<author> wrote:" before the text; `class` adds extra CSS
    classes.'
  bundle: shortcode_basic_tags
  rubric_ref: rubric/shortcode_basic_tags_shortcode_basic_tags_quote_rendering@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: shortcode_basic_tags-button-target
  input: The `[button]` shortcode in shortcode_basic_tags builds a link styled as a button. What attribute
    specifies the link target, and what does it default to if you don't set it?
  criteria: The `path` attribute sets the link target (an internal path or `url` for an absolute URL);
    if omitted it defaults to `<front>`, the site's front page.
  bundle: shortcode_basic_tags
  rubric_ref: rubric/shortcode_basic_tags_shortcode_basic_tags_button_target@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: shortcode_basic_tags-block-attribute
  input: The `[block]` shortcode in shortcode_basic_tags lets you embed a custom block instance inline
    in body text. What attribute identifies which block to render, and what kind of value does it expect?
  criteria: The `id` attribute holds the numeric block_content entity id (loaded via BlockContent::load());
    an optional `view` attribute picks the view mode, defaulting to `full`.
  bundle: shortcode_basic_tags
  rubric_ref: rubric/shortcode_basic_tags_shortcode_basic_tags_block_attribute@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: shortcode_basic_tags-filter-weight
  input: On this Drupal site there's a text format called `sbt_eval`. It has the `shortcode` filter enabled
    with shortcode_basic_tags tags configured. Inspect the live config and tell me the numeric weight
