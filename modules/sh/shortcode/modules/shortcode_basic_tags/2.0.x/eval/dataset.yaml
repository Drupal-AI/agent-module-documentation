    cleanup: agent-module-documentation/evaluation/verify/shortcode_basic_tags-filter-weight-cleanup.sh
- id: shortcode_basic_tags-quote-vs-highlight
  input: On this Drupal site, the text format `sbt_toggle` has the shortcode filter enabled with the `quote`
    and `highlight` tags configured — exactly one of them is turned on. Inspect the live config and tell
    me which one (quote or highlight) is enabled.
  criteria: 'quote is enabled: filter.format.sbt_toggle.filters.shortcode.settings.quote is true, while
    settings.highlight is false.'
  bundle: shortcode_basic_tags
  rubric_ref: rubric/shortcode_basic_tags_shortcode_basic_tags_quote_vs_highlight@1.0
  tags:
