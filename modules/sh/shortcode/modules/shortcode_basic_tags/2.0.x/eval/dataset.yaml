  criteria: 'The shortcode filter''s weight on sbt_eval is 17 (filter.format.sbt_eval.filters.shortcode.weight:
    17).'
  bundle: shortcode_basic_tags
  rubric_ref: rubric/shortcode_basic_tags_shortcode_basic_tags_filter_weight@1.0
  tags:
