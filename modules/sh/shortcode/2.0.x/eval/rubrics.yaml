rubrics:
- id: shortcode_shortcode_filter_and_corrector
  version: '1.0'
  applicable_bundles:
  - shortcode
  checks:
  - kind: must_contain_any
    values:
    - shortcode_corrector
    - shortcode_text_corrector
    - html corrector
    - Shortcodes - html corrector
  scoring:
    combine: all_pass
- id: shortcode_shortcode_id_vs_token
  version: '1.0'
  applicable_bundles:
  - shortcode
  checks:
  - kind: must_contain_any
    values:
    - defaults to the id
    - defaults to id
    - lowercased id
    - strtolower
    - lower-cased id
    - token defaults
  scoring:
    combine: all_pass
- id: shortcode_shortcode_manager_and_per_format_toggle
  version: '1.0'
  applicable_bundles:
  - shortcode
  checks:
  - kind: must_contain_any
    values:
    - plugin.manager.shortcode
    - filter_settings.shortcode
    - filters.shortcode.settings
  scoring:
    combine: all_pass
- id: shortcode_shortcode_filter_weight
  version: '1.0'
  applicable_bundles:
  - shortcode
  checks:
  - kind: must_contain_any
    values:
    - '13'
  scoring:
    combine: all_pass
- id: shortcode_shortcode_quote_vs_highlight
  version: '1.0'
  applicable_bundles:
  - shortcode
  checks:
  - kind: must_contain_any
    values:
    - quote
  scoring:
    combine: all_pass
- id: shortcode_shortcode_enable_filter
  version: '1.0'
  applicable_bundles:
  - shortcode
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
- id: shortcode_shortcode_toggle_highlight
  version: '1.0'
  applicable_bundles:
  - shortcode
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
