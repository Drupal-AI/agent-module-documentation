metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: shortcode
  version: 2.0.x
  note: 'Shortcode is a plugin type + text-format filter framework, not a fixed set of tags. It defines
    the `shortcode` plugin type (annotation @Shortcode, Plugin/Shortcode, plugin.manager.shortcode) and
    ships two filters: `shortcode` (parses [tag]...[/tag] markup using enabled plugins) and `shortcode_corrector`
    (fixes WYSIWYG <p>/<div> wrapping). No configure route, no permissions, no Drush. Per-format enablement
    of the filter and of each individual shortcode id lives in filter.format.<format>.filters.shortcode
    (status + settings, schema filter_settings.shortcode = boolean map keyed by shortcode id). All medium/hard
    cases are grounded in that real config on namespaced `shortcode_*` text formats; shortcode_basic_tags
    is enabled site-wide so quote/button/highlight/img ids are real, resolvable shortcode plugin ids used
    in the fixtures.'
questions:
- id: shortcode-filter-and-corrector
  input: On a Drupal 11 site, I want body text to support WordPress-style `[tag]...[/tag]` shortcode markup.
    Name the text-format filter plugin id you must enable, and name the OTHER filter this module ships
    that fixes `<p>`/`<div>` wrapping WYSIWYG editors add around shortcode output.
  criteria: Enable the `shortcode` filter (id `shortcode`) on the text format. The companion filter is
    `shortcode_corrector` ("Shortcodes - html corrector"; the 7.x-2.x id was `shortcode_text_corrector`),
    which strips invalid <p> wrapping WYSIWYG editors insert around block-level shortcode output.
  bundle: shortcode
  rubric_ref: rubric/shortcode_shortcode_filter_and_corrector@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: shortcode-id-vs-token
  input: In the Drupal `shortcode` module's `@Shortcode` plugin annotation, what's the difference between
    the `id` field and the `token` field? If a plugin's annotation omits `token` entirely, what token
    does the parser actually match in `[...]` markup?
  criteria: '`id` identifies the plugin internally (used by plugin.manager.shortcode, filter_settings.shortcode
    keys); `token` is what the parser matches inside [brackets]. If token is omitted, it defaults to the
    lowercased id (strtolower($id)), so most plugins never set it explicitly and id and token are the
    same string.'
  bundle: shortcode
  rubric_ref: rubric/shortcode_shortcode_id_vs_token@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: shortcode-manager-and-per-format-toggle
  input: How does the Drupal `shortcode` module let a site enable a shortcode plugin on one text format
    but disable that same shortcode on another format? Which service manages the shortcode plugins, and
    where in a text format's configuration is per-shortcode enablement stored?
  criteria: Shortcode plugins are discovered/managed by the plugin.manager.shortcode service (ShortcodePluginManager).
    Per-format enablement of each shortcode id is stored in that format's filter config at filter.format.<format>.filters.shortcode.settings.<shortcode_id>
    (schema filter_settings.shortcode, a boolean map keyed by shortcode id) — so a shortcode can be TRUE
    on one format and FALSE/absent on another.
  bundle: shortcode
  rubric_ref: rubric/shortcode_shortcode_manager_and_per_format_toggle@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: shortcode-filter-weight
  input: On this Drupal site there's a text format called `shortcode_eval`. It has the `shortcode` filter
    enabled. Inspect the live filter configuration and tell me the numeric weight of the shortcode filter
    within this format's filter pipeline.
  criteria: 'The shortcode filter''s weight on shortcode_eval is 13 (filter.format.shortcode_eval.filters.shortcode.weight:
    13).'
  bundle: shortcode
  rubric_ref: rubric/shortcode_shortcode_filter_weight@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/shortcode-filter-weight-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/shortcode-filter-weight-cleanup.sh
- id: shortcode-quote-vs-highlight
  input: On this Drupal site, the text format `shortcode_eval2` has the shortcode filter enabled with
    the `quote` and `highlight` shortcodes configured — exactly one of them is turned on. Inspect the
    live config and tell me which one (quote or highlight) is enabled.
  criteria: 'quote is enabled: filter.format.shortcode_eval2.filters.shortcode.settings.quote is true,
    while settings.highlight is false.'
  bundle: shortcode
  rubric_ref: rubric/shortcode_shortcode_quote_vs_highlight@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/shortcode-quote-vs-highlight-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/shortcode-quote-vs-highlight-cleanup.sh
- id: shortcode-enable-filter
  input: On this Drupal site, the text format `shortcode_task` exists but does not have the shortcode
    filter enabled at all. Turn on WordPress-style bracket-tag shortcode parsing (the `shortcode` filter)
    for this format. Apply the change to the live site.
  criteria: filter.format.shortcode_task.filters.shortcode.status is set to true (e.g. via the format's
    Manage filters UI or FilterFormat::setFilterConfig('shortcode', [...'status' => TRUE]) and save).
  bundle: shortcode
  rubric_ref: rubric/shortcode_shortcode_enable_filter@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/shortcode-enable-filter-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/shortcode-enable-filter-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/shortcode-enable-filter-verify.sh
- id: shortcode-toggle-highlight
  input: On this Drupal site, the text format `shortcode_task2` has the shortcode filter enabled, but
    the `highlight` shortcode is turned off within it. Enable the highlight shortcode on this format so
    `[highlight]` tags are parsed. Apply the change to the live site.
  criteria: filter.format.shortcode_task2.filters.shortcode.settings.highlight is set to true while the
    shortcode filter itself remains enabled (status true).
  bundle: shortcode
  rubric_ref: rubric/shortcode_shortcode_toggle_highlight@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/shortcode-toggle-highlight-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/shortcode-toggle-highlight-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/shortcode-toggle-highlight-verify.sh
