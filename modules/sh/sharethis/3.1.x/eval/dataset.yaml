metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: sharethis
  version: 3.1.x
  note: 'ShareThis renders social-sharing buttons on nodes (as a content field or per view mode) or via
    blocks, using the hosted ShareThis service. Because the buttons depend on the EXTERNAL sharethis.com
    scripts, all cases are grounded in the LOCAL sharethis.settings config, not in live sharing. Shipped
    defaults: location=content, node_types={article,page}, sharethisnodes.article/page={full:full}, twitter_handle=''''.
    Medium cases set a known value (location, twitter_handle) and read it back; hard cases reset to a
    known baseline (verify FAILS) and require the agent to change node_types / location+view modes. cleanup
    restores shipped defaults. Node types present on this site include article and page.'
questions:
- id: sharethis-where-and-how
  input: How do I control where the ShareThis buttons appear on my Drupal site, and which config key decides
    between rendering them inside node content, per view mode, or via a block?
  criteria: 'The sharethis.settings ''location'' key: ''content'' renders buttons as an extra field inside
    node content, ''links'' renders them per enabled view mode (sharethisnodes.<bundle>.<view_mode>),
    and any other value means render nothing on nodes and place the Sharethis block instead. node_types
    selects which content types get buttons. Config form: /admin/config/services/sharethis.'
  bundle: sharethis
  rubric_ref: rubric/sharethis_sharethis_where_and_how@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: sharethis-blocks-and-views
  input: Besides rendering on nodes, what blocks and Views field does the ShareThis module provide for
    placing share buttons elsewhere?
  criteria: Two block plugins — sharethis_block (shares the current page) and sharethis_widget_block (shares
    a fixed path/URL you configure) — plus a Views field plugin sharethis_node that adds a share-buttons
    column to a view.
  bundle: sharethis
  rubric_ref: rubric/sharethis_sharethis_blocks_and_views@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: sharethis-permission-route
  input: What permission gates the ShareThis configuration form, and at what route/path is that form?
  criteria: The 'administer sharethis' permission gates the settings form at route sharethis.configuration_form,
    path /admin/config/services/sharethis.
  bundle: sharethis
  rubric_ref: rubric/sharethis_sharethis_permission_route@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: sharethis-known-location
  input: This Drupal site already has ShareThis configured. Inspect the live configuration and tell me
    how the share buttons are being placed (the 'location' setting).
  criteria: The location is set to 'links', meaning buttons render per enabled view mode (sharethis.settings.location
    = links) rather than inside node content.
  bundle: sharethis
  rubric_ref: rubric/sharethis_sharethis_known_location@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/sharethis-location-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/sharethis-location-cleanup.sh
- id: sharethis-known-twitter
  input: On this site, ShareThis has a Twitter handle configured that gets appended to tweets. Inspect
    the live configuration and tell me what it is.
  criteria: The configured Twitter handle is 'drupalnews' (sharethis.settings.twitter_handle = drupalnews).
  bundle: sharethis
  rubric_ref: rubric/sharethis_sharethis_known_twitter@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/sharethis-twitter-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/sharethis-twitter-cleanup.sh
- id: sharethis-only-article
  input: Right now the ShareThis buttons show on both my Article and Basic page content. I only want them
    on Articles. Configure ShareThis on this site so the buttons appear on articles but not on pages.
  criteria: 'In sharethis.settings.node_types keep ''article'' enabled and disable/remove ''page'' (e.g.
    node_types = {article: article}).'
  bundle: sharethis
  rubric_ref: rubric/sharethis_sharethis_only_article@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: site-owner
    reset: agent-module-documentation/evaluation/verify/sharethis-only-article-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/sharethis-only-article-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/sharethis-only-article-verify.sh
- id: sharethis-teaser-links
  input: On this Drupal site, configure ShareThis to render buttons per view mode (location 'links') and
    enable them on the Article content type's 'teaser' view mode. Apply the change to the live site.
  criteria: 'Set sharethis.settings.location to ''links'' and enable the article teaser view mode: sharethisnodes.article.teaser
    = teaser (a truthy value).'
  bundle: sharethis
  rubric_ref: rubric/sharethis_sharethis_teaser_links@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/sharethis-teaser-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/sharethis-teaser-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/sharethis-teaser-verify.sh
