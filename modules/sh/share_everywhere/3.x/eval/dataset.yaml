metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: share_everywhere
  version: 3.x
  note: 'Share Everywhere adds themeable social share buttons driven by one config object share_everywhere.settings
    (form route share_everywhere.config_form at /admin/config/services/share_everywhere, permission ''administer
    share everywhere''). Buttons: facebook_like, facebook_share, twitter (renders via se-x/X), linkedin,
    messenger, viber, whatsapp, copy. Top-level keys include alignment (left/right), title, display_title,
    collapsible, location (content|links), include_css/include_js, content_types, view_modes, per_entity,
    enabled_entities. Buttons appear as the extra field ''share_everywhere'' on node/commerce_product
    displays, via block share_everywhere_block, or Views field share_everywhere_field. No plugin types,
    no Drush. Medium/hard cases are grounded in real config keys read/written on the live site; scripts
    restore shipped defaults explicitly.'
questions:
- id: share_everywhere-configure
  input: I enabled the share_everywhere module on Drupal 11. Where do I configure it (route/path), what
    config object stores the settings, and which permission guards the form?
  criteria: Configure at /admin/config/services/share_everywhere (route share_everywhere.config_form,
    permission 'administer share everywhere'). All settings live in the config object share_everywhere.settings.
  bundle: share_everywhere
  rubric_ref: rubric/share_everywhere_share_everywhere_configure@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: share_everywhere-placement
  input: What are the ways share_everywhere can place its social share buttons on a Drupal site (block,
    field, etc.)?
  criteria: 'Four ways: as the extra field ''share_everywhere'' on node/commerce_product view displays
    (location=content), in the node links area (location=links), via the ''Share Everywhere Block'' (share_everywhere_block),
    and via the Views field share_everywhere_field.'
  bundle: share_everywhere
  rubric_ref: rubric/share_everywhere_share_everywhere_placement@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: share_everywhere-networks
  input: Which social networks / share actions does the share_everywhere module provide buttons for?
  criteria: Facebook like and Facebook share, Twitter/X, LinkedIn, Messenger, Viber, WhatsApp, and Copy
    URL.
  bundle: share_everywhere
  rubric_ref: rubric/share_everywhere_share_everywhere_networks@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: share_everywhere-known-alignment
  input: On this Drupal site the share_everywhere buttons have been customised. Inspect the live configuration
    and tell me the current button alignment, and whether the WhatsApp button is enabled.
  criteria: In share_everywhere.settings alignment is 'right' and buttons.whatsapp.enabled is 0 (WhatsApp
    disabled). Read via drush cget share_everywhere.settings.
  bundle: share_everywhere
  rubric_ref: rubric/share_everywhere_share_everywhere_known_alignment@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/share_everywhere-known-alignment-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/share_everywhere-known-alignment-cleanup.sh
- id: share_everywhere-known-title
  input: The share_everywhere buttons block on this site has a custom heading configured. Inspect the
    running configuration and state the exact title text set for Share Everywhere.
  criteria: In share_everywhere.settings the title is 'SE_Custom_Heading' (display_title is on). Read
    via drush cget share_everywhere.settings title.
  bundle: share_everywhere
  rubric_ref: rubric/share_everywhere_share_everywhere_known_title@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/share_everywhere-known-title-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/share_everywhere-known-title-cleanup.sh
- id: share_everywhere-disable-buttons
  input: On this Drupal site, configure share_everywhere to DISABLE the WhatsApp and Viber share buttons
    and set the button alignment to 'right'. Apply the change to the live site.
  criteria: In share_everywhere.settings set buttons.whatsapp.enabled=0, buttons.viber.enabled=0 and alignment='right'
    (via the settings form or drush/configFactory).
  bundle: share_everywhere
  rubric_ref: rubric/share_everywhere_share_everywhere_disable_buttons@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/share_everywhere-disable-buttons-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/share_everywhere-disable-buttons-reset.sh
    verify: agent-module-documentation/evaluation/verify/share_everywhere-disable-buttons-verify.sh
- id: share_everywhere-per-entity-title
  input: On this Drupal site, configure share_everywhere to enable per-entity opt-in (so editors can toggle
    share buttons on individual nodes) and set the buttons heading title to exactly 'Share this'. Apply
    the change to the live site.
  criteria: In share_everywhere.settings set per_entity=1 (truthy) and title='Share this'.
  bundle: share_everywhere
  rubric_ref: rubric/share_everywhere_share_everywhere_per_entity_title@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/share_everywhere-per-entity-title-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/share_everywhere-per-entity-title-reset.sh
    verify: agent-module-documentation/evaluation/verify/share_everywhere-per-entity-title-verify.sh
