rubrics:
- id: sharedemail_sharedemail_what_it_does
  version: '1.0'
  applicable_bundles:
  - sharedemail
  checks:
  - kind: must_contain_any
    values:
    - UserMailUnique
    - SharedEmailUnique
    - unique constraint
    - uniqueness
  scoring:
    combine: all_pass
- id: sharedemail_sharedemail_where_configured
  version: '1.0'
  applicable_bundles:
  - sharedemail
  checks:
  - kind: must_contain_any
    values:
    - /admin/config/people/shared-email
    - sharedemail_allowed
    - sharedemail_msg
  scoring:
    combine: all_pass
- id: sharedemail_sharedemail_bypass_permission
  version: '1.0'
  applicable_bundles:
  - sharedemail
  checks:
  - kind: must_contain_any
    values:
    - create shared email account
  scoring:
    combine: all_pass
- id: sharedemail_sharedemail_known_allowlist
  version: '1.0'
  applicable_bundles:
  - sharedemail
  checks:
  - kind: must_contain_any
    values:
    - vip-sharedemail@example.com
  scoring:
    combine: all_pass
- id: sharedemail_sharedemail_known_message
  version: '1.0'
  applicable_bundles:
  - sharedemail
  checks:
  - kind: must_contain_any
    values:
    - SHAREDEMAIL_KNOWN_MSG_7F3
  scoring:
    combine: all_pass
- id: sharedemail_sharedemail_set_allowlist
  version: '1.0'
  applicable_bundles:
  - sharedemail
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
- id: sharedemail_sharedemail_set_message
  version: '1.0'
  applicable_bundles:
  - sharedemail
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
