rubrics:
- id: shariff_shariff_placement
  version: '1.0'
  applicable_bundles:
  - shariff
  checks:
  - kind: must_contain_any
    values:
    - block
    - shariff_block
    - shariff_field
    - extra field
    - display
    - Manage display
  scoring:
    combine: all_pass
- id: shariff_shariff_config_object
  version: '1.0'
  applicable_bundles:
  - shariff
  checks:
  - kind: must_contain_any
    values:
    - shariff.settings
    - /admin/config/services/shariff
    - shariff.settings_form
  scoring:
    combine: all_pass
- id: shariff_shariff_keys
  version: '1.0'
  applicable_bundles:
  - shariff
  checks:
  - kind: must_contain_any
    values:
    - shariff_services
    - shariff_css
  scoring:
    combine: all_pass
- id: shariff_shariff_known_services
  version: '1.0'
  applicable_bundles:
  - shariff
  checks:
  - kind: must_contain_any
    values:
    - whatsapp
    - telegram
    - reddit
  scoring:
    combine: all_pass
- id: shariff_shariff_orientation_style
  version: '1.0'
  applicable_bundles:
  - shariff
  checks:
  - kind: must_contain_any
    values:
    - vertical
    - icon
  scoring:
    combine: all_pass
- id: shariff_shariff_set_services
  version: '1.0'
  applicable_bundles:
  - shariff
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
- id: shariff_shariff_enable_field
  version: '1.0'
  applicable_bundles:
  - shariff
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
