metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: shariff
  version: 2.0.x
  note: 'Shariff integrates the privacy-friendly heise online share widget. All global options live in
    the config object shariff.settings, edited at /admin/config/services/shariff (route shariff.settings_form,
    permission ''administer site configuration''). Shipped defaults: shariff_services {twitter, facebook},
    shariff_theme colored, shariff_css complete, shariff_orientation horizontal. Buttons are placed either
    as a block (plugin id shariff_block) or as an extra node display field shariff_field (added to every
    node type by hook_entity_extra_field_info, enable on Manage display). Medium cases write known values
    into shariff.settings and ask the agent to read them back; hard cases require the agent to reconfigure
    the services/theme and to enable the shariff_field on the Article view display, verified against live
    config. Cleanups restore the shipped defaults explicitly (State is unreliable on this shared site).
    The external Shariff JS library is not required for any of these config-level checks.'
questions:
- id: shariff-placement
  input: I installed the Drupal shariff module and want to show the share buttons. What are the two ways
    the module lets me place the Shariff buttons on a page?
  criteria: Either place the 'Shariff share buttons' block (plugin shariff_block) via Block layout, or
    enable the shariff_field extra field on a node type's Manage display (it shares the node's URL and
    title).
  bundle: shariff
  rubric_ref: rubric/shariff_shariff_placement@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: shariff-config-object
  input: Where are the global Shariff settings stored and what is the admin path to configure them on
    a Drupal site?
  criteria: Global settings are in the config object shariff.settings, edited on the settings form shariff.settings_form
    at /admin/config/services/shariff (requires 'administer site configuration').
  bundle: shariff
  rubric_ref: rubric/shariff_shariff_config_object@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: shariff-keys
  input: Which shariff.settings keys control the active social services and the CSS variant of the Shariff
    buttons, and what are the CSS variant options?
  criteria: shariff_services (a map of active service ids) sets the buttons shown; shariff_css sets the
    CSS variant with options complete, min, and naked.
  bundle: shariff
  rubric_ref: rubric/shariff_shariff_keys@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: shariff-known-services
  input: On this Drupal site, inspect the live Shariff configuration and report which social services
    are currently enabled and which theme is set.
  criteria: shariff.settings has shariff_services = {whatsapp, telegram, reddit} and shariff_theme = grey.
  bundle: shariff
  rubric_ref: rubric/shariff_shariff_known_services@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/shariff-known-services-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/shariff-known-services-cleanup.sh
- id: shariff-orientation-style
  input: On this Drupal site, inspect the live Shariff configuration and report how the buttons are oriented
    and which button style is configured.
  criteria: shariff.settings has shariff_orientation = vertical and shariff_button_style = icon.
  bundle: shariff
  rubric_ref: rubric/shariff_shariff_orientation_style@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/shariff-orientation-style-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/shariff-orientation-style-cleanup.sh
- id: shariff-set-services
  input: On this Drupal site, configure the global Shariff settings so the share buttons include LinkedIn
    and E-Mail (in addition to whatever is there), and set the button theme to white. Apply the change
    to the live site.
  criteria: shariff.settings shariff_services contains both 'linkedin' and 'mail', and shariff_theme is
    'white'.
  bundle: shariff
  rubric_ref: rubric/shariff_shariff_set_services@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/shariff-set-services-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/shariff-set-services-reset.sh
    verify: agent-module-documentation/evaluation/verify/shariff-set-services-verify.sh
- id: shariff-enable-field
  input: On my Drupal site I want the social share buttons to appear on every Article page automatically
    (not as a block). Using the Shariff module, turn on the Shariff sharing buttons for the Article content
    type's display. Apply the change to the live site.
  criteria: The shariff_field extra field is enabled as a component on core.entity_view_display.node.article.default
    (e.g. via Manage display or setComponent('shariff_field', ...)).
  bundle: shariff
  rubric_ref: rubric/shariff_shariff_enable_field@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: layman
    reset: agent-module-documentation/evaluation/verify/shariff-enable-field-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/shariff-enable-field-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/shariff-enable-field-verify.sh
