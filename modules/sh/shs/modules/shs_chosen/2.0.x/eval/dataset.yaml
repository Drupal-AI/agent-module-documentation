metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: shs_chosen
  version: 2.0.x
  note: shs_chosen is a submodule of shs that layers the Chosen jQuery plugin onto the SHS cascading dropdowns
    via a subclassed widget and Backbone view overrides. Cases are `recipe` (response-graded) probing
    documented facts; no site mutation.
questions:
- id: shs-chosen-widget
  input: I already use the SHS cascading taxonomy widget but want each level dropdown to be a searchable
    Chosen box. Which module/widget do I switch to and what must be enabled?
  criteria: 'Enable the shs_chosen submodule (which needs both shs and the chosen module) and set the
    field''s form-display widget to ''Simple hierarchical select: Chosen'' (options_shs_chosen).'
  bundle: shs_chosen
  rubric_ref: rubric/shs_chosen_shs_chosen_widget@1.0
  tags:
  - mode:recipe
- id: shs-chosen-dependencies
  input: What are the module dependencies of shs_chosen?
  criteria: It depends on shs:shs and chosen:chosen — both the Simple Hierarchical Select module and the
    contrib Chosen module must be enabled.
  bundle: shs_chosen
  rubric_ref: rubric/shs_chosen_shs_chosen_dependencies@1.0
  tags:
  - mode:recipe
- id: shs-chosen-override
  input: How do I give one SHS Chosen field its own Chosen settings instead of using the site-wide Chosen
    configuration?
  criteria: Check the chosen_override setting on the options_shs_chosen widget; then the chosen_settings
    group (disable_search, search_contains, placeholder texts, no_results_text) is used for that field
    instead of the global chosen.settings config.
  bundle: shs_chosen
  rubric_ref: rubric/shs_chosen_shs_chosen_override@1.0
  tags:
  - mode:recipe
- id: shs-chosen-settings-keys
  input: Which per-field Chosen setting hides the search box, and which one lets a search match text in
    the middle of a word?
  criteria: chosen_settings.disable_search hides the Chosen search box; chosen_settings.search_contains
    makes the search match anywhere in a word.
  bundle: shs_chosen
  rubric_ref: rubric/shs_chosen_shs_chosen_settings_keys@1.0
  tags:
  - mode:recipe
- id: shs-chosen-how-applied
  input: How does shs_chosen actually apply Chosen to the SHS widget without rewriting it? Name what it
    swaps.
  criteria: It implements hook_shs_class_definitions_alter to swap the Backbone view classes to Drupal.shs_chosen.ChosenAppView
    / ChosenWidgetView and adds a display.chosen JS settings block, so the existing SHS cascade is enhanced
    by Chosen; it also swaps the Views term-filter classes.
  bundle: shs_chosen
  rubric_ref: rubric/shs_chosen_shs_chosen_how_applied@1.0
  tags:
  - mode:recipe
- id: shs-chosen-views
  input: Does the Chosen styling also apply to SHS exposed filters in Views?
  criteria: Yes — shs_chosen_views_plugins_filter_alter swaps the SHS taxonomy_index_tid / taxonomy_index_tid_depth
    filter classes to the ShsChosenTaxonomyIndexTid* variants, so exposed hierarchical Views filters get
    Chosen too.
  bundle: shs_chosen
  rubric_ref: rubric/shs_chosen_shs_chosen_views@1.0
  tags:
  - mode:recipe
