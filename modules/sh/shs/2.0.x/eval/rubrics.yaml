rubrics:
- id: shs_shs_enable_widget
  version: '1.0'
  applicable_bundles:
  - shs
  checks:
  - kind: must_contain_any
    values:
    - options_shs
    - Simple hierarchical select
  scoring:
    combine: all_pass
- id: shs_shs_children_endpoint
  version: '1.0'
  applicable_bundles:
  - shs
  checks:
  - kind: must_contain_any
    values:
    - shs-term-data
    - shs.term_data
    - getTermData
    - ShsController
  scoring:
    combine: all_pass
- id: shs_shs_force_deepest
  version: '1.0'
  applicable_bundles:
  - shs
  checks:
  - kind: must_contain_any
    values:
    - force_deepest
  scoring:
    combine: all_pass
- id: shs_shs_render_element_truth
  version: '1.0'
  applicable_bundles:
  - shs
  checks:
  - kind: must_contain_any
    values:
    - textfield
    - no render element
    - shs-enabled
    - drupalSettings
  scoring:
    combine: all_pass
- id: shs_shs_taxonomy_dependency
  version: '1.0'
  applicable_bundles:
  - shs
  checks:
  - kind: must_contain_any
    values:
    - taxonomy
  scoring:
    combine: all_pass
- id: shs_shs_views_filter
  version: '1.0'
  applicable_bundles:
  - shs
  checks:
  - kind: must_contain_any
    values:
    - taxonomy_index_tid
    - Has taxonomy terms
    - hook_views_plugins_filter_alter
  scoring:
    combine: all_pass
- id: shs_shs_alter_term_data
  version: '1.0'
  applicable_bundles:
  - shs
  checks:
  - kind: must_contain_any
    values:
    - hook_shs_term_data_alter
    - shs_term_data_alter
  scoring:
    combine: all_pass
- id: shs_shs_formatter
  version: '1.0'
  applicable_bundles:
  - shs
  checks:
  - kind: must_contain_any
    values:
    - entity_reference_shs
    - Simple hierarchical select
  scoring:
    combine: all_pass
