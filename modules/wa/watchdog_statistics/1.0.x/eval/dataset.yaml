  input: On this site the watchdog_statistics 'Log messages statistics' report is served by the page display
    of the watchdog_statistics View at admin/reports/dblog/statistics. Move that report page to admin/reports/dblog/stats
    instead, and apply the change to the live site.
  criteria: In views.view.watchdog_statistics the page display's path is set to admin/reports/dblog/stats.
  bundle: watchdog_statistics
