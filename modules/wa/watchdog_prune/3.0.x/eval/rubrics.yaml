rubrics:
- id: watchdog_prune_watchdog_prune_when_and_keys
  version: '1.0'
  applicable_bundles:
  - watchdog_prune
  checks:
  - kind: must_contain_any
    values:
    - cron
    - watchdog_prune_age
    - watchdog_prune_cron
  scoring:
    combine: all_pass
- id: watchdog_prune_watchdog_prune_core_prereq
  version: '1.0'
  applicable_bundles:
  - watchdog_prune
  checks:
  - kind: must_contain_any
    values:
    - All
    - Database log messages to keep
    - row_limit
    - '0'
  scoring:
    combine: all_pass
- id: watchdog_prune_watchdog_prune_per_type_format
  version: '1.0'
  applicable_bundles:
  - watchdog_prune
  checks:
  - kind: must_contain_any
    values:
    - watchdog_prune_age_type
    - php|-1 MONTH
    - type|age
    - '|'
  scoring:
    combine: all_pass
- id: watchdog_prune_watchdog_prune_read_age
  version: '1.0'
  applicable_bundles:
  - watchdog_prune
  checks:
  - kind: must_contain_any
    values:
    - -6 MONTHS
    - 6 months
    - 6 MONTH
  scoring:
    combine: all_pass
- id: watchdog_prune_watchdog_prune_read_type_rule
  version: '1.0'
  applicable_bundles:
  - watchdog_prune
  checks:
  - kind: must_contain_any
    values:
    - php
    - -1 MONTH
    - 1 month
  scoring:
    combine: all_pass
- id: watchdog_prune_watchdog_prune_set_global_age
  version: '1.0'
  applicable_bundles:
  - watchdog_prune
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
- id: watchdog_prune_watchdog_prune_set_type_rule
  version: '1.0'
  applicable_bundles:
  - watchdog_prune
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
