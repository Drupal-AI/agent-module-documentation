metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: warmer
  version: 2.0.x
  note: 'Warmer is a cache-warming framework: it defines the `warmer` plugin type (@Warmer annotation,
    plugin.manager.warmer manager, Plugin/warmer discovery dir, WarmerPluginBase base class) and stores
    every warmer''s settings in one config object, warmer.settings (key `warmers`, keyed by plugin id,
    each with frequency + batchSize plus plugin-specific keys). It ships no warmers itself — concrete
    ones come from warmer_entity (id `entity`) and warmer_cdn (ids `cdn`, `sitemap`). Easy cases are response-graded
    (no site changes). Medium cases stage a known warmer config in warmer.settings and ask the agent to
    read it back live (cleanup restores warmers: []). Hard cases have the agent configure the entity warmer''s
    frequency/batchSize, verified against live config (exit 0 = pass). Config is empty by default so reset
    just clears warmer.settings:warmers.'
questions:
- id: warmer-plugin-type
  input: In the Drupal Warmer module, what plugin type does it define for cache warmers? Name the annotation,
    the plugin manager service, the discovery directory, and the base class a warmer should extend.
  criteria: 'Warmer defines the `warmer` plugin type: annotation @Warmer (Drupal\warmer\Annotation\Warmer),
    manager service plugin.manager.warmer (WarmerPluginManager), discovery directory src/Plugin/warmer/,
    interface WarmerInterface, and base class WarmerPluginBase (which a plugin should extend).'
  bundle: warmer
  rubric_ref: rubric/warmer_warmer_plugin_type@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: warmer-drush-warm
  input: On a Drupal site with the Warmer module, which Drush command warms the caches for a given warmer,
    and how do you make it populate the cache immediately instead of waiting for cron?
  criteria: drush warmer:enqueue <ids> (alias warmer-enqueue) enqueues the named warmers (comma-separated
    plugin IDs). Add --run-queue to drain the `warmer` queue right away so items land in cache immediately;
    otherwise they are processed later by the queue worker on cron (drush queue:run warmer).
  bundle: warmer
  rubric_ref: rubric/warmer_warmer_drush_warm@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: warmer-config
  input: Where does the Warmer module store each warmer's configuration, and what two settings does every
    warmer share? Give the config object name and the keys.
  criteria: All warmers share one config object, warmer.settings, under the key `warmers` (a sequence
    keyed by plugin id). Every warmer has `frequency` (seconds between automatic re-enqueues; default
    300) and `batchSize` (items per batch; default 50), e.g. warmer.settings:warmers.entity.frequency.
  bundle: warmer
  rubric_ref: rubric/warmer_warmer_config@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: warmer-known-entity-config
  input: This Drupal site already has the Warmer module's Entity warmer configured. Inspect the live configuration
    and report its frequency (in seconds) and its batch size.
  criteria: warmer.settings:warmers.entity has frequency 900 and batchSize 25 (it also warms node:article,
    published only).
  bundle: warmer
  rubric_ref: rubric/warmer_warmer_known_entity_config@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/warmer-entity-frequency-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/warmer-entity-frequency-cleanup.sh
- id: warmer-known-cdn-config
  input: The Warmer module's CDN warmer is configured on this site. Inspect the live configuration and
    report which URL(s) it will warm and how often (frequency in seconds).
  criteria: warmer.settings:warmers.cdn is set to warm https://example.com/warm-me (and /about) with frequency
    600 and batchSize 10.
  bundle: warmer
  rubric_ref: rubric/warmer_warmer_known_cdn_config@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/warmer-cdn-urls-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/warmer-cdn-urls-cleanup.sh
- id: warmer-configure-entity-layman
  input: On this Drupal site, I want the Warmer module's Entity cache warmer to refresh only once an hour
    instead of every few minutes, and to process 100 items at a time. Set that up.
  criteria: warmer.settings:warmers.entity.frequency is set to 3600 and warmers.entity.batchSize is set
    to 100.
  bundle: warmer
  rubric_ref: rubric/warmer_warmer_configure_entity_layman@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/warmer-configure-entity-reset.sh
    verify: agent-module-documentation/evaluation/verify/warmer-configure-entity-verify.sh
- id: warmer-configure-entity-expert
  input: 'Configure the Warmer module''s entity warmer on this site: set warmer.settings warmers.entity.frequency
    to 3600 and warmers.entity.batchSize to 100. Leave the other warmers alone.'
  criteria: warmer.settings:warmers.entity.frequency == 3600 and warmers.entity.batchSize == 100.
  bundle: warmer
  rubric_ref: rubric/warmer_warmer_configure_entity_expert@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/warmer-configure-entity-reset.sh
    verify: agent-module-documentation/evaluation/verify/warmer-configure-entity-verify.sh
