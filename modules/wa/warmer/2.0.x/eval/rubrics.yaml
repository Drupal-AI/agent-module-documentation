rubrics:
- id: warmer_warmer_plugin_type
  version: '1.0'
  applicable_bundles:
  - warmer
  checks:
  - kind: must_contain_any
    values:
    - '@Warmer'
    - WarmerPluginBase
    - plugin.manager.warmer
    - Plugin/warmer
  scoring:
    combine: all_pass
- id: warmer_warmer_drush_warm
  version: '1.0'
  applicable_bundles:
  - warmer
  checks:
  - kind: must_contain_any
    values:
    - warmer:enqueue
    - warmer-enqueue
  scoring:
    combine: all_pass
- id: warmer_warmer_config
  version: '1.0'
  applicable_bundles:
  - warmer
  checks:
  - kind: must_contain_any
    values:
    - warmer.settings
  scoring:
    combine: all_pass
- id: warmer_warmer_known_entity_config
  version: '1.0'
  applicable_bundles:
  - warmer
  checks:
  - kind: must_contain_any
    values:
    - '900'
  scoring:
    combine: all_pass
- id: warmer_warmer_known_cdn_config
  version: '1.0'
  applicable_bundles:
  - warmer
  checks:
  - kind: must_contain_any
    values:
    - https://example.com/warm-me
  scoring:
    combine: all_pass
- id: warmer_warmer_configure_entity_layman
  version: '1.0'
  applicable_bundles:
  - warmer
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
- id: warmer_warmer_configure_entity_expert
  version: '1.0'
  applicable_bundles:
  - warmer
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
