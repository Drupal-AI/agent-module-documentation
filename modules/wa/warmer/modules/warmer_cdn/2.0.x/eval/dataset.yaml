metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: warmer_cdn
  version: 2.0.x
  note: 'Submodule of warmer. Provides two @Warmer plugins: `cdn` (CdnWarmer — HTTP GET a configured URL
    list) and `sitemap` (SitemapWarmer — collect URLs from XML sitemaps via vipnytt/sitemapparser, then
    warm via CDN). Shared extra settings: headers, verify (SSL), maxConcurrentRequests; cdn adds `urls`,
    sitemap adds `sitemaps` + `minPriority`. Config at warmer.settings:warmers.cdn / warmers.sitemap.
    No routes/permissions/services/Drush of its own. Cases are `recipe` (response-graded); no site mutation.'
questions:
- id: warmer-cdn-plugin-ids
  input: What two warmer plugins does the Warmer module's CDN Warmer submodule provide, and what does
    each one warm?
  criteria: 'Two @Warmer plugins: `cdn` (CdnWarmer) issues HTTP GET requests to a configured list of URLs,
    and `sitemap` (SitemapWarmer) collects URLs from one or more XML sitemaps and warms those. Both warm
    CDN edge caches as well as Varnish and Drupal''s Page Cache.'
  bundle: warmer_cdn
  rubric_ref: rubric/warmer_cdn_warmer_cdn_plugin_ids@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: warmer-cdn-settings
  input: Which settings control the CDN warmer's requests — for example, the URLs it fetches, whether
    SSL is verified, custom headers, and how many requests run at once? Where is its config stored?
  criteria: The cdn warmer's config (warmer.settings:warmers.cdn) has `urls` (the URL list), `headers`
    (custom request headers), `verify` (SSL certificate verification on/off), and `maxConcurrentRequests`
    (parallel requests, default 10), plus the shared frequency and batchSize.
  bundle: warmer_cdn
  rubric_ref: rubric/warmer_cdn_warmer_cdn_settings@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: warmer-cdn-sitemap-priority
  input: How do you make the Warmer CDN submodule warm every URL in your XML sitemap, and how can you
    limit it to only the most important URLs?
  criteria: 'Use the `sitemap` warmer: set its `sitemaps` list to your sitemap URL(s) and it parses and
    warms those URLs. Limit it to important pages with `minPriority` — only sitemap URLs whose <priority>
    is at or above that value are warmed.'
  bundle: warmer_cdn
  rubric_ref: rubric/warmer_cdn_warmer_cdn_sitemap_priority@1.0
  tags:
  - mode:recipe
  - difficulty:easy
