questions:
- id: warmer-entity-plugin-id
  input: In the Warmer module's Entity Warmer submodule, what is the warmer plugin's id, and how do you
    warm it from Drush?
  criteria: The plugin id is `entity` (the EntityWarmer plugin). Warm it with `drush warmer:enqueue entity`
    (add --run-queue to populate the cache immediately).
  bundle: warmer_entity
  rubric_ref: rubric/warmer_entity_warmer_entity_plugin_id@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: warmer-entity-settings
  input: Which extra settings does the Entity warmer add beyond the shared frequency and batch size, and
    where is its configuration stored?
  criteria: It adds `entity_types` (a list of entity_type_id:bundle pairs to warm) and `published_only`
    (warm only published entities). Config is stored at warmer.settings:warmers.entity.
  bundle: warmer_entity
  rubric_ref: rubric/warmer_entity_warmer_entity_settings@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: warmer-entity-what-it-warms
  input: What cache does the Entity Warmer submodule warm, and how does it do it?
  criteria: 'It warms Drupal''s entity cache: for each selected entity_type:bundle it queries the matching
    entity IDs and loads them via the entity storage loadMultiple(), which populates the persistent entity
    cache (it resets the in-memory static cache between types).'
  bundle: warmer_entity
  rubric_ref: rubric/warmer_entity_warmer_entity_what_it_warms@1.0
  tags:
  - mode:recipe
  - difficulty:easy
