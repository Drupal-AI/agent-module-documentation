metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: warmer_entity
  version: 2.0.x
  note: Submodule of warmer. Provides one @Warmer plugin, id `entity` (EntityWarmer), that warms the entity
    cache for selected entity_type:bundle pairs. Adds settings entity_types and published_only on top
    of the shared frequency/batchSize; config lives at warmer.settings:warmers.entity. No routes/permissions/services/Drush
