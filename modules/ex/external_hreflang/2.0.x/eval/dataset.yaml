  criteria: The global metatag defaults set tags.hreflang_external to 'en-us|https://global.exthreflang-probe.example'
    (drush cget metatag.metatag_defaults.global).
  bundle: external_hreflang
  rubric_ref: rubric/external_hreflang_external_hreflang_known_global@1.0
