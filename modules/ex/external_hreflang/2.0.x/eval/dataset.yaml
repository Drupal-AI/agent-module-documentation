metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: external_hreflang
  version: 2.0.x
  note: 'External Hreflang adds a single Metatag tag plugin, id ''hreflang_external'' (label ''External
    Hreflang'', group advanced, multiple=TRUE), for declaring rel=alternate hreflang links to OTHER domains.
    It has no admin page of its own - you set it inside Metatag. Value syntax is one alternate per line,
    langcode|url (tokens supported). Values are stored where Metatag stores tags: the metatag_defaults
    config entities (global, front, node, node__article, ...) under tags.hreflang_external, or on an entity''s
    metatag field. output() emits <link rel=alternate hreflang=code href=url>. It also feeds hook_simple_sitemap_links_alter().
    Requires the metatag module. Medium/hard cases are grounded in the real metatag_defaults ''global''
    tags.hreflang_external config.'
questions:
- id: external_hreflang-syntax
  input: Using the External Hreflang Drupal module, how do I add an alternate hreflang link pointing at
    a page on another domain, and what syntax do I enter in the field?
  criteria: It adds an 'External Hreflang' field to Metatag forms. Enter one alternate per line as langcode|url,
    e.g. en-US|https://us.example.com. Each line becomes <link rel="alternate" hreflang="en-US" href="https://us.example.com">.
  bundle: external_hreflang
  rubric_ref: rubric/external_hreflang_external_hreflang_syntax@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: external_hreflang-tag-and-dependency
  input: Which module does External Hreflang depend on and integrate with, and what is the Metatag tag
    id (and group) it provides?
  criteria: It requires and integrates with the Metatag module; it provides the Metatag tag plugin 'hreflang_external'
    (label 'External Hreflang') in the 'advanced' group, configured on any Metatag form. It has no configuration
    page of its own.
  bundle: external_hreflang
  rubric_ref: rubric/external_hreflang_external_hreflang_tag_and_dependency@1.0
  tags:
  - mode:recipe
  - difficulty:easy
