rubrics:
- id: expand_collapse_formatter_ecf_formatter_id
  version: '1.0'
  applicable_bundles:
  - expand_collapse_formatter
  checks:
  - kind: must_contain_any
    values:
    - expand_collapse_formatter
  scoring:
    combine: all_pass
- id: expand_collapse_formatter_ecf_field_types
  version: '1.0'
  applicable_bundles:
  - expand_collapse_formatter
  checks:
  - kind: must_contain_any
    values:
    - text_long
    - string_long
    - text_with_summary
  scoring:
    combine: all_pass
- id: expand_collapse_formatter_ecf_default_trim_length
  version: '1.0'
  applicable_bundles:
  - expand_collapse_formatter
  checks:
  - kind: must_contain_any
    values:
    - trim_length
    - '300'
  scoring:
    combine: all_pass
- id: expand_collapse_formatter_ecf_body_current_formatter
  version: '1.0'
  applicable_bundles:
  - expand_collapse_formatter
  checks:
  - kind: must_contain_any
    values:
    - expand_collapse_formatter
    - '250'
  scoring:
    combine: all_pass
- id: expand_collapse_formatter_ecf_body_link_text
  version: '1.0'
  applicable_bundles:
  - expand_collapse_formatter
  checks:
  - kind: must_contain_any
    values:
    - Read more
  scoring:
    combine: all_pass
- id: expand_collapse_formatter_ecf_configure_body
  version: '1.0'
  applicable_bundles:
  - expand_collapse_formatter
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
- id: expand_collapse_formatter_ecf_configure_body_layman
  version: '1.0'
  applicable_bundles:
  - expand_collapse_formatter
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
