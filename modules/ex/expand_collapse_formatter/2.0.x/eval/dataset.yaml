metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: expand_collapse_formatter
  version: 2.0.x
  note: 'Expand Collapse Formatter provides a single core @FieldFormatter plugin (id expand_collapse_formatter)
    for long-text fields; it has no settings form of its own (configure=null). Its entire persistent state
    is the formatter component in an entity_view_display config entity (settings key field.formatter.settings.expand_collapse_formatter).
    Easy cases probe documented facts (formatter id, field types, settings/defaults). Medium/hard cases
    are grounded in the real view-display config entity core.entity_view_display.node.article.default:
    introspection reads the formatter type + settings the setup script wrote onto the Article body; execution
    switches the Article body to this formatter with specific settings and verifies the live component.
    The reset restores the body to its core text_default formatter.'
questions:
- id: ecf-formatter-id
  input: On a Drupal 11 site I want a long text field to show trimmed with a JavaScript 'Show more / Show
    less' toggle. Which contrib module provides this, and what is the machine id of the field formatter
    I select on Manage display?
  criteria: Use the Expand Collapse Formatter module; select the formatter whose id is expand_collapse_formatter
    (label 'Expand collapse formatter') on the field's Manage display.
  bundle: expand_collapse_formatter
  rubric_ref: rubric/expand_collapse_formatter_ecf_formatter_id@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: ecf-field-types
  input: Which field types can the Expand collapse formatter (expand_collapse_formatter) be applied to?
    Can I use it on a plain single-line string field or an integer field?
  criteria: 'It supports the long/multi-line text field types only: text_long, string_long, text_with_summary
    and text_long_with_summary. It cannot be used on a single-line string field or an integer field.'
  bundle: expand_collapse_formatter
  rubric_ref: rubric/expand_collapse_formatter_ecf_field_types@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: ecf-default-trim-length
  input: In the Expand collapse formatter, which setting controls how much text is shown before it is
    truncated, what is its default value, and what is the default initial state of the field?
  criteria: The trim_length setting controls the truncation length; it defaults to 300 characters. The
    default_state setting defaults to 'collapsed'. The toggle link only appears when the field's text
    is longer than trim_length.
  bundle: expand_collapse_formatter
  rubric_ref: rubric/expand_collapse_formatter_ecf_default_trim_length@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: ecf-body-current-formatter
  input: On this Drupal site, which field formatter is currently configured for the Article content type's
    body field on its default view display, and what trim length is it set to? Inspect the live entity
    view display configuration to answer.
  criteria: The Article body field on core.entity_view_display.node.article.default uses the expand_collapse_formatter
    formatter with trim_length 250 (default_state collapsed, open link text 'Read more').
  bundle: expand_collapse_formatter
  rubric_ref: rubric/expand_collapse_formatter_ecf_body_current_formatter@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/expand_collapse_formatter-body-settings-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/expand_collapse_formatter-body-settings-cleanup.sh
- id: ecf-body-link-text
  input: The Article body field on this site uses the Expand collapse formatter. What is the 'Link text
    (open)' the toggle will display when the field is collapsed? Inspect the live view-display configuration
    for the exact string.
  criteria: The body component's expand_collapse_formatter settings have link_text_open = 'Read more'
    (and link_text_close = 'Read less') in core.entity_view_display.node.article.default.
  bundle: expand_collapse_formatter
  rubric_ref: rubric/expand_collapse_formatter_ecf_body_link_text@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/expand_collapse_formatter-body-settings-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/expand_collapse_formatter-body-settings-cleanup.sh
- id: ecf-configure-body
  input: On this Drupal site, configure the Article content type's default view display so the body field
    is rendered with the Expand Collapse Formatter (formatter id expand_collapse_formatter). Set its trim
    length to 150 and its default state to 'expanded'. Apply the change to the live site (config entity
    core.entity_view_display.node.article.default).
  criteria: In core.entity_view_display.node.article.default the body component has type expand_collapse_formatter
    with settings.trim_length = 150 and settings.default_state = 'expanded'.
  bundle: expand_collapse_formatter
  rubric_ref: rubric/expand_collapse_formatter_ecf_configure_body@1.0
  tags:
  - mode:execution
  - difficulty:hard
