metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: external_link_popup
  version: 2.0.x
  note: 'External Link Pop-up shows a confirmation dialog when a visitor clicks a link leaving the site.
    Pop-ups are external_link_popup config entities (fields id/name/status/weight/close/title/body[text_format]/labelyes/labelno/domains/new_tab).
    Global settings external_link_popup.settings hold whitelist (newline trusted domains), show_admin,
    width{value,units}. configure route external_link_popup.settings (/admin/config/content/external_link_popup/settings);
    pop-up CRUD at /admin/config/content/external_link_popup. Permission ''administer external link popup''.
    Domain matching: newline domains, domain.com matches *.domain.com, * matches all, weight order first
    match wins. Exclude a link with CSS class external-link-popup-disabled; force a pop-up with data-external-link-popup-id.
    No Drush, no plugin types. Medium/hard cases are grounded in real config entities + external_link_popup.settings.'
questions:
- id: external_link_popup-what-it-does
  input: What does the Drupal external_link_popup module do, and where do you configure it (the settings
    route and the pop-up list page)?
  criteria: It shows a confirmation dialog when a visitor clicks a link that leaves the site. Global settings
    are at route external_link_popup.settings (/admin/config/content/external_link_popup/settings) and
    pop-ups are managed at /admin/config/content/external_link_popup.
  bundle: external_link_popup
  rubric_ref: rubric/external_link_popup_external_link_popup_what_it_does@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: external_link_popup-exclude-link
  input: Using the Drupal external_link_popup module, how can I stop the pop-up from appearing for links
    to a whole trusted domain, and how can I stop it for one specific link?
  criteria: Add the domain to the Trusted domains (whitelist) in external_link_popup.settings to skip
    a whole domain (matches subdomains too). For a single link, add the CSS class external-link-popup-disabled
    to the <a> element.
  bundle: external_link_popup
  rubric_ref: rubric/external_link_popup_external_link_popup_exclude_link@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: external_link_popup-force-popup
  input: In the Drupal external_link_popup module, how do I force a particular pop-up to be shown on a
    specific link (even a local one), and how does the module decide which pop-up applies to an external
    domain?
  criteria: Add data-external-link-popup-id="<machine name>" to the link to force a specific pop-up (works
    for local links too, overriding domain matching except the disabled class). Otherwise pop-ups are
    matched by their Domains field (domain.com also matches *.domain.com, * matches all) in weight order,
    first match wins.
  bundle: external_link_popup
  rubric_ref: rubric/external_link_popup_external_link_popup_force_popup@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: external_link_popup-known-popup
  input: On this Drupal site there is an external_link_popup pop-up with machine name elp_known. Inspect
    the live configuration and state which external domain(s) it targets and its dialog title.
  criteria: 'elp_known targets the domain example.com and its title is ''Leaving For Example'' (config
    external_link_popup.external_link_popup.elp_known: domains ''example.com'').'
  bundle: external_link_popup
  rubric_ref: rubric/external_link_popup_external_link_popup_known_popup@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/external_link_popup-known-popup-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/external_link_popup-known-popup-cleanup.sh
- id: external_link_popup-whitelist-value
  input: On this Drupal site, the external_link_popup global settings have a trusted-domains whitelist
    configured. Inspect the live configuration and state which domain is currently whitelisted (exempt
    from pop-ups).
  criteria: The whitelist in external_link_popup.settings is 'trusted-partner.test', so links to that
    domain (and its subdomains) show no pop-up.
  bundle: external_link_popup
  rubric_ref: rubric/external_link_popup_external_link_popup_whitelist_value@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/external_link_popup-whitelist-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/external_link_popup-whitelist-cleanup.sh
- id: external_link_popup-create-popup
  input: On this Drupal site, create a new External Link Pop-up with machine name elp_task and label 'Task
    Popup', enabled, whose dialog title is exactly 'Warning' and which targets the external domain example.org.
    Apply the change to the live site.
  criteria: An external_link_popup config entity elp_task exists (config external_link_popup.external_link_popup.elp_task),
    status enabled, title 'Warning', domains including example.org - created via the pop-up Add form or
    ExternalLinkPopup::create([...])->save().
  bundle: external_link_popup
  rubric_ref: rubric/external_link_popup_external_link_popup_create_popup@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/external_link_popup-create-popup-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/external_link_popup-create-popup-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/external_link_popup-create-popup-verify.sh
- id: external_link_popup-add-whitelist
  input: On this Drupal site, configure external_link_popup so that links to the domain trusted-charity.test
    never trigger a pop-up (add it to the trusted-domains whitelist). Apply the change to the live site.
  criteria: The whitelist string in external_link_popup.settings now contains trusted-charity.test (set
    via the settings form Trusted domains field, or drush/config editing external_link_popup.settings:whitelist).
  bundle: external_link_popup
  rubric_ref: rubric/external_link_popup_external_link_popup_add_whitelist@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/external_link_popup-add-whitelist-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/external_link_popup-add-whitelist-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/external_link_popup-add-whitelist-verify.sh
