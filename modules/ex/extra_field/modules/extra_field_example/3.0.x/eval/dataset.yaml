metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: extra_field_example
  version: 3.0.x
  note: 'Extra Field Example is the demo submodule of extra_field. It ships only plugin classes: ExtraFieldDisplay
    ids all_nodes (node.*, weight -30, visible), article_only (node.article - declared twice, by ExampleArticle
    and ExampleWithDependencyInjection), formatted_field (ExtraFieldDisplayFormattedBase, label ''Three
    items''), multilingual_field (''Concatenated tags'', reads field_tags); ExtraFieldForm ids example_markup
    (node.*, visible), example_custom_submit (node.*, weight 100, visible) and example_custom_input (user.user,
    visible, needs a non-core ''voucher'' entity type). It has no config, no services and no routes, so
    every medium/hard case turns on whether the submodule is installed and which extra_field_<id> components
    sit on the live entity displays. Setup/reset scripts also hide extra_field_example_custom_input on
    user.user.default because its validator would fail on a site without a voucher entity type.'
questions:
- id: extra_field_example-plugin-list
  input: Which Extra Field plugins does the extra_field_example submodule of the Drupal extra_field project
    ship? Give the plugin ids and say which entity types/bundles each is offered on.
  criteria: 'Display plugins: all_nodes (node.*, weight -30, visible), article_only (node.article - ExampleArticle
    and ExampleWithDependencyInjection both use this id), formatted_field (node.article, ExtraFieldDisplayFormattedBase)
    and multilingual_field (node.article, concatenates field_tags labels). Form plugins: example_markup
    (node.*, visible), example_custom_submit (node.*, weight 100, visible) and example_custom_input (user.user,
    visible).'
  bundle: extra_field_example
  rubric_ref: rubric/extra_field_example_extra_field_example_plugin_list@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: extra_field_example-duplicate-id
  input: In Drupal's extra_field_example module, the classes ExampleArticle and ExampleWithDependencyInjection
    are both ExtraFieldDisplay plugins. What plugin id do they declare, and what happens because of that?
  criteria: 'Both declare id = "article_only". Plugin discovery keys definitions by id, so only one of
    the two classes survives - the other is silently dropped and its behaviour (the injected request_stack
    example printing ''Request scheme: ...'') may never run. Never copy both classes into the same module
    without renaming one.'
  bundle: extra_field_example
  rubric_ref: rubric/extra_field_example_extra_field_example_duplicate_id@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: extra_field_example-user-form-plugin
  input: The extra_field_example module adds an extra field to the Drupal user form. Which plugin is that,
    what element does it add, and why is it unsafe to leave enabled on a real site?
  criteria: 'ExampleCustomInput, plugin id example_custom_input, bundles user.user, visible = true. It
    adds a required ''Voucher code'' textfield with an element #validate callback that loads a `voucher`
    entity via the entity type manager and writes field_voucher into form state. Drupal core has no `voucher`
    entity type, so submitting the user form raises a PluginNotFoundException - remove the extra_field_example_custom_input
    component from core.entity_form_display.user.user.default or uninstall the submodule.'
  bundle: extra_field_example
  rubric_ref: rubric/extra_field_example_extra_field_example_user_form_plugin@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: extra_field_example-page-display
  input: This Drupal site has the extra_field_example module enabled. One of its display pseudo-fields
    is placed on the Basic page content type's default view display. Inspect the live site and give its
    exact machine name and weight.
  criteria: extra_field_all_nodes at weight 7 in core.entity_view_display.node.page.default (the 'For
    all nodes' ExtraFieldDisplay plugin id all_nodes). It has been removed from the Article default view
    display.
  bundle: extra_field_example
  rubric_ref: rubric/extra_field_example_extra_field_example_page_display@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/extra_field_example-page-display-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/extra_field_example-page-display-cleanup.sh
- id: extra_field_example-plugin-ids
  input: Inspect this running Drupal site and list the ExtraFieldForm plugin ids that are currently registered
    with the extra_field form plugin manager, and say which pseudo-field machine name each one produces.
  criteria: plugin.manager.extra_field_form reports example_markup, example_custom_submit and example_custom_input
    (all from extra_field_example). Their pseudo-field names are extra_field_example_markup, extra_field_example_custom_submit
    and extra_field_example_custom_input - plugin id prefixed with 'extra_field_'.
  bundle: extra_field_example
  rubric_ref: rubric/extra_field_example_extra_field_example_plugin_ids@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/extra_field_example-plugin-ids-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/extra_field_example-plugin-ids-cleanup.sh
- id: extra_field_example-enable-tags
  input: On this Drupal site, enable the extra_field_example submodule and put its 'Concatenated tags'
    extra field - the ExtraFieldDisplay plugin that builds a comma separated list from the Article's field_tags
