metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: externalauth
  version: 2.0.x
  note: externalauth is a low-level developer helper with no configuration UI. All cases are `recipe`
    (response-graded), probing its two services (ExternalAuth, Authmap), the authmap mapping, events,
    and permissions grounded in the docs.
questions:
- id: externalauth-login-register-one-call
  input: In a custom Drupal 11 SSO module I have already verified an external identity (authname + provider).
    I want a single call that logs the user in if they are already mapped, and otherwise registers a new
    Drupal user and then logs them in. Which ExternalAuth service method do I call, and what service do
    I inject? Show the call.
  criteria: Inject the externalauth.externalauth service (ExternalAuthInterface) and call $externalAuth->loginRegister($authname,
    $provider, $account_data). It logs in if mapped, otherwise registers then logs in.
  bundle: externalauth
  rubric_ref: rubric/externalauth_externalauth_login_register_one_call@1.0
  tags:
  - mode:recipe
- id: externalauth-service-methods
  input: On this Drupal site, which service implements the high-level external-auth flow (load / login
    / register), and what are the two core methods for logging in an already-mapped user versus creating
    a brand-new mapped Drupal user? Name the service and the methods.
  criteria: 'The externalauth.externalauth service (ExternalAuthInterface): login($authname, $provider)
    logs in the mapped user; register($authname, $provider, $account_data) creates a new Drupal user for
    the external identity and stores the mapping.'
  bundle: externalauth
  rubric_ref: rubric/externalauth_externalauth_service_methods@1.0
  tags:
  - mode:recipe
- id: externalauth-getuid-reverse-lookup
  input: In PHP on a Drupal 11 site, I have an external authname and a provider string and I need to find
    the Drupal user id that they are mapped to (a reverse lookup). Which service and method do I use?
  criteria: The externalauth.authmap service (AuthmapInterface)->getUid($authname, $provider) returns
    the mapped Drupal uid.
  bundle: externalauth
  rubric_ref: rubric/externalauth_externalauth_getuid_reverse_lookup@1.0
  tags:
  - mode:recipe
- id: externalauth-save-mapping
  input: I resolved a Drupal user account myself and now I want to record, in the authmap, that this account
    belongs to a given external authname under my provider 'my_sso', optionally storing extra provider
    data. Which authmap method stores this mapping, and what arguments does it take?
  criteria: 'The externalauth.authmap service: $authmap->save($account, $provider, $authname, $data) stores
    the mapping (with optional $data) between the Drupal account and the external identifier.'
  bundle: externalauth
  rubric_ref: rubric/externalauth_externalauth_save_mapping@1.0
  tags:
  - mode:recipe
- id: externalauth-link-existing-account
  input: A user is already logged into their existing Drupal account and now authenticates with an external
    provider. I want to attach that external identity to their existing account rather than creating a
    new one. Which ExternalAuth method does that?
  criteria: $externalAuth->linkExistingAccount($authname, $provider, $account) attaches an external identity
    to an already-existing Drupal account.
  bundle: externalauth
  rubric_ref: rubric/externalauth_externalauth_link_existing_account@1.0
  tags:
  - mode:recipe
- id: externalauth-react-to-register-event
  input: When externalauth registers a brand-new user after external authentication, I want to add roles
    to that account. Which event do I subscribe to, and where are its constants defined? Show the getSubscribedEvents
    entry.
  criteria: Subscribe to ExternalAuthEvents::REGISTER (event name externalauth.register, object ExternalAuthRegisterEvent)
    via a normal EventSubscriberInterface; constants live in Drupal\externalauth\Event\ExternalAuthEvents.
  bundle: externalauth
  rubric_ref: rubric/externalauth_externalauth_react_to_register_event@1.0
  tags:
  - mode:recipe
- id: externalauth-alter-authmap-event
  input: I need to alter the authname or the data that externalauth is about to store in the authmap,
    before it is saved. Which event fires at that point, and what event object is passed?
  criteria: ExternalAuthEvents::AUTHMAP_ALTER (externalauth.authmap_alter), passing an ExternalAuthAuthmapAlterEvent,
    fires before authmap data is stored so you can alter the authname/data.
  bundle: externalauth
  rubric_ref: rubric/externalauth_externalauth_alter_authmap_event@1.0
  tags:
  - mode:recipe
- id: externalauth-permissions
  input: Which permissions does the externalauth module provide for administering the stored authmap mapping
    data (viewing the People -> Authmap listing and deleting entries)?
  criteria: '''view authmap'' gates viewing the People -> Authmap listing; ''delete authmap'' gates deleting
    external-auth entries.'
  bundle: externalauth
  rubric_ref: rubric/externalauth_externalauth_permissions@1.0
  tags:
  - mode:recipe
