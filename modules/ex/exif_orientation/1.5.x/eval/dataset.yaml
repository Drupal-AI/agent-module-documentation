metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: exif_orientation
  version: 1.5.x
  note: 'EXIF Orientation is a tiny procedural module: two core hooks plus a rotate helper, no config/permissions/plugins.
    Cases are `recipe` (response-graded) probing documented facts (automatic vs image-effect, which EXIF
    values map to which rotation, requirements) an agent would otherwise read source to answer; no site
    mutation.'
questions:
- id: exif-orientation-automatic-not-effect
  input: On a Drupal 11 site I installed the exif_orientation module. Do I need to add an image effect
    to an image style, or does it rotate uploaded images automatically? How does it hook in?
  criteria: It is automatic — no image effect needed. It implements hook_file_presave() and rotates the
    stored file on save/upload; there is no config UI.
  bundle: exif_orientation
  rubric_ref: rubric/exif_orientation_exif_orientation_automatic_not_effect@1.0
  tags:
  - mode:recipe
- id: exif-orientation-value-mapping
  input: In the exif_orientation module, which EXIF Orientation tag values are corrected and how many
    degrees does each rotate? What about mirrored/flipped values?
  criteria: Orientation 3 -> 180 degrees, 6 -> 90 degrees, 8 -> 270 degrees. Value 1/missing/other is
    left alone; odd/mirrored (flipped) values are NOT corrected.
  bundle: exif_orientation
  rubric_ref: rubric/exif_orientation_exif_orientation_value_mapping@1.0
  tags:
  - mode:recipe
- id: exif-orientation-formats
  input: Which image MIME types does the exif_orientation module rotate, and what PHP requirement must
    be met for it to work?
  criteria: Only image/jpeg and image/png are processed, and PHP's EXIF extension (exif_read_data()) must
    be available or the module no-ops.
  bundle: exif_orientation
  rubric_ref: rubric/exif_orientation_exif_orientation_formats@1.0
  tags:
  - mode:recipe
- id: exif-orientation-why-phone-photos
  input: Why do phone photos (e.g. iPhone) show up sideways in Drupal, and how does exif_orientation fix
    it at upload?
  criteria: Phones save images in landscape and record display rotation in the EXIF Orientation tag, which
    browsers/toolkits ignore. exif_orientation reads that tag on file presave and physically rotates the
    stored file so it is upright.
  bundle: exif_orientation
  rubric_ref: rubric/exif_orientation_exif_orientation_why_phone_photos@1.0
  tags:
  - mode:recipe
- id: exif-orientation-validator-order
  input: In exif_orientation, why does the module insert its own upload validator before file_validate_image_resolution
    on image widgets?
  criteria: file_validate_image_resolution may resize the image and lose the EXIF data; exif_orientation
    prepends exif_orientation_validate_image_rotation so rotation happens before any resize strips the
    EXIF.
  bundle: exif_orientation
  rubric_ref: rubric/exif_orientation_exif_orientation_validator_order@1.0
  tags:
  - mode:recipe
- id: exif-orientation-no-config
  input: What configuration, settings form, or permissions does the exif_orientation module provide, and
    how do I set it up?
  criteria: None — no config UI, no settings, no permissions, no image effect. Setup is simply enabling
    the module (drush en exif_orientation -y).
  bundle: exif_orientation
  rubric_ref: rubric/exif_orientation_exif_orientation_no_config@1.0
  tags:
  - mode:recipe
- id: exif-orientation-manual-trigger
  input: In PHP on Drupal 11, how can I make exif_orientation re-check and rotate an existing image file
    entity? Is there a public service?
  criteria: There is no public service; saving the file entity (File::load($fid)->save()) fires hook_file_presave()
    which runs the rotation. The _exif_orientation_rotate() helper is private.
  bundle: exif_orientation
  rubric_ref: rubric/exif_orientation_exif_orientation_manual_trigger@1.0
  tags:
  - mode:recipe
