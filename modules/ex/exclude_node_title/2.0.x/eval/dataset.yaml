metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: exclude_node_title
  version: 2.0.x
  note: 'Exclude Node Title has one config settings object, three permissions, and a preprocess-based
    suppression mechanism. Cases are `recipe` (response-graded): they probe documented facts an agent
    would otherwise read source to answer; no site mutation.'
questions:
- id: ent-hide-per-content-type
  input: On a Drupal 11 site I want to hide the node title (h1) on every Article node's full page view.
    Which module setting/mode do I use and where do I configure it?
  criteria: At /admin/config/content/exclude-node-title set the Article content type's exclude mode to
    'All nodes' and check the 'Full' view mode; stored as content_types.article=all and content_type_modes.article
    in exclude_node_title.settings.
  bundle: exclude_node_title
  rubric_ref: rubric/exclude_node_title_ent_hide_per_content_type@1.0
  tags:
  - mode:recipe
- id: ent-view-mode-scope
  input: I only want the exclude_node_title module to hide the title in the teaser view mode, not on the
    full node page. How is that controlled?
  criteria: Each content type has a set of view-mode checkboxes (content_type_modes.<bundle>); check only
    'teaser' so isTitleExcluded() returns true just for that view mode.
  bundle: exclude_node_title
  rubric_ref: rubric/exclude_node_title_ent_view_mode_scope@1.0
  tags:
  - mode:recipe
- id: ent-per-node-override
  input: I want editors to decide per node whether the title is hidden, rather than hiding it for all
    nodes of a type. How do I set that up in exclude_node_title?
  criteria: Set the content type's mode to 'User defined nodes' (content_types.<bundle>=user); this adds
    an 'Exclude title from display' checkbox on the node edit form; per-node ids are stored in State (exclude_node_title_nid_list).
  bundle: exclude_node_title
  rubric_ref: rubric/exclude_node_title_ent_per_node_override@1.0
  tags:
  - mode:recipe
- id: ent-render-type
  input: What are the two ways exclude_node_title can suppress a title, and which setting chooses between
    removing the text and just visually hiding it?
  criteria: 'The ''type'' setting: ''remove'' empties the title markup (HtmlEscapedText('''')), ''hidden''
    keeps the markup and adds a visually-hidden class. Configured via ''Type of rendering'' on the settings
    form.'
  bundle: exclude_node_title
  rubric_ref: rubric/exclude_node_title_ent_render_type@1.0
  tags:
  - mode:recipe
- id: ent-permissions
  input: Which permission gates the exclude_node_title settings form, and which permissions let a user
    toggle the per-node exclude checkbox?
  criteria: '''administer exclude node title'' gates the settings form; ''exclude any node title'' lets
    a user toggle the node-edit checkbox on any node, ''exclude own node title'' only on nodes they own.'
  bundle: exclude_node_title
  rubric_ref: rubric/exclude_node_title_ent_permissions@1.0
  tags:
  - mode:recipe
- id: ent-configure-route
  input: What is the route name and path of the Exclude Node Title settings form, and which config object
    stores its values?
  criteria: Route exclude_node_title.settings at /admin/config/content/exclude-node-title; values stored
    in the exclude_node_title.settings config object.
  bundle: exclude_node_title
  rubric_ref: rubric/exclude_node_title_ent_configure_route@1.0
  tags:
  - mode:recipe
- id: ent-suppression-mechanism
  input: How does exclude_node_title actually suppress the title in templates without deleting the title
    value?
  criteria: It uses preprocess hooks (preprocess_page_title, preprocess_page, preprocess_node, preprocess_html)
    plus a page_title_block alter, calling ExcludeNodeTitleManager::isTitleExcluded() to blank or visually-hide
    the title vars; adds an exclude-node-title body class. The stored title is untouched.
  bundle: exclude_node_title
  rubric_ref: rubric/exclude_node_title_ent_suppression_mechanism@1.0
  tags:
  - mode:recipe
- id: ent-search-and-ds
  input: Can exclude_node_title hide titles in core Search results, and does it work with Display Suite
    layouts?
  criteria: The 'search' setting (needs the Search module) strips titles from node_search results; it
    also overrides the Display Suite node_title field via hook_ds_fields_info_alter so DS displays honor
    the same exclude settings.
  bundle: exclude_node_title
  rubric_ref: rubric/exclude_node_title_ent_search_and_ds@1.0
  tags:
  - mode:recipe
