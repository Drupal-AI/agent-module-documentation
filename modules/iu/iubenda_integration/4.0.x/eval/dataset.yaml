metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: iubenda_integration
  version: 4.0.x
  note: 'Iubenda Integration connects Drupal to the external Iubenda service (privacy policy links, Cookie
    Solution banner, Consent Solution). Because the service is external, all cases are grounded in LOCAL
    Drupal config, not any network call. It has three settings forms (routes iubenda_integration.settings,
    .settings.cookie, .settings.consent under /admin/config/services/iubenda-integration) all gated by
    the ''administer iubenda_integration'' permission, and — importantly — all three save into the SINGLE
    config object iubenda_integration.settings. Key config keys: iubenda_integration_policy_code, iubenda_integration_style,
    cookie_solution_enable, siteId, enableGdpr/Lgpd/Fadp/Uspr, position, api_key. It also provides a privacy-policy
    renderer service (iubenda_integration.privacy_policy.renderer), a block (iubenda_integration_privacy_policy),
    and the [site:iubenda_integration] token. It defines no plugin TYPES and no Drush. Medium/hard cases
    read/write the real iubenda_integration.settings config; cleanups restore the shipped defaults (empty
    policy code, style iubenda-nostyle, cookie disabled, empty siteId, position full-top).'
questions:
- id: iubenda_integration-configure-where
  input: I enabled the iubenda_integration module. Where do I configure it in the Drupal admin, which
    permission is required, and where do I enter the Iubenda privacy policy code?
  criteria: Configure it at /admin/config/services/iubenda-integration (with Cookie policy and Consent
    solution sub-tabs), gated by the 'administer iubenda_integration' permission. Enter the privacy policy
    code (the number from your iubenda.com/privacy-policy/XXXXXXX URL) in the General form; it is stored
    as iubenda_integration_policy_code in iubenda_integration.settings.
  bundle: iubenda_integration
  rubric_ref: rubric/iubenda_integration_iubenda_integration_configure_where@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: iubenda_integration-token-block
  input: Using iubenda_integration, what are the ways to output the Iubenda privacy policy link on my
    Drupal site (a token, a block, and a service)?
  criteria: 'Use the token [site:iubenda_integration] in any token-enabled text; place the ''Iubenda Integration:
    Privacy policy'' block (plugin iubenda_integration_privacy_policy) in a region; or call the service
    iubenda_integration.privacy_policy.renderer (buildLink()/buildString()).'
  bundle: iubenda_integration
  rubric_ref: rubric/iubenda_integration_iubenda_integration_token_block@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: iubenda_integration-cookie-config-object
  input: In iubenda_integration, which config object holds the Cookie Solution settings, and which keys
    enable the cookie banner and set the Iubenda site id? Note anything surprising about where the cookie/consent
    forms save their data.
  criteria: All three forms — General, Cookie solution and Consent solution — save into the single config
    object iubenda_integration.settings (not .settings.cookie / .settings.consent). Enable the banner
    with cookie_solution_enable = true and set siteId to your Iubenda site id.
  bundle: iubenda_integration
  rubric_ref: rubric/iubenda_integration_iubenda_integration_cookie_config_object@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: iubenda_integration-known-policy
  input: On this Drupal site, iubenda_integration already has an Iubenda privacy policy code configured.
    Inspect the live module configuration and tell me the privacy policy code.
  criteria: In iubenda_integration.settings the key iubenda_integration_policy_code is 9911223 (link style
    iubenda-black).
  bundle: iubenda_integration
  rubric_ref: rubric/iubenda_integration_iubenda_integration_known_policy@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/iubenda_integration-known-policy-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/iubenda_integration-known-policy-cleanup.sh
- id: iubenda_integration-known-cookie
  input: On this Drupal site, the iubenda_integration Cookie Solution has been enabled. Inspect the live
    module configuration and tell me the configured Iubenda siteId.
  criteria: In iubenda_integration.settings, cookie_solution_enable is true and siteId is 44556677 (banner
    position 'bottom').
  bundle: iubenda_integration
  rubric_ref: rubric/iubenda_integration_iubenda_integration_known_cookie@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/iubenda_integration-known-cookie-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/iubenda_integration-known-cookie-cleanup.sh
- id: iubenda_integration-set-policy
  input: On this Drupal site the iubenda_integration privacy policy code is currently blank. Using the
    module, set the Iubenda privacy policy code to 7654321 and apply the change to the live site.
  criteria: In iubenda_integration.settings the key iubenda_integration_policy_code becomes 7654321 (e.g.
    drush cset iubenda_integration.settings iubenda_integration_policy_code 7654321, or via the settings
    form).
  bundle: iubenda_integration
  rubric_ref: rubric/iubenda_integration_iubenda_integration_set_policy@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/iubenda_integration-set-policy-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/iubenda_integration-set-policy-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/iubenda_integration-set-policy-verify.sh
- id: iubenda_integration-enable-cookie
  input: On this Drupal site, use iubenda_integration to turn on the Iubenda cookie consent banner (Cookie
    Solution) and set the Iubenda site id to 555777. Apply the change to the live site.
  criteria: In iubenda_integration.settings, cookie_solution_enable becomes true and siteId becomes 555777
    (both keys live in that single config object).
  bundle: iubenda_integration
  rubric_ref: rubric/iubenda_integration_iubenda_integration_enable_cookie@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/iubenda_integration-enable-cookie-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/iubenda_integration-enable-cookie-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/iubenda_integration-enable-cookie-verify.sh
