rubrics:
- id: openapi_jsonapi_openapi_jsonapi_generator_id
  version: '1.0'
  applicable_bundles:
  - openapi_jsonapi
  checks:
  - kind: must_contain_any
    values:
    - jsonapi
    - JsonApiGenerator
    - '@OpenApiGenerator'
  scoring:
    combine: all_pass
- id: openapi_jsonapi_openapi_jsonapi_download_endpoint
  version: '1.0'
  applicable_bundles:
  - openapi_jsonapi
  checks:
  - kind: must_contain_any
    values:
    - /openapi/jsonapi
    - access openapi api docs
  scoring:
    combine: all_pass
- id: openapi_jsonapi_openapi_jsonapi_dependencies
  version: '1.0'
  applicable_bundles:
  - openapi_jsonapi
  checks:
  - kind: must_contain_any
    values:
    - schemata
    - openapi
    - jsonapi
  scoring:
    combine: all_pass
- id: openapi_jsonapi_openapi_jsonapi_read_only_current_on
  version: '1.0'
  applicable_bundles:
  - openapi_jsonapi
  checks:
  - kind: must_contain_any
    values:
    - read_only
    - read-only
    - read only
  scoring:
    combine: all_pass
- id: openapi_jsonapi_openapi_jsonapi_read_only_current_off
  version: '1.0'
  applicable_bundles:
  - openapi_jsonapi
  checks:
  - kind: must_contain_any
    values:
    - POST
    - PATCH
    - write
    - mutating
    - create
  scoring:
    combine: all_pass
- id: openapi_jsonapi_openapi_jsonapi_generate_spec_expert
  version: '1.0'
  applicable_bundles:
  - openapi_jsonapi
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
- id: openapi_jsonapi_openapi_jsonapi_generate_spec_userscope_expert
  version: '1.0'
  applicable_bundles:
  - openapi_jsonapi
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
