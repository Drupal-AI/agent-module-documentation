metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: openapi_jsonapi
  version: 3.0.x
  note: 'OpenAPI JSON:API supplies one openapi_generator plugin (id `jsonapi`) to the base OpenAPI framework,
    describing a site''s JSON:API endpoints as a Swagger 2.0 spec. It defines no new plugin type, config
    form, permission, or Drush command. easy=recipe facts (generator id, download route, dependencies,
    read-only behaviour); medium=introspection of live jsonapi.settings read-only state with a setup/cleanup
    that toggles it; hard=execution where a drupal-expert produces the JSON:API OpenAPI spec via the jsonapi
    generator and writes it to a file that a verify script validates. NOTE on the hard tier: on this kitchen-sink
    site the FULL-site spec build throws an AssertionError (a relationship whose target resource type
    is unresolvable) with zend.assertions on; scoping the generator to a concrete entity type (e.g. node)
    is the reliable path, which the verify accepts.'
questions:
- id: openapi-jsonapi-generator-id
  input: On Drupal 11 I enabled the OpenAPI JSON:API module. Which openapi_generator plugin id does it
    register, and what is the annotation/class that defines it? Answer briefly.
  criteria: It registers a single openapi_generator plugin with id `jsonapi`, defined by the class JsonApiGenerator
    (Drupal\openapi_jsonapi\Plugin\openapi\OpenApiGenerator\JsonApiGenerator) annotated @OpenApiGenerator(id
    = "jsonapi", label = @Translation("JSON:API")), extending OpenApiGeneratorBase from the openapi module.
  bundle: openapi_jsonapi
  rubric_ref: rubric/openapi_jsonapi_openapi_jsonapi_generator_id@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: openapi-jsonapi-download-endpoint
  input: With OpenAPI + OpenAPI JSON:API enabled on Drupal 11, what URL serves the JSON:API OpenAPI specification
    as JSON, and which permission gates it?
  criteria: Download it at /openapi/jsonapi (route openapi.download, _format json), gated by the 'access
    openapi api docs' permission provided by the base OpenAPI module. It returns a Swagger 2.0 JSON document
    with base path /jsonapi and the application/vnd.api+json media type.
  bundle: openapi_jsonapi
  rubric_ref: rubric/openapi_jsonapi_openapi_jsonapi_download_endpoint@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: openapi-jsonapi-dependencies
  input: What modules must be present for OpenAPI JSON:API to work, and where do the per-entity payload
    schemas in the generated spec come from?
  criteria: It depends on jsonapi, openapi, schemata and schemata_json_schema. The base OpenAPI module
    provides the openapi_generator framework and download routes; JSON:API provides the endpoints being
    described; and the entity/bundle JSON Schema payload definitions in the spec are generated from Schemata
    / Schemata JSON Schema (via schemata.schema_factory).
  bundle: openapi_jsonapi
  rubric_ref: rubric/openapi_jsonapi_openapi_jsonapi_dependencies@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: openapi-jsonapi-read-only-current-on
  input: 'On this live Drupal site, confirm that the `jsonapi` OpenAPI generator is registered, then inspect
    the current JSON:API configuration and tell me: given the site''s current read-only setting, will
    the generated JSON:API OpenAPI spec document write operations (POST/PATCH/DELETE) or only read operations?
    Explain why.'
  criteria: The plugin.manager.openapi.generator manager lists a `jsonapi` generator. jsonapi.settings.read_only
    is currently TRUE, so JsonApiGenerator::getPaths() drops every route with a non-read method - the
    spec documents only read operations (GET/HEAD/OPTIONS/TRACE); POST/PATCH/DELETE endpoints are excluded.
  bundle: openapi_jsonapi
  rubric_ref: rubric/openapi_jsonapi_openapi_jsonapi_read_only_current_on@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/openapi_jsonapi-read-only-on-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/openapi_jsonapi-read-only-cleanup.sh
- id: openapi-jsonapi-read-only-current-off
  input: 'Inspect the running site: what is the current value of the JSON:API read-only setting, and what
    does that mean for the endpoints documented by the `jsonapi` OpenAPI generator''s specification right
    now? Confirm the jsonapi generator is available.'
  criteria: The `jsonapi` generator is registered in plugin.manager.openapi.generator. jsonapi.settings.read_only
    is currently FALSE, so read-only filtering is off and the generated spec includes mutating endpoints
    (Create/POST, Update/PATCH, Remove/DELETE) alongside the read endpoints.
  bundle: openapi_jsonapi
  rubric_ref: rubric/openapi_jsonapi_openapi_jsonapi_read_only_current_off@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/openapi_jsonapi-read-only-off-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/openapi_jsonapi-read-only-cleanup.sh
- id: openapi-jsonapi-generate-spec-expert
  input: Using the `jsonapi` OpenAPI generator on this Drupal site, generate the JSON:API OpenAPI (Swagger
    2.0) specification for the `node` entity type and write the resulting spec as JSON to /tmp/openapi_jsonapi_eval_spec.json.
    Use the openapi generator plugin manager (plugin.manager.openapi.generator), create the `jsonapi`
    generator, scope it to node with setOptions(['entity_type_id' => 'node']), call getSpecification(),
    and json_encode the returned array to that file.
  criteria: 'A valid Swagger 2.0 JSON document written to /tmp/openapi_jsonapi_eval_spec.json: swagger
    ''2.0'', info.title ending in ''JSON API'', basePath ''/jsonapi'', consumes/produces application/vnd.api+json,
    and a non-empty paths object for the node resource endpoints. Produced via: $g = \Drupal::service(''plugin.manager.openapi.generator'')->createInstance(''jsonapi'');
    $g->setOptions([''entity_type_id'' => ''node'']); file_put_contents(''/tmp/openapi_jsonapi_eval_spec.json'',
    json_encode($g->getSpecification()));'
  bundle: openapi_jsonapi
  rubric_ref: rubric/openapi_jsonapi_openapi_jsonapi_generate_spec_expert@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/openapi_jsonapi-generate-spec-reset.sh
    verify: agent-module-documentation/evaluation/verify/openapi_jsonapi-generate-spec-verify.sh
    unused_text_checks:
      must_contain_any: []
      must_not_contain: []
- id: openapi-jsonapi-generate-spec-userscope-expert
  input: I need a machine-readable JSON:API contract for just the user account resource on this Drupal
    site. Produce the JSON:API OpenAPI specification with the openapi `jsonapi` generator, scoped to the
    `user` entity type, and save it as JSON at /tmp/openapi_jsonapi_eval_spec.json so external tooling
    can consume it.
  criteria: 'A valid Swagger 2.0 JSON:API spec saved to /tmp/openapi_jsonapi_eval_spec.json, scoped to
    the user resource: swagger ''2.0'', info.title with ''JSON API'', basePath ''/jsonapi'', application/vnd.api+json
    media type, and non-empty user paths. Built via the jsonapi generator plugin with setOptions([''entity_type_id''
    => ''user'']) then getSpecification(), json_encoded to the file.'
  bundle: openapi_jsonapi
  rubric_ref: rubric/openapi_jsonapi_openapi_jsonapi_generate_spec_userscope_expert@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/openapi_jsonapi-generate-spec-reset.sh
    verify: agent-module-documentation/evaluation/verify/openapi_jsonapi-generate-spec-verify.sh
    unused_text_checks:
      must_contain_any: []
      must_not_contain: []
