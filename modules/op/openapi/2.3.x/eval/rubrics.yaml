rubrics:
- id: openapi_openapi_needs_generator_module
  version: '1.0'
  applicable_bundles:
  - openapi
  checks:
  - kind: must_contain_any
    values:
    - openapi_rest
    - openapi_jsonapi
    - OpenAPI REST
    - OpenAPI JSON:API
    - generator plugin
  scoring:
    combine: all_pass
- id: openapi_openapi_download_route
  version: '1.0'
  applicable_bundles:
  - openapi
  checks:
  - kind: must_contain_any
    values:
    - /openapi/
    - access openapi api docs
  scoring:
    combine: all_pass
- id: openapi_openapi_plugin_type
  version: '1.0'
  applicable_bundles:
  - openapi
  checks:
  - kind: must_contain_any
    values:
    - openapi_generator
    - OpenApiGeneratorBase
    - '@OpenApiGenerator'
    - Plugin/openapi/OpenApiGenerator
  scoring:
    combine: all_pass
- id: openapi_openapi_filter_options
  version: '1.0'
  applicable_bundles:
  - openapi
  checks:
  - kind: must_contain_any
    values:
    - entity_mode
    - exclude
    - options
  scoring:
    combine: all_pass
- id: openapi_openapi_ui_separate
  version: '1.0'
  applicable_bundles:
  - openapi
  checks:
  - kind: must_contain_any
    values:
    - openapi_ui
    - OpenAPI UI
    - Redoc
    - Swagger UI
  scoring:
    combine: all_pass
