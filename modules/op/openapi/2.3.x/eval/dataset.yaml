metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: openapi
  version: 2.3.x
  note: 'OpenAPI generates a Swagger 2.0 specification for a Drupal site''s web-service API. It is a framework
    that defines the openapi_generator plugin type but ships no generators of its own (you install OpenAPI
    REST / OpenAPI JSON:API). Cases are `recipe` (response-graded) and probe openapi-specific facts: the
    framework-vs-generator distinction, the spec download route/permission, the openapi_generator plugin
    type, the request options that filter entity types, and the fact there is no config form / the UI
    needs openapi_ui. No site mutation.'
questions:
- id: openapi-needs-generator-module
  input: I enabled the OpenAPI module on Drupal 11 but /admin/config/services/openapi shows no APIs to
    download. Why, and what do I install to actually get a spec for my REST and JSON:API endpoints?
  criteria: The base OpenAPI module ships no generator plugins; it only provides the openapi_generator
    plugin framework. You must install an integration module that supplies a generator - OpenAPI REST
    (drupal/openapi_rest) for core REST and/or OpenAPI JSON:API (drupal/openapi_jsonapi) - after which
    generators appear on the downloads list.
  bundle: openapi
  rubric_ref: rubric/openapi_openapi_needs_generator_module@1.0
  tags:
  - mode:recipe
- id: openapi-download-route
  input: On a Drupal 11 site with OpenAPI 2.x and a generator installed, what URL do I hit to download
    the raw specification JSON for a generator, and which permission controls access? Answer briefly.
  criteria: Download the spec at /openapi/{generator} (e.g. /openapi/rest or /openapi/jsonapi), a JSON
    route (route openapi.download). All OpenAPI routes are gated by the 'access openapi api docs' permission.
  bundle: openapi
  rubric_ref: rubric/openapi_openapi_download_route@1.0
  tags:
  - mode:recipe
- id: openapi-plugin-type
  input: I want to document a custom REST module with OpenAPI 2.x on Drupal 11. What plugin type do I
    implement, what base class / annotation do I use, and where does the class live?
  criteria: 'Implement an openapi_generator plugin: a class in your module''s Plugin/openapi/OpenApiGenerator
    namespace, annotated @OpenApiGenerator (id, label) and extending OpenApiGeneratorBase (implementing
    getApiName, getApiDescription, getJsonSchema, and typically getPaths/getDefinitions).'
  bundle: openapi
  rubric_ref: rubric/openapi_openapi_plugin_type@1.0
  tags:
  - mode:recipe
- id: openapi-filter-options
  input: With OpenAPI 2.x, how can I limit a generated specification to just content entities, or exclude
    a specific entity type/bundle, when requesting the spec download?
  criteria: 'Pass request options that the generator applies via includeEntityTypeBundle(): options[entity_mode]=content_entities
    (or config_entities), options[exclude][]=ENTITY_TYPE or ENTITY_TYPE:BUNDLE, and options[entity_type_id]
    / options[bundle_name] to scope to one type/bundle.'
  bundle: openapi
  rubric_ref: rubric/openapi_openapi_filter_options@1.0
  tags:
  - mode:recipe
- id: openapi-ui-separate
  input: Does the OpenAPI module itself render an interactive Swagger/Redoc documentation page? What do
    I need for a browsable UI, and does OpenAPI have a settings/config form?
  criteria: No. OpenAPI has no configuration form (only a downloads listing page); it outputs JSON. For
    a browsable UI you install the separate OpenAPI UI project (e.g. Redoc or Swagger UI), which enables
    the openapi.documentation route at /admin/config/services/openapi/{ui}/{generator}.
  bundle: openapi
  rubric_ref: rubric/openapi_openapi_ui_separate@1.0
  tags:
  - mode:recipe
