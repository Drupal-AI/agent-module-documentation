rubrics:
- id: openapi_ui_swagger_openapi_ui_swagger_plugin_id
  version: '1.0'
  applicable_bundles:
  - openapi_ui_swagger
  checks:
  - kind: must_contain_any
    values:
    - openapi_ui
    - '''swagger'''
    - '"swagger"'
    - '#openapi_ui_plugin'
  scoring:
    combine: all_pass
- id: openapi_ui_swagger_openapi_ui_swagger_library_path
  version: '1.0'
  applicable_bundles:
  - openapi_ui_swagger
  checks:
  - kind: must_contain_any
    values:
    - libraries/swagger-ui
    - swagger-ui/dist
    - swagger-api/swagger-ui
  scoring:
    combine: all_pass
- id: openapi_ui_swagger_openapi_ui_swagger_docs_url
  version: '1.0'
  applicable_bundles:
  - openapi_ui_swagger
  checks:
  - kind: must_contain_any
    values:
    - /admin/config/services/openapi/swagger/jsonapi
    - admin/config/services/openapi
    - access openapi api docs
  scoring:
    combine: all_pass
- id: openapi_ui_swagger_openapi_ui_swagger_docs_role
  version: '1.0'
  applicable_bundles:
  - openapi_ui_swagger
  checks:
  - kind: must_contain_any
    values:
    - openapi_ui_swagger_viewer
  scoring:
    combine: all_pass
- id: openapi_ui_swagger_openapi_ui_swagger_library_installed
  version: '1.0'
  applicable_bundles:
  - openapi_ui_swagger
  checks:
  - kind: must_contain_any
    values:
    - 5.29.3
  scoring:
    combine: all_pass
- id: openapi_ui_swagger_openapi_ui_swagger_custom_page_expert
  version: '1.0'
  applicable_bundles:
  - openapi_ui_swagger
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
- id: openapi_ui_swagger_openapi_ui_swagger_custom_page_layman
  version: '1.0'
  applicable_bundles:
  - openapi_ui_swagger
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
