metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: optional_end_date
  version: 2.0.x
  note: 'Optional end date has no admin UI or user-facing services; it swaps core daterange plugin classes
    and exposes a single per-field storage setting. In 2.0.x hooks moved to an autowired OOP #[Hook] class
    and core support is ^10.3 || ^11 || ^12. Cases are `recipe` (response-graded): they probe documented
    facts (the storage setting, the affected plugins, the dependency, the validation change, the 2.0.x
    core window) an agent would otherwise read source to answer. No site mutation.'
questions:
- id: oed-enable-optional-end
  input: On a Drupal 11 site I have a Date range (daterange) field and I want events with no end date.
    How do I make the end date optional for that field?
  criteria: Enable the optional_end_date module, then check the 'Optional end date' checkbox on the daterange
    field's Storage settings (the optional_end_date storage setting, default FALSE).
  bundle: optional_end_date
  rubric_ref: rubric/optional_end_date_oed_enable_optional_end@1.0
  tags:
  - mode:recipe
- id: oed-setting-name-scope
  input: What is the machine name of the setting Optional end date adds to a Date range field, and is
    it a field storage setting or an instance setting?
  criteria: It adds a boolean field STORAGE setting named optional_end_date (default FALSE) via field.storage_settings.daterange.
  bundle: optional_end_date
  rubric_ref: rubric/optional_end_date_oed_setting_name_scope@1.0
  tags:
  - mode:recipe
- id: oed-dependency
  input: Which Drupal core module must be enabled for Optional end date to work?
  criteria: It depends on core datetime_range (the Date range field type module).
  bundle: optional_end_date
  rubric_ref: rubric/optional_end_date_oed_dependency@1.0
  tags:
  - mode:recipe
- id: oed-validation-change
  input: How does Optional end date stop Drupal from rejecting a daterange value that has no end date?
    Which property and constraint are involved?
  criteria: When optional_end_date is on, end_value is set not-required, isEmpty() treats start-only values
    as non-empty, and the NotNull constraint on end_value is not added.
  bundle: optional_end_date
  rubric_ref: rubric/optional_end_date_oed_validation_change@1.0
  tags:
  - mode:recipe
- id: oed-no-new-plugins
  input: Does Optional end date give me a new field type or widget to select, or does it change the existing
    Date range ones? How does it work?
  criteria: It does not add a selectable new type/widget; it swaps the core daterange field type, widget
    (daterange_default, daterange_datelist), and formatter classes via hook_field_info_alter / hook_field_widget_info_alter
    / hook_field_formatter_info_alter.
  bundle: optional_end_date
  rubric_ref: rubric/optional_end_date_oed_no_new_plugins@1.0
  tags:
  - mode:recipe
- id: oed-widget-label
  input: After I make a Date range field's end date optional, what changes about the End date form element
    in the default and datelist widgets?
  criteria: The End date element is no longer required (#required = FALSE) and its title becomes 'End
    date (optional)'.
  bundle: optional_end_date
  rubric_ref: rubric/optional_end_date_oed_widget_label@1.0
  tags:
  - mode:recipe
- id: oed-existing-fields-install
  input: I already have daterange data. When I enable Optional end date, how does it let existing rows
    store an empty end date at the database level?
  criteria: hook_install() alters existing daterange storage so each <field>_end_value column allows NULL
    (not null = FALSE).
  bundle: optional_end_date
  rubric_ref: rubric/optional_end_date_oed_existing_fields_install@1.0
  tags:
  - mode:recipe
- id: oed-empty-formatter-output
  input: When a daterange value has a start date but the end date is empty, what do the Optional end date
    formatters render?
  criteria: The default/plain/custom formatters render only the start date (no separator or end date)
    when the end date is empty or equal to the start.
  bundle: optional_end_date
  rubric_ref: rubric/optional_end_date_oed_empty_formatter_output@1.0
  tags:
  - mode:recipe
- id: oed-core-support-2x
  input: Which Drupal core versions does Optional end date 2.0.x support, and did the supported range
    change from the 1.x series?
  criteria: '2.0.x requires ^10.3 || ^11 || ^12: Drupal 10.3 is the new minimum and Drupal 12 is now supported,
    whereas 1.x supported ^8 || ^9 || ^10 || ^11. Use the 1.x branch for older core.'
  bundle: optional_end_date
  rubric_ref: rubric/optional_end_date_oed_core_support_2x@1.0
  tags:
  - mode:recipe
