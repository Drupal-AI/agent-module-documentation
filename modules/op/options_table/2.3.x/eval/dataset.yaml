metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: options_table
  version: 2.3.x
  note: 'Options Table ships one field widget plugin, OptionsTableWidget (id ''options_table'', label
    ''Draggable Table''), for field types entity_reference, list_integer, list_float, list_string, multiple_values=TRUE.
    It extends core OptionsWidgetBase and renders a #type table with a tabledrag Weight column so multi-value
    selections keep a chosen delta order. Its only setting is toggle_label (heading of the checkbox/radio
    column). No config entity, no configure route (configure=null), no permissions, no Drush, no plugin
    types. Persistent state is the widget choice on a field component in an entity_form_display config
    entity: content.<field>.type=options_table (+ settings.toggle_label). Medium/hard cases are grounded
    in that real form-display config on node.article; scripts create namespaced field_ot_* list fields.'
questions:
- id: options_table-widget-id-and-types
  input: In the Drupal contrib module options_table, what is the machine id of the field widget it provides,
    and which field types can use it?
  criteria: The widget id is options_table (label 'Draggable Table'). It supports the field types entity_reference,
    list_integer, list_float and list_string, and is a multiple-values widget extending core OptionsWidgetBase.
  bundle: options_table
  rubric_ref: rubric/options_table_options_table_widget_id_and_types@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: options_table-vs-core-checkboxes
  input: How does the options_table 'Draggable Table' widget differ from the core Check boxes/radio buttons
    widget for an options field?
  criteria: It renders the allowed options as a draggable table with a Weight column, so the editor can
    drag the selected options into a chosen order and that order is stored as the field delta order. Core
    checkboxes/radios only toggle selection and cannot set the weight/order of the selected options.
  bundle: options_table
  rubric_ref: rubric/options_table_options_table_vs_core_checkboxes@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: options_table-only-setting
  input: The options_table widget has no admin settings page. What is its one configurable widget setting,
    and in which config entity is the widget choice stored for a field?
  criteria: 'The only widget setting is toggle_label (an optional heading for the checkbox/radio column).
    You select the widget on the entity''s Manage form display; it is stored in the entity_form_display
    config entity as content.<field>.type: options_table with settings.toggle_label.'
  bundle: options_table
  rubric_ref: rubric/options_table_options_table_only_setting@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: options_table-known-field
  input: On this Drupal site, the Article content type has an options field whose edit widget was switched
    to the options_table 'Draggable Table' widget. Inspect the live default form display for Article and
    give the machine name of that field.
  criteria: 'The field is field_ot_known: in core.entity_form_display.node.article.default its component
    has type: options_table (with settings.toggle_label ''Choose'').'
  bundle: options_table
  rubric_ref: rubric/options_table_options_table_known_field@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/options_table-known-field-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/options_table-known-field-cleanup.sh
- id: options_table-drag-vs-plain
  input: The Article content type has two list_string fields, field_ot_drag and field_ot_plain. Exactly
    one uses the options_table Draggable Table widget; the other uses the core Check boxes/radio buttons
    widget. Inspect the live form-display configuration and state which field uses the draggable table
    widget.
  criteria: 'field_ot_drag uses the draggable table: in core.entity_form_display.node.article.default
    its component type is options_table, whereas field_ot_plain''s component type is options_buttons.'
  bundle: options_table
  rubric_ref: rubric/options_table_options_table_drag_vs_plain@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/options_table-drag-vs-plain-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/options_table-drag-vs-plain-cleanup.sh
- id: options_table-switch-widget
  input: On this Drupal site, the Article content type has a list_integer field field_ot_task that currently
    uses the core 'Select list' (options_select) widget on the default form display. Switch its edit widget
    to the options_table 'Draggable Table' widget and apply the change to the live site.
  criteria: 'In core.entity_form_display.node.article.default the field_ot_task component now has type:
    options_table (e.g. load the entity_form_display, set the component''s type to options_table via setComponent(),
    and save; or choose Draggable Table on Manage form display).'
  bundle: options_table
  rubric_ref: rubric/options_table_options_table_switch_widget@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/options_table-switch-widget-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/options_table-switch-widget-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/options_table-switch-widget-verify.sh
- id: options_table-toggle-label
  input: On this Drupal site, the Article content type has a list_string field field_ot_label that already
    uses the options_table Draggable Table widget but with no toggle label. Set the widget's toggle label
    to 'Selected' and apply the change to the live default form display.
  criteria: 'In core.entity_form_display.node.article.default the field_ot_label options_table component
    has settings.toggle_label: ''Selected'' (set the component''s settings[''toggle_label''] and save,
    or fill Toggle label on the widget''s settings in Manage form display).'
  bundle: options_table
  rubric_ref: rubric/options_table_options_table_toggle_label@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/options_table-toggle-label-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/options_table-toggle-label-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/options_table-toggle-label-verify.sh
