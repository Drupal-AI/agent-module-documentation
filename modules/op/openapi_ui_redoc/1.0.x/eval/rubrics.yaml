rubrics:
- id: openapi_ui_redoc_openapi_ui_redoc_build_output
  version: '1.0'
  applicable_bundles:
  - openapi_ui_redoc
  checks:
  - kind: must_contain_any
    values:
    - redoc-ui
    - no-auto-auth
    - html_tag
  scoring:
    combine: all_pass
- id: openapi_ui_redoc_openapi_ui_redoc_url_vs_array
  version: '1.0'
  applicable_bundles:
  - openapi_ui_redoc
  checks:
  - kind: must_contain_any
    values:
    - spec-url
    - redoc_attr
    - Redoc.init
  scoring:
    combine: all_pass
- id: openapi_ui_redoc_openapi_ui_redoc_where_to_look
  version: '1.0'
  applicable_bundles:
  - openapi_ui_redoc
  checks:
  - kind: must_contain_any
    values:
    - /admin/config/services/openapi
    - access openapi api docs
  scoring:
    combine: all_pass
- id: openapi_ui_redoc_openapi_ui_redoc_live_plugin_label
  version: '1.0'
  applicable_bundles:
  - openapi_ui_redoc
  checks:
  - kind: must_contain_any
    values:
    - ReDoc Fixture Build 4711
  scoring:
    combine: all_pass
- id: openapi_ui_redoc_openapi_ui_redoc_live_library_url
  version: '1.0'
  applicable_bundles:
  - openapi_ui_redoc
  checks:
  - kind: must_contain_any
    values:
    - redoc-pinned-9-8-7
  scoring:
    combine: all_pass
- id: openapi_ui_redoc_openapi_ui_redoc_explorer_role
  version: '1.0'
  applicable_bundles:
  - openapi_ui_redoc
  checks:
  - kind: must_contain_any
    values:
    - oui_redoc_explorer
  scoring:
    combine: all_pass
- id: openapi_ui_redoc_openapi_ui_redoc_specurl_page_expert
  version: '1.0'
  applicable_bundles:
  - openapi_ui_redoc
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
- id: openapi_ui_redoc_openapi_ui_redoc_specurl_page_layman
  version: '1.0'
  applicable_bundles:
  - openapi_ui_redoc
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
- id: openapi_ui_redoc_openapi_ui_redoc_inline_spec_page
  version: '1.0'
  applicable_bundles:
  - openapi_ui_redoc
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
