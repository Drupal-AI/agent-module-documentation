rubrics:
- id: optimizely_optimizely_snippet_mechanism
  version: '1.0'
  applicable_bundles:
  - optimizely
  checks:
  - kind: must_contain_any
    values:
    - cdn.optimizely.com
    - //cdn.optimizely.com/js/
    - page_attachments
  scoring:
    combine: all_pass
- id: optimizely_optimizely_account_id
  version: '1.0'
  applicable_bundles:
  - optimizely
  checks:
  - kind: must_contain_any
    values:
    - optimizely.settings
    - optimizely_id
    - administer optimizely
  scoring:
    combine: all_pass
- id: optimizely_optimizely_project_fields
  version: '1.0'
  applicable_bundles:
  - optimizely
  checks:
  - kind: must_contain_any
    values:
    - paths
    - code
    - state
  scoring:
    combine: all_pass
- id: optimizely_optimizely_known_code
  version: '1.0'
  applicable_bundles:
  - optimizely
  checks:
  - kind: must_contain_any
    values:
    - '555000'
  scoring:
    combine: all_pass
- id: optimizely_optimizely_known_account
  version: '1.0'
  applicable_bundles:
  - optimizely
  checks:
  - kind: must_contain_any
    values:
    - '4242000'
  scoring:
    combine: all_pass
- id: optimizely_optimizely_create_project
  version: '1.0'
  applicable_bundles:
  - optimizely
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
- id: optimizely_optimizely_disable_default
  version: '1.0'
  applicable_bundles:
  - optimizely
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
