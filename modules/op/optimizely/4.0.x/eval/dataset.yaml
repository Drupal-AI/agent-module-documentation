metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: optimizely
  version: 4.0.x
  note: 'Optimizely loads Optimizely A/B-testing JS onto targeted paths. Code-grounded facts: global config
    optimizely.settings:optimizely_id (account ID), form route optimizely.settings; experiments are ''optimizely''
    config entities (optimizely.optimizely.<id>) with fields id,label,code(int project code),state(bool),paths(newline-separated
    patterns, ''*'' wildcard/sitewide); a shipped ''default'' project (paths ''*'') can''t be deleted
    only disabled; hook_page_attachments() injects <script src=//cdn.optimizely.com/js/<code>.js> when
    the current path (system path or alias) matches an enabled project; permission ''administer optimizely'';
    entity UI under /admin/config/system/optimizely. Medium cases install known state (a project with
    code 555000; account id 4242000). Hard cases build real state verified against live config entities:
    create a path-targeted project (code 777000), and disable the sitewide default project. Fixtures namespaced
    optimizely_*.'
questions:
- id: optimizely-snippet-mechanism
  input: How does the Drupal Optimizely module add the Optimizely experiment JavaScript to a page, and
    what URL does the injected script point at?
  criteria: On each page render hook_page_attachments() checks the current path against enabled project
    entries and, on a match, injects a <script src="//cdn.optimizely.com/js/<code>.js"> into the page
    head (#attached['html_head']), where <code> is the project's code.
  bundle: optimizely
  rubric_ref: rubric/optimizely_optimizely_snippet_mechanism@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: optimizely-account-id
  input: In the Drupal Optimizely module, where is the Optimizely account ID stored, at which admin route
    is it set, and which permission is required?
  criteria: The account ID is stored in config optimizely.settings under key optimizely_id, set at route
    optimizely.settings (/admin/config/system/optimizely/settings), and all Optimizely admin routes require
    the 'administer optimizely' permission.
  bundle: optimizely
  rubric_ref: rubric/optimizely_optimizely_account_id@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: optimizely-project-fields
  input: In the Drupal Optimizely module, each experiment is a 'project' config entity. Which fields define
    a project (including how you scope which pages it loads on), and what is special about the built-in
    'default' project?
  criteria: An 'optimizely' config entity has id, label, code (the Optimizely project code used in the
    snippet URL), state (enabled boolean) and paths (newline-separated path patterns with '*' wildcards;
    '*' alone means sitewide). The shipped 'default' project targets '*' sitewide and cannot be deleted,
    only disabled.
  bundle: optimizely
  rubric_ref: rubric/optimizely_optimizely_project_fields@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: optimizely-known-code
  input: On this Drupal site there is an enabled Optimizely project (besides the default) targeting a
    specific path. Inspect the live configuration and give the numeric Optimizely project code configured
    for it.
  criteria: The project optimizely_known has code 555000 (readable via `drush cget optimizely.optimizely.optimizely_known
    code`), targeting /optimizely-eval/*.
  bundle: optimizely
  rubric_ref: rubric/optimizely_optimizely_known_code@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/optimizely-known-project-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/optimizely-known-project-cleanup.sh
- id: optimizely-known-account
  input: On this Drupal site the Optimizely account ID has been configured. Inspect the live configuration
    and report the account ID value currently set.
  criteria: optimizely.settings:optimizely_id is 4242000 (readable via `drush cget optimizely.settings
    optimizely_id`).
  bundle: optimizely
  rubric_ref: rubric/optimizely_optimizely_known_account@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/optimizely-account-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/optimizely-account-cleanup.sh
- id: optimizely-create-project
  input: On this Drupal site, using the Optimizely module, create a new enabled Optimizely project that
    loads Optimizely project code 777000 only on campaign pages under the path /campaign/* (not sitewide).
    Apply the change to the live site.
  criteria: A new 'optimizely' config entity exists with code 777000, state TRUE and paths containing
    /campaign/* (created via the add-project form at /admin/config/system/optimizely/add or the optimizely
    entity storage). The built-in default project is left alone.
  bundle: optimizely
  rubric_ref: rubric/optimizely_optimizely_create_project@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/optimizely-create-project-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/optimizely-create-project-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/optimizely-create-project-verify.sh
    unused_text_checks:
      must_contain_any: []
      must_not_contain: []
- id: optimizely-disable-default
  input: On this Drupal site, the built-in sitewide Optimizely 'default' project is currently enabled
    and loads Optimizely on every page. Using the Optimizely module, stop it from loading sitewide without
    deleting it. Apply the change to the live site.
  criteria: The 'default' project's state is set to FALSE (disabled) - e.g. via the edit form at /admin/config/system/optimizely/default
    or by setting state on optimizely.optimizely.default - so getState() is falsey and the sitewide snippet
    no longer loads. The entity is not deleted (it cannot be).
  bundle: optimizely
  rubric_ref: rubric/optimizely_optimizely_disable_default@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/optimizely-disable-default-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/optimizely-disable-default-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/optimizely-disable-default-verify.sh
    unused_text_checks:
      must_contain_any: []
      must_not_contain: []
