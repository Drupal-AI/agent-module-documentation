rubrics:
- id: openapi_ui_openapi_ui_plugin_type_easy
  version: '1.0'
  applicable_bundles:
  - openapi_ui
  checks:
  - kind: must_contain_any
    values:
    - plugin.manager.openapi_ui.ui
  scoring:
    combine: all_pass
- id: openapi_ui_openapi_ui_render_element_easy
  version: '1.0'
  applicable_bundles:
  - openapi_ui
  checks:
  - kind: must_contain_any
    values:
    - '#openapi_ui_plugin'
    - '#openapi_schema'
  scoring:
    combine: all_pass
- id: openapi_ui_openapi_ui_ships_no_plugins_easy
  version: '1.0'
  applicable_bundles:
  - openapi_ui
  checks:
  - kind: must_contain_any
    values:
    - openapi_ui_swagger
    - openapi_ui_redoc
  scoring:
    combine: all_pass
- id: openapi_ui_openapi_ui_known_plugin_id_medium
  version: '1.0'
  applicable_bundles:
  - openapi_ui
  checks:
  - kind: must_contain_any
    values:
    - eval_fixture
  scoring:
    combine: all_pass
- id: openapi_ui_openapi_ui_known_plugin_label_medium
  version: '1.0'
  applicable_bundles:
  - openapi_ui
  checks:
  - kind: must_contain_any
    values:
    - Eval Fixture Renderer
  scoring:
    combine: all_pass
- id: openapi_ui_openapi_ui_build_plugin_hard
  version: '1.0'
  applicable_bundles:
  - openapi_ui
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
- id: openapi_ui_openapi_ui_render_element_hard
  version: '1.0'
  applicable_bundles:
  - openapi_ui
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
