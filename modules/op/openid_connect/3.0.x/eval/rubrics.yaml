rubrics:
- id: openid_connect_openid_connect_plugin_type
  version: '1.0'
  applicable_bundles:
  - openid_connect
  checks:
  - kind: must_contain_any
    values:
    - OpenIDConnectClientBase
    - OpenIDConnectClientInterface
    - openid_connect_client
    - Plugin/OpenIDConnectClient
  scoring:
    combine: all_pass
- id: openid_connect_openid_connect_add_client_method
  version: '1.0'
  applicable_bundles:
  - openid_connect
  checks:
  - kind: must_contain_any
    values:
    - getEndpoints
  scoring:
    combine: all_pass
- id: openid_connect_openid_connect_generic_provider
  version: '1.0'
  applicable_bundles:
  - openid_connect
  checks:
  - kind: must_contain_any
    values:
    - generic
    - issuer_url
    - well-known
    - .well-known
  scoring:
    combine: all_pass
- id: openid_connect_openid_connect_redirect_route
  version: '1.0'
  applicable_bundles:
  - openid_connect
  checks:
  - kind: must_contain_any
    values:
    - /openid-connect/
    - openid_connect.redirect_controller_redirect
  scoring:
    combine: all_pass
- id: openid_connect_openid_connect_claim_mapping_config
  version: '1.0'
  applicable_bundles:
  - openid_connect
  checks:
  - kind: must_contain_any
    values:
    - userinfo_mappings
    - openid_connect.settings
  scoring:
    combine: all_pass
- id: openid_connect_openid_connect_userinfo_hook
  version: '1.0'
  applicable_bundles:
  - openid_connect
  checks:
  - kind: must_contain_any
    values:
    - hook_openid_connect_userinfo_save
    - openid_connect_userinfo_save
  scoring:
    combine: all_pass
- id: openid_connect_openid_connect_permission
  version: '1.0'
  applicable_bundles:
  - openid_connect
  checks:
  - kind: must_contain_any
    values:
    - administer openid connect clients
  scoring:
    combine: all_pass
- id: openid_connect_openid_connect_connect_existing
  version: '1.0'
  applicable_bundles:
  - openid_connect
  checks:
  - kind: must_contain_any
    values:
    - connect_existing_users
    - openid_connect.settings
  scoring:
    combine: all_pass
