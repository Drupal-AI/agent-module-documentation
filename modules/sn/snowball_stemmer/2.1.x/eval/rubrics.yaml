rubrics:
- id: snowball_stemmer_ss_enable_on_index
  version: '1.0'
  applicable_bundles:
  - snowball_stemmer
  checks:
  - kind: must_contain_any
    values:
    - snowball_stemmer
    - Snowball stemmer
    - processor
    - re-index
    - reindex
  scoring:
    combine: all_pass
- id: snowball_stemmer_ss_service_api
  version: '1.0'
  applicable_bundles:
  - snowball_stemmer
  checks:
  - kind: must_contain_any
    values:
    - snowball_stemmer.stemmer
    - setLanguage
    - stem(
  scoring:
    combine: all_pass
- id: snowball_stemmer_ss_language_event
  version: '1.0'
  applicable_bundles:
  - snowball_stemmer
  checks:
  - kind: must_contain_any
    values:
    - SetLanguageEvent
    - set_language_code
    - pt-br
    - nb
    - 'no'
    - event
  scoring:
    combine: all_pass
- id: snowball_stemmer_ss_known_processor
  version: '1.0'
  applicable_bundles:
  - snowball_stemmer
  checks:
  - kind: must_contain_any
    values:
    - snowball_stemmer
  scoring:
    combine: all_pass
- id: snowball_stemmer_ss_known_exception
  version: '1.0'
  applicable_bundles:
  - snowball_stemmer
  checks:
  - kind: must_contain_any
    values:
    - drupaling
  scoring:
    combine: all_pass
- id: snowball_stemmer_ss_add_processor
  version: '1.0'
  applicable_bundles:
  - snowball_stemmer
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
- id: snowball_stemmer_ss_add_exception
  version: '1.0'
  applicable_bundles:
  - snowball_stemmer
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
