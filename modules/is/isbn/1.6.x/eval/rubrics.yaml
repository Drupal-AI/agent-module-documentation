rubrics:
- id: isbn_isbn_field_and_plugins
  version: '1.0'
  applicable_bundles:
  - isbn
  checks:
  - kind: must_contain_any
    values:
    - isbn_widget
    - isbn_formatted_formatter
    - isbn_default
  scoring:
    combine: all_pass
- id: isbn_isbn_service
  version: '1.0'
  applicable_bundles:
  - isbn
  checks:
  - kind: must_contain_any
    values:
    - isbn.isbn_service
    - IsbnToolsService
    - isValidIsbn
    - convertIsbn10to13
  scoring:
    combine: all_pass
- id: isbn_isbn_library_requirement
  version: '1.0'
  applicable_bundles:
  - isbn
  checks:
  - kind: must_contain_any
    values:
    - nicebooks/isbn
  scoring:
    combine: all_pass
- id: isbn_isbn_known_field
  version: '1.0'
  applicable_bundles:
  - isbn
  checks:
  - kind: must_contain_any
    values:
    - field_isbn_known
  scoring:
    combine: all_pass
- id: isbn_isbn_formatter
  version: '1.0'
  applicable_bundles:
  - isbn
  checks:
  - kind: must_contain_any
    values:
    - isbn_formatted_formatter
  scoring:
    combine: all_pass
- id: isbn_isbn_create_field
  version: '1.0'
  applicable_bundles:
  - isbn
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
- id: isbn_isbn_set_formatter
  version: '1.0'
  applicable_bundles:
  - isbn
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
