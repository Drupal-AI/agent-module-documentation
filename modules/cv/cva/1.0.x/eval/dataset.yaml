- id: cva-button-compound
  input: 'Using the CVA module''s html_cva Twig function, create a Twig template at web/sites/default/files/cva-eval/button.html.twig
    that defines a `button` component: base class `button`; color variants primary=bg-blue and danger=bg-red;
    size variants sm=text-sm and lg=text-lg; and a compound variant giving color=danger together with
    size=lg the extra class `font-bold`. The template must render two results separated by a single `|`
    with no surrounding whitespace: first apply({color:''danger'', size:''lg''}), then apply({color:''primary'',
    size:''sm''}). The rendered output must be exactly: button bg-red text-lg font-bold|button bg-blue
    text-sm'
  criteria: ''
  bundle: cva
  rubric_ref: rubric/cva_cva_button_compound@1.0
