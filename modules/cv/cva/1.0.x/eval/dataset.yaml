metadata:
  module: cva
  version: 1.0.x
  skill_name: drupal-module-docs
  note: 'CVA is a tiny, config-less module: it registers Twig''s html_cva function and whitelists the
    returned Cva object in Drupal''s Twig sandbox. It ships no admin UI, no config entities, no settings,
    no permissions, and no Drush commands. All three tiers are therefore expressed against its only real
    surface — the Twig runtime. Medium (introspection) cases cannot read a saved config value (there is
    none), so their KNOWN state is the module being enabled and its Twig decorations being live; the agent
    must inspect the running container (twig service class, sandbox policy) to answer. Hard (execution)
    cases have the agent author a real Twig template that uses html_cva and are verified by rendering
    it live against expected class output. There is no per-case setup that writes module-owned config
    because the module owns none.'
questions:
