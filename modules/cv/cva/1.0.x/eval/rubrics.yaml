rubrics:
- id: cva_cva_what_function
  version: '1.0'
  applicable_bundles:
  - cva
  checks:
  - kind: must_contain_any
    values:
    - html_cva
  - kind: must_not_contain
    values:
    - admin/config
  scoring:
    combine: all_pass
- id: cva_cva_apply_basics
  version: '1.0'
  applicable_bundles:
  - cva
  checks:
  - kind: must_contain_any
    values:
    - apply
    - .apply
  scoring:
    combine: all_pass
- id: cva_cva_compound_and_tailwind
  version: '1.0'
  applicable_bundles:
  - cva
  checks:
  - kind: must_contain_any
    values:
    - compound_variants
    - compound
  scoring:
    combine: all_pass
- id: cva_cva_twig_env_class
  version: '1.0'
  applicable_bundles:
  - cva
  checks:
  - kind: must_contain_any
    values:
    - CvaTwigEnvironment
    - Drupal\cva\Twig\CvaTwigEnvironment
  scoring:
    combine: all_pass
- id: cva_cva_sandbox_policy
  version: '1.0'
  applicable_bundles:
  - cva
  checks:
  - kind: must_contain_any
    values:
    - CvaSandboxPolicy
    - Drupal\cva\Twig\CvaSandboxPolicy
  scoring:
    combine: all_pass
- id: cva_cva_button_compound
  version: '1.0'
  applicable_bundles:
  - cva
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
- id: cva_cva_badge_default
  version: '1.0'
  applicable_bundles:
  - cva
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
