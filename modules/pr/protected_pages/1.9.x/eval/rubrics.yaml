rubrics:
- id: protected_pages_protected_pages_add_path
  version: '1.0'
  applicable_bundles:
  - protected_pages
  checks:
  - kind: must_contain_any
    values:
    - admin/config/system/protected_pages/add
    - admin/config/system/protected_pages
    - protected_pages_add
  scoring:
    combine: all_pass
- id: protected_pages_protected_pages_wildcard
  version: '1.0'
  applicable_bundles:
  - protected_pages
  checks:
  - kind: must_contain_any
    values:
    - /members/*
    - wildcard
    - '*'
  scoring:
    combine: all_pass
- id: protected_pages_protected_pages_prompt_redirect
  version: '1.0'
  applicable_bundles:
  - protected_pages
  checks:
  - kind: must_contain_any
    values:
    - protected-page
    - event subscriber
    - KernelEvents::RESPONSE
    - ProtectedPagesSubscriber
    - RedirectResponse
  scoring:
    combine: all_pass
- id: protected_pages_protected_pages_bypass_permission
  version: '1.0'
  applicable_bundles:
  - protected_pages
  checks:
  - kind: must_contain_any
    values:
    - bypass pages password protection
  scoring:
    combine: all_pass
- id: protected_pages_protected_pages_session_length
  version: '1.0'
  applicable_bundles:
  - protected_pages
  checks:
  - kind: must_contain_any
    values:
    - protected_pages_session_expire_time
    - session expire
    - protected_pages.settings
  scoring:
    combine: all_pass
- id: protected_pages_protected_pages_global_password
  version: '1.0'
  applicable_bundles:
  - protected_pages
  checks:
  - kind: must_contain_any
    values:
    - only_global
    - per_page_or_global
    - global password
  scoring:
    combine: all_pass
- id: protected_pages_protected_pages_storage_service
  version: '1.0'
  applicable_bundles:
  - protected_pages
  checks:
  - kind: must_contain_any
    values:
    - protected_pages.storage
    - insertProtectedPage
    - ProtectedPagesStorage
  scoring:
    combine: all_pass
