rubrics:
- id: prlp_prlp_what_it_adds
  version: '1.0'
  applicable_bundles:
  - prlp
  checks:
  - kind: must_contain_any
    values:
    - set new password
    - new password
    - password_confirm
    - landing page
    - reset link
    - password field
  scoring:
    combine: all_pass
- id: prlp_prlp_two_settings
  version: '1.0'
  applicable_bundles:
  - prlp
  checks:
  - kind: must_contain_any
    values:
    - password_required
    - login_destination
  scoring:
    combine: all_pass
- id: prlp_prlp_destination_tokens
  version: '1.0'
  applicable_bundles:
  - prlp
  checks:
  - kind: must_contain_any
    values:
    - login_destination
    - /user/%user/edit
    - '%user'
    - '%front'
    - hook_prlp_login_destination_alter
  scoring:
    combine: all_pass
- id: prlp_prlp_required_state
  version: '1.0'
  applicable_bundles:
  - prlp
  checks:
  - kind: must_contain_any
    values:
    - optional
    - not required
    - 'false'
    - password_required
  scoring:
    combine: all_pass
- id: prlp_prlp_destination_state
  version: '1.0'
  applicable_bundles:
  - prlp
  checks:
  - kind: must_contain_any
    values:
    - /prlp-landing
  scoring:
    combine: all_pass
- id: prlp_prlp_make_optional
  version: '1.0'
  applicable_bundles:
  - prlp
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
- id: prlp_prlp_set_destination
  version: '1.0'
  applicable_bundles:
  - prlp
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
