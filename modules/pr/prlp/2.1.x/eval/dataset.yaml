metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: prlp
  version: 2.1.x
  note: 'PRLP adds a ''Set New Password'' (password_confirm) field to the core user_pass_reset landing
    page and overrides the user.reset.login controller (PrlpController::prlpResetPassLogin) to save the
    new password and redirect. Config object prlp.settings has two keys: password_required (bool, default
    true) and login_destination (string path, default /user/%user/edit; tokens %user -> uid, %front ->
    site front page). Settings form at /admin/config/people/accounts/prlp (permission ''administer prlp
    settings''). It dispatches prlp.password_validate / prlp.password_before_save events and honours hook_prlp_login_destination_alter.
    Medium cases set a known password_required / login_destination value and read it back. Hard cases
    require making the password optional / changing the destination, verified against the live config;
    reset restores shipped defaults so verify fails on empty state. No Drush, no plugins.'
questions:
- id: prlp-what-it-adds
  input: What does the PRLP (Password Reset Landing Page) module add to Drupal's password reset flow?
  criteria: It adds a 'Set New Password' (password_confirm) field to the core one-time-login / password
    reset landing page (user_pass_reset form) so users choose a new password on arrival, and overrides
    user.reset.login to save it and redirect.
  bundle: prlp
  rubric_ref: rubric/prlp_prlp_what_it_adds@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: prlp-two-settings
  input: What are PRLP's two configuration settings and where is the settings form?
  criteria: password_required (whether entering a new password is required, default true) and login_destination
    (where the user is sent after login, default /user/%user/edit). Form at /admin/config/people/accounts/prlp
    (permission 'administer prlp settings').
  bundle: prlp
  rubric_ref: rubric/prlp_prlp_two_settings@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: prlp-destination-tokens
  input: In PRLP, where are users sent after logging in via a reset link by default, and how can that
    destination be customized?
  criteria: By default to /user/%user/edit (%user = uid, %front = site front page). Customize via the
    login_destination setting, or programmatically with hook_prlp_login_destination_alter(&$login_destination).
  bundle: prlp
  rubric_ref: rubric/prlp_prlp_destination_tokens@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: prlp-required-state
  input: On this site, when a user follows a password reset link, are they required to enter a new password,
    or is it optional? Inspect PRLP's live configuration to answer.
  criteria: 'It is optional: prlp.settings password_required = false (drush cget prlp.settings password_required).'
  bundle: prlp
  rubric_ref: rubric/prlp_prlp_required_state@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/prlp-required-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/prlp-required-cleanup.sh
- id: prlp-destination-state
  input: Inspect this site's PRLP configuration and tell me which path a user is redirected to after logging
    in through a password reset link.
  criteria: 'To /prlp-landing: prlp.settings login_destination = /prlp-landing.'
  bundle: prlp
  rubric_ref: rubric/prlp_prlp_destination_state@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/prlp-destination-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/prlp-destination-cleanup.sh
- id: prlp-make-optional
  input: Using the PRLP module, configure this site so that entering a new password on the password reset
    landing page is optional (users may just log in without setting a new password). Apply the change
    to the live site.
  criteria: prlp.settings password_required = false. e.g. \Drupal::configFactory()->getEditable('prlp.settings')->set('password_required',
    FALSE)->save(); or untick 'Password Entry Required' at /admin/config/people/accounts/prlp.
  bundle: prlp
  rubric_ref: rubric/prlp_prlp_make_optional@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/prlp-make-optional-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/prlp-make-optional-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/prlp-make-optional-verify.sh
- id: prlp-set-destination
  input: Configure PRLP so that after a user logs in via a password reset link they are taken to their
    account canonical page (path /user/%user, where %user is their user id) instead of the account edit
    page. Apply the change to the live site.
  criteria: prlp.settings login_destination = '/user/%user'. Set via ->set('login_destination', '/user/%user')->save()
    or the 'Login Destination' field on the settings form.
  bundle: prlp
  rubric_ref: rubric/prlp_prlp_set_destination@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/prlp-set-destination-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/prlp-set-destination-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/prlp-set-destination-verify.sh
