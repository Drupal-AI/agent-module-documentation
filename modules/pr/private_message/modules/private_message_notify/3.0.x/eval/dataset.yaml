metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: private_message_notify
  version: 3.0.x
  note: private_message_notify is the Private Message submodule that emails thread members when a new
    message arrives, via the Message + Message Notify stack. Service private_message_notify.notifier (PrivateMessageNotifierInterface::notify($message,$thread)).
    Its shouldSend() reads private_message.settings keys (enable_notifications, notify_by_default, notify_when_using,
    number_of_seconds_considered_away) plus per-user user.data. The notification is a 'message' entity
    of template 'private_message_notification' (fields field_message_private_message, field_message_pm_thread)
    sent through message_notify.sender. hook_private_message_notify_exclude() lets modules exclude recipients.
    No routes/permissions/schema of its own; it drives the parent's config. This is a submodule glue over
    message_notify, so it uses 3 easy / 1 medium / 1 hard, grounded in the private_message.settings flags
    shouldSend() reads.
questions:
- id: private_message_notify-trigger-recipe
  input: In the Drupal private_message_notify submodule, what triggers an email notification when a new
    private message is posted, and which service/method does the work?
  criteria: When a new message is added to a thread (hook_private_message_new_message), the private_message_notify.notifier
    service's notify($message, $thread) runs. It builds a 'message' entity of template private_message_notification
    and sends it through message_notify.sender to eligible thread members.
  bundle: private_message_notify
  rubric_ref: rubric/private_message_notify_private_message_notify_trigger_recipe@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: private_message_notify-conditions-recipe
  input: Which private_message.settings flags decide whether private_message_notify actually sends a notification
    to a recipient?
  criteria: shouldSend() sends only when private_message.settings:enable_notifications is TRUE, the recipient
    is eligible (their user.data 'receive_notification' is on, or unset while notify_by_default is TRUE),
    and either notify_when_using is 'yes' or the recipient has been away longer than number_of_seconds_considered_away.
    Per-user user.data overrides the system defaults.
  bundle: private_message_notify
  rubric_ref: rubric/private_message_notify_private_message_notify_conditions_recipe@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: private_message_notify-exclude-recipe
  input: How can another module stop private_message_notify from emailing a particular recipient about
    a new message?
  criteria: 'Implement hook_private_message_notify_exclude(PrivateMessageInterface $privateMessage, PrivateMessageThreadInterface
    $thread, array &$exclude): add the recipient''s UID to the &$exclude array (e.g. based on a mute flag).
    getNotificationRecipients() drops those UIDs.'
  bundle: private_message_notify
  rubric_ref: rubric/private_message_notify_private_message_notify_exclude_recipe@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: private_message_notify-default-off-introspect
  input: On this Drupal site, inspect the Private Message configuration and state whether new users are
    notified of private messages by default (the notify-by-default setting that private_message_notify's
    shouldSend() consults).
  criteria: 'notify-by-default is OFF: private_message.settings:notify_by_default is FALSE (shipped default
    is TRUE). So a user who has made no personal choice will NOT receive notifications. Read it with drush
    config:get private_message.settings notify_by_default.'
  bundle: private_message_notify
  rubric_ref: rubric/private_message_notify_private_message_notify_default_off_introspect@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/private_message_notify-default-off-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/private_message_notify-default-off-cleanup.sh
- id: private_message_notify-enable-execute
  input: 'On this Drupal site, make private message email notifications work by default: turn notifications
    ON site-wide and make them apply to users who have not set a personal preference. Apply the change
    to the live configuration.'
  criteria: Set private_message.settings:enable_notifications to TRUE and notify_by_default to TRUE (e.g.
    drush config:set private_message.settings enable_notifications 1 -y; drush config:set private_message.settings
    notify_by_default 1 -y) - the two flags the notifier's shouldSend() requires to email by default.
    Verify checks both are TRUE.
  bundle: private_message_notify
  rubric_ref: rubric/private_message_notify_private_message_notify_enable_execute@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/private_message_notify-enable-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/private_message_notify-enable-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/private_message_notify-enable-verify.sh
