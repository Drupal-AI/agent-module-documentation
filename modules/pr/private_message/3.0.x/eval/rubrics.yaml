rubrics:
- id: private_message_private_message_settings_recipe
  version: '1.0'
  applicable_bundles:
  - private_message
  checks:
  - kind: must_contain_any
    values:
    - private_message.settings
    - enable_notifications
    - number_of_seconds_considered_away
    - ban_mode
    - keys_send
  scoring:
    combine: all_pass
- id: private_message_private_message_send_api_recipe
  version: '1.0'
  applicable_bundles:
  - private_message
  checks:
  - kind: must_contain_any
    values:
    - private_message.thread_manager
    - saveThread
    - getThreadForMembers
    - private_message.service
  scoring:
    combine: all_pass
- id: private_message_private_message_access_recipe
  version: '1.0'
  applicable_bundles:
  - private_message
  checks:
  - kind: must_contain_any
    values:
    - use private messaging system
    - /private-messages
    - private_message.private_message_page
  scoring:
    combine: all_pass
- id: private_message_private_message_away_threshold_introspect
  version: '1.0'
  applicable_bundles:
  - private_message
  checks:
  - kind: must_contain_any
    values:
    - '4242'
  scoring:
    combine: all_pass
- id: private_message_private_message_ban_mode_introspect
  version: '1.0'
  applicable_bundles:
  - private_message
  checks:
  - kind: must_contain_any
    values:
    - active
  scoring:
    combine: all_pass
- id: private_message_private_message_create_thread_execute
  version: '1.0'
  applicable_bundles:
  - private_message
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
- id: private_message_private_message_global_config_execute
  version: '1.0'
  applicable_bundles:
  - private_message
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
