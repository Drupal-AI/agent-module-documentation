rubrics:
- id: protect_form_flood_control_pfffc_window_threshold
  version: '1.0'
  applicable_bundles:
  - protect_form_flood_control
  checks:
  - kind: must_contain_any
    values:
    - general.window
    - general.threshold
    - protect_form_flood_control.settings
  scoring:
    combine: all_pass
- id: protect_form_flood_control_pfffc_flood_service
  version: '1.0'
  applicable_bundles:
  - protect_form_flood_control
  checks:
  - kind: must_contain_any
    values:
    - flood
    - isAllowed
  scoring:
    combine: all_pass
- id: protect_form_flood_control_pfffc_protect_all_exempt
  version: '1.0'
  applicable_bundles:
  - protect_form_flood_control
  checks:
  - kind: must_contain_any
    values:
    - protect_all
    - system_
    - views_exposed_form_
    - search_
  scoring:
    combine: all_pass
- id: protect_form_flood_control_pfffc_threshold_read
  version: '1.0'
  applicable_bundles:
  - protect_form_flood_control
  checks:
  - kind: must_contain_any
    values:
    - '7'
  scoring:
    combine: all_pass
- id: protect_form_flood_control_pfffc_protected_ids_read
  version: '1.0'
  applicable_bundles:
  - protect_form_flood_control
  checks:
  - kind: must_contain_any
    values:
    - user_register_form
  scoring:
    combine: all_pass
- id: protect_form_flood_control_pfffc_enable_protect_all
  version: '1.0'
  applicable_bundles:
  - protect_form_flood_control
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
- id: protect_form_flood_control_pfffc_protect_contact_form
  version: '1.0'
  applicable_bundles:
  - protect_form_flood_control
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
