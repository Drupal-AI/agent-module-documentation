metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: provus_mega_menu
  version: 1.0.x
  note: 'Provus Mega Menu is a presentation-only module for the Provus base theme. It has no settings
    form (configure=null), no permissions, no Drush, no config schema, and no plugins. Its only PHP is
    hook_theme() (registers theme hook menu__extras -> template menu--extras.html.twig, base hook menu_item_extras)
    and hook_form_alter() on menu_link_content_main_form, which uses #states to show field_provus_menu_callout_image
    + field_provus_menu_callout_link on top-level items and field_provus_menu_icon on child items. Those
    callout/icon fields are NOT created by the module - the Provus recipe attaches them to menu_link_content
    (the ''main'' menu bundle). Medium/hard cases are grounded in exactly those field references: introspection
    finds the callout link field the module reads; execution attaches the per-item icon field the template
    renders. Field TYPE is not what is tested (any type with the right machine name satisfies the module);
    scripts avoid the theme registry.'
questions:
- id: provus_mega_menu-what-it-is
  input: What does the provus_mega_menu module do in Drupal, and does it have an admin configuration page?
    Which module does it depend on?
  criteria: It is a presentation/theming module for the Provus base theme that renders the main menu as
    a full-width multi-column mega menu with callout panels and icons. It has no admin settings page (configure=null);
    its behavior comes from a Twig template, CSS/JS library and a form_alter. It depends on menu_item_extras.
  bundle: provus_mega_menu
  rubric_ref: rubric/provus_mega_menu_provus_mega_menu_what_it_is@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: provus_mega_menu-theme-hook
  input: Which theme hook and template does provus_mega_menu register, and which module's rendering does
    it override?
  criteria: hook_theme() registers the theme hook menu__extras using template menu--extras.html.twig with
    base hook menu_item_extras, so it overrides the Menu Item Extras menu rendering. It also attaches
    the provus_mega_menu/main-nav library.
  bundle: provus_mega_menu
  rubric_ref: rubric/provus_mega_menu_provus_mega_menu_theme_hook@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: provus_mega_menu-callout-fields
  input: provus_mega_menu shows some fields only on top-level menu items and another only on child items
    via its form_alter. Name those fields and where they come from.
  criteria: 'On menu_link_content_main_form it uses #states so field_provus_menu_callout_image and field_provus_menu_callout_link
    show only on top-level items (menu_parent main:) and field_provus_menu_icon only on child items. The
    module does not create these fields - the Provus recipe attaches them to menu link content; the template
    renders them.'
  bundle: provus_mega_menu
  rubric_ref: rubric/provus_mega_menu_provus_mega_menu_callout_fields@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: provus_mega_menu-known-field
  input: On this Drupal site a field used by the provus_mega_menu callout panel has been attached to the
    main menu's menu link content. Inspect the live fields on the menu_link_content 'main' bundle and
    give the machine name of the Provus mega-menu callout link field.
  criteria: The field is field_provus_menu_callout_link, attached to menu_link_content bundle 'main' (a
    link field the mega-menu template renders in the level-1 callout panel).
  bundle: provus_mega_menu
  rubric_ref: rubric/provus_mega_menu_provus_mega_menu_known_field@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/provus_mega_menu-known-field-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/provus_mega_menu-known-field-cleanup.sh
- id: provus_mega_menu-add-icon
  input: provus_mega_menu renders a per-item icon on child menu links from the field field_provus_menu_icon,
    but that field is missing on this site. Attach field_provus_menu_icon to the menu_link_content 'main'
    menu bundle so the module can render icons, and apply it to the live site.
  criteria: A FieldStorageConfig field_provus_menu_icon on entity type menu_link_content plus a FieldConfig
    on bundle 'main' exist (create both and save). The module's template reads item.content.field_provus_menu_icon
    on child links; field type is not important.
  bundle: provus_mega_menu
  rubric_ref: rubric/provus_mega_menu_provus_mega_menu_add_icon@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/provus_mega_menu-add-icon-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/provus_mega_menu-add-icon-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/provus_mega_menu-add-icon-verify.sh
