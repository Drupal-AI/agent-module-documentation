rubrics:
- id: provus_mega_menu_provus_mega_menu_what_it_is
  version: '1.0'
  applicable_bundles:
  - provus_mega_menu
  checks:
  - kind: must_contain_any
    values:
    - mega menu
    - theming
    - template
    - menu_item_extras
    - no configuration
    - configure
  scoring:
    combine: all_pass
- id: provus_mega_menu_provus_mega_menu_theme_hook
  version: '1.0'
  applicable_bundles:
  - provus_mega_menu
  checks:
  - kind: must_contain_any
    values:
    - menu__extras
    - menu--extras
    - base hook
    - menu_item_extras
  scoring:
    combine: all_pass
- id: provus_mega_menu_provus_mega_menu_callout_fields
  version: '1.0'
  applicable_bundles:
  - provus_mega_menu
  checks:
  - kind: must_contain_any
    values:
    - field_provus_menu_callout_image
    - field_provus_menu_callout_link
    - field_provus_menu_icon
  scoring:
    combine: all_pass
- id: provus_mega_menu_provus_mega_menu_known_field
  version: '1.0'
  applicable_bundles:
  - provus_mega_menu
  checks:
  - kind: must_contain_any
    values:
    - field_provus_menu_callout_link
  scoring:
    combine: all_pass
- id: provus_mega_menu_provus_mega_menu_add_icon
  version: '1.0'
  applicable_bundles:
  - provus_mega_menu
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
