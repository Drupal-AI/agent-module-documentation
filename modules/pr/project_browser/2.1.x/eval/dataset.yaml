metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: project_browser
  version: 2.1.x
  note: Project Browser exposes an in-admin module/recipe browsing + install UI, a config settings object,
    a ProjectBrowserSource plugin type, and a Package Manager based install flow. Cases are `recipe` (response-graded)
    since they probe documented facts an agent would otherwise read source to answer; no site mutation.
questions:
- id: project-browser-browse-page
  input: On a Drupal 11 site with Project Browser enabled, where do I go to browse contrib modules in
    the admin UI, and which core permission gates it?
  criteria: The Browse page at Admin > Extend > Browse, path /admin/modules/browse/{source} (route project_browser.browse),
    gated by the core 'administer modules' permission.
  bundle: project_browser
  rubric_ref: rubric/project_browser_project_browser_browse_page@1.0
  tags:
  - mode:recipe
- id: project-browser-source-plugin-type
  input: I want to add a custom catalog of projects to Project Browser. Which plugin type do I implement,
    and what attribute/interface/base class do I use?
  criteria: 'Implement a ProjectBrowserSource plugin: the #[ProjectBrowserSource] attribute, ProjectBrowserSourceInterface,
    extending ProjectBrowserSourceBase, in src/Plugin/ProjectBrowserSource/. Implement getProjects() returning
    a ProjectsResultsPage.'
  bundle: project_browser
  rubric_ref: rubric/project_browser_project_browser_source_plugin_type@1.0
  tags:
  - mode:recipe
- id: project-browser-drupalorg-source
  input: Which Project Browser source plugin queries Drupal.org for contrib modules, and what is its plugin
    ID? Is it the default?
  criteria: The drupalorg_jsonapi source (Contrib modules via the Drupal.org JSON:API), which is the default_source
    in project_browser.admin_settings.
  bundle: project_browser
  rubric_ref: rubric/project_browser_project_browser_drupalorg_source@1.0
  tags:
  - mode:recipe
- id: project-browser-enable-sources
  input: How do I control which Project Browser sources are enabled and which one is shown by default?
    Give the config object and keys.
  criteria: Set enabled_sources (map of plugin ID to settings) and default_source on the project_browser.admin_settings
    config object, editable at the project_browser.settings form.
  bundle: project_browser
  rubric_ref: rubric/project_browser_project_browser_enable_sources@1.0
  tags:
  - mode:recipe
- id: project-browser-ui-install
  input: How do I let users install modules directly from the Project Browser UI, and what core module
    does that require?
  criteria: Set allow_ui_install to true on project_browser.admin_settings and enable core's Package Manager
    module; installs run through a Package Manager sandbox stage (begin/require/apply/post_apply/destroy).
    Without Package Manager the UI only shows the composer require command.
  bundle: project_browser
  rubric_ref: rubric/project_browser_project_browser_ui_install@1.0
  tags:
  - mode:recipe
- id: project-browser-recipes-source
  input: Besides modules, what else can Project Browser browse and apply, and which source plugin handles
    it?
  criteria: 'Recipes: the ''recipes'' source lists recipes in the local code base, and RecipeActivator
    applies a selected recipe.'
  bundle: project_browser
  rubric_ref: rubric/project_browser_project_browser_recipes_source@1.0
  tags:
  - mode:recipe
- id: project-browser-storage-clear
  input: Which Drush command clears Project Browser's stored data?
  criteria: drush project-browser:storage-clear (alias pb-sc).
  bundle: project_browser
  rubric_ref: rubric/project_browser_project_browser_storage_clear@1.0
  tags:
  - mode:recipe
