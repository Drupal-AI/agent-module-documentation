metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: protected_forms
  version: 2.0.x
  note: 'Protected Forms is a spam filter with no plugins/Drush. Config object protected_forms.settings
    has everything under a nested ''protected_forms'' mapping: allowed_scripts (seq), check_quantity (int),
    reject_message (text), reject_patterns (comma/newline list), log_rejected (bool), allowed_patterns
    (string), excluded_forms (seq). Admin route protected_forms.admin at /admin/config/content/protected_forms;
    permissions ''administer protected forms'' and ''bypass protected forms validation''. It adds _protected_forms_validate
    via hook_form_alter to non-admin, non-delete forms whose id contains user_/node_/comment_/contact_message_/webform_
    or equals private_message_add_form. Rejected count is State protected_forms.rejected; rejections log
    to the ''protected forms'' dblog channel. Medium/hard are grounded in the real config object (check_quantity,
    allowed_scripts, excluded_forms); cleanups restore the shipped config/install defaults explicitly.'
questions:
- id: protected_forms-config-object
  input: For the Drupal protected_forms module, which config object stores its settings, and which setting
    holds the list of spam words/patterns that cause a submission to be rejected?
  criteria: Settings live in protected_forms.settings (nested under a 'protected_forms' mapping). The
    spam list is reject_patterns, a comma/newline-separated list of words and URL schemes; a submission
    is rejected if any pattern matches.
  bundle: protected_forms
  rubric_ref: rubric/protected_forms_protected_forms_config_object@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: protected_forms-which-forms
  input: Which forms does protected_forms validate by default, and how can a trusted role skip the spam
    checks?
  criteria: It validates non-admin, non-delete forms whose id contains user_, node_, comment_, contact_message_,
    or webform_ (and private_message_add_form). A role with the 'bypass protected forms validation' permission
    skips all checks; forms listed in excluded_forms are also skipped.
  bundle: protected_forms
  rubric_ref: rubric/protected_forms_protected_forms_which_forms@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: protected_forms-scripts
  input: Besides matching bad words, how does protected_forms block foreign-language spam, and which setting
    controls that? What setting limits how much of the text it samples?
  criteria: It samples up to check_quantity random characters and rejects the submission if any character
    belongs to a Unicode script not listed in allowed_scripts (e.g. Latin-only sites block Cyrillic/CJK).
    allowed_scripts is the allowlist; check_quantity is the sample size.
  bundle: protected_forms
  rubric_ref: rubric/protected_forms_protected_forms_scripts@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: protected_forms-known-quantity
  input: On this Drupal site, protected_forms is configured. Inspect the live configuration and state
    how many characters it samples for the language-script check (the check_quantity value).
  criteria: 'check_quantity is 42: protected_forms.settings -> protected_forms.check_quantity = 42. Read
    it with drush cget protected_forms.settings protected_forms.check_quantity.'
  bundle: protected_forms
  rubric_ref: rubric/protected_forms_protected_forms_known_quantity@1.0
  tags:
  - mode:introspection
  - difficulty:medium
