rubrics:
- id: printable_pdf_printable_pdf_what_it_adds
  version: '1.0'
  applicable_bundles:
  - printable_pdf
  checks:
  - kind: must_contain_any
    values:
    - pdf
    - pdf_api
    - PrintableFormat
    - PdfFormat
  scoring:
    combine: all_pass
- id: printable_pdf_printable_pdf_download_setting
  version: '1.0'
  applicable_bundles:
  - printable_pdf
  checks:
  - kind: must_contain_any
    values:
    - save_pdf
  scoring:
    combine: all_pass
- id: printable_pdf_printable_pdf_link_locations_key
  version: '1.0'
  applicable_bundles:
  - printable_pdf
  checks:
  - kind: must_contain_any
    values:
    - printable_pdf_link_locations
    - links/pdf
    - printable.pdf_ui
  scoring:
    combine: all_pass
- id: printable_pdf_printable_pdf_where_links
  version: '1.0'
  applicable_bundles:
  - printable_pdf
  checks:
  - kind: must_contain_any
    values:
    - node
  scoring:
    combine: all_pass
- id: printable_pdf_printable_pdf_inline_or_download
  version: '1.0'
  applicable_bundles:
  - printable_pdf
  checks:
  - kind: must_contain_any
    values:
    - download
    - attachment
    - save_pdf
  scoring:
    combine: all_pass
- id: printable_pdf_printable_pdf_enable_node_link
  version: '1.0'
  applicable_bundles:
  - printable_pdf
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
- id: printable_pdf_printable_pdf_download_mode
  version: '1.0'
  applicable_bundles:
  - printable_pdf
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
