metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: printable_pdf
  version: 3.1.x
  note: 'Printable PDF is a submodule of Printable providing the ''pdf'' PrintableFormat plugin (PdfFormat),
    which renders content entities as PDF via pdf_api. It depends on printable + pdf_api and has NO config
    object of its own; it reads the parent''s printable.settings. Adds /{entity}/printable/pdf. Key settings
    it consumes: pdf_tool (pdf_api generator: wkhtmltopdf/tcpdf/mpdf/dompdf; empty => 404), printable_pdf_link_locations
    (where PDF links show), save_pdf (true=download/attachment, false=inline), paper_size, page_orientation.
    Medium/hard cases are grounded in the pdf-specific printable.settings keys (printable_pdf_link_locations
    and save_pdf), distinct from the parent module''s cases. Baselines restored explicitly: printable_pdf_link_locations=[''''],
    save_pdf=false.'
questions:
- id: printable_pdf-what-it-adds
  input: What does the printable_pdf submodule add on top of the printable module, and what other module
    does it require to actually produce a PDF?
  criteria: It adds the 'pdf' PrintableFormat plugin (PdfFormat), giving each printable entity a /{entity}/printable/pdf
    URL. It requires the pdf_api module (and a toolkit) to generate the PDF; the toolkit is chosen in
    printable.settings.pdf_tool.
  bundle: printable_pdf
  rubric_ref: rubric/printable_pdf_printable_pdf_what_it_adds@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: printable_pdf-download-setting
  input: With printable_pdf, which setting decides whether the generated PDF is downloaded as a file attachment
    or shown inline in the browser?
  criteria: 'printable.settings.save_pdf: when TRUE the PDF is returned as an attachment (download), when
    FALSE it is shown inline. (printable_pdf reads the parent printable.settings; it has no config of
    its own.)'
  bundle: printable_pdf
  rubric_ref: rubric/printable_pdf_printable_pdf_download_setting@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: printable_pdf-link-locations-key
  input: In printable_pdf, which configuration key controls on which entity types the PDF link is displayed,
    and where is it edited?
  criteria: printable.settings.printable_pdf_link_locations lists the entity types that show a PDF link.
    It is edited on the parent form at /admin/config/user-interface/printable/links/pdf (route printable.pdf_ui).
  bundle: printable_pdf
  rubric_ref: rubric/printable_pdf_printable_pdf_link_locations_key@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: printable_pdf-where-links
  input: On this site, on which entity type(s) is the printable PDF link currently configured to appear?
    Inspect the live configuration and answer.
  criteria: 'Node: printable.settings.printable_pdf_link_locations is [''node''], so the PDF link shows
    on node entities.'
  bundle: printable_pdf
  rubric_ref: rubric/printable_pdf_printable_pdf_where_links@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/printable_pdf-link-loc-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/printable_pdf-link-loc-cleanup.sh
- id: printable_pdf-inline-or-download
  input: Right now, does the printable_pdf module serve generated PDFs as a download (attachment) or inline
    in the browser on this site? Inspect the live configuration to decide.
  criteria: 'As a download (attachment): printable.settings.save_pdf is TRUE, so PdfFormat returns the
    PDF with a Content-Disposition of attachment rather than inline.'
  bundle: printable_pdf
  rubric_ref: rubric/printable_pdf_printable_pdf_inline_or_download@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/printable_pdf-save-mode-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/printable_pdf-save-mode-cleanup.sh
- id: printable_pdf-enable-node-link
  input: Configure the printable_pdf module so that a PDF download link appears on node pages, and apply
    the change to the live site.
  criteria: Add 'node' to printable.settings.printable_pdf_link_locations (e.g. set it to ['node'] via
    the config API, or tick node on /admin/config/user-interface/printable/links/pdf). in_array('node',
    printable_pdf_link_locations) is then TRUE.
  bundle: printable_pdf
  rubric_ref: rubric/printable_pdf_printable_pdf_enable_node_link@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/printable_pdf-enable-node-link-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/printable_pdf-enable-node-link-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/printable_pdf-enable-node-link-verify.sh
- id: printable_pdf-download-mode
  input: Change the printable_pdf configuration so that generated PDFs are downloaded as a file (attachment)
    instead of being shown inline in the browser. Apply it to the live site.
  criteria: Set printable.settings.save_pdf to TRUE (e.g. drush cset printable.settings save_pdf 1 -y,
    or the config API, or the PDF config form). \Drupal::config('printable.settings')->get('save_pdf')
    is then TRUE, so PdfFormat sends the PDF as an attachment.
  bundle: printable_pdf
  rubric_ref: rubric/printable_pdf_printable_pdf_download_mode@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/printable_pdf-download-mode-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/printable_pdf-download-mode-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/printable_pdf-download-mode-verify.sh
