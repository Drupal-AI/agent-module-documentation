rubrics:
- id: printable_printable_urls
  version: '1.0'
  applicable_bundles:
  - printable
  checks:
  - kind: must_contain_any
    values:
    - /node/12/printable/print
    - /node/12/printable/pdf
    - /printable/print
    - /printable/pdf
    - printable/{format}
  scoring:
    combine: all_pass
- id: printable_printable_config
  version: '1.0'
  applicable_bundles:
  - printable
  checks:
  - kind: must_contain_any
    values:
    - printable.settings
    - printable.configure
    - user-interface/printable
    - printable_entities
    - node
  scoring:
    combine: all_pass
- id: printable_printable_plugins
  version: '1.0'
  applicable_bundles:
  - printable
  checks:
  - kind: must_contain_any
    values:
    - PrintableFormat
    - PrintableLinkExtractor
    - print
    - pdf
    - extract
    - subscript
  scoring:
    combine: all_pass
- id: printable_printable_which_pdf_tool
  version: '1.0'
  applicable_bundles:
  - printable
  checks:
  - kind: must_contain_any
    values:
    - tcpdf
  scoring:
    combine: all_pass
- id: printable_printable_paper_size
  version: '1.0'
  applicable_bundles:
  - printable
  checks:
  - kind: must_contain_any
    values:
    - Letter
  scoring:
    combine: all_pass
- id: printable_printable_set_orientation
  version: '1.0'
  applicable_bundles:
  - printable
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
- id: printable_printable_comment_print_link
  version: '1.0'
  applicable_bundles:
  - printable
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
