metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: printable
  version: 3.1.x
  note: 'Printable renders printer-friendly (and, via the printable_pdf submodule, PDF) versions of content
    entities at /{entity_type}/{entity}/printable/{format} (e.g. /node/{nid}/printable/print and /printable/pdf).
    All state is in the printable.settings config object, edited under /admin/config/user-interface/printable
    (route printable.configure). It defines two plugin types: PrintableFormat (ids print, and pdf in the
    submodule) and PrintableLinkExtractor (none/remove/extract/subscript). Permissions: administer printable,
    view printer friendly versions. Default printable entities: node, comment, user. Medium/hard cases
    are grounded in the real printable.settings keys: introspection reads pdf_tool and paper_size; execution
    writes page_orientation and printable_print_link_locations. Baselines are restored explicitly (pdf_tool='''',
    paper_size=A4, page_orientation=Portrait, printable_print_link_locations=[node]).'
questions:
- id: printable-urls
  input: With the printable module enabled, what are the URLs that show the printer-friendly HTML version
    and the PDF version of a node with id 12?
  criteria: The printer-friendly page is /node/12/printable/print and the PDF is /node/12/printable/pdf
    (pattern /{entity_type}/{entity}/printable/{format}, route printable.show_format.node). The PDF format
    requires the printable_pdf submodule and a configured pdf_tool.
  bundle: printable
  rubric_ref: rubric/printable_printable_urls@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: printable-config
  input: Where is the printable module configured (route/path and config object), and which entity types
    get a printable version by default?
  criteria: Config route printable.configure at /admin/config/user-interface/printable (with /print, /pdf,
    /links, /links/pdf sub-forms). All settings live in the printable.settings config object. By default
    printable_entities is [node, comment, user].
  bundle: printable
  rubric_ref: rubric/printable_printable_config@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: printable-plugins
  input: The printable module has a pluggable system for output formats and for handling in-content links.
    Name the two plugin types, the shipped format plugin ids, and the link-extractor options.
  criteria: 'PrintableFormat plugins provide output formats: ''print'' (this module) and ''pdf'' (printable_pdf
    submodule). PrintableLinkExtractor plugins rewrite in-content links, chosen via printable.settings.extract_links:
    none (unchanged), remove (drop href), extract (URL in brackets), subscript.'
  bundle: printable
  rubric_ref: rubric/printable_printable_plugins@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: printable-which-pdf-tool
  input: On this Drupal site, which PDF generation toolkit is currently selected for the printable module?
    Inspect the live configuration and answer.
  criteria: 'TCPDF: printable.settings.pdf_tool is ''tcpdf'' (read via drush cget printable.settings pdf_tool).
    This is the pdf_api toolkit id the printable/printable_pdf PDF format uses.'
  bundle: printable
  rubric_ref: rubric/printable_printable_which_pdf_tool@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/printable-pdf-tool-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/printable-pdf-tool-cleanup.sh
- id: printable-paper-size
  input: What paper size is the printable module's PDF output configured to use on this site right now?
    Inspect the running configuration.
  criteria: 'Letter: printable.settings.paper_size is ''Letter'' (its shipped default is A4). Read via
    drush cget printable.settings paper_size.'
  bundle: printable
  rubric_ref: rubric/printable_printable_paper_size@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/printable-paper-size-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/printable-paper-size-cleanup.sh
- id: printable-set-orientation
  input: Configure the printable module so its generated PDFs use Landscape page orientation instead of
    Portrait, and apply the change to the live site.
  criteria: Set printable.settings.page_orientation to 'Landscape', e.g. drush cset printable.settings
    page_orientation Landscape -y (or via the PDF configuration form at /admin/config/user-interface/printable/pdf,
    or the config API). \Drupal::config('printable.settings')->get('page_orientation') then returns 'Landscape'.
  bundle: printable
  rubric_ref: rubric/printable_printable_set_orientation@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/printable-orientation-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/printable-orientation-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/printable-orientation-verify.sh
- id: printable-comment-print-link
  input: Right now the printable module only shows Print links on nodes. Configure it so the Print link
    also appears on comment entities, applied to the live site.
  criteria: Add 'comment' to printable.settings.printable_print_link_locations (e.g. set it to ['node','comment']
    via the config API, or tick comment on /admin/config/user-interface/printable/links). in_array('comment',
    printable_print_link_locations) is then TRUE.
  bundle: printable
  rubric_ref: rubric/printable_printable_comment_print_link@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/printable-comment-print-link-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/printable-comment-print-link-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/printable-comment-print-link-verify.sh
