rubrics:
- id: prepopulate_prepopulate_title_url
  version: '1.0'
  applicable_bundles:
  - prepopulate
  checks:
  - kind: must_contain_any
    values:
    - edit[title][widget][0][value]
    - edit%5Btitle%5D%5Bwidget%5D%5B0%5D%5Bvalue%5D
  scoring:
    combine: all_pass
- id: prepopulate_prepopulate_radios_excluded
  version: '1.0'
  applicable_bundles:
  - prepopulate
  checks:
  - kind: must_contain_any
    values:
    - radios
    - whitelist
    - checkboxes
  scoring:
    combine: all_pass
- id: prepopulate_prepopulate_whitelist_hook
  version: '1.0'
  applicable_bundles:
  - prepopulate
  checks:
  - kind: must_contain_any
    values:
    - hook_prepopulate_whitelist_alter
  scoring:
    combine: all_pass
- id: prepopulate_prepopulate_known_ref_field
  version: '1.0'
  applicable_bundles:
  - prepopulate
  checks:
  - kind: must_contain_any
    values:
    - edit[field_prepop_ref][widget][0][target_id]
    - edit%5Bfield_prepop_ref%5D%5Bwidget%5D%5B0%5D%5Btarget_id%5D
  scoring:
    combine: all_pass
- id: prepopulate_prepopulate_non_whitelisted_widget
  version: '1.0'
  applicable_bundles:
  - prepopulate
  checks:
  - kind: must_contain_any
    values:
    - field_prepop_b
  scoring:
    combine: all_pass
- id: prepopulate_prepopulate_whitelist_radios
  version: '1.0'
  applicable_bundles:
  - prepopulate
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
- id: prepopulate_prepopulate_menu_link
  version: '1.0'
  applicable_bundles:
  - prepopulate
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
