metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: prepopulate
  version: 2.5.x
  note: 'Prepopulate has no settings form, no configure route (configure: null), no permissions, no Drush
    commands, no config schema and no plugins. Its entire surface is (1) the edit[...] query-string syntax
    mirroring the render array, (2) the prepopulate.populator service (Drupal\prepopulate\Populate::populateForm())
    with its 18-type whitelist that deliberately excludes radios/checkboxes, and (3) hook_prepopulate_whitelist_alter().
    Medium cases therefore install real fields on Article and ask the agent to derive the URL / spot the
    non-whitelisted widget from the live form display; hard cases are verified against live state (the
    runtime whitelist read back by reflection, and a menu_link_content carrying a real prepopulate URL).'
questions:
- id: prepopulate-title-url
  input: On a Drupal 11 site with the contrib module prepopulate enabled, I want a link that opens the
    Article creation form with the title already filled in with 'Weekly update'. What exact URL should
    the link point at?
  criteria: /node/add/article?edit[title][widget][0][value]=Weekly%20update — the query string mirrors
    the render array path under an 'edit' root, and Field API fields need the [widget][0][value] segment.
  bundle: prepopulate
  rubric_ref: rubric/prepopulate_prepopulate_title_url@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: prepopulate-radios-excluded
  input: Using the Drupal prepopulate module I can prefill textfields and select lists from the URL, but
    a field whose widget renders radio buttons is never filled. Is that a bug, and which element types
    does prepopulate allow by default?
  criteria: It is deliberate. Drupal\prepopulate\Populate::$whitelistedTypes contains 18 types (container,
    date, datelist, datetime, entity_autocomplete, email, fieldset, inline_entity_form, language_select,
    machine_name, number, path, select, tel, textarea, text_format, textfield, url) and intentionally
    omits radios and checkboxes so a crafted link cannot silently tick options on an admin form.
  bundle: prepopulate
  rubric_ref: rubric/prepopulate_prepopulate_radios_excluded@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: prepopulate-whitelist-hook
  input: Which hook does the Drupal prepopulate module document in its .api.php file, what is its signature,
    and when does it run?
  criteria: 'hook_prepopulate_whitelist_alter(array &$whitelisted_types) — the only hook prepopulate invites.
    It is invoked from the Populate service constructor ($this->moduleHandler->alter(''prepopulate_whitelist'',
    $this->whitelistedTypes)), so implementations add (or remove) render-element #type strings for the
    whole request.'
  bundle: prepopulate
  rubric_ref: rubric/prepopulate_prepopulate_whitelist_hook@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: prepopulate-known-ref-field
  input: This Drupal site has the prepopulate module enabled and the Article content type has an entity
    reference field that uses an autocomplete widget. Inspect the live site, then give the exact query-string
    parameter that prepopulate needs in order to prefill that field with the node whose id is 1.
  criteria: The field is field_prepop_ref (widget entity_reference_autocomplete on core.entity_form_display.node.article.default),
    so the URL is /node/add/article?edit[field_prepop_ref][widget][0][target_id]=1 . Because the element
    is an entity_autocomplete, prepopulate rewrites the raw id into the 'Label (1)' string when the entity
    exists and the user has 'view label' access.
  bundle: prepopulate
  rubric_ref: rubric/prepopulate_prepopulate_known_ref_field@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/prepopulate-ref-field-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/prepopulate-ref-field-cleanup.sh
- id: prepopulate-non-whitelisted-widget
  input: The Article content type on this Drupal site has three fields whose machine names start with
    field_prepop_ . Exactly one of them cannot be prefilled from the URL by the prepopulate module because
    of the render-element type its widget produces. Inspect the live form display and name that field.
  criteria: field_prepop_b — its widget on core.entity_form_display.node.article.default is options_buttons,
    which renders a 'radios' element, and radios is not in prepopulate's whitelist. field_prepop_a (string_textfield
    -> textfield) and field_prepop_c (options_select -> select) are both whitelisted.
  bundle: prepopulate
  rubric_ref: rubric/prepopulate_prepopulate_non_whitelisted_widget@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/prepopulate-widget-types-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/prepopulate-widget-types-cleanup.sh
- id: prepopulate-whitelist-radios
  input: On this Drupal site, prepopulate refuses to prefill radio buttons because 'radios' is not in
    its whitelist. Create a small custom module at web/modules/custom/prepopulate_eval (machine name prepopulate_eval),
    implement the hook prepopulate provides for altering the whitelist so that 'radios' is allowed, and
    enable the module so the change is live.
  criteria: 'A prepopulate_eval module implementing hook_prepopulate_whitelist_alter(array &$whitelisted_types)
    { $whitelisted_types[] = ''radios''; }, enabled with drush en prepopulate_eval -y. Verified by reading
    Drupal\prepopulate\Populate::$whitelistedTypes off the live prepopulate.populator service: it must
    contain ''radios''.'
  bundle: prepopulate
  rubric_ref: rubric/prepopulate_prepopulate_whitelist_radios@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/prepopulate-whitelist-radios-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/prepopulate-whitelist-radios-reset.sh
    verify: agent-module-documentation/evaluation/verify/prepopulate-whitelist-radios-verify.sh
