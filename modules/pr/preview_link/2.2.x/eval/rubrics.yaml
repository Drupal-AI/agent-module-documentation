rubrics:
- id: preview_link_preview_link_how
  version: '1.0'
  applicable_bundles:
  - preview_link
  checks:
  - kind: must_contain_any
    values:
    - preview_token
    - generate-preview-link
    - Preview Link
    - token
  scoring:
    combine: all_pass
- id: preview_link_preview_link_config
  version: '1.0'
  applicable_bundles:
  - preview_link
  checks:
  - kind: must_contain_any
    values:
    - enabled_entity_types
    - expiry_seconds
    - preview_link.settings
    - '604800'
  scoring:
    combine: all_pass
- id: preview_link_preview_link_permission
  version: '1.0'
  applicable_bundles:
  - preview_link
  checks:
  - kind: must_contain_any
    values:
    - generate preview links
  scoring:
    combine: all_pass
- id: preview_link_preview_link_pl_expiry
  version: '1.0'
  applicable_bundles:
  - preview_link
  checks:
  - kind: must_contain_any
    values:
    - '3600'
  scoring:
    combine: all_pass
- id: preview_link_preview_link_pl_enabled
  version: '1.0'
  applicable_bundles:
  - preview_link
  checks:
  - kind: must_contain_any
    values:
    - article
  scoring:
    combine: all_pass
- id: preview_link_preview_link_pl_enable_article
  version: '1.0'
  applicable_bundles:
  - preview_link
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
- id: preview_link_preview_link_pl_generate
  version: '1.0'
  applicable_bundles:
  - preview_link
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
