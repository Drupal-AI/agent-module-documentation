metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: preview_link
  version: 2.2.x
  note: 'Preview Link defines a ''preview_link'' content entity (UUID token + dynamic_entity_reference
    ''entities'' + expiry) and grants token-based view access to unpublished content. Config object preview_link.settings
    holds enabled_entity_types (map entity_type => [bundles], empty list = all bundles), expiry_seconds
    (default 604800), multiple_entities (true), display_message (always/subsequent/never). Service preview_link.host
    answers hasPreviewLinks()/getPreviewLinks()/isToken(). Permissions: ''generate preview links'', ''administer
    preview link settings''. Medium/hard grounded in the real settings config and in live preview_link
    entities created for a namespaced ''PL Hard Target'' Article node.'
questions:
- id: preview_link-how
  input: A client without a Drupal account needs to preview an unpublished article. Which module solves
    this and how does an editor produce the link the client can open?
  criteria: Preview Link. Enable the entity type in its settings, then on the entity use the 'Preview
    Link' tab (path <canonical>/generate-preview-link) to generate a unique tokenised URL. Opening the
    canonical URL with the valid preview_token grants view access to the unpublished entity even for anonymous
    users.
  bundle: preview_link
  rubric_ref: rubric/preview_link_preview_link_how@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: preview_link-config
  input: In the Preview Link module, which configuration object and keys control which entity types can
    have preview links and how long a link stays valid? What is the default lifetime?
  criteria: 'Config object preview_link.settings: enabled_entity_types (entity type => list of bundles;
    empty list means all bundles), expiry_seconds (link lifetime, default 604800 = 7 days), multiple_entities,
    display_message. Edited at /admin/config/content/preview_link.'
  bundle: preview_link
  rubric_ref: rubric/preview_link_preview_link_config@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: preview_link-permission
  input: Which Preview Link permission does an editorial role need in order to create preview links for
    content?
  criteria: The 'generate preview links' permission. ('administer preview link settings' is a separate
    admin permission for the settings form.) Viewing a previewed entity needs no permission — a valid
    preview_token grants access.
  bundle: preview_link
  rubric_ref: rubric/preview_link_preview_link_permission@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: preview_link-pl-expiry
  input: On this Drupal site, the Preview Link module's link lifetime has been customized. Inspect the
    live configuration and state how many seconds a preview link stays valid.
  criteria: expiry_seconds is 3600 in preview_link.settings (read via `drush config:get preview_link.settings
    expiry_seconds`).
  bundle: preview_link
  rubric_ref: rubric/preview_link_preview_link_pl_expiry@1.0
