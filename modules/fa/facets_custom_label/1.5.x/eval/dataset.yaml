metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: facets_custom_label
  version: 1.5.x
  note: 'Facets Custom Label adds one Facets build-stage processor (id facets_custom_label, stage build
    weight 50) with a single setting replacement_values: newline-separated ''origin|value|new label''
    lines where origin is r (raw value: machine name/entity id) or d (display value: title/term name).
    It rewrites only Result display values (Result::setDisplayValue). No config UI, permissions, Drush,
    or plugin types of its own; requires the Facets module. State lives in facets.facet.<id> -> processor_configs.facets_custom_label.settings.replacement_values.
    Medium/hard cases create namespaced fcl_* facet config entities (with a dummy facet_source_id, which
    Facet::save() accepts) and read/write that processor''s mapping via drush.'
questions:
- id: fcl-mapping-syntax
  input: With the Drupal Facets Custom Label module, I want the facet item whose machine value is 'article'
    to display as 'Awesome news'. What exact line do I put in the processor's Replacement values box,
    and what do the r and d flags mean?
  criteria: Add the line r|article|Awesome news. The format is origin|value|new label; r matches the item's
    raw value (machine name or entity id), d matches its display value (title or term name).
  bundle: facets_custom_label
  rubric_ref: rubric/facets_custom_label_fcl_mapping_syntax@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: fcl-processor-id
  input: Which Facets processor does the Facets Custom Label module provide (its plugin id), at which
    processing stage does it run, and what does it actually change on each facet result?
  criteria: It provides the facets_custom_label build-stage processor (weight 50). At the build stage
    it replaces each matching result's display value (Result::setDisplayValue); raw values, the query,
    and counts are unchanged.
  bundle: facets_custom_label
  rubric_ref: rubric/facets_custom_label_fcl_processor_id@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: fcl-where-stored
  input: There is no separate admin settings page for Facets Custom Label. How do you turn it on for a
    facet, and where in configuration is the label mapping stored?
  criteria: Enable the Facets custom label processor on the individual facet (Processors section of the
    facet edit form). The mapping is stored in facets.facet.<id> under processor_configs.facets_custom_label.settings.replacement_values.
  bundle: facets_custom_label
  rubric_ref: rubric/facets_custom_label_fcl_where_stored@1.0
  tags:
  - mode:recipe
  - difficulty:easy
