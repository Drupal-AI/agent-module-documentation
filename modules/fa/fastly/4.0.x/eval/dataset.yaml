# Generated from evals.json by evaluation/to_commons.py.
# Edit evals.json and rerun the script; do not edit this file.
metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: fastly
  version: 4.0.x
  note: 'Fastly integrates a site with the Fastly CDN: cache-tags -> Surrogate Keys, instant/soft purging,
    stale content, image optimizer, edge modules, webhooks, VCL. All config in the fastly.settings object
    (api_key, service_id, site_id, purge_method instant/soft, purge_logging, cache_tag_hash_length, stale_while_revalidate(+_value),
    stale_if_error(+_value), image_optimization, webp, jpeg_quality, cookie_cache_bypass, webhook_*) plus
    fastly.edge_modules.*. Credentials also come from env FASTLY_API_TOKEN/FASTLY_API_SERVICE/FASTLY_SITE_ID.
    Permission administer fastly. Drush fastly:purge:all/url/key/service (fpall/fpurl/fpkey/fpservice).
    Actual purging needs real Fastly credentials + network, so medium/hard cases are grounded ONLY in
    the local fastly.settings config, never in live API calls.'
questions:
- id: fastly-drush-purge
  input: Which Drush commands does the Fastly module provide to purge its CDN cache, and what are their
    aliases?
  criteria: fastly:purge:all (fpall), fastly:purge:url (fpurl), fastly:purge:key (fpkey) and fastly:purge:service
    (fpservice).
  bundle: fastly
  rubric_ref: rubric/fastly_fastly_drush_purge@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: fastly-credentials
  input: Where does the Fastly Drupal module store the Fastly API token, and what environment variable
    can override it?
  criteria: The token is stored in fastly.settings:api_key (set on the form at /admin/config/services/fastly).
    The FASTLY_API_TOKEN environment variable overrides it when set (as do FASTLY_API_SERVICE / FASTLY_SITE_ID
    for service/site id).
  bundle: fastly
  rubric_ref: rubric/fastly_fastly_credentials@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: fastly-purge-method
  input: The Fastly module supports two purge methods. What are they, and which config key selects between
    them?
  criteria: Instant purge and soft purge, selected by fastly.settings:purge_method (values 'instant' [default]
    or 'soft').
  bundle: fastly
  rubric_ref: rubric/fastly_fastly_purge_method@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: fastly-known-purgemethod
  input: On this Drupal site, inspect the live Fastly configuration and report which purge method is currently
    configured (instant or soft).
  criteria: fastly.settings:purge_method is 'soft' (drush cget fastly.settings purge_method).
  bundle: fastly
  rubric_ref: rubric/fastly_fastly_known_purgemethod@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/fastly-purgemethod-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/fastly-purgemethod-cleanup.sh
- id: fastly-known-siteid
  input: This site's Fastly module has a Site ID configured (used to namespace cache tags). Inspect the
    live configuration and report the Site ID value.
  criteria: fastly.settings:site_id is 'fastly_probe_site'.
  bundle: fastly
  rubric_ref: rubric/fastly_fastly_known_siteid@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/fastly-siteid-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/fastly-siteid-cleanup.sh
- id: fastly-set-purgemethod
  input: Configure the Fastly module on this site to use soft purge instead of instant purge. Apply the
    change to the live configuration. (Do not attempt any live purge against the Fastly API.)
  criteria: fastly.settings:purge_method is set to 'soft' (e.g. drush cset fastly.settings purge_method
    soft).
  bundle: fastly
  rubric_ref: rubric/fastly_fastly_set_purgemethod@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/fastly-set-purgemethod-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/fastly-set-purgemethod-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/fastly-set-purgemethod-verify.sh
- id: fastly-enable-stale
  input: On this site, configure the Fastly module to serve stale content while revalidating, with a stale-while-revalidate
    window of 3600 seconds. Apply the change to the live configuration.
  criteria: fastly.settings:stale_while_revalidate is TRUE and stale_while_revalidate_value is 3600.
  bundle: fastly
  rubric_ref: rubric/fastly_fastly_enable_stale@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/fastly-stale-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/fastly-stale-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/fastly-stale-verify.sh
