rubrics:
- id: fastly_fastly_drush_purge
  version: '1.0'
  applicable_bundles:
  - fastly
  checks:
  - kind: must_contain_any
    values:
    - fastly:purge:all
    - fpall
    - fastly:purge:url
    - fpurl
    - fastly:purge:key
    - fpkey
    - fastly:purge:service
    - fpservice
  scoring:
    combine: all_pass
- id: fastly_fastly_credentials
  version: '1.0'
  applicable_bundles:
  - fastly
  checks:
  - kind: must_contain_any
    values:
    - fastly.settings
    - api_key
    - FASTLY_API_TOKEN
    - /admin/config/services/fastly
  scoring:
    combine: all_pass
- id: fastly_fastly_purge_method
  version: '1.0'
  applicable_bundles:
  - fastly
  checks:
  - kind: must_contain_any
    values:
    - instant
    - soft
    - purge_method
  scoring:
    combine: all_pass
- id: fastly_fastly_known_purgemethod
  version: '1.0'
  applicable_bundles:
  - fastly
  checks:
  - kind: must_contain_any
    values:
    - soft
  scoring:
    combine: all_pass
- id: fastly_fastly_known_siteid
  version: '1.0'
  applicable_bundles:
  - fastly
  checks:
  - kind: must_contain_any
    values:
    - fastly_probe_site
  scoring:
    combine: all_pass
- id: fastly_fastly_set_purgemethod
  version: '1.0'
  applicable_bundles:
  - fastly
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
- id: fastly_fastly_enable_stale
  version: '1.0'
  applicable_bundles:
  - fastly
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
