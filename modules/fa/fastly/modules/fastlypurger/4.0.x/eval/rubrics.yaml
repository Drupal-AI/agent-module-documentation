rubrics:
- id: fastlypurger_fastlypurger_plugin
  version: '1.0'
  applicable_bundles:
  - fastlypurger
  checks:
  - kind: must_contain_any
    values:
    - fastly
    - purger
    - tag
    - url
    - everything
  scoring:
    combine: all_pass
- id: fastlypurger_fastlypurger_diagnostic
  version: '1.0'
  applicable_bundles:
  - fastlypurger
  checks:
  - kind: must_contain_any
    values:
    - fastly_creds
    - CredentialCheck
    - credentials
  scoring:
    combine: all_pass
- id: fastlypurger_fastlypurger_deps
  version: '1.0'
  applicable_bundles:
  - fastlypurger
  checks:
  - kind: must_contain_any
    values:
    - purge
    - fastly
    - p:purger-add
    - purger-add
  scoring:
    combine: all_pass
- id: fastlypurger_fastlypurger_known_registered
  version: '1.0'
  applicable_bundles:
  - fastlypurger
  checks:
  - kind: must_contain_any
    values:
    - fastly
  scoring:
    combine: all_pass
- id: fastlypurger_fastlypurger_known_types
  version: '1.0'
  applicable_bundles:
  - fastlypurger
  checks:
  - kind: must_contain_any
    values:
    - tag
    - url
    - everything
  scoring:
    combine: all_pass
- id: fastlypurger_fastlypurger_add
  version: '1.0'
  applicable_bundles:
  - fastlypurger
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
- id: fastlypurger_fastlypurger_remove
  version: '1.0'
  applicable_bundles:
  - fastlypurger
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
