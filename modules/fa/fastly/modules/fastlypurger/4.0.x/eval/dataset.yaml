metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: fastlypurger
  version: 4.0.x
  note: Fastly Purger is a submodule of fastly that integrates with the contrib Purge module. It provides
    a Purge purger plugin (id 'fastly', types tag/url/everything, multi_instance FALSE, class FastlyPurger
    routing to fastly.api), a Purge diagnostic check 'fastly_creds' (CredentialCheck, dependent_purger_plugins
    {fastly}), and a service provider that clears the cache_tags_invalidator tag from fastly.cache_tags.invalidator.
    It has no config of its own; Fastly credentials come from the parent module and the purger is registered
    in the Purge module's purge.plugins:purgers list. Actual purging needs real Fastly credentials, so
    medium/hard cases are grounded ONLY in the local purge.plugins purger registration, never in live
    API calls.
questions:
- id: fastlypurger-plugin
  input: What does the Drupal fastlypurger submodule add, and what invalidation types does its Purge purger
    support?
  criteria: It adds a Purge purger plugin with id 'fastly' (label Fastly) that supports the invalidation
    types tag, url and everything, routing each to the fastly.api purge calls.
  bundle: fastlypurger
  rubric_ref: rubric/fastlypurger_fastlypurger_plugin@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: fastlypurger-diagnostic
  input: Besides the purger, what Purge diagnostic check does fastlypurger provide and what does it check?
  criteria: It provides the Purge diagnostic check 'fastly_creds' (CredentialCheck), which warns in Purge's
    status report when the configured Fastly API credentials are missing or invalid.
  bundle: fastlypurger
  rubric_ref: rubric/fastlypurger_fastlypurger_diagnostic@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: fastlypurger-deps
  input: Which modules does fastlypurger depend on, and how do you add the Fastly purger to the Purge
    configuration from the command line?
  criteria: It depends on the fastly and purge modules. Add the purger with drush p:purger-add fastly
    (or via the Purge UI). Purgers are stored in purge.plugins:purgers.
  bundle: fastlypurger
  rubric_ref: rubric/fastlypurger_fastlypurger_deps@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: fastlypurger-known-registered
  input: On this Drupal site, inspect the Purge module's configuration and state whether the Fastly purger
    is currently registered as a purger.
  criteria: Yes — purge.plugins:purgers contains an entry whose plugin_id is 'fastly' (the Fastly purger
    is registered).
