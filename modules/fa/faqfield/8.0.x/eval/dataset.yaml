metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: faqfield
  version: 8.0.x
  note: FAQ Field exposes one field type, one widget, and five formatters, with no admin settings page,
    permissions, or routes. Cases are `recipe` (response-graded) probing documented facts an agent would
    otherwise read source to answer; no site mutation.
questions:
- id: faqfield-field-type-id
  input: On a Drupal 11 site I want a field that stores a list of frequently-asked question/answer pairs.
    Which contrib module and field type id do I use, and what three values does each item store?
  criteria: Use the FAQ Field module's `faqfield` field type; each item stores a question, an answer,
    and the answer's text format. Cardinality is forced to unlimited.
  bundle: faqfield
  rubric_ref: rubric/faqfield_faqfield_field_type_id@1.0
  tags:
  - mode:recipe
- id: faqfield-answer-widget-options
  input: Using FAQ Field's widget, how do I give editors a WYSIWYG/CKEditor box for the answer, and what
    are the three answer widget choices?
  criteria: On the faqfield_default widget set the Answer widget to `text_format` (Formattable textarea)
    for WYSIWYG; the three options are `textarea`, `text_format`, and `textfield`.
  bundle: faqfield
  rubric_ref: rubric/faqfield_faqfield_answer_widget_options@1.0
  tags:
  - mode:recipe
- id: faqfield-formatters
  input: What display formatters does FAQ Field provide, and which is the default? I specifically want
    an accordion and a definition list.
  criteria: 'Five formatters: faqfield_accordion (jQuery Accordion, the default), faqfield_definition_list
    (HTML definition list), faqfield_anchor_list, faqfield_details, and faqfield_simple_text.'
  bundle: faqfield
  rubric_ref: rubric/faqfield_faqfield_formatters@1.0
  tags:
  - mode:recipe
- id: faqfield-answer-format-precedence
  input: In FAQ Field, which field setting sets the default text format used to filter answers, and how
    is the format chosen per answer item?
  criteria: The field-level `default_format` setting (default plain_text) is the default; each item uses
    its own answer_format if set, otherwise falls back to default_format, then answers run through check_markup().
  bundle: faqfield
  rubric_ref: rubric/faqfield_faqfield_answer_format_precedence@1.0
  tags:
  - mode:recipe
- id: faqfield-accordion-active
  input: How do I make the FAQ Field jQuery accordion start with all panels closed instead of the first
    one open?
  criteria: On the faqfield_accordion formatter leave the `active` setting blank (it is coerced to FALSE)
    and enable `collapsible` (Fully collapsible) so no panel is open by default.
  bundle: faqfield
  rubric_ref: rubric/faqfield_faqfield_accordion_active@1.0
  tags:
  - mode:recipe
- id: faqfield-dependencies
  input: What are FAQ Field's module dependencies, and does it add any admin settings page or permissions?
  criteria: Depends on core `field` and the `jquery_ui_accordion` module (composer drupal/jquery_ui_accordion
    ^2.0). It has no settings page, no routes, and no permissions; all config is on the entity field/display
    screens.
  bundle: faqfield
  rubric_ref: rubric/faqfield_faqfield_dependencies@1.0
  tags:
  - mode:recipe
- id: faqfield-theming
  input: I want to override the markup of FAQ Field's definition-list output. Which Twig template do I
    copy, and which formatter's markup cannot be safely overridden?
  criteria: Override faqfield-definition-list-formatter.html.twig (theme hook faqfield_definition_list_formatter).
    The jQuery accordion formatter is intentionally not safely themeable because its markup must stay
    intact for jQuery UI.
  bundle: faqfield
  rubric_ref: rubric/faqfield_faqfield_theming@1.0
  tags:
  - mode:recipe
