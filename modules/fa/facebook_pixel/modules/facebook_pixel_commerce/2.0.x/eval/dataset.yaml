metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: facebook_pixel_commerce
  version: 2.0.x
  note: 'Facebook Pixel Commerce is the facebook_pixel submodule that bridges Drupal Commerce. It ships
    no config object: its only site-visible state is whether the checkout pane plugin `facebook_checkout`
    (default_step order_information) is placed in a commerce_checkout_flow config entity, plus the two
    services facebook_pixel_commerce.facebook_commerce (getOrderData / getOrderItemData) and facebook_pixel_commerce.cart_subscriber
    (CartEvents::CART_ENTITY_ADD -> AddToCart with a forced session, commerce_order.place.post_transition
    -> Purchase). hook_ENTITY_TYPE_view() fires ViewContent for commerce_product in the full view mode
    with content_type product or product_group. Medium/hard cases therefore read and write commerce_checkout.commerce_checkout_flow.*
    on the live site.'
questions:
- id: facebook_pixel_commerce-events
  input: Which Facebook Pixel events does the Drupal facebook_pixel_commerce submodule add on top of the
    base facebook_pixel module, and what triggers each of them?
  criteria: ViewContent - hook_ENTITY_TYPE_view() for a commerce_product in the 'full' view mode; AddToCart
    - CartSubscriber on CartEvents::CART_ENTITY_ADD (queued with $start_session TRUE so it survives the
    redirect); InitiateCheckout - the facebook_checkout checkout pane's buildPaneForm(), skipped on XHR
    requests; Purchase - CartSubscriber on the commerce_order.place.post_transition workflow event.
  bundle: facebook_pixel_commerce
  rubric_ref: rubric/facebook_pixel_commerce_facebook_pixel_commerce_events@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: facebook_pixel_commerce-checkout-pane
  input: I enabled facebook_pixel_commerce on my Drupal Commerce site. Which checkout pane plugin is responsible
    for the InitiateCheckout event, which checkout step does it default to, and how do I actually turn
    it off for a flow?
  criteria: 'The checkout pane plugin facebook_checkout (''Facebook Pixel Commerce: Trigger InitiateCheckout
    Event''), whose default_step is order_information. Place or move it at /admin/commerce/config/checkout-flows,
    or set configuration.panes.facebook_checkout.step in commerce_checkout.commerce_checkout_flow.<id>.
    Note that simply omitting the pane from configuration.panes does NOT disable it - CheckoutPaneBase::defaultConfiguration()
    falls back to the plugin''s default_step - so to switch it off you must set its step to _disabled.'
  bundle: facebook_pixel_commerce
  rubric_ref: rubric/facebook_pixel_commerce_facebook_pixel_commerce_checkout_pane@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: facebook_pixel_commerce-order-data
  input: In the Drupal facebook_pixel_commerce module, which service builds the data array sent with the
    Purchase event, which method does it expose, and what keys does the resulting payload contain?
  criteria: 'The service facebook_pixel_commerce.facebook_commerce (Drupal\facebook_pixel_commerce\FacebookCommerce,
    injected with commerce_price.rounder) exposes getOrderData(OrderInterface $order) and getOrderItemData(OrderItemInterface
    $order_item). getOrderData returns value (rounded total as a string), currency, num_items, content_name
    ''order'', content_type ''product'' and, when items exist, contents ([{id: sku, quantity}]) and content_ids.'
  bundle: facebook_pixel_commerce
  rubric_ref: rubric/facebook_pixel_commerce_facebook_pixel_commerce_order_data@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: facebook_pixel_commerce-pane-step
  input: On this Drupal Commerce site, facebook_pixel_commerce's InitiateCheckout pane has been placed
    in the default checkout flow. Inspect the live configuration and say which checkout step it is on
    and what weight it has.
  criteria: 'In commerce_checkout.commerce_checkout_flow.default the pane facebook_checkout is configured
    with step: review and weight: 11 (rather than its default order_information step).'
  bundle: facebook_pixel_commerce
  rubric_ref: rubric/facebook_pixel_commerce_facebook_pixel_commerce_pane_step@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/facebook_pixel_commerce-pane-step-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/facebook_pixel_commerce-pane-step-cleanup.sh
- id: facebook_pixel_commerce-known-flow
  input: This Drupal Commerce site has more than one checkout flow. Inspect the running site and name
    the checkout flow whose customers will trigger the Facebook Pixel InitiateCheckout event.
  criteria: fbpc_known_flow - commerce_checkout.commerce_checkout_flow.fbpc_known_flow runs the facebook_checkout
    pane on the order_information step. In the 'default' flow that pane is explicitly set to step _disabled,
    so checkouts using it fire no InitiateCheckout event.
  bundle: facebook_pixel_commerce
  rubric_ref: rubric/facebook_pixel_commerce_facebook_pixel_commerce_known_flow@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/facebook_pixel_commerce-known-flow-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/facebook_pixel_commerce-known-flow-cleanup.sh
- id: facebook_pixel_commerce-default-flow
  input: Our Drupal Commerce shop reports purchases to Facebook but the 'started checkout' event never
    shows up in Meta Events Manager - someone disabled the Facebook Pixel Commerce checkout pane in our
    normal (default) checkout flow. Put it back so the event is triggered as soon as customers reach the
    order information step, and save it to the live site.
  criteria: 'facebook_pixel_commerce is installed and commerce_checkout.commerce_checkout_flow.default
    has configuration.panes.facebook_checkout with step: order_information (moved out of the _disabled
    region the reset put it in).'
  bundle: facebook_pixel_commerce
  rubric_ref: rubric/facebook_pixel_commerce_facebook_pixel_commerce_default_flow@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: site-owner-layman
    reset: agent-module-documentation/evaluation/verify/facebook_pixel_commerce-default-flow-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/facebook_pixel_commerce-default-flow-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/facebook_pixel_commerce-default-flow-verify.sh
- id: facebook_pixel_commerce-new-flow
  input: On this Drupal Commerce site, create a new checkout flow config entity with the id `fbpc_eval_flow`
    (label 'FBPC eval flow', multistep_default plugin) that includes facebook_pixel_commerce's InitiateCheckout
    checkout pane on the order_information step, alongside the usual login and review panes. Save it to
    the live site.
  criteria: 'commerce_checkout.commerce_checkout_flow.fbpc_eval_flow exists and its configuration.panes
    contains facebook_checkout with step: order_information.'
  bundle: facebook_pixel_commerce
  rubric_ref: rubric/facebook_pixel_commerce_facebook_pixel_commerce_new_flow@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/facebook_pixel_commerce-new-flow-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/facebook_pixel_commerce-new-flow-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/facebook_pixel_commerce-new-flow-verify.sh
