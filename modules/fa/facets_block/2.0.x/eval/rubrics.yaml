rubrics:
- id: facets_block_facets_block_how_use
  version: '1.0'
  applicable_bundles:
  - facets_block
  checks:
  - kind: must_contain_any
    values:
    - Facets Block
    - facets_block
    - Block layout
    - Place block
  scoring:
    combine: all_pass
- id: facets_block_facets_block_settings
  version: '1.0'
  applicable_bundles:
  - facets_block
  checks:
  - kind: must_contain_any
    values:
    - hide_empty_block
    - exclude_empty_facets
    - show_title
    - add_js_classes
    - facets_to_include
  scoring:
    combine: all_pass
- id: facets_block_facets_block_include_format
  version: '1.0'
  applicable_bundles:
  - facets_block
  checks:
  - kind: must_contain_any
    values:
    - 'facet_block:'
    - 'facets_summary_block:'
  scoring:
    combine: all_pass
- id: facets_block_facets_block_known_facets
  version: '1.0'
  applicable_bundles:
  - facets_block
  checks:
  - kind: must_contain_any
    values:
    - brand
    - color
  scoring:
    combine: all_pass
- id: facets_block_facets_block_hide_empty
  version: '1.0'
  applicable_bundles:
  - facets_block
  checks:
  - kind: must_contain_any
    values:
    - fb_a
  scoring:
    combine: all_pass
- id: facets_block_facets_block_place
  version: '1.0'
  applicable_bundles:
  - facets_block
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
- id: facets_block_facets_block_configure
  version: '1.0'
  applicable_bundles:
  - facets_block
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
