metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: facets_block
  version: 2.0.x
  note: 'Facets Block provides one Block plugin, id ''facets_block'' (class FacetsBlock), depending on
    the Facets module. No settings form, no configure route, no permissions, no Drush, no plugin types.
    Configuration lives in the block config entity block.block.<id> under settings: show_title (def TRUE),
    exclude_empty_facets (def TRUE), hide_empty_block (def FALSE), add_js_classes (def FALSE), facets_to_include
    (array of ''facet_block:<facet_id>'' / ''facets_summary_block:<facet_id>''). hook_facets_block_facets_alter()
    alters the facets array; theme hook ''facets_block''; per-facet class facet-block--<id>. Medium/hard
    cases are grounded in real block config: introspection reads a placed Facets Block''s settings; execution
    places/configures a facets_block block, verified against the live block.block config. Note: no real
    facet source is required for the block config to be valid.'
questions:
- id: facets_block-how-use
  input: How do I use the facets_block module to show several Search API facets together in one block,
    and what is the block plugin called?
  criteria: Place the 'Facets Block' block (plugin id facets_block) from Structure > Block layout into
    a region, and in its block form tick the facets to include under 'Facets to include'. It renders all
    selected facets (and Facets Summary blocks) in that single block. Requires the Facets module and configured
    facets.
  bundle: facets_block
  rubric_ref: rubric/facets_block_facets_block_how_use@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: facets_block-settings
  input: What settings does the facets_block block expose, and what does 'Hide empty block' do versus
    'Exclude empty facets'?
  criteria: 'Settings: show_title, exclude_empty_facets, hide_empty_block, add_js_classes, and facets_to_include.
    exclude_empty_facets skips individual facets that have no options; hide_empty_block renders nothing
    at all when the block has no facets to show (e.g. no search results).'
  bundle: facets_block
  rubric_ref: rubric/facets_block_facets_block_settings@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: facets_block-include-format
  input: In the facets_block configuration, the list of facets to include is stored as facets_to_include.
    What is the id format of each entry, and how are Facets Summary blocks referenced?
  criteria: 'Each entry is a block plugin id: ''facet_block:<facet_id>'' for a normal facet, and ''facets_summary_block:<facet_id>''
    for a Facets Summary. They are stored as an array under settings.facets_to_include.'
  bundle: facets_block
  rubric_ref: rubric/facets_block_facets_block_include_format@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: facets_block-known-facets
  input: This site has a Facets Block placed with machine name fb_known. Inspect its live block configuration
    and list which facets it is configured to include.
  criteria: The fb_known block (plugin facets_block) has settings.facets_to_include = ['facet_block:brand',
    'facet_block:color'], i.e. it includes the brand and color facets.
  bundle: facets_block
  rubric_ref: rubric/facets_block_facets_block_known_facets@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/facets_block-known-facets-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/facets_block-known-facets-cleanup.sh
- id: facets_block-hide-empty
  input: This site has two Facets Block instances, fb_a and fb_b. Exactly one of them is configured to
    not render at all when it has no facets to show. Inspect the live block configuration and state which
    block hides itself when empty.
  criteria: fb_a has settings.hide_empty_block = true, so it renders nothing when empty; fb_b has hide_empty_block
    = false.
  bundle: facets_block
  rubric_ref: rubric/facets_block_facets_block_hide_empty@1.0
