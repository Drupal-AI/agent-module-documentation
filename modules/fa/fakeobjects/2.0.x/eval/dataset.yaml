metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: fakeobjects
  version: 2.0.x
  note: 'FakeObjects is a tiny CKEditor 4 integration: one @CKEditorPlugin definition plus an install
    requirements check, and a third-party JS library placed under /libraries. Cases are `recipe` (response-graded)
    probing documented facts an agent would otherwise read source to answer; no site mutation.'
questions:
- id: fakeobjects-purpose
  input: What does the Drupal FakeObjects module actually do, and does it add a toolbar button to CKEditor?
  criteria: It registers the CKEditor 4 'fakeobjects' utility plugin required by other CKEditor plugins;
    it adds no toolbar button (getButtons() returns []).
  bundle: fakeobjects
  rubric_ref: rubric/fakeobjects_fakeobjects_purpose@1.0
  tags:
  - mode:recipe
- id: fakeobjects-library-path
  input: Where must the fakeobjects CKEditor JavaScript file be placed for the Drupal module to detect
    it?
  criteria: At /libraries/fakeobjects/plugin.js (getFile() returns 'libraries/fakeobjects/plugin.js' and
    the requirements check tests that path).
  bundle: fakeobjects
  rubric_ref: rubric/fakeobjects_fakeobjects_library_path@1.0
  tags:
  - mode:recipe
- id: fakeobjects-min-version
  input: What minimum version of the CKEditor fakeobjects add-on does the Drupal module require?
  criteria: 'Version 4.5.11 or newer (Composer requires drupal-ckeditor-libraries-group/fakeobjects: ^4.5.11).'
  bundle: fakeobjects
  rubric_ref: rubric/fakeobjects_fakeobjects_min_version@1.0
  tags:
  - mode:recipe
- id: fakeobjects-plugin-id
  input: What is the CKEditor plugin id that the Drupal FakeObjects module registers, and which base class
    does its plugin extend?
  criteria: Plugin id 'fakeobjects', a class extending Drupal\ckeditor\CKEditorPluginBase and annotated
    with @CKEditorPlugin.
  bundle: fakeobjects
  rubric_ref: rubric/fakeobjects_fakeobjects_plugin_id@1.0
  tags:
  - mode:recipe
- id: fakeobjects-requirements-check
  input: How does the FakeObjects module tell me on the status report whether its JavaScript library is
    installed?
  criteria: fakeobjects.install implements hook_requirements() which checks file_exists(DRUPAL_ROOT.'/libraries/fakeobjects/plugin.js')
    and reports 'Plugin detected' (OK) or 'Plugin not detected' (error).
  bundle: fakeobjects
  rubric_ref: rubric/fakeobjects_fakeobjects_requirements_check@1.0
  tags:
  - mode:recipe
- id: fakeobjects-drupal10
  input: I'm on Drupal 10 and want to use the FakeObjects plugin. Besides enabling this module and installing
    the library, what else do I need?
  criteria: The contributed CKEditor 4 module (composer require drupal/ckeditor:^1.0, then enable it),
    because CKEditor 4 is no longer in Drupal 10/11 core.
  bundle: fakeobjects
  rubric_ref: rubric/fakeobjects_fakeobjects_drupal10@1.0
  tags:
  - mode:recipe
- id: fakeobjects-config
  input: Does the FakeObjects module have a configuration form or settings, and does its CKEditor plugin
    contribute any editor configuration?
  criteria: No admin UI or settings; the plugin's getConfig() returns an empty array, so it contributes
    no editor configuration.
  bundle: fakeobjects
  rubric_ref: rubric/fakeobjects_fakeobjects_config@1.0
  tags:
  - mode:recipe
