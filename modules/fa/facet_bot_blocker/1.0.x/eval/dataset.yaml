    cleanup: agent-module-documentation/evaluation/verify/facet_bot_blocker-current-limit-cleanup.sh
- id: facet_bot_blocker-response-code
  input: On this Drupal site, when facet_bot_blocker blocks an over-limit facet request, what HTTP status
    code does it return? Inspect the live configuration to answer.
  criteria: facet_bot_blocker.settings.facet_bot_blocker_return_gone is TRUE on this site, so blocked
    requests return HTTP 410 Gone (not the default 403 Forbidden).
  bundle: facet_bot_blocker
  rubric_ref: rubric/facet_bot_blocker_facet_bot_blocker_response_code@1.0
