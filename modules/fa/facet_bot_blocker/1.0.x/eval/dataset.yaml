metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: facet_bot_blocker
  version: 1.0.x
  note: 'Facet Bot Blocker is a kernel REQUEST subscriber (priority 101) that blocks a request when isset($_GET[''f''][$limit])
    — i.e. the f[] facet query array reaches the configured depth — returning 403 (or 410 Gone if facet_bot_blocker_return_gone).
    Config object facet_bot_blocker.settings has keys facets_bot_blocker_limit (int, default 1), facet_bot_blocker_return_gone
    (bool), facet_bot_blocker_html (string). NO config ships by default and there is no schema, so get()
    is null until saved. Three permissions: administer facet bot blocker, access facet bot blocker dashboard,
    bypass facet bot blocker. Dashboard counters only populate with Memcache/Redis. Cases are grounded
    in that config object and behaviour.'
questions:
- id: facet_bot_blocker-what-blocks
  input: How does the facet_bot_blocker module decide to block a request, which query parameter does it
    look at, and what HTTP status codes can it return?
  criteria: A kernel REQUEST subscriber blocks when the request's f[] facet query array reaches the configured
    depth (isset($_GET['f'][$limit])). It returns HTTP 403 Forbidden by default, or 410 Gone when facet_bot_blocker_return_gone
    is enabled.
  bundle: facet_bot_blocker
  rubric_ref: rubric/facet_bot_blocker_facet_bot_blocker_what_blocks@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: facet_bot_blocker-config-key
  input: In facet_bot_blocker, what is the config object and the setting key that controls how deep the
    facet parameters can go before a request is blocked, and at what admin path is it configured?
  criteria: The config object is facet_bot_blocker.settings and the key is facets_bot_blocker_limit (integer,
    default 1). It is configured at /admin/config/system/facet-bot-blocker (route facet_bot_blocker.settings_form).
  bundle: facet_bot_blocker
  rubric_ref: rubric/facet_bot_blocker_facet_bot_blocker_config_key@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: facet_bot_blocker-bypass-perm
  input: Which facet_bot_blocker permission lets a user keep browsing deep faceted URLs without ever being
    blocked?
  criteria: The 'bypass facet bot blocker' permission — a user who has it is returned early from the event
    subscriber and is never blocked, whatever the facet depth.
  bundle: facet_bot_blocker
  rubric_ref: rubric/facet_bot_blocker_facet_bot_blocker_bypass_perm@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: facet_bot_blocker-current-limit
  input: On this Drupal site, facet_bot_blocker has been configured. Inspect the live configuration and
    state the facet parameter depth limit that is currently set.
  criteria: facet_bot_blocker.settings.facets_bot_blocker_limit is 3 on this site, so a request is blocked
    once it carries f[3].
  bundle: facet_bot_blocker
  rubric_ref: rubric/facet_bot_blocker_facet_bot_blocker_current_limit@1.0
  tags:
