  - facet_bot_blocker
  checks:
  - kind: must_contain_any
    values:
    - '410'
    - Gone
  scoring:
    combine: all_pass
- id: facet_bot_blocker_facet_bot_blocker_build_limit_gone
  version: '1.0'
