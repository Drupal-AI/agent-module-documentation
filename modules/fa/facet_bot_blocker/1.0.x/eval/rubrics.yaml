rubrics:
- id: facet_bot_blocker_facet_bot_blocker_what_blocks
  version: '1.0'
  applicable_bundles:
  - facet_bot_blocker
  checks:
  - kind: must_contain_any
    values:
    - f[
    - facet
    - '403'
    - '410'
    - Gone
  scoring:
    combine: all_pass
- id: facet_bot_blocker_facet_bot_blocker_config_key
  version: '1.0'
  applicable_bundles:
  - facet_bot_blocker
  checks:
  - kind: must_contain_any
    values:
    - facets_bot_blocker_limit
    - facet_bot_blocker.settings
    - /admin/config/system/facet-bot-blocker
  scoring:
    combine: all_pass
- id: facet_bot_blocker_facet_bot_blocker_bypass_perm
  version: '1.0'
  applicable_bundles:
  - facet_bot_blocker
  checks:
  - kind: must_contain_any
    values:
    - bypass facet bot blocker
  scoring:
    combine: all_pass
- id: facet_bot_blocker_facet_bot_blocker_current_limit
  version: '1.0'
  applicable_bundles:
  - facet_bot_blocker
  checks:
  - kind: must_contain_any
