    cleanup: agent-module-documentation/evaluation/verify/facets_pretty_paths-facet-coder-cleanup.sh
- id: facets_pretty_paths-configure-source
  input: On this Drupal site there is a Facets facet source config entity with id `eval_hard_source` that
