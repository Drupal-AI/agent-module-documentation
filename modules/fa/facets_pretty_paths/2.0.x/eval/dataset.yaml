metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: facets_pretty_paths
  version: 2.0.x
  note: 'Facets Pretty Paths adds one Facets url_processor plugin (id `facets_pretty_paths`) and one plugin
    type (the coder, `@FacetsPrettyPathsCoder` in Plugin/facets_pretty_paths/coder). It has no admin settings
    page: a facet source''s `url_processor` property selects the processor, and each facet''s coder is
    a third-party setting. The medium/hard cases are grounded in `facets_facet_source` and `facets_facet`
    config entities: the site ships no real facet source (no search display was built), so the setup/reset
    scripts create minimal standalone config entities to introspect / configure, then remove them. This
    exercises the same read/write config surface a real facet source uses.'
questions:
- id: facets_pretty_paths-url-processor-id
  input: In the Drupal `facets_pretty_paths` module, what is the plugin id of the Facets URL processor
    it provides, and what is the id of the default Facets URL processor it replaces?
  criteria: The module provides a Facets url_processor plugin with id `facets_pretty_paths` (annotation
    @FacetsUrlProcessor). It replaces the default `query_string` url processor from the Facets module.
  bundle: facets_pretty_paths
  rubric_ref: rubric/facets_pretty_paths_facets_pretty_paths_url_processor_id@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: facets_pretty_paths-coder-plugin-type
  input: The `facets_pretty_paths` module defines its own plugin type used to turn a facet value into
    a URL segment. What is the plugin type called, what annotation class marks such a plugin, and which
    namespace/directory are these plugins discovered in?
  criteria: 'The ''coder'' plugin type: plugins are annotated with @FacetsPrettyPathsCoder and discovered
    in the Plugin/facets_pretty_paths/coder namespace, managed by plugin.manager.facets_pretty_paths.coder
    (CoderPluginManager), implementing CoderInterface (encode()/decode()). Bundled coders include default_coder,
    url_encoded_coder, taxonomy_term_coder, taxonomy_term_name_coder, node_title_coder and list_item_coder.'
  bundle: facets_pretty_paths
  rubric_ref: rubric/facets_pretty_paths_facets_pretty_paths_coder_plugin_type@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: facets_pretty_paths-switch-source
  input: On a Drupal site with Facets and Facets Pretty Paths installed, how do I make a given facet source
    use pretty (slash-separated) URLs instead of query strings? Name the config entity and the property
    that must change, and its target value.
  criteria: 'Set the `url_processor` property of the facet source''s `facets_facet_source` config entity
    (config name facets.facet_source.<id>) to `facets_pretty_paths` (default is `query_string`) and rebuild
    caches. In the UI: Admin > Config > Search > Facets > Facet sources > Edit > URL Processor > Pretty
    paths.'
  bundle: facets_pretty_paths
  rubric_ref: rubric/facets_pretty_paths_facets_pretty_paths_switch_source@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: facets_pretty_paths-source-processor
  input: This Drupal site has a Facets facet source with the id `eval_pretty_source`. Inspect the live
    configuration and tell me which Facets URL processor that facet source is configured to use.
  criteria: The facets_facet_source config entity `eval_pretty_source` (facets.facet_source.eval_pretty_source)
    has url_processor = facets_pretty_paths, i.e. it uses the Pretty paths URL processor.
  bundle: facets_pretty_paths
  rubric_ref: rubric/facets_pretty_paths_facets_pretty_paths_source_processor@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/facets_pretty_paths-source-processor-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/facets_pretty_paths-source-processor-cleanup.sh
- id: facets_pretty_paths-facet-coder
  input: On this site there is a Facets facet with the id `eval_coder_facet` on a pretty-paths facet source.
