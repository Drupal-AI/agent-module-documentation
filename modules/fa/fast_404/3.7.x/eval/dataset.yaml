metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: fast404
  version: 3.7.x
  note: Fast 404 (project dir fast_404, machine name fast404) is configured entirely through $settings['fast404_*']
    keys in settings.php; it has no admin UI, route, config entity, permission, schema, or Drush. Cases
    are `recipe` (response-graded) probing documented facts an agent would otherwise read source (Fast404.php,
    example.settings.fast404.php, fast404.services.yml) to answer. No site mutation.
questions:
- id: fast404-config-model
  input: Where and how do I configure the Fast 404 module on a Drupal 11 site? Is there an admin settings
    form?
  criteria: Fast 404 has no admin UI or config form; it is configured entirely via $settings['fast404_*']
    keys in settings.php (optionally copied from example.settings.fast404.php into settings.fast404.php
    and included at the end of settings.php). Enabling the module alone activates the static-file extension
    check with defaults.
  bundle: fast404
  rubric_ref: rubric/fast404_fast404_config_model@1.0
  tags:
  - mode:recipe
- id: fast404-path-check
  input: By default Fast 404 only checks file extensions. How do I make it also serve fast 404s for unknown
    dynamic Drupal paths?
  criteria: Set $settings['fast404_path_check'] = TRUE in settings.php. This enables Fast404::pathCheck(),
    which queries the router, path_alias (and optionally redirect) tables and returns a 404 when nothing
    matches. It is off by default and flagged 'use at your own risk'.
  bundle: fast404
  rubric_ref: rubric/fast404_fast404_path_check@1.0
  tags:
  - mode:recipe
- id: fast404-410-gone
  input: I want Fast 404 to tell clients a resource is permanently gone rather than just missing. Which
    setting returns a 410 instead of a 404?
  criteria: Set $settings['fast404_return_gone'] = TRUE. The response() method then returns a 410 Gone
    instead of 404 Not Found. Default is FALSE.
  bundle: fast404
  rubric_ref: rubric/fast404_fast404_410_gone@1.0
  tags:
  - mode:recipe
- id: fast404-custom-page
  input: How do I make Fast 404 serve my own HTML 404 page, and can it be per-language, in the Fast 404
    module?
  criteria: Set $settings['fast404_HTML_error_page'] to a static HTML file path in the docroot (e.g. './my_page.html'),
    or a langcode-keyed array like ['en'=>'./404-en.html','fr'=>'./404-fr.html'] for per-language pages.
    Default is FALSE (terse inline HTML).
  bundle: fast404
  rubric_ref: rubric/fast404_fast404_custom_page@1.0
  tags:
  - mode:recipe
- id: fast404-whitelist-conflict
  input: The CDN / AdvAgg module generates file URLs that don't exist on disk and Fast 404 is 404ing them.
    How do I whitelist those URL fragments?
  criteria: Set $settings['fast404_string_whitelisting'] to an array of URL fragments to always allow,
    e.g. ['cdn/farfuture'] for CDN far-future or ['/advagg_'] for AdvAgg. Any path containing a listed
    fragment is passed through to Drupal.
  bundle: fast404
  rubric_ref: rubric/fast404_fast404_whitelist_conflict@1.0
  tags:
  - mode:recipe
- id: fast404-replace-drupal-404
  input: Another module throws a NotFoundHttpException and Drupal's normal 404 page shows instead of the
    Fast 404 page. How do I make Fast 404 replace it?
  criteria: Set $settings['fast404_not_found_exception'] = TRUE. The event subscriber's onNotFoundException
    listener (on KernelEvents::EXCEPTION) then replaces the Drupal 404 with the Fast 404 response whenever
    a NotFoundHttpException is thrown. Default is FALSE.
  bundle: fast404
  rubric_ref: rubric/fast404_fast404_replace_drupal_404@1.0
  tags:
  - mode:recipe
- id: fast404-extensions-default
  input: Which setting controls the list of file extensions Fast 404 blocks, and what kind of value does
    it take?
  criteria: $settings['fast404_exts'] holds a regular expression matched against the request path (via
    preg_match). The default blocks txt, png, gif, jpe?g, css, js, ico, swf, flv, cgi, bat, pl, dll, exe,
    and asp (excluding /robots and /system/files). Override it with your own regex.
  bundle: fast404
  rubric_ref: rubric/fast404_fast404_extensions_default@1.0
  tags:
  - mode:recipe
- id: fast404-services
  input: In the Fast 404 module, which service should I call to get a preconfigured Fast404 object programmatically,
    and what does it return?
  criteria: Call \Drupal::service('fast404.factory')->createInstance() (Drupal\fast404\Fast404Factory,
    implementing Fast404FactoryInterface). It returns a Drupal\fast404\Fast404 value object seeded with
    the current request and langcode, on which you can run extensionCheck(), pathCheck(), isPathBlocked(),
    and response().
  bundle: fast404
  rubric_ref: rubric/fast404_fast404_services@1.0
  tags:
  - mode:recipe
