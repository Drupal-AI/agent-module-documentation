metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: taxonomy_manager_merge
  version: 2.0.x
  note: Submodule of taxonomy_manager. Adds a Merge terms operation to the tree editor by integrating
    Term Merge. Cases are `recipe` (response-graded); no site mutation.
questions:
- id: taxman-merge-enable-deps
  input: I want a Merge terms button in the Taxonomy Manager tree editor to fold duplicate terms together.
    Which submodule do I enable and which contrib modules does it require?
  criteria: Enable the taxonomy_manager_merge submodule; it depends on taxonomy_manager plus the Term
    Merge (term_merge) and Term Reference Change (term_reference_change) contrib modules.
  bundle: taxonomy_manager_merge
  rubric_ref: rubric/taxonomy_manager_merge_taxman_merge_enable_deps@1.0
  tags:
  - mode:recipe
- id: taxman-merge-references
  input: When Taxonomy Manager Merge merges several terms into one target term, what happens to the source
    terms and to content that referenced them?
  criteria: The source terms are deleted and their entity references are reassigned onto the surviving
    target term (via Term Reference Change); optionally source titles are kept as synonyms and child terms
    moved to the target.
  bundle: taxonomy_manager_merge
  rubric_ref: rubric/taxonomy_manager_merge_taxman_merge_references@1.0
  tags:
  - mode:recipe
- id: taxman-merge-perm
  input: Which permission controls whether a user sees the Merge terms button that Taxonomy Manager Merge
    adds to a vocabulary's tree editor?
  criteria: The button is shown to users with 'edit terms in {vocabulary}'; the submodule defines no permissions
    of its own.
  bundle: taxonomy_manager_merge
  rubric_ref: rubric/taxonomy_manager_merge_taxman_merge_perm@1.0
  tags:
  - mode:recipe
- id: taxman-merge-target-choice
  input: In the Taxonomy Manager Merge form, what are the two ways to specify the term that the selected
    terms get merged into?
  criteria: Either type a brand-new term in the 'new' field or pick an existing term via the 'existing'
    entity autocomplete; exactly one must be provided.
  bundle: taxonomy_manager_merge
  rubric_ref: rubric/taxonomy_manager_merge_taxman_merge_target_choice@1.0
  tags:
  - mode:recipe
- id: taxman-merge-route
  input: What is the route/path of the Taxonomy Manager Merge merge-terms form for a vocabulary?
  criteria: Route taxonomy_manager_merge.admin_vocabulary.merge_terms at /admin/structure/taxonomy_manager/voc/{taxonomy_vocabulary}/mergeterms,
    opened as a modal from the tree toolbar.
  bundle: taxonomy_manager_merge
  rubric_ref: rubric/taxonomy_manager_merge_taxman_merge_route@1.0
  tags:
  - mode:recipe
