metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: taxonomy_manager
  version: 2.0.x
  note: 'Taxonomy Manager is a tree-based admin UI over core Taxonomy (mass add/delete/move/edit terms)
    plus a settings config object, a bulk-term service, and a merge submodule. Cases are `recipe` (response-graded):
    each probes a documented fact an agent would otherwise read source to answer; no site mutation.'
questions:
- id: taxman-tree-ui-route
  input: On Drupal 11 I want the Taxonomy Manager tree editor to administer the terms of a single vocabulary.
    What admin path / route opens it, and what core Drupal module must be enabled?
  criteria: The tree editor is at /admin/structure/taxonomy_manager/voc/{vocabulary} (route taxonomy_manager.admin_vocabulary;
    the list is taxonomy_manager.admin). Requires the core Taxonomy module (dependency drupal:taxonomy)
    and jquery_ui.
  bundle: taxonomy_manager
  rubric_ref: rubric/taxonomy_manager_taxman_tree_ui_route@1.0
  tags:
  - mode:recipe
- id: taxman-mass-add-hierarchy
  input: Using Taxonomy Manager's Add form, how do I mass-add many terms at once and make some of them
    children of others in one paste?
  criteria: Open the Add modal, enter one term per line in the textarea; prefix a child term with '-'
    (one dash per hierarchy level). Terms selected in the tree become parents; name|description splits
    name from description via the configured delimiter.
  bundle: taxonomy_manager
  rubric_ref: rubric/taxonomy_manager_taxman_mass_add_hierarchy@1.0
  tags:
  - mode:recipe
- id: taxman-move-reparent
  input: In Taxonomy Manager I want to re-parent several selected terms but keep their existing parents
    (make them multi-parent) instead of replacing them. Which toolbar operation and option do I use?
  criteria: Select the terms, click Move, and enable the 'Keep old parents and add new ones' option; otherwise
    old parents are replaced.
  bundle: taxonomy_manager
  rubric_ref: rubric/taxonomy_manager_taxman_move_reparent@1.0
  tags:
  - mode:recipe
- id: taxman-administer-taxonomy-perm
  input: Which single permission gives a user unrestricted access to every Taxonomy Manager operation
    on every vocabulary, and what module-specific permission is needed just to reach the tree list page?
  criteria: '''administer taxonomy'' (core) grants full access to all operations; the module''s own ''access
    taxonomy manager list'' permission gates reaching the vocabulary list / tree pages. Per-vocabulary
    create/edit/delete terms in {vid} gate individual operations.'
  bundle: taxonomy_manager
  rubric_ref: rubric/taxonomy_manager_taxman_administer_taxonomy_perm@1.0
  tags:
  - mode:recipe
- id: taxman-settings-config
  input: How do I change how many taxonomy terms Taxonomy Manager shows per tree page? Give the config
    object, key, and a settings path.
  criteria: Set taxonomy_manager_pager_tree_page_size (default 500) on the taxonomy_manager.settings config
    object, via the form at /admin/config/user-interface/taxonomy-manager-settings or drush cset.
  bundle: taxonomy_manager
  rubric_ref: rubric/taxonomy_manager_taxman_settings_config@1.0
  tags:
  - mode:recipe
- id: taxman-bulk-add-service
  input: In PHP on Drupal 11 I want to mass-create taxonomy terms programmatically the same way Taxonomy
    Manager's Add form does. Which service and method do I call?
  criteria: Call the taxonomy_manager.helper service (TaxonomyManagerHelper) massAddTerms($input, $vid,
    $parents, $too_long, $keep_order); it returns the created Term entities. deleteTerms() handles bulk
    deletion with optional orphan handling.
  bundle: taxonomy_manager
  rubric_ref: rubric/taxonomy_manager_taxman_bulk_add_service@1.0
  tags:
  - mode:recipe
- id: taxman-merge-submodule
  input: Which Taxonomy Manager submodule lets me merge duplicate taxonomy terms into one target term
    and reassign their references, and what other contrib module does it require?
  criteria: The taxonomy_manager_merge submodule adds a Merge terms operation; it depends on the Term
    Merge (term_merge) module and reassigns references from merged terms onto the surviving target term.
  bundle: taxonomy_manager
  rubric_ref: rubric/taxonomy_manager_taxman_merge_submodule@1.0
  tags:
  - mode:recipe
