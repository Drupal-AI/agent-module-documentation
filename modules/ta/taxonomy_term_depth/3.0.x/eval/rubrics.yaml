rubrics:
- id: taxonomy_term_depth_ttd_what_field
  version: '1.0'
  applicable_bundles:
  - taxonomy_term_depth
  checks:
  - kind: must_contain_any
    values:
    - depth_level
    - depth
    - taxonomy_term_field_data
    - base field
  scoring:
    combine: all_pass
- id: taxonomy_term_depth_ttd_get_depth_api
  version: '1.0'
  applicable_bundles:
  - taxonomy_term_depth
  checks:
  - kind: must_contain_any
    values:
    - taxonomy_term_depth_get_by_tid
    - get_by_tid
    - force
    - 'TRUE'
  scoring:
    combine: all_pass
- id: taxonomy_term_depth_ttd_recalc_all
  version: '1.0'
  applicable_bundles:
  - taxonomy_term_depth
  checks:
  - kind: must_contain_any
    values:
    - Update term depths
    - queueBatch
    - taxonomy_term_depth.queue_service
    - queue
    - batch
  scoring:
    combine: all_pass
- id: taxonomy_term_depth_ttd_grand_depth
  version: '1.0'
  applicable_bundles:
  - taxonomy_term_depth
  checks:
  - kind: must_contain_any
    values:
    - '3'
  scoring:
    combine: all_pass
- id: taxonomy_term_depth_ttd_l4_depth
  version: '1.0'
  applicable_bundles:
  - taxonomy_term_depth
  checks:
  - kind: must_contain_any
    values:
    - '4'
  scoring:
    combine: all_pass
- id: taxonomy_term_depth_ttd_recalc_vocab
  version: '1.0'
  applicable_bundles:
  - taxonomy_term_depth
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
- id: taxonomy_term_depth_ttd_force_single
  version: '1.0'
  applicable_bundles:
  - taxonomy_term_depth
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
