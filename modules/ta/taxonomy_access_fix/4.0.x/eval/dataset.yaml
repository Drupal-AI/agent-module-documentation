metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: taxonomy_access_fix
  version: 4.0.x
  note: 'Taxonomy Access Fix adds fine-grained per-vocabulary and ''any vocabulary'' permissions to Core
    Taxonomy by replacing term/vocabulary access handlers and the term entity-reference selection plugin.
    Cases are `recipe` (response-graded) and probe module-specific facts: the split between viewing a
    term vs its name/label, published vs unpublished variants, the ''select'' permission for Default-method
    reference widgets, no-config enable/disable behavior, vocabulary overview-page access requirements,
    and that administer taxonomy bypasses everything. No site mutation.'
questions:
- id: taf-view-term-vs-name
  input: 'On a Drupal 11 site with Taxonomy Access Fix, I gave a role ''Tags: View published terms'' (view
    terms in tags) but term labels still don''t render where terms are referenced. Why, and which permission
    fixes it?'
  criteria: Viewing a term and viewing its name/label are separate permissions. 'view terms in tags' grants
    the term view operation but not the label; rendering the label needs 'view term names in tags' (the
    'view label' operation) or 'view any term name'.
  bundle: taxonomy_access_fix
  rubric_ref: rubric/taxonomy_access_fix_taf_view_term_vs_name@1.0
  tags:
  - mode:recipe
- id: taf-published-vs-unpublished
  input: With Taxonomy Access Fix, does the per-vocabulary 'View published terms' permission also let
    a user see unpublished terms in that vocabulary? How do you grant unpublished access?
  criteria: No. Published and unpublished are separate permissions. Unpublished terms need the explicit
    'view unpublished terms in <vid>' (or 'view any unpublished term'), or 'administer taxonomy' which
    bypasses all checks.
  bundle: taxonomy_access_fix
  rubric_ref: rubric/taxonomy_access_fix_taf_published_vs_unpublished@1.0
  tags:
  - mode:recipe
- id: taf-select-permission
  input: In a Drupal 11 entity reference field pointing at taxonomy terms, I want a role to be able to
    pick terms from the 'tags' vocabulary in the autocomplete/select widget without giving them taxonomy
    admin. Which Taxonomy Access Fix permission and which reference method is required?
  criteria: Grant 'select terms in tags' (or 'select any term'). It only applies to entity reference fields
    using the 'Default' reference method, whose taxonomy_term selection plugin the module replaces to
    honor these permissions.
  bundle: taxonomy_access_fix
  rubric_ref: rubric/taxonomy_access_fix_taf_select_permission@1.0
  tags:
  - mode:recipe
- id: taf-no-config
  input: Where is the settings/configuration form for Taxonomy Access Fix, and what do I need to configure
    after enabling it on Drupal 11?
  criteria: There is no configuration form. The module works by replacing Core's taxonomy access handlers
    and the term reference selection plugin on enable; you only assign the added permissions on /admin/people/permissions
    (or a vocabulary's Manage permissions tab). Disabling it reverts to Core behavior.
  bundle: taxonomy_access_fix
  rubric_ref: rubric/taxonomy_access_fix_taf_no_config@1.0
  tags:
  - mode:recipe
- id: taf-overview-access
  input: A role has the Core 'Access the taxonomy vocabulary overview page' permission but still cannot
    open a vocabulary's term overview page after installing Taxonomy Access Fix. Why?
  criteria: 'The module tightens overview access: besides the Core ''access the taxonomy vocabulary overview
    page'' permission, the user also needs at least one permission to create, edit, delete, reorder terms
    in, or reset that vocabulary (or the corresponding ''any'' permission), or ''administer taxonomy''.'
  bundle: taxonomy_access_fix
  rubric_ref: rubric/taxonomy_access_fix_taf_overview_access@1.0
  tags:
  - mode:recipe
- id: taf-any-term-crud
  input: Core Taxonomy only offers per-vocabulary create/edit/delete term permissions. What does Taxonomy
    Access Fix add so a role can edit or delete terms across ALL vocabularies with one permission?
  criteria: It adds 'create any term', 'update any term' and 'delete any term' (the 'any vocabulary' counterparts
    to Core's per-vocabulary create/edit/delete term permissions).
  bundle: taxonomy_access_fix
  rubric_ref: rubric/taxonomy_access_fix_taf_any_term_crud@1.0
  tags:
  - mode:recipe
- id: taf-reorder-vs-reset
  input: With Taxonomy Access Fix, if I grant a role 'Reorder terms' for a vocabulary, can they also reset
    the term order to alphabetical? What controls that separately?
  criteria: 'No. Reorder and reset are independent: reordering (drag-and-drop weights + Save) needs ''reorder
    terms in <vid>'', while resetting to alphabetical needs the separate ''reset <vid>'' (or ''reset any
    vocabulary'') permission.'
  bundle: taxonomy_access_fix
  rubric_ref: rubric/taxonomy_access_fix_taf_reorder_vs_reset@1.0
  tags:
  - mode:recipe
- id: taf-provider-location
  input: On the Drupal permissions page, under which module heading do Taxonomy Access Fix's extra taxonomy
    permissions appear, and why not under Taxonomy?
  criteria: They are listed under the 'Taxonomy Access Fix' provider, not Taxonomy, because a module cannot
    register permissions on behalf of another module (Core Taxonomy).
  bundle: taxonomy_access_fix
  rubric_ref: rubric/taxonomy_access_fix_taf_provider_location@1.0
  tags:
  - mode:recipe
