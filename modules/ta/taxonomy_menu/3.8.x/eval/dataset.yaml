metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: taxonomy_menu
  version: 3.8.x
  note: Taxonomy Menu exposes a taxonomy_menu config entity mapping a vocabulary to a menu, a core-based
    menu link deriver/plugin that generates one link per term, a sync helper service wired to term hooks,
    and a link alter hook. Cases are `recipe` (response-graded) probing documented facts an agent would
    otherwise read source to answer; no site mutation.
questions:
- id: taxonomy-menu-config-entity
  input: On a Drupal 11 site, what config entity does Taxonomy Menu provide to link a vocabulary to a
    menu, and which two fields select the source vocabulary and the target menu?
  criteria: The taxonomy_menu config entity; the 'vocabulary' field is the source vocabulary machine name
    and the 'menu' field is the target menu machine name.
  bundle: taxonomy_menu
  rubric_ref: rubric/taxonomy_menu_taxonomy_menu_config_entity@1.0
  tags:
  - mode:recipe
- id: taxonomy-menu-create-in-code
  input: In PHP on Drupal 11, programmatically create a taxonomy menu mapping the 'tags' vocabulary into
    the 'main' menu at depth 3. Show the code.
  criteria: Uses TaxonomyMenu::create(['id' => ..., 'label' => ..., 'vocabulary' => 'tags', 'menu' =>
    'main', 'depth' => 3]) then ->save(); save() builds a menu link per term.
  bundle: taxonomy_menu
  rubric_ref: rubric/taxonomy_menu_taxonomy_menu_create_in_code@1.0
  tags:
  - mode:recipe
- id: taxonomy-menu-auto-sync
  input: How does Taxonomy Menu keep the menu in sync when a taxonomy term is added, updated, or deleted?
    Which service and which hooks handle it?
  criteria: taxonomy_menu.module implements hook_taxonomy_term_insert/update/delete, which call the taxonomy_menu.helper
    service (generate/update/removeTaxonomyMenuEntries) to add/update/remove that term's menu link automatically.
  bundle: taxonomy_menu
  rubric_ref: rubric/taxonomy_menu_taxonomy_menu_auto_sync@1.0
  tags:
  - mode:recipe
- id: taxonomy-menu-link-deriver
  input: How are the menu links generated from taxonomy terms in Taxonomy Menu — which deriver and menu
    link plugin classes are involved, and does it define a new plugin type?
  criteria: 'It uses the core menu link plugin system (no new plugin type): the Plugin\Derivative\TaxonomyMenuMenuLink
    deriver produces one derivative per term and Plugin\Menu\TaxonomyMenuMenuLink (extends MenuLinkBase)
    renders each link.'
  bundle: taxonomy_menu
  rubric_ref: rubric/taxonomy_menu_taxonomy_menu_link_deriver@1.0
  tags:
  - mode:recipe
- id: taxonomy-menu-depth-expanded
  input: Which taxonomy_menu config keys control how deep the menu is generated and whether entries render
    expanded?
  criteria: The 'depth' integer key limits how many term levels are generated (form offers 1-9) and the
    'expanded' boolean makes all generated entries render expanded.
  bundle: taxonomy_menu
  rubric_ref: rubric/taxonomy_menu_taxonomy_menu_depth_expanded@1.0
  tags:
  - mode:recipe
- id: taxonomy-menu-title-dynamic
  input: In Taxonomy Menu, are the generated menu-item titles and descriptions stored, or rendered from
    the term? What can you override on a generated link?
  criteria: Titles/descriptions are rendered dynamically from the term (translation-aware), not stored;
    only weight, expanded, enabled, and parent may be overridden (see $overrideAllowed).
  bundle: taxonomy_menu
  rubric_ref: rubric/taxonomy_menu_taxonomy_menu_title_dynamic@1.0
  tags:
  - mode:recipe
- id: taxonomy-menu-link-alter
  input: Which alter hook lets a custom module modify each menu link definition Taxonomy Menu generates
    for a term?
  criteria: Implement hook_taxonomy_menu_link_alter(array &$link, $term) — invoked via \Drupal::moduleHandler()->alter('taxonomy_menu_link',
    $link, $term) in buildMenuDefinition().
  bundle: taxonomy_menu
  rubric_ref: rubric/taxonomy_menu_taxonomy_menu_link_alter@1.0
  tags:
  - mode:recipe
- id: taxonomy-menu-configure-route
  input: Where do you manage Taxonomy Menus in the admin UI, what route is it, and which permission gates
    it?
  criteria: Admin → Structure → Taxonomy menu at /admin/structure/taxonomy_menu (route entity.taxonomy_menu.collection),
    gated by the core 'administer site configuration' permission; the module defines no permissions of
    its own.
  bundle: taxonomy_menu
  rubric_ref: rubric/taxonomy_menu_taxonomy_menu_configure_route@1.0
  tags:
  - mode:recipe
