rubrics:
- id: taxonomy_unique_taxonomy_unique_where_config
  version: '1.0'
  applicable_bundles:
  - taxonomy_unique
  checks:
  - kind: must_contain_any
    values:
    - vocabulary
    - third_party_settings
    - third party setting
    - Terms should be unique
    - Taxonomy unique
  scoring:
    combine: all_pass
- id: taxonomy_unique_taxonomy_unique_default_message
  version: '1.0'
  applicable_bundles:
  - taxonomy_unique
  checks:
  - kind: must_contain_any
    values:
    - '%term'
    - '%vocabulary'
    - already exists
  scoring:
    combine: all_pass
- id: taxonomy_unique_taxonomy_unique_scope
  version: '1.0'
  applicable_bundles:
  - taxonomy_unique
  checks:
  - kind: must_contain_any
    values:
    - same vocabulary
    - vid
    - langcode
    - language
    - per vocabulary
  scoring:
    combine: all_pass
- id: taxonomy_unique_taxonomy_unique_known_message
  version: '1.0'
  applicable_bundles:
  - taxonomy_unique
  checks:
  - kind: must_contain_any
    values:
    - 'TU duplicate blocked: %term in %vocabulary'
  scoring:
    combine: all_pass
- id: taxonomy_unique_taxonomy_unique_which_enforces
  version: '1.0'
  applicable_bundles:
  - taxonomy_unique
  checks:
  - kind: must_contain_any
    values:
    - tu_on
  scoring:
    combine: all_pass
- id: taxonomy_unique_taxonomy_unique_enable_vocab
  version: '1.0'
  applicable_bundles:
  - taxonomy_unique
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
- id: taxonomy_unique_taxonomy_unique_enable_with_message
  version: '1.0'
  applicable_bundles:
  - taxonomy_unique
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
