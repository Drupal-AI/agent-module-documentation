- id: taxonomy-machine-name-autogen
  input: On this Drupal site, create a taxonomy term in the Tags vocabulary named 'TMN Product Launch
    2026' and let the taxonomy_machine_name module generate its machine name automatically. Save it to
    the live site.
  criteria: Create and save Term(['vid'=>'tags','name'=>'TMN Product Launch 2026']); taxonomy_machine_name's
