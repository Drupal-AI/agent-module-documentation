metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: taxonomy_machine_name
  version: 2.0.x
  note: 'Taxonomy Machine Name adds a machine_name string base field to every taxonomy_term, auto-generated
    (transliterated slug) from the term name on presave and made unique per vocabulary (appending _0/_1...).
    There is no configure route. Medium/hard cases are grounded in that real property using terms in the
    existing Tags vocabulary, all namespaced by a ''TMN '' name prefix / tmn_ machine-name prefix: introspection
    reads back a term''s machine_name; execution creates terms and verifies the module generated (or kept)
    the expected machine_name on the live term. Reset scripts delete the specific namespaced terms so
    verify fails on empty state and passes only after the agent creates them correctly.'
questions:
- id: taxonomy-machine-name-what-it-adds
  input: What does the Drupal taxonomy_machine_name module add to taxonomy terms, and how is the value
    generated when you don't provide one?
  criteria: It adds a machine_name string base field to every taxonomy term. If you leave it empty, on
    save it is auto-generated from the term name by transliterating to ASCII, lowercasing, and replacing
    non [a-z0-9_] characters with underscores, then made unique within the vocabulary.
  bundle: taxonomy_machine_name
  rubric_ref: rubric/taxonomy_machine_name_taxonomy_machine_name_what_it_adds@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: taxonomy-machine-name-load-and-token
  input: With taxonomy_machine_name enabled, how can I load a taxonomy term by its machine name in code,
    and what token exposes a term's machine name?
  criteria: Use taxonomy_machine_name_term_load($machine_name, $vid) (which does loadByProperties(['machine_name'=>...,
    'vid'=>...])) to load a term by machine name within a vocabulary. The token [term:machine_name] outputs
    the term's machine name.
  bundle: taxonomy_machine_name
  rubric_ref: rubric/taxonomy_machine_name_taxonomy_machine_name_load_and_token@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: taxonomy-machine-name-uniqueness
  input: In taxonomy_machine_name, what happens if two terms in the same vocabulary would generate the
    same machine name, and are there any reserved values it rejects?
  criteria: It appends an incrementing numeric suffix (_0, _1, ...) until the machine name is unique within
    the vocabulary (taxonomy_machine_name_uniquify). The term form also rejects the reserved words add,
    list, delete and update because they clash with taxonomy route arguments.
  bundle: taxonomy_machine_name
  rubric_ref: rubric/taxonomy_machine_name_taxonomy_machine_name_uniqueness@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: taxonomy-machine-name-known-term
  input: On this Drupal site there is a taxonomy term in the Tags vocabulary named 'TMN Known Term'. Using
    the taxonomy_machine_name module's machine_name property, inspect the live term and report its machine
    name.
  criteria: The term 'TMN Known Term' has machine_name tmn_known_term (auto-generated by taxonomy_machine_name
    from the term name). Read it with $term->get('machine_name')->value.
  bundle: taxonomy_machine_name
  rubric_ref: rubric/taxonomy_machine_name_taxonomy_machine_name_known_term@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/taxonomy_machine_name-known-term-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/taxonomy_machine_name-known-term-cleanup.sh
- id: taxonomy-machine-name-which-term
  input: The Tags vocabulary on this site has two terms, 'TMN Alpha One' and 'TMN Beta Two'. Using the
    taxonomy_machine_name machine_name property, inspect the live terms and state which term's machine
    name is 'tmn_special_marker'.
  criteria: '''TMN Beta Two'' has machine_name tmn_special_marker; ''TMN Alpha One'' has an auto-generated
    machine name (tmn_alpha_one).'
  bundle: taxonomy_machine_name
  rubric_ref: rubric/taxonomy_machine_name_taxonomy_machine_name_which_term@1.0
