rubrics:
- id: taxonomy_machine_name_taxonomy_machine_name_what_it_adds
  version: '1.0'
  applicable_bundles:
  - taxonomy_machine_name
  checks:
  - kind: must_contain_any
    values:
    - machine_name
    - machine name
    - base field
    - slug
    - term name
    - transliterat
  scoring:
    combine: all_pass
- id: taxonomy_machine_name_taxonomy_machine_name_load_and_token
  version: '1.0'
  applicable_bundles:
  - taxonomy_machine_name
  checks:
  - kind: must_contain_any
    values:
    - taxonomy_machine_name_term_load
    - loadByProperties
    - machine_name
    - '[term:machine_name]'
    - term:machine_name
  scoring:
    combine: all_pass
- id: taxonomy_machine_name_taxonomy_machine_name_uniqueness
  version: '1.0'
  applicable_bundles:
  - taxonomy_machine_name
  checks:
  - kind: must_contain_any
    values:
    - _0
    - _1
    - suffix
    - unique
    - increment
    - add
    - list
    - delete
    - update
  scoring:
    combine: all_pass
- id: taxonomy_machine_name_taxonomy_machine_name_known_term
  version: '1.0'
  applicable_bundles:
  - taxonomy_machine_name
  checks:
  - kind: must_contain_any
    values:
    - tmn_known_term
  scoring:
    combine: all_pass
- id: taxonomy_machine_name_taxonomy_machine_name_which_term
  version: '1.0'
  applicable_bundles:
  - taxonomy_machine_name
  checks:
  - kind: must_contain_any
    values:
    - TMN Beta Two
    - Beta Two
    - Beta
  scoring:
    combine: all_pass
- id: taxonomy_machine_name_taxonomy_machine_name_autogen
  version: '1.0'
  applicable_bundles:
  - taxonomy_machine_name
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
- id: taxonomy_machine_name_taxonomy_machine_name_explicit_slug
  version: '1.0'
  applicable_bundles:
  - taxonomy_machine_name
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
