metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: tagclouds
  version: 2.0.x
  note: 'tagclouds builds weighted tag clouds from taxonomy terms. Global config object tagclouds.settings
    (keys: sort_order default ''title,asc''; display_type ''style''|''count''; display_node_link bool;
    display_more_link bool; page_amount string ''60''; levels int 6; language_separation int; language_separation_radios
    int). Settings form at /admin/config/content/tagclouds (route tagclouds.admin_page) guarded by permission
    ''administer tagclouds settings''. Derived block tagclouds_block (one per vocabulary). Dynamic routes
    /tagclouds, /tagclouds/list/{voc}, /tagclouds/chunk/{voc} (access content). Terms get CSS classes
    level1..levelN. Services tagclouds.tag (TagService) + tagclouds.cloud_builder (CloudBuilder). Introspection/execution
    cases mutate and read back the module-owned tagclouds.settings config; cleanup/reset restore the shipped
    defaults explicitly (State is unreliable on this site).'
questions:
- id: tagclouds-settings-object
  input: In the Drupal tagclouds module, which config object stores its global settings, and which setting
    controls how many size levels (font-size steps) the cloud uses?
  criteria: Global settings live in the config object tagclouds.settings (edited at /admin/config/content/tagclouds,
    route tagclouds.admin_page). The 'levels' key controls the number of size levels (default 6), which
    maps to CSS classes level1..levelN.
  bundle: tagclouds
  rubric_ref: rubric/tagclouds_tagclouds_settings_object@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: tagclouds-block-permission
  input: How does tagclouds let you place a tag cloud in a region, and what permission protects its settings
    page?
  criteria: It provides the derived block plugin tagclouds_block (one derivative per taxonomy vocabulary)
    that you place like any block. The settings form at /admin/config/content/tagclouds is guarded by
    the 'administer tagclouds settings' permission.
  bundle: tagclouds
  rubric_ref: rubric/tagclouds_tagclouds_block_permission@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: tagclouds-routes
  input: What are the dynamic front-end URL paths tagclouds exposes for a taxonomy vocabulary's cloud
    and term list?
  criteria: It exposes /tagclouds (legacy), /tagclouds/chunk/{vocabulary} (the cloud) and /tagclouds/list/{vocabulary}
    (term list with descriptions), all requiring the 'access content' permission.
  bundle: tagclouds
  rubric_ref: rubric/tagclouds_tagclouds_routes@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: tagclouds-known-levels
  input: On this Drupal site, tagclouds has been configured with a non-default number of size levels.
    Inspect the live tagclouds configuration and tell me how many levels are configured.
  criteria: 'tagclouds.settings has levels: 9 (and sort_order: count,desc).'
  bundle: tagclouds
  rubric_ref: rubric/tagclouds_tagclouds_known_levels@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/tagclouds-levels-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/tagclouds-levels-cleanup.sh
- id: tagclouds-known-page-amount
  input: Inspect this site's tagclouds settings and tell me how many tags are configured to show per page
    (the page_amount setting).
  criteria: tagclouds.settings page_amount is 33 (and display_type is set to count).
  bundle: tagclouds
  rubric_ref: rubric/tagclouds_tagclouds_known_page_amount@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/tagclouds-page-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/tagclouds-page-cleanup.sh
- id: tagclouds-configure-levels-sort
  input: Configure the tagclouds module on this site so that its tag clouds use 12 size levels and are
    sorted by usage count, descending. Apply the change to the live configuration.
  criteria: 'Set tagclouds.settings levels: 12 and sort_order: ''count,desc'' (via the settings form at
    /admin/config/content/tagclouds, drush cset, or config API) and save.'
  bundle: tagclouds
  rubric_ref: rubric/tagclouds_tagclouds_configure_levels_sort@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/tagclouds-configure-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/tagclouds-configure-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/tagclouds-configure-verify.sh
- id: tagclouds-configure-display-page
  input: On this site I want the tag clouds to show the number of times each tag is used (rather than
    sizing them), and to list up to 100 tags on a page. Change the tagclouds settings accordingly and
    save.
  criteria: 'Set tagclouds.settings display_type: ''count'' and page_amount: ''100'' and save.'
  bundle: tagclouds
  rubric_ref: rubric/tagclouds_tagclouds_configure_display_page@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: site-owner
    reset: agent-module-documentation/evaluation/verify/tagclouds-display-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/tagclouds-display-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/tagclouds-display-verify.sh
