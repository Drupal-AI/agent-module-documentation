metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: tablefield
  version: 3.0.x
  note: TableField exposes a `tablefield` field type (grid of text cells), a table widget, a Tabular View
    formatter, a settings config object, permissions, and a CSV import/export path. Cases are `recipe`
    (response-graded) probing documented facts an agent would otherwise read source to answer; no site
    mutation.
questions:
- id: tablefield-field-type
  input: On a Drupal 11 site I want to store a small grid of text cells (rows and columns) directly on
    a content type. Which field type does the TableField module provide, and what are its default widget
    and formatter?
  criteria: The `tablefield` field type; its default widget is `tablefield` (the table grid widget) and
    its default formatter is `tablefield` ("Tabular View").
  bundle: tablefield
  rubric_ref: rubric/tablefield_tablefield_field_type@1.0
  tags:
  - mode:recipe
- id: tablefield-default-rows-cols
  input: How do I set the site-wide default number of rows and columns for new TableField tables, and
    what config object holds them? Give the config keys and their default values.
  criteria: The `rows` and `cols` keys on the `tablefield.settings` config object (both default 5), editable
    at /admin/config/content/tablefield or via drush cset.
  bundle: tablefield
  rubric_ref: rubric/tablefield_tablefield_default_rows_cols@1.0
  tags:
  - mode:recipe
- id: tablefield-csv-separator
  input: Which TableField setting controls the character used for both CSV import and CSV export, what
    config object is it on, and what is its default?
  criteria: The `csv_separator` key on `tablefield.settings` (default `,` comma) is used for both CSV
    import and export.
  bundle: tablefield
  rubric_ref: rubric/tablefield_tablefield_csv_separator@1.0
  tags:
  - mode:recipe
- id: tablefield-widget-input-type
  input: In the TableField widget, what setting lets me choose whether each cell is a single-line input
    or a multi-line box, and what are the allowed values?
  criteria: The widget's `input_type` setting (default `textfield`); allowed values are `textfield` or
    `textarea`.
  bundle: tablefield
  rubric_ref: rubric/tablefield_tablefield_widget_input_type@1.0
  tags:
  - mode:recipe
- id: tablefield-formatter-headers
  input: Which two TableField formatter settings control whether the first row is rendered as a table
    header and whether the first column is rendered as row headers?
  criteria: '`row_header` (default on) renders the first row as a <thead> header; `column_header` (default
    off) marks the first column''s cells as row headers.'
  bundle: tablefield
  rubric_ref: rubric/tablefield_tablefield_formatter_headers@1.0
  tags:
  - mode:recipe
- id: tablefield-caption
  input: TableField lets an editor add a short caption to each table for accessibility. Where is the caption
    stored in the field value, and how big is the column?
  criteria: A `caption` is stored as a varchar(255) column (and kept under the value's `caption` key);
    it is entered via the widget's "Table Caption" field to help screen readers.
  bundle: tablefield
  rubric_ref: rubric/tablefield_tablefield_caption@1.0
  tags:
  - mode:recipe
- id: tablefield-permissions
  input: Which TableField permissions gate exporting a table as CSV, importing a CSV, and rebuilding the
    number of rows/columns in the widget?
  criteria: '`export tablefield` gates the CSV export link/route, `import tablefield` gates CSV import,
    and `rebuild tablefield` gates the change-rows/columns rebuild control.'
  bundle: tablefield
  rubric_ref: rubric/tablefield_tablefield_permissions@1.0
  tags:
  - mode:recipe
- id: tablefield-encodings-hook
  input: In a custom Drupal module I want TableField to try an extra character encoding (e.g. UTF-16)
    when detecting a CSV file's charset on import. Which hook do I implement?
  criteria: Implement hook_tablefield_encodings_alter(array &$encodings) to add encodings to the list
    tried before mb_detect_encoding().
  bundle: tablefield
  rubric_ref: rubric/tablefield_tablefield_encodings_hook@1.0
  tags:
  - mode:recipe
