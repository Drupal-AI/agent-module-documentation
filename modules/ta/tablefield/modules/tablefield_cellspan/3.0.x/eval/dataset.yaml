metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: tablefield_cellspan
  version: 3.0.x
  note: 'TableField Cellspan is a config-free submodule of tablefield that merges rendered table cells
    via #colspan#/#rowspan#/#remove# markers in a hook_preprocess_table() implementation. Cases are `recipe`
    (response-graded) probing documented facts an agent would otherwise read source to answer; no site
    mutation.'
questions:
- id: cellspan-markers
  input: Using the TableField Cellspan module, how do I make one table cell span two columns to its side?
    What exactly do I type, and where?
  criteria: 'Type the literal marker #colspan# as the text of the right-hand cell (in the TableField grid);
    the module deletes that cell and grows the colspan of the cell immediately to its left.'
  bundle: tablefield_cellspan
  rubric_ref: rubric/tablefield_cellspan_cellspan_markers@1.0
  tags:
  - mode:recipe
- id: cellspan-rowspan
  input: How does TableField Cellspan let a cell span multiple rows vertically, and which marker do I
    use?
  criteria: 'Put #rowspan# in the cell below; it is removed and the nearest non-empty cell above in the
    same column gets its rowspan increased. Repeat #rowspan# in each row underneath to span further.'
  bundle: tablefield_cellspan
  rubric_ref: rubric/tablefield_cellspan_cellspan_rowspan@1.0
  tags:
  - mode:recipe
- id: cellspan-remove-marker
  input: With TableField Cellspan, which marker deletes a leftover table cell entirely so no <td> is output?
  criteria: 'The #remove# marker: a cell containing it is unset from the rows so no cell is rendered,
    used to clear leftover cells a span leaves behind.'
  bundle: tablefield_cellspan
  rubric_ref: rubric/tablefield_cellspan_cellspan_remove_marker@1.0
  tags:
  - mode:recipe
- id: cellspan-preprocess-hook
  input: How does TableField Cellspan turn markers into real colspan/rowspan attributes at render time?
    Which Drupal hook implements it?
  criteria: It implements hook_preprocess_table() (tablefield_cellspan_preprocess_table) which rewrites
    $variables['rows'] cell attributes; the stored field value is not changed.
  bundle: tablefield_cellspan
  rubric_ref: rubric/tablefield_cellspan_cellspan_preprocess_hook@1.0
  tags:
  - mode:recipe
- id: cellspan-admin-route
  input: On a TableField Cellspan site, why do the merged cells appear on the public page but not in the
    field editor? What guards this?
  criteria: 'The preprocess only runs on front-end routes: it returns early when router.admin_context->isAdminRoute()
    is true, so admin/edit pages are left unmerged.'
  bundle: tablefield_cellspan
  rubric_ref: rubric/tablefield_cellspan_cellspan_admin_route@1.0
  tags:
  - mode:recipe
- id: cellspan-configuration
  input: What configuration or settings form does the TableField Cellspan module provide, and what permissions
    does it define?
  criteria: None. The module has no menu, no settings/config, no schema, and no permissions; enabling
    it (with tablefield) is the entire setup and behavior is driven by the cell markers.
  bundle: tablefield_cellspan
  rubric_ref: rubric/tablefield_cellspan_cellspan_configuration@1.0
  tags:
  - mode:recipe
