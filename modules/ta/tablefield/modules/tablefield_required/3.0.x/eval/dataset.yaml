metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: tablefield_required
  version: 3.0.x
  note: 'TableField required is a submodule of tablefield that adds per-row/per-column required validation
    to a tablefield field via field third-party settings and a render-element #process callback. Cases
    are `recipe` (response-graded) probing documented facts an agent would otherwise read source to answer;
    no site mutation.'
questions:
- id: required-where-configured
  input: Using TableField required on a Drupal 11 site, where do I set which rows/columns of a table field
    are mandatory? Is there a separate admin settings page?
  criteria: On the field's own config edit form (Manage fields -> Edit) in a 'Tablefield required settings'
    section; there is no separate admin page. Settings are saved as field third-party settings.
  bundle: tablefield_required
  rubric_ref: rubric/tablefield_required_required_where_configured@1.0
  tags:
  - mode:recipe
- id: required-rows-cols-indexing
  input: With TableField required, how do I make the first and third rows of a table field mandatory?
    What do I enter and how are rows indexed?
  criteria: 'Enter a comma-separated, zero-based list in Required rows: 0,2 (0 = first row, 2 = third
    row). Required columns works the same way for column indexes.'
  bundle: tablefield_required
  rubric_ref: rubric/tablefield_required_required_rows_cols_indexing@1.0
  tags:
  - mode:recipe
- id: required-storage
  input: How does TableField required store its required-rows/columns configuration for a field? Is it
    a standalone config object?
  criteria: As field third-party settings under the tablefield_required namespace (required_rows, required_cols,
    multivalue_inherit), defined in config/schema; not a standalone config object.
  bundle: tablefield_required
  rubric_ref: rubric/tablefield_required_required_storage@1.0
  tags:
  - mode:recipe
- id: required-multivalue-inherit
  input: For a multi-value TableField, how do I make TableField required apply to every table instance
    instead of only the first one?
  criteria: Check 'Inherit mandatory property for multi-value tables' (multivalue_inherit); otherwise
    only the first table (delta 0) is validated.
  bundle: tablefield_required
  rubric_ref: rubric/tablefield_required_required_multivalue_inherit@1.0
  tags:
  - mode:recipe
- id: required-vs-core-required
  input: In TableField required, what happens to the per-row/per-column required settings if the whole
    field is already marked Required in its definition?
  criteria: 'The feature is ignored: the settings section only shows while the core ''Required'' checkbox
    is unchecked, and processing is skipped when the element is already #required.'
  bundle: tablefield_required
  rubric_ref: rubric/tablefield_required_required_vs_core_required@1.0
  tags:
  - mode:recipe
- id: required-enforcement-mechanism
  input: Technically, how does TableField required force selected cells to be filled in? What does it
    set on the widget's cell inputs?
  criteria: 'It adds a #process callback to the tablefield render element (via hook_element_info_alter)
    that sets #required = TRUE on each cell input in a configured required row/column, so core form validation
    blocks empty ones.'
  bundle: tablefield_required
  rubric_ref: rubric/tablefield_required_required_enforcement_mechanism@1.0
  tags:
  - mode:recipe
