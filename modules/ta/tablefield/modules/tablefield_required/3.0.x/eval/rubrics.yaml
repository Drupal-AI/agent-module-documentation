rubrics:
- id: tablefield_required_required_where_configured
  version: '1.0'
  applicable_bundles:
  - tablefield_required
  checks:
  - kind: must_contain_any
    values:
    - field config
    - field settings
    - field_config_edit_form
    - Manage fields
    - Tablefield required settings
  scoring:
    combine: all_pass
- id: tablefield_required_required_rows_cols_indexing
  version: '1.0'
  applicable_bundles:
  - tablefield_required
  checks:
  - kind: must_contain_any
    values:
    - 0,2
    - zero-based
    - 0-based
    - starting from "0"
    - starting from 0
  scoring:
    combine: all_pass
- id: tablefield_required_required_storage
  version: '1.0'
  applicable_bundles:
  - tablefield_required
  checks:
  - kind: must_contain_any
    values:
    - third party
    - third-party
    - third_party
    - setThirdPartySetting
    - tablefield_required
  scoring:
    combine: all_pass
- id: tablefield_required_required_multivalue_inherit
  version: '1.0'
  applicable_bundles:
  - tablefield_required
  checks:
  - kind: must_contain_any
    values:
    - multivalue_inherit
    - Inherit
    - inherit
  scoring:
    combine: all_pass
- id: tablefield_required_required_vs_core_required
  version: '1.0'
  applicable_bundles:
  - tablefield_required
  checks:
  - kind: must_contain_any
    values:
    - ignored
    - not shown
    - hidden
    - skipped
    - unchecked
  scoring:
    combine: all_pass
- id: tablefield_required_required_enforcement_mechanism
  version: '1.0'
  applicable_bundles:
  - tablefield_required
  checks:
  - kind: must_contain_any
    values:
    - '#required'
    - process
    - element_info_alter
  scoring:
    combine: all_pass
