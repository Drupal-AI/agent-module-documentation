metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: taxonomy_import
  version: 2.1.x
  note: 'Taxonomy Import bulk-creates taxonomy terms in an EXISTING vocabulary from an uploaded CSV/XML
    file via the form at /admin/config/content/taxonomy_import/import. Columns/tags map to name, parent
    (matched by name for hierarchy), description; the CSV header row is skipped. Import behaviour 0 =
    update same-named term, 1 = force new. The taxonomy_import.term_utils service (TaxonomyUtils::saveTerms($vid,$rows,$forceNewTerms))
    does the work and is callable directly. Settings live in config object taxonomy_import.config: file_extensions
    (default ''csv xml'') and file_max_size (default 256000000), edited at /admin/config/content/taxonomy_import/settings_import_taxonomy.
    Introspection reads those live config values; execution imports terms into a namespaced vocabulary
    via the service and adds an allowed upload extension, both verified against live state.'
questions:
- id: taxonomy_import-formats
  input: What file formats can the taxonomy_import module import taxonomy terms from, and where in the
    admin UI do you run an import?
  criteria: It imports terms from a CSV or XML file, uploaded on the import form at /admin/config/content/taxonomy_import/import
    (route taxonomy_import.import), into an existing vocabulary you select.
  bundle: taxonomy_import
  rubric_ref: rubric/taxonomy_import_taxonomy_import_formats@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: taxonomy_import-columns
  input: In a CSV file imported by taxonomy_import, what do the columns mean, and is the first row imported?
  criteria: Column 1 = term name, column 2 = parent (matched by name to build hierarchy), column 3 = description.
    The first CSV row is treated as a header and is skipped. Extra columns map to matching custom term
    fields.
  bundle: taxonomy_import
  rubric_ref: rubric/taxonomy_import_taxonomy_import_columns@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: taxonomy_import-service
  input: How can I import taxonomy terms programmatically with taxonomy_import instead of uploading a
    file, and what controls whether existing terms are updated or duplicated?
  criteria: 'Call the taxonomy_import.term_utils service: TaxonomyUtils::saveTerms($vid, $rows, $forceNewTerms),
    where $rows are [''name'',''parent'',''description''] arrays. The import behaviour / $forceNewTerms
    flag = 0 updates a same-named term, 1 always creates a new term.'
  bundle: taxonomy_import
  rubric_ref: rubric/taxonomy_import_taxonomy_import_service@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: taxonomy_import-allowed-ext
  input: On this Drupal site, taxonomy_import has been configured with a custom set of allowed upload
    file extensions. Inspect the live configuration and state which extensions are allowed.
  criteria: file_extensions is 'csv xml json' (taxonomy_import.config:file_extensions).
  bundle: taxonomy_import
  rubric_ref: rubric/taxonomy_import_taxonomy_import_allowed_ext@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/taxonomy_import-ext-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/taxonomy_import-ext-cleanup.sh
- id: taxonomy_import-max-size
  input: On this Drupal site, inspect taxonomy_import's configuration and state the maximum upload file
    size (in bytes) currently allowed for imports.
  criteria: file_max_size is 12345678 bytes (taxonomy_import.config:file_max_size).
  bundle: taxonomy_import
  rubric_ref: rubric/taxonomy_import_taxonomy_import_max_size@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/taxonomy_import-size-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/taxonomy_import-size-cleanup.sh
- id: taxonomy_import-import-terms
  input: On this Drupal site there is an empty taxonomy vocabulary with machine name 'ti_task'. Using
    the taxonomy_import module, import three terms into it named Red, Green and Blue. Apply the change
    to the live site.
  criteria: Three terms Red, Green, Blue exist in the ti_task vocabulary, e.g. via \Drupal::service('taxonomy_import.term_utils')->saveTerms('ti_task',
    [['name'=>'Red','parent'=>'','description'=>''], ...], 1).
  bundle: taxonomy_import
  rubric_ref: rubric/taxonomy_import_taxonomy_import_import_terms@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/taxonomy_import-terms-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/taxonomy_import-terms-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/taxonomy_import-terms-verify.sh
- id: taxonomy_import-allow-txt
  input: On this Drupal site, configure taxonomy_import so that .txt files are also accepted for taxonomy
    imports (in addition to csv and xml). Apply the change to the live site.
  criteria: taxonomy_import.config:file_extensions includes 'txt' (e.g. set to 'csv xml txt' via /admin/config/content/taxonomy_import/settings_import_taxonomy
    or drush cset taxonomy_import.config file_extensions 'csv xml txt' -y).
  bundle: taxonomy_import
  rubric_ref: rubric/taxonomy_import_taxonomy_import_allow_txt@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/taxonomy_import-setext-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/taxonomy_import-setext-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/taxonomy_import-setext-verify.sh
