metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: tac_lite
  version: 2.0.x
  note: 'tac_lite is a node_access GRANTS module: it grants view/update/delete on nodes based on the taxonomy
    terms they carry (hook_node_access_records + hook_node_grants), realm tac_lite_scheme_<n>. All configuration
    lives in ONE config object, tac_lite.settings (tac_lite_categories = vocab ids, tac_lite_schemes =
    count 1-7, tac_lite_storage_type = tid|uuid, tac_lite_config_scheme_<n> = {name, perms[grant_view/grant_update/grant_delete],
    unpublished, term_visibility, tac_lite_create}, tac_lite_grants_scheme_<n> = role defaults); per-user
    grants are in user.data. There is no tac_lite.scheme.N object. Because this is a node-access module,
    ALL eval cases are deliberately grounded in tac_lite.settings config only and leave tac_lite_categories
    null, so hook_node_access_records emits NO grants and no node_access rebuild is needed and no grants
    are left broken. Baseline: tac_lite_categories null, tac_lite_schemes 1, no scheme config, storage
    defaults to tid.'
questions:
- id: tac_lite-mechanism
  input: How does the Drupal module tac_lite (Taxonomy Access Control Lite) actually control who can see
    a node, and which node operations can it affect? Does it grant or revoke access?
  criteria: 'It uses Drupal''s node_access grants system: hook_node_access_records writes grant rows (gid
    = term id) per scheme realm for a node''s tac_lite terms, and hook_node_grants returns the terms a
    user may access. It can grant view, update and delete. It only GRANTS access (reveals content) — it
    cannot hide content the user already may see.'
  bundle: tac_lite
  rubric_ref: rubric/tac_lite_tac_lite_mechanism@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: tac_lite-config-location
  input: In tac_lite, which config object stores its settings and what are the main keys for choosing
    the controlled vocabularies and the number of schemes? Where is the admin page?
  criteria: 'Everything lives in the tac_lite.settings config object: tac_lite_categories (vocabulary
    ids), tac_lite_schemes (number of schemes, up to 7), tac_lite_storage_type (tid|uuid), and tac_lite_config_scheme_<n>
    / tac_lite_grants_scheme_<n>. Admin UI at /admin/config/people/tac_lite (route tac_lite.administration).'
  bundle: tac_lite
  rubric_ref: rubric/tac_lite_tac_lite_config_location@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: tac_lite-per-user-rebuild
  input: Using tac_lite, how do you give one specific user access to content in a category, and what must
    you do after configuring or changing a scheme?
  criteria: Grant a single user terms on the 'Access by taxonomy' tab of their account edit page (/user/{user}/tac_lite,
    stored via user.data). After changing schemes you must rebuild node access permissions (Reports ->
    Status report -> Rebuild permissions, or node_access_rebuild()).
  bundle: tac_lite
  rubric_ref: rubric/tac_lite_tac_lite_per_user_rebuild@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: tac_lite-scheme-perms
  input: On this Drupal site, tac_lite scheme 1 has been configured. Inspect the live tac_lite configuration
    and tell me the scheme's name and which node permission(s) it grants.
  criteria: 'Scheme 1 is named ''Read access'' and grants node view: tac_lite.settings tac_lite_config_scheme_1
    has name ''Read access'' and perms including grant_view. Discoverable via drush cget tac_lite.settings
    tac_lite_config_scheme_1.'
  bundle: tac_lite
  rubric_ref: rubric/tac_lite_tac_lite_scheme_perms@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/tac_lite-scheme-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/tac_lite-scheme-cleanup.sh
- id: tac_lite-storage-type
  input: On this site, how does tac_lite identify the taxonomy terms in its access grants — by term id
    (tid) or by uuid? Inspect the live tac_lite settings and answer.
  criteria: 'By uuid: tac_lite.settings tac_lite_storage_type is ''uuid'' (the code reads tac_lite_storage_type,
    defaulting to tid when unset). Discoverable via drush cget tac_lite.settings tac_lite_storage_type.'
  bundle: tac_lite
  rubric_ref: rubric/tac_lite_tac_lite_storage_type@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/tac_lite-storage-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/tac_lite-storage-cleanup.sh
- id: tac_lite-grant-view
  input: On this Drupal site, configure tac_lite scheme 1 so that it grants node 'view' access (add the
