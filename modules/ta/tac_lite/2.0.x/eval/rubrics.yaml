rubrics:
- id: tac_lite_tac_lite_mechanism
  version: '1.0'
  applicable_bundles:
  - tac_lite
  checks:
  - kind: must_contain_any
    values:
    - node_access
    - node access
    - hook_node_grants
    - grants
  scoring:
    combine: all_pass
- id: tac_lite_tac_lite_config_location
  version: '1.0'
  applicable_bundles:
  - tac_lite
  checks:
  - kind: must_contain_any
    values:
    - tac_lite.settings
    - tac_lite_categories
    - tac_lite_schemes
    - /admin/config/people/tac_lite
  scoring:
    combine: all_pass
- id: tac_lite_tac_lite_per_user_rebuild
  version: '1.0'
  applicable_bundles:
  - tac_lite
  checks:
  - kind: must_contain_any
    values:
    - rebuild
    - /user/
    - access by taxonomy
    - node access
  scoring:
    combine: all_pass
- id: tac_lite_tac_lite_scheme_perms
  version: '1.0'
  applicable_bundles:
  - tac_lite
  checks:
  - kind: must_contain_any
    values:
    - grant_view
    - Read access
    - view
  scoring:
    combine: all_pass
- id: tac_lite_tac_lite_storage_type
  version: '1.0'
  applicable_bundles:
  - tac_lite
  checks:
  - kind: must_contain_any
    values:
    - uuid
  scoring:
    combine: all_pass
- id: tac_lite_tac_lite_grant_view
  version: '1.0'
  applicable_bundles:
  - tac_lite
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
- id: tac_lite_tac_lite_add_scheme
  version: '1.0'
  applicable_bundles:
  - tac_lite
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
