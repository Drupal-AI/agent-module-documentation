rubrics:
- id: tac_lite_create_tac_lite_create_what
  version: '1.0'
  applicable_bundles:
  - tac_lite_create
  checks:
  - kind: must_contain_any
    values:
    - form
    - hide
    - terms
    - node add
  scoring:
    combine: all_pass
- id: tac_lite_create_tac_lite_create_setting
  version: '1.0'
  applicable_bundles:
  - tac_lite_create
  checks:
  - kind: must_contain_any
    values:
    - tac_lite_create
    - Visibility on create
    - scheme
  scoring:
    combine: all_pass
- id: tac_lite_create_tac_lite_create_widgets
  version: '1.0'
  applicable_bundles:
  - tac_lite_create
  checks:
  - kind: must_contain_any
    values:
    - select
    - radios
    - checkboxes
    - administer tac_lite
  scoring:
    combine: all_pass
- id: tac_lite_create_tac_lite_create_is_enabled
  version: '1.0'
  applicable_bundles:
  - tac_lite_create
  checks:
  - kind: must_contain_any
    values:
    - 'true'
    - enabled
    - tac_lite_create
    - 'yes'
  scoring:
    combine: all_pass
- id: tac_lite_create_tac_lite_create_update_implies
  version: '1.0'
  applicable_bundles:
  - tac_lite_create
  checks:
  - kind: must_contain_any
    values:
    - update
    - grant_update
  scoring:
    combine: all_pass
- id: tac_lite_create_tac_lite_create_enable
  version: '1.0'
  applicable_bundles:
  - tac_lite_create
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
- id: tac_lite_create_tac_lite_create_disable
  version: '1.0'
  applicable_bundles:
  - tac_lite_create
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
