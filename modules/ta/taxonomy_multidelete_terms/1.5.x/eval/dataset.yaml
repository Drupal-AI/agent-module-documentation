metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: taxonomy_multidelete_terms
  version: 1.5.x
  note: Taxonomy Multi-delete Terms is a UI enhancement on core Taxonomy. It alters the taxonomy_overview_terms
    form to add per-row checkboxes + a Delete button (for users with 'access taxonomy multidelete terms'),
    then routes to a confirm form (taxonomy_multidelete_terms.delete) that batch-deletes the selected
    terms via TaxonomyMultideleteBatch::processTerms. No config, no schema, no services, no Drush, configure=null.
    The only persistent module-defined state is its permission, so the medium case reads back which role
    holds it; the hard case verifies live state (all terms removed from a vocabulary), which is exactly
    what the bulk-delete flow produces.
questions:
- id: taxonomy_multidelete_terms-permission
  input: Which permission does the taxonomy_multidelete_terms module add, and what does granting it do
    on the taxonomy term overview page?
  criteria: It adds the 'access taxonomy multidelete terms' permission. Users with it get a checkbox on
    every term row plus a 'Delete' button on the vocabulary term overview page, letting them select and
    bulk-delete terms.
  bundle: taxonomy_multidelete_terms
  rubric_ref: rubric/taxonomy_multidelete_terms_taxonomy_multidelete_terms_permission@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: taxonomy_multidelete_terms-where
  input: On a Drupal site with taxonomy_multidelete_terms enabled, where do I go to delete several taxonomy
    terms at once, and what happens after I select terms and click Delete?
  criteria: Go to the vocabulary's term overview / Manage terms page (/admin/structure/taxonomy/manage/<vocabulary>/overview),
    tick the terms and click Delete. You are taken to a confirmation form that lists the terms (warning
    children are deleted too), and confirming runs a batch that deletes them.
  bundle: taxonomy_multidelete_terms
  rubric_ref: rubric/taxonomy_multidelete_terms_taxonomy_multidelete_terms_where@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: taxonomy_multidelete_terms-children
  input: When bulk-deleting taxonomy terms with taxonomy_multidelete_terms, what happens to a selected
    term's child terms?
  criteria: Deleting a term also deletes all of its children (the confirmation form warns of this, and
    it reflects standard core taxonomy behaviour).
  bundle: taxonomy_multidelete_terms
  rubric_ref: rubric/taxonomy_multidelete_terms_taxonomy_multidelete_terms_children@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: taxonomy_multidelete_terms-known-role
  input: On this Drupal site, exactly one non-core user role has been granted the taxonomy_multidelete_terms
    bulk-delete permission. Inspect the live site and give the machine name of that role.
  criteria: 'The role is tmt_bulk: it holds the ''access taxonomy multidelete terms'' permission (e.g.
    drush role:list, or check user.role.tmt_bulk config / Role::load(''tmt_bulk'')->hasPermission(...)).'
  bundle: taxonomy_multidelete_terms
  rubric_ref: rubric/taxonomy_multidelete_terms_taxonomy_multidelete_terms_known_role@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/taxonomy_multidelete_terms-known-role-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/taxonomy_multidelete_terms-known-role-cleanup.sh
- id: taxonomy_multidelete_terms-bulk-delete
  input: On this Drupal site there is a taxonomy vocabulary with machine name tmt_del that currently contains
    several terms. Delete every term in the tmt_del vocabulary (the vocabulary itself must remain). Apply
    the change to the live site.
  criteria: After the task, the tmt_del vocabulary still exists but has zero terms (e.g. use the bulk
    'Delete' flow on /admin/structure/taxonomy/manage/tmt_del/overview, or delete the taxonomy_term entities
    of vid tmt_del programmatically).
  bundle: taxonomy_multidelete_terms
  rubric_ref: rubric/taxonomy_multidelete_terms_taxonomy_multidelete_terms_bulk_delete@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/taxonomy_multidelete_terms-bulk-delete-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/taxonomy_multidelete_terms-bulk-delete-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/taxonomy_multidelete_terms-bulk-delete-verify.sh
- id: taxonomy_multidelete_terms-known-count
  input: On this Drupal site there is a taxonomy vocabulary with machine name tmt_known. Inspect the live
    site and state how many taxonomy terms it currently contains.
  criteria: The tmt_known vocabulary contains 7 terms (e.g. an entity query counting taxonomy_term entities
    with vid tmt_known).
  bundle: taxonomy_multidelete_terms
  rubric_ref: rubric/taxonomy_multidelete_terms_taxonomy_multidelete_terms_known_count@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/taxonomy_multidelete_terms-known-count-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/taxonomy_multidelete_terms-known-count-cleanup.sh
- id: taxonomy_multidelete_terms-selective-delete
  input: 'On this Drupal site the taxonomy vocabulary tmt_half contains six terms: three whose names begin
    with ''tmt_keep_'' and three whose names begin with ''tmt_del_''. Delete only the three terms whose
    names begin with ''tmt_del_'', leaving the three ''tmt_keep_'' terms intact. Apply the change to the
    live site.'
  criteria: After the task tmt_half has the three tmt_keep_* terms and none of the tmt_del_* terms (e.g.
    select just those three on the term overview bulk-delete flow, or delete the matching taxonomy_term
    entities).
  bundle: taxonomy_multidelete_terms
  rubric_ref: rubric/taxonomy_multidelete_terms_taxonomy_multidelete_terms_selective_delete@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/taxonomy_multidelete_terms-selective-delete-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/taxonomy_multidelete_terms-selective-delete-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/taxonomy_multidelete_terms-selective-delete-verify.sh
