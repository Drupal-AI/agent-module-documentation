metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: taxonomy_term_replace
  version: 1.0.x
  note: 'Taxonomy Term Replace is a UI-only admin tool: one form at route taxonomy_term_replace.dashboard
    (/admin/structure/taxonomy/taxonomy-term-replace), permission ''access Taxonomy Term Replace dashboard''.
    It has no config, no config schema, no plugins, no services, no Drush. Published-node search uses
    the core taxonomy_index table; the unpublished path scans entity-reference fields (target_type taxonomy_term)
    matching the vocabulary. Replacement is a batch that swaps the matching target_id in the node''s reference
    field to the replacement term and saves the node. CSV export -> public://taxonomy-term-node-search.csv.
    Medium is grounded in real content (taxonomy_index usage of a term); hard verifies a node''s reference
    field was swapped from one term to another.'
questions:
- id: taxonomy_term_replace-route
  input: Which module lets a site admin bulk-replace one taxonomy term with another across the nodes that
    reference it, and at what admin path (and behind what permission) is its dashboard?
  criteria: The taxonomy_term_replace module. Its dashboard is at /admin/structure/taxonomy/taxonomy-term-replace
    (route taxonomy_term_replace.dashboard), gated by the permission 'access Taxonomy Term Replace dashboard'.
  bundle: taxonomy_term_replace
  rubric_ref: rubric/taxonomy_term_replace_taxonomy_term_replace_route@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: taxonomy_term_replace-how-finds
  input: How does the taxonomy_term_replace module find the published nodes associated with a taxonomy
    term when you search for it?
  criteria: For published nodes it queries the core taxonomy_index table (SELECT nid FROM taxonomy_index
    WHERE tid IN (...)). Including unpublished nodes instead scans each content type's entity-reference
    fields whose target_type is taxonomy_term and target bundle matches the vocabulary.
  bundle: taxonomy_term_replace
  rubric_ref: rubric/taxonomy_term_replace_taxonomy_term_replace_how_finds@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: taxonomy_term_replace-csv
  input: Besides replacing a term, what reporting/export feature does the taxonomy_term_replace dashboard
    provide?
  criteria: It shows the count of nodes associated with the searched term in a table and offers a 'Download
    table' button that exports that node list (Node ID, URL, content type, status) to a CSV file (public://taxonomy-term-node-search.csv).
  bundle: taxonomy_term_replace
  rubric_ref: rubric/taxonomy_term_replace_taxonomy_term_replace_csv@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: taxonomy_term_replace-known-count
  input: On this Drupal site, the vocabulary ttr_known has a term named 'Popular Known'. Using the same
    source the taxonomy_term_replace dashboard uses for published nodes, determine how many published
    nodes are associated with that term.
  criteria: 2 published nodes reference the 'Popular Known' term. This is countable from the core taxonomy_index
    table (SELECT COUNT(*) FROM taxonomy_index WHERE tid = <term id>), which is what the module queries
    for published nodes.
  bundle: taxonomy_term_replace
  rubric_ref: rubric/taxonomy_term_replace_taxonomy_term_replace_known_count@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/taxonomy_term_replace-known-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/taxonomy_term_replace-known-cleanup.sh
- id: taxonomy_term_replace-known-field
  input: On this site, nodes in the Article type reference terms of the vocabulary ttr_known. Inspect
    the live field configuration and name the entity-reference field (machine name) that points Article
    nodes at ttr_known terms.
  criteria: 'The field is field_ttr_kref: an entity_reference field on node/article with target_type taxonomy_term
    and target_bundles including ttr_known. This is the kind of field the module scans for the unpublished-node
    path.'
  bundle: taxonomy_term_replace
  rubric_ref: rubric/taxonomy_term_replace_taxonomy_term_replace_known_field@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/taxonomy_term_replace-known-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/taxonomy_term_replace-known-cleanup.sh
- id: taxonomy_term_replace-replace
  input: 'On this Drupal site there is a vocabulary ttr_task with terms ''ttr_old'' and ''ttr_new'', and
    an Article node titled TTR_TASK_NODE whose entity-reference field (field_ttr_tref) currently references
    ''ttr_old''. Perform the taxonomy_term_replace operation: replace the term ''ttr_old'' with ''ttr_new''
    on that node so it now references ttr_new. Apply the change to the live site.'
  criteria: The TTR_TASK_NODE node's field_ttr_tref no longer references the ttr_old term and instead
    references ttr_new (swap the matching target_id in the reference field to the ttr_new term id and
    save the node, as TaxonomyTermReplaceForm::taxonomyTermReplacement() does — or perform it via the
    dashboard).
  bundle: taxonomy_term_replace
  rubric_ref: rubric/taxonomy_term_replace_taxonomy_term_replace_replace@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/taxonomy_term_replace-replace-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/taxonomy_term_replace-replace-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/taxonomy_term_replace-replace-verify.sh
- id: taxonomy_term_replace-replace-layman
  input: 'I renamed one of my content tags: everything filed under the old tag ''ttr_old'' should now
    use the tag ''ttr_new'' instead. There is a page (TTR_TASK_NODE) still using the old tag. Please move
    it over to the new tag on the live site.'
  criteria: Change the TTR_TASK_NODE node's field_ttr_tref reference from the ttr_old term to the ttr_new
    term and save the node.
  bundle: taxonomy_term_replace
  rubric_ref: rubric/taxonomy_term_replace_taxonomy_term_replace_replace_layman@1.0
