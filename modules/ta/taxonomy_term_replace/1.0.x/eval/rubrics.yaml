rubrics:
- id: taxonomy_term_replace_taxonomy_term_replace_route
  version: '1.0'
  applicable_bundles:
  - taxonomy_term_replace
  checks:
  - kind: must_contain_any
    values:
    - /admin/structure/taxonomy/taxonomy-term-replace
    - taxonomy_term_replace.dashboard
    - access Taxonomy Term Replace dashboard
  scoring:
    combine: all_pass
- id: taxonomy_term_replace_taxonomy_term_replace_how_finds
  version: '1.0'
  applicable_bundles:
  - taxonomy_term_replace
  checks:
  - kind: must_contain_any
    values:
    - taxonomy_index
  scoring:
    combine: all_pass
- id: taxonomy_term_replace_taxonomy_term_replace_csv
  version: '1.0'
  applicable_bundles:
  - taxonomy_term_replace
  checks:
  - kind: must_contain_any
    values:
    - CSV
    - csv
    - download
    - Download
  scoring:
    combine: all_pass
- id: taxonomy_term_replace_taxonomy_term_replace_known_count
  version: '1.0'
  applicable_bundles:
  - taxonomy_term_replace
  checks:
  - kind: must_contain_any
    values:
    - '2'
  scoring:
    combine: all_pass
- id: taxonomy_term_replace_taxonomy_term_replace_known_field
  version: '1.0'
  applicable_bundles:
  - taxonomy_term_replace
  checks:
  - kind: must_contain_any
    values:
    - field_ttr_kref
  scoring:
    combine: all_pass
- id: taxonomy_term_replace_taxonomy_term_replace_replace
  version: '1.0'
  applicable_bundles:
  - taxonomy_term_replace
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
- id: taxonomy_term_replace_taxonomy_term_replace_replace_layman
  version: '1.0'
  applicable_bundles:
  - taxonomy_term_replace
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
