rubrics:
- id: tacjs_tacjs_config_and_library
  version: '1.0'
  applicable_bundles:
  - tacjs
  checks:
  - kind: must_contain_any
    values:
    - tacjs.settings
    - libraries/tarteaucitronjs
    - tarteaucitronjs
  scoring:
    combine: all_pass
- id: tacjs_tacjs_permission
  version: '1.0'
  applicable_bundles:
  - tacjs
  checks:
  - kind: must_contain_any
    values:
    - administer tacjs
  scoring:
    combine: all_pass
- id: tacjs_tacjs_known_privacyurl
  version: '1.0'
  applicable_bundles:
  - tacjs
  checks:
  - kind: must_contain_any
    values:
    - /tacjs-probe-privacy
  scoring:
    combine: all_pass
- id: tacjs_tacjs_known_service
  version: '1.0'
  applicable_bundles:
  - tacjs
  checks:
  - kind: must_contain_any
    values:
    - tacjs_probe_service
  scoring:
    combine: all_pass
- id: tacjs_tacjs_disable_banner
  version: '1.0'
  applicable_bundles:
  - tacjs
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
- id: tacjs_tacjs_enable_youtube
  version: '1.0'
  applicable_bundles:
  - tacjs
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
