metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: tacjs_media
  version: 7.0.x
  note: 'TacJS Media is a submodule of TacJS providing a single consent-aware oEmbed field formatter,
    plugin id ''tacjs_oembed'' (label ''oEmbed content (TacJS integration)''), class TacJSOEmbedFormatter
    extends core OEmbedFormatter, for field types link/string/string_long. It converts the iframe to a
    div with a provider class (youtube_player/vimeo_player/dailymotion_player) and a videoID attribute
    and drops src, so tarteaucitron only loads the player after consent. No config form; the choice is
    stored in the entity_view_display config as the field component ''type: tacjs_oembed''. Requires tacjs
    + core media. Medium/hard cases create a namespaced link field on Article and are grounded in the
    real view-display formatter config.'
questions:
- id: tacjs_media-formatter-id
  input: The TacJS Media submodule adds a field formatter for embedding remote video behind cookie consent.
    What is the formatter's plugin id and label?
  criteria: The formatter plugin id is tacjs_oembed, labelled 'oEmbed content (TacJS integration)'. It
    extends core's OEmbedFormatter.
  bundle: tacjs_media
  rubric_ref: rubric/tacjs_media_tacjs_media_formatter_id@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: tacjs_media-what-it-does
  input: What does the TacJS Media oEmbed formatter change about how a YouTube or Vimeo video is rendered,
    compared to core's oEmbed formatter?
  criteria: Instead of a ready-to-play iframe it renders a div with a provider class (youtube_player/vimeo_player/dailymotion_player)
    and a videoID attribute, dropping the src, so tarteaucitron.js only builds the player after the visitor
    consents to that service.
  bundle: tacjs_media
  rubric_ref: rubric/tacjs_media_tacjs_media_what_it_does@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: tacjs_media-how-to-use
  input: How do I make a remote-video field use TacJS Media so the video only loads after consent, and
    which field types does the formatter support?
  criteria: On the field's Manage display, choose the 'oEmbed content (TacJS integration)' formatter (tacjs_oembed);
    it supports link, string and string_long field types. Also enable the matching TacJS service (youtube/vimeo/dailymotion).
  bundle: tacjs_media
  rubric_ref: rubric/tacjs_media_tacjs_media_how_to_use@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: tacjs_media-known-formatter
  input: On this Drupal site, one field on the Article content type is displayed with the TacJS-integrated
    oEmbed formatter. Inspect the live default view display for Article and give the machine name of that
    field.
  criteria: 'The field is field_tjm_known: in core.entity_view_display.node.article.default its component
    has type: tacjs_oembed.'
  bundle: tacjs_media
  rubric_ref: rubric/tacjs_media_tacjs_media_known_formatter@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/tacjs_media-known-formatter-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/tacjs_media-known-formatter-cleanup.sh
- id: tacjs_media-set-formatter
  input: On this Drupal site, the Article content type has a link field field_tjm_task that holds a video
    URL. Configure its default display so it is rendered with the TacJS Media consent-aware oEmbed formatter.
    Apply the change to the live view display.
  criteria: In core.entity_view_display.node.article.default set the field_tjm_task component's formatter
    type to tacjs_oembed (via Manage display -> Format 'oEmbed content (TacJS integration)', or setComponent
    with type=tacjs_oembed and save).
  bundle: tacjs_media
  rubric_ref: rubric/tacjs_media_tacjs_media_set_formatter@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/tacjs_media-set-formatter-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/tacjs_media-set-formatter-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/tacjs_media-set-formatter-verify.sh
