rubrics:
- id: tacjs_log_tacjs_log_where_stored
  version: '1.0'
  applicable_bundles:
  - tacjs_log
  checks:
  - kind: must_contain_any
    values:
    - tacjslog
  scoring:
    combine: all_pass
- id: tacjs_log_tacjs_log_overview_report
  version: '1.0'
  applicable_bundles:
  - tacjs_log
  checks:
  - kind: must_contain_any
    values:
    - /admin/config/system/tacjs/overview
    - tacjs_log.overview
    - administer tacjs
  scoring:
    combine: all_pass
- id: tacjs_log_tacjs_log_report_endpoint
  version: '1.0'
  applicable_bundles:
  - tacjs_log
  checks:
  - kind: must_contain_any
    values:
    - /reports/tacjslog
    - tacjs_log.report
  scoring:
    combine: all_pass
- id: tacjs_log_tacjs_log_known_consent
  version: '1.0'
  applicable_bundles:
  - tacjs_log
  checks:
  - kind: must_contain_any
    values:
    - tacjs_probe_consent
  scoring:
    combine: all_pass
- id: tacjs_log_tacjs_log_record_consent
  version: '1.0'
  applicable_bundles:
  - tacjs_log
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
