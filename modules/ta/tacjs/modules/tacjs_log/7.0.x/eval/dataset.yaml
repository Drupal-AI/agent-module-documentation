metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: tacjs_log
  version: 7.0.x
  note: 'TacJS Log is a submodule of TacJS that records proof of cookie consent. Its only persistent state
    is the ''tacjslog'' database table (columns: uid serial PK, timestamp int, ip_address varchar(255),
    services_allowed text) created by hook_schema in tacjs_log.install. Front-end JS POSTs to route tacjs_log.report
    /reports/tacjslog/{service} (perm access content); LogController::report inserts {timestamp, ip_address,
    services_allowed}. Admin report at route tacjs_log.overview /admin/config/system/tacjs/overview (perm
    administer tacjs). No config, no config schema. Medium/hard cases are grounded in the real tacjslog
    table.'
questions:
- id: tacjs_log-where-stored
  input: The TacJS Log submodule records cookie-consent decisions. In which database table does it store
    each proof-of-consent record, and what does a row contain?
  criteria: It stores rows in the 'tacjslog' table, each with a timestamp, the visitor's ip_address, and
    the services_allowed string (plus a serial uid primary key).
  bundle: tacjs_log
  rubric_ref: rubric/tacjs_log_tacjs_log_where_stored@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: tacjs_log-overview-report
  input: Where do administrators view the collected TacJS proof-of-consent records, and which permission
    is required?
  criteria: At /admin/config/system/tacjs/overview (route tacjs_log.overview), a paged sortable table,
    requiring the 'administer tacjs' permission.
  bundle: tacjs_log
  rubric_ref: rubric/tacjs_log_tacjs_log_overview_report@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: tacjs_log-report-endpoint
  input: How does the TacJS Log module capture a consent event from the front end - which route/URL does
    the browser call to record that a service was allowed?
  criteria: The attached JS POSTs to route tacjs_log.report at /reports/tacjslog/{service} (permission
    access content); LogController::report() inserts the row into tacjslog.
  bundle: tacjs_log
  rubric_ref: rubric/tacjs_log_tacjs_log_report_endpoint@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: tacjs_log-known-consent
  input: On this Drupal site the TacJS consent log has one recorded consent. Inspect the live tacjslog
    data and report the services_allowed value of that record.
  criteria: The services_allowed value is tacjs_probe_consent (SELECT services_allowed FROM tacjslog).
  bundle: tacjs_log
  rubric_ref: rubric/tacjs_log_tacjs_log_known_consent@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/tacjs_log-known-consent-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/tacjs_log-known-consent-cleanup.sh
- id: tacjs_log-record-consent
  input: On this Drupal site, record a TacJS proof-of-consent entry for the service named 'tacjs_log_task'
    (as if a visitor accepted that service), so it appears in the consent log.
  criteria: Insert a row into the tacjslog table with services_allowed='tacjs_log_task' (e.g. via \Drupal::database()->insert('tacjslog')
    with timestamp/ip_address/services_allowed, which is exactly what LogController::report() does), or
    hit /reports/tacjslog/tacjs_log_task.
  bundle: tacjs_log
  rubric_ref: rubric/tacjs_log_tacjs_log_record_consent@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/tacjs_log-record-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/tacjs_log-record-reset.sh
    verify: agent-module-documentation/evaluation/verify/tacjs_log-record-verify.sh
