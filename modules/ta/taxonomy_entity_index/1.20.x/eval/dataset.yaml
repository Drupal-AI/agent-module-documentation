metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: taxonomy_entity_index
  version: 1.20.x
  note: Taxonomy Entity Index maintains a denormalized taxonomy_entity_index table (entity_type, bundle,
    entity_id, revision_id, field_name, delta, tid) mapping content entities to referenced taxonomy terms,
    for the entity types selected in taxonomy_entity_index.settings:types (plus booleans index_revisions
    and index_per_field). Settings form route taxonomy_entity_index.admin at /admin/config/system/taxonomy-entity-index;
    reindex form taxonomy_entity_index.admin_reindex. Drush command taxonomy_entity_index:rebuild (aliases
    tei:rebuild, tei-rebuild). Ships Views argument/field/filter plugins with hierarchy depth. Medium/hard
    cases read and write the real taxonomy_entity_index.settings config object.
questions:
- id: tei-config-key
  input: In the Drupal taxonomy_entity_index module, how do I control which entity types get indexed?
    Name the config object and key.
  criteria: The taxonomy_entity_index.settings config object holds a 'types' list of entity type IDs to
    index (set on the settings form at /admin/config/system/taxonomy-entity-index), plus booleans index_revisions
    and index_per_field.
  bundle: taxonomy_entity_index
  rubric_ref: rubric/taxonomy_entity_index_tei_config_key@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: tei-drush
  input: Which Drush command rebuilds the taxonomy_entity_index table, and how do I rebuild only certain
    entity types?
  criteria: drush taxonomy_entity_index:rebuild (aliases tei:rebuild / tei-rebuild). With no argument
    it rebuilds all configured types; pass a comma list to limit, e.g. drush tei:rebuild node,media.
  bundle: taxonomy_entity_index
  rubric_ref: rubric/taxonomy_entity_index_tei_drush@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: tei-table
  input: What database table does the taxonomy_entity_index module maintain, and what does each row represent
    (name some columns)?
  criteria: 'It maintains the taxonomy_entity_index table; each row maps an entity revision/field/delta
    to a term: columns entity_type, bundle, entity_id, revision_id, field_name, delta, tid.'
  bundle: taxonomy_entity_index
  rubric_ref: rubric/taxonomy_entity_index_tei_table@1.0
