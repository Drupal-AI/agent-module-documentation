metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: iframe
  version: 3.0.x
  note: 'Iframe defines one field type with three widgets and four formatters plus per-field styling settings
    and a themeable template. Cases are `recipe` (response-graded): they probe documented facts an agent
    would otherwise read source to answer; no site mutation.'
questions:
- id: iframe-field-type
  input: On a Drupal 11 site I want to embed a complete iframe (source URL plus width/height/title) into
    a content type without writing HTML. Which contrib module and field type do I use, and what is the
    field type's machine id?
  criteria: The Iframe module provides a field type with machine id `iframe`; add it via Field UI and
    it stores a URL plus title, width, height and styling attributes.
  bundle: iframe
  rubric_ref: rubric/iframe_iframe_field_type@1.0
  tags:
  - mode:recipe
- id: iframe-widgets
  input: The Iframe field offers three widgets that control how much of the size the editor can set. Name
    the three widget ids and what each shows.
  criteria: iframe_url (URL only), iframe_urlheight (URL + height), iframe_urlwidthheight (URL + width
    + height, the default).
  bundle: iframe
  rubric_ref: rubric/iframe_iframe_widgets@1.0
  tags:
  - mode:recipe
- id: iframe-formatters
  input: I want to render an iframe field either as an embedded iframe or as a plain link. Which formatters
    does the Iframe module provide?
  criteria: iframe_default (title over iframe), iframe_only (iframe without title), iframe_asurl (link
    with the title), iframe_asurlwithuri (link with the URI as title).
  bundle: iframe
  rubric_ref: rubric/iframe_iframe_formatters@1.0
  tags:
  - mode:recipe
- id: iframe-size-values
  input: What formats can I enter for the width and height of an Iframe field, and how do I make the iframe
    responsive?
  criteria: Plain number = pixels (e.g. 500), number + % = percent (50%), plus em/rem/vw for width and
    em/rem/vh for height; add the iframe-responsive class to use width/height as an aspect ratio.
  bundle: iframe
  rubric_ref: rubric/iframe_iframe_size_values@1.0
  tags:
  - mode:recipe
- id: iframe-allowfullscreen
  input: Which Iframe field setting controls whether the embedded iframe (e.g. a video player) is allowed
    to go fullscreen, and what is its default?
  criteria: The allowfullscreen setting (0 = false, 1 = true) toggles the iframe's allowfullscreen attribute;
    the widget default is 1 (true).
  bundle: iframe
  rubric_ref: rubric/iframe_iframe_allowfullscreen@1.0
  tags:
  - mode:recipe
- id: iframe-scrolling
  input: How do I control scrollbars on an Iframe field's embed, and what are the allowed values and default?
  criteria: The scrolling setting accepts auto (Automatic), no (Disabled), or yes (Enabled); default is
    auto.
  bundle: iframe
  rubric_ref: rubric/iframe_iframe_scrolling@1.0
  tags:
  - mode:recipe
- id: iframe-expose-class
  input: By default editors cannot set a custom CSS class on an Iframe field. Which widget setting lets
    an author specify an additional CSS class per iframe?
  criteria: Enable the expose_class widget setting ("Expose Additional CSS Class") so the class field
    is shown to authors; otherwise the field's class is applied automatically.
  bundle: iframe
  rubric_ref: rubric/iframe_iframe_expose_class@1.0
  tags:
  - mode:recipe
- id: iframe-theme-headerlevel
  input: The Iframe module renders the title as a heading above the embed. Which template and variable
    control the heading level for accessibility, and what is the default?
  criteria: templates/iframe.html.twig renders the title using the headerlevel variable (h1–h4), defaulting
    to h3.
  bundle: iframe
  rubric_ref: rubric/iframe_iframe_theme_headerlevel@1.0
  tags:
  - mode:recipe
