metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: editor_advanced_link
  version: 2.3.x
  note: Editor Advanced Link is a CKEditor 5 plugin configured per text format with no admin route of
    its own, so all cases are `recipe` (response-graded), not `execution` (live-state).
questions:
- id: editoradvlink-plugin-id
  input: On a Drupal 11 site I enabled the Editor Advanced Link module. What is the machine name / plugin
    id of the CKEditor 5 plugin it provides (the one that adds the advanced link attributes), and what
    is its human-readable label in the CKEditor 5 plugin settings?
  criteria: The CKEditor 5 plugin id is editor_advanced_link_link, labelled "Advanced links" in the CKEditor
    5 plugin settings vertical tabs.
  bundle: editor_advanced_link
  rubric_ref: rubric/editor_advanced_link_editoradvlink_plugin_id@1.0
  tags:
  - mode:recipe
- id: editoradvlink-enable-plugin
  input: I installed Editor Advanced Link but can't find an admin page for it. Where do I configure it,
    and what makes the Advanced links plugin actually appear in a text format's CKEditor 5 settings?
  criteria: There is no dedicated admin route. Configure it per text format at Admin > Configuration >
    Content authoring > Text formats and editors (/admin/config/content/formats). The Advanced links plugin
    activates automatically when the core Link (ckeditor5_link) plugin is enabled on that CKEditor 5 format.
  bundle: editor_advanced_link
  rubric_ref: rubric/editor_advanced_link_editoradvlink_enable_plugin@1.0
  tags:
  - mode:recipe
- id: editoradvlink-supported-attributes
  input: Which extra <a> attributes can Editor Advanced Link expose in the CKEditor link dialog? List
    them.
  criteria: 'The supported attributes (SUPPORTED_ATTRIBUTES) are: aria-label, title, class, id, target
    (Open in new window, target="_blank"), and rel.'
  bundle: editor_advanced_link
  rubric_ref: rubric/editor_advanced_link_editoradvlink_supported_attributes@1.0
  tags:
  - mode:recipe
- id: editoradvlink-filter-html-allowed
  input: My text format uses "Limit allowed HTML tags and correct faulty HTML". Editors can't see the
    Title field on links from Editor Advanced Link even though I enabled the Title attribute in the Advanced
    links plugin. What must I change in the allowed HTML tags, and generally how do the two settings interact?
  criteria: An attribute is only usable when it is allowed on the <a> tag in the filter's allowed HTML.
    Enabling the attribute in the plugin contributes the matching fragment (e.g. <a title>) via getElementsSubset();
    if you tighten the filter you must ensure <a title> (or <a class>, <a id>, <a rel>, <a aria-label>,
    <a target="_blank">) is present in the allowed tags.
  bundle: editor_advanced_link
  rubric_ref: rubric/editor_advanced_link_editoradvlink_filter_html_allowed@1.0
  tags:
  - mode:recipe
- id: editoradvlink-target-blank-decorator
  input: In Editor Advanced Link, what happens when I check "Open in new window" in the Advanced links
    plugin settings — what does it write to the link and how?
  criteria: Checking "Open in new window" registers a manual CKEditor link decorator (via getDynamicPluginConfig)
    that writes target="_blank" on the link, and contributes the <a target="_blank"> allowed-HTML fragment.
  bundle: editor_advanced_link
  rubric_ref: rubric/editor_advanced_link_editoradvlink_target_blank_decorator@1.0
  tags:
  - mode:recipe
- id: editoradvlink-enabled-attributes-config
  input: Where and under what key are the Editor Advanced Link attribute choices stored in a text format's
    exported configuration, and what is the config schema key?
  criteria: 'The checked attributes are stored as enabled_attributes (a sequence of attribute strings)
    under the editor''s settings.plugins.editor_advanced_link_link config. The schema key is ckeditor5.plugin.editor_advanced_link_link.
    Default is enabled_attributes: [] (nothing exposed until opted in).'
  bundle: editor_advanced_link
  rubric_ref: rubric/editor_advanced_link_editoradvlink_enabled_attributes_config@1.0
  tags:
  - mode:recipe
- id: editoradvlink-linkit-dialog-alter
  input: I use the classic editor link dialog and Linkit rather than the CKEditor 5 plugin path. How does
    Editor Advanced Link add its advanced fields (title, class, id, target, rel, aria-label) to those
    dialogs?
  criteria: 'editor_advanced_link.module implements hook_form_editor_link_dialog_alter() (editor_advanced_link_form_editor_link_dialog_alter)
    to add the fields, and editor_advanced_link_form_linkit_editor_dialog_form_alter() delegates to the
    same alter so Linkit''s dialog gets them too. Field #access is computed from the format''s HTML restrictions.'
  bundle: editor_advanced_link
  rubric_ref: rubric/editor_advanced_link_editoradvlink_linkit_dialog_alter@1.0
  tags:
  - mode:recipe
- id: editoradvlink-ckeditor4-upgrade
  input: We are upgrading a site from CKEditor 4 to CKEditor 5. Does Editor Advanced Link's old configuration
    carry over, and what handles that mapping?
  criteria: Yes. src/Plugin/CKEditor4To5Upgrade/AdvancedLink.php (plugin id editor_advanced_link) maps
    the old CKEditor 4 configuration to the CKEditor 5 editor_advanced_link_link plugin during the core
    upgrade path, preserving advanced-link behavior.
  bundle: editor_advanced_link
  rubric_ref: rubric/editor_advanced_link_editoradvlink_ckeditor4_upgrade@1.0
  tags:
  - mode:recipe
