rubrics:
- id: editablefields_editablefields_which_formatter
  version: '1.0'
  applicable_bundles:
  - editablefields
  checks:
  - kind: must_contain_any
    values:
    - editablefields_formatter
    - Editable field
    - Manage display
    - all field types
    - any field type
  scoring:
    combine: all_pass
- id: editablefields_editablefields_inline_vs_popup
  version: '1.0'
  applicable_bundles:
  - editablefields
  checks:
  - kind: must_contain_any
    values:
    - behaviour
    - popup
    - inline
  scoring:
    combine: all_pass
- id: editablefields_editablefields_permission
  version: '1.0'
  applicable_bundles:
  - editablefields
  checks:
  - kind: must_contain_any
    values:
    - use editablefields
    - update access
    - update
  scoring:
    combine: all_pass
- id: editablefields_editablefields_known_popup
  version: '1.0'
  applicable_bundles:
  - editablefields
  checks:
  - kind: must_contain_any
    values:
    - field_ef_note
  scoring:
    combine: all_pass
- id: editablefields_editablefields_known_autosave
  version: '1.0'
  applicable_bundles:
  - editablefields
  checks:
  - kind: must_contain_any
    values:
    - field_ef_auto
  scoring:
    combine: all_pass
- id: editablefields_editablefields_make_inline
  version: '1.0'
  applicable_bundles:
  - editablefields
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
- id: editablefields_editablefields_make_popup
  version: '1.0'
  applicable_bundles:
  - editablefields
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
