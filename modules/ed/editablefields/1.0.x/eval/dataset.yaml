metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: editablefields
  version: 1.0.x
  note: 'Editable Fields provides one field formatter, editablefields_formatter (''Editable field''),
    made available for ALL field types via hook_field_formatter_info_alter(). It renders a field''s edit
    widget inline or in a modal popup on the entity display so the value can be edited/saved without the
    full form. There is no configure route and no global settings page; all configuration is per-field
    in the display component''s formatter settings (schema field.formatter.settings.editablefields_formatter)
    inside core.entity_view_display.<entity>.<bundle>.<mode>. Key settings: form_mode, behaviour (inline|popup),
    bypass_access, fallback_access/display_mode_access, fallback_edit/display_mode_edit, fields_ajax_trigger
    + fields_ajax_trigger_event (autosave). Access = ''use editablefields'' permission AND entity update
    access (unless bypass_access). Medium/hard cases are grounded in that real formatter config on the
    Article view display.'
questions:
- id: editablefields-which-formatter
  input: In Drupal, I want to let editors change a field's value directly on the node's display page instead
    of opening the full edit form. The Editable Fields module is enabled. What display formatter do I
    choose, and can it be used on any field type?
  criteria: On the field's Manage display, set the formatter to 'Editable field' (editablefields_formatter).
    The module makes this formatter available for all field types via hook_field_formatter_info_alter().
    It renders the field's edit widget on the display so it can be edited in place.
  bundle: editablefields
  rubric_ref: rubric/editablefields_editablefields_which_formatter@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: editablefields-inline-vs-popup
  input: With the Editable Fields formatter, how do I make a field open its edit widget in a modal popup
    instead of showing it inline? Which formatter setting controls that?
  criteria: Set the formatter's 'behaviour' setting to 'popup' (the default is 'inline'). Popup renders
    an 'Edit' link that opens the widget in a modal dialog via the editablefields.get_from route; inline
    embeds the widget directly.
  bundle: editablefields
  rubric_ref: rubric/editablefields_editablefields_inline_vs_popup@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: editablefields-permission
  input: Which permission must a Drupal user have to actually edit fields inline using the Editable Fields
    module, and what else is checked?
  criteria: The user needs the 'use editablefields' permission AND update access to the entity (EditableFieldsHelper::checkAccess).
    If the formatter's bypass_access setting is TRUE, the update-access requirement is skipped.
  bundle: editablefields
  rubric_ref: rubric/editablefields_editablefields_permission@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: editablefields-known-popup
  input: On this Drupal site, the Article content type has a field configured with the Editable Fields
    formatter that opens its editor in a modal popup. Inspect the live default view display for Article
    and give the field's machine name and its behaviour setting.
  criteria: 'field_ef_note, with behaviour ''popup'': in core.entity_view_display.node.article.default
    its component uses type editablefields_formatter and settings.behaviour: popup.'
  bundle: editablefields
  rubric_ref: rubric/editablefields_editablefields_known_popup@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/editablefields-known-popup-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/editablefields-known-popup-cleanup.sh
- id: editablefields-known-autosave
  input: One Article field on this site uses the Editable Fields formatter with autosave (it submits via
    ajax when the field changes, hiding the update button). Inspect the live view-display configuration
    and state which field it is and which DOM event triggers the autosave.
  criteria: 'field_ef_auto, triggered on the ''blur'' event: in core.entity_view_display.node.article.default
    its editablefields_formatter component has settings.fields_ajax_trigger: field_ef_auto and settings.fields_ajax_trigger_event:
    blur.'
  bundle: editablefields
  rubric_ref: rubric/editablefields_editablefields_known_autosave@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
