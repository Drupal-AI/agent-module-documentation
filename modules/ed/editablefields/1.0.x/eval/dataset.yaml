    cleanup: agent-module-documentation/evaluation/verify/editablefields-known-autosave-cleanup.sh
- id: editablefields-make-inline
  input: On this Drupal site, the Article content type has a text field field_ef_task currently shown
    with a plain string formatter in the default view display. Using the Editable Fields module, make
