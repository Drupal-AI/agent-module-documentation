rubrics:
- id: swiper_formatter_sf_image_formatter
  version: '1.0'
  applicable_bundles:
  - swiper_formatter
  checks:
  - kind: must_contain_any
    values:
    - swiper_formatter_image
    - swiper_formatter_image_dialog
    - swiper_formatter_entity
    - swiper_formatter_text
    - swiper_formatter_paragraphs
  scoring:
    combine: all_pass
- id: swiper_formatter_sf_templates_location
  version: '1.0'
  applicable_bundles:
  - swiper_formatter
  checks:
  - kind: must_contain_any
    values:
    - swiper-formatter
    - config entity
    - configuration entity
    - swiper_formatter
    - default
    - /admin/config/content/swiper-formatter
  scoring:
    combine: all_pass
- id: swiper_formatter_sf_views_style
  version: '1.0'
  applicable_bundles:
  - swiper_formatter
  checks:
  - kind: must_contain_any
    values:
    - swiper_formatter
    - Swiper formatter
  scoring:
    combine: all_pass
- id: swiper_formatter_sf_known_template_direction
  version: '1.0'
  applicable_bundles:
  - swiper_formatter
  checks:
  - kind: must_contain_any
    values:
    - vertical
  scoring:
    combine: all_pass
- id: swiper_formatter_sf_display_formatter
  version: '1.0'
  applicable_bundles:
  - swiper_formatter
  checks:
  - kind: must_contain_any
    values:
    - swiper_formatter_text
  scoring:
    combine: all_pass
- id: swiper_formatter_sf_create_template
  version: '1.0'
  applicable_bundles:
  - swiper_formatter
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
- id: swiper_formatter_sf_set_formatter
  version: '1.0'
  applicable_bundles:
  - swiper_formatter
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
