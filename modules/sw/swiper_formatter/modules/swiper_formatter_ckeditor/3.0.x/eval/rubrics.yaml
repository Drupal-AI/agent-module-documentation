rubrics:
- id: swiper_formatter_ckeditor_sfck_what_is_it
  version: '1.0'
  applicable_bundles:
  - swiper_formatter_ckeditor
  checks:
  - kind: must_contain_any
    values:
    - CKEditor
    - placeholder
    - not implemented
    - not yet
    - stub
    - TODO
  scoring:
    combine: all_pass
- id: swiper_formatter_ckeditor_sfck_dependency
  version: '1.0'
  applicable_bundles:
  - swiper_formatter_ckeditor
  checks:
  - kind: must_contain_any
    values:
    - swiper_formatter
  scoring:
    combine: all_pass
- id: swiper_formatter_ckeditor_sfck_where_slider_today
  version: '1.0'
  applicable_bundles:
  - swiper_formatter_ckeditor
  checks:
  - kind: must_contain_any
    values:
    - field formatter
    - Views style
    - swiper_formatter
    - parent
  scoring:
    combine: all_pass
- id: swiper_formatter_ckeditor_sfck_is_enabled
  version: '1.0'
  applicable_bundles:
  - swiper_formatter_ckeditor
  checks:
  - kind: must_contain_any
    values:
    - enabled
    - Enabled
    - installed
    - 'yes'
  scoring:
    combine: all_pass
- id: swiper_formatter_ckeditor_sfck_dependency_live
  version: '1.0'
  applicable_bundles:
  - swiper_formatter_ckeditor
  checks:
  - kind: must_contain_any
    values:
    - swiper_formatter
  scoring:
    combine: all_pass
- id: swiper_formatter_ckeditor_sfck_enable
  version: '1.0'
  applicable_bundles:
  - swiper_formatter_ckeditor
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
- id: swiper_formatter_ckeditor_sfck_uninstall
  version: '1.0'
  applicable_bundles:
  - swiper_formatter_ckeditor
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
