metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: swiper_formatter_ckeditor
  version: 3.0.x
  note: 'swiper_formatter_ckeditor is a submodule of swiper_formatter. In 3.0.x it is a placeholder: it
    ships only swiper_formatter_ckeditor.info.yml + README.md, with no PHP/JS/*.ckeditor5.yml/config/routes/permissions/hooks.
    Its intended purpose is a CKEditor 5 toolbar button for embedding a Swiper slider into rich text (parent
    README lists ''Finish CKEditor 5 plugin'' as a TODO). It declares a dependency on swiper_formatter:swiper_formatter.
    Because the submodule has no functional surface, medium/hard cases are grounded in the only real live
    state it has: its enablement in core.extension. Introspection reads whether it is enabled and its
    dependency; execution enables and uninstalls it, verified against core.extension. It ships disabled
    (baseline); cleanups leave it uninstalled.'
questions:
- id: sfck-what-is-it
  input: What is the swiper_formatter_ckeditor submodule for, and what is its implementation status in
    the 3.0.x release of swiper_formatter?
  criteria: It is intended to add a CKEditor 5 toolbar button to embed a Swiper slider into rich text,
    but in 3.0.x it is a placeholder/stub that only ships an info.yml and README (the CKEditor 5 plugin
    is not yet implemented).
  bundle: swiper_formatter_ckeditor
  rubric_ref: rubric/swiper_formatter_ckeditor_sfck_what_is_it@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: sfck-dependency
  input: Which Drupal module does swiper_formatter_ckeditor depend on, and can it work on its own?
  criteria: It depends on the parent swiper_formatter module (swiper_formatter:swiper_formatter) and cannot
    work on its own; the working slider features live in the parent module.
  bundle: swiper_formatter_ckeditor
  rubric_ref: rubric/swiper_formatter_ckeditor_sfck_dependency@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: sfck-where-slider-today
  input: I enabled swiper_formatter_ckeditor but there is no Swiper button in my CKEditor 5 toolbar. Today,
    how do I actually render content as a Swiper slider with this project?
  criteria: The submodule's CKEditor button is not implemented yet, so use the parent swiper_formatter
    module's field formatters (swiper_formatter_image/entity/paragraphs/text) or the swiper_formatter
    Views style instead.
  bundle: swiper_formatter_ckeditor
  rubric_ref: rubric/swiper_formatter_ckeditor_sfck_where_slider_today@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: sfck-is-enabled
  input: On this Drupal site, is the CKEditor integration submodule of swiper_formatter (swiper_formatter_ckeditor)
    currently enabled? Inspect the running site and answer.
  criteria: Yes — swiper_formatter_ckeditor is currently enabled (present in core.extension / drush pm:list
    shows it enabled).
  bundle: swiper_formatter_ckeditor
  rubric_ref: rubric/swiper_formatter_ckeditor_sfck_is_enabled@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/swiper_formatter_ckeditor-enabled-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/swiper_formatter_ckeditor-enabled-cleanup.sh
- id: sfck-dependency-live
  input: The swiper_formatter_ckeditor module is enabled on this site. Inspect the running site and list
    the module dependency it declares.
  criteria: swiper_formatter_ckeditor declares a dependency on swiper_formatter (swiper_formatter:swiper_formatter).
  bundle: swiper_formatter_ckeditor
  rubric_ref: rubric/swiper_formatter_ckeditor_sfck_dependency_live@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/swiper_formatter_ckeditor-enabled-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/swiper_formatter_ckeditor-enabled-cleanup.sh
- id: sfck-enable
  input: On this Drupal site, enable the swiper_formatter_ckeditor submodule (the CKEditor integration
    for Swiper formatter). Apply the change to the live site.
  criteria: swiper_formatter_ckeditor is enabled (appears in core.extension; e.g. drush en swiper_formatter_ckeditor
    -y).
  bundle: swiper_formatter_ckeditor
  rubric_ref: rubric/swiper_formatter_ckeditor_sfck_enable@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/swiper_formatter_ckeditor-enable-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/swiper_formatter_ckeditor-enable-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/swiper_formatter_ckeditor-enable-verify.sh
- id: sfck-uninstall
  input: On this Drupal site the swiper_formatter_ckeditor submodule is currently enabled. Uninstall it
    (leave the parent swiper_formatter module untouched). Apply the change to the live site.
  criteria: swiper_formatter_ckeditor is no longer enabled (absent from core.extension; e.g. drush pmu
    swiper_formatter_ckeditor -y), while swiper_formatter remains enabled.
  bundle: swiper_formatter_ckeditor
  rubric_ref: rubric/swiper_formatter_ckeditor_sfck_uninstall@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/swiper_formatter_ckeditor-uninstall-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/swiper_formatter_ckeditor-uninstall-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/swiper_formatter_ckeditor-uninstall-verify.sh
