metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: field_group_table
  version: 1.0.x
  note: Field Group Table adds one Field Group formatter plugin id 'field_group_table' (label 'Table',
    supported_contexts form+view) that renders a group's fields as a 2-column label/value table. Requires
    the field_group module. It has no config entity/route/permissions/Drush of its own; the group is stored
    by field_group in the entity display config third_party_settings.field_group.<group_name> with format_type=field_group_table
    and a format_settings map (label_visibility[1 hidden/2 above/3 caption/4 below], desc, desc_visibility,
    first_column, second_column, empty_label_behavior[1 keep/2 merge], table_row_striping, always_show_field_label,
    always_show_field_value, empty_field_placeholder, hide_table_if_empty). It invites one hook, hook_field_group_table_rows_alter(&$element,&$children).
    Medium cases read a group's live config off node.article default view display; hard cases create/configure
    such a group verified against that display config.
questions:
- id: field_group_table-what-format
  input: What does the field_group_table module add to Drupal, what is the group format's plugin id, and
    how does it render the fields in a group?
  criteria: 'It adds a Field Group formatter with plugin id ''field_group_table'' (label ''Table'') that
    renders each field in the group as a row of a 2-column table: the field label in the left column and
    the rendered field value in the right. Requires the field_group module.'
  bundle: field_group_table
  rubric_ref: rubric/field_group_table_field_group_table_what_format@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: field_group_table-contexts
  input: Can the field_group_table 'Table' group format be used on entity edit forms, on view displays,
    or both?
  criteria: Both. The plugin declares supported_contexts = {form, view}, so you can pick 'Table' as a
    field group format on both Manage form display and Manage display.
  bundle: field_group_table
  rubric_ref: rubric/field_group_table_field_group_table_contexts@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: field_group_table-settings
  input: Name some of the format settings the field_group_table 'Table' group offers, e.g. how do I add
    column headers or show a row for a field that is empty?
  criteria: Settings include first_column/second_column (column header text), label_visibility (hidden/above/caption/below),
    empty_label_behavior (keep vs merge cells), table_row_striping, always_show_field_label, always_show_field_value
    plus empty_field_placeholder (force a row for an empty field), and hide_table_if_empty. To add column
    headers set first_column/second_column; to show empty fields enable always_show_field_value and set
    empty_field_placeholder.
  bundle: field_group_table
  rubric_ref: rubric/field_group_table_field_group_table_settings@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: field_group_table-live-format
  input: On this site the Article content type's default view display has a field group named 'group_fgt_known'.
    Inspect the display configuration and tell me which field group format (format_type) that group uses.
  criteria: It uses format_type 'field_group_table' (the Table format). Read core.entity_view_display.node.article.default
    third_party_settings.field_group.group_fgt_known.format_type.
  bundle: field_group_table
  rubric_ref: rubric/field_group_table_field_group_table_live_format@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/field_group_table-known-format-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/field_group_table-known-format-cleanup.sh
- id: field_group_table-live-header
  input: On this site, the Article default view display has a field_group_table group named 'group_fgt_hdr'.
    Inspect the live display config and tell me the text configured as its second column header.
  criteria: The second column header (format_settings.second_column) is 'Reading'. Read core.entity_view_display.node.article.default
    third_party_settings.field_group.group_fgt_hdr.format_settings.second_column.
  bundle: field_group_table
  rubric_ref: rubric/field_group_table_field_group_table_live_header@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/field_group_table-known-header-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/field_group_table-known-header-cleanup.sh
- id: field_group_table-create-group
  input: On this site, on the Article content type's default view display, add a Field Group named 'group_fgt_task'
    that uses the field_group_table 'Table' format. Apply the change to the live site.
  criteria: Add a field_group group 'group_fgt_task' with format_type 'field_group_table' to core.entity_view_display.node.article.default
    (third_party_settings.field_group.group_fgt_task), e.g. via the Manage display field-group UI or $display->setThirdPartySetting('field_group','group_fgt_task',[...'format_type'=>'field_group_table'...])->save().
  bundle: field_group_table
  rubric_ref: rubric/field_group_table_field_group_table_create_group@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/field_group_table-create-group-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/field_group_table-create-group-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/field_group_table-create-group-verify.sh
- id: field_group_table-configure-group
  input: On the Article default view display, add a field_group_table 'Table' field group named 'group_fgt_cfg'
    whose first column header is 'Field' and which has table row striping (zebra striping) enabled. Apply
    the change to the live site.
  criteria: Add group 'group_fgt_cfg' with format_type 'field_group_table' and format_settings first_column='Field',
    table_row_striping=true on core.entity_view_display.node.article.default (third_party_settings.field_group.group_fgt_cfg).
  bundle: field_group_table
  rubric_ref: rubric/field_group_table_field_group_table_configure_group@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/field_group_table-configure-group-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/field_group_table-configure-group-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/field_group_table-configure-group-verify.sh
