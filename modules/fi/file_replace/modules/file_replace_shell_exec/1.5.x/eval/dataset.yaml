questions:
- id: shell-exec-config-key
  input: Using the file_replace_shell_exec submodule, how do I make it run 'my-optimizer' after every
    file replacement? There is no settings form — give the drush command.
  criteria: 'Set the `command` key: drush config:set file_replace_shell_exec.settings command ''my-optimizer''
    (config object file_replace_shell_exec.settings, no admin form).'
  bundle: file_replace_shell_exec
  rubric_ref: rubric/file_replace_shell_exec_shell_exec_config_key@1.0
  tags:
  - mode:recipe
- id: shell-exec-when-runs
  input: When does file_replace_shell_exec run its configured command, and through which mechanism?
  criteria: It implements hook_file_replace() and runs the configured command via PHP shell_exec() after
    each file replacement; if the command config is empty it does nothing.
  bundle: file_replace_shell_exec
  rubric_ref: rubric/file_replace_shell_exec_shell_exec_when_runs@1.0
  tags:
  - mode:recipe
- id: shell-exec-logging
  input: Where does file_replace_shell_exec report the result of its command, and what is the difference
    between a command that returns output and one that returns nothing?
  criteria: 'It logs to the file_replace_shell_exec logger channel: info (with command and output) when
    the command returns output, and error (''could not be executed'') when it returns none.'
  bundle: file_replace_shell_exec
  rubric_ref: rubric/file_replace_shell_exec_shell_exec_logging@1.0
  tags:
  - mode:recipe
- id: shell-exec-security
  input: What is the security concern with the file_replace_shell_exec submodule?
  criteria: The command is run verbatim via shell_exec() on the server as the PHP/web user, effectively
    arbitrary command execution; only enable on trusted sites with tightly controlled config and a fixed,
    audited command.
  bundle: file_replace_shell_exec
  rubric_ref: rubric/file_replace_shell_exec_shell_exec_security@1.0
  tags:
  - mode:recipe
