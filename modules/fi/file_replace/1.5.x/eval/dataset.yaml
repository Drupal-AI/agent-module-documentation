metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: file_replace
  version: 1.5.x
  note: file_replace has no settings form or config objects, so its behavior is documented via response-graded
    `recipe` cases probing the replace route/permission, the same-URI guarantee, the invited hook, the
    extension constraint, the Views field, and the image-style flush.
questions:
- id: file-replace-keeps-uri
  input: What is the point of the File Replace module — what does it preserve when you swap a file's contents
    on a Drupal 11 site?
  criteria: It overwrites an existing managed file's contents with a new upload while keeping the file
    URI, filename, and file entity ID unchanged, so existing links, embeds, and references keep working.
  bundle: file_replace
  rubric_ref: rubric/file_replace_file_replace_keeps_uri@1.0
  tags:
  - mode:recipe
- id: file-replace-route-permission
  input: What is the URL/route to replace a file with File Replace, and which permission does a user need
    to reach it?
  criteria: Replace form at /admin/content/files/replace/{file} (route entity.file.replace_form), gated
    by the `replace files` permission.
  bundle: file_replace
  rubric_ref: rubric/file_replace_file_replace_route_permission@1.0
  tags:
  - mode:recipe
- id: file-replace-permanent-only
  input: A user has the 'replace files' permission but still cannot replace a particular file with File
    Replace. What extra condition must the file meet?
  criteria: The custom access check also requires the file to be permanent (isPermanent()); temporary/unmanaged
    files cannot be replaced even with the permission.
  bundle: file_replace
  rubric_ref: rubric/file_replace_file_replace_permanent_only@1.0
  tags:
  - mode:recipe
- id: file-replace-extension-constraint
  input: When replacing a file through File Replace's form, what constraint is enforced on the uploaded
    replacement file?
  criteria: The replacement upload is validated to have the same file extension as the original (FileExtension
    upload validator); the accept attribute also hints the original MIME type.
  bundle: file_replace
  rubric_ref: rubric/file_replace_file_replace_extension_constraint@1.0
  tags:
  - mode:recipe
- id: file-replace-hook
  input: In a Drupal module I want to run custom code (e.g. purge a CDN) every time a file is replaced
    via File Replace. Which hook do I implement? Name it and its argument.
  criteria: Implement hook_file_replace(\Drupal\file\FileInterface $file) — invoked after the file's contents
    are overwritten and the entity re-saved.
  bundle: file_replace
  rubric_ref: rubric/file_replace_file_replace_hook@1.0
  tags:
  - mode:recipe
- id: file-replace-views-field
  input: I built a View of files (file_managed) on my Drupal site. How do I add a link that lets editors
    replace each file using File Replace?
  criteria: Add the Views field 'Link to replace file' (id file_replace_link) to the View; it renders
    a link (default text 'replace') to the replace form.
  bundle: file_replace
  rubric_ref: rubric/file_replace_file_replace_views_field@1.0
  tags:
  - mode:recipe
- id: file-replace-image-flush
  input: After I replace an image with File Replace, do the existing image-style thumbnails update automatically,
    and why?
  criteria: Yes — the module's own hook_file_replace flushes all image-style derivatives for the file's
    URI (when the image module is enabled), so thumbnails regenerate from the new content.
  bundle: file_replace
  rubric_ref: rubric/file_replace_file_replace_image_flush@1.0
  tags:
  - mode:recipe
