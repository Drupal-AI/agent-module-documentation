metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: file_delete
  version: 3.0.x
  note: File Delete has no settings UI and no Drush commands; it overrides core's file delete form and
    ships two bulk action plugins plus two permissions. Cases are `recipe` (response-graded) probing documented
    facts an agent would otherwise read source to answer; no site mutation.
questions:
- id: file-delete-override-core-form
  input: How does the File Delete module take over file deletion on a Drupal 11 site — which hook and
    which form class does it use, and does it add its own route?
  criteria: It implements hook_entity_type_build() in FileDeleteHooks to call $entity_types['file']->setFormClass('delete',
    FileDeleteForm::class), reusing core's file delete route (entity.file.delete_form) — it adds no routing.yml.
  bundle: file_delete
  rubric_ref: rubric/file_delete_file_delete_override_core_form@1.0
  tags:
  - mode:recipe
- id: file-delete-default-behavior
  input: On a Drupal site with File Delete, what actually happens to a file when I delete it through the
    default form — is it removed from disk immediately?
  criteria: By default it flips the file from Permanent to Temporary (setTemporary() + save()); Drupal's
    file_cron() deletes temporary files on a later cron run (core default ~6 hours). It is not removed
    immediately unless immediate delete is used.
  bundle: file_delete
  rubric_ref: rubric/file_delete_file_delete_default_behavior@1.0
  tags:
  - mode:recipe
- id: file-delete-permissions
  input: What permission machine names does the File Delete module define, and what does each unlock?
  criteria: '''delete files immediately'' (delete now, skipping the temporary/cron step) and ''delete
    files override usage'' (delete even when the file has usage records). Both are restrict-access permissions.'
  bundle: file_delete
  rubric_ref: rubric/file_delete_file_delete_permissions@1.0
  tags:
  - mode:recipe
- id: file-delete-usage-safeguard
  input: Why does File Delete sometimes refuse to delete a file, and which service does it consult to
    decide?
  criteria: It calls the file.usage service (FileUsageInterface::listUsage()); if the file is registered
    as in use it refuses and links to the usages view, unless the user forces the delete with 'delete
    files override usage'.
  bundle: file_delete
  rubric_ref: rubric/file_delete_file_delete_usage_safeguard@1.0
  tags:
  - mode:recipe
- id: file-delete-bulk-actions
  input: Which bulk action plugin IDs does File Delete provide for deleting files from a Files view?
  criteria: 'Two file-type actions: file_delete_mark_temporary (Mark file for deletion, sets temporary)
    and file_delete_immediately (Immediately delete with usage checks).'
  bundle: file_delete
  rubric_ref: rubric/file_delete_file_delete_bulk_actions@1.0
  tags:
  - mode:recipe
- id: file-delete-immediate-record-removal
  input: How does File Delete's 'Immediately delete' action remove a managed file from both the filesystem
    and the database?
  criteria: ImmediateDeleteWithUsageChecks deletes the file from disk via file_system->delete($file->getFileUri())
    and then deletes the row from the file_managed table by fid.
  bundle: file_delete
  rubric_ref: rubric/file_delete_file_delete_immediate_record_removal@1.0
  tags:
  - mode:recipe
- id: file-delete-dependencies-and-drush
  input: What modules does File Delete depend on, and does it provide any Drush commands?
  criteria: It depends only on core file (drupal:file) and provides no Drush commands (no drush.services.yml
    / src/Drush).
  bundle: file_delete
  rubric_ref: rubric/file_delete_file_delete_dependencies_and_drush@1.0
  tags:
  - mode:recipe
