metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: file_download_link
  version: 2.0.x
  note: File Download Link is a single field formatter plugin, 'file_download_link', for file and image
    field types. It renders each file as a download link with settings link_text (default 'Download'),
    link_title, aria_label, new_tab (default TRUE), rel_attribute, force_download (default TRUE, adds
    the HTML5 download attribute), force_download_filename, custom_classes; schema field.formatter.settings.file_download_link.
    No configure route (configure=null), no permissions, no Drush. Token support activates when the token
    module is enabled. Configured on a field's Manage display, stored at core.entity_view_display.<entity>.<bundle>.<mode>
    content.<field>. Introspection reads a live display's formatter + link_text; execution switches a
    field's formatter to file_download_link and changes its link_text, verified against the live entity_view_display.
    All cases use a namespaced field (field_fdl_*) on the Article content type.
questions:
- id: file_download_link-what-formatter
  input: What does the file_download_link module provide, and which field types can it be used on?
  criteria: It provides a single field formatter, 'file_download_link' ('File Download Link'), usable
    on file and image field types, that renders each file as a configurable download link. Set it on a
    field's Manage display; there is no admin/config page.
  bundle: file_download_link
  rubric_ref: rubric/file_download_link_file_download_link_what_formatter@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: file_download_link-force-download
  input: How do I make the file_download_link formatter force the browser to download the file rather
    than open it, and what is the default link text?
  criteria: Enable the 'force_download' setting (default on), which adds the HTML5 download attribute
    to the link; optionally set force_download_filename for a specific filename. The default link text
    is 'Download' (empty falls back to the filename).
  bundle: file_download_link
  rubric_ref: rubric/file_download_link_file_download_link_force_download@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: file_download_link-token
  input: Can the file_download_link link text include dynamic values like the file size, and what does
    that require? Which settings does it apply to?
  criteria: Yes, when the Token module is enabled the link_text, link_title, aria_label, force_download_filename
    and custom_classes are passed through Token::replace() with the file and host entity as data (e.g.
    '[node:field:description] ([file:size])'); the field delta is inserted automatically for multi-value
    fields.
  bundle: file_download_link
  rubric_ref: rubric/file_download_link_file_download_link_token@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: file_download_link-current-linktext
  input: On this Drupal site, the Article content type has a file field displayed with the file_download_link
    formatter and a custom link text. Inspect the live default display and state the configured link text.
  criteria: The link_text is 'Grab It' (core.entity_view_display.node.article.default content.field_fdl_probe.settings.link_text).
  bundle: file_download_link
  rubric_ref: rubric/file_download_link_file_download_link_current_linktext@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/file_download_link-probe-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/file_download_link-probe-cleanup.sh
- id: file_download_link-which-formatter
  input: On this Drupal site, inspect the Article content type's default display for the file field named
    field_fdl_probe and state which field formatter renders it.
  criteria: field_fdl_probe is rendered with the file_download_link formatter (component type = file_download_link
    in core.entity_view_display.node.article.default).
  bundle: file_download_link
  rubric_ref: rubric/file_download_link_file_download_link_which_formatter@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/file_download_link-probe-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/file_download_link-probe-cleanup.sh
- id: file_download_link-set-formatter
  input: On this Drupal site, the Article content type has a file field 'field_fdl_task' currently shown
    with the default file formatter. Using the file_download_link module, change its default display so
    the field renders as a File Download Link. Apply the change to the live site.
  criteria: In core.entity_view_display.node.article.default the field_fdl_task component type is set
    to 'file_download_link' (via Manage display, or setComponent on the entity_view_display).
  bundle: file_download_link
  rubric_ref: rubric/file_download_link_file_download_link_set_formatter@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/file_download_link-formatter-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/file_download_link-formatter-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/file_download_link-formatter-verify.sh
- id: file_download_link-set-linktext
  input: On this Drupal site, the Article field 'field_fdl_link' is already displayed with the File Download
    Link formatter. Change its link text to 'Download PDF' and apply the change to the live site.
  criteria: The field_fdl_link component keeps type file_download_link and its settings.link_text is set
    to 'Download PDF' in core.entity_view_display.node.article.default.
  bundle: file_download_link
  rubric_ref: rubric/file_download_link_file_download_link_set_linktext@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/file_download_link-linktext-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/file_download_link-linktext-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/file_download_link-linktext-verify.sh
