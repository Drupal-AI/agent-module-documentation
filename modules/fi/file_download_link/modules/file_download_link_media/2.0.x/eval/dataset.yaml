metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: file_download_link_media
  version: 2.0.x
  note: File Download Link Media is a submodule of file_download_link. It provides one field formatter,
    'file_download_link_media', for entity_reference field types whose target_type is media (isApplicable
    also requires the media types' source fields to be file/image). It renders each referenced media by
    viewing the media's source field through the parent 'file_download_link' formatter, so its settings
    (link_text default 'Download', link_title, aria_label, new_tab, rel_attribute, force_download, force_download_filename,
    custom_classes; schema field.formatter.settings.file_download_link_media) mirror the parent. No configure
    route, permissions, or Drush. Requires media + file_download_link. Introspection reads a live media-reference
    display's formatter + link_text; execution switches a media reference field's formatter to file_download_link_media
    and changes its link_text, verified against the live entity_view_display. Cases use a namespaced media
    reference field (field_fdlm_*) on Article.
questions:
- id: file_download_link_media-what
  input: What does the file_download_link_media submodule add, and which kind of field is it for?
  criteria: It adds a field formatter, 'file_download_link_media', for entity_reference fields that target
    Media, rendering the referenced media as a download link to its source file/image.
  bundle: file_download_link_media
  rubric_ref: rubric/file_download_link_media_file_download_link_media_what@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: file_download_link_media-applicability
  input: When is the file_download_link_media formatter available to choose in Manage display?
  criteria: isApplicable() offers it only when the reference field's target_type is 'media' and the referenced
    media types have source fields of type file and/or image.
  bundle: file_download_link_media
  rubric_ref: rubric/file_download_link_media_file_download_link_media_applicability@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: file_download_link_media-delegation
  input: How does file_download_link_media actually render the download link, and which module does it
    rely on?
  criteria: It loads each referenced media, finds its source field, and renders that field through the
    parent file_download_link formatter (->view(['type' => 'file_download_link', 'label' => 'hidden',
    'settings' => $this->getSettings()])). It requires the media and file_download_link modules; settings
    mirror the parent.
  bundle: file_download_link_media
  rubric_ref: rubric/file_download_link_media_file_download_link_media_delegation@1.0
  tags:
  - mode:recipe
  - difficulty:easy
