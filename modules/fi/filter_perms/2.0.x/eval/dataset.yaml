metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: filter_perms
  version: 2.0.x
  note: filter_perms overrides the form on user.admin_permissions (and entity.user_role.edit_permissions_form)
    via a RouteSubscriber, replacing it with PermissionsForm which adds Roles/Modules filters to the permissions
    grid. The only persistent state the module owns is the per-user filter selection, stored in the expirable
    key/value collection 'filter_perms_list' (key = user id, TTL 3600) as ['roles'=>[...],'modules'=>[...]];
    ALL_OPTIONS='-1' means all. It defines no permissions of its own (reuses core 'administer permissions'),
    no settings form/configure route/config schema/Drush. Introspection and execution cases are grounded
    in that real key/value collection; execution also creates/removes a namespaced role. No node operations
    (safe on this shared site).
questions:
- id: filter_perms-what
  input: What does the Drupal filter_perms (Filter Permissions) module add to the user permissions page,
    and why is it useful on large sites?
  criteria: It adds 'Roles to display' and 'Modules to display' filters to the permissions page so you
    can narrow the grid to selected roles and modules. This is especially useful on sites with many permissions
    because it helps stay under PHP's max_input_vars limit when saving.
  bundle: filter_perms
  rubric_ref: rubric/filter_perms_filter_perms_what@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: filter_perms-how-override
  input: How does filter_perms add its filtering to Drupal's existing permissions page — what mechanism
    and which route does it change?
  criteria: A RouteSubscriber (alterRoutes) swaps the _form on the user.admin_permissions route to Drupal\filter_perms\Form\PermissionsForm
    (and entity.user_role.edit_permissions_form to PermissionsRoleSpecificForm). PermissionsForm extends
    core UserPermissionsForm and adds the role/module filters.
  bundle: filter_perms
  rubric_ref: rubric/filter_perms_filter_perms_how_override@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: filter_perms-storage
  input: Where does filter_perms remember which roles and modules an admin has chosen to display on the
    permissions page, and for how long?
  criteria: 'In an expirable key/value store: collection ''filter_perms_list'', keyed by the user id,
    storing [''roles''=>[...],''modules''=>[...]] with a 1-hour (3600s) expiry. ALL_OPTIONS (''-1'') means
    all roles / all modules.'
  bundle: filter_perms
  rubric_ref: rubric/filter_perms_filter_perms_storage@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: filter_perms-known-filter
  input: On this Drupal site, user 1 has an active filter_perms selection on the permissions page. Inspect
    the live site and state which module's permissions are currently included by that filter.
  criteria: The filter_perms_list expirable key/value entry for user id 1 is ['roles'=>['fperm_editor'],'modules'=>['node']],
    so the filter includes the 'node' module.
  bundle: filter_perms
  rubric_ref: rubric/filter_perms_filter_perms_known_filter@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/filter_perms-known-filter-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/filter_perms-known-filter-cleanup.sh
- id: filter_perms-known-modules
  input: On this Drupal site, user 1's saved filter_perms selection includes two modules. Inspect the
