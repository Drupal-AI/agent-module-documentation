metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: fixed_block_content
  version: 1.4.x
  note: Fixed Block Content provides a fixed_block_content config entity (keys id, title, block_content_bundle,
    default_content, auto_export, protected) that wraps a custom block_content so a placement never breaks.
    A derived block plugin fixed_block_content:<id> is placeable. Configure route entity.fixed_block_content.collection
    (/admin/structure/block-content/fixed-block-content), gated by core permission 'administer block types';
    depends on block_content + hal; no own permissions, Drush, or plugin types. Medium/hard cases are
    grounded in real fixed_block_content config entities (fbc_known/fbc_prot/fbc_task/fbc_ptask) targeting
    the existing 'basic' block_content bundle, created and torn down by the scripts (cleanup also deletes
    any block_content the entity lazily created).
questions:
- id: fixed_block_content-problem
  input: What problem does the Drupal fixed_block_content module solve, and how does it stop a placed
    custom block from showing 'This block is broken or missing'?
  criteria: It wraps a custom (block_content) block in a fixed_block_content configuration entity referenced
    by a stable machine name, so the placement is config (deployed with the site) and always resolves;
    if the underlying custom block is missing/deleted it recreates an empty one on demand instead of rendering
    a broken block.
  bundle: fixed_block_content
  rubric_ref: rubric/fixed_block_content_fixed_block_content_problem@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: fixed_block_content-where-managed
  input: On a Drupal site with fixed_block_content enabled, where do I create and manage fixed blocks,
    what config entity type is used, and what permission is required?
  criteria: Manage them at Structure -> Block content -> Fixed block content (/admin/structure/block-content/fixed-block-content,
    route entity.fixed_block_content.collection). They are 'fixed_block_content' config entities. Access
    requires the core 'administer block types' permission.
  bundle: fixed_block_content
  rubric_ref: rubric/fixed_block_content_fixed_block_content_where_managed@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: fixed_block_content-block-plugin
  input: After I create a fixed block with fixed_block_content, what block plugin do I place in Block
    layout, and under which block category does it appear?
  criteria: A derived block plugin with id fixed_block_content:<fixed_block_id> is created for each fixed
    block and appears under the 'Fixed custom' category in Block layout; you can also choose the view
    mode it renders the custom block in.
  bundle: fixed_block_content
  rubric_ref: rubric/fixed_block_content_fixed_block_content_block_plugin@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: fixed_block_content-known-block
  input: This Drupal site has a fixed_block_content entity titled 'Known Footer Block'. Inspect the live
    configuration and tell me which custom block type (block_content bundle) it wraps.
  criteria: 'It wraps the ''basic'' custom block type: fixed_block_content.fixed_block_content.fbc_known
    has block_content_bundle: basic.'
  bundle: fixed_block_content
  rubric_ref: rubric/fixed_block_content_fixed_block_content_known_block@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/fixed_block_content-known-block-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/fixed_block_content-known-block-cleanup.sh
- id: fixed_block_content-protected
  input: 'On this Drupal site there is a fixed_block_content entity with machine id ''fbc_prot''. Inspect
    its live configuration: is its custom block protected (marked non-reusable) or not?'
  criteria: 'Yes, it is protected: fixed_block_content.fixed_block_content.fbc_prot has protected: true,
    so its custom block is marked non-reusable.'
