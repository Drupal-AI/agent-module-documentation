rubrics:
- id: fixed_block_content_fixed_block_content_problem
  version: '1.0'
  applicable_bundles:
  - fixed_block_content
  checks:
  - kind: must_contain_any
    values:
    - config
    - configuration
    - broken
    - staging
    - wrapper
    - recreate
  scoring:
    combine: all_pass
- id: fixed_block_content_fixed_block_content_where_managed
  version: '1.0'
  applicable_bundles:
  - fixed_block_content
  checks:
  - kind: must_contain_any
    values:
    - fixed-block-content
    - entity.fixed_block_content.collection
    - administer block types
    - Block content
    - fixed_block_content
  scoring:
    combine: all_pass
- id: fixed_block_content_fixed_block_content_block_plugin
  version: '1.0'
  applicable_bundles:
  - fixed_block_content
  checks:
  - kind: must_contain_any
    values:
    - 'fixed_block_content:'
    - Fixed custom
    - derived
    - deriver
  scoring:
    combine: all_pass
- id: fixed_block_content_fixed_block_content_known_block
  version: '1.0'
  applicable_bundles:
  - fixed_block_content
  checks:
  - kind: must_contain_any
    values:
    - basic
  scoring:
    combine: all_pass
- id: fixed_block_content_fixed_block_content_protected
  version: '1.0'
  applicable_bundles:
  - fixed_block_content
  checks:
  - kind: must_contain_any
    values:
    - 'true'
    - 'yes'
    - protected
    - non-reusable
    - '1'
  scoring:
    combine: all_pass
- id: fixed_block_content_fixed_block_content_create
  version: '1.0'
  applicable_bundles:
  - fixed_block_content
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
- id: fixed_block_content_fixed_block_content_protect
  version: '1.0'
  applicable_bundles:
  - fixed_block_content
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
