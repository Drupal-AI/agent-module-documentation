rubrics:
- id: file_upload_secure_validator_fusv_purpose
  version: '1.0'
  applicable_bundles:
  - file_upload_secure_validator
  checks:
  - kind: must_contain_any
    values:
    - fileinfo
    - content
    - extension
  - kind: must_not_contain
    values:
    - antivirus
    - ClamAV
  scoring:
    combine: all_pass
- id: file_upload_secure_validator_fusv_how_hooked
  version: '1.0'
  applicable_bundles:
  - file_upload_secure_validator
  checks:
  - kind: must_contain_any
    values:
    - FileValidationEvent
    - event subscriber
    - automatically
  - kind: must_not_contain
    values:
    - per-field
    - per field configuration required
  scoring:
    combine: all_pass
- id: file_upload_secure_validator_fusv_config_object
  version: '1.0'
  applicable_bundles:
  - file_upload_secure_validator
  checks:
  - kind: must_contain_any
    values:
    - file_upload_secure_validator.settings
    - mime_types_equivalence_groups
    - /admin/config/media/file_upload_secure_validator
  scoring:
    combine: all_pass
- id: file_upload_secure_validator_fusv_permission
  version: '1.0'
  applicable_bundles:
  - file_upload_secure_validator
  checks:
  - kind: must_contain_any
    values:
    - administer file upload secure validator configuration
  - kind: must_not_contain
    values:
    - administer files
  scoring:
    combine: all_pass
- id: file_upload_secure_validator_fusv_fileinfo_required
  version: '1.0'
  applicable_bundles:
  - file_upload_secure_validator
  checks:
  - kind: must_contain_any
    values:
    - fileinfo
    - not registered
    - service provider
    - hook_requirements
  scoring:
    combine: all_pass
- id: file_upload_secure_validator_fusv_service_api
  version: '1.0'
  applicable_bundles:
  - file_upload_secure_validator
  checks:
  - kind: must_contain_any
    values:
    - file_upload_secure_validator
    - validate
    - ->validate(
  scoring:
    combine: all_pass
- id: file_upload_secure_validator_fusv_no_plugins
  version: '1.0'
  applicable_bundles:
  - file_upload_secure_validator
  checks:
  - kind: must_contain_any
    values:
    - 'no'
    - none
    - does not
  - kind: must_not_contain
    values:
    - drush command provided
    - plugin type provided
  scoring:
    combine: all_pass
