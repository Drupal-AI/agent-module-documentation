metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: file_upload_secure_validator
  version: 2.2.x
  note: File Upload Secure Validator subscribes to core's FileValidationEvent to compare a file's fileinfo-sniffed
    MIME type against its extension's MIME type, rejecting disguised uploads unless both types share a
    configured equivalence group. Cases are `recipe` (response-graded); they probe documented facts an
    agent would otherwise read source to answer. No site mutation.
questions:
- id: fusv-purpose
  input: On a Drupal 11 site, what does the file_upload_secure_validator module protect against, and what
    PHP feature does it use to do it?
  criteria: It blocks uploads whose real byte content does not match the MIME type implied by the file
    extension (falsified-extension / disguised-file attacks), using PHP's fileinfo extension (Symfony
    FileinfoMimeTypeGuesser) to sniff the actual MIME type.
  bundle: file_upload_secure_validator
  rubric_ref: rubric/file_upload_secure_validator_fusv_purpose@1.0
  tags:
  - mode:recipe
- id: fusv-how-hooked
  input: How does file_upload_secure_validator get invoked on uploads — do I have to enable it on each
    file field?
  criteria: No per-field setup. It registers an event subscriber (FileValidationSubscriber) on core's
    FileValidationEvent, so every file going through Drupal's file validation pipeline is checked automatically.
  bundle: file_upload_secure_validator
  rubric_ref: rubric/file_upload_secure_validator_fusv_how_hooked@1.0
  tags:
  - mode:recipe
- id: fusv-config-object
  input: A legitimate CSV file is being rejected by file_upload_secure_validator. Which config object
    and key do I edit to whitelist the MIME type combination, and where is the admin form?
  criteria: Add both detected MIME types to the same equivalence group. They are stored in the mime_types_equivalence_groups
    key of the file_upload_secure_validator.settings config object, edited on the settings form at /admin/config/media/file_upload_secure_validator
    (route file_upload_secure_validator.file-upload-secure-validator-settings).
  bundle: file_upload_secure_validator
  rubric_ref: rubric/file_upload_secure_validator_fusv_config_object@1.0
  tags:
  - mode:recipe
- id: fusv-permission
  input: What permission is required to manage the MIME type equivalence groups in file_upload_secure_validator?
  criteria: 'The ''administer file upload secure validator configuration'' permission (restrict access:
    TRUE) gates the settings form. Upload-time validation itself is not permission-gated.'
  bundle: file_upload_secure_validator
  rubric_ref: rubric/file_upload_secure_validator_fusv_permission@1.0
  tags:
  - mode:recipe
- id: fusv-fileinfo-required
  input: What happens with file_upload_secure_validator on a server that does not have the PHP fileinfo
    extension?
  criteria: The validator service is not registered (FileUploadSecureValidatorServiceProvider removes
    it when fileinfo is unsupported), so validation does not run, and hook_requirements reports the missing
    extension as an error on the Status Report.
  bundle: file_upload_secure_validator
  rubric_ref: rubric/file_upload_secure_validator_fusv_fileinfo_required@1.0
  tags:
  - mode:recipe
- id: fusv-service-api
  input: How can I run file_upload_secure_validator's content check on a File entity from custom PHP code,
    and what does it return?
  criteria: Call \Drupal::service('file_upload_secure_validator')->validate($file); it returns an array
    of TranslatableMarkup error messages (empty array means the file passed).
  bundle: file_upload_secure_validator
  rubric_ref: rubric/file_upload_secure_validator_fusv_service_api@1.0
  tags:
  - mode:recipe
- id: fusv-no-plugins
  input: Does file_upload_secure_validator provide any Drush commands, plugin types, or hooks for other
    modules to implement?
  criteria: No. It provides no Drush commands, no plugin types, and no .api.php hooks; it is a single
    event subscriber plus a validator service and a settings form.
  bundle: file_upload_secure_validator
  rubric_ref: rubric/file_upload_secure_validator_fusv_no_plugins@1.0
  tags:
  - mode:recipe
