metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: field_timer
  version: 2.0.x
  note: 'Field Timer provides four @FieldFormatter plugins for the core datetime field type: field_timer_simple_text
    (Text timer or countdown; extends DateTimeTimeAgoFormatter; NO external library; setting type=auto|timer|countdown),
    field_timer_countdown (jQuery Countdown) and field_timer_countdown_led (jQuery Countdown LED) (both
    need the jQuery Countdown JS lib at libraries/jquery.countdown), and field_timer_county (County; needs
    County lib at libraries/county). Formatters are configured per field per view mode and stored in core.entity_view_display.<entity>.<bundle>.<mode>
    -> content.<field>.type + settings. No settings form/route. Medium cases create a datetime field on
    Article, apply a known formatter+setting to the default view display and read it back via drush cget;
    hard cases have the agent set a formatter on the view display, verified against the live entity_view_display
    component. Fixtures use field_ft_* on node.article and are removed on cleanup/reset.'
questions:
- id: field_timer-formatter-ids
  input: Which field formatters does the Drupal field_timer module provide, and what core field type do
    they apply to?
  criteria: 'Four formatters, all for the core datetime field type: field_timer_simple_text (Text timer
    or countdown), field_timer_countdown (jQuery Countdown), field_timer_countdown_led (jQuery Countdown
    LED), and field_timer_county (County).'
  bundle: field_timer
  rubric_ref: rubric/field_timer_field_timer_formatter_ids@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: field_timer-simple-text-type
  input: In field_timer's 'Text timer or countdown' (field_timer_simple_text) formatter, what does its
    'type' setting control and what are the allowed values? Does it need an external JS library?
  criteria: 'The ''type'' setting is auto (default), timer, or countdown: timer only renders past dates,
    countdown only renders future dates, auto renders both. It extends core DateTimeTimeAgoFormatter and
    needs no external JS library.'
  bundle: field_timer
  rubric_ref: rubric/field_timer_field_timer_simple_text_type@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: field_timer-js-libraries
  input: The field_timer 'jQuery Countdown' and 'County' formatters need external JavaScript libraries
    to animate. Which libraries are they, and where must they be placed?
  criteria: jQuery Countdown (v2.1.0) at libraries/jquery.countdown (used by field_timer_countdown and
    field_timer_countdown_led) and County at libraries/county (used by field_timer_county). The text formatter
    needs no library.
  bundle: field_timer
  rubric_ref: rubric/field_timer_field_timer_js_libraries@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: field_timer-known-formatter
  input: On this site the Article content type has a datetime field 'field_ft_known' whose default view
    display uses a Field Timer formatter. Inspect the live view display and report which field_timer formatter
    id is applied to it.
  criteria: 'field_timer_simple_text. In core.entity_view_display.node.article.default the field_ft_known
    component has type: field_timer_simple_text.'
  bundle: field_timer
  rubric_ref: rubric/field_timer_field_timer_known_formatter@1.0
  tags:
  - mode:introspection
  - difficulty:medium
