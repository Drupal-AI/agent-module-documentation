rubrics:
- id: field_label_field_label_override_where
  version: '1.0'
  applicable_bundles:
  - field_label
  checks:
  - kind: must_contain_any
    values:
    - Manage display
    - third_party_settings
    - field_label
    - entity_view_display
    - label_value
  scoring:
    combine: all_pass
- id: field_label_field_label_permissions
  version: '1.0'
  applicable_bundles:
  - field_label
  checks:
  - kind: must_contain_any
    values:
    - edit_field_label_value
    - edit_field_label_tag
    - edit_field_label_class
    - edit_field_plural_label
    - _enabled
  scoring:
    combine: all_pass
- id: field_label_field_label_theming_tag
  version: '1.0'
  applicable_bundles:
  - field_label
  checks:
  - kind: must_contain_any
    values:
    - label_tag
    - field.html.twig
    - default('div')
    - template
  scoring:
    combine: all_pass
- id: field_label_field_label_setting_value
  version: '1.0'
  applicable_bundles:
  - field_label
  checks:
  - kind: must_contain_any
    values:
    - .fl-primary
    - fl-primary
    - Primary label
  scoring:
    combine: all_pass
- id: field_label_field_label_known_override
  version: '1.0'
  applicable_bundles:
  - field_label
  checks:
  - kind: must_contain_any
    values:
    - FL Known Label
  scoring:
    combine: all_pass
- id: field_label_field_label_set_override
  version: '1.0'
  applicable_bundles:
  - field_label
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
- id: field_label_field_label_set_tag
  version: '1.0'
  applicable_bundles:
  - field_label
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
