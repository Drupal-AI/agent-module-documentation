rubrics:
- id: file_to_media_file_to_media_how_to_convert
  version: '1.0'
  applicable_bundles:
  - file_to_media
  checks:
  - kind: must_contain_any
    values:
    - view
    - Views
    - dropbutton
    - file_to_media
    - /file/to-media
    - file_managed
  scoring:
    combine: all_pass
- id: file_to_media_file_to_media_when_link_shows
  version: '1.0'
  applicable_bundles:
  - file_to_media
  checks:
  - kind: must_contain_any
    values:
    - public
    - private
    - usage
    - already used
    - extension
    - source field
  scoring:
    combine: all_pass
- id: file_to_media_file_to_media_route_permission
  version: '1.0'
  applicable_bundles:
  - file_to_media
  checks:
  - kind: must_contain_any
    values:
    - file_to_media.add_form
    - /file/to-media
    - access files overview
  scoring:
    combine: all_pass
- id: file_to_media_file_to_media_known_view
  version: '1.0'
  applicable_bundles:
  - file_to_media
  checks:
  - kind: must_contain_any
    values:
    - ftm_known_view
  scoring:
    combine: all_pass
- id: file_to_media_file_to_media_field_details
  version: '1.0'
  applicable_bundles:
  - file_to_media
  checks:
  - kind: must_contain_any
    values:
    - file_to_media
    - /ftm-second
    - ftm-second
  scoring:
    combine: all_pass
- id: file_to_media_file_to_media_build_view
  version: '1.0'
  applicable_bundles:
  - file_to_media
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
- id: file_to_media_file_to_media_add_field_existing
  version: '1.0'
  applicable_bundles:
  - file_to_media
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
