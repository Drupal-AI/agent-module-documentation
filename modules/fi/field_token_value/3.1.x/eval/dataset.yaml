    cleanup: agent-module-documentation/evaluation/verify/field_token_value-build-reset.sh
    verify: agent-module-documentation/evaluation/verify/field_token_value-build-verify.sh
- id: field_token_value-presave-populates
  input: This site already has an Article field that automatically fills itself from the article's title
    (field field_ftv_auto, token 'FTV:[node:title]'). Create a new Article whose title is exactly 'FTVNODE-alpha',
    so the automatic field gets populated. Save it on the live site.
  criteria: After saving an Article titled 'FTVNODE-alpha', the field_token_value presave populates field_ftv_auto
    with 'FTV:FTVNODE-alpha' (the token [node:title] resolved against the new node).
  bundle: field_token_value
