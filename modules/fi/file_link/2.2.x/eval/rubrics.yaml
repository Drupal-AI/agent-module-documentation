rubrics:
- id: file_link_file_link_what_it_stores
  version: '1.0'
  applicable_bundles:
  - file_link
  checks:
  - kind: must_contain_any
    values:
    - size
    - mime
    - MIME
    - format
    - metadata
  scoring:
    combine: all_pass
- id: file_link_file_link_restrict_extensions
  version: '1.0'
  applicable_bundles:
  - file_link
  checks:
  - kind: must_contain_any
    values:
    - file_extensions
    - allowed
    - extension
  scoring:
    combine: all_pass
- id: file_link_file_link_bulk_import
  version: '1.0'
  applicable_bundles:
  - file_link
  checks:
  - kind: must_contain_any
    values:
    - deferred_request
    - disable_http_requests
    - cron
    - queue
  scoring:
    combine: all_pass
- id: file_link_file_link_known_extensions
  version: '1.0'
  applicable_bundles:
  - file_link
  checks:
  - kind: must_contain_any
    values:
    - epub
    - pdf
  scoring:
    combine: all_pass
- id: file_link_file_link_known_deferred
  version: '1.0'
  applicable_bundles:
  - file_link
  checks:
  - kind: must_contain_any
    values:
    - defer
    - deferred
    - cron
    - deferred_request
  scoring:
    combine: all_pass
- id: file_link_file_link_add_field
  version: '1.0'
  applicable_bundles:
  - file_link
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
- id: file_link_file_link_allow_pdf
  version: '1.0'
  applicable_bundles:
  - file_link
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
