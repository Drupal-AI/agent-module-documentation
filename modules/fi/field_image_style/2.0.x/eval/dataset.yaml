metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: field_image_style
  version: 2.0.x
  note: Field Image Style defines an image_style field type (Options ListItemBase; value = an image-style
    machine name; cardinality forced to 1; storage settings allowed_values + sort; widgets options_select/options_buttons;
    list formatters list_default/list_key) plus a display formatter image_style_image_formatter on core
    image fields whose field_image_style setting names an image_style field to read the style from. No
    configure route (configure=null), no permissions, no Drush, no plugin types. Medium cases read back
    real field-storage settings and a real display component; hard cases create the field and wire the
    formatter, verified against live field config and entity_view_display.
questions:
- id: field_image_style-what-field-type
  input: In the Drupal contrib module field_image_style, what field type does it add, what does a stored
    value represent, and where do the selectable options come from?
  criteria: It adds a field type with plugin id 'image_style' (class ImageStyleItem, extending the Options
    ListItemBase). Each value stores the machine name of an image style; the selectable options are the
    site's configured image styles (image_style_options()). Cardinality is forced to 1; default widget
    options_select, default formatter list_default.
  bundle: field_image_style
  rubric_ref: rubric/field_image_style_field_image_style_what_field_type@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: field_image_style-render-with-chosen-style
  input: Using field_image_style, how do I make an image field render with an image style that the editor
    chose in another field on the same node? Name the formatter and the setting that points at the style
    field.
  criteria: Put an image_style field on the bundle, then set the image field's formatter to image_style_image_formatter
    ('Field Image Style formatter'). Its field_image_style setting names the image_style field to read;
    at render time the formatter applies that stored style (falling back to the original image when empty).
  bundle: field_image_style
  rubric_ref: rubric/field_image_style_field_image_style_render_with_chosen_style@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: field_image_style-restrict-styles
  input: How do I limit which image styles an editor can choose in a field_image_style field, and what
    happens if I leave that restriction empty?
  criteria: Set the field storage setting allowed_values (the 'Allowed image styles' checkboxes) to the
    subset of image-style machine names you want. Leaving it empty allows all configured image styles.
    The 'sort' storage setting sorts the options by label.
  bundle: field_image_style
  rubric_ref: rubric/field_image_style_field_image_style_restrict_styles@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: field_image_style-known-field
  input: On this Drupal site, the Article content type has an image_style field named field_fis_known
    whose allowed image styles have been restricted. Inspect the live field storage and list which image
    styles are selectable in that field.
  criteria: The field storage field_fis_known has allowed_values restricted to the 'medium' and 'wide'
    image styles (with sort enabled), so only those two styles are selectable.
  bundle: field_image_style
  rubric_ref: rubric/field_image_style_field_image_style_known_field@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/field_image_style-known-field-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/field_image_style-known-field-cleanup.sh
- id: field_image_style-formatter-source
  input: On this site the Article default view display renders the image field field_fis_img with Field
    Image Style. Inspect the live display configuration and state which formatter it uses and which field
    supplies the image style.
  criteria: In core.entity_view_display.node.article.default the field_fis_img component uses the image_style_image_formatter
    formatter with settings.field_image_style = field_fis_disp, so the style comes from the field_fis_disp
    image_style field.
  bundle: field_image_style
  rubric_ref: rubric/field_image_style_field_image_style_formatter_source@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/field_image_style-formatter-source-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/field_image_style-formatter-source-cleanup.sh
- id: field_image_style-add-field
  input: On this Drupal site, add a Field Image Style field with machine name field_fis_task to the Article
    content type (entity type node), so editors can pick an image style per article. Apply the change
    to the live site.
  criteria: Create a FieldStorageConfig for node named field_fis_task with type 'image_style' (cardinality
    1), then a FieldConfig instance on the article bundle. The default widget is options_select.
  bundle: field_image_style
  rubric_ref: rubric/field_image_style_field_image_style_add_field@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/field_image_style-add-field-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/field_image_style-add-field-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/field_image_style-add-field-verify.sh
- id: field_image_style-wire-formatter
  input: On this site the Article content type has an image field field_fis_wimg and a Field Image Style
    field field_fis_wsrc, but the image currently renders with the plain core image formatter. Reconfigure
    the default view display so field_fis_wimg is rendered by the Field Image Style formatter, taking
