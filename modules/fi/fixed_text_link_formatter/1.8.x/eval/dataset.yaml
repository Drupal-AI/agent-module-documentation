- id: fixed_text_link_formatter-apply-link
  input: On this Drupal site, the Article content type has a link field 'field_ftlf_task' currently shown
    with the core Link formatter on the default view display. Using the fixed_text_link_formatter module,
    change its display formatter to the fixed-text link formatter and give it a fixed link text (for example
    'Read more'). Apply the change to the live site.
  criteria: Set the field_ftlf_task component on core.entity_view_display.node.article.default to type
