metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: fixed_text_link_formatter
  version: 1.8.x
  note: 'Fixed Text Link Formatter provides exactly two field formatter plugins and nothing else (no settings
    form, no configure route, no permissions, no services, no Drush). fixed_text_link (label ''Link with
    fixed text'') formats core link fields and extends LinkFormatter; fixed_text_file_url (label ''Link
    with a fixed text'') formats file fields. All persistent state is a per-field formatter component
    in core.entity_view_display.<entity>.<bundle>.<view_mode>: content.<field>.type = fixed_text_link|fixed_text_file_url
    plus settings.link_text (required) / link_class / allow_override (link) / open_in_new_window (file).
    Medium cases read back the configured link_text of a seeded link field and file field; hard cases
    switch a field''s display formatter to the fixed-text formatter with a fixed link_text, verified against
    the live entity_view_display.'
questions:
- id: fixed_text_link_formatter-which-formatter
  input: I have a link field on my Drupal Article content type and I want every link to always display
    the same text like 'Visit our website' regardless of the URL. Which formatter from the fixed_text_link_formatter
    module do I use, and what is the key setting?
  criteria: On the field's Manage display, choose the 'Link with fixed text' formatter (id fixed_text_link)
    and set its 'Link text' (link_text) setting to 'Visit our website'. It is stored on the entity_view_display
    component.
  bundle: fixed_text_link_formatter
  rubric_ref: rubric/fixed_text_link_formatter_fixed_text_link_formatter_which_formatter@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: fixed_text_link_formatter-field-types
  input: Which field types can the fixed_text_link_formatter module's formatters be applied to, and what
    are the two formatter plugin ids?
  criteria: fixed_text_link applies to core 'link' fields; fixed_text_file_url applies to 'file' fields.
    Those are the two formatters the module provides.
  bundle: fixed_text_link_formatter
  rubric_ref: rubric/fixed_text_link_formatter_fixed_text_link_formatter_field_types@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: fixed_text_link_formatter-allow-override
  input: In the fixed_text_link_formatter 'Link with fixed text' formatter, what does the 'Allow override'
    (allow_override) setting do?
  criteria: When allow_override is enabled, the configured fixed link text is only applied to link items
    that have no title of their own; a per-item title is kept. When disabled, the fixed text always replaces
    the item title.
  bundle: fixed_text_link_formatter
  rubric_ref: rubric/fixed_text_link_formatter_fixed_text_link_formatter_allow_override@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: fixed_text_link_formatter-inspect-link-text
  input: On this site, the Article content type has a link field 'field_ftlf_link' displayed with the
    fixed_text_link_formatter. Inspect the live default view display and tell me the exact fixed link
    text it is configured to show.
  criteria: In core.entity_view_display.node.article.default the field_ftlf_link component uses type fixed_text_link
    with settings.link_text = 'Visit Our Partner'.
  bundle: fixed_text_link_formatter
  rubric_ref: rubric/fixed_text_link_formatter_fixed_text_link_formatter_inspect_link_text@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/fixed_text_link_formatter-known-link-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/fixed_text_link_formatter-known-link-cleanup.sh
- id: fixed_text_link_formatter-inspect-file-text
  input: This site's Article content type has a file field 'field_ftlf_file' formatted with the fixed_text_file_url
    formatter. Read the live default display configuration and state the fixed link text used for the
    file link.
  criteria: In core.entity_view_display.node.article.default the field_ftlf_file component uses type fixed_text_file_url
    with settings.link_text = 'Download the Report'.
  bundle: fixed_text_link_formatter
  rubric_ref: rubric/fixed_text_link_formatter_fixed_text_link_formatter_inspect_file_text@1.0
  tags:
