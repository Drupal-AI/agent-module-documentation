rubrics:
- id: file_rename_file_rename_permission_and_global_key
  version: '1.0'
  applicable_bundles:
  - file_rename
  checks:
  - kind: must_contain_any
    values:
    - rename files
    - always_show_widget_link
    - file_rename.settings
  scoring:
    combine: all_pass
- id: file_rename_file_rename_per_widget_storage
  version: '1.0'
  applicable_bundles:
  - file_rename
  checks:
  - kind: must_contain_any
    values:
    - show_rename_link
    - third_party_settings
    - Manage form display
    - form display
    - entity_form_display
  scoring:
    combine: all_pass
- id: file_rename_file_rename_route_and_hooks
  version: '1.0'
  applicable_bundles:
  - file_rename
  checks:
  - kind: must_contain_any
    values:
    - entity.file.rename_form
    - rename_form
    - file_prerename
    - hook_file_prerename
  scoring:
    combine: all_pass
- id: file_rename_file_rename_global_value
  version: '1.0'
  applicable_bundles:
  - file_rename
  checks:
  - kind: must_contain_any
    values:
    - '0'
    - 'false'
    - 'off'
    - disabled
    - not enabled
    - 'no'
  scoring:
    combine: all_pass
- id: file_rename_file_rename_which_widget_field
  version: '1.0'
  applicable_bundles:
  - file_rename
  checks:
  - kind: must_contain_any
    values:
    - field_fr_doc
  scoring:
    combine: all_pass
- id: file_rename_file_rename_enable_per_widget
  version: '1.0'
  applicable_bundles:
  - file_rename
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
- id: file_rename_file_rename_enable_global
  version: '1.0'
  applicable_bundles:
  - file_rename
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
