rubrics:
- id: fitvids_fitvids_config_keys
  version: '1.0'
  applicable_bundles:
  - fitvids
  checks:
  - kind: must_contain_any
    values:
    - fitvids.settings
    - selectors
    - .node
  scoring:
    combine: all_pass
- id: fitvids_fitvids_admin_route
  version: '1.0'
  applicable_bundles:
  - fitvids
  checks:
  - kind: must_contain_any
    values:
    - /admin/config/media/fitvids
    - fitvids.admin
    - administer fitvids
  scoring:
    combine: all_pass
- id: fitvids_fitvids_how_attached
  version: '1.0'
  applicable_bundles:
  - fitvids
  checks:
  - kind: must_contain_any
    values:
    - page_attachments
    - drupalSettings
    - library
    - iframe[src^=
  scoring:
    combine: all_pass
- id: fitvids_fitvids_known_selectors
  version: '1.0'
  applicable_bundles:
  - fitvids
  checks:
  - kind: must_contain_any
    values:
    - .field--type-text-long
  scoring:
    combine: all_pass
- id: fitvids_fitvids_known_vendor
  version: '1.0'
  applicable_bundles:
  - fitvids
  checks:
  - kind: must_contain_any
    values:
    - https://vimeo.com
    - .no-fit
  scoring:
    combine: all_pass
- id: fitvids_fitvids_set_selectors
  version: '1.0'
  applicable_bundles:
  - fitvids
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
- id: fitvids_fitvids_add_vendor
  version: '1.0'
  applicable_bundles:
  - fitvids
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
