metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: fitvids
  version: 2.1.x
  note: 'FitVids attaches the FitVids.js jQuery library site-wide (hook_page_attachments) to make embedded
    videos fluid. All state is the fitvids.settings config object: selectors (default ''.node''), custom_vendors
    (default ''https://youtu.be''), ignore_selectors (default ''''), each newline-separated. Admin form
    /admin/config/media/fitvids (route fitvids.admin, permission ''administer fitvids''). Medium cases
    read back a non-default selectors value and the custom_vendors/ignore_selectors from the live config;
    hard cases point FitVids at a new container selector and add a custom video vendor plus an ignore
    selector, verified against fitvids.settings. Config is owned by this module; scripts restore shipped
    defaults.'
questions:
- id: fitvids-config-keys
  input: Which config object stores the Drupal FitVids module's settings, and what are its three keys
    (with the default value of the one that selects which containers get responsive videos)?
  criteria: Settings live in fitvids.settings with keys selectors (default '.node' - the CSS selectors
    of video containers), custom_vendors (default 'https://youtu.be' - extra iframe src prefixes), and
    ignore_selectors (default empty - videos to leave alone).
  bundle: fitvids
  rubric_ref: rubric/fitvids_fitvids_config_keys@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: fitvids-admin-route
  input: Where is the FitVids settings form in the Drupal admin, what is its route, and which permission
    controls access?
  criteria: The form is at Configuration > Media > FitVids (/admin/config/media/fitvids), route fitvids.admin,
    gated by the 'administer fitvids' permission.
  bundle: fitvids
  rubric_ref: rubric/fitvids_fitvids_admin_route@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: fitvids-how-attached
  input: How does the FitVids module apply the FitVids.js behavior to a Drupal page - via a field formatter,
    a block, or something else - and how does a configured custom video provider reach the JavaScript?
  criteria: It uses hook_page_attachments to attach the fitvids/fitvids and fitvids/init libraries on
    every page and export selectors/custom_vendors/ignore_selectors to drupalSettings.fitvids; a custom
    vendor like https://vimeo.com is turned into the selector iframe[src^="https://vimeo.com"]. It is
    not a formatter or block.
  bundle: fitvids
  rubric_ref: rubric/fitvids_fitvids_how_attached@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: fitvids-known-selectors
  input: On this Drupal site, FitVids has been pointed at a non-default container selector. Inspect the
    live configuration and state the CSS selector FitVids currently targets.
  criteria: fitvids.settings selectors is '.field--type-text-long' (not the default .node).
  bundle: fitvids
  rubric_ref: rubric/fitvids_fitvids_known_selectors@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/fitvids-known-selectors-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/fitvids-known-selectors-cleanup.sh
- id: fitvids-known-vendor
  input: FitVids on this site has an extra video provider and an ignore selector configured. Inspect the
    live configuration and state the additional video provider and the ignored selector.
  criteria: fitvids.settings custom_vendors is 'https://vimeo.com' and ignore_selectors is '.no-fit'.
  bundle: fitvids
  rubric_ref: rubric/fitvids_fitvids_known_vendor@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/fitvids-known-vendor-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/fitvids-known-vendor-cleanup.sh
- id: fitvids-set-selectors
  input: On this Drupal site, configure FitVids so that it makes videos fluid inside containers matching
    the CSS selector '.content'. Apply the change to the live site.
  criteria: fitvids.settings selectors contains '.content' (drush cset fitvids.settings selectors '.content',
    or via the settings form).
  bundle: fitvids
  rubric_ref: rubric/fitvids_fitvids_set_selectors@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/fitvids-selectors-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/fitvids-selectors-reset.sh
    verify: agent-module-documentation/evaluation/verify/fitvids-selectors-verify.sh
    unused_text_checks:
      must_contain_any: []
      must_not_contain: []
- id: fitvids-add-vendor
  input: Using the FitVids module on this site, add 'https://videopress.com' as an additional video provider
    and make FitVids ignore videos matching the selector '.slick-slider'. Apply the change to the live
    site.
  criteria: fitvids.settings custom_vendors includes 'https://videopress.com' and ignore_selectors includes
    '.slick-slider'.
  bundle: fitvids
  rubric_ref: rubric/fitvids_fitvids_add_vendor@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/fitvids-vendor-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/fitvids-vendor-reset.sh
    verify: agent-module-documentation/evaluation/verify/fitvids-vendor-verify.sh
    unused_text_checks:
      must_contain_any: []
      must_not_contain: []
