metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: field_hidden
  version: 2.1.x
  note: 'Field Hidden defines three Field API widget plugins (all labelled ''Hidden field'') that render
    core number/plain-text fields as input[type=hidden]: field_hidden_string_textfield (string), field_hidden_string_textarea
    (string_long), field_hidden_number (integer/decimal/float). No config route, no settings form, no
    config schema, no permissions, no Drush. Persistent state is only the chosen widget `type` on a field
    component inside an entity_form_display config entity (e.g. core.entity_form_display.node.article.default
    -> content.<field>.type). It is NOT the same as choosing ''- Hidden -'', which drops the field from
    the form. Medium cases read back which widget id a known field uses; hard cases switch a field''s
    form-display widget to the appropriate field_hidden widget, verified against the live entity_form_display.
    All fixture fields are namespaced field_fh_*.'
questions:
- id: field_hidden-widget-ids
  input: In the Drupal contrib module field_hidden, which field widget plugin ids does it provide and
    which core field types does each apply to?
  criteria: 'Three ''Hidden field'' widgets: field_hidden_string_textfield (string / Text plain), field_hidden_string_textarea
    (string_long / Text plain long), and field_hidden_number (integer, decimal, float).'
  bundle: field_hidden
  rubric_ref: rubric/field_hidden_field_hidden_widget_ids@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: field_hidden-vs-hidden-region
  input: On a Drupal Manage form display page, what is the difference between choosing field_hidden's
    'Hidden field' widget and choosing the '- Hidden -' region for a field?
  criteria: '''- Hidden -'' removes the field from the form entirely (no input rendered, value not submitted,
    default not saved). field_hidden''s ''Hidden field'' widget keeps the field in the form as an <input
    type=hidden>, so its (default/JS-set) value is still submitted and saved.'
  bundle: field_hidden
  rubric_ref: rubric/field_hidden_field_hidden_vs_hidden_region@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: field_hidden-where-set
  input: I enabled field_hidden but there's no settings page. How do I make a text field render as a hidden
    input, and where is that choice stored in config?
  criteria: There is no configure route. On the bundle's Manage form display page pick the 'Hidden field'
    widget for the field. It is stored as the component type in core.entity_form_display.<entity>.<bundle>.<mode>
    -> content.<field>.type (e.g. field_hidden_string_textfield).
  bundle: field_hidden
  rubric_ref: rubric/field_hidden_field_hidden_where_set@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: field_hidden-known-widget
  input: On this Drupal site, the Article content type has a text field named field_fh_secret whose form
    widget is set by the field_hidden module. Inspect the live default form display for Article and name
    the exact widget plugin id used for field_fh_secret.
  criteria: field_fh_secret uses the widget field_hidden_string_textfield in core.entity_form_display.node.article.default.
  bundle: field_hidden
  rubric_ref: rubric/field_hidden_field_hidden_known_widget@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/field_hidden-known-widget-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/field_hidden-known-widget-cleanup.sh
- id: field_hidden-known-number
  input: The Article content type on this site has an integer field field_fh_count configured with a field_hidden
    widget on its default form display. Inspect the running site and state which field_hidden widget plugin
    id it uses.
  criteria: field_fh_count uses the widget field_hidden_number (the widget field_hidden provides for integer/decimal/float).
  bundle: field_hidden
  rubric_ref: rubric/field_hidden_field_hidden_known_number@1.0
  tags:
