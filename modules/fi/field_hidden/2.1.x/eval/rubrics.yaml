rubrics:
- id: field_hidden_field_hidden_widget_ids
  version: '1.0'
  applicable_bundles:
  - field_hidden
  checks:
  - kind: must_contain_any
    values:
    - field_hidden_string_textfield
    - field_hidden_string_textarea
    - field_hidden_number
  scoring:
    combine: all_pass
- id: field_hidden_field_hidden_vs_hidden_region
  version: '1.0'
  applicable_bundles:
  - field_hidden
  checks:
  - kind: must_contain_any
    values:
    - submitted
    - input type="hidden"
    - hidden input
    - removes the field
    - not submitted
    - excludes the field
  scoring:
    combine: all_pass
- id: field_hidden_field_hidden_where_set
  version: '1.0'
  applicable_bundles:
  - field_hidden
  checks:
  - kind: must_contain_any
    values:
    - Manage form display
    - form display
    - entity_form_display
    - form-display
  scoring:
    combine: all_pass
- id: field_hidden_field_hidden_known_widget
  version: '1.0'
  applicable_bundles:
  - field_hidden
  checks:
  - kind: must_contain_any
    values:
    - field_hidden_string_textfield
  scoring:
    combine: all_pass
- id: field_hidden_field_hidden_known_number
  version: '1.0'
  applicable_bundles:
  - field_hidden
  checks:
  - kind: must_contain_any
    values:
    - field_hidden_number
  scoring:
    combine: all_pass
- id: field_hidden_field_hidden_make_string_hidden
  version: '1.0'
  applicable_bundles:
  - field_hidden
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
