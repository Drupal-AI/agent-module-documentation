metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: field_tools
  version: 1.0.x
  note: Field Tools has no settings form (configure=null) and no config of its own; it adds Field-UI tabs
    and site-wide field reports, and exposes four services. All cases are grounded in real service ids/methods
    (field_tools.field_cloner->cloneField), real routes (/admin/reports/fields/tools), the real permission
    (access field tools pages), and real live field config. Medium cases read back which bundles a field
    instance lives on; hard cases clone a field (and its form-display settings) from Article to Page,
    verified against live field.field / entity_form_display config.
questions:
- id: field_tools-clone-service
  input: In the Drupal contrib module Field Tools, which service and method would I call in code to copy
    an existing field configuration from one bundle to a different bundle?
  criteria: Call the field_tools.field_cloner service (\Drupal\field_tools\FieldCloner) and its cloneField($field_config,
    $destination_entity_type_id, $destination_bundle) method.
  bundle: field_tools
  rubric_ref: rubric/field_tools_field_tools_clone_service@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: field_tools-reports-permission
  input: Field Tools adds site-wide field overview pages under Reports. What is the URL path of its field
    list report, and which permission controls access to those pages?
  criteria: The field list is at /admin/reports/fields/tools (references at /admin/reports/fields/references,
    graph at /admin/reports/fields/graph). Access is gated by the 'access field tools pages' permission.
  bundle: field_tools
  rubric_ref: rubric/field_tools_field_tools_reports_permission@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: field_tools-clone-copies-displays
  input: When Field Tools clones a field to another bundle, does it also copy the field's display configuration?
    If so, which displays receive the settings?
  criteria: Yes. cloneField() also copies the field's form and view display settings onto displays on
    the destination bundle whose view-mode name matches one on the source (both entity_form_display and
    entity_view_display). Modes that do not exist on the destination are skipped.
  bundle: field_tools
  rubric_ref: rubric/field_tools_field_tools_clone_copies_displays@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: field_tools-which-bundles
  input: On this Drupal site a field named field_ft_seen has been added to more than one content type.
    Using the kind of information Field Tools' field list report exposes, inspect the live site and name
    every content-type bundle that currently has an instance of field_ft_seen.
  criteria: field_ft_seen is instanced on the article and page content types (field.field.node.article.field_ft_seen
    and field.field.node.page.field_ft_seen both exist).
  bundle: field_tools
  rubric_ref: rubric/field_tools_field_tools_which_bundles@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/field_tools-which-bundles-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/field_tools-which-bundles-cleanup.sh
- id: field_tools-reference-field
  input: Field Tools' references report lists entity-reference fields and what they point at. On this
    site the Article content type has exactly one custom reference field added for this task. Inspect
    the live configuration and give its machine name and the entity type it references.
  criteria: 'The field is field_ft_ref, an entity_reference field on node.article that targets the user
    entity type (settings.target_type: user).'
  bundle: field_tools
  rubric_ref: rubric/field_tools_field_tools_reference_field@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/field_tools-reference-field-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/field_tools-reference-field-cleanup.sh
- id: field_tools-clone-field
  input: On this Drupal site the Article content type has a field field_ft_source that the Page content
    type does not have. Using Field Tools, clone field_ft_source from Article to the Page content type
    so that Page gains an instance of the same field. Apply the change to the live site.
  criteria: A FieldConfig field.field.node.page.field_ft_source now exists (e.g. via \Drupal::service('field_tools.field_cloner')->cloneField(FieldConfig::loadByName('node','article','field_ft_source'),'node','page'),
    or by duplicating the FieldConfig onto the page bundle).
  bundle: field_tools
  rubric_ref: rubric/field_tools_field_tools_clone_field@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/field_tools-clone-field-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/field_tools-clone-field-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/field_tools-clone-field-verify.sh
- id: field_tools-clone-with-widget
  input: I added a field called field_ft_widget to my Articles and set up how it looks on the edit form.
    I want the exact same field, including its edit-form widget, to also show up on Basic pages. Please
    make that happen on the site.
  criteria: Page gains FieldConfig field.field.node.page.field_ft_widget AND the node.page.default entity_form_display
    has a component for field_ft_widget (Field Tools' cloneField copies form-display settings to the matching-named
    display; the article default form display already has the component).
  bundle: field_tools
  rubric_ref: rubric/field_tools_field_tools_clone_with_widget@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: layman
    reset: agent-module-documentation/evaluation/verify/field_tools-clone-with-widget-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/field_tools-clone-with-widget-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/field_tools-clone-with-widget-verify.sh
