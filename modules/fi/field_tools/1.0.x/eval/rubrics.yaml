rubrics:
- id: field_tools_field_tools_clone_service
  version: '1.0'
  applicable_bundles:
  - field_tools
  checks:
  - kind: must_contain_any
    values:
    - field_tools.field_cloner
    - cloneField
    - FieldCloner
  scoring:
    combine: all_pass
- id: field_tools_field_tools_reports_permission
  version: '1.0'
  applicable_bundles:
  - field_tools
  checks:
  - kind: must_contain_any
    values:
    - /admin/reports/fields
    - access field tools pages
  scoring:
    combine: all_pass
- id: field_tools_field_tools_clone_copies_displays
  version: '1.0'
  applicable_bundles:
  - field_tools
  checks:
  - kind: must_contain_any
    values:
    - display
    - view mode
    - form display
    - view display
  scoring:
    combine: all_pass
- id: field_tools_field_tools_which_bundles
  version: '1.0'
  applicable_bundles:
  - field_tools
  checks:
  - kind: must_contain_any
    values:
    - page
  scoring:
    combine: all_pass
- id: field_tools_field_tools_reference_field
  version: '1.0'
  applicable_bundles:
  - field_tools
  checks:
  - kind: must_contain_any
    values:
    - field_ft_ref
  scoring:
    combine: all_pass
- id: field_tools_field_tools_clone_field
  version: '1.0'
  applicable_bundles:
  - field_tools
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
- id: field_tools_field_tools_clone_with_widget
  version: '1.0'
  applicable_bundles:
  - field_tools
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
