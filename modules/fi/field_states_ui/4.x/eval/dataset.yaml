metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: field_states_ui
  version: 4.x
  note: 'Field States UI exposes Drupal''s States API (#states) in Manage form display. A field state
    is a FieldState plugin (visible, invisible, required, optional, enabled, disabled, checked, unchecked,
    expanded, collapsed) with data {target, comparison, value}. State config is stored as a third-party
    setting on the widget''s component in the entity_form_display config entity: content.<field>.third_party_settings.field_states_ui.field_states
    = list of {id, data:{target,comparison,value}, uuid}. No configure route, no permissions, no Drush.
    All medium/hard cases are grounded in that real config (exactly like a widget third-party setting):
    introspection reads which field has a state and its id/target; execution configures a state on a field''s
    widget and a verify inspects the live entity_form_display component. Namespaced fields: field_fsui_known/state
    (medium), field_fsui_task+trigger and field_fsui_req (hard).'
questions:
- id: fsui-what-states
  input: What does the Field States UI (field_states_ui) Drupal module let you do without writing PHP,
    and name some of the field states it provides?
  criteria: 'It exposes Drupal''s form States API in the Manage form display UI, letting you make a field
    visible/invisible/required/optional/enabled/disabled/checked/unchecked/expanded/collapsed based on
    another field''s value - no custom #states code needed.'
  bundle: field_states_ui
  rubric_ref: rubric/field_states_ui_fsui_what_states@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: fsui-where-stored
  input: Where does field_states_ui store the states you configure for a field, i.e. in which config entity
    and under what key?
  criteria: 'As a third-party setting on the field''s widget component in the entity_form_display config
    entity: core.entity_form_display.<entity>.<bundle>.<mode> -> content.<field>.third_party_settings.field_states_ui.field_states,
    a list of {id, data:{target, comparison, value}, uuid}.'
  bundle: field_states_ui
  rubric_ref: rubric/field_states_ui_fsui_where_stored@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: fsui-data-keys
  input: For a single Field States UI state, what does the stored 'data' contain (which keys), and what
    is the module's plugin type called?
  criteria: Each state's data has target (the watched field), comparison (value/empty/filled/checked/...),
    and value. Each state is a plugin of the module's FieldState plugin type (manager plugin.manager.field_states_ui.fieldstate,
    annotation @FieldState, base FieldStateBase).
  bundle: field_states_ui
  rubric_ref: rubric/field_states_ui_fsui_data_keys@1.0
  tags:
  - mode:recipe
  - difficulty:easy
