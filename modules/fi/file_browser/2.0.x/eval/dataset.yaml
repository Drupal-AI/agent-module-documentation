metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: file_browser
  version: 2.0.x
  note: 'File Browser is a configuration layer: it ships a ready-made Entity Browser for files (Masonry
    grid + DropzoneJS upload) built on entity_browser + entity_embed + dropzonejs, with no settings form
    of its own. Cases are `recipe` (response-graded) probing documented facts an agent would otherwise
    read source/config to answer; no site mutation.'
questions:
- id: file-browser-what-it-provides
  input: 'On Drupal 11 I want a Media-library-style file picker: a grid of existing images to select plus
    drag-and-drop upload. What does the File Browser module give me out of the box, and what is it built
    on?'
  criteria: A ready-made Entity Browser (browse_files) with a Masonry thumbnail grid of files to select
    and a DropzoneJS upload tab, built on entity_browser + entity_embed + dropzonejs. No custom settings
    form of its own.
  bundle: file_browser
  rubric_ref: rubric/file_browser_file_browser_what_it_provides@1.0
  tags:
  - mode:recipe
- id: file-browser-attach-widget
  input: How do I make an Article's image field use File Browser instead of the plain upload widget on
    a Drupal site?
  criteria: On the bundle's Manage form display, set the File/Image field's widget to Entity Browser (or
    File Browser), then in the widget settings select the 'Browser for files' (browse_files) entity browser.
  bundle: file_browser
  rubric_ref: rubric/file_browser_file_browser_attach_widget@1.0
  tags:
  - mode:recipe
- id: file-browser-ready-made-browser
  input: What is the machine name of the pre-built Entity Browser that File Browser installs, and is there
    a modal variant?
  criteria: browse_files (iframe display, auto_open true) is the main one; browse_files_modal is the modal
    variant.
  bundle: file_browser
  rubric_ref: rubric/file_browser_file_browser_ready_made_browser@1.0
  tags:
  - mode:recipe
- id: file-browser-upload-tab
  input: Which module powers the upload tab inside File Browser, and where do uploaded files go by default?
  criteria: The DropzoneJS Entity Browser widget powers the 'Upload files' tab; the default upload location
    is public://.
  bundle: file_browser
  rubric_ref: rubric/file_browser_file_browser_upload_tab@1.0
  tags:
  - mode:recipe
- id: file-browser-grid-libraries
  input: The File Browser grid of thumbnails is a masonry layout. Which JavaScript libraries render it,
    and how are they installed?
  criteria: The Masonry and imagesLoaded (plus Backbone/Underscore) JS libraries render the grid; install
    them into /libraries via the bundled composer.libraries.json (Wikimedia composer-merge-plugin) or
    manually.
  bundle: file_browser
  rubric_ref: rubric/file_browser_file_browser_grid_libraries@1.0
  tags:
  - mode:recipe
- id: file-browser-dependencies
  input: What are the main contrib module dependencies I must have enabled for File Browser to work on
    Drupal 11?
  criteria: entity_browser, entity_embed, and dropzonejs (with dropzonejs_eb_widget); embed is required
    transitively via entity_embed. Plus core field, file, image, views.
  bundle: file_browser
  rubric_ref: rubric/file_browser_file_browser_dependencies@1.0
  tags:
  - mode:recipe
- id: file-browser-customise-grid
  input: I want to change which files show in the File Browser grid and how they are sorted. Which shipped
    config do I edit?
  criteria: Edit the shipped View views.view.file_entity_browser (the browser's 'Files listing' view widget)
    to change the files shown, filters, sort, and pager.
  bundle: file_browser
  rubric_ref: rubric/file_browser_file_browser_customise_grid@1.0
  tags:
  - mode:recipe
- id: file-browser-embed-rich-text
  input: How can File Browser be used to embed a chosen image into CKEditor rich text?
  criteria: It ships an Entity Embed button (embed.button.file_browser) for embedding files/images in
    rich text, and an image_embed block plugin.
  bundle: file_browser
  rubric_ref: rubric/file_browser_file_browser_embed_rich_text@1.0
  tags:
  - mode:recipe
