rubrics:
- id: filter_twig_filter_twig_what_it_does
  version: '1.0'
  applicable_bundles:
  - filter_twig
  checks:
  - kind: must_contain_any
    values:
    - filter_twig
    - inline_template
    - Twig
    - render
  scoring:
    combine: all_pass
- id: filter_twig_filter_twig_how_enable
  version: '1.0'
  applicable_bundles:
  - filter_twig
  checks:
  - kind: must_contain_any
    values:
    - text format
    - /admin/config/content/formats
    - filters
    - filter_twig
    - status
  scoring:
    combine: all_pass
- id: filter_twig_filter_twig_security
  version: '1.0'
  applicable_bundles:
  - filter_twig
  checks:
  - kind: must_contain_any
    values:
    - arbitrary
    - execut
    - trusted
    - admin
    - security
    - RCE
  scoring:
    combine: all_pass
- id: filter_twig_filter_twig_which_format
  version: '1.0'
  applicable_bundles:
  - filter_twig
  checks:
  - kind: must_contain_any
    values:
    - ft_twig_on
  scoring:
    combine: all_pass
- id: filter_twig_filter_twig_is_enabled
  version: '1.0'
  applicable_bundles:
  - filter_twig
  checks:
  - kind: must_contain_any
    values:
    - enabled
    - 'true'
    - 'yes'
    - 'on'
    - active
  scoring:
    combine: all_pass
- id: filter_twig_filter_twig_build_format
  version: '1.0'
  applicable_bundles:
  - filter_twig
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
- id: filter_twig_filter_twig_build_format_layman
  version: '1.0'
  applicable_bundles:
  - filter_twig
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
