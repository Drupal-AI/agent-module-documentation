metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: filter_twig
  version: 3.0.x
  note: 'Filter Twig is a single text-format filter plugin (id filter_twig, title ''Replaces Twig values'',
    TYPE_TRANSFORM_IRREVERSIBLE, no settings). Its process() renders the field text as [''#type''=>''inline_template'',''#template''=>$text],
    i.e. executes it as Twig. No configure route, no permissions, no schema, no services. Enablement lives
    in filter.format.<id> -> filters.filter_twig.status: true. On this site NO format enables it by default.
    Cases are grounded in the filter plugin and the filter.format config.'
questions:
- id: filter_twig-what-it-does
  input: What does the filter_twig module's text-format filter do to a field's content when the field
    is rendered, and what is the filter plugin id?
  criteria: The filter plugin id is filter_twig ('Replaces Twig values'). Its process() treats the stored
    field text as a Twig template via a render array ['#type' => 'inline_template', '#template' => $text],
    so any Twig in the content is executed and replaced with its rendered output.
  bundle: filter_twig
  rubric_ref: rubric/filter_twig_filter_twig_what_it_does@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: filter_twig-how-enable
  input: There is no settings page for filter_twig. How do I turn Twig rendering on for a field, and where
    is that choice stored in configuration?
  criteria: 'You enable the ''Replaces Twig values'' filter on a text format at /admin/config/content/formats
    and apply that format to the field. It is stored in filter.format.<id> under filters.filter_twig.status:
    true.'
  bundle: filter_twig
  rubric_ref: rubric/filter_twig_filter_twig_how_enable@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: filter_twig-security
  input: Why should the filter_twig 'Replaces Twig values' filter only be enabled on text formats restricted
    to trusted or administrative roles?
  criteria: Because the filter executes the field content as a Twig template (inline_template), anyone
    who can edit a field using a Twig-enabled format can run arbitrary Twig. Enabling it on a format available
    to untrusted/low-privilege users would allow arbitrary code execution, so it must be limited to trusted/admin-only
    formats.
  bundle: filter_twig
  rubric_ref: rubric/filter_twig_filter_twig_security@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: filter_twig-which-format
  input: On this Drupal site, exactly one text format has the filter_twig Twig-rendering filter enabled.
    Inspect the live filter format configuration and give the machine name of that text format.
  criteria: The text format ft_twig_on has filters.filter_twig.status = true; the other test format ft_twig_off
    does not have the filter_twig filter enabled (no enabled status).
  bundle: filter_twig
  rubric_ref: rubric/filter_twig_filter_twig_which_format@1.0
