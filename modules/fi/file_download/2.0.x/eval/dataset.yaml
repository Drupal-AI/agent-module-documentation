metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: file_download
  version: 2.0.x
  note: 'File Download provides two field formatters: file_download_formatter (file+image) which renders
    a forced-download link (Content-Disposition: attachment) via the route /file-download/download/{scheme}/{fid},
    and file_download_uri_formatter which renders the download URL. link_title options: file|entity_title|description|empty|custom
    (+ custom_title_text, token-aware) plus file_size. Permission: access file download. No global settings
    page (configure=null) — everything is per-field on Manage display (entity_view_display config). Medium
    cases set a known file_download_formatter component (with custom text) on a real file field and the
    agent introspects the live view display. Hard cases give a file field displayed with a non-file_download
    formatter and require switching it to file_download_formatter / file_download_uri_formatter with specific
    settings, verified against the saved entity_view_display.'
questions:
- id: file_download-formatter-id
  input: I want a file field on my Drupal Article to render as a link that downloads the file instead
    of opening it in the browser. Which field formatter from the file_download module do I choose, and
    what field types does it support?
  criteria: 'Use the ''File Download'' formatter, machine name file_download_formatter, on the field''s
    Manage display. It supports file and image field types and renders a forced-download link (Content-Disposition:
    attachment).'
  bundle: file_download
  rubric_ref: rubric/file_download_file_download_formatter_id@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: file_download-title-options
  input: In the file_download module's download formatter, what can I use as the link text, and how do
    I show the file size next to it?
  criteria: The link_title setting can be file (filename), entity_title (parent title), description, empty
    (icon only), or custom (custom_title_text, which is token-aware). Enable the file_size checkbox to
    append the human-readable file size.
  bundle: file_download
  rubric_ref: rubric/file_download_file_download_title_options@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: file_download-route-permission
  input: How does the file_download module actually force the browser to download the file, and what permission
    controls access to downloading?
  criteria: 'The formatter links to the route /file-download/download/{scheme}/{fid}; its controller streams
    the file with a Content-Disposition: attachment header (plus MIME/length), forcing a download. The
    ''access file download'' permission gates who can download, and core hook_file_download access is
    still honoured for private files.'
  bundle: file_download
  rubric_ref: rubric/file_download_file_download_route_permission@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: file_download-known-formatter
  input: On this site the Article content type has a file field field_fd_known whose default display is
    configured with the file_download module. Inspect the live view display and give the machine name
    of the formatter applied to that field.
  criteria: In core.entity_view_display.node.article.default the field_fd_known component uses formatter
    type file_download_formatter.
  bundle: file_download
  rubric_ref: rubric/file_download_file_download_known_formatter@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/file_download-known-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/file_download-known-cleanup.sh
- id: file_download-known-custom-text
  input: The Article file field field_fd_known on this site uses the file_download formatter with a custom
    link label. Inspect the running site and report the exact custom link text that is configured.
  criteria: 'The formatter settings have link_title: custom and custom_title_text: ''Grab it now'' on
    the field_fd_known component of core.entity_view_display.node.article.default.'
  bundle: file_download
  rubric_ref: rubric/file_download_file_download_known_custom_text@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/file_download-known-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/file_download-known-cleanup.sh
- id: file_download-apply-formatter
  input: On this Drupal site the Article content type has a file field field_fd_task that currently displays
    with the generic file formatter. Using the file_download module, change the default view display so
    this field renders as a forced-download link AND shows the file size. Apply the change to the live
    site.
  criteria: In core.entity_view_display.node.article.default set the field_fd_task component to type file_download_formatter
    with settings.file_size = true, and save. Verify checks the component type is file_download_formatter
    and file_size is true.
  bundle: file_download
  rubric_ref: rubric/file_download_file_download_apply_formatter@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/file_download-apply-formatter-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/file_download-apply-formatter-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/file_download-apply-formatter-verify.sh
- id: file_download-apply-uri-formatter
  input: My Article file field field_fd_uri should output the file's full download web address (including
    the domain) so I can reuse it elsewhere, using the file_download module. Please set up the display
    for that field and save it.
  criteria: In core.entity_view_display.node.article.default set the field_fd_uri component to type file_download_uri_formatter
    with settings.absolute_url = true, and save. Verify checks the component type is file_download_uri_formatter
    and absolute_url is true.
  bundle: file_download
  rubric_ref: rubric/file_download_file_download_apply_uri_formatter@1.0
  tags:
  - mode:execution
  - difficulty:hard
