metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: filefield_paths
  version: 1.0.x
  note: 'File (Field) Paths adds token-based path/filename settings to core File/Image fields, stored
    as field-config third-party settings, plus cleanup options, retroactive/active moves, a redirect option,
    a global temp-location setting, hooks, services, and a Drush command. Cases are `recipe` (response-graded):
    they probe documented facts an agent would otherwise read source to answer; no site mutation.'
questions:
- id: ffp-token-path-and-filename
  input: On a Drupal 11 site I want an Article's Image field to store uploads in a folder based on the
    node id and rename the file to include the node id, using tokens. Where do I configure this and which
    two settings do I fill in?
  criteria: On the field's settings form (Manage fields -> the Image field), enable 'File (Field) Paths?'
    then set the File path token pattern (e.g. articles/[node:nid]) and the File name token pattern (e.g.
    [node:nid]-[file:name]).
  bundle: filefield_paths
  rubric_ref: rubric/filefield_paths_ffp_token_path_and_filename@1.0
  tags:
  - mode:recipe
- id: ffp-third-party-settings-storage
  input: Where are File (Field) Paths per-field options (file path/name patterns, redirect, retroactive,
    active) stored in Drupal config, and how do I deploy them between environments?
  criteria: As field-config third-party settings under field.field.*.*.*.third_party.filefield_paths;
    they export/import with the field config via drush config:export / config:import.
  bundle: filefield_paths
  rubric_ref: rubric/filefield_paths_ffp_third_party_settings_storage@1.0
  tags:
  - mode:recipe
- id: ffp-retroactive-move-existing
  input: I already have uploaded files and just changed a File field's token path pattern. How do I move/rename
    all existing files to match the new pattern?
  criteria: Tick 'Retroactive update' on the field settings form (runs once, then re-disables), or run
    the batch from the CLI with drush filefield_paths:update (ffpu).
  bundle: filefield_paths
  rubric_ref: rubric/filefield_paths_ffp_retroactive_move_existing@1.0
  tags:
  - mode:recipe
- id: ffp-retroactive-drush
  input: Give the Drush command that retroactively updates File (Field) Paths for the Article content
    type's field_image, and the option to update every file field on the site.
  criteria: drush filefield_paths:update node article field_image (alias drush ffpu node article field_image);
    use --all (drush ffpu --all) to update every file-field instance.
  bundle: filefield_paths
  rubric_ref: rubric/filefield_paths_ffp_retroactive_drush@1.0
  tags:
  - mode:recipe
- id: ffp-redirect-on-move
  input: I want a redirect created automatically from a file's old URL to its new URL when File (Field)
    Paths moves it. Which per-field option enables this and what module does it require?
  criteria: Enable the per-field 'Create Redirect' option (the `redirect` third-party setting); it is
    disabled unless the Redirect module is installed.
  bundle: filefield_paths
  rubric_ref: rubric/filefield_paths_ffp_redirect_on_move@1.0
  tags:
  - mode:recipe
- id: ffp-cleanup-options
  input: What are the three cleanup options File (Field) Paths offers on each File path / File name pattern
    to sanitize token values?
  criteria: Remove slashes (/) from tokens (slashes), Cleanup using Pathauto (pathauto, needs Pathauto
    module), and Transliterate to US-ASCII (transliterate).
  bundle: filefield_paths
  rubric_ref: rubric/filefield_paths_ffp_cleanup_options@1.0
  tags:
  - mode:recipe
- id: ffp-token-dependency
  input: File (Field) Paths uses token patterns for paths and filenames. Which module provides token validation
    and the token browser on its settings form, and is it a hard dependency?
  criteria: The Token module provides token validation and the token-tree browser; it is recommended,
    not a hard dependency (the only info.yml dependency is core file). Token is a test/dev dependency.
  bundle: filefield_paths
  rubric_ref: rubric/filefield_paths_ffp_token_dependency@1.0
  tags:
  - mode:recipe
- id: ffp-global-temp-location
  input: What is the global default temporary upload location for File (Field) Paths, which config object
    holds it, and what route is the settings form on?
  criteria: The temp_location key on filefield_paths.settings (default public://filefield_paths), edited
    at the filefield_paths.admin_settings form (/admin/config/media/file-system/filefield-paths).
  bundle: filefield_paths
  rubric_ref: rubric/filefield_paths_ffp_global_temp_location@1.0
  tags:
  - mode:recipe
