metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: field_formatter_class
  version: 1.9.x
  note: 'Field Formatter Class adds a single ''class'' third-party setting to every field formatter/widget
    and renders it onto the field wrapper. It has no config route, no permissions, no services. Cases
    are `recipe` (response-graded): they probe documented facts an agent would otherwise read the .module
    source to answer; no site mutation.'
questions:
- id: ffc-where-to-set
  input: On a Drupal 11 site with Field Formatter Class enabled, where do I add a CSS class to a single
    field's output wrapper, and do I need any per-field configuration to turn the feature on first?
  criteria: In Manage display (or Manage form for widgets), click the field's gear/edit icon and fill
    the 'Field Formatter Class' textfield. No per-field setup is needed to enable it — the setting appears
    on every formatter automatically.
  bundle: field_formatter_class
  rubric_ref: rubric/field_formatter_class_ffc_where_to_set@1.0
  tags:
  - mode:recipe
- id: ffc-storage-third-party
  input: How is the Field Formatter Class value stored on the entity view display? Give the config structure.
  criteria: 'As a third-party setting on the display config: third_party_settings.field_formatter_class.class
    = ''<classes>''. It exports/imports with the display config; there is no separate config object.'
  bundle: field_formatter_class
  rubric_ref: rubric/field_formatter_class_ffc_storage_third_party@1.0
  tags:
  - mode:recipe
- id: ffc-which-hooks
  input: Which Drupal hooks does the field_formatter_class module implement to add its 'class' textfield
    to every formatter and to render the class onto the field?
  criteria: hook_field_formatter_third_party_settings_form() adds the 'class' textfield; hook_field_formatter_settings_summary_alter()
    shows the summary; hook_preprocess_field()/hook_preprocess() append the class to the field wrapper's
    attributes.
  bundle: field_formatter_class
  rubric_ref: rubric/field_formatter_class_ffc_which_hooks@1.0
  tags:
  - mode:recipe
- id: ffc-render-wrapper
  input: How does the configured class end up on the rendered field? Which template/attribute receives
    it and how is the string processed?
  criteria: preprocess reads the stored class, runs it through Token::replace() (clear => TRUE), splits
    on spaces, Html::escape()s each, and appends to $variables['attributes']['class'], i.e. the field
    template (field.html.twig) wrapper div.
  bundle: field_formatter_class
  rubric_ref: rubric/field_formatter_class_ffc_render_wrapper@1.0
  tags:
  - mode:recipe
- id: ffc-tokens
  input: Can the Field Formatter Class value contain tokens, and what makes a token browser link appear
    next to the setting?
  criteria: Yes — the value passes through the token service (Token::replace scoped to the field's entity
    type), so entity tokens resolve per entity. If the Token module is installed, a token_tree_link browser
    link is shown next to the field.
  bundle: field_formatter_class
  rubric_ref: rubric/field_formatter_class_ffc_tokens@1.0
  tags:
  - mode:recipe
- id: ffc-dependencies
  input: What modules does field_formatter_class depend on, and does it define any permissions or an admin
    configuration route?
  criteria: It depends only on core's 'field' module. It defines no permissions and no configure route
    — the class setting simply appears on every field's formatter/widget settings.
  bundle: field_formatter_class
  rubric_ref: rubric/field_formatter_class_ffc_dependencies@1.0
  tags:
  - mode:recipe
- id: ffc-multiple-classes
  input: If I type multiple class names into the Field Formatter Class textfield, how are they applied
    to the field wrapper?
  criteria: Space-separated values are split (explode on ' ') into individual classes, each HTML-escaped
    and added separately to the wrapper's class attribute.
  bundle: field_formatter_class
  rubric_ref: rubric/field_formatter_class_ffc_multiple_classes@1.0
  tags:
  - mode:recipe
