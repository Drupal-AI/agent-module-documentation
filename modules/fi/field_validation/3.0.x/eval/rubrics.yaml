rubrics:
- id: field_validation_field_validation_plugin_type
  version: '1.0'
  applicable_bundles:
  - field_validation
  checks:
  - kind: must_contain_any
    values:
    - FieldValidationRule
    - Plugin/FieldValidationRule
    - FieldValidationRuleBase
    - '@FieldValidationRule'
  scoring:
    combine: all_pass
- id: field_validation_field_validation_shipped_rules
  version: '1.0'
  applicable_bundles:
  - field_validation
  checks:
  - kind: must_contain_any
    values:
    - length_constraint_rule
    - regex_constraint_rule
    - unique_field_constraint_rule
  scoring:
    combine: all_pass
- id: field_validation_field_validation_config_entity
  version: '1.0'
  applicable_bundles:
  - field_validation
  checks:
  - kind: must_contain_any
    values:
    - field_validation_rule_set
    - rule_set
    - field_validation_rules
    - /admin/structure/field_validation
  scoring:
    combine: all_pass
- id: field_validation_field_validation_inspect_fields
  version: '1.0'
  applicable_bundles:
  - field_validation
  checks:
  - kind: must_contain_any
    values:
    - title
    - body
  scoring:
    combine: all_pass
- id: field_validation_field_validation_inspect_length
  version: '1.0'
  applicable_bundles:
  - field_validation
  checks:
  - kind: must_contain_any
    values:
    - length_constraint_rule
    - '10'
    - '60'
  scoring:
    combine: all_pass
- id: field_validation_field_validation_inspect_regex
  version: '1.0'
  applicable_bundles:
  - field_validation
  checks:
  - kind: must_contain_any
    values:
    - /^[A-Z].*/
    - ^[A-Z]
  scoring:
    combine: all_pass
- id: field_validation_field_validation_build_regex_title
  version: '1.0'
  applicable_bundles:
  - field_validation
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
- id: field_validation_field_validation_build_length_body
  version: '1.0'
  applicable_bundles:
  - field_validation
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
- id: field_validation_field_validation_build_unique_title
  version: '1.0'
  applicable_bundles:
  - field_validation
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
