metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: field_validation_legacy
  version: 3.0.x
  part_of: field_validation
  note: 'Light-doc submodule of field_validation. It ships no new plugin type, config entity, route or
    permission — only ~20 original hand-written FieldValidationRule plugins added to the parent''s plugin
    type. Recipe (easy) cases only: response-graded facts about what the submodule is and the legacy rule
    ids it provides.'
questions:
- id: field_validation_legacy-what-it-is
  input: In the Drupal `field_validation` project there is a submodule called `field_validation_legacy`.
    What does enabling it add, and does it define its own config entity, route or permission, or does
    it reuse the parent module's?
  criteria: field_validation_legacy adds ~20 original hand-written FieldValidationRule plugins (the classic
    pattern/phone/words/plain-text/unique/etc. rules) to the parent field_validation module's plugin type.
    It defines no new plugin type, config entity, route or permission — the rules are used inside the
    parent's field_validation_rule_set config entity like any other rule.
  bundle: field_validation_legacy
  rubric_ref: rubric/field_validation_legacy_field_validation_legacy_what_it_is@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: field_validation_legacy-rule-ids
  input: I upgraded a site to field_validation 3.0.x and want the old 'Pattern', 'Phone' and 'Words blocklist'
    style validators back. Which submodule provides them, and name a few of the legacy rule plugin ids
    it ships.
  criteria: Enable the field_validation_legacy submodule. It ships the original hand-written rule plugins,
    e.g. pattern_field_validation_rule, phone_field_validation_rule, blocklist_field_validation_rule,
    regex_field_validation_rule, length_field_validation_rule, words_field_validation_rule, plain_text_field_validation_rule,
    unique_field_validation_rule, specific_value_field_validation_rule, item_count_field_validation_rule.
  bundle: field_validation_legacy
  rubric_ref: rubric/field_validation_legacy_field_validation_legacy_rule_ids@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: field_validation_legacy-vs-parent
  input: On a new Drupal 11 site using field_validation 3.0.x, should I reach for field_validation_legacy
    or the main module's rules to validate a field's length? Explain the difference between the two rule
    sets.
  criteria: 'Prefer the main module: 3.0.x is a rewrite whose rules (e.g. length_constraint_rule) wrap
    Drupal/Symfony validation Constraints. field_validation_legacy is the older hand-written rules (e.g.
    length_field_validation_rule) kept for backward compatibility when upgrading; new sites should use
    the parent''s *_constraint_rule plugins.'
  bundle: field_validation_legacy
  rubric_ref: rubric/field_validation_legacy_field_validation_legacy_vs_parent@1.0
  tags:
  - mode:recipe
  - difficulty:easy
