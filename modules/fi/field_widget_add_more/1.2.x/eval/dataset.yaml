metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: field_widget_add_more
  version: 1.2.x
  note: field_widget_add_more adds an 'Add another item' button (and per-row Remove buttons) to field
    widgets on fields whose cardinality is a fixed integer > 1 (not 1, not unlimited). It has no field/widget
    of its own, no configure route, no permissions, no Drush. Its entire persistent state is a per-component
    third-party setting field_widget_add_more.add_more (boolean) on the entity_form_display config entity
    (core.entity_form_display.<entity>.<bundle>.<mode> -> content.<field>.third_party_settings.field_widget_add_more.add_more).
    The 'Show add more button' checkbox only appears for fixed cardinality > 1 fields. Medium cases read
    back which field has the setting; hard cases turn the setting on/off on a capped Article field, verified
    against the live entity_form_display.
questions:
- id: field_widget_add_more-what
  input: What does the Drupal field_widget_add_more module do, and how is it different from core's normal
    behavior for multi-value fields?
  criteria: It adds an 'Add another item' button (and per-row Remove buttons) to field widgets on fields
    with a fixed cardinality greater than 1. Core renders all allowed rows at once for capped fields and
    only shows an 'Add more' button on unlimited fields; this module restores the incremental add/remove
    UX for capped fields without changing storage.
  bundle: field_widget_add_more
  rubric_ref: rubric/field_widget_add_more_field_widget_add_more_what@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: field_widget_add_more-where-stored
  input: There is no settings page for field_widget_add_more. How do I turn it on for a field, and where
    is that choice stored?
  criteria: 'You enable it per field on Manage form display by ticking ''Show add more button'' on the
    field''s widget. It is stored as a third-party setting on the form-display component: core.entity_form_display.<entity>.<bundle>.<mode>
    -> content.<field>.third_party_settings.field_widget_add_more.add_more: true (schema field.widget.third_party.field_widget_add_more).'
  bundle: field_widget_add_more
  rubric_ref: rubric/field_widget_add_more_field_widget_add_more_where_stored@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: field_widget_add_more-which-fields
  input: On which fields does the field_widget_add_more 'Show add more button' checkbox appear? Does it
    show for single-value or unlimited-cardinality fields?
  criteria: The checkbox appears only for fields whose storage cardinality is a fixed integer greater
    than 1. The third-party settings form returns nothing (no checkbox) for cardinality 1 or for unlimited
    (-1) fields, since unlimited fields already get core's own Add-more button.
  bundle: field_widget_add_more
  rubric_ref: rubric/field_widget_add_more_field_widget_add_more_which_fields@1.0
  tags:
  - mode:recipe
  - difficulty:easy
