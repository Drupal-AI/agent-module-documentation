metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: file_url
  version: 2.0.x
  note: 'File URL provides a ''file_url'' field type (extends core FileItem) whose value is a URI stored
    in a target_id varchar(2048) column: local uploads become /file-dereference/{fid}, remote files are
    stored as the raw URL. Plugins: field type file_url, widget file_url_generic (upload/remote radio),
    formatter file_url_default (setting mode = link|plain), selection file_url_default:file. FileUrlHandler
    (service file_url.handler) has static fileToUrl/urlToFile/isRemote; RemoteFile is a null-storage File
    subclass keyed by URI; route file_url.dereference (/file-dereference/{file}) 302-redirects to the
    real file. One config value: file_url.settings.dereference_host (empty = site base_url). No settings
    form (configure=null), no permissions, no Drush. medium cases inspect a live file_url field / formatter
    setting / config value; hard cases create a file_url field and set the dereference host, verified
    against live field/config state.'
questions:
- id: file_url-how-stored
  input: How does the Drupal file_url module store a file reference so that it can hold either an uploaded
    local file or a remote URL, and what makes an uploaded file resolvable from an external system?
  criteria: Both cases are stored as a URI string in a target_id varchar(2048) column (the field type
    extends core FileItem). An uploaded file is stored as an internal dereference URL /file-dereference/{fid};
    a remote file is stored as the raw URL. The file_url.dereference route (/file-dereference/{file})
    302-redirects to the real file so external systems can resolve it.
  bundle: file_url
  rubric_ref: rubric/file_url_file_url_how_stored@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: file_url-plugin-ids
  input: What are the machine names of the field type, widget, and formatter provided by the file_url
    module?
  criteria: 'Field type: file_url; widget: file_url_generic (adds an Upload file / Remote file URL radio);
    formatter: file_url_default (setting ''mode'' = link or plain). It also provides the file_url_default:file
    entity-reference selection plugin.'
  bundle: file_url
  rubric_ref: rubric/file_url_file_url_plugin_ids@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: file_url-remote-and-mode
  input: With a file_url field, how does an editor enter an external file, and how can I display the field
    as a plain URL instead of a file link?
  criteria: The file_url_generic widget shows an 'Upload file' vs 'Remote file URL' radio; choosing Remote
    lets the editor paste an external URL. To display a plain URL, set the file_url_default formatter's
    'mode' setting to 'plain' (default is 'link').
  bundle: file_url
  rubric_ref: rubric/file_url_file_url_remote_and_mode@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: file_url-known-field
  input: On this Drupal site, the Article content type has a field that uses the file_url module's field
    type. Inspect the live field configuration and give the machine name of that field.
  criteria: 'The field is field_fu_known: its field storage type is file_url (on node.article).'
  bundle: file_url
  rubric_ref: rubric/file_url_file_url_known_field@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/file_url-known-field-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/file_url-known-field-cleanup.sh
- id: file_url-formatter-mode
  input: The Article field 'field_fu_fmt' on this site uses the file_url default formatter. Inspect the
    live display configuration and state which display mode it is set to (link or plain).
  criteria: 'It is set to ''plain'': the file_url_default formatter on core.entity_view_display.node.article.default
    has settings.mode = plain for field_fu_fmt.'
  bundle: file_url
  rubric_ref: rubric/file_url_file_url_formatter_mode@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/file_url-formatter-mode-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/file_url-formatter-mode-cleanup.sh
- id: file_url-create-field
  input: On this site, add a field named field_fu_task to the Article content type using the file_url
    module's field type, and give it the file_url_generic widget on the default form display. Apply the
    change to the live site.
  criteria: node.article has field_fu_task whose field storage type is file_url, and its default form-display
    widget is file_url_generic.
  bundle: file_url
  rubric_ref: rubric/file_url_file_url_create_field@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/file_url-create-field-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/file_url-create-field-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/file_url-create-field-verify.sh
- id: file_url-dereference-host
  input: Configure the file_url module so that the dereference links it generates for uploaded files point
    at the canonical host https://files.example.com instead of the site's own base URL. Apply the change
    to the live configuration.
  criteria: file_url.settings.dereference_host is set to 'https://files.example.com', so FileUrlHandler::fileToUrl()
    builds dereference URLs against that host instead of $base_url.
  bundle: file_url
  rubric_ref: rubric/file_url_file_url_dereference_host@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/file_url-dereference-host-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/file_url-dereference-host-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/file_url-dereference-host-verify.sh
