metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: filebrowser
  version: 3.1.x
  note: 'Filebrowser renders server directories as FTP-like listings. Each listing is a node of type dir_listing
    whose folder URI + per-node rights are stored in the module''s own filebrowser_nodes table (via the
    filebrowser.storage service and the Drupal\filebrowser\Filebrowser value object), NOT in Fields; the
    file listing is cached in filebrowser_content. Global defaults for new listings live in the filebrowser.settings
    config object (configure route filebrowser.settings, /admin/config/system/filebrowser). Medium/hard
    cases are grounded in that real state: introspection reads a known folder_path off a dir_listing node
    and known global rights; execution creates a dir_listing node (attaching a Filebrowser object so hook_node_insert
    persists it) and toggles global rights, both verified against live state. NOTE: on this site the shipped
    field.field.node.dir_listing.body instance is missing — cases avoid relying on a Body field.'
questions:
- id: filebrowser-listing-basics
  input: In the Drupal Filebrowser module, what kind of Drupal entity represents a single browsable directory
    listing, and where does the module store that listing's exposed folder path?
  criteria: A listing is a node of the dir_listing content type. Its exposed folder URI (folder_path)
    plus serialized per-node rights are stored in the module's own filebrowser_nodes database table (accessed
    via the filebrowser.storage service and the Drupal\filebrowser\Filebrowser value object), not as Fields.
  bundle: filebrowser
  rubric_ref: rubric/filebrowser_filebrowser_listing_basics@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: filebrowser-config-route
  input: Where do I configure the global/default Filebrowser settings that new directory listings inherit,
    and what config object holds them?
  criteria: The settings form is at /admin/config/system/filebrowser (route filebrowser.settings, permission
    'administer site configuration') and the values live in the filebrowser.settings config object under
    the top-level 'filebrowser' key (rights, uploads, presentation, adhocsetting).
  bundle: filebrowser
  rubric_ref: rubric/filebrowser_filebrowser_config_route@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: filebrowser-permissions
  input: Which Filebrowser permissions control viewing a listing, downloading individual files, uploading
    files, and downloading a whole folder as a zip archive?
  criteria: view listings, download files, upload files and download archive (plus create listings, rename
    files, delete files, create folders, edit description). They are dynamic permissions defined by FilebrowserPermissions;
    none is granted by default.
  bundle: filebrowser
  rubric_ref: rubric/filebrowser_filebrowser_permissions@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: filebrowser-known-folder
  input: This Drupal site has a Filebrowser directory-listing node titled 'FB Known Listing'. Inspect
    the live site and report the folder URI (folder path) that this listing exposes.
  criteria: public://fb_eval_docs — read from the filebrowser_nodes row for that node, e.g. \Drupal::service('filebrowser.storage')->loadNodeRecord($nid)['folder_path'],
    or $node->filebrowser->folderPath.
  bundle: filebrowser
  rubric_ref: rubric/filebrowser_filebrowser_known_folder@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/filebrowser-known-folder-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/filebrowser-known-folder-cleanup.sh
- id: filebrowser-global-download
  input: On this site, inspect the global Filebrowser settings and report the current download method
    (download manager) and whether downloading a folder as a zip archive is enabled by default.
  criteria: download_manager is 'public' and download_archive is 1 (enabled) — read from config filebrowser.settings
    under filebrowser.rights.download_manager and filebrowser.rights.download_archive.
  bundle: filebrowser
  rubric_ref: rubric/filebrowser_filebrowser_global_download@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/filebrowser-global-download-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/filebrowser-global-download-cleanup.sh
- id: filebrowser-create-listing
  input: On this Drupal site, create a Filebrowser directory listing titled 'Filebrowser Eval Share' that
    exposes the folder public://fb_hard. Apply it to the live site so the listing's folder is persisted.
  criteria: 'Create a node of type dir_listing titled ''Filebrowser Eval Share'', attach a Drupal\filebrowser\Filebrowser
    object with folder_path ''public://fb_hard'' (and the rights/uploads/presentation arrays) before save
    so hook_node_insert() writes the filebrowser_nodes row. Verified: the filebrowser_nodes row for that
    node has folder_path == public://fb_hard.'
  bundle: filebrowser
  rubric_ref: rubric/filebrowser_filebrowser_create_listing@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/filebrowser-create-listing-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/filebrowser-create-listing-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/filebrowser-create-listing-verify.sh
- id: filebrowser-enable-archive
  input: Change the global Filebrowser defaults on this site so that new directory listings offer a 'download
    all as a zip archive' option and allow exploring sub-directories. Apply the change to the live site.
  criteria: In config filebrowser.settings set filebrowser.rights.download_archive = 1 and filebrowser.rights.explore_subdirs
    = 1 and save. Verified against live config.
  bundle: filebrowser
  rubric_ref: rubric/filebrowser_filebrowser_enable_archive@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/filebrowser-enable-archive-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/filebrowser-enable-archive-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/filebrowser-enable-archive-verify.sh
