metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: filebrowser_extra
  version: 3.1.x
  note: 'Filebrowser Extra is the shipped EXAMPLE submodule that demonstrates how to add custom file metadata
    to Filebrowser listings. It has no config, routes, permissions or schema of its own. Two event subscribers
    do the work: MetadataInfoEventSubscriber listens on ''filebrowser.metadata_info'' and injects a ''modified''
    column definition (title ''Modified'', type integer); MetadataEventSubscriber listens on ''filebrowser.metadata_event''
    and, when the ''modified'' column is selected, stores each file''s mtime as a filebrowser_metadata_entity
    row (module=''filebrowser_extra'', name=''modified''). Medium/hard tiers are grounded in whether that
    ''modified'' column is actually contributed on the live site (dispatch the filebrowser.metadata_info
    event / module enablement), which is deterministic and needs no rendered listing.'
questions:
- id: filebrowser_extra-what-recipe
  input: What does the Drupal filebrowser_extra submodule demonstrate, and which two Filebrowser events
    do its event subscribers listen on?
  criteria: 'It is an example of adding custom file metadata to Filebrowser listings: it adds a ''Modified''
    column showing each file''s mtime. Its subscribers listen on filebrowser.metadata_info (to declare
    the ''modified'' column) and filebrowser.metadata_event (to compute/store each file''s modified value).'
  bundle: filebrowser_extra
  rubric_ref: rubric/filebrowser_extra_filebrowser_extra_what_recipe@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: filebrowser_extra-storage-recipe
  input: Where does filebrowser_extra store the 'modified' file metadata it computes, and how is that
    record tagged?
  criteria: It stores a filebrowser_metadata_entity per file, created/updated in MetadataEventSubscriber::createModified(),
    with fields fid, nid, name='modified', title='Modified', module='filebrowser_extra' and the serialized
    formatted mtime as content.
  bundle: filebrowser_extra
  rubric_ref: rubric/filebrowser_extra_filebrowser_extra_storage_recipe@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: filebrowser_extra-howto-recipe
  input: Using filebrowser_extra as the template, how would I add my own custom metadata column to Filebrowser?
  criteria: 'Write two event subscribers like filebrowser_extra: one on filebrowser.metadata_info that
    adds your column to $event->getMetaDataInfo()/setMetaDataInfo() (a key with title and type), and one
    on filebrowser.metadata_event that, when your column is in $event->columns, computes the value per
    file and saves a filebrowser_metadata_entity tagged with your module and column name.'
  bundle: filebrowser_extra
  rubric_ref: rubric/filebrowser_extra_filebrowser_extra_howto_recipe@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: filebrowser_extra-column-introspect
  input: On this Drupal site, a submodule contributes an extra file-metadata column to Filebrowser. Inspect
    the running site (e.g. dispatch the filebrowser.metadata_info event) and name the metadata column
    key that is contributed and the module that provides it.
  criteria: The 'modified' column is contributed by filebrowser_extra. Dispatching a Drupal\filebrowser\Events\MetadataInfo
    event on 'filebrowser.metadata_info' yields a 'modified' key (title 'Modified', type integer) once
    filebrowser_extra is enabled.
  bundle: filebrowser_extra
  rubric_ref: rubric/filebrowser_extra_filebrowser_extra_column_introspect@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/filebrowser_extra-column-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/filebrowser_extra-column-cleanup.sh
- id: filebrowser_extra-add-column-execute
  input: On this Drupal site, Filebrowser is missing the 'modified' file-metadata column that the filebrowser_extra
    example module provides. Make that column available in Filebrowser listings.
  criteria: Enable the filebrowser_extra module (drush en filebrowser_extra -y). Its MetadataInfoEventSubscriber
    then contributes the 'modified' column to the filebrowser.metadata_info event, so Filebrowser listings
    can show a Modified column.
  bundle: filebrowser_extra
  rubric_ref: rubric/filebrowser_extra_filebrowser_extra_add_column_execute@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/filebrowser_extra-add-column-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/filebrowser_extra-add-column-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/filebrowser_extra-add-column-verify.sh
