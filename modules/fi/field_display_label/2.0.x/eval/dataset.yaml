metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: field_display_label
  version: 2.0.x
  note: 'Field Display Label lets a field show a different label on display than on its edit form. Its
    entire persistent state is one third-party setting on the FieldConfig: field.field.<entity>.<bundle>.<field>
    -> third_party_settings.field_display_label.display_label. It adds a ''Display label'' textfield to
    field_config_edit_form and swaps $variables[''label''] in hook_preprocess_field() when that setting
    is non-empty. No config page (configure=null), permission, service, plugin, or Drush. Medium cases
    read back a known display label (and identify which of two fields has one); hard cases set / change
    the display_label third-party setting, verified against the live FieldConfig. All fixtures are namespaced
    field_fdl_* on node.article.'
questions:
- id: field_display_label-where-set
  input: Using the field_display_label module, how do I make a field show one label on the edit form but
    a different label when the content is viewed, and where is that display label stored?
  criteria: 'Edit the field (field_config_edit_form, via Manage fields) and fill in the ''Display label''.
    It is stored as a third-party setting on the FieldConfig: field.field.<entity>.<bundle>.<field> ->
    third_party_settings.field_display_label.display_label.'
  bundle: field_display_label
  rubric_ref: rubric/field_display_label_field_display_label_where_set@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: field_display_label-mechanism
  input: How does the field_display_label module actually change the label shown for a field when the
    content is rendered, without editing a Twig template?
  criteria: 'It implements hook_preprocess_field() (FieldDisplayLabelHooks::preprocessField): if the field''s
    field_display_label.display_label third-party setting is non-empty it overwrites $variables[''label'']
    with it, so only the displayed label changes.'
  bundle: field_display_label
  rubric_ref: rubric/field_display_label_field_display_label_mechanism@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: field_display_label-per-bundle
  input: With field_display_label, if the same field is used on two content types, can it show a different
    display label on each? Why?
  criteria: Yes. The display label is stored on the per-bundle FieldConfig (field.field.<entity>.<bundle>.<field>),
    so each bundle's instance of the field can carry its own field_display_label.display_label.
  bundle: field_display_label
  rubric_ref: rubric/field_display_label_field_display_label_per_bundle@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: field_display_label-known
  input: On this Drupal site, the Article content type has a field named field_fdl_known whose display
    label was customised with field_display_label. Inspect the live field configuration and report the
    display label that will be shown when the field is viewed.
  criteria: 'The display label is ''FDL Known Display'': field.field.node.article.field_fdl_known has
    third_party_settings.field_display_label.display_label = ''FDL Known Display'' (drush cget field.field.node.article.field_fdl_known
    third_party_settings.field_display_label).'
  bundle: field_display_label
  rubric_ref: rubric/field_display_label_field_display_label_known@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/field_display_label-known-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/field_display_label-known-cleanup.sh
- id: field_display_label-which
  input: The Article content type on this site has two fields, field_fdl_a and field_fdl_b. Exactly one
    of them has a custom display label set via field_display_label. Inspect the live configuration and
    state which field has one and what its display label is.
  criteria: field_fdl_a has the custom display label 'Special A Label' (third_party_settings.field_display_label.display_label),
    while field_fdl_b has none.
  bundle: field_display_label
