questions:
- id: field_group-build-group
  input: On this Drupal site (drush available), improve the Article node edit form by grouping fields.
    Using Field Group, add a collapsible `details` group with machine name `group_eval_meta` and label
    `Metadata` to the Article default form display, and place the Body field inside that group. Apply
    it to the live site so the group really shows on the form; don't just describe it. One-line summary.
  criteria: The node.article.default entity_form_display gains a field_group third-party setting `group_eval_meta`
    (format_type details, label Metadata) whose children include `body`, applied to the live site so the
    collapsible Metadata group renders on the Article edit form. Verified against live site state.
  bundle: field_group
  rubric_ref: rubric/field_group_field_group_build_group@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/field_group-reset.sh
    verify: agent-module-documentation/evaluation/verify/field_group-article-group.sh
- id: field_group-view-tabs
  input: On this Drupal site (drush available), organize the Article node's DEFAULT VIEW display (entity_view_display,
    the rendered node page — NOT the edit form) using Field Group tabs. Create a `tabs` container group
    with machine name `group_eval_vtabs` (label `Article Tabs`) and, inside it, a `tab` group with machine
    name `group_eval_vtab` (label `Body Tab`, parent_name `group_eval_vtabs`) that wraps the Body field.
    Apply it to the live site so the tab really renders on the node view; don't just describe it. One-line
    summary.
  criteria: 'The node.article.default entity_VIEW_display gains two field_group third-party settings:
    `group_eval_vtabs` (format_type tabs) and `group_eval_vtab` (format_type tab, parent_name group_eval_vtabs)
    whose children include `body`, applied to the live site so the Body tab renders on the Article view.
    Verified against live site state.'
  bundle: field_group
  rubric_ref: rubric/field_group_field_group_view_tabs@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/field_group-view-tabs-reset.sh
    verify: agent-module-documentation/evaluation/verify/field_group-view-tabs-verify.sh
- id: field_group-form-fieldset
  input: On this Drupal site (drush available), group fields on the Article node's DEFAULT FORM display
    using Field Group. Create a `fieldset` group with machine name `group_eval_fieldset` (label `Article
    Details`) on the Article default form display and place at least two fields inside it (for example
    Body and the Sections field). Apply it to the live site so the fieldset really shows on the edit form;
    don't just describe it. One-line summary.
  criteria: The node.article.default entity_form_display gains a field_group third-party setting `group_eval_fieldset`
    (format_type fieldset, label Article Details) whose children include at least two fields, applied
    to the live site so the fieldset renders on the Article edit form. Verified against live site state.
  bundle: field_group
  rubric_ref: rubric/field_group_field_group_form_fieldset@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/field_group-form-fieldset-reset.sh
    verify: agent-module-documentation/evaluation/verify/field_group-form-fieldset-verify.sh
