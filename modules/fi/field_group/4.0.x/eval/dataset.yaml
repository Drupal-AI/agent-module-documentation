- id: fieldgroup-plugin-type
  input: In a Drupal 11 module I want to define a brand-new field_group format (a custom way to render
    a group of fields). What plugin type do I create, which base class do I extend, and in what namespace/directory
    does the plugin class live? Name them.
  criteria: 'Create a FieldGroupFormatter plugin: class in Drupal\<module>\Plugin\field_group\FieldGroupFormatter,
    annotated @FieldGroupFormatter, extending Drupal\field_group\FieldGroupFormatterBase (interface FieldGroupFormatterInterface).'
  bundle: field_group
  rubric_ref: rubric/field_group_fieldgroup_plugin_type@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: fieldgroup-storage
  input: On a Drupal site, where/how does field_group store the groups a site builder creates on Manage
    form display / Manage display? Is there a separate config or content entity per group? Explain so
    I know how to export them.
  criteria: Groups are stored as third-party settings on the entity form/view display config entity (e.g.
    core.entity_form_display.<entity>.<bundle>.<mode>.third_party.field_group.<group_name>), not a separate
    entity, so they export/deploy with drush config:export like any other config.
  bundle: field_group
  rubric_ref: rubric/field_group_fieldgroup_storage@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: fieldgroup-format-types
  input: A site builder asks which built-in group format types field_group ships for organizing fields
    on a form. List the core formats (with their machine ids) available in the Add group dropdown.
  criteria: 'Built-in FieldGroupFormatter formats: Fieldset (fieldset), Details (details), Details sidebar
    (details_sidebar), Tab (tab), Tabs (tabs), HTML element (html_element); Accordion (accordion/accordion_item)
    comes from the deprecated field_group_accordion submodule.'
  bundle: field_group
  rubric_ref: rubric/field_group_fieldgroup_format_types@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: fieldgroup-config-keys
  input: I'm hand-writing a field_group group into an exported core.entity_form_display YAML config. Under
    the third_party.field_group.<group> key, which keys describe the group's contents, its format, and
    its nesting under a parent group?
  criteria: The group defines children (fields/subgroups in it), label, parent_name (name of parent group
    for nesting), region, weight, format_type, and format_settings (keyed by the format's own schema).
  bundle: field_group
  rubric_ref: rubric/field_group_fieldgroup_config_keys@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: fieldgroup-prerender-hook
  input: On a Drupal site I want to attach custom classes / JS (#attached, drupalSettings) to one field_group
    group as it renders on the entity view, without subclassing a formatter. Which field_group hook do
    I implement?
  criteria: 'Implement hook_field_group_pre_render() (or hook_field_group_pre_render_alter() to tweak
    after build) — receives &$element, &$group, &$rendering_object; use it to set #attached/drupalSettings,
    attributes, classes, #weight on the group.'
  bundle: field_group
  rubric_ref: rubric/field_group_fieldgroup_prerender_hook@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: fieldgroup-form-states
  input: 'I need to add conditional #states visibility logic to a whole field_group group on an entity
    form (not the front-end view). Which field_group hook(s) fire during form processing that I should
    use?'
  criteria: 'Use the form-processing hooks: hook_field_group_form_process() / hook_field_group_form_process_alter()
    (per-group, add #states), and hook_field_group_form_process_build_alter() for cross-group form logic
    after all groups are processed.'
  bundle: field_group
  rubric_ref: rubric/field_group_fieldgroup_form_states@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: fieldgroup-html-element-template
  input: I want to override the Twig template for field_group's HTML element format in my theme, and target
    one specific group by name. What is the base template name and how does field_group give me a per-group
    theme suggestion?
  criteria: Override field-group-html-element.html.twig; field_group_theme_suggestions_alter() adds a
    per-group suggestion so you can create field-group-html-element--<group-name>.html.twig. (Details/Fieldset/Vertical
    tabs reuse core templates.)
  bundle: field_group
  rubric_ref: rubric/field_group_fieldgroup_html_element_template@1.0
  tags:
  - mode:recipe
  - difficulty:easy
