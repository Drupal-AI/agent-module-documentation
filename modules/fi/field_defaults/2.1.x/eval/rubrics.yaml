rubrics:
- id: field_defaults_field_defaults_drush_command
  version: '1.0'
  applicable_bundles:
  - field_defaults
  checks:
  - kind: must_contain_any
    values:
    - field_defaults:bulk-update
    - fdbu
    - field_defaults-bulk-update
  scoring:
    combine: all_pass
- id: field_defaults_field_defaults_setting
  version: '1.0'
  applicable_bundles:
  - field_defaults
  checks:
  - kind: must_contain_any
    values:
    - retain_changed_date
    - field_defaults.settings
  scoring:
    combine: all_pass
- id: field_defaults_field_defaults_overwrite_behavior
  version: '1.0'
  applicable_bundles:
  - field_defaults
  checks:
  - kind: must_contain_any
    values:
    - no_overwrite
    - Keep existing values
    - empty
    - overwrite
  scoring:
    combine: all_pass
- id: field_defaults_field_defaults_known_setting
  version: '1.0'
  applicable_bundles:
  - field_defaults
  checks:
  - kind: must_contain_any
    values:
    - '0'
    - 'off'
    - disabled
    - not retained
  scoring:
    combine: all_pass
- id: field_defaults_field_defaults_known_field
  version: '1.0'
  applicable_bundles:
  - field_defaults
  checks:
  - kind: must_contain_any
    values:
    - FD_DEFAULT_XYZ
  scoring:
    combine: all_pass
- id: field_defaults_field_defaults_fill_empty
  version: '1.0'
  applicable_bundles:
  - field_defaults
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
- id: field_defaults_field_defaults_overwrite
  version: '1.0'
  applicable_bundles:
  - field_defaults
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
