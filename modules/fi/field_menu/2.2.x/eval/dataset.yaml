metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: field_menu
  version: 2.2.x
  note: 'Field Menu provides a single field type field_menu (class MenuItemId) with widget field_menu_tree_widget
    and formatter field_menu_tree_formatter; it has no configure route (configure=null), no permissions,
    no Drush, and defines no plugin type. Field values store menu_title, menu_item_key (menu_name:parent:link),
    max_depth (0=unlimited) and include_root; field-level settings menu_type_checkbox / menu_type_checkbox_negate
    restrict which menus the Root selector offers. Medium/hard cases are grounded in a real field_menu
    field on node.article: introspection reads its machine name and its menu restriction; execution creates
    a field_menu field on Article verified against FieldStorageConfig/FieldConfig.'
questions:
- id: field_menu-plugin-ids
  input: In the Drupal contrib module field_menu, what is the machine name of the field type it provides,
    and the ids of its default widget and default formatter?
  criteria: 'Field type id: field_menu (label ''Menu item'', class MenuItemId). Default widget: field_menu_tree_widget.
    Default formatter: field_menu_tree_formatter.'
  bundle: field_menu
  rubric_ref: rubric/field_menu_field_menu_plugin_ids@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: field_menu-key-format
  input: A field_menu field value stores which menu root the tree is rendered from. In what format is
    that root stored in the menu_item_key column, and what do max_depth=0 and include_root mean?
  criteria: menu_item_key is a colon-separated string menu_name:parent:link produced by core's menu.parent_form_selector.
    max_depth=0 means unlimited depth; include_root controls whether the selected root link itself is
    rendered (off = only its children).
  bundle: field_menu
  rubric_ref: rubric/field_menu_field_menu_key_format@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: field_menu-restrict-menus
  input: How do you limit which menus a field_menu field lets an editor pick a root from, and how do you
    invert that list so the named menus are hidden instead? Name the field setting keys.
  criteria: Set the field instance setting menu_type_checkbox to the array of allowed menu machine names
    (empty = all). Set menu_type_checkbox_negate = TRUE to treat that list as a hide-list (offer every
    menu except those).
  bundle: field_menu
  rubric_ref: rubric/field_menu_field_menu_restrict_menus@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: field_menu-known-field
  input: On this Drupal site the Article content type has one field of type field_menu (Menu item). Inspect
    the live field configuration and give its machine name.
  criteria: 'The field is field_fmenu_known: FieldStorageConfig node.field_fmenu_known has type field_menu
    and it is attached to the article bundle.'
  bundle: field_menu
  rubric_ref: rubric/field_menu_field_menu_known_field@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/field_menu-known-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/field_menu-known-cleanup.sh
- id: field_menu-known-restriction
  input: The Article content type has a field_menu field named field_fmenu_known. Inspect its live field
    settings and state which menu(s) its Root selector is restricted to.
  criteria: 'Its FieldConfig settings have menu_type_checkbox = { main: main } with menu_type_checkbox_negate
    = FALSE, so the Root selector only offers the ''main'' menu.'
  bundle: field_menu
  rubric_ref: rubric/field_menu_field_menu_known_restriction@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/field_menu-known-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/field_menu-known-cleanup.sh
