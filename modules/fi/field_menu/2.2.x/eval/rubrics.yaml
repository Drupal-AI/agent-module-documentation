rubrics:
- id: field_menu_field_menu_plugin_ids
  version: '1.0'
  applicable_bundles:
  - field_menu
  checks:
  - kind: must_contain_any
    values:
    - field_menu
    - field_menu_tree_widget
    - field_menu_tree_formatter
  scoring:
    combine: all_pass
- id: field_menu_field_menu_key_format
  version: '1.0'
  applicable_bundles:
  - field_menu
  checks:
  - kind: must_contain_any
    values:
    - menu_name:parent:link
    - menu_name
    - colon
    - max_depth
    - include_root
  scoring:
    combine: all_pass
- id: field_menu_field_menu_restrict_menus
  version: '1.0'
  applicable_bundles:
  - field_menu
  checks:
  - kind: must_contain_any
    values:
    - menu_type_checkbox
    - menu_type_checkbox_negate
  scoring:
    combine: all_pass
- id: field_menu_field_menu_known_field
  version: '1.0'
  applicable_bundles:
  - field_menu
  checks:
  - kind: must_contain_any
    values:
    - field_fmenu_known
  scoring:
    combine: all_pass
- id: field_menu_field_menu_known_restriction
  version: '1.0'
  applicable_bundles:
  - field_menu
  checks:
  - kind: must_contain_any
    values:
    - main
  scoring:
    combine: all_pass
- id: field_menu_field_menu_create_field
  version: '1.0'
  applicable_bundles:
  - field_menu
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
- id: field_menu_field_menu_create_restricted_field
  version: '1.0'
  applicable_bundles:
  - field_menu
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
