metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: fivestar
  version: 3.0.x
  note: 'Fivestar is a Voting API-backed star rating system. It provides a ''fivestar'' field type (FivestarItem),
    widgets fivestar_stars/fivestar_select, formatters fivestar_stars/fivestar_percentage/fivestar_rating,
    a ''#type => fivestar'' Form element, and a hook-driven star-skin registry (fivestar.widget_manager).
    Services: fivestar.vote_manager, fivestar.vote_result_manager, fivestar.widget_manager. One permission:
    ''rate content''. It has NO working central admin page (info.yml''s configure: fivestar.admin_overview
    route is not registered) so all config is per field: field storage settings.vote_type (default ''vote''),
    field instance settings (stars, allow_clear/revote/ownvote, rated_while, voting target), and the display
    formatter/widget settings (fivestar_widget skin). Medium/hard cases are grounded in real field + entity_view_display
    config on the Article content type.'
questions:
- id: fivestar-plugins
  input: In the Drupal contrib module Fivestar, what is the machine name of the field type it provides,
    and what widgets and formatters can I use to display it?
  criteria: 'Fivestar provides a field type with id ''fivestar'' (FivestarItem). Widgets: fivestar_stars
    (interactive stars) and fivestar_select (a select list). Formatters: fivestar_stars (interactive/average
    stars), fivestar_percentage (e.g. 92), fivestar_rating (e.g. 4.2/5).'
  bundle: fivestar
  rubric_ref: rubric/fivestar_fivestar_plugins@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: fivestar-votingapi
  input: How does the Fivestar module actually store ratings on a Drupal 11 site, and what module does
    it depend on for that?
  criteria: Fivestar depends on the Voting API (votingapi) module. Each time a fivestar field is saved
    it records a votingapi 'vote' entity of the field storage's configured vote_type (default 'vote');
    the rating is stored 0-100 internally. Aggregated results come from Voting API.
  bundle: fivestar
  rubric_ref: rubric/fivestar_fivestar_votingapi@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: fivestar-add-vote-api
  input: I want to programmatically cast a Fivestar rating on an entity from custom Drupal code. Which
    service and method should I call?
  criteria: Use the fivestar.vote_manager service (VoteManagerInterface) and call addVote($entity, $rating,
    $vote_type = 'vote', $uid = NULL); the rating is capped at 100. Aggregated results can be read via
    fivestar.vote_result_manager.
  bundle: fivestar
  rubric_ref: rubric/fivestar_fivestar_add_vote_api@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: fivestar-stars-setting
  input: On this Drupal site, the Article content type has a Fivestar rating field named field_fs_known.
    Inspect its live field configuration and tell me how many stars it is configured to show.
  criteria: 7 stars. In field.field.node.article.field_fs_known the settings.stars value is 7.
  bundle: fivestar
  rubric_ref: rubric/fivestar_fivestar_stars_setting@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/fivestar-field-stars-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/fivestar-field-stars-cleanup.sh
- id: fivestar-skin-setting
  input: On this Drupal site, the Article content type displays a Fivestar field field_fs_skin using the
    interactive stars formatter. Inspect the live default view display and tell me which Fivestar star
    skin (widget) is configured for that field.
  criteria: The 'hearts' skin. In core.entity_view_display.node.article.default the field_fs_skin component
    (formatter fivestar_stars) has settings.fivestar_widget = hearts.
  bundle: fivestar
  rubric_ref: rubric/fivestar_fivestar_skin_setting@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/fivestar-widget-skin-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/fivestar-widget-skin-cleanup.sh
- id: fivestar-create-field
  input: On this Drupal site, add a Fivestar rating field with machine name field_fs_task to the Article
    content type (field type 'fivestar', 5 stars, vote type 'vote'). Apply the change to the live site.
  criteria: A field storage of type 'fivestar' named field_fs_task on the node entity type, plus a field
    instance on the article bundle (e.g. via FieldStorageConfig::create + FieldConfig::create, or the
    Manage fields UI).
  bundle: fivestar
  rubric_ref: rubric/fivestar_fivestar_create_field@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/fivestar-create-field-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/fivestar-create-field-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/fivestar-create-field-verify.sh
- id: fivestar-set-formatter
  input: On this Drupal site the Article content type has a Fivestar field named field_fs_display. Its
    default view display currently shows the field with the percentage formatter. Change the default display
    so field_fs_display uses the Fivestar 'Rating (i.e. 4.2/5)' formatter (fivestar_rating) instead. Apply
    the change to the live site.
  criteria: In core.entity_view_display.node.article.default the field_fs_display component type is set
    to fivestar_rating (e.g. setComponent('field_fs_display', ['type' => 'fivestar_rating']) on the default
    view display, or pick 'Rating (i.e. 4.2/5)' in Manage display).
  bundle: fivestar
  rubric_ref: rubric/fivestar_fivestar_set_formatter@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/fivestar-set-formatter-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/fivestar-set-formatter-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/fivestar-set-formatter-verify.sh
