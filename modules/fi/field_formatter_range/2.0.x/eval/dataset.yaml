metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: field_formatter_range
  version: 2.0.x
  note: 'Field Formatter Range adds order/limit/offset to any field formatter on a multi-value field.
    It defines no field type/widget/formatter and no config UI (configure=null), no permissions, no Drush,
    no plugins. Its entire persistent state is a per-component third-party setting stored on a formatter
    in an entity_view_display config entity: core.entity_view_display.<entity>.<bundle>.<view_mode> ->
    content.<field>.third_party_settings.field_formatter_range -> {order,limit,offset}. order: 0 Default
    / 1 Reverse / 2 Random; limit = display items (0=all); offset = skip items. The settings group is
    only offered when field cardinality != 1. Config schema: field.formatter.third_party.field_formatter_range
    (3 integers). Rendering happens in hook_preprocess_field (reverse/shuffle then array_slice). All medium/hard
    cases create multi-value string fields (field_ffr_*) on Article and read/write the field_formatter_range
    third-party settings on the default view display, verified against live entity_view_display config.'
questions:
- id: ffr-where-stored
  input: The Drupal contrib module field_formatter_range lets me show only some of a multi-value field's
    values. There is no settings page for it. How do I turn on its range/offset for a field, and where
    is that choice stored?
  criteria: 'There is no configure route. On the bundle''s Manage display page, open the field formatter''s
    cog and set the ''Field Formatter Range'' order/display items/skip items. It is stored as a third-party
    setting on that formatter component: core.entity_view_display.<entity>.<bundle>.<mode> -> content.<field>.third_party_settings.field_formatter_range:
    {order, limit, offset}.'
  bundle: field_formatter_range
  rubric_ref: rubric/field_formatter_range_ffr_where_stored@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: ffr-order-values
  input: In field_formatter_range, what does the 'order' setting control and what are its possible values?
    What do 'limit' and 'offset' do?
  criteria: 'order controls display ordering: 0 = Default, 1 = Reverse, 2 = Random. limit (''Display items'')
    is the number of items to show (0 = all). offset (''Skip items'') is how many items to skip from the
    beginning. Rendering reverses/shuffles then slices by offset and limit.'
  bundle: field_formatter_range
  rubric_ref: rubric/field_formatter_range_ffr_order_values@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: ffr-when-available
  input: On which fields does the field_formatter_range 'Field Formatter Range' settings group appear
    on the Manage display page? Does it work on a single-value field?
  criteria: The settings group is added by hook_field_formatter_third_party_settings_form only when the
    field's cardinality is not 1 (i.e. multi-value fields). On a single-value field there is no range
    to apply, so it is not offered and has no effect.
  bundle: field_formatter_range
  rubric_ref: rubric/field_formatter_range_ffr_when_available@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: ffr-known-field
  input: On this Drupal site, the Article content type has a multi-value field whose default-view-mode
    formatter has field_formatter_range configured to limit how many items display. Inspect the live default
    view display for Article and give the machine name of that field and its configured 'limit' (display
    items) value.
  criteria: 'The field is field_ffr_known with limit 3: in core.entity_view_display.node.article.default
    its component has third_party_settings.field_formatter_range.limit = 3 (order 0, offset 0).'
  bundle: field_formatter_range
  rubric_ref: rubric/field_formatter_range_ffr_known_field@1.0
