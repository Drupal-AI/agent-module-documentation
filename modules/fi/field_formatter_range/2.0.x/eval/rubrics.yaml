rubrics:
- id: field_formatter_range_ffr_where_stored
  version: '1.0'
  applicable_bundles:
  - field_formatter_range
  checks:
  - kind: must_contain_any
    values:
    - Manage display
    - third_party_settings
    - field_formatter_range
    - entity_view_display
  scoring:
    combine: all_pass
- id: field_formatter_range_ffr_order_values
  version: '1.0'
  applicable_bundles:
  - field_formatter_range
  checks:
  - kind: must_contain_any
    values:
    - reverse
    - random
    - order
  scoring:
    combine: all_pass
- id: field_formatter_range_ffr_when_available
  version: '1.0'
  applicable_bundles:
  - field_formatter_range
  checks:
  - kind: must_contain_any
    values:
    - cardinality
    - multi-value
    - more than one
    - multiple
  scoring:
    combine: all_pass
- id: field_formatter_range_ffr_known_field
  version: '1.0'
  applicable_bundles:
  - field_formatter_range
  checks:
  - kind: must_contain_any
    values:
    - field_ffr_known
  scoring:
    combine: all_pass
- id: field_formatter_range_ffr_reverse_vs_not
  version: '1.0'
  applicable_bundles:
  - field_formatter_range
  checks:
  - kind: must_contain_any
    values:
    - field_ffr_on
  scoring:
    combine: all_pass
- id: field_formatter_range_ffr_set_limit
  version: '1.0'
  applicable_bundles:
  - field_formatter_range
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
- id: field_formatter_range_ffr_set_reverse
  version: '1.0'
  applicable_bundles:
  - field_formatter_range
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
