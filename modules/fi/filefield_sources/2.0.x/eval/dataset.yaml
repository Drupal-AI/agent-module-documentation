  criteria: 'field_ffs_known has sources upload, remote and reference enabled: core.entity_form_display.node.article.default
    -> content.field_ffs_known.third_party_settings.filefield_sources.filefield_sources.sources = {upload,
    remote, reference}.'
  bundle: filefield_sources
  rubric_ref: rubric/filefield_sources_filefield_sources_known_enabled@1.0
