metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: filefield_sources
  version: 2.0.x
  note: 'File Field Sources adds extra ''sources'' to File/Image field widgets beside core Upload: remote
    (URL download), reference (existing managed file), attach (server directory), imce (IMCE browser,
    needs IMCE), clipboard. Sources are enabled per widget and stored as a third-party setting on the
    entity_form_display: content.<field>.third_party_settings.filefield_sources.filefield_sources.sources
    (map id=>id for enabled, id=>0 for disabled); ''upload'' is auto-enabled. Supported widgets by default:
    file_generic, image_image (hook_filefield_sources_widgets). No settings page (configure=null). It
    defines the FilefieldSource plugin type (@FilefieldSource, manager plugin.manager.filefield_sources).
    Medium/hard cases create a real file field on Article and read/write that third-party setting.'
questions:
- id: filefield_sources-list-sources
  input: The Drupal filefield_sources module lets a File or Image field be filled from more than just
    an upload. Which additional sources does it provide out of the box?
  criteria: 'Beside core''s Upload, it provides: remote (download from a URL), reference (reuse an existing
    managed file by name), attach (pick from a server directory), imce (the IMCE file browser, if IMCE
    is installed), and clipboard (paste a file).'
  bundle: filefield_sources
  rubric_ref: rubric/filefield_sources_filefield_sources_list_sources@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: filefield_sources-where-enable
  input: How do I turn on filefield_sources options like 'Remote URL' for a specific File field in Drupal,
    and where is that choice saved? Note there is no dedicated admin settings page.
  criteria: 'There is no settings page (configure=null). You enable sources per widget on the entity''s
    Manage form display: open the File/Image field''s widget settings, expand ''File sources'', tick the
    sources. It is stored as a third-party setting on the widget component: core.entity_form_display.<entity>.<bundle>.<mode>
    -> content.<field>.third_party_settings.filefield_sources.filefield_sources.sources.'
  bundle: filefield_sources
  rubric_ref: rubric/filefield_sources_filefield_sources_where_enable@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: filefield_sources-supported-widgets
  input: Which field widgets does filefield_sources attach to by default, and how can a custom file widget
    opt in?
  criteria: By default it attaches to the file_generic and image_image widgets (returned by hook_filefield_sources_widgets()).
    A custom widget opts in by implementing hook_filefield_sources_widgets() and returning its widget
    plugin id.
  bundle: filefield_sources
  rubric_ref: rubric/filefield_sources_filefield_sources_supported_widgets@1.0
  tags:
  - mode:recipe
  - difficulty:easy
