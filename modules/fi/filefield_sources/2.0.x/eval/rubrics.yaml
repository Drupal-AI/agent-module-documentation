rubrics:
- id: filefield_sources_filefield_sources_list_sources
  version: '1.0'
  applicable_bundles:
  - filefield_sources
  checks:
  - kind: must_contain_any
    values:
    - remote
    - reference
    - attach
    - imce
    - clipboard
  scoring:
    combine: all_pass
- id: filefield_sources_filefield_sources_where_enable
  version: '1.0'
  applicable_bundles:
  - filefield_sources
  checks:
  - kind: must_contain_any
    values:
    - form display
    - Manage form display
    - third_party_settings
    - third party setting
    - File sources
    - widget
  scoring:
    combine: all_pass
- id: filefield_sources_filefield_sources_supported_widgets
  version: '1.0'
  applicable_bundles:
  - filefield_sources
  checks:
  - kind: must_contain_any
    values:
    - file_generic
    - image_image
    - hook_filefield_sources_widgets
  scoring:
    combine: all_pass
- id: filefield_sources_filefield_sources_known_enabled
  version: '1.0'
  applicable_bundles:
  - filefield_sources
  checks:
  - kind: must_contain_any
    values:
    - remote
    - reference
  scoring:
    combine: all_pass
- id: filefield_sources_filefield_sources_which_extra
  version: '1.0'
  applicable_bundles:
  - filefield_sources
  checks:
  - kind: must_contain_any
    values:
    - attach
  scoring:
    combine: all_pass
- id: filefield_sources_filefield_sources_enable_remote
  version: '1.0'
  applicable_bundles:
  - filefield_sources
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
- id: filefield_sources_filefield_sources_enable_reference
  version: '1.0'
  applicable_bundles:
  - filefield_sources
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
