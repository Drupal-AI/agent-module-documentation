rubrics:
- id: field_inheritance_field_inheritance_strategies
  version: '1.0'
  applicable_bundles:
  - field_inheritance
  checks:
  - kind: must_contain_any
    values:
    - inherit
    - prepend
    - append
    - fallback
  scoring:
    combine: all_pass
- id: field_inheritance_field_inheritance_where_configured
  version: '1.0'
  applicable_bundles:
  - field_inheritance
  checks:
  - kind: must_contain_any
    values:
    - /admin/structure/field_inheritance
    - field_inheritance.field_inheritance
    - field_inheritance
  scoring:
    combine: all_pass
- id: field_inheritance_field_inheritance_plugins
  version: '1.0'
  applicable_bundles:
  - field_inheritance
  checks:
  - kind: must_contain_any
    values:
    - default_inheritance
    - entity_reference_inheritance
  scoring:
    combine: all_pass
- id: field_inheritance_field_inheritance_known_source
  version: '1.0'
  applicable_bundles:
  - field_inheritance
  checks:
  - kind: must_contain_any
    values:
    - body
  scoring:
    combine: all_pass
- id: field_inheritance_field_inheritance_build
  version: '1.0'
  applicable_bundles:
  - field_inheritance
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
- id: field_inheritance_field_inheritance_known_strategy
  version: '1.0'
  applicable_bundles:
  - field_inheritance
  checks:
  - kind: must_contain_any
    values:
    - append
  scoring:
    combine: all_pass
- id: field_inheritance_field_inheritance_build_fallback
  version: '1.0'
  applicable_bundles:
  - field_inheritance
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
