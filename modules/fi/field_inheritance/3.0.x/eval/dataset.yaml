metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: field_inheritance
  version: 3.0.x
  note: Field Inheritance inherits a field's value from a source entity into a read-only computed field
    on a destination entity. Each inheritance is a config entity (field_inheritance, prefix field_inheritance.field_inheritance.<id>)
    with keys id/label/type/source{EntityType,EntityBundle,Field}/destination{EntityType,EntityBundle,Field}/plugin;
    on save the id is auto-prefixed <destType>_<destBundle>_. Strategy `type` is one of inherit|prepend|append|fallback.
    Plugin is default_inheritance or entity_reference_inheritance (the field_inheritance plugin type,
    manager plugin.manager.field_inheritance). field_inheritance.config:included_entities (default block_content,file,node,taxonomy_term)
    controls which entity types participate. Configure route field_inheritance.field_inheritance (/admin/structure/field_inheritance);
    permission 'administer field inheritance'. On this site node bundles are article and page and article
    has a body field. Medium/hard cases create/inspect a real field_inheritance config entity that inherits
    node/article body into node/page (ids are auto-prefixed to node_page_fi_known / node_page_fi_task).
questions:
- id: field_inheritance-strategies
  input: What does the Drupal Field Inheritance module do, and what inheritance strategies (types) can
    you choose when configuring an inheritance?
  criteria: 'It inherits a field''s value from a source entity into a read-only computed field on a destination
    entity (a field-level alternative to entity reference). The strategy (type) is one of: inherit, prepend,
    append, fallback.'
  bundle: field_inheritance
  rubric_ref: rubric/field_inheritance_field_inheritance_strategies@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: field_inheritance-where-configured
  input: Where are Field Inheritance inheritances managed in the Drupal admin, and what is the config
    entity type / config prefix used to store one?
  criteria: Manage them at /admin/structure/field_inheritance (route field_inheritance.field_inheritance,
    permission 'administer field inheritance'). Each is a config entity of type field_inheritance, stored
    as field_inheritance.field_inheritance.<id>.
  bundle: field_inheritance
  rubric_ref: rubric/field_inheritance_field_inheritance_where_configured@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: field_inheritance-plugins
  input: Field Inheritance defines its own plugin type for inheritance behaviour. Which two inheritance
    plugins ship with the module, and which one is used for entity_reference/image/file fields?
  criteria: The field_inheritance plugin type ships default_inheritance (any field) and entity_reference_inheritance
    (used for entity_reference, image, file, webform, paragraphs, entity_reference_revisions).
  bundle: field_inheritance
  rubric_ref: rubric/field_inheritance_field_inheritance_plugins@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: field_inheritance-known-source
  input: This Drupal site has a Field Inheritance configured that inherits data into the Page content
    type. Inspect the live field_inheritance configuration and state which source field it inherits from.
  criteria: The inheritance node_page_fi_known inherits from sourceField 'body' (of node/article). Inspect
    field_inheritance.field_inheritance.node_page_fi_known, or FieldInheritance::load('node_page_fi_known')->sourceField().
  bundle: field_inheritance
  rubric_ref: rubric/field_inheritance_field_inheritance_known_source@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/field_inheritance-known-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/field_inheritance-known-cleanup.sh
- id: field_inheritance-build
