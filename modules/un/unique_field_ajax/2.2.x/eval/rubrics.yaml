rubrics:
- id: unique_field_ajax_ufa_how_to_make_unique
  version: '1.0'
  applicable_bundles:
  - unique_field_ajax
  checks:
  - kind: must_contain_any
    values:
    - field settings
    - Manage fields
    - third party
    - third_party_settings
    - Unique
    - field_config_edit_form
  scoring:
    combine: all_pass
- id: unique_field_ajax_ufa_settings_keys
  version: '1.0'
  applicable_bundles:
  - unique_field_ajax
  checks:
  - kind: must_contain_any
    values:
    - per_lang
    - case_sensitive
    - use_ajax
    - no_enforce
    - message
  scoring:
    combine: all_pass
- id: unique_field_ajax_ufa_alter_hooks
  version: '1.0'
  applicable_bundles:
  - unique_field_ajax
  checks:
  - kind: must_contain_any
    values:
    - hook_query_unique_field_ajax_alter
    - hook_unique_field_ajax_unique_results_alter
    - unique_field_ajax_unique_results_alter
    - query_unique_field_ajax_alter
  scoring:
    combine: all_pass
- id: unique_field_ajax_ufa_which_field_unique
  version: '1.0'
  applicable_bundles:
  - unique_field_ajax
  checks:
  - kind: must_contain_any
    values:
    - field_ufa_known
  scoring:
    combine: all_pass
- id: unique_field_ajax_ufa_on_vs_off
  version: '1.0'
  applicable_bundles:
  - unique_field_ajax
  checks:
  - kind: must_contain_any
    values:
    - field_ufa_on
  scoring:
    combine: all_pass
- id: unique_field_ajax_ufa_enable_unique
  version: '1.0'
  applicable_bundles:
  - unique_field_ajax
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
- id: unique_field_ajax_ufa_case_sensitive_unique
  version: '1.0'
  applicable_bundles:
  - unique_field_ajax
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
