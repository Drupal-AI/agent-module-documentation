metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: unlimited_number
  version: 2.0.x
  note: 'unlimited_number provides (1) a Form API render element `#type => unlimited_number` (class Drupal\unlimited_number\Element\UnlimitedNumber)
    that renders two radios (''Unlimited''/''Limited'') plus an inline #type=number, resolving to either
    the string ''unlimited'' or the entered integer; and (2) an integer-field widget id `unlimited_number`
    label ''Unlimited or Number'' (extends core NumberWidget) that stores ''unlimited'' as a configurable
    integer via the setting value_unlimited (default 0). It has NO admin UI, NO permissions, NO Drush,
    NO plugin types. It DOES have a real, introspectable config surface: the widget''s settings on an
    entity_form_display, with config schema at field.widget.settings.unlimited_number. MEDIUM (introspection)
    is therefore genuine and INCLUDED (not fabricated): a setup script plants field_un_limit on Article
    using the unlimited_number widget with distinctive settings (label_unlimited=''Forever'', value_unlimited=-1)
    that differ from the defaults, so answering requires inspecting the live form display, and cleanup
    restores baseline. HARD (execution) is verified against live state by configuring a field''s edit-form
    widget to the module''s widget: the render element itself does NOT render via renderInIsolation on
    a bare element (its radios/number are built in a #process that needs form_state + the complete form
    and return empty in isolation) -- unlike form_options_attributes'' select -- so a file-return-render-array
    + renderInIsolation verify (the form_options_attributes pattern) is NOT robust here. Instead the HARD
    verify drives the module through its real widget: reset forces field_un_cardinality to core''s ''number''
    widget (verify FAILs), the agent switches it to unlimited_number storing ''unlimited'' as -1, and
    verify checks the entity_form_display component type + value_unlimited setting AND renders the actual
    Article node edit form to confirm the widget''s radios appear. Two HARD persona variants (expert/layman)
    share one verify.'
questions:
- id: un-what-it-provides
  input: On a Drupal 11 site with the unlimited_number module enabled, what does it provide and how would
    a developer use it? Name the Form API render element type it adds and the field widget it adds (including
    which field type that widget applies to).
  criteria: It provides a Form API render element `#type => unlimited_number` (two radios, 'Unlimited'
    / 'Limited', with an inline number field) and a field widget id `unlimited_number` labelled 'Unlimited
    or Number' that applies to INTEGER fields. Use the element in a custom form, or set an integer field's
    edit-form widget to 'Unlimited or Number'.
  bundle: unlimited_number
  rubric_ref: rubric/unlimited_number_un_what_it_provides@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: un-unlimited-return-value
  input: With the unlimited_number module, when a user picks the 'Unlimited' choice, what value does the
    `#type => unlimited_number` render element submit, and how does the 'Unlimited or Number' field widget
    end up storing that in an integer field?
  criteria: The render element submits the string 'unlimited' (the constant UnlimitedNumber::UNLIMITED);
    otherwise it submits the entered integer. The field widget converts 'unlimited' to a real integer
    using its value_unlimited setting (default 0; commonly set to -1) so the integer column stays numeric.
  bundle: unlimited_number
  rubric_ref: rubric/unlimited_number_un_unlimited_return_value@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: un-widget-settings
  input: For the unlimited_number field widget ('Unlimited or Number') on a Drupal 11 site, which settings
    can I configure, and is there an admin configuration page or permission for the module?
  criteria: 'The widget has three settings: value_unlimited (integer stored for ''unlimited'', default
    0), label_unlimited, and label_number. There is no dedicated admin page and no permissions; you configure
    it on the entity form display (Manage form display) or via config, and enabling the module is the
    whole install.'
  bundle: unlimited_number
  rubric_ref: rubric/unlimited_number_un_widget_settings@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: un-introspect-widget
  input: 'On this Drupal 11 site, the Article content type has an integer field named field_un_limit.
    Inspect the live configuration and tell me: which field widget does it use on the Article edit form,
    and what label is shown on its ''unlimited'' radio?'
  criteria: field_un_limit uses the unlimited_number widget ('Unlimited or Number'), and its unlimited
    radio label is configured to 'Forever' (with value_unlimited set to -1).
  bundle: unlimited_number
  rubric_ref: rubric/unlimited_number_un_introspect_widget@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/unlimited_number-widget-config-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/unlimited_number-widget-config-cleanup.sh
- id: un-introspect-unlimited-value
  input: On this Drupal 11 site, the Article integer field field_un_limit uses the 'Unlimited or Number'
    widget. Inspect the live config and tell me exactly which integer value gets stored in that field
    when an editor chooses 'unlimited'.
  criteria: The widget's value_unlimited setting is -1, so choosing 'unlimited' stores the integer -1
    in field_un_limit.
  bundle: unlimited_number
  rubric_ref: rubric/unlimited_number_un_introspect_unlimited_value@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/unlimited_number-widget-config-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/unlimited_number-widget-config-cleanup.sh
- id: un-configure-widget-expert
  input: On this Drupal 11 site the Article content type has an integer field field_un_cardinality. Configure
    its edit-form widget to the unlimited_number module's 'Unlimited or Number' widget, and set it so
    that choosing 'Unlimited' stores the integer -1 (value_unlimited = -1). Leave the field renderable
    on the Article node edit form.
  criteria: The entity_form_display node.article.default component for field_un_cardinality has type 'unlimited_number'
    with settings.value_unlimited = -1, and the Article node edit form renders the widget's radios.
  bundle: unlimited_number
  rubric_ref: rubric/unlimited_number_un_configure_widget_expert@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: expert
    reset: agent-module-documentation/evaluation/verify/unlimited_number-widget-reset.sh
    verify: agent-module-documentation/evaluation/verify/unlimited_number-widget-verify.sh
- id: un-configure-widget-layman
  input: On my site, Articles have a whole-number field called 'Max values' (field_un_cardinality). On
    the edit form I want editors to be able to pick 'Unlimited' or type a specific number instead of just
    a plain number box. And when they choose Unlimited, please save it in the database as -1. Set that
    up.
  criteria: The entity_form_display node.article.default component for field_un_cardinality has type 'unlimited_number'
    with settings.value_unlimited = -1, and the Article node edit form renders the widget's radios.
  bundle: unlimited_number
  rubric_ref: rubric/unlimited_number_un_configure_widget_layman@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: layman
    reset: agent-module-documentation/evaluation/verify/unlimited_number-widget-reset.sh
    verify: agent-module-documentation/evaluation/verify/unlimited_number-widget-verify.sh
