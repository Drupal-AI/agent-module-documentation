metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: unpublished_paragraphs
  version: 1.4.x
  note: 'Unpublished Paragraphs is a front-end-only helper for the Paragraphs module. It defines no config,
    no permission, no Drush, no plugins. On non-admin routes hook_preprocess_paragraph() adds CSS classes
    ''paragraph'' + ''unpublished'' to any paragraph where $paragraph->isPublished() is FALSE and attaches
    the unpublished_paragraphs/unpublished-toggle library (CSS hides .paragraph.unpublished; JS appends
    a fixed ''Toggle visibility of unpublished items'' button that toggles them). It grants no access
    itself. Because the module has no config of its own, the medium/hard cases are grounded in the one
    thing it actually keys on: a Paragraph entity''s published status. They use a self-contained, namespaced
    fixture built by the setup/reset scripts: paragraph type up_text (field field_up_body), content type
    up_page with paragraphs field field_up_paras, and nodes containing published/unpublished paragraphs.
    Cleanup removes the whole up_* fixture by name (never an unscoped field purge).'
questions:
- id: unpublished_paragraphs-toggle
  input: After enabling the unpublished_paragraphs module, how does a viewer show or hide unpublished
    paragraphs on a rendered page, and when does the control appear?
  criteria: The module attaches a library that appends a fixed 'Toggle visibility of unpublished items'
    button in the bottom-right corner, but only on pages that actually contain an unpublished paragraph.
    Clicking it shows/hides every unpublished paragraph on the page.
  bundle: unpublished_paragraphs
  rubric_ref: rubric/unpublished_paragraphs_unpublished_paragraphs_toggle@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: unpublished_paragraphs-classes
  input: What CSS classes and asset library does the unpublished_paragraphs module add to an unpublished
    paragraph when it is rendered, and what does the CSS do by default?
  criteria: hook_preprocess_paragraph() adds the classes 'paragraph' and 'unpublished' and attaches the
    unpublished_paragraphs/unpublished-toggle library. The CSS hides .paragraph.unpublished by default
    (display:none) and marks it with a pink dotted border and an 'Unpublished' label.
  bundle: unpublished_paragraphs
  rubric_ref: rubric/unpublished_paragraphs_unpublished_paragraphs_classes@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: unpublished_paragraphs-scope
  input: Does the unpublished_paragraphs module define its own permission or settings page, and on which
    routes does it act? What paragraph property does it check?
  criteria: It has no settings page and defines no permission of its own; it only acts on non-admin routes
    (isAdminRoute() is FALSE) via hook_preprocess_paragraph, checking $paragraph->isPublished(). Whether
    an unpublished paragraph renders at all is governed by core Paragraphs / entity access.
  bundle: unpublished_paragraphs
  rubric_ref: rubric/unpublished_paragraphs_unpublished_paragraphs_scope@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: unpublished_paragraphs-which-unpublished
  input: This site has a node called 'UP Fixture Node' built with Paragraphs (relevant to the unpublished_paragraphs
    module). One of its paragraphs is unpublished. Inspect the live site and state the body text of the
    paragraph that is unpublished.
  criteria: The unpublished paragraph's field_up_body is 'Secret unpublished block' (its status is 0),
    while 'Published intro block' is published.
  bundle: unpublished_paragraphs
  rubric_ref: rubric/unpublished_paragraphs_unpublished_paragraphs_which_unpublished@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/unpublished_paragraphs-fixture-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/unpublished_paragraphs-fixture-cleanup.sh
- id: unpublished_paragraphs-host-node
  input: On this site there is exactly one node built with Paragraphs that contains an unpublished paragraph.
    Inspect the live site and give the title of that node.
  criteria: The node is titled 'UP Fixture Node' (a up_page node whose field_up_paras includes a paragraph
    with status 0).
  bundle: unpublished_paragraphs
  rubric_ref: rubric/unpublished_paragraphs_unpublished_paragraphs_host_node@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/unpublished_paragraphs-fixture-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/unpublished_paragraphs-fixture-cleanup.sh
- id: unpublished_paragraphs-unpublish
  input: On this site the node 'UP Toggle Node' contains a paragraph whose body text is 'Toggle target
    block' and it is currently published. So that the unpublished_paragraphs module will hide it behind
    its toggle, unpublish that paragraph. Apply the change to the live site.
  criteria: The paragraph whose field_up_body is 'Toggle target block' has status 0 (unpublished), e.g.
    load it and call setUnpublished()->save().
  bundle: unpublished_paragraphs
  rubric_ref: rubric/unpublished_paragraphs_unpublished_paragraphs_unpublish@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/unpublished_paragraphs-unpublish-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/unpublished_paragraphs-unpublish-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/unpublished_paragraphs-unpublish-verify.sh
- id: unpublished_paragraphs-add-unpublished
  input: This site has a content type up_page with a paragraphs reference field field_up_paras and a paragraph
    type up_text (body field field_up_body). Create a node titled 'UP Task Node' of type up_page that
    contains at least one unpublished up_text paragraph (so the unpublished_paragraphs module would mark
    and hide it). Apply the change to the live site.
  criteria: A up_page node titled 'UP Task Node' exists whose field_up_paras references at least one paragraph
    with status 0 (unpublished).
  bundle: unpublished_paragraphs
  rubric_ref: rubric/unpublished_paragraphs_unpublished_paragraphs_add_unpublished@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/unpublished_paragraphs-add-unpublished-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/unpublished_paragraphs-add-unpublished-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/unpublished_paragraphs-add-unpublished-verify.sh
