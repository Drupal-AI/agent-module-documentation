rubrics:
- id: unpublished_paragraphs_unpublished_paragraphs_toggle
  version: '1.0'
  applicable_bundles:
  - unpublished_paragraphs
  checks:
  - kind: must_contain_any
    values:
    - toggle
    - Toggle visibility
    - button
  scoring:
    combine: all_pass
- id: unpublished_paragraphs_unpublished_paragraphs_classes
  version: '1.0'
  applicable_bundles:
  - unpublished_paragraphs
  checks:
  - kind: must_contain_any
    values:
    - unpublished
    - unpublished-toggle
    - paragraph
  scoring:
    combine: all_pass
- id: unpublished_paragraphs_unpublished_paragraphs_scope
  version: '1.0'
  applicable_bundles:
  - unpublished_paragraphs
  checks:
  - kind: must_contain_any
    values:
    - isPublished
    - admin
    - non-admin
    - no permission
    - no configuration
  scoring:
    combine: all_pass
- id: unpublished_paragraphs_unpublished_paragraphs_which_unpublished
  version: '1.0'
  applicable_bundles:
  - unpublished_paragraphs
  checks:
  - kind: must_contain_any
    values:
    - Secret unpublished block
  scoring:
    combine: all_pass
- id: unpublished_paragraphs_unpublished_paragraphs_host_node
  version: '1.0'
  applicable_bundles:
  - unpublished_paragraphs
  checks:
  - kind: must_contain_any
    values:
    - UP Fixture Node
  scoring:
    combine: all_pass
- id: unpublished_paragraphs_unpublished_paragraphs_unpublish
  version: '1.0'
  applicable_bundles:
  - unpublished_paragraphs
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
- id: unpublished_paragraphs_unpublished_paragraphs_add_unpublished
  version: '1.0'
  applicable_bundles:
  - unpublished_paragraphs
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
