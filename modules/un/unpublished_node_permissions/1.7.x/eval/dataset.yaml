metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: unpublished_node_permissions
  version: 1.7.x
  note: Unpublished Node Permissions defines a static permission 'view unpublished content' (any type)
    plus a dynamic per-type permission 'view <type> unpublished content' (e.g. 'view article unpublished
    content') generated by UnpublishedNodePermissions::nodeTypePermissions. Access is enforced via hook_node_access_records
    + hook_node_grants over realms view_unpublished_<type>_node / view_unpublished_any / view_unpublished_author.
    It also swaps the Views node_status filter for UnpublishedStatus and adds hook_views_query_substitutions.
    No config/schema, no settings form. Medium cases seed a role holding a known unpublished permission
    for read-back; hard cases have the agent grant a per-type or any permission to a fresh unp_* role,
    verified against live role config. Roles are namespaced unp_*.
questions:
- id: unpublished_node_permissions-what-permissions
  input: What permissions does the Drupal unpublished_node_permissions module add, and how is the per-content-type
    one named for the Article type?
  criteria: It adds a static 'view unpublished content' (view any unpublished node) plus a dynamic 'view
    <type> unpublished content' per node type, e.g. 'view article unpublished content'.
  bundle: unpublished_node_permissions
  rubric_ref: rubric/unpublished_node_permissions_unpublished_node_permissions_what_permissions@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: unpublished_node_permissions-enforcement
  input: How does unpublished_node_permissions actually enforce who can view unpublished nodes in Drupal,
    and what should I run after enabling it or changing the permissions?
  criteria: It uses Drupal's node access grant system (hook_node_access_records + hook_node_grants over
    view_unpublished_* realms). After enabling or changing the permissions, rebuild grants with node_access_rebuild()
    (drush php:eval 'node_access_rebuild();').
  bundle: unpublished_node_permissions
  rubric_ref: rubric/unpublished_node_permissions_unpublished_node_permissions_enforcement@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: unpublished_node_permissions-views
  input: Does unpublished_node_permissions affect Views, and if so how?
  criteria: 'Yes: it replaces the Views node_status filter class with UnpublishedStatus and adds hook_views_query_substitutions
    (***VIEWUNPUBLISHED_TYPE_<type>*** / ***VIEWUNPUBLISHED_ANY***) so Views listings honor the same per-type
    permissions.'
  bundle: unpublished_node_permissions
  rubric_ref: rubric/unpublished_node_permissions_unpublished_node_permissions_views@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: unpublished_node_permissions-known-role-type
