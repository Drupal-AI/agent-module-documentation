rubrics:
- id: unpublished_node_permissions_unpublished_node_permissions_what_permissions
  version: '1.0'
  applicable_bundles:
  - unpublished_node_permissions
  checks:
  - kind: must_contain_any
    values:
    - view article unpublished content
    - view unpublished content
    - per content type
    - per-type
  scoring:
    combine: all_pass
- id: unpublished_node_permissions_unpublished_node_permissions_enforcement
  version: '1.0'
  applicable_bundles:
  - unpublished_node_permissions
  checks:
  - kind: must_contain_any
    values:
    - node grant
    - hook_node_grants
    - hook_node_access_records
    - node access
    - node_access_rebuild
  scoring:
    combine: all_pass
- id: unpublished_node_permissions_unpublished_node_permissions_views
  version: '1.0'
