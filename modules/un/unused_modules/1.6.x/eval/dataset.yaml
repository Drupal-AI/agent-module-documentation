metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: unused_modules
  version: 1.6.x
  note: 'Unused Modules is a read-only development helper. It reports modules/projects on disk that are
    fully disabled and safe to delete via (a) the Drush command ''drush unused:modules [projects|modules]
    [disabled|all]'' (aliases um, unused-modules; supports --format=json) and (b) admin pages under /admin/config/development/unused_modules/...
    gated by the core ''administer modules'' permission (configure route unused_modules.overview.projects.disabled).
    A module is unused when disabled; a project is safe-to-delete only when NONE of its modules are enabled.
    Core modules are never listed. Service unused_modules.helper -> getModulesByProject() returns UnusedModulesExtensionDecorator[]
    (properties moduleIsEnabled, projectName, projectPath, projectHasEnabledModules, parsingError). No
    permissions of its own, no config schema, no config entities. Because the module never mutates the
    site, medium/hard are grounded in a disabled fixture module: the eval scripts create web/modules/custom/um_fixture
    (its own project, intentionally NEVER enabled, safe to delete since disabled) so unused_modules reports
    it. Medium reads back that um_fixture is reported unused; hard cases use the module''s Drush command
    to write the list of disabled modules / unused projects to a public file that verify checks contains
    um_fixture.'
questions:
- id: unused_modules-drush
  input: Which Drush command does the Unused Modules module provide to list projects that are safe to
    delete, and what are its arguments and aliases?
  criteria: drush unused:modules [projects|modules] [disabled|all] (aliases um, unused-modules). e.g.
    'drush unused:modules projects disabled' lists projects with no enabled modules; add --format=json
    for machine output.
  bundle: unused_modules
  rubric_ref: rubric/unused_modules_unused_modules_drush@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: unused_modules-report-path
  input: Where is the Unused Modules admin report, and which permission is required to view it?
  criteria: Under Configuration > Development > Unused Modules at /admin/config/development/unused_modules/projects/disabled
    (route unused_modules.overview.projects.disabled), with Projects/Modules and Fully-disabled/Also-enabled
    tabs. It requires the core 'administer modules' permission.
  bundle: unused_modules
  rubric_ref: rubric/unused_modules_unused_modules_report_path@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: unused_modules-project-vs-module
  input: In the Unused Modules module, when is a whole project considered 'safe to delete' versus just
    a single module being unused? Are core modules ever listed?
  criteria: A module is 'unused' when it is disabled; a project is safe to delete only when NONE of its
    modules are enabled (e.g. a project with a disabled submodule but an enabled main module is NOT deletable).
    Core modules are never listed.
  bundle: unused_modules
  rubric_ref: rubric/unused_modules_unused_modules_project_vs_module@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: unused_modules-which-unused
  input: On this Drupal site, one non-core module is present on disk but disabled, so it is safe to delete.
    Use the Unused Modules module to inspect the site and give the machine name of that unused module.
  criteria: um_fixture — it appears in 'drush unused:modules modules disabled' (and projects disabled)
    as a disabled module whose project has no enabled modules.
  bundle: unused_modules
  rubric_ref: rubric/unused_modules_unused_modules_which_unused@1.0
  tags:
  - mode:introspection
  - difficulty:medium
