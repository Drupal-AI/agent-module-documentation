metadata:
  module: unique_entity_title
  version: 1.8.x
  skill_name: drupal-module-docs
  note: Unique Entity Title attaches a UniqueEntityTitle validation constraint to the node title and taxonomy_term
    name fields, enforcing per-bundle uniqueness via an opt-in third_party_settings 'enabled' flag. No
    central config form, no configure route, no permissions, no Drush. Cases are `recipe` (response-graded)
    probing documented, source-grounded facts; no site mutation.
