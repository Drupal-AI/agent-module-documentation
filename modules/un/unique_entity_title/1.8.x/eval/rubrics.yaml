rubrics:
- id: unique_entity_title_purpose
  version: '1.0'
  applicable_bundles:
  - unique_entity_title
  checks:
  - kind: must_contain_any
    values:
    - UniqueEntityTitle
    - unique
    - constraint
    - per bundle
    - per-bundle
    - taxonomy
  scoring:
    combine: all_pass
- id: unique_entity_title_no_config_route
  version: '1.0'
  applicable_bundles:
  - unique_entity_title
  checks:
  - kind: must_contain_any
    values:
    - no central settings form
    - no configure route
    - no settings form
    - no admin settings form
    - per-bundle
    - third_party_settings
    - third-party setting
  - kind: must_not_contain
    values:
    - /admin/config/unique_entity_title
  scoring:
    combine: all_pass
- id: unique_entity_title_enable_content_type
  version: '1.0'
  applicable_bundles:
  - unique_entity_title
  checks:
  - kind: must_contain_any
    values:
    - node_type
    - setThirdPartySetting
    - '''unique_entity_title'', ''enabled'''
    - node.type.article.third_party.unique_entity_title
    - third_party.unique_entity_title.enabled
  scoring:
    combine: all_pass
- id: unique_entity_title_supported_entities
  version: '1.0'
  applicable_bundles:
  - unique_entity_title
  checks:
  - kind: must_contain_any
    values:
    - node
    - taxonomy_term
    - title
    - name
  scoring:
    combine: all_pass
- id: unique_entity_title_edit_behavior
  version: '1.0'
  applicable_bundles:
  - unique_entity_title
  checks:
  - kind: must_contain_any
    values:
    - 'No'
    - excludes the current entity
    - current entity is excluded
    - '!='
    - trim
  scoring:
    combine: all_pass
- id: unique_entity_title_no_drush_no_perms
  version: '1.0'
  applicable_bundles:
  - unique_entity_title
  checks:
  - kind: must_contain_any
    values:
    - No Drush
    - no Drush commands
    - No permissions
    - no permissions
    - third-party setting
    - third_party_settings
  scoring:
    combine: all_pass
