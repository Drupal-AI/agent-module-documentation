metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: unique_content_field_validation
  version: 2.0.x
  note: 'Unique Content Field Validation has NO settings page, no configure route, no permissions and
    no Drush. Uniqueness is stored as third_party_settings under the ''unique_content_field_validation''
    provider on three config objects: node.type.<bundle> (title), taxonomy.vocabulary.<vid> (name), and
    field.field.<entity>.<bundle>.<field> (field value, plus unique_multivalue for multi-value fields).
    Field enforcement is a widget #element_validate entityQuery; title/name enforcement is the UniqueContentTitle
    constraint that only fires when the bundle''s third-party ''unique'' flag is TRUE. Medium/hard cases
    read/write those third_party_settings on the standard Article node type and on a namespaced field_ucfv_*
    field, verified with drush against live config. Baseline for node.type.article has NO such third-party
    setting; cleanup/reset unset it.'
questions:
- id: ucfv-field-unique-how
  input: On a Drupal 11 site with unique_content_field_validation enabled, how do I make a single field's
    value unique so no two Articles can have the same value? There is no module settings page — where
    do I set it?
  criteria: 'Edit the field (Manage fields -> field -> Edit) and tick the ''Unique'' checkbox in the Unique
    fieldset; it is stored as third_party_settings.unique_content_field_validation.unique: true on field.field.<entity>.<bundle>.<field>.'
  bundle: unique_content_field_validation
  rubric_ref: rubric/unique_content_field_validation_ucfv_field_unique_how@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: ucfv-title-name-unique
  input: How do I make node titles unique per content type, and taxonomy term names unique per vocabulary,
    using unique_content_field_validation?
  criteria: Tick 'Unique' on the content type edit form (stored on node.type.<bundle>) for the title,
    and on the vocabulary edit form (stored on taxonomy.vocabulary.<vid>) for the term name. Enforcement
    is the UniqueContentTitle constraint that fires when that third-party 'unique' flag is true.
  bundle: unique_content_field_validation
  rubric_ref: rubric/unique_content_field_validation_ucfv_title_name_unique@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: ucfv-multivalue-message
  input: With unique_content_field_validation, how do I prevent the same value being entered twice within
    one multi-value field, and how do I customise the duplicate error message?
  criteria: On a multi-value field, tick 'Do not allow same value' (unique_multivalue) and set unique_multivalue_text.
    Messages support %label (field label) and %value (the duplicate value) tokens.
  bundle: unique_content_field_validation
  rubric_ref: rubric/unique_content_field_validation_ucfv_multivalue_message@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: ucfv-article-title-known
  input: On this Drupal site, inspect the Article content type's configuration and state whether unique_content_field_validation
    is enforcing unique Article titles, and via which setting.
  criteria: Yes — node.type.article has third_party_settings.unique_content_field_validation.unique =
    true, so Article titles must be unique.
  bundle: unique_content_field_validation
  rubric_ref: rubric/unique_content_field_validation_ucfv_article_title_known@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/ucfv-article-title-known-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/ucfv-article-title-known-cleanup.sh
- id: ucfv-known-field
  input: The Article content type on this site has a text field configured as unique via unique_content_field_validation.
    Inspect the live field configuration and give the machine name of that field.
  criteria: 'The field is field_ucfv_known: field.field.node.article.field_ucfv_known has third_party_settings.unique_content_field_validation.unique
    = true.'
  bundle: unique_content_field_validation
  rubric_ref: rubric/unique_content_field_validation_ucfv_known_field@1.0
