rubrics:
- id: unique_content_field_validation_ucfv_field_unique_how
  version: '1.0'
  applicable_bundles:
  - unique_content_field_validation
  checks:
  - kind: must_contain_any
    values:
    - Unique
    - third_party
    - field settings
    - Manage fields
    - checkbox
    - field config
  scoring:
    combine: all_pass
- id: unique_content_field_validation_ucfv_title_name_unique
  version: '1.0'
  applicable_bundles:
  - unique_content_field_validation
  checks:
  - kind: must_contain_any
    values:
    - content type
    - node type
    - title
    - vocabulary
    - term
    - third_party
    - UniqueContentTitle
  scoring:
    combine: all_pass
- id: unique_content_field_validation_ucfv_multivalue_message
  version: '1.0'
  applicable_bundles:
  - unique_content_field_validation
  checks:
  - kind: must_contain_any
    values:
    - unique_multivalue
    - same value
    - multivalue
    - '%value'
    - '%label'
  scoring:
    combine: all_pass
- id: unique_content_field_validation_ucfv_article_title_known
  version: '1.0'
  applicable_bundles:
  - unique_content_field_validation
  checks:
  - kind: must_contain_any
    values:
    - unique
    - 'true'
    - 'yes'
    - enforce
  scoring:
    combine: all_pass
- id: unique_content_field_validation_ucfv_known_field
  version: '1.0'
  applicable_bundles:
  - unique_content_field_validation
  checks:
  - kind: must_contain_any
    values:
    - field_ucfv_known
  scoring:
    combine: all_pass
- id: unique_content_field_validation_ucfv_make_title_unique
  version: '1.0'
  applicable_bundles:
  - unique_content_field_validation
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
- id: unique_content_field_validation_ucfv_make_field_unique
  version: '1.0'
  applicable_bundles:
  - unique_content_field_validation
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
