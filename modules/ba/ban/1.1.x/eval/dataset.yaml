metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: ban
  version: 1.1.x
  note: 'This is the contrib drupal/ban module (machine name ''ban''), the continuation of former core
    Ban. Banned IPs live in the ban_ip DB table and are managed by the ban.ip_manager service (BanIpManager:
    banIp/unbanIp/isBanned/findAll/findById/unbanAllIps); enforced by ban.middleware (403). Admin UI at
    /admin/config/people/ban (route ban.admin_page, permission ''ban IP addresses''); single IPv4/IPv6
    only, no subnet ranges in the ban list. Allowlist is settings.php only: $settings[''ban_allowlist'']
    (IPs or CIDR). CLI commands ban:ban/ban:unban/ban:list/ban:flush are Symfony Console commands. No
    config object. Medium/hard use documentation IPs (RFC 5737 TEST-NET) via ban.ip_manager: medium reads
    back a banned IP, hard bans a target IP and verifies isBanned.'
questions:
- id: ban-add-and-allowlist
  input: On a Drupal site using the contrib Ban module, where do I ban an IP address in the UI, and how
    do I make sure a trusted IP or subnet can never be banned?
  criteria: Ban an IP at Configuration > People > IP address bans (/admin/config/people/ban). To protect
    trusted addresses define $settings['ban_allowlist'] in settings.php (single IPs or CIDR subnet ranges,
    IPv4/IPv6) - allowlisted addresses can never be banned.
  bundle: ban
  rubric_ref: rubric/ban_ban_add_and_allowlist@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: ban-cli-commands
  input: Which command-line commands does the Ban module provide to ban, unban, list, and clear banned
    IP addresses?
  criteria: ban:ban <ip>, ban:unban <ip>, ban:list, and ban:flush - Symfony Console commands runnable
    via the Drupal CLI (dr) or Drush.
  bundle: ban
  rubric_ref: rubric/ban_ban_cli_commands@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: ban-service-and-storage
  input: In the Drupal Ban module, which service do I use to ban an IP or check if one is banned from
    custom code, and where are banned IPs stored?
  criteria: 'Use the ban.ip_manager service (BanIpManager): banIp(), unbanIp(), isBanned(), findAll(),
    unbanAllIps(). Banned IPs are stored in the ban_ip database table.'
  bundle: ban
  rubric_ref: rubric/ban_ban_service_and_storage@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: ban-known-ip
  input: On this Drupal site, exactly one IP address is currently banned via the Ban module. Inspect the
    live ban list and give that IP address.
  criteria: The banned IP is 203.0.113.77 (e.g. drush ban:list, or \Drupal::service('ban.ip_manager')->findAll(),
    or SELECT ip FROM ban_ip).
  bundle: ban
  rubric_ref: rubric/ban_ban_known_ip@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/ban-known-ip-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/ban-known-ip-cleanup.sh
- id: ban-add-ip
  input: On this Drupal site, use the Ban module to ban the IP address 198.51.100.42 so that visits from
    it would be blocked. Apply the change to the live site.
  criteria: 198.51.100.42 is added to the ban list so ban.ip_manager isBanned() returns TRUE (e.g. `drush
    ban:ban 198.51.100.42`, or the 'Ban IP address' form at /admin/config/people/ban, or \Drupal::service('ban.ip_manager')->banIp('198.51.100.42')).
  bundle: ban
  rubric_ref: rubric/ban_ban_add_ip@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/ban-add-ip-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/ban-add-ip-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/ban-add-ip-verify.sh
- id: ban-known-ip2
  input: On this Drupal site the Ban module has one IP address on its ban list. Inspect the live ban list
    and give that IP address.
  criteria: The banned IP is 192.0.2.55 (drush ban:list, ban.ip_manager->findAll(), or SELECT ip FROM
    ban_ip).
  bundle: ban
  rubric_ref: rubric/ban_ban_known_ip2@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/ban-known-ip2-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/ban-known-ip2-cleanup.sh
- id: ban-unban-ip
  input: On this Drupal site the Ban module currently has the IP address 192.0.2.99 on its ban list. Remove
    the ban on 192.0.2.99 so that address is no longer blocked. Apply the change to the live site.
  criteria: 192.0.2.99 is removed from the ban list so ban.ip_manager isBanned() returns FALSE (e.g. `drush
    ban:unban 192.0.2.99`, the 'Unban' action at /admin/config/people/ban, or \Drupal::service('ban.ip_manager')->unbanIp('192.0.2.99')).
  bundle: ban
  rubric_ref: rubric/ban_ban_unban_ip@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/ban-unban-ip-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/ban-unban-ip-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/ban-unban-ip-verify.sh
