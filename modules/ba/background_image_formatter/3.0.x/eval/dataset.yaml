    cleanup: agent-module-documentation/evaluation/verify/background_image_formatter-css-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/background_image_formatter-css-verify.sh
- id: background_image_formatter-set-inline-linked
  input: On this Drupal site there is a content type bif_task2 with an image field field_bif_link. Configure
    its default view display to use the Background Image formatter with inline output (output type 'inline')
