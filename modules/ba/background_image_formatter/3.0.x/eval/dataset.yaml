metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: background_image_formatter
  version: 3.0.x
  note: 'Background Image Formatter provides two field formatters that render an image as a CSS background-image
    instead of an <img>: background_image_formatter (for image fields, extends core ImageFormatter) and
    background_media_image_formatter (for entity_reference fields targeting media). No configure route
    (configure=null), no settings form, no permissions, no Drush. Shared formatter settings: image_style,
    background_image_output_type (inline|css), background_image_selector, background_image_link (bool),
    background_image_link_custom (tokens when Token enabled). Configured on a field''s Manage display;
    stored in core.entity_view_display.<entity>.<bundle>.<mode> -> content.<field>.type + settings. Inline
    output renders the background_image_formatter_inline theme; css output injects a <style> into html_head.
    Medium/hard cases are grounded in real entity_view_display config on namespaced content types (bif_*).'
questions:
- id: background_image_formatter-how
  input: On a Drupal 11 site I want an image field to render as a CSS background-image (on a div) rather
    than an <img> tag. Which module/formatter does this, and what are its two output modes?
  criteria: Use the Background Image Formatter module and set the image field's Format (Manage display)
    to 'Background Image' (background_image_formatter). Its background_image_output_type is either 'inline'
    (a div with a style attribute) or 'css' (a <style> rule injected into the page head).
  bundle: background_image_formatter
  rubric_ref: rubric/background_image_formatter_background_image_formatter_how@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: background_image_formatter-settings
  input: What settings does the Background Image formatter expose on a field's Manage display?
  criteria: 'image_style (image style machine name or empty for original), background_image_output_type
    (inline|css), background_image_selector (CSS selector), background_image_link (bool, inline only:
    wrap in a link to the content), and background_image_link_custom (custom link URL, supports tokens
    when Token is enabled).'
  bundle: background_image_formatter
  rubric_ref: rubric/background_image_formatter_background_image_formatter_settings@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: background_image_formatter-media
  input: I don't have a plain image field; I have a Media reference field. Can Background Image Formatter
    use that as a background, and which formatter applies?
  criteria: Yes. Use the background_media_image_formatter, which applies to entity_reference fields whose
    target type is media; it reads the referenced media entity's thumbnail image and renders it as the
    background.
  bundle: background_image_formatter
  rubric_ref: rubric/background_image_formatter_background_image_formatter_media@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: background_image_formatter-read-selector
  input: On this Drupal site, an image field is configured with the Background Image formatter. Inspect
    the live display configuration and report the CSS selector and the output type (inline or css) it
    uses.
  criteria: On node.bif_selct the field_bif_hero display uses background_image_formatter with background_image_selector
    '.bif-eval-hero' and background_image_output_type 'css' (core.entity_view_display.node.bif_selct.default
    -> content.field_bif_hero.settings).
  bundle: background_image_formatter
  rubric_ref: rubric/background_image_formatter_background_image_formatter_read_selector@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/background_image_formatter-selector-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/background_image_formatter-selector-cleanup.sh
- id: background_image_formatter-read-style
  input: On this site a content type has an image field displayed with the Background Image formatter.
    Inspect the live display config and state which image style it applies and whether it outputs inline
    or via a CSS rule.
  criteria: On node.bif_stylect the field_bif_style display uses background_image_formatter with image_style
    'thumbnail' and background_image_output_type 'inline'.
  bundle: background_image_formatter
  rubric_ref: rubric/background_image_formatter_background_image_formatter_read_style@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/background_image_formatter-style-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/background_image_formatter-style-cleanup.sh
- id: background_image_formatter-set-css
  input: On this Drupal site there is a content type bif_task with an image field field_bif_task. Configure
    its default view display to use the Background Image formatter, outputting the background as a CSS
    rule (output type 'css') for the CSS selector `.bif-hero`. Apply the change to the live site.
  criteria: On core.entity_view_display.node.bif_task.default set the field_bif_task component to type
    background_image_formatter with settings.background_image_output_type='css' and settings.background_image_selector='.bif-hero'
    (via Manage display or setComponent(...)->save()).
  bundle: background_image_formatter
  rubric_ref: rubric/background_image_formatter_background_image_formatter_set_css@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
