metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: base_field_override_ui
  version: 1.2.x
  note: 'Base Field Override UI adds a ''Base fields Override'' tab on each Field-UI entity type''s Manage
    fields page for overriding the label and description of code-defined base fields per bundle. It edits
    CORE''s base_field_override config entity (core.base_field_override.<entity_type>.<bundle>.<field_name>);
    it ships no config entity/schema/permission/plugin/Drush of its own and configure=null. Access uses
    core permission ''administer <entity_type> fields''; only entity types with a field_ui_base_route
    get the tab. Programmatic path: BaseFieldOverride::createFromBaseFieldDefinition($def, $bundle)->setLabel(...)->save().
    Medium/hard cases are grounded in that real core.base_field_override config.'
questions:
- id: bfoui-what-tab
  input: After enabling base_field_override_ui, where in the Drupal admin UI do you override a base field
    (like a node's Title), and which two attributes of the base field can you change?
  criteria: A 'Base fields Override' secondary tab appears on the entity type's Manage fields page (e.g.
    /admin/structure/types/manage/article/fields). From there you add/edit/delete an override that changes
    the base field's label and description for that bundle.
  bundle: base_field_override_ui
  rubric_ref: rubric/base_field_override_ui_bfoui_what_tab@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: bfoui-where-stored
  input: base_field_override_ui does not define its own config entity. Which existing Drupal config entity
    does it edit, and what is the config name for an override of the Article node type's title base field?
  criteria: It edits core's base_field_override config entity; the Article title override is stored as
    core.base_field_override.node.article.title with the overridden label and description.
  bundle: base_field_override_ui
  rubric_ref: rubric/base_field_override_ui_bfoui_where_stored@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: bfoui-access
  input: Which entity types get the base_field_override_ui tab, and what permission controls access to
    the base-field override list for an entity type?
  criteria: Only entity types that declare a field_ui_base_route get the 'Base fields Override' tab. Access
    to the list is controlled by the core permission 'administer <entity_type> fields' (e.g. 'administer
    node fields').
  bundle: base_field_override_ui
  rubric_ref: rubric/base_field_override_ui_bfoui_access@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: bfoui-title-known
  input: On this Drupal site the Article content type's Title base field has been overridden via base_field_override_ui.
    Inspect the live configuration and report the overridden label now shown for the Article Title field.
  criteria: core.base_field_override.node.article.title has label 'Headline' (read with `drush cget core.base_field_override.node.article.title
    label`).
  bundle: base_field_override_ui
  rubric_ref: rubric/base_field_override_ui_bfoui_title_known@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/bfoui-title-known-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/bfoui-title-known-cleanup.sh
- id: bfoui-created-known
  input: On this site, one of the Article content type's base fields has a base-field override applied.
    Inspect the live base_field_override configuration for node.article and report the overridden label
    set on the 'Authored on' (created) base field.
  criteria: core.base_field_override.node.article.created has label 'Publish Date'.
  bundle: base_field_override_ui
  rubric_ref: rubric/base_field_override_ui_bfoui_created_known@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/bfoui-created-known-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/bfoui-created-known-cleanup.sh
- id: bfoui-override-title
  input: On this Drupal site, use base_field_override_ui's mechanism to override the Article content type's
    Title base field so its label reads 'Article Headline'. Apply the change to the live site.
  criteria: core.base_field_override.node.article.title exists with label 'Article Headline' (e.g. BaseFieldOverride::createFromBaseFieldDefinition($titleDef,'article')->setLabel('Article
    Headline')->save(), or via the Base fields Override tab).
  bundle: base_field_override_ui
  rubric_ref: rubric/base_field_override_ui_bfoui_override_title@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/bfoui-override-title-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/bfoui-override-title-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/bfoui-override-title-verify.sh
- id: bfoui-override-uid
  input: On this Drupal site, create a base field override (via base_field_override_ui) that relabels
    the Article content type's 'Authored by' (uid) base field to 'Author Account'. Apply it to the live
    site.
  criteria: core.base_field_override.node.article.uid exists with label 'Author Account'.
  bundle: base_field_override_ui
  rubric_ref: rubric/base_field_override_ui_bfoui_override_uid@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/bfoui-override-uid-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/bfoui-override-uid-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/bfoui-override-uid-verify.sh
