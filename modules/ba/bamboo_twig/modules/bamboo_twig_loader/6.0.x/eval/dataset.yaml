    verify: agent-module-documentation/evaluation/verify/bamboo_twig_loader-render-account-verify.sh
- id: bamboo_twig_loader-render-user
  input: Using bamboo_twig_loader, create a Twig template at web/sites/default/files/bamboo_twig_loader_render_user.html.twig
    whose rendered output contains user 1's account (login) name, obtained by loading or rendering user
    entity 1 with a Bamboo Twig function.
  criteria: e.g. {{ bamboo_load_entity('user', 1).getAccountName() }} or {{ bamboo_render_field('name',
    'user', 1) }}; rendered output contains the live username of user 1 (admin).
  bundle: bamboo_twig_loader
