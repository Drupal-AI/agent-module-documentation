metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: bamboo_twig_loader
  version: 6.0.x
  note: 'bamboo_twig_loader (submodule of bamboo_twig) provides bamboo_load_* (return objects) on service
    bamboo_twig_loader.twig.loader and bamboo_render_* (return render arrays, is_safe html) on bamboo_twig_loader.twig.render:
    render_block/form/entity/entity_revision/region/field/image/image_style/menu/views, load_entity/entity_revision/field/currentuser/image.
    id omitted -> current route entity. Medium/hard cases use USER entities (namespaced bts_loader_* /
    bamboo_render_user_71, uid stored in State bamboo_loader_uid*) rather than nodes, because node creation
    is currently blocked site-wide by a corrupt node_access table; user create/delete is unaffected. The
    agent loads/renders the seeded user via bamboo_load_entity / bamboo_render_field; verify renders the
    agent''s template (under web/sites/default/files/) and checks output. Fixtures cleaned by name/uid
    from State.'
questions:
- id: bamboo_twig_loader-render-entity
  input: With bamboo_twig_loader, how do I render an entity in a chosen view mode from a Twig template,
    and what happens if I omit the entity id?
  criteria: bamboo_render_entity(entity_type, id = null, view_mode = '', langcode = null), e.g. {{ bamboo_render_entity('node',
    5, 'teaser') }}. If id is omitted the entity is taken from the current route.
  bundle: bamboo_twig_loader
  rubric_ref: rubric/bamboo_twig_loader_bamboo_twig_loader_render_entity@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: bamboo_twig_loader-render-block-region
  input: Which bamboo_twig_loader functions render a configured block by plugin id and all blocks in a
    theme region?
  criteria: bamboo_render_block(block_id, params = {}, wrapper = false) renders a block plugin by id;
    bamboo_render_region(region, theme = null) renders every block in a region.
  bundle: bamboo_twig_loader
  rubric_ref: rubric/bamboo_twig_loader_bamboo_twig_loader_render_block_region@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: bamboo_twig_loader-load-vs-render
  input: In bamboo_twig_loader, what is the difference between the bamboo_load_* functions and the bamboo_render_*
    functions, and which one gives me the current user object?
  criteria: bamboo_load_* return objects (entities, fields, current user, image) while bamboo_render_*
    return render arrays (marked is_safe html). bamboo_load_currentuser() returns the current User entity
    (null when anonymous).
  bundle: bamboo_twig_loader
  rubric_ref: rubric/bamboo_twig_loader_bamboo_twig_loader_load_vs_render@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: bamboo_twig_loader-known-user-mail
  input: On this Drupal site a user account was created and its uid stored in the State key bamboo_loader_uid.
    Using bamboo_twig_loader (bamboo_load_entity) or drush, load that user and report its email address.
  criteria: The user's email is loader-ocelot-4242@example.com (uid stored in State bamboo_loader_uid;
    load with bamboo_load_entity('user', uid)).
  bundle: bamboo_twig_loader
  rubric_ref: rubric/bamboo_twig_loader_bamboo_twig_loader_known_user_mail@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/bamboo_twig_loader-known-user-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/bamboo_twig_loader-known-user-cleanup.sh
- id: bamboo_twig_loader-known-username
  input: A user account's uid is stored in State key bamboo_loader_uid2 on this site. Load that user (bamboo_twig_loader
    or drush) and report its account (login) name.
  criteria: The account name is bts_loader_marker_qx99 (uid in State bamboo_loader_uid2).
  bundle: bamboo_twig_loader
  rubric_ref: rubric/bamboo_twig_loader_bamboo_twig_loader_known_username@1.0
  tags:
