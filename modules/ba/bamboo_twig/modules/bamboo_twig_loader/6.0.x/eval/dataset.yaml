    cleanup: agent-module-documentation/evaluation/verify/bamboo_twig_loader-known-username-cleanup.sh
- id: bamboo_twig_loader-render-account
  input: A user account exists whose uid is stored in State key bamboo_loader_render_uid. Using bamboo_twig_loader,
    create a Twig template at web/sites/default/files/bamboo_twig_loader_render_account.html.twig whose
    rendered output contains that user's account name.
  criteria: Read the uid from State (drush state:get bamboo_loader_render_uid) and write e.g. {{ bamboo_render_field('name',
    'user', <uid>) }} or {{ bamboo_load_entity('user', <uid>).getAccountName() }}; rendered output contains
    'bamboo_render_user_71'.
  bundle: bamboo_twig_loader
  rubric_ref: rubric/bamboo_twig_loader_bamboo_twig_loader_render_account@1.0
  tags:
