metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: bamboo_twig_token
  version: 6.0.x
  note: 'bamboo_twig_token (submodule of bamboo_twig) registers one Twig function bamboo_token(token,
    data={}, options={}) on service bamboo_twig_token.twig.token, wrapping \Drupal::token()->replace("[$token]",
    $data, $options) — pass the token WITHOUT brackets. Medium cases are live introspection (what site
    tokens resolve to). Hard cases have the agent write a Twig template (under web/sites/default/files/)
    rendered by verify: print the site name via a token (dynamic), and print the current year via a date
    token.'
questions:
- id: bamboo_twig_token-signature
  input: How do I use bamboo_token in a Twig template, and do I include the square brackets around the
    token name?
  criteria: bamboo_token(token, data = {}, options = {}) — pass the token WITHOUT brackets (the function
    adds them), e.g. {{ bamboo_token('site:name') }}.
  bundle: bamboo_twig_token
  rubric_ref: rubric/bamboo_twig_token_bamboo_twig_token_signature@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: bamboo_twig_token-data
  input: How do I resolve a node token like node:title with bamboo_token, given it needs a node object?
  criteria: 'Pass the object in the data hash: {{ bamboo_token(''node:title'', {''node'': node}) }}.'
  bundle: bamboo_twig_token
  rubric_ref: rubric/bamboo_twig_token_bamboo_twig_token_data@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: bamboo_twig_token-clear
  input: Which option do I pass to bamboo_token to strip out any tokens that could not be replaced?
  criteria: 'Pass {''clear'': true} as the options argument, e.g. {{ bamboo_token(''user:mail'', {''user'':
    user}, {''clear'': true}) }}.'
  bundle: bamboo_twig_token
  rubric_ref: rubric/bamboo_twig_token_bamboo_twig_token_clear@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: bamboo_twig_token-live-name
  input: On this live Drupal site, what string does bamboo_token('site:name') return? Run it on the running
    site to find out.
  criteria: It returns the site name, which on this site is 'module-documentor'.
  bundle: bamboo_twig_token
  rubric_ref: rubric/bamboo_twig_token_bamboo_twig_token_live_name@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/bamboo_twig_token-live-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/bamboo_twig_token-live-cleanup.sh
- id: bamboo_twig_token-live-url
  input: On this live site, what does bamboo_token('site:url') return? Confirm against the running site.
  criteria: It returns the site base URL, https://module-documentor.ddev.site/.
  bundle: bamboo_twig_token
  rubric_ref: rubric/bamboo_twig_token_bamboo_twig_token_live_url@1.0
  tags:
