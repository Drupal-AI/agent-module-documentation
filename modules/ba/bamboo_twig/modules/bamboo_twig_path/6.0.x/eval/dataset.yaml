metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: bamboo_twig_path
  version: 6.0.x
  note: 'bamboo_twig_path (submodule of bamboo_twig) registers one Twig function bamboo_path_system(type,
    name=null) on service bamboo_twig_path.twig.path, wrapping extension.path.resolver->getPath(). type
    is core/profile/module/theme/theme_engine; returns the path relative to the Drupal root (empty string
    if not found). Medium cases are live introspection (path to olivero theme, to the bamboo_twig module).
    Hard cases have the agent write a Twig template (under web/sites/default/files/) rendered by verify:
    module path modules/contrib/bamboo_twig/bamboo_twig_path, theme path core/themes/olivero.'
questions:
- id: bamboo_twig_path-signature
  input: What does bamboo_path_system do and what are its arguments and allowed type values?
  criteria: bamboo_path_system(type, name = null) returns the filesystem path (relative to the Drupal
    root) of an extension; type is one of core, profile, module, theme, theme_engine (name ignored for
    core).
  bundle: bamboo_twig_path
  rubric_ref: rubric/bamboo_twig_path_bamboo_twig_path_signature@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: bamboo_twig_path-example
  input: Show a bamboo_path_system call that returns the path to a module named bamboo_twig in a Twig
    template.
  criteria: '{{ bamboo_path_system(''module'', ''bamboo_twig'') }} -> modules/contrib/bamboo_twig.'
  bundle: bamboo_twig_path
  rubric_ref: rubric/bamboo_twig_path_bamboo_twig_path_example@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: bamboo_twig_path-notfound
  input: What does bamboo_path_system return when the requested item is not found, and does it need a
    name for type 'core'?
  criteria: It returns an empty string when the item is not found; the name argument is ignored for type
    'core'.
  bundle: bamboo_twig_path
  rubric_ref: rubric/bamboo_twig_path_bamboo_twig_path_notfound@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: bamboo_twig_path-live-theme
  input: On this live Drupal site, using bamboo_path_system, what is the filesystem path to the 'olivero'
    theme?
  criteria: bamboo_path_system('theme', 'olivero') returns core/themes/olivero.
  bundle: bamboo_twig_path
  rubric_ref: rubric/bamboo_twig_path_bamboo_twig_path_live_theme@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/bamboo_twig_path-live-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/bamboo_twig_path-live-cleanup.sh
- id: bamboo_twig_path-live-module
  input: On this live site, using bamboo_path_system, what path does it return for the 'bamboo_twig' module?
  criteria: bamboo_path_system('module', 'bamboo_twig') returns modules/contrib/bamboo_twig.
  bundle: bamboo_twig_path
  rubric_ref: rubric/bamboo_twig_path_bamboo_twig_path_live_module@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/bamboo_twig_path-live-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/bamboo_twig_path-live-cleanup.sh
- id: bamboo_twig_path-render-module
  input: Using bamboo_twig_path, create a Twig template at web/sites/default/files/bamboo_twig_path_render_module.html.twig
    whose rendered output contains the filesystem path to the bamboo_twig_path module.
  criteria: Write {{ bamboo_path_system('module', 'bamboo_twig_path') }}; rendered output contains modules/contrib/bamboo_twig/bamboo_twig_path.
  bundle: bamboo_twig_path
  rubric_ref: rubric/bamboo_twig_path_bamboo_twig_path_render_module@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/bamboo_twig_path-render-module-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/bamboo_twig_path-render-module-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/bamboo_twig_path-render-module-verify.sh
- id: bamboo_twig_path-render-theme
  input: Using bamboo_twig_path, create a Twig template at web/sites/default/files/bamboo_twig_path_render_theme.html.twig
    whose rendered output contains the filesystem path to the olivero theme.
  criteria: Write {{ bamboo_path_system('theme', 'olivero') }}; rendered output contains core/themes/olivero.
  bundle: bamboo_twig_path
  rubric_ref: rubric/bamboo_twig_path_bamboo_twig_path_render_theme@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/bamboo_twig_path-render-theme-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/bamboo_twig_path-render-theme-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/bamboo_twig_path-render-theme-verify.sh
