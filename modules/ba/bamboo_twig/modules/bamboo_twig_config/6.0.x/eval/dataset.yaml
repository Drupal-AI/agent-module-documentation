metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: bamboo_twig_config
  version: 6.0.x
  note: 'bamboo_twig_config (submodule of bamboo_twig) registers three Twig getters on service bamboo_twig_config.twig.config:
    bamboo_config_get(name, key) -> config.factory->get(name)->get(key); bamboo_settings_get(key) -> Settings::get(key)
    from settings.php; bamboo_state_get(key) -> State API. Medium cases seed a namespaced State value
    read back via bamboo_state_get/drush. Hard cases have the agent write a Twig template (under web/sites/default/files/)
    that a verify script renders through Drupal''s twig service, checking output against the live site
    name (bamboo_config_get) or a seeded State value (bamboo_state_get). Fixtures use bamboo_config_*
    State keys.'
questions:
- id: bamboo_twig_config-config-get
  input: With bamboo_twig_config, which Twig function reads a Drupal Config API value in a template, and
    what are its arguments? Give an example that prints the site name.
  criteria: bamboo_config_get(name, key) maps to \Drupal::config(name)->get(key), e.g. {{ bamboo_config_get('system.site',
    'name') }}.
  bundle: bamboo_twig_config
  rubric_ref: rubric/bamboo_twig_config_bamboo_twig_config_config_get@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: bamboo_twig_config-state-get
  input: How do I read a Drupal State API value from a Twig template using bamboo_twig_config?
  criteria: bamboo_state_get(key) returns \Drupal::state()->get(key), e.g. {{ bamboo_state_get('system.cron_last')
    }}.
  bundle: bamboo_twig_config
  rubric_ref: rubric/bamboo_twig_config_bamboo_twig_config_state_get@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: bamboo_twig_config-settings-get
  input: Which bamboo_twig_config function returns a value from settings.php, and how does it differ from
    the config getter?
  criteria: bamboo_settings_get(key) reads a settings.php value via the Settings singleton (single key
    argument), whereas bamboo_config_get(name, key) reads a Config API object (two arguments).
  bundle: bamboo_twig_config
  rubric_ref: rubric/bamboo_twig_config_bamboo_twig_config_settings_get@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: bamboo_twig_config-known-state
