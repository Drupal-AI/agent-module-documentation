metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: bamboo_twig_security
  version: 6.0.x
  note: bamboo_twig_security (submodule of bamboo_twig) registers bamboo_has_permission(permission, user=null),
    bamboo_has_permissions(permissions[], conjunction='AND', user=null), bamboo_has_role(role, user=null),
    bamboo_has_roles(roles[], conjunction='AND', user=null) on service bamboo_twig_security.twig.security.
    user omitted = current user; anonymous/missing user -> null; invalid conjunction throws. Medium cases
    seed a namespaced role/user (bts_sec_*/bts_perm_*) and grade the agent's read-back. Hard cases have
    the agent write a Twig template (under web/sites/default/files/) that a verify script renders, checking
    the role/permission answer for user 1 (admin) computed live. Fixtures are namespaced bts_*.
questions:
- id: bamboo_twig_security-has-permission
  input: In bamboo_twig_security, which Twig function checks whether a user has a given permission, and
    what happens if you omit the user argument?
  criteria: bamboo_has_permission(permission, user = null); when user is omitted it checks the current
    user. It returns null for an anonymous or missing user.
  bundle: bamboo_twig_security
  rubric_ref: rubric/bamboo_twig_security_bamboo_twig_security_has_permission@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: bamboo_twig_security-conjunction
  input: How do I check a collection of roles at once with bamboo_twig_security, and what conjunction
    values are allowed?
  criteria: bamboo_has_roles(roles[], conjunction = 'AND', user = null) (and bamboo_has_permissions similarly);
    conjunction must be 'AND' or 'OR' — any other value throws InvalidArgumentException.
  bundle: bamboo_twig_security
  rubric_ref: rubric/bamboo_twig_security_bamboo_twig_security_conjunction@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: bamboo_twig_security-has-role
  input: With bamboo_twig_security, how do I check whether a specific user (by uid) has a role in a Twig
    template? What does it return for an anonymous user?
  criteria: bamboo_has_role(role, user = null); pass the uid as the second argument, e.g. bamboo_has_role('administrator',
    1). For an anonymous or non-existent user it returns null.
  bundle: bamboo_twig_security
  rubric_ref: rubric/bamboo_twig_security_bamboo_twig_security_has_role@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: bamboo_twig_security-known-role
  input: On this Drupal site, does the user 'bts_sec_user' have the role 'bts_sec_role'? Inspect the live
    site (via bamboo_twig_security or drush) and answer yes or no.
  criteria: Yes — bts_sec_user was assigned the bts_sec_role role (bamboo_has_role('bts_sec_role', <uid>)
    is true).
  bundle: bamboo_twig_security
  rubric_ref: rubric/bamboo_twig_security_bamboo_twig_security_known_role@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/bamboo_twig_security-known-role-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/bamboo_twig_security-known-role-cleanup.sh
- id: bamboo_twig_security-known-perm
  input: On this Drupal site the user 'bts_perm_user' has been granted, through its role, one notable
    node-management permission. Inspect the live site and name that permission.
  criteria: bts_perm_user holds 'administer nodes' via the bts_perm_role role (bamboo_has_permission('administer
    nodes', <uid>) is true).
  bundle: bamboo_twig_security
  rubric_ref: rubric/bamboo_twig_security_bamboo_twig_security_known_perm@1.0
  tags:
  - mode:introspection
  - difficulty:medium
