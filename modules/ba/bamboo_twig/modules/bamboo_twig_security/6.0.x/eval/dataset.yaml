    setup: agent-module-documentation/evaluation/verify/bamboo_twig_security-known-perm-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/bamboo_twig_security-known-perm-cleanup.sh
- id: bamboo_twig_security-render-hasrole
  input: Using bamboo_twig_security, create a Twig template at web/sites/default/files/bamboo_twig_security_render_hasrole.html.twig
    that prints the word HASROLE if user 1 has the 'administrator' role, and NOROLE otherwise. Use the
