rubrics:
- id: bamboo_twig_security_bamboo_twig_security_has_permission
  version: '1.0'
  applicable_bundles:
  - bamboo_twig_security
  checks:
  - kind: must_contain_any
    values:
    - bamboo_has_permission
    - current user
  scoring:
    combine: all_pass
- id: bamboo_twig_security_bamboo_twig_security_conjunction
  version: '1.0'
  applicable_bundles:
  - bamboo_twig_security
  checks:
  - kind: must_contain_any
    values:
    - bamboo_has_roles
    - AND
    - OR
  scoring:
    combine: all_pass
- id: bamboo_twig_security_bamboo_twig_security_has_role
  version: '1.0'
  applicable_bundles:
  - bamboo_twig_security
  checks:
  - kind: must_contain_any
    values:
    - bamboo_has_role
    - anonymous
    - 'null'
  scoring:
    combine: all_pass
- id: bamboo_twig_security_bamboo_twig_security_known_role
  version: '1.0'
  applicable_bundles:
  - bamboo_twig_security
  checks:
  - kind: must_contain_any
    values:
    - 'yes'
    - 'true'
    - has the role
    - has that role
    - does have
  scoring:
    combine: all_pass
- id: bamboo_twig_security_bamboo_twig_security_known_perm
  version: '1.0'
  applicable_bundles:
  - bamboo_twig_security
  checks:
  - kind: must_contain_any
    values:
    - administer nodes
  scoring:
    combine: all_pass
- id: bamboo_twig_security_bamboo_twig_security_render_hasrole
  version: '1.0'
  applicable_bundles:
  - bamboo_twig_security
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
- id: bamboo_twig_security_bamboo_twig_security_render_hasperm
  version: '1.0'
  applicable_bundles:
  - bamboo_twig_security
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
