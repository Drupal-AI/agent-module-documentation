metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: bamboo_twig_file
  version: 6.0.x
  note: 'bamboo_twig_file (submodule of bamboo_twig) registers on service bamboo_twig_file.twig.file:
    function bamboo_file_url_absolute(uri) -> file_url_generator->generateAbsoluteString(uri) (already-absolute
    or root-relative strings pass through; FALSE if no wrapper), and filter bamboo_file_extension_guesser
    -> best-guess extension for a MIME type via Symfony MimeTypes (or null). Medium cases are live introspection
    (extension for application/pdf, text/plain). Hard cases have the agent write a Twig template (under
    web/sites/default/files/) rendered by verify: guess pdf from application/pdf, and absolute URL for
    public://bamboo_file_probe.txt.'
questions:
- id: bamboo_twig_file-url-absolute
  input: Which bamboo_twig_file function turns a stream URI like public://logo.png into an absolute URL
    in a Twig template, and what does it do if the string is already absolute?
  criteria: bamboo_file_url_absolute(uri) returns an absolute URL via the file URL generator; strings
    already starting with http/https/'/' are returned unchanged, and it returns FALSE if no stream wrapper
    matches.
  bundle: bamboo_twig_file
  rubric_ref: rubric/bamboo_twig_file_bamboo_twig_file_url_absolute@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: bamboo_twig_file-ext-guesser
  input: How do I guess a file extension from a MIME type in a Twig template with bamboo_twig_file?
  criteria: Use the filter, e.g. {{ 'image/png' | bamboo_file_extension_guesser }} -> png (or null if
    none could be guessed).
  bundle: bamboo_twig_file
  rubric_ref: rubric/bamboo_twig_file_bamboo_twig_file_ext_guesser@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: bamboo_twig_file-which-is-filter
  input: In bamboo_twig_file, which of its two helpers is a Twig filter and which is a Twig function?
  criteria: bamboo_file_extension_guesser is a filter (mime | bamboo_file_extension_guesser); bamboo_file_url_absolute
    is a function (bamboo_file_url_absolute(uri)).
  bundle: bamboo_twig_file
  rubric_ref: rubric/bamboo_twig_file_bamboo_twig_file_which_is_filter@1.0
  tags:
  - mode:recipe
  - difficulty:easy
