  module: bamboo_twig_cacheable
  version: 6.0.x
  note: bamboo_twig_cacheable (submodule of bamboo_twig) registers one Twig function bamboo_attach_cacheable_metadata(cacheable_metadata)
    on service bamboo_twig_cacheable.twig.bubble_metadata. It returns a render array ['#cache' => array_intersect_key($input,
    {tags,contexts,max-age})] — keeping only tags/contexts/max-age and dropping other keys. Medium cases
    are live-registration/behaviour introspection. Hard cases have the agent write a Twig template (under
    web/sites/default/files/) that calls the function; the verify renders it inside a RenderContext and
    asserts the cache tag/context actually bubbled.
