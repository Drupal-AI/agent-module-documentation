metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: bamboo_twig_extensions
  version: 6.0.x
  note: 'bamboo_twig_extensions (submodule of bamboo_twig) ports three Twig-Extensions filters, PREFIXED
    bamboo_extensions_: bamboo_extensions_truncate(length=30, preserve=false, separator=''...'') (Text,
    needs env), bamboo_extensions_time_diff(now=null, unit=null, humanize=true) (Date, needs env), bamboo_extensions_shuffle
    (Array). Services bamboo_twig_extensions.twig.{text,date,array}. There is no bare ''truncate''/''wordwrap''
    filter. Medium cases are live introspection (truncate output, the real filter name). Hard cases have
    the agent write a Twig template (under web/sites/default/files/) rendered by verify: truncate ''Hello
    World Foo Bar'' to 8 (-> ''Hello Wo...''), and shuffle a 3-item list keeping all items.'
questions:
- id: bamboo_twig_extensions-filter-names
  input: What Twig filters does bamboo_twig_extensions add, and under what names (are they the bare Twig-Extensions
    names)?
  criteria: It registers bamboo_extensions_truncate (Text), bamboo_extensions_time_diff (Date) and bamboo_extensions_shuffle
    (Array) — prefixed with bamboo_extensions_, not the bare upstream names.
  bundle: bamboo_twig_extensions
  rubric_ref: rubric/bamboo_twig_extensions_bamboo_twig_extensions_filter_names@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: bamboo_twig_extensions-truncate-args
  input: How do I truncate a string to 100 characters without cutting mid-word using bamboo_twig_extensions?
  criteria: '{{ text | bamboo_extensions_truncate(100, true, ''…'') }} — the second argument (preserve=true)
    avoids cutting mid-word; the third is the separator.'
  bundle: bamboo_twig_extensions
  rubric_ref: rubric/bamboo_twig_extensions_bamboo_twig_extensions_truncate_args@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: bamboo_twig_extensions-time-diff
  input: Which bamboo_twig_extensions filter renders a human-readable relative time like '3 days ago'?
  criteria: bamboo_extensions_time_diff, e.g. {{ node.getCreatedTime | bamboo_extensions_time_diff }}.
  bundle: bamboo_twig_extensions
  rubric_ref: rubric/bamboo_twig_extensions_bamboo_twig_extensions_time_diff@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: bamboo_twig_extensions-live-truncate
  input: On this live Drupal site, what is the result of 'Hello World Foo Bar' | bamboo_extensions_truncate(8)?
    Run it on the site to confirm.
  criteria: It returns 'Hello Wo...' (truncated to 8 characters with the default '...' separator).
  bundle: bamboo_twig_extensions
  rubric_ref: rubric/bamboo_twig_extensions_bamboo_twig_extensions_live_truncate@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/bamboo_twig_extensions-live-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/bamboo_twig_extensions-live-cleanup.sh
- id: bamboo_twig_extensions-live-name
  input: On this live site, inspect the enabled bamboo_twig_extensions submodule and give the exact filter
    name it registers for truncating text (is it 'truncate' or something else?).
  criteria: The truncation filter is named bamboo_extensions_truncate (there is no bare 'truncate' filter
    from this submodule).
  bundle: bamboo_twig_extensions
  rubric_ref: rubric/bamboo_twig_extensions_bamboo_twig_extensions_live_name@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/bamboo_twig_extensions-live-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/bamboo_twig_extensions-live-cleanup.sh
- id: bamboo_twig_extensions-render-truncate
  input: Using bamboo_twig_extensions, create a Twig template at web/sites/default/files/bamboo_twig_extensions_render_truncate.html.twig
    whose rendered output is the string 'Hello World Foo Bar' truncated to 8 characters with the module's
    truncate filter.
  criteria: Write {{ 'Hello World Foo Bar' | bamboo_extensions_truncate(8) }}; rendered output is 'Hello
    Wo...'.
  bundle: bamboo_twig_extensions
  rubric_ref: rubric/bamboo_twig_extensions_bamboo_twig_extensions_render_truncate@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/bamboo_twig_extensions-render-truncate-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/bamboo_twig_extensions-render-truncate-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/bamboo_twig_extensions-render-truncate-verify.sh
- id: bamboo_twig_extensions-render-shuffle
  input: Using bamboo_twig_extensions, create a Twig template at web/sites/default/files/bamboo_twig_extensions_render_shuffle.html.twig
    that shuffles the list ['alpha', 'bravo', 'charlie'] with the module's shuffle filter and prints all
    three items (e.g. joined by commas).
  criteria: Write e.g. {{ ['alpha','bravo','charlie'] | bamboo_extensions_shuffle | join(',') }}; rendered
    output contains alpha, bravo and charlie (in some order).
  bundle: bamboo_twig_extensions
  rubric_ref: rubric/bamboo_twig_extensions_bamboo_twig_extensions_render_shuffle@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/bamboo_twig_extensions-render-shuffle-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/bamboo_twig_extensions-render-shuffle-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/bamboo_twig_extensions-render-shuffle-verify.sh
