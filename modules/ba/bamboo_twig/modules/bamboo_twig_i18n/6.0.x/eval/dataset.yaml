metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: bamboo_twig_i18n
  version: 6.0.x
  note: 'bamboo_twig_i18n (submodule of bamboo_twig) registers on service bamboo_twig_i18n.twig.i18n:
    function bamboo_i18n_current_lang() (current language id), filter bamboo_i18n_format_date (needs environment;
    date|bamboo_i18n_format_date(type=''medium'', format='''', timezone=null, langcode=null)), filter
    bamboo_i18n_get_translation (entity|bamboo_i18n_get_translation(langcode=null)). Medium cases are
    live-render introspection (current lang, format a fixed timestamp). Hard cases have the agent write
    a Twig template (under web/sites/default/files/) rendered by verify: output the current lang (en)
    and format timestamp 1000000000 as custom ''Y'' (2001).'
questions:
- id: bamboo_twig_i18n-current-lang
  input: Which bamboo_twig_i18n function returns the current language code in a Twig template?
  criteria: bamboo_i18n_current_lang() returns the current language id, e.g. 'en'.
  bundle: bamboo_twig_i18n
  rubric_ref: rubric/bamboo_twig_i18n_bamboo_twig_i18n_current_lang@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: bamboo_twig_i18n-format-date
  input: How do I format a date honouring Drupal's i18n in a Twig template with bamboo_twig_i18n, including
    a custom PHP date pattern?
  criteria: 'Use the filter date | bamboo_i18n_format_date(type = ''medium'', format = '''', timezone
    = null, langcode = null). For a custom pattern: {{ ts | bamboo_i18n_format_date(''custom'', ''d/m/Y'')
    }}.'
  bundle: bamboo_twig_i18n
  rubric_ref: rubric/bamboo_twig_i18n_bamboo_twig_i18n_format_date@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: bamboo_twig_i18n-get-translation
  input: Which bamboo_twig_i18n filter returns the correct translation of an entity for the current (or
    a given) language?
  criteria: entity | bamboo_i18n_get_translation(langcode = null) returns the entity's translation for
    the given or current language via the entity repository.
  bundle: bamboo_twig_i18n
  rubric_ref: rubric/bamboo_twig_i18n_bamboo_twig_i18n_get_translation@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: bamboo_twig_i18n-live-lang
  input: On this live Drupal site, what does bamboo_i18n_current_lang() return? Check the running site.
  criteria: It returns 'en' (the site's current language).
  bundle: bamboo_twig_i18n
  rubric_ref: rubric/bamboo_twig_i18n_bamboo_twig_i18n_live_lang@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/bamboo_twig_i18n-live-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/bamboo_twig_i18n-live-cleanup.sh
- id: bamboo_twig_i18n-live-format
  input: On this live site, using bamboo_i18n_format_date, what 4-digit year do you get when you format
    the UNIX timestamp 1000000000 with type 'custom' and format 'Y'? Render it on the running site to
    confirm.
  criteria: 1000000000 formatted as custom 'Y' is 2001.
  bundle: bamboo_twig_i18n
  rubric_ref: rubric/bamboo_twig_i18n_bamboo_twig_i18n_live_format@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/bamboo_twig_i18n-live-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/bamboo_twig_i18n-live-cleanup.sh
- id: bamboo_twig_i18n-render-lang
  input: Using bamboo_twig_i18n, create a Twig template at web/sites/default/files/bamboo_twig_i18n_render_lang.html.twig
    whose rendered output is the current language code.
  criteria: Write {{ bamboo_i18n_current_lang() }}; rendered output is 'en'.
  bundle: bamboo_twig_i18n
  rubric_ref: rubric/bamboo_twig_i18n_bamboo_twig_i18n_render_lang@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/bamboo_twig_i18n-render-lang-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/bamboo_twig_i18n-render-lang-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/bamboo_twig_i18n-render-lang-verify.sh
- id: bamboo_twig_i18n-render-date
  input: Using bamboo_twig_i18n, create a Twig template at web/sites/default/files/bamboo_twig_i18n_render_date.html.twig
    that formats the UNIX timestamp 1000000000 as a 4-digit year using bamboo_i18n_format_date with a
    custom pattern.
  criteria: Write {{ 1000000000 | bamboo_i18n_format_date('custom', 'Y') }}; rendered output contains
    2001.
  bundle: bamboo_twig_i18n
  rubric_ref: rubric/bamboo_twig_i18n_bamboo_twig_i18n_render_date@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/bamboo_twig_i18n-render-date-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/bamboo_twig_i18n-render-date-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/bamboo_twig_i18n-render-date-verify.sh
