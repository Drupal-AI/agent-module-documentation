metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: bamboo_twig
  version: 6.0.x
  note: Bamboo Twig is a parent module plus 9 topic submodules. The PARENT registers no Twig function;
    it only ships the private base service bamboo_twig.twig.base (TwigExtensionBase, an AbstractExtension
    with lazy service getters) that each submodule's twig.extension service declares as parent. No config
    UI, permissions, Drush, or routes. Medium cases seed a namespaced State value read back via Bamboo
    Twig (bamboo_state_get) / drush; hard cases have the agent write a Twig template (fixed path under
    web/sites/default/files/) that a verify script renders through Drupal's twig service, checking the
    output against live state (site name / module path). Fixtures use bamboo_parent_* names.
questions:
- id: bamboo_twig-parent-provides
  input: In the Bamboo Twig project, what does the top-level bamboo_twig module itself provide, and where
    do the actual Twig functions like bamboo_render_entity live?
  criteria: The parent bamboo_twig registers no Twig function; it only provides the private base service
    bamboo_twig.twig.base (TwigExtensionBase) for lazy service injection. The actual functions live in
    the topic submodules (e.g. bamboo_render_entity is in bamboo_twig_loader).
  bundle: bamboo_twig
  rubric_ref: rubric/bamboo_twig_bamboo_twig_parent_provides@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: bamboo_twig-wiring
  input: How is a Bamboo Twig submodule's Twig extension wired to the parent, in its *.services.yml?
  criteria: 'Each submodule service is tagged { name: twig.extension } and declares parent: bamboo_twig.twig.base,
    so it inherits the lazy service getters from TwigExtensionBase.'
  bundle: bamboo_twig
  rubric_ref: rubric/bamboo_twig_bamboo_twig_wiring@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: bamboo_twig-which-submodule
  input: Using Bamboo Twig, which submodule do I enable to get the functions that render a block, region,
    entity or menu in a Twig template, and which for reading a Drupal config value?
  criteria: bamboo_twig_loader provides the bamboo_render_* / bamboo_load_* functions; bamboo_twig_config
    provides bamboo_config_get / bamboo_settings_get / bamboo_state_get.
  bundle: bamboo_twig
  rubric_ref: rubric/bamboo_twig_bamboo_twig_which_submodule@1.0
  tags:
  - mode:recipe
  - difficulty:easy
