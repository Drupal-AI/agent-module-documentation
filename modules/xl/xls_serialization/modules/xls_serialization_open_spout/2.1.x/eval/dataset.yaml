metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: xls_serialization_open_spout
  version: 2.1.x
  note: Submodule of xls_serialization. Decorates the xlsx encoder with an OpenSpout-based implementation
    for performance. No config/UI/permissions of its own. All cases are `recipe` (response-graded); no
    site mutation.
questions:
- id: openspout-purpose
  input: My Drupal XLSX exports from xls_serialization run out of memory on large datasets. What submodule
    addresses this and how does it help?
  criteria: Enable the xls_serialization_open_spout submodule; it replaces the xlsx encoder with an OpenSpout-based
    one that is faster and uses less memory than PhpSpreadsheet.
  bundle: xls_serialization_open_spout
  rubric_ref: rubric/xls_serialization_open_spout_openspout_purpose@1.0
  tags:
  - mode:recipe
- id: openspout-decorator
  input: How does this submodule take over Excel output — do I have to change my Views or REST configuration?
    Name the mechanism and the service it replaces.
  criteria: Its service (OpenSpoutXlsxEncoder) decorates xls_serialization.encoder.xlsx and is tagged
    encoder/xlsx, so just enabling the module transparently swaps the backend; no config change needed.
    Disable it to revert.
  bundle: xls_serialization_open_spout
  rubric_ref: rubric/xls_serialization_open_spout_openspout_decorator@1.0
  tags:
  - mode:recipe
- id: openspout-library
  input: Installing this submodule fails a requirements check. Which external library must be present,
    and what version?
  criteria: It needs the openspout/openspout library (^4); hook_requirements blocks install if the OpenSpout\Writer\XLSX\Writer
    class is missing.
  bundle: xls_serialization_open_spout
  rubric_ref: rubric/xls_serialization_open_spout_openspout_library@1.0
  tags:
  - mode:recipe
- id: openspout-tradeoffs
  input: If I switch to the OpenSpout backend, which Excel features from the main xls_serialization encoder
    do I lose?
  criteria: It drops features like custom document metadata, conditional formatting, header styling, and
    column/row auto-sizing — trading them for performance.
  bundle: xls_serialization_open_spout
  rubric_ref: rubric/xls_serialization_open_spout_openspout_tradeoffs@1.0
  tags:
  - mode:recipe
- id: openspout-format-scope
  input: Does the OpenSpout submodule replace both the xls and xlsx encoders, or only one? Which format
    string does it decorate?
  criteria: Only the xlsx encoder (format `xlsx`) is decorated; the legacy `xls` encoder is unchanged.
  bundle: xls_serialization_open_spout
  rubric_ref: rubric/xls_serialization_open_spout_openspout_format_scope@1.0
  tags:
  - mode:recipe
- id: openspout-dependency-module
  input: Can I enable xls_serialization_open_spout on its own? What module does it depend on?
  criteria: No; it depends on the parent xls_serialization module (extends its Xlsx encoder) plus the
    openspout/openspout library.
  bundle: xls_serialization_open_spout
  rubric_ref: rubric/xls_serialization_open_spout_openspout_dependency_module@1.0
  tags:
  - mode:recipe
