metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: xls_serialization
  version: 2.1.x
  note: xls_serialization registers `xls`/`xlsx` serialization formats (encoders built on phpoffice/phpspreadsheet),
    Views excel_export plugins, and a tiny global config form. All cases are `recipe` (response-graded),
    probing documented facts an agent would otherwise read source to answer; no site mutation.
questions:
- id: xls-serialize-format
  input: In PHP on a Drupal 11 site, I have `$data` (an array of associative rows) and want to turn it
    into an .xlsx spreadsheet string. Which core service do I call and what format string do I pass?
  criteria: 'Use the core `serializer` service: \Drupal::service(''serializer'')->serialize($data, ''xlsx'',
    $context) — the module registers `xls` and `xlsx` as serialization formats.'
  bundle: xls_serialization
  rubric_ref: rubric/xls_serialization_xls_serialize_format@1.0
  tags:
  - mode:recipe
- id: xls-encoder-classes
  input: What encoder classes and serialization format strings does this module provide for Excel? Name
    the classes and the formats.
  criteria: Drupal\xls_serialization\Encoder\Xls (format `xls`, service xls_serialization.encoder.xls)
    and Drupal\xls_serialization\Encoder\Xlsx (format `xlsx`, a subclass), both tagged as `encoder`.
  bundle: xls_serialization
  rubric_ref: rubric/xls_serialization_xls_encoder_classes@1.0
  tags:
  - mode:recipe
- id: xls-phpspreadsheet-dependency
  input: This module errors because an external library is missing. Which Composer library does xls_serialization
    depend on to build Excel files, and how do I install it?
  criteria: It requires phpoffice/phpspreadsheet (^2.4.0 || ^3.10.0), pulled in via Composer (drupal/xls_serialization
    requires it).
  bundle: xls_serialization
  rubric_ref: rubric/xls_serialization_xls_phpspreadsheet_dependency@1.0
  tags:
  - mode:recipe
- id: xls-views-data-export
  input: I want a Views display that lets users download the results as a downloadable .xlsx file. Which
    display type / mechanism does this module use, and how is the format selected over REST?
  criteria: A Views "Data export" / "Excel export" (excel_export) display, extending REST export, outputs
    the file; a REST resource returns Excel with ?_format=xlsx (or ?_format=xls).
  bundle: xls_serialization
  rubric_ref: rubric/xls_serialization_xls_views_data_export@1.0
  tags:
  - mode:recipe
- id: xls-settings-format
  input: On a Views Excel export I want to output the legacy binary .xls (Excel 5) instead of .xlsx, and
    turn off HTML tag stripping. Which xls_settings keys control the writer format and tag stripping?
  criteria: In the style's xls_settings, set xls_format to 'Xls' (Excel5 is remapped to Xls; default 'Xlsx')
    and strip_tags to FALSE (default TRUE); trim also defaults TRUE.
  bundle: xls_serialization
  rubric_ref: rubric/xls_serialization_xls_settings_format@1.0
  tags:
  - mode:recipe
- id: xls-autosize-config
  input: Auto-sizing every column is slow on my large exports. Which config object and key disable column
    AutoSize globally, and which permission gates that admin form?
  criteria: Set xls_serialization_autosize (truthy = disable AutoSize; default false) on the xls_serialization.configuration
    object at /admin/config/user-interface/xls_serialization; the 'administer xls serialization configuration'
    permission gates it.
  bundle: xls_serialization
  rubric_ref: rubric/xls_serialization_xls_autosize_config@1.0
  tags:
  - mode:recipe
- id: xls-header-metadata
  input: I want the header row of my Excel export bold with a colored background, and I want to embed
    the author and title in the file's document properties. Where are these configured?
  criteria: Display options header_bold / header_italic / header_background_color style the header row;
    the style's xls_settings['metadata'] mapping sets document properties like creator, title, subject,
    keywords, company.
  bundle: xls_serialization
  rubric_ref: rubric/xls_serialization_xls_header_metadata@1.0
  tags:
  - mode:recipe
- id: xls-vs-open-spout
  input: My XLSX exports are huge and running out of memory with this module. Is there an alternative
    backend, and what is the trade-off?
  criteria: Enable the xls_serialization_open_spout submodule, which decorates the xlsx encoder to use
    the faster, lower-memory OpenSpout library, at the cost of features like metadata, conditional styles,
    and auto-sizing.
  bundle: xls_serialization
  rubric_ref: rubric/xls_serialization_xls_vs_open_spout@1.0
  tags:
  - mode:recipe
