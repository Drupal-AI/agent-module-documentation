rubrics:
- id: xls_serialization_xls_serialize_format
  version: '1.0'
  applicable_bundles:
  - xls_serialization
  checks:
  - kind: must_contain_any
    values:
    - serialize($data, 'xlsx'
    - ->serialize(
    - '''serializer'''
    - serializer
  scoring:
    combine: all_pass
- id: xls_serialization_xls_encoder_classes
  version: '1.0'
  applicable_bundles:
  - xls_serialization
  checks:
  - kind: must_contain_any
    values:
    - Xls
    - Xlsx
    - Drupal\xls_serialization\Encoder
  scoring:
    combine: all_pass
- id: xls_serialization_xls_phpspreadsheet_dependency
  version: '1.0'
  applicable_bundles:
  - xls_serialization
  checks:
  - kind: must_contain_any
    values:
    - phpoffice/phpspreadsheet
    - phpspreadsheet
    - composer require drupal/xls_serialization
  scoring:
    combine: all_pass
- id: xls_serialization_xls_views_data_export
  version: '1.0'
  applicable_bundles:
  - xls_serialization
  checks:
  - kind: must_contain_any
    values:
    - excel_export
    - Data export
    - REST export
    - Excel export
    - ?_format=xlsx
    - _format=xlsx
    - views_data_export
  scoring:
    combine: all_pass
- id: xls_serialization_xls_settings_format
  version: '1.0'
  applicable_bundles:
  - xls_serialization
  checks:
  - kind: must_contain_any
    values:
    - xls_format
    - strip_tags
    - xls_settings
  scoring:
    combine: all_pass
- id: xls_serialization_xls_autosize_config
  version: '1.0'
  applicable_bundles:
  - xls_serialization
  checks:
  - kind: must_contain_any
    values:
    - xls_serialization_autosize
    - xls_serialization.configuration
    - administer xls serialization configuration
  scoring:
    combine: all_pass
- id: xls_serialization_xls_header_metadata
  version: '1.0'
  applicable_bundles:
  - xls_serialization
  checks:
  - kind: must_contain_any
    values:
    - header_bold
    - header_background_color
    - metadata
    - creator
  scoring:
    combine: all_pass
- id: xls_serialization_xls_vs_open_spout
  version: '1.0'
  applicable_bundles:
  - xls_serialization
  checks:
  - kind: must_contain_any
    values:
    - xls_serialization_open_spout
    - OpenSpout
    - openspout
  scoring:
    combine: all_pass
