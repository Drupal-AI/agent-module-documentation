rubrics:
- id: format_bytes_format_bytes_filter_name
  version: '1.0'
  applicable_bundles:
  - format_bytes
  checks:
  - kind: must_contain_any
    values:
    - format_bytes
    - ByteSizeMarkup
    - format_size
  scoring:
    combine: all_pass
- id: format_bytes_format_bytes_usage
  version: '1.0'
  applicable_bundles:
  - format_bytes
  checks:
  - kind: must_contain_any
    values:
    - '| format_bytes'
    - '|format_bytes'
    - format_bytes
  scoring:
    combine: all_pass
- id: format_bytes_format_bytes_no_config
  version: '1.0'
  applicable_bundles:
  - format_bytes
  checks:
  - kind: must_contain_any
    values:
    - 'no'
    - none
    - Twig
    - filter
    - no configuration
    - no settings
  scoring:
    combine: all_pass
- id: format_bytes_format_bytes_known_raw
  version: '1.0'
  applicable_bundles:
  - format_bytes
  checks:
  - kind: must_contain_any
    values:
    - 5 MB
  scoring:
    combine: all_pass
- id: format_bytes_format_bytes_known_raw2
  version: '1.0'
  applicable_bundles:
  - format_bytes
  checks:
  - kind: must_contain_any
    values:
    - 1 GB
  scoring:
    combine: all_pass
- id: format_bytes_format_bytes_render_result
  version: '1.0'
  applicable_bundles:
  - format_bytes
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
- id: format_bytes_format_bytes_render_result2
  version: '1.0'
  applicable_bundles:
  - format_bytes
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
