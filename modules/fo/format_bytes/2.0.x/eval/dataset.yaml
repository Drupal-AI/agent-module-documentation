metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: format_bytes
  version: 2.0.x
  note: 'Format Bytes is a one-class Twig extension. It registers exactly one Twig filter, `format_bytes`,
    via the service format_bytes.twig_extension (Drupal\format_bytes\Twig\ByteConversionTwigExtension,
    tagged twig.extension), delegating to core Drupal\Core\StringTranslation\ByteSizeMarkup::create().
    There is no config route, no settings, no permissions, no schema, no plugins. Because the module has
    no site-persisted configuration, the medium and hard tiers are grounded in the filter''s actual output
    applied to values held in Drupal State under namespaced keys (format_bytes_eval.*): introspection
    reads a stored raw byte value and reports the module''s rendering of it; execution renders a value
    with the format_bytes filter and stores the human-readable string in State, verified against live
    State. Confirmed outputs on this Drupal 11 site: 5242880 -> ''5 MB'', 1073741824 -> ''1 GB'' (binary/1024
    steps).'
questions:
- id: format_bytes-filter-name
  input: In the Drupal contrib module format_bytes, what is the name of the Twig filter it provides, and
    what core PHP helper does that filter delegate to for turning a raw byte count into a human-readable
    size?
  criteria: It registers a single Twig filter named `format_bytes` (in Drupal\format_bytes\Twig\ByteConversionTwigExtension)
    that maps directly to Drupal\Core\StringTranslation\ByteSizeMarkup::create() (which wraps core format_size()).
  bundle: format_bytes
  rubric_ref: rubric/format_bytes_format_bytes_filter_name@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: format_bytes-usage
  input: How do I use the format_bytes module in a Twig template to show a file's stored filesize as something
    like '2 MB'? Give the syntax.
  criteria: Pipe the numeric byte value through the filter, e.g. `{{ node.field_file.entity.filesize.value
    | format_bytes }}`, which renders a human-readable size such as '2 MB'.
  bundle: format_bytes
  rubric_ref: rubric/format_bytes_format_bytes_usage@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: format_bytes-no-config
  input: Does the format_bytes module have an admin settings page, permissions, or configuration I need
    to set up before using it?
  criteria: No. format_bytes has no configure route, no settings form, no permissions, and no config schema.
    Enabling the module makes the `format_bytes` Twig filter available; nothing else needs configuring.
  bundle: format_bytes
  rubric_ref: rubric/format_bytes_format_bytes_no_config@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: format_bytes-known-raw
  input: This Drupal site stores a raw byte count in Drupal State under the key format_bytes_eval.raw.
    Inspect the live State value and tell me what the format_bytes Twig filter would render that number
    as.
  criteria: State format_bytes_eval.raw is 5242880, which the format_bytes filter renders as '5 MB'.
  bundle: format_bytes
  rubric_ref: rubric/format_bytes_format_bytes_known_raw@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/format_bytes-raw-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/format_bytes-raw-cleanup.sh
- id: format_bytes-known-raw2
  input: The Drupal State key format_bytes_eval.raw2 on this site holds a raw byte count. Read it from
    the running site and state the human-readable size that the format_bytes filter produces for it.
  criteria: State format_bytes_eval.raw2 is 1073741824, which format_bytes renders as '1 GB'.
  bundle: format_bytes
  rubric_ref: rubric/format_bytes_format_bytes_known_raw2@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/format_bytes-raw2-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/format_bytes-raw2-cleanup.sh
- id: format_bytes-render-result
  input: Using the format_bytes module's Twig filter, render the byte value 1073741824 into a human-readable
    size string and store that resulting string in Drupal State under the key format_bytes_eval.result.
    Apply it to the live site.
  criteria: Render {{ 1073741824|format_bytes }} (e.g. via \Drupal::service('twig')->renderInline()) to
    get '1 GB', then \Drupal::state()->set('format_bytes_eval.result', '1 GB'). Verify reads State and
    requires exactly '1 GB'.
  bundle: format_bytes
  rubric_ref: rubric/format_bytes_format_bytes_render_result@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/format_bytes-result-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/format_bytes-result-reset.sh
    verify: agent-module-documentation/evaluation/verify/format_bytes-result-verify.sh
- id: format_bytes-render-result2
  input: With the format_bytes filter, format the byte value 5242880 as a human-readable size and save
    the resulting string to Drupal State under the key format_bytes_eval.result2 on this site.
  criteria: Render {{ 5242880|format_bytes }} -> '5 MB' and \Drupal::state()->set('format_bytes_eval.result2',
    '5 MB'). Verify requires State format_bytes_eval.result2 === '5 MB'.
  bundle: format_bytes
  rubric_ref: rubric/format_bytes_format_bytes_render_result2@1.0
