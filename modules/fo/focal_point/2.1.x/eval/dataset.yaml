metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: focal_point
  version: 2.1.x
  note: Focal Point has no global settings page; it is configured on image styles and the field widget,
    and exposes a manager service. Recipe cases are response-graded (easy); the two execution cases (hard)
    build image styles with focal-point effects and verify live config state.
questions:
- id: focalpoint-crop-dependency
  input: I want to install the Focal Point module on a Drupal 11 site with Composer. Which contrib module
    does it require to be installed alongside it, and why? Name the module.
  criteria: Focal Point depends on the contrib Crop module (drupal/crop ^2.3); the focal point is stored
    via the Crop API so it survives image replacement.
  bundle: focal_point
  rubric_ref: rubric/focal_point_focalpoint_crop_dependency@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: focalpoint-enable-widget
  input: On a Drupal 11 site I have an image field on the Article content type. How do I let editors set
    a focal point on it? Name the field widget to select on the form display and where to change it.
  criteria: On Manage form display for the bundle, set the image field's widget to 'Image (Focal Point)'
    (plugin focal_point_image_widget), which shows a draggable crosshair and an X,Y percentage field.
  bundle: focal_point
  rubric_ref: rubric/focal_point_focalpoint_enable_widget@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: focalpoint-scale-and-crop-effect
  input: I need a fixed 200x200 thumbnail image style that crops around the focal point instead of the
    center. Which image effect do I add to the image style? Name it.
  criteria: Add the 'Focal Point Scale and Crop' effect (focal_point_scale_and_crop) to the image style;
    it scales then crops around the saved focal point.
  bundle: focal_point
  rubric_ref: rubric/focal_point_focalpoint_scale_and_crop_effect@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: focalpoint-effect-names
  input: What are the focal-point image effects that Focal Point ships that I can add to an image style
    at /admin/config/media/image-styles? I want to crop to an exact width and height around the point.
    Name the effect machine name.
  criteria: Focal Point Crop (focal_point_crop) crops to an exact width x height around the point; the
    module also ships focal_point_crop_by_ratio and focal_point_scale_and_crop.
  bundle: focal_point
  rubric_ref: rubric/focal_point_focalpoint_effect_names@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: focalpoint-crop-type
  input: In code on a Drupal 11 site, I want to load the crop entity that stores the focal point for a
    given file. What is the crop type machine name that Focal Point uses, and which service loads or creates
    that crop entity?
  criteria: Use the focal_point.manager service (FocalPointManagerInterface)->getCropEntity($file, 'focal_point');
    the crop type machine name is 'focal_point'.
  bundle: focal_point
  rubric_ref: rubric/focal_point_focalpoint_crop_type@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: focalpoint-save-programmatically
  input: In PHP on a Drupal 11 site, set a focal point of 50% x / 33% y on a file programmatically and
    persist it. Which service and methods do I use? Show the code.
  criteria: Get \Drupal::service('focal_point.manager'), call getCropEntity($file, 'focal_point') then
    saveCropEntity(50.0, 33.0, $width, $height, $crop) to persist the relative x/y percentages on the
    crop entity.
  bundle: focal_point
  rubric_ref: rubric/focal_point_focalpoint_save_programmatically@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: focalpoint-storage-percentage
  input: If an editor sets a focal point and then re-uploads a different image into the same field, does
    the focal point survive? Explain how Focal Point stores the point.
  criteria: The point is stored as a relative X,Y percentage via the Crop API (crop entity), decoupled
    from the file and original dimensions, so it survives image replacement.
  bundle: focal_point
  rubric_ref: rubric/focal_point_focalpoint_storage_percentage@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: focalpoint-preview
  input: How can an editor check how an image will crop across all the image styles that use a focal point
    before publishing, from the focal point widget?
  criteria: The widget's Preview link opens a dialog (route focal_point.preview, FocalPointPreviewController)
    that renders the image through every image style using a focal-point effect.
  bundle: focal_point
  rubric_ref: rubric/focal_point_focalpoint_preview@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: focalpoint-image-style-scale-crop
  input: On this Drupal 11 site, create a new image style with the machine name `eval_focal_crop` that
    produces a fixed 300 by 300 pixel image cropped around the saved focal point rather than the center.
    Add the appropriate Focal Point image effect at that size and make sure the image style is saved and
    active on the live site.
  criteria: ''
  bundle: focal_point
  rubric_ref: rubric/focal_point_focalpoint_image_style_scale_crop@1.0
