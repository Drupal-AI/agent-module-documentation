rubrics:
- id: formdazzle_formdazzle_suggestion_pattern
  version: '1.0'
  applicable_bundles:
  - formdazzle
  checks:
  - kind: must_contain_any
    values:
    - form-id
    - form id
    - element name
    - input--textfield--
    - --first-name
    - form_id
  scoring:
    combine: all_pass
- id: formdazzle_formdazzle_how_it_works
  version: '1.0'
  applicable_bundles:
  - formdazzle
  checks:
  - kind: must_contain_any
    values:
    - pre_render
    - '#pre_render'
    - preRenderForm
    - hook_form_alter
    - after
    - weight
    - run last
    - module_implements_alter
  scoring:
    combine: all_pass
- id: formdazzle_formdazzle_twig_debug
  version: '1.0'
  applicable_bundles:
  - formdazzle
  checks:
  - kind: must_contain_any
    values:
    - twig
    - debug
    - FILE NAME SUGGESTIONS
    - comment
    - '#markup'
    - page source
    - view source
  scoring:
    combine: all_pass
- id: formdazzle_formdazzle_module_weight
  version: '1.0'
  applicable_bundles:
  - formdazzle
  checks:
  - kind: must_contain_any
    values:
    - '7'
  scoring:
    combine: all_pass
- id: formdazzle_formdazzle_rendered_suggestion
  version: '1.0'
  applicable_bundles:
  - formdazzle
  checks:
  - kind: must_contain_any
    values:
    - user_login_form__name
    - user-login-form--name
    - __user_login_form__name
  scoring:
    combine: all_pass
- id: formdazzle_formdazzle_enable_suggestions
  version: '1.0'
  applicable_bundles:
  - formdazzle
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
- id: formdazzle_formdazzle_run_last
  version: '1.0'
  applicable_bundles:
  - formdazzle
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
