rubrics:
- id: fontawesome_iconpicker_fontawesome_iconpicker_field_types
  version: '1.0'
  applicable_bundles:
  - fontawesome_iconpicker
  checks:
  - kind: must_contain_any
    values:
    - text
    - string
    - plain
  scoring:
    combine: all_pass
- id: fontawesome_iconpicker_fontawesome_iconpicker_how_enable
  version: '1.0'
  applicable_bundles:
  - fontawesome_iconpicker
  checks:
  - kind: must_contain_any
    values:
    - Manage form display
    - widget
    - fontawesome_iconpicker
    - Font Awesome Icon Picker
  scoring:
    combine: all_pass
- id: fontawesome_iconpicker_fontawesome_iconpicker_output
  version: '1.0'
  applicable_bundles:
  - fontawesome_iconpicker
  checks:
  - kind: must_contain_any
    values:
    - <i
    - fa-
    - class
    - aria-hidden
  scoring:
    combine: all_pass
- id: fontawesome_iconpicker_fontawesome_iconpicker_live_widget
  version: '1.0'
  applicable_bundles:
  - fontawesome_iconpicker
  checks:
  - kind: must_contain_any
    values:
    - field_faip_known
  scoring:
    combine: all_pass
- id: fontawesome_iconpicker_fontawesome_iconpicker_live_size
  version: '1.0'
  applicable_bundles:
  - fontawesome_iconpicker
  checks:
  - kind: must_contain_any
    values:
    - fa-4x
    - 4x
  scoring:
    combine: all_pass
- id: fontawesome_iconpicker_fontawesome_iconpicker_set_widget
  version: '1.0'
  applicable_bundles:
  - fontawesome_iconpicker
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
- id: fontawesome_iconpicker_fontawesome_iconpicker_set_formatter
  version: '1.0'
  applicable_bundles:
  - fontawesome_iconpicker
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
