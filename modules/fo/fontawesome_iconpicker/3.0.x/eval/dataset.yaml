metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: fontawesome_iconpicker
  version: 3.0.x
  note: 'Font Awesome Iconpicker provides a field widget (fontawesome_iconpicker) and formatter (fontawesome_iconpicker_formatter_type)
    for core text/string fields. No settings page (configure=null). Widget settings: type (default|component),
    size (int), placeholder. Formatter setting: size (fa-1x..fa-5x). Output <i class="fa <icon> <size>">
    via the fontawesome_iconpicker_formatter theme hook. Config is stored on entity_form_display (widget)
    and entity_view_display (formatter). Live-state cases add namespaced string fields (field_faip_*)
    to the Article content type and set the widget/formatter, cleaned up by deleting only those fields.
    Depends on the contrib fontawesome module + external d34dman/vanilla-icon-picker library.'
questions:
- id: fontawesome_iconpicker-field-types
  input: On which kinds of Drupal field can the fontawesome_iconpicker widget and formatter be used?
  criteria: Both the widget and formatter support core text and string field types (i.e. Text (plain)
    / Text (formatted)). Text (plain) is recommended. You store the icon's class string in the field.
  bundle: fontawesome_iconpicker
  rubric_ref: rubric/fontawesome_iconpicker_fontawesome_iconpicker_field_types@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: fontawesome_iconpicker-how-enable
  input: There is no settings page for fontawesome_iconpicker. How do I actually give editors the icon
    picker on a field?
  criteria: Add a text/string field to the bundle, then on Manage form display set that field's widget
    to 'Font Awesome Icon Picker' (id fontawesome_iconpicker). Optionally set the matching 'Font Awesome
    Icon Picker' formatter on Manage display to render the chosen icon.
  bundle: fontawesome_iconpicker
  rubric_ref: rubric/fontawesome_iconpicker_fontawesome_iconpicker_how_enable@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: fontawesome_iconpicker-output
  input: How does the fontawesome_iconpicker formatter render a stored icon value, and what markup does
    it produce?
  criteria: The formatter (fontawesome_iconpicker_formatter_type) renders via the fontawesome_iconpicker_formatter
    theme hook to <i class="fa <icon> <size>" aria-hidden="true"></i>, where <size> is one of fa-1x..fa-5x.
  bundle: fontawesome_iconpicker
  rubric_ref: rubric/fontawesome_iconpicker_fontawesome_iconpicker_output@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: fontawesome_iconpicker-live-widget
  input: On this Drupal site, which field on the Article content type uses the Font Awesome Icon Picker
    widget on its default edit form? Inspect the live form-display configuration and give the field machine
    name.
  criteria: 'field_faip_known: in core.entity_form_display.node.article.default its component has type
    fontawesome_iconpicker.'
  bundle: fontawesome_iconpicker
  rubric_ref: rubric/fontawesome_iconpicker_fontawesome_iconpicker_live_widget@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/fontawesome_iconpicker-live-widget-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/fontawesome_iconpicker-live-widget-cleanup.sh
- id: fontawesome_iconpicker-live-size
  input: On this site, the Article field field_faip_size is displayed with the Font Awesome Icon Picker
    formatter. At what icon size is it configured to render? Inspect the live display configuration and
    answer.
  criteria: 'fa-4x: in core.entity_view_display.node.article.default the field_faip_size component (formatter
    fontawesome_iconpicker_formatter_type) has settings.size = fa-4x.'
  bundle: fontawesome_iconpicker
  rubric_ref: rubric/fontawesome_iconpicker_fontawesome_iconpicker_live_size@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/fontawesome_iconpicker-live-size-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/fontawesome_iconpicker-live-size-cleanup.sh
- id: fontawesome_iconpicker-set-widget
  input: On this Drupal site the Article content type has a plain-text field field_faip_task. Using the
    fontawesome_iconpicker module, make that field use the Font Awesome Icon Picker widget on the default
    edit form. Apply the change to the live site.
  criteria: Set the field_faip_task component's widget to fontawesome_iconpicker in core.entity_form_display.node.article.default
    (via Manage form display, or setComponent type=fontawesome_iconpicker). Verified when the component
    type is fontawesome_iconpicker.
  bundle: fontawesome_iconpicker
  rubric_ref: rubric/fontawesome_iconpicker_fontawesome_iconpicker_set_widget@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/fontawesome_iconpicker-set-widget-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/fontawesome_iconpicker-set-widget-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/fontawesome_iconpicker-set-widget-verify.sh
- id: fontawesome_iconpicker-set-formatter
  input: On this Drupal site the Article content type has a field field_faip_display. Using the fontawesome_iconpicker
    module, configure the default display so this field renders as a Font Awesome icon at size 2x. Apply
    the change to the live site.
  criteria: Set the field_faip_display component in core.entity_view_display.node.article.default to formatter
    fontawesome_iconpicker_formatter_type with settings.size = fa-2x. Verified when the formatter type
    is fontawesome_iconpicker_formatter_type and size is fa-2x.
  bundle: fontawesome_iconpicker
  rubric_ref: rubric/fontawesome_iconpicker_fontawesome_iconpicker_set_formatter@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/fontawesome_iconpicker-set-formatter-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/fontawesome_iconpicker-set-formatter-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/fontawesome_iconpicker-set-formatter-verify.sh
