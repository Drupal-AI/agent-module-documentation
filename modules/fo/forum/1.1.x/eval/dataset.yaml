metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: forum
  version: 1.1.x
  note: 'Forum stores its board as taxonomy terms in the `forums` vocabulary: a term is a container when
    its forum_container field is 1 and a leaf forum when 0; topics are `forum` nodes. Easy cases are graded
    on response text; medium cases install a known config to read back; hard cases build/config live state
    verified by exit code.'
questions:
- id: forum-vocabulary-key
  input: In the Drupal Forum module, which key in the forum.settings config object names the taxonomy
    vocabulary that backs the forum board? Answer with the exact key name.
  criteria: The `vocabulary` key in forum.settings (default value `forums`).
  bundle: forum
  rubric_ref: rubric/forum_forum_vocabulary_key@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: forum-container-flag
  input: In the Forum module, which boolean field on a taxonomy term distinguishes a non-postable container
    from an actual (leaf) forum? Give the exact field name.
  criteria: 'The `forum_container` boolean field on forums-vocabulary terms: 1 = container, 0 = leaf forum.'
  bundle: forum
  rubric_ref: rubric/forum_forum_container_flag@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: forum-topics-per-page-key
  input: Which forum.settings key controls how many forum topics are listed per page, and what is its
    default value? Name the exact key.
  criteria: The `topics.page_limit` key in forum.settings (default 25).
  bundle: forum
  rubric_ref: rubric/forum_forum_topics_per_page_key@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: forum-page-limit-introspect
  input: This Drupal site's Forum module is configured with a custom number of topics shown per forum
    page. Inspect the running site (drush available) and tell me the exact value it is currently set to.
  criteria: The live forum.settings topics.page_limit is 40 (read from forum.settings on the running site;
    default is 25).
  bundle: forum
  rubric_ref: rubric/forum_forum_page_limit_introspect@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    persona: drupal-expert
    setup: agent-module-documentation/evaluation/verify/forum-page-limit-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/forum-page-limit-cleanup.sh
- id: forum-hot-threshold-introspect
  input: This Drupal site's Forum module has a custom 'hot topic' reply threshold configured (the number
    of replies at which a thread is flagged hot). Inspect the running site (drush available) and tell
    me the exact value.
  criteria: The live forum.settings topics.hot_threshold is 42 (read from forum.settings on the running
    site; default is 15).
  bundle: forum
  rubric_ref: rubric/forum_forum_hot_threshold_introspect@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    persona: drupal-expert
    setup: agent-module-documentation/evaluation/verify/forum-hot-threshold-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/forum-hot-threshold-cleanup.sh
- id: forum-term-introspect
  input: This Drupal site already has a forum configured inside the `forums` taxonomy vocabulary, nested
    under a container. Inspect the running site (drush available) and tell me the exact name of the leaf
    forum term (the postable forum, not the container).
  criteria: The leaf forum term (forum_container = 0) is named 'Eval Lounge', nested under the container
    'Eval Zone' in the forums vocabulary.
  bundle: forum
  rubric_ref: rubric/forum_forum_term_introspect@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    persona: drupal-expert
    setup: agent-module-documentation/evaluation/verify/forum-term-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/forum-term-cleanup.sh
- id: forum-build-structure
  input: 'On this Drupal site (DDEV, drush available) the Forum module is enabled. Build a forum structure:
    create a container in the forums vocabulary and, nested inside it, a real (leaf) forum that users
    can post topics to. Apply it to the running site with drush/config — do not just describe it. Give
    a one-line summary of what you created.'
  criteria: The forums vocabulary contains at least one container term (forum_container = 1) and at least
    one leaf forum term (forum_container = 0) whose parent is that container. Verified against live site
    state.
  bundle: forum
  rubric_ref: rubric/forum_forum_build_structure@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/forum-build-structure-reset.sh
    verify: agent-module-documentation/evaluation/verify/forum-build-structure-verify.sh
- id: forum-create-forum
  input: On this Drupal site (drush available), add a new discussion forum named exactly 'Support' that
    visitors can post topics into (a leaf forum in the forums vocabulary, not a container). Apply it to
    the running site — do not just describe it. State in one line what you changed.
  criteria: A term named 'Support' exists in the forums vocabulary with forum_container = 0 (a postable
    leaf forum). Verified against live site state.
  bundle: forum
  rubric_ref: rubric/forum_forum_create_forum@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/forum-create-forum-reset.sh
    verify: agent-module-documentation/evaluation/verify/forum-create-forum-verify.sh
- id: forum-settings
  input: On this Drupal site (drush available), configure the Forum module so that forum listings show
    30 topics per page and a thread is flagged 'hot' at 20 replies. Apply the change to the running site
    via drush/config — do not just describe it. Summarize in one line what you changed.
  criteria: forum.settings topics.page_limit == 30 AND topics.hot_threshold == 20 on the live site. Verified
    against live state.
  bundle: forum
  rubric_ref: rubric/forum_forum_settings@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/forum-settings-reset.sh
    verify: agent-module-documentation/evaluation/verify/forum-settings-verify.sh
