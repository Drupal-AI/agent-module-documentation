metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: form_options_attributes
  version: 2.1.x
  note: 'form_options_attributes is a pure Form API helper: it adds one render-array property (#options_attributes)
    that attaches HTML attributes to individual select/radios/checkboxes options, plus #options_wrapper_attributes
    / #options_label_attributes for radios/checkboxes. It has NO admin UI, NO config entities, NO settings
    config/schema, NO permissions, NO Drush, and NO plugins. MEDIUM (introspection) is OMITTED: there
    is no per-site configuration to plant and read back — enabling the module is the entire setup, so
    a setup/cleanup pair could only assert module-enabled status, which is not a meaningful introspection
    test and would be fabricated config. HARD (execution) is verifiable by CODE: the agent writes a render
    array (that RETURNS from a PHP file) using #options_attributes, which the verify script includes,
    renders in isolation, and greps for the attribute on the correct <option>. select renders cleanly
    in isolation; radios/checkboxes need full form processing, so the execution cases use select for a
    robust, deterministic verify. reset deletes the deliverable file so the case FAILs on empty state
    and PASSes only after a correct build.'
questions:
- id: foa-property-and-elements
  input: On a Drupal 11 site with the form_options_attributes module enabled, how do I add an HTML attribute
    (like a data-* attribute or a CSS class) to a SINGLE option of a Form API select/radios/checkboxes
    element? Name the render-array property and which element types it works on.
  criteria: 'Add an #options_attributes array to the element, keyed by the same keys as #options; each
    value is an attributes array formatted like #attributes. It works on #type select, radios, and checkboxes.'
  bundle: form_options_attributes
  rubric_ref: rubric/form_options_attributes_foa_property_and_elements@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: foa-no-ui-developer-api
  input: Where is the configuration/admin page for the form_options_attributes module on a Drupal 11 site,
    and what permissions does it add?
  criteria: 'There is none. form_options_attributes is a developer API module with no admin UI, no configuration
    form, and no permissions. You use it purely in code (a custom form or hook_form_alter) by adding #options_attributes;
    enabling the module is the whole setup.'
  bundle: form_options_attributes
  rubric_ref: rubric/form_options_attributes_foa_no_ui_developer_api@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: foa-wrapper-label-attributes
  input: With form_options_attributes, I want to add attributes not just to each radio/checkbox input
    but also to each option's surrounding wrapper and its label. Which properties do that, and do they
    work for select elements too?
  criteria: 'Use #options_wrapper_attributes (the option''s wrapper <div>) and #options_label_attributes
    (the option''s <label>), keyed like #options. They apply to radios and checkboxes ONLY — a select
    has no per-option wrapper or label, so only #options_attributes applies there.'
  bundle: form_options_attributes
  rubric_ref: rubric/form_options_attributes_foa_wrapper_label_attributes@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: foa-build-select-option-attr
  input: 'Using the form_options_attributes module on this Drupal 11 site, create a PHP file at /var/www/html/web/sites/default/files/foa_eval_flat.php
    that `return`s (the file''s top-level statement must be `return [...]`) a Drupal render array for
    a `#type` => `select` element titled ''Membership'' with exactly two options: `basic` => ''Basic''
    and `premium` => ''Premium''. Only the `premium` <option> must carry the HTML attribute data-tier="gold",
    added via the module''s #options_attributes property (do NOT hand-write raw HTML). The array must
    be renderable with the core renderer.'
  criteria: A file returning ['#type' => 'select', '#title' => 'Membership', '#options' => ['basic' =>
    'Basic', 'premium' => 'Premium'], '#options_attributes' => ['premium' => ['data-tier' => 'gold']]].
    When rendered, the premium <option> carries data-tier="gold".
  bundle: form_options_attributes
  rubric_ref: rubric/form_options_attributes_foa_build_select_option_attr@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: expert
    reset: agent-module-documentation/evaluation/verify/form_options_attributes-select-attr-reset.sh
    verify: agent-module-documentation/evaluation/verify/form_options_attributes-select-attr-verify.sh
- id: foa-build-optgroup-option-attr
  input: 'Using form_options_attributes on this Drupal 11 site, create a PHP file at /var/www/html/web/sites/default/files/foa_eval_group.php
    that `return`s (top-level `return [...]`) a Drupal render array for a `#type` => `select` element
    with TWO option groups: ''German'' containing `audi` => ''Audi'' and `bmw` => ''BMW'', and ''Japanese''
    containing `honda` => ''Honda''. The `bmw` <option> inside the German group must carry data-lux="yes",
    set through the module''s #options_attributes using the correct NESTED keying for grouped options
    (group label, then option key). Do not hand-write raw HTML; it must render via the core renderer.'
  criteria: 'A file returning a select whose #options are grouped (''German'' => [''audi''=>''Audi'',''bmw''=>''BMW''],
    ''Japanese'' => [''honda''=>''Honda'']) with #options_attributes => [''German'' => [''bmw'' => [''data-lux''
    => ''yes'']]]. When rendered, the bmw <option> under <optgroup label="German"> carries data-lux="yes".'
  bundle: form_options_attributes
  rubric_ref: rubric/form_options_attributes_foa_build_optgroup_option_attr@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: expert
    reset: agent-module-documentation/evaluation/verify/form_options_attributes-optgroup-attr-reset.sh
    verify: agent-module-documentation/evaluation/verify/form_options_attributes-optgroup-attr-verify.sh
