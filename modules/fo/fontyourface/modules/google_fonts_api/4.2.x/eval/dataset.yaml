metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: google_fonts_api
  version: 4.2.x
  note: Provider submodule of fontyourface. Import needs a Google API key + network, so cases are recipe
    (response-graded).
questions:
- id: gfa-api-key-config
  input: How do you enable Google Fonts import in Drupal's @font-your-face, and which config key stores
    the credential?
  criteria: Enter a Google Fonts API key on the @font-your-face settings form (/admin/appearance/font/settings);
    it is stored in google_fonts_api.settings:google_api_key. The Import button stays disabled until a
    valid key is set.
  bundle: google_fonts_api
  rubric_ref: rubric/google_fonts_api_gfa_api_key_config@1.0
  tags:
  - mode:recipe
- id: gfa-render-url
  input: How does the google_fonts_api submodule load enabled Google fonts on a rendered page?
  criteria: hook_page_attachments() aggregates all enabled Google fonts into a single https://fonts.googleapis.com/css?family=…&subset=…&display=swap
    request injected as a <link rel=stylesheet>.
  bundle: google_fonts_api
  rubric_ref: rubric/google_fonts_api_gfa_render_url@1.0
  tags:
  - mode:recipe
- id: gfa-provider-id
  input: What is the fontyourface provider id (pid) for Google-fonts entities and how are they imported?
  criteria: pid is google_fonts_api; hook_fontyourface_import() fetches the googleapis webfonts catalog
    and saves one font per family/variant/subset with fontyourface_save_font().
  bundle: google_fonts_api
  rubric_ref: rubric/google_fonts_api_gfa_provider_id@1.0
  tags:
  - mode:recipe
