questions:
- id: fc-token-project
  input: Which two config keys must be set to import Fonts.com fonts in Drupal's @font-your-face?
  criteria: fontscom_api.settings:token (API token) and fontscom_api.settings:project (project id); the
    project field appears on the settings form after a token is saved.
  bundle: fontscom_api
  rubric_ref: rubric/fontscom_api_fc_token_project@1.0
  tags:
  - mode:recipe
- id: fc-provider-id
  input: What is the fontyourface provider id and provider name for Fonts.com fonts?
  criteria: pid fontscom_api, provider name 'Fonts.com' (Monotype).
  bundle: fontscom_api
  rubric_ref: rubric/fontscom_api_fc_provider_id@1.0
  tags:
  - mode:recipe
