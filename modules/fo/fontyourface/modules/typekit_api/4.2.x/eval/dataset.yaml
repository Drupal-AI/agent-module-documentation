metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: typekit_api
  version: 4.2.x
  note: Provider submodule of fontyourface; import needs a Typekit token + SSL to Typekit.com, so cases
    are recipe (response-graded).
questions:
- id: tk-token-config
  input: How do you configure Typekit/Adobe font import in Drupal's @font-your-face and where is the credential
    stored?
  criteria: Enter a Typekit API token on the @font-your-face settings form (/admin/appearance/font/settings);
    it is stored in typekit_api.settings:token. The server must reach Typekit.com over SSL.
  bundle: typekit_api
  rubric_ref: rubric/typekit_api_tk_token_config@1.0
  tags:
  - mode:recipe
- id: tk-provider-id
  input: What provider id do Typekit fonts use in fontyourface, and what hook imports them?
  criteria: pid typekit_api; hook_fontyourface_import() imports the kit fonts as font entities.
  bundle: typekit_api
  rubric_ref: rubric/typekit_api_tk_provider_id@1.0
  tags:
  - mode:recipe
