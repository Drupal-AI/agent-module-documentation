rubrics:
- id: local_fonts_lf_self_hosted
  version: '1.0'
  applicable_bundles:
  - local_fonts
  checks:
  - kind: must_contain_any
    values:
    - local_fonts
    - Custom Font
    - local_font_config_entity
    - upload
  - kind: must_not_contain
    values:
    - import from an API
    - google
  scoring:
    combine: all_pass
- id: local_fonts_lf_generated_css
  version: '1.0'
  applicable_bundles:
  - local_fonts
  checks:
  - kind: must_contain_any
    values:
    - font.css
    - public://fontyourface/local_fonts
    - entity_presave
  scoring:
    combine: all_pass
- id: local_fonts_lf_provider_id
  version: '1.0'
  applicable_bundles:
  - local_fonts
  checks:
  - kind: must_contain_any
    values:
    - local_fonts
  scoring:
    combine: all_pass
