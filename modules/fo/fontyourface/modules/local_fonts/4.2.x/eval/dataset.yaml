metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: local_fonts
  version: 4.2.x
  note: Provider submodule of fontyourface; self-hosted fonts are created via a config-entity form (file
    uploads), so cases are recipe (response-graded).
questions:
- id: lf-self-hosted
  input: In Drupal's @font-your-face, which submodule lets you self-host your own font files and how are
    fonts added?
  criteria: local_fonts (provider name Custom Fonts). You add fonts by creating local_font_config_entity
    'Custom Font' entities at /admin/appearance/font/local_font_config_entity, uploading woff/woff2/svg
    files — no remote import.
  bundle: local_fonts
  rubric_ref: rubric/local_fonts_lf_self_hosted@1.0
  tags:
  - mode:recipe
- id: lf-generated-css
  input: What does the local_fonts submodule generate when a Custom Font is saved, and where?
  criteria: On presave it writes the uploaded font files and a generated font.css to public://fontyourface/local_fonts/{id},
    and upserts a matching font entity with url local_fonts://{id}.
  bundle: local_fonts
  rubric_ref: rubric/local_fonts_lf_generated_css@1.0
  tags:
  - mode:recipe
- id: lf-provider-id
  input: What is the fontyourface provider id for locally hosted fonts?
  criteria: The provider id (pid) is local_fonts.
  bundle: local_fonts
  rubric_ref: rubric/local_fonts_lf_provider_id@1.0
  tags:
  - mode:recipe
