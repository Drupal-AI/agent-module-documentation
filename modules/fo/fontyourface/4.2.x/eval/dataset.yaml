metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: fontyourface
  version: 4.2.x
  note: 'Font import needs network + provider keys, so cases are `recipe` (response-graded): they probe
    the data model, the provider hook API (no plugin type), config keys, helper functions and admin routes.'
questions:
- id: fyf-provider-extension-mechanism
  input: In the @font-your-face (fontyourface) Drupal module, how do you add support for a new web-font
    source? Is there a plugin type?
  criteria: 'There is no plugin type. A provider is a submodule implementing hooks: hook_fontyourface_api()
    to announce itself, hook_fontyourface_import() to batch-import fonts (saving each with fontyourface_save_font()),
    and optionally hook_fontyourface_font_css() to override the emitted CSS.'
  bundle: fontyourface
  rubric_ref: rubric/fontyourface_fyf_provider_extension_mechanism@1.0
  tags:
  - mode:recipe
- id: fyf-entities
  input: What two entity types does fontyourface define and what is each for?
  criteria: A `font` content entity (base table fontyourface_font, one per imported font-variant keyed
    by url + provider pid) and a `font_display` config entity that binds an enabled font to CSS selectors,
    a fallback stack and a theme.
  bundle: fontyourface
  rubric_ref: rubric/fontyourface_fyf_entities@1.0
  tags:
  - mode:recipe
- id: fyf-enable-config
  input: Which config object and key track which fonts are activated in fontyourface, and what values
    are stored there?
  criteria: fontyourface.settings; the enabled_fonts key holds an array of activated font URLs (activating
    a font appends its url, deactivating removes it). load_all_enabled_fonts and load_on_themes control
    render-time loading.
  bundle: fontyourface
  rubric_ref: rubric/fontyourface_fyf_enable_config@1.0
  tags:
  - mode:recipe
- id: fyf-configure-route-permission
  input: Where is fontyourface configured (route + path) and which permission gates its admin pages?
  criteria: The configure route is font.settings at /admin/appearance/font/settings; all admin routes
    require the single permission `administer font entities`.
  bundle: fontyourface
  rubric_ref: rubric/fontyourface_fyf_configure_route_permission@1.0
  tags:
  - mode:recipe
- id: fyf-save-font-helper
  input: In fontyourface, which procedural function does a provider call to persist an imported font,
    and how is an existing font matched to avoid duplicates?
  criteria: fontyourface_save_font($font_data) creates or updates a font entity; it matches an existing
    font by its unique url (Font::loadByUrl) and otherwise creates a new one.
  bundle: fontyourface
  rubric_ref: rubric/fontyourface_fyf_save_font_helper@1.0
  tags:
  - mode:recipe
- id: fyf-dependencies
  input: Which Drupal core modules does fontyourface depend on, and why?
  criteria: taxonomy (fonts are tagged by foundry, designer, classification and supported language) and
    views (the font manager admin listing is the fontyourface_font_manager View).
  bundle: fontyourface
  rubric_ref: rubric/fontyourface_fyf_dependencies@1.0
  tags:
  - mode:recipe
