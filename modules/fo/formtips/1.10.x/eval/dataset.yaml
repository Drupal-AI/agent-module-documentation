metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: formtips
  version: 1.10.x
  note: 'Form Tips is a client-side module that turns Drupal form descriptions into tooltips. All persistent
    state is the single config object formtips.settings (route formtips.setting_form at /admin/config/user-interface/formtips,
    permission ''administer formtips''). Keys: formtips_trigger_action (''click'' default / ''hover''),
    formtips_max_width (''500px'' default), formtips_selectors (newline CSS/jQuery selectors to exclude),
    formtips_themes ({} = all), and the hover-only hoverIntent knobs formtips_hoverintent/interval/sensitivity/timeout.
    Medium cases set a known value in that config and read it back; hard cases change a real key and verify
    against live config.'
questions:
- id: formtips-trigger-actions
  input: In the Drupal contrib module Form Tips, which setting controls whether a field's description
    tooltip appears on hover versus on click, and what are its two possible values?
  criteria: The formtips_trigger_action setting in formtips.settings controls it; its values are 'click'
    (the default) and 'hover'.
  bundle: formtips
  rubric_ref: rubric/formtips_formtips_trigger_actions@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: formtips-config-object
  input: Where does Form Tips store its configuration on a Drupal 11 site, and at what admin path / route
    is its settings form? Which permission protects it?
  criteria: All settings are in the formtips.settings config object; the form is at /admin/config/user-interface/formtips
    (route formtips.setting_form), protected by the 'administer formtips' permission.
  bundle: formtips
  rubric_ref: rubric/formtips_formtips_config_object@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: formtips-exclude-fields
  input: On a Form Tips-enabled Drupal site, how do I stop certain form fields from being converted into
    tooltips, and how is that value formatted?
  criteria: Set formtips_selectors in formtips.settings to a newline-separated list of CSS/jQuery selectors;
    elements matching those selectors are excluded from tooltip conversion.
  bundle: formtips
  rubric_ref: rubric/formtips_formtips_exclude_fields@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: formtips-known-maxwidth
  input: On this Drupal site Form Tips is configured with a specific maximum tooltip width. Inspect the
    live formtips configuration and state the exact value of the tooltip max-width setting.
  criteria: formtips.settings:formtips_max_width is '321px'.
  bundle: formtips
  rubric_ref: rubric/formtips_formtips_known_maxwidth@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/formtips-known-maxwidth-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/formtips-known-maxwidth-cleanup.sh
- id: formtips-known-selectors
  input: This site has Form Tips configured to exclude one selector from tooltip conversion. Inspect the
    live configuration and give the exact selector that is excluded.
  criteria: formtips.settings:formtips_selectors is '#formtips-eval-skip'.
  bundle: formtips
  rubric_ref: rubric/formtips_formtips_known_selectors@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/formtips-known-selectors-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/formtips-known-selectors-cleanup.sh
- id: formtips-set-hover
  input: On this Drupal site, configure Form Tips so that description tooltips open on hover instead of
    on click. Apply the change to the live site.
  criteria: Set formtips.settings:formtips_trigger_action to 'hover' (e.g. drush cset formtips.settings
    formtips_trigger_action hover -y, or via the settings form).
  bundle: formtips
  rubric_ref: rubric/formtips_formtips_set_hover@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/formtips-set-hover-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/formtips-set-hover-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/formtips-set-hover-verify.sh
- id: formtips-set-maxwidth
  input: On this Drupal site, make Form Tips tooltips at most 640px wide. Apply the change to the live
    configuration.
  criteria: Set formtips.settings:formtips_max_width to '640px' (e.g. drush cset formtips.settings formtips_max_width
    '640px' -y).
  bundle: formtips
  rubric_ref: rubric/formtips_formtips_set_maxwidth@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/formtips-set-maxwidth-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/formtips-set-maxwidth-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/formtips-set-maxwidth-verify.sh
