metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: form_mode_manager
  version: 3.1.x
  note: 'Form Mode Manager makes Drupal form modes usable by generating add/edit routes, tabs, local actions
    and per-mode permissions. A form mode is ACTIVE for an entity type when a core.entity_form_display.<entity>.<bundle>.<mode>
    config exists (mode != default) — FormModeManager::getActiveDisplays() reads exactly that. Configure
    route form_mode_manager.admin_settings (/admin/config/content/form_mode_manager) -> config form_mode_manager.settings
    (form_modes.<entity>.to_exclude; user.register + commerce_order_item.add_to_cart excluded by default).
    Second form .../links-task -> config form_mode_manager.links. Plugin type entity_routing_map (manager
    plugin.manager.entity_routing_map; @EntityRoutingMap; built-ins node/user/taxonomy_term/block_content
    + generic fallback). Dynamic permissions: ''use <entity>.<mode> form mode'' and ''use <entity>.default
    form mode''. Medium cases read an active form mode and an excluded mode; hard cases activate a form
    mode on Article (create the entity_form_display) and exclude a mode via config. NOTE: the site also
    has an active ''contributor'' node form mode from the form_mode_manager_examples submodule, so grading
    targets the case-specific fmm_* names.'
questions:
- id: form_mode_manager-activate-howto
  input: I created a form mode for the Article content type but nothing changed on the site. Using form_mode_manager,
    how do I actually make that form mode usable for adding/editing articles, and what URL then lets me
    add an article with it?
  criteria: Enable the form mode on the bundle's Manage form display via the 'Custom Display settings'
    fieldset (this creates a core.entity_form_display.node.article.<mode>). Form Mode Manager then exposes
    it at node/add/article/<mode> and as an edit tab.
  bundle: form_mode_manager
  rubric_ref: rubric/form_mode_manager_form_mode_manager_activate_howto@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: form_mode_manager-permission
  input: How does form_mode_manager let me restrict a specific form mode to a particular role? What do
    the generated permissions look like?
  criteria: 'It generates dynamic permissions per form mode: ''use <entity_type>.<form_mode> form mode''
    (e.g. ''use node.contributor form mode'') and ''use <entity_type>.default form mode''. Grant the per-mode
    permission to a role, and optionally revoke the default one to force that role to use only the mode.'
  bundle: form_mode_manager
  rubric_ref: rubric/form_mode_manager_form_mode_manager_permission@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: form_mode_manager-plugin-type
  input: I have a custom content entity and want form_mode_manager to build form-mode add/edit routes
    for it. What plugin type does form_mode_manager provide for this, and what fallback exists for standard
    entities?
  criteria: It defines the entity_routing_map plugin type (@EntityRoutingMap, manager plugin.manager.entity_routing_map).
    Add a plugin in src/Plugin/EntityRoutingMap mapping your entity's add_form/edit_form/add_page route
    names; a 'generic' fallback plugin handles standard entities automatically.
  bundle: form_mode_manager
  rubric_ref: rubric/form_mode_manager_form_mode_manager_plugin_type@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: form_mode_manager-active-mode
  input: On this site, a non-default form mode has been activated (via form_mode_manager) on the Article
    content type. Inspect the live form displays and give the machine name of a form mode that is active
    on node.article besides 'default'.
  criteria: 'fmm_known is active: there is a core.entity_form_display.node.article.fmm_known config entity
    (mode fmm_known).'
  bundle: form_mode_manager
  rubric_ref: rubric/form_mode_manager_form_mode_manager_active_mode@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/form_mode_manager-active-mode-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/form_mode_manager-active-mode-cleanup.sh
- id: form_mode_manager-excluded
  input: This site has been configured to exclude a specific node form mode from form_mode_manager. Inspect
    the live configuration and name the excluded node form mode.
  criteria: 'fmm_hidden is excluded: form_mode_manager.settings form_modes.node.to_exclude contains fmm_hidden.'
  bundle: form_mode_manager
  rubric_ref: rubric/form_mode_manager_form_mode_manager_excluded@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/form_mode_manager-excluded-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/form_mode_manager-excluded-cleanup.sh
- id: form_mode_manager-activate
  input: A form mode with machine name 'fmm_task' already exists for the node entity type on this site,
    but it is not usable yet. Using form_mode_manager, activate that form mode for the Article content
    type so it becomes usable, and apply the change to the live site.
  criteria: A core.entity_form_display.node.article.fmm_task config entity exists (mode fmm_task), e.g.
    by enabling the form mode in the Article Manage form display 'Custom Display settings', so form_mode.manager
    getActiveDisplays('node') includes 'fmm_task'.
  bundle: form_mode_manager
  rubric_ref: rubric/form_mode_manager_form_mode_manager_activate@1.0
