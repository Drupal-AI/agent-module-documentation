metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: form_mode_manager_examples
  version: 3.1.x
  note: 'Example/demo submodule of form_mode_manager. On install it imports config: a node_form_mode_example
    content type (body + field_picture), a node ''contributor'' form mode (core.entity_form_mode.node.contributor)
    with a form display, a view display, and a ''contributor'' role; plus a front-page controller at /form_mode_manager_examples
    and a hook_menu_local_actions_alter. No configure route, no config schema, no permissions of its own.
    Trivial submodule => 3 easy / 1 medium / 1 hard. Medium reads the shipped node_form_mode_example content
    type. Hard activates the shipped ''contributor'' form mode on the Article bundle (config-only; node
    CRUD is avoided because a broken shared-site field storage prevents node deletion).'
questions:
- id: form_mode_manager_examples-what
  input: What does the form_mode_manager_examples submodule install so I can try Form Mode Manager, and
    is it meant for production?
  criteria: It's a demo/example module (not for production). It installs a node_form_mode_example content
    type, a 'contributor' node form mode and role, form/view displays, and a /form_mode_manager_examples
    front page.
  bundle: form_mode_manager_examples
  rubric_ref: rubric/form_mode_manager_examples_form_mode_manager_examples_what@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: form_mode_manager_examples-frontpage
  input: The form_mode_manager_examples module adds a demo landing page. What path is it at, and what
    does it link to?
  criteria: Route form_mode_manager_examples.front_page at /form_mode_manager_examples (permission access
    content); it links to the node_form_mode_example add form and shows an 'Add node as contributor' local
    action.
  bundle: form_mode_manager_examples
  rubric_ref: rubric/form_mode_manager_examples_form_mode_manager_examples_frontpage@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: form_mode_manager_examples-form-mode
  input: Which node form mode does the form_mode_manager_examples submodule ship as a working example,
    and on which content type?
  criteria: A 'contributor' node form mode (core.entity_form_mode.node.contributor), shipped active on
    the node_form_mode_example content type.
  bundle: form_mode_manager_examples
  rubric_ref: rubric/form_mode_manager_examples_form_mode_manager_examples_form_mode@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: form_mode_manager_examples-content-type
  input: The form_mode_manager_examples module is installed on this site. Inspect the live site and give
    the machine name of the demo content type it provides.
  criteria: node_form_mode_example (a node_type shipped by the examples submodule).
  bundle: form_mode_manager_examples
  rubric_ref: rubric/form_mode_manager_examples_form_mode_manager_examples_content_type@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/form_mode_manager_examples-content-type-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/form_mode_manager_examples-content-type-cleanup.sh
- id: form_mode_manager_examples-activate-contributor
  input: The 'contributor' node form mode shipped by form_mode_manager_examples is currently only enabled
    on the demo content type. Activate that same 'contributor' form mode on the Article content type so
    it becomes usable there too, and apply the change to the live site.
  criteria: A core.entity_form_display.node.article.contributor config entity exists (enable the contributor
    form mode in the Article Manage form display 'Custom Display settings').
  bundle: form_mode_manager_examples
  rubric_ref: rubric/form_mode_manager_examples_form_mode_manager_examples_activate_contributor@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/form_mode_manager_examples-activate-contributor-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/form_mode_manager_examples-activate-contributor-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/form_mode_manager_examples-activate-contributor-verify.sh
