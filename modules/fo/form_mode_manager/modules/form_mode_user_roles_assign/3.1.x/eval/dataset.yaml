metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: form_mode_user_roles_assign
  version: 3.1.x
  note: Submodule of form_mode_manager. Auto-assigns user roles when someone registers/is created through
    a Form Mode Manager user form mode. FormAlter reads form_mode_user_roles_assign.settings -> form_modes.user_<form_mode>.assign_roles
    and sets those roles as the default value of the register form's roles element (only on user FMM routes
    matching /user/register/.. or /admin/people/create/..). Configure route form_mode_manager.admin_settings_roles_assign
    (/admin/config/content/form_mode_manager/role-assign). Config key prefix is 'user_' + the form-mode
    machine name. Cases are grounded on this config; role ids used in fixtures are namespaced (fmra_*)
    and only need to exist as config strings. Baseline is empty form_modes; reset/cleanup clear it.
questions:
- id: form_mode_user_roles_assign-what
  input: What does the form_mode_user_roles_assign submodule do, and where is it configured?
  criteria: It automatically assigns user roles when a user registers/is created through a Form Mode Manager
    user form mode. Configure it at /admin/config/content/form_mode_manager/role-assign.
  bundle: form_mode_user_roles_assign
  rubric_ref: rubric/form_mode_user_roles_assign_form_mode_user_roles_assign_what@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: form_mode_user_roles_assign-config-keys
  input: Which config object and key path does form_mode_user_roles_assign use to store which roles get
    assigned for a given user form mode?
  criteria: Config object form_mode_user_roles_assign.settings, key form_modes.user_<form_mode>.assign_roles
    (a list of role ids). The key uses the 'user_' prefix plus the form-mode machine name.
  bundle: form_mode_user_roles_assign
  rubric_ref: rubric/form_mode_user_roles_assign_form_mode_user_roles_assign_config_keys@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: form_mode_user_roles_assign-when
  input: On which forms/routes does form_mode_user_roles_assign actually apply the configured roles, and
    how does it apply them?
  criteria: Only on Form Mode Manager 'user' routes matching the register/create path pattern (/user/register/..
    or /admin/people/create/..). It sets the configured roles as the default (pre-checked) value of the
    register form's roles element.
  bundle: form_mode_user_roles_assign
  rubric_ref: rubric/form_mode_user_roles_assign_form_mode_user_roles_assign_when@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: form_mode_user_roles_assign-partner
