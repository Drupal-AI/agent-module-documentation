metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: form_mode_manager_theme_switcher
  version: 3.1.x
  note: 'Submodule of form_mode_manager. Registers a theme negotiator (theme.negotiator.form_mode_theme_switcher,
    priority -30) that applies on Form Mode Manager routes and picks a theme per form mode. Config object
    form_mode_manager_theme_switcher.settings: type.<form_mode_id> (admin | system-theme-key | _custom)
    and form_mode.<form_mode_id> (specific theme name when _custom). <form_mode_id> = the route _entity_form
    op with dots->underscores, e.g. node.contributor -> node_contributor. Configure route form_mode_manager.theme_switcher_settings
    (/admin/config/content/form_mode_manager/theme-switcher). Medium/hard cases are grounded on this config.
    Baseline for this submodule is empty config (no config/install ships), so cleanup/reset clear type/form_mode
    to empty.'
questions:
- id: form_mode_manager_theme_switcher-what
  input: What does the form_mode_manager_theme_switcher module let me do, and where do I configure it?
  criteria: It assigns a specific theme (admin, a system theme, or a named custom theme) to each Form
    Mode Manager form-mode route via a theme negotiator. Configure it at /admin/config/content/form_mode_manager/theme-switcher.
  bundle: form_mode_manager_theme_switcher
  rubric_ref: rubric/form_mode_manager_theme_switcher_form_mode_manager_theme_switcher_what@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: form_mode_manager_theme_switcher-config-keys
  input: Which config object and keys does form_mode_manager_theme_switcher use to store the theme chosen
    for a form mode, and how is the form-mode key derived?
  criteria: Config object form_mode_manager_theme_switcher.settings with type.<form_mode_id> (admin |
    system theme key | _custom) and form_mode.<form_mode_id> (specific theme when _custom). <form_mode_id>
    is the _entity_form operation with dots replaced by underscores (e.g. node.contributor -> node_contributor).
  bundle: form_mode_manager_theme_switcher
  rubric_ref: rubric/form_mode_manager_theme_switcher_form_mode_manager_theme_switcher_config_keys@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: form_mode_manager_theme_switcher-scope
  input: Does form_mode_manager_theme_switcher change the theme on all routes? When does its theme negotiator
    apply?
  criteria: No — the negotiator (theme.negotiator.form_mode_theme_switcher) only applies on routes generated
    by Form Mode Manager (routes carrying the _form_mode_manager_entity_type_id option) that have a configured
    type or a form_mode_theme route option.
  bundle: form_mode_manager_theme_switcher
  rubric_ref: rubric/form_mode_manager_theme_switcher_form_mode_manager_theme_switcher_scope@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: form_mode_manager_theme_switcher-admin-type
  input: On this site, form_mode_manager_theme_switcher has been configured for the node 'contributor'
    form mode. Inspect the live configuration and state which theme type is set for it.
  criteria: type.node_contributor = admin (the contributor form-mode forms use the admin theme).
  bundle: form_mode_manager_theme_switcher
  rubric_ref: rubric/form_mode_manager_theme_switcher_form_mode_manager_theme_switcher_admin_type@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/form_mode_manager_theme_switcher-admin-type-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/form_mode_manager_theme_switcher-admin-type-cleanup.sh
- id: form_mode_manager_theme_switcher-custom-theme
  input: The node 'editor' form mode on this site is configured with form_mode_manager_theme_switcher
    to use a specific custom theme. Inspect the live configuration and name that theme.
  criteria: type.node_editor is _custom and form_mode.node_editor is 'claro'.
  bundle: form_mode_manager_theme_switcher
  rubric_ref: rubric/form_mode_manager_theme_switcher_form_mode_manager_theme_switcher_custom_theme@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/form_mode_manager_theme_switcher-custom-theme-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/form_mode_manager_theme_switcher-custom-theme-cleanup.sh
- id: form_mode_manager_theme_switcher-set-admin
  input: Using form_mode_manager_theme_switcher, configure the node 'contributor' form mode so its add/edit
    forms render in the site's admin theme. Apply the change to the live site.
  criteria: form_mode_manager_theme_switcher.settings type.node_contributor = 'admin'.
  bundle: form_mode_manager_theme_switcher
  rubric_ref: rubric/form_mode_manager_theme_switcher_form_mode_manager_theme_switcher_set_admin@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/form_mode_manager_theme_switcher-set-admin-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/form_mode_manager_theme_switcher-set-admin-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/form_mode_manager_theme_switcher-set-admin-verify.sh
- id: form_mode_manager_theme_switcher-set-custom
  input: Using form_mode_manager_theme_switcher, make the node 'reviewer' form mode use the specific theme
    'claro' (a named custom theme, not the admin/front default). Apply the change to the live site.
  criteria: form_mode_manager_theme_switcher.settings type.node_reviewer = '_custom' and form_mode.node_reviewer
    = 'claro'.
  bundle: form_mode_manager_theme_switcher
  rubric_ref: rubric/form_mode_manager_theme_switcher_form_mode_manager_theme_switcher_set_custom@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/form_mode_manager_theme_switcher-set-custom-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/form_mode_manager_theme_switcher-set-custom-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/form_mode_manager_theme_switcher-set-custom-verify.sh
