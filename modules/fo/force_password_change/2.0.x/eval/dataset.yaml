metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: force_password_change
  version: 2.0.x
  note: 'Force Password Change stores site settings in the config object force_password_change.settings
    (keys enabled, check_login_only, first_time_login_password_change, expire_password, installation_date)
    and stores an individual user''s pending force in core user.data under module ''force_password_change''
    key ''pending_force'' (=1). Settings form at /admin/config/people/force_password_change (route force_password_change.admin,
    permission ''administer force password change''). The service force_password_change.service forces
    changes: forceUserPasswordChange($uid) writes user.data pending_force=1. Medium/hard cases are grounded
    in that real config and user.data state; execution cases mutate config or a namespaced test user (fpc_*).'
questions:
- id: force_password_change-settings-location
  input: 'On a Drupal 11 site with the force_password_change module, where is its administration settings
    form, and which config object stores its site-wide settings? Also: how can I disable the module''s
    enforcement from settings.php if it locks me out, without uninstalling it?'
  criteria: 'Settings form is at /admin/config/people/force_password_change (route force_password_change.admin,
    permission ''administer force password change''). Settings live in the force_password_change.settings
    config object. Emergency disable: add $config[''force_password_change.settings''][''enabled''] = FALSE;
    to settings.php.'
  bundle: force_password_change
  rubric_ref: rubric/force_password_change_force_password_change_settings_location@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: force_password_change-check-mode
  input: In the force_password_change module, what does the check_login_only setting control, and what
    is the practical difference between its two values?
  criteria: check_login_only chooses when a pending forced password change is detected. FALSE = check
    on every page load (an event subscriber/http middleware redirects the user to their edit form immediately;
    most secure, small per-request overhead). TRUE = check only when the user logs in (hook_user_login),
    so a change may not be enforced until the next login.
  bundle: force_password_change
  rubric_ref: rubric/force_password_change_force_password_change_check_mode@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: force_password_change-force-from-code
  input: Using the force_password_change module's service, how do I programmatically force specific users
    to change their password, and where does the module record that a given user has a pending forced
    change?
  criteria: 'Call \Drupal::service(''force_password_change.service'')->forceUsersPasswordChange([$uids])
    (empty array forces all active users), or forceUserPasswordChange($uid) for one. Internally it sets
    core user.data: module ''force_password_change'', key ''pending_force'' = 1 for that uid. Check it
    with \Drupal::service(''user.data'')->get(''force_password_change'', $uid, ''pending_force'').'
  bundle: force_password_change
  rubric_ref: rubric/force_password_change_force_password_change_force_from_code@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: force_password_change-settings-introspect
  input: 'On this Drupal site the force_password_change module has been configured. Inspect the live configuration
    and report: (a) is ''force password change on first-time login'' enabled, and (b) is the pending-change
    check set to happen on every page load or on login only?'
  criteria: In force_password_change.settings, first_time_login_password_change is TRUE (first-time-login
    forcing is enabled) and check_login_only is TRUE (the check runs on login only, not on every page
    load).
  bundle: force_password_change
  rubric_ref: rubric/force_password_change_force_password_change_settings_introspect@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/force_password_change-settings-introspect-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/force_password_change-settings-introspect-cleanup.sh
- id: force_password_change-pending-user-introspect
  input: This site has a user account whose email is fpc_known@example.com. Determine, by inspecting the
    live site, whether that user currently has a pending forced password change from the force_password_change
    module, and answer yes or no.
  criteria: 'Yes. The user (email fpc_known@example.com) has a pending forced password change: core user.data
    for module ''force_password_change'', key ''pending_force'', is 1 for that user''s uid (set via the
    force_password_change.service).'
  bundle: force_password_change
  rubric_ref: rubric/force_password_change_force_password_change_pending_user_introspect@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/force_password_change-pending-user-introspect-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/force_password_change-pending-user-introspect-cleanup.sh
- id: force_password_change-enable-first-login
  input: On this Drupal site, configure the force_password_change module so that ALL newly created users
    are forced to change their password on their first login. Apply the change to the live site.
  criteria: Set force_password_change.settings first_time_login_password_change to TRUE (e.g. drush cset
    force_password_change.settings first_time_login_password_change 1 -y, or tick 'Force password change
    on first-time login' on the settings form).
  bundle: force_password_change
  rubric_ref: rubric/force_password_change_force_password_change_enable_first_login@1.0
  tags:
