rubrics:
- id: force_password_change_force_password_change_settings_location
  version: '1.0'
  applicable_bundles:
  - force_password_change
  checks:
  - kind: must_contain_any
    values:
    - force_password_change.settings
    - /admin/config/people/force_password_change
    - force_password_change.admin
  scoring:
    combine: all_pass
- id: force_password_change_force_password_change_check_mode
  version: '1.0'
  applicable_bundles:
  - force_password_change
  checks:
  - kind: must_contain_any
    values:
    - check_login_only
    - every page load
    - on login only
    - login only
  scoring:
    combine: all_pass
- id: force_password_change_force_password_change_force_from_code
  version: '1.0'
  applicable_bundles:
  - force_password_change
  checks:
  - kind: must_contain_any
    values:
    - force_password_change.service
    - forceUsersPasswordChange
    - forceUserPasswordChange
    - pending_force
    - user.data
  scoring:
    combine: all_pass
- id: force_password_change_force_password_change_settings_introspect
  version: '1.0'
  applicable_bundles:
  - force_password_change
  checks:
  - kind: must_contain_any
    values:
    - login only
    - on login only
    - check_login_only
    - first-time login
    - first_time_login_password_change
  scoring:
    combine: all_pass
- id: force_password_change_force_password_change_pending_user_introspect
  version: '1.0'
  applicable_bundles:
  - force_password_change
  checks:
  - kind: must_contain_any
    values:
    - 'yes'
    - pending_force
    - pending
  scoring:
    combine: all_pass
- id: force_password_change_force_password_change_enable_first_login
  version: '1.0'
  applicable_bundles:
  - force_password_change
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
- id: force_password_change_force_password_change_force_user
  version: '1.0'
  applicable_bundles:
  - force_password_change
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
