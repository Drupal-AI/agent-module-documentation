rubrics:
- id: footnotes_footnotes_enable_two_things
  version: '1.0'
  applicable_bundles:
  - footnotes
  checks:
  - kind: must_contain_any
    values:
    - filter_footnotes
    - toolbar
  scoring:
    combine: all_pass
- id: footnotes_footnotes_collapse_setting
  version: '1.0'
  applicable_bundles:
  - footnotes
  checks:
  - kind: must_contain_any
    values:
    - footnotes_collapse
  scoring:
    combine: all_pass
- id: footnotes_footnotes_upgrade_command
  version: '1.0'
  applicable_bundles:
  - footnotes
  checks:
  - kind: must_contain_any
    values:
    - footnotes:upgrade-3-to-4
  scoring:
    combine: all_pass
- id: footnotes_footnotes_preview_char
  version: '1.0'
  applicable_bundles:
  - footnotes
  checks:
  - kind: must_contain_any
    values:
    - FN9
  scoring:
    combine: all_pass
- id: footnotes_footnotes_collapse_state
  version: '1.0'
  applicable_bundles:
  - footnotes
  checks:
  - kind: must_contain_any
    values:
    - footnotes_collapse
    - 'true'
    - 'yes'
    - enabled
    - collapse
  scoring:
    combine: all_pass
- id: footnotes_footnotes_enable_filter
  version: '1.0'
  applicable_bundles:
  - footnotes
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
- id: footnotes_footnotes_suppress_footer
  version: '1.0'
  applicable_bundles:
  - footnotes
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
