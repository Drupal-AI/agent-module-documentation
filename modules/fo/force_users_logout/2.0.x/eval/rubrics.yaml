rubrics:
- id: force_users_logout_force_users_logout_mechanism
  version: '1.0'
  applicable_bundles:
  - force_users_logout
  checks:
  - kind: must_contain_any
    values:
    - session_manager
    - sessions
    - SessionManager
  scoring:
    combine: all_pass
- id: force_users_logout_force_users_logout_permission
  version: '1.0'
  applicable_bundles:
  - force_users_logout
  checks:
  - kind: must_contain_any
    values:
    - administer users
  scoring:
    combine: all_pass
- id: force_users_logout_force_users_logout_excluded_roles
  version: '1.0'
  applicable_bundles:
  - force_users_logout
  checks:
  - kind: must_contain_any
    values:
    - administrator
    - authenticated
    - anonymous
  scoring:
    combine: all_pass
- id: force_users_logout_force_users_logout_active_session
  version: '1.0'
  applicable_bundles:
  - force_users_logout
  checks:
  - kind: must_contain_any
    values:
    - ful_intro_active
  scoring:
    combine: all_pass
- id: force_users_logout_force_users_logout_role_access
  version: '1.0'
  applicable_bundles:
  - force_users_logout
  checks:
  - kind: must_contain_any
    values:
    - ful_intro_ops
  scoring:
    combine: all_pass
- id: force_users_logout_force_users_logout_logout_user
  version: '1.0'
  applicable_bundles:
  - force_users_logout
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
- id: force_users_logout_force_users_logout_logout_role
  version: '1.0'
  applicable_bundles:
  - force_users_logout
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
