metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: fontawesome_menu_icons
  version: 3.0.x
  note: 'Easy cases are response-graded against the module''s load-bearing facts (the four fa_icon* option
    keys, storage location, no configure route, dependencies). Medium (introspection) cases install a
    known custom menu link carrying an icon and ask the agent to read it back off the live site. Hard
    (execution) cases start from a link with no icon and require the agent to set the icon on the live
    menu_link_content entity''s link options, verified against live state. Confirmed on the live site:
    custom menu_link_content icons live in the entity''s link field options; the fontawesome_menu_icons.settings:menu_link_icons
    config stays null and only mirrors module-defined links.'
questions:
- id: famenu-option-keys
  input: In the FontAwesome Menu Icons module for Drupal, which four values describe the icon attached
    to a menu link (the option keys stored on the link), and what does each control?
  criteria: 'Four keys: fa_icon (icon class/name), fa_icon_prefix (style/version prefix, e.g. fa / fas
    / fa-solid, default fa), fa_icon_tag (wrapper tag i or span, default i), and fa_icon_appearance (before
    / after / only, default before).'
  bundle: fontawesome_menu_icons
  rubric_ref: rubric/fontawesome_menu_icons_famenu_option_keys@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: famenu-no-config-route
  input: Where is the admin settings form for the FontAwesome Menu Icons module, and how do I configure
    which icon a menu link shows?
  criteria: There is no global settings form and no configure route. You set an icon per menu link via
    the 'FontAwesome Icon' fieldset the module adds to the menu-link add/edit form (custom links and module-defined
    links).
  bundle: fontawesome_menu_icons
  rubric_ref: rubric/fontawesome_menu_icons_famenu_no_config_route@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: famenu-appearance-only
  input: Using FontAwesome Menu Icons, I want a menu link to show ONLY its icon and no visible text (but
    stay accessible to screen readers). Which fa_icon_appearance value do I use and what does the module
    do for accessibility?
  criteria: Set fa_icon_appearance to 'only'; the module renders the icon with aria-hidden="true" and
    adds an aria-label (routed link) or an sr-only title (nolink) so the link text is still exposed to
    assistive tech.
  bundle: fontawesome_menu_icons
  rubric_ref: rubric/fontawesome_menu_icons_famenu_appearance_only@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: famenu-dependencies
  input: What are the module dependencies of FontAwesome Menu Icons for Drupal, and which one actually
    loads the icon font?
  criteria: It depends on the fontawesome (Font Awesome) module, which loads the icon font, and on core
    menu_ui.
  bundle: fontawesome_menu_icons
  rubric_ref: rubric/fontawesome_menu_icons_famenu_dependencies@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: famenu-inspect-icon-name
  input: This Drupal site (drush available) has FontAwesome Menu Icons installed and a custom menu link
    titled 'FA Eval Known' in the main menu that already has a Font Awesome icon set. Inspect the live
    site and tell me the icon class (fa_icon) and its style prefix (fa_icon_prefix) on that link, and
    where exactly that value is stored.
  criteria: fa_icon = fa-rocket, fa_icon_prefix = fa-solid, stored in the menu_link_content entity's link
    field options array (link.first().options), not in the fontawesome_menu_icons.settings config.
  bundle: fontawesome_menu_icons
  rubric_ref: rubric/fontawesome_menu_icons_famenu_inspect_icon_name@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    persona: drupal-expert
    setup: agent-module-documentation/evaluation/verify/fontawesome_menu_icons-inspect-icon-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/fontawesome_menu_icons-inspect-icon-cleanup.sh
- id: famenu-inspect-appearance
  input: On this Drupal site there is a custom menu link titled 'FA Eval Known' with a Font Awesome icon.
    Inspect the running site and tell me how the icon is placed relative to the link text (its fa_icon_appearance
    value) and which HTML tag wraps it (fa_icon_tag).
  criteria: fa_icon_appearance = after (icon shown after the text) and fa_icon_tag = i, read from the
    'FA Eval Known' menu_link_content link options.
  bundle: fontawesome_menu_icons
  rubric_ref: rubric/fontawesome_menu_icons_famenu_inspect_appearance@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    persona: drupal-expert
    setup: agent-module-documentation/evaluation/verify/fontawesome_menu_icons-inspect-icon-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/fontawesome_menu_icons-inspect-icon-cleanup.sh
