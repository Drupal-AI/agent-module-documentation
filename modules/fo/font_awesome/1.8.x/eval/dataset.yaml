metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: font_awesome
  version: 1.8.x
  note: 'Font Awesome supplies field plugins for core ''string'' fields (no new field type). Widgets:
    font_awesome_icon_picker_widget (current) and font_awesome_icon_picker (legacy, default ''fas fa-eye'').
    Formatter: font_awesome_icon (extends StringFormatter) with settings size (fa-xs..fa-10x) and fixed_width
    (default fa-fw). Requires lp_fontawesome for the actual assets. Config is per field on Manage form
    display / Manage display. Medium introspection reads back the size setting of a known icon formatter;
    hard execution has the agent set a string field''s display formatter to font_awesome_icon with size
    fa-3x, verified on the live view display. Fixtures create their own namespaced string field (field_fa_*)
    and delete only that field.'
questions:
- id: font_awesome-field-type
  input: Does the font_awesome (Font Awesome fields) module define its own field type for storing icons?
    What kind of field do you use, and what does it store?
  criteria: No new field type is defined. You use a core plain-text (string) field; it stores an icon
    class string like 'fas fa-eye'. The module only adds widgets and a formatter for string fields.
  bundle: font_awesome
  rubric_ref: rubric/font_awesome_font_awesome_field_type@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: font_awesome-formatter
  input: Which field formatter does font_awesome provide to render an icon, and what two display settings
    does it expose?
  criteria: The formatter is font_awesome_icon ('Icon'), for string fields. Its settings are size (empty,
    or fa-xs..fa-10x) and fixed_width (fa-fw by default). It renders the value as <i class="value size
    fixed_width">.
  bundle: font_awesome
  rubric_ref: rubric/font_awesome_font_awesome_formatter@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: font_awesome-library-dep
  input: Where do the actual Font Awesome assets (the JS/SVG font) come from when using the font_awesome
    module, since the module doesn't bundle the font?
  criteria: From the required lp_fontawesome module (built on Libraries Provider), which handles CDN vs
    local, minification and version. The formatter attaches lp_fontawesome/fontawesome when an icon renders.
  bundle: font_awesome
  rubric_ref: rubric/font_awesome_font_awesome_library_dep@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: font_awesome-known-size
  input: On this site, the Article content type has a text field (field_fa_known) whose display uses the
    Font Awesome Icon formatter with a specific size class. Inspect the live default view display for
    Article and report the icon size setting.
  criteria: In core.entity_view_display.node.article.default the field_fa_known component uses formatter
    font_awesome_icon with settings.size = fa-2x.
  bundle: font_awesome
  rubric_ref: rubric/font_awesome_font_awesome_known_size@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/font_awesome-known-size-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/font_awesome-known-size-cleanup.sh
- id: font_awesome-set-formatter
  input: The Article content type has a plain text field field_fa_task. Using the font_awesome module,
    configure the default display so this field renders as a Font Awesome icon at size 'fa-3x' (three
    times). Apply the change to the live site.
  criteria: In core.entity_view_display.node.article.default the field_fa_task component has type = font_awesome_icon
    and settings.size = fa-3x (e.g. $vd->setComponent('field_fa_task', ['type'=>'font_awesome_icon','settings'=>['size'=>'fa-3x','fixed_width'=>'fa-fw']])->save()).
  bundle: font_awesome
  rubric_ref: rubric/font_awesome_font_awesome_set_formatter@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/font_awesome-set-formatter-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/font_awesome-set-formatter-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/font_awesome-set-formatter-verify.sh
- id: font_awesome-known-widget
  input: On this site the Article content type has a text field (field_fa_wknown) whose edit form uses
