rubrics:
- id: link_description_link_description_ids
  version: '1.0'
  applicable_bundles:
  - link_description
  checks:
  - kind: must_contain_any
    values:
    - link_description
    - link_separate_description
  scoring:
    combine: all_pass
- id: link_description_link_description_stores
  version: '1.0'
  applicable_bundles:
  - link_description
  checks:
  - kind: must_contain_any
    values:
    - description
    - text
    - big
  scoring:
    combine: all_pass
- id: link_description_link_description_separate_formatter
  version: '1.0'
  applicable_bundles:
  - link_description
  checks:
  - kind: must_contain_any
    values:
    - link_separate_description
    - Title and link URL with description
  scoring:
    combine: all_pass
- id: link_description_link_description_known_field
  version: '1.0'
  applicable_bundles:
  - link_description
  checks:
  - kind: must_contain_any
    values:
    - field_ld_known
  scoring:
    combine: all_pass
- id: link_description_link_description_known_formatter
  version: '1.0'
  applicable_bundles:
  - link_description
  checks:
  - kind: must_contain_any
    values:
    - link_separate_description
  scoring:
    combine: all_pass
- id: link_description_link_description_add_field
  version: '1.0'
  applicable_bundles:
  - link_description
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
- id: link_description_link_description_separate_formatter_exec
  version: '1.0'
  applicable_bundles:
  - link_description
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
