rubrics:
- id: linkicon_linkicon_formatter_basics
  version: '1.0'
  applicable_bundles:
  - linkicon
  checks:
  - kind: must_contain_any
    values:
    - linkicon
    - linkicon_prefix
    - prefix
  scoring:
    combine: all_pass
- id: linkicon_linkicon_settings_location
  version: '1.0'
  applicable_bundles:
  - linkicon
  checks:
  - kind: must_contain_any
    values:
    - linkicon.settings
    - font
    - administer linkicon
    - /admin/config/user-interface/linkicon
  scoring:
    combine: all_pass
- id: linkicon_linkicon_predefined_titles
  version: '1.0'
  applicable_bundles:
  - linkicon
  checks:
  - kind: must_contain_any
    values:
    - title_predefined
    - Predefined
    - key|value
    - key/value
  scoring:
    combine: all_pass
- id: linkicon_linkicon_known_font
  version: '1.0'
  applicable_bundles:
  - linkicon
  checks:
  - kind: must_contain_any
    values:
    - /libraries/li-eval/fontello.css
  scoring:
    combine: all_pass
- id: linkicon_linkicon_known_formatter
  version: '1.0'
  applicable_bundles:
  - linkicon
  checks:
  - kind: must_contain_any
    values:
    - field_li_known
  scoring:
    combine: all_pass
- id: linkicon_linkicon_set_formatter
  version: '1.0'
  applicable_bundles:
  - linkicon
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
- id: linkicon_linkicon_enable_predefined
  version: '1.0'
  applicable_bundles:
  - linkicon
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
