metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: link_field_tweak
  version: 1.0.x
  note: 'Hook-based tweaks for core''s link field / link_default widget. Config UI route link_field_tweak.settings
    (/admin/config/content/link-field-tweak). Three storage locations: site-wide config object link_field_tweak.settings
    (widget_field_order, add_another_link, uri_part_required); per-widget third_party_settings.link_field_tweak.*
    on entity_form_display components (link_default_field_order, uri_part_custom_help(+_text), title_part_custom_help(+_text),
    uri_part_required, autocomplete_route_name_change); and two field formatters link_text / link_text_empty
    (setting link_text) on entity_view_display. Medium cases read a seeded per-widget custom help text
    and a seeded site-wide toggle; hard cases turn a per-widget field-order third-party setting on, and
    enable the site-wide add_another_link toggle, verified against live config/displays.'
questions:
- id: link_field_tweak-what-tweaks
  input: On a Drupal site I want the core Link field's widget to show the Title box above the URL box
    (like Drupal 7). What module does that and where is the site-wide setting?
  criteria: Link Field tweaks provides it. Enable the site-wide toggle at Configuration > Content authoring
    > Link field settings (/admin/config/content/link-field-tweak), which sets link_field_tweak.settings.widget_field_order;
    you can also set it per widget (link_default_field_order third-party setting).
  bundle: link_field_tweak
  rubric_ref: rubric/link_field_tweak_link_field_tweak_what_tweaks@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: link_field_tweak-formatters
  input: Using link_field_tweak, how can I make a link field always render with a fixed anchor text like
    'Read more' regardless of the stored link title? Which formatter and setting?
  criteria: Use the 'Link text' formatter (id link_text) on Manage display and set its link_text setting
    (e.g. 'Read more'); it overrides the field's link text (XSS-filtered). 'Link text replacing empty
    text' (link_text_empty) applies the fixed text only when the title is empty.
  bundle: link_field_tweak
  rubric_ref: rubric/link_field_tweak_link_field_tweak_formatters@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: link_field_tweak-custom-help
  input: I need to replace the default help text under a Link field's URL box with my own instructions,
    and add help under the Title box (which core has none). How does link_field_tweak let me do that and
    where is it stored?
  criteria: On the field's Manage form display, open the link widget settings and enable 'custom help
    text' for the URI (uri_part_custom_help + uri_part_custom_help_text) and/or Title (title_part_custom_help
    + title_part_custom_help_text). These persist as third_party_settings.link_field_tweak.* on the entity_form_display
    component.
  bundle: link_field_tweak
  rubric_ref: rubric/link_field_tweak_link_field_tweak_custom_help@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: link_field_tweak-known-help
  input: On this Drupal site the Article content type has a link field named field_lft_known whose widget
    uses link_field_tweak to show custom URL help text. Inspect the live default form display and report
    the exact custom help text configured for its URL part.
  criteria: In core.entity_form_display.node.article.default the field_lft_known component has third_party_settings.link_field_tweak.uri_part_custom_help
    = true and uri_part_custom_help_text = 'Known campaign URL help'.
  bundle: link_field_tweak
  rubric_ref: rubric/link_field_tweak_link_field_tweak_known_help@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/link_field_tweak-known-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/link_field_tweak-known-cleanup.sh
- id: link_field_tweak-sitewide-value
  input: This site has link_field_tweak installed. Inspect its live site-wide settings and state which
    of the three global toggles (switch field order, relabel 'Add another item', require URL when title
    filled) is currently enabled, naming the config key.
  criteria: In link_field_tweak.settings, add_another_link is TRUE (relabel 'Add another item' to 'Add
    another link'), while widget_field_order and uri_part_required are FALSE.
  bundle: link_field_tweak
  rubric_ref: rubric/link_field_tweak_link_field_tweak_sitewide_value@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/link_field_tweak-sitewide-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/link_field_tweak-sitewide-cleanup.sh
- id: link_field_tweak-enable-fieldorder
  input: On this Drupal site the Article content type has a link field field_lft_task using the core link
    widget. Using link_field_tweak, configure that widget (per-widget, on the default form display) to
    switch the field order so the Title appears before the URL, and apply the change to the live site.
  criteria: In core.entity_form_display.node.article.default the field_lft_task component carries third_party_settings.link_field_tweak.link_default_field_order
    = true (tick 'Switch field order' on the widget in Manage form display, or set it on the component
    and save).
  bundle: link_field_tweak
  rubric_ref: rubric/link_field_tweak_link_field_tweak_enable_fieldorder@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/link_field_tweak-fieldorder-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/link_field_tweak-fieldorder-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/link_field_tweak-fieldorder-verify.sh
- id: link_field_tweak-enable-addlink
  input: Using link_field_tweak on this site, turn on the site-wide option that relabels the link widget's
    'Add another item' button to 'Add another link', and save it to the live configuration.
  criteria: The config object link_field_tweak.settings has add_another_link = true (set via the Link
    field settings form at /admin/config/content/link-field-tweak or drush cset), saved to the live site.
  bundle: link_field_tweak
  rubric_ref: rubric/link_field_tweak_link_field_tweak_enable_addlink@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/link_field_tweak-addlink-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/link_field_tweak-addlink-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/link_field_tweak-addlink-verify.sh
