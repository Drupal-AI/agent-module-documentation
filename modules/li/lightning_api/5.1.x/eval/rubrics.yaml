rubrics:
- id: lightning_api_lightning_api_standards
  version: '1.0'
  applicable_bundles:
  - lightning_api
  checks:
  - kind: must_contain_any
    values:
    - json:api
    - jsonapi
    - oauth
    - simple_oauth
  scoring:
    combine: all_pass
- id: lightning_api_lightning_api_settings_keys
  version: '1.0'
  applicable_bundles:
  - lightning_api
  checks:
  - kind: must_contain_any
    values:
    - entity_json
    - bundle_docs
  scoring:
    combine: all_pass
- id: lightning_api_lightning_api_keys_route
  version: '1.0'
  applicable_bundles:
  - lightning_api
  checks:
  - kind: must_contain_any
    values:
    - /admin/config/system/lightning/api/keys
    - lightning/api/keys
    - administer simple_oauth entities
    - simple_oauth
  scoring:
    combine: all_pass
- id: lightning_api_lightning_api_read_entityjson
  version: '1.0'
  applicable_bundles:
  - lightning_api
  checks:
  - kind: must_contain_any
    values:
    - entity_json
    - enabled
    - 'true'
    - 'yes'
  scoring:
    combine: all_pass
- id: lightning_api_lightning_api_read_bundledocs
  version: '1.0'
  applicable_bundles:
  - lightning_api
  checks:
  - kind: must_contain_any
    values:
    - bundle_docs
    - enabled
    - 'true'
    - 'yes'
  scoring:
    combine: all_pass
- id: lightning_api_lightning_api_enable_entityjson
  version: '1.0'
  applicable_bundles:
  - lightning_api
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
- id: lightning_api_lightning_api_enable_bundledocs
  version: '1.0'
  applicable_bundles:
  - lightning_api
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
