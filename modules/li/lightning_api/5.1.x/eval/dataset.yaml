metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: lightning_api
  version: 5.1.x
  note: 'Content API (lightning_api) glues core JSON:API + optional Simple OAuth + OpenAPI for decoupled
    Drupal. Its own config is lightning_api.settings with two booleans: entity_json (''View JSON'' entity
    operation link -> the entity''s JSON:API URL) and bundle_docs (''View API Documentation'' bundle operation
    link), both default false. Settings form /admin/config/system/lightning/api (route lightning_api.settings,
    permission ''administer site configuration''). A second form /admin/config/system/lightning/api/keys
    (route lightning_api.generate_keys, permission ''administer simple_oauth entities'', requires simple_oauth)
    generates an OAuth2 key pair and writes paths into simple_oauth.settings. Depends on jsonapi + path_alias.
    OAuth key generation is intentionally NOT used as an eval (it writes secret files and mutates another
    module''s config, simple_oauth.settings); all cases stay within lightning_api.settings. Medium cases
    enable a toggle and read it back; hard cases enable a toggle verified against live config. reset/cleanup
    restore both toggles to false.'
questions:
- id: lightning_api-standards
  input: The Drupal lightning_api (Content API) module builds a content API on top of which two web standards
    / contrib modules for serialization and authentication?
  criteria: It builds on JSON:API (core jsonapi module) for serialization and OAuth2 (the Simple OAuth
    module) for authentication/authorization; it depends on jsonapi (and path_alias) and optionally integrates
    simple_oauth and OpenAPI.
  bundle: lightning_api
  rubric_ref: rubric/lightning_api_lightning_api_standards@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: lightning_api-settings-keys
  input: What are the two boolean settings in lightning_api.settings and what does each expose in entity/bundle
    operations?
  criteria: entity_json adds a 'View JSON' operation link on content entities (to the entity's JSON:API
    URL); bundle_docs adds a 'View API Documentation' operation link on bundle entities. Both default
    to false in lightning_api.settings.
  bundle: lightning_api
  rubric_ref: rubric/lightning_api_lightning_api_settings_keys@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: lightning_api-keys-route
  input: Does lightning_api help generate OAuth keys? If so, at what admin path, which permission is required,
    and which module must be installed?
  criteria: 'Yes: the OAuth key form is at /admin/config/system/lightning/api/keys (route lightning_api.generate_keys),
    requires the ''administer simple_oauth entities'' permission, and is only available when the simple_oauth
    module is installed. It generates a key pair and stores the paths in simple_oauth.settings.'
  bundle: lightning_api
  rubric_ref: rubric/lightning_api_lightning_api_keys_route@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: lightning_api-read-entityjson
  input: On this Drupal site, inspect the Content API (lightning_api) configuration and state whether
    the 'View JSON' entity operation link is currently enabled.
  criteria: Yes — lightning_api.settings entity_json is true (the 'View JSON' link is enabled). Read via
    `drush cget lightning_api.settings entity_json`.
  bundle: lightning_api
  rubric_ref: rubric/lightning_api_lightning_api_read_entityjson@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/lightning_api-entityjson-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/lightning_api-entityjson-cleanup.sh
- id: lightning_api-read-bundledocs
  input: On this Drupal site, inspect the Content API (lightning_api) configuration and state whether
    the 'View API Documentation' bundle operation link is currently enabled.
  criteria: Yes — lightning_api.settings bundle_docs is true (the 'View API Documentation' link is enabled).
    Read via `drush cget lightning_api.settings bundle_docs`.
  bundle: lightning_api
  rubric_ref: rubric/lightning_api_lightning_api_read_bundledocs@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/lightning_api-bundledocs-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/lightning_api-bundledocs-cleanup.sh
- id: lightning_api-enable-entityjson
  input: On this Drupal site, configure the Content API (lightning_api) module to expose the 'View JSON'
    link in entity operations. Apply the change to the live site's configuration.
  criteria: 'Set lightning_api.settings entity_json to true, e.g. `drush cset lightning_api.settings entity_json
    1 -y` or via the form at /admin/config/system/lightning/api. Verified: entity_json === TRUE.'
  bundle: lightning_api
