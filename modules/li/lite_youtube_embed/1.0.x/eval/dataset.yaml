metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: lite_youtube_embed
  version: 1.0.x
  note: Lite YouTube embed adds one field formatter, lite_youtube_embed ('Lite YouTube embed (with oEmbed
    fallback)'), applicable only to media entity fields whose media type uses an oEmbed source (isApplicable
    checks target entity = media + OEmbedInterface source), for link/string/string_long fields. It renders
    YouTube via Paul Irish's <lite-youtube> web component and falls back to the core oembed iframe for
    other providers; max_width/max_height apply only to the fallback. The lite-youtube JS lib must be
    installed under /libraries/lite-youtube-embed/src (not bundled). No configure route, no permissions,
    no Drush. Medium/hard cases use a namespaced media view mode 'ly_probe' on the existing remote_video
    media type (never its default display) and are verified against core.entity_view_display.media.remote_video.ly_probe.
    The oEmbed source field name is resolved dynamically from the media type so scripts stay robust.
questions:
- id: lite_youtube_embed-formatter-id
  input: I want YouTube videos on my Drupal media to render with Paul Irish's lightweight lite-youtube
    component instead of the normal iframe. Which module/field formatter do I use, and on what kind of
    field does it apply?
  criteria: Use the lite_youtube_embed formatter ('Lite YouTube embed (with oEmbed fallback)') from the
    lite_youtube_embed module. It applies to media entity fields whose media type uses an oEmbed source
    (e.g. the Remote video type's oEmbed video field).
  bundle: lite_youtube_embed
  rubric_ref: rubric/lite_youtube_embed_lite_youtube_embed_formatter_id@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: lite_youtube_embed-fallback
  input: If I use the lite_youtube_embed formatter on a Remote video field, what happens for a non-YouTube
    video such as a Vimeo URL?
  criteria: For non-YouTube providers (Vimeo, etc.) it falls back to the core oEmbed rendering (the normal
    iframe/link/photo). Only YouTube URLs with a parseable video id use the lite-youtube web component.
  bundle: lite_youtube_embed
  rubric_ref: rubric/lite_youtube_embed_lite_youtube_embed_fallback@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: lite_youtube_embed-library
  input: After enabling lite_youtube_embed and selecting the formatter, the lite-youtube videos aren't
    interactive. What external dependency does this module need and where does it go?
  criteria: Paul Irish's lite-youtube-embed JS/CSS library is not bundled; install it into /libraries/lite-youtube-embed/src
    (manually or via Asset Packagist / npm-asset/lite-youtube-embed), as declared in lite_youtube_embed.libraries.yml.
  bundle: lite_youtube_embed
  rubric_ref: rubric/lite_youtube_embed_lite_youtube_embed_library@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: lite_youtube_embed-read-formatter
  input: On this Drupal site the Remote video media type has a view mode called 'LY Probe' (ly_probe).
    Inspect the live display configuration and tell me which field formatter is used to render the video
    field in that view mode.
  criteria: In core.entity_view_display.media.remote_video.ly_probe the oEmbed video field uses the lite_youtube_embed
    formatter.
  bundle: lite_youtube_embed
  rubric_ref: rubric/lite_youtube_embed_lite_youtube_embed_read_formatter@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/lite_youtube_embed-known-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/lite_youtube_embed-known-cleanup.sh
- id: lite_youtube_embed-read-maxwidth
  input: The Remote video 'LY Probe' (ly_probe) view mode on this site renders its video with the Lite
    YouTube embed formatter. Inspect the live configuration and tell me the maximum width configured on
    that formatter (used for the non-YouTube fallback).
  criteria: The lite_youtube_embed formatter on media.remote_video.ly_probe has max_width = 640.
  bundle: lite_youtube_embed
  rubric_ref: rubric/lite_youtube_embed_lite_youtube_embed_read_maxwidth@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/lite_youtube_embed-known-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/lite_youtube_embed-known-cleanup.sh
- id: lite_youtube_embed-switch-formatter
  input: On this Drupal site, the Remote video media type has a 'LY Probe' (ly_probe) view mode whose
    video field currently uses the default oEmbed formatter. Change that view mode so the video field
    is rendered with the Lite YouTube embed formatter instead. Apply the change to the live site.
  criteria: In core.entity_view_display.media.remote_video.ly_probe set the oEmbed video field component's
    type to lite_youtube_embed (via Manage display of the remote_video 'LY Probe' view mode, or by editing
    the display config).
  bundle: lite_youtube_embed
  rubric_ref: rubric/lite_youtube_embed_lite_youtube_embed_switch_formatter@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/lite_youtube_embed-switch-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/lite_youtube_embed-switch-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/lite_youtube_embed-switch-verify.sh
- id: lite_youtube_embed-set-maxwidth
  input: On this site the Remote video 'LY Probe' (ly_probe) view mode already uses the Lite YouTube embed
    formatter. Set that formatter's maximum width to 800 pixels (for the non-YouTube fallback). Apply
    the change to the live site.
  criteria: On the lite_youtube_embed formatter in core.entity_view_display.media.remote_video.ly_probe
    set settings.max_width to 800.
  bundle: lite_youtube_embed
  rubric_ref: rubric/lite_youtube_embed_lite_youtube_embed_set_maxwidth@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: site-owner
    reset: agent-module-documentation/evaluation/verify/lite_youtube_embed-width-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/lite_youtube_embed-width-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/lite_youtube_embed-width-verify.sh
