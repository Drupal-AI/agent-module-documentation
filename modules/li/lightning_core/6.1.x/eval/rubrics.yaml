rubrics:
- id: lightning_core_lightning_core_what_it_provides
  version: '1.0'
  applicable_bundles:
  - lightning_core
  checks:
  - kind: must_contain_any
    values:
    - /admin/config/system/lightning
    - _is_administrator
    - description
    - shared
    - date format
  scoring:
    combine: all_pass
- id: lightning_core_lightning_core_entity_descriptions
  version: '1.0'
  applicable_bundles:
  - lightning_core
  checks:
  - kind: must_contain_any
    values:
    - third_party_settings
    - lightning_core
    - ConfigEntityDescriptionTrait
    - EntityDescriptionInterface
    - getThirdPartySetting
  scoring:
    combine: all_pass
- id: lightning_core_lightning_core_submodules
  version: '1.0'
  applicable_bundles:
  - lightning_core
  checks:
  - kind: must_contain_any
    values:
    - lightning_roles
    - lightning_page
    - lightning_search
    - lightning_contact_form
  scoring:
    combine: all_pass
- id: lightning_core_lightning_core_introspect_role_description
  version: '1.0'
  applicable_bundles:
  - lightning_core
  checks:
  - kind: must_contain_any
    values:
    - Reviews and approves editorial content
  scoring:
    combine: all_pass
- id: lightning_core_lightning_core_introspect_date_format
  version: '1.0'
  applicable_bundles:
  - lightning_core
  checks:
  - kind: must_contain_any
    values:
    - Y/m/d h:i A
    - Y/m/d
  scoring:
    combine: all_pass
- id: lightning_core_lightning_core_create_role_description
  version: '1.0'
  applicable_bundles:
  - lightning_core
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
- id: lightning_core_lightning_core_create_view_mode_internal
  version: '1.0'
  applicable_bundles:
  - lightning_core
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
- id: lightning_core_lightning_core_recreate_date_format
  version: '1.0'
  applicable_bundles:
  - lightning_core
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
