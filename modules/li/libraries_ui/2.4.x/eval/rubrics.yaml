rubrics:
- id: libraries_ui_libraries_ui_report_path
  version: '1.0'
  applicable_bundles:
  - libraries_ui
  checks:
  - kind: must_contain_any
    values:
    - admin/reports/libraries
    - access libraries_ui
    - libraries_ui.overview
  scoring:
    combine: all_pass
- id: libraries_ui_libraries_ui_drush
  version: '1.0'
  applicable_bundles:
  - libraries_ui
  checks:
  - kind: must_contain_any
    values:
    - libraries:debug
    - drush ld
    - ld
  scoring:
    combine: all_pass
- id: libraries_ui_libraries_ui_service
  version: '1.0'
