metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: libraries_ui
  version: 2.4.x
  note: 'Libraries UI is a read-only inspector of Drupal asset libraries. Report at /admin/reports/libraries
    (route libraries_ui.overview, also the configure route) gated by the permission ''access libraries_ui''
    (restricted). Controller LibrariesUiController::libraries renders theme hook libraries_ui (templates/libraries-ui.html.twig)
    with LibrariesUiService::getAllLibraries() (service id libraries_ui) which returns an array keyed
    extension->library->definition via core library.discovery. Drush: libraries:debug (alias ld). It has
    no config entity or storage. Because it has no config of its own, medium/hard cases are grounded in
    the real access-control config it introduces: the ''access libraries_ui'' permission on user.role.*
    config entities (namespaced roles created/inspected by the scripts).'
questions:
- id: libraries_ui-report-path
  input: The Libraries UI Drupal module adds an admin page that lists all asset (CSS/JS) libraries on
    the site. What is the URL/path of that report, and which permission controls access to it?
  criteria: The report is at /admin/reports/libraries (route libraries_ui.overview, under Reports) and
    is gated by the 'access libraries_ui' permission.
  bundle: libraries_ui
  rubric_ref: rubric/libraries_ui_libraries_ui_report_path@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: libraries_ui-drush
  input: Does the Libraries UI module provide a Drush command to list libraries from the command line?
    If so, what is it and its alias?
  criteria: 'Yes: drush libraries:debug (alias ld). It shows an interactive extension picker and prints
    a Name/Version/Dependencies table using LibrariesUiService::getAllLibraries().'
  bundle: libraries_ui
  rubric_ref: rubric/libraries_ui_libraries_ui_drush@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: libraries_ui-service
  input: In custom code, how can I get all asset library metadata that the Libraries UI module collects,
    as a PHP array? Name the service and method and describe the array's shape.
  criteria: Call \Drupal::service('libraries_ui')->getAllLibraries() (Drupal\libraries_ui\LibrariesUiService).
    It returns a nested array keyed by extension (including 'core') -> library name -> the core library
    definition (version, css, js, dependencies, ...).
  bundle: libraries_ui
  rubric_ref: rubric/libraries_ui_libraries_ui_service@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: libraries_ui-which-role
  input: On this Drupal site, one role has been granted permission to view the Libraries UI report (the
    'access libraries_ui' permission). Inspect the live role configuration and give the machine id of
    that role.
  criteria: 'The role is libraries_ui_auditor: its user.role config grants the ''access libraries_ui''
    permission.'
  bundle: libraries_ui
  rubric_ref: rubric/libraries_ui_libraries_ui_which_role@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/libraries_ui-role-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/libraries_ui-role-cleanup.sh
- id: libraries_ui-which-of-two
  input: This site has two roles, libraries_ui_allowed and libraries_ui_denied. Only one of them can open
    the Libraries UI report at /admin/reports/libraries. Inspect the live permissions configuration and
    state which role can.
  criteria: libraries_ui_allowed can view the report because it holds the 'access libraries_ui' permission;
    libraries_ui_denied does not.
  bundle: libraries_ui
  rubric_ref: rubric/libraries_ui_libraries_ui_which_of_two@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/libraries_ui-two-roles-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/libraries_ui-two-roles-cleanup.sh
- id: libraries_ui-grant-perm
  input: On this Drupal site there is a role with machine id 'libraries_ui_task_role'. Grant it the Libraries
    UI permission so members can open the Libraries report at /admin/reports/libraries. Apply the change
    to the live site.
  criteria: Grant the 'access libraries_ui' permission to the libraries_ui_task_role role (e.g. drush
    role:perm:add libraries_ui_task_role 'access libraries_ui', or tick it on the Permissions page).
  bundle: libraries_ui
  rubric_ref: rubric/libraries_ui_libraries_ui_grant_perm@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/libraries_ui-grant-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/libraries_ui-grant-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/libraries_ui-grant-verify.sh
- id: libraries_ui-grant-perm-layman
  input: I have a user group called 'libraries_ui_task_role' on my site. I want people in that group to
    be able to see the page that lists all the libraries/assets on my site. Please give that group the
    access it needs.
  criteria: 'Same end state as the expert phrasing: the libraries_ui_task_role role is granted the ''access
    libraries_ui'' permission (the permission Libraries UI uses to gate /admin/reports/libraries).'
  bundle: libraries_ui
  rubric_ref: rubric/libraries_ui_libraries_ui_grant_perm_layman@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: site-owner
    reset: agent-module-documentation/evaluation/verify/libraries_ui-grant-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/libraries_ui-grant-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/libraries_ui-grant-verify.sh
