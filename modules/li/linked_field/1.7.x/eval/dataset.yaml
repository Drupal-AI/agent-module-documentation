metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: linked_field
  version: 1.7.x
  note: 'Linked Field has no plugin types, no .api.php, and no central linking UI — it adds a formatter
    third-party setting applied at render by a hook + one service. Cases are `recipe` (response-graded):
    they probe documented facts an agent would otherwise read source to answer; no site mutation.'
questions:
- id: linked-field-where-to-enable
  input: On a Drupal 11 site I installed Linked Field. Where and how do I make an image field link to
    another URL — is there a settings form for it?
  criteria: There is no central linking UI; on Manage display open the field's formatter settings and
    tick the 'Link this field' checkbox, then choose the destination.
  bundle: linked_field
  rubric_ref: rubric/linked_field_linked_field_where_to_enable@1.0
  tags:
  - mode:recipe
- id: linked-field-third-party-setting
  input: How does Linked Field store the per-field link configuration, and how does it inject the 'Link
    this field' checkbox into a formatter?
  criteria: It stores the config as formatter third-party settings (namespace linked_field) on the display
    component, added via hook_field_formatter_third_party_settings_form().
  bundle: linked_field
  rubric_ref: rubric/linked_field_linked_field_third_party_setting@1.0
  tags:
  - mode:recipe
- id: linked-field-destination-types
  input: What destination types can Linked Field's 'Link this field' offer, and what does each mean?
  criteria: Type 'field' uses another field's value on the same entity as the href; type 'custom' is a
    URL/path string that supports tokens.
  bundle: linked_field
  rubric_ref: rubric/linked_field_linked_field_destination_types@1.0
  tags:
  - mode:recipe
- id: linked-field-internal-and-tokens
  input: For a Linked Field custom destination, how do I enter an internal path like node 1, and can I
    use tokens such as [node:url]?
  criteria: Enter /node/1, node/1, or internal:/node/1 (bare paths get an internal:/ prefix); tokens like
    [node:url] are supported when the Token module is enabled.
  bundle: linked_field
  rubric_ref: rubric/linked_field_linked_field_internal_and_tokens@1.0
  tags:
  - mode:recipe
- id: linked-field-attributes-config
  input: Which link attributes does Linked Field expose by default (target, rel, etc.), and where do I
    change the set of available attributes?
  criteria: Defaults are title, target, class, rel (from linked_field.config); edit the YAML attributes
    map at /admin/config/linked_field/config (route linked_field.config, permission 'administer linked_field').
  bundle: linked_field
  rubric_ref: rubric/linked_field_linked_field_attributes_config@1.0
  tags:
  - mode:recipe
- id: linked-field-render-hook-service
  input: At render time, what applies the link to a field's output in Linked Field, and which service
    builds the URL and wraps the markup?
  criteria: hook_entity_display_build_alter() applies it, using the linked_field.manager service (buildDestinationUrl()
    for the URL, linkHtml() to wrap the markup in an <a>).
  bundle: linked_field
  rubric_ref: rubric/linked_field_linked_field_render_hook_service@1.0
  tags:
  - mode:recipe
- id: linked-field-link-fields-excluded
  input: Can I use Linked Field on a link-type field? Why or why not?
  criteria: No — link-type fields are blacklisted (getFieldTypeBlacklist() returns ['link']) since they
    already render links; the 'Link this field' option is not offered for them.
  bundle: linked_field
  rubric_ref: rubric/linked_field_linked_field_link_fields_excluded@1.0
  tags:
  - mode:recipe
- id: linked-field-override-text
  input: In Linked Field, how do I make the link text something other than the field's own output?
  criteria: Use the Advanced → Text setting (a token-capable string); when set it overrides the field's
    rendered output as the link text.
  bundle: linked_field
  rubric_ref: rubric/linked_field_linked_field_override_text@1.0
  tags:
  - mode:recipe
