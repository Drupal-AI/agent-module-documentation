  criteria: '4: in core.entity_form_display.node.article.default the field_lfw_known component has third_party_settings.limited_field_widgets.limit_values
    = 4.'
  bundle: limited_field_widgets
  rubric_ref: rubric/limited_field_widgets_lfw_known_limit@1.0
