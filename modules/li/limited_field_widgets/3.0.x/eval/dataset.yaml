metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: limited_field_widgets
  version: 3.0.x
  note: 'Grounded in the real mechanism: a per-widget third-party setting `limited_field_widgets.limit_values`
    (integer, 0 = unlimited) stored on the form-display widget component of an UNLIMITED-cardinality field,
    plus an ItemCount validation constraint. Medium/hard cases create namespaced string fields (field_lfw_*)
    with cardinality -1 on node.article and read/write the limit_values setting on core.entity_form_display.node.article.default.
    Cleanup deletes only the field_lfw_* storages it created.'
questions:
- id: lfw-how-to-limit
  input: I have a Drupal field with Unlimited cardinality but I want editors to add at most 3 values.
    Using the limited_field_widgets module, where and how do I set that cap? There is no admin settings
    page for the module.
  criteria: On the bundle's Manage form display, open the field widget's gear and set 'Limit values' to
    3. It is stored as third_party_settings.limited_field_widgets.limit_values on the widget component
    (and on the FieldConfig).
  bundle: limited_field_widgets
  rubric_ref: rubric/limited_field_widgets_lfw_how_to_limit@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: lfw-which-fields
  input: On which fields does the limited_field_widgets 'Limit values' setting appear, and what does setting
    it to 0 mean?
  criteria: The setting only appears for fields whose storage cardinality is Unlimited (CARDINALITY_UNLIMITED
    / -1). A value of 0 means unlimited (no cap; no ItemCount constraint is added).
  bundle: limited_field_widgets
  rubric_ref: rubric/limited_field_widgets_lfw_which_fields@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: lfw-enforcement
  input: Besides hiding the 'Add another' button in the form, how does limited_field_widgets make sure
    the configured maximum is enforced even when an entity is saved programmatically?
  criteria: hook_entity_bundle_field_info_alter() adds an 'ItemCount' validation constraint (max = limit)
    to the field, so validation fails when the value count exceeds the max — enforced on any save, not
    just the UI.
  bundle: limited_field_widgets
  rubric_ref: rubric/limited_field_widgets_lfw_enforcement@1.0
  tags:
  - mode:recipe
  - difficulty:easy
