metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: linkit
  version: 7.0.x
  note: Linkit configures autocomplete linking via linkit_profile config entities plus pluggable Matcher
    and Substitution plugins. Recipe cases (easy) are response-graded and mutate nothing; execution cases
    (hard) build a linkit_profile config entity and are verified against live state.
questions:
- id: linkit-profile-entity
  input: On a Drupal 11 site using Linkit, what config entity type holds the ordered list of autocomplete
    matchers, and at which admin path do I list and add these? Name the entity type and the route/path.
  criteria: The linkit_profile config entity (linkit.linkit_profile.*), managed at /admin/config/content/linkit
    (route entity.linkit_profile.collection).
  bundle: linkit
  rubric_ref: rubric/linkit_linkit_profile_entity@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: linkit-matcher-plugin
  input: I want to add a brand-new autocomplete source to Linkit for a custom entity type in my Drupal
    11 module. What plugin type do I implement, and in which plugin namespace does the class live?
  criteria: 'Implement a Matcher plugin in the Plugin/Linkit/Matcher namespace (extend MatcherBase / implement
    MatcherInterface, #[Matcher(...)] attribute), managed by MatcherManager.'
  bundle: linkit
  rubric_ref: rubric/linkit_linkit_matcher_plugin@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: linkit-ckeditor-enable
  input: How do I turn on Linkit autocomplete inside CKEditor 5 for a specific text format on a Drupal
    11 site? Describe which plugin/filter to enable and any ordering requirement.
  criteria: On the text format, enable the Drupal link (drupallink) plugin and toggle Linkit on with a
    profile (editor.settings.plugins.drupallink.linkit_enabled / linkit_profile), then enable the Linkit
    filter, which must run before Limit allowed HTML.
  bundle: linkit
  rubric_ref: rubric/linkit_linkit_ckeditor_enable@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: linkit-substitution-plugin
  input: In Linkit, which plugin type decides what URL an entity reference resolves to (e.g. entity canonical
    page vs direct file download), and what namespace do such plugins use? Also name the bundled ones.
  criteria: 'A Substitution plugin (Plugin/Linkit/Substitution namespace, SubstitutionInterface, #[Substitution(...)]).
    Bundled: Canonical (default), File, Media.'
  bundle: linkit
  rubric_ref: rubric/linkit_linkit_substitution_plugin@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: linkit-entity-reference-attrs
  input: Instead of a raw path, what does Linkit insert into the link when an editor picks an entity suggestion,
    and if 'Limit allowed HTML' is enabled which attributes must I add to the <a> tag so it survives filtering?
  criteria: 'Linkit inserts an entity: reference like entity:node/1 plus data-entity-* attributes; add
    data-entity-type and data-entity-uuid (and title for automatic titles) to the allowed <a> tag.'
  bundle: linkit
  rubric_ref: rubric/linkit_linkit_entity_reference_attrs@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: linkit-permission
  input: Which Drupal permission gates access to create, edit, and delete Linkit profiles and manage their
    matchers?
  criteria: The 'administer linkit profiles' permission, which guards every profile/matcher route.
  bundle: linkit
  rubric_ref: rubric/linkit_linkit_permission@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: linkit-alter-hooks
  input: In a Drupal 11 module, which alter hooks let me modify Linkit's matcher and substitution plugin
    definitions (for example to remove the user matcher)? Name them.
  criteria: hook_linkit_matcher_alter(&$definitions) and hook_linkit_substitution_alter(&$definitions).
  bundle: linkit
  rubric_ref: rubric/linkit_linkit_alter_hooks@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: linkit-eval-profile
  input: On this Drupal 11 site, set up a new Linkit profile with the machine name 'eval_profile' and
    give it a matcher that provides autocomplete suggestions for content (nodes). Add the matcher to the
    profile so it is active. I just need the profile created with that one content matcher attached.
  criteria: A linkit_profile config entity `eval_profile` exists carrying at least one matcher instance
    (e.g. the entity:node matcher).
  bundle: linkit
  rubric_ref: rubric/linkit_linkit_eval_profile@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/linkit-eval-profile-reset.sh
    verify: agent-module-documentation/evaluation/verify/linkit-eval-profile-verify.sh
- id: linkit-eval-articles
  input: On this Drupal 11 site, create a Linkit profile with the machine name 'eval_articles'. Add a
    content (node) matcher to it, but restrict that matcher so it only suggests Article content — no other
    content types should appear in its autocomplete results.
  criteria: A linkit_profile config entity `eval_articles` with a matcher whose settings.bundles restriction
    contains the `article` bundle.
  bundle: linkit
  rubric_ref: rubric/linkit_linkit_eval_articles@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/linkit-eval-articles-reset.sh
    verify: agent-module-documentation/evaluation/verify/linkit-eval-articles-verify.sh
