metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: linkchecker
  version: 2.1.x
  note: 'Link checker extracts links from content, re-checks them on cron via a queue, stores each URL
    as a `linkcheckerlink` content entity, and reports broken links in a view. Cases are `recipe` (response-graded):
    they probe documented facts an agent would otherwise read source to answer; no site mutation.'
questions:
- id: linkchecker-enable-field-scan
  input: On a Drupal 11 site with Link checker installed, how do I tell it to scan a specific field on
    a content type for broken links, and where is that configured?
  criteria: 'On each field''s config form there is a Link checker section: tick ''Scan broken links''
    and choose an Extractor. Stored as the field''s third_party.linkchecker.scan / .extractor settings;
    scanning is opt-in per field.'
  bundle: linkchecker
  rubric_ref: rubric/linkchecker_linkchecker_enable_field_scan@1.0
  tags:
  - mode:recipe
- id: linkchecker-broken-links-report
  input: Where does Link checker show broken links on the site, and which permission controls access to
    it?
  criteria: The broken_links_report view at /admin/reports/linkchecker (Reports -> Broken links), gated
    by the 'access broken links report' permission.
  bundle: linkchecker
  rubric_ref: rubric/linkchecker_linkchecker_broken_links_report@1.0
  tags:
  - mode:recipe
- id: linkchecker-cron-queue-checking
  input: How does Link checker actually perform the link checks on a schedule — what runs on cron and
    which queue workers do the work?
  criteria: hook_cron extracts links then calls linkchecker.checker->queueLinks(); the linkchecker_check
    queue worker issues the HTTP requests and records the response code, and linkchecker_status_handle
    runs status-handler plugins.
  bundle: linkchecker
  rubric_ref: rubric/linkchecker_linkchecker_cron_queue_checking@1.0
  tags:
  - mode:recipe
- id: linkchecker-which-tags-scanned
  input: By default Link checker only checks links in <a> tags. Which config keys enable extracting links
    from <img> or <iframe> tags too?
  criteria: 'The extract.from_* keys in linkchecker.settings: from_a is true by default; set extract.from_img
    / extract.from_iframe (and from_audio/from_video/from_object/from_embed) to true to scan those tags.'
  bundle: linkchecker
  rubric_ref: rubric/linkchecker_linkchecker_which_tags_scanned@1.0
  tags:
  - mode:recipe
- id: linkchecker-check-links-types
  input: How do I make Link checker only check external links (not internal node paths) on a Drupal site?
    Give the config key.
  criteria: Set check_links_types on linkchecker.settings to 2 (external only); 1 = internal+external
    (default), 3 = internal only.
  bundle: linkchecker
  rubric_ref: rubric/linkchecker_linkchecker_check_links_types@1.0
  tags:
  - mode:recipe
- id: linkchecker-dependencies
  input: Which contrib modules must be installed for Link checker 2.1.x to work on Drupal 11?
  criteria: None — Link checker 2.1.x declares no runtime module dependencies in its info.yml (redirect/paragraphs
    are only dev/test dependencies). It works on Drupal core 10.2+/11 with no required contrib modules.
  bundle: linkchecker
  rubric_ref: rubric/linkchecker_linkchecker_dependencies@1.0
  tags:
  - mode:recipe
- id: linkchecker-drush-analyze
  input: Which Drush command re-extracts and re-checks all links for Link checker, and which one clears
    the stored links?
  criteria: drush linkchecker:analyze (alias lca) re-extracts and re-checks; drush linkchecker:clear (alias
    lccl) clears all stored links.
  bundle: linkchecker
  rubric_ref: rubric/linkchecker_linkchecker_drush_analyze@1.0
  tags:
  - mode:recipe
- id: linkchecker-permission-settings
  input: Which permission gates access to the Link checker settings form on a Drupal site?
  criteria: 'The ''administer linkchecker'' permission (restrict access: true) gates the settings form
    at /admin/config/content/linkchecker.'
  bundle: linkchecker
  rubric_ref: rubric/linkchecker_linkchecker_permission_settings@1.0
  tags:
  - mode:recipe
