rubrics:
- id: lightning_media_document_lightning_media_document_what_it_adds
  version: '1.0'
  applicable_bundles:
  - lightning_media_document
  checks:
  - kind: must_contain_any
    values:
    - field_media_document
    - Document media type
    - '"file" media source'
    - file source
  scoring:
    combine: all_pass
- id: lightning_media_document_lightning_media_document_input_match_field_types
  version: '1.0'
  applicable_bundles:
  - lightning_media_document
  checks:
  - kind: must_contain_any
    values:
    - input_match
    - field_types
  scoring:
    combine: all_pass
- id: lightning_media_document_lightning_media_document_ambiguous_input
  version: '1.0'
  applicable_bundles:
  - lightning_media_document
  checks:
  - kind: must_contain_any
    values:
    - IndeterminateBundleException
    - file_extensions
    - more than one
  scoring:
    combine: all_pass
- id: lightning_media_document_lightning_media_document_extensions
  version: '1.0'
  applicable_bundles:
  - lightning_media_document
  checks:
  - kind: must_contain_any
    values:
    - csv
  scoring:
    combine: all_pass
- id: lightning_media_document_lightning_media_document_max_filesize
  version: '1.0'
  applicable_bundles:
  - lightning_media_document
  checks:
  - kind: must_contain_any
    values:
    - 7 MB
  scoring:
    combine: all_pass
- id: lightning_media_document_lightning_media_document_restrict
  version: '1.0'
  applicable_bundles:
  - lightning_media_document
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
- id: lightning_media_document_lightning_media_document_create_item
  version: '1.0'
  applicable_bundles:
  - lightning_media_document
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
