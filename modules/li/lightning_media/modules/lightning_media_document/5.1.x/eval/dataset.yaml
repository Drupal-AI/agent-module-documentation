metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: lightning_media_document
  version: 5.1.x
  note: 'Media Document is a glue submodule of Lightning Media: hook_media_source_info_alter() sets $sources[''file''][''input_match''][''field_types'']
    = [''file''] and calls Override::pluginClass($sources[''file''], File::class), where File extends
    core''s file source and mixes in FileInputExtensionMatchTrait. No routes, permissions, services, settings
    form (configure = null), config schema, Drush commands or plugin types. config/optional ships media.type.document
    (source file, source field field_media_document, default extensions ''txt rtf doc docx ppt pptx xls
    xlsx pdf odf odg odp ods odt fodt fods fodp fodg key numbers pages''), field_media_in_library, and
    default/media_library/embedded/thumbnail displays.'
questions:
- id: lightning_media_document-what-it-adds
  input: What does the Drupal module lightning_media_document add to a site, and which media source plugin
    and source field does its media type use?
  criteria: It installs a Document media type (media.type.document) using core's 'file' media source with
    the source field field_media_document, whose default allowed extensions cover txt rtf doc docx ppt
    pptx xls xlsx pdf odf odg odp ods odt fodt fods fodp fodg key numbers pages, plus field_media_in_library
    and default/media_library/embedded/thumbnail displays.
  bundle: lightning_media_document
  rubric_ref: rubric/lightning_media_document_lightning_media_document_what_it_adds@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: lightning_media_document-input-match-field-types
  input: Besides swapping the media source class, lightning_media_document sets one extra key on the core
    'file' media source plugin definition in hook_media_source_info_alter(). Which key, and what is it
    for?
  criteria: It sets $sources['file']['input_match']['field_types'] = ['file'], declaring which field types
    Lightning Media's input matching may consider for this source, alongside Override::pluginClass($sources['file'],
    File::class) which mixes in InputMatchInterface via FileInputExtensionMatchTrait.
  bundle: lightning_media_document
  rubric_ref: rubric/lightning_media_document_lightning_media_document_input_match_field_types@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: lightning_media_document-ambiguous-input
  input: On a Drupal site running several Lightning Media components, uploading a file through an entity
    browser sometimes fails with an IndeterminateBundleException. Given how broad the Document media type's
    extension list is, why does that happen and how do I fix it?
  criteria: MediaHelper::getBundleFromInput() throws IndeterminateBundleException when zero or more than
    one media type's InputMatchInterface::appliesTo() claims the input. Because Document accepts a very
    broad extension list it can collide with another component; fix it by narrowing settings.file_extensions
    on field.field.media.document.field_media_document (or on the competing type's source field).
  bundle: lightning_media_document
  rubric_ref: rubric/lightning_media_document_lightning_media_document_ambiguous_input@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: lightning_media_document-extensions
  input: Inspect the live configuration of this Drupal site and tell me exactly which file extensions
    the Document media type currently accepts for upload, and on which field that setting is stored.
  criteria: field.field.media.document.field_media_document has settings.file_extensions set to 'pdf docx
    csv', so only PDF, DOCX and CSV uploads are accepted.
  bundle: lightning_media_document
  rubric_ref: rubric/lightning_media_document_lightning_media_document_extensions@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/lightning_media_document-extensions-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/lightning_media_document-extensions-cleanup.sh
- id: lightning_media_document-max-filesize
  input: On this Drupal site, an editor complains that a large PDF is rejected by the Document media type.
    Inspect the live field configuration and tell me the maximum upload size currently configured for
    that media type's source field.
  criteria: field.field.media.document.field_media_document has settings.max_filesize set to '7 MB', so
    uploads above 7 MB are rejected regardless of the PHP limit.
  bundle: lightning_media_document
  rubric_ref: rubric/lightning_media_document_lightning_media_document_max_filesize@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/lightning_media_document-max-filesize-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/lightning_media_document-max-filesize-cleanup.sh
- id: lightning_media_document-restrict
  input: On this Drupal site, the Document media type accepts a very long list of file extensions. Lock
    it down so that editors can only upload PDF and DOCX files - nothing else. Apply the change to the
    live site.
  criteria: field.field.media.document.field_media_document settings.file_extensions is exactly 'pdf docx'
    (in any order), with every other extension removed.
  bundle: lightning_media_document
  rubric_ref: rubric/lightning_media_document_lightning_media_document_restrict@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/lightning_media_document-restrict-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/lightning_media_document-restrict-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/lightning_media_document-restrict-verify.sh
- id: lightning_media_document-create-item
  input: On this Drupal site, create a Document media item named 'LM Document Task' whose source field
    references a real file entity, and make sure it is visible in the media library.
  criteria: A media entity of bundle 'document' named 'LM Document Task' whose field_media_document references
    a saved File entity and whose field_media_in_library is TRUE.
  bundle: lightning_media_document
  rubric_ref: rubric/lightning_media_document_lightning_media_document_create_item@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/lightning_media_document-create-item-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/lightning_media_document-create-item-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/lightning_media_document-create-item-verify.sh
