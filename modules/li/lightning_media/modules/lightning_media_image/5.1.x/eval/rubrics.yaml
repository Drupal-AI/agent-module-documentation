rubrics:
- id: lightning_media_image_lightning_media_image_what_it_adds
  version: '1.0'
  applicable_bundles:
  - lightning_media_image
  checks:
  - kind: must_contain_any
    values:
    - image_browser
    - freeform
    - field_media_image
  scoring:
    combine: all_pass
- id: lightning_media_image_lightning_media_image_crop_style
  version: '1.0'
  applicable_bundles:
  - lightning_media_image
  checks:
  - kind: must_contain_any
    values:
    - crop_
    - hook_ENTITY_TYPE_insert
    - crop_type_insert
    - crop_crop
  scoring:
    combine: all_pass
- id: lightning_media_image_lightning_media_image_entity_browser_widget
  version: '1.0'
  applicable_bundles:
  - lightning_media_image
  checks:
  - kind: must_contain_any
    values:
    - entity_browser_file
    - entity_form_display
    - presave
  scoring:
    combine: all_pass
- id: lightning_media_image_lightning_media_image_extensions
  version: '1.0'
  applicable_bundles:
  - lightning_media_image
  checks:
  - kind: must_contain_any
    values:
    - svg
  scoring:
    combine: all_pass
- id: lightning_media_image_lightning_media_image_max_resolution
  version: '1.0'
  applicable_bundles:
  - lightning_media_image
  checks:
  - kind: must_contain_any
    values:
    - 1600x1200
  scoring:
    combine: all_pass
- id: lightning_media_image_lightning_media_image_add_extension
  version: '1.0'
  applicable_bundles:
  - lightning_media_image
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
- id: lightning_media_image_lightning_media_image_create_item
  version: '1.0'
  applicable_bundles:
  - lightning_media_image
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
