metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: lightning_media_image
  version: 5.1.x
  note: 'Media Image is the largest Lightning Media component but still defines no plugin type, permission,
    route, service or settings form (configure = null). Its hooks: hook_media_source_info_alter() sets
    input_match.field_types = [''image''], swaps in the input-matching Image source and sets entity_embed_display
    = ''media_image''; hook_field_widget_info_alter() swaps the image_widget_crop widget class for ImageCropWidget;
    hook_ENTITY_TYPE_insert() on crop_type creates an image style crop_<id> with a crop_crop effect; hook_ENTITY_TYPE_presave()
    on entity_form_display switches newly added image fields (outside media.image.*) to the entity_browser_file
    widget using the image_browser entity browser; hook_install() converts media.image form displays to
    image_widget_crop with crop_list [freeform] and show_crop_area TRUE. config/optional ships media.type.image
    (source image, source field field_media_image, extensions ''png gif jpg jpeg webp''), the media_browser
    form mode, entity_browser.browser.image_browser, views.view.image_browser and crop.type.freeform.'
questions:
- id: lightning_media_image-what-it-adds
  input: What does the Drupal module lightning_media_image install, and which entity browser and crop
    type does it bring with it?
  criteria: An Image media type (media.type.image, source 'image', source field field_media_image with
    extensions png gif jpg jpeg webp), a dedicated media_browser form mode, the image_browser entity browser
    plus its backing views.view.image_browser, and the crop.type.freeform crop type - all in config/optional
    so they only install when their dependencies (entity_browser, crop / image_widget_crop) are present.
  bundle: lightning_media_image
  rubric_ref: rubric/lightning_media_image_lightning_media_image_what_it_adds@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: lightning_media_image-crop-style
  input: On a Drupal site with lightning_media_image, I created a new crop type and an image style appeared
    on its own. Which hook does that, and what is the generated image style called?
  criteria: 'lightning_media_image_crop_type_insert() creates an image style named crop_<crop_type_id>
    labelled ''Cropped: <crop type label>'' containing a single crop_crop image effect configured with
    that crop type. It is skipped during config sync.'
  bundle: lightning_media_image
  rubric_ref: rubric/lightning_media_image_lightning_media_image_crop_style@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: lightning_media_image-entity-browser-widget
  input: On a Drupal site with lightning_media_image, every new image field I add to a content type ends
    up using an entity browser widget instead of the plain image upload widget. Which hook causes that,
    and which form displays are exempt?
  criteria: lightning_media_image_entity_form_display_presave() finds newly added image fields (via DisplayHelper::getNewFields())
    and sets their widget to entity_browser_file pointed at the image_browser entity browser. It skips
    config sync, skips form displays for the Image media type itself (media / image), and does nothing
    unless Entity Browser is installed and an image_browser entity browser exists.
  bundle: lightning_media_image
  rubric_ref: rubric/lightning_media_image_lightning_media_image_entity_browser_widget@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: lightning_media_image-extensions
  input: Inspect the live configuration of this Drupal site and tell me exactly which image file extensions
    the Image media type currently accepts, and on which field that is configured.
  criteria: field.field.media.image.field_media_image has settings.file_extensions set to 'png svg', so
    only PNG and SVG uploads are accepted.
  bundle: lightning_media_image
  rubric_ref: rubric/lightning_media_image_lightning_media_image_extensions@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/lightning_media_image-extensions-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/lightning_media_image-extensions-cleanup.sh
- id: lightning_media_image-max-resolution
  input: An editor on this Drupal site says their photos are being resized when they upload them to the
    Image media type. Inspect the live field configuration and tell me the maximum image resolution that
    is currently enforced.
  criteria: field.field.media.image.field_media_image has settings.max_resolution set to 1600x1200, so
    larger uploads are scaled down to fit those dimensions.
  bundle: lightning_media_image
  rubric_ref: rubric/lightning_media_image_lightning_media_image_max_resolution@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/lightning_media_image-max-resolution-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/lightning_media_image-max-resolution-cleanup.sh
- id: lightning_media_image-add-extension
  input: On this Drupal site, the Image media type provided by lightning_media_image accepts png, gif,
    jpg, jpeg and webp. Change the live configuration so that SVG and AVIF files are also accepted, without
    losing any of the existing formats.
  criteria: field.field.media.image.field_media_image settings.file_extensions contains png, gif, jpg,
