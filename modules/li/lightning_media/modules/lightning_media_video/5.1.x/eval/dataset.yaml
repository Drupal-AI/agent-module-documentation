metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: lightning_media_video
  version: 5.1.x
  note: 'Media Video is a glue submodule of Lightning Media whose only code is hook_media_source_info_alter()
    calling Override::pluginClass($sources[''video_file''], VideoFile::class), where VideoFile extends
    core''s video_file source and mixes in FileInputExtensionMatchTrait. It has no routes, permissions,
    services, settings form (configure = null), config schema, Drush commands or plugin types. config/optional
    installs TWO media types: media.type.video (source video_file, source field field_media_video_file,
    default extensions ''mp4'') and media.type.remote_video (source oembed:video, source field field_media_oembed_video,
    source_configuration.providers [YouTube, Vimeo], thumbnails_directory ''public://oembed_thumbnails/[date:custom:Y-m]'').
    Only the local video_file source is input-matching; remote_video is not.'
questions:
- id: lightning_media_video-two-types
  input: How many media types does the Drupal module lightning_media_video install, what are they called,
    and which media source does each use?
  criteria: 'Two: media.type.video (''Video'') using core''s video_file source with the source field field_media_video_file
    (default extensions ''mp4''), and media.type.remote_video (''Remote video'') using core''s oembed:video
    source with the source field field_media_oembed_video.'
  bundle: lightning_media_video
  rubric_ref: rubric/lightning_media_video_lightning_media_video_two_types@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: lightning_media_video-providers
  input: The Remote video media type installed by lightning_media_video only accepts YouTube and Vimeo
    URLs. Where is that list configured and how do I add another oEmbed provider?
  criteria: It is media.type.remote_video's source_configuration.providers array (shipped as [YouTube,
    Vimeo]) - core's oEmbed system, not lightning_media_video. Edit the media type (Manage media types
    -> Remote video) or set source_configuration.providers programmatically; the thumbnails_directory
    key in the same array controls where oEmbed thumbnails are cached.
  bundle: lightning_media_video
  rubric_ref: rubric/lightning_media_video_lightning_media_video_providers@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: lightning_media_video-input-match-scope
  input: On a Drupal site with lightning_media_video, dropping an MP4 into a Lightning Media entity browser
    resolves to the Video media type automatically, but pasting a YouTube URL does not. Why?
  criteria: Only the local video_file source is swapped for an input-matching subclass (VideoFile implements
    InputMatchInterface via FileInputExtensionMatchTrait, matching on the source field's file_extensions).
    The remote_video type keeps core's plain oembed:video source, which does not implement InputMatchInterface,
    so MediaHelper cannot auto-detect it from a pasted URL.
  bundle: lightning_media_video
  rubric_ref: rubric/lightning_media_video_lightning_media_video_input_match_scope@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: lightning_media_video-thumbs-dir
  input: Inspect the live configuration of this Drupal site and tell me where the Remote video media type
    stores the thumbnails it downloads from YouTube and Vimeo.
  criteria: media.type.remote_video's source_configuration.thumbnails_directory is public://lm_video_thumbs.
  bundle: lightning_media_video
  rubric_ref: rubric/lightning_media_video_lightning_media_video_thumbs_dir@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/lightning_media_video-thumbs-dir-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/lightning_media_video-thumbs-dir-cleanup.sh
- id: lightning_media_video-extensions
  input: Inspect this Drupal site and tell me exactly which file extensions the locally hosted Video media
    type currently accepts for upload, and on which field that setting lives.
  criteria: field.field.media.video.field_media_video_file has settings.file_extensions set to 'mp4 webm
    ogv'.
  bundle: lightning_media_video
  rubric_ref: rubric/lightning_media_video_lightning_media_video_extensions@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/lightning_media_video-extensions-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/lightning_media_video-extensions-cleanup.sh
- id: lightning_media_video-configure
  input: 'On this Drupal site, make two changes with the lightning_media_video media types: the locally
    hosted Video type must accept webm and mov uploads in addition to mp4, and the Remote video type must
    cache its oEmbed thumbnails in public://lm_remote_thumbs. Apply both changes to the live site.'
  criteria: field.field.media.video.field_media_video_file settings.file_extensions contains mp4, webm
    and mov; media.type.remote_video source_configuration.thumbnails_directory is exactly 'public://lm_remote_thumbs'.
  bundle: lightning_media_video
  rubric_ref: rubric/lightning_media_video_lightning_media_video_configure@1.0
  tags:
