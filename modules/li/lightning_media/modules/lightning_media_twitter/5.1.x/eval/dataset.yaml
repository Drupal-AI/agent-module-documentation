metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: lightning_media_twitter
  version: 5.1.x
  note: Media Twitter is a glue submodule over contrib media_entity_twitter. hook_media_source_info_alter()
    sets $sources['twitter']['input_match'] = ['constraint' => 'TweetEmbedCode', 'field_types' => ['string','string_long']],
    preview => TRUE and forms.media_library_add => Drupal\lightning_media\Form\AddByUrlForm::class, then
    Override::pluginClass() swaps in the input-matching Twitter source. It also implements hook_theme_registry_alter()
    to repoint the media_entity_twitter_tweet theme hook at this module's templates/ directory and a preprocess
    hook that injects media_entity_twitter's twitter.png (180x180) as a 'placeholder' variable so embedded
    tweets are visible in CKEditor. No routes, permissions, services, settings form (configure = null),
    config schema, Drush or plugin types. config/install ships media.type.tweet (source twitter, source
    field embed_code - an instance of the parent module's shared media.embed_code storage), field_media_in_library
    and the form/view displays.
questions:
- id: lightning_media_twitter-source-id
  input: What media source plugin and source field does the Tweet media type installed by lightning_media_twitter
    use, and which module actually provides the source plugin?
  criteria: The media type media.type.tweet uses the 'twitter' media source provided by the contrib media_entity_twitter
    module, with the source field embed_code - an instance of the media.embed_code string_long field storage
    that Lightning Media itself installs and shares with the Instagram media type.
  bundle: lightning_media_twitter
  rubric_ref: rubric/lightning_media_twitter_lightning_media_twitter_source_id@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: lightning_media_twitter-template-override
  input: Why does lightning_media_twitter implement hook_theme_registry_alter(), and what visual difference
    does it make when a tweet is embedded in CKEditor?
  criteria: hook_theme_registry_alter() repoints the media_entity_twitter_tweet theme hook at lightning_media_twitter's
    own templates/ directory (only when it still points at media_entity_twitter/templates). The accompanying
    preprocess hook renders media_entity_twitter's twitter.png icon (180x180) into a 'placeholder' variable,
    so an embedded tweet shows a recognisable placeholder image inside CKEditor instead of nothing.
  bundle: lightning_media_twitter
  rubric_ref: rubric/lightning_media_twitter_lightning_media_twitter_template_override@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: lightning_media_twitter-preview-and-url-form
  input: How does lightning_media_twitter give editors a live preview of a tweet while they type, and
    how does it add an 'Add via URL' option to the media library?
  criteria: Its hook_media_source_info_alter() sets $sources['twitter']['preview'] = TRUE (which makes
    Lightning Media's MediaForm add an AJAX-refreshing preview element, gated by MediaHelper::isPreviewable())
    and $sources['twitter']['forms']['media_library_add'] = Drupal\lightning_media\Form\AddByUrlForm::class,
    which core's media library uses as the add form for that source.
  bundle: lightning_media_twitter
  rubric_ref: rubric/lightning_media_twitter_lightning_media_twitter_preview_and_url_form@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: lightning_media_twitter-label
  input: A media type on this Drupal site is labelled 'LM Tweet Embed'. Inspect the running site and tell
    me its machine name, the media source plugin ID it uses, and the machine name of its source field.
  criteria: Machine name tweet, source plugin twitter, source field embed_code.
  bundle: lightning_media_twitter
  rubric_ref: rubric/lightning_media_twitter_lightning_media_twitter_label@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/lightning_media_twitter-label-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/lightning_media_twitter-label-cleanup.sh
- id: lightning_media_twitter-field-label
  input: Inspect the live field configuration of the Tweet media type on this Drupal site. What label
    do editors currently see for its source field, and is that field required?
  criteria: field.field.media.tweet.embed_code currently has the label 'LM Tweet URL' and is required.
  bundle: lightning_media_twitter
  rubric_ref: rubric/lightning_media_twitter_lightning_media_twitter_field_label@1.0
  tags:
