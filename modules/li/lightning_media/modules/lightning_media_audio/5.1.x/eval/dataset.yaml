metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: lightning_media_audio
  version: 5.1.x
  note: 'Media Audio is a glue submodule of Lightning Media: one hook_media_source_info_alter() calling
    Override::pluginClass($sources[''audio_file''], AudioFile::class), where AudioFile extends core''s
    audio_file source and mixes in FileInputExtensionMatchTrait to implement InputMatchInterface. It has
    no routes, permissions, services, settings form (configure = null), config schema, Drush commands
    or plugin types. Everything else is config/optional: media.type.audio (source audio_file, source field
    field_media_audio_file, default extensions ''mp3 wav aac''), field_media_in_library, and default/media_library/embedded/thumbnail
    displays. All cases are grounded in that exact configuration.'
questions:
- id: lightning_media_audio-what-it-adds
  input: What does the Drupal module lightning_media_audio actually add to a site, and which media source
    plugin and source field does its media type use?
  criteria: It installs an Audio media type (media.type.audio) that uses core's audio_file media source
    with the source field field_media_audio_file (default allowed extensions mp3 wav aac), plus a field_media_in_library
    instance and default/media_library/embedded/thumbnail displays. The only code is a hook_media_source_info_alter()
    that swaps in an input-matching subclass of the source plugin.
  bundle: lightning_media_audio
  rubric_ref: rubric/lightning_media_audio_lightning_media_audio_what_it_adds@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: lightning_media_audio-input-match
  input: How does lightning_media_audio make Drupal recognise that an uploaded file belongs to the Audio
    media type, and which trait implements that?
  criteria: Drupal\lightning_media_audio\Plugin\media\Source\AudioFile extends core's AudioFile source,
    implements Drupal\lightning_media\InputMatchInterface and uses Drupal\lightning_media\FileInputExtensionMatchTrait,
    whose appliesTo() compares the uploaded file's extension against the source field's file_extensions
    setting. lightning_media_audio_media_source_info_alter() swaps the class in with Override::pluginClass().
  bundle: lightning_media_audio
  rubric_ref: rubric/lightning_media_audio_lightning_media_audio_input_match@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: lightning_media_audio-add-format
  input: On a Drupal site with lightning_media_audio, editors need to upload FLAC files but the upload
    is rejected. Which configuration do I change, and does the module have a settings page for it?
  criteria: There is no settings page (configure is null). Edit the Audio media type's source field field_media_audio_file
    and add flac to its 'Allowed file extensions' setting - config field.field.media.audio.field_media_audio_file,
    key settings.file_extensions (default 'mp3 wav aac').
  bundle: lightning_media_audio
  rubric_ref: rubric/lightning_media_audio_lightning_media_audio_add_format@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: lightning_media_audio-extensions
  input: Inspect the live configuration of this Drupal site and tell me exactly which file extensions
    the Audio media type currently accepts for upload, and which field that setting lives on.
  criteria: field.field.media.audio.field_media_audio_file has settings.file_extensions set to 'mp3 wav
    aac flac opus', so the Audio media type accepts mp3, wav, aac, flac and opus.
  bundle: lightning_media_audio
  rubric_ref: rubric/lightning_media_audio_lightning_media_audio_extensions@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/lightning_media_audio-extensions-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/lightning_media_audio-extensions-cleanup.sh
- id: lightning_media_audio-source
  input: A media type on this Drupal site is labelled 'LM Podcast Audio'. Inspect the running site and
    tell me its machine name, the media source plugin it uses, and the machine name of its source field.
  criteria: Machine name audio, source plugin audio_file (the input-matching subclass installed by lightning_media_audio),
    source field field_media_audio_file.
  bundle: lightning_media_audio
  rubric_ref: rubric/lightning_media_audio_lightning_media_audio_source@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/lightning_media_audio-source-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/lightning_media_audio-source-cleanup.sh
- id: lightning_media_audio-add-extension
  input: On this Drupal site, the Audio media type provided by lightning_media_audio currently only accepts
    mp3, wav and aac uploads. Change the live configuration so that it also accepts m4a and ogg files,
    keeping the existing three formats.
  criteria: field.field.media.audio.field_media_audio_file settings.file_extensions contains mp3, wav,
    aac, m4a and ogg (e.g. 'mp3 wav aac m4a ogg').
  bundle: lightning_media_audio
  rubric_ref: rubric/lightning_media_audio_lightning_media_audio_add_extension@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/lightning_media_audio-add-extension-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/lightning_media_audio-add-extension-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/lightning_media_audio-add-extension-verify.sh
- id: lightning_media_audio-create-item
  input: On this Drupal site, create an Audio media item named 'LM Audio Task' whose source field references
    a real file entity. It is a working file, so it must NOT appear in the media library - use the field
    Lightning Media adds for that.
  criteria: A media entity of bundle 'audio' named 'LM Audio Task' whose field_media_audio_file references
    a saved File entity and whose field_media_in_library is FALSE.
  bundle: lightning_media_audio
  rubric_ref: rubric/lightning_media_audio_lightning_media_audio_create_item@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/lightning_media_audio-create-item-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/lightning_media_audio-create-item-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/lightning_media_audio-create-item-verify.sh
