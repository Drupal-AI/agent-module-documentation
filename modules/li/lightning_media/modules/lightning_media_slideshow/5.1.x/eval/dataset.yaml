metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: lightning_media_slideshow
  version: 5.1.x
  note: 'Media Slideshow has no .module file: it is config plus one service. config/install (dependencies
    enforced) ships block_content.type.media_slideshow (label ''Slideshow'', revision false), field.storage.block_content.field_slideshow_items
    (entity_reference to media, cardinality -1), the required field instance labelled ''Media items''
    with target_bundles null, core.entity_view_mode.media.slideshow, a default form display and a default
    view display rendering the field with the slick_entityreference_vanilla formatter. The single service
    lightning_media_slideshow.uninstall_validator (Drupal\lightning_media_slideshow\UninstallValidator,
    tagged module_install.uninstall_validator, lazy) blocks uninstall while any media_slideshow block
    content exists. lightning_media_slideshow_update_9001() downloads Slick 1.8.0 into /libraries/slick-carousel
    when no slick library is found. No routes, permissions, settings form (configure = null), config schema,
    Drush or plugin types.'
questions:
- id: lightning_media_slideshow-what-it-adds
  input: What does the Drupal module lightning_media_slideshow actually add to a site - which entity type
    and bundle, which field, and which formatter renders it?
  criteria: A custom block type block_content.type.media_slideshow labelled 'Slideshow' with one required,
    unlimited-cardinality entity reference field field_slideshow_items targeting media entities. Its default
    view display renders that field with the slick_entityreference_vanilla formatter (optionset default,
    skin default). It also adds a media.slideshow view mode.
  bundle: lightning_media_slideshow
  rubric_ref: rubric/lightning_media_slideshow_lightning_media_slideshow_what_it_adds@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: lightning_media_slideshow-uninstall-guard
  input: Uninstalling lightning_media_slideshow on a Drupal site fails with a message about deleting blocks
    first. What is enforcing that, and how do I actually uninstall the module?
  criteria: The service lightning_media_slideshow.uninstall_validator (Drupal\lightning_media_slideshow\UninstallValidator,
    tagged module_install.uninstall_validator) counts block_content entities of type media_slideshow and
    returns the problem 'To uninstall Media Slideshow, you must delete all slideshow blocks first.' Delete
    every media_slideshow block content entity, then uninstall - the block type and field are removed
    with the module because their dependencies are enforced.
  bundle: lightning_media_slideshow
  rubric_ref: rubric/lightning_media_slideshow_lightning_media_slideshow_uninstall_guard@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: lightning_media_slideshow-slick-library
  input: lightning_media_slideshow renders its carousel with Slick. Which contrib module supplies the
    formatter, and what does the module's update hook do about the JavaScript library?
  criteria: The formatter comes from slick_entityreference (a declared dependency alongside block_content
    and lightning_media). lightning_media_slideshow_update_9001() checks for a slick, slick-carousel or
    accessible-slick library and, if none is found, downloads Slick 1.8.0 into <docroot>/libraries/slick-carousel.
  bundle: lightning_media_slideshow
  rubric_ref: rubric/lightning_media_slideshow_lightning_media_slideshow_slick_library@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: lightning_media_slideshow-block-type
  input: A custom block type on this Drupal site is labelled 'LM Carousel'. Inspect the running site and
    tell me its machine name, and the machine name of the field on it that references media items.
  criteria: The block type's machine name is media_slideshow and its media reference field is field_slideshow_items
    (an entity_reference field targeting media entities).
  bundle: lightning_media_slideshow
  rubric_ref: rubric/lightning_media_slideshow_lightning_media_slideshow_block_type@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/lightning_media_slideshow-block-type-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/lightning_media_slideshow-block-type-cleanup.sh
- id: lightning_media_slideshow-cardinality
  input: On this Drupal site, how many media items can an editor put into a single Slideshow block? Inspect
    the live field configuration and tell me where that limit is stored.
  criteria: Seven. field.storage.block_content.field_slideshow_items currently has cardinality 7 (the
    module ships -1, i.e. unlimited), and cardinality lives on the field storage, not the field instance.
  bundle: lightning_media_slideshow
  rubric_ref: rubric/lightning_media_slideshow_lightning_media_slideshow_cardinality@1.0
  tags:
  - mode:introspection
  - difficulty:medium
