metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: at_tool
  version: 3.1.x
  note: AT Tool is the module-side helper for the Adaptivetheme theme system. It has NO config/entities/permissions/routes/Drush
    of its own; its behavior is driven by the ACTIVE theme's settings config (<active_theme>.settings
    -> settings array), reading keys enable_devel, enable_live_reload, live_reload_port (default 35729)
    and layouts_enable in at_tool_library_info_alter(), plus at_tool_preprocess_system_themes_page().
    It registers service at_tool.lazy_builders (Drupal\at_tool\AtToolLazyBuilders, TrustedCallbackInterface)
    whose breadcrumbTitle() returns a page_title__breadcrumb render array. The project also ships starterkit
    THEMES (AT SKIN/STARTERKIT/AT Theme Generator) which are themes, not modules. On this site the active/default
    theme is olivero (not an Adaptivetheme), so these settings keys are absent by default. Medium/hard
    cases write/read those exact at_tool-consumed keys on the active theme's settings config (a nested
    'settings' key that is added and then fully removed via clear(), restoring the theme config's original
    state), and introspect the at_tool.lazy_builders service.
questions:
- id: at_tool-what-it-is
  input: What is the Drupal at_tool module for, and are the AT SKIN / STARTERKIT / AT Theme Generator
    it ships modules you enable?
  criteria: at_tool is the module-side support layer for the Adaptivetheme (AT) theme system on Drupal
    10/11 (livereload, layout-settings CSS, appearance-page styling, a breadcrumb-title lazy builder).
    The AT SKIN/STARTERKIT/AT Theme Generator are starterkit THEMES, not modules — you do not enable them
    as modules.
  bundle: at_tool
  rubric_ref: rubric/at_tool_at_tool_what_it_is@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: at_tool-breadcrumb-service
  input: Which service does at_tool register for rendering the current page title inside a breadcrumb,
    and what render-array theme hook does it return?
  criteria: 'The at_tool.lazy_builders service (AtToolLazyBuilders, a TrustedCallbackInterface) exposes
    breadcrumbTitle(), which returns a render array with #theme => page_title__breadcrumb and the resolved
    current-page title.'
  bundle: at_tool
  rubric_ref: rubric/at_tool_at_tool_breadcrumb_service@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: at_tool-livereload-settings
  input: at_tool can inject a LiveReload script during theme development. Which active-theme settings
    does it read to decide this, and what is the default LiveReload port?
  criteria: at_tool_library_info_alter() reads the active theme's settings (enable_devel and enable_live_reload)
    and, when both are on, points the livereload script at //localhost:<live_reload_port>/livereload.js
    (live_reload_port defaults to 35729). It also reads layouts_enable for the layout-settings CSS on
    admin routes.
  bundle: at_tool
  rubric_ref: rubric/at_tool_at_tool_livereload_settings@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: at_tool-known-port
  input: at_tool decides the LiveReload URL from the active theme's settings. On this site the active
    theme has been put into development mode. Inspect the active theme's live configuration and report
    the LiveReload port at_tool will use.
  criteria: The active (default) theme's settings config (<theme>.settings:settings) has live_reload_port
    = 12345 (with enable_devel and enable_live_reload on). Find the default theme via system.theme:default,
    then read <theme>.settings settings.
  bundle: at_tool
  rubric_ref: rubric/at_tool_at_tool_known_port@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/at_tool-known-port-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/at_tool-known-port-cleanup.sh
- id: at_tool-service-class
  input: at_tool provides a lazy-builder service used by Adaptivetheme themes for breadcrumb titles. Inspect
    the live service container on this site and report the PHP class behind the at_tool.lazy_builders
    service.
  criteria: at_tool.lazy_builders is Drupal\at_tool\AtToolLazyBuilders (e.g. `drush php:eval 'echo get_class(\Drupal::service("at_tool.lazy_builders"));'`).
  bundle: at_tool
  rubric_ref: rubric/at_tool_at_tool_service_class@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/at_tool-service-class-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/at_tool-service-class-cleanup.sh
- id: at_tool-enable-livereload
  input: 'On this Drupal site, configure the active theme so at_tool would inject the LiveReload script:
    turn on developer mode and live reload, and set the LiveReload port to 9000 (in the active theme''s
    settings that at_tool reads). Apply the change to the live site.'
  criteria: The active/default theme's settings config (<theme>.settings) has a settings array with enable_devel=1,
    enable_live_reload=1, and live_reload_port='9000'. Determine the default theme via system.theme:default
    and save that theme's .settings config.
  bundle: at_tool
  rubric_ref: rubric/at_tool_at_tool_enable_livereload@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
