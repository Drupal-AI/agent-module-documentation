    verify: agent-module-documentation/evaluation/verify/at_tool-enable-livereload-verify.sh
- id: at_tool-enable-layouts
  input: 'On this Drupal site, turn on the layout-settings feature that at_tool keys off for the active
    theme: set the active theme''s layouts_enable setting to 1 (in the theme settings config at_tool reads).
    Apply the change to the live site.'
  criteria: The active/default theme's settings config (<theme>.settings) has settings.layouts_enable
    = 1.
  bundle: at_tool
  rubric_ref: rubric/at_tool_at_tool_enable_layouts@1.0
