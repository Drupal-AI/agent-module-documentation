metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: devel_kint_extras
  version: 1.1.x
  note: 'Devel Kint Extras is DEPRECATED/OBSOLETE: its .info.yml declares `lifecycle: obsolete` and Drupal
    refuses to install it (`drush en devel_kint_extras` errors ''module is obsolete''). Because it cannot
    be enabled, NO live-state cases are possible — there are no medium (introspection) or hard (execution)
    cases, only easy (recipe) cases graded on text explaining what the module was, why it is obsolete
    (Devel removed its Kint integration in 5.4.0), and what replaced it (the standalone Kint module).
    This is by design and is why the deprecated stub is exempt from the usual 3-tier requirement.'
questions:
- id: devel-kint-extras-why-obsolete
  input: I found the Drupal contrib module devel_kint_extras but I can't enable it on Drupal 11 — Drupal
    says it is obsolete. Why is this module obsolete, and what should I use instead?
  criteria: 'The module extended Devel''s Kint dumper, but Devel removed its Kint integration in v5.4.0,
    so there is nothing left to extend and the project was marked lifecycle: obsolete. Use the standalone
    Kint module (drupal.org/project/kint) instead.'
  bundle: devel_kint_extras
  rubric_ref: rubric/devel_kint_extras_devel_kint_extras_why_obsolete@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: devel-kint-extras-what-it-did
  input: What did the Drupal module devel_kint_extras do when it still worked, and how did it hook into
    Devel?
  criteria: It made Devel's Kint dumper also show the methods and static properties available on a dumped
    object. It did this by swapping Devel's `kint` dumper class for its own KintExtended class via hook_devel_dumper_info_alter().
  bundle: devel_kint_extras
  rubric_ref: rubric/devel_kint_extras_devel_kint_extras_what_it_did@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: devel-kint-extras-can-enable
  input: Can I install and enable devel_kint_extras on a Drupal 11 site today? What does its info.yml
    lifecycle field say?
  criteria: 'No. Its .info.yml sets `lifecycle: obsolete`, and Drupal refuses to install obsolete modules
    (drush en fails with ''module devel_kint_extras is obsolete''). It is a source-only reference now.'
  bundle: devel_kint_extras
  rubric_ref: rubric/devel_kint_extras_devel_kint_extras_can_enable@1.0
  tags:
  - mode:recipe
  - difficulty:easy
