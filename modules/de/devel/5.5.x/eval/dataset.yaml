# Generated from evals.json by evaluation/to_commons.py.
# Edit evals.json and rerun the script; do not edit this file.
metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: devel
  version: 5.5.x
  note: Devel is a developer toolkit (dump helpers, introspection pages, dumper plugins, Drush commands).
    All cases are `recipe` (response-graded), not `execution` — the eval must not enable Devel or mutate
    the site.
questions:
- id: devel-dump-to-page
  input: On a Drupal 11 site with the Devel module enabled, I want to quickly print a PHP variable to
    the screen as a Drupal message while debugging in code. Which Devel global helper function do I call?
    Name it.
  criteria: Call dpm($value) (dump to the page as a Drupal message); dsm()/dvm() are related message-output
    variants.
  bundle: devel
  rubric_ref: rubric/devel_devel_dump_to_page@1.0
  tags:
  - mode:recipe
- id: devel-log-to-file
  input: In Drupal code I can't print debug output to the page (it's a redirect/AJAX path). Using Devel,
    how do I write a variable dump to a log file instead? Name the helper function and where its output
    goes.
  criteria: Use dd($data) to write to the Devel debug log file (config key debug_logfile, default temporary://drupal_debug.txt).
  bundle: devel
  rubric_ref: rubric/devel_devel_log_to_file@1.0
  tags:
  - mode:recipe
- id: devel-dumper-backend
  input: What is the default variable-dumper backend Devel uses to render dumps, and what Devel helper
    prints a dump using the Kint backend when it's installed? Name both.
  criteria: The default dumper is Symfony VarDumper (plugin id var_dumper); kint($input) renders via the
    Kint dumper when its library is present.
  bundle: devel
  rubric_ref: rubric/devel_devel_dumper_backend@1.0
  tags:
  - mode:recipe
- id: devel-drush-services-token
  input: From the command line on a Drupal 11 site with Devel + Drush, which drush commands list the service-container
    service IDs and the available tokens? Give the command names.
  criteria: drush devel:services (list service IDs/classes) and drush devel:token (list available tokens).
    Devel also ships devel:hook, devel:event, devel:uuid, devel:reinstall.
  bundle: devel
  rubric_ref: rubric/devel_devel_drush_services_token@1.0
  tags:
  - mode:recipe
- id: devel-generate-submodule
  input: I need to bulk-generate dummy nodes, users, and taxonomy terms on a Drupal 11 dev site. Which
    Devel submodule provides this, and what is the Drush command namespace it adds?
  criteria: The Devel Generate submodule (devel_generate) creates bulk dummy content and adds the devel-generate:*
    content-generation Drush commands.
  bundle: devel
  rubric_ref: rubric/devel_devel_generate_submodule@1.0
  tags:
  - mode:recipe
- id: devel-access-permission
  input: Which Devel permission must an account have to view developer output such as variable dumps,
    the query log, and the routes/services/events introspection pages? Name the exact permission machine
    string.
  criteria: 'The `access devel information` permission (restrict access: TRUE — grant only to trusted
    developers).'
  bundle: devel
  rubric_ref: rubric/devel_devel_access_permission@1.0
  tags:
  - mode:recipe
- id: devel-dumper-plugin-type
  input: I want to register a custom variable-dumper backend for Devel from my own module. Which Devel
    plugin type do I implement, and in which plugin discovery directory does the class go?
  criteria: Implement the DevelDumper plugin type (base class DevelDumperBase), placing the class in src/Plugin/Devel/Dumper/;
    the active backend is chosen by devel.settings:devel_dumper.
  bundle: devel
  rubric_ref: rubric/devel_devel_dumper_plugin_type@1.0
  tags:
  - mode:recipe
