metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: devel_entity_updates
  version: 5.0.x
  note: 'Devel Entity Updates is a development-only Drush helper (plus one wrapper class) that restores
    core''s removed entity:updates behavior. Cases are `recipe` (response-graded): they probe documented
    facts an agent would otherwise read source to answer. No site mutation.'
questions:
- id: deu-command-and-aliases
  input: On a Drupal 11 dev site with the devel_entity_updates module enabled, which drush command applies
    pending entity schema updates, and what are its aliases?
  criteria: The `devel-entity-updates` command (aliases `dentup`, `entup`, `entity-updates`); e.g. `drush
    entup`.
  bundle: devel_entity_updates
  rubric_ref: rubric/devel_entity_updates_deu_command_and_aliases@1.0
  tags:
  - mode:recipe
- id: deu-restores-removed-core-command
  input: Drupal core removed the old `drush entity-updates` / `drush entup` command. How can I get that
    entity-updates behavior back on a development site?
  criteria: Install the devel_entity_updates module; it is a drop-in replacement providing the `entup`
    / `entity-updates` command and also replaces core's `entity:updates` command.
  bundle: devel_entity_updates
  rubric_ref: rubric/devel_entity_updates_deu_restores_removed_core_command@1.0
  tags:
  - mode:recipe
- id: deu-dev-only-warning
  input: Is it safe to enable devel_entity_updates in production and rely on it in deployment workflows?
  criteria: No. It is a development-only tool (depends on Devel) and must not be enabled in production
    or used in deployment; released schema changes must use hook_update_N()/hook_post_update_NAME().
  bundle: devel_entity_updates
  rubric_ref: rubric/devel_entity_updates_deu_dev_only_warning@1.0
  tags:
  - mode:recipe
- id: deu-why-core-removed
  input: Why did Drupal core remove automatic entity-definition updates, and what should be used instead
    for released changes?
  criteria: Because applying arbitrary entity schema changes is not predictable/reliable for deployments;
    released changes must use DB update functions (hook_update_N / hook_post_update_NAME). See drupal.org/node/3082442.
  bundle: devel_entity_updates
  rubric_ref: rubric/devel_entity_updates_deu_why_core_removed@1.0
  tags:
  - mode:recipe
- id: deu-apply-api
  input: Which class and method in devel_entity_updates programmatically applies pending entity/field
    definition schema changes?
  criteria: DevelEntityDefinitionUpdateManager::applyUpdates(); resolve it via the class resolver (getInstanceFromDefinition()).
  bundle: devel_entity_updates
  rubric_ref: rubric/devel_entity_updates_deu_apply_api@1.0
  tags:
  - mode:recipe
- id: deu-data-migration-guard
  input: What happens when devel_entity_updates encounters an entity type schema change that would require
    a data migration?
  criteria: 'It refuses: applyUpdates() throws an \InvalidArgumentException stating the update requires
    a data migration; it only handles migration-free schema changes.'
  bundle: devel_entity_updates
  rubric_ref: rubric/devel_entity_updates_deu_data_migration_guard@1.0
  tags:
  - mode:recipe
- id: deu-cache-clear-option
  input: By default `drush entup` rebuilds caches after applying updates. Which option suppresses that
    automatic cache rebuild?
  criteria: The `--cache-clear` option (default TRUE); set `--cache-clear=0` to suppress the automatic
    cache rebuild.
  bundle: devel_entity_updates
  rubric_ref: rubric/devel_entity_updates_deu_cache_clear_option@1.0
  tags:
  - mode:recipe
- id: deu-not-for-mismatched-error
  input: My production site shows the 'Mismatched entity and/or field definitions' error. Should I use
    devel_entity_updates to fix it?
  criteria: No. It is not meant to fix that error on production; instead identify the module defining
    the problematic entity/field type and open a bug/support request in its queue.
  bundle: devel_entity_updates
  rubric_ref: rubric/devel_entity_updates_deu_not_for_mismatched_error@1.0
  tags:
  - mode:recipe
