rubrics:
- id: decoupled_router_decoupled_router_endpoint_route
  version: '1.0'
  applicable_bundles:
  - decoupled_router
  checks:
  - kind: must_contain_any
    values:
    - /router/translate-path
    - decoupled_router.path_translation
  scoring:
    combine: all_pass
- id: decoupled_router_decoupled_router_response_shape
  version: '1.0'
  applicable_bundles:
  - decoupled_router
  checks:
  - kind: must_contain_any
    values:
    - jsonapi
    - individual
    - uuid
  scoring:
    combine: all_pass
- id: decoupled_router_decoupled_router_access_and_404
  version: '1.0'
  applicable_bundles:
  - decoupled_router
  checks:
  - kind: must_contain_any
    values:
    - access content
  scoring:
    combine: all_pass
- id: decoupled_router_decoupled_router_config_key
  version: '1.0'
  applicable_bundles:
  - decoupled_router
  checks:
  - kind: must_contain_any
    values:
    - absolute_resolved_urls
  scoring:
    combine: all_pass
- id: decoupled_router_decoupled_router_resolve_landing
  version: '1.0'
  applicable_bundles:
  - decoupled_router
  checks:
  - kind: must_contain_any
    values:
    - aaaaaaaa-1111-4222-8333-444444444444
  scoring:
    combine: all_pass
- id: decoupled_router_decoupled_router_relative_setting
  version: '1.0'
  applicable_bundles:
  - decoupled_router
  checks:
  - kind: must_contain_any
    values:
    - absolute_resolved_urls
  scoring:
    combine: all_pass
- id: decoupled_router_decoupled_router_build_alias
  version: '1.0'
  applicable_bundles:
  - decoupled_router
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
- id: decoupled_router_decoupled_router_relative_urls
  version: '1.0'
  applicable_bundles:
  - decoupled_router
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
