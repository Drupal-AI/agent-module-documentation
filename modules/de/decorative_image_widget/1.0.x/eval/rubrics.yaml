rubrics:
- id: decorative_image_widget_decorative_image_widget_what_it_adds
  version: '1.0'
  applicable_bundles:
  - decorative_image_widget
  checks:
  - kind: must_contain_any
    values:
    - Decorative
    - decorative
    - alt text
    - alt
    - screen reader
    - accessibility
  scoring:
    combine: all_pass
- id: decorative_image_widget_decorative_image_widget_prerequisite
  version: '1.0'
  applicable_bundles:
  - decorative_image_widget
  checks:
  - kind: must_contain_any
    values:
    - alt_field_required
    - not required
    - alt text
    - use_decorative_checkbox
    - third_party_settings
    - form display
  scoring:
    combine: all_pass
- id: decorative_image_widget_decorative_image_widget_validation
  version: '1.0'
  applicable_bundles:
  - decorative_image_widget
  checks:
  - kind: must_contain_any
    values:
    - error
    - validation
    - must provide
    - alternative text
    - decorative
  scoring:
    combine: all_pass
- id: decorative_image_widget_decorative_image_widget_known_field
