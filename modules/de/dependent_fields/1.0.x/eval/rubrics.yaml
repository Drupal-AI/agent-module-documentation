rubrics:
- id: dependent_fields_dependent_fields_handler_id
  version: '1.0'
  applicable_bundles:
  - dependent_fields
  checks:
  - kind: must_contain_any
    values:
    - dependent_fields_selection
    - Make field dependent using views
  scoring:
    combine: all_pass
- id: dependent_fields_dependent_fields_requirements
  version: '1.0'
  applicable_bundles:
  - dependent_fields
  checks:
  - kind: must_contain_any
    values:
    - contextual filter
    - argument
    - Entity Reference
    - Select list
    - autocomplete
  scoring:
    combine: all_pass
- id: dependent_fields_dependent_fields_storage
  version: '1.0'
  applicable_bundles:
  - dependent_fields
  checks:
  - kind: must_contain_any
    values:
    - handler_settings
    - dependent_fields_view
    - parent_field
    - field_config
  scoring:
    combine: all_pass
- id: dependent_fields_dependent_fields_read_handler
  version: '1.0'
  applicable_bundles:
  - dependent_fields
  checks:
  - kind: must_contain_any
    values:
    - field_dfx_parent
  scoring:
    combine: all_pass
- id: dependent_fields_dependent_fields_read_args
  version: '1.0'
  applicable_bundles:
  - dependent_fields
  checks:
  - kind: must_contain_any
    values:
    - published
    - UUID
    - uuid
    - 'true'
  scoring:
    combine: all_pass
- id: dependent_fields_dependent_fields_configure
  version: '1.0'
  applicable_bundles:
  - dependent_fields
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
- id: dependent_fields_dependent_fields_uuid
  version: '1.0'
  applicable_bundles:
  - dependent_fields
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
