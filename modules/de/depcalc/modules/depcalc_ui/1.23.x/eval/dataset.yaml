metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: depcalc_ui
  version: 1.23.x
  note: 'depcalc_ui is a trivial glue submodule of depcalc: a single .module file implementing hook_form_system_performance_settings_alter()
    to add a ''Clear depcalc cache'' submit button to /admin/config/development/performance; its handler
    calls \Drupal::service(''cache.depcalc'')->deleteAllPermanent(). No routes/permissions/config/services/plugins.
    Trivial tier split 3 easy / 1 medium / 1 hard. Hard case = clearing the depcalc cache (the button''s
    effect), verified via cache_depcalc row count.'
questions:
- id: depcalc_ui-what
  input: What does the depcalc_ui module add, and on which admin page?
  criteria: It adds a 'Clear depcalc cache' button to the core Performance settings page (/admin/config/development/performance)
    via hook_form_system_performance_settings_alter().
  bundle: depcalc_ui
  rubric_ref: rubric/depcalc_ui_depcalc_ui_what@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: depcalc_ui-mechanism
  input: When you click depcalc_ui's 'Clear depcalc cache' button, what does it actually do, and what
    is the CLI equivalent?
  criteria: The submit handler calls \Drupal::service('cache.depcalc')->deleteAllPermanent(), emptying
    the depcalc cache bin. The CLI equivalent is drush depcalc:clear-cache (alias dep-cc).
  bundle: depcalc_ui
  rubric_ref: rubric/depcalc_ui_depcalc_ui_mechanism@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: depcalc_ui-why
  input: Why does depcalc_ui exist as a separate button instead of relying on the normal 'Clear all caches'?
    What does it depend on?
  criteria: The depcalc cache bin intentionally survives a normal cache rebuild ('Clear all caches' does
    not clear depcalc cache), so depcalc_ui adds a dedicated button. It only depends on the depcalc module.
  bundle: depcalc_ui
  rubric_ref: rubric/depcalc_ui_depcalc_ui_why@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: depcalc_ui-enabled
  input: On this Drupal site, is the depcalc_ui module enabled, and which module does it depend on? Inspect
    the live site to answer.
  criteria: depcalc_ui is enabled and depends on the depcalc module (drush pm:list shows both enabled;
    its .info.yml lists dependency drupal:depcalc).
  bundle: depcalc_ui
  rubric_ref: rubric/depcalc_ui_depcalc_ui_enabled@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/depcalc_ui-enabled-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/depcalc_ui-enabled-cleanup.sh
- id: depcalc_ui-clear-cache
  input: The depcalc cache currently has data. Perform the action depcalc_ui's 'Clear depcalc cache' button
    performs so the depcalc cache bin ends up empty, and apply it to the live site.
  criteria: 'Empty the depcalc bin as the button does: \Drupal::service(''cache.depcalc'')->deleteAllPermanent()
    (or drush depcalc:clear-cache). Afterwards cache_depcalc has 0 rows.'
  bundle: depcalc_ui
  rubric_ref: rubric/depcalc_ui_depcalc_ui_clear_cache@1.0
  tags:
  - mode:execution
  - difficulty:hard
