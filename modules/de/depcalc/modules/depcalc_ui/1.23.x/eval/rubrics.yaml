rubrics:
- id: depcalc_ui_depcalc_ui_what
  version: '1.0'
  applicable_bundles:
  - depcalc_ui
  checks:
  - kind: must_contain_any
    values:
    - Clear depcalc cache
    - performance
    - /admin/config/development/performance
  scoring:
    combine: all_pass
- id: depcalc_ui_depcalc_ui_mechanism
  version: '1.0'
  applicable_bundles:
  - depcalc_ui
  checks:
  - kind: must_contain_any
    values:
    - deleteAllPermanent
    - cache.depcalc
    - depcalc:clear-cache
  scoring:
    combine: all_pass
- id: depcalc_ui_depcalc_ui_why
  version: '1.0'
  applicable_bundles:
  - depcalc_ui
  checks:
  - kind: must_contain_any
    values:
    - does not
    - not clear
    - depcalc
    - survives
  scoring:
    combine: all_pass
- id: depcalc_ui_depcalc_ui_enabled
  version: '1.0'
  applicable_bundles:
  - depcalc_ui
  checks:
  - kind: must_contain_any
    values:
    - depcalc
  scoring:
    combine: all_pass
- id: depcalc_ui_depcalc_ui_clear_cache
  version: '1.0'
  applicable_bundles:
  - depcalc_ui
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
