metadata:
  module: devel_php
  version: 2.0.x
  note: Converted from the legacy 'cases' shape, which had no gradable checks. The checks were written
    from the expected points and need review.
questions:
- id: purpose
  input: What does the Devel PHP module add to a Drupal site?
  criteria: Adds an Execute PHP feature to Devel; Lets privileged users run arbitrary PHP code from the
    admin UI; Provides a page at /devel/php and a block.
  bundle: devel_php
  rubric_ref: rubric/devel_php_purpose@1.0
  tags:
  - mode:recipe
- id: route-path
  input: What is the route name and path of the Execute PHP form?
  criteria: Route name devel_php.execute_php; Path /devel/php.
  bundle: devel_php
  rubric_ref: rubric/devel_php_route_path@1.0
  tags:
  - mode:recipe
- id: permission
  input: Which permission controls access to Devel PHP, and how sensitive is it?
  criteria: 'The single permission ''execute php code''; Marked restrict access: TRUE; Gates both the
    /devel/php page and the Execute PHP Code block; Equivalent to full server compromise; grant only to
    trusted developers, never on production.'
  bundle: devel_php
  rubric_ref: rubric/devel_php_permission@1.0
  tags:
  - mode:recipe
- id: no-config
  input: Does Devel PHP have a settings/configuration form?
  criteria: No settings form and no config schema; info.yml has no configure key (configure is null).
  bundle: devel_php
  rubric_ref: rubric/devel_php_no_config@1.0
  tags:
  - mode:recipe
- id: dependency
  input: What does Devel PHP depend on and why?
  criteria: Depends on the devel module (drupal/devel >=5.2); Uses Devel's devel.dumper service to display
    printed output.
  bundle: devel_php
  rubric_ref: rubric/devel_php_dependency@1.0
  tags:
  - mode:recipe
- id: execution-behavior
  input: How is submitted code executed and its output shown, and should you use <?php ?> tags?
  criteria: Code is run with eval() inside output buffering; Printed output is captured and shown via
    the devel.dumper service; Thrown Throwables are caught and shown as error messages; Do not wrap code
    in <?php ?> tags.
  bundle: devel_php
  rubric_ref: rubric/devel_php_execution_behavior@1.0
  tags:
  - mode:recipe
- id: block
  input: Does Devel PHP provide a block, and what access does it enforce?
  criteria: Yes, a block plugin devel_execute_php labeled 'Execute PHP Code'; Renders the same Execute
    PHP form; Requires the 'execute php code' permission.
  bundle: devel_php
  rubric_ref: rubric/devel_php_block@1.0
  tags:
  - mode:recipe
