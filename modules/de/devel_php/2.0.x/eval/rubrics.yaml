rubrics:
- id: devel_php_purpose
  version: '1.0'
  applicable_bundles:
  - devel_php
  checks:
  - kind: must_contain_any
    values:
    - Execute PHP
  - kind: must_contain_any
    values:
    - PHP code
    - arbitrary PHP
    - run PHP
  scoring:
    combine: all_pass
- id: devel_php_route_path
  version: '1.0'
  applicable_bundles:
  - devel_php
  checks:
  - kind: must_contain_any
    values:
    - devel_php.execute_php
  - kind: must_contain_any
    values:
    - /devel/php
  scoring:
    combine: all_pass
- id: devel_php_permission
  version: '1.0'
  applicable_bundles:
  - devel_php
  checks:
  - kind: must_contain_any
    values:
    - execute php code
  - kind: must_contain_any
    values:
    - restrict access
    - restrict_access
  scoring:
    combine: all_pass
- id: devel_php_no_config
  version: '1.0'
  applicable_bundles:
  - devel_php
  checks:
  - kind: must_contain_any
    values:
    - no settings
    - no configuration
    - no config
    - does not have
    - doesn't have
    - no form
  scoring:
    combine: all_pass
- id: devel_php_dependency
  version: '1.0'
  applicable_bundles:
  - devel_php
  checks:
  - kind: must_contain_any
    values:
    - devel
  - kind: must_contain_any
    values:
    - devel.dumper
    - dumper
  scoring:
    combine: all_pass
- id: devel_php_execution_behavior
  version: '1.0'
  applicable_bundles:
  - devel_php
  checks:
  - kind: must_contain_any
    values:
    - eval
  - kind: must_contain_any
    values:
    - output buffer
    - ob_start
    - buffering
    - buffered
  - kind: must_contain_any
    values:
    - dumper
  scoring:
    combine: all_pass
- id: devel_php_block
  version: '1.0'
  applicable_bundles:
  - devel_php
  checks:
  - kind: must_contain_any
    values:
    - devel_execute_php
    - Execute PHP Code
  scoring:
    combine: all_pass
