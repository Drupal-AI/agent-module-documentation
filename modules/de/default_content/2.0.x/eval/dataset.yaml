# Generated from evals.json by evaluation/to_commons.py.
# Edit evals.json and rerun the script; do not edit this file.
metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: default_content
  version: 2.0.x
  note: Default Content has no UI, settings, or permissions; it exposes Drush export commands, an importer/exporter/normalizer
    service API, a YAML content-file layout, and two events. Cases are `recipe` (response-graded) probing
    documented facts an agent would otherwise read source to answer; no site mutation.
questions:
- id: default_content-export-single
  input: On a Drupal 11 site with the default_content module, which Drush command (and alias) exports
    a single node with ID 123 to YAML, and how do I write it to a file?
  criteria: drush default-content:export node 123 (alias dce); add --file=path.yml (must end .yml) to
    write to a file instead of stdout.
  bundle: default_content
  rubric_ref: rubric/default_content_default_content_export_single@1.0
  tags:
  - mode:recipe
- id: default_content-export-references
  input: I want to export a node AND every entity it references (author, terms, files) with default_content.
    Which Drush command and alias do that, and which option sets the destination folder?
  criteria: drush default-content:export-references (alias dcer); the --folder option groups exported
    entities by entity type into directories.
  bundle: default_content
  rubric_ref: rubric/default_content_default_content_export_references@1.0
  tags:
  - mode:recipe
- id: default_content-file-layout
  input: Where inside a module must default_content YAML files live so they import automatically, and
    what is the filename convention?
  criteria: Under the module at content/{entity_type}/{uuid}.yml (filename is the entity UUID or ID).
    Import scans the module's content/ directory.
  bundle: default_content
  rubric_ref: rubric/default_content_default_content_file_layout@1.0
  tags:
  - mode:recipe
- id: default_content-import-trigger
  input: With default_content, when does content actually get imported into the site, and which service
    performs it?
  criteria: Automatically on hook_modules_installed (and on config import) via the default_content.importer
    service (importContent($module)); there is no import Drush command.
  bundle: default_content
  rubric_ref: rubric/default_content_default_content_import_trigger@1.0
  tags:
  - mode:recipe
- id: default_content-service-ids
  input: In default_content 2.x, what are the service IDs for the exporter, the importer, and the entity
    normalizer?
  criteria: default_content.exporter (Exporter), default_content.importer (Importer), and default_content.content_entity_normalizer
    (ContentEntityNormalizer).
  bundle: default_content
  rubric_ref: rubric/default_content_default_content_service_ids@1.0
  tags:
  - mode:recipe
- id: default_content-references-in-yaml
  input: How does default_content represent an entity reference in its YAML, and how does it guarantee
    a referenced entity (like a taxonomy term) is imported before the node that references it?
  criteria: 'References are stored as `entity: {uuid}` and listed under _meta.depends; the importer builds
    a dependency graph (core Graph) and topologically sorts it so referenced entities are saved first.'
  bundle: default_content
  rubric_ref: rubric/default_content_default_content_references_in_yaml@1.0
  tags:
  - mode:recipe
- id: default_content-info-uuid-list
  input: For the default-content:export-module (dcem) command, how do I tell default_content which entities
    to export from a module?
  criteria: 'List the entity UUIDs under a default_content: key in {module}.info.yml, grouped by entity
    type; dcem/dcemr export those into the module''s content/ directory.'
  bundle: default_content
  rubric_ref: rubric/default_content_default_content_info_uuid_list@1.0
  tags:
  - mode:recipe
- id: default_content-events
  input: I want to run code after default_content imports a module's content. Which event do I subscribe
    to and what does its event object provide?
  criteria: Subscribe to DefaultContentEvents::IMPORT ('default_content.import'); the ImportEvent provides
    getImportedEntities() and getModule().
  bundle: default_content
  rubric_ref: rubric/default_content_default_content_events@1.0
  tags:
  - mode:recipe
