metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: menu_export
  version: 1.7.x
  note: 'Menu Export exports/imports content menu links (menu_link_content entities) via two config objects:
    menu_export.settings (key ''menus'' = array of selected menu machine names) and menu_export.export_data
    (the serialized links, keyed by link id; each field stored as its first delta, so export_data.<id>.menu_name.value
    / .title.value). Admin section at /admin/config/development/menu_export (Menu List / Export / Import
    tabs), all gated by the ''export and import menu links'' permission; info.yml has no configure route.
    KNOWN BUG on Drupal 11: the Drush commands menu_export:export and menu_export:import throw ArgumentCountError
    because MenuExportDrushCommands does `new MenuExportForm(\Drupal::configFactory())` while D11 ConfigFormBase::__construct
    needs 2 args; the ADMIN FORMS work (container DI). Because of that, execution cases are grounded in
    the agent-reachable selection config (menu_export.settings.menus); a medium reads back the export
    payload (menu_export.export_data) that the Export admin form produces. Setup for that medium replicates
    MenuExportForm::exportMenus() logic to populate export_data. No config schema shipped, no plugins.'
questions:
- id: menuexport-what-it-does
  input: Core Configuration Management syncs my menus between sites but the actual menu links inside them
    don't move. How does the menu_export module solve this, and what kind of menu links does it handle?
  criteria: menu_export serializes the content menu links (menu_link_content entities) of selected menus
    into the menu_export.export_data config object, so they travel with config export/import. It handles
    content/custom menu links (created in the UI), not module-defined links from *.links.menu.yml.
  bundle: menu_export
  rubric_ref: rubric/menu_export_menuexport_what_it_does@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: menuexport-drush
  input: Which Drush commands does the menu_export module provide to export and import menu links from
    the command line?
  criteria: 'drush menu_export:export (aliases menu-export-export / menu_export-export) writes the selected
    menus'' links to menu_export.export_data; drush menu_export:import (aliases menu-export-import / menu_export-import)
    recreates/updates them from that config on the target site. Note: on Drupal 11 these CLI commands
    currently error (ArgumentCountError); the equivalent Export/Import admin tabs work.'
  bundle: menu_export
  rubric_ref: rubric/menu_export_menuexport_drush@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: menuexport-admin
  input: Where is the menu_export admin UI, and what permission controls access to exporting and importing
    menus?
  criteria: The admin section is at /admin/config/development/menu_export (Menu List, Export, Import tabs).
    All are gated by the 'export and import menu links' permission. The selected menus are stored in menu_export.settings
    (menus).
  bundle: menu_export
  rubric_ref: rubric/menu_export_menuexport_admin@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: menuexport-selected
  input: On this site the menu_export module has been configured to export a particular menu. Inspect
    the live configuration and state which menu (machine name) is currently selected for export.
  criteria: 'The selected menu is menuexp_known (menu_export.settings menus: [menuexp_known]).'
  bundle: menu_export
  rubric_ref: rubric/menu_export_menuexport_selected@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/menu_export-selected-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/menu_export-selected-cleanup.sh
- id: menuexport-payload
  input: The menu_export module on this site has already exported a menu's links into its export data
    config. Inspect the live menu_export.export_data configuration and report the title of the exported
    menu link.
  criteria: The exported payload (menu_export.export_data) contains one link titled 'Exported Data Link'
    (its menu_name is menuexp_data). Each entry stores the field values, e.g. title.value = 'Exported
    Data Link'.
  bundle: menu_export
  rubric_ref: rubric/menu_export_menuexport_payload@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/menu_export-payload-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/menu_export-payload-cleanup.sh
- id: menuexport-select-single
  input: This site has a custom menu with machine name 'menuexp_task' that is not yet marked for export.
    Using the menu_export module, configure it so that this menu will be included when menus are exported.
    Apply the change to the live site.
  criteria: menu_export.settings 'menus' now includes 'menuexp_task' (e.g. tick it on the Menu List form
    at /admin/config/development/menu_export and save, or drush config:set menu_export.settings menus.0
    menuexp_task -y).
  bundle: menu_export
  rubric_ref: rubric/menu_export_menuexport_select_single@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/menu_export-select-single-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/menu_export-select-single-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/menu_export-select-single-verify.sh
- id: menuexport-select-multi
  input: This site has two custom menus, 'menuexp_a' and 'menuexp_b'. Using the menu_export module, configure
    it so that BOTH menus are selected for export. Apply the change to the live site.
  criteria: menu_export.settings 'menus' contains both 'menuexp_a' and 'menuexp_b' (tick both on the Menu
    List form and save, or set the menu_export.settings menus array via drush/config to include both).
  bundle: menu_export
  rubric_ref: rubric/menu_export_menuexport_select_multi@1.0
  tags:
  - mode:execution
