rubrics:
- id: memory_limit_policy_memory_limit_policy_how_applied
  version: '1.0'
  applicable_bundles:
  - memory_limit_policy
  checks:
  - kind: must_contain_any
    values:
    - ini_set
    - memory_limit
  scoring:
    combine: all_pass
- id: memory_limit_policy_memory_limit_policy_constraint_logic
  version: '1.0'
  applicable_bundles:
  - memory_limit_policy
  checks:
  - kind: must_contain_any
    values:
    - all
    - AND
    - every
    - weight
    - negate
  scoring:
    combine: all_pass
- id: memory_limit_policy_memory_limit_policy_plugin_type
  version: '1.0'
  applicable_bundles:
  - memory_limit_policy
  checks:
  - kind: must_contain_any
    values:
    - MemoryLimitConstraint
    - MemoryLimitConstraintBase
    - Plugin/MemoryLimitConstraint
    - submodule
  scoring:
    combine: all_pass
- id: memory_limit_policy_memory_limit_policy_known_memory
  version: '1.0'
  applicable_bundles:
  - memory_limit_policy
  checks:
  - kind: must_contain_any
    values:
    - 384M
    - '384'
  scoring:
    combine: all_pass
- id: memory_limit_policy_memory_limit_policy_enabled_vs_disabled
  version: '1.0'
  applicable_bundles:
  - memory_limit_policy
  checks:
  - kind: must_contain_any
    values:
    - mlp_active
  scoring:
    combine: all_pass
- id: memory_limit_policy_memory_limit_policy_create_policy
  version: '1.0'
  applicable_bundles:
  - memory_limit_policy
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
- id: memory_limit_policy_memory_limit_policy_debug_header
  version: '1.0'
  applicable_bundles:
  - memory_limit_policy
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
