rubrics:
- id: memory_limit_policy_domain_mlp_domain_plugin_id
  version: '1.0'
  applicable_bundles:
  - memory_limit_policy_domain
  checks:
  - kind: must_contain_any
    values:
    - domain
  scoring:
    combine: all_pass
- id: memory_limit_policy_domain_mlp_domain_regex
  version: '1.0'
  applicable_bundles:
  - memory_limit_policy_domain
  checks:
  - kind: must_contain_any
    values:
    - regex
    - domains
    - pattern
  scoring:
    combine: all_pass
- id: memory_limit_policy_domain_mlp_domain_not_domainmodule
  version: '1.0'
  applicable_bundles:
  - memory_limit_policy_domain
  checks:
  - kind: must_contain_any
    values:
    - 'no'
    - request
    - host
    - getHost
  scoring:
    combine: all_pass
- id: memory_limit_policy_domain_memory_limit_policy_domain_known_value
  version: '1.0'
  applicable_bundles:
  - memory_limit_policy_domain
  checks:
  - kind: must_contain_any
    values:
    - reports.example.com
  scoring:
    combine: all_pass
- id: memory_limit_policy_domain_memory_limit_policy_domain_build
  version: '1.0'
  applicable_bundles:
  - memory_limit_policy_domain
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
