metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: memory_limit_policy_query_param
  version: 2.0.x
  note: Submodule of memory_limit_policy providing the 'query_param' MemoryLimitConstraint plugin (class
    QueryParam). Cases are grounded in the real plugin id, its config keys, and its evaluate() logic.
    Medium/hard scripts use mlp_query_param_* policies built with the real 'query_param' constraint config
    and verified by loading the memory_limit_policy config entity.
questions:
- id: mlp_queryparam-plugin-id
  input: What constraint plugin id does memory_limit_policy_query_param add, and what does it match?
  criteria: It registers the 'query_param' MemoryLimitConstraint (class QueryParam). It matches when a
    configured query parameter key is present in the request query string.
  bundle: memory_limit_policy_query_param
  rubric_ref: rubric/memory_limit_policy_query_param_mlp_queryparam_plugin_id@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: mlp_queryparam-keyvalue
  input: Does the memory_limit_policy query_param constraint match on the parameter's value or just its
    presence, and under which config key are the params stored?
  criteria: It matches on the presence of the KEY only, not the value (array_intersect of request query
    keys with the configured list). The keys are stored under the 'query_param' config key, one per line.
  bundle: memory_limit_policy_query_param
  rubric_ref: rubric/memory_limit_policy_query_param_mlp_queryparam_keyvalue@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: mlp_queryparam-usecase
  input: How can I give the URL /reports?export=1 more PHP memory than /reports using memory_limit_policy?
  criteria: Add a 'query_param' constraint listing 'export'; the policy's memory then applies only to
    requests that include the export query parameter.
  bundle: memory_limit_policy_query_param
  rubric_ref: rubric/memory_limit_policy_query_param_mlp_queryparam_usecase@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: memory_limit_policy_query_param-known-value
  input: This Drupal site has an enabled memory limit policy 'mlp_query_param_known' whose only constraint
    is the 'query_param' condition from the memory_limit_policy_query_param submodule. Inspect the live
    configuration and report the value(s) configured for that constraint.
  criteria: The policy mlp_query_param_known (config memory_limit_policy.memory_limit_policy.mlp_query_param_known)
    has a single 'query_param' constraint configured with debug. Read it from the entity's policy_constraints.
  bundle: memory_limit_policy_query_param
  rubric_ref: rubric/memory_limit_policy_query_param_memory_limit_policy_query_param_known_value@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/memory_limit_policy_query_param-known-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/memory_limit_policy_query_param-known-cleanup.sh
- id: memory_limit_policy_query_param-build
  input: 'On this Drupal site, create an enabled memory limit policy with machine id ''mlp_query_param_exec''
    (memory 768M) whose single constraint uses the ''query_param'' condition from the memory_limit_policy_query_param
    submodule: a Query param constraint listing ''export''. Apply it to the live site.'
  criteria: 'Create the memory_limit_policy config entity mlp_query_param_exec with memory ''768M'', status
    TRUE, and a policy_constraints entry {id: query_param, negate: false, ...} matching ''a Query param
    constraint listing ''export'''' (e.g. via the entity storage or the add-policy form).'
  bundle: memory_limit_policy_query_param
  rubric_ref: rubric/memory_limit_policy_query_param_memory_limit_policy_query_param_build@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/memory_limit_policy_query_param-exec-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/memory_limit_policy_query_param-exec-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/memory_limit_policy_query_param-exec-verify.sh
