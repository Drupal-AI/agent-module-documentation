metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: memory_limit_policy_http_method
  version: 2.0.x
  note: Submodule of memory_limit_policy providing the 'http_method' MemoryLimitConstraint plugin (class
    HttpMethod). Cases are grounded in the real plugin id, its config keys, and its evaluate() logic.
    Medium/hard scripts use mlp_http_method_* policies built with the real 'http_method' constraint config
    and verified by loading the memory_limit_policy config entity.
questions:
- id: mlp_httpmethod-plugin-id
  input: What constraint plugin id does memory_limit_policy_http_method add, and what does it match?
  criteria: It registers the 'http_method' MemoryLimitConstraint (class HttpMethod). It matches when the
    current request's HTTP method is one of the configured methods.
  bundle: memory_limit_policy_http_method
  rubric_ref: rubric/memory_limit_policy_http_method_mlp_httpmethod_plugin_id@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: mlp_httpmethod-key
  input: How are the selected HTTP methods stored in a memory_limit_policy http_method constraint, and
    in what case?
  criteria: They are stored under the 'methods' key as a sequence of lowercased method names (e.g. ['post','put']);
    evaluate() compares strtolower($request->getMethod()).
  bundle: memory_limit_policy_http_method
  rubric_ref: rubric/memory_limit_policy_http_method_mlp_httpmethod_key@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: mlp_httpmethod-writes
  input: How can I give only write requests (POST/PUT/PATCH) more PHP memory with memory_limit_policy?
  criteria: Add an 'http_method' constraint and select post, put and patch; the policy's memory then applies
    only when the request method matches one of them.
  bundle: memory_limit_policy_http_method
  rubric_ref: rubric/memory_limit_policy_http_method_mlp_httpmethod_writes@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: memory_limit_policy_http_method-known-value
  input: This Drupal site has an enabled memory limit policy 'mlp_http_method_known' whose only constraint
    is the 'http_method' condition from the memory_limit_policy_http_method submodule. Inspect the live
    configuration and report the value(s) configured for that constraint.
  criteria: The policy mlp_http_method_known (config memory_limit_policy.memory_limit_policy.mlp_http_method_known)
    has a single 'http_method' constraint configured with post. Read it from the entity's policy_constraints.
  bundle: memory_limit_policy_http_method
  rubric_ref: rubric/memory_limit_policy_http_method_memory_limit_policy_http_method_known_value@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/memory_limit_policy_http_method-known-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/memory_limit_policy_http_method-known-cleanup.sh
- id: memory_limit_policy_http_method-build
  input: 'On this Drupal site, create an enabled memory limit policy with machine id ''mlp_http_method_exec''
    (memory 768M) whose single constraint uses the ''http_method'' condition from the memory_limit_policy_http_method
    submodule: an HTTP method constraint that includes PUT. Apply it to the live site.'
  criteria: 'Create the memory_limit_policy config entity mlp_http_method_exec with memory ''768M'', status
    TRUE, and a policy_constraints entry {id: http_method, negate: false, ...} matching ''an HTTP method
    constraint that includes PUT'' (e.g. via the entity storage or the add-policy form).'
  bundle: memory_limit_policy_http_method
  rubric_ref: rubric/memory_limit_policy_http_method_memory_limit_policy_http_method_build@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/memory_limit_policy_http_method-exec-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/memory_limit_policy_http_method-exec-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/memory_limit_policy_http_method-exec-verify.sh
