metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: memory_limit_policy_route
  version: 2.0.x
  note: Submodule of memory_limit_policy providing the 'route' MemoryLimitConstraint plugin (class Route).
    Cases are grounded in the real plugin id, its config keys, and its evaluate() logic. Medium/hard scripts
    use mlp_route_* policies built with the real 'route' constraint config and verified by loading the
    memory_limit_policy config entity.
questions:
- id: mlp_route-plugin-ids
  input: Which constraint plugin ids does memory_limit_policy_route provide, and what does each match?
  criteria: 'Two: ''route'' (class Route) matches when the current route name is in the configured ''routes''
    list, and ''admin_route'' (class AdminRoute) matches any admin route via router.admin_context->isAdminRoute().'
  bundle: memory_limit_policy_route
  rubric_ref: rubric/memory_limit_policy_route_mlp_route_plugin_ids@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: mlp_route-validation
  input: When I enter route names in a memory_limit_policy route constraint, what happens if a route name
    doesn't exist?
  criteria: The form validates each route via route_provider->getRouteByName() and sets a form error 'The
    route @route does not exist.' for unknown names, so invalid routes cannot be saved.
  bundle: memory_limit_policy_route
  rubric_ref: rubric/memory_limit_policy_route_mlp_route_validation@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: mlp_route-admin
  input: How do I apply a memory limit to every admin page without listing routes individually?
  criteria: Use the 'admin_route' constraint plugin; it returns TRUE for any admin route (router.admin_context->isAdminRoute())
    and needs no route list.
  bundle: memory_limit_policy_route
  rubric_ref: rubric/memory_limit_policy_route_mlp_route_admin@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: memory_limit_policy_route-known-value
  input: This Drupal site has an enabled memory limit policy 'mlp_route_known' whose only constraint is
    the 'route' condition from the memory_limit_policy_route submodule. Inspect the live configuration
    and report the value(s) configured for that constraint.
  criteria: The policy mlp_route_known (config memory_limit_policy.memory_limit_policy.mlp_route_known)
    has a single 'route' constraint configured with system.admin. Read it from the entity's policy_constraints.
  bundle: memory_limit_policy_route
  rubric_ref: rubric/memory_limit_policy_route_memory_limit_policy_route_known_value@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/memory_limit_policy_route-known-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/memory_limit_policy_route-known-cleanup.sh
- id: memory_limit_policy_route-build
  input: 'On this Drupal site, create an enabled memory limit policy with machine id ''mlp_route_exec''
    (memory 768M) whose single constraint uses the ''route'' condition from the memory_limit_policy_route
    submodule: a Route constraint whose routes include ''user.login''. Apply it to the live site.'
  criteria: 'Create the memory_limit_policy config entity mlp_route_exec with memory ''768M'', status
    TRUE, and a policy_constraints entry {id: route, negate: false, ...} matching ''a Route constraint
    whose routes include ''user.login'''' (e.g. via the entity storage or the add-policy form).'
  bundle: memory_limit_policy_route
  rubric_ref: rubric/memory_limit_policy_route_memory_limit_policy_route_build@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/memory_limit_policy_route-exec-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/memory_limit_policy_route-exec-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/memory_limit_policy_route-exec-verify.sh
