questions:
- id: mlp_env-plugin-id
  input: What constraint plugin id does memory_limit_policy_env_variable add, and what does it read?
  criteria: It registers the 'env_variable' MemoryLimitConstraint (class EnvVariable). It reads the named
    environment variable from PHP's $_ENV and matches its value.
  bundle: memory_limit_policy_env_variable
  rubric_ref: rubric/memory_limit_policy_env_variable_mlp_env_plugin_id@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: mlp_env-empty-values
  input: In a memory_limit_policy env_variable constraint, what does leaving the 'values' list empty do?
  criteria: If 'values' is empty the constraint matches as long as the variable is set to any value (evaluate()
    returns TRUE once $_ENV[name] exists). Otherwise the value must equal a listed value or match one
    as a case-insensitive regex.
  bundle: memory_limit_policy_env_variable
  rubric_ref: rubric/memory_limit_policy_env_variable_mlp_env_empty_values@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: mlp_env-unset
  input: What does the memory_limit_policy env_variable constraint return when the environment variable
    is not set?
  criteria: It returns FALSE when $_ENV[name] is not set, so a non-negated policy does not apply when
    the variable is missing.
  bundle: memory_limit_policy_env_variable
  rubric_ref: rubric/memory_limit_policy_env_variable_mlp_env_unset@1.0
  tags:
  - mode:recipe
  - difficulty:easy
