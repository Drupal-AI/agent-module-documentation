rubrics:
- id: memory_limit_policy_env_variable_mlp_env_plugin_id
  version: '1.0'
  applicable_bundles:
  - memory_limit_policy_env_variable
  checks:
  - kind: must_contain_any
    values:
    - env_variable
  scoring:
    combine: all_pass
- id: memory_limit_policy_env_variable_mlp_env_empty_values
  version: '1.0'
  applicable_bundles:
  - memory_limit_policy_env_variable
  checks:
  - kind: must_contain_any
    values:
    - empty
    - any
    - exist
    - 'TRUE'
  scoring:
    combine: all_pass
- id: memory_limit_policy_env_variable_mlp_env_unset
  version: '1.0'
  applicable_bundles:
  - memory_limit_policy_env_variable
  checks:
  - kind: must_contain_any
    values:
    - 'FALSE'
    - not set
    - unset
  scoring:
    combine: all_pass
- id: memory_limit_policy_env_variable_memory_limit_policy_env_variable_known_value
  version: '1.0'
  applicable_bundles:
  - memory_limit_policy_env_variable
  checks:
  - kind: must_contain_any
    values:
    - APP_ENV
  scoring:
    combine: all_pass
- id: memory_limit_policy_env_variable_memory_limit_policy_env_variable_build
  version: '1.0'
  applicable_bundles:
  - memory_limit_policy_env_variable
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
