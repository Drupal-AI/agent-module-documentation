  module: memory_limit_policy_role
  version: 2.0.x
  note: Submodule of memory_limit_policy providing the 'role' MemoryLimitConstraint plugin (class Role).
    Cases are grounded in the real plugin id, its config keys, and its evaluate() logic. Medium/hard scripts
    use mlp_role_* policies built with the real 'role' constraint config and verified by loading the memory_limit_policy
    config entity.
questions:
- id: mlp_role-plugin-id
  input: What is the constraint plugin id provided by the memory_limit_policy_role submodule, and what
    condition does it check on a request?
  criteria: It registers the MemoryLimitConstraint plugin id 'role' (class Role). It matches when the
    current user has one of the configured roles.
  bundle: memory_limit_policy_role
  rubric_ref: rubric/memory_limit_policy_role_mlp_role_plugin_id@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: mlp_role-config-key
  input: In a memory_limit_policy 'role' constraint, under which configuration key are the selected roles
    stored, and how are they matched?
  criteria: Selected roles are stored under the 'roles' key (a map of role machine name => role machine
    name). evaluate() returns TRUE when the current user has ANY of those roles (array_intersect with
    current_user->getRoles()).
  bundle: memory_limit_policy_role
  rubric_ref: rubric/memory_limit_policy_role_mlp_role_config_key@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: mlp_role-deps
  input: Does a memory_limit_policy role constraint create any config dependencies, and what does the
    'negate' option do to it?
  criteria: 'Yes: calculateDependencies() adds a config dependency user.role.<id> for each selected role.
    Setting negate reverses the match (the policy then applies when the user does NOT have the selected
    role(s)).'
  bundle: memory_limit_policy_role
  rubric_ref: rubric/memory_limit_policy_role_mlp_role_deps@1.0
  tags:
  - mode:recipe
  - difficulty:easy
