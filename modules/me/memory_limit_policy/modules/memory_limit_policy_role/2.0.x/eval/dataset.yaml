  criteria: The policy mlp_role_known (config memory_limit_policy.memory_limit_policy.mlp_role_known)
    has a single 'role' constraint configured with authenticated. Read it from the entity's policy_constraints.
  bundle: memory_limit_policy_role
  rubric_ref: rubric/memory_limit_policy_role_memory_limit_policy_role_known_value@1.0
