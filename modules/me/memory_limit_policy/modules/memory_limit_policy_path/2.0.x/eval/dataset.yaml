questions:
- id: mlp_path-plugin-id
  input: What constraint plugin id does memory_limit_policy_path add, and what request property does it
    test?
  criteria: It registers the 'path' MemoryLimitConstraint (class Path). It matches the current request
    path (and its alias) against configured path patterns.
  bundle: memory_limit_policy_path
  rubric_ref: rubric/memory_limit_policy_path_mlp_path_plugin_id@1.0
