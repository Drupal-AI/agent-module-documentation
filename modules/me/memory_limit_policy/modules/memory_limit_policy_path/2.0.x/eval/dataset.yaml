- id: mlp_path-wildcard
  input: How do I express 'all node edit pages' in a memory_limit_policy path constraint, and which config
    key holds the patterns?
  criteria: Enter one path per line under the 'paths' key and use '*' as a wildcard, e.g. /node/*/edit.
    Matching uses Drupal's path.matcher service.
  bundle: memory_limit_policy_path
  rubric_ref: rubric/memory_limit_policy_path_mlp_path_wildcard@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: mlp_path-alias
  input: Does the memory_limit_policy path constraint match on URL aliases too, and how is a path compared?
  criteria: Yes. evaluate() first matches the internal current path with path.matcher->matchPath(); if
    that fails it resolves the alias via path_alias.manager and matches that too.
  bundle: memory_limit_policy_path
  rubric_ref: rubric/memory_limit_policy_path_mlp_path_alias@1.0
  tags:
  - mode:recipe
  - difficulty:easy
