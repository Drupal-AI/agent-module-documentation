metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: media_crowdriff
  version: 1.1.x
  note: Media Crowdriff is a core-Media integration with no settings form, no configure route (configure=null),
    no permissions, no Drush, and no config schema. It defines a media source plugin (id media_crowdriff,
    allowed_field_types string_long, auto source field field_media_media_crowdriff), a Media Library add
    form (MediaCrowdriffMediaForm), a validation constraint (id media_crowdriff, regex /(cr-init__|cr__init-)[a-z0-9]{8,}/),
    and a field formatter (id media_crowdriff, for string_long, settings width=100%/height=900px) that
    renders the media_crowdriff theme hook emitting an async <script src=https://starling.crowdriff.com/js/crowdriff.js>.
    All medium/hard cases are grounded in real media types/entities/view-displays created with that source
    and formatter.
questions:
- id: media_crowdriff-how-to-embed
  input: On a Drupal 11 site with the media_crowdriff module enabled, how do I let editors embed Crowdriff
    galleries as reusable media? Describe what to create and which media source to pick.
  criteria: Create a new Media type (Structure > Media types > Add) and choose 'Media Crowdriff' (source
    plugin id media_crowdriff) as its Media source. Core auto-creates a string_long source field (field_media_media_crowdriff).
    Editors then add assets via the Media Library, pasting the Crowdriff embed code.
  bundle: media_crowdriff
  rubric_ref: rubric/media_crowdriff_media_crowdriff_how_to_embed@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: media_crowdriff-valid-embed
  input: The media_crowdriff module validates the Crowdriff embed code an editor pastes. What must the
    pasted code contain for it to be accepted, and what enforces that?
  criteria: The media_crowdriff validation constraint (MediaCrowdriffConstraintValidator) requires the
    value to match the regex /(cr-init__|cr__init-)[a-z0-9]{8,}/ - i.e. contain a Crowdriff id like cr-init__abcd1234.
    Empty values fail with 'The embed code cannot be empty.'; non-matching values fail with the invalid-code
    message.
  bundle: media_crowdriff
  rubric_ref: rubric/media_crowdriff_media_crowdriff_valid_embed@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: media_crowdriff-formatter-size
  input: Which field formatter does media_crowdriff provide for displaying a Crowdriff embed, what settings
    does it expose, and what are their default values?
  criteria: The 'Media Crowdriff' formatter (id media_crowdriff, for string_long fields) exposes Width
    and Height settings (CSS units), defaulting to width=100% and height=900px. It extracts the Crowdriff
    id and renders the media_crowdriff theme hook (the async crowdriff.js loader script).
  bundle: media_crowdriff
  rubric_ref: rubric/media_crowdriff_media_crowdriff_formatter_size@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: media_crowdriff-which-source
  input: This Drupal site has a media type named mc_probe_type. Inspect the live configuration and report
    which media source plugin it uses and the machine name of its source field.
  criteria: mc_probe_type uses the media_crowdriff source plugin; its source field is field_media_media_crowdriff
    (string_long).
  bundle: media_crowdriff
  rubric_ref: rubric/media_crowdriff_media_crowdriff_which_source@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/media_crowdriff-source-type-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/media_crowdriff-source-type-cleanup.sh
- id: media_crowdriff-embedded-id
  input: This site has a Crowdriff media asset named mc_probe_asset (media type mc_asset_type). Inspect
    the live media entity's source field and report the Crowdriff embed id it contains.
  criteria: The mc_probe_asset media entity's field_media_media_crowdriff value contains the Crowdriff
    id cr-init__abcd1234 (stored inside its embed code).
  bundle: media_crowdriff
  rubric_ref: rubric/media_crowdriff_media_crowdriff_embedded_id@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/media_crowdriff-embed-asset-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/media_crowdriff-embed-asset-cleanup.sh
- id: media_crowdriff-make-type
  input: On this Drupal site, create a media type with machine id mc_task_type that uses the Media Crowdriff
    source, and give it a working string_long source field. Apply the change to the live site.
  criteria: A MediaType mc_task_type exists with source plugin media_crowdriff and a string_long source
    field (field_media_media_crowdriff), e.g. MediaType::create([...'source'=>'media_crowdriff']) then
    createSourceField()->save() and set source_configuration.source_field.
  bundle: media_crowdriff
  rubric_ref: rubric/media_crowdriff_media_crowdriff_make_type@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/media_crowdriff-make-type-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/media_crowdriff-make-type-reset.sh
    verify: agent-module-documentation/evaluation/verify/media_crowdriff-make-type-verify.sh
- id: media_crowdriff-formatter-size-set
  input: On this Drupal site the media type mc_fmt_type uses the Media Crowdriff source and displays its
    embed with the Media Crowdriff formatter. Configure that formatter on the default view display so
    the Crowdriff embed renders at width 640px and height 480px. Apply the change to the live site.
  criteria: In core.entity_view_display.media.mc_fmt_type.default the field_media_media_crowdriff component
    uses type media_crowdriff with settings.width=640px and settings.height=480px.
  bundle: media_crowdriff
  rubric_ref: rubric/media_crowdriff_media_crowdriff_formatter_size_set@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/media_crowdriff-formatter-size-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/media_crowdriff-formatter-size-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/media_crowdriff-formatter-size-verify.sh
