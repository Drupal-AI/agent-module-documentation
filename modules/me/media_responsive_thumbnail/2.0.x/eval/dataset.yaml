metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: media_responsive_thumbnail
  version: 2.0.x
  note: Media Responsive Thumbnail ships one field formatter, media_responsive_thumbnail ('Responsive
    thumbnail'), which extends core's ResponsiveImageFormatter and reuses its settings (responsive_image_style,
    image_link, image_loading). It registers for field_types=entity_reference but isApplicable() restricts
    it to entity-reference fields whose target_type is media, so it only ever appears on Media-reference
    fields. No settings form, no configure route (configure=null), no permissions, no Drush, no plugin
    type of its own. All persistent state is the field's formatter settings in an entity_view_display
    config entity. Medium/hard cases are grounded in that real config on our own namespaced content type
    mrt_ct with a Media-reference field field_mrt_media and a namespaced responsive image style mrt_style
    (node.article is never touched).
questions:
- id: mrt-what-formatter
  input: On a Drupal 11 site I have a Media entity-reference field (points at Media entities, not a plain
    Image field) and I want it to render like an Image field using a Responsive Image style. Which contrib
    module and which field formatter do I use?
  criteria: Use the Media Responsive Thumbnail module; set the field's Format to 'Responsive thumbnail'
    (formatter id media_responsive_thumbnail) on the entity's Manage display screen and choose a Responsive
    image style in its settings.
  bundle: media_responsive_thumbnail
  rubric_ref: rubric/media_responsive_thumbnail_mrt_what_formatter@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: mrt-applicability
  input: The media_responsive_thumbnail formatter is declared for field_types entity_reference, yet it
    never shows up as a Format option on my entity-reference field to Taxonomy terms. Why not, and on
    what kind of entity-reference field does it appear?
  criteria: Its isApplicable() method only returns TRUE when the entity-reference field storage's target_type
    setting is 'media', so the formatter is only offered on entity-reference fields that point at Media
    entities, never at taxonomy terms, users, or other entity types.
  bundle: media_responsive_thumbnail
  rubric_ref: rubric/media_responsive_thumbnail_mrt_applicability@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: mrt-source-fallback
  input: A field on my site uses the media_responsive_thumbnail formatter to display Media entities, but
    one referenced media item is a Remote video whose oembed source field has no local image. What image
    does the formatter fall back to rendering for that item?
  criteria: 'It falls back to the media entity''s own ''thumbnail'' field: the formatter uses the media
    type''s source field first, and only when that field is empty does it render the media entity''s thumbnail
    image instead.'
  bundle: media_responsive_thumbnail
  rubric_ref: rubric/media_responsive_thumbnail_mrt_source_fallback@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: mrt-known-style
  input: On this Drupal site, content type mrt_ct has a Media reference field field_mrt_media whose default
    view display uses the media_responsive_thumbnail formatter. Inspect the live default view display
    and state which responsive image style its formatter is configured to use.
  criteria: 'mrt_style: in core.entity_view_display.node.mrt_ct.default the field_mrt_media component
    (type media_responsive_thumbnail) has settings.responsive_image_style set to mrt_style.'
  bundle: media_responsive_thumbnail
  rubric_ref: rubric/media_responsive_thumbnail_mrt_known_style@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/media_responsive_thumbnail-known-style-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/media_responsive_thumbnail-known-style-cleanup.sh
- id: mrt-link-target
  input: On this Drupal site, content type mrt_ct's field_mrt_media is displayed with the media_responsive_thumbnail
    formatter. Inspect the live default view display configuration and state what the rendered image links
    to (its image_link setting).
  criteria: 'It links to the media item''s own canonical page: in core.entity_view_display.node.mrt_ct.default
    the field_mrt_media component''s settings.image_link is ''media'' (not ''content'', which would link
    to the node, and not empty/no link).'
  bundle: media_responsive_thumbnail
  rubric_ref: rubric/media_responsive_thumbnail_mrt_link_target@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/media_responsive_thumbnail-link-target-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/media_responsive_thumbnail-link-target-cleanup.sh
- id: mrt-set-formatter
  input: On this Drupal site, content type mrt_ct has a Media reference field field_mrt_media currently
    displayed with a plain entity-reference formatter. A responsive image style mrt_style already exists.
    Switch field_mrt_media's default view display to use the Media Responsive Thumbnail module's 'Responsive
    thumbnail' formatter, configured to use the mrt_style responsive image style. Apply the change to
    the live site.
  criteria: In core.entity_view_display.node.mrt_ct.default the field_mrt_media component's type is media_responsive_thumbnail
    and its settings.responsive_image_style is mrt_style (e.g. set the component and save, or pick 'Responsive
    thumbnail' + 'mrt_style' on Manage display).
  bundle: media_responsive_thumbnail
  rubric_ref: rubric/media_responsive_thumbnail_mrt_set_formatter@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/media_responsive_thumbnail-set-formatter-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/media_responsive_thumbnail-set-formatter-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/media_responsive_thumbnail-set-formatter-verify.sh
- id: mrt-set-link
  input: On this Drupal site, content type mrt_ct's field_mrt_media is already displayed with the media_responsive_thumbnail
    formatter (responsive image style mrt_style), but the rendered image is not linked to anything. Update
    its formatter settings so the rendered image links to the referenced media item itself (not the node),
    and apply the change to the live default view display.
  criteria: In core.entity_view_display.node.mrt_ct.default the field_mrt_media component (still type
    media_responsive_thumbnail) has settings.image_link set to 'media', which makes getMediaThumbnailUrl()
    link to the media item's own canonical page.
  bundle: media_responsive_thumbnail
  rubric_ref: rubric/media_responsive_thumbnail_mrt_set_link@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/media_responsive_thumbnail-set-link-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/media_responsive_thumbnail-set-link-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/media_responsive_thumbnail-set-link-verify.sh
