metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: media_entity_twitter
  version: 2.11.x
  note: Live tweet embedding/API fetching depends on external Twitter/X credentials and services, so all
    cases are `recipe` (response-graded), probing the media source plugin id, source field types, metadata
    attributes, the formatter, config keys, and the fetcher service.
questions:
- id: met-source-plugin-id
  input: In Drupal, which core Media source plugin id does the Media Entity Twitter module provide, and
    what core module does it depend on?
  criteria: It provides a MediaSource plugin with id `twitter` (label "Twitter") and depends on the core
    `media` module.
  bundle: media_entity_twitter
  rubric_ref: rubric/media_entity_twitter_met_source_plugin_id@1.0
  tags:
  - mode:recipe
- id: met-source-field-types
  input: When I create a Media type using the Twitter source in Drupal, which source field types are allowed
    and what label does the auto-created source field get?
  criteria: Allowed field types are string, string_long, and link; the auto-created source field is labeled
    "Tweet URL".
  bundle: media_entity_twitter
  rubric_ref: rubric/media_entity_twitter_met_source_field_types@1.0
  tags:
  - mode:recipe
- id: met-no-api-fields
  input: Without configuring any Twitter API credentials, which metadata fields can Media Entity Twitter
    extract from a tweet URL?
  criteria: Only `id` (Tweet ID) and `user` (the author handle) are extracted from the URL via regex;
    richer fields require enabling the Twitter API.
  bundle: media_entity_twitter
  rubric_ref: rubric/media_entity_twitter_met_no_api_fields@1.0
  tags:
  - mode:recipe
- id: met-api-metadata-attributes
  input: After enabling the Twitter API option in Media Entity Twitter, name some of the extra metadata
    attributes the source exposes for mapping to fields.
  criteria: 'With use_twitter_api enabled: image, image_local, image_local_uri, content, retweet_count,
    profile_image_url_https, created_time, and user_name.'
  bundle: media_entity_twitter
  rubric_ref: rubric/media_entity_twitter_met_api_metadata_attributes@1.0
  tags:
  - mode:recipe
- id: met-embed-formatter
  input: Which field formatter does Media Entity Twitter provide to render an embedded tweet, and what
    setting controls whether the parent/previous tweet is shown?
  criteria: The `twitter_embed` formatter; its boolean `conversation` setting (default off) toggles showing
    the previous tweet — when off it sets data-conversation=none.
  bundle: media_entity_twitter
  rubric_ref: rubric/media_entity_twitter_met_embed_formatter@1.0
  tags:
  - mode:recipe
- id: met-thumbnail-config
  input: Which Drupal config object and key set the directory where Media Entity Twitter stores generated
    tweet thumbnails, and what is the default value?
  criteria: Config object `media_entity_twitter.settings`, key `local_images`, default `public://twitter-thumbnails`.
  bundle: media_entity_twitter
  rubric_ref: rubric/media_entity_twitter_met_thumbnail_config@1.0
  tags:
  - mode:recipe
- id: met-fetcher-service
  input: In Drupal code, which Media Entity Twitter service fetches tweet data from the API, and what
    must you call before fetchTweet()?
  criteria: The `media_entity_twitter.tweet_fetcher` service (TweetFetcher); call setCredentials(consumer_key,
    consumer_secret, oauth_access_token, oauth_access_token_secret) before fetchTweet($id), which caches
    responses in the `tweets` bin for 90 days.
  bundle: media_entity_twitter
  rubric_ref: rubric/media_entity_twitter_met_fetcher_service@1.0
  tags:
  - mode:recipe
- id: met-url-matching
  input: Does Media Entity Twitter's URL matching accept x.com URLs in addition to twitter.com, and which
    providers does the source report?
  criteria: Yes — the validation regex matches both twitter.com and x.com status/statuses URLs, and getProviders()
    returns ['Twitter', 'X'].
  bundle: media_entity_twitter
  rubric_ref: rubric/media_entity_twitter_met_url_matching@1.0
  tags:
  - mode:recipe
