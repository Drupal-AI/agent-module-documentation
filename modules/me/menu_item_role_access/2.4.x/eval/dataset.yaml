metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: menu_item_role_access
  version: 2.4.x
  note: 'The module adds a role-visibility setting to menu_link_content links and enforces it by overriding
    the core menu tree manipulator. Cases are `recipe` (response-graded): they probe documented facts
    an agent would otherwise read source to answer; no site mutation.'
questions:
- id: mira-where-setting-appears
  input: On a Drupal 11 site with Menu Item Role Access enabled, where do I choose which roles can see
    a particular menu link?
  criteria: On the menu link add/edit form (menu_link_content), a 'Menu Item Roles' checkboxes field lets
    you pick the roles allowed to see that link.
  bundle: menu_item_role_access
  rubric_ref: rubric/menu_item_role_access_mira_where_setting_appears@1.0
  tags:
  - mode:recipe
- id: mira-hides-for-other-roles
  input: If I select the 'editor' role on a menu link with Menu Item Role Access, what happens for a user
    who is not an editor?
  criteria: Users who do not hold at least one selected role do not see the link; the tree manipulator
    returns AccessResult::forbidden() for them.
  bundle: menu_item_role_access
  rubric_ref: rubric/menu_item_role_access_mira_hides_for_other_roles@1.0
  tags:
  - mode:recipe
- id: mira-empty-roles
  input: With Menu Item Role Access, what happens to a menu link if I leave its roles field empty?
  criteria: An empty menu_item_roles field adds no restriction, so the link is visible to everyone as
    normal.
  bundle: menu_item_role_access
  rubric_ref: rubric/menu_item_role_access_mira_empty_roles@1.0
  tags:
  - mode:recipe
- id: mira-where-stored
  input: In Menu Item Role Access, on which entity and field are the allowed roles for a menu link stored?
  criteria: In the menu_item_roles base field (entity_reference to user_role) added to the menu_link_content
    entity.
  bundle: menu_item_role_access
  rubric_ref: rubric/menu_item_role_access_mira_where_stored@1.0
  tags:
  - mode:recipe
- id: mira-enforcement-mechanism
  input: How does Menu Item Role Access actually enforce which roles see a menu link on a Drupal site?
  criteria: It overrides the core menu.default_tree_manipulators service with MenuItemRoleAccessLinkTreeManipulator
    (extends DefaultMenuLinkTreeManipulators) and adds the role check in menuLinkCheckAccess().
  bundle: menu_item_role_access
  rubric_ref: rubric/menu_item_role_access_mira_enforcement_mechanism@1.0
  tags:
  - mode:recipe
- id: mira-visibility-not-security
  input: Does Menu Item Role Access secure the destination page of a restricted menu link on a Drupal
    site?
  criteria: No. It only controls whether the link is displayed (visibility), not page access; the target
    route's own permissions still apply.
  bundle: menu_item_role_access
  rubric_ref: rubric/menu_item_role_access_mira_visibility_not_security@1.0
  tags:
  - mode:recipe
- id: mira-overwrite-target-access
  input: In Menu Item Role Access, which setting makes the role selection alone decide link visibility,
    ignoring the target route's own access check? Give the config key.
  criteria: The overwrite_internal_link_target_access key (default false) on menu_item_role_access.config.
  bundle: menu_item_role_access
  rubric_ref: rubric/menu_item_role_access_mira_overwrite_target_access@1.0
  tags:
  - mode:recipe
- id: mira-permissions
  input: Which permission lets a user edit the role field on menu links in Menu Item Role Access, versus
    administer the module's settings?
  criteria: '''edit menu_item_role_access'' gates editing the menu_item_roles field; ''administer menu_item_role_access''
    gates the settings/config page.'
  bundle: menu_item_role_access
  rubric_ref: rubric/menu_item_role_access_mira_permissions@1.0
  tags:
  - mode:recipe
