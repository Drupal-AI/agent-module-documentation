rubrics:
- id: media_entity_link_media_entity_link_what
  version: '1.0'
  applicable_bundles:
  - media_entity_link
  checks:
  - kind: must_contain_any
    values:
    - media type
    - media source
    - source plugin
    - link
  scoring:
    combine: all_pass
- id: media_entity_link_media_entity_link_source_field
  version: '1.0'
  applicable_bundles:
  - media_entity_link
  checks:
  - kind: must_contain_any
    values:
    - field_media_entity_link
    - link
  scoring:
    combine: all_pass
- id: media_entity_link_media_entity_link_link_type
  version: '1.0'
  applicable_bundles:
  - media_entity_link
  checks:
  - kind: must_contain_any
    values:
    - link_type
    - Allowed link type
    - link field
    - field_media_entity_link
  scoring:
    combine: all_pass
- id: media_entity_link_media_entity_link_known_url
  version: '1.0'
  applicable_bundles:
