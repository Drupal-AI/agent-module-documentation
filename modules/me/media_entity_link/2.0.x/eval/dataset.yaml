metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: media_entity_link
  version: 2.0.x
  note: Media Entity Link ships (config/install) a Link media type (media.type.link, id=link, source=link)
    backed by the 'link' MediaSource plugin (MediaEntityLink), with source field field_media_entity_link
    (core link field type, cardinality 1) on the link bundle. It needs no configuration and defines no
    permissions/Drush/settings form/configure route. Whether a Link media may use internal/external URLs
    is the core Link field setting link_type on field.field.media.link.field_media_entity_link (1=internal,
    16=external, 17=both; shipped default 17). Medium/hard cases are grounded in real Link media entities
    and that real field_type setting. A Link media entity is a media of bundle 'link' with a name and
    a field_media_entity_link URI.
questions:
- id: media_entity_link-what
  input: What does enabling the Drupal media_entity_link module give you out of the box, and does it need
    any configuration?
  criteria: It provides a 'link' media source plugin and a ready-made Link media type (media.type.link)
    installed automatically, so no configuration is needed. Link media represent internal or external
    URLs and appear in the Media Library.
  bundle: media_entity_link
  rubric_ref: rubric/media_entity_link_media_entity_link_what@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: media_entity_link-source-field
  input: On the Link media type provided by media_entity_link, what is the machine name of the source
    field, and what core field type does it use?
  criteria: The source field is field_media_entity_link, a core 'link' field type (cardinality 1) on the
    link media bundle; media.type.link references it as source_field.
  bundle: media_entity_link
  rubric_ref: rubric/media_entity_link_media_entity_link_source_field@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: media_entity_link-link-type
  input: Using media_entity_link, how do I make the Link media type accept only external URLs (and where
    is internal-vs-external controlled)?
  criteria: It is the standard core Link field 'Allowed link type' setting (link_type) on field.field.media.link.field_media_entity_link.
    Set link_type to 16 for external only (1=internal, 17=both). Change it under Manage fields or with
    drush cset.
  bundle: media_entity_link
  rubric_ref: rubric/media_entity_link_media_entity_link_link_type@1.0
  tags:
  - mode:recipe
  - difficulty:easy
