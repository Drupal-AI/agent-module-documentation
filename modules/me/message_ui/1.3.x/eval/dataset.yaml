    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/message_ui-grant-perm-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/message_ui-grant-perm-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/message_ui-grant-perm-verify.sh
