metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: message_ui
  version: 1.3.x
  note: 'Message UI is the web UI for Message entities. Routes: message_ui.add_page (/message/add), message_ui.add
    (/message/add/{message_template}), entity.message.canonical (/message/{message}), edit/delete, and
    a bulk delete at /admin/config/message/message_delete_multiple. It defines static permissions (bypass
    message access control, update tokens, delete multiple messages, ... any message template) and a permission
    callback MessagePermissions::messageTemplatePermissions() that generates per-template perms ''view|update|create|delete
    <template_id> message''. Plugin type message_ui_views_contextual_links (plugins view/edit/delete).
    Depends on message + views. configure=null. Medium cases create real Message templates and read back
    the generated per-template permissions; hard cases create a Message entity and grant a per-template
    permission (both grounded in message_ui''s actual behavior).'
questions:
- id: message_ui-create-route
  input: Message UI provides the interface to create Message entities. What is the route/path used to
    create a message of a specific message template?
  criteria: Route message_ui.add at /message/add/{message_template} shows the create form for that template;
    /message/add (message_ui.add_page) lists creatable templates and redirects if only one exists.
  bundle: message_ui
  rubric_ref: rubric/message_ui_message_ui_create_route@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: message_ui-per-template-perms
  input: Message UI generates permissions per message template. For a template with machine name 'example_create_node',
    what are the four permission names it produces?
  criteria: MessagePermissions::messageTemplatePermissions() yields 'view example_create_node message',
    'update example_create_node message', 'create example_create_node message', and 'delete example_create_node
    message'. There is also a global 'bypass message access control'.
  bundle: message_ui
  rubric_ref: rubric/message_ui_message_ui_per_template_perms@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: message_ui-contextual-plugin-type
  input: Message UI defines a plugin type used to add operation links to message rows in Views. Name the
    plugin type / its manager and the built-in plugin ids.
  criteria: Plugin type message_ui_views_contextual_links (manager plugin.manager.message_ui_views_contextual_links,
    dir Plugin/MessageUiViewsContextualLinks); built-in plugins are view, edit, and delete (the message_notify_ui
    submodule adds notify).
  bundle: message_ui
  rubric_ref: rubric/message_ui_message_ui_contextual_plugin_type@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: message_ui-known-template-create-perm
  input: This Drupal site has a message template named 'message_ui_eval'. Because Message UI generates
    per-template permissions, what is the exact machine name of the permission that lets a role create
    a message of that template? Verify it exists on the live site.
  criteria: The permission is 'create message_ui_eval message' (generated by MessagePermissions for the
    message_ui_eval template).
  bundle: message_ui
  rubric_ref: rubric/message_ui_message_ui_known_template_create_perm@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/message_ui-template-perm-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/message_ui-template-perm-cleanup.sh
- id: message_ui-known-template-view-perm
  input: A message template 'message_ui_view' exists on this site. What is the exact permission name Message
    UI provides to VIEW a message of that template? Confirm against the live permission list.
  criteria: The permission is 'view message_ui_view message'.
  bundle: message_ui
  rubric_ref: rubric/message_ui_message_ui_known_template_view_perm@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/message_ui-view-perm-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/message_ui-view-perm-cleanup.sh
- id: message_ui-create-message
  input: On this site a message template with machine name 'message_ui_hard' exists. Create a Message
    entity (instance) of that template and save it to the live site.
  criteria: Create and save a Message of template message_ui_hard, e.g. \Drupal\message\Entity\Message::create(['template'
    => 'message_ui_hard'])->save(); (this is what the /message/add/message_ui_hard form does).
  bundle: message_ui
  rubric_ref: rubric/message_ui_message_ui_create_message@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/message_ui-create-message-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/message_ui-create-message-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/message_ui-create-message-verify.sh
- id: message_ui-grant-template-perm
  input: On this site there is a message template 'message_ui_hard' and a role 'message_ui_hrole'. Grant
    that role the Message UI permission that allows creating messages of that specific template, and apply
    it to the live site.
  criteria: Grant the permission 'create message_ui_hard message' to role message_ui_hrole (e.g. drush
    role:perm:add message_ui_hrole 'create message_ui_hard message').
  bundle: message_ui
  rubric_ref: rubric/message_ui_message_ui_grant_template_perm@1.0
  tags:
  - mode:execution
  - difficulty:hard
