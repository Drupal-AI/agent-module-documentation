metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: message_notify_ui
  version: 1.3.x
  note: message_notify_ui (submodule of message_ui) adds a Notify/Send form to Message entities via Message
    Notify. It alters the message entity type to add form handler 'notify' (MessageNotifyForm) and link
    template notify-form -> /message/{message}/notify (route entity.message.notify_form), a 'Notify' local
    task, and a single permission 'send message through the ui'. It also defines a plugin type message_notify_ui_sender_settings_form
    (shipped plugin targets notify_plugin email). No config object. Medium/hard cases are grounded in
    the 'send message through the ui' permission (create roles and grant/inspect it).
questions:
- id: message_notify_ui-route-perm
  input: message_notify_ui adds a way to send a Message from the UI. What is the route/path of the notify
    (send) form, and which permission is required to use it?
  criteria: Route entity.message.notify_form at /message/{message}/notify (entity form 'notify' = MessageNotifyForm),
    gated by the permission 'send message through the ui'; a 'Notify' local task appears on the message
    page.
  bundle: message_notify_ui
  rubric_ref: rubric/message_notify_ui_message_notify_ui_route_perm@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: message_notify_ui-plugin-type
  input: message_notify_ui defines a plugin type for per-notifier sender settings on the send form. Name
    the plugin type / its manager and the notifier the shipped plugin targets.
  criteria: Plugin type message_notify_ui_sender_settings_form (manager plugin.manager.message_notify_ui_sender_settings_form);
    the shipped plugin MessageNotifyUiSenderMailSettingsForm targets notify_plugin = email and adds a
    'use custom email' toggle plus an email field.
  bundle: message_notify_ui
  rubric_ref: rubric/message_notify_ui_message_notify_ui_plugin_type@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: message_notify_ui-depends
  input: Which modules must be enabled for message_notify_ui to work, and what does it add on top of Message
    UI?
  criteria: It depends on message, message_ui, message_notify and views, and adds a Notify/Send form +
    tab to Message entities so a message can be dispatched to its recipient via Message Notify's notifier
    plugins.
  bundle: message_notify_ui
  rubric_ref: rubric/message_notify_ui_message_notify_ui_depends@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: message_notify_ui-known-role
  input: On this Drupal site, exactly one role has been granted the message_notify_ui 'send message through
    the ui' permission. Inspect the live roles and name that role's machine id.
  criteria: Role mnui_sender holds the 'send message through the ui' permission.
  bundle: message_notify_ui
  rubric_ref: rubric/message_notify_ui_message_notify_ui_known_role@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/message_notify_ui-role-can-send-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/message_notify_ui-role-can-send-cleanup.sh
- id: message_notify_ui-which-sends
  input: This site has two roles, mnui_yes and mnui_no. Only one can send messages through the UI. Inspect
    the live permissions and state which role can.
  criteria: mnui_yes can send (it has 'send message through the ui'); mnui_no does not.
  bundle: message_notify_ui
  rubric_ref: rubric/message_notify_ui_message_notify_ui_which_sends@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/message_notify_ui-which-sends-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/message_notify_ui-which-sends-cleanup.sh
- id: message_notify_ui-grant-send
  input: On this site there is a role 'mnui_hard'. Grant it the message_notify_ui permission that allows
    sending a message through the UI, and apply it to the live site.
  criteria: Grant 'send message through the ui' to role mnui_hard (e.g. drush role:perm:add mnui_hard
    'send message through the ui').
  bundle: message_notify_ui
  rubric_ref: rubric/message_notify_ui_message_notify_ui_grant_send@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/message_notify_ui-grant-send-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/message_notify_ui-grant-send-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/message_notify_ui-grant-send-verify.sh
- id: message_notify_ui-new-sender-role
  input: Create a new role with machine id 'mnui_new_sender' and give it permission to send messages through
    the UI (message_notify_ui). Apply to the live site.
  criteria: Create role mnui_new_sender and grant it 'send message through the ui'.
  bundle: message_notify_ui
  rubric_ref: rubric/message_notify_ui_message_notify_ui_new_sender_role@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/message_notify_ui-new-sender-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/message_notify_ui-new-sender-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/message_notify_ui-new-sender-verify.sh
