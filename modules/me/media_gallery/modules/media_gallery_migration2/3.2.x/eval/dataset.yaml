    cleanup: agent-module-documentation/evaluation/verify/media_gallery_migration2-enabled-cleanup.sh
- id: media_gallery_migration2-make-available
  input: This Drupal site has the media_gallery module but the Media 7.x-2.x gallery migrations are not
    currently available. Using the media_gallery_migration2 submodule, make those D7 gallery migrations
    available on the live site (so the d7_media_gallery_entity migration is registered).
  criteria: Enable the submodule (drush en media_gallery_migration2 -y), which installs its enforced migration
    config. Afterwards migrate_plus.migration.d7_media_gallery_entity exists with source.plugin d7_node,
    images sub_process source 'media_gallery_file', and dependencies.enforced.module including media_gallery_migration2.
  bundle: media_gallery_migration2
