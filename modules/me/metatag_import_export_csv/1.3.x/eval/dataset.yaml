metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: metatag_import_export_csv
  version: 1.3.x
  note: 'Metatags Import Export CSV provides two batch admin forms: Export (route metatag_import_export_csv.download,
    /admin/config/search/metatag/download, permission ''metatag import export csv download'') and Import
    (route metatag_import_export_csv.upload, /admin/config/search/metatag/upload, permission ''metatag
    import export csv upload''). Import CSV identifies an entity by entity_type+entity_id OR path_alias,
    requires a field_machine_name column (the entity''s Metatag field), optional language column; empty
    cell = leave unchanged, _blank = clear. Depends on metatag + token; no config object of its own; defines
    only those two permissions. Medium/hard cases are grounded in those two permissions (which role can
    import/export; grant a role the permission), verified against live role config. NOTE: import/export
    execution against a live node was deliberately avoided because this shared site has a pre-existing
    broken field (field_ld_disp, not owned by this module) whose missing DB table makes node deletion
    fail, so test nodes cannot be cleanly torn down.'
questions:
- id: metatag_import_export_csv-forms
  input: In the metatag_import_export_csv module, what are the two admin forms it adds (import and export),
    at what paths, and which permission gates each?
  criteria: Export at /admin/config/search/metatag/download (route metatag_import_export_csv.download,
    permission 'metatag import export csv download') and Import at /admin/config/search/metatag/upload
    (route metatag_import_export_csv.upload, permission 'metatag import export csv upload').
  bundle: metatag_import_export_csv
  rubric_ref: rubric/metatag_import_export_csv_metatag_import_export_csv_forms@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: metatag_import_export_csv-csv-columns
  input: For a metatag_import_export_csv import file, how must each row identify the entity it updates,
    and which column is mandatory for the meta tags to be saved on?
  criteria: Each row identifies the entity by either entity_type + entity_id, or by path_alias. The field_machine_name
    column (the machine name of the entity's Metatag field) is mandatory. An optional language column
    targets a translation.
  bundle: metatag_import_export_csv
  rubric_ref: rubric/metatag_import_export_csv_metatag_import_export_csv_csv_columns@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: metatag_import_export_csv-blank-vs-empty
  input: In a metatag_import_export_csv import, what is the difference between leaving a tag's cell empty
    and putting the value _blank in it?
  criteria: An empty cell leaves that tag's current value unchanged; the literal value _blank explicitly
    sets the tag to empty (clears it). Values equal to what Metatag would already generate are skipped.
  bundle: metatag_import_export_csv
  rubric_ref: rubric/metatag_import_export_csv_metatag_import_export_csv_blank_vs_empty@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: metatag_import_export_csv-who-imports
  input: On this Drupal site, which role is allowed to import metatags via CSV (i.e. holds the metatag_import_export_csv
    upload permission)? Inspect the live role configuration.
  criteria: The mie_importer role holds the 'metatag import export csv upload' permission (mie_exporter
    instead holds the download permission).
  bundle: metatag_import_export_csv
  rubric_ref: rubric/metatag_import_export_csv_metatag_import_export_csv_who_imports@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/metatag_import_export_csv-roles-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/metatag_import_export_csv-roles-cleanup.sh
- id: metatag_import_export_csv-who-exports
  input: On this site, which role can export metatags to CSV (holds the metatag_import_export_csv download
    permission)? Inspect the live role configuration.
  criteria: The mie_exporter role holds the 'metatag import export csv download' permission.
  bundle: metatag_import_export_csv
  rubric_ref: rubric/metatag_import_export_csv_metatag_import_export_csv_who_exports@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/metatag_import_export_csv-roles-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/metatag_import_export_csv-roles-cleanup.sh
- id: metatag_import_export_csv-grant-import
  input: On this Drupal site there is a role 'mie_role'. Grant it permission to import metatags via CSV
    using the metatag_import_export_csv module. Apply the change to the live site.
  criteria: Grant the 'metatag import export csv upload' permission to the mie_role role and save.
  bundle: metatag_import_export_csv
  rubric_ref: rubric/metatag_import_export_csv_metatag_import_export_csv_grant_import@1.0
  tags:
