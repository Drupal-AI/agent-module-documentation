metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: menu_block_title
  version: 2.0.x
  note: 'Menu Block Title adds one checkbox (''Block title as menu link parent'') to menu-based blocks,
    stored as a third-party setting on the block config entity: block.block.<id> -> third_party_settings.menu_block_title.modify_title:
    true. It has no configure route, no permissions, no services and no Drush. hook_block_view_alter registers
    a pre_render that relabels the block title to a link to the active menu item''s parent. Medium/hard
    cases are grounded in real block config entities (system_menu_block:* derivatives) created/inspected
    on the live site; all local.'
questions:
- id: menu_block_title-where-stored
  input: The menu_block_title module has no settings page. How do I turn on its 'Block title as menu link
    parent' behaviour for a menu block, and where is that choice stored in configuration?
  criteria: 'There is no configure route. You tick ''Block title as menu link parent'' on the block''s
    config form; it is stored as a third-party setting on the block config entity: block.block.<id> ->
    third_party_settings.menu_block_title.modify_title: true.'
  bundle: menu_block_title
  rubric_ref: rubric/menu_block_title_menu_block_title_where_stored@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: menu_block_title-which-blocks
  input: On which blocks does the menu_block_title checkbox appear, and what does the module do at render
    time when it is enabled?
  criteria: The checkbox appears only on menu-based blocks (those whose form has settings[menu_levels])
    - core system_menu_block:* derivatives and the contrib menu_block module. When enabled, hook_block_view_alter
    adds a pre_render that replaces the block title with a link to the active menu item's parent, plus
    a route.menu_active_trails cache context.
  bundle: menu_block_title
  rubric_ref: rubric/menu_block_title_menu_block_title_which_blocks@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: menu_block_title-title-visible
  input: A site builder enabled 'Block title as menu link parent' on a menu block using menu_block_title
    but nothing changes. What two conditions must hold for the modified title to show, and what does the
    title become?
  criteria: The block must be a menu block and its title must be displayed (label_display visible, not
    hidden). When both hold, the title becomes a link render array pointing to the active trail item's
    parent.
  bundle: menu_block_title
  rubric_ref: rubric/menu_block_title_menu_block_title_title_visible@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: menu_block_title-known-block
  input: On this Drupal site, one menu block has the menu_block_title 'Block title as menu link parent'
    option enabled. Inspect the live block configuration and give the machine name (block id) of that
    block.
  criteria: 'The block is mbt_known: block.block.mbt_known has third_party_settings.menu_block_title.modify_title:
    true.'
  bundle: menu_block_title
  rubric_ref: rubric/menu_block_title_menu_block_title_known_block@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/menu_block_title-known-block-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/menu_block_title-known-block-cleanup.sh
- id: menu_block_title-enabled-vs-not
  input: This site has two menu blocks, mbt_on and mbt_off, both created by the menu_block_title workflow.
    Exactly one has 'Block title as menu link parent' enabled. Inspect the live configuration and state
    which block has it enabled.
  criteria: 'mbt_on has it enabled (third_party_settings.menu_block_title.modify_title: true); mbt_off
    does not.'
  bundle: menu_block_title
  rubric_ref: rubric/menu_block_title_menu_block_title_enabled_vs_not@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/menu_block_title-enabled-vs-not-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/menu_block_title-enabled-vs-not-cleanup.sh
- id: menu_block_title-enable-on-block
  input: This site has a menu block with the config id mbt_task (a system_menu_block:main block). Using
    the menu_block_title module, enable the 'Block title as menu link parent' option on it and apply the
    change to the live site.
  criteria: block.block.mbt_task has third_party_settings.menu_block_title.modify_title === true (e.g.
    $block->setThirdPartySetting('menu_block_title','modify_title',TRUE)->save()).
  bundle: menu_block_title
  rubric_ref: rubric/menu_block_title_menu_block_title_enable_on_block@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/menu_block_title-enable-on-block-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/menu_block_title-enable-on-block-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/menu_block_title-enable-on-block-verify.sh
- id: menu_block_title-create-block
  input: On my Drupal site I want a sidebar navigation block for the Main navigation menu, starting at
    the second level, whose heading links back to the current section's parent page (using the menu_block_title
    module). Create a menu block with the id mbt_built for the main menu, showing its title, and enable
    that parent-title behaviour. Save it on the site.
  criteria: A block config entity block.block.mbt_built exists with a menu plugin (system_menu_block:main
    or a menu_block derivative), label_display visible, and third_party_settings.menu_block_title.modify_title
    === true.
  bundle: menu_block_title
  rubric_ref: rubric/menu_block_title_menu_block_title_create_block@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: site-owner
    reset: agent-module-documentation/evaluation/verify/menu_block_title-create-block-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/menu_block_title-create-block-reset.sh
    verify: agent-module-documentation/evaluation/verify/menu_block_title-create-block-verify.sh
