metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: metatag_webform
  version: 1.0.x
  note: Metatag Webform adds per-webform meta tags. It has no global configure route, no permissions of
    its own (access is Webform 'update' via _entity_access), no Drush, no services, and no config schema
    of its own. The Metatags tab (route metatag_webform.settings_form at /admin/structure/webform/manage/{webform}/metatags)
    saves a metatag_defaults config entity with id webform.<webform_id> (config metatag.metatag_defaults.webform.<id>).
    metatag_webform_metatags_alter() merges those tags on the webform canonical route; hook_entity_delete/hook_uninstall
    clean up webform.* defaults. Medium/hard cases are grounded in real webform.<id> metatag_defaults
    entities on namespaced mtwf_* webforms.
questions:
- id: metatag_webform-where-ui
  input: I installed the Metatag Webform module. Where in the admin UI do I set the meta tags for a specific
    webform, and does it add a site-wide settings page?
  criteria: There is no global settings page. Open a webform's Settings, then the Metatags secondary tab
    at /admin/structure/webform/manage/<webform_id>/metatags (route metatag_webform.settings_form), fill
    in the Metatag fields and Save.
  bundle: metatag_webform
  rubric_ref: rubric/metatag_webform_metatag_webform_where_ui@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: metatag_webform-storage
  input: Where does the Metatag Webform module store the meta tags I enter for a webform? Name the config
    entity type and the id/config-name pattern.
  criteria: It stores them as a metatag_defaults config entity with id webform.<webform_id> (config name
    metatag.metatag_defaults.webform.<webform_id>), reusing Metatag's own defaults entity type and schema.
  bundle: metatag_webform
  rubric_ref: rubric/metatag_webform_metatag_webform_storage@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: metatag_webform-output-mechanism
  input: How does the Metatag Webform module get a webform's custom meta tags onto the rendered page,
    and what happens to those tags if I delete the webform?
  criteria: metatag_webform_metatags_alter() runs on the webform canonical route (entity.webform.canonical);
    if an enabled webform.<id> metatag_defaults exists it merges its tags into the page metatags. Deleting
    the webform removes the webform.<id> defaults via hook_entity_delete(), and uninstalling the module
    deletes all webform.* defaults.
  bundle: metatag_webform
  rubric_ref: rubric/metatag_webform_metatag_webform_output_mechanism@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: metatag_webform-read-title
  input: On this site there is a webform 'mtwf_known' that has custom meta tags configured via Metatag
    Webform. Inspect the live configuration and tell me the exact Page title meta tag value set for it.
  criteria: The title tag is 'Contact Acme Support', stored in metatag.metatag_defaults.webform.mtwf_known
    under tags.title.
  bundle: metatag_webform
  rubric_ref: rubric/metatag_webform_metatag_webform_read_title@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/metatag_webform-known-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/metatag_webform-known-cleanup.sh
- id: metatag_webform-read-status
  input: The webform 'mtwf_stat' has a Metatag Webform metatag_defaults entity. Inspect the live configuration
    and state whether its metatags are currently enabled (active) or disabled.
  criteria: 'They are disabled: metatag.metatag_defaults.webform.mtwf_stat has status: false, so its tags
    are not merged onto the webform page.'
  bundle: metatag_webform
  rubric_ref: rubric/metatag_webform_metatag_webform_read_status@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/metatag_webform-status-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/metatag_webform-status-cleanup.sh
- id: metatag_webform-set-description
  input: On this Drupal site there is a webform with machine id 'mtwf_task'. Using the Metatag Webform
    module, set a meta Description for this webform that mentions 'Acme', and apply it to the live site
    so it would be output on the webform's page.
  criteria: A metatag_defaults entity webform.mtwf_task exists with a non-empty description tag containing
    'Acme' (config metatag.metatag_defaults.webform.mtwf_task, tags.description). E.g. MetatagDefaults::create(['id'=>'webform.mtwf_task',...])->set('tags',['description'=>'...Acme...'])->setStatus(TRUE)->save().
  bundle: metatag_webform
  rubric_ref: rubric/metatag_webform_metatag_webform_set_description@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/metatag_webform-set-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/metatag_webform-set-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/metatag_webform-set-verify.sh
- id: metatag_webform-set-title
  input: I have a webform (machine name mtwf_title) and I want its browser/search title to read something
    specific instead of the default. Using the Metatag Webform feature, give this webform its own Page
    title meta tag and make sure the setting is turned on. Save it to the live site.
  criteria: An enabled metatag_defaults entity webform.mtwf_title exists with a non-empty title tag (config
    metatag.metatag_defaults.webform.mtwf_title, status true, tags.title set).
  bundle: metatag_webform
  rubric_ref: rubric/metatag_webform_metatag_webform_set_title@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: site-owner
    reset: agent-module-documentation/evaluation/verify/metatag_webform-title-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/metatag_webform-title-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/metatag_webform-title-verify.sh
