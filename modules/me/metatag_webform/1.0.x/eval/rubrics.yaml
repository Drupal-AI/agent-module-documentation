rubrics:
- id: metatag_webform_metatag_webform_where_ui
  version: '1.0'
  applicable_bundles:
  - metatag_webform
  checks:
  - kind: must_contain_any
    values:
    - manage/{webform}/metatags
    - /metatags
    - Metatags tab
    - Settings
    - webform
  scoring:
    combine: all_pass
- id: metatag_webform_metatag_webform_storage
  version: '1.0'
  applicable_bundles:
  - metatag_webform
  checks:
  - kind: must_contain_any
    values:
    - metatag_defaults
    - webform.
    - metatag.metatag_defaults.webform
  scoring:
    combine: all_pass
- id: metatag_webform_metatag_webform_output_mechanism
  version: '1.0'
  applicable_bundles:
  - metatag_webform
  checks:
  - kind: must_contain_any
    values:
    - hook_metatags_alter
    - metatags_alter
    - canonical
    - entity_delete
    - deleted
  scoring:
    combine: all_pass
- id: metatag_webform_metatag_webform_read_title
  version: '1.0'
  applicable_bundles:
  - metatag_webform
  checks:
  - kind: must_contain_any
    values:
    - Contact Acme Support
  scoring:
    combine: all_pass
- id: metatag_webform_metatag_webform_read_status
  version: '1.0'
  applicable_bundles:
  - metatag_webform
  checks:
  - kind: must_contain_any
    values:
    - disabled
    - 'false'
    - not enabled
    - status is false
    - inactive
  scoring:
    combine: all_pass
- id: metatag_webform_metatag_webform_set_description
  version: '1.0'
  applicable_bundles:
  - metatag_webform
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
- id: metatag_webform_metatag_webform_set_title
  version: '1.0'
  applicable_bundles:
  - metatag_webform
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
