metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: message_subscribe
  version: 2.1.x
  note: 'Message Subscribe is a subscription API over Flag + Message + Message Notify. Config message_subscribe.settings:
    use_queue(false), notify_own_actions(false), flag_prefix(''subscribe''), debug_mode(false), default_notifiers([email]),
    range(100). A flag is a subscription flag iff its id starts with flag_prefix+''_''; ships optional
    disabled flags subscribe_node/subscribe_term/subscribe_user. Service message_subscribe.subscribers
    (Subscribers): sendMessage(), getSubscribers(), getBasicContext(), getFlags(); DeliveryCandidate value
    object; queue worker plugin ''message_subscribe''. Hooks: hook_message_subscribe_get_subscribers(_alter),
    hook_message_subscribe_message_alter. Medium cases read back known config; hard cases set config or
    enable the subscribe_node flag and verify live state. subscribe_node/term/user flags exist on this
    site (disabled by default).'
questions:
- id: message_subscribe-flag-convention
  input: In the Drupal Message Subscribe module, how does it decide which Flag flags represent subscriptions,
    and what are the default subscription flags it ships?
  criteria: Any Flag whose machine name starts with the configured flag_prefix plus '_' (default 'subscribe_')
    is treated as a subscription flag (Subscribers::getFlags()). It ships optional, disabled-by-default
    flags subscribe_node, subscribe_term, subscribe_user (and subscribe_og when Organic Groups is present).
  bundle: message_subscribe
  rubric_ref: rubric/message_subscribe_message_subscribe_flag_convention@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: message_subscribe-send-api
  input: I want my custom module to notify subscribers when a node is published using Message Subscribe.
    Which service and method do I call, and what do I pass it?
  criteria: Build a Message entity, then call \Drupal::service('message_subscribe.subscribers')->sendMessage($entity,
    $message). The service finds subscribers from the subscribe_* flaggings, filters them, and delivers
    a per-user notification via Message Notify (optionally queued).
  bundle: message_subscribe
  rubric_ref: rubric/message_subscribe_message_subscribe_send_api@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: message_subscribe-queue-setting
  input: Message Subscribe can send notifications immediately or defer them for scalability. Which setting
    makes it defer sending, and how are the deferred messages processed?
  criteria: Enable the use_queue setting. sendMessage() then enqueues the send on the 'message_subscribe'
    queue instead of sending inline, and the message_subscribe queue worker drains it on cron (in batches
    of 'range' subscribers).
  bundle: message_subscribe
  rubric_ref: rubric/message_subscribe_message_subscribe_queue_setting@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: message_subscribe-range-live
  input: On this Drupal site, what is the maximum number of subscribers Message Subscribe fetches per
    batch? Inspect the live message_subscribe configuration and give the number.
  criteria: 250. The live message_subscribe.settings config has range set to 250 (maximum subscribers
    per batch).
  bundle: message_subscribe
  rubric_ref: rubric/message_subscribe_message_subscribe_range_live@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/message_subscribe-range-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/message_subscribe-range-cleanup.sh
- id: message_subscribe-prefix-live
  input: On this Drupal site, which flag-name prefix does Message Subscribe currently use to identify
    subscription flags? Inspect the live message_subscribe configuration and give the exact prefix.
  criteria: follow. The live message_subscribe.settings config has flag_prefix set to 'follow', so flags
    named follow_* are treated as subscription flags instead of the default subscribe_*.
  bundle: message_subscribe
  rubric_ref: rubric/message_subscribe_message_subscribe_prefix_live@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/message_subscribe-prefix-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/message_subscribe-prefix-cleanup.sh
- id: message_subscribe-configure-queue
  input: On this Drupal site, configure Message Subscribe to process notifications through the queue instead
    of sending them inline, and cap each batch at 50 subscribers. Apply the change to the live message_subscribe
    settings.
  criteria: Set message_subscribe.settings use_queue to true and range to 50 (via /admin/config/message/message-subscribe
    or `drush config:set message_subscribe.settings use_queue 1` and `drush config:set message_subscribe.settings
    range 50`).
  bundle: message_subscribe
  rubric_ref: rubric/message_subscribe_message_subscribe_configure_queue@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/message_subscribe-queue-batch-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/message_subscribe-queue-batch-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/message_subscribe-queue-batch-verify.sh
- id: message_subscribe-enable-content-flag
  input: I want visitors to be able to subscribe to content on my Drupal site so they get notified about
    it. Message Subscribe is installed and it comes with a content-subscription flag, but nothing shows
    up. Please turn on the flag that lets people subscribe to content.
  criteria: Enable the subscribe_node flag (Structure > Flags, or `drush php:eval` loading the 'subscribe_node'
    flag and calling ->enable()->save()). Once enabled, its id starts with the subscribe_ prefix so Message
    Subscribe treats it as a content subscription flag.
  bundle: message_subscribe
  rubric_ref: rubric/message_subscribe_message_subscribe_enable_content_flag@1.0
  tags:
  - mode:execution
  - difficulty:hard
