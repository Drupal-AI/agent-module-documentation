metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: message_subscribe_ui
  version: 2.1.x
  note: 'Message Subscribe UI is the end-user front end for message_subscribe: a Subscriptions local task
    at /user/{user}/message-subscribe (SubscriptionController) with one sub-tab per ENABLED subscribe_*
    flag (deriver MessageSubscribeUiLocalTask), a ''Manage subscriptions'' block (plugin message_subscribe_ui_block),
    and it DEFINES the ''administer message subscribe'' permission the base settings route requires. Which
    View a flag''s listing uses is the flag third-party setting message_subscribe_ui.view_name (default
    <prefix>_<entity_type>:default; on this site message_subscribe_email has repointed them to *_email
    variants). Ships views subscribe_node/subscribe_taxonomy_term/subscribe_user. No settings form (configure=null).
    Medium cases read back live flag state; hard cases place the block / set a flag''s view_name and verify
    live config.'
questions:
- id: message_subscribe_ui-tab
  input: With Message Subscribe UI enabled, where can a user see and manage the things they are subscribed
    to on a Drupal site?
  criteria: On a 'Subscriptions' local task on the user profile at /user/{user}/message-subscribe (route
    message_subscribe_ui.tab, SubscriptionController), with one sub-tab per enabled subscribe_* flag,
    each showing a View of that user's flagged entities.
  bundle: message_subscribe_ui
  rubric_ref: rubric/message_subscribe_ui_message_subscribe_ui_tab@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: message_subscribe_ui-permission
  input: The Message Subscribe base module's settings form requires a permission, but that permission
    is actually defined by a submodule. Which submodule defines it and what is the permission called?
  criteria: The message_subscribe_ui submodule defines the 'administer message subscribe' permission (message_subscribe_ui.permissions.yml).
    The base module's /admin/config/message/message-subscribe route requires it, so you need message_subscribe_ui
    enabled to grant it to roles.
  bundle: message_subscribe_ui
  rubric_ref: rubric/message_subscribe_ui_message_subscribe_ui_permission@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: message_subscribe_ui-view-setting
  input: In Message Subscribe UI, how do you control which View is used to render the subscription listing
    for a particular flag?
  criteria: 'It is stored as a third-party setting on the flag: message_subscribe_ui.view_name, formatted
    view_id:display_id (default <flag_prefix>_<entity_type>:default). A ''View to use for the Message
    Subscription UI'' select is added to each subscription flag''s edit form.'
  bundle: message_subscribe_ui
  rubric_ref: rubric/message_subscribe_ui_message_subscribe_ui_view_setting@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: message_subscribe_ui-term-view-live
  input: On this Drupal site, which View (view_id:display_id) is configured to render the subscription
    listing for the subscribe_term flag? Inspect the live flag configuration and give the exact value.
  criteria: subscribe_taxonomy_term:default. The subscribe_term flag's message_subscribe_ui.view_name
    third-party setting is set to subscribe_taxonomy_term:default.
  bundle: message_subscribe_ui
  rubric_ref: rubric/message_subscribe_ui_message_subscribe_ui_term_view_live@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/msui-term-view-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/msui-term-view-cleanup.sh
- id: message_subscribe_ui-enabled-flag-live
  input: On this Drupal site, which Message Subscribe subscription flag is currently enabled (and would
    therefore get its own tab in the user Subscriptions UI)? Inspect the live flag configuration and name
    it.
  criteria: subscribe_user. It is the only enabled subscribe_* flag on the site (subscribe_node and subscribe_term
    are disabled), so it drives a Subscriptions sub-tab.
  bundle: message_subscribe_ui
  rubric_ref: rubric/message_subscribe_ui_message_subscribe_ui_enabled_flag_live@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/msui-enabled-flag-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/msui-enabled-flag-cleanup.sh
- id: message_subscribe_ui-place-block
  input: I want a widget on my pages that lets logged-in visitors subscribe to what they're looking at.
    Message Subscribe UI provides a 'Manage subscriptions' block for this. Please place it on my site
    so it can appear.
  criteria: 'Place the ''Manage subscriptions'' block (plugin message_subscribe_ui_block) into a region
    of the active theme -- via Structure > Block layout or a block.block.* config entity with plugin:
    message_subscribe_ui_block and status: true.'
  bundle: message_subscribe_ui
  rubric_ref: rubric/message_subscribe_ui_message_subscribe_ui_place_block@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: site-owner
    reset: agent-module-documentation/evaluation/verify/msui-place-block-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/msui-place-block-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/msui-place-block-verify.sh
- id: message_subscribe_ui-set-flag-view
  input: On this Drupal site, configure the subscribe_node flag so its Message Subscribe UI subscription
    listing uses the base 'subscribe_node' view (display 'default') instead of any email variant. Apply
    the change to the live flag.
  criteria: Set the subscribe_node flag's third-party setting message_subscribe_ui.view_name to 'subscribe_node:default'
    (via the flag edit form's 'View to use' select, or setThirdPartySetting('message_subscribe_ui','view_name','subscribe_node:default')->save()).
  bundle: message_subscribe_ui
  rubric_ref: rubric/message_subscribe_ui_message_subscribe_ui_set_flag_view@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/msui-node-view-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/msui-node-view-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/msui-node-view-verify.sh
