metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: message_subscribe_email
  version: 2.1.x
  note: Message Subscribe Email gates the email notifier per subscription. It ships email_* flags paired
    to subscribe_* flags (email_node/email_term/email_user), a boolean user field message_subscribe_email
    ('Email subscriptions', default on), config message_subscribe_email.settings:flag_prefix (default
    'email', has schema), a FlagEvents subscriber that auto-flags the matching email_* flag when the user
    subscribes (if their field is on), hook_message_subscribe_get_subscribers_alter() that adds/removes
    the 'email' notifier based on the email_* flagging, hook_flag_action_access() forbidding an email_*
    flag without the paired subscribe_* flag, and message_subscribe_email.manager::getFlags(). On install
    it repoints the UI subscription views to *_email variants. Requires message_subscribe_ui. Medium cases
    read back live config/flags; hard cases enable an email flag / repoint a view and verify live state.
questions:
- id: message_subscribe_email-how
  input: How does the Message Subscribe Email submodule decide which of a user's subscriptions actually
    send an email, rather than emailing about everything they subscribed to?
  criteria: It adds a parallel set of email_* flags (email_node, email_term, email_user) paired to the
    subscribe_* flags. Only subscriptions that also hold the matching email_* flag get the 'email' notifier;
    hook_message_subscribe_get_subscribers_alter() adds the email notifier for those users and removes
    it for the rest.
  bundle: message_subscribe_email
  rubric_ref: rubric/message_subscribe_email_message_subscribe_email_how@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: message_subscribe_email-user-field
  input: In Message Subscribe Email, what controls whether a user's new subscriptions are set to email
    them by default?
  criteria: A boolean field on the user account, machine name message_subscribe_email, labelled 'Email
    subscriptions' (default on). When it is on, the FlagEvents subscriber auto-adds the matching email_*
    flag whenever the user subscribes; when off, subscribing does not email-flag the item.
  bundle: message_subscribe_email
  rubric_ref: rubric/message_subscribe_email_message_subscribe_email_user_field@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: message_subscribe_email-alter-hook
  input: Which Message Subscribe hook does the email submodule implement to make sure only email subscribers
    get the email notifier, and what does it do to the others?
  criteria: hook_message_subscribe_get_subscribers_alter(). It looks up which recipients hold a relevant
    email_* flag for the context, adds the 'email' notifier to those recipients (addNotifier('email'))
    and removes it from everyone else (removeNotifier('email')).
  bundle: message_subscribe_email
  rubric_ref: rubric/message_subscribe_email_message_subscribe_email_alter_hook@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: message_subscribe_email-prefix-live
  input: On this Drupal site, which flag-name prefix does Message Subscribe Email currently use to identify
    its email flags? Inspect the live configuration and give the exact prefix.
  criteria: notify. The live message_subscribe_email.settings config has flag_prefix set to 'notify' (so
    it would look for notify_* email flags instead of the default email_*).
  bundle: message_subscribe_email
  rubric_ref: rubric/message_subscribe_email_message_subscribe_email_prefix_live@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/msemail-prefix-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/msemail-prefix-cleanup.sh
- id: message_subscribe_email-enabled-flag-live
  input: On this Drupal site, which Message Subscribe Email flag (email_*) is currently enabled? Inspect
    the live flag configuration and name it.
  criteria: email_term. It is the only enabled email_* flag on the site (email_node and email_user are
    disabled).
  bundle: message_subscribe_email
  rubric_ref: rubric/message_subscribe_email_message_subscribe_email_enabled_flag_live@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/msemail-enabled-flag-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/msemail-enabled-flag-cleanup.sh
- id: message_subscribe_email-enable-node-flag
  input: On this Drupal site, enable the Message Subscribe Email flag that lets users opt into email notifications
    for content (node) subscriptions. Apply the change to the live site.
  criteria: Enable the email_node flag (Structure > Flags, or load the 'email_node' flag and call ->enable()->save()).
    It is the email_* partner of subscribe_node, so email-flagging content becomes possible.
  bundle: message_subscribe_email
  rubric_ref: rubric/message_subscribe_email_message_subscribe_email_enable_node_flag@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/msemail-enable-node-flag-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/msemail-enable-node-flag-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/msemail-enable-node-flag-verify.sh
- id: message_subscribe_email-emailview
  input: On this Drupal site, make the subscribe_node subscription listing in the Subscriptions UI use
    the email-aware view that Message Subscribe Email provides (the one that shows the email toggle),
    i.e. subscribe_node_email (display default). Apply the change to the live flag.
  criteria: Set the subscribe_node flag's third-party setting message_subscribe_ui.view_name to 'subscribe_node_email:default'
    (this is what message_subscribe_email does on install). Via the flag edit form's 'View to use' select,
    or setThirdPartySetting('message_subscribe_ui','view_name','subscribe_node_email:default')->save().
  bundle: message_subscribe_email
  rubric_ref: rubric/message_subscribe_email_message_subscribe_email_emailview@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/msemail-emailview-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/msemail-emailview-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/msemail-emailview-verify.sh
