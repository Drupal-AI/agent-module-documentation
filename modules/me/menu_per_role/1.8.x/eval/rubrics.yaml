rubrics:
- id: menu_per_role_mpr_field_names
  version: '1.0'
  applicable_bundles:
  - menu_per_role
  checks:
  - kind: must_contain_any
    values:
    - menu_per_role__show_role
    - menu_per_role__hide_role
    - menu_link_content
  scoring:
    combine: all_pass
- id: menu_per_role_mpr_settings_keys
  version: '1.0'
  applicable_bundles:
  - menu_per_role
  checks:
  - kind: must_contain_any
    values:
    - menu_per_role.settings
  scoring:
    combine: all_pass
- id: menu_per_role_mpr_admin_route
  version: '1.0'
  applicable_bundles:
  - menu_per_role
  checks:
  - kind: must_contain_any
    values:
    - /admin/config/system/menu_per_role
    - menu_per_role.settings
  scoring:
    combine: all_pass
- id: menu_per_role_mpr_permissions
  version: '1.0'
  applicable_bundles:
  - menu_per_role
  checks:
  - kind: must_contain_any
    values:
    - administer menu_per_role
    - bypass menu_per_role access front
    - bypass menu_per_role access admin
  scoring:
    combine: all_pass
- id: menu_per_role_mpr_scope_limitation
  version: '1.0'
  applicable_bundles:
  - menu_per_role
  checks:
  - kind: must_contain_any
    values:
    - menu_link_content
    - content menu link
    - cannot
    - only
  scoring:
    combine: all_pass
- id: menu_per_role_mpr_access_semantics
  version: '1.0'
  applicable_bundles:
  - menu_per_role
  checks:
  - kind: must_contain_any
    values:
    - forbidden
    - empty
    - default access
    - intersect
  scoring:
    combine: all_pass
- id: menu_per_role_mpr_admin_bypass
  version: '1.0'
  applicable_bundles:
  - menu_per_role
  checks:
  - kind: must_contain_any
    values:
    - admin_bypass_access_front
    - admin_bypass_access_admin
    - config
  scoring:
    combine: all_pass
- id: menu_per_role_mpr_set_field_programmatically
  version: '1.0'
  applicable_bundles:
  - menu_per_role
  checks:
  - kind: must_contain_any
    values:
    - menu_per_role__show_role
    - target_id
    - MenuLinkContent
  scoring:
    combine: all_pass
