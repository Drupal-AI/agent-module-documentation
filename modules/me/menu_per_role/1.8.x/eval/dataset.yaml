metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: menu_per_role
  version: 1.8.x
  note: Menu Per Role has a small settings object, three permissions, two base fields on menu_link_content,
    and a tree-manipulator decorator, but no drush commands, no plugin type, and no invited hooks. Cases
    are `recipe` (response-graded) probing field machine names, settings keys/defaults, permissions, the
    admin route, access semantics, and scope limitations rather than live site state.
questions:
- id: mpr-field-names
  input: In the menu_per_role module on Drupal 11, which two fields does it add to menu links to control
    per-role visibility, and to which entity type are they added?
  criteria: 'It adds two entity_reference (target user_role) base fields to `menu_link_content`: `menu_per_role__show_role`
    (roles able to see the link) and `menu_per_role__hide_role` (roles not able to see it).'
  bundle: menu_per_role
  rubric_ref: rubric/menu_per_role_mpr_field_names@1.0
  tags:
  - mode:recipe
- id: mpr-settings-keys
  input: What config object holds menu_per_role settings, and what are its four keys?
  criteria: Config object `menu_per_role.settings` with keys `hide_show` (int), `hide_on_content` (int),
    `admin_bypass_access_front` (bool), `admin_bypass_access_admin` (bool).
  bundle: menu_per_role
  rubric_ref: rubric/menu_per_role_mpr_settings_keys@1.0
  tags:
  - mode:recipe
- id: mpr-admin-route
  input: Where is the Menu Per Role settings form in Drupal admin and what is its route name?
  criteria: At `/admin/config/system/menu_per_role`, route `menu_per_role.settings`, gated by the `administer
    menu_per_role` permission.
  bundle: menu_per_role
  rubric_ref: rubric/menu_per_role_mpr_admin_route@1.0
  tags:
  - mode:recipe
- id: mpr-permissions
  input: List the three permissions defined by the menu_per_role module and what each does.
  criteria: '`administer menu_per_role` (access the settings form), `bypass menu_per_role access front`
    (non-admin sees all links in front context), `bypass menu_per_role access admin` (non-admin sees all
    links in admin context).'
  bundle: menu_per_role
  rubric_ref: rubric/menu_per_role_mpr_permissions@1.0
  tags:
  - mode:recipe
- id: mpr-scope-limitation
  input: Can menu_per_role restrict a menu link that comes from a Views display or a module's *.links.menu.yml
    file?
  criteria: No. It only acts on content menu links (the `menu_link_content` content entity). Config-defined
    links (Views) and `*.links.menu.yml` links cannot be managed.
  bundle: menu_per_role
  rubric_ref: rubric/menu_per_role_mpr_scope_limitation@1.0
  tags:
  - mode:recipe
- id: mpr-access-semantics
  input: In menu_per_role, if I set some roles in the show-role field and some in the hide-role field
    on a link, when is the link hidden? And what happens if both fields are empty?
  criteria: The link is forbidden if a show-role set exists and the account has none of those roles, or
    if the account has any hide-role. If both fields are empty the link keeps its default access (no restriction
    added). The module can only further restrict, never grant.
  bundle: menu_per_role
  rubric_ref: rubric/menu_per_role_mpr_access_semantics@1.0
  tags:
  - mode:recipe
- id: mpr-admin-bypass
  input: Do admin users (UID 1 or a role flagged is_admin) obey the front/admin bypass permissions in
    menu_per_role, and what are the default bypass settings?
  criteria: 'No. Admin users are governed by config, not the bypass permissions: `admin_bypass_access_front`
    (default false) and `admin_bypass_access_admin` (default true). Non-admins are governed by the two
    bypass permissions.'
  bundle: menu_per_role
  rubric_ref: rubric/menu_per_role_mpr_admin_bypass@1.0
  tags:
  - mode:recipe
- id: mpr-set-field-programmatically
  input: In PHP on Drupal 11, how do I create a MenuLinkContent link visible only to the 'member' role
    using menu_per_role's field?
  criteria: Set `menu_per_role__show_role` to `[['target_id' => 'member']]` when creating/saving the `MenuLinkContent`
    entity (the field is an unlimited-cardinality user_role reference).
  bundle: menu_per_role
  rubric_ref: rubric/menu_per_role_mpr_set_field_programmatically@1.0
  tags:
  - mode:recipe
