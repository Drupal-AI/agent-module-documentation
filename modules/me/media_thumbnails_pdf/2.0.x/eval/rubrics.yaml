rubrics:
- id: media_thumbnails_pdf_media_thumbnails_pdf_plugin_mime
  version: '1.0'
  applicable_bundles:
  - media_thumbnails_pdf
  checks:
  - kind: must_contain_any
    values:
    - media_thumbnail_pdf
    - application/pdf
  scoring:
    combine: all_pass
- id: media_thumbnails_pdf_media_thumbnails_pdf_requirements
  version: '1.0'
  applicable_bundles:
  - media_thumbnails_pdf
  checks:
  - kind: must_contain_any
    values:
    - imagick
    - ImageMagick
    - Ghostscript
  scoring:
    combine: all_pass
- id: media_thumbnails_pdf_media_thumbnails_pdf_width_format
  version: '1.0'
  applicable_bundles:
  - media_thumbnails_pdf
  checks:
  - kind: must_contain_any
    values:
    - media_thumbnails.settings
    - width
    - '500'
    - jpg
  scoring:
    combine: all_pass
- id: media_thumbnails_pdf_media_thumbnails_pdf_width_value
  version: '1.0'
  applicable_bundles:
  - media_thumbnails_pdf
  checks:
  - kind: must_contain_any
    values:
    - '321'
  scoring:
    combine: all_pass
- id: media_thumbnails_pdf_media_thumbnails_pdf_bgcolor_value
  version: '1.0'
  applicable_bundles:
  - media_thumbnails_pdf
  checks:
  - kind: must_contain_any
    values:
    - '#123456'
    - '123456'
  scoring:
    combine: all_pass
- id: media_thumbnails_pdf_media_thumbnails_pdf_set_width
  version: '1.0'
  applicable_bundles:
  - media_thumbnails_pdf
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
- id: media_thumbnails_pdf_media_thumbnails_pdf_generate_thumbnail
  version: '1.0'
  applicable_bundles:
  - media_thumbnails_pdf
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
