metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: media_thumbnails_svg
  version: 2.0.x
  note: Media Thumbnails SVG implements a single MediaThumbnail plugin (id media_thumbnail_svg) for MIME
    image/svg + image/svg+xml, rasterizing SVG media to PNG thumbnails via GraphicsMagick -> ImageMagick
    -> GD (meyfa/php-svg). It has NO config of its own (configure=null); output width/background are read
    from the PARENT media_thumbnails.settings config object (width, bgcolor_active, bgcolor_value) edited
    at /admin/config/media/thumbnails. Shipped defaults width=500, bgcolor_active=false, bgcolor_value=#eeeeee.
    Medium/hard cases are grounded in those keys of media_thumbnails.settings (the config this SVG plugin
    consumes); cleanup/reset restore the shipped defaults explicitly.
questions:
- id: media_thumbnails_svg-plugin-id
  input: How does media_thumbnails_svg plug into the Media Thumbnails framework? Give the plugin id and
    the MIME types it handles.
  criteria: It provides a MediaThumbnail plugin id=media_thumbnail_svg (class MediaThumbnailSVG) whose
    mime list is image/svg and image/svg+xml; Media Thumbnails calls its createThumbnail() to build a
    PNG.
  bundle: media_thumbnails_svg
  rubric_ref: rubric/media_thumbnails_svg_media_thumbnails_svg_plugin_id@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: media_thumbnails_svg-rasterizers
  input: media_thumbnails_svg converts SVG files to PNG thumbnails. Which rasterizers can it use, and
    in what priority order?
  criteria: It tries GraphicsMagick (gm, best quality) first, then ImageMagick (convert), then falls back
    to PHP GD using the meyfa/php-svg library (lowest quality, always available).
  bundle: media_thumbnails_svg
  rubric_ref: rubric/media_thumbnails_svg_media_thumbnails_svg_rasterizers@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: media_thumbnails_svg-where-config
  input: media_thumbnails_svg has no settings page of its own. Where do you set the thumbnail width and
    background color it uses, and in which config object are those values stored?
  criteria: 'The SVG plugin reads its output settings from the parent Media Thumbnails module: config
    object media_thumbnails.settings (keys width, bgcolor_active, bgcolor_value), edited at /admin/config/media/thumbnails.
    Defaults are width 500, bgcolor_active false, bgcolor_value #eeeeee.'
  bundle: media_thumbnails_svg
  rubric_ref: rubric/media_thumbnails_svg_media_thumbnails_svg_where_config@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: media_thumbnails_svg-known-width
  input: On this Drupal site, the Media Thumbnails width used for SVG thumbnails has been changed from
    its default. Inspect the live configuration and state the current thumbnail width.
  criteria: 'The width is 640: media_thumbnails.settings -> width = 640.'
  bundle: media_thumbnails_svg
  rubric_ref: rubric/media_thumbnails_svg_media_thumbnails_svg_known_width@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/media_thumbnails_svg-width-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/media_thumbnails_svg-restore-defaults.sh
- id: media_thumbnails_svg-known-bgcolor
  input: On this site a custom background color has been enabled for generated thumbnails. Inspect the
    live Media Thumbnails configuration and state the background color hex value in use.
  criteria: 'bgcolor_active is true and bgcolor_value is #123456 in media_thumbnails.settings.'
  bundle: media_thumbnails_svg
  rubric_ref: rubric/media_thumbnails_svg_media_thumbnails_svg_known_bgcolor@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/media_thumbnails_svg-bgcolor-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/media_thumbnails_svg-restore-defaults.sh
- id: media_thumbnails_svg-set-width
  input: Configure the Media Thumbnails settings that media_thumbnails_svg uses so that generated SVG
    thumbnails are 300 pixels wide. Apply the change to the live site.
  criteria: Set media_thumbnails.settings width = 300 (e.g. drush cset media_thumbnails.settings width
    300).
  bundle: media_thumbnails_svg
  rubric_ref: rubric/media_thumbnails_svg_media_thumbnails_svg_set_width@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/media_thumbnails_svg-restore-defaults.sh
    cleanup: agent-module-documentation/evaluation/verify/media_thumbnails_svg-restore-defaults.sh
    verify: agent-module-documentation/evaluation/verify/media_thumbnails_svg-set-width-verify.sh
- id: media_thumbnails_svg-enable-bg
  input: 'Enable a custom thumbnail background color of #ffffff for the thumbnails media_thumbnails_svg
    generates, and apply it to the live site.'
  criteria: 'Set media_thumbnails.settings bgcolor_active = true and bgcolor_value = #ffffff.'
  bundle: media_thumbnails_svg
  rubric_ref: rubric/media_thumbnails_svg_media_thumbnails_svg_enable_bg@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/media_thumbnails_svg-restore-defaults.sh
    cleanup: agent-module-documentation/evaluation/verify/media_thumbnails_svg-restore-defaults.sh
    verify: agent-module-documentation/evaluation/verify/media_thumbnails_svg-enable-bg-verify.sh
