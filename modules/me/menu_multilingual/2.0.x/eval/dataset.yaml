metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: menu_multilingual
  version: 2.0.x
  note: 'Menu Multilingual filters menu links in menu blocks by translation status for the current language.
    It adds two checkboxes to the config form of system_menu_block / menu_block instances, stored as third-party
    settings on the block config entity: block.block.<id>.third_party_settings.menu_multilingual.only_translated_labels
    and .only_translated_content (booleans). A #pre_render on the block runs the menu_multilingual.modifier
    service to drop untranslated links (and their children). No config route, no permissions, no Drush.
    Medium cases place a menu block with a known setting and read it back. Hard cases place a menu block
    with the setting OFF and require the agent to turn it ON, verified via getThirdPartySetting on the
    block config entity; reset sets it back to false so verify fails on empty state.'
questions:
- id: menu_multilingual-hide-untranslated-label
  input: Using the Menu Multilingual module, how do I make a menu block hide menu links whose label has
    not been translated into the current language, and what setting does that correspond to?
  criteria: 'Edit the menu block''s configuration and tick ''Hide menu items without translated label''.
    It is saved as the third-party setting only_translated_labels: true on the block config entity (block.block.<id>.third_party_settings.menu_multilingual).'
  bundle: menu_multilingual
  rubric_ref: rubric/menu_multilingual_menu_multilingual_hide_untranslated_label@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: menu_multilingual-supported-blocks
  input: Which kinds of blocks does the Menu Multilingual module add its multilingual filtering options
    to?
  criteria: Blocks whose plugin id is system_menu_block (core system menu blocks) or menu_block (the contrib
    Menu block module). Other block types are untouched.
  bundle: menu_multilingual
  rubric_ref: rubric/menu_multilingual_menu_multilingual_supported_blocks@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: menu_multilingual-children-filtered
  input: In Menu Multilingual, what happens to the child menu items of a menu link that gets filtered
    out for being untranslated?
  criteria: When a menu item is filtered away, all of its sub-menu items (children) are removed too. If
    a block ends up with no items it renders empty.
  bundle: menu_multilingual
  rubric_ref: rubric/menu_multilingual_menu_multilingual_children_filtered@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: menu_multilingual-known-labels-block
  input: 'A menu block with the id ''mm_eval_labels'' is placed on this site. Inspect its configuration
    and tell me which Menu Multilingual filtering it has enabled: hiding items without a translated label,
    without translated content, or both?'
  criteria: 'Only label filtering: block.block.mm_eval_labels has third_party_settings.menu_multilingual.only_translated_labels
    = true and only_translated_content = false (`drush cget block.block.mm_eval_labels third_party_settings.menu_multilingual`).'
  bundle: menu_multilingual
  rubric_ref: rubric/menu_multilingual_menu_multilingual_known_labels_block@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/menu_multilingual-labels-block-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/menu_multilingual-labels-block-cleanup.sh
- id: menu_multilingual-known-content-block
  input: There is a menu block 'mm_eval_content' on this site configured with Menu Multilingual. Look
    at its live configuration and state which multilingual option is turned on.
  criteria: 'Content filtering: block.block.mm_eval_content has third_party_settings.menu_multilingual.only_translated_content
    = true (and only_translated_labels = false).'
  bundle: menu_multilingual
  rubric_ref: rubric/menu_multilingual_menu_multilingual_known_content_block@1.0
  tags:
  - mode:introspection
  - difficulty:medium
