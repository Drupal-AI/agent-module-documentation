metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: menu_link_weight
  version: 1.0.x
  note: Menu Link Weight replaces the numeric menu-link 'weight' dropdown on the node edit form (and menu-link
    UI) with a drag-and-drop tabledrag widget; it hides core's weight select and injects a tabledrag table
    of siblings, recomputing weights across -50..50 on submit. Depends on menu_ui + node. Uses the core
    permission 'administer site configuration' (defines none of its own). Its only config is menu_link_weight.settings:menu_parent_form_selector,
    either 'default' or 'cshs'; the configure form is at /admin/config/user-interface/menu-link-weight
    (route menu_link_weight.settings). When set to 'cshs' AND the cshs module is installed, MenuLinkWeightServiceProvider
    swaps core's menu.parent_form_selector for CshsMenuParentFormSelector; a ConfigSubscriber invalidates
    the container when the setting changes. cshs is NOT installed on this site, so setting 'cshs' is safe
    (no service swap). Medium cases read back the configured selector; hard cases set the selector value,
    verified against menu_link_weight.settings.
questions:
- id: menu_link_weight-what
  input: What does the Drupal 'Menu Link Weight' module change about the menu settings on the node edit
    form?
  criteria: It hides core's numeric menu-link 'weight' dropdown and replaces it with a drag-and-drop tabledrag
    widget listing the parent's siblings, so editors order the item by dragging; the drag order is converted
    back into real menu-link weights on submit.
  bundle: menu_link_weight
  rubric_ref: rubric/menu_link_weight_menu_link_weight_what@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: menu_link_weight-setting
  input: What is the only configuration setting Menu Link Weight provides, and what are its possible values?
  criteria: menu_link_weight.settings:menu_parent_form_selector, which is either 'default' (core parent
    selector) or 'cshs' (Client-side hierarchical select, only effective if the cshs module is installed).
  bundle: menu_link_weight
  rubric_ref: rubric/menu_link_weight_menu_link_weight_setting@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: menu_link_weight-configure
