metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: menu_link_attributes
  version: 1.7.x
  note: Menu Link Attributes adds a configurable Attributes fieldset to the menu link content form. All
    cases are `recipe` (response-graded), grounded in the module docs; no site mutation.
questions:
- id: menulinkattr-config-object
  input: On a Drupal 11 site with the Menu Link Attributes module, where do I control which HTML attributes
    editors can set on menu links? Name the configuration object and the admin path.
  criteria: Edit the single config object menu_link_attributes.config (key `attributes`) at /admin/config/menu_link_attributes/config
    (Structure -> Menus -> Available attributes), a YAML textarea.
  bundle: menu_link_attributes
  rubric_ref: rubric/menu_link_attributes_menulinkattr_config_object@1.0
  tags:
  - mode:recipe
- id: menulinkattr-default-attributes
  input: Which menu link attributes does the Menu Link Attributes module make available out of the box,
    before I customize anything?
  criteria: Out of the box it ships container_class, class, and target.
  bundle: menu_link_attributes
  rubric_ref: rubric/menu_link_attributes_menulinkattr_default_attributes@1.0
  tags:
  - mode:recipe
- id: menulinkattr-container-vs-link
  input: Using Menu Link Attributes, I want a CSS class applied to the menu item's <li> wrapper element
    rather than the <a> link. How does the module decide whether an attribute goes on the <li> container
    vs the <a>?
  criteria: 'Attributes whose name starts with container_ (e.g. container_class) or that set `container:
    true` are applied to the <li> container; other attributes render on the <a>.'
  bundle: menu_link_attributes
  rubric_ref: rubric/menu_link_attributes_menulinkattr_container_vs_link@1.0
  tags:
  - mode:recipe
- id: menulinkattr-storage-options
  input: With Menu Link Attributes, where are the attribute values I set on a menu link actually stored
    on the entity, and how do they end up on the rendered <a> element?
  criteria: Values are stored in the menu link's `link` field options under the `attributes` (link) and
    `container_attributes` (container) keys, and render through core menu/link theming.
  bundle: menu_link_attributes
  rubric_ref: rubric/menu_link_attributes_menulinkattr_storage_options@1.0
  tags:
  - mode:recipe
- id: menulinkattr-programmatic
  input: In PHP on a Drupal 11 site, set the class `btn btn-primary` on the <a> of an existing menu_link_content
    link programmatically (Menu Link Attributes is enabled). Show the code.
  criteria: 'Write into $menu_link->link->first()->options: set $options[''attributes''][''class''] =
    [''btn'', ''btn-primary''] (or container_attributes for the <li>), assign back and call $menu_link->save().'
  bundle: menu_link_attributes
  rubric_ref: rubric/menu_link_attributes_menulinkattr_programmatic@1.0
  tags:
  - mode:recipe
- id: menulinkattr-select-attribute
  input: In the Menu Link Attributes YAML config, I want to add a `target` attribute that editors pick
    from a dropdown of preset values (_blank / _self) with a default. What sub-keys do I define for that
    attribute?
  criteria: 'Define the attribute with `type: select`, an `options` map of value: label pairs (e.g. _blank
    / _self), and optionally `default_value`; also `label`/`description`.'
  bundle: menu_link_attributes
  rubric_ref: rubric/menu_link_attributes_menulinkattr_select_attribute@1.0
  tags:
  - mode:recipe
- id: menulinkattr-permissions
  input: 'Menu Link Attributes: which permission lets a role set attribute values on the menu link edit
    form, and which separate permission lets a role define the list of available attributes?'
  criteria: '`use menu link attributes` gates setting values on the link form; `administer menu link attributes`
    (restricted) gates the available-attributes config form.'
  bundle: menu_link_attributes
  rubric_ref: rubric/menu_link_attributes_menulinkattr_permissions@1.0
  tags:
  - mode:recipe
