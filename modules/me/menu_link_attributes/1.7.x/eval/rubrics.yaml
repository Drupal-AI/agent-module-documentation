rubrics:
- id: menu_link_attributes_menulinkattr_config_object
  version: '1.0'
  applicable_bundles:
  - menu_link_attributes
  checks:
  - kind: must_contain_any
    values:
    - menu_link_attributes.config
    - /admin/config/menu_link_attributes/config
  scoring:
    combine: all_pass
- id: menu_link_attributes_menulinkattr_default_attributes
  version: '1.0'
  applicable_bundles:
  - menu_link_attributes
  checks:
  - kind: must_contain_any
    values:
    - container_class
    - class
    - target
  scoring:
    combine: all_pass
- id: menu_link_attributes_menulinkattr_container_vs_link
  version: '1.0'
  applicable_bundles:
  - menu_link_attributes
  checks:
  - kind: must_contain_any
    values:
    - container_
    - 'container: true'
    - container_class
  scoring:
    combine: all_pass
- id: menu_link_attributes_menulinkattr_storage_options
  version: '1.0'
  applicable_bundles:
  - menu_link_attributes
  checks:
  - kind: must_contain_any
    values:
    - options
    - attributes
    - container_attributes
  scoring:
    combine: all_pass
- id: menu_link_attributes_menulinkattr_programmatic
  version: '1.0'
  applicable_bundles:
  - menu_link_attributes
  checks:
  - kind: must_contain_any
    values:
    - link->first()->options
    - options['attributes']['class']
    - ->save()
  scoring:
    combine: all_pass
- id: menu_link_attributes_menulinkattr_select_attribute
  version: '1.0'
  applicable_bundles:
  - menu_link_attributes
  checks:
  - kind: must_contain_any
    values:
    - type
    - options
    - default_value
  scoring:
    combine: all_pass
- id: menu_link_attributes_menulinkattr_permissions
  version: '1.0'
  applicable_bundles:
  - menu_link_attributes
  checks:
  - kind: must_contain_any
    values:
    - use menu link attributes
    - administer menu link attributes
  scoring:
    combine: all_pass
