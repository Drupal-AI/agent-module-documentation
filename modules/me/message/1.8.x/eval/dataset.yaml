  criteria: The eval_activity message_template's single text partial is `[message:author:name] published
    [node:title]` (read from the live message.template.eval_activity config entity).
  bundle: message
  rubric_ref: rubric/message_message_known_template_introspect@1.0
  tags:
  - mode:introspection
  - difficulty:medium
