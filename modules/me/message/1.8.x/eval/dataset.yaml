metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: message
  version: 1.8.x
  note: 'Message ships two entity types: message_template (config entity, config prefix `template` ->
    stored as message.template.<id>) and message (content entity, bundle key `template`). Template text
    is a sequence of partials, each { value, format }, that can carry Drupal tokens. Introspection cases
    install a known template and read it back; execution cases build a template (and a message of it)
    and verify live state.'
questions:
- id: message-entity-types
  input: The Message module defines two entity types. Name each one, say whether it is a config entity
    or a content entity, and state the relationship between them.
  criteria: message_template is a config entity (a bundle) that holds the templated text; message is a
    content entity, one logged instance whose bundle is the template. The message's bundle key is `template`.
  bundle: message
  rubric_ref: rubric/message_message_entity_types@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: message-template-config-name
  input: A Message template has the machine name `node_created`. What is the exact configuration object
    name for its exported YAML, given the message_template config entity's config prefix?
  criteria: message.template.node_created (config prefix is `template`, so the config name is message.template.<id>).
  bundle: message
  rubric_ref: rubric/message_message_template_config_name@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: message-text-partials-tokens
  input: In a Message template, what is stored in the `text` property (describe its structure), and how
    do you make Drupal tokens like [node:title] actually get replaced when a message of that template
    is displayed?
  criteria: '`text` is a sequence of partials, each a formatted-text value { value, format } (unlimited
    cardinality). Tokens are replaced at render only when the template''s settings[''token options''][''token
    replace''] is TRUE.'
  bundle: message
  rubric_ref: rubric/message_message_text_partials_tokens@1.0
  tags:
  - mode:recipe
  - difficulty:easy
