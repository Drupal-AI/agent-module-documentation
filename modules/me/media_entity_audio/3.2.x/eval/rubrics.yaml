rubrics:
- id: media_entity_audio_media_entity_audio_source
  version: '1.0'
  applicable_bundles:
  - media_entity_audio
  checks:
  - kind: must_contain_any
    values:
    - audio_stream
    - Audio Stream
    - link
  scoring:
    combine: all_pass
- id: media_entity_audio_media_entity_audio_formatter
  version: '1.0'
  applicable_bundles:
  - media_entity_audio
  checks:
  - kind: must_contain_any
    values:
    - audio_stream_html5
    - controls
    - audio
  scoring:
    combine: all_pass
- id: media_entity_audio_media_entity_audio_mime
  version: '1.0'
  applicable_bundles:
  - media_entity_audio
  checks:
  - kind: must_contain_any
    values:
    - mime
    - audio/mpeg
    - audio/ogg
    - audio/wav
    - audio/x-wav
    - file.mime_type.guesser
  scoring:
    combine: all_pass
- id: media_entity_audio_media_entity_audio_known_type
  version: '1.0'
  applicable_bundles:
  - media_entity_audio
  checks:
  - kind: must_contain_any
    values:
    - mea_known
  scoring:
    combine: all_pass
- id: media_entity_audio_media_entity_audio_controls_known
  version: '1.0'
  applicable_bundles:
  - media_entity_audio
  checks:
  - kind: must_contain_any
    values:
    - disabled
    - 'false'
    - not displayed
    - 'off'
    - hidden
  scoring:
    combine: all_pass
- id: media_entity_audio_media_entity_audio_create_type
  version: '1.0'
  applicable_bundles:
  - media_entity_audio
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
- id: media_entity_audio_media_entity_audio_enable_controls
  version: '1.0'
  applicable_bundles:
  - media_entity_audio
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
