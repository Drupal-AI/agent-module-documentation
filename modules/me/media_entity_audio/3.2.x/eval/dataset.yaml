metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: media_entity_audio
  version: 3.2.x
  note: 'Media Entity Audio Streams adds a media SOURCE ''audio_stream'' (AudioStream, allowed_field_types
    = {link}, default thumbnail audio.png; default name = basename of the link URI; prepareViewDisplay
    sets the source field to the audio_stream_html5 formatter) and a field FORMATTER ''audio_stream_html5''
    (for link fields; single boolean setting ''controls'', default TRUE) that renders URLs in an HTML5
    <audio> player via the theme hook ''media_audio'' (template media-audio.html.twig; MIME guessed by
    file.mime_type.guesser, mapping audio/x-wav->audio/wav, passing audio/mpeg + audio/ogg). No settings
    form, no permissions, no Drush, configure=null; config schema provided. You use it by creating a Media
    type whose source is audio_stream (stored at media.type.<id> -> source: audio_stream, with a link
    source_field). Medium/hard cases create dedicated media types (mea_*) and read/write media.type.*
    config and the media source-field view display formatter.'
questions:
- id: media_entity_audio-source
  input: I want a Drupal Media type for audio that is referenced by URL (a stream / external file), not
    uploaded. The media_entity_audio module provides this. What media source do I choose, and what field
    type backs it?
  criteria: 'Create a Media type and choose the ''Audio Stream'' media source (plugin id audio_stream).
    Its source field is a ''link'' field (allowed_field_types = {link}) holding the audio URL. Stored
    as media.type.<id> -> source: audio_stream.'
  bundle: media_entity_audio
  rubric_ref: rubric/media_entity_audio_media_entity_audio_source@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: media_entity_audio-formatter
  input: How does media_entity_audio render an audio-stream media item's URL to site visitors, and what
    single setting controls whether the play/pause controls appear? What is that setting's default?
  criteria: It uses the 'audio_stream_html5' field formatter (on the link source field) which renders
    an HTML5 <audio> element via the media_audio theme hook. Its single boolean setting 'controls' toggles
    the transport controls and defaults to TRUE (controls shown).
  bundle: media_entity_audio
  rubric_ref: rubric/media_entity_audio_media_entity_audio_formatter@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: media_entity_audio-mime
  input: In media_entity_audio, how is each audio <source> element's type attribute determined, and which
    audio MIME types are supported out of the box (including any remapping)?
  criteria: 'template_preprocess_media_audio guesses each URL''s MIME type with the file.mime_type.guesser
    service and maps it: audio/x-wav is remapped to audio/wav, audio/mpeg and audio/ogg pass through,
    and anything else gets no type attribute on that <source>. When controls is TRUE the <audio> element
    gets the controls attribute.'
  bundle: media_entity_audio
  rubric_ref: rubric/media_entity_audio_media_entity_audio_mime@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: media_entity_audio-known-type
  input: On this Drupal site one Media type uses the media_entity_audio 'audio_stream' source. Inspect
    the live media type configuration and give the machine name of that media type.
  criteria: 'The media type is mea_known: media.type.mea_known has source: audio_stream. Find it e.g.
    with: drush cget media.type.mea_known source'
  bundle: media_entity_audio
  rubric_ref: rubric/media_entity_audio_media_entity_audio_known_type@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/media_entity_audio-known-type-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/media_entity_audio-known-type-cleanup.sh
- id: media_entity_audio-controls-known
  input: The media type 'mea_ctrl' on this site uses media_entity_audio and its source field is displayed
    with the audio_stream_html5 formatter. Inspect the live default display configuration and state whether
    the HTML5 audio controls are enabled or disabled for it.
  criteria: 'Controls are disabled: in the media.mea_ctrl.default view display, the source field''s audio_stream_html5
    formatter has settings.controls = false, so the <audio> player renders without transport controls.'
  bundle: media_entity_audio
  rubric_ref: rubric/media_entity_audio_media_entity_audio_controls_known@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/media_entity_audio-controls-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/media_entity_audio-controls-cleanup.sh
- id: media_entity_audio-create-type
  input: On this site, using the media_entity_audio module, create a new Media type with machine name
    'mea_task' that uses the Audio Stream source so editors can add audio by URL. Wire up its link source
    field and apply the change to the live site.
  criteria: Create MediaType id 'mea_task' with source 'audio_stream', create the source field via the
    source's createSourceField() (a link field), save its storage + instance, and set source_configuration.source_field
    to it. verify passes when mea_task's source is audio_stream and the source field is a link field.
  bundle: media_entity_audio
  rubric_ref: rubric/media_entity_audio_media_entity_audio_create_type@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/media_entity_audio-create-type-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/media_entity_audio-create-type-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/media_entity_audio-create-type-verify.sh
- id: media_entity_audio-enable-controls
  input: On this site the media type 'mea_show' uses media_entity_audio and its audio player is currently
    rendered WITHOUT controls (the audio_stream_html5 formatter has controls turned off). Update its default
    display so the HTML5 audio player shows play/pause controls, and apply the change to the live site.
  criteria: In the media.mea_show.default view display, set the source field's audio_stream_html5 formatter
    settings.controls to TRUE and save. verify passes when the formatter is audio_stream_html5 and controls
    === true.
  bundle: media_entity_audio
  rubric_ref: rubric/media_entity_audio_media_entity_audio_enable_controls@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/media_entity_audio-enable-controls-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/media_entity_audio-enable-controls-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/media_entity_audio-enable-controls-verify.sh
