rubrics:
- id: media_thumbnails_video_media_thumbnails_video_plugin_mime
  version: '1.0'
  applicable_bundles:
  - media_thumbnails_video
  checks:
  - kind: must_contain_any
    values:
    - media_thumbnails
    - media_thumbnail_video
    - video/mp4
    - ffmpeg
    - FFmpeg
  scoring:
    combine: all_pass
- id: media_thumbnails_video_media_thumbnails_video_settings
  version: '1.0'
  applicable_bundles:
  - media_thumbnails_video
  checks:
  - kind: must_contain_any
    values:
    - media_thumbnails_video.settings
    - /admin/config/media/media-thumbnails-video-settings
    - ffmpeg
    - ffprobe
    - threads
  scoring:
    combine: all_pass
- id: media_thumbnails_video_media_thumbnails_video_formatter
  version: '1.0'
  applicable_bundles:
  - media_thumbnails_video
  checks:
  - kind: must_contain_any
    values:
    - file_video_extended
    - Video extended
    - poster
  scoring:
    combine: all_pass
- id: media_thumbnails_video_media_thumbnails_video_which_settings
  version: '1.0'
  applicable_bundles:
  - media_thumbnails_video
  checks:
  - kind: must_contain_any
    values:
    - /opt/introspect/bin/ffmpeg
  scoring:
    combine: all_pass
- id: media_thumbnails_video_media_thumbnails_video_which_ffprobe
  version: '1.0'
  applicable_bundles:
  - media_thumbnails_video
  checks:
  - kind: must_contain_any
    values:
    - /opt/introspect/bin/ffprobe
  scoring:
    combine: all_pass
- id: media_thumbnails_video_media_thumbnails_video_configure_binaries
  version: '1.0'
  applicable_bundles:
  - media_thumbnails_video
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
- id: media_thumbnails_video_media_thumbnails_video_configure_binaries_layman
  version: '1.0'
  applicable_bundles:
  - media_thumbnails_video
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
