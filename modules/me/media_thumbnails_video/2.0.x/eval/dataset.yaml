metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: media_thumbnails_video
  version: 2.0.x
  note: Media Thumbnails Video contributes a MediaThumbnail plugin (id media_thumbnail_video, mime video/mp4,
    class MediaThumbnailVideo) to the media_thumbnails framework; createThumbnail() uses php-ffmpeg +
    GD to write a PNG frame as the video media entity thumbnail. Config object media_thumbnails_video.settings
    has ffmpeg, ffprobe (binary paths, nullable), timeout ('3600'), threads ('12'); settings form at /admin/config/media/media-thumbnails-video-settings.
    Also adds field formatter file_video_extended ('Video extended') that sets the thumbnail as the <video>
    poster. No permissions/Drush/plugin-types. Because real thumbnailing needs FFmpeg binaries + a real
    mp4 the agent won't have, ALL evals are grounded in the module's own config (paths/threads) — no thumbnail
    is actually generated.
questions:
- id: media_thumbnails_video-plugin-mime
  input: How does the media_thumbnails_video module generate thumbnails for videos, which framework does
    it plug into, and which video MIME type does its plugin handle?
  criteria: It provides a MediaThumbnail plugin (id media_thumbnail_video) to the Media Thumbnails framework;
    the plugin declares mime video/mp4 and uses the php-ffmpeg library + GD to extract a frame and save
    it as the video media entity's thumbnail.
  bundle: media_thumbnails_video
  rubric_ref: rubric/media_thumbnails_video_media_thumbnails_video_plugin_mime@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: media_thumbnails_video-settings
  input: Where do I configure media_thumbnails_video, and which settings can I set (config object media_thumbnails_video.settings)?
  criteria: 'Configure it at /admin/config/media/media-thumbnails-video-settings (route media_thumbnails_video.media_thumbnails_video_settings),
    writing media_thumbnails_video.settings: ffmpeg and ffprobe binary paths (empty = auto-detect), timeout
    (default 3600) and threads (default 12).'
  bundle: media_thumbnails_video
  rubric_ref: rubric/media_thumbnails_video_media_thumbnails_video_settings@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: media_thumbnails_video-formatter
  input: Besides generating thumbnails, media_thumbnails_video adds a field formatter for video files.
    What is its id/label and what does it do with the generated thumbnail?
  criteria: It adds the 'Video extended' formatter (id file_video_extended) for file fields, extending
    core's File Video formatter to render an HTML5 <video> tag with the generated thumbnail set as the
    poster attribute.
  bundle: media_thumbnails_video
  rubric_ref: rubric/media_thumbnails_video_media_thumbnails_video_formatter@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: media_thumbnails_video-which-settings
  input: On this Drupal site, media_thumbnails_video has been configured with an explicit FFmpeg binary
    path and a custom thread count. Inspect the live configuration and report the ffmpeg path and the
    number of threads it is set to use.
  criteria: media_thumbnails_video.settings has ffmpeg = '/opt/introspect/bin/ffmpeg' and threads = '4'
    (ffprobe = '/opt/introspect/bin/ffprobe'). Discoverable via `drush cget media_thumbnails_video.settings`.
  bundle: media_thumbnails_video
  rubric_ref: rubric/media_thumbnails_video_media_thumbnails_video_which_settings@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/media_thumbnails_video-settings-intro-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/media_thumbnails_video-settings-intro-cleanup.sh
- id: media_thumbnails_video-which-ffprobe
  input: On this Drupal site, media_thumbnails_video has an explicit FFprobe binary path configured. Inspect
    the live configuration and report the ffprobe path it is set to use.
  criteria: media_thumbnails_video.settings has ffprobe = '/opt/introspect/bin/ffprobe'. Discoverable
    via `drush cget media_thumbnails_video.settings ffprobe`.
  bundle: media_thumbnails_video
  rubric_ref: rubric/media_thumbnails_video_media_thumbnails_video_which_ffprobe@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/media_thumbnails_video-settings-intro-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/media_thumbnails_video-settings-intro-cleanup.sh
- id: media_thumbnails_video-configure-binaries
  input: On this Drupal site, configure media_thumbnails_video to use the FFmpeg binary at /usr/bin/ffmpeg
    and the FFprobe binary at /usr/bin/ffprobe, and set it to use 6 threads. Apply the change to the live
    site.
  criteria: media_thumbnails_video.settings has ffmpeg = '/usr/bin/ffmpeg', ffprobe = '/usr/bin/ffprobe'
    and threads = '6' (e.g. set via the settings form or config factory).
  bundle: media_thumbnails_video
  rubric_ref: rubric/media_thumbnails_video_media_thumbnails_video_configure_binaries@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/media_thumbnails_video-configure-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/media_thumbnails_video-configure-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/media_thumbnails_video-configure-verify.sh
- id: media_thumbnails_video-configure-binaries-layman
  input: My video previews aren't generating because Drupal can't find the video tool. On my server the
    tools live at /usr/bin/ffmpeg and /usr/bin/ffprobe. Please point the video thumbnail module at those,
    and have it use 6 worker threads. Save it live.
  criteria: 'Same end state as the expert phrasing: media_thumbnails_video.settings ffmpeg = ''/usr/bin/ffmpeg'',
    ffprobe = ''/usr/bin/ffprobe'', threads = ''6''.'
  bundle: media_thumbnails_video
  rubric_ref: rubric/media_thumbnails_video_media_thumbnails_video_configure_binaries_layman@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: site-owner
    reset: agent-module-documentation/evaluation/verify/media_thumbnails_video-configure-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/media_thumbnails_video-configure-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/media_thumbnails_video-configure-verify.sh
