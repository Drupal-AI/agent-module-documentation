metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: media_entity_download
  version: 2.4.x
  note: 'media_entity_download exposes one download route/controller, a field formatter, a Views field,
    Linkit substitutions, and one permission. Cases are `recipe` (response-graded): they probe documented
    facts an agent would otherwise read source to answer; no site mutation.'
questions:
- id: med-download-route
  input: On a Drupal 11 site using the Media entity download module, what is the route name and URL path
    that streams a media entity's file for download, and which controller handles it?
  criteria: Route media_entity_download.download at /media/{media}/download, handled by DownloadController::download().
  bundle: media_entity_download
  rubric_ref: rubric/media_entity_download_med_download_route@1.0
  tags:
  - mode:recipe
- id: med-force-attachment
  input: How does Media entity download force a file to download (a 'Save as...' dialog) rather than open
    in the browser? What HTTP header/value is used and how do I instead get inline browser handling?
  criteria: 'The BinaryFileResponse sets Content-Disposition: attachment by default (forced download);
    passing ?inline in the query switches it to Content-Disposition: inline for browser-default handling.'
  bundle: media_entity_download
  rubric_ref: rubric/media_entity_download_med_force_attachment@1.0
  tags:
  - mode:recipe
- id: med-permission
  input: Which permission does the Media entity download module define to control who can download a media
    file, and what other access check does the download route enforce?
  criteria: 'The ''download media'' permission gates the route; it also requires _entity_access: media.view,
    so the user must be able to view the media entity too.'
  bundle: media_entity_download
  rubric_ref: rubric/media_entity_download_med_permission@1.0
  tags:
  - mode:recipe
- id: med-formatter
  input: I want a media type's file field to render as a link that downloads the file. Which field formatter
    do I use, and which setting chooses between forcing a 'Save as...' dialog and browser default?
  criteria: Use the 'Download link' formatter (media_entity_download_download_link) on the file/image
    field; its 'disposition' setting (Download behavior) chooses attachment (Force Save as...) vs inline
    (Browser default).
  bundle: media_entity_download
  rubric_ref: rubric/media_entity_download_med_formatter@1.0
  tags:
  - mode:recipe
- id: med-source-field
  input: How does the Media entity download controller decide which file to serve for a given media entity,
    and how do I request a specific file from a multi-value field?
  criteria: It reads the media source's configured source_field and loads the referenced file; pass ?delta=N
    in the query to select a specific item from a multi-value field.
  bundle: media_entity_download
  rubric_ref: rubric/media_entity_download_med_source_field@1.0
  tags:
  - mode:recipe
- id: med-linkit-substitution
  input: Using Media entity download with Linkit, which substitution plugin produces a direct download
    URL that forces a 'Save as...' dialog, and which one produces an inline (browser default) URL?
  criteria: The media_download substitution gives a forced-download (attachment) URL; media_download_inline
    gives an inline URL.
  bundle: media_entity_download
  rubric_ref: rubric/media_entity_download_med_linkit_substitution@1.0
  tags:
  - mode:recipe
- id: med-permanent-url
  input: Why is the download URL provided by Media entity download considered permanent compared to a
    normal file field URL, and what module does it depend on?
  criteria: The URL is keyed by media entity ID (/media/{media}/download), not the physical file path,
    so it stays stable when the underlying file is replaced. It depends only on core media.
  bundle: media_entity_download
  rubric_ref: rubric/media_entity_download_med_permanent_url@1.0
  tags:
  - mode:recipe
- id: med-file-download-hook
  input: Can another module deny or add headers to a file served by the Media entity download route? What
    core hook does the controller invoke to allow that?
  criteria: Yes; DownloadController invokes hook_file_download($uri). Returned headers are applied, and
    a -1 result triggers AccessDeniedHttpException (403).
  bundle: media_entity_download
  rubric_ref: rubric/media_entity_download_med_file_download_hook@1.0
  tags:
  - mode:recipe
