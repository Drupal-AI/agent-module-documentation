metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: media_iframe
  version: 1.2.x
  note: media_iframe provides a single core Media source plugin, inline_frame ('Inline frame'), with allowed_field_types={iframe}.
    It has no settings form and no configure route (configure=null); everything is done through the standard
    Media type UI/API. The generated source field defaults to field_media_inline_frame (type iframe, label
    'Inline Frame URL') and the media view display is prepared with the iframe_default formatter. Introspection
    cases create a media type using this source (namespaced source fields field_mi_*) and read back the
    type/source-field label; execution cases create a media type whose source is inline_frame, verified
    against the live media type + its source field type. Creating an iframe media type in code requires
    creating the iframe field storage explicitly before the field, then pointing source_configuration.source_field
    at it.
questions:
- id: media_iframe-source-plugin
  input: In the Drupal module media_iframe, what is the machine name (id) of the Media source plugin it
    provides, and what field type must that source's field use?
  criteria: It provides the core Media source plugin id 'inline_frame' (label 'Inline frame'), whose allowed_field_types
    is {"iframe"} - so its source field is an 'iframe'-type field provided by the contrib iframe module.
  bundle: media_iframe
  rubric_ref: rubric/media_iframe_media_iframe_source_plugin@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: media_iframe-how-to-set-up
  input: media_iframe has no admin settings page. How do I actually use it to let editors embed iframe
    URLs as media, and what is the default source field's machine name and label?
  criteria: There is no configure route (configure=null). You create a Media type and choose the 'Inline
    frame' (inline_frame) source; Drupal creates the source field field_media_inline_frame (type iframe,
    label 'Inline Frame URL') and prepares the view display with the iframe_default formatter.
  bundle: media_iframe
  rubric_ref: rubric/media_iframe_media_iframe_how_to_set_up@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: media_iframe-dependencies-formatter
  input: Which modules must be installed for media_iframe, and which field formatter does it use to render
    the iframe on a media type's view display?
  criteria: It depends on core 'media' and the contrib 'iframe' module (which supplies the iframe field
    type). prepareViewDisplay() renders the source field with the iframe_default formatter and a visually_hidden
    label.
  bundle: media_iframe
  rubric_ref: rubric/media_iframe_media_iframe_dependencies_formatter@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: media_iframe-known-type
