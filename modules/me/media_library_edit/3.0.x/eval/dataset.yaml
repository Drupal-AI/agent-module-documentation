metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: media_library_edit
  version: 3.0.x
  note: Media Library Edit is a hook-only module with no routes, permissions, services, or plugins; its
    whole surface is third-party widget settings on the core media_library_widget plus AJAX/form-mode
    runtime behavior. Cases are `recipe` (response-graded), probing facts an agent would otherwise read
    the .module and schema to answer; no site mutation.
questions:
- id: mle-enable-location
  input: On a Drupal 11 site with the media_library_edit module enabled, where do I turn on the edit button
    for a media reference field? There is no admin settings page for the module.
  criteria: It has no config route; you enable it in the field's Manage form display, in the settings
    of the Media library (media_library_widget) widget, via its third-party settings.
  bundle: media_library_edit
  rubric_ref: rubric/media_library_edit_mle_enable_location@1.0
  tags:
  - mode:recipe
- id: mle-widget-settings-keys
  input: Which two settings does media_library_edit add to the Media library widget, and what config schema
    type stores them?
  criteria: It adds show_edit (checkbox 'Show edit button') and edit_form_mode (select 'Form mode'), stored
    under the config schema type field.widget.third_party.media_library_edit.
  bundle: media_library_edit
  rubric_ref: rubric/media_library_edit_mle_widget_settings_keys@1.0
  tags:
  - mode:recipe
- id: mle-supported-widget
  input: Does media_library_edit add an edit button to any file/media widget? Which widget plugin id does
    it target?
  criteria: Only the core Media library widget, plugin id media_library_widget; the alter hooks check
    for that plugin id and do nothing for other widgets.
  bundle: media_library_edit
  rubric_ref: rubric/media_library_edit_mle_supported_widget@1.0
  tags:
  - mode:recipe
- id: mle-access-gate
  input: media_library_edit defines no permissions. What determines whether a given editor sees the edit
    button on a selected media item?
  criteria: There are no module permissions; the button only renders when the media item's access('update')
    is TRUE and the media entity type has an 'edit-form' link template.
  bundle: media_library_edit
  rubric_ref: rubric/media_library_edit_mle_access_gate@1.0
  tags:
  - mode:recipe
- id: mle-form-mode
  input: How does media_library_edit make the edit modal render a specific media form mode instead of
    the default? Name the query parameter and the hook involved.
  criteria: The edit URL carries a media_library_form_mode=<mode> query param; hook_entity_form_display_alter
    swaps the form display to that form mode when it is valid for the bundle.
  bundle: media_library_edit
  rubric_ref: rubric/media_library_edit_mle_form_mode@1.0
  tags:
  - mode:recipe
- id: mle-ajax-save
  input: When you save the media edit form inside media_library_edit's modal, what happens to the delete
    action and how does the item update without a full page reload?
  criteria: hook_form_alter (when media_library_edit=ajax) hides the delete action and rewires save to
    the AJAX callback _media_library_edit_media_edit_update, which closes the dialog and ReplaceCommands
    the item's rendered media_library view.
  bundle: media_library_edit
  rubric_ref: rubric/media_library_edit_mle_ajax_save@1.0
  tags:
  - mode:recipe
- id: mle-deps-config
  input: Are media_library_edit's per-widget settings deployable as configuration, and does the module
    define its own settings config object?
  criteria: It defines no standalone settings object; the settings live as third-party settings on the
    entity form display config, so they export/deploy with drush config:export like the rest of the form
    display.
  bundle: media_library_edit
  rubric_ref: rubric/media_library_edit_mle_deps_config@1.0
  tags:
  - mode:recipe
