rubrics:
- id: media_tyler_data_insights_mdi_source_field_type
  version: '1.0'
  applicable_bundles:
  - media_tyler_data_insights
  checks:
  - kind: must_contain_any
    values:
    - media_tylerdi
    - string_long
  scoring:
    combine: all_pass
- id: media_tyler_data_insights_mdi_allowed_hosts_config
  version: '1.0'
  applicable_bundles:
  - media_tyler_data_insights
  checks:
  - kind: must_contain_any
    values:
    - media_tyler_data_insights.settings
    - allowed_hosts
    - /admin/config/media/tyler-data-insights
  scoring:
    combine: all_pass
- id: media_tyler_data_insights_mdi_validation
  version: '1.0'
  applicable_bundles:
  - media_tyler_data_insights
  checks:
  - kind: must_contain_any
    values:
    - iframe
    - allowed_hosts
    - allowed host
    - stories
    - /w/
  scoring:
    combine: all_pass
- id: media_tyler_data_insights_mdi_allowed_host_read
  version: '1.0'
  applicable_bundles:
  - media_tyler_data_insights
  checks:
  - kind: must_contain_any
    values:
    - data.mdi-eval.gov
  scoring:
    combine: all_pass
- id: media_tyler_data_insights_mdi_host_count_read
  version: '1.0'
  applicable_bundles:
  - media_tyler_data_insights
  checks:
  - kind: must_contain_any
    values:
    - opendata.mdi-eval.com
    - insights.mdi-eval.com
  scoring:
    combine: all_pass
- id: media_tyler_data_insights_mdi_add_allowed_host
  version: '1.0'
  applicable_bundles:
  - media_tyler_data_insights
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
- id: media_tyler_data_insights_mdi_create_media_type
  version: '1.0'
  applicable_bundles:
  - media_tyler_data_insights
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
