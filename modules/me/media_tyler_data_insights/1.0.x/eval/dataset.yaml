metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: media_tyler_data_insights
  version: 1.0.x
  note: 'Module provides a media source plugin media_tylerdi (string_long source field), a field formatter
    media_tyler_data_insights, and a validation constraint media_tyler_data_insights. Its only config
    is media_tyler_data_insights.settings -> allowed_hosts (sequence of https:// origins), edited at /admin/config/media/tyler-data-insights
    (permission ''administer media_tyler_data_insights hosts''). Medium cases are grounded in the real
    allowed_hosts config. Hard cases: (1) add an allowed host to the live config; (2) create a Media type
    whose source is media_tylerdi. reset/cleanup restore baseline (allowed_hosts empty; no media type
    sourced by media_tylerdi). The site has no shipped config/install for the settings object, so baseline
    allowed_hosts is empty.'
questions:
- id: mdi-source-field-type
  input: 'In the Drupal module Media: Tyler Technologies Data & Insights, what is the machine id of the
    media source plugin it provides, and what field type stores the pasted embed snippet?'
  criteria: The media source plugin id is media_tylerdi ('Tyler Data & Insights'); its source field is
    a string_long field that stores the pasted embed/share snippet.
  bundle: media_tyler_data_insights
  rubric_ref: rubric/media_tyler_data_insights_mdi_source_field_type@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: mdi-allowed-hosts-config
  input: 'Where does the Media: Tyler Data & Insights module store the list of hosts that visualizations
    may be embedded from, and at what admin path do you edit it?'
  criteria: In the config object media_tyler_data_insights.settings under the allowed_hosts key, edited
    on the settings form at /admin/config/media/tyler-data-insights (permission 'administer media_tyler_data_insights
    hosts'). Each host is an https:// origin with no path.
  bundle: media_tyler_data_insights
  rubric_ref: rubric/media_tyler_data_insights_mdi_allowed_hosts_config@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: mdi-validation
  input: 'What does the Media: Tyler Data & Insights validation constraint check before it accepts a pasted
    embed code?'
  criteria: The value must contain exactly one iframe, whose src path matches /w/... or /stories/...,
    and whose host is in the configured allowed_hosts list; otherwise it is rejected with an invalid-embed
    or invalid-host message.
  bundle: media_tyler_data_insights
  rubric_ref: rubric/media_tyler_data_insights_mdi_validation@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: mdi-allowed-host-read
  input: 'On this Drupal site, the Media: Tyler Data & Insights module has been configured with an allowed
    embed host. Inspect the live media_tyler_data_insights.settings config and report the allowed host.'
  criteria: The allowed host is https://data.mdi-eval.gov, listed in media_tyler_data_insights.settings
    allowed_hosts.
  bundle: media_tyler_data_insights
  rubric_ref: rubric/media_tyler_data_insights_mdi_allowed_host_read@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/media_tyler_data_insights-allowed-host-read-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/media_tyler_data_insights-allowed-host-read-cleanup.sh
- id: mdi-host-count-read
  input: 'On this Drupal site, several embed hosts are allowed for Media: Tyler Data & Insights. Inspect
    the live media_tyler_data_insights.settings config and report how many hosts are allowed and name
    one of them.'
  criteria: 'Two hosts are allowed: https://opendata.mdi-eval.com and https://insights.mdi-eval.com (media_tyler_data_insights.settings
    allowed_hosts).'
  bundle: media_tyler_data_insights
  rubric_ref: rubric/media_tyler_data_insights_mdi_host_count_read@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/media_tyler_data_insights-host-count-read-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/media_tyler_data_insights-host-count-read-cleanup.sh
- id: mdi-add-allowed-host
  input: 'On this Drupal site, configure Media: Tyler Data & Insights to allow embeds from the host https://data.mditask.gov
    by adding it to the allowed hosts. Apply the change to the live media_tyler_data_insights.settings
    configuration.'
  criteria: media_tyler_data_insights.settings allowed_hosts contains 'https://data.mditask.gov' (set
    the sequence via the settings form or the config API).
  bundle: media_tyler_data_insights
  rubric_ref: rubric/media_tyler_data_insights_mdi_add_allowed_host@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/media_tyler_data_insights-add-allowed-host-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/media_tyler_data_insights-add-allowed-host-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/media_tyler_data_insights-add-allowed-host-verify.sh
- id: mdi-create-media-type
  input: On this Drupal site, create a new Media type that uses the Tyler Data & Insights media source
    (plugin media_tylerdi) so editors can add Data & Insights visualizations as media. Apply the change
    to the live site.
  criteria: A media type config entity exists whose source plugin is media_tylerdi (with a string_long
    source field, e.g. created via the 'Add media type' UI or MediaType::create([...'source'=>'media_tylerdi'])
    plus createSourceField()).
  bundle: media_tyler_data_insights
  rubric_ref: rubric/media_tyler_data_insights_mdi_create_media_type@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/media_tyler_data_insights-create-media-type-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/media_tyler_data_insights-create-media-type-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/media_tyler_data_insights-create-media-type-verify.sh
