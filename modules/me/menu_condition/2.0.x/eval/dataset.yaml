metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: menu_condition
  version: 2.0.x
  note: Menu Condition provides one core Condition plugin, menu_position ('Menu position'), and nothing
    else (no config entity, settings form, route, permissions, or Drush). Its single config value is menu_parent,
    a string '<menu_name>:<link_plugin_id>' (or '<menu_name>:' for a whole menu); empty evaluates TRUE.
    2.0.x adds a config schema for that value (condition.plugin.menu_position -> menu_parent string) and
    narrows core to ^10 || ^11 (drops D8/D9); plugin behavior is unchanged from 1.x. Used in block visibility,
    it is stored at block.block.<id> -> visibility.menu_position.menu_parent, and the block shows when
    the selected link (and its children) is in the active trail. Medium/hard cases are grounded in real
    block placements carrying that visibility condition; scripts create/read/remove throwaway mc_* blocks.
questions:
- id: menu_condition-what-it-provides
  input: What does the Drupal menu_condition module add, and what is a typical use for it with blocks?
  criteria: 'It provides a ''Menu position'' condition plugin (id menu_position) based on the active menu
    trail. Typical use: in a block''s Visibility settings pick a menu parent so the block shows on that
    menu item and all its children.'
  bundle: menu_condition
  rubric_ref: rubric/menu_condition_menu_condition_what_it_provides@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: menu_condition-plugin-id-value
  input: In the menu_condition module, what is the condition plugin id and what configuration value does
    it store to know which menu item to match?
  criteria: Plugin id menu_position; it stores a single string menu_parent in the form '<menu_name>:<link_plugin_id>'
    (e.g. main:standard.front_page), or '<menu_name>:' when a whole menu is chosen.
  bundle: menu_condition
  rubric_ref: rubric/menu_condition_menu_condition_plugin_id_value@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: menu_condition-children-behavior
  input: If I set the menu_condition 'Menu position' condition on a block to a particular menu link, on
    which pages will the block appear? What does an empty selection do?
  criteria: The block shows on the selected menu item and all its children (any page where that link is
    in the active menu trail). An empty selection places no restriction (condition evaluates TRUE).
  bundle: menu_condition
  rubric_ref: rubric/menu_condition_menu_condition_children_behavior@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: menu_condition-core-support
  input: Which Drupal core versions does menu_condition 2.0.x support, and did that change from 1.x?
  criteria: 2.0.x requires Drupal core ^10 || ^11; the 2.0.0 major release dropped support for Drupal
    8 and 9 (1.x was ^8 || ^9 || ^10 || ^11).
  bundle: menu_condition
  rubric_ref: rubric/menu_condition_menu_condition_core_support@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: menu_condition-known-menu
  input: On this Drupal site a block uses the menu_condition 'Menu position' visibility condition. Inspect
    the live block configuration and state which menu the condition targets.
  criteria: Block block.block.mc_known has visibility.menu_position.menu_parent = 'main:', so the condition
    targets the Main navigation ('main') menu (whole menu).
  bundle: menu_condition
  rubric_ref: rubric/menu_condition_menu_condition_known_menu@1.0
  tags:
  - mode:introspection
  - difficulty:medium
