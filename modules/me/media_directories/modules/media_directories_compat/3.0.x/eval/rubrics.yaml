rubrics:
- id: media_directories_compat_media_directories_compat_filter_id
  version: '1.0'
  applicable_bundles:
  - media_directories_compat
  checks:
  - kind: must_contain_any
    values:
    - media_directories_legacy_embed
  scoring:
    combine: all_pass
- id: media_directories_compat_media_directories_compat_inline_modes
  version: '1.0'
  applicable_bundles:
  - media_directories_compat
  checks:
  - kind: must_contain_any
    values:
    - inline_display_modes
    - <a
  scoring:
    combine: all_pass
- id: media_directories_compat_media_directories_compat_attributes
  version: '1.0'
  applicable_bundles:
  - media_directories_compat
  checks:
  - kind: must_contain_any
    values:
    - data-entity-embed-display
    - data-embed-button
    - CONSUMED_ATTRIBUTES
  scoring:
    combine: all_pass
- id: media_directories_compat_media_directories_compat_known_inline
  version: '1.0'
  applicable_bundles:
  - media_directories_compat
  checks:
  - kind: must_contain_any
    values:
    - teaser
  scoring:
    combine: all_pass
- id: media_directories_compat_media_directories_compat_convert_live
  version: '1.0'
  applicable_bundles:
  - media_directories_compat
  checks:
  - kind: must_contain_any
    values:
    - data-width="300"
    - data-width='300'
    - data-width=300
  scoring:
    combine: all_pass
- id: media_directories_compat_media_directories_compat_enable_filter
  version: '1.0'
  applicable_bundles:
  - media_directories_compat
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
- id: media_directories_compat_media_directories_compat_inline_link
  version: '1.0'
  applicable_bundles:
  - media_directories_compat
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
