    reset: agent-module-documentation/evaluation/verify/media_directories_file_link-enable-button-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/media_directories_file_link-enable-button-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/media_directories_file_link-enable-button-verify.sh
- id: media_directories_file_link-template
  input: On this Drupal site, the text format mfl_tpl_format already renders media file links with media_directories_file_link
    at its default settings. Change it so every rendered file link shows the media's name followed by
    the file's human-readable size, and so no file-type icon attribute is emitted. Apply the change to
    the live site.
  criteria: On filter.format.mfl_tpl_format set filters.media_directories_file_link.settings.template
    to something using the @name and @size tokens, e.g. <a href="@file_url" download>@name (@size)</a>,
    and settings.icon to false. The filter then renders <span class="media-file-link"><a href="…" download>MFL
    template media (20 bytes)</a></span> with no data-file-type attribute.
  bundle: media_directories_file_link
  rubric_ref: rubric/media_directories_file_link_media_directories_file_link_template@1.0
