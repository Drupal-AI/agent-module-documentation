rubrics:
- id: media_directories_image_resize_media_directories_image_resize_derivative_path
  version: '1.0'
  applicable_bundles:
  - media_directories_image_resize
  checks:
  - kind: must_contain_any
    values:
    - public://resize
    - resize/120x90
  scoring:
    combine: all_pass
- id: media_directories_image_resize_media_directories_image_resize_skips
  version: '1.0'
  applicable_bundles:
  - media_directories_image_resize
  checks:
  - kind: must_contain_any
    values:
    - svg
    - SVG
    - width
    - height
    - public
  scoring:
    combine: all_pass
- id: media_directories_image_resize_media_directories_image_resize_ordering
  version: '1.0'
  applicable_bundles:
  - media_directories_image_resize
  checks:
  - kind: must_contain_any
    values:
    - after
    - media_directories_image_resize
  scoring:
    combine: all_pass
- id: media_directories_image_resize_media_directories_image_resize_known_format
  version: '1.0'
  applicable_bundles:
  - media_directories_image_resize
  checks:
  - kind: must_contain_any
    values:
    - resize/60x40/mdir-eval/source.png
  scoring:
    combine: all_pass
- id: media_directories_image_resize_media_directories_image_resize_svg_skip
  version: '1.0'
  applicable_bundles:
  - media_directories_image_resize
  checks:
  - kind: must_contain_any
    values:
    - resize/50x50/mdir-eval-svg/photo.png
  scoring:
    combine: all_pass
- id: media_directories_image_resize_media_directories_image_resize_enable_filter
  version: '1.0'
  applicable_bundles:
  - media_directories_image_resize
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
- id: media_directories_image_resize_media_directories_image_resize_derivative
  version: '1.0'
  applicable_bundles:
  - media_directories_image_resize
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
