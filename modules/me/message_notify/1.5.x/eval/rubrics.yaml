rubrics:
- id: message_notify_message_notify_send_service
  version: '1.0'
  applicable_bundles:
  - message_notify
  checks:
  - kind: must_contain_any
    values:
    - message_notify.sender
    - ->send(
    - send(
    - '''mail'''
    - '"mail"'
  scoring:
    combine: all_pass
- id: message_notify_message_notify_view_modes
  version: '1.0'
  applicable_bundles:
  - message_notify
  checks:
  - kind: must_contain_any
    values:
    - mail_subject
    - mail_body
    - partial_0
    - partial_1
  scoring:
    combine: all_pass
- id: message_notify_message_notify_custom_notifier
  version: '1.0'
  applicable_bundles:
  - message_notify
  checks:
  - kind: must_contain_any
    values:
    - '@Notifier'
    - MessageNotifierBase
    - deliver
    - Plugin/Notifier
  scoring:
    combine: all_pass
- id: message_notify_message_notify_body_display_partial
  version: '1.0'
  applicable_bundles:
  - message_notify
  checks:
  - kind: must_contain_any
    values:
    - partial_1
  scoring:
    combine: all_pass
- id: message_notify_message_notify_known_subject
  version: '1.0'
  applicable_bundles:
  - message_notify
  checks:
  - kind: must_contain_any
    values:
    - MN Welcome Subject XYZ
  scoring:
    combine: all_pass
- id: message_notify_message_notify_create_bundle
  version: '1.0'
  applicable_bundles:
  - message_notify
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
- id: message_notify_message_notify_send_notification
  version: '1.0'
  applicable_bundles:
  - message_notify
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
