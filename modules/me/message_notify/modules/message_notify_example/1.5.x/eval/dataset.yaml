metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: message_notify_example
  version: 1.5.x
  note: Demonstration submodule of Message Notify. Its only behavior is a hook_comment_insert() that,
    when a comment is posted on a node, creates a Message of template example_create_comment owned by
    the node's author, sets field_comment_reference (to the comment) and field_published, saves it, and
    sends it via message_notify.sender (email). Easy cases cover that flow and its dependencies. Medium
    cases introspect the live shipped config the example depends on (the example_create_comment template
    from message_example and the fields the example sets on it) - node-free and smoke-tested. Hard cases
    exercise the real comment->notify flow (a node owned by a real user + a comment) and verify a saved
    example_create_comment message for that author; they were AUTHORED and their FAIL-on-empty path smoke-tested,
    but the PASS path could NOT be smoke-tested on this shared site because node creation currently fails
    site-wide (six node-access modules - content_access, nodeaccess, node_view_permissions, permissions_by_term,
    domain_access, unpublished_node_permissions - emit duplicate 'all/0' grants, raising a node_access
    integrity violation). The reset/verify/cleanup scripts are written to work once node creation is restored.
questions:
- id: message_notify_example-what-triggers
  input: What does the Drupal 'Message notify example' module do, and which Drupal hook triggers it?
  criteria: It is a demo submodule of Message Notify. Its hook_comment_insert() fires when a new comment
    is posted on a node and sends an email notification to that node's author using Message Notify.
  bundle: message_notify_example
  rubric_ref: rubric/message_notify_example_message_notify_example_what_triggers@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: message_notify_example-template-used
  input: In the Message notify example module, which Message template is used to build the notification
    when a comment is posted, and which service actually sends it?
  criteria: It creates a Message of template example_create_comment (provided by message_example), sets
    field_comment_reference and field_published on it, saves it, and sends it with the message_notify.sender
    service (default 'email' notifier).
  bundle: message_notify_example
  rubric_ref: rubric/message_notify_example_message_notify_example_template_used@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: message_notify_example-anon-owner
  input: In the Message notify example, who receives the notification email when someone comments on a
    node, and why would it fail if the node's author is anonymous?
  criteria: The recipient is the node's author (the message uid is set to the node owner, and the email
    notifier uses that user's email). If the node owner is anonymous (uid 0) with no email, the email
    notifier throws MessageNotifyException because there is no recipient address.
  bundle: message_notify_example
  rubric_ref: rubric/message_notify_example_message_notify_example_anon_owner@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: message_notify_example-fields-set
  input: The Message notify example sends notifications using a specific Message template. Inspect this
    Drupal site and name the fields that exist on that message template for referencing the comment and
    its published state (the ones the example populates).
  criteria: The template is example_create_comment; it has fields field_comment_reference (entity reference
    to the comment) and field_published (boolean) - the two fields the example module sets. (It also has
    field_node_reference.)
  bundle: message_notify_example
  rubric_ref: rubric/message_notify_example_message_notify_example_fields_set@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/message_notify_example-ensure-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/message_notify_example-ensure-cleanup.sh
- id: message_notify_example-template-present
  input: The Message notify example depends on a Message template being present on the site to build its
    comment notifications. Inspect the live site and give the machine name of that message template.
  criteria: The message template is example_create_comment (a message_template config entity provided
    by the message_example module), which the example loads via Message::create(['template' => 'example_create_comment',
    ...]).
  bundle: message_notify_example
  rubric_ref: rubric/message_notify_example_message_notify_example_template_present@1.0
  tags:
