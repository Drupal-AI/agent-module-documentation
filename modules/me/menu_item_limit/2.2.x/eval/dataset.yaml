metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: menu_item_limit
  version: 2.2.x
  note: 'Menu Item Limit adds an ''Item Limitation'' field to the core menu_edit_form and stores the value
    in the menu_item_limit.settings config object keyed by menu machine name (menu_item_limit.settings:<menu>
    = <int>; 0/empty = unlimited). Enforcement: hook_entity_type_alter adds a MenuItemOverLimit constraint
    to menu_link_content; MenuItemOverLimitValidator blocks a NEW menu_link_content when the menu''s loaded
    tree count >= limit, with message ''New link cannot be added because the menu item limit has been
    reached.'' No configure route, no permission, no drush, no config schema. Medium/hard cases create
    namespaced menus (mil_*) and read/write the menu_item_limit.settings keys.'
questions:
- id: mil-set-limit
  input: Using the menu_item_limit module on Drupal 11, how do I set a maximum number of items for a specific
    menu, and what value means 'no limit'? Where is that setting stored?
  criteria: Edit the menu (Structure -> Menus -> Edit menu, menu_edit_form) and enter a number in the
    'Item Limitation' field; 0 (or empty) means unlimited. It is stored in the menu_item_limit.settings
    config object under a key equal to the menu machine name, e.g. menu_item_limit.settings:main = 5.
  bundle: menu_item_limit
  rubric_ref: rubric/menu_item_limit_mil_set_limit@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: mil-enforcement
  input: With menu_item_limit, what actually stops a menu from exceeding its configured item count, and
    what message does a user see when a menu is full?
  criteria: A MenuItemOverLimit validation constraint added to the menu_link_content entity type (via
    hook_entity_type_alter). When a new link would exceed the menu's limit, MenuItemOverLimitValidator
    adds the violation 'New link cannot be added because the menu item limit has been reached.'
  bundle: menu_item_limit
  rubric_ref: rubric/menu_item_limit_mil_enforcement@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: mil-new-only
  input: Does menu_item_limit's cap apply to menu links that already exist in a menu, or only when adding
    new ones? Briefly, how does the validator decide?
  criteria: 'Only new items are blocked: MenuItemOverLimitValidator returns early when !$entity->isNew(),
    so existing menu_link_content links can still be saved/moved and an already-over-limit menu is not
    retroactively invalidated. For a new link it loads the menu tree, counts items and blocks when count
    >= limit.'
  bundle: menu_item_limit
  rubric_ref: rubric/menu_item_limit_mil_new_only@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: mil-known-limit
  input: This Drupal site uses menu_item_limit and has a custom menu with machine name 'mil_known' that
    has an item limit configured. Inspect the live configuration and state the maximum number of items
    allowed in the mil_known menu.
  criteria: 'The limit is 3: menu_item_limit.settings has key mil_known = 3.'
  bundle: menu_item_limit
  rubric_ref: rubric/menu_item_limit_mil_known_limit@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/menu_item_limit-known-limit-setup.sh
