- id: mil-set-cap
  input: This site has a custom menu with machine name 'mil_task' that currently has no item limit. Using
    the menu_item_limit module, configure that menu so it allows at most 2 items, and apply the change
    to the live site.
  criteria: Set menu_item_limit.settings:mil_task = 2 (e.g. via the menu's 'Item Limitation' field on
    /admin/structure/menu/manage/mil_task, or \Drupal::configFactory()->getEditable('menu_item_limit.settings')->set('mil_task',
    2)->save()).
  bundle: menu_item_limit
  rubric_ref: rubric/menu_item_limit_mil_set_cap@1.0
