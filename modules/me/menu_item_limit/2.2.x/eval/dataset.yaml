  input: A menu with machine name 'mil_seven' on this site has been given a menu_item_limit cap. Read
    the live site configuration and report the configured item limit for the mil_seven menu.
  criteria: 'The limit is 7: menu_item_limit.settings has key mil_seven = 7.'
  bundle: menu_item_limit
  rubric_ref: rubric/menu_item_limit_mil_configured_cap@1.0
  tags:
