metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: media_bulk_upload_dropzonejs
  version: 3.0.x
  note: Submodule of media_bulk_upload. Replaces the bulk upload widget with DropzoneJS via a route subscriber
    + form subclass, and converts DropzoneJS paths into file entities through the parent's alter hook.
    Cases are `recipe` (response-graded); no site mutation.
questions:
- id: mbudz-purpose
  input: What does the media_bulk_upload_dropzonejs submodule do, and which modules must be enabled for
    it to work?
  criteria: It swaps the Media Bulk Upload form's file widget for a DropzoneJS drag-and-drop uploader.
    Requires media_bulk_upload and the contrib dropzonejs module.
  bundle: media_bulk_upload_dropzonejs
  rubric_ref: rubric/media_bulk_upload_dropzonejs_mbudz_purpose@1.0
  tags:
  - mode:recipe
- id: mbudz-route-override
  input: How does media_bulk_upload_dropzonejs make the existing bulk upload form use DropzoneJS instead
    of the standard file field?
  criteria: A route subscriber (MediaBulkUploadDropzoneJsRouteSubscriber) alters the media_bulk_upload.upload_form
    route so its _form default becomes MediaBulkUploadDropzoneJsForm, which sets the file_upload element
    type to dropzonejs. Applies globally, no per-config toggle.
  bundle: media_bulk_upload_dropzonejs
  rubric_ref: rubric/media_bulk_upload_dropzonejs_mbudz_route_override@1.0
  tags:
  - mode:recipe
- id: mbudz-form-subclass
  input: Which form class does the DropzoneJS submodule provide and what does it extend?
  criteria: MediaBulkUploadDropzoneJsForm, a subclass of the parent MediaBulkUploadForm; it changes file_upload
    to a dropzonejs element and passes the allowed extensions.
  bundle: media_bulk_upload_dropzonejs
  rubric_ref: rubric/media_bulk_upload_dropzonejs_mbudz_form_subclass@1.0
  tags:
  - mode:recipe
- id: mbudz-file-ids-alter
  input: DropzoneJS returns uploaded file paths rather than saved file IDs. How does the submodule turn
    those into media entities?
  criteria: It implements hook_media_bulk_upload_file_ids_alter to create permanent file entities from
    the DropzoneJS paths (uploaded_files) and replace $file_ids with their IDs, which the parent form
    then batches into media.
  bundle: media_bulk_upload_dropzonejs
  rubric_ref: rubric/media_bulk_upload_dropzonejs_mbudz_file_ids_alter@1.0
  tags:
  - mode:recipe
- id: mbudz-validation
  input: How does the DropzoneJS bulk upload form validate dropped files?
  criteria: validateForm() requires at least one uploaded file, runs each through hook_file_validate,
    and deletes any file that fails validation while reporting the error.
  bundle: media_bulk_upload_dropzonejs
  rubric_ref: rubric/media_bulk_upload_dropzonejs_mbudz_validation@1.0
  tags:
  - mode:recipe
- id: mbudz-config
  input: Does media_bulk_upload_dropzonejs add its own configuration or permissions?
  criteria: No. It has no config, schema, or permissions of its own; it reuses the parent media_bulk_config
    entity, routes, and per-config permissions — just enable it.
  bundle: media_bulk_upload_dropzonejs
  rubric_ref: rubric/media_bulk_upload_dropzonejs_mbudz_config@1.0
  tags:
  - mode:recipe
