metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: media_bulk_upload
  version: 3.0.x
  note: Media Bulk Upload exposes a media_bulk_config config entity, a bulk upload form, static + dynamic
    permissions, and an alter hook. Cases are `recipe` (response-graded) probing documented facts an agent
    would otherwise read source to answer; no site mutation.
questions:
- id: mbu-config-entity
  input: On Drupal 11, which configuration entity does Media Bulk Upload define to set up a bulk upload
    form, and where in the admin UI do I create one?
  criteria: The media_bulk_config config entity; managed at Admin > Configuration > Media > Bulk upload
    media (/admin/config/media/media-bulk-config), configure route entity.media_bulk_config.collection.
  bundle: media_bulk_upload
  rubric_ref: rubric/media_bulk_upload_mbu_config_entity@1.0
  tags:
  - mode:recipe
- id: mbu-config-fields
  input: What are the main settings I configure on a Media Bulk Upload configuration, and what is the
    default upload location?
  criteria: media_types (which media types the form creates), form_mode (media form mode embedded for
    shared fields), and upload_location (default temporary://media-bulk-upload).
  bundle: media_bulk_upload
  rubric_ref: rubric/media_bulk_upload_mbu_config_fields@1.0
  tags:
  - mode:recipe
- id: mbu-extension-matching
  input: In Media Bulk Upload, how is an uploaded file assigned to a media type? What happens when two
    selected media types allow the same extension?
  criteria: Files are matched to a media type by their file extension (MediaTypeManager groups types by
    their source field's file_extensions). If several selected types share an extension, the file is assigned
    to one of them automatically.
  bundle: media_bulk_upload
  rubric_ref: rubric/media_bulk_upload_mbu_extension_matching@1.0
  tags:
  - mode:recipe
- id: mbu-permissions
  input: Which permission lets a role administer Media Bulk Upload configurations, and how is access to
    an individual bulk upload form controlled?
  criteria: '''administer media_bulk_upload configuration'' gates the config admin UI; each configuration
    also has a dynamic ''use {id} bulk upload form'' permission gating its form at /media/bulk-upload/{id}.'
  bundle: media_bulk_upload
  rubric_ref: rubric/media_bulk_upload_mbu_permissions@1.0
  tags:
  - mode:recipe
- id: mbu-upload-routes
  input: What are the front-end routes/paths a user visits to bulk upload media, and what happens if only
    one configuration exists?
  criteria: /media/bulk-upload lists usable configs (media_bulk_upload.list); /media/bulk-upload/{media_bulk_config}
    is the form (media_bulk_upload.upload_form). With one usable config the list redirects straight to
    that form.
  bundle: media_bulk_upload
  rubric_ref: rubric/media_bulk_upload_mbu_upload_routes@1.0
  tags:
  - mode:recipe
- id: mbu-alter-hook
  input: In a custom Drupal module I want to modify the list of uploaded file IDs before Media Bulk Upload
    creates media entities. Which hook do I implement?
  criteria: Implement hook_media_bulk_upload_file_ids_alter(array &$file_ids, string $media_bulk_config_id),
    invoked in the form's submitForm before the media-creation batch.
  bundle: media_bulk_upload
  rubric_ref: rubric/media_bulk_upload_mbu_alter_hook@1.0
  tags:
  - mode:recipe
- id: mbu-dependencies
  input: What does Media Bulk Upload require to run, and which submodule provides a drag-and-drop uploader?
  criteria: It depends on core Media (drupal:media). The media_bulk_upload_dropzonejs submodule provides
    DropzoneJS drag-and-drop uploads (and requires the dropzonejs module).
  bundle: media_bulk_upload
  rubric_ref: rubric/media_bulk_upload_mbu_dependencies@1.0
  tags:
  - mode:recipe
