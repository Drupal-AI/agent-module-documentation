rubrics:
- id: media_bulk_upload_mbu_config_entity
  version: '1.0'
  applicable_bundles:
  - media_bulk_upload
  checks:
  - kind: must_contain_any
    values:
    - media_bulk_config
    - /admin/config/media/media-bulk-config
    - entity.media_bulk_config.collection
  scoring:
    combine: all_pass
- id: media_bulk_upload_mbu_config_fields
  version: '1.0'
  applicable_bundles:
  - media_bulk_upload
  checks:
  - kind: must_contain_any
    values:
    - media_types
    - form_mode
    - upload_location
    - temporary://media-bulk-upload
  scoring:
    combine: all_pass
- id: media_bulk_upload_mbu_extension_matching
  version: '1.0'
  applicable_bundles:
  - media_bulk_upload
  checks:
  - kind: must_contain_any
    values:
    - extension
    - MediaTypeManager
    - file_extensions
  scoring:
    combine: all_pass
- id: media_bulk_upload_mbu_permissions
  version: '1.0'
  applicable_bundles:
  - media_bulk_upload
  checks:
  - kind: must_contain_any
    values:
    - administer media_bulk_upload configuration
    - 'use '
    - bulk upload form
  scoring:
    combine: all_pass
- id: media_bulk_upload_mbu_upload_routes
  version: '1.0'
  applicable_bundles:
  - media_bulk_upload
  checks:
  - kind: must_contain_any
    values:
    - /media/bulk-upload
    - media_bulk_upload.upload_form
    - media_bulk_upload.list
  scoring:
    combine: all_pass
- id: media_bulk_upload_mbu_alter_hook
  version: '1.0'
  applicable_bundles:
  - media_bulk_upload
  checks:
  - kind: must_contain_any
    values:
    - hook_media_bulk_upload_file_ids_alter
    - media_bulk_upload_file_ids_alter
  scoring:
    combine: all_pass
- id: media_bulk_upload_mbu_dependencies
  version: '1.0'
  applicable_bundles:
  - media_bulk_upload
  checks:
  - kind: must_contain_any
    values:
    - media
    - media_bulk_upload_dropzonejs
    - dropzonejs
  scoring:
    combine: all_pass
