rubrics:
- id: media_duplicates_md_restrict_settings
  version: '1.0'
  applicable_bundles:
  - media_duplicates
  checks:
  - kind: must_contain_any
    values:
    - restrict_duplicates
    - compare_within_bundle_only
    - restrict_new_media_only
    - media_duplicates.settings
  scoring:
    combine: all_pass
- id: media_duplicates_md_rebuild_command
  version: '1.0'
  applicable_bundles:
  - media_duplicates
  checks:
  - kind: must_contain_any
    values:
    - media-duplicates:checksums:rebuild
    - checksums:rebuild
  scoring:
    combine: all_pass
- id: media_duplicates_md_how_detected
  version: '1.0'
  applicable_bundles:
  - media_duplicates
  checks:
  - kind: must_contain_any
    values:
    - duplicates_checksum
    - checksum
    - SHA-256
    - sha256
  scoring:
    combine: all_pass
- id: media_duplicates_md_known_new_only
  version: '1.0'
  applicable_bundles:
  - media_duplicates
  checks:
  - kind: must_contain_any
    values:
    - restrict_new_media_only
    - new media only
    - only new
    - only NEW
    - only new media
  scoring:
    combine: all_pass
- id: media_duplicates_md_known_bundle_scope
  version: '1.0'
  applicable_bundles:
  - media_duplicates
  checks:
  - kind: must_contain_any
    values:
    - compare_within_bundle_only
    - same media type
    - same bundle
    - within the same
    - within-bundle
    - per-bundle
  scoring:
    combine: all_pass
- id: media_duplicates_md_restrict_new_only
  version: '1.0'
  applicable_bundles:
  - media_duplicates
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
- id: media_duplicates_md_restrict_within_bundle
  version: '1.0'
  applicable_bundles:
  - media_duplicates
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
