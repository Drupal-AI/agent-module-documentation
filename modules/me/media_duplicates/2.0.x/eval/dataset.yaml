metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: media_duplicates
  version: 2.0.x
  note: 'Media Duplicates hashes each media item''s source into a duplicates_checksum base field on presave
    and can block duplicate saves via a MediaUniqueChecksum constraint. Its persistent enforcement state
    is the config object media_duplicates.settings with three booleans: restrict_duplicates, restrict_new_media_only,
    compare_within_bundle_only. There is NO config/install file, so baseline is the object absent (all
    effectively FALSE). Medium cases seed known booleans and read them back; hard cases require the agent
    to set the booleans, verified against live config. Baseline restore = delete the media_duplicates.settings
    object. Checksum plugin type = MediaDuplicatesChecksum (built-ins File, OEmbed). Drush command id:
    media-duplicates:checksums:rebuild.'
questions:
- id: md-restrict-settings
  input: In the Media Duplicates module, which settings control whether and how duplicate media are blocked?
    Name the config object and the relevant keys.
  criteria: Config object media_duplicates.settings with booleans restrict_duplicates (master block switch),
    restrict_new_media_only (only block new items), and compare_within_bundle_only (only compare within
    the same media type).
  bundle: media_duplicates
  rubric_ref: rubric/media_duplicates_md_restrict_settings@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: md-rebuild-command
  input: I just installed Media Duplicates on a site that already has media. Which Drush command generates
    the missing duplicate checksums for the existing media?
  criteria: drush media-duplicates:checksums:rebuild <bundles|all> (e.g. `drush media-duplicates:checksums:rebuild
    all`). Same as the /admin/config/media/media-duplicates/refresh form.
  bundle: media_duplicates
  rubric_ref: rubric/media_duplicates_md_rebuild_command@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: md-how-detected
  input: How does Media Duplicates decide that two media entities are duplicates? What is stored on each
    media item?
  criteria: On presave it computes a checksum of the media's source (File plugin SHA-256 hashes the file
    contents; OEmbed plugin hashes the source value) and stores it in the revisionable base field duplicates_checksum;
    items with matching checksums are duplicates.
  bundle: media_duplicates
  rubric_ref: rubric/media_duplicates_md_how_detected@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: md-known-new-only
  input: 'Media Duplicates is configured to restrict duplicates on this site. Inspect the live configuration:
    is it blocking ALL media with a duplicate checksum, or only NEW media items?'
  criteria: 'Only new media — media_duplicates.settings has restrict_duplicates: true and restrict_new_media_only:
    true (compare_within_bundle_only: false).'
  bundle: media_duplicates
  rubric_ref: rubric/media_duplicates_md_known_new_only@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/media_duplicates-known-new-only-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/media_duplicates-known-new-only-cleanup.sh
