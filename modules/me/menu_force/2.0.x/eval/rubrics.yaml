rubrics:
- id: menu_force_menu_force_how_to_require
  version: '1.0'
  applicable_bundles:
  - menu_force
  checks:
  - kind: must_contain_any
    values:
    - menu_force
    - third_party_settings
    - third party setting
    - node.type
    - Menu settings
  scoring:
    combine: all_pass
- id: menu_force_menu_force_parent_lock
  version: '1.0'
  applicable_bundles:
  - menu_force
  checks:
  - kind: must_contain_any
    values:
    - menu_force_parent
    - parent
    - menu_parent
    - disabled
    - lock
  scoring:
    combine: all_pass
- id: menu_force_menu_force_deps_and_scope
  version: '1.0'
  applicable_bundles:
  - menu_force
  checks:
  - kind: must_contain_any
    values:
    - menu_ui
    - form
    - no settings page
    - no configure
    - UI
  scoring:
    combine: all_pass
- id: menu_force_menu_force_which_type_forced
  version: '1.0'
  applicable_bundles:
  - menu_force
  checks:
  - kind: must_contain_any
    values:
    - menu_force_evt
  scoring:
    combine: all_pass
- id: menu_force_menu_force_which_locks_parent
  version: '1.0'
  applicable_bundles:
  - menu_force
  checks:
  - kind: must_contain_any
    values:
    - menu_force_b
  scoring:
    combine: all_pass
- id: menu_force_menu_force_enable_require
  version: '1.0'
  applicable_bundles:
  - menu_force
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
- id: menu_force_menu_force_lock_parent_too
  version: '1.0'
  applicable_bundles:
  - menu_force
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
