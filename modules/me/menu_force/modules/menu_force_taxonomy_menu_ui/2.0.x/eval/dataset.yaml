metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: menu_force_taxonomy_menu_ui
  version: 2.0.x
  note: 'Submodule of Menu Force. Taxonomy counterpart: makes menu placement mandatory for terms in chosen
    vocabularies. Depends on the contrib taxonomy_menu_ui module (provides the menu widget on the term
    form). No configure route, no settings form, no permissions, no plugins, no Drush. Persistent state
    is two booleans stored on the taxonomy.vocabulary.<vid> config entity under provider menu_force_taxonomy_menu_ui:
    keys menu_force_taxonomy_menu_ui and menu_force_taxonomy_menu_ui_parent. (Note: the shipped schema
    key is taxonomy.vocabulary.*.third_party.menu_force but the value is stored under the menu_force_taxonomy_menu_ui
    provider.) All medium/hard cases are grounded in that real config on namespaced vocabularies (mfx_*).'
questions:
- id: menu_force_taxonomy_menu_ui-what
  input: I want taxonomy terms in a vocabulary to be required to appear in a menu, the same way Menu Force
    does for nodes. Which module/submodule provides this for taxonomy, what does it require, and how do
    I enable it for a vocabulary?
  criteria: The menu_force_taxonomy_menu_ui submodule (of Menu Force). It requires the contrib taxonomy_menu_ui
    module. Enable it on the vocabulary edit form by ticking 'Make the Menu Settings mandatory for this
    content type'; the choice is stored on taxonomy.vocabulary.<vid>.
  bundle: menu_force_taxonomy_menu_ui
  rubric_ref: rubric/menu_force_taxonomy_menu_ui_menu_force_taxonomy_menu_ui_what@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: menu_force_taxonomy_menu_ui-where-stored
  input: For the menu_force_taxonomy_menu_ui submodule, exactly which config entity and third-party-settings
    key store the 'menu is mandatory' flag for a vocabulary?
  criteria: 'It is stored on the taxonomy.vocabulary.<vid> config entity at third_party_settings.menu_force_taxonomy_menu_ui.menu_force_taxonomy_menu_ui:
    true (read with provider menu_force_taxonomy_menu_ui).'
  bundle: menu_force_taxonomy_menu_ui
  rubric_ref: rubric/menu_force_taxonomy_menu_ui_menu_force_taxonomy_menu_ui_where_stored@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: menu_force_taxonomy_menu_ui-parent-lock
  input: What does the 'Lock the Default parent item as well' option (menu_force_taxonomy_menu_ui_parent)
    do on the term form, and is term menu placement enforced for programmatic Term::create()->save() calls?
  criteria: 'menu_force_taxonomy_menu_ui_parent disables the parent-item selector on the term form so
    new terms are pinned under a fixed parent. Enforcement is form-level only (the menu link title is
    made #required), so programmatic Term::create()->save() is not blocked.'
  bundle: menu_force_taxonomy_menu_ui
  rubric_ref: rubric/menu_force_taxonomy_menu_ui_menu_force_taxonomy_menu_ui_parent_lock@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: menu_force_taxonomy_menu_ui-which-vocab
  input: On this Drupal site, one taxonomy vocabulary has menu_force_taxonomy_menu_ui enabled so that
    placing a term in a menu is mandatory. Inspect the live config and give the machine name (vid) of
    that vocabulary.
  criteria: 'The vocabulary is mfx_evt: taxonomy.vocabulary.mfx_evt has third_party_settings.menu_force_taxonomy_menu_ui.menu_force_taxonomy_menu_ui:
    true.'
  bundle: menu_force_taxonomy_menu_ui
  rubric_ref: rubric/menu_force_taxonomy_menu_ui_menu_force_taxonomy_menu_ui_which_vocab@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/menu_force_taxonomy_menu_ui-which-vocab-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/menu_force_taxonomy_menu_ui-which-vocab-cleanup.sh
- id: menu_force_taxonomy_menu_ui-which-locks-parent
  input: This site has two vocabularies, mfx_a and mfx_b, that both force term menu placement via menu_force_taxonomy_menu_ui.
    On exactly one the default parent item is also locked. Inspect the live config and state which vocabulary
    locks the parent.
  criteria: 'mfx_b locks the parent: taxonomy.vocabulary.mfx_b has third_party_settings.menu_force_taxonomy_menu_ui.menu_force_taxonomy_menu_ui_parent:
    true, whereas mfx_a has it false.'
  bundle: menu_force_taxonomy_menu_ui
  rubric_ref: rubric/menu_force_taxonomy_menu_ui_menu_force_taxonomy_menu_ui_which_locks_parent@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/menu_force_taxonomy_menu_ui-locks-parent-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/menu_force_taxonomy_menu_ui-locks-parent-cleanup.sh
- id: menu_force_taxonomy_menu_ui-enable-require
  input: On this Drupal site there is a taxonomy vocabulary mfx_task. Using the menu_force_taxonomy_menu_ui
    submodule, make placing a term in a menu mandatory for this vocabulary. Apply the change to the live
    site.
  criteria: Set taxonomy.vocabulary.mfx_task third_party_settings.menu_force_taxonomy_menu_ui.menu_force_taxonomy_menu_ui
    to TRUE (e.g. $vocab->setThirdPartySetting('menu_force_taxonomy_menu_ui','menu_force_taxonomy_menu_ui',TRUE)->save(),
    or tick the checkbox on the vocabulary edit form).
  bundle: menu_force_taxonomy_menu_ui
  rubric_ref: rubric/menu_force_taxonomy_menu_ui_menu_force_taxonomy_menu_ui_enable_require@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/menu_force_taxonomy_menu_ui-require-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/menu_force_taxonomy_menu_ui-require-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/menu_force_taxonomy_menu_ui-require-verify.sh
- id: menu_force_taxonomy_menu_ui-lock-parent-too
  input: On this Drupal site there is a taxonomy vocabulary mfx_lock. Using menu_force_taxonomy_menu_ui,
    make term menu placement mandatory for it AND also lock the default parent menu item. Apply the change
    to the live configuration.
  criteria: On taxonomy.vocabulary.mfx_lock set BOTH third_party_settings.menu_force_taxonomy_menu_ui.menu_force_taxonomy_menu_ui
    AND menu_force_taxonomy_menu_ui_parent to TRUE.
  bundle: menu_force_taxonomy_menu_ui
  rubric_ref: rubric/menu_force_taxonomy_menu_ui_menu_force_taxonomy_menu_ui_lock_parent_too@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/menu_force_taxonomy_menu_ui-lock-parent-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/menu_force_taxonomy_menu_ui-lock-parent-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/menu_force_taxonomy_menu_ui-lock-parent-verify.sh
