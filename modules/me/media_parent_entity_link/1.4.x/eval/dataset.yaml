metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: media_parent_entity_link
  version: 1.4.x
  note: 'Media - Parent Entity Link adds a ''Link to parent entity'' checkbox to the image field formatters
    of MEDIA entities (via hook_field_formatter_third_party_settings_form). It has no settings page (configure=null),
    no permissions, no Drush, no plugins. The checkbox appears only for a media entity''s field of type
    image whose formatter id is in InitialSettingsService::getFormatters() (default [''image'',''responsive_image'']);
    other modules extend that list via hook_media_parent_entity_link_alter_formatters(). Enabling it stores
    third_party_settings.media_parent_entity_link.link_to_parent = ''1'' on that formatter component in
    core.entity_view_display.media.<bundle>.<view_mode>. At render (hook_media_media_view) it walks $entity->_referringItem->getParent()->getParent()->getValue()
    to the parent (referencing) entity and sets each image #url to $parent->toUrl(). Cases are grounded
    in that real third-party setting on the site''s media Image displays (default view mode = field_media_image;
    media_library view mode = thumbnail); setup/reset/cleanup only add or remove this module''s own third-party
    key, restoring baseline exactly.'
questions:
- id: media_parent_entity_link-what-it-does
  input: What does the media_parent_entity_link module add, and where do I turn it on? It has no admin
    settings page.
  criteria: It adds a 'Link to parent entity' checkbox to a media entity's image field formatter on the
    media bundle's Manage display page. Ticking it stores third_party_settings.media_parent_entity_link.link_to_parent='1'
    on that formatter component in core.entity_view_display.media.<bundle>.<view_mode>; at render the
    media's image links to the referencing (parent) entity's URL.
  bundle: media_parent_entity_link
  rubric_ref: rubric/media_parent_entity_link_media_parent_entity_link_what_it_does@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: media_parent_entity_link-supported-formatters
  input: On which field formatters does the media_parent_entity_link 'Link to parent entity' option appear
    by default, and what kind of field does it require?
  criteria: 'The option appears only for a media entity''s field of type ''image'' whose formatter is
    in the default supported list: ''image'' and ''responsive_image'' (InitialSettingsService::getFormatters()).'
  bundle: media_parent_entity_link
  rubric_ref: rubric/media_parent_entity_link_media_parent_entity_link_supported_formatters@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: media_parent_entity_link-add-formatter
  input: I use the Blazy image formatter for my media. How can I make the media_parent_entity_link 'Link
    to parent entity' option available for another formatter like blazy?
  criteria: 'Implement hook_media_parent_entity_link_alter_formatters(&$formatters) in a custom module
    and append the formatter id, e.g. $formatters[] = ''blazy''; (you still need to confirm that formatter
    honors the injected #url).'
  bundle: media_parent_entity_link
  rubric_ref: rubric/media_parent_entity_link_media_parent_entity_link_add_formatter@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: media_parent_entity_link-known-field
  input: On this Drupal site, the media Image type's default display has one image field whose formatter
    is configured with media_parent_entity_link to link to the parent entity. Inspect the live view-display
    configuration and give the machine name of that field.
  criteria: 'The field is field_media_image: in core.entity_view_display.media.image.default its image
    formatter component has third_party_settings.media_parent_entity_link.link_to_parent = ''1''.'
  bundle: media_parent_entity_link
  rubric_ref: rubric/media_parent_entity_link_media_parent_entity_link_known_field@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/media_parent_entity_link-known-field-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/media_parent_entity_link-known-field-cleanup.sh
- id: media_parent_entity_link-known-viewmode
  input: On this site, exactly one view display of the media Image type has media_parent_entity_link's
    'Link to parent entity' enabled on its image formatter. Inspect the live configuration and state which
    view mode (display) that is.
  criteria: 'It is the media_library view display: core.entity_view_display.media.image.media_library
    has its ''thumbnail'' image component with third_party_settings.media_parent_entity_link.link_to_parent
    = ''1''; the default display does not.'
  bundle: media_parent_entity_link
  rubric_ref: rubric/media_parent_entity_link_media_parent_entity_link_known_viewmode@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/media_parent_entity_link-known-viewmode-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/media_parent_entity_link-known-viewmode-cleanup.sh
- id: media_parent_entity_link-enable-default
  input: On this Drupal site, use the media_parent_entity_link module to configure the media Image type's
    DEFAULT view display so that the image field (field_media_image) links to the parent (referencing)
    entity. Apply the change to the live site.
  criteria: In core.entity_view_display.media.image.default the field_media_image image formatter component
    carries third_party_settings.media_parent_entity_link.link_to_parent = '1' (e.g. set the component's
    third_party_settings and save, or tick 'Link to parent entity' on the formatter in Manage display).
  bundle: media_parent_entity_link
  rubric_ref: rubric/media_parent_entity_link_media_parent_entity_link_enable_default@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/media_parent_entity_link-enable-default-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/media_parent_entity_link-enable-default-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/media_parent_entity_link-enable-default-verify.sh
- id: media_parent_entity_link-enable-library
  input: When my media images show up in the media library grid, I want each thumbnail to link to the
    page that uses it. Using the media_parent_entity_link module, turn on 'link to parent entity' for
    the media Image type's media_library display (its thumbnail image), and save it live.
  criteria: In core.entity_view_display.media.image.media_library the 'thumbnail' image formatter component
    carries third_party_settings.media_parent_entity_link.link_to_parent = '1'.
  bundle: media_parent_entity_link
  rubric_ref: rubric/media_parent_entity_link_media_parent_entity_link_enable_library@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: site-owner
    reset: agent-module-documentation/evaluation/verify/media_parent_entity_link-enable-library-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/media_parent_entity_link-enable-library-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/media_parent_entity_link-enable-library-verify.sh
