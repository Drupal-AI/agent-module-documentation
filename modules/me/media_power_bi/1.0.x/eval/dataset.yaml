metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: media_power_bi
  version: 1.0.x
  note: 'Media Power BI provides a media source plugin media_power_bi (label ''Media Power BI'') whose
    source field is string_long, plus a matching display formatter media_power_bi (settings width default
    100%, height default 900px) and a validation constraint media_power_bi that requires the URL host
    to be app.powerbi.com / app.powerbigov.us / app.high.powerbigov.us / app.mil.powerbigov.us. Depends
    on core media + media_library. No config route, no permissions, no schema. The persistent state is
    a media type whose source is media_power_bi (config media.type.<id> -> source, source_configuration.source_field).
    Medium reads back the source plugin / source field of a known media type; hard creates a media type
    using the media_power_bi source, verified against the live media type config. All fixtures are namespaced:
    media type ids mpb_*, source fields field_mpb_* (string_long on the media entity type).'
questions:
- id: media_power_bi-source-basics
  input: The Drupal contrib module media_power_bi lets you embed Microsoft Power BI reports as Media.
    What is the media source plugin id it provides and what field type is its source field?
  criteria: It provides the media source plugin media_power_bi ('Media Power BI') whose source field is
    a string_long (long text) holding the Power BI embed URL.
  bundle: media_power_bi
  rubric_ref: rubric/media_power_bi_media_power_bi_source_basics@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: media_power_bi-valid-hosts
  input: Which URLs does media_power_bi accept as valid Power BI embeds? Name at least one allowed host
    and what happens if the URL host is not one of them.
  criteria: Its validation constraint accepts only hosts app.powerbi.com, app.powerbigov.us, app.high.powerbigov.us,
    and app.mil.powerbigov.us (checked by MediaPowerBiHelper::isValidPowerBiUrl()). Any other host (or
    an empty value) fails validation with a message telling the editor to re-copy from Power BI's share/embed
    dialog.
  bundle: media_power_bi
  rubric_ref: rubric/media_power_bi_media_power_bi_valid_hosts@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: media_power_bi-setup
  input: How do I set up media_power_bi so editors can add Power BI embeds, and is there an admin settings
    page to configure first?
  criteria: There is no configure route or settings page. You create a Media type and choose 'Media Power
    BI' as its media source (which creates the string_long source field); then editors add embeds via
    the Media Library 'Embed Code' textarea or a media reference field. It requires core media and media_library.
  bundle: media_power_bi
  rubric_ref: rubric/media_power_bi_media_power_bi_setup@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: media_power_bi-known-source
  input: On this Drupal site there is a media type with the machine id mpb_powerbi. Inspect the live media
    type configuration and tell me which media source plugin it uses.
  criteria: 'The media type mpb_powerbi uses the media source plugin media_power_bi (media.type.mpb_powerbi
    -> source: media_power_bi).'
  bundle: media_power_bi
  rubric_ref: rubric/media_power_bi_media_power_bi_known_source@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/media_power_bi-known-source-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/media_power_bi-known-source-cleanup.sh
- id: media_power_bi-known-field
  input: This site has a Media Power BI media type with machine id mpb_gov. Inspect it on the running
    site and state the machine name of its configured source field and that field's field type.
  criteria: media.type.mpb_gov has source_configuration.source_field = field_mpb_gov, and field_mpb_gov
    is a string_long field on the media entity type.
  bundle: media_power_bi
  rubric_ref: rubric/media_power_bi_media_power_bi_known_field@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/media_power_bi-known-field-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/media_power_bi-known-field-cleanup.sh
- id: media_power_bi-create-type
  input: On this Drupal site, create a new media type with the machine id mpb_report that uses the Media
    Power BI media source so editors can embed Power BI reports. Apply it to the live site.
  criteria: Create media type mpb_report with source = media_power_bi (and a string_long source field,
    e.g. field_mpb_report, referenced by source_configuration.source_field). Verify requires media.type.mpb_report
    to exist with source media_power_bi.
  bundle: media_power_bi
  rubric_ref: rubric/media_power_bi_media_power_bi_create_type@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/media_power_bi-create-type-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/media_power_bi-create-type-reset.sh
    verify: agent-module-documentation/evaluation/verify/media_power_bi-create-type-verify.sh
- id: media_power_bi-create-full
  input: 'Create a fully wired Media Power BI media type on this site with machine id mpb_dash: it must
    use the media_power_bi source and have a string_long source field configured as its source field.
    Apply it to the live site.'
  criteria: Create media type mpb_dash with source media_power_bi and a string_long source field (e.g.
    field_mpb_dash) wired via source_configuration.source_field. Verify requires source == media_power_bi
    and the source field to be string_long.
  bundle: media_power_bi
  rubric_ref: rubric/media_power_bi_media_power_bi_create_full@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/media_power_bi-create-full-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/media_power_bi-create-full-reset.sh
    verify: agent-module-documentation/evaluation/verify/media_power_bi-create-full-verify.sh
