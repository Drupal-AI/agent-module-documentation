metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: media_qualtrics
  version: 1.0.x
  note: Media Qualtrics adds a Media Remote field formatter (plugin id media_qualtrics, label 'Remote
    Media - Qualtrics') for string fields that renders an allowed-host Qualtrics URL as an iframe. Its
    only persistent state is the simple config object media_qualtrics.settings.allowed_hosts (sequence
    of https:// domains, shipped default ['https://qualtrics.com']); the settings form is at /admin/config/media/qualtrics
    (route media_qualtrics.allowed_hosts_settings, permission 'administer qualtrics allowed hosts'). It
    depends on media_remote and, if csp is installed, appends the allowed hosts to frame-src. All medium/hard
    cases are grounded in this local config object - no live Qualtrics API calls and no field/entity creation.
questions:
- id: media_qualtrics-how-it-renders
  input: In Drupal, how does the media_qualtrics module display a Qualtrics survey URL that an editor
    has entered? What kind of field does it work on and what is the field formatter called?
  criteria: It provides a field formatter (plugin id media_qualtrics, label 'Remote Media - Qualtrics')
    for plain string fields, built on media_remote. A string field value holding a Qualtrics URL is rendered
    as an auto-resizing <iframe class="qualtrics-embed-container"> via the media_qualtrics theme/template,
    with a fallback link.
  bundle: media_qualtrics
  rubric_ref: rubric/media_qualtrics_media_qualtrics_how_it_renders@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: media_qualtrics-allowed-hosts-config
  input: The media_qualtrics module only renders survey URLs from approved hosts. Where do I configure
    the list of allowed Qualtrics hosts, and in which config object is it stored?
  criteria: Configure it at /admin/config/media/qualtrics (route media_qualtrics.allowed_hosts_settings,
    permission 'administer qualtrics allowed hosts'), one host per line. It is stored in the media_qualtrics.settings
    config object under allowed_hosts (a sequence of https:// domains; default ['https://qualtrics.com']).
  bundle: media_qualtrics
  rubric_ref: rubric/media_qualtrics_media_qualtrics_allowed_hosts_config@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: media_qualtrics-deps-and-csp
  input: What module does media_qualtrics depend on, and what does it do automatically when the Content
    Security Policy (CSP) module is enabled?
  criteria: It depends on media_remote (the formatter extends MediaRemoteFormatterBase). When the csp
    module is enabled, an event subscriber on csp.policy_alter appends the configured allowed hosts to
    the frame-src directive on non-admin routes so the Qualtrics iframes are not blocked.
  bundle: media_qualtrics
  rubric_ref: rubric/media_qualtrics_media_qualtrics_deps_and_csp@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: media_qualtrics-known-host
  input: This Drupal site has media_qualtrics configured with an extra allowed Qualtrics host beyond the
    default. Inspect the live configuration and list all hosts that are currently allowed for Qualtrics
    embeds.
  criteria: The media_qualtrics.settings config object lists allowed_hosts = ['https://qualtrics.com',
    'https://mq-known.qualtrics.example.com']; read it with `drush cget media_qualtrics.settings allowed_hosts`.
  bundle: media_qualtrics
  rubric_ref: rubric/media_qualtrics_media_qualtrics_known_host@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/media_qualtrics-allowed-host-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/media_qualtrics-allowed-host-cleanup.sh
- id: media_qualtrics-multihost
  input: media_qualtrics on this site is configured to permit several Qualtrics hosts. Inspect the live
    configuration and state whether embeds from https://eu.mqknown.example.com are currently allowed,
    and how many hosts are configured in total.
  criteria: 'Yes - https://eu.mqknown.example.com is in media_qualtrics.settings allowed_hosts, which
    contains three hosts: https://qualtrics.com, https://eu.mqknown.example.com, https://survey.mqknown.example.com.'
  bundle: media_qualtrics
  rubric_ref: rubric/media_qualtrics_media_qualtrics_multihost@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/media_qualtrics-multihost-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/media_qualtrics-multihost-cleanup.sh
- id: media_qualtrics-add-host
  input: On this Drupal site, allow the custom Qualtrics vanity domain https://survey.mqtask.example.com
    to be embedded via media_qualtrics, keeping the existing default host too. Apply the change to the
    live site configuration.
  criteria: Add 'https://survey.mqtask.example.com' to media_qualtrics.settings allowed_hosts (e.g. edit
    at /admin/config/media/qualtrics or `drush cset`/config API), so allowed_hosts contains both https://qualtrics.com
    and https://survey.mqtask.example.com.
  bundle: media_qualtrics
  rubric_ref: rubric/media_qualtrics_media_qualtrics_add_host@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/media_qualtrics-add-host-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/media_qualtrics-add-host-reset.sh
    verify: agent-module-documentation/evaluation/verify/media_qualtrics-add-host-verify.sh
- id: media_qualtrics-restrict-single
  input: Lock down media_qualtrics on this site so that the ONLY host allowed for Qualtrics embeds is
    https://only.mqtask.example.com. Remove any other hosts. Apply the change to the live site.
  criteria: Set media_qualtrics.settings allowed_hosts to exactly ['https://only.mqtask.example.com']
    (replace the whole sequence).
  bundle: media_qualtrics
  rubric_ref: rubric/media_qualtrics_media_qualtrics_restrict_single@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/media_qualtrics-restrict-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/media_qualtrics-restrict-reset.sh
    verify: agent-module-documentation/evaluation/verify/media_qualtrics-restrict-verify.sh
