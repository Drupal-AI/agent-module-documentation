metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: media_entity_generic
  version: 1.3.x
  note: 'Media Entity Generic ships exactly one core-Media source plugin: Drupal\media_entity_generic\Plugin\media\Source\Generic,
    @MediaSource(id = ''generic'', allowed_field_types = {''string''}, default_thumbnail_filename = ''generic.png''),
    extends MediaSourceBase, getMetadataAttributes() returns [], createSourceFieldStorage() sets custom_storage=TRUE.
    No settings form, no configure route, no permissions, no Drush, no services. A media type using it
    is a media.type.<id> config entity with source: generic and source_configuration.source_field: <string
    field>. Historically an upgrade bridge from contrib Media Entity 1.x''s ''Generic'' provider to Media
    in core; hook_requirements blocks install while media_entity < 8.x-2 is enabled. Medium/hard cases
    are grounded in real media_type config, verified against live media types (prefixed meg_) and their
    string source fields (field_meg_*).'
questions:
- id: media_entity_generic-plugin-id
  input: What does the Drupal media_entity_generic module provide, and what is the machine id of the media
    source plugin it adds?
  criteria: It provides a single core-Media source plugin with id 'generic' ('Generic media'), a MediaSourceBase
    subclass that stores an arbitrary string value as the media's source field and uses a generic placeholder
    thumbnail.
  bundle: media_entity_generic
  rubric_ref: rubric/media_entity_generic_media_entity_generic_plugin_id@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: media_entity_generic-field-type
  input: If I create a Drupal media type using the 'Generic' media source from media_entity_generic, what
    field type is its source field, and does the source expose any metadata attributes?
  criteria: The Generic source allows only the 'string' field type (allowed_field_types = {"string"}),
    so its source field is a plain text string. It exposes no metadata attributes (getMetadataAttributes()
    returns an empty array).
  bundle: media_entity_generic
  rubric_ref: rubric/media_entity_generic_media_entity_generic_field_type@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: media_entity_generic-purpose
  input: Why does the Drupal media_entity_generic module exist and when would it be enabled automatically?
  criteria: It is a bridge that lets sites using the contributed Media Entity 1.x 'Generic' provider upgrade
    to Media in core (Drupal 8.4+); during that upgrade the module is enabled automatically. hook_requirements()
    blocks installation while contrib media_entity 1.x is still enabled.
  bundle: media_entity_generic
  rubric_ref: rubric/media_entity_generic_media_entity_generic_purpose@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: media_entity_generic-which-source
  input: This Drupal site has a media type with machine name 'meg_known'. Inspect the live configuration
    and state which media source plugin it uses.
  criteria: 'The media type meg_known uses the ''generic'' media source (media.type.meg_known -> source:
    generic).'
  bundle: media_entity_generic
  rubric_ref: rubric/media_entity_generic_media_entity_generic_which_source@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/media_entity_generic-known-source-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/media_entity_generic-known-source-cleanup.sh
- id: media_entity_generic-source-field
  input: The media type 'meg_field' on this site uses the Generic media source. Inspect the live configuration
    and give the machine name of its source field.
  criteria: 'Its source field is field_meg_code: media.type.meg_field -> source_configuration.source_field
    = field_meg_code.'
  bundle: media_entity_generic
  rubric_ref: rubric/media_entity_generic_media_entity_generic_source_field@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/media_entity_generic-known-field-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/media_entity_generic-known-field-cleanup.sh
- id: media_entity_generic-create-type
  input: On this Drupal site, create a new media type with machine name 'meg_task' that uses the 'Generic'
    media source provided by media_entity_generic. Apply it to the live site.
  criteria: 'Create media.type.meg_task with source: generic (MediaType::create([''id''=>''meg_task'',''label''=>...,''source''=>''generic''])->save()),
    typically also creating and wiring a string source field via the source''s createSourceField().'
  bundle: media_entity_generic
  rubric_ref: rubric/media_entity_generic_media_entity_generic_create_type@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/media_entity_generic-create-type-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/media_entity_generic-create-type-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/media_entity_generic-create-type-verify.sh
- id: media_entity_generic-create-type-with-field
  input: On this Drupal site, create a media type 'meg_task2' that uses the Generic media source (media_entity_generic)
    and whose source field is a string field with machine name 'field_meg_ref'. Wire the source field
    up and apply it to the live site.
  criteria: 'Create media.type.meg_task2 with source: generic, create a ''string'' FieldStorageConfig/FieldConfig
    named field_meg_ref on the media entity/meg_task2 bundle, and set source_configuration.source_field
    = field_meg_ref.'
  bundle: media_entity_generic
  rubric_ref: rubric/media_entity_generic_media_entity_generic_create_type_with_field@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/media_entity_generic-create-type-field-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/media_entity_generic-create-type-field-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/media_entity_generic-create-type-field-verify.sh
