rubrics:
- id: media_entity_generic_media_entity_generic_plugin_id
  version: '1.0'
  applicable_bundles:
  - media_entity_generic
  checks:
  - kind: must_contain_any
    values:
    - generic
    - media source
    - MediaSource
  scoring:
    combine: all_pass
- id: media_entity_generic_media_entity_generic_field_type
  version: '1.0'
  applicable_bundles:
  - media_entity_generic
  checks:
  - kind: must_contain_any
    values:
    - string
    - no metadata
    - getMetadataAttributes
    - empty
  scoring:
    combine: all_pass
- id: media_entity_generic_media_entity_generic_purpose
  version: '1.0'
  applicable_bundles:
  - media_entity_generic
  checks:
  - kind: must_contain_any
    values:
    - media_entity
    - Media in core
    - upgrade
    - bridge
  scoring:
    combine: all_pass
- id: media_entity_generic_media_entity_generic_which_source
  version: '1.0'
  applicable_bundles:
  - media_entity_generic
  checks:
