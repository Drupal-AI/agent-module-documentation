metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: menu_delete
  version: 2.4.x
  note: 'Menu Delete is a UI-only module: hook_form_alter() adds a per-row Delete checkbox and a ''Delete
    selected'' button to the core menu_edit_form, then a confirm form at route menu_delete.multiple_delete_confirm
    (/admin/structure/menu/manage/{menu}/menu-delete-items, permission ''administer menu'') deletes the
    chosen menu_link_content entities by UUID. Only content links (isDeletable()) get a checkbox; code-defined
    links do not. No config, no schema, no Drush command, no new permission. Because the deliverable is
    deletion of menu_link_content links, medium cases inspect the content links of a live menu, and hard
    cases delete menu_link_content links (all of one menu, or a selective subset) verified against live
    menu state via core entity queries.'
questions:
- id: menu_delete-how-to-bulk-delete
  input: Using the Drupal contrib module Menu Delete, how do I delete many links from a menu at once,
    and what permission is required?
  criteria: On Structure -> Menus, edit the menu; Menu Delete adds a Delete checkbox per link and a 'Delete
    selected' button, which sends you to a confirm form (route menu_delete.multiple_delete_confirm at
    /admin/structure/menu/manage/{menu}/menu-delete-items) to confirm. It requires the core 'administer
    menu' permission.
  bundle: menu_delete
  rubric_ref: rubric/menu_delete_menu_delete_how_to_bulk_delete@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: menu_delete-which-links
  input: With Menu Delete, which menu links can actually be selected and deleted, and which cannot?
  criteria: 'Only deletable links get a checkbox: content menu links (menu_link_content entities), where
    $item->link->isDeletable() is TRUE. Links defined in code (*.links.menu.yml) are not deletable and
    show no checkbox.'
  bundle: menu_delete
  rubric_ref: rubric/menu_delete_menu_delete_which_links@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: menu_delete-drush-or-ui
  input: Does Menu Delete (version 2.4.x) provide a Drush command, or is its bulk deletion triggered through
    the admin UI? How is the selection carried to the confirmation step?
  criteria: It is UI-only in this version (no Drush command). You select links on the core menu edit form
    and click 'Delete selected'; the chosen items are stored in the private tempstore 'menu_delete_item_confirm'
    (keyed by user) and carried to the confirm form which deletes them.
  bundle: menu_delete
  rubric_ref: rubric/menu_delete_menu_delete_drush_or_ui@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: menu_delete-count-links
  input: This site has a menu with machine name 'md_known'. Inspect the live site and state how many content
    (menu_link_content) links it currently contains.
  criteria: The md_known menu contains 3 content links (MD Alpha, MD Bravo, MD Charlie). Count via a menu_link_content
    entity query filtered on menu_name = md_known.
  bundle: menu_delete
  rubric_ref: rubric/menu_delete_menu_delete_count_links@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
