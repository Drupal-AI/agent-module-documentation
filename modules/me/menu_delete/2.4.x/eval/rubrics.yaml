rubrics:
- id: menu_delete_menu_delete_how_to_bulk_delete
  version: '1.0'
  applicable_bundles:
  - menu_delete
  checks:
  - kind: must_contain_any
    values:
    - Delete selected
    - administer menu
    - menu-delete-items
    - menu_edit_form
    - Structure
  scoring:
    combine: all_pass
- id: menu_delete_menu_delete_which_links
  version: '1.0'
  applicable_bundles:
  - menu_delete
  checks:
  - kind: must_contain_any
    values:
    - menu_link_content
    - isDeletable
    - content
    - code
  scoring:
    combine: all_pass
- id: menu_delete_menu_delete_drush_or_ui
  version: '1.0'
  applicable_bundles:
  - menu_delete
  checks:
  - kind: must_contain_any
    values:
    - UI
    - menu edit
    - Delete selected
    - tempstore
    - confirm
  scoring:
    combine: all_pass
- id: menu_delete_menu_delete_count_links
  version: '1.0'
  applicable_bundles:
  - menu_delete
  checks:
  - kind: must_contain_any
    values:
    - '3'
    - three
  scoring:
    combine: all_pass
- id: menu_delete_menu_delete_find_link_title
  version: '1.0'
  applicable_bundles:
  - menu_delete
  checks:
  - kind: must_contain_any
    values:
    - MD Findme Link
    - MD Findme
  scoring:
    combine: all_pass
- id: menu_delete_menu_delete_clear_menu
  version: '1.0'
  applicable_bundles:
  - menu_delete
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
- id: menu_delete_menu_delete_partial
  version: '1.0'
  applicable_bundles:
  - menu_delete
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
