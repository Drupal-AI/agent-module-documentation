rubrics:
- id: menu_position_menu_position_condition_plugins
  version: '1.0'
  applicable_bundles:
  - menu_position
  checks:
  - kind: must_contain_any
    values:
    - condition
    - Condition
    - plugin.manager.condition
    - entity_bundle:node
    - request_path
  scoring:
    combine: all_pass
- id: menu_position_menu_position_link_display_options
  version: '1.0'
  applicable_bundles:
  - menu_position
  checks:
  - kind: must_contain_any
    values:
    - link_display
    - menu_position.settings
  scoring:
    combine: all_pass
- id: menu_position_menu_position_mechanism
  version: '1.0'
  applicable_bundles:
  - menu_position
  checks:
  - kind: must_contain_any
    values:
    - menu.active_trail
    - active trail
    - decorates
    - MenuPositionActiveTrail
  scoring:
    combine: all_pass
- id: menu_position_menu_position_known_rule
  version: '1.0'
  applicable_bundles:
  - menu_position
  checks:
  - kind: must_contain_any
    values:
    - mp_intro_a
  scoring:
    combine: all_pass
- id: menu_position_menu_position_link_display
  version: '1.0'
  applicable_bundles:
  - menu_position
  checks:
  - kind: must_contain_any
    values:
    - child
  scoring:
    combine: all_pass
- id: menu_position_menu_position_article_rule
  version: '1.0'
  applicable_bundles:
  - menu_position
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
- id: menu_position_menu_position_path_rule
  version: '1.0'
  applicable_bundles:
  - menu_position
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
