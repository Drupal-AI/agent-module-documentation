rubrics:
- id: menu_select_menu_select_search_toggle
  version: '1.0'
  applicable_bundles:
  - menu_select
  checks:
  - kind: must_contain_any
    values:
    - search_enabled
    - menu_select.settings
    - /admin/config/content/menu_select
  scoring:
    combine: all_pass
- id: menu_select_menu_select_permission
  version: '1.0'
  applicable_bundles:
  - menu_select
  checks:
  - kind: must_contain_any
    values:
    - use menu select search
  scoring:
    combine: all_pass
- id: menu_select_menu_select_how_replaced
  version: '1.0'
  applicable_bundles:
  - menu_select
  checks:
  - kind: must_contain_any
    values:
    - menu.parent_form_selector
    - decorat
    - menu_select_tree
    - MenuParentFormSelector
  scoring:
    combine: all_pass
- id: menu_select_menu_select_live_search_value
  version: '1.0'
  applicable_bundles:
  - menu_select
  checks:
  - kind: must_contain_any
    values:
    - 'false'
    - disabled
    - 'off'
    - not enabled
  scoring:
    combine: all_pass
- id: menu_select_menu_select_live_search_role
  version: '1.0'
  applicable_bundles:
  - menu_select
  checks:
  - kind: must_contain_any
    values:
    - menu_select_searcher
  scoring:
    combine: all_pass
- id: menu_select_menu_select_disable_search
  version: '1.0'
  applicable_bundles:
  - menu_select
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
- id: menu_select_menu_select_grant_search_role
  version: '1.0'
  applicable_bundles:
  - menu_select
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
