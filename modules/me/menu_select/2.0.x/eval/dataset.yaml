metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: menu_select
  version: 2.0.x
  note: 'Menu Select replaces the core parent-item select by decorating the menu.parent_form_selector
    service and rendering a custom menu_select_tree form element. Its only config is menu_select.settings:search_enabled
    (boolean, default true) editable at /admin/config/content/menu_select, and its only permission is
    ''use menu select search'' (restrict access: true). It has no configure route in info.yml (data.json
    configure=null) and defines no plugin types. Medium cases read back a toggled search_enabled and a
    role grant; hard cases set the config off and create a role with the permission, both verified against
    live state.'
questions:
- id: menu_select-search-toggle
  input: On a Drupal site using the menu_select module, which configuration object and key turn the parent-menu-link
    search box on or off, and at what admin path is the settings form?
  criteria: The boolean menu_select.settings:search_enabled (default true) toggles the autocomplete search
    box; edit it at /admin/config/content/menu_select (route menu_select.menu_select_config_form) or via
    `drush config:set menu_select.settings search_enabled 0`.
  bundle: menu_select
  rubric_ref: rubric/menu_select_menu_select_search_toggle@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: menu_select-permission
  input: Which permission does the menu_select module define to gate its parent-link search feature, and
    is it a restricted permission?
  criteria: 'menu_select defines the permission ''use menu select search'' (machine name ''use menu select
    search''). It is marked restrict access: true, and granting it also lets the user view links across
    all menus via the autocomplete. The search textfield only renders when the user has this permission
    AND search_enabled is true.'
  bundle: menu_select
  rubric_ref: rubric/menu_select_menu_select_permission@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: menu_select-how-replaced
  input: How does the menu_select module manage to replace the core 'Parent item' select list on every
    menu-link and node menu-settings form without patching core?
  criteria: 'It decorates the core menu.parent_form_selector service (MenuSelectParentFormSelector extends
    MenuParentFormSelector). Its parentSelectElement() calls the inner service then swaps the element''s
    #type to the custom menu_select_tree render element, so every place core asks for a parent picker
    gets the expandable tree/search widget instead.'
  bundle: menu_select
  rubric_ref: rubric/menu_select_menu_select_how_replaced@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: menu_select-live-search-value
  input: On this Drupal site, is the menu_select parent-link search box currently enabled or disabled?
    Inspect the live configuration and state the value of the relevant setting.
  criteria: 'It is disabled: menu_select.settings:search_enabled is false on the live site (drush config:get
    menu_select.settings search_enabled).'
  bundle: menu_select
  rubric_ref: rubric/menu_select_menu_select_live_search_value@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/menu_select-search-value-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/menu_select-search-value-cleanup.sh
- id: menu_select-live-search-role
  input: On this site, exactly one custom role has been granted the menu_select 'use menu select search'
    permission. Inspect the live role configuration and give the machine name of that role.
  criteria: The role machine name is menu_select_searcher; it holds the 'use menu select search' permission
    (drush role:list, or inspect user.role.menu_select_searcher).
  bundle: menu_select
  rubric_ref: rubric/menu_select_menu_select_live_search_role@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/menu_select-search-role-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/menu_select-search-role-cleanup.sh
- id: menu_select-disable-search
  input: On this Drupal site, disable the menu_select parent-link autocomplete search feature site-wide
    (leave only the tree widget). Apply the change to the live site.
  criteria: Set menu_select.settings:search_enabled to false (drush config:set menu_select.settings search_enabled
    0 -y, or untick 'Enable searching for a menu link' at /admin/config/content/menu_select). Verified
    when the live config value is boolean false.
  bundle: menu_select
  rubric_ref: rubric/menu_select_menu_select_disable_search@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/menu_select-disable-search-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/menu_select-disable-search-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/menu_select-disable-search-verify.sh
- id: menu_select-grant-search-role
  input: On this Drupal site, create a new role with machine name menu_select_navigator and grant it the
    menu_select 'use menu select search' permission. Apply the change to the live site.
  criteria: Create role menu_select_navigator (drush role:create menu_select_navigator) and add the permission
    (drush role:perm:add menu_select_navigator 'use menu select search'). Verified when the role exists
    and hasPermission('use menu select search') is true.
  bundle: menu_select
