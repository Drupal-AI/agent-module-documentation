rubrics:
- id: menu_migration_menu_migration_clone_command
  version: '1.0'
  applicable_bundles:
  - menu_migration
  checks:
  - kind: must_contain_any
    values:
    - quick-clone
    - mmqc
    - create-target
  scoring:
    combine: all_pass
- id: menu_migration_menu_migration_formats_destinations
  version: '1.0'
  applicable_bundles:
  - menu_migration
  checks:
  - kind: must_contain_any
    values:
    - json
    - yaml
    - raw
    - codebase
    - download
    - another_menu
    - file_upload
  scoring:
    combine: all_pass
- id: menu_migration_menu_migration_quick_export_no_entity
  version: '1.0'
  applicable_bundles:
  - menu_migration
  checks:
  - kind: must_contain_any
    values:
    - quick-export
    - mmqe
  scoring:
    combine: all_pass
- id: menu_migration_menu_migration_inspect_export_entity
  version: '1.0'
  applicable_bundles:
  - menu_migration
  checks:
  - kind: must_contain_any
    values:
    - codebase
  scoring:
    combine: all_pass
- id: menu_migration_menu_migration_inspect_quick_settings
  version: '1.0'
  applicable_bundles:
  - menu_migration
  checks:
  - kind: must_contain_any
    values:
    - mm_mig_quickdir
  scoring:
    combine: all_pass
- id: menu_migration_menu_migration_build_export_entity
  version: '1.0'
  applicable_bundles:
  - menu_migration
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
- id: menu_migration_menu_migration_clone_menu
  version: '1.0'
  applicable_bundles:
  - menu_migration
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
