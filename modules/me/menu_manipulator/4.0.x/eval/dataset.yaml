metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: menu_manipulator
  version: 4.0.x
  note: 'Menu Manipulator filters menu links by the current language and renders per-link icons. All persistent
    state is the menu_manipulator.settings config object: preprocess_menus_language (bool), preprocess_menus_language_use_entity
    (bool), preprocess_menus_language_list (map menu_name->menu_name|''''), preprocess_menus_icon (bool),
    preprocess_menus_icon_list (same map shape), menu_link_icon_list (string). The admin form is /admin/config/user-interface/menu-manipulator
    (route menu_manipulator.settings). A menu is ''active'' in a list when its value equals its own machine
    name, inactive when empty string. Medium cases read back a distinctive language list and the icon
    list from the live config; hard cases turn language filtering on for the tools menu and icons on for
    the main menu, verified against real config. Config is owned by this module; scripts restore shipped
    defaults.'
questions:
- id: menu_manipulator-config-object
  input: In the Menu Manipulator Drupal module, which config object holds its settings, and which setting
    decides whether a given menu's links are filtered by the current language?
  criteria: Settings live in menu_manipulator.settings. preprocess_menus_language is the master on/off
    switch; preprocess_menus_language_list is the per-menu map deciding which menus are language-filtered
    (a menu is active when its value equals its machine name).
  bundle: menu_manipulator
  rubric_ref: rubric/menu_manipulator_menu_manipulator_config_object@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: menu_manipulator-admin-route
  input: Where is the Menu Manipulator settings form in the Drupal admin, what is its route name, and
    which permission is required to reach it?
  criteria: The form is at Configuration > User interface > Menu Manipulator (/admin/config/user-interface/menu-manipulator),
    route menu_manipulator.settings, gated by the 'administer site configuration' permission.
  bundle: menu_manipulator
  rubric_ref: rubric/menu_manipulator_menu_manipulator_admin_route@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: menu_manipulator-service
  input: I want to filter a menu tree by the current language in custom code using Menu Manipulator. Which
    service and method should I call?
  criteria: Call the menu_manipulator.menu_tree_manipulators service (MenuLinkTreeManipulators) and its
    filterTreeByCurrentLanguage($tree) method; there is also a helper menu_manipulator_get_multilingual_menu($menu_name).
  bundle: menu_manipulator
  rubric_ref: rubric/menu_manipulator_menu_manipulator_service@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: menu_manipulator-known-lang-list
  input: On this Drupal site, inspect the Menu Manipulator configuration and state which menu is currently
    set to be filtered by the current language.
  criteria: In menu_manipulator.settings the preprocess_menus_language_list has only the 'account' menu
    active (value 'account'); all others are empty strings.
  bundle: menu_manipulator
  rubric_ref: rubric/menu_manipulator_menu_manipulator_known_lang_list@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/menu_manipulator-lang-known-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/menu_manipulator-lang-known-cleanup.sh
- id: menu_manipulator-known-icon-list
  input: Menu Manipulator on this site has a list of available menu-link icons configured. Inspect the
    live configuration and list those icon names.
  criteria: menu_manipulator.settings menu_link_icon_list is 'star,heart,home'.
  bundle: menu_manipulator
  rubric_ref: rubric/menu_manipulator_menu_manipulator_known_icon_list@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/menu_manipulator-icons-known-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/menu_manipulator-icons-known-cleanup.sh
- id: menu_manipulator-filter-tools
  input: On this Drupal site, configure Menu Manipulator so that the 'tools' menu has its links filtered
    by the current interface language. Apply the change to the live site.
  criteria: In menu_manipulator.settings, preprocess_menus_language_list.tools is set to 'tools' (its
    own machine name), enabling language filtering for the tools menu.
  bundle: menu_manipulator
  rubric_ref: rubric/menu_manipulator_menu_manipulator_filter_tools@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/menu_manipulator-filter-tools-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/menu_manipulator-filter-tools-reset.sh
    verify: agent-module-documentation/evaluation/verify/menu_manipulator-filter-tools-verify.sh
    unused_text_checks:
      must_contain_any: []
      must_not_contain: []
- id: menu_manipulator-icon-main
  input: Using Menu Manipulator on this site, enable per-link icon rendering for the 'main' menu (add
    the main menu to its icon list, with icon preprocessing turned on). Apply the change to the live site.
  criteria: In menu_manipulator.settings, preprocess_menus_icon is TRUE and preprocess_menus_icon_list.main
    is set to 'main'.
  bundle: menu_manipulator
  rubric_ref: rubric/menu_manipulator_menu_manipulator_icon_main@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/menu_manipulator-icon-main-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/menu_manipulator-icon-main-reset.sh
    verify: agent-module-documentation/evaluation/verify/menu_manipulator-icon-main-verify.sh
    unused_text_checks:
      must_contain_any: []
      must_not_contain: []
