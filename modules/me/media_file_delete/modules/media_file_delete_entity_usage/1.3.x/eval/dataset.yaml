metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: media_file_delete_entity_usage
  version: 1.3.x
  note: Submodule of media_file_delete. Adds an Entity Usage-backed file-usage resolver to the chain so
    referenced files are retained. Cases are `recipe` (response-graded); no site mutation.
questions:
- id: mfdeu-purpose
  input: On a Drupal site using Media File Delete and the Entity Usage module, I want file deletion to
    respect Entity Usage references. Which submodule do I enable and what does it do?
  criteria: Enable media_file_delete_entity_usage; it registers an EntityUsageResolver that reports Entity
    Usage references as file usage, so referenced files are retained instead of deleted.
  bundle: media_file_delete_entity_usage
  rubric_ref: rubric/media_file_delete_entity_usage_mfdeu_purpose@1.0
  tags:
  - mode:recipe
- id: mfdeu-mechanism
  input: How does media_file_delete_entity_usage integrate with Media File Delete's deletion checks?
  criteria: It provides a service (EntityUsageResolver) implementing FileUsageResolverInterface, tagged
    media_file_delete_file_usage_resolver, whose getFileUsages() returns count(entity_usage.usage->listSources($file,
    FALSE)); the chained resolver sums it with the others.
  bundle: media_file_delete_entity_usage
  rubric_ref: rubric/media_file_delete_entity_usage_mfdeu_mechanism@1.0
  tags:
  - mode:recipe
- id: mfdeu-dependencies
  input: What does the media_file_delete_entity_usage submodule depend on, and does it add any configuration
    or permissions?
  criteria: It depends on media_file_delete and entity_usage. It adds no configuration, permissions, routes,
    or UI — enabling it is all that is needed.
  bundle: media_file_delete_entity_usage
  rubric_ref: rubric/media_file_delete_entity_usage_mfdeu_dependencies@1.0
  tags:
  - mode:recipe
- id: mfdeu-effect
  input: With media_file_delete_entity_usage enabled, what happens when I try to delete a media item whose
    file is still embedded/referenced somewhere Entity Usage tracks?
  criteria: Entity Usage reports the reference as usage > 0, so the chained resolver keeps the file; the
    file is retained rather than deleted.
  bundle: media_file_delete_entity_usage
  rubric_ref: rubric/media_file_delete_entity_usage_mfdeu_effect@1.0
  tags:
  - mode:recipe
- id: mfdeu-priority
  input: In media_file_delete_entity_usage, is the Entity Usage count used instead of core file.usage,
    or in addition to it?
  criteria: 'In addition: ChainedFileUsageResolver sums the counts from every tagged resolver, so Entity
    Usage counts are added on top of core''s file.usage counts.'
  bundle: media_file_delete_entity_usage
  rubric_ref: rubric/media_file_delete_entity_usage_mfdeu_priority@1.0
  tags:
  - mode:recipe
