rubrics:
- id: media_alias_display_field_override_madfo_what_field
  version: '1.0'
  applicable_bundles:
  - media_alias_display_field_override
  checks:
  - kind: must_contain_any
    values:
    - field_override_mad_module
    - boolean
    - Override Media Alias Display
  scoring:
    combine: all_pass
- id: media_alias_display_field_override_madfo_what_happens
  version: '1.0'
  applicable_bundles:
  - media_alias_display_field_override
  checks:
  - kind: must_contain_any
    values:
    - normal
    - normally
    - not stream
    - does not stream
    - opt out
    - opts out
    - excluded
    - media page
    - skip
  scoring:
    combine: all_pass
- id: media_alias_display_field_override_madfo_new_bundles
  version: '1.0'
  applicable_bundles:
  - media_alias_display_field_override
  checks:
  - kind: must_contain_any
    values:
    - 'no'
    - not automatically
    - existing
    - install
    - manually
    - won't
    - will not
  scoring:
    combine: all_pass
- id: media_alias_display_field_override_madfo_find_override
  version: '1.0'
  applicable_bundles:
  - media_alias_display_field_override
  checks:
  - kind: must_contain_any
    values:
    - MAD Eval Override
  scoring:
    combine: all_pass
- id: media_alias_display_field_override_madfo_excluded_check
  version: '1.0'
  applicable_bundles:
  - media_alias_display_field_override
  checks:
  - kind: must_contain_any
    values:
    - 'yes'
    - excluded
    - override
    - 'true'
    - '1'
    - enabled
  scoring:
    combine: all_pass
- id: media_alias_display_field_override_madfo_set_override
  version: '1.0'
  applicable_bundles:
  - media_alias_display_field_override
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
- id: media_alias_display_field_override_madfo_keep_page
  version: '1.0'
  applicable_bundles:
  - media_alias_display_field_override
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
