    setup: agent-module-documentation/evaluation/verify/madfo-excluded-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/madfo-excluded-cleanup.sh
- id: madfo-set-override
  input: On this site there is a document media item named 'MAD Override Task'. Using the Media Alias
    Display Field Override submodule's field, configure that media entity so it overrides (opts out of)
    the Media Alias Display file-serving behavior. Save the change to the live site.
  criteria: The media entity 'MAD Override Task' has field_override_mad_module set truthy (1). e.g. $m->set('field_override_mad_module',
    TRUE)->save(); (or tick 'Override Media Alias Display' on the media edit form).
  bundle: media_alias_display_field_override
  rubric_ref: rubric/media_alias_display_field_override_madfo_set_override@1.0
  tags:
  - mode:execution
