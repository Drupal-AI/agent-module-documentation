- id: madfo-keep-page
  input: I have a document in my media library called 'MAD Keep Page'. Right now clicking its link opens
    the raw file, but I want that one item to show its normal media page instead. Make it so, and save
    it on the site.
  criteria: The media entity 'MAD Keep Page' has field_override_mad_module set truthy (1), so the parent
