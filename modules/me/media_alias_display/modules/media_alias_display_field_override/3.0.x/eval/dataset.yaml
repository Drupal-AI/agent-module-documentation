metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: media_alias_display_field_override
  version: 3.0.x
  note: This submodule adds a single boolean field field_override_mad_module (label 'Override Media Alias
    Display') to every existing media type on install, with a boolean_checkbox widget. When a media entity
    has that field truthy, the parent media_alias_display DisplayController renders the media normally
    instead of streaming its file. No config, routes, permissions, services or Drush. Medium cases create
    document media with the override on/off and read the flag back. Hard cases create a document media
    with the override OFF and require the agent to set field_override_mad_module = TRUE on it, verified
    against the live entity; reset recreates the media with the flag off so verify fails on empty state.
    (Media are created without a source file — save() does not run the field-required form constraint
    — which is enough to carry the override boolean.)
questions:
- id: madfo-what-field
  input: The Media Alias Display Field Override submodule adds a field to media. What is the field's machine
    name and type, and which media bundles get it?
  criteria: It installs a boolean field field_override_mad_module (label 'Override Media Alias Display')
    on every existing media type (bundle), with a boolean_checkbox widget.
  bundle: media_alias_display_field_override
  rubric_ref: rubric/media_alias_display_field_override_madfo_what_field@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: madfo-what-happens
  input: What happens to a media entity when its 'Override Media Alias Display' (field_override_mad_module)
    checkbox is ticked?
  criteria: 'That media entity is excluded from the file-streaming behavior: the parent module''s DisplayController
    renders it as a normal media page instead of serving the raw file. Other media of the same bundle
    are unaffected.'
  bundle: media_alias_display_field_override
  rubric_ref: rubric/media_alias_display_field_override_madfo_what_happens@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: madfo-new-bundles
  input: If I create a new media type after enabling Media Alias Display Field Override, will it automatically
    have the override field?
  criteria: No. The field is added to media types that exist at install time (in hook_install); media
    types created afterward do not get field_override_mad_module automatically — you must add it yourself.
  bundle: media_alias_display_field_override
  rubric_ref: rubric/media_alias_display_field_override_madfo_new_bundles@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: madfo-find-override
  input: 'This site has two document media items: ''MAD Eval Override'' and ''MAD Eval Normal''. Inspect
    the site and tell me which one is set to override Media Alias Display (i.e. has the override field
    enabled).'
  criteria: '''MAD Eval Override'' has field_override_mad_module = 1 (true); ''MAD Eval Normal'' has it
    0/false. Found e.g. via an entity query on media with field_override_mad_module = 1.'
  bundle: media_alias_display_field_override
  rubric_ref: rubric/media_alias_display_field_override_madfo_find_override@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/madfo-find-override-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/madfo-find-override-cleanup.sh
- id: madfo-excluded-check
  input: There is a document media item named 'MAD Eval Excluded' on this site. By inspecting its fields,
    determine whether it is currently excluded from the Media Alias Display file-serving behavior.
  criteria: 'Yes — it is excluded: media ''MAD Eval Excluded'' has field_override_mad_module = 1 (true),
    so the parent module renders it normally instead of streaming the file.'
  bundle: media_alias_display_field_override
  rubric_ref: rubric/media_alias_display_field_override_madfo_excluded_check@1.0
  tags:
  - mode:introspection
  - difficulty:medium
