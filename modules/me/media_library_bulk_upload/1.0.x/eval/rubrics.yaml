rubrics:
- id: media_library_bulk_upload_mlbu_config_key
  version: '1.0'
  applicable_bundles:
  - media_library_bulk_upload
  checks:
  - kind: must_contain_any
    values:
    - media_types
    - media_library_bulk_upload.settings
  scoring:
    combine: all_pass
- id: media_library_bulk_upload_mlbu_permission_pattern
  version: '1.0'
  applicable_bundles:
  - media_library_bulk_upload
  checks:
  - kind: must_contain_any
    values:
    - use media
    - bulk upload form
  scoring:
    combine: all_pass
- id: media_library_bulk_upload_mlbu_routes
  version: '1.0'
  applicable_bundles:
  - media_library_bulk_upload
  checks:
  - kind: must_contain_any
    values:
    - /admin/content/media/bulk-upload
    - media_library.bulk_upload.upload_form
  scoring:
    combine: all_pass
- id: media_library_bulk_upload_mlbu_inspect_restricted_types
  version: '1.0'
  applicable_bundles:
  - media_library_bulk_upload
  checks:
  - kind: must_contain_any
    values:
    - image
    - document
  scoring:
    combine: all_pass
- id: media_library_bulk_upload_mlbu_inspect_config_value
  version: '1.0'
  applicable_bundles:
  - media_library_bulk_upload
  checks:
  - kind: must_contain_any
    values:
    - media_types
    - media_library_bulk_upload.settings
  scoring:
    combine: all_pass
- id: media_library_bulk_upload_mlbu_restrict_types
  version: '1.0'
  applicable_bundles:
  - media_library_bulk_upload
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
- id: media_library_bulk_upload_mlbu_grant_permission
  version: '1.0'
  applicable_bundles:
  - media_library_bulk_upload
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
