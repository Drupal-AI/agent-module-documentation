metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: media_library_bulk_upload
  version: 1.0.x
  note: 'Media Library Bulk Upload adds a bulk-upload screen to the core Media Library. Its only configurable
    surface is (a) the config object media_library_bulk_upload.settings key `media_types` (which types
    are offered; empty = all) and (b) dynamic per-type permissions `use media {type} bulk upload form`
    (plus `administer media`). It defines no plugin types and no Drush commands, so execution tiers exercise
    config + permissions rather than plugin code. Cases span three tiers: `recipe` (easy, response-graded
    facts about routes, the config key, and permissions), `introspection` (medium — a known media-type
    restriction is set on the live site and the agent reads it back via drush), and `execution` (hard
    — the agent actually sets the restriction / grants a permission, verified against live site state).'
questions:
- id: mlbu-config-key
  input: On a Drupal 11 site using the Media Library Bulk Upload module, which config object and key limit
    which media types are offered on the bulk-upload screen, and what happens if that key is left empty?
  criteria: The config object media_library_bulk_upload.settings holds a `media_types` sequence of media-type
    ids. If it is empty (the install default), all media types are offered for bulk upload; otherwise
    only the listed types are.
  bundle: media_library_bulk_upload
  rubric_ref: rubric/media_library_bulk_upload_mlbu_config_key@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: mlbu-permission-pattern
  input: In the Media Library Bulk Upload module, what is the machine-name pattern of the dynamic permission
    that lets a role bulk-upload a given media type, and which single core permission grants access to
    everything the module exposes?
  criteria: Per media type the module defines `use media {media_type_id} bulk upload form` (e.g. `use
    media image bulk upload form`). The core `administer media` permission is a super-permission that
    grants the bulk-upload landing page and the settings form outright.
  bundle: media_library_bulk_upload
  rubric_ref: rubric/media_library_bulk_upload_mlbu_permission_pattern@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: mlbu-routes
  input: What are the paths of the Media Library Bulk Upload landing page and its per-media-type upload
    form on a Drupal site?
  criteria: The landing page listing bulk-uploadable types is at /admin/content/media/bulk-upload (route
    media_library.bulk_upload.list); a single type's upload form is at /admin/content/media/bulk-upload/{media_type}
    (route media_library.bulk_upload.upload_form).
  bundle: media_library_bulk_upload
  rubric_ref: rubric/media_library_bulk_upload_mlbu_routes@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: mlbu-inspect-restricted-types
  input: This Drupal site (drush available) has the Media Library Bulk Upload module configured to restrict
    which media types can be bulk-uploaded. Inspect the live site and tell me which media types are currently
    enabled for bulk upload.
  criteria: The media_library_bulk_upload.settings:media_types config restricts bulk upload to the Image
    and Document media types (values image, document); no other types are enabled.
  bundle: media_library_bulk_upload
  rubric_ref: rubric/media_library_bulk_upload_mlbu_inspect_restricted_types@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    persona: drupal-expert
    setup: agent-module-documentation/evaluation/verify/media_library_bulk_upload-intro-restricted-types-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/media_library_bulk_upload-intro-restricted-types-cleanup.sh
- id: mlbu-inspect-config-value
  input: On this Drupal site (drush available), read the Media Library Bulk Upload configuration and tell
    me the exact config object name and the current value of the key that controls which media types are
    offered.
  criteria: 'Config object media_library_bulk_upload.settings, key media_types, currently set to {image:
    image, document: document} — i.e. bulk upload is limited to Image and Document.'
  bundle: media_library_bulk_upload
  rubric_ref: rubric/media_library_bulk_upload_mlbu_inspect_config_value@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    persona: drupal-expert
    setup: agent-module-documentation/evaluation/verify/media_library_bulk_upload-intro-restricted-types-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/media_library_bulk_upload-intro-restricted-types-cleanup.sh
- id: mlbu-restrict-types
  input: On this Drupal site (drush available), configure the Media Library Bulk Upload module so that
    only the Image and Document media types can be bulk-uploaded (Audio, Video and Remote video must NOT
    be offered). Apply it to the live site so the restriction really takes effect; don't just describe
    it. One-line summary.
  criteria: The config object media_library_bulk_upload.settings key media_types is set so Image and Document
    are enabled (truthy values image, document) and Audio, Video, Remote video are not, applied to the
    live site. Verified against live site state.
  bundle: media_library_bulk_upload
  rubric_ref: rubric/media_library_bulk_upload_mlbu_restrict_types@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/media_library_bulk_upload-restrict-types-reset.sh
    verify: agent-module-documentation/evaluation/verify/media_library_bulk_upload-restrict-types-verify.sh
- id: mlbu-grant-permission
  input: On this Drupal site (drush available), give the `content_editor` role the ability to use the
    Media Library Bulk Upload form for the Image media type, using the module's dynamic per-type permission.
    Apply it to the live site; don't just describe it. One-line summary.
  criteria: The content_editor role is granted the permission `use media image bulk upload form`, applied
    to the live site so members can bulk-upload Image media. Verified against live site state.
  bundle: media_library_bulk_upload
  rubric_ref: rubric/media_library_bulk_upload_mlbu_grant_permission@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/media_library_bulk_upload-grant-permission-reset.sh
    verify: agent-module-documentation/evaluation/verify/media_library_bulk_upload-grant-permission-verify.sh
