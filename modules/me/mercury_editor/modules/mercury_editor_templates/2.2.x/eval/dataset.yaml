metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: mercury_editor_templates
  version: 2.2.x
  note: 'Mercury Editor Templates adds reusable section templates via the me_template CONTENT entity (base
    table me_template; revisionable, owner-tracked). No config schema. Ships seven permissions (administer/access
    overview/create/view/edit/delete/use mercury editor templates). The key runtime permission ''use mercury
    editor templates'' makes published (status=1) templates appear in Mercury''s add-component menu via
    a LayoutParagraphsAllowedTypesEvent subscriber. Routes: collection /admin/content/me-template, add
    /me-template/add, settings entity.me_template.settings at /admin/structure/me-template, save_as_template
    and insert_template. Medium/hard cases are grounded in the real me_template entity: introspection
    reads back a created template''s label/publish status; execution creates a template and verifies it
    against live storage. Scripts drush en the submodule and delete test templates to restore baseline.'
questions:
- id: mercury_editor_templates-entity
  input: In the mercury_editor_templates module, how does an editor turn a Mercury Editor section into
    something reusable, and what entity type stores those reusable templates?
  criteria: Editors use 'Save as template' (route mercury_editor_templates.save_as_template) to save the
    selected Layout Paragraphs section; templates are stored as me_template content entities and can be
    re-inserted.
  bundle: mercury_editor_templates
  rubric_ref: rubric/mercury_editor_templates_mercury_editor_templates_entity@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: mercury_editor_templates-use-permission
  input: Which permission from mercury_editor_templates must an editor have for published templates to
    appear in the Mercury Editor 'add component' menu?
  criteria: The 'use mercury editor templates' permission. Without it the LayoutParagraphsAllowedTypesEvent
    subscriber returns early and no templates are offered.
  bundle: mercury_editor_templates
  rubric_ref: rubric/mercury_editor_templates_mercury_editor_templates_use_permission@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: mercury_editor_templates-manage-path
  input: Where do you manage (list) all saved Mercury Editor templates, and are templates stored as configuration
    or as content?
  criteria: Manage them at the collection /admin/content/me-template. Templates are content entities (me_template),
    not configuration; there is no config schema.
  bundle: mercury_editor_templates
  rubric_ref: rubric/mercury_editor_templates_mercury_editor_templates_manage_path@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: mercury_editor_templates-known-label
  input: This Drupal site has a Mercury Editor template saved. Inspect the live me_template entities and
    tell me the label of the existing template.
  criteria: There is one me_template entity with label 'ME Known Template'. Query storage 'me_template'
    (e.g. loadMultiple) to read it.
  bundle: mercury_editor_templates
  rubric_ref: rubric/mercury_editor_templates_mercury_editor_templates_known_label@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
