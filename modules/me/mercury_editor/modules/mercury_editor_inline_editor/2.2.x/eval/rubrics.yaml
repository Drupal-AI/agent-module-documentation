rubrics:
- id: mercury_editor_inline_editor_mercury_editor_inline_editor_replacement
  version: '1.0'
  applicable_bundles:
  - mercury_editor_inline_editor
  checks:
  - kind: must_contain_any
    values:
    - mercury_editor_live_edit
    - live_edit
    - live edit
  scoring:
    combine: all_pass
- id: mercury_editor_inline_editor_mercury_editor_inline_editor_no_code
  version: '1.0'
  applicable_bundles:
  - mercury_editor_inline_editor
  checks:
  - kind: must_contain_any
    values:
    - 'no'
    - info.yml
    - deprecated
    - empty
    - placeholder
  scoring:
    combine: all_pass
- id: mercury_editor_inline_editor_mercury_editor_inline_editor_dependency
  version: '1.0'
  applicable_bundles:
  - mercury_editor_inline_editor
  checks:
  - kind: must_contain_any
    values:
    - layout_paragraphs
    - Layout Paragraphs
  scoring:
    combine: all_pass
- id: mercury_editor_inline_editor_mercury_editor_inline_editor_is_enabled
  version: '1.0'
  applicable_bundles:
  - mercury_editor_inline_editor
  checks:
  - kind: must_contain_any
    values:
    - mercury_editor_live_edit
  scoring:
    combine: all_pass
- id: mercury_editor_inline_editor_mercury_editor_inline_editor_enable
  version: '1.0'
  applicable_bundles:
  - mercury_editor_inline_editor
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
