metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: mercury_editor_inline_editor
  version: 2.2.x
  note: 'Deprecated, empty compatibility submodule of Mercury Editor. Ships only mercury_editor_inline_editor.info.yml
    (no .module, services, routes, config, or permissions); its info.yml states the replacement is mercury_editor_live_edit.
    It depends on layout_paragraphs and can be enabled/uninstalled but provides no behaviour. Medium/hard
    cases are grounded in real site state: whether the module is enabled (drush pm:list / moduleExists)
    and the deprecation notice in its info.yml.'
questions:
- id: mercury_editor_inline_editor-replacement
  input: The Drupal submodule mercury_editor_inline_editor is deprecated. Which project should I use instead
    for inline/live editing of Mercury Editor components?
  criteria: Use the mercury_editor_live_edit project (drupal.org/project/mercury_editor_live_edit). mercury_editor_inline_editor
    is a deprecated compatibility shim.
  bundle: mercury_editor_inline_editor
  rubric_ref: rubric/mercury_editor_inline_editor_mercury_editor_inline_editor_replacement@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: mercury_editor_inline_editor-no-code
  input: Does the mercury_editor_inline_editor submodule ship any working code (services, routes, config,
    permissions) in current Mercury Editor releases?
  criteria: No. It ships only an .info.yml placeholder kept for backwards compatibility; there is no .module,
    no services, routes, config, or permissions. Enabling it does nothing.
  bundle: mercury_editor_inline_editor
  rubric_ref: rubric/mercury_editor_inline_editor_mercury_editor_inline_editor_no_code@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: mercury_editor_inline_editor-dependency
  input: What module does mercury_editor_inline_editor declare as a dependency in its info.yml?
  criteria: It declares a dependency on layout_paragraphs.
  bundle: mercury_editor_inline_editor
  rubric_ref: rubric/mercury_editor_inline_editor_mercury_editor_inline_editor_dependency@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: mercury_editor_inline_editor-is-enabled
  input: 'On this Drupal site, check the mercury_editor_inline_editor module: is it currently installed/enabled,
    and according to its own module info what should be used instead?'
  criteria: It is enabled on the site (drush pm:list shows it Enabled), and its info.yml deprecation notice
    says to use mercury_editor_live_edit instead.
  bundle: mercury_editor_inline_editor
  rubric_ref: rubric/mercury_editor_inline_editor_mercury_editor_inline_editor_is_enabled@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/mercury_editor_inline_editor-is-enabled-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/mercury_editor_inline_editor-is-enabled-cleanup.sh
- id: mercury_editor_inline_editor-enable
  input: On this Drupal site, install (enable) the mercury_editor_inline_editor module so that it is active.
    Apply the change to the live site.
  criteria: Enable the module, e.g. drush en mercury_editor_inline_editor -y. Afterwards \Drupal::moduleHandler()->moduleExists('mercury_editor_inline_editor')
    is TRUE.
  bundle: mercury_editor_inline_editor
  rubric_ref: rubric/mercury_editor_inline_editor_mercury_editor_inline_editor_enable@1.0
  tags:
