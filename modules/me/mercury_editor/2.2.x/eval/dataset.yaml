metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: mercury_editor
  version: 2.2.x
  note: 'Mercury Editor is a drag-and-drop page builder built on layout_paragraphs + style_options. It
    replaces the edit form of enabled bundles with an edit screen at /mercury-editor/{entity}. Config
    lives in one object mercury_editor.settings (route mercury_editor.settings at /admin/config/content/mercury-editor).
    It has NO permissions of its own (core ''administer site configuration''), no Drush, no plugin types.
    Real keys: bundles (entity_type->bundle map that enables the editor), edit_screen_theme, mobile_presets
    (list of {name,width,height}), skip_create_form, dialog_settings, dialog_tray_width (default 400),
    rollover_padding_block/inline. To avoid disturbing the shared ''article'' bundle''s edit form, the
    introspection/execution cases here exercise the safe scalar keys (dialog_tray_width, edit_screen_theme,
    mobile_presets) rather than toggling bundles. Scripts restore shipped defaults explicitly.'
questions:
- id: mercury_editor-enable-bundle
  input: On Drupal 11 with the mercury_editor module enabled, how do I make a specific content type use
    the Mercury Editor drag-and-drop editor, where is that stored, and what admin path configures it?
  criteria: 'Enable the bundle on the settings form at /admin/config/content/mercury-editor (route mercury_editor.settings).
    It is stored in mercury_editor.settings under bundles.<entity_type>.<bundle> (e.g. bundles.node.landing_page:
    landing_page). The bundle must be set up for Layout Paragraphs.'
  bundle: mercury_editor
  rubric_ref: rubric/mercury_editor_mercury_editor_enable_bundle@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: mercury_editor-dependencies
  input: What two contrib modules is Mercury Editor built on / does it require, and what kind of editing
    experience does it provide?
  criteria: Mercury Editor requires layout_paragraphs and style_options. It provides a full-screen, drag-and-drop
    page builder with live preview that replaces the standard entity edit form for enabled bundles.
  bundle: mercury_editor
  rubric_ref: rubric/mercury_editor_mercury_editor_dependencies@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: mercury_editor-edit-route
  input: When a bundle is managed by Mercury Editor, at what URL / route does the drag-and-drop edit screen
    live, and does the module define any permissions of its own?
  criteria: The edit screen is the mercury_editor.editor route at /mercury-editor/{mercury_editor_entity}.
    Mercury Editor ships no permissions of its own; access relies on core 'administer site configuration'
    and the underlying Layout Paragraphs/entity permissions.
  bundle: mercury_editor
  rubric_ref: rubric/mercury_editor_mercury_editor_edit_route@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: mercury_editor-known-traywidth
  input: On this Drupal site, Mercury Editor's editing tray width has been customised. Inspect the live
    configuration and tell me the current tray width (in pixels).
  criteria: mercury_editor.settings dialog_tray_width is 555. Read via drush cget mercury_editor.settings
    dialog_tray_width.
  bundle: mercury_editor
  rubric_ref: rubric/mercury_editor_mercury_editor_known_traywidth@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/mercury_editor-known-traywidth-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/mercury_editor-known-traywidth-cleanup.sh
- id: mercury_editor-known-theme
  input: Mercury Editor's edit tray on this site has been set to use a specific theme. Inspect the running
    configuration and state which theme (machine name) is configured for the Mercury Editor edit tray.
  criteria: mercury_editor.settings edit_screen_theme is 'claro'. Read via drush cget mercury_editor.settings
    edit_screen_theme.
  bundle: mercury_editor
  rubric_ref: rubric/mercury_editor_mercury_editor_known_theme@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/mercury_editor-known-theme-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/mercury_editor-known-theme-cleanup.sh
- id: mercury_editor-set-traywidth-theme
  input: On this Drupal site, configure Mercury Editor so that its edit tray is 600 pixels wide and uses
    the 'claro' theme for the edit tray. Apply the change to the live site.
  criteria: In mercury_editor.settings set dialog_tray_width=600 and edit_screen_theme='claro' (via the
    settings form at /admin/config/content/mercury-editor or drush/configFactory).
  bundle: mercury_editor
  rubric_ref: rubric/mercury_editor_mercury_editor_set_traywidth_theme@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/mercury_editor-set-traywidth-theme-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/mercury_editor-set-traywidth-theme-reset.sh
    verify: agent-module-documentation/evaluation/verify/mercury_editor-set-traywidth-theme-verify.sh
- id: mercury_editor-add-mobile-preset
  input: Add a mobile preview preset to Mercury Editor named exactly 'Tablet ME' that is 800 pixels wide
    and 1000 pixels tall, keeping it among the module's mobile presets. Apply the change to the live site.
  criteria: 'In mercury_editor.settings mobile_presets contains an entry {name: ''Tablet ME'', width:
    800, height: 1000}. On the settings form add the line ''Tablet ME|800|1000'' to Mobile presets, or
    append it to the config list.'
  bundle: mercury_editor
  rubric_ref: rubric/mercury_editor_mercury_editor_add_mobile_preset@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/mercury_editor-add-mobile-preset-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/mercury_editor-add-mobile-preset-reset.sh
    verify: agent-module-documentation/evaluation/verify/mercury_editor-add-mobile-preset-verify.sh
