metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: media_entity_instagram
  version: 4.0.x
  note: 'media_entity_instagram adds an Instagram media SOURCE (oEmbed) to core Media: source plugin id
    `oembed:instagram` (allowed_field_types string/link) plus an `instagram_embed` field formatter. Recipe
    cases are response-graded. Medium cases create a known media type using the Instagram source and require
    live introspection of the media_type config to name its source plugin. Hard cases BUILD a media type
    backed by the Instagram source, verified against real config-entity state. NOTE: live Instagram embedding
    needs network + Facebook App credentials, so hard/verify stays at config level (media type + source
    id + source field), not fetched post content.'
questions:
- id: media-instagram-source-plugin
  input: On a Drupal 11 site I want editors to store Instagram posts as reusable media entities from just
    the post URL. Which contrib module provides this, and what is the machine id of the media SOURCE plugin
    it registers that I select when creating the media type?
  criteria: The media_entity_instagram module. It registers a media source plugin with id `oembed:instagram`
    (an extension of core's OEmbed source, labelled 'Instagram') that you pick as the media type's source.
  bundle: media_entity_instagram
  rubric_ref: rubric/media_entity_instagram_media_instagram_source_plugin@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: media-instagram-field-types
  input: When creating a media type that uses the media_entity_instagram Instagram source, what field
    types are allowed for the source field that stores the post URL?
  criteria: The Instagram source declares allowed_field_types of `string` and `link` — the source field
    must be a plain-text (string) or link field. Core creates a string field named field_media_oembed_instagram
    by default.
  bundle: media_entity_instagram
  rubric_ref: rubric/media_entity_instagram_media_instagram_field_types@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: media-instagram-embed-formatter
  input: Which field formatter does the media_entity_instagram module provide to render an embedded Instagram
    post, and what two display settings does it expose?
  criteria: The `instagram_embed` field formatter (field types link/string/string_long). Its settings
    are max_width (integer, maximum embed width) and hidecaption (boolean, hide the Instagram caption).
  bundle: media_entity_instagram
  rubric_ref: rubric/media_entity_instagram_media_instagram_embed_formatter@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: media-instagram-known-type-source
  input: A media type named 'ig_known' (label 'IG Known') has been configured on this site. Inspect its
    media type configuration and tell me which media source plugin it uses and the name of its source
    field.
  criteria: The media type ig_known uses the `oembed:instagram` source plugin (from media_entity_instagram);
    its source field is field_media_oembed_instagram (a string field).
  bundle: media_entity_instagram
  rubric_ref: rubric/media_entity_instagram_media_instagram_known_type_source@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/media_entity_instagram-known-type-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/media_entity_instagram-known-type-cleanup.sh
- id: media-instagram-known-type-fieldtype
  input: For the media type 'ig_known' on this site, which module's source plugin backs it, and what field
    type is its configured source field? Inspect the live configuration to answer.
  criteria: ig_known is backed by the media_entity_instagram source plugin `oembed:instagram`; its source
    field field_media_oembed_instagram is a `string` field (string and link are the allowed source-field
    types).
  bundle: media_entity_instagram
  rubric_ref: rubric/media_entity_instagram_media_instagram_known_type_fieldtype@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/media_entity_instagram-known-type-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/media_entity_instagram-known-type-cleanup.sh
- id: media-instagram-build-type
  input: On this Drupal 11 site, create a media type with machine id `ig_eval` that uses the Instagram
    media source provided by the media_entity_instagram module (source plugin `oembed:instagram`). Give
    it a source field of an allowed type (string or link) so it can store Instagram post URLs, and save
    it to the live site. Config-level setup only — you do not need to fetch a real post.
  criteria: A media_type config entity `ig_eval` exists with source `oembed:instagram` and a source field
    (field_media_oembed_instagram) of type string (or link) recorded in source_configuration.source_field.
  bundle: media_entity_instagram
  rubric_ref: rubric/media_entity_instagram_media_instagram_build_type@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/media_entity_instagram-source-type-reset.sh
    verify: agent-module-documentation/evaluation/verify/media_entity_instagram-source-type-verify.sh
- id: media-instagram-build-type-layman
  input: I run a Drupal site and want to save Instagram posts as reusable media by pasting their link.
    Set me up a new media kind called ig_eval that pulls in Instagram posts, with a place to paste the
    Instagram link. Make it live on the site.
  criteria: A media_type config entity `ig_eval` exists with source `oembed:instagram` (the media_entity_instagram
    Instagram source) and a string/link source field for the post URL.
  bundle: media_entity_instagram
  rubric_ref: rubric/media_entity_instagram_media_instagram_build_type_layman@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: site-owner
    reset: agent-module-documentation/evaluation/verify/media_entity_instagram-source-type-reset.sh
    verify: agent-module-documentation/evaluation/verify/media_entity_instagram-source-type-verify.sh
