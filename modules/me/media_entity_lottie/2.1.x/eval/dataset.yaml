metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: media_entity_lottie
  version: 2.1.x
  note: 'Media entity Lottie adds a core Media source plugin ''lottie_file'' (extends core File, restricts
    the source field to the json extension, exposes metadata w/h/nm/v/fr, adds a lottie_file upload validation
    constraint) and a field formatter ''file_lottie_player'' (extends FileMediaFormatterBase, renders
    <lottie-player>, only applicable to a field whose name contains field_media_lottie_file, settings:
    background, background_transparent, hover, mode, speed, count + play_when_visible). There is no settings
    form (configure=null). Config lives in the media type (media.type.<id> source=lottie_file) and the
    view display (core.entity_view_display.media.<id>.default formatter file_lottie_player). Medium cases
    create a namespaced Lottie media type (mel_src / mel_disp) and read back its source/extension and
    its Lottie player display settings; hard cases build a Lottie media type (mel_build) and turn on hover-to-play
    on a Lottie player display (mel_task), verified against live config. All fixtures create and tear
    down their own mel_* media types + source fields.'
questions:
- id: media_entity_lottie-how-to-store
  input: I want Drupal's Media system to store and manage Lottie animations using the media_entity_lottie
    module. Which media source do I choose when creating the media type, and what file extension does
    its source field accept?
  criteria: Create a media type with media source 'Lottie file' (plugin id lottie_file). Its source field
    is a file field restricted to the json extension (Lottie animations are .json).
  bundle: media_entity_lottie
  rubric_ref: rubric/media_entity_lottie_media_entity_lottie_how_to_store@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: media_entity_lottie-formatter
  input: How does media_entity_lottie render a Lottie animation on the page? Name the field formatter
    and the HTML element it outputs, and one playback option it exposes.
  criteria: The 'file_lottie_player' (Lottie player) field formatter renders each file as a <lottie-player>
    web-component element and attaches the lottie-player JS library. Options include background/transparent,
    hover (play on hover), play when visible, mode (normal/bounce), speed, and count (loop count).
  bundle: media_entity_lottie
  rubric_ref: rubric/media_entity_lottie_media_entity_lottie_formatter@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: media_entity_lottie-validation
  input: What does the media_entity_lottie upload validator (the lottie_file constraint) check before
    accepting an uploaded file?
  criteria: The lottie_file constraint rejects the file if it is empty, is not valid JSON, or does not
    contain the required Lottie animation keys (fr, ip, op, w, h, ddd). Keys v and nm are optional (a
    warning is shown if missing).
  bundle: media_entity_lottie
  rubric_ref: rubric/media_entity_lottie_media_entity_lottie_validation@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: media_entity_lottie-known-source
  input: This site has a media type named 'MEL Source' (id mel_src). Inspect the live configuration and
    state which media source plugin it uses and which file extension its source field accepts.
  criteria: The mel_src media type uses the lottie_file source; its source field is a file field limited
    to the json extension.
  bundle: media_entity_lottie
  rubric_ref: rubric/media_entity_lottie_media_entity_lottie_known_source@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/media_entity_lottie-source-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/media_entity_lottie-source-cleanup.sh
- id: media_entity_lottie-known-display
  input: The media type 'MEL Disp' (id mel_disp) has its Lottie player display formatter customized. Inspect
    the live default view display and report the configured playback speed and whether it plays on hover.
  criteria: In core.entity_view_display.media.mel_disp.default the source field uses the file_lottie_player
    formatter with speed = 3 and hover = true.
  bundle: media_entity_lottie
  rubric_ref: rubric/media_entity_lottie_media_entity_lottie_known_display@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/media_entity_lottie-display-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/media_entity_lottie-display-cleanup.sh
- id: media_entity_lottie-create-type
  input: On this Drupal site, use the media_entity_lottie module to create a media type with machine id
    'mel_build' that stores Lottie animations (uses the Lottie file source with a json-only source field).
    Apply it to the live site.
  criteria: 'Create a media type mel_build with source lottie_file, create its source field (a file field,
    file_extensions json) and set source_configuration.source_field. Verified by loading the media type:
    source is lottie_file and its source field accepts json.'
  bundle: media_entity_lottie
  rubric_ref: rubric/media_entity_lottie_media_entity_lottie_create_type@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/media_entity_lottie-create-type-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/media_entity_lottie-create-type-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/media_entity_lottie-create-type-verify.sh
- id: media_entity_lottie-enable-hover
  input: The media type 'mel_task' on this site renders Lottie animations with the Lottie player. Configure
    its default display so the animation plays on mouse hover. Apply the change to the live site.
  criteria: In core.entity_view_display.media.mel_task.default set the source field's file_lottie_player
    formatter setting hover = true. Verified against the live view display.
  bundle: media_entity_lottie
  rubric_ref: rubric/media_entity_lottie_media_entity_lottie_enable_hover@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/media_entity_lottie-enable-hover-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/media_entity_lottie-enable-hover-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/media_entity_lottie-enable-hover-verify.sh
