metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: menu_item_fields
  version: 2.1.x
  note: Menu Item Fields makes the menu_link_content entity type fieldable and renderable with view modes.
    Fields attach to the single bundle menu_link_content (entity_type=menu_link_content, bundle=menu_link_content).
    Menus render through a block plugin 'menu_item_fields' ('Menu with fields', derived per menu) with
    settings view_mode and view_mode_override_field. Per-menu form modes are auto-used when a menu_link_content
    form mode's machine name matches the menu (dashes->underscores). The menu_item_fields_ui submodule
    provides Field UI for menu links. No configure route/permission/schema/Drush. Medium/hard cases create
    namespaced fields (field_mif_*) and view modes (mif_*) on menu_link_content and inspect/verify them.
questions:
- id: menu_item_fields-what
  input: What does the Drupal contrib module menu_item_fields make fieldable, and how do you actually
    render a menu so those extra fields show up?
  criteria: It makes the menu_link_content entity type fieldable. You render the menu with the block it
    provides, 'Menu with fields' (block plugin id menu_item_fields, derived per menu), which renders each
    menu_link_content entity through the entity view builder using a chosen view mode.
  bundle: menu_item_fields
  rubric_ref: rubric/menu_item_fields_menu_item_fields_what@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: menu_item_fields-ui-submodule
  input: I enabled menu_item_fields but I don't see any way to add fields to my menu links. What do I
    need to enable, and what does it do?
  criteria: Enable the menu_item_fields_ui submodule. It wires Field UI to the menu_link_content entity
    (sets its field_ui_base_route to entity.menu.collection and defaults the bundle to menu_link_content
    on the field routes), so Manage fields / form &amp; view displays appear under Menus. Like Field UI
    it can be disabled in production afterward.
  bundle: menu_item_fields
  rubric_ref: rubric/menu_item_fields_menu_item_fields_ui_submodule@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: menu_item_fields-block-settings
  input: The 'Menu with fields' block from menu_item_fields has two extra settings beyond a normal menu
    block. What are they, and what do per-menu form modes let you do?
  criteria: 'The block has view_mode (the menu_link_content view mode used to render items) and view_mode_override_field
    (a field on the menu link naming a per-item view-mode id). Per-menu form modes: create/enable a menu_link_content
    form mode whose machine name matches a menu (dashes->underscores) and menu_item_fields uses it when
    editing that menu''s links.'
  bundle: menu_item_fields
  rubric_ref: rubric/menu_item_fields_menu_item_fields_block_settings@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: menu_item_fields-known-field
  input: On this Drupal site, a custom field has been added to menu links (the menu_link_content entity).
    Inspect the live configuration and give the machine name of that field.
  criteria: 'The field is field_mif_known: there is a FieldConfig menu_link_content.menu_link_content.field_mif_known
    (with a matching field storage on the menu_link_content entity type).'
  bundle: menu_item_fields
  rubric_ref: rubric/menu_item_fields_menu_item_fields_known_field@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/menu_item_fields-known-field-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/menu_item_fields-known-field-cleanup.sh
- id: menu_item_fields-view-mode
  input: On this Drupal site, a custom view mode has been configured for menu links (the menu_link_content
    entity) so menus can render them differently. Inspect the live configuration and name that view mode's
    machine id.
  criteria: 'The view mode is mif_mega: there is an entity view mode menu_link_content.mif_mega and an
    enabled entity_view_display menu_link_content.menu_link_content.mif_mega.'
  bundle: menu_item_fields
  rubric_ref: rubric/menu_item_fields_menu_item_fields_view_mode@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/menu_item_fields-view-mode-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/menu_item_fields-view-mode-cleanup.sh
- id: menu_item_fields-add-field
  input: On this Drupal site, using menu_item_fields, add a text (string) field with machine name field_mif_task
    to custom menu links (the menu_link_content entity), so editors can store an extra value on each menu
    item. Apply the change to the live site.
  criteria: Create a FieldStorageConfig (entity_type menu_link_content, field_name field_mif_task, type
    string) and a FieldConfig on bundle menu_link_content. Verify checks that FieldConfig menu_link_content.menu_link_content.field_mif_task
    exists.
  bundle: menu_item_fields
  rubric_ref: rubric/menu_item_fields_menu_item_fields_add_field@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/menu_item_fields-add-field-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/menu_item_fields-add-field-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/menu_item_fields-add-field-verify.sh
- id: menu_item_fields-add-view-mode
  input: On this Drupal site, using menu_item_fields, create a new view mode with machine name mif_hero
    for menu links (menu_link_content) and enable an entity view display for it, so the 'Menu with fields'
    block could render menu items in that view mode. Apply the change to the live site.
  criteria: Create an EntityViewMode menu_link_content.mif_hero and an enabled EntityViewDisplay menu_link_content.menu_link_content.mif_hero
    (status true). Verify checks the view display exists and is enabled.
  bundle: menu_item_fields
  rubric_ref: rubric/menu_item_fields_menu_item_fields_add_view_mode@1.0
