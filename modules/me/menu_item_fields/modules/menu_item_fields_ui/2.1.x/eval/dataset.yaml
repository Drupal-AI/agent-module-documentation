metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: menu_item_fields_ui
  version: 2.1.x
  note: Menu Item Fields UI is the build-time submodule of menu_item_fields. On enable, hook_entity_type_alter
    sets menu_link_content's field_ui_base_route to entity.menu.collection, and a RouteSubscriber defaults
    the bundle route param to menu_link_content on the Field UI / display / field-group routes (single-bundle
    entity). It provides the Field UI for building fields on menu links (entity_type=menu_link_content,
    bundle=menu_link_content). Depends on menu_item_fields + field_ui; no config/permission/Drush/plugin
    of its own. Medium/hard cases introspect the field_ui_base_route and create namespaced fields (field_miu_*)
    on menu_link_content.
questions:
- id: menu_item_fields_ui-what
  input: In the menu_item_fields project, what does the menu_item_fields_ui submodule add, and which entity's
    field_ui_base_route does it set (and to what route)?
  criteria: It adds the Field UI (Manage fields / form &amp; view displays) for the menu_link_content
    entity. hook_entity_type_alter sets menu_link_content's field_ui_base_route to entity.menu.collection
    so the Field UI local tasks attach under the Menus admin area.
  bundle: menu_item_fields_ui
  rubric_ref: rubric/menu_item_fields_ui_menu_item_fields_ui_what@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: menu_item_fields_ui-entity-bundle
  input: When I add a field through menu_item_fields_ui, what entity type and bundle does it live on?
  criteria: Fields live on the menu_link_content entity type, bundle menu_link_content (a single-bundle
    entity). The submodule's RouteSubscriber defaults the bundle route parameter to menu_link_content
    on the field/display routes.
  bundle: menu_item_fields_ui
  rubric_ref: rubric/menu_item_fields_ui_menu_item_fields_ui_entity_bundle@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: menu_item_fields_ui-deps
  input: What does menu_item_fields_ui depend on, and is it meant to stay enabled in production?
  criteria: It depends on menu_item_fields and field_ui. Like core Field UI, you enable it to build fields/form
    modes/view modes for menu links and can disable it in production afterward; the fields and configuration
    remain.
  bundle: menu_item_fields_ui
  rubric_ref: rubric/menu_item_fields_ui_menu_item_fields_ui_deps@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: menu_item_fields_ui-base-route
  input: On this Drupal site, menu_item_fields_ui is enabled. Inspect the menu_link_content entity type
