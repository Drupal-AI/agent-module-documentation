  criteria: menu_link_content's field_ui_base_route is entity.menu.collection (set by menu_item_fields_ui's
    hook_entity_type_alter).
  bundle: menu_item_fields_ui
  rubric_ref: rubric/menu_item_fields_ui_menu_item_fields_ui_base_route@1.0
