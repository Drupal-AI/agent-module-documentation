rubrics:
- id: media_entity_soundcloud_media_entity_soundcloud_source_plugin
  version: '1.0'
  applicable_bundles:
  - media_entity_soundcloud
  checks:
  - kind: must_contain_any
    values:
    - soundcloud
    - string
    - link
  scoring:
    combine: all_pass
- id: media_entity_soundcloud_media_entity_soundcloud_embed_formatter
  version: '1.0'
  applicable_bundles:
  - media_entity_soundcloud
  checks:
  - kind: must_contain_any
    values:
    - soundcloud_embed
    - visual
    - classic
  scoring:
    combine: all_pass
- id: media_entity_soundcloud_media_entity_soundcloud_metadata
  version: '1.0'
  applicable_bundles:
  - media_entity_soundcloud
  checks:
  - kind: must_contain_any
    values:
    - oembed
    - source_id
    - track_id
    - thumbnail_uri
  scoring:
    combine: all_pass
- id: media_entity_soundcloud_media_entity_soundcloud_thumb_dest
  version: '1.0'
  applicable_bundles:
  - media_entity_soundcloud
  checks:
  - kind: must_contain_any
    values:
    - public://mes_probe_thumbs
  scoring:
    combine: all_pass
- id: media_entity_soundcloud_media_entity_soundcloud_type_field
  version: '1.0'
  applicable_bundles:
  - media_entity_soundcloud
  checks:
  - kind: must_contain_any
    values:
    - field_mes_iurl
  scoring:
    combine: all_pass
- id: media_entity_soundcloud_media_entity_soundcloud_create_type
  version: '1.0'
  applicable_bundles:
  - media_entity_soundcloud
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
- id: media_entity_soundcloud_media_entity_soundcloud_embed_display
  version: '1.0'
  applicable_bundles:
  - media_entity_soundcloud
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
