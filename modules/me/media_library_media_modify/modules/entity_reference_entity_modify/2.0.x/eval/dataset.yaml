metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: entity_reference_entity_modify
  version: 2.0.x
  note: 'Experimental submodule of media_library_media_modify. It adds one field widget, entity_reference_autocomplete_with_override
    (''Autocomplete (with override)''), for the parent''s entity_reference_entity_modify field type; it
    extends core EntityReferenceAutocompleteWidget and calls the parent EntityReferenceOverrideService::formElement()
    to add the override button. Only extra setting: form_mode. No routes/permissions/drush of its own;
    all storage + read-only guard live in the parent. Cases are grounded in that real widget: introspection
    reads the configured widget type on a live form display; execution builds an entity_reference_entity_modify
    field using this autocomplete-with-override widget.'
questions:
- id: entity_reference_entity_modify-purpose
  input: What does the experimental entity_reference_entity_modify submodule add on top of media_library_media_modify,
    and when would I use it?
  criteria: It adds an autocomplete field widget (entity_reference_autocomplete_with_override) so the
    parent module's contextual overrides can be used on plain (non-media) entity reference fields, without
    the media library UI. Use it to give a referenced node/term/etc. per-placement field overrides.
  bundle: entity_reference_entity_modify
  rubric_ref: rubric/entity_reference_entity_modify_entity_reference_entity_modify_purpose@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: entity_reference_entity_modify-widget-id
  input: Which field widget does entity_reference_entity_modify provide, which field type is it for, and
    what extra setting does it expose?
  criteria: The widget entity_reference_autocomplete_with_override ('Autocomplete (with override)'), offered
    on entity_reference_entity_modify fields (the parent module's field type). Its only extra setting
    is form_mode (the override form's form mode).
  bundle: entity_reference_entity_modify
  rubric_ref: rubric/entity_reference_entity_modify_entity_reference_entity_modify_widget_id@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: entity_reference_entity_modify-deps
  input: What does the entity_reference_entity_modify submodule depend on, and where does the actual override
    storage logic live?
  criteria: It depends on the parent media_library_media_modify module. All the override storage (overwritten_property_map),
    render-time application and the read-only save guard live in the parent; this submodule only provides
    the autocomplete widget front end. It is marked experimental.
  bundle: entity_reference_entity_modify
  rubric_ref: rubric/entity_reference_entity_modify_entity_reference_entity_modify_deps@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: entity_reference_entity_modify-widget-type
  input: On this site the Article type has a field field_eref_probe that uses this submodule's override-capable
    autocomplete widget. Inspect the live default form display and state the machine name of the widget
    configured for it.
  criteria: The widget is entity_reference_autocomplete_with_override, read from core.entity_form_display.node.article.default
    -> content.field_eref_probe.type.
  bundle: entity_reference_entity_modify
  rubric_ref: rubric/entity_reference_entity_modify_entity_reference_entity_modify_widget_type@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/entity_reference_entity_modify-widget-type-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/entity_reference_entity_modify-widget-type-cleanup.sh
- id: entity_reference_entity_modify-create-field
  input: On this Drupal site, add a field field_eref_task to the Article content type that references
    nodes and supports contextual overrides (field type entity_reference_entity_modify, target_type node),
    and configure its default form display to use the entity_reference_entity_modify submodule's 'Autocomplete
    (with override)' widget. Apply the change to the live site.
  criteria: Create FieldStorageConfig node.field_eref_task type entity_reference_entity_modify (target_type
    node) + FieldConfig on article, and set the node.article.default form-display component for field_eref_task
    to widget entity_reference_autocomplete_with_override.
  bundle: entity_reference_entity_modify
  rubric_ref: rubric/entity_reference_entity_modify_entity_reference_entity_modify_create_field@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/entity_reference_entity_modify-create-field-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/entity_reference_entity_modify-create-field-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/entity_reference_entity_modify-create-field-verify.sh
