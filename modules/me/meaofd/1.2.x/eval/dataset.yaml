metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: meaofd
  version: 1.2.x
  note: 'meaofd (Mismatched entity and/or field definitions) has no config, no config schema, and no plugins.
    It wraps core entity.definition_update_manager: report page meaofd.report at /admin/reports/mismatched-entity-and-or-field-definitions,
    fix route meaofd.fix, Drush ''meaofd:fix <entity_type_id>'' (option --no-cache-rebuild), and service
    meaofd.fixer (fix()/entityTypeHasChanges()/getChangeSummary()). Medium/hard cases are grounded in
    the module''s exact purpose: the setup/reset scripts inject a phantom base field into node''s LAST-INSTALLED
    field-storage definitions registry (never a real DB column), which makes core report a mismatched
    definition for node (''needs to be uninstalled''); the agent must read that live change summary (medium)
    or reconcile it with meaofd so no mismatch remains (hard). cleanup/verify use meaofd.fixer to restore
    baseline. NOTE for orchestrator: on this shared site, saving user roles fails (form_mode_control''s
    permission provider throws getConfigDependencyName() on null), so role-based cases were intentionally
    avoided.'
questions:
- id: meaofd-drush-fix
  input: On a Drupal 11 site the meaofd (Mismatched entity and/or field definitions) module is enabled.
    Which Drush command reconciles a single entity type's stored definitions with code, and what is the
    exact command to fix the Paragraph entity type?
  criteria: Run `drush meaofd:fix <entity_type_id>`; for Paragraph it is `drush meaofd:fix paragraph`.
    An optional `--no-cache-rebuild` skips the entity cache rebuild.
  bundle: meaofd
  rubric_ref: rubric/meaofd_meaofd_drush_fix@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: meaofd-service-api
  input: The meaofd module lets me fix a mismatched entity definition programmatically, for example from
    a hook_update_N(). Which service id do I call and which method, to reconcile the 'node' entity type?
  criteria: 'Call the meaofd.fixer service: \Drupal::service(''meaofd.fixer'')->fix(''node''). It installs/updates
    the entity type via core''s entity.definition_update_manager only when entityTypeHasChanges() is TRUE.'
  bundle: meaofd
  rubric_ref: rubric/meaofd_meaofd_service_api@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: meaofd-report-and-perms
  input: Where is the meaofd report page in the Drupal admin, and which two permissions control viewing
    the report versus applying a fix?
  criteria: Report is under Reports at /admin/reports/mismatched-entity-and-or-field-definitions (route
    meaofd.report). 'view mismatched entity and or field definitions' gates the report; 'fix mismatched
    entity and or field definitions' gates the fix action/route.
  bundle: meaofd
  rubric_ref: rubric/meaofd_meaofd_report_and_perms@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: meaofd-inspect-mismatch
  input: This Drupal site currently reports a mismatched entity/field definition. Using what meaofd exposes
    (its report page, its fixer service, or Drush), inspect the live site and state exactly what change
    meaofd reports needs to be made.
  criteria: 'meaofd.fixer->getChangeSummary() reports the node entity type with: ''The MEAOFD Probe field
    needs to be uninstalled.'' (a phantom base field on node).'
  bundle: meaofd
  rubric_ref: rubric/meaofd_meaofd_inspect_mismatch@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/meaofd-mismatch-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/meaofd-mismatch-cleanup.sh
- id: meaofd-fix-command-for-affected
  input: This site reports a mismatched entity/field definition on exactly one entity type. Inspect the
    live site to find which entity type is affected, then give the exact single Drush command (provided
    by meaofd) that would fix that entity type.
  criteria: The affected entity type is node, so the fix command is `drush meaofd:fix node`.
  bundle: meaofd
  rubric_ref: rubric/meaofd_meaofd_fix_command_for_affected@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/meaofd-mismatch-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/meaofd-mismatch-cleanup.sh
- id: meaofd-reconcile-node
  input: This Drupal site reports a mismatched entity/field definition for the node entity type. Use the
    meaofd module to reconcile the node entity type's definitions so that no mismatched definition remains.
    Apply the fix to the live site.
  criteria: Run `drush meaofd:fix node` (or \Drupal::service('meaofd.fixer')->fix('node')). Afterwards
    meaofd.fixer->entityTypeHasChanges('node') is FALSE.
  bundle: meaofd
  rubric_ref: rubric/meaofd_meaofd_reconcile_node@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/meaofd-fix-node-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/meaofd-fix-node-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/meaofd-fix-node-verify.sh
- id: meaofd-clear-status-warning
  input: My Drupal site's Status report is showing the red 'Mismatched entity and/or field definitions'
    warning. I installed the meaofd module to deal with exactly this. Please make that warning go away.
  criteria: 'Fix the affected entity type (node) with meaofd: `drush meaofd:fix node`, or use the report
    page''s Fix button, or call the meaofd.fixer service. Afterwards node has no pending definition changes
    and the Status report warning clears.'
  bundle: meaofd
  rubric_ref: rubric/meaofd_meaofd_clear_status_warning@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: site-owner-layman
    reset: agent-module-documentation/evaluation/verify/meaofd-clear-warning-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/meaofd-clear-warning-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/meaofd-clear-warning-verify.sh
