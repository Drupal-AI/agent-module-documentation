rubrics:
- id: meaofd_meaofd_drush_fix
  version: '1.0'
  applicable_bundles:
  - meaofd
  checks:
  - kind: must_contain_any
    values:
    - meaofd:fix
    - drush meaofd:fix paragraph
  scoring:
    combine: all_pass
- id: meaofd_meaofd_service_api
  version: '1.0'
  applicable_bundles:
  - meaofd
  checks:
  - kind: must_contain_any
    values:
    - meaofd.fixer
    - ->fix(
  scoring:
    combine: all_pass
- id: meaofd_meaofd_report_and_perms
  version: '1.0'
  applicable_bundles:
  - meaofd
  checks:
  - kind: must_contain_any
    values:
    - /admin/reports/mismatched-entity-and-or-field-definitions
    - view mismatched entity and or field definitions
    - fix mismatched entity and or field definitions
  scoring:
    combine: all_pass
- id: meaofd_meaofd_inspect_mismatch
  version: '1.0'
  applicable_bundles:
  - meaofd
  checks:
  - kind: must_contain_any
    values:
    - MEAOFD Probe
    - meaofd_probe_field
    - needs to be uninstalled
    - uninstalled
  scoring:
    combine: all_pass
- id: meaofd_meaofd_fix_command_for_affected
  version: '1.0'
  applicable_bundles:
  - meaofd
  checks:
  - kind: must_contain_any
    values:
    - meaofd:fix node
    - drush meaofd:fix node
  scoring:
    combine: all_pass
- id: meaofd_meaofd_reconcile_node
  version: '1.0'
  applicable_bundles:
  - meaofd
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
- id: meaofd_meaofd_clear_status_warning
  version: '1.0'
  applicable_bundles:
  - meaofd
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
