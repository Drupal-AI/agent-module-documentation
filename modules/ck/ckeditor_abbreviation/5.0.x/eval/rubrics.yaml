rubrics:
- id: ckeditor_abbreviation_ckeditor_abbreviation_enable
  version: '1.0'
  applicable_bundles:
  - ckeditor_abbreviation
  checks:
  - kind: must_contain_any
    values:
    - toolbar
    - text format
    - Text formats and editors
    - Available buttons
    - settings.toolbar
  scoring:
    combine: all_pass
- id: ckeditor_abbreviation_ckeditor_abbreviation_elements
  version: '1.0'
  applicable_bundles:
  - ckeditor_abbreviation
  checks:
  - kind: must_contain_any
    values:
    - <abbr
    - abbr title
    - title
  scoring:
    combine: all_pass
- id: ckeditor_abbreviation_ckeditor_abbreviation_toolbar_id
  version: '1.0'
  applicable_bundles:
  - ckeditor_abbreviation
  checks:
  - kind: must_contain_any
    values:
    - abbreviation
    - abbreviation.Abbreviation
    - ckeditor_abbreviation_abbreviation
  scoring:
    combine: all_pass
- id: ckeditor_abbreviation_ckeditor_abbreviation_known_format
  version: '1.0'
  applicable_bundles:
  - ckeditor_abbreviation
  checks:
  - kind: must_contain_any
    values:
    - ckabbr_known
  scoring:
    combine: all_pass
- id: ckeditor_abbreviation_ckeditor_abbreviation_allowed_html
  version: '1.0'
  applicable_bundles:
  - ckeditor_abbreviation
  checks:
  - kind: must_contain_any
    values:
    - <abbr title>
    - abbr title
  scoring:
    combine: all_pass
- id: ckeditor_abbreviation_ckeditor_abbreviation_add_button
  version: '1.0'
  applicable_bundles:
  - ckeditor_abbreviation
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
- id: ckeditor_abbreviation_ckeditor_abbreviation_allow_title
  version: '1.0'
  applicable_bundles:
  - ckeditor_abbreviation
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
