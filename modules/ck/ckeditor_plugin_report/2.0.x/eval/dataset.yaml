metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: ckeditor_plugin_report
  version: 2.0.x
  note: 'CKEditor Plugin Report is a single read-only admin report. Route ckeditor_plugin_report.plugin_report
    at /admin/reports/ckeditor-plugins (under system.admin_reports), gated by the permission ''view ckeditor
    plugin report'' (restrict access: true). Controller PluginReportController::content reads plugin.manager.ckeditor5.plugin
    (NULL_ON_INVALID_REFERENCE) and tabulates getDefinitions() into columns Plugin ID / Provider / Class.
    No configure route, no config schema, no plugins/services/Drush of its own. The only persistent, mutable
    state relevant to the module is which roles hold the ''view ckeditor plugin report'' permission (user.role.*
    config), so medium introspection reads that back and hard execution grants it. All fixtures use ckpr_-prefixed
    roles.'
questions:
- id: ckpr-route-and-permission
  input: I installed ckeditor_plugin_report. What is the URL path of the report it adds, and which permission
    controls access to it?
  criteria: The report is at /admin/reports/ckeditor-plugins (route ckeditor_plugin_report.plugin_report,
    under the Reports menu) and is gated by the 'view ckeditor plugin report' permission.
  bundle: ckeditor_plugin_report
  rubric_ref: rubric/ckeditor_plugin_report_ckpr_route_and_permission@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: ckpr-columns
  input: What information does the ckeditor_plugin_report page display for each CKEditor plugin, and which
    plugin manager does it read to build the list?
  criteria: 'It reads the CKEditor 5 plugin manager (plugin.manager.ckeditor5.plugin) getDefinitions()
    and shows a table with three columns per plugin: Plugin ID, Provider (module), and Class.'
  bundle: ckeditor_plugin_report
  rubric_ref: rubric/ckeditor_plugin_report_ckpr_columns@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: ckpr-use-case
  input: Why would a site administrator use ckeditor_plugin_report, for example when moving from CKEditor
    4 to CKEditor 5?
  criteria: It gives a full inventory of registered CKEditor 5 plugins (ID, provider module, class), useful
    for auditing which module supplies a plugin and for planning a CKEditor 4 -> 5 upgrade.
  bundle: ckeditor_plugin_report
  rubric_ref: rubric/ckeditor_plugin_report_ckpr_use_case@1.0
  tags:
  - mode:recipe
  - difficulty:easy
