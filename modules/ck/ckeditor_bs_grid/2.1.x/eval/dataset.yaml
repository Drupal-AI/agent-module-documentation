metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: ckeditor_bs_grid
  version: 2.1.x
  note: 'The module has two config surfaces, both used by the cases below. Per text format: editor.editor.<format>
    -> settings.toolbar.items must contain the toolbar item ''bootstrapGrid'' and settings.plugins.ckeditor_bs_grid_grid
    holds use_cdn / cdn_url / available_columns / available_breakpoints (CKEditor5 plugin id ckeditor_bs_grid_grid,
    class Drupal\ckeditor_bs_grid\Plugin\CKEditor5Plugin\BsGrid). Site-wide: ckeditor_bs_grid.settings
    -> breakpoints.<xs|sm|md|lg|xl|xxl> with label, prefix and columns.<1..12>.layouts, edited at /admin/config/content/ckeditor_bs_grid
    behind the administer ckeditor_bs_grid permission. Medium cases install real config on both surfaces;
    hard cases build a new CKEditor 5 format and extend an existing one, verified against the live editor
    entities. Cleanup restores ckeditor_bs_grid.settings from the module''s own config/install file.'
questions:
- id: ckeditor_bs_grid-enable-button
  input: I installed the Drupal module ckeditor_bs_grid on a Drupal 11 site but I see no way to insert
    a grid. How do I make the Bootstrap Grid button available to editors, and what is the toolbar item
    called?
  criteria: Go to /admin/config/content/formats, edit a text format that uses CKEditor 5, and drag the
    'Bootstrap Grid' button (toolbar item id bootstrapGrid, plugin id ckeditor_bs_grid_grid) from Available
    buttons into the Active toolbar, then make sure the format does not strip <div class data-*>. Saving
    stores it in editor.editor.<format> settings.toolbar.items.
  bundle: ckeditor_bs_grid
  rubric_ref: rubric/ckeditor_bs_grid_ckeditor_bs_grid_enable_button@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: ckeditor_bs_grid-per-format-keys
  input: Which per-text-format settings does the Drupal ckeditor_bs_grid module store, and in which configuration
    object do they live?
  criteria: 'In editor.editor.<format> under settings.plugins.ckeditor_bs_grid_grid: use_cdn (bool, default
    TRUE), cdn_url (default the jsDelivr bootstrap 5.2.3 CSS, loaded only inside CKEditor), available_columns
    (default 1-12) and available_breakpoints (default xs, sm, md, lg, xl, xxl).'
  bundle: ckeditor_bs_grid
  rubric_ref: rubric/ckeditor_bs_grid_ckeditor_bs_grid_per_format_keys@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: ckeditor_bs_grid-global-settings
  input: Where do the column layout choices (like 'Equal Width' or '25% / 75%') that the ckeditor_bs_grid
    dialog offers come from in Drupal, and which config object holds them?
  criteria: 'From the site-wide config object ckeditor_bs_grid.settings, key ''breakpoints'': one entry
    per Bootstrap breakpoint (xs, sm, md, lg, xl, xxl) with a label, a prefix (none for xs) and a columns
    tree keyed 1-12, each holding named layouts whose settings map col-<n> to a width token (a number,
    ''equal'' or ''auto''). It is edited at /admin/config/content/ckeditor_bs_grid with the ''administer
    ckeditor_bs_grid'' permission.'
  bundle: ckeditor_bs_grid
  rubric_ref: rubric/ckeditor_bs_grid_ckeditor_bs_grid_global_settings@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: ckeditor_bs_grid-format-settings
  input: One text format on this Drupal site has the CKEditor Bootstrap Grid button enabled. Inspect the
    live configuration and report which column counts and which breakpoints editors may choose in that
    format, and whether Bootstrap CSS is loaded from a CDN inside the editor (give the URL that is configured).
  criteria: 'Format ckbsgrid_eval: editor.editor.ckbsgrid_eval settings.plugins.ckeditor_bs_grid_grid
    has available_columns 1, 2 and 3, available_breakpoints xs and md, use_cdn FALSE and cdn_url https://cdn.example.com/bootstrap-grid.min.css
    (so the CDN stylesheet is configured but switched off).'
  bundle: ckeditor_bs_grid
  rubric_ref: rubric/ckeditor_bs_grid_ckeditor_bs_grid_format_settings@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/ckeditor_bs_grid-format-settings-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/ckeditor_bs_grid-format-settings-cleanup.sh
- id: ckeditor_bs_grid-md-layouts
  input: On this Drupal site the CKEditor Bootstrap Grid layout catalogue has been customised. Inspect
    the live configuration and report the label the 'md' breakpoint now uses and the full list of two-column
    layouts it offers.
  criteria: 'ckeditor_bs_grid.settings breakpoints.md.label is ''Tablet (md)'' and breakpoints.md.columns.2.layouts
    contains Equal Width, Auto, 25% / 75%, 33% / 66%, 66% / 33%, 75% / 25%, Full Width and the added 20%
    / 80% (col-1: 2, col-2: 10).'
  bundle: ckeditor_bs_grid
  rubric_ref: rubric/ckeditor_bs_grid_ckeditor_bs_grid_md_layouts@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/ckeditor_bs_grid-md-layouts-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/ckeditor_bs_grid-md-layouts-cleanup.sh
- id: ckeditor_bs_grid-new-format
  input: On this Drupal site, create a new text format with the machine name ckbsgrid_task that uses CKEditor
    5 and has the CKEditor Bootstrap Grid button in its toolbar. Restrict the grid plugin in that format
    so editors may only pick 1, 2, 3 or 4 columns and only the xs and lg breakpoints. Apply everything
    to the live site.
  criteria: 'filter.format.ckbsgrid_task plus editor.editor.ckbsgrid_task with editor: ckeditor5, settings.toolbar.items
    containing bootstrapGrid, and settings.plugins.ckeditor_bs_grid_grid.available_columns = [1,2,3,4]
    and available_breakpoints = [xs, lg].'
  bundle: ckeditor_bs_grid
  rubric_ref: rubric/ckeditor_bs_grid_ckeditor_bs_grid_new_format@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/ckeditor_bs_grid-new-format-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/ckeditor_bs_grid-new-format-reset.sh
    verify: agent-module-documentation/evaluation/verify/ckeditor_bs_grid-new-format-verify.sh
- id: ckeditor_bs_grid-add-button
  input: The text format 'CKBSGrid Plain' (machine name ckbsgrid_plain) on this Drupal site uses CKEditor
    5 but has no Bootstrap Grid button. Add the CKEditor Bootstrap Grid button to that format's toolbar,
    turn OFF the option that loads Bootstrap from a CDN inside the editor, and set the CDN URL field to
    https://example.com/bootstrap-grid.css . Apply the change to the live site.
  criteria: 'editor.editor.ckbsgrid_plain settings.toolbar.items now contains bootstrapGrid and settings.plugins.ckeditor_bs_grid_grid
    has use_cdn: false and cdn_url: ''https://example.com/bootstrap-grid.css''.'
  bundle: ckeditor_bs_grid
  rubric_ref: rubric/ckeditor_bs_grid_ckeditor_bs_grid_add_button@1.0
