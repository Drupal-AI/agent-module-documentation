rubrics:
- id: ckeditor_bs_grid_ckeditor_bs_grid_enable_button
  version: '1.0'
  applicable_bundles:
  - ckeditor_bs_grid
  checks:
  - kind: must_contain_any
    values:
    - bootstrapGrid
    - Bootstrap Grid
  scoring:
    combine: all_pass
- id: ckeditor_bs_grid_ckeditor_bs_grid_per_format_keys
  version: '1.0'
  applicable_bundles:
  - ckeditor_bs_grid
  checks:
  - kind: must_contain_any
    values:
    - available_columns
    - available_breakpoints
    - use_cdn
  scoring:
    combine: all_pass
- id: ckeditor_bs_grid_ckeditor_bs_grid_global_settings
  version: '1.0'
  applicable_bundles:
  - ckeditor_bs_grid
  checks:
  - kind: must_contain_any
    values:
    - ckeditor_bs_grid.settings
    - breakpoints
  scoring:
    combine: all_pass
- id: ckeditor_bs_grid_ckeditor_bs_grid_format_settings
  version: '1.0'
  applicable_bundles:
  - ckeditor_bs_grid
  checks:
  - kind: must_contain_any
    values:
    - cdn.example.com
  scoring:
    combine: all_pass
- id: ckeditor_bs_grid_ckeditor_bs_grid_md_layouts
  version: '1.0'
  applicable_bundles:
  - ckeditor_bs_grid
  checks:
  - kind: must_contain_any
    values:
    - 20% / 80%
    - Tablet (md)
  scoring:
    combine: all_pass
- id: ckeditor_bs_grid_ckeditor_bs_grid_new_format
  version: '1.0'
  applicable_bundles:
  - ckeditor_bs_grid
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
- id: ckeditor_bs_grid_ckeditor_bs_grid_add_button
  version: '1.0'
  applicable_bundles:
  - ckeditor_bs_grid
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
