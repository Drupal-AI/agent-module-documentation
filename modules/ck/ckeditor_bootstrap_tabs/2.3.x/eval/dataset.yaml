metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: ckeditor_bootstrap_tabs
  version: 2.3.x
  note: CKEditor5 Bootstrap Tabs ships a CKEditor 5 plugin (ckeditor5-bootstrap-tabs.BootstrapTabs) that
    registers the 'bootstrapTabs' toolbar item for inserting Bootstrap tab markup. Depends on ckeditor5.
    It has no configure route, no settings form, no config entity of its own, no permissions, no Drush
    - you enable it by adding 'bootstrapTabs' to a text format's CKEditor 5 toolbar, stored in editor.editor.<format>
    settings.toolbar.items. Medium/hard cases use namespaced ckbt_* text formats + editors and are verified
    against the editor config entity's toolbar items. All fixtures are removed on cleanup; no shared/real
    text format is touched.
questions:
- id: ckeditor_bootstrap_tabs-enable
  input: How do I let editors insert Bootstrap tabs using the ckeditor_bootstrap_tabs module - i.e. how
    do I turn it on for a text format?
  criteria: Edit a CKEditor 5 text format at Configuration > Content authoring > Text formats and editors,
    and drag the 'Bootstrap Tabs' button into the active toolbar (adds the 'bootstrapTabs' item to editor.editor.<format>
    settings.toolbar.items). Ensure the format's allowed HTML permits the tab markup.
  bundle: ckeditor_bootstrap_tabs
  rubric_ref: rubric/ckeditor_bootstrap_tabs_ckeditor_bootstrap_tabs_enable@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: ckeditor_bootstrap_tabs-dependency
  input: What does the ckeditor_bootstrap_tabs module depend on, and what kind of markup does its widget
    produce?
  criteria: 'It depends on the ckeditor5 module. Its widget outputs Bootstrap tab markup: a ul.nav.nav-tabs
    list of tab-link triggers plus a div.tab-content with div.tab-pane panels (the elements it declares
    as allowed).'
  bundle: ckeditor_bootstrap_tabs
  rubric_ref: rubric/ckeditor_bootstrap_tabs_ckeditor_bootstrap_tabs_dependency@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: ckeditor_bootstrap_tabs-toolbar-item
  input: In the ckeditor_bootstrap_tabs module, what is the machine name of the CKEditor 5 toolbar item
    (button) that inserts a tabs widget, and where in configuration is it recorded when enabled?
  criteria: The toolbar item is 'bootstrapTabs' (CKEditor 5 plugin ckeditor5-bootstrap-tabs.BootstrapTabs).
    When enabled it is listed in editor.editor.<format> under settings.toolbar.items.
  bundle: ckeditor_bootstrap_tabs
  rubric_ref: rubric/ckeditor_bootstrap_tabs_ckeditor_bootstrap_tabs_toolbar_item@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: ckeditor_bootstrap_tabs-read-enabled
  input: This Drupal site has a text format 'ckbt_probe' using CKEditor 5. Inspect the live editor configuration
    and tell me whether the Bootstrap Tabs button is enabled on it (and name the toolbar item).
  criteria: Yes - editor.editor.ckbt_probe has 'bootstrapTabs' in settings.toolbar.items, so the Bootstrap
    Tabs button is enabled. Check with `drush cget editor.editor.ckbt_probe settings.toolbar.items`.
  bundle: ckeditor_bootstrap_tabs
  rubric_ref: rubric/ckeditor_bootstrap_tabs_ckeditor_bootstrap_tabs_read_enabled@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/ckeditor_bootstrap_tabs-known-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/ckeditor_bootstrap_tabs-known-cleanup.sh
- id: ckeditor_bootstrap_tabs-which-format
  input: This site has two CKEditor 5 text formats, ckbt_on and ckbt_off. Exactly one of them has the
    Bootstrap Tabs button in its toolbar. Inspect the live configuration and state which format has it
    enabled.
  criteria: ckbt_on has 'bootstrapTabs' in its editor toolbar items; ckbt_off does not.
  bundle: ckeditor_bootstrap_tabs
  rubric_ref: rubric/ckeditor_bootstrap_tabs_ckeditor_bootstrap_tabs_which_format@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/ckeditor_bootstrap_tabs-onoff-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/ckeditor_bootstrap_tabs-onoff-cleanup.sh
- id: ckeditor_bootstrap_tabs-add-button
  input: On this Drupal site there is a CKEditor 5 text format 'ckbt_task' whose toolbar does not yet
    include the Bootstrap Tabs button. Using the ckeditor_bootstrap_tabs module, add the Bootstrap Tabs
    button to that format's CKEditor 5 toolbar. Apply the change to the live site.
  criteria: Add 'bootstrapTabs' to editor.editor.ckbt_task settings.toolbar.items (via the Text format's
    toolbar drag-and-drop, or by editing the editor config).
  bundle: ckeditor_bootstrap_tabs
  rubric_ref: rubric/ckeditor_bootstrap_tabs_ckeditor_bootstrap_tabs_add_button@1.0
