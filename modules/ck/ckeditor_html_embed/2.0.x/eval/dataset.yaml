metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: ckeditor_html_embed
  version: 2.0.x
  note: Ckeditor5 HTML Embed is a thin CKEditor 5 integration (no PHP). It provides a CKEditor 5 plugin
    definition (ckeditor_html_embed.ckeditor5.yml) registering the JS plugin htmlEmbed.HtmlEmbed, a toolbar
    item 'htmlEmbed' (label 'HTML Embed'), the elements <div> and <div class="raw-html-embed">, and htmlEmbed.showPreviews=false.
    It is enabled per text format by adding 'htmlEmbed' to that format's CKEditor 5 toolbar, stored at
    editor.editor.<format> -> settings.toolbar.items. No configure route, no permissions, no Drush, no
    config schema, no public plugin types; depends on core ckeditor5. Medium cases read a live editor's
    toolbar; hard cases require adding the htmlEmbed toolbar item, verified against editor.editor config.
    Fixtures create namespaced chte_* formats and delete them in cleanup/reset.
questions:
- id: chte-toolbar-item
  input: I enabled the Ckeditor5 HTML Embed module. How do I actually let editors embed raw HTML in a
    given text format, and what is the toolbar button called?
  criteria: There is no settings page. Edit the text format at Text formats and editors, and drag the
    'HTML embed' button into that format's CKEditor 5 toolbar (toolbar item id 'htmlEmbed'), then Save.
    The choice is stored on editor.editor.<format> under settings.toolbar.items.
  bundle: ckeditor_html_embed
  rubric_ref: rubric/ckeditor_html_embed_chte_toolbar_item@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: chte-ckeditor-plugin
  input: Which CKEditor 5 JavaScript plugin does the Ckeditor5 HTML Embed module enable, and are HTML
    previews shown or is the raw source shown in the editor?
  criteria: It enables CKEditor 5's htmlEmbed.HtmlEmbed plugin. The module sets htmlEmbed.showPreviews
    to false, so the editor shows the raw HTML source rather than a rendered preview.
  bundle: ckeditor_html_embed
  rubric_ref: rubric/ckeditor_html_embed_chte_ckeditor_plugin@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: chte-allowed-elements
  input: For the Ckeditor5 HTML Embed module, which HTML elements does the plugin declare it produces,
    and which core module is it dependent on?
  criteria: The plugin declares the elements <div> and <div class="raw-html-embed">. The module depends
    on core's ckeditor5 module. If the format's allowed-HTML filter is on, add the tags you want editors
    to embed.
  bundle: ckeditor_html_embed
  rubric_ref: rubric/ckeditor_html_embed_chte_allowed_elements@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: chte-which-format
  input: On this site, which text format has the CKEditor 5 HTML embed button enabled in its toolbar?
    Inspect the live editor configuration and name the format (machine name).
  criteria: The format chte_med (label 'CHTE Med') has 'htmlEmbed' in editor.editor.chte_med settings.toolbar.items.
  bundle: ckeditor_html_embed
  rubric_ref: rubric/ckeditor_html_embed_chte_which_format@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/ckeditor_html_embed-which-format-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/ckeditor_html_embed-which-format-cleanup.sh
- id: chte-button-id
  input: The text format 'CHTE Med2' (machine name chte_med2) on this site lets editors embed raw HTML.
    Inspect its live CKEditor 5 configuration and give the exact toolbar item id that provides the HTML
    embed feature.
  criteria: The toolbar item id is 'htmlEmbed' - present in editor.editor.chte_med2 settings.toolbar.items
    alongside heading and link.
  bundle: ckeditor_html_embed
  rubric_ref: rubric/ckeditor_html_embed_chte_button_id@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/ckeditor_html_embed-button-id-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/ckeditor_html_embed-button-id-cleanup.sh
- id: chte-add-button
  input: On this Drupal site there is a CKEditor 5 text format 'CHTE Hard' (machine name chte_hard) whose
