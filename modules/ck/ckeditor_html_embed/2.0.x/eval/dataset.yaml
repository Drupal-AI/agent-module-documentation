    HTML embed button to that format's CKEditor 5 toolbar. Apply the change to the live site.
  criteria: Add 'htmlEmbed' to editor.editor.chte_hard settings.toolbar.items and save (e.g. via the format's
    toolbar UI or Editor::setSettings()). Verify checks 'htmlEmbed' is in the toolbar items.
  bundle: ckeditor_html_embed
  rubric_ref: rubric/ckeditor_html_embed_chte_add_button@1.0
  tags:
