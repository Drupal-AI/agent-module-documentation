metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: ckeditor_responsive_table
  version: 1.0.x
  note: 'The module adds a CKEditor 5 toolbar item ''customTable'' (label ''Responsive Table'') declared
    in ckeditor_responsive_table.ckeditor5.yml. Enabling it per text format stores ''customTable'' in
    editor.editor.<format> settings.toolbar.items. A separate admin form (route ckeditor_responsive_table.form)
    writes ckeditor_responsive_table.settings: table_selector, fail_class (default tabled--stacked), caption_side,
    large/small_character_threshold. info.yml has no ''configure'' key so configure=null. Medium/hard
    cases are grounded in that real config: the settings config object and namespaced crt_* text-format/editor
    entities created for the eval.'
questions:
- id: ckeditor_responsive_table-enable
  input: I installed the CKEditor 5 Responsive Table module. How do I actually enable the responsive table
    button for editors on a given text format, and what is the CKEditor 5 toolbar item id involved?
  criteria: Go to /admin/config/content/formats, Configure a CKEditor 5 format, drag the 'Responsive Table'
    button into the Active toolbar and save. This adds the toolbar item 'customTable' to editor.editor.<format>
    settings.toolbar.items.
  bundle: ckeditor_responsive_table
  rubric_ref: rubric/ckeditor_responsive_table_ckeditor_responsive_table_enable@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: ckeditor_responsive_table-settings
  input: Which configuration object holds the CKEditor Responsive Table front-end settings, and what is
    the default 'fail class' applied to a table that cannot be made responsive?
  criteria: Config object ckeditor_responsive_table.settings holds table_selector, fail_class (default
    tabled--stacked), caption_side (top/bottom), and large/small_character_threshold. Edited at /admin/config/content/ckeditor-responsive-table.
  bundle: ckeditor_responsive_table
  rubric_ref: rubric/ckeditor_responsive_table_ckeditor_responsive_table_settings@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: ckeditor_responsive_table-why
  input: How is the table produced by the CKEditor 5 Responsive Table module different from the table
    produced by CKEditor's built-in table button?
  criteria: The built-in table button is not responsive. This module's tables are accessible by default
    and collapse/stack on narrow screens (using a data-label based 'tabled' script), with controls for
    rows, columns, headers, and a caption (visible or hidden).
  bundle: ckeditor_responsive_table
  rubric_ref: rubric/ckeditor_responsive_table_ckeditor_responsive_table_why@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: ckeditor_responsive_table-crt-caption
  input: On this Drupal site, the CKEditor Responsive Table module's settings have been customized. Inspect
    the live configuration and state which side the table caption is configured to appear on.
  criteria: caption_side is 'bottom' in ckeditor_responsive_table.settings (read via `drush config:get
    ckeditor_responsive_table.settings caption_side`).
  bundle: ckeditor_responsive_table
  rubric_ref: rubric/ckeditor_responsive_table_ckeditor_responsive_table_crt_caption@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/ckeditor_responsive_table-crt-caption-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/ckeditor_responsive_table-crt-caption-cleanup.sh
- id: ckeditor_responsive_table-crt-format
  input: One of the text formats on this site has the CKEditor 5 Responsive Table button enabled in its
    toolbar. Inspect the editor configuration and give the machine name of that text format.
  criteria: The format crt_medium has 'customTable' in editor.editor.crt_medium settings.toolbar.items.
  bundle: ckeditor_responsive_table
  rubric_ref: rubric/ckeditor_responsive_table_ckeditor_responsive_table_crt_format@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/ckeditor_responsive_table-crt-format-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/ckeditor_responsive_table-crt-format-cleanup.sh
- id: ckeditor_responsive_table-crt-set-caption
  input: On this Drupal site, configure the CKEditor Responsive Table module so that table captions are
    rendered at the BOTTOM of the table (not the top). Apply the change to the live configuration.
  criteria: ckeditor_responsive_table.settings caption_side is set to 'bottom' (e.g. `drush config:set
    ckeditor_responsive_table.settings caption_side bottom -y`).
  bundle: ckeditor_responsive_table
  rubric_ref: rubric/ckeditor_responsive_table_ckeditor_responsive_table_crt_set_caption@1.0
