rubrics:
- id: ckeditor5_icons_ckeditor5_icons_where_configured
  version: '1.0'
  applicable_bundles:
  - ckeditor5_icons
  checks:
  - kind: must_contain_any
    values:
    - text format
    - Text formats and editors
    - editor.editor
    - toolbar
    - admin/config/content/formats
  scoring:
    combine: all_pass
- id: ckeditor5_icons_ckeditor5_icons_config_keys
  version: '1.0'
  applicable_bundles:
  - ckeditor5_icons
  checks:
  - kind: must_contain_any
    values:
    - ckeditor5_icons_icon
    - fa_version
    - fa_styles
  scoring:
    combine: all_pass
- id: ckeditor5_icons_ckeditor5_icons_markup_and_css
  version: '1.0'
  applicable_bundles:
  - ckeditor5_icons
  checks:
  - kind: must_contain_any
    values:
    - <i
    - fa-solid
    - fa-brands
    - class
  scoring:
    combine: all_pass
- id: ckeditor5_icons_ckeditor5_icons_known_format
  version: '1.0'
  applicable_bundles:
  - ckeditor5_icons
  checks:
  - kind: must_contain_any
    values:
    - star
  scoring:
    combine: all_pass
- id: ckeditor5_icons_ckeditor5_icons_styles_per_format
  version: '1.0'
  applicable_bundles:
  - ckeditor5_icons
  checks:
  - kind: must_contain_any
    values:
    - ckeditor5_icons_beta
  scoring:
    combine: all_pass
- id: ckeditor5_icons_ckeditor5_icons_enable_picker
  version: '1.0'
  applicable_bundles:
  - ckeditor5_icons
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
- id: ckeditor5_icons_ckeditor5_icons_switch_fa5
  version: '1.0'
  applicable_bundles:
  - ckeditor5_icons
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
