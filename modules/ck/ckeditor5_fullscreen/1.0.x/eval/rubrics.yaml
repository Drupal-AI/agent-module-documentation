rubrics:
- id: ckeditor5_fullscreen_ckeditor5_fullscreen_how_to_add
  version: '1.0'
  applicable_bundles:
  - ckeditor5_fullscreen
  checks:
  - kind: must_contain_any
    values:
    - Manage form display
    - text format
    - toolbar builder
    - drag
    - Active toolbar
    - editor.editor
    - settings.toolbar.items
  scoring:
    combine: all_pass
- id: ckeditor5_fullscreen_ckeditor5_fullscreen_exact_item_id
  version: '1.0'
  applicable_bundles:
  - ckeditor5_fullscreen
  checks:
  - kind: must_contain_any
    values:
    - Fullscreen
  scoring:
    combine: all_pass
- id: ckeditor5_fullscreen_ckeditor5_fullscreen_what_it_does
  version: '1.0'
  applicable_bundles:
  - ckeditor5_fullscreen
  checks:
  - kind: must_contain_any
    values:
    - data-fullscreen
    - viewport
    - overlay
    - full screen
    - fullscreen
  scoring:
    combine: all_pass
- id: ckeditor5_fullscreen_ckeditor5_fullscreen_known_format
  version: '1.0'
