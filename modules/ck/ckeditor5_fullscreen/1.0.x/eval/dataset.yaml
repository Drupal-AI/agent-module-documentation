metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: ckeditor5_fullscreen
  version: 1.0.x
  note: 'CKEditor5 Fullscreen is a pure UI plugin module: one CKEditor 5 plugin (fullscreen.Fullscreen)
    contributing a single toolbar button whose Drupal toolbar item id is the literal string ''Fullscreen''
    (capital F, from ckeditor5_fullscreen.ckeditor5.yml -> drupal.toolbar_items, confirmed by the admin
    CSS selector .ckeditor5-toolbar-button-Fullscreen). It has no settings form, no configure route (configure=null),
    no permissions, no Drush, no config schema of its own. Its entire persistent state is that string
    appearing (or not) in a text format''s editor.editor.<format> config entity at settings.toolbar.items.
    All medium/hard cases are grounded in that real config on namespaced ck5fs_* text formats/editors
    created for the eval and cleaned up afterward; shared formats (full_html/basic_html) are never touched.'
questions:
- id: ckeditor5_fullscreen-how-to-add
  input: The Drupal contrib module ckeditor5_fullscreen adds a fullscreen/maximize button to CKEditor
    5. I've enabled the module but the button doesn't show up in any text format's toolbar yet. How do
    I actually add it to a text format's toolbar, and where does that choice get stored in configuration?
  criteria: There is no configure route (configure=null) and no settings form. Go to /admin/config/content/formats/manage/<format>
    and drag the 'Fullscreen' button from the available buttons into the Active toolbar tray, then Save
    configuration. The choice is stored in the editor.editor.<format> config entity, in settings.toolbar.items,
    alongside the format's other CKEditor 5 buttons.
  bundle: ckeditor5_fullscreen
  rubric_ref: rubric/ckeditor5_fullscreen_ckeditor5_fullscreen_how_to_add@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: ckeditor5_fullscreen-exact-item-id
  input: What is the exact CKEditor 5 toolbar item id that the Drupal module ckeditor5_fullscreen registers
    for its button? I need the precise string as it would appear in a text format's toolbar items list
    (e.g. next to 'bold' or 'italic').
  criteria: The toolbar item id is exactly 'Fullscreen' (capital F), as declared under drupal.toolbar_items
    in ckeditor5_fullscreen.ckeditor5.yml. It appears verbatim in editor.editor.<format> settings.toolbar.items,
    e.g. ['bold', 'italic', 'Fullscreen'].
  bundle: ckeditor5_fullscreen
  rubric_ref: rubric/ckeditor5_fullscreen_ckeditor5_fullscreen_exact_item_id@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: ckeditor5_fullscreen-what-it-does
  input: In practical terms, what happens when an editor clicks the 'Fullscreen' button that the ckeditor5_fullscreen
    module adds to CKEditor 5? Does it change any stored content or filter output?
  criteria: Clicking it toggles a data-fullscreen attribute on the editor's DOM wrapper and on <body>;
    shipped CSS then positions the editor as a fixed, full-viewport overlay and hides Drupal's displaced
    toolbars while active. It is purely client-side UI/CSS/JS behavior -- no stored field values, filters,
    or rendered output are changed.
  bundle: ckeditor5_fullscreen
  rubric_ref: rubric/ckeditor5_fullscreen_ckeditor5_fullscreen_what_it_does@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: ckeditor5_fullscreen-known-format
  input: On this Drupal site there is a text format ck5fs_eval with a CKEditor 5 editor. Inspect the live
    editor configuration for that format and report whether its toolbar includes the ckeditor5_fullscreen
    module's Fullscreen button.
  criteria: Yes -- editor.editor.ck5fs_eval has settings.toolbar.items containing 'Fullscreen' (along
    with 'bold' and 'italic'), so the fullscreen button is present in that format's toolbar.
  bundle: ckeditor5_fullscreen
  rubric_ref: rubric/ckeditor5_fullscreen_ckeditor5_fullscreen_known_format@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/ckeditor5_fullscreen-known-format-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/ckeditor5_fullscreen-known-format-cleanup.sh
- id: ckeditor5_fullscreen-absent-format
  input: On this Drupal site there is a text format ck5fs_eval2 with a CKEditor 5 editor. Inspect the
    live editor configuration for that format and state whether the ckeditor5_fullscreen module's Fullscreen
    button is present in its toolbar.
  criteria: No -- editor.editor.ck5fs_eval2 settings.toolbar.items is ['bold', 'italic', 'sourceEditing'],
    which does not contain 'Fullscreen'; the fullscreen button is not enabled on this format.
  bundle: ckeditor5_fullscreen
  rubric_ref: rubric/ckeditor5_fullscreen_ckeditor5_fullscreen_absent_format@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/ckeditor5_fullscreen-absent-format-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/ckeditor5_fullscreen-absent-format-cleanup.sh
- id: ckeditor5_fullscreen-add-button
  input: On this Drupal site, the text format ck5fs_task has a CKEditor 5 editor whose toolbar currently
    only has 'bold' and 'italic'. Using the ckeditor5_fullscreen module, add the Fullscreen button to
    that format's CKEditor 5 toolbar. Apply the change to the live site.
  criteria: editor.editor.ck5fs_task settings.toolbar.items ends up containing 'Fullscreen' (e.g. append
    it to the array via drush php:eval and save the Editor entity, or drag the Fullscreen button into
    the Active toolbar on /admin/config/content/formats/manage/ck5fs_task and Save configuration).
  bundle: ckeditor5_fullscreen
  rubric_ref: rubric/ckeditor5_fullscreen_ckeditor5_fullscreen_add_button@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/ckeditor5_fullscreen-add-button-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/ckeditor5_fullscreen-add-button-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/ckeditor5_fullscreen-add-button-verify.sh
- id: ckeditor5_fullscreen-add-button2
  input: On this Drupal site, the text format ck5fs_task2 has a CKEditor 5 editor whose toolbar currently
    has 'heading', 'bold', 'italic', 'link', and 'sourceEditing'. Using the ckeditor5_fullscreen module,
    add the Fullscreen button to that format's CKEditor 5 toolbar, keeping the existing buttons. Apply
    the change to the live site.
  criteria: editor.editor.ck5fs_task2 settings.toolbar.items ends up containing 'Fullscreen' alongside
    the pre-existing 'heading', 'bold', 'italic', 'link', 'sourceEditing' items (append and save, or drag
    Fullscreen into the Active toolbar on /admin/config/content/formats/manage/ck5fs_task2 and Save configuration).
  bundle: ckeditor5_fullscreen
  rubric_ref: rubric/ckeditor5_fullscreen_ckeditor5_fullscreen_add_button2@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/ckeditor5_fullscreen-add-button2-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/ckeditor5_fullscreen-add-button2-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/ckeditor5_fullscreen-add-button2-verify.sh
