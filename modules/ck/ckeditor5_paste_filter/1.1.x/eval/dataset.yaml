metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: ckeditor5_paste_filter
  version: 1.1.x
  note: CKEditor 5 Paste Filter is configured per text format (no settings route), ships a CKEditor 5
    client-side plugin that regex-cleans pasted HTML, and stores config on the editor entity. Cases are
    `recipe` (response-graded) probing documented facts an agent would otherwise read source to answer;
    no site mutation.
questions:
- id: ckeditor5-paste-filter-enable
  input: How do I turn on CKEditor 5 Paste Filter for a text format on a Drupal 11 site? Is there a dedicated
    settings page?
  criteria: No dedicated settings route; edit a text format that uses CKEditor 5 (/admin/config/content/formats),
    open the 'Paste filter' vertical tab under CKEditor 5 plugin settings, check 'Filter pasted content',
    and save.
  bundle: ckeditor5_paste_filter
  rubric_ref: rubric/ckeditor5_paste_filter_ckeditor5_paste_filter_enable@1.0
  tags:
  - mode:recipe
- id: ckeditor5-paste-filter-purpose
  input: What does the ckeditor5_paste_filter module do and what is its most common use case?
  criteria: It filters content pasted into CKEditor 5 through configurable regex search/replace rules;
    the common use case is cleaning up markup pasted from Microsoft Word and Google Docs.
  bundle: ckeditor5_paste_filter
  rubric_ref: rubric/ckeditor5_paste_filter_ckeditor5_paste_filter_purpose@1.0
  tags:
  - mode:recipe
- id: ckeditor5-paste-filter-regex-flags
  input: In CKEditor 5 Paste Filter, what regular-expression flags are applied to each search expression,
    and can the replacement reference capture groups?
  criteria: Each search regex is compiled with the flags gimsu (global, ignoreCase, multiline, dotAll,
    unicode), entered without delimiters; replacements can reference capture groups like $1, $2.
  bundle: ckeditor5_paste_filter
  rubric_ref: rubric/ckeditor5_paste_filter_ckeditor5_paste_filter_regex_flags@1.0
  tags:
  - mode:recipe
- id: ckeditor5-paste-filter-plugin-event
  input: Which CKEditor 5 plugin/event does ckeditor5_paste_filter hook into to intercept pasted content,
    and what does it do with the HTML?
  criteria: The client-side PasteFilter plugin listens on the ClipboardPipeline 'inputTransformation'
    event, serializes the pasted content to HTML, runs each configured regex replace over it, and writes
    the cleaned HTML back to data.content.
  bundle: ckeditor5_paste_filter
  rubric_ref: rubric/ckeditor5_paste_filter_ckeditor5_paste_filter_plugin_event@1.0
  tags:
  - mode:recipe
- id: ckeditor5-paste-filter-remove-filter
  input: In the CKEditor 5 Paste Filter configuration table, how do I remove one of the default filters
    entirely?
  criteria: Empty BOTH the Search expression and Replacement fields for that row; the empty filter is
    dropped when you save the text format.
  bundle: ckeditor5_paste_filter
  rubric_ref: rubric/ckeditor5_paste_filter_ckeditor5_paste_filter_remove_filter@1.0
  tags:
  - mode:recipe
- id: ckeditor5-paste-filter-config-location
  input: Where is the ckeditor5_paste_filter configuration stored and under what key, and what is the
    config schema type name?
  criteria: On the editor entity (editor.editor.{format}) under settings.plugins.ckeditor5_paste_filter_pasteFilter
    (enabled + filters[]); schema type ckeditor5.plugin.ckeditor5_paste_filter_pasteFilter.
  bundle: ckeditor5_paste_filter
  rubric_ref: rubric/ckeditor5_paste_filter_ckeditor5_paste_filter_config_location@1.0
  tags:
  - mode:recipe
- id: ckeditor5-paste-filter-dependency
  input: What is required to use the ckeditor5_paste_filter module?
  criteria: It depends on the CKEditor 5 module from Drupal core (drupal:ckeditor5); the text format's
    editor must be CKEditor 5.
  bundle: ckeditor5_paste_filter
  rubric_ref: rubric/ckeditor5_paste_filter_ckeditor5_paste_filter_dependency@1.0
  tags:
  - mode:recipe
- id: ckeditor5-paste-filter-defaults
  input: What kinds of markup do the default filters in CKEditor 5 Paste Filter strip out of pasted content?
  criteria: 'The ~14 default filters strip Word/Docs cruft: <o:p> tags, inline style/face/class/valign
    attributes, <font> and <span> wrappers, &nbsp;-only and empty <p>/<b>/<i> tags, and Word OLE_LINK
    anchors.'
  bundle: ckeditor5_paste_filter
  rubric_ref: rubric/ckeditor5_paste_filter_ckeditor5_paste_filter_defaults@1.0
  tags:
  - mode:recipe
