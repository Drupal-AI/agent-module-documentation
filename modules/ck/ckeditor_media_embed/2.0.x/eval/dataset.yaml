metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: ckeditor_media_embed
  version: 2.0.x
  note: CKEditor Media Embed adds CKEditor 5's Media Embed to Drupal. Authors insert a media URL; CKEditor
    stores an <oembed url> tag; the reversible text filter filter_ckeditor_media_embed ('Convert Oembed
    tags to media embeds') converts it to embed HTML at render time by resolving each URL through the
    configurable oEmbed provider (config ckeditor_media_embed.settings -> embed_provider, Iframely by
    default). The CKEditor plugin JS is NOT bundled and is downloaded with 'drush ckeditor_media_embed:install'
    / ':update'. Config object is ckeditor_media_embed.settings (embed_provider, ckeditor_version, plugins_version_installed).
    Settings route ckeditor_media_embed.ckeditor_media_embed_settings_form at /admin/config/media/ckeditor-media-embed/settings
    (permission administer filters). Also provides a link field formatter ckeditor_media_embed_link_formatter
    and hook_ckeditor_media_embed_object_alter(). Medium cases read back the live embed_provider value
    and which text format enables the filter; hard cases switch the provider to Noembed and enable the
    filter on a text format, both verified against live config.
questions:
- id: ckeditor_media_embed-how-renders
  input: On a Drupal 11 site using the ckeditor_media_embed module, an author inserted a YouTube URL and
    CKEditor saved an <oembed url="..."> tag into the body. What must be enabled on that text format so
    the stored <oembed> tag actually renders as embedded media, and what is that filter's machine id?
  criteria: The 'Convert Oembed tags to media embeds' text filter (id filter_ckeditor_media_embed), a
    reversible transform filter, must be enabled on that text format. It calls the ckeditor_media_embed
    service to fetch each <oembed> URL from the configured provider and replace the tag with embed HTML
    at render time.
  bundle: ckeditor_media_embed
  rubric_ref: rubric/ckeditor_media_embed_ckeditor_media_embed_how_renders@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: ckeditor_media_embed-set-provider
  input: How do I change which oEmbed service the ckeditor_media_embed module uses to resolve media URLs
    (e.g. from Iframely to Noembed), and where is that setting stored?
  criteria: Set the Provider URL on the settings form at /admin/config/media/ckeditor-media-embed/settings
    (route ckeditor_media_embed.ckeditor_media_embed_settings_form, permission 'administer filters'),
    or set the embed_provider key on the ckeditor_media_embed.settings config object (e.g. drush cset).
    The template uses {url} and {callback} tokens; only one provider is active at a time.
  bundle: ckeditor_media_embed
  rubric_ref: rubric/ckeditor_media_embed_ckeditor_media_embed_set_provider@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: ckeditor_media_embed-install-plugin-js
  input: After enabling ckeditor_media_embed on Drupal 11 the Media embed button doesn't work and the
    Status Report says plugins are missing. Why, and what command fixes it?
  criteria: The CKEditor 5 media-embed plugin JavaScript is not bundled with the module; it must be downloaded
    into libraries/ckeditor5/plugins/. Run 'drush ckeditor_media_embed:install' (and 'drush ckeditor_media_embed:update'
    after a core CKEditor version change). Until then hook_requirements/hook_ckeditor_plugin_info_alter
    flag the plugin as missing.
  bundle: ckeditor_media_embed
  rubric_ref: rubric/ckeditor_media_embed_ckeditor_media_embed_install_plugin_js@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: ckeditor_media_embed-current-provider
  input: On this Drupal site the ckeditor_media_embed module is configured with a non-default oEmbed provider.
    Inspect the live configuration and report the exact Provider URL that ckeditor_media_embed will use
    to resolve media embeds.
  criteria: The embed_provider in ckeditor_media_embed.settings is //noembed.com/embed?url={url}&callback={callback}&ckme_probe=CKMEPROBE1
    (readable with `drush cget ckeditor_media_embed.settings embed_provider`).
  bundle: ckeditor_media_embed
  rubric_ref: rubric/ckeditor_media_embed_ckeditor_media_embed_current_provider@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/ckeditor_media_embed-provider-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/ckeditor_media_embed-provider-cleanup.sh
- id: ckeditor_media_embed-which-format
  input: This Drupal site has a text format that will convert CKEditor <oembed> tags into embedded media.
    Inspect the live filter-format configuration and state which text format (machine name) has the ckeditor_media_embed
    conversion filter enabled, and the filter's id.
  criteria: 'The text format ckme_probe_format has filter_ckeditor_media_embed (''Convert Oembed tags
    to media embeds'') enabled (status: true) in filter.format.ckme_probe_format.'
  bundle: ckeditor_media_embed
  rubric_ref: rubric/ckeditor_media_embed_ckeditor_media_embed_which_format@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/ckeditor_media_embed-filter-format-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/ckeditor_media_embed-filter-format-cleanup.sh
- id: ckeditor_media_embed-configure-noembed
  input: On this Drupal site, configure the ckeditor_media_embed module to resolve media embeds through
    the Noembed service instead of Iframely. Set its oEmbed Provider URL to exactly //noembed.com/embed?url={url}&callback={callback}
    and apply the change to the live site.
  criteria: Set embed_provider on the ckeditor_media_embed.settings config to //noembed.com/embed?url={url}&callback={callback}
    (via the settings form at /admin/config/media/ckeditor-media-embed/settings or `drush cset ckeditor_media_embed.settings
    embed_provider '//noembed.com/embed?url={url}&callback={callback}'`).
  bundle: ckeditor_media_embed
  rubric_ref: rubric/ckeditor_media_embed_ckeditor_media_embed_configure_noembed@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/ckeditor_media_embed-set-provider-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/ckeditor_media_embed-set-provider-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/ckeditor_media_embed-set-provider-verify.sh
- id: ckeditor_media_embed-enable-filter
  input: This Drupal site has a text format with machine name ckme_hard_format that does not yet convert
    CKEditor media embeds. Using the ckeditor_media_embed module, make that text format convert <oembed>
    tags into embedded media, and apply the change to the live site.
  criteria: 'Enable the filter_ckeditor_media_embed (''Convert Oembed tags to media embeds'') filter on
    the ckme_hard_format text format (via /admin/config/content/formats/manage/ckme_hard_format or by
    setting filters.filter_ckeditor_media_embed.status: true), so filter.format.ckme_hard_format carries
    that filter enabled.'
  bundle: ckeditor_media_embed
  rubric_ref: rubric/ckeditor_media_embed_ckeditor_media_embed_enable_filter@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/ckeditor_media_embed-enable-filter-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/ckeditor_media_embed-enable-filter-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/ckeditor_media_embed-enable-filter-verify.sh
