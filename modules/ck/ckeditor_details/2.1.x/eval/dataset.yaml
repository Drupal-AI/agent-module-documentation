  criteria: 'ckd_on has the accordion button: editor.editor.ckd_on settings.toolbar.items includes ''detail'',
    while ckd_off''s toolbar does not.'
  bundle: ckeditor_details
  rubric_ref: rubric/ckeditor_details_ckeditor_details_onoff@1.0
  tags:
