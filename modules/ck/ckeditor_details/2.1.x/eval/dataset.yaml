metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: ckeditor_details
  version: 2.1.x
  note: CKEditor Accordion (Detail Plugin) adds a CKEditor 5 toolbar item 'detail' (label 'Add accordion',
    plugin ckeditor_details_detail / JS detail.Detail) that inserts a native <details>/<summary>/<div
    class="details-wrapper"> accordion. No module config (configure=null); you enable it per text format
    by adding 'detail' to the CKEditor 5 toolbar, stored in editor.editor.<format> settings.toolbar.items.
    Medium/hard cases create namespaced CKEditor5 formats (ckd_*) and read/verify the 'detail' toolbar
    item in the live editor config.
questions:
- id: ckeditor_details-what-element
  input: The ckeditor_details module adds an 'Add accordion' button to CKEditor 5. What HTML does it insert
    when an editor clicks it?
  criteria: 'It inserts a native HTML5 disclosure widget: a <details> element containing a <summary> and
    a <div class="details-wrapper"> body, which browsers render as a click-to-expand accordion with no
    runtime JavaScript.'
  bundle: ckeditor_details
  rubric_ref: rubric/ckeditor_details_ckeditor_details_what_element@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: ckeditor_details-how-to-enable
  input: How do I enable the ckeditor_details accordion button for a text format on a Drupal 11 site,
    and what is the toolbar item's machine name? Is there a module settings page?
  criteria: There is no module settings page (configure=null). On Text formats and editors (/admin/config/content/formats),
    edit a CKEditor 5 format and drag the Detail button into its toolbar; the toolbar item machine name
    is 'detail'. It is stored in editor.editor.<format> at settings.toolbar.items.
  bundle: ckeditor_details
  rubric_ref: rubric/ckeditor_details_ckeditor_details_how_to_enable@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: ckeditor_details-allowed-html
  input: After adding the ckeditor_details accordion button to a text format that restricts allowed HTML,
    the accordion markup gets stripped on save. What HTML elements must the format allow for the accordion
    to survive?
  criteria: 'The format''s Limit allowed HTML tags filter must permit the elements the plugin declares:
    <details>, <summary>, <div>, and <div class="details-wrapper">. Otherwise filter_html strips the accordion
    markup.'
  bundle: ckeditor_details
  rubric_ref: rubric/ckeditor_details_ckeditor_details_allowed_html@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: ckeditor_details-which-format-has-it
  input: On this Drupal site, one CKEditor 5 text format has the accordion (detail) button in its toolbar.
    Inspect the live editor configuration and name that text format.
  criteria: 'The format is ckd_known: editor.editor.ckd_known settings.toolbar.items includes ''detail''.'
  bundle: ckeditor_details
  rubric_ref: rubric/ckeditor_details_ckeditor_details_which_format_has_it@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
