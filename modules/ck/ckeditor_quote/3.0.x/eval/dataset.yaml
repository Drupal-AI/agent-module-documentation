metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: ckeditor_quote
  version: 3.0.x
  note: 'CKEditor Quote registers one CKEditor 5 plugin (ckeditor_quote.ckeditor5.yml: plugin id ckeditor_quote_quote,
    JS plugin quote.Quote) exposing a single toolbar item named ''Quote'' (label ''Quote Dialog''). It
    has no settings form, no configure route, no permissions, no config schema. You enable it by adding
    ''Quote'' to a text format''s CKEditor 5 toolbar, stored on editor.editor.<format> -> settings.toolbar.items.
    It inserts a <blockquote> with a <div class="author"> author line and declares elements <p>,<div>,<div
    class="author">,<blockquote>. All medium/hard cases are grounded in real CKEditor 5 text-format/editor
    config entities on this site (ckq_* formats), with verify reading settings.toolbar.items.'
questions:
- id: ckq-what-and-enable
  input: What does the Drupal ckeditor_quote module add, and how do I enable it for editors on a specific
    text format in Drupal 11 (CKEditor 5)?
  criteria: It adds a CKEditor 5 'Quote' toolbar button (tooltip 'Quote Dialog') that inserts a <blockquote>
    containing the quote text and an attributed author line. Enable it by editing a text format that uses
    CKEditor 5 (/admin/config/content/formats) and dragging the Quote button into the active toolbar;
    that stores 'Quote' in editor.editor.<format> settings.toolbar.items.
  bundle: ckeditor_quote
  rubric_ref: rubric/ckeditor_quote_ckq_what_and_enable@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: ckq-produced-html
  input: What HTML markup does the ckeditor_quote CKEditor plugin produce for a quote with an author,
    and how does the author appear?
  criteria: It saves a <blockquote> wrapper containing the quote (in a <div class="quote"><p>...</p></div>)
    and the author in a <div class="author">...</div>. On load it also up-casts existing <blockquote>
    content and treats a child <div class="author"> or <cite> as the author, so plain blockquotes without
    an author still work.
  bundle: ckeditor_quote
  rubric_ref: rubric/ckeditor_quote_ckq_produced_html@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: ckq-allowed-tags
  input: If a text format uses 'Limit allowed HTML tags' (filter_html), which HTML elements does the ckeditor_quote
    plugin need to be allowed so its quotes work?
  criteria: The plugin declares elements <p>, <div>, <div class="author"> and <blockquote>. CKEditor 5
    auto-adds these to the format's allowed tags when the Quote button is enabled, so the author div and
    blockquote are permitted.
  bundle: ckeditor_quote
  rubric_ref: rubric/ckeditor_quote_ckq_allowed_tags@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: ckq-known-format
  input: This Drupal site has a CKEditor 5 text format named ckq_known. Inspect its live editor configuration
    and state whether the ckeditor_quote 'Quote' button is enabled in its toolbar.
  criteria: 'Yes: editor.editor.ckq_known has editor: ckeditor5 and settings.toolbar.items includes ''Quote''
    (the ckeditor_quote toolbar item).'
  bundle: ckeditor_quote
  rubric_ref: rubric/ckeditor_quote_ckq_known_format@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/ckeditor_quote-known-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/ckeditor_quote-known-cleanup.sh
- id: ckq-on-vs-off
  input: This site has two CKEditor 5 text formats, ckq_on and ckq_off. Exactly one has the ckeditor_quote
    Quote button enabled in its toolbar. Inspect the live editor configuration and say which format has
    it.
  criteria: 'ckq_on: its editor.editor.ckq_on settings.toolbar.items contains ''Quote'', while ckq_off''s
    toolbar does not.'
  bundle: ckeditor_quote
  rubric_ref: rubric/ckeditor_quote_ckq_on_vs_off@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/ckeditor_quote-onoff-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/ckeditor_quote-onoff-cleanup.sh
- id: ckq-add-to-format
  input: On this Drupal site there is a CKEditor 5 text format ckq_task whose toolbar does not yet include
    the ckeditor_quote button. Add the Quote button to that format's CKEditor 5 toolbar and apply the
    change to the live site.
  criteria: Add 'Quote' to editor.editor.ckq_task settings.toolbar.items (drag it into the toolbar on
    the format's config form, or load the Editor entity, push 'Quote' onto settings.toolbar.items, and
    save).
  bundle: ckeditor_quote
  rubric_ref: rubric/ckeditor_quote_ckq_add_to_format@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/ckeditor_quote-add-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/ckeditor_quote-add-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/ckeditor_quote-add-verify.sh
- id: ckq-new-format
  input: Create a new rich-text format on my Drupal site called 'ckq_new' that uses the modern CKEditor
    and gives editors the quote-with-author button from the ckeditor_quote module. Set it up on the live
    site.
  criteria: 'Create a filter_format with id ckq_new and an editor.editor.ckq_new using editor: ckeditor5
    whose settings.toolbar.items includes ''Quote''. Verify checks the format exists, uses ckeditor5,
    and has ''Quote'' in the toolbar.'
  bundle: ckeditor_quote
  rubric_ref: rubric/ckeditor_quote_ckq_new_format@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-layman
    reset: agent-module-documentation/evaluation/verify/ckeditor_quote-new-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/ckeditor_quote-new-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/ckeditor_quote-new-verify.sh
