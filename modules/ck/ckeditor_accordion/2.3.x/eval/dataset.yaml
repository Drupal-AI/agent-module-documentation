metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: ckeditor_accordion
  version: 2.3.x
  note: 'CKEditor Accordion is a CKEditor 5 plugin module: a toolbar button enabled per text format, a
    small settings form (no config schema), and a global frontend behavior. Cases are `recipe` (response-graded),
    probing documented facts an agent would otherwise read source to answer; no site mutation.'
questions:
- id: ckeditor_accordion-enable-button
  input: How do I make the Accordion button available to editors in CKEditor 5 on a Drupal site? Where
    is it enabled?
  criteria: 'It is a per-text-format CKEditor 5 toolbar item: edit a format at Admin → Content authoring
    → Text formats and editors and drag the Accordion button onto the active toolbar.'
  bundle: ckeditor_accordion
  rubric_ref: rubric/ckeditor_accordion_ckeditor_accordion_enable_button@1.0
  tags:
  - mode:recipe
- id: ckeditor_accordion-plugin-id
  input: What is the CKEditor 5 plugin id and toolbar item name that CKEditor Accordion registers?
  criteria: The CKEditor 5 plugin is accordion.Accordion and the toolbar item id is Accordion (defined
    in ckeditor_accordion.ckeditor5.yml).
  bundle: ckeditor_accordion
  rubric_ref: rubric/ckeditor_accordion_ckeditor_accordion_plugin_id@1.0
  tags:
  - mode:recipe
- id: ckeditor_accordion-markup
  input: What HTML markup does a CKEditor Accordion produce in the saved body content?
  criteria: 'A description list: <dl class="ckeditor-accordion"> with paired <dt> titles and <dd> content
    rows.'
  bundle: ckeditor_accordion
  rubric_ref: rubric/ckeditor_accordion_ckeditor_accordion_markup@1.0
  tags:
  - mode:recipe
- id: ckeditor_accordion-allowed-tags
  input: Which HTML tags must a text format's allowed HTML permit for CKEditor Accordion to work?
  criteria: 'The plugin''s elements: <dl>, <dl class>, <dt>, <dd> — the class on <dl> is required for
    the frontend behavior to attach.'
  bundle: ckeditor_accordion
  rubric_ref: rubric/ckeditor_accordion_ckeditor_accordion_allowed_tags@1.0
  tags:
  - mode:recipe
- id: ckeditor_accordion-keep-one-open
  input: Which CKEditor Accordion setting lets multiple accordion rows stay open at once instead of closing
    others, and what config object holds it?
  criteria: The keep_rows_open key (default 0) on the ckeditor_accordion.settings config; when enabled,
    opening a row does not close already-open rows.
  bundle: ckeditor_accordion
  rubric_ref: rubric/ckeditor_accordion_ckeditor_accordion_keep_one_open@1.0
  tags:
  - mode:recipe
- id: ckeditor_accordion-collapse-all
  input: By default CKEditor Accordion opens the first row. Which setting makes all rows start collapsed,
    and how do I set it with drush?
  criteria: Set collapse_all on ckeditor_accordion.settings, e.g. drush cset ckeditor_accordion.settings
    collapse_all 1.
  bundle: ckeditor_accordion
  rubric_ref: rubric/ckeditor_accordion_ckeditor_accordion_collapse_all@1.0
  tags:
  - mode:recipe
- id: ckeditor_accordion-settings-route
  input: Where is the CKEditor Accordion global settings form, and what permission is required to access
    it?
  criteria: Form at /admin/config/content/ckeditor-accordion (route ckeditor_accordion.settings), gated
    by the 'administer ckeditor accordion' permission.
  bundle: ckeditor_accordion
  rubric_ref: rubric/ckeditor_accordion_ckeditor_accordion_settings_route@1.0
  tags:
  - mode:recipe
- id: ckeditor_accordion-html-titles
  input: I want to put icons / HTML inside CKEditor Accordion row titles. Which setting enables that?
  criteria: Enable allow_html_in_titles (default 0) on ckeditor_accordion.settings to permit HTML inside
    the <dt> row titles.
  bundle: ckeditor_accordion
  rubric_ref: rubric/ckeditor_accordion_ckeditor_accordion_html_titles@1.0
  tags:
  - mode:recipe
