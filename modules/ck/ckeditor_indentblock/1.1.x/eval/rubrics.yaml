rubrics:
- id: ckeditor_indentblock_cib_plugin_id
  version: '1.0'
  applicable_bundles:
  - ckeditor_indentblock
  checks:
  - kind: must_contain_any
    values:
    - ckeditor_indentblock_indent
  scoring:
    combine: all_pass
- id: ckeditor_indentblock_cib_toolbar_item
  version: '1.0'
  applicable_bundles:
  - ckeditor_indentblock
  checks:
  - kind: must_contain_any
    values:
    - indent
    - outdent
    - Indent
    - Outdent
  scoring:
    combine: all_pass
- id: ckeditor_indentblock_cib_enable_per_format
  version: '1.0'
  applicable_bundles:
  - ckeditor_indentblock
  checks:
  - kind: must_contain_any
    values:
    - text format
    - per format
    - editor.editor
    - settings.plugins.ckeditor_indentblock_indent
    - /admin/config/content/formats
  scoring:
    combine: all_pass
- id: ckeditor_indentblock_cib_known_format
  version: '1.0'
  applicable_bundles:
  - ckeditor_indentblock
  checks:
  - kind: must_contain_any
    values:
    - full_html
    - Full HTML
  scoring:
    combine: all_pass
- id: ckeditor_indentblock_cib_add_toolbar
  version: '1.0'
  applicable_bundles:
  - ckeditor_indentblock
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
