metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: ckeditor_div_manager
  version: 3.0.x
  note: 'CKEditor Div Manager is a pure CKEditor 5 JS plugin with no PHP, no config schema, no permissions,
    no Drush, no configure route. Its ckeditor5.yml registers toolbar item ''DivManager'' (label ''Div
    Manager'') and grants <div> / <div class="simple-box-description">. It is enabled per text format
    by adding ''DivManager'' to editor.editor.<format> settings.toolbar.items (editor must be ckeditor5).
    filter_html must allow <div> for the markup to survive. Medium/hard cases are grounded in real editor.editor
    and filter.format config: introspection reads which format has DivManager in its toolbar; execution
    adds DivManager to a toolbar and permits the <div> tag in filter_html.'
questions:
- id: ckeditor_div_manager-what-it-adds
  input: What does the Drupal contrib module ckeditor_div_manager add to CKEditor 5, and what HTML element
    can an editor insert with it? Name the toolbar button/item.
  criteria: It adds a CKEditor 5 toolbar button whose toolbar item id is 'DivManager' (label 'Div Manager').
    Clicking it opens a pop-up to insert a <div> container, optionally with class/id/title/lang/style
    attributes.
  bundle: ckeditor_div_manager
  rubric_ref: rubric/ckeditor_div_manager_ckeditor_div_manager_what_it_adds@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: ckeditor_div_manager-how-to-enable
  input: How do I enable the ckeditor_div_manager Div Manager button on a specific Drupal text format,
    and what does the 'Limit allowed HTML tags' (filter_html) filter need to permit for it to work?
  criteria: Edit the text format (Text formats and editors), which must use a CKEditor 5 editor, and drag
    Div Manager into the active toolbar (adds 'DivManager' to editor.editor.<format> settings.toolbar.items).
    If filter_html is on, allow at least <div> (and <div class id title> to keep the extra attributes).
  bundle: ckeditor_div_manager
  rubric_ref: rubric/ckeditor_div_manager_ckeditor_div_manager_how_to_enable@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: ckeditor_div_manager-dependency
  input: Which Drupal core module does ckeditor_div_manager depend on, and is it a PHP-heavy module or
    a JavaScript editor plugin?
  criteria: It depends on the CKEditor 5 core module (drupal:ckeditor5). It is a pure CKEditor 5 JavaScript
    plugin integration - no PHP, no config schema, no permissions, no Drush. (It also carries a legacy
    Composer requirement on the CKEditor 4 div library group, unused by the 3.0.x build.)
  bundle: ckeditor_div_manager
  rubric_ref: rubric/ckeditor_div_manager_ckeditor_div_manager_dependency@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: ckeditor_div_manager-which-format
  input: On this Drupal site there are two text formats, cdm_on and cdm_off. Exactly one of them has the
    ckeditor_div_manager 'Div Manager' button enabled in its CKEditor 5 toolbar. Inspect the live editor
    configuration and state which format has it.
  criteria: 'cdm_on has it: editor.editor.cdm_on settings.toolbar.items contains ''DivManager'', while
    cdm_off''s toolbar does not.'
  bundle: ckeditor_div_manager
  rubric_ref: rubric/ckeditor_div_manager_ckeditor_div_manager_which_format@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/ckeditor_div_manager-which-format-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/ckeditor_div_manager-which-format-cleanup.sh
- id: ckeditor_div_manager-has-button
  input: On this Drupal site the text format cdm_known uses CKEditor 5. Inspect its live editor configuration
    and report whether the ckeditor_div_manager button is in its toolbar and the exact toolbar item id
    used.
  criteria: Yes - editor.editor.cdm_known settings.toolbar.items is [heading, bold, DivManager, link],
    so the Div Manager button is enabled and its toolbar item id is 'DivManager'.
  bundle: ckeditor_div_manager
  rubric_ref: rubric/ckeditor_div_manager_ckeditor_div_manager_has_button@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/ckeditor_div_manager-has-button-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/ckeditor_div_manager-has-button-cleanup.sh
- id: ckeditor_div_manager-add-button
  input: On this Drupal site the text format cdm_task uses a CKEditor 5 editor but does not yet offer
    the ckeditor_div_manager button. Add the Div Manager button to cdm_task's CKEditor 5 toolbar and apply
    the change to the live site.
  criteria: editor.editor.cdm_task settings.toolbar.items now contains 'DivManager' (append 'DivManager'
    to the toolbar items and save the editor entity, or drag it in via the Text formats UI).
  bundle: ckeditor_div_manager
  rubric_ref: rubric/ckeditor_div_manager_ckeditor_div_manager_add_button@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/ckeditor_div_manager-add-button-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/ckeditor_div_manager-add-button-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/ckeditor_div_manager-add-button-verify.sh
- id: ckeditor_div_manager-allow-div
  input: On this Drupal site the text format cdm_filter has the ckeditor_div_manager Div Manager button
    in its CKEditor 5 toolbar, but its 'Limit allowed HTML tags' (filter_html) filter strips out <div>
    tags. Update the format so the filter permits the <div> tag, and apply the change to the live site.
  criteria: The filter_html allowed_html string on filter.format.cdm_filter now includes a <div> tag (e.g.
    add '<div class id title>' to allowed_html and save the format).
  bundle: ckeditor_div_manager
  rubric_ref: rubric/ckeditor_div_manager_ckeditor_div_manager_allow_div@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/ckeditor_div_manager-allow-div-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/ckeditor_div_manager-allow-div-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/ckeditor_div_manager-allow-div-verify.sh
