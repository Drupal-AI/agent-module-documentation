rubrics:
- id: ckeditor_media_resize_ckeditor_media_resize_attribute
  version: '1.0'
  applicable_bundles:
  - ckeditor_media_resize
  checks:
  - kind: must_contain_any
    values:
    - data-media-width
    - filter_resize_media
  scoring:
    combine: all_pass
- id: ckeditor_media_resize_ckeditor_media_resize_conditions
  version: '1.0'
  applicable_bundles:
  - ckeditor_media_resize
  checks:
  - kind: must_contain_any
    values:
    - drupalMedia
    - media_media
    - filter_resize_media
  scoring:
    combine: all_pass
- id: ckeditor_media_resize_ckeditor_media_resize_view_mode_mapping
  version: '1.0'
  applicable_bundles:
  - ckeditor_media_resize
  checks:
  - kind: must_contain_any
    values:
    - cke_media_resize_medium
  scoring:
    combine: all_pass
- id: ckeditor_media_resize_ckeditor_media_resize_known_format
  version: '1.0'
  applicable_bundles:
  - ckeditor_media_resize
  checks:
  - kind: must_contain_any
    values:
    - ckeditor_media_resize_eval
  scoring:
    combine: all_pass
- id: ckeditor_media_resize_ckeditor_media_resize_style_list
  version: '1.0'
  applicable_bundles:
  - ckeditor_media_resize
  checks:
  - kind: must_contain_any
    values:
    - cke_media_resize_xl
  scoring:
    combine: all_pass
- id: ckeditor_media_resize_ckeditor_media_resize_enable_format
  version: '1.0'
  applicable_bundles:
  - ckeditor_media_resize
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
- id: ckeditor_media_resize_ckeditor_media_resize_restore_styles
  version: '1.0'
  applicable_bundles:
  - ckeditor_media_resize
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
