rubrics:
- id: ckeditor_templates_ckeditor_templates_where_stored
  version: '1.0'
  applicable_bundles:
  - ckeditor_templates
  checks:
  - kind: must_contain_any
    values:
    - /admin/config/content/ckeditor-templates
    - admin/config/content/ckeditor-templates
    - config entity
    - ckeditor_templates.ckeditor_templates
  scoring:
    combine: all_pass
- id: ckeditor_templates_ckeditor_templates_toolbar_item
  version: '1.0'
  applicable_bundles:
  - ckeditor_templates
  checks:
  - kind: must_contain_any
    values:
    - ckeditorTemplates
    - replace_content
    - Replace actual contents
  scoring:
    combine: all_pass
- id: ckeditor_templates_ckeditor_templates_plugin_type
  version: '1.0'
  applicable_bundles:
  - ckeditor_templates
  checks:
  - kind: must_contain_any
    values:
    - CkeditorTemplate
    - Plugin/CkeditorTemplate
    - plugin.manager.ckeditor_template
    - CkeditorTemplatePluginBase
  scoring:
    combine: all_pass
- id: ckeditor_templates_ckeditor_templates_known_template
  version: '1.0'
  applicable_bundles:
  - ckeditor_templates
  checks:
  - kind: must_contain_any
    values:
    - ckeditor_templates_promo
  scoring:
    combine: all_pass
- id: ckeditor_templates_ckeditor_templates_enabled_vs_disabled
  version: '1.0'
  applicable_bundles:
  - ckeditor_templates
  checks:
  - kind: must_contain_any
    values:
    - ckeditor_templates_live
  scoring:
    combine: all_pass
- id: ckeditor_templates_ckeditor_templates_create_template
  version: '1.0'
  applicable_bundles:
  - ckeditor_templates
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
- id: ckeditor_templates_ckeditor_templates_toolbar_button
  version: '1.0'
  applicable_bundles:
  - ckeditor_templates
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
