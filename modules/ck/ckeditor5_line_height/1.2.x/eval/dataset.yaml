    reset: agent-module-documentation/evaluation/verify/ckeditor5_line_height-add-button-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/ckeditor5_line_height-add-button-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/ckeditor5_line_height-add-button-verify.sh
- id: ckeditor5_line_height-set-options
  input: 'The CKEditor 5 text format ''clh_opts'' already has the Line Height button but offers the full
    default list of values. Reconfigure the ckeditor5_line_height plugin on that format so it offers exactly
    three line-height options: 1, 1.5 and 2. Apply the change to the live site.'
  criteria: editor.editor.clh_opts settings.plugins.ckeditor5_line_height_line_height.line_height_options
    = [1, 1.5, 2].
  bundle: ckeditor5_line_height
  rubric_ref: rubric/ckeditor5_line_height_ckeditor5_line_height_set_options@1.0
  tags:
