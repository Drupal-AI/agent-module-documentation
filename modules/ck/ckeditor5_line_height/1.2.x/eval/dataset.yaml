metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: ckeditor5_line_height
  version: 1.2.x
  note: 'CKEditor5 Line Height ships one CKEditor 5 plugin (id ckeditor5_line_height_line_height) that
    adds a ''lineHeight'' toolbar item. It has no settings route (configure=null), no permissions, no
    services, no Drush. Its only persistent state is per-text-format editor config: editor.editor.<format>
    -> settings.toolbar.items[] must contain ''lineHeight'', and settings.plugins.ckeditor5_line_height_line_height.line_height_options
    holds the space-separated value list (default 0 0.5 1 1.5 2 2.5 3 3.5 4 4.5 5 5.5 6 6.5; values >=
    10 are dropped on save). Medium/hard cases build real CKEditor 5 text formats (clh_*) and read/verify
    the toolbar item and option list from the editor config entity. The set-options verify reads RAW config
    because Editor::getSettings() prunes plugin settings equal to the plugin defaults.'
questions:
- id: ckeditor5_line_height-toolbar-item
  input: On a Drupal 11 site, how do I give editors a Line Height control in CKEditor 5 using the ckeditor5_line_height
    module? Name the toolbar button/item and where I add it.
  criteria: Edit a text format that uses the CKEditor 5 editor at /admin/config/content/formats, and drag
    the 'Line Height' button (toolbar item id 'lineHeight') into the active toolbar. There is no separate
    settings page.
  bundle: ckeditor5_line_height
  rubric_ref: rubric/ckeditor5_line_height_ckeditor5_line_height_toolbar_item@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: ckeditor5_line_height-options-key
  input: Where does the ckeditor5_line_height module store the list of selectable line-height values for
    a text format, and what is the default list?
  criteria: 'In the editor config entity editor.editor.<format> under settings.plugins.ckeditor5_line_height_line_height.line_height_options
    (a sequence of strings). Default: 0 0.5 1 1.5 2 2.5 3 3.5 4 4.5 5 5.5 6 6.5.'
  bundle: ckeditor5_line_height
  rubric_ref: rubric/ckeditor5_line_height_ckeditor5_line_height_options_key@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: ckeditor5_line_height-max-value
  input: If I type line-height options into the ckeditor5_line_height settings and include a value of
    10 or higher, what happens when I save? And what happens if I leave the field empty?
  criteria: validateConfigurationForm() removes any value >= 10 and de-duplicates the list; an empty field
    resets the options to the module defaults.
  bundle: ckeditor5_line_height
  rubric_ref: rubric/ckeditor5_line_height_ckeditor5_line_height_max_value@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: ckeditor5_line_height-options-known
  input: This site has a CKEditor 5 text format 'clh_known' with the Line Height button enabled. Inspect
    the live editor configuration and list the exact line-height options configured for it.
  criteria: editor.editor.clh_known settings.plugins.ckeditor5_line_height_line_height.line_height_options
    = [1.15, 1.35, 1.85].
  bundle: ckeditor5_line_height
  rubric_ref: rubric/ckeditor5_line_height_ckeditor5_line_height_options_known@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/ckeditor5_line_height-options-known-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/ckeditor5_line_height-options-known-cleanup.sh
- id: ckeditor5_line_height-which-format
  input: Two CKEditor 5 text formats on this site are named clh_active and clh_plain. Exactly one has
    the ckeditor5_line_height 'Line Height' button in its toolbar. Inspect the live editor config and
    state which format has it.
  criteria: clh_active has 'lineHeight' in settings.toolbar.items; clh_plain does not.
  bundle: ckeditor5_line_height
  rubric_ref: rubric/ckeditor5_line_height_ckeditor5_line_height_which_format@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/ckeditor5_line_height-which-format-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/ckeditor5_line_height-which-format-cleanup.sh
- id: ckeditor5_line_height-add-button
  input: This site has a CKEditor 5 text format 'clh_task' that does not yet expose line-height. Using
    the ckeditor5_line_height module, add the Line Height button to that format's CKEditor 5 toolbar and
    apply the change to the live site.
  criteria: editor.editor.clh_task settings.toolbar.items contains 'lineHeight' (e.g. add it via the format's
    CKEditor 5 toolbar builder or by editing the editor entity settings).
  bundle: ckeditor5_line_height
  rubric_ref: rubric/ckeditor5_line_height_ckeditor5_line_height_add_button@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
