  - ckeditor5_line_height
  checks:
  - kind: must_contain_any
    values:
    - lineHeight
    - Line Height
    - toolbar
  scoring:
    combine: all_pass
- id: ckeditor5_line_height_ckeditor5_line_height_options_key
  version: '1.0'
  applicable_bundles:
  - ckeditor5_line_height
  checks:
  - kind: must_contain_any
    values:
    - line_height_options
    - editor.editor
    - plugins
  scoring:
    combine: all_pass
- id: ckeditor5_line_height_ckeditor5_line_height_max_value
  version: '1.0'
  applicable_bundles:
  - ckeditor5_line_height
  checks:
  - kind: must_contain_any
    values:
    - '10'
    - dropped
    - removed
    - default
  scoring:
    combine: all_pass
- id: ckeditor5_line_height_ckeditor5_line_height_options_known
  version: '1.0'
