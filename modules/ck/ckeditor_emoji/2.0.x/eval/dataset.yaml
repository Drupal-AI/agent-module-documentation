metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: ckeditor_emoji
  version: 2.0.x
  note: 'CKEditor(5) Emoji is a pure client-side CKEditor 5 plugin (ckeditor_emoji_Emoji / emojiPlugin.Emoji)
    that contributes an ''Emoji'' toolbar button. It has no PHP settings form, no configure route (configure=null),
    no permissions, no config schema, no Drush and no Drupal plugin types. Its only persistent footprint
    is the ''Emoji'' string added to a text format''s CKEditor 5 toolbar, stored in editor.editor.<format>
    -> settings.toolbar.items. It depends on core ckeditor5 and works only with CKEditor 5. All medium/hard
    cases are grounded in that real editor config: introspection reads back which CKEditor 5 format has
    the Emoji button; execution adds the Emoji button to a format''s toolbar, verified against the live
    editor.editor entity.'
questions:
- id: ckeditor_emoji-how-to-enable
  input: I installed the Drupal contrib module ckeditor_emoji. There is no settings page for it. How do
    I actually make the emoji button appear for content authors, and where is that choice saved?
  criteria: 'There is no configure route (configure=null). You add the Emoji button to a text format''s
    CKEditor 5 toolbar at Configuration > Content authoring > Text formats and editors (/admin/config/content/formats):
    drag the Emoji button into the Active toolbar and save. It is stored in editor.editor.<format> ->
    settings.toolbar.items as the string ''Emoji''.'
  bundle: ckeditor_emoji
  rubric_ref: rubric/ckeditor_emoji_ckeditor_emoji_how_to_enable@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: ckeditor_emoji-cke5-only
  input: Which CKEditor version does the Drupal ckeditor_emoji module work with, and what core module
    does it require?
  criteria: It is a CKEditor 5 plugin and depends on Drupal core's ckeditor5 module (core_version_requirement
    ^10.3 || ^11). It is the CKEditor 5 successor to the older CKEditor 4 'Emoji' module and does not
    work with CKEditor 4.
  bundle: ckeditor_emoji
  rubric_ref: rubric/ckeditor_emoji_ckeditor_emoji_cke5_only@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: ckeditor_emoji-no-filter-change
  input: Does enabling the emoji button in ckeditor_emoji require me to change a text format's allowed
    HTML tags or add a filter? How is an emoji inserted into the content?
  criteria: 'No allowed-tags or filter change is needed. The CKEditor5 plugin declares elements: false,
    so picking an emoji inserts a plain Unicode character via CKEditor''s input command - no new HTML
    tags or data-model markup are added.'
  bundle: ckeditor_emoji
  rubric_ref: rubric/ckeditor_emoji_ckeditor_emoji_no_filter_change@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: ckeditor_emoji-which-format
  input: On this Drupal site, exactly one CKEditor 5 text format has the ckeditor_emoji 'Emoji' button
    enabled in its toolbar. Inspect the live editor configuration and give the machine name (format id)
    of that text format.
  criteria: 'The format is ckemoji_known: editor.editor.ckemoji_known settings.toolbar.items contains
    ''Emoji''.'
  bundle: ckeditor_emoji
  rubric_ref: rubric/ckeditor_emoji_ckeditor_emoji_which_format@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/ckeditor_emoji-known-format-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/ckeditor_emoji-known-format-cleanup.sh
- id: ckeditor_emoji-on-vs-off
  input: This site has two CKEditor 5 text formats, ckemoji_on and ckemoji_off. Exactly one of them has
    the ckeditor_emoji Emoji button in its toolbar. Inspect the live editor configuration and state which
    format has emoji enabled.
  criteria: 'ckemoji_on has the Emoji button: editor.editor.ckemoji_on settings.toolbar.items includes
    ''Emoji'', whereas ckemoji_off''s toolbar does not.'
  bundle: ckeditor_emoji
  rubric_ref: rubric/ckeditor_emoji_ckeditor_emoji_on_vs_off@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/ckeditor_emoji-on-vs-off-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/ckeditor_emoji-on-vs-off-cleanup.sh
- id: ckeditor_emoji-add-button
  input: On this Drupal site there is a CKEditor 5 text format with id 'ckemoji_task' that does not yet
    have the emoji picker. Using the ckeditor_emoji module, add the Emoji button to that format's CKEditor
    5 toolbar and apply the change to the live site.
  criteria: Add the string 'Emoji' to editor.editor.ckemoji_task settings.toolbar.items (drag the Emoji
    button into the Active toolbar in the text-format UI, or append 'Emoji' to the toolbar items and save
    the editor entity).
  bundle: ckeditor_emoji
  rubric_ref: rubric/ckeditor_emoji_ckeditor_emoji_add_button@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/ckeditor_emoji-add-button-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/ckeditor_emoji-add-button-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/ckeditor_emoji-add-button-verify.sh
- id: ckeditor_emoji-add-button-layman
  input: People writing with my 'ckemoji_task' text style can't add smiley faces or emojis. Please turn
    on the emoji picker so the little emoji button shows up in their editor toolbar, and make it live
    on the site.
  criteria: Add the Emoji button (string 'Emoji') to the ckemoji_task format's CKEditor 5 toolbar (editor.editor.ckemoji_task
    settings.toolbar.items) via the Text formats and editors UI or by saving the editor entity.
  bundle: ckeditor_emoji
  rubric_ref: rubric/ckeditor_emoji_ckeditor_emoji_add_button_layman@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: site-owner
    reset: agent-module-documentation/evaluation/verify/ckeditor_emoji-add-button-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/ckeditor_emoji-add-button-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/ckeditor_emoji-add-button-verify.sh
