metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: ckeditor5_premium_features
  version: 1.8.x
  note: 'CKEditor 5 Premium Features is the base module for CKEditor''s commercial premium add-ons: it
    holds the license key + Cloud Services auth, exposes two permissions and a config object, and ships
    ~20 thin feature submodules. Cases are `recipe` (response-graded) probing documented facts an agent
    would otherwise read source for; no site mutation.'
questions:
- id: ckeditor5pf-license-required
  input: I want to use CKEditor 5 Premium Features (track changes, comments, export to PDF) on a Drupal
    11 site. What commercial prerequisite do I need, and where do I enter it?
  criteria: A CKEditor commercial license key and/or CKEditor Cloud Services subscription (free trial
    available). Enter it in the ckeditor5_premium_features.settings config via the settings form at /admin/config/ckeditor5-premium-features/settings
    (license_key key).
  bundle: ckeditor5_premium_features
  rubric_ref: rubric/ckeditor5_premium_features_ckeditor5pf_license_required@1.0
  tags:
  - mode:recipe
- id: ckeditor5pf-suite-of-submodules
  input: How is CKEditor 5 Premium Features structured — is enabling the main module enough to get export-to-PDF,
    comments, and real-time collaboration?
  criteria: No. The main module only provides shared config + Cloud Services authentication. Each premium
    feature is a separate submodule (e.g. ckeditor5_premium_features_export_pdf, _collaboration, _realtime_collaboration)
    that you enable individually, then add its button to a text format's CKEditor 5 toolbar.
  bundle: ckeditor5_premium_features
  rubric_ref: rubric/ckeditor5_premium_features_ckeditor5pf_suite_of_submodules@1.0
  tags:
  - mode:recipe
- id: ckeditor5pf-enable-export-pdf
  input: How do I turn on export-to-PDF in the CKEditor 5 editor for a specific text format on my Drupal
    site?
  criteria: Enable the ckeditor5_premium_features_export_pdf submodule (drush en), then edit the text
    format at /admin/config/content/formats and add the export-to-PDF button to that format's CKEditor
    5 toolbar.
  bundle: ckeditor5_premium_features
  rubric_ref: rubric/ckeditor5_premium_features_ckeditor5pf_enable_export_pdf@1.0
  tags:
  - mode:recipe
- id: ckeditor5pf-realtime-cloud-services
  input: What extra configuration does real-time collaboration require compared to track changes or comments
    in CKEditor 5 Premium Features?
  criteria: Real-time collaboration requires configuring CKEditor Cloud Services authorization (auth_type
    = key with Environment ID + Access key, or a dev_token URL). Track changes and Comments can run without
    real-time collaboration.
  bundle: ckeditor5_premium_features
  rubric_ref: rubric/ckeditor5_premium_features_ckeditor5pf_realtime_cloud_services@1.0
  tags:
  - mode:recipe
- id: ckeditor5pf-config-object
  input: Which config object stores the CKEditor 5 Premium Features license key and Cloud Services credentials,
    and which key holds the license?
  criteria: The ckeditor5_premium_features.settings config object; the license_key key holds the license,
    plus auth_type/env/access_key for Cloud Services.
  bundle: ckeditor5_premium_features
  rubric_ref: rubric/ckeditor5_premium_features_ckeditor5pf_config_object@1.0
  tags:
  - mode:recipe
- id: ckeditor5pf-permissions
  input: Which permission should I grant editor roles so they can use the Word/PDF export plugins in CKEditor
    5 Premium Features, and which one covers the access token for cloud/real-time features?
  criteria: '''use ckeditor5 exporters endpoints'' gates the Word/PDF export plugins; ''use ckeditor5
    access token'' gates the JWT token endpoint used by cloud services / real-time collaboration.'
  bundle: ckeditor5_premium_features
  rubric_ref: rubric/ckeditor5_premium_features_ckeditor5pf_permissions@1.0
  tags:
  - mode:recipe
- id: ckeditor5pf-ai-assistant-libs
  input: I want the AI Assistant feature of CKEditor 5 Premium Features backed by OpenAI. Which submodule
    and which PHP library (Composer suggest) are involved?
  criteria: Enable the AI submodules (ckeditor5_premium_features_ai / ckeditor5_premium_features_ai_assistant);
    the openai-php/client library (Composer suggest) is required for the OpenAI/AzureAI provider (aws/aws-sdk-php
    for AWS Bedrock).
  bundle: ckeditor5_premium_features
  rubric_ref: rubric/ckeditor5_premium_features_ckeditor5pf_ai_assistant_libs@1.0
  tags:
  - mode:recipe
- id: ckeditor5pf-dependencies
  input: Which core Drupal modules does CKEditor 5 Premium Features depend on?
  criteria: 'The core editor and ckeditor5 modules (dependencies: drupal:editor, drupal:ckeditor5 in the
    info.yml).'
  bundle: ckeditor5_premium_features
  rubric_ref: rubric/ckeditor5_premium_features_ckeditor5pf_dependencies@1.0
  tags:
  - mode:recipe
