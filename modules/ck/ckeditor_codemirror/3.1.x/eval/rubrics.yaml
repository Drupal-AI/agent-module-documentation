rubrics:
- id: ckeditor_codemirror_ckeditor_codemirror_where_configured
  version: '1.0'
  applicable_bundles:
  - ckeditor_codemirror
  checks:
  - kind: must_contain_any
    values:
    - editor.editor
    - text format
    - Text formats
    - ckeditor_codemirror_source_editing
    - /admin/config/content/formats
  scoring:
    combine: all_pass
- id: ckeditor_codemirror_ckeditor_codemirror_toolbar_condition
  version: '1.0'
  applicable_bundles:
  - ckeditor_codemirror
  checks:
  - kind: must_contain_any
    values:
    - sourceEditing
    - Source editing
    - Source button
    - Source view button
  scoring:
    combine: all_pass
- id: ckeditor_codemirror_ckeditor_codemirror_libraries
  version: '1.0'
  applicable_bundles:
  - ckeditor_codemirror
  checks:
  - kind: must_contain_any
    values:
    - /libraries/codemirror
    - libraries/codemirror
    - ckeditor5-source-editing-codemirror
  scoring:
    combine: all_pass
- id: ckeditor_codemirror_ckeditor_codemirror_known_format
  version: '1.0'
  applicable_bundles:
  - ckeditor_codemirror
  checks:
  - kind: must_contain_any
    values:
    - text/x-scss
    - SCSS
  scoring:
    combine: all_pass
- id: ckeditor_codemirror_ckeditor_codemirror_on_vs_off
  version: '1.0'
  applicable_bundles:
  - ckeditor_codemirror
  checks:
  - kind: must_contain_any
    values:
    - ckeditor_codemirror_on
  scoring:
    combine: all_pass
- id: ckeditor_codemirror_ckeditor_codemirror_enable_scss
  version: '1.0'
  applicable_bundles:
  - ckeditor_codemirror
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
- id: ckeditor_codemirror_ckeditor_codemirror_add_source_button
  version: '1.0'
  applicable_bundles:
  - ckeditor_codemirror
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
