metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: ckeditor_codemirror
  version: 3.1.x
  note: 'CKEditor CodeMirror ships exactly one CKEditor 5 plugin, ckeditor_codemirror_source_editing,
    plus a CKEditor4To5Upgrade plugin. It has no settings page (no `configure` key), no permissions, no
    Drush commands, no services and defines no plugin types. All of its persistent state is per text format
    inside editor.editor.<format> -> settings.plugins.ckeditor_codemirror_source_editing (keys: enable,
    mode, options{autoCloseBrackets,autoCloseTags,folding,lineNumbers,lineWrapping,matchBrackets,matchTags,searchBottom,styleActiveLine}).
    The plugin declares conditions {plugins: {ckeditor5_sourceEditing}}, so the format''s settings.toolbar.items
    must contain ''sourceEditing''. Medium cases read that config back off the live site; hard cases require
    writing it (one of them also requires adding the Source button first). Every eval artifact is namespaced
    with the ckeditor_codemirror_ prefix so it cannot collide with other modules'' formats.'
questions:
- id: ckeditor_codemirror-where-configured
  input: I installed the Drupal contrib module ckeditor_codemirror on a Drupal 11 site but I cannot find
    an admin settings page for it. Where do I turn CodeMirror syntax highlighting on, and in which configuration
    object is that choice stored?
  criteria: 'The module has no global settings form. You configure it per text format at Configuration
    > Content authoring > Text formats and editors (/admin/config/content/formats): configure a CKEditor
    5 format and open the ''CodeMirror source editing'' vertical tab under CKEditor 5 plugin settings.
    The values are stored in the editor.editor.<format> config entity under settings.plugins.ckeditor_codemirror_source_editing
    (enable, mode, options).'
  bundle: ckeditor_codemirror
  rubric_ref: rubric/ckeditor_codemirror_ckeditor_codemirror_where_configured@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: ckeditor_codemirror-toolbar-condition
  input: On a Drupal 11 site with the ckeditor_codemirror module enabled, the 'CodeMirror source editing'
    settings tab does not appear when I configure one of my CKEditor 5 text formats. What is the prerequisite
    that makes that tab (and the plugin itself) show up?
  criteria: 'The plugin definition declares conditions = {plugins: {ckeditor5_sourceEditing}}, so core''s
    Source editing plugin must be active on that format - i.e. the ''Source'' button must be dragged into
    the active toolbar (settings.toolbar.items must contain ''sourceEditing''). Without it the vertical
    tab is hidden and the CodeMirror library is never attached.'
  bundle: ckeditor_codemirror
  rubric_ref: rubric/ckeditor_codemirror_ckeditor_codemirror_toolbar_condition@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: ckeditor_codemirror-libraries
  input: Which external JavaScript libraries does the Drupal ckeditor_codemirror module require, where
    in the Drupal installation must they be placed, and is CodeMirror 6 acceptable?
  criteria: It needs CodeMirror version 5 (v6 is NOT supported) at /libraries/codemirror and the @cdubz/ckeditor5-source-editing-codemirror
    bridge at /libraries/ckeditor5-source-editing-codemirror, both under the docroot libraries directory.
    hook_requirements() reports both on /admin/reports/status; the module ships a composer.libraries.json
    for use with the Composer Merge plugin.
  bundle: ckeditor_codemirror
  rubric_ref: rubric/ckeditor_codemirror_ckeditor_codemirror_libraries@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: ckeditor_codemirror-known-format
  input: This Drupal site has a text format whose machine name is ckeditor_codemirror_eval and which uses
    CKEditor 5 with CodeMirror source highlighting turned on. Inspect the live configuration and tell
    me which CodeMirror syntax highlighting mode value is configured for that format.
  criteria: 'The mode is text/x-scss (the ''SCSS'' option): editor.editor.ckeditor_codemirror_eval ->
    settings.plugins.ckeditor_codemirror_source_editing.mode = text/x-scss, with enable: true.'
  bundle: ckeditor_codemirror
  rubric_ref: rubric/ckeditor_codemirror_ckeditor_codemirror_known_format@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/ckeditor_codemirror-known-format-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/ckeditor_codemirror-known-format-cleanup.sh
- id: ckeditor_codemirror-on-vs-off
  input: This Drupal site has two CKEditor 5 text formats, ckeditor_codemirror_on and ckeditor_codemirror_off.
    Both carry ckeditor_codemirror settings, but only one of them actually has CodeMirror source highlighting
    switched on. Inspect the running site and tell me which format has it enabled.
  criteria: 'ckeditor_codemirror_on has it enabled: editor.editor.ckeditor_codemirror_on -> settings.plugins.ckeditor_codemirror_source_editing.enable
    is true, while the same key on editor.editor.ckeditor_codemirror_off is false.'
  bundle: ckeditor_codemirror
  rubric_ref: rubric/ckeditor_codemirror_ckeditor_codemirror_on_vs_off@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/ckeditor_codemirror-on-vs-off-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/ckeditor_codemirror-on-vs-off-cleanup.sh
- id: ckeditor_codemirror-enable-scss
  input: On this Drupal site there is a CKEditor 5 text format with the machine name ckeditor_codemirror_task;
    its toolbar already contains the Source button. Using the ckeditor_codemirror module, enable CodeMirror
    source-view syntax highlighting on that format, set its highlighting mode to SCSS, and make sure line
    numbers are shown. Apply the change to the live site.
  criteria: 'editor.editor.ckeditor_codemirror_task -> settings.plugins.ckeditor_codemirror_source_editing
    must have enable: true, mode: text/x-scss and options.lineNumbers: true (the other eight option keys
    should also be present as booleans).'
  bundle: ckeditor_codemirror
  rubric_ref: rubric/ckeditor_codemirror_ckeditor_codemirror_enable_scss@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/ckeditor_codemirror-enable-scss-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/ckeditor_codemirror-enable-scss-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/ckeditor_codemirror-enable-scss-verify.sh
- id: ckeditor_codemirror-add-source-button
  input: 'On this Drupal site the CKEditor 5 text format ckeditor_codemirror_nosrc currently has only
    Bold and Italic in its toolbar. Make CodeMirror source highlighting work on that format: do whatever
    the ckeditor_codemirror plugin requires so it can be activated, then turn it on with the PHP (including
    HTML) highlighting mode and code folding enabled. Apply the change to the live site.'
  criteria: 'editor.editor.ckeditor_codemirror_nosrc -> settings.toolbar.items must contain ''sourceEditing''
    (the plugin''s condition), and settings.plugins.ckeditor_codemirror_source_editing must have enable:
    true, mode: application/x-httpd-php and options.folding: true.'
  bundle: ckeditor_codemirror
  rubric_ref: rubric/ckeditor_codemirror_ckeditor_codemirror_add_source_button@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/ckeditor_codemirror-add-source-button-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/ckeditor_codemirror-add-source-button-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/ckeditor_codemirror-add-source-button-verify.sh
