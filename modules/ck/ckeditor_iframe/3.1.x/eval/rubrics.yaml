rubrics:
- id: ckeditor_iframe_cif_plugin_id
  version: '1.0'
  applicable_bundles:
  - ckeditor_iframe
  checks:
  - kind: must_contain_any
    values:
    - ckeditor_iframe_embed_iframeembed
  scoring:
    combine: all_pass
- id: ckeditor_iframe_cif_toolbar_item
  version: '1.0'
  applicable_bundles:
  - ckeditor_iframe
  checks:
  - kind: must_contain_any
    values:
    - iframeEmbed
    - Iframe Embed
  scoring:
    combine: all_pass
- id: ckeditor_iframe_cif_enable_per_format
  version: '1.0'
  applicable_bundles:
  - ckeditor_iframe
  checks:
  - kind: must_contain_any
    values:
    - text format
    - per format
    - editor.editor
    - /admin/config/content/formats
    - getElementsSubset
    - enabled_optional_attributes
    - no manual
  scoring:
    combine: all_pass
- id: ckeditor_iframe_cif_known_format
  version: '1.0'
  applicable_bundles:
  - ckeditor_iframe
  checks:
  - kind: must_contain_any
    values:
    - full_html
    - Full HTML
  scoring:
    combine: all_pass
- id: ckeditor_iframe_cif_add_toolbar
  version: '1.0'
  applicable_bundles:
  - ckeditor_iframe
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
- id: ckeditor_iframe_cif_add_toolbar_layman
  version: '1.0'
  applicable_bundles:
  - ckeditor_iframe
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
