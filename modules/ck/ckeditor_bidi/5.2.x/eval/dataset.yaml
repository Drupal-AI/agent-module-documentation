metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: ckeditor_bidi
  version: 5.2.x
  note: 'CKEditor BiDi Buttons is a CKEditor 5 plugin that adds a ''direction'' toolbar button setting
    the HTML dir attribute (ltr/rtl) on block elements. It has no settings page: you add the button to
    a text format''s CKEditor 5 toolbar (editor.editor.<format> settings.toolbar.items) and its one setting
    switch_only (''Never remove direction, only switch'') is stored at settings.plugins.ckeditor_bidi_ckeditor5.switch_only.
    Live-state cases create/inspect namespaced CKEditor 5 text formats (ckeditor_bidi_m1/m2/h1/h2) via
    the filter_format + editor config entities. No permissions, routes, services, or Drush. configure=null.'
questions:
- id: ckeditor_bidi-how-enable
  input: I installed the ckeditor_bidi module but see no settings page. How do I actually get the RTL/LTR
    direction buttons to appear for editors?
  criteria: There is no module settings page. Edit a text format whose editor is CKEditor 5 (/admin/config/content/formats),
    and drag the 'Direction' button into the active CKEditor 5 toolbar. That adds the 'direction' item
    to editor.editor.<format> settings.toolbar.items.
  bundle: ckeditor_bidi
  rubric_ref: rubric/ckeditor_bidi_ckeditor_bidi_how_enable@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: ckeditor_bidi-switch-only
  input: In the ckeditor_bidi module, what does the 'Never remove direction, only switch' setting do,
    and what is its config key?
  criteria: The switch_only setting (config key ckeditor5.plugin.ckeditor_bidi_ckeditor5:switch_only,
    default false). When off, clicking a direction button that matches the editor's default direction
    removes the dir attribute; when on, the buttons always set an explicit dir="ltr"/dir="rtl" and never
    strip it, so direction is preserved across mixed LTR/RTL viewing contexts.
  bundle: ckeditor_bidi
  rubric_ref: rubric/ckeditor_bidi_ckeditor_bidi_switch_only@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: ckeditor_bidi-dir-attribute
  input: What HTML attribute do the ckeditor_bidi buttons control, and what values can they set on a block
    element?
  criteria: They set the HTML dir attribute to either ltr or rtl on block-level elements (paragraphs,
    headings, tables, list items). The plugin declares elements <$text-container dir="ltr rtl"> and <li
    dir="ltr rtl"> so those attributes survive filtering.
  bundle: ckeditor_bidi
  rubric_ref: rubric/ckeditor_bidi_ckeditor_bidi_dir_attribute@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: ckeditor_bidi-live-button
  input: On this Drupal site, which text format has the ckeditor_bidi 'direction' (RTL/LTR) button in
    its CKEditor 5 toolbar? Inspect the live editor configuration and give the format machine name.
  criteria: 'The ckeditor_bidi_m1 text format: its editor.editor.ckeditor_bidi_m1 config has ''direction''
    in settings.toolbar.items (drush config:get editor.editor.ckeditor_bidi_m1 settings).'
  bundle: ckeditor_bidi
  rubric_ref: rubric/ckeditor_bidi_ckeditor_bidi_live_button@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/ckeditor_bidi-live-button-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/ckeditor_bidi-live-button-cleanup.sh
- id: ckeditor_bidi-live-switchonly
  input: On this site there is a text format named ckeditor_bidi_m2 that uses the BiDi direction button.
    Is its 'Never remove direction, only switch' (switch_only) option enabled? Inspect the live configuration
    and answer.
  criteria: 'Yes: editor.editor.ckeditor_bidi_m2 has settings.plugins.ckeditor_bidi_ckeditor5.switch_only
    = true.'
  bundle: ckeditor_bidi
  rubric_ref: rubric/ckeditor_bidi_ckeditor_bidi_live_switchonly@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/ckeditor_bidi-live-switchonly-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/ckeditor_bidi-live-switchonly-cleanup.sh
- id: ckeditor_bidi-add-button
  input: On this Drupal site there is a CKEditor 5 text format with machine name ckeditor_bidi_h1. Using
    the ckeditor_bidi module, add the RTL/LTR direction button to that format's toolbar. Apply the change
    to the live site.
  criteria: Add the 'direction' item to editor.editor.ckeditor_bidi_h1 settings.toolbar.items (drag the
    Direction button in on /admin/config/content/formats, or edit the editor config). Verified when 'direction'
    is present in that format's toolbar items.
  bundle: ckeditor_bidi
  rubric_ref: rubric/ckeditor_bidi_ckeditor_bidi_add_button@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/ckeditor_bidi-add-button-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/ckeditor_bidi-add-button-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/ckeditor_bidi-add-button-verify.sh
- id: ckeditor_bidi-switchonly
  input: On this Drupal site, the CKEditor 5 text format ckeditor_bidi_h2 already has the BiDi direction
    button. Configure that format so the direction buttons always set an explicit direction and never
    remove the dir attribute. Apply the change to the live site.
  criteria: Enable the 'Never remove direction, only switch' option, i.e. set editor.editor.ckeditor_bidi_h2
    settings.plugins.ckeditor_bidi_ckeditor5.switch_only to true. Verified when switch_only === true on
    that format.
  bundle: ckeditor_bidi
  rubric_ref: rubric/ckeditor_bidi_ckeditor_bidi_switchonly@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/ckeditor_bidi-switchonly-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/ckeditor_bidi-switchonly-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/ckeditor_bidi-switchonly-verify.sh
