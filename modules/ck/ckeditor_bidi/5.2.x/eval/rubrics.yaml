rubrics:
- id: ckeditor_bidi_ckeditor_bidi_how_enable
  version: '1.0'
  applicable_bundles:
  - ckeditor_bidi
  checks:
  - kind: must_contain_any
    values:
    - toolbar
    - text format
    - Direction
    - CKEditor 5
  scoring:
    combine: all_pass
- id: ckeditor_bidi_ckeditor_bidi_switch_only
  version: '1.0'
  applicable_bundles:
  - ckeditor_bidi
  checks:
  - kind: must_contain_any
    values:
    - switch_only
    - Never remove direction
    - always set
  scoring:
    combine: all_pass
- id: ckeditor_bidi_ckeditor_bidi_dir_attribute
  version: '1.0'
  applicable_bundles:
  - ckeditor_bidi
  checks:
  - kind: must_contain_any
    values:
    - dir
    - ltr
    - rtl
  scoring:
    combine: all_pass
- id: ckeditor_bidi_ckeditor_bidi_live_button
  version: '1.0'
  applicable_bundles:
  - ckeditor_bidi
  checks:
  - kind: must_contain_any
    values:
    - ckeditor_bidi_m1
  scoring:
    combine: all_pass
- id: ckeditor_bidi_ckeditor_bidi_live_switchonly
  version: '1.0'
  applicable_bundles:
  - ckeditor_bidi
  checks:
  - kind: must_contain_any
    values:
    - 'true'
    - enabled
    - 'yes'
    - 'on'
  scoring:
    combine: all_pass
- id: ckeditor_bidi_ckeditor_bidi_add_button
  version: '1.0'
  applicable_bundles:
  - ckeditor_bidi
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
- id: ckeditor_bidi_ckeditor_bidi_switchonly
  version: '1.0'
  applicable_bundles:
  - ckeditor_bidi
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
