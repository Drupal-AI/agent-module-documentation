metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: aggregator
  version: 2.2.x
  note: 'Aggregator (ex-core, now contrib) ingests RSS/RDF/Atom feeds into aggregator_feed / aggregator_item
    content entities via a 3-stage fetcher/parser/processor plugin pipeline run on cron. Cases are `recipe`
    (response-graded): they probe documented facts an agent would otherwise read source to answer; no
    site mutation.'
questions:
- id: agg-content-entities
  input: In the Drupal Aggregator module, what two content entity types does it define, and what does
    each represent?
  criteria: 'aggregator_feed (a subscribed source: title, url, refresh interval) and aggregator_item (an
    individual article imported from a feed). Both are content entities.'
  bundle: aggregator
  rubric_ref: rubric/aggregator_agg_content_entities@1.0
  tags:
  - mode:recipe
- id: agg-pipeline-plugins
  input: Aggregator imports feeds through three swappable plugin types. Name them, their order, and which
    interface each implements.
  criteria: 'Order: fetcher (FetcherInterface, downloads raw data) → parser (ParserInterface, converts
    to a common item structure) → processor (ProcessorInterface, acts on/stores items). One fetcher and
    one parser are active; processors can be multiple.'
  bundle: aggregator
  rubric_ref: rubric/aggregator_agg_pipeline_plugins@1.0
  tags:
  - mode:recipe
- id: agg-configure-route
  input: On a Drupal 11 site, what is the configure route and admin path for the Aggregator global settings
    form, and where do you add/list feeds?
  criteria: 'Settings: route aggregator.admin_settings at /admin/config/services/aggregator/settings.
    Feeds are added/listed at the overview /admin/config/services/aggregator (aggregator.admin_overview).'
  bundle: aggregator
  rubric_ref: rubric/aggregator_agg_configure_route@1.0
  tags:
  - mode:recipe
- id: agg-permissions
  input: Which permissions does Aggregator define, what does each gate, and what security caution applies
    to the admin one?
  criteria: '''access news feeds'' = view /aggregator and feeds/items; ''administer news feeds'' = manage
    feeds/settings (restrict access). Caution: feed creation can be used for SSRF (scan localhost / reach
    intranet feeds), so grant admin only to trusted roles.'
  bundle: aggregator
  rubric_ref: rubric/aggregator_agg_permissions@1.0
  tags:
  - mode:recipe
- id: agg-cron-import
  input: How does Aggregator actually pull new items from feeds over time on a Drupal site? Describe the
    cron/queue mechanism.
  criteria: hook_cron() queues each feed whose refresh interval has elapsed into the 'aggregator_feeds'
    queue; the AggregatorRefresh queue worker then runs Feed::refreshItems() → ItemsImporter::refresh()
    (fetch→parse→process).
  bundle: aggregator
  rubric_ref: rubric/aggregator_agg_cron_import@1.0
  tags:
  - mode:recipe
- id: agg-import-in-code
  input: In PHP on Drupal 11, how do I force an immediate re-import of a single aggregator feed without
    waiting for cron? Which service and method?
  criteria: 'Load the aggregator_feed entity and call the aggregator.items.importer service (ItemsImporter):
    $importer->refresh($feed). ItemsImporter::delete($feed) removes its stored items.'
  bundle: aggregator
  rubric_ref: rubric/aggregator_agg_import_in_code@1.0
  tags:
  - mode:recipe
- id: agg-custom-plugin
  input: I need Aggregator to download feeds through a custom authenticated HTTP client. What kind of
    plugin do I write, which attribute/interface, and where does it live?
  criteria: 'Write a fetcher plugin: a class in src/Plugin/aggregator/fetcher/ annotated with the #[AggregatorFetcher(id,
    title)] attribute, implementing FetcherInterface::fetch(FeedInterface $feed). It then becomes selectable
    on the settings form.'
  bundle: aggregator
  rubric_ref: rubric/aggregator_agg_custom_plugin@1.0
  tags:
  - mode:recipe
- id: agg-override-existing-plugin
  input: Without registering a new plugin, how can a module swap the class used for Aggregator's default
    parser?
  criteria: Implement hook_aggregator_parser_info_alter(array &$info) and set $info['aggregator']['class']
    to your class. Parallel hooks exist for fetcher and processor.
  bundle: aggregator
  rubric_ref: rubric/aggregator_agg_override_existing_plugin@1.0
  tags:
  - mode:recipe
- id: agg-expire-setting
  input: How do I stop Aggregator from accumulating unlimited old items, and which config key controls
    it?
  criteria: The 'Discard items older than' age is aggregator.settings items.expire (seconds; default 9676800).
    It is contributed by the default processor; set it via the settings form or drush config:set. Use
    FeedStorageInterface::CLEAR_NEVER to keep items forever.
  bundle: aggregator
  rubric_ref: rubric/aggregator_agg_expire_setting@1.0
  tags:
  - mode:recipe
- id: agg-origin
  input: Is Aggregator a Drupal core module? What dependencies and external library does the contrib version
    need?
  criteria: It was a core module, deprecated in core 9.4 and removed in 10.0, now maintained in contrib.
    Depends on core file, filter, options and requires the laminas/laminas-feed library.
  bundle: aggregator
  rubric_ref: rubric/aggregator_agg_origin@1.0
  tags:
  - mode:recipe
