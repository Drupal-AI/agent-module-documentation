metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: new_relic_rpm
  version: 2.3.x
  note: 'New Relic RPM stores all of its behaviour in the single config object new_relic_rpm.settings
    (15 keys in 2.3.x; defaults in config/install). It has no config entity and no plugin types. New in
    2.3.x is the ''region'' key (us/eu) that selects the fixed New Relic REST endpoint via NewRelicApiClient::getApiBaseUrl()/getRegions().
    The site under test does NOT have the newrelic PHP extension loaded, so the runtime adapter is NullAdapter
    and no data actually reaches New Relic - but every configuration surface is still fully present and
    readable via drush, which is what the medium/hard cases exercise. Baseline shipped defaults used by
    reset/cleanup: track_drush=norm, track_cron=norm, views_log_slow=false, views_log_threshold=100, module_deployment=false,
    region=us. The drush deploy command (new-relic-rpm:deploy / nrd) and the adapter/NullAdapter fallback
    are the recipe-tier facts.'
questions:
- id: new_relic_rpm-deploy-command
  input: Using the new_relic_rpm Drupal module, what Drush command marks a New Relic deployment for a
    release revision like 1.2.3, and what is its short alias?
  criteria: 'drush new-relic-rpm:deploy 1.2.3 (alias: nrd), optionally with --description, --user and
    --changelog. It calls NewRelicApiClient::createDeployment() against New Relic REST API v2.'
  bundle: new_relic_rpm
  rubric_ref: rubric/new_relic_rpm_new_relic_rpm_deploy_command@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: new_relic_rpm-region-key
  input: In the new_relic_rpm module (2.3.x), how do I make its REST API calls go to New Relic's EU data
    center instead of the US one?
  criteria: Set the 'region' key in new_relic_rpm.settings to 'eu' (default is 'us'). The client's getApiBaseUrl()/getRegions()
    then use https://api.eu.newrelic.com/v2/ instead of https://api.newrelic.com/v2/. Only 'us' and 'eu'
    are allowed (schema Choice constraint).
  bundle: new_relic_rpm
  rubric_ref: rubric/new_relic_rpm_new_relic_rpm_region_key@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: new_relic_rpm-slowviews-keys
  input: In the new_relic_rpm module I want to record slow Views renders in New Relic. Which two keys
    in the new_relic_rpm.settings config turn that on and set the millisecond threshold, and what is the
    default threshold?
  criteria: Set views_log_slow to TRUE to enable it and views_log_threshold (milliseconds, default 100)
    for the cutoff. A view rendering slower than the threshold is recorded as a 'SlowView' Insights custom
    event.
  bundle: new_relic_rpm
  rubric_ref: rubric/new_relic_rpm_new_relic_rpm_slowviews_keys@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: new_relic_rpm-null-adapter
  input: What does the new_relic_rpm module do when the New Relic PHP extension (the 'newrelic' extension)
    is not loaded on the server? Does the site break?
  criteria: AdapterFactory::getAdapter() checks extension_loaded('newrelic'); if it is missing it returns
    a NullAdapter whose methods are all no-ops, so the site keeps working normally and simply sends nothing
    to New Relic (the real ExtensionAdapter is used only when the extension is present).
  bundle: new_relic_rpm
  rubric_ref: rubric/new_relic_rpm_new_relic_rpm_null_adapter@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: new_relic_rpm-slow-threshold
  input: On this Drupal site the new_relic_rpm slow-Views logging has been configured. Inspect the live
    new_relic_rpm.settings configuration and state the current slow-view threshold in milliseconds.
  criteria: views_log_threshold is 347 (and views_log_slow is TRUE). Read it with `drush config:get new_relic_rpm.settings
    views_log_threshold`.
  bundle: new_relic_rpm
  rubric_ref: rubric/new_relic_rpm_new_relic_rpm_slow_threshold@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/new_relic_rpm-slow-threshold-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/new_relic_rpm-slow-threshold-cleanup.sh
- id: new_relic_rpm-cron-track
  input: On this Drupal site, how is the new_relic_rpm module currently configured to track cron runs
    in New Relic (normal, background, or ignore)? Inspect the live configuration to answer.
  criteria: track_cron is set to 'ignore', so cron transactions are dropped from New Relic. Read it with
    `drush config:get new_relic_rpm.settings track_cron` (value 'ignore' = STATE_IGNORE).
  bundle: new_relic_rpm
  rubric_ref: rubric/new_relic_rpm_new_relic_rpm_cron_track@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/new_relic_rpm-cron-track-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/new_relic_rpm-cron-track-cleanup.sh
- id: new_relic_rpm-enable-slowviews
  input: On this Drupal site, configure the new_relic_rpm module so that slow Views renders are logged
    to New Relic, using a threshold of 500 milliseconds. Apply the change to the live site.
  criteria: In new_relic_rpm.settings set views_log_slow = TRUE and views_log_threshold = 500 (e.g. via
    `drush config:set` or the settings form at /admin/config/development/new-relic).
  bundle: new_relic_rpm
  rubric_ref: rubric/new_relic_rpm_new_relic_rpm_enable_slowviews@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/new_relic_rpm-enable-slowviews-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/new_relic_rpm-enable-slowviews-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/new_relic_rpm-enable-slowviews-verify.sh
- id: new_relic_rpm-drush-deploy
  input: On this Drupal site, configure the new_relic_rpm module so that (1) Drush commands are ignored
    by New Relic transaction tracking, and (2) a New Relic deployment marker is created automatically
    whenever a module is installed or uninstalled. Apply the changes to the live site.
  criteria: In new_relic_rpm.settings set track_drush = 'ignore' (STATE_IGNORE) and module_deployment
    = TRUE.
  bundle: new_relic_rpm
  rubric_ref: rubric/new_relic_rpm_new_relic_rpm_drush_deploy@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/new_relic_rpm-drush-deploy-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/new_relic_rpm-drush-deploy-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/new_relic_rpm-drush-deploy-verify.sh
