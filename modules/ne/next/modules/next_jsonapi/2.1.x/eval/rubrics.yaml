rubrics:
- id: next_jsonapi_next_jsonapi_what
  version: '1.0'
  applicable_bundles:
  - next_jsonapi
  checks:
  - kind: must_contain_any
    values:
    - '1000'
    - page size
    - max
    - jsonapi.entity_resource
  scoring:
    combine: all_pass
- id: next_jsonapi_next_jsonapi_parameter
  version: '1.0'
  applicable_bundles:
  - next_jsonapi
  checks:
  - kind: must_contain_any
    values:
    - next_jsonapi.size_max
    - '1000'
  scoring:
    combine: all_pass
- id: next_jsonapi_next_jsonapi_how
  version: '1.0'
  applicable_bundles:
  - next_jsonapi
  checks:
  - kind: must_contain_any
    values:
    - ServiceProvider
    - setMaxSize
    - EntityResource
    - decorat
  scoring:
    combine: all_pass
- id: next_jsonapi_next_jsonapi_live_class
  version: '1.0'
  applicable_bundles:
  - next_jsonapi
  checks:
  - kind: must_contain_any
    values:
    - Drupal\next_jsonapi\Controller\EntityResource
    - next_jsonapi
  scoring:
    combine: all_pass
- id: next_jsonapi_next_jsonapi_size_max
  version: '1.0'
  applicable_bundles:
  - next_jsonapi
  checks:
  - kind: must_contain_any
    values:
    - '1000'
  scoring:
    combine: all_pass
- id: next_jsonapi_next_jsonapi_enable
  version: '1.0'
  applicable_bundles:
  - next_jsonapi
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
- id: next_jsonapi_next_jsonapi_uninstall
  version: '1.0'
  applicable_bundles:
  - next_jsonapi
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
