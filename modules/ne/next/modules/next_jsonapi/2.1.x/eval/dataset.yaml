metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: next_jsonapi
  version: 2.1.x
  note: 'next_jsonapi is a pure service-decoration module: NextJsonapiServiceProvider::alter() re-classes
    jsonapi.entity_resource to Drupal\next_jsonapi\Controller\EntityResource and calls setMaxSize(''%next_jsonapi.size_max%''),
    with parameter next_jsonapi.size_max = 1000 (core JSON:API max is 50). It has no config entity/permission/route/Drush,
    so its only live ''state'' is the active service class + the container parameter, and whether the
    module is enabled. Introspection reads get_class(jsonapi.entity_resource) and the size_max parameter
    from the running container; execution is grounded in enabling/uninstalling the module, verified by
    whether jsonapi.entity_resource is next_jsonapi''s subclass. Actual JSON:API traffic is consumed by
    the external Next.js app.'
questions:
- id: next-jsonapi-what
  input: What does the next_jsonapi submodule do for a decoupled Next.js site?
  criteria: It raises JSON:API's maximum page size to 1000 (core default is 50) by decorating the jsonapi.entity_resource
    service with its own EntityResource subclass, so a Next.js build can fetch large collections in fewer
    requests.
  bundle: next_jsonapi
  rubric_ref: rubric/next_jsonapi_next_jsonapi_what@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: next-jsonapi-parameter
  input: Which container parameter controls the maximum JSON:API page size in next_jsonapi, and what is
    its default value?
  criteria: The parameter next_jsonapi.size_max, defined in next_jsonapi.services.yml with default value
    1000. Override it (e.g. in a services.yml) to change the cap; there is no admin form.
  bundle: next_jsonapi
  rubric_ref: rubric/next_jsonapi_next_jsonapi_parameter@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: next-jsonapi-how
  input: How does next_jsonapi apply its higher page-size limit technically?
  criteria: NextJsonapiServiceProvider::alter() changes the jsonapi.entity_resource service class to Drupal\next_jsonapi\Controller\EntityResource
    and adds a setMaxSize('%next_jsonapi.size_max%') method call. That subclass overrides getJsonApiParams()
    to use the larger OffsetPage max when a 'fields' query parameter is present.
  bundle: next_jsonapi
  rubric_ref: rubric/next_jsonapi_next_jsonapi_how@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: next-jsonapi-live-class
  input: On this live site, inspect the service container and report which PHP class currently serves
    the jsonapi.entity_resource service (indicating next_jsonapi's decoration is active).
  criteria: get_class(\Drupal::service('jsonapi.entity_resource')) is Drupal\next_jsonapi\Controller\EntityResource,
    showing next_jsonapi has decorated the core service.
  bundle: next_jsonapi
  rubric_ref: rubric/next_jsonapi_next_jsonapi_live_class@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/next_jsonapi-live-class-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/next_jsonapi-live-class-cleanup.sh
- id: next-jsonapi-size-max
  input: Inspect the running Drupal container on this site and report the value of the next_jsonapi.size_max
    parameter (the JSON:API max page size next_jsonapi sets).
  criteria: \Drupal::getContainer()->getParameter('next_jsonapi.size_max') is 1000.
  bundle: next_jsonapi
  rubric_ref: rubric/next_jsonapi_next_jsonapi_size_max@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/next_jsonapi-size-max-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/next_jsonapi-size-max-cleanup.sh
- id: next-jsonapi-enable
  input: I need my headless Next.js site to be able to pull large JSON:API collections (bigger pages)
    from Drupal. Enable the next_jsonapi module so JSON:API's page-size limit is raised for the front
    end.
  criteria: next_jsonapi is enabled, so the jsonapi.entity_resource service is now Drupal\next_jsonapi\Controller\EntityResource
    and the next_jsonapi.size_max parameter (1000) is defined.
  bundle: next_jsonapi
  rubric_ref: rubric/next_jsonapi_next_jsonapi_enable@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: site-owner
    reset: agent-module-documentation/evaluation/verify/next_jsonapi-enable-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/next_jsonapi-enable-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/next_jsonapi-enable-verify.sh
- id: next-jsonapi-uninstall
  input: We are moving this decoupled site from JSON:API to another data layer and no longer want next_jsonapi's
    JSON:API page-size override. Uninstall the next_jsonapi module (leave the core jsonapi and next modules
    in place).
  criteria: next_jsonapi is no longer enabled; jsonapi.entity_resource has reverted to the core Drupal\jsonapi\Controller\EntityResource
    class (not next_jsonapi's subclass), while jsonapi and next remain enabled.
  bundle: next_jsonapi
  rubric_ref: rubric/next_jsonapi_next_jsonapi_uninstall@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/next_jsonapi-uninstall-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/next_jsonapi-uninstall-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/next_jsonapi-uninstall-verify.sh
