metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: next_graphql
  version: 2.1.x
  note: 'next_graphql is an info-only glue module (next_graphql.info.yml only, no PHP/config/schema) whose
    sole purpose is the dependency set graphql + graphql_compose + next, making GraphQL Compose the Next.js
    data layer instead of JSON:API. IMPORTANT: on this site it CANNOT be enabled because its required
    dependency graphql_compose is not installed, and it ships no code, config, or state of its own. Therefore
    there is no local runtime state to build/verify: HARD (execution) cases are intentionally omitted
    (documented as skipped). The MEDIUM cases are grounded in the real, inspectable live state that it
    is NOT enabled and its graphql_compose dependency is missing; EASY cases cover what it does and its
    dependencies. The GraphQL traffic itself is external (the Next.js app).'
  skipped:
    hard: next_graphql cannot be enabled on this site (required contrib dependency graphql_compose is
      not installed) and provides no config entity, setting, plugin, service, or other local state to
      create or verify. An execution/verify case would be either impossible to build or trivially unverifiable,
      so hard cases are omitted honestly rather than invented.
questions:
- id: next-graphql-what
  input: What does the next_graphql submodule do, and how does it differ from next_jsonapi?
  criteria: next_graphql is a glue module that makes GraphQL (via GraphQL Compose) the data layer for
    a Next.js decoupled site, as an alternative to JSON:API (next_jsonapi). It is info-only and just pulls
    in graphql, graphql_compose and next.
  bundle: next_graphql
  rubric_ref: rubric/next_graphql_next_graphql_what@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: next-graphql-deps
  input: Which modules does next_graphql depend on, and does it ship any PHP/config of its own?
  criteria: It depends on graphql, graphql_compose and next. It is info-only (only next_graphql.info.yml)
    — no PHP, services, plugins, config, schema, permissions or routes; all behavior comes from its dependencies.
  bundle: next_graphql
  rubric_ref: rubric/next_graphql_next_graphql_deps@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: next-graphql-provides
  input: Does next_graphql provide any services, plugins, or configuration I need to set up after enabling
    it?
  criteria: No. next_graphql is an info-only glue module with no code or configuration of its own; enabling
    it just enables graphql, graphql_compose and next. Configure GraphQL through GraphQL Compose and preview/revalidation
    through next.
  bundle: next_graphql
  rubric_ref: rubric/next_graphql_next_graphql_provides@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: next-graphql-is-enabled
  input: 'Inspect this live Drupal site: is the next_graphql module currently enabled? If it is not, name
    the required dependency that is missing/not installed and would need to be added first.'
  criteria: next_graphql is NOT enabled on this site. It requires graphql_compose (in addition to graphql
    and next), and graphql_compose is not installed, so next_graphql cannot be enabled until graphql_compose
    is added.
  bundle: next_graphql
  rubric_ref: rubric/next_graphql_next_graphql_is_enabled@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/next_graphql-is-enabled-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/next_graphql-is-enabled-cleanup.sh
- id: next-graphql-missing-dep
  input: On this site, determine whether the graphql_compose module (required by next_graphql to provide
    the GraphQL schema) is present in the codebase, and whether the graphql module is present.
  criteria: graphql is present (installed), but graphql_compose is NOT present in the codebase. Discoverable
    via \Drupal::service('extension.list.module')->exists('graphql_compose') (false) vs 'graphql' (true).
    Because graphql_compose is missing, next_graphql cannot be enabled.
  bundle: next_graphql
  rubric_ref: rubric/next_graphql_next_graphql_missing_dep@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/next_graphql-missing-dep-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/next_graphql-missing-dep-cleanup.sh
