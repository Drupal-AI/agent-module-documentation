metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: monitoring
  version: 1.22.x
  note: 'Sensor framework. A sensor is a SensorPlugin (plugin type monitoring.sensor) plus a monitoring_sensor_config
    config entity (config prefix monitoring.sensor_config.<id>) storing plugin_id, category, value_type,
    status, thresholds (type exceeds/falls/inner/outer + warning/critical). Real Drush: monitoring:run/list-sensors/enable/disable/rebuild.
    Medium cases seed a namespaced sensor config entity (mon_probe) and read it back; hard cases create
    a sensor config entity (mon_task) and toggle a shipped sensor (core_cron_last_run_age), verified against
    live config. All grounded in real routes/services/config keys.'
questions:
- id: monitoring-run-cli
  input: Using the Monitoring module, how do I run all of a Drupal site's sensors from the command line,
    and how do I force a fresh (uncached) run of a single sensor?
  criteria: Run `drush monitoring:run` for all sensors; for one uncached sensor use `drush monitoring:run
    <sensor_name> --force`.
  bundle: monitoring
  rubric_ref: rubric/monitoring_monitoring_run_cli@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: monitoring-what-is-sensor
  input: In the Monitoring module, what is a 'sensor' technically, and what plugin would I implement to
    add a custom one?
  criteria: A sensor is a SensorPlugin plugin (plugin type monitoring.sensor, in Plugin/monitoring/SensorPlugin/),
    paired with a monitoring_sensor_config entity. To add one, implement a SensorPlugin (extend SensorPluginBase,
    implement runSensor()).
  bundle: monitoring
  rubric_ref: rubric/monitoring_monitoring_what_is_sensor@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: monitoring-config-thresholds
  input: Where does Monitoring store an individual sensor's configuration such as its warning/critical
    thresholds, and what threshold comparison types does it support?
  criteria: 'Each sensor is a monitoring_sensor_config config entity (config prefix monitoring.sensor_config.<id>)
    with a thresholds mapping: type is one of exceeds, falls, inner, outer with integer warning/critical
    bounds.'
  bundle: monitoring
  rubric_ref: rubric/monitoring_monitoring_config_thresholds@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: monitoring-probe-threshold
  input: This site has a Monitoring sensor with machine name 'mon_probe'. Inspect the live sensor configuration
    and report its warning threshold value.
  criteria: The mon_probe sensor's thresholds.warning is 4242 (config monitoring.sensor_config.mon_probe).
  bundle: monitoring
  rubric_ref: rubric/monitoring_monitoring_probe_threshold@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/monitoring-probe-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/monitoring-probe-cleanup.sh
- id: monitoring-probe-plugin
  input: Inspect the Monitoring sensor named 'mon_probe' on this site and report which sensor plugin (plugin_id)
    it uses.
  criteria: 'mon_probe uses the config_value sensor plugin (plugin_id: config_value in monitoring.sensor_config.mon_probe).'
  bundle: monitoring
  rubric_ref: rubric/monitoring_monitoring_probe_plugin@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/monitoring-probe-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/monitoring-probe-cleanup.sh
- id: monitoring-create-sensor
  input: On this site, create an enabled Monitoring sensor with machine id 'mon_task' that uses the config_value
    sensor plugin, in the category 'Custom'. Apply it to the live site.
  criteria: 'A monitoring_sensor_config entity ''mon_task'' exists with plugin_id: config_value and status:
    true (e.g. SensorConfig::create([''id''=>''mon_task'',''label''=>''...'',''plugin_id''=>''config_value'',''category''=>''Custom'',''status''=>TRUE,
    ...])->save()).'
  bundle: monitoring
  rubric_ref: rubric/monitoring_monitoring_create_sensor@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/monitoring-create-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/monitoring-create-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/monitoring-create-verify.sh
- id: monitoring-enable-cron-sensor
  input: I want my site to keep an eye on whether the periodic maintenance task (cron) has been running.
    Turn on the check that watches how long it has been since cron last ran.
  criteria: 'The core_cron_last_run_age sensor is enabled (status: true) - e.g. via `drush monitoring:enable
    core_cron_last_run_age` or by setting monitoring.sensor_config.core_cron_last_run_age status to true.'
  bundle: monitoring
  rubric_ref: rubric/monitoring_monitoring_enable_cron_sensor@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: layman
    reset: agent-module-documentation/evaluation/verify/monitoring-cron-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/monitoring-cron-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/monitoring-cron-verify.sh
