rubrics:
- id: monitoring_monitoring_run_cli
  version: '1.0'
  applicable_bundles:
  - monitoring
  checks:
  - kind: must_contain_any
    values:
    - monitoring:run
    - monitoring-run
    - drush monitoring
  scoring:
    combine: all_pass
- id: monitoring_monitoring_what_is_sensor
  version: '1.0'
  applicable_bundles:
  - monitoring
  checks:
  - kind: must_contain_any
    values:
    - SensorPlugin
    - runSensor
    - plugin
    - monitoring.sensor
  scoring:
    combine: all_pass
- id: monitoring_monitoring_config_thresholds
  version: '1.0'
  applicable_bundles:
  - monitoring
  checks:
  - kind: must_contain_any
    values:
    - monitoring.sensor_config
    - monitoring_sensor_config
    - thresholds
    - exceeds
    - falls
  scoring:
    combine: all_pass
- id: monitoring_monitoring_probe_threshold
  version: '1.0'
  applicable_bundles:
  - monitoring
  checks:
  - kind: must_contain_any
    values:
    - '4242'
  scoring:
    combine: all_pass
- id: monitoring_monitoring_probe_plugin
  version: '1.0'
  applicable_bundles:
  - monitoring
  checks:
  - kind: must_contain_any
    values:
    - config_value
  scoring:
    combine: all_pass
- id: monitoring_monitoring_create_sensor
  version: '1.0'
  applicable_bundles:
  - monitoring
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
- id: monitoring_monitoring_enable_cron_sensor
  version: '1.0'
  applicable_bundles:
  - monitoring
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
