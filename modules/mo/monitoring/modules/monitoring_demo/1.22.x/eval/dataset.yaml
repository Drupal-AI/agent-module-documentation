  module: monitoring_demo
  version: 1.22.x
  note: 'Demo/onboarding submodule. On install it seeds sample nodes/comments/watchdog, installs a Search
    API demo server+index (search_api.index.demo), and adds a landing page route monitoring_demo.front_page
    at /monitoring-demo. Baseline: submodule not enabled (site page.front=/node). Medium cases enable
    it (setup restores page.front to /node immediately) and read the landing route/search index back;
    hard cases install the demo, verified by module enabled + /monitoring-demo route + ''demo'' search
    index. Teardown restores page.front and removes the demo''s own sensor configs; harmless seeded content
    nodes are left in place to avoid deleting other agents'' concurrent content on this shared site.'
questions:
- id: mdemo-what
  input: What is the monitoring_demo submodule for, and is it intended for production sites?
  criteria: It is a demo/onboarding fixture (built for simplytest.me) that seeds sample content, comments
    and a Search API index and adds a landing page so Monitoring's sensors have data to report. Not for
    production.
  bundle: monitoring_demo
  rubric_ref: rubric/monitoring_demo_mdemo_what@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: mdemo-landing
  input: What landing-page path does the monitoring_demo module add, and what route name serves it?
  criteria: It adds the /monitoring-demo landing page, served by the monitoring_demo.front_page route
    (FrontPage::content, permission access content).
  bundle: monitoring_demo
  rubric_ref: rubric/monitoring_demo_mdemo_landing@1.0
  tags:
  - mode:recipe
  - difficulty:easy
