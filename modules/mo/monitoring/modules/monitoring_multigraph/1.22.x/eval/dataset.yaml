metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: monitoring_multigraph
  version: 1.22.x
  note: 'Defines the monitoring_multigraph config entity (prefix monitoring_multigraph.multigraph.<id>)
    that groups sensors via a ''sensors'' map {sensor_id:{weight,label}}. Admin at /admin/config/system/monitoring/multigraphs
    (perm administer monitoring). Baseline: submodule not enabled. Medium cases enable it, seed a known
    multigraph, and read it back; hard cases create a multigraph aggregating named sensors, verified against
    live config. Grounded in real entity/config keys and shipped sensor ids (core_cron_last_run_age, system_load_average,
    user_failed_logins).'
questions:
- id: mmg-what
  input: What does the monitoring_multigraph submodule let you do, and what kind of Drupal entity does
    it store a multigraph as?
  criteria: It groups several Monitoring sensors into one 'multigraph' for aggregated reporting/graphing.
    A multigraph is a monitoring_multigraph config entity with a sensors map.
  bundle: monitoring_multigraph
  rubric_ref: rubric/monitoring_multigraph_mmg_what@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: mmg-admin-path
  input: Where in the Drupal admin UI do you manage multigraphs provided by monitoring_multigraph, and
    which permission is required?
  criteria: At /admin/config/system/monitoring/multigraphs (list/add/edit/delete), gated by the 'administer
    monitoring' permission.
  bundle: monitoring_multigraph
  rubric_ref: rubric/monitoring_multigraph_mmg_admin_path@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: mmg-api
  input: Which methods on the Multigraph entity add or remove a sensor from a multigraph in code?
  criteria: Multigraph::addSensor($name, $label = NULL) and Multigraph::removeSensor($name); read them
    with getSensors()/getSensorsRaw().
  bundle: monitoring_multigraph
  rubric_ref: rubric/monitoring_multigraph_mmg_api@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: mmg-live-sensors
  input: This site has a multigraph named 'mg_probe'. Inspect the live configuration and list the sensor
