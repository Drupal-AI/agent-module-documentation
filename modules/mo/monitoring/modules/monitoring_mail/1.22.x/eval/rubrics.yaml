rubrics:
- id: monitoring_mail_mmail_what
  version: '1.0'
  applicable_bundles:
  - monitoring_mail
  checks:
  - kind: must_contain_any
    values:
    - transition
    - escalation
    - status
    - hook_monitoring_run_sensors
  scoring:
    combine: all_pass
- id: monitoring_mail_mmail_settings
  version: '1.0'
  applicable_bundles:
  - monitoring_mail
  checks:
  - kind: must_contain_any
    values:
    - monitoring_mail.settings
    - /admin/config/system/monitoring/settings
  scoring:
    combine: all_pass
- id: monitoring_mail_mmail_default_severity
  version: '1.0'
  applicable_bundles:
  - monitoring_mail
  checks:
  - kind: must_contain_any
    values:
    - CRITICAL
  scoring:
    combine: all_pass
- id: monitoring_mail_mmail_live_recipient
  version: '1.0'
  applicable_bundles:
  - monitoring_mail
  checks:
  - kind: must_contain_any
    values:
    - alerts@probe.test
  scoring:
    combine: all_pass
- id: monitoring_mail_mmail_live_severities
  version: '1.0'
  applicable_bundles:
  - monitoring_mail
  checks:
  - kind: must_contain_any
    values:
    - WARNING
  scoring:
    combine: all_pass
- id: monitoring_mail_mmail_set_recipient
  version: '1.0'
  applicable_bundles:
  - monitoring_mail
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
- id: monitoring_mail_mmail_add_warning
  version: '1.0'
  applicable_bundles:
  - monitoring_mail
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
