metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: monitoring_mail
  version: 1.22.x
  note: 'Sends escalation email on sensor status transition. Config monitoring_mail.settings: mail (recipient),
    severities (list, default [CRITICAL]). Fields injected into the base settings form; mail sent from
    hook_monitoring_run_sensors. Baseline: submodule not enabled. Medium cases enable it, seed known settings,
    read them back; hard cases configure the recipient / add a severity, verified against live config
    (reset enables + clears the key). Grounded in real config keys.'
questions:
- id: mmail-what
  input: What does the monitoring_mail submodule do, and when does it actually send an email?
  criteria: It sends escalation email when a sensor's result transitions into a configured bad status
    (severity). It hooks hook_monitoring_run_sensors after each run and mails on status change into a
    configured severity.
  bundle: monitoring_mail
  rubric_ref: rubric/monitoring_mail_mmail_what@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: mmail-settings
  input: In which config object does monitoring_mail store the recipient address and the severities that
    trigger email, and where do you edit them in the UI?
  criteria: 'Stored in monitoring_mail.settings (keys: mail, severities). Edited on the base Monitoring
    settings form at /admin/config/system/monitoring/settings (fields injected via hook_form_monitoring_settings_alter).'
  bundle: monitoring_mail
  rubric_ref: rubric/monitoring_mail_mmail_settings@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: mmail-default-severity
  input: By default, which sensor status severity triggers a monitoring_mail escalation email?
  criteria: By default severities is [CRITICAL], so mail is sent on transition to CRITICAL. You can add
    WARNING to also mail on warnings.
  bundle: monitoring_mail
  rubric_ref: rubric/monitoring_mail_mmail_default_severity@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: mmail-live-recipient
  input: monitoring_mail is configured on this site. Inspect the live monitoring_mail.settings and report
    the recipient email address that escalation mail is sent to.
  criteria: The recipient is alerts@probe.test (monitoring_mail.settings:mail).
  bundle: monitoring_mail
  rubric_ref: rubric/monitoring_mail_mmail_live_recipient@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/mmail-settings-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/mmail-settings-cleanup.sh
- id: mmail-live-severities
  input: Inspect the live monitoring_mail configuration on this site and list which sensor severities
    currently trigger an escalation email.
  criteria: severities is [CRITICAL, WARNING] on this site, so both trigger mail (monitoring_mail.settings:severities).
  bundle: monitoring_mail
  rubric_ref: rubric/monitoring_mail_mmail_live_severities@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/mmail-settings-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/mmail-settings-cleanup.sh
- id: mmail-set-recipient
  input: Configure monitoring_mail so that escalation email is sent to ops@task.test. Apply the change
    to the live site.
  criteria: monitoring_mail.settings:mail is set to a non-empty recipient address (e.g. ops@task.test),
    via the Monitoring settings form or drush cset monitoring_mail.settings mail ops@task.test.
  bundle: monitoring_mail
  rubric_ref: rubric/monitoring_mail_mmail_set_recipient@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/mmail-recipient-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/mmail-recipient-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/mmail-recipient-verify.sh
- id: mmail-add-warning
  input: Right now I only get emailed about critical site problems. I also want to be emailed about warnings.
    Please make warnings trigger the alert emails too.
  criteria: monitoring_mail.settings:severities now includes WARNING (in addition to CRITICAL), so warning
    transitions also trigger mail.
  bundle: monitoring_mail
  rubric_ref: rubric/monitoring_mail_mmail_add_warning@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: layman
    reset: agent-module-documentation/evaluation/verify/mmail-warning-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/mmail-warning-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/mmail-warning-verify.sh
