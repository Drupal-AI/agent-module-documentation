metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: monitoring_test
  version: 1.22.x
  note: 'Hidden test-fixture submodule. Provides the test_sensor SensorPlugin (State-driven) and installs
    test monitoring_sensor_config entities (test_sensor, test_sensor_exceeds [thresholds.type=exceeds],
    test_sensor_falls, test_sensor_inner, test_sensor_outer, test_sensor_cat_watchdog, ...), a TestWorker
    queue worker and a TestSensorResult class. Baseline: submodule not enabled. Medium cases enable it
    and read the shipped sensor configs back; hard cases install the fixture (reset uninstalls, verify
    checks module enabled + test_sensor config exists). Grounded in real shipped config (plugin_id: test_sensor,
    test_sensor_exceeds thresholds.type: exceeds).'
questions:
- id: mtest-what
  input: What is the purpose of the monitoring_test submodule, and what controllable sensor plugin does
    it provide?
  criteria: It is a hidden test-fixture module for Monitoring's automated tests. It provides the test_sensor
    SensorPlugin whose status/value/message are driven by State (monitoring_test.sensor_result_data),
    plus ready-made test sensor configs.
  bundle: monitoring_test
  rubric_ref: rubric/monitoring_test_mtest_what@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: mtest-threshold-fixtures
  input: The monitoring_test module ships sensor configs for exercising each threshold type. Name some
    of the threshold comparison types its test sensors cover.
  criteria: Its shipped test sensors cover exceeds (test_sensor_exceeds), falls (test_sensor_falls), inner
    (test_sensor_inner) and outer (test_sensor_outer).
  bundle: monitoring_test
  rubric_ref: rubric/monitoring_test_mtest_threshold_fixtures@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: mtest-state-driven
  input: How does a test control what status/value the monitoring_test test_sensor reports?
  criteria: TestSensorPlugin reads the State key monitoring_test.sensor_result_data (sensor_status, sensor_value,
    sensor_message, sensor_expected_value, sensor_exception_message), so a test sets that State to force
    any outcome.
  bundle: monitoring_test
  rubric_ref: rubric/monitoring_test_mtest_state_driven@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: mtest-live-exceeds-type
  input: The monitoring_test module is installed on this site. Inspect the live configuration of its test_sensor_exceeds
    sensor and report the threshold comparison type it uses.
  criteria: 'test_sensor_exceeds uses thresholds.type: exceeds (monitoring.sensor_config.test_sensor_exceeds).'
  bundle: monitoring_test
  rubric_ref: rubric/monitoring_test_mtest_live_exceeds_type@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/mtest-enable-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/mtest-enable-cleanup.sh
- id: mtest-live-plugin
  input: With monitoring_test installed, inspect the live 'test_sensor' sensor configuration on this site
    and report which sensor plugin (plugin_id) it uses.
  criteria: 'The test_sensor sensor config uses plugin_id: test_sensor (monitoring.sensor_config.test_sensor).'
  bundle: monitoring_test
  rubric_ref: rubric/monitoring_test_mtest_live_plugin@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/mtest-enable-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/mtest-enable-cleanup.sh
- id: mtest-install-expert
  input: Install the monitoring_test fixture module on this site so its test sensors (such as test_sensor)
    are available.
  criteria: monitoring_test is installed (drush en monitoring_test) and the monitoring.sensor_config.test_sensor
    entity exists.
  bundle: monitoring_test
  rubric_ref: rubric/monitoring_test_mtest_install_expert@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/mtest-install-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/mtest-install-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/mtest-install-verify.sh
- id: mtest-install-layman
  input: I want to try out the Monitoring module's built-in example sensors that are used for testing.
    Please set up those test sensors on my site.
  criteria: Enabling monitoring_test installs its fixture sensor configs (test_sensor and friends); the
    module is installed and monitoring.sensor_config.test_sensor exists.
  bundle: monitoring_test
  rubric_ref: rubric/monitoring_test_mtest_install_layman@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: layman
    reset: agent-module-documentation/evaluation/verify/mtest-install-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/mtest-install-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/mtest-install-verify.sh
