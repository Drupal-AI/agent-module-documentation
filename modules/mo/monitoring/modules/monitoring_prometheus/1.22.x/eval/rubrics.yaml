rubrics:
- id: monitoring_prometheus_mprom_endpoint
  version: '1.0'
  applicable_bundles:
  - monitoring_prometheus
  checks:
  - kind: must_contain_any
    values:
    - /metrics
    - access monitoring prometheus metrics
  scoring:
    combine: all_pass
- id: monitoring_prometheus_mprom_allowed_ips
  version: '1.0'
  applicable_bundles:
  - monitoring_prometheus
  checks:
  - kind: must_contain_any
    values:
    - allowed_ips
    - monitoring_prometheus.settings
  scoring:
    combine: all_pass
- id: monitoring_prometheus_mprom_custom_labels
  version: '1.0'
  applicable_bundles:
  - monitoring_prometheus
  checks:
  - kind: must_contain_any
    values:
    - custom_labels
    - monitoring_prometheus.settings
  scoring:
    combine: all_pass
- id: monitoring_prometheus_mprom_live_allowed_ip
  version: '1.0'
  applicable_bundles:
  - monitoring_prometheus
  checks:
  - kind: must_contain_any
    values:
    - 10.1.2.3
  scoring:
    combine: all_pass
- id: monitoring_prometheus_mprom_live_label
  version: '1.0'
  applicable_bundles:
  - monitoring_prometheus
  checks:
  - kind: must_contain_any
    values:
    - staging
  scoring:
    combine: all_pass
- id: monitoring_prometheus_mprom_restrict_ip
  version: '1.0'
  applicable_bundles:
  - monitoring_prometheus
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
- id: monitoring_prometheus_mprom_add_label
  version: '1.0'
  applicable_bundles:
  - monitoring_prometheus
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
