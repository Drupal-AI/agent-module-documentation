metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: monitoring_prometheus
  version: 1.22.x
  note: 'Exposes /metrics (route monitoring_prometheus.metrics) for Prometheus scraping of Monitoring
    sensors. Access gated by permission access monitoring prometheus metrics + IP allowlist (MetricsController::ipAccess).
    Config monitoring_prometheus.settings: allowed_ips (sequence), custom_labels (sequence). Baseline:
    submodule not enabled. Medium cases enable it, seed known config, and read it back; hard cases require
    configuring allowed_ips / custom_labels, verified against live config (reset enables + clears the
    key). All grounded in real route/permission/config keys.'
questions:
- id: mprom-endpoint
  input: The monitoring_prometheus submodule exposes Monitoring sensors for scraping. At what URL path,
    and which permission controls access to it?
  criteria: It serves the /metrics path (route monitoring_prometheus.metrics), gated by the 'access monitoring
    prometheus metrics' permission plus an optional IP allowlist.
  bundle: monitoring_prometheus
  rubric_ref: rubric/monitoring_prometheus_mprom_endpoint@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: mprom-allowed-ips
  input: How do I restrict which servers may scrape the monitoring_prometheus /metrics endpoint, and in
    which config object is that stored?
  criteria: Set the allowed_ips sequence in monitoring_prometheus.settings; if non-empty only those client
    IPs may scrape (empty = any IP, permission still applies). Checked by MetricsController::ipAccess().
  bundle: monitoring_prometheus
  rubric_ref: rubric/monitoring_prometheus_mprom_allowed_ips@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: mprom-custom-labels
  input: How can I add extra labels (for example an environment name) to the metrics exported by monitoring_prometheus?
  criteria: Set the custom_labels sequence in monitoring_prometheus.settings; those labels are attached
    to every exported metric.
  bundle: monitoring_prometheus
  rubric_ref: rubric/monitoring_prometheus_mprom_custom_labels@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: mprom-live-allowed-ip
  input: On this site monitoring_prometheus is configured to restrict who can scrape /metrics. Inspect
    the live monitoring_prometheus.settings and report the IP address in its allowed_ips list.
  criteria: allowed_ips contains 10.1.2.3 (monitoring_prometheus.settings:allowed_ips).
  bundle: monitoring_prometheus
  rubric_ref: rubric/monitoring_prometheus_mprom_live_allowed_ip@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/mprom-settings-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/mprom-settings-cleanup.sh
- id: mprom-live-label
  input: monitoring_prometheus on this site is configured to add a custom label to exported metrics. Inspect
    the live monitoring_prometheus.settings and report the value of the 'env' custom label.
  criteria: custom_labels.env is 'staging' (monitoring_prometheus.settings:custom_labels).
  bundle: monitoring_prometheus
  rubric_ref: rubric/monitoring_prometheus_mprom_live_label@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/mprom-settings-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/mprom-settings-cleanup.sh
- id: mprom-restrict-ip
  input: Configure monitoring_prometheus so that only the Prometheus server at IP 10.9.8.7 is allowed
    to scrape the /metrics endpoint. Apply the change to the live site.
  criteria: monitoring_prometheus.settings:allowed_ips contains 10.9.8.7 (e.g. drush cset monitoring_prometheus.settings
    allowed_ips.0 10.9.8.7).
  bundle: monitoring_prometheus
  rubric_ref: rubric/monitoring_prometheus_mprom_restrict_ip@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/mprom-ip-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/mprom-ip-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/mprom-ip-verify.sh
- id: mprom-add-label
  input: I scrape several sites into one Prometheus. Please tag this site's exported metrics with an environment
    label whose value is 'production', so I can tell them apart.
  criteria: monitoring_prometheus.settings:custom_labels contains the value 'production' (e.g. drush cset
    monitoring_prometheus.settings custom_labels.env production).
  bundle: monitoring_prometheus
  rubric_ref: rubric/monitoring_prometheus_mprom_add_label@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: layman
    reset: agent-module-documentation/evaluation/verify/mprom-label-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/mprom-label-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/mprom-label-verify.sh
