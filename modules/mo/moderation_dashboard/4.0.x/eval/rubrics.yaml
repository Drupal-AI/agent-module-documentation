rubrics:
- id: moderation_dashboard_moderation_dashboard_dashboard_route
  version: '1.0'
  applicable_bundles:
  - moderation_dashboard
  checks:
  - kind: must_contain_any
    values:
    - view.moderation_dashboard.page_1
    - user/%user/moderation-dashboard
    - user/{user}/moderation-dashboard
  scoring:
    combine: all_pass
- id: moderation_dashboard_moderation_dashboard_settings_keys
