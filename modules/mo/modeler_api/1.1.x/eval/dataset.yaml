metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: modeler_api
  version: 1.1.x
  note: 'Modeler API is a framework module: it defines Modeler + ModelOwner plugin types, three YAML plugin
    types, and a central Api mediator service. Cases are `recipe` (response-graded) probing documented
    facts an agent would otherwise read source to answer; no site mutation.'
questions:
- id: modeler-api-two-plugin-types
  input: On a Drupal 11 site using Modeler API, what are the two core plugin types it defines and what
    does each side represent? Which PHP attributes declare them?
  criteria: A Modeler plugin (#[Modeler], namespace Plugin/ModelerApiModeler) provides the visual editor;
    a ModelOwner plugin (#[ModelOwner], namespace Plugin/ModelerApiModelOwner) owns the config entities
    being modeled. The Api service mediates between them.
  bundle: modeler_api
  rubric_ref: rubric/modeler_api_modeler_api_two_plugin_types@1.0
  tags:
  - mode:recipe
- id: modeler-api-bpmn-is-modeler
  input: In the Modeler API ecosystem, is the bpmn_io module a Modeler or a Model Owner, and how does
    it register itself?
  criteria: 'bpmn_io is a Modeler: it registers a plugin with the #[Modeler] attribute in Plugin/ModelerApiModeler
    implementing ModelerInterface (extending ModelerBase). It does not define a plugin type.'
  bundle: modeler_api
  rubric_ref: rubric/modeler_api_modeler_api_bpmn_is_modeler@1.0
  tags:
  - mode:recipe
- id: modeler-api-eca-ai-owners
  input: Which Modeler API plugin type do ECA (via eca_ui) and AI Agents implement so their configurations
    can be graphically edited?
  criteria: 'They implement the ModelOwner plugin type (ModelOwnerInterface, #[ModelOwner]); they are
    model owners whose config entities any modeler can edit.'
  bundle: modeler_api
  rubric_ref: rubric/modeler_api_modeler_api_eca_ai_owners@1.0
  tags:
  - mode:recipe
- id: modeler-api-service
  input: In code on a Drupal 11 site, which Modeler API service mediates between modelers and model owners,
    and which method finds the model owner plugin for a given config entity?
  criteria: The modeler_api.service service (Drupal\modeler_api\Api). Api::findOwner($model) returns the
    ModelOwnerInterface plugin that owns a config entity.
  bundle: modeler_api
  rubric_ref: rubric/modeler_api_modeler_api_service@1.0
  tags:
  - mode:recipe
- id: modeler-api-component-types
  input: Modeler API translates between owners and modelers using a fixed set of generic component types.
    Name them and where the constants live.
  criteria: 'Seven types as Api::COMPONENT_TYPE_* constants (ints 1-7): start, subprocess, swimlane, element,
    link, gateway, annotation. They live on Drupal\modeler_api\Api (COMPONENT_TYPE_NAMES maps them to
    YAML keys).'
  bundle: modeler_api
  rubric_ref: rubric/modeler_api_modeler_api_component_types@1.0
  tags:
  - mode:recipe
- id: modeler-api-storage-modes
  input: Where is Modeler API configured and what are the three ways raw modeler diagram data can be stored?
  criteria: 'Configured at /admin/config/workflow/modeler_api (route modeler_api.settings). Raw data storage
    per owner/modeler: as third-party settings on the config entity, in a separate config entity, or not
    stored at all.'
  bundle: modeler_api
  rubric_ref: rubric/modeler_api_modeler_api_storage_modes@1.0
  tags:
  - mode:recipe
- id: modeler-api-yaml-plugins
  input: Besides Modeler and ModelOwner, which three YAML-defined plugin types does Modeler API provide,
    and what YAML file names discover them?
  criteria: Context (MODULE.modeler_api.contexts.yml), Dependency (MODULE.modeler_api.dependencies.yml),
    and Template Token (MODULE.modeler_api.template_tokens.yml) — all YAML, no PHP.
  bundle: modeler_api
  rubric_ref: rubric/modeler_api_modeler_api_yaml_plugins@1.0
  tags:
  - mode:recipe
- id: modeler-api-recipe-export
  input: How do I export a Modeler API model as a Drupal recipe from the command line, and which owner/model
    does it take?
  criteria: drush modeler_api:model:export <owner_id> <id> exports the model as a recipe; --namespace
    and --destination options customize it. The Api/ExportRecipe service backs it.
  bundle: modeler_api
  rubric_ref: rubric/modeler_api_modeler_api_recipe_export@1.0
  tags:
  - mode:recipe
