metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: modal_page
  version: 5.1.x
  note: 'modal_page lets you create configurable modal/pop-up dialogs. Each modal is a ''modal'' config
    entity (config_prefix ''modal'' => config modal_page.modal.<id>), managed at /admin/structure/modal
    (entity.modal.collection); global behavior lives in the modal_page.settings config object (form route
    modal_page.settings = the configure route, at /admin/config/user-interface/modal-page/settings). One
    permission: ''administer modal page''. Drush: modal_page:cron (alias modal-page-cron) runs ModalPageScheduler.
    Hooks: hook_modal_alter / hook_modal_ID_alter / hook_modal_submit. Medium cases create a modal / set
    a known settings value and the agent reads the live config back; hard cases create a modal / configure
    modal_page.settings, verified against live config. Settings cleanups restore shipped defaults explicitly
    (State is unreliable on this site). Grounded in src/Entity/Modal.php, modal_page.routing.yml, modal_page.permissions.yml,
    src/Drush/Commands/ModalPageCommands.php, config/install/modal_page.settings.yml.'
questions:
- id: modal_page-create-where
  input: I installed the Drupal 'Modal' (modal_page) module. Where do I go to create a new modal/pop-up,
    and what kind of Drupal object is each modal?
  criteria: Go to Structure > Modal (/admin/structure/modal, route entity.modal.collection) and click
    Add Modal. Each modal is a 'modal' config entity, stored as config modal_page.modal.<id>.
  bundle: modal_page
  rubric_ref: rubric/modal_page_modal_page_create_where@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: modal_page-permission-settings
  input: Which permission controls administering the modal_page module, and what is the route/path of
    its global settings form?
  criteria: The permission is 'administer modal page' (restrict access), which gates all admin routes.
    The global settings form is route modal_page.settings at /admin/config/user-interface/modal-page/settings
    (also the module's 'configure' route).
  bundle: modal_page
  rubric_ref: rubric/modal_page_modal_page_permission_settings@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: modal_page-drush-hooks
  input: Does modal_page provide a Drush command (e.g. for scheduling) and any hooks I can implement to
    alter modals or react to a modal submit?
  criteria: 'Drush command: modal_page:cron (alias modal-page-cron) runs the scheduler (ModalPageScheduler)
    to publish/unpublish scheduled modals. Hooks: hook_modal_alter(&$modal, $modal_id), hook_modal_ID_alter(&$modal,
    $modal_id) and hook_modal_submit($modal, $modal_state, $modal_id).'
  bundle: modal_page
  rubric_ref: rubric/modal_page_modal_page_drush_hooks@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: modal_page-inspect-pages
  input: This Drupal site has a modal (modal_page) with machine id 'mp_known'. Inspect the live modal
    configuration and tell me which pages/paths it is set to appear on.
  criteria: 'It shows on /node/* — modal_page.modal.mp_known has pages: ''/node/*'' (type: page, size
    modal-lg).'
  bundle: modal_page
  rubric_ref: rubric/modal_page_modal_page_inspect_pages@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/modal_page-known-modal-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/modal_page-known-modal-cleanup.sh
- id: modal_page-inspect-settings
  input: On this site the modal_page global settings have been customized. Inspect the live modal_page.settings
    configuration and tell me the configured default cookie expiration value.
  criteria: default_cookie_expiration is 7777 — modal_page.settings.default_cookie_expiration = 7777 (bootstrap_version
    was also set to 5x).
  bundle: modal_page
  rubric_ref: rubric/modal_page_modal_page_inspect_settings@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/modal_page-settings-value-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/modal_page-settings-value-cleanup.sh
- id: modal_page-create-modal
  input: Using the modal_page module, create a modal with machine id 'mp_task' and title 'Welcome' that
    appears on the front page (pages = <front>) and opens automatically. Apply it to the live site.
  criteria: A modal config entity modal_page.modal.mp_task exists with pages containing <front> and auto_open
    enabled (truthy).
  bundle: modal_page
  rubric_ref: rubric/modal_page_modal_page_create_modal@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/modal_page-create-modal-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/modal_page-create-modal-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/modal_page-create-modal-verify.sh
- id: modal_page-configure-settings
  input: 'Configure the modal_page global settings on this live site: set the Bootstrap version to 5x
    and the default cookie expiration to 3600. Apply the change.'
  criteria: modal_page.settings has bootstrap_version = '5x' and default_cookie_expiration = 3600.
  bundle: modal_page
  rubric_ref: rubric/modal_page_modal_page_configure_settings@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/modal_page-configure-settings-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/modal_page-configure-settings-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/modal_page-configure-settings-verify.sh
