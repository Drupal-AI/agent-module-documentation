rubrics:
- id: modal_page_modal_page_create_where
  version: '1.0'
  applicable_bundles:
  - modal_page
  checks:
  - kind: must_contain_any
    values:
    - /admin/structure/modal
    - Add Modal
    - config entity
    - modal_page.modal
    - Structure
  scoring:
    combine: all_pass
- id: modal_page_modal_page_permission_settings
  version: '1.0'
  applicable_bundles:
  - modal_page
  checks:
  - kind: must_contain_any
    values:
    - administer modal page
    - modal_page.settings
    - /admin/config/user-interface/modal-page/settings
  scoring:
    combine: all_pass
- id: modal_page_modal_page_drush_hooks
  version: '1.0'
  applicable_bundles:
  - modal_page
  checks:
  - kind: must_contain_any
    values:
    - modal_page:cron
    - modal-page-cron
    - hook_modal_alter
    - hook_modal_submit
    - hook_modal_ID_alter
  scoring:
    combine: all_pass
- id: modal_page_modal_page_inspect_pages
  version: '1.0'
  applicable_bundles:
  - modal_page
  checks:
  - kind: must_contain_any
    values:
    - /node/*
  scoring:
    combine: all_pass
- id: modal_page_modal_page_inspect_settings
  version: '1.0'
  applicable_bundles:
  - modal_page
  checks:
  - kind: must_contain_any
    values:
    - '7777'
  scoring:
    combine: all_pass
- id: modal_page_modal_page_create_modal
  version: '1.0'
  applicable_bundles:
  - modal_page
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
- id: modal_page_modal_page_configure_settings
  version: '1.0'
  applicable_bundles:
  - modal_page
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
