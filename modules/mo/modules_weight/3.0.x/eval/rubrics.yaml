rubrics:
- id: modules_weight_modules_weight_drush
  version: '1.0'
  applicable_bundles:
  - modules_weight
  checks:
  - kind: must_contain_any
    values:
    - mw-reorder
    - mw-list
    - mw-r
    - mw-l
  scoring:
    combine: all_pass
- id: modules_weight_modules_weight_storage
  version: '1.0'
  applicable_bundles:
  - modules_weight
  checks:
  - kind: must_contain_any
    values:
    - core.extension
    - module_set_weight
  scoring:
    combine: all_pass
- id: modules_weight_modules_weight_setting
  version: '1.0'
  applicable_bundles:
  - modules_weight
  checks:
  - kind: must_contain_any
    values:
    - show_system_modules
    - modules_weight.settings
    - Core
  scoring:
    combine: all_pass
- id: modules_weight_modules_weight_known_weight
  version: '1.0'
  applicable_bundles:
  - modules_weight
  checks:
  - kind: must_contain_any
    values:
    - '7'
  scoring:
    combine: all_pass
- id: modules_weight_modules_weight_known_showsys
  version: '1.0'
  applicable_bundles:
  - modules_weight
  checks:
  - kind: must_contain_any
    values:
    - 'true'
    - 'TRUE'
    - 'yes'
    - enabled
    - shown
  scoring:
    combine: all_pass
- id: modules_weight_modules_weight_reweight
  version: '1.0'
  applicable_bundles:
  - modules_weight
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
- id: modules_weight_modules_weight_enable_showsys
  version: '1.0'
  applicable_bundles:
  - modules_weight
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
