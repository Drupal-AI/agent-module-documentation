metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: modules_weight
  version: 3.0.x
  note: 'Modules Weight is a UI + Drush front end over core module_set_weight(); module weights live in
    core.extension -> module.<name> (lower runs earlier). Config modules_weight.settings has one key show_system_modules
    (bool, default FALSE) deciding whether Core modules are shown/reorderable. Routes: modules_weight.list_page
    (reorder form) and modules_weight.modules_weight_admin_settings (configure). Permission: administer
    modules weight. Drush: mw-list (mw-l), mw-reorder (mw-r), mw-show-system-modules (mw-ssm). Service
    modules_weight (getModulesList). Medium/hard cases are grounded in real state: the modules_weight
    module''s own weight in core.extension and the show_system_modules config value.'
questions:
- id: modules_weight-drush
  input: Which Drush command from the modules_weight module sets a module's weight (execution order),
    and which lists all modules with their weights?
  criteria: drush mw-reorder <module> <weight> sets a module's weight (alias mw-r); drush mw-list prints
    the modules-and-weights table (alias mw-l). mw-show-system-modules (mw-ssm) toggles whether Core modules
    are shown.
  bundle: modules_weight
  rubric_ref: rubric/modules_weight_modules_weight_drush@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: modules_weight-storage
  input: When you change a module's weight with the modules_weight module, where is that weight actually
    stored in Drupal, and which core function applies it?
  criteria: Weights are stored in the core.extension config object under module.<machine_name> (lower
    runs earlier), applied via core's module_set_weight(). Modules Weight is just a UI/Drush front end
    over it.
  bundle: modules_weight
  rubric_ref: rubric/modules_weight_modules_weight_storage@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: modules_weight-setting
  input: In the modules_weight module, what does the show_system_modules setting control and what config
    object holds it?
  criteria: show_system_modules (in config modules_weight.settings, default FALSE) controls whether Drupal
    Core modules appear in the reorder list and can be reordered.
  bundle: modules_weight
  rubric_ref: rubric/modules_weight_modules_weight_setting@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: modules_weight-known-weight
  input: On this Drupal site, inspect the module execution order and give the current weight of the 'modules_weight'
