metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: monolog
  version: 3.0.x
  note: 'Monolog has no UI and no config entities: it overrides logger.factory and is configured entirely
    via a services YAML file (channel_handlers, handlers, formatters, processors). Cases are `recipe`
    (response-graded) probing documented facts an agent would otherwise read source to answer; no site
    mutation.'
questions:
- id: monolog-replaces-logger-factory
  input: How does the Monolog module hook into Drupal's logging system, and where do I configure it given
    it has no admin UI?
  criteria: MonologServiceProvider overrides the core logger.factory service with MonologLoggerChannelFactory;
    there is no UI, so configuration is done in a services YAML file (e.g. sites/default/monolog.services.yml
    registered via $settings['container_yamls']).
  bundle: monolog
  rubric_ref: rubric/monolog_monolog_replaces_logger_factory@1.0
  tags:
  - mode:recipe
- id: monolog-rotating-file-handler
  input: On a Drupal 11 site with the Monolog module, show the services.yml to send every log message
    to a daily rotating file in the private filesystem.
  criteria: Set monolog.channel_handlers default to a handler name, and define a monolog.handler.<name>
    service with class Monolog\Handler\RotatingFileHandler and arguments like ['private://logs/debug.log',
    10, 'DEBUG'].
  bundle: monolog
  rubric_ref: rubric/monolog_monolog_rotating_file_handler@1.0
  tags:
  - mode:recipe
- id: monolog-channel-mapping
  input: In the Monolog module, which parameter maps a specific log channel (like php) to a set of handlers,
    and what key is the required fallback?
  criteria: The monolog.channel_handlers parameter maps each channel to one or more handler names; the
    `default` key is the required fallback mapping.
  bundle: monolog
  rubric_ref: rubric/monolog_monolog_channel_mapping@1.0
  tags:
  - mode:recipe
- id: monolog-library-dependency
  input: What external PHP library does the Drupal Monolog module require, and what happens at install
    if it is missing?
  criteria: It requires the monolog/monolog library (^3.2) via Composer; monolog_requirements() fails
    install with an error if the \Monolog\Logger class is not found.
  bundle: monolog
  rubric_ref: rubric/monolog_monolog_library_dependency@1.0
  tags:
  - mode:recipe
- id: monolog-log-to-dblog
  input: With the Monolog module installed, how do I keep writing log messages to Drupal's Watchdog (dblog)
    database table?
  criteria: Monolog auto-registers a DrupalHandler wrapper for every logger-tagged service; add the `drupal.dblog`
    handler to monolog.channel_handlers (typically without the message_placeholder processor) to log to
    the Watchdog table.
  bundle: monolog
  rubric_ref: rubric/monolog_monolog_log_to_dblog@1.0
  tags:
  - mode:recipe
- id: monolog-per-handler-formatter-processors
  input: Using the Monolog module, how do I send one channel to two handlers where each handler uses a
    different formatter and processor set?
  criteria: 'Use the nested syntax under monolog.channel_handlers: a `handlers` list where each entry
    has `name`, `formatter`, and `processors`, so each handler gets its own formatter (e.g. json vs line)
    and processor list.'
  bundle: monolog
  rubric_ref: rubric/monolog_monolog_per_handler_formatter_processors@1.0
  tags:
  - mode:recipe
- id: monolog-processors-list
  input: Name some processors the Drupal Monolog module provides to enrich log records, and how do I enable
    them globally?
  criteria: Provided processors include message_placeholder, current_user, request_uri, ip, referer, filter_backtrace,
    introspection; set them in the monolog.processors parameter (or per-handler / monolog.logger.processors).
  bundle: monolog
  rubric_ref: rubric/monolog_monolog_processors_list@1.0
  tags:
  - mode:recipe
- id: monolog-conditional-cli
  input: With the Monolog module, how can I use one handler/formatter for web requests and another for
    CLI/Drush runs?
  criteria: Use ConditionalHandler or ConditionalFormatter with two targets and the monolog.condition_resolver.cli
    resolver (true under CLI), e.g. the provided drush_or_json formatter, to switch behavior between web
    and CLI/Drush.
  bundle: monolog
  rubric_ref: rubric/monolog_monolog_conditional_cli@1.0
  tags:
  - mode:recipe
