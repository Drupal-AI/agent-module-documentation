metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: moderation_sidebar
  version: 1.8.x
  note: Moderation Sidebar adds a toolbar tab + off-canvas Content Moderation UI with quick transition
    buttons. Cases are `recipe` (response-graded) probing documented facts an agent would otherwise read
    source to answer; no site mutation.
questions:
- id: moderation-sidebar-what-and-how
  input: On a Drupal 11 site with Content Moderation, how does an editor open the quick moderation actions
    for a page they are viewing, and what UI does Moderation Sidebar use to show them?
  criteria: Click the 'Tasks' tab that Moderation Sidebar adds to the toolbar; it AJAX-loads an off-canvas
    sidebar (core off_canvas dialog) with moderation actions for the current entity.
  bundle: moderation_sidebar
  rubric_ref: rubric/moderation_sidebar_moderation_sidebar_what_and_how@1.0
  tags:
  - mode:recipe
- id: moderation-sidebar-dependency
  input: What core Drupal module does the Moderation Sidebar module depend on?
  criteria: It depends on core content_moderation (declared in moderation_sidebar.info.yml).
  bundle: moderation_sidebar
  rubric_ref: rubric/moderation_sidebar_moderation_sidebar_dependency@1.0
  tags:
  - mode:recipe
- id: moderation-sidebar-permission
  input: Which permission must a user have to see and use the Moderation Sidebar, and which separate permission
    gates its settings form?
  criteria: '''use moderation sidebar'' unlocks the toolbar tab and sidebar routes; ''administer moderation
    sidebar'' gates the settings form (moderation_sidebar.settings).'
  bundle: moderation_sidebar
  rubric_ref: rubric/moderation_sidebar_moderation_sidebar_permission@1.0
  tags:
  - mode:recipe
- id: moderation-sidebar-quick-transitions
  input: How does the Moderation Sidebar decide which quick state-transition buttons to show, and what
    does clicking one do to the entity?
  criteria: QuickTransitionForm shows only transitions valid for the current user (via content_moderation.state_transition_validation),
    excluding self-transitions and any disabled in settings; clicking one saves a new revision with a
    revision log message.
  bundle: moderation_sidebar
  rubric_ref: rubric/moderation_sidebar_moderation_sidebar_quick_transitions@1.0
  tags:
  - mode:recipe
- id: moderation-sidebar-disable-transition
  input: How can an administrator stop a particular workflow transition from appearing as a button in
    the Moderation Sidebar?
  criteria: On the settings form (route moderation_sidebar.settings, /admin/config/user-interface/moderation-sidebar)
    check the transition; it is stored under workflows.{workflow}_workflow.disabled_transitions in moderation_sidebar.settings
    and hidden.
  bundle: moderation_sidebar
  rubric_ref: rubric/moderation_sidebar_moderation_sidebar_disable_transition@1.0
  tags:
  - mode:recipe
- id: moderation-sidebar-view-latest-live
  input: In the Moderation Sidebar, what buttons let an editor move between a published page's live version
    and its pending draft?
  criteria: '''View existing draft'' appears on the published default revision when a pending draft exists;
    ''View live content'' appears when viewing a pending non-default revision.'
  bundle: moderation_sidebar
  rubric_ref: rubric/moderation_sidebar_moderation_sidebar_view_latest_live@1.0
  tags:
  - mode:recipe
- id: moderation-sidebar-alter
  input: Which hook do I implement in a custom Drupal module to add a custom button or markup to the Moderation
    Sidebar's off-canvas build?
  criteria: Implement hook_moderation_sidebar_alter(array &$build, EntityInterface $entity) to modify
    the sidebar render array.
  bundle: moderation_sidebar
  rubric_ref: rubric/moderation_sidebar_moderation_sidebar_alter@1.0
  tags:
  - mode:recipe
