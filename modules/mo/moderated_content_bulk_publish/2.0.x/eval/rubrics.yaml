rubrics:
- id: moderated_content_bulk_publish_mcbp_bulk_actions
  version: '1.0'
  applicable_bundles:
  - moderated_content_bulk_publish
  checks:
  - kind: must_contain_any
    values:
    - moderated_content_bulk_publish
    - Publish latest revision
    - Archive current revision
  scoring:
    combine: all_pass
- id: moderated_content_bulk_publish_mcbp_enable_on_view
  version: '1.0'
  applicable_bundles:
  - moderated_content_bulk_publish
  checks:
  - kind: must_contain_any
    values:
    - Node operations bulk
    - views
    - content view
  scoring:
    combine: all_pass
- id: moderated_content_bulk_publish_mcbp_permissions
  version: '1.0'
  applicable_bundles:
  - moderated_content_bulk_publish
  checks:
  - kind: must_contain_any
    values:
    - moderated content bulk publish
    - moderated content bulk unpublish
  scoring:
    combine: all_pass
- id: moderated_content_bulk_publish_mcbp_settings_route
  version: '1.0'
  applicable_bundles:
  - moderated_content_bulk_publish
  checks:
  - kind: must_contain_any
    values:
    - /admin/config/content/moderated-content-bulk-publish
    - moderated_content_bulk_publish.settings
  scoring:
    combine: all_pass
- id: moderated_content_bulk_publish_mcbp_confirm_dialog
  version: '1.0'
  applicable_bundles:
  - moderated_content_bulk_publish
  checks:
  - kind: must_contain_any
    values:
    - enable_dialog_admin_content
  scoring:
    combine: all_pass
- id: moderated_content_bulk_publish_mcbp_translation_aware
  version: '1.0'
  applicable_bundles:
  - moderated_content_bulk_publish
  checks:
  - kind: must_contain_any
    values:
    - translation
    - each translation
    - all translations
    - getTranslation
  scoring:
    combine: all_pass
- id: moderated_content_bulk_publish_mcbp_verify_hook
  version: '1.0'
  applicable_bundles:
  - moderated_content_bulk_publish
  checks:
  - kind: must_contain_any
    values:
    - hook_moderated_content_bulk_publish_verify_publish
    - moderated_content_bulk_publish_verify_publish
  scoring:
    combine: all_pass
- id: moderated_content_bulk_publish_mcbp_dependencies
  version: '1.0'
  applicable_bundles:
  - moderated_content_bulk_publish
  checks:
  - kind: must_contain_any
    values:
    - content_moderation
    - views_bulk_operations
    - workflows
    - pathauto
  scoring:
    combine: all_pass
