metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: moderated_content_bulk_publish
  version: 2.0.x
  note: Module ships bulk moderation Action plugins, optional system.action config, a small settings object,
    five permissions, and verify hooks. Cases are `recipe` (response-graded) probing documented facts
    an agent would otherwise read source to answer; no site mutation.
questions:
- id: mcbp-bulk-actions
  input: On a Drupal 11 site using Content Moderation, I want to bulk-publish the latest revision and
    bulk-archive nodes from /admin/content. Which module provides these bulk operations and what are they
    called?
  criteria: 'Moderated Content Bulk Publish provides bulk actions: Publish latest revision, Unpublish
    current revision, Archive current revision, Pin Content, Unpin content.'
  bundle: moderated_content_bulk_publish
  rubric_ref: rubric/moderated_content_bulk_publish_mcbp_bulk_actions@1.0
  tags:
  - mode:recipe
- id: mcbp-enable-on-view
  input: How do I make the Moderated Content Bulk Publish operations appear on the /admin/content listing?
  criteria: Edit the content view, add the 'Node operations bulk' field, and enable the operations (Pin/Unpin,
    Publish latest revision, Unpublish current revision, Archive current revision).
  bundle: moderated_content_bulk_publish
  rubric_ref: rubric/moderated_content_bulk_publish_mcbp_enable_on_view@1.0
  tags:
  - mode:recipe
- id: mcbp-permissions
  input: What permission gates the bulk publish action in the moderated_content_bulk_publish module, and
    is there a separate one for unpublish?
  criteria: 'Each action has its own permission: ''moderated content bulk publish'', ''moderated content
    bulk unpublish'', ''moderated content bulk archive'', ''moderated content bulk pin content'', ''moderated
    content bulk unpin content''.'
  bundle: moderated_content_bulk_publish
  rubric_ref: rubric/moderated_content_bulk_publish_mcbp_permissions@1.0
  tags:
  - mode:recipe
- id: mcbp-settings-route
  input: Where is the settings form for Moderated Content Bulk Publish and what config object stores its
    settings?
  criteria: Settings form at /admin/config/content/moderated-content-bulk-publish (route moderated_content_bulk_publish.settings.form);
    settings live in the moderated_content_bulk_publish.settings config object.
  bundle: moderated_content_bulk_publish
  rubric_ref: rubric/moderated_content_bulk_publish_mcbp_settings_route@1.0
  tags:
  - mode:recipe
- id: mcbp-confirm-dialog
  input: Which setting controls the JavaScript confirmation dialog before bulk operations run on the admin
    content listing in moderated_content_bulk_publish, and what is its default?
  criteria: The enable_dialog_admin_content key on moderated_content_bulk_publish.settings (default true)
    toggles the confirmation dialog on the admin listing.
  bundle: moderated_content_bulk_publish
  rubric_ref: rubric/moderated_content_bulk_publish_mcbp_confirm_dialog@1.0
  tags:
  - mode:recipe
- id: mcbp-translation-aware
  input: On a multilingual Drupal site, does the Moderated Content Bulk Publish publish action affect
    all translations of a node or just one?
  criteria: 'It is translation-aware: the AdminModeration helper iterates every translation (hasTranslation/getTranslation)
    and applies the moderation state per language.'
  bundle: moderated_content_bulk_publish
  rubric_ref: rubric/moderated_content_bulk_publish_mcbp_translation_aware@1.0
  tags:
  - mode:recipe
- id: mcbp-verify-hook
  input: In a custom module I want to veto a bulk publish from moderated_content_bulk_publish. Which hook
    do I implement?
  criteria: Implement hook_moderated_content_bulk_publish_verify_publish($hookObject) (also _verify_unpublish
    / _verify_archived) and set error_message / validate_failure on the HookObject to stop the transition.
  bundle: moderated_content_bulk_publish
  rubric_ref: rubric/moderated_content_bulk_publish_mcbp_verify_hook@1.0
  tags:
  - mode:recipe
- id: mcbp-dependencies
  input: What are the module dependencies of moderated_content_bulk_publish?
  criteria: Depends on content_moderation, workflows, pathauto, and views_bulk_operations.
  bundle: moderated_content_bulk_publish
  rubric_ref: rubric/moderated_content_bulk_publish_mcbp_dependencies@1.0
  tags:
  - mode:recipe
