metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: mobile_detect
  version: 4.0.x
  note: 'Mobile Detect wraps mobiledetect/mobiledetectlib as the ''mobile_detect'' service, plus Twig
    functions (is_mobile/is_tablet/is_ios/is_android_os/is_device), three cache contexts, is-mobile/is-tablet
    body classes, two block-visibility Condition plugins (mobile_detect_device_type devices=[phone,tablet,desktop];
    mobile_detect_platform platform=[android,ios]), a status block (mobile_detect_status_block), and a
    settings form (config mobile_detect.settings key mobile_detect_is_mobile bool). No external services.
    Medium/hard cases are grounded in live config verifiable via drush php:eval. NOTE: the boolean key
    must be set through the config API (getEditable()->set(..., TRUE/FALSE)); `drush config:set ... false`
    mis-casts and stores TRUE, so the scripts use php:eval.'
questions:
- id: mobile_detect-twig-functions
  input: Using the mobile_detect module, which Twig functions can I call inside a template to branch on
    the visitor's device? List them.
  criteria: The module's Twig extension provides is_mobile(), is_tablet(), is_device('Name'), is_ios()
    and is_android_os().
  bundle: mobile_detect
  rubric_ref: rubric/mobile_detect_mobile_detect_twig_functions@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: mobile_detect-service
  input: In the mobile_detect module, what service can I call from PHP to detect the device, and what
    underlying library does it wrap?
  criteria: Call \Drupal::service('mobile_detect'), which is the Detection\MobileDetect object from the
    mobiledetect/mobiledetectlib library (e.g. ->isMobile(), ->isTablet()).
  bundle: mobile_detect
  rubric_ref: rubric/mobile_detect_mobile_detect_service@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: mobile_detect-conditions
  input: I want to show a block only on phones (or only on iOS) with the mobile_detect module. Which block-visibility
    condition plugins does it provide?
  criteria: 'It provides two Condition plugins usable in a block''s Visibility settings: mobile_detect_device_type
    (options phone/tablet/desktop) and mobile_detect_platform (options android/ios).'
  bundle: mobile_detect
  rubric_ref: rubric/mobile_detect_mobile_detect_conditions@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: mobile_detect-known-setting
  input: On this site, inspect the mobile_detect module's configuration and tell me whether the experimental
    global 'is mobile' page cache context (mobile_detect_is_mobile) is currently turned on or off.
  criteria: 'It is ON: config object mobile_detect.settings has mobile_detect_is_mobile = true.'
  bundle: mobile_detect
  rubric_ref: rubric/mobile_detect_mobile_detect_known_setting@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/mobile_detect-ismobile-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/mobile_detect-ismobile-cleanup.sh
- id: mobile_detect-known-block
  input: A 'Mobile Detect Status' block has been placed on this site with a device-platform visibility
    restriction. Inspect the live block configuration and tell me which platform the block is limited
    to.
  criteria: The block (id mdeval_known, plugin mobile_detect_status_block) has a mobile_detect_platform
    visibility condition restricting it to the ios platform.
  bundle: mobile_detect
  rubric_ref: rubric/mobile_detect_mobile_detect_known_block@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/mobile_detect-block-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/mobile_detect-block-cleanup.sh
- id: mobile_detect-enable-cache-context
  input: Turn on the mobile_detect module's experimental global page cache context by setting mobile_detect_is_mobile
    to TRUE in its configuration, and apply it to the live site.
  criteria: 'Set boolean TRUE for mobile_detect_is_mobile in config mobile_detect.settings, e.g. \Drupal::configFactory()->getEditable(''mobile_detect.settings'')->set(''mobile_detect_is_mobile'',
    TRUE)->save(); (note: `drush config:set ... true` mis-casts a boolean, so use the config API or the
    settings form).'
  bundle: mobile_detect
  rubric_ref: rubric/mobile_detect_mobile_detect_enable_cache_context@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/mobile_detect-toggle-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/mobile_detect-toggle-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/mobile_detect-toggle-verify.sh
- id: mobile_detect-place-phone-block
  input: Place the mobile_detect module's 'Mobile Detect Status' block (plugin mobile_detect_status_block)
    in a region of the default theme, and restrict its visibility so it only shows on phones (device type
    = phone). Apply the change to the live site.
  criteria: Create a block config entity with plugin mobile_detect_status_block in the default theme,
    with visibility condition mobile_detect_device_type devices including 'phone' (e.g. Block::create([...
    'plugin' => 'mobile_detect_status_block', 'visibility' => ['mobile_detect_device_type' => ['id' =>
    'mobile_detect_device_type', 'devices' => ['phone' => 'phone'], 'negate' => false]]])->save()).
  bundle: mobile_detect
  rubric_ref: rubric/mobile_detect_mobile_detect_place_phone_block@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/mobile_detect-place-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/mobile_detect-place-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/mobile_detect-place-verify.sh
