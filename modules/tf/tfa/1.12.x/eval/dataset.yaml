metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: tfa
  version: 1.12.x
  note: 'TFA is a base module: a login interrupt plus four plugin types (validation/setup/login/send),
    shipped TOTP/HOTP/recovery-code plugins, and a required Encrypt+Key encryption profile. Cases are
    `recipe` (response-graded) probing documented facts an agent would otherwise read source to answer;
    no site mutation.'
questions:
- id: tfa-second-login-step
  input: On a Drupal 11 site I want users to enter a code from an authenticator app after their password.
    Which module adds this second login step, and what does it do to the normal login flow?
  criteria: 'The TFA module: it interrupts a successful username/password authentication and requires
    a code from an active validation plugin (e.g. TOTP) before completing login.'
  bundle: tfa
  rubric_ref: rubric/tfa_tfa_second_login_step@1.0
  tags:
  - mode:recipe
- id: tfa-validation-setup-plugin-types
  input: In the Drupal TFA module, which plugin type validates a submitted second-factor code during login,
    and which plugin type handles per-user enrollment for a method? Name their interfaces.
  criteria: TfaValidation (TfaValidationInterface) validates the code at login; TfaSetup (TfaSetupInterface)
    handles per-user enrollment. TFA also defines TfaLogin and TfaSend types.
  bundle: tfa
  rubric_ref: rubric/tfa_tfa_validation_setup_plugin_types@1.0
  tags:
  - mode:recipe
- id: tfa-shipped-totp-recovery
  input: Which validation plugin IDs ship with the Drupal TFA module for a TOTP authenticator app and
    for one-time recovery codes?
  criteria: tfa_totp (TOTP authenticator app) and tfa_recovery_code (recovery codes); tfa_hotp is also
    shipped.
  bundle: tfa
  rubric_ref: rubric/tfa_tfa_shipped_totp_recovery@1.0
  tags:
  - mode:recipe
- id: tfa-encryption-profile-required
  input: I enabled the Drupal TFA module but it won't let me turn on TFA. What dependency and configuration
    does TFA require to store secrets, and which modules provide it?
  criteria: TFA requires the Encrypt module and a selected encryption profile (built on the Key module
    + an encryption method); the settings form blocks enabling TFA until an encryption profile exists,
    referenced by the `encryption` setting on tfa.settings.
  bundle: tfa
  rubric_ref: rubric/tfa_tfa_encryption_profile_required@1.0
  tags:
  - mode:recipe
- id: tfa-require-per-role
  input: How do I require two-factor authentication only for the editor role on a Drupal site using the
    TFA module? Which setting controls this?
  criteria: Set the role in the `required_roles` setting on the tfa.settings config (via the settings
    form at /admin/config/people/tfa); it is a config setting, not a permission.
  bundle: tfa
  rubric_ref: rubric/tfa_tfa_require_per_role@1.0
  tags:
  - mode:recipe
- id: tfa-custom-validation-plugin
  input: I want to add a custom second-factor method (e.g. SMS) to the Drupal TFA module. Which annotation
    and interface does the validation plugin use, and how do I let users enroll?
  criteria: Create a plugin in Plugin/TfaValidation with the @TfaValidation annotation implementing TfaValidationInterface
    (getForm, validateForm, ready), point its setupPluginId at a matching @TfaSetup plugin so users can
    enroll, then add the plugin id to allowed_validation_plugins.
  bundle: tfa
  rubric_ref: rubric/tfa_tfa_custom_validation_plugin@1.0
  tags:
  - mode:recipe
- id: tfa-user-setup-flow
  input: Where does a user set up their TFA (scan the QR code, save recovery codes) on a Drupal site,
    and which permission do they need?
  criteria: On their account security tab at /user/{uid}/security/tfa (routes tfa.overview / tfa.validation.setup),
    which requires the 'setup own tfa' permission.
  bundle: tfa
  rubric_ref: rubric/tfa_tfa_user_setup_flow@1.0
  tags:
  - mode:recipe
- id: tfa-settings-route
  input: What is the admin configuration route and path for the Drupal TFA settings form, and which permission
    gates it?
  criteria: Route tfa.settings at /admin/config/people/tfa, gated by the 'admin tfa settings' permission.
  bundle: tfa
  rubric_ref: rubric/tfa_tfa_settings_route@1.0
  tags:
  - mode:recipe
