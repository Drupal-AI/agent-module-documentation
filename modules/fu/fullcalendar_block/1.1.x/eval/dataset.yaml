metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: fullcalendar_block
  version: 1.1.x
  note: FullCalendar Block provides one block plugin, fullcalendar_block (schema block.settings.fullcalendar_block),
    placed via Block layout; per-instance settings live in the block.block.<id> config entity. Required
    setting event_source (JSON feed URL); initial_view defaults to dayGridMonth; plugins enables moment/rrule;
    advanced/advanced_drupal are YAML/JSON. No configure route, no permissions, no Drush. Medium cases
    place a known fullcalendar_block instance (default theme, content region) and the agent must find
    it and read its event_source / initial_view; hard cases require the agent to place a FullCalendar
    block with a given event source (and rrule plugin), verified by scanning live block config for a fullcalendar_block
    instance with that event_source. reset/cleanup delete the namespaced blocks (fixed ids for medium;
    any fullcalendar_block instance carrying the namespaced feed URL for hard).
questions:
- id: fullcalendar-block-basics
  input: I installed the FullCalendar Block module on Drupal 11. What does it add, and what is the one
    required piece of information I must provide to make a calendar show events?
  criteria: 'It adds a block plugin ''FullCalendar block'' (id fullcalendar_block) you place via Block
    layout. The required setting is the Event source URL (event_source): a JSON event feed, e.g. a View
    REST export or a controller.'
  bundle: fullcalendar_block
  rubric_ref: rubric/fullcalendar_block_fullcalendar_block_basics@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: fullcalendar-block-keys
  input: For a FullCalendar Block instance, which setting key stores the JSON feed URL, and what is the
    default calendar view if I do not change it?
  criteria: event_source holds the feed URL; initial_view defaults to dayGridMonth (month grid).
  bundle: fullcalendar_block
  rubric_ref: rubric/fullcalendar_block_fullcalendar_block_keys@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: fullcalendar-block-plugins
  input: How do I enable recurring events (RRULE) or the Moment plugin on a FullCalendar Block, and where
    do arbitrary FullCalendar options go?
  criteria: Tick the FullCalendar plugins (moment / rrule) under Advanced settings, stored in the block's
    'plugins' setting. Arbitrary FullCalendar options go in the 'advanced' YAML/JSON field (and Drupal
    dialog behaviour in 'advanced_drupal').
  bundle: fullcalendar_block
  rubric_ref: rubric/fullcalendar_block_fullcalendar_block_plugins@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: fullcalendar-block-known-source
  input: A FullCalendar Block has been placed on this Drupal site. Inspect the live block configuration
    and state the event source URL (the JSON feed) it is configured to read.
  criteria: The placed fullcalendar_block instance has settings.event_source = /fcb-known-feed (block.block.fcb_known).
