  criteria: The placed fullcalendar_block instance has settings.initial_view = timeGridWeek (block.block.fcb_view).
  bundle: fullcalendar_block
  rubric_ref: rubric/fullcalendar_block_fullcalendar_block_known_view@1.0
  tags:
