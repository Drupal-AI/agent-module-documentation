rubrics:
- id: fullcalendar_block_fullcalendar_block_basics
  version: '1.0'
  applicable_bundles:
  - fullcalendar_block
  checks:
  - kind: must_contain_any
    values:
    - fullcalendar_block
    - event source
    - event_source
    - FullCalendar block
  scoring:
    combine: all_pass
- id: fullcalendar_block_fullcalendar_block_keys
  version: '1.0'
  applicable_bundles:
  - fullcalendar_block
  checks:
  - kind: must_contain_any
    values:
    - event_source
    - dayGridMonth
    - initial_view
  scoring:
    combine: all_pass
- id: fullcalendar_block_fullcalendar_block_plugins
  version: '1.0'
  applicable_bundles:
  - fullcalendar_block
  checks:
  - kind: must_contain_any
    values:
    - plugins
    - rrule
    - moment
    - advanced
  scoring:
    combine: all_pass
- id: fullcalendar_block_fullcalendar_block_known_source
  version: '1.0'
  applicable_bundles:
  - fullcalendar_block
  checks:
  - kind: must_contain_any
    values:
    - /fcb-known-feed
  scoring:
    combine: all_pass
- id: fullcalendar_block_fullcalendar_block_known_view
  version: '1.0'
  applicable_bundles:
  - fullcalendar_block
  checks:
  - kind: must_contain_any
    values:
    - timeGridWeek
  scoring:
    combine: all_pass
- id: fullcalendar_block_fullcalendar_block_place
  version: '1.0'
  applicable_bundles:
  - fullcalendar_block
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
- id: fullcalendar_block_fullcalendar_block_place_rrule
  version: '1.0'
  applicable_bundles:
  - fullcalendar_block
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
