metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: fullcalendar
  version: 3.0.x
  note: FullCalendar integrates the FullCalendar.io v6 JS library as a Views style plugin, id 'fullcalendar'
    (@ViewsStyle, title 'FullCalendar', config schema views.style.fullcalendar). Requires core views +
    datetime and the drupal/fullcalendar_io library. No configure route; the calendar is configured entirely
    in a View's Format settings. It defines a FullcalendarOption plugin type (manager plugin.manager.fullcalendar,
    dir Plugin/fullcalendar/type, alter hook fullcalendar_type_info), one permission 'update any fullcalendar
    event', four hooks (hook_fullcalendar_classes[_alter], hook_fullcalendar_droppable, hook_fullcalendar_process_dates_alter),
    and two AJAX routes (fullcalendar.update at /fullcalendar/ajax/update/drop/{entity_type}/{entity};
    fullcalendar.results at /fullcalendar/ajax/results/{view}/{display_id}). The single source of truth
    for 'is this a FullCalendar display' is a View display's display_options.style.type == 'fullcalendar'.
    Medium reads the style plugin id of a known View; hard creates a View that uses the fullcalendar style,
    verified live. Fixture views are namespaced fc_*.
questions:
- id: fullcalendar-style-id
  input: How do I turn a Drupal View into an interactive calendar using the fullcalendar module? What
    is the Views style plugin id, and which core modules must be enabled?
  criteria: In the View's Format section choose the 'FullCalendar' style (Views style plugin id 'fullcalendar').
    It requires core Views and Datetime enabled, and pulls in the FullCalendar.io library (drupal/fullcalendar_io).
  bundle: fullcalendar
  rubric_ref: rubric/fullcalendar_fullcalendar_style_id@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: fullcalendar-permission
  input: What permission does the fullcalendar module define, and what does it allow?
  criteria: It defines 'update any fullcalendar event', which lets a user edit/move (drag-and-drop reschedule)
    any calendar event, ignoring other entity edit permissions.
  bundle: fullcalendar
  rubric_ref: rubric/fullcalendar_fullcalendar_permission@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: fullcalendar-hooks-plugin
  input: The fullcalendar module lets other modules extend it. Name a hook it invites for altering event
    CSS classes, and the plugin type / annotation it defines for contributing calendar options.
  criteria: Hooks include hook_fullcalendar_classes() and hook_fullcalendar_classes_alter() (plus hook_fullcalendar_droppable()
    and hook_fullcalendar_process_dates_alter()). It defines the FullcalendarOption plugin type (manager
    plugin.manager.fullcalendar, discovery dir Plugin/fullcalendar/type) for contributing calendar option
    handlers.
  bundle: fullcalendar
  rubric_ref: rubric/fullcalendar_fullcalendar_hooks_plugin@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: fullcalendar-known-style
  input: On this Drupal site there is a View with the machine name fc_events. Inspect the live View configuration
    and tell me which Views style (row/format style) plugin its default display uses.
  criteria: The fc_events View's default display uses the Views style plugin 'fullcalendar' (display_options.style.type
    = fullcalendar).
  bundle: fullcalendar
  rubric_ref: rubric/fullcalendar_fullcalendar_known_style@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/fullcalendar-known-style-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/fullcalendar-known-style-cleanup.sh
- id: fullcalendar-known-agenda
  input: This site has a View named fc_agenda that renders content as a calendar. Inspect the running
    site and name the Views style plugin id used by its display.
  criteria: fc_agenda uses the 'fullcalendar' Views style (display_options.style.type = fullcalendar,
    with the list view enabled).
  bundle: fullcalendar
  rubric_ref: rubric/fullcalendar_fullcalendar_known_agenda@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/fullcalendar-known-agenda-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/fullcalendar-known-agenda-cleanup.sh
- id: fullcalendar-create-view
  input: On this Drupal site, create a View with the machine name fc_cal that lists content (nodes) and
    uses the FullCalendar module's Views style to display them as a calendar. Apply it to the live site.
  criteria: Create a View fc_cal whose display uses the fullcalendar Views style (display_options.style.type
    = fullcalendar). Verify requires a display on fc_cal with style type 'fullcalendar'.
  bundle: fullcalendar
  rubric_ref: rubric/fullcalendar_fullcalendar_create_view@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/fullcalendar-create-view-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/fullcalendar-create-view-reset.sh
    verify: agent-module-documentation/evaluation/verify/fullcalendar-create-view-verify.sh
- id: fullcalendar-create-sched
  input: 'Build a calendar View on this site with the machine name fc_sched: it should list nodes and
    use the fullcalendar Views style. Apply it to the live site.'
  criteria: Create a View fc_sched with a display whose style type is 'fullcalendar'.
  bundle: fullcalendar
  rubric_ref: rubric/fullcalendar_fullcalendar_create_sched@1.0
  tags:
  - mode:execution
