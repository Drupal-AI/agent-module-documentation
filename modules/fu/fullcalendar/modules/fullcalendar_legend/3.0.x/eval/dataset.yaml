metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: fullcalendar_legend
  version: 3.0.x
  note: FullCalendar Legend is a submodule of FullCalendar. It provides one Views area handler, fullcalendar_legend
    (@ViewsArea, registered via hook_views_data() in fullcalendar_legend.views.inc), that renders a color
    legend for the per-bundle and per-taxonomy colors configured on a FullCalendar-style View. Its only
    option is heading_level (h2-h5, default h3; schema views.area.fullcalendar_legend, regex /h[2-5]/).
    It renders nothing unless the FullCalendar style has colors configured. Depends on fullcalendar +
    core block. No config route, no permissions. Persistent state is the area handler entry in a View
    display's header/footer (display_options.<region>.fullcalendar_legend, plugin_id fullcalendar_legend,
    heading_level). Medium reads back the configured heading level of a legend area on a known View; hard
    adds a fullcalendar_legend area to a FullCalendar View, verified live. Fixture views are namespaced
    fcl_*.
questions:
- id: fullcalendar_legend-area-id
  input: The fullcalendar_legend submodule shows a color key for a FullCalendar calendar. What kind of
    Views handler does it provide, what is its id, and where do you add it in a View?
  criteria: It provides a Views area handler with id fullcalendar_legend (a @ViewsArea), added to a View's
    Header or Footer on a View that uses the FullCalendar style.
  bundle: fullcalendar_legend
  rubric_ref: rubric/fullcalendar_legend_fullcalendar_legend_area_id@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: fullcalendar_legend-heading-option
  input: What is the only configurable option of the fullcalendar_legend Views area, and what are its
    allowed values and default?
  criteria: Its only option is heading_level, a select of h2 / h3 / h4 / h5 (default h3), controlling
    the semantic heading level of the legend's section headings.
  bundle: fullcalendar_legend
  rubric_ref: rubric/fullcalendar_legend_fullcalendar_legend_heading_option@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: fullcalendar_legend-requires-colors
  input: When does the fullcalendar_legend area render nothing, and what does it depend on?
  criteria: It renders nothing when the FullCalendar style plugin has no colors configured (its render()
    returns [] when options['colors'] is empty). It depends on the fullcalendar module and core block,
    and reads the parent style's color_bundle / color_taxonomies options.
  bundle: fullcalendar_legend
  rubric_ref: rubric/fullcalendar_legend_fullcalendar_legend_requires_colors@1.0
  tags:
  - mode:recipe
  - difficulty:easy
