metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: fullcalendar_view
  version: 5.2.x
  note: Fullcalendar View is a Views style plugin (no config entity, no settings form) plus a small service/plugin-type
    API and an AJAX date-update route. Cases are `recipe` (response-graded) probing documented facts an
    agent would otherwise read source to answer; no site mutation.
questions:
- id: fcv-views-style-id
  input: On a Drupal 11 site I want to display content on a calendar. Which module provides this, what
    is the Views style/format plugin id, and what is its label in the Format list?
  criteria: Full Calendar View provides a Views style plugin with id fullcalendar_view_display, shown
    as 'Full Calendar Display' in a View's Format setting.
  bundle: fullcalendar_view
  rubric_ref: rubric/fullcalendar_view_fcv_views_style_id@1.0
  tags:
  - mode:recipe
- id: fcv-required-date-field
  input: I added a Full Calendar Display format to a View but no events show. Which View field must I
    map in the style settings for events to appear, and which style options set the start/end dates?
  criteria: You must add a date field to the View and map it as the start-date field via the `start` style
    option (required); `end` optionally maps an end-date field, `title` the event title.
  bundle: fullcalendar_view
  rubric_ref: rubric/fullcalendar_view_fcv_required_date_field@1.0
  tags:
  - mode:recipe
- id: fcv-view-modes
  input: What calendar view modes can Full Calendar View show, and what is the default view mode value
    used by the style plugin?
  criteria: Month (dayGridMonth), week (timeGridWeek), day (timeGridDay) and list (listYear) views; default_view
    defaults to dayGridMonth (default_mobile_view defaults to listYear).
  bundle: fullcalendar_view
  rubric_ref: rubric/fullcalendar_view_fcv_view_modes@1.0
  tags:
  - mode:recipe
- id: fcv-drag-drop-reschedule
  input: In Full Calendar View, how do editors reschedule an event by dragging it, which style option
    must be enabled, and which route/controller persists the new date?
  criteria: Enable the 'Update allowed' option (updateAllowed=1); dragging posts to the fullcalendar_view.update_event
    route (/fullcalendar-view-event-update), handled by CalendarEventController::updateEvent, which validates
    a CSRF token and writes the new start/end to the entity.
  bundle: fullcalendar_view
  rubric_ref: rubric/fullcalendar_view_fcv_drag_drop_reschedule@1.0
  tags:
  - mode:recipe
- id: fcv-library-dep
  input: Which front-end JavaScript library powers Full Calendar View, and does it require me to install
    it manually or does it load automatically?
  criteria: It is powered by the FullCalendar JavaScript library (with Moment.js and RRule); by default
    the libraries load from CDN via hook_library_info_alter, and are only served locally if you download
    them into /libraries/...
  bundle: fullcalendar_view
  rubric_ref: rubric/fullcalendar_view_fcv_library_dep@1.0
  tags:
  - mode:recipe
- id: fcv-recurring-rrule
  input: How do I show recurring events on a Full Calendar View calendar? Which field/style option controls
    recurrence?
  criteria: Add a plain-text field containing an RRULE string and select it as the RRule field (the `rrule`
    style option); an optional duration field sets each instance's length.
  bundle: fullcalendar_view
  rubric_ref: rubric/fullcalendar_view_fcv_recurring_rrule@1.0
  tags:
  - mode:recipe
- id: fcv-processor-plugin
  input: I want another module to alter the calendar's preprocess variables in Full Calendar View. Which
    plugin type do I implement and what base class / manager does it use?
  criteria: Implement a FullcalendarViewProcessor plugin (annotation @FullcalendarViewProcessor) extending
    FullcalendarViewProcessorBase (process(&$variables)); managed by plugin.manager.fullcalendar_view_processor
    in Plugin/FullcalendarViewProcessor.
  bundle: fullcalendar_view
  rubric_ref: rubric/fullcalendar_view_fcv_processor_plugin@1.0
  tags:
  - mode:recipe
- id: fcv-configure-location
  input: Where do I configure Full Calendar View settings — is there an admin settings page? How do I
    set event colors by content type or taxonomy?
  criteria: There is no global settings form; all settings live in the View's Full Calendar Display Format/style
    options. Color events by bundle via color_bundle, or by a taxonomy field via tax_field/vocabularies
    (backed by the fullcalendar_view.taxonomy_color service).
  bundle: fullcalendar_view
  rubric_ref: rubric/fullcalendar_view_fcv_configure_location@1.0
  tags:
  - mode:recipe
