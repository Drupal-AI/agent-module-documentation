metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: fullcalendarview_generator
  version: 5.2.x
  note: Fullcalendarview_generator is a submodule of fullcalendar_view providing exactly one Drush command
    that scaffolds a calendar View. Cases are `recipe` (response-graded) probing documented facts about
    the command's name, arguments, options and behavior; no site mutation.
questions:
- id: fcvg-command-name
  input: Which module gives me a Drush command to auto-generate a Full Calendar View, and what is the
    command name and its alias?
  criteria: The fullcalendarview_generator submodule provides the Drush command fullcalendarview:generate,
    alias fcvg.
  bundle: fullcalendarview_generator
  rubric_ref: rubric/fullcalendarview_generator_fcvg_command_name@1.0
  tags:
  - mode:recipe
- id: fcvg-required-args
  input: What inputs does the fullcalendarview:generate (fcvg) command require to build a calendar View?
  criteria: A view_name, a comma-separated list of content types (content_types_str), a start_date_field,
    and a page path; prompted interactively if omitted.
  bundle: fullcalendarview_generator
  rubric_ref: rubric/fullcalendarview_generator_fcvg_required_args@1.0
  tags:
  - mode:recipe
- id: fcvg-options
  input: How do I set an end-date field and enable the generated View when running fcvg non-interactively?
  criteria: Pass --end_date_field=<field> for an optional end date and --enable to enable the View on
    creation (also --title_field, defaulting to title).
  bundle: fullcalendarview_generator
  rubric_ref: rubric/fullcalendarview_generator_fcvg_options@1.0
  tags:
  - mode:recipe
- id: fcvg-dependencies
  input: What must be installed for the fullcalendarview_generator Drush command to work?
  criteria: The submodule depends on views and fullcalendar_view; the command errors out if fullcalendarview_generator
    itself is not enabled.
  bundle: fullcalendarview_generator
  rubric_ref: rubric/fullcalendarview_generator_fcvg_dependencies@1.0
  tags:
  - mode:recipe
- id: fcvg-interactive
  input: Can I run the fcvg calendar-view generator without passing any arguments?
  criteria: Yes; run `drush fcvg` with no arguments and it prompts interactively (choice/multiselect/confirm)
    for view name, content types, fields, path, and enable.
  bundle: fullcalendarview_generator
  rubric_ref: rubric/fullcalendarview_generator_fcvg_interactive@1.0
  tags:
  - mode:recipe
- id: fcvg-validation
  input: What does the fcvg command validate before it creates the calendar View?
  criteria: It validates that the named content types exist, that the start/end/title fields exist on
    those types, and that the target path is not already routed/in use.
  bundle: fullcalendarview_generator
  rubric_ref: rubric/fullcalendarview_generator_fcvg_validation@1.0
  tags:
  - mode:recipe
