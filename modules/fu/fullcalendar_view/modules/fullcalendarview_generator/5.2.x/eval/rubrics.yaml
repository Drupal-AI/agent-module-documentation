rubrics:
- id: fullcalendarview_generator_fcvg_command_name
  version: '1.0'
  applicable_bundles:
  - fullcalendarview_generator
  checks:
  - kind: must_contain_any
    values:
    - fullcalendarview:generate
    - fcvg
  scoring:
    combine: all_pass
- id: fullcalendarview_generator_fcvg_required_args
  version: '1.0'
  applicable_bundles:
  - fullcalendarview_generator
  checks:
  - kind: must_contain_any
    values:
    - start_date_field
    - content_types
    - view_name
    - path
  scoring:
    combine: all_pass
- id: fullcalendarview_generator_fcvg_options
  version: '1.0'
  applicable_bundles:
  - fullcalendarview_generator
  checks:
  - kind: must_contain_any
    values:
    - --end_date_field
    - --enable
  scoring:
    combine: all_pass
- id: fullcalendarview_generator_fcvg_dependencies
  version: '1.0'
  applicable_bundles:
  - fullcalendarview_generator
  checks:
  - kind: must_contain_any
    values:
    - fullcalendar_view
    - views
  scoring:
    combine: all_pass
- id: fullcalendarview_generator_fcvg_interactive
  version: '1.0'
  applicable_bundles:
  - fullcalendarview_generator
  checks:
  - kind: must_contain_any
    values:
    - interactive
    - prompt
    - drush fcvg
  scoring:
    combine: all_pass
- id: fullcalendarview_generator_fcvg_validation
  version: '1.0'
  applicable_bundles:
  - fullcalendarview_generator
  checks:
  - kind: must_contain_any
    values:
    - path
    - field
    - content type
    - exist
    - in use
  scoring:
    combine: all_pass
