metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: total_control
  version: 3.0.x
  note: Total Control ships an admin dashboard at /admin/dashboard built as a Page Manager (Panels) page
    (config page_manager.page.total_control_dashboard), requiring page_manager/panels/ctools/block/views/contextual.
    Access is gated by the single permission 'have total control', stamped onto the page route by RouteSubscriber.
    It provides 7 Dashboard-category block plugins used as panes (content_overview, create_content, administer_content_types,
    administer_menus, administer_taxonomy, administer_panel_pages, total_control_dashboard) and control_*
    Views (control_content at /admin/dashboard/content/all, control_users at /admin/dashboard/users, control_terms
    at /admin/dashboard/categories, control_comments when comment enabled). No settings form / config
    schema. Medium reads back a live role's permission and the dashboard page path; hard cases grant the
    permission to a role and place a Total Control pane block, verified live. Fixtures namespaced tc_*.
questions:
- id: total_control-what
  input: What does the Total Control module give you in Drupal, at what path is its dashboard, and which
    permission controls access to it?
  criteria: It provides a ready-made administration dashboard at /admin/dashboard (a Page Manager/Panels
    page) with overview, admin-link and content/user listing panes. Access is gated by the 'have total
    control' permission.
  bundle: total_control
  rubric_ref: rubric/total_control_total_control_what@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: total_control-deps
  input: Which contributed modules does Total Control depend on to build its dashboard, and how is the
    dashboard page implemented?
  criteria: It depends on ctools, panels and page_manager (plus core block, views, contextual). The dashboard
    is a Page Manager page (page_manager.page.total_control_dashboard) with a Panels variant at /admin/dashboard.
  bundle: total_control
  rubric_ref: rubric/total_control_total_control_deps@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: total_control-panes-views
  input: Name some of the panes (block plugins) and the Views that Total Control provides for its dashboard.
  criteria: Pane block plugins (Dashboard category) include content_overview, create_content, administer_content_types,
    administer_menus, administer_taxonomy, administer_panel_pages and total_control_dashboard. Views include
    control_content (/admin/dashboard/content/all), control_users (/admin/dashboard/users), their *_panes
    variants, control_terms and control_comments.
  bundle: total_control
  rubric_ref: rubric/total_control_total_control_panes_views@1.0
  tags:
  - mode:recipe
  - difficulty:easy
