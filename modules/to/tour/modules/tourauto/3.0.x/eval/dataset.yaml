metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: tourauto
  version: 3.0.x
  note: Tourauto is a submodule of Tour that auto-opens unseen tours and adds a per-user preference. It
    has no config/permissions/plugins; behavior lives in hook_page_bottom and the tourauto.manager service.
    Cases are `recipe` (response-graded); no site mutation.
questions:
- id: tourauto-purpose
  input: On a Drupal site using the Tour module, I want tours to open automatically for users who haven't
    seen them yet, instead of requiring a click. Which module do I enable?
  criteria: Enable the tourauto submodule of Tour; it auto-opens a page's matching tours for users who
    have not yet seen them.
  bundle: tourauto
  rubric_ref: rubric/tourauto_tourauto_purpose@1.0
  tags:
  - mode:recipe
- id: tourauto-user-preference
  input: With tourauto enabled, how does a Drupal user turn off tours opening automatically, and where
    is that preference stored?
  criteria: An 'Open tours automatically' checkbox is added to the user edit form; the choice is stored
    per-user in user.data under module tourauto, key tourauto_enable (default enabled).
  bundle: tourauto
  rubric_ref: rubric/tourauto_tourauto_user_preference@1.0
  tags:
  - mode:recipe
- id: tourauto-seen-state
  input: How does tourauto remember which tours a user has already seen, and how can a user reset it so
    tours auto-open again?
  criteria: 'Seen tours are stored as JSON in user.data key tourauto_state ({seen: {...}}). The ''Clear
    status (mark all tours as unseen)'' checkbox on the user form calls clearState() to delete it.'
  bundle: tourauto
  rubric_ref: rubric/tourauto_tourauto_seen_state@1.0
  tags:
  - mode:recipe
- id: tourauto-service
  input: In custom Drupal code, which service manages tourauto data for a user, and which method returns
    the tours available on the current route?
  criteria: The tourauto.manager service (Drupal\tourauto\TourautoManager); getCurrentTours() returns
    the current-route tours (keyed by tour id), and getManagerForAccount() scopes it to another user.
  bundle: tourauto
  rubric_ref: rubric/tourauto_tourauto_service@1.0
  tags:
  - mode:recipe
- id: tourauto-permission
  input: Does tourauto define its own permission for who gets auto-opened tours, or does it reuse Tour's
    permission?
  criteria: Tourauto defines no permission; it reuses Tour's 'access tour' permission (getCurrentTours()
    returns nothing without it).
  bundle: tourauto
  rubric_ref: rubric/tourauto_tourauto_permission@1.0
  tags:
  - mode:recipe
- id: tourauto-dependency
  input: What module does tourauto depend on, and is it a standalone project?
  criteria: Tourauto is a submodule shipped inside the Tour project (part_of tour) and depends on tour:tour.
  bundle: tourauto
  rubric_ref: rubric/tourauto_tourauto_dependency@1.0
  tags:
  - mode:recipe
