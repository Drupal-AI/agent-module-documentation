metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: tour
  version: 3.0.x
  note: Tour provides a `tour` config entity, a `tour_tip` plugin type, two permissions, a settings object,
    and is the contrib successor to core Tour. Cases are `recipe` (response-graded), probing documented
    facts an agent would otherwise read source to answer; no site mutation.
questions:
- id: tour-what-and-successor
  input: On a Drupal 11 site I want guided, step-by-step tooltip tours of admin pages. Core no longer
    ships Tour — which contrib module provides this, and what config object is each tour stored as?
  criteria: The contrib Tour module (drupal/tour), the maintained successor to deprecated core Tour, provides
    guided tooltip tours; each tour is a `tour` config entity (tour.tour.<id>).
  bundle: tour
  rubric_ref: rubric/tour_tour_what_and_successor@1.0
  tags:
  - mode:recipe
- id: tour-config-entity-structure
  input: What are the main parts of a Drupal `tour` config entity that determine where a tour appears
    and what steps it shows?
  criteria: A tour has an id/label, a `routes` list (route_name + optional route_params) controlling which
    pages it shows on, and an ordered `tips` list; each tip has a plugin, label, weight, position, and
    a DOM/CSS selector to attach to.
  bundle: tour
  rubric_ref: rubric/tour_tour_config_entity_structure@1.0
  tags:
  - mode:recipe
- id: tour-route-targeting
  input: How do I make a Tour appear on all article node add forms in Drupal? Where is that targeting
    defined?
  criteria: 'In the tour config entity''s `routes` list, add an entry with route_name entity.node.add_form
    (and optionally route_params like node_type: article) — tours match on route name plus optional route
    parameters.'
  bundle: tour
  rubric_ref: rubric/tour_tour_route_targeting@1.0
  tags:
  - mode:recipe
- id: tour-tip-plugin-type
  input: I want to add a custom tour step type (beyond plain text) in Drupal Tour. What plugin type do
    I implement, which attribute/namespace, and which base class?
  criteria: 'Implement a tour tip plugin: class in Plugin/tour/tip with the #[Tip] attribute, extending
    Drupal\tour\TipPluginBase; managed by plugin.manager.tour.tip. The bundled plugin id is `text`.'
  bundle: tour
  rubric_ref: rubric/tour_tour_tip_plugin_type@1.0
  tags:
  - mode:recipe
- id: tour-access-permission
  input: Which permission lets a user actually see and run tours on a Drupal site, versus administering/creating
    them?
  criteria: '''access tour'' lets a user see/run tours (toolbar button, recap page); ''administer tour''
    gates the admin UI for creating/editing tours and the settings form.'
  bundle: tour
  rubric_ref: rubric/tour_tour_access_permission@1.0
  tags:
  - mode:recipe
- id: tour-launch-button
  input: How does an end user start a tour in Drupal, and how can I place a launch button outside the
    toolbar?
  criteria: A Tour button appears in the toolbar on matching routes (or via the Navigation top-bar item);
    it can also be triggered with the ?tour URL parameter or the alt+t hotkey. Place the `tour_button_block`
    block for a button elsewhere.
  bundle: tour
  rubric_ref: rubric/tour_tour_launch_button@1.0
  tags:
  - mode:recipe
- id: tour-alter-tips
  input: In a custom Drupal module I want to change the body text of an existing tour's tips before they
    render. Which hook do I implement?
  criteria: 'Implement hook_tour_tips_alter(array &$tour_tips, EntityInterface $entity) and call $tour_tip->set(''body'',
    ...). (Related: hook_tour_tips_info_alter for definitions, hook_tour_build_alter for the render array.)'
  bundle: tour
  rubric_ref: rubric/tour_tour_alter_tips@1.0
  tags:
  - mode:recipe
- id: tour-submodule-auto
  input: Which submodule of Drupal Tour makes tours open automatically for users who haven't seen them
    yet?
  criteria: The tourauto submodule auto-opens tours for users who have not yet seen them, and adds a per-user
    preference to enable/disable auto-opening.
  bundle: tour
  rubric_ref: rubric/tour_tour_submodule_auto@1.0
  tags:
  - mode:recipe
