metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: tome_static_super_cache
  version: 1.16.x
  note: Tome Static Super Cache has no config, permissions, or Drush command; it works by decorating cache.tome_static
    (SuperStaticCache) and cache_tags.invalidator, and by providing a Views cache plugin 'Smart tag based'
    with id tome_static_super_cache_smart_tag. Full rebuilds are forced via the 'Fully clear caches' button
    at /admin/config/development/performance (the tscr / tome:super-cache-rebuild command exists but is
    registered only for Drupal Console, not Drush). Easy cases test that knowledge. Medium introspects
    the live Views cache plugin registry for the smart_tag plugin. Hard has the agent assign the smart_tag
    cache plugin to a namespaced probe View (reset creates view tome_ssc_probe with cache type 'none';
    verify checks the display's cache type became tome_static_super_cache_smart_tag; cleanup deletes the
    view). This is pure Views config, no rendering, safe on the shared host.
questions:
- id: tome_static_super_cache-problem
  input: Why would a Tome Static site enable tome_static_super_cache? What two core caching behaviors
    does it change?
  criteria: It stops a full cache clear (drush cr / 'Clear all caches') from wiping the Tome Static cache
    bin, and stops list cache tags (e.g. node_list) from invalidating every View's cache on any node save.
    It does this by decorating cache.tome_static and cache_tags.invalidator.
  bundle: tome_static_super_cache
  rubric_ref: rubric/tome_static_super_cache_tome_static_super_cache_problem@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: tome_static_super_cache-views-plugin
  input: tome_static_super_cache adds a Views caching plugin to avoid list cache tags. What is the plugin's
    id / label?
  criteria: The Views cache plugin id is tome_static_super_cache_smart_tag, labelled 'Smart tag based'.
    Assign it to a View's caching so only a View-specific tag is cleared when an entity that actually
    appears in the View changes.
  bundle: tome_static_super_cache
  rubric_ref: rubric/tome_static_super_cache_tome_static_super_cache_views_plugin@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: tome_static_super_cache-full-rebuild
  input: With tome_static_super_cache enabled, a normal 'drush cr' no longer fully clears the Tome Static
    cache. How do you force a genuine full cache rebuild?
  criteria: Use the 'Fully clear caches' button on /admin/config/development/performance (or drupal_flush_all_caches()
    with the FULL_REBUILD_KEY global). The tscr / tome:super-cache-rebuild command does the same but is
    only registered for Drupal Console, not Drush.
  bundle: tome_static_super_cache
  rubric_ref: rubric/tome_static_super_cache_tome_static_super_cache_full_rebuild@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: tome_static_super_cache-plugin-available
  input: Inspect this running site's Views caching plugins. Which cache plugin id does tome_static_super_cache
    make available for use on a View display?
  criteria: tome_static_super_cache_smart_tag ('Smart tag based') is registered with the Views cache plugin
    manager (plugin.manager.views.cache); check with hasDefinition('tome_static_super_cache_smart_tag').
  bundle: tome_static_super_cache
  rubric_ref: rubric/tome_static_super_cache_tome_static_super_cache_plugin_available@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/tome_static_super_cache-plugin-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/tome_static_super_cache-plugin-cleanup.sh
- id: tome_static_super_cache-assign-plugin
  input: This site has a View with machine name 'tome_ssc_probe' whose default display currently uses
    the 'none' caching plugin. Switch its default display to use Tome Static Super Cache's 'Smart tag
    based' caching plugin, and apply it to the live site.
  criteria: Set the tome_ssc_probe view's default display display_options.cache.type to 'tome_static_super_cache_smart_tag'
    (via Views UI Advanced > Caching, config edit, or the entity API) and save.
  bundle: tome_static_super_cache
  rubric_ref: rubric/tome_static_super_cache_tome_static_super_cache_assign_plugin@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/tome_static_super_cache-view-cache-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/tome_static_super_cache-view-cache-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/tome_static_super_cache-view-cache-verify.sh
