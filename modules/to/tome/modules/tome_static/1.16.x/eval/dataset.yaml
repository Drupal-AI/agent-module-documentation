metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: tome_static
  version: 1.16.x
  note: 'Tome Static renders public paths to static HTML (drush tome:static, --uri important) into tome_static_directory
    (../html). No config object; directories are settings.php keys and build progress lives in the state
    keys tome_static.url (last build base URL) and tome_static.building. Permission ''use tome static''
    gates the UI at /admin/config/tome/static. Extension is via TomeStaticEvents. The medium case reads
    the live tome_static.url state; the hard case writes it (the value the Generate form persists). Hard
    cases deliberately do NOT run a full HTML render: on this shared host page rendering is broken by
    an unrelated contrib module (restrict_ip), and the brief calls for grounding in real state/commands
    rather than a full site export. Setting the build URL state is a real, isolated, verifiable tome_static
    operation.'
questions:
- id: tome_static-generate-command
  input: How do you generate a full static HTML copy of a Drupal site with Tome Static from the command
    line, and which option must you pass so absolute URLs in the output are correct?
  criteria: Run 'drush tome:static' and pass '--uri=https://your-site.com'. Without --uri Tome warns absolute
    URLs may be invalid. Output is written to tome_static_directory (default ../html); preview it with
    'drush tome:preview'.
  bundle: tome_static
  rubric_ref: rubric/tome_static_tome_static_generate_command@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: tome_static-permission-ui
  input: A content editor needs to trigger a Tome Static build from the Drupal admin UI, not the CLI.
    Which permission do they need and at what admin path is the Generate form?
  criteria: 'Grant the ''use tome static'' permission (restrict access: true). The Generate form is at
    /admin/config/tome/static/generate (menu root /admin/config/tome/static), alongside Download and Preview.'
  bundle: tome_static
  rubric_ref: rubric/tome_static_tome_static_permission_ui@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: tome_static-add-paths-event
  input: Tome Static did not pick up a custom path I want in the static build. Which Tome Static event
    do I subscribe to in order to add extra paths to the crawl, and which method adds a path?
  criteria: Subscribe to TomeStaticEvents::COLLECT_PATHS ('tome_static.collect_paths') and call CollectPathsEvent::addPath()/addPaths()
    (you can also replacePath()/deletePath()).
  bundle: tome_static
  rubric_ref: rubric/tome_static_tome_static_add_paths_event@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: tome_static-last-build-url
  input: Tome Static remembers the base URL of the last build on this site. Inspect the live site and
    report that URL.
  criteria: https://static-live.example.org — stored in the 'tome_static.url' state key (read with 'drush
    sget tome_static.url').
  bundle: tome_static
  rubric_ref: rubric/tome_static_tome_static_last_build_url@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/tome_static-build-url-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/tome_static-build-url-cleanup.sh
- id: tome_static-set-build-url
  input: Configure Tome Static on this site so that its recorded static-build base URL is exactly https://tome-static-prod.example.com
    (the value the Generate form persists and later builds default to). Apply it to the live site.
  criteria: Set the 'tome_static.url' state key to https://tome-static-prod.example.com, e.g. 'drush sset
    tome_static.url https://tome-static-prod.example.com'. This is the StaticGeneratorInterface::STATE_KEY_URL
    value the Generate form stores.
  bundle: tome_static
  rubric_ref: rubric/tome_static_tome_static_set_build_url@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/tome_static-set-url-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/tome_static-set-url-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/tome_static-set-url-verify.sh
