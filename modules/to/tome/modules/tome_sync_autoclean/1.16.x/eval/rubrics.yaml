rubrics:
- id: tome_sync_autoclean_tome_sync_autoclean_what
  version: '1.0'
  applicable_bundles:
  - tome_sync_autoclean
  checks:
  - kind: must_contain_any
    values:
    - clean-files
    - tome:clean-files
    - unused files
    - unused file
  scoring:
    combine: all_pass
- id: tome_sync_autoclean_tome_sync_autoclean_how_enabled
  version: '1.0'
  applicable_bundles:
  - tome_sync_autoclean
  checks:
  - kind: must_contain_any
    values:
    - enable
    - uninstall
    - 'no'
    - none
    - no configuration
  scoring:
    combine: all_pass
- id: tome_sync_autoclean_tome_sync_autoclean_event
  version: '1.0'
  applicable_bundles:
  - tome_sync_autoclean
  checks:
  - kind: must_contain_any
    values:
    - tome_sync.export_content
    - EXPORT_CONTENT
    - event subscriber
    - ExportEventSubscriber
  scoring:
    combine: all_pass
- id: tome_sync_autoclean_tome_sync_autoclean_enabled_state
  version: '1.0'
  applicable_bundles:
  - tome_sync_autoclean
  checks:
  - kind: must_contain_any
    values:
    - tome_sync_autoclean
  scoring:
    combine: all_pass
- id: tome_sync_autoclean_tome_sync_autoclean_enable
  version: '1.0'
  applicable_bundles:
  - tome_sync_autoclean
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
