metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: tome_sync_autoclean
  version: 1.16.x
  note: 'Tome Sync Autoclean is an experimental glue sub-module with NO config, permissions, routes, or
    Drush command. Its entire behavior is one event subscriber (ExportEventSubscriber) on tome_sync.export_content
    that auto-runs Tome''s unused-file cleanup (like drush tome:clean-files) after each export; enabling
    the module is the whole setup, and it can cause data loss. Because there is no config/state to read
    or write, the only meaningful, verifiable execution is the module''s own install state. The hard case
    therefore has the agent ENABLE the experimental module: reset uninstalls it (verify FAILS), the agent
    enables it, verify passes, and cleanup re-enables it so the site baseline (all Tome sub-modules enabled)
    is preserved. NOTE: module install/uninstall triggers a full container rebuild and takes ~1-2 minutes
    per operation on this host; this was smoke-tested (reset->FAIL, enable->PASS) and the module was left
    enabled.'
questions:
- id: tome_sync_autoclean-what
  input: What does the tome_sync_autoclean module do, and which manual Drush command's behavior does it
    automate?
  criteria: It automatically deletes unused exported files after every Tome Sync export, automating what
    'drush tome:clean-files' does manually. It is experimental and can cause data loss.
  bundle: tome_sync_autoclean
  rubric_ref: rubric/tome_sync_autoclean_tome_sync_autoclean_what@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: tome_sync_autoclean-how-enabled
  input: How do you turn tome_sync_autoclean's behavior on and off? Does it have a settings page?
  criteria: There is no settings page or configuration. Enable the module to turn the auto-cleanup on
    ('drush en tome_sync_autoclean -y'); uninstall it to turn it off ('drush pmu tome_sync_autoclean -y').
  bundle: tome_sync_autoclean
  rubric_ref: rubric/tome_sync_autoclean_tome_sync_autoclean_how_enabled@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: tome_sync_autoclean-event
  input: Technically, how does tome_sync_autoclean hook into Tome Sync to trigger cleanup? Name the event.
  criteria: It registers an event subscriber (ExportEventSubscriber) on the TomeSyncEvents::EXPORT_CONTENT
    ('tome_sync.export_content') event and runs the clean-files logic after content is exported.
  bundle: tome_sync_autoclean
  rubric_ref: rubric/tome_sync_autoclean_tome_sync_autoclean_event@1.0
  tags:
  - mode:recipe
