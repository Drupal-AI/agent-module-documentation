metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: tome_static_cron
  version: 1.16.x
  note: Tome Static Cron generates the Tome Static site incrementally on cron using a queue worker. Its
    only configuration is the config object tome_static_cron.settings with a single required key, base_url
    (validated as a URL by the settings form at /admin/config/services/tome_static_cron/settings, permission
    'use tome static'). If base_url is empty, hook_cron does nothing. It queues uncached paths into the
    'tome_static_cron' queue and TomeStaticQueueWorker renders them on later cron runs. It adds no Drush
    command. Medium reads the configured base_url; hard sets a valid base_url. Both are pure-config operations
    (no rendering), so they are safe and reliable on the shared host. The reset/cleanup delete the config
    object, restoring the shipped baseline where no base_url is set.
questions:
- id: tome_static_cron-config-key
  input: After enabling the tome_static_cron module, what must you configure for cron to actually generate
    static HTML, and at which admin path?
  criteria: Set the Base URL (config key base_url in tome_static_cron.settings) at /admin/config/services/tome_static_cron/settings.
    If base_url is empty, hook_cron does nothing.
  bundle: tome_static_cron
  rubric_ref: rubric/tome_static_cron_tome_static_cron_config_key@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: tome_static_cron-how-it-works
  input: How does tome_static_cron generate the static site differently from running 'drush tome:static'?
    Mention the queue it uses.
  criteria: On each cron run it enqueues uncached paths into the 'tome_static_cron' queue and a TomeStaticQueueWorker
    renders them across subsequent cron runs (incremental, one cycle at a time), instead of a single blocking
    'drush tome:static' build. Already-cached paths are skipped.
  bundle: tome_static_cron
  rubric_ref: rubric/tome_static_cron_tome_static_cron_how_it_works@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: tome_static_cron-drush
  input: Does tome_static_cron add its own Drush command, and what triggers a cron static build?
  criteria: No, it adds no Drush command. Builds are triggered by Drupal cron (system cron or 'drush cron')
    via hook_cron(), provided base_url is set.
  bundle: tome_static_cron
  rubric_ref: rubric/tome_static_cron_tome_static_cron_drush@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: tome_static_cron-configured-base-url
  input: This site already has Tome Static Cron configured. Inspect the live configuration and report
    the Base URL it will use for cron static generation.
  criteria: https://static.example.org — stored at tome_static_cron.settings:base_url (read with 'drush
    cget tome_static_cron.settings base_url').
  bundle: tome_static_cron
  rubric_ref: rubric/tome_static_cron_tome_static_cron_configured_base_url@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/tome_static_cron-base-url-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/tome_static_cron-base-url-cleanup.sh
- id: tome_static_cron-set-base-url
  input: Enable cron-driven static generation on this site by configuring Tome Static Cron with a valid
    Base URL (use https://cron-build.example.com). Apply it to the live site.
  criteria: Set tome_static_cron.settings:base_url to a valid absolute URL (e.g. https://cron-build.example.com)
    via the settings form or 'drush cset tome_static_cron.settings base_url https://cron-build.example.com
    -y'. Verify passes when base_url is a non-empty valid URL.
  bundle: tome_static_cron
  rubric_ref: rubric/tome_static_cron_tome_static_cron_set_base_url@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/tome_static_cron-base-url-cleanup.sh
    cleanup: agent-module-documentation/evaluation/verify/tome_static_cron-base-url-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/tome_static_cron-base-url-verify.sh
