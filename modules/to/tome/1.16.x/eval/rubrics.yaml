rubrics:
- id: tome_tome_export_command
  version: '1.0'
  applicable_bundles:
  - tome
  checks:
  - kind: must_contain_any
    values:
    - tome:export
  scoring:
    combine: all_pass
- id: tome_tome_static_command
  version: '1.0'
  applicable_bundles:
  - tome
  checks:
  - kind: must_contain_any
    values:
    - tome:static
  scoring:
    combine: all_pass
- id: tome_tome_settings_directories
  version: '1.0'
  applicable_bundles:
  - tome
  checks:
  - kind: must_contain_any
    values:
    - settings.php
    - tome_content_directory
    - tome_static_directory
    - tome_files_directory
  scoring:
    combine: all_pass
- id: tome_tome_enabled_submodules
  version: '1.0'
  applicable_bundles:
  - tome
  checks:
  - kind: must_contain_any
    values:
    - tome_base
  scoring:
    combine: all_pass
- id: tome_tome_last_build_url
  version: '1.0'
  applicable_bundles:
  - tome
  checks:
  - kind: must_contain_any
    values:
    - tome-build.example.net
  scoring:
    combine: all_pass
- id: tome_tome_export_node
  version: '1.0'
  applicable_bundles:
  - tome
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
- id: tome_tome_export_user
  version: '1.0'
  applicable_bundles:
  - tome
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
