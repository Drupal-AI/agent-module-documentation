metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: tome
  version: 1.16.x
  note: 'Tome is an umbrella static-site-generator module: it depends on tome_sync (content/config/files
    <-> JSON on disk) and tome_static (site -> static HTML), both on tome_base. It has NO config object
    and NO configure route of its own; output locations are settings.php keys (tome_content_directory=../content,
    tome_files_directory=../files, tome_static_directory=../html, tome_sync_encoder). The real interface
    is Drush: tome:export/tome:import (all content+config+files), tome:export-content <type:id> (single
    entities, writes content/<type>.<uuid>.json), tome:static --uri=... (render every path to static HTML),
    tome:preview, tome:clean-files. tome_static records state keys tome_static.url (last build URL) and
    tome_static.building. Medium cases read live state (tome_static.url) and enabled sub-modules. Hard
    cases are grounded in tome:export-content, which serialises a single existing entity to JSON without
    rendering a page (full HTML rendering is intentionally avoided; on this shared host page rendering
    is broken by an unrelated contrib module). Existing entities node:1 (uuid 5528817f-2211-4569-91a2-af6f5da9da25)
    and user:1 (uuid ae7c2aca-557b-4d70-9483-3bb19e74bb92) are used so no fixture content is created.'
questions:
- id: tome-export-command
  input: On a Drupal site using the Tome module, which single Drush command performs the initial export
    of ALL config, content, and files to disk so they can be committed to Git?
  criteria: drush tome:export exports all config, content, and files (provided by the tome_sync sub-module).
    After the initial export, ongoing content edits are exported automatically.
  bundle: tome
  rubric_ref: rubric/tome_tome_export_command@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: tome-static-command
  input: Using Tome, how do you generate the static HTML copy of a Drupal site for production, and why
    should you pass the --uri option?
  criteria: Run drush tome:static (from tome_static). Pass --uri=https://your-site.com so absolute URLs
    in the generated HTML are correct; without it Tome warns that URLs may be invalid. Output goes to
    the tome_static_directory (default ../html).
  bundle: tome
  rubric_ref: rubric/tome_tome_static_command@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: tome-settings-directories
  input: Tome has no admin settings page for choosing where it writes content, files, and static HTML.
    Where are those output directories configured, and name the setting keys.
  criteria: 'They are $settings in settings.php read via Settings::get(): tome_content_directory (default
    ../content), tome_files_directory (../files), tome_static_directory (../html), plus tome_book_outline_directory
    and tome_sync_encoder. There is no tome.settings config object.'
  bundle: tome
  rubric_ref: rubric/tome_tome_settings_directories@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: tome-enabled-submodules
  input: Inspect this running Drupal site. Besides the main 'tome' module, which Tome sub-module provides
    the shared services and traits that Tome Sync and Tome Static both build on? Confirm it is enabled.
  criteria: tome_base (Tome Base) is enabled; it contains the shared CommandBase, ProcessTrait, PathTrait,
    etc. used by both tome_sync and tome_static. Verifiable with 'drush pm:list --status=enabled'.
  bundle: tome
  rubric_ref: rubric/tome_tome_enabled_submodules@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/tome-submodules-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/tome-submodules-cleanup.sh
- id: tome-last-build-url
  input: This site has run a Tome static build before. Inspect the live site state and report the base
    URL that was used for the most recent static build.
  criteria: https://tome-build.example.net — Tome Static stores the last build URL in the 'tome_static.url'
    state key (read with 'drush sget tome_static.url').
  bundle: tome
  rubric_ref: rubric/tome_tome_last_build_url@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/tome-build-url-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/tome-build-url-cleanup.sh
- id: tome-export-node
  input: On this Drupal site with Tome installed, export the content entity 'node 1' to Tome's on-disk
    JSON content store using the appropriate Drush command. Apply it to the live site.
  criteria: Run 'drush tome:export-content node:1'. Tome Sync writes content/node.<uuid>.json (uuid 5528817f-2211-4569-91a2-af6f5da9da25)
    in the tome_content_directory as valid JSON.
  bundle: tome
  rubric_ref: rubric/tome_tome_export_node@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/tome-export-node-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/tome-export-node-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/tome-export-node-verify.sh
- id: tome-export-user
  input: Using Tome on this site, export user account 1 to Tome's on-disk JSON content store with the
    correct Drush command, and apply it to the live site.
  criteria: Run 'drush tome:export-content user:1'. Tome Sync writes content/user.<uuid>.json (uuid ae7c2aca-557b-4d70-9483-3bb19e74bb92)
    as valid JSON; the tome:export-content argument is a comma-separated list of entity_type:id pairs.
  bundle: tome
  rubric_ref: rubric/tome_tome_export_user@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/tome-export-user-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/tome-export-user-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/tome-export-user-verify.sh
