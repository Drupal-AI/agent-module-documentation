metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: tocbot
  version: 2.0.x
  note: 'Tocbot wraps the Tocbot JS library. Configure route tocbot.settings at /admin/config/content/tocbot
    (perm ''administer site configuration'') stores ~30 keys in the tocbot.settings config object (defaults:
    min_activate ''3'', content_selector ''#content'', heading_selector ''h2, h3, h4, h5, h6'', toc_selector
    ''.js-toc-block'', create_auto_ids 1). The ''Tocbot TOC'' block (plugin tocbot_block) renders <div
    class=js-toc-block> and attaches drupalSettings.tocbot + the library (CDN tocbot/external.tocbot by
    default, tocbot/internal.tocbot when /libraries/tocbot/dist files exist). No permissions of its own,
    no Drush, no config schema. Medium cases read back known config values; hard cases set config / place
    the block and verify live state.'
questions:
- id: tocbot-settings-location
  input: Where is the Tocbot admin settings page in Drupal, and which setting stops the table of contents
    from appearing on pages that have only a couple of headings?
  criteria: The settings form is at /admin/config/content/tocbot (route tocbot.settings). The min_activate
    / minActivate setting (default 3) is the minimum number of matching headings required before Tocbot
    activates, so raising it prevents a TOC on short pages.
  bundle: tocbot
  rubric_ref: rubric/tocbot_tocbot_settings_location@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: tocbot-place-block
  input: After enabling the Tocbot module, how do I actually get the table of contents to show up on my
    pages? What block do I place?
  criteria: Place the 'Tocbot TOC' block (plugin id tocbot_block) into a region via Structure > Block
    layout. It outputs a <div class="js-toc-block"> and attaches the Tocbot library; on any page whose
    content_selector container has at least min_activate headings, the TOC is built into that div.
  bundle: tocbot
  rubric_ref: rubric/tocbot_tocbot_place_block@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: tocbot-cdn-vs-local
  input: Does the Tocbot Drupal module load the Tocbot JavaScript library from a CDN or locally, and how
    do I make it use a local copy?
  criteria: By default it loads from a CDN (tocbot/external.tocbot, cdnjs). If you place the library files
    at /libraries/tocbot/dist/tocbot.min.js and tocbot.css, TocbotHelper::getLibrary() detects them and
    switches to the local library (tocbot/internal.tocbot).
  bundle: tocbot
  rubric_ref: rubric/tocbot_tocbot_cdn_vs_local@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: tocbot-min-activate-live
  input: On this Drupal site, how many headings must a page have before the Tocbot table of contents activates?
    Inspect the live tocbot configuration and give the number.
  criteria: 7. The live tocbot.settings config has min_activate set to 7, so the TOC only activates when
    the page has 7 or more matching headings.
  bundle: tocbot
  rubric_ref: rubric/tocbot_tocbot_min_activate_live@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/tocbot-minactivate-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/tocbot-minactivate-cleanup.sh
- id: tocbot-content-selector-live
  input: On this Drupal site, which CSS selector does Tocbot scan for headings when building the table
    of contents? Inspect the live tocbot configuration and give the exact selector value.
  criteria: main.toc-content-xyz. The live tocbot.settings config has content_selector set to 'main.toc-content-xyz'
    (the container Tocbot scans for headings).
  bundle: tocbot
  rubric_ref: rubric/tocbot_tocbot_content_selector_live@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/tocbot-content-selector-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/tocbot-content-selector-cleanup.sh
- id: tocbot-configure-threshold
  input: On this Drupal site, configure Tocbot so the table of contents is built only from h2 and h3 headings
    and only activates once a page has at least 6 headings. Apply the change to the live tocbot settings.
  criteria: Set tocbot.settings min_activate to 6 and heading_selector to 'h2, h3' (e.g. via the form
    at /admin/config/content/tocbot or `drush config:set tocbot.settings min_activate 6` and `drush config:set
    tocbot.settings heading_selector 'h2, h3'`).
  bundle: tocbot
  rubric_ref: rubric/tocbot_tocbot_configure_threshold@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/tocbot-threshold-headings-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/tocbot-threshold-headings-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/tocbot-threshold-headings-verify.sh
- id: tocbot-place-toc-block
  input: I've enabled the Tocbot module but no table of contents shows up anywhere on my site. Please
    put the automatic table-of-contents block onto my site so it can display.
  criteria: 'Place the ''Tocbot TOC'' block (plugin tocbot_block) into a region of the active theme --
    via Structure > Block layout, or by creating a block.block.* config entity with plugin: tocbot_block
    and status: true. Any enabled placement of tocbot_block satisfies this.'
  bundle: tocbot
  rubric_ref: rubric/tocbot_tocbot_place_toc_block@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: site-owner
    reset: agent-module-documentation/evaluation/verify/tocbot-place-block-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/tocbot-place-block-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/tocbot-place-block-verify.sh
