metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: toastify
  version: 1.3.x
  note: Toastify renders Drupal messages as toastify-js toasts. All state lives in the config object toastify.settings
    (per-type maps status/warning/error each with duration/gravity/position/offsetX/offsetY/close/color/color2/colorProgressBar/direction,
    plus enable_for.admin_theme and enable_for.frontend_theme). It is gated by the 'show toastify messages'
    permission and swaps core's status_messages element for ToastifyStatusMessages while overriding Drupal.theme.message.
    Medium/hard cases are grounded in real config keys read/written via drush cget/cset.
questions:
- id: toastify-permission
  input: On a Drupal site with the Toastify module enabled, a role's users still see the normal Drupal
    message boxes instead of toast pop-ups. Which permission must that role be granted so their messages
    render as Toastify toasts?
  criteria: Grant the 'show toastify messages' permission. toastify_is_active() checks hasPermission('show
    toastify messages'); without it the module falls back to standard Drupal messages.
  bundle: toastify
  rubric_ref: rubric/toastify_toastify_permission@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: toastify-settings-location
  input: Where are Toastify's settings stored and what is the admin path of its configuration form on
    a Drupal site?
  criteria: Settings live in the config object toastify.settings; the form is at /admin/config/user-interface/toastify
    (route toastify.settings_form, permission 'administer toastify configuration').
  bundle: toastify
  rubric_ref: rubric/toastify_toastify_settings_location@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: toastify-mechanism
  input: How does the Toastify module make Drupal's status messages appear as toast notifications instead
    of the default message boxes? Name the core render element it replaces and the client-side theme function
    it overrides.
  criteria: toastify_element_plugin_alter() swaps the core status_messages element class for ToastifyStatusMessages
    (which passes messages to drupalSettings.toastify.messages), and js/toastify.messages.js overrides
    Drupal.theme.message so JS-added messages become toasts too.
  bundle: toastify
  rubric_ref: rubric/toastify_toastify_mechanism@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: toastify-known-duration
  input: On this Drupal site, the Toastify status (success) toast has been given a non-default auto-dismiss
    duration. Inspect the live configuration and state the duration, in milliseconds, currently configured
    for status toasts.
  criteria: toastify.settings status.duration is 8000 (read with `drush cget toastify.settings status.duration`).
  bundle: toastify
  rubric_ref: rubric/toastify_toastify_known_duration@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/toastify-known-duration-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/toastify-known-duration-cleanup.sh
- id: toastify-error-position
  input: On this Drupal site the Toastify error toasts have been moved from their default screen position.
    Inspect the live Toastify configuration and state where error toasts now appear (their position value).
  criteria: toastify.settings error.position is 'center' (default is 'right'); read with `drush cget toastify.settings
    error.position`.
  bundle: toastify
  rubric_ref: rubric/toastify_toastify_error_position@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/toastify-error-position-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/toastify-error-position-cleanup.sh
- id: toastify-set-duration
  input: On this Drupal site, configure Toastify so that status (success) toasts stay on screen for 10000
    milliseconds before auto-dismissing. Apply the change to the live site.
  criteria: Set toastify.settings status.duration to 10000, e.g. `drush cset toastify.settings status.duration
    10000 -y` or via ConfigFactory getEditable('toastify.settings')->set('status.duration', 10000)->save().
  bundle: toastify
  rubric_ref: rubric/toastify_toastify_set_duration@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/toastify-set-duration-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/toastify-set-duration-reset.sh
    verify: agent-module-documentation/evaluation/verify/toastify-set-duration-verify.sh
- id: toastify-disable-frontend
  input: On this Drupal site, keep Toastify toasts in the admin theme but stop them from appearing on
    the public (frontend) theme, using the module's configuration. Apply the change to the live site.
  criteria: Set toastify.settings enable_for.frontend_theme to false (leave enable_for.admin_theme true),
    e.g. `drush cset toastify.settings enable_for.frontend_theme false -y`.
  bundle: toastify
  rubric_ref: rubric/toastify_toastify_disable_frontend@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/toastify-disable-frontend-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/toastify-disable-frontend-reset.sh
    verify: agent-module-documentation/evaluation/verify/toastify-disable-frontend-verify.sh
