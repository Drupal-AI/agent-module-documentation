metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: toc_js_per_node
  version: 3.6.x
  note: 'Submodule of Toc.js. Adds a boolean node base field toc_js_active and a per-content-type opt-in
    stored as node type third-party settings under toc_js_per_node: ''override'' (permit per-node enable/disable)
    and ''override_default'' (default node state). The content type must already have toc_js.toc_js_active
    TRUE. Provides block plugin toc_js_per_node_block (extends TocJsBlock, adds override_nodetype) and
    permission ''administer toc_js per node''. Requires node+toc_js. No configure route/Drush. Introspection
    reads the per-node third-party settings; execution enables the per-node override and places a toc_js_per_node_block.
    Namespaced content types (tocjspn_*) and block, no node operations (safe on this shared site).'
questions:
- id: toc_js_per_node-field
  input: How does the toc_js_per_node module let editors turn the table of contents on or off for one
    node, and what has to be enabled on the content type first?
  criteria: It adds a boolean node base field toc_js_active and a per-node 'Display a table of contents'
    checkbox on the node form. The content type must have Toc.js enabled and the 'Permit to enable/disable
    toc per node' setting (third-party setting toc_js_per_node.override) turned on.
  bundle: toc_js_per_node
  rubric_ref: rubric/toc_js_per_node_toc_js_per_node_field@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: toc_js_per_node-block
  input: Which block does toc_js_per_node provide, and what extra option does it add over the standard
    Toc.js block?
  criteria: It provides the toc_js_per_node_block ('Toc.js per node block'), which extends the Toc.js
    block and adds an 'Override node type configuration' (override_nodetype) option; when off it uses
    the node type's TOC settings, and it always respects each node's toc_js_active flag.
  bundle: toc_js_per_node
  rubric_ref: rubric/toc_js_per_node_toc_js_per_node_block@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: toc_js_per_node-permission
  input: Which permission controls who can toggle the per-node table of contents in toc_js_per_node?
  criteria: The 'administer toc_js per node' permission (or core's 'administer nodes') gates the per-node
    'Display a table of contents' checkbox on the node form.
  bundle: toc_js_per_node
  rubric_ref: rubric/toc_js_per_node_toc_js_per_node_permission@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: toc_js_per_node-known-override
  input: On this Drupal site the content type tocjspn_doc uses Toc.js. Inspect the live configuration
    and state whether per-node override of the table of contents is enabled for it.
  criteria: 'Yes: node.type.tocjspn_doc third_party_settings.toc_js_per_node.override is TRUE (per-node
    override enabled).'
  bundle: toc_js_per_node
  rubric_ref: rubric/toc_js_per_node_toc_js_per_node_known_override@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/toc_js_per_node-known-override-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/toc_js_per_node-known-override-cleanup.sh
- id: toc_js_per_node-known-default
  input: On this Drupal site the content type tocjspn_def has per-node Toc.js override enabled. Inspect
    the live configuration and state the default per-node table-of-contents state (override_default) —
    is it enabled or disabled by default?
  criteria: node.type.tocjspn_def third_party_settings.toc_js_per_node.override_default is FALSE, i.e.
    new nodes default to the TOC being disabled.
  bundle: toc_js_per_node
  rubric_ref: rubric/toc_js_per_node_toc_js_per_node_known_default@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/toc_js_per_node-known-default-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/toc_js_per_node-known-default-cleanup.sh
- id: toc_js_per_node-enable-override
  input: On this Drupal site the content type tocjspn_page has Toc.js enabled but does not yet allow per-node
    control. Using toc_js_per_node, enable per-node override of the table of contents for tocjspn_page
    and apply it to the live site.
  criteria: Set node.type.tocjspn_page third_party_settings.toc_js_per_node.override = TRUE (setThirdPartySetting('toc_js_per_node','override',TRUE))
    and save.
  bundle: toc_js_per_node
  rubric_ref: rubric/toc_js_per_node_toc_js_per_node_enable_override@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/toc_js_per_node-enable-override-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/toc_js_per_node-enable-override-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/toc_js_per_node-enable-override-verify.sh
- id: toc_js_per_node-place-block
  input: On this Drupal site, place a Toc.js per node block (the toc_js_per_node_block plugin) in a region,
    with id tocjspn_testblock, and apply it to the live site.
  criteria: Create a Block config entity with plugin 'toc_js_per_node_block' (id tocjspn_testblock) in
    the default theme in a region, with settings including override_nodetype and the toc_js defaultSettings,
    then save.
  bundle: toc_js_per_node
  rubric_ref: rubric/toc_js_per_node_toc_js_per_node_place_block@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/toc_js_per_node-place-block-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/toc_js_per_node-place-block-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/toc_js_per_node-place-block-verify.sh
