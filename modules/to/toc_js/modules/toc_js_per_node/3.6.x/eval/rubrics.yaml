rubrics:
- id: toc_js_per_node_toc_js_per_node_field
  version: '1.0'
  applicable_bundles:
  - toc_js_per_node
  checks:
  - kind: must_contain_any
    values:
    - toc_js_active
    - override
  scoring:
    combine: all_pass
- id: toc_js_per_node_toc_js_per_node_block
  version: '1.0'
  applicable_bundles:
  - toc_js_per_node
  checks:
  - kind: must_contain_any
    values:
    - toc_js_per_node_block
  scoring:
    combine: all_pass
- id: toc_js_per_node_toc_js_per_node_permission
  version: '1.0'
  applicable_bundles:
  - toc_js_per_node
  checks:
  - kind: must_contain_any
    values:
    - administer toc_js per node
  scoring:
    combine: all_pass
- id: toc_js_per_node_toc_js_per_node_known_override
  version: '1.0'
  applicable_bundles:
  - toc_js_per_node
  checks:
  - kind: must_contain_any
    values:
    - 'true'
    - enabled
    - 'yes'
    - '1'
    - 'TRUE'
  scoring:
    combine: all_pass
- id: toc_js_per_node_toc_js_per_node_known_default
  version: '1.0'
  applicable_bundles:
  - toc_js_per_node
  checks:
  - kind: must_contain_any
    values:
    - disabled
    - 'false'
    - '0'
    - 'FALSE'
  scoring:
    combine: all_pass
- id: toc_js_per_node_toc_js_per_node_enable_override
  version: '1.0'
  applicable_bundles:
  - toc_js_per_node
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
- id: toc_js_per_node_toc_js_per_node_place_block
  version: '1.0'
  applicable_bundles:
  - toc_js_per_node
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
