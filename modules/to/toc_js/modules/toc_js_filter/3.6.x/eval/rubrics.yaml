rubrics:
- id: toc_js_filter_toc_js_filter_token
  version: '1.0'
  applicable_bundles:
  - toc_js_filter
  checks:
  - kind: must_contain_any
    values:
    - '[toc]'
    - toc_js_filter
  scoring:
    combine: all_pass
- id: toc_js_filter_toc_js_filter_enable
  version: '1.0'
  applicable_bundles:
  - toc_js_filter
  checks:
  - kind: must_contain_any
    values:
    - text format
    - filter
  scoring:
    combine: all_pass
- id: toc_js_filter_toc_js_filter_reuses_settings
  version: '1.0'
  applicable_bundles:
  - toc_js_filter
  checks:
  - kind: must_contain_any
    values:
    - toc_js
    - TocJsService
    - client
  scoring:
    combine: all_pass
- id: toc_js_filter_toc_js_filter_known_format
  version: '1.0'
  applicable_bundles:
  - toc_js_filter
  checks:
  - kind: must_contain_any
    values:
    - tocjsf_intro
  scoring:
    combine: all_pass
- id: toc_js_filter_toc_js_filter_known_selectors
  version: '1.0'
  applicable_bundles:
  - toc_js_filter
  checks:
  - kind: must_contain_any
    values:
    - h2,h3,h4
  scoring:
    combine: all_pass
- id: toc_js_filter_toc_js_filter_enable_on_format
  version: '1.0'
  applicable_bundles:
  - toc_js_filter
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
- id: toc_js_filter_toc_js_filter_create_format
  version: '1.0'
  applicable_bundles:
  - toc_js_filter
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
