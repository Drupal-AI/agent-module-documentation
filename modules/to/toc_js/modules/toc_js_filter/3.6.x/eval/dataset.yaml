metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: toc_js_filter
  version: 3.6.x
  note: 'Submodule of Toc.js. Provides a text-format filter plugin toc_js_filter (title ''TOC.js shortcode:
    [toc]'') that replaces [toc] in text with a Toc.js table of contents; settings mirror the Toc.js block
    settings (schema filter_settings.toc_js_filter). Enable it on a text format (filter.format.<id> ->
    filters.toc_js_filter.status: true). Requires toc_js. No settings page/configure route/permissions/Drush.
    Introspection reads which format has the filter and its settings; execution enables the filter on
    a format and creates a format with the filter. Uses namespaced text formats (tocjsf_*), no node operations
    (safe on this shared site).'
questions:
- id: toc_js_filter-token
  input: What token does the toc_js_filter module let editors put in body text, and what is it replaced
    with? What is the filter plugin id?
  criteria: 'The filter (plugin id toc_js_filter, ''TOC.js shortcode: [toc]'') replaces the [toc] token
    in text with a rendered Toc.js table of contents.'
  bundle: toc_js_filter
  rubric_ref: rubric/toc_js_filter_toc_js_filter_token@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: toc_js_filter-enable
  input: How do I turn on the Toc.js [toc] shortcode so it works in my content?
  criteria: 'Enable the ''TOC.js shortcode: [toc]'' filter (toc_js_filter) on the text format(s) you use
    (e.g. Full HTML) at Administration > Configuration > Content authoring > Text formats and editors,
    then configure its settings. Any [toc] in a field using that format renders a TOC.'
  bundle: toc_js_filter
  rubric_ref: rubric/toc_js_filter_toc_js_filter_enable@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: toc_js_filter-reuses-settings
  input: What settings does the toc_js_filter [toc] filter offer, and where does the table of contents
    markup actually get generated?
  criteria: Its settings form reuses the Toc.js settings (TocJsService::getTocForm) — selectors, container,
    list type, smooth scrolling, back-to-top, etc. — stored under schema filter_settings.toc_js_filter.
    The TOC list itself is still generated client-side by the toc.js library; the filter injects an empty
    .toc-js container where [toc] was.
  bundle: toc_js_filter
  rubric_ref: rubric/toc_js_filter_toc_js_filter_reuses_settings@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: toc_js_filter-known-format
  input: On this Drupal site, exactly one text format has the Toc.js [toc] filter (toc_js_filter) enabled.
    Inspect the live text formats and give the machine name (format id) of that format.
  criteria: The text format tocjsf_intro has filters.toc_js_filter.status = true.
  bundle: toc_js_filter
  rubric_ref: rubric/toc_js_filter_toc_js_filter_known_format@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/toc_js_filter-known-format-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/toc_js_filter-known-format-cleanup.sh
- id: toc_js_filter-known-selectors
  input: On this Drupal site the text format tocjsf_sel has the Toc.js [toc] filter enabled with custom
    heading selectors. Inspect the live filter configuration and state the selectors value.
  criteria: filter.format.tocjsf_sel filters.toc_js_filter.settings.selectors is 'h2,h3,h4'.
  bundle: toc_js_filter
  rubric_ref: rubric/toc_js_filter_toc_js_filter_known_selectors@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/toc_js_filter-known-selectors-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/toc_js_filter-known-selectors-cleanup.sh
- id: toc_js_filter-enable-on-format
  input: On this Drupal site there is a text format tocjsf_build that does not yet have the Toc.js [toc]
    filter. Enable the toc_js_filter filter on that format and apply it to the live site.
  criteria: 'Enable the filter: $format = FilterFormat::load(''tocjsf_build''); $format->setFilterConfig(''toc_js_filter'',
    [''status''=>TRUE,''weight''=>0,''settings''=>[]]); $format->save(); so filter.format.tocjsf_build
    filters.toc_js_filter.status is true.'
  bundle: toc_js_filter
  rubric_ref: rubric/toc_js_filter_toc_js_filter_enable_on_format@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/toc_js_filter-enable-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/toc_js_filter-enable-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/toc_js_filter-enable-verify.sh
- id: toc_js_filter-create-format
  input: On this Drupal site, create a new text format with machine name tocjsf_new that has the Toc.js
    [toc] filter (toc_js_filter) enabled, and apply it to the live site.
  criteria: Create a FilterFormat 'tocjsf_new' and enable toc_js_filter on it (setFilterConfig with status
    TRUE), then save, so filter.format.tocjsf_new filters.toc_js_filter.status is true.
  bundle: toc_js_filter
  rubric_ref: rubric/toc_js_filter_toc_js_filter_create_format@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/toc_js_filter-create-format-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/toc_js_filter-create-format-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/toc_js_filter-create-format-verify.sh
