metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: toc_js
  version: 3.6.x
  note: 'Toc.js builds a client-side table of contents. Two surfaces: a per-content-type node extra field
    ''toc_js'' and the toc_js_block block plugin. Per-content-type config is stored as node type third-party
    settings under ''toc_js'' (toc_js_active + ~40 keys from TocJsService::defaultSettings(); defaults
    selectors h2,h3, container .node). Permission ''administer toc_js''. Requires node+block. No configure
    route/Drush. Introspection reads node-type third-party toc_js settings; execution enables the TOC
    + places the extra field, and places a toc_js_block. Uses namespaced content types (tocjs_*) and a
    namespaced block, no node operations (safe on this shared site).'
questions:
- id: toc_js-two-surfaces
  input: The Drupal Toc.js module can display a table of contents in two different ways. What are the
    two ways to add a Toc.js table of contents to a page?
  criteria: 1) A per-content-type node extra field ('toc_js') that you enable on the content type and
    place in Manage display; 2) the toc_js_block block plugin ('Toc.js block') that you place in any region
    for any page.
  bundle: toc_js
  rubric_ref: rubric/toc_js_toc_js_two_surfaces@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: toc_js-where-stored
  input: When you enable Toc.js for a content type in Drupal, where are those TOC settings (like whether
    it's active and the heading selectors) stored?
  criteria: 'As third-party settings on the node.type.<bundle> config entity, under the ''toc_js'' namespace:
    toc_js_active plus ~40 option keys (title, selectors, container, list_type, smooth_scrolling, etc.).'
  bundle: toc_js
  rubric_ref: rubric/toc_js_toc_js_where_stored@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: toc_js-defaults
  input: By default, which headings does Toc.js turn into a table of contents, and where is the TOC actually
    generated?
  criteria: By default it collects h2,h3 headings inside the .node container (defaults from TocJsService::defaultSettings()),
    and the table of contents is generated client-side in the browser by the toc.js JavaScript library
    reading data-* attributes.
  bundle: toc_js
  rubric_ref: rubric/toc_js_toc_js_defaults@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: toc_js-known-title
  input: On this Drupal site a content type with machine name tocjs_doc has Toc.js enabled. Inspect the
    live content type configuration and state the TOC title text that has been set for it.
  criteria: node.type.tocjs_doc third_party_settings.toc_js.title is 'In this article' (and toc_js_active
    is true).
  bundle: toc_js
  rubric_ref: rubric/toc_js_toc_js_known_title@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/toc_js-known-title-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/toc_js-known-title-cleanup.sh
- id: toc_js-known-selectors
  input: On this Drupal site the content type tocjs_sel has Toc.js enabled with custom heading selectors.
    Inspect the live configuration and state the heading selectors it uses.
  criteria: node.type.tocjs_sel third_party_settings.toc_js.selectors is 'h1,h2,h3'.
  bundle: toc_js
  rubric_ref: rubric/toc_js_toc_js_known_selectors@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/toc_js-known-selectors-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/toc_js-known-selectors-cleanup.sh
- id: toc_js-enable-type
  input: On this Drupal site the content type tocjs_page exists with Toc.js disabled. Using Toc.js, enable
    the table of contents for tocjs_page and place the Toc extra field on its default view display. Apply
    the changes to the live site.
  criteria: Set node.type.tocjs_page third_party_settings.toc_js.toc_js_active = TRUE (setThirdPartySetting)
    and save, then add the 'toc_js' extra field component to core.entity_view_display.node.tocjs_page.default
    and save.
  bundle: toc_js
  rubric_ref: rubric/toc_js_toc_js_enable_type@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/toc_js-enable-type-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/toc_js-enable-type-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/toc_js-enable-type-verify.sh
- id: toc_js-place-block
  input: On this Drupal site, place a Toc.js block (the toc_js_block plugin) in a region so a table of
    contents is shown. Create it with id tocjs_testblock and apply it to the live site.
  criteria: Create a Block config entity with plugin 'toc_js_block' (id tocjs_testblock) placed in the
    default theme in a region (e.g. content), with settings including the toc_js.service defaultSettings,
    then save.
  bundle: toc_js
  rubric_ref: rubric/toc_js_toc_js_place_block@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/toc_js-place-block-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/toc_js-place-block-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/toc_js-place-block-verify.sh
