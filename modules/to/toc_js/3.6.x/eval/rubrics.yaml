rubrics:
- id: toc_js_toc_js_two_surfaces
  version: '1.0'
  applicable_bundles:
  - toc_js
  checks:
  - kind: must_contain_any
    values:
    - block
    - extra field
  scoring:
    combine: all_pass
- id: toc_js_toc_js_where_stored
  version: '1.0'
  applicable_bundles:
  - toc_js
  checks:
  - kind: must_contain_any
    values:
    - third_party_settings
    - third party setting
    - toc_js_active
    - node type
  scoring:
    combine: all_pass
- id: toc_js_toc_js_defaults
  version: '1.0'
  applicable_bundles:
  - toc_js
  checks:
  - kind: must_contain_any
    values:
    - h2,h3
    - client-side
    - client side
  scoring:
    combine: all_pass
- id: toc_js_toc_js_known_title
  version: '1.0'
  applicable_bundles:
  - toc_js
  checks:
