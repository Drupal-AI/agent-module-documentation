    verify: agent-module-documentation/evaluation/verify/token_views_filter-enable-current-user-verify.sh
- id: token_views_filter-enable-site-name
  input: The View 'tvf_build' on this site has a 'title' string filter without token support. Make that
    filter's value resolve to the site name using token_views_filter (token [site:name]) and apply it
