rubrics:
- id: token_views_filter_token_views_filter_which_filters
  version: '1.0'
  applicable_bundles:
  - token_views_filter
  checks:
  - kind: must_contain_any
    values:
    - Use tokens
    - use_tokens
    - token
  scoring:
    combine: all_pass
- id: token_views_filter_token_views_filter_storage
  version: '1.0'
  applicable_bundles:
  - token_views_filter
  checks:
  - kind: must_contain_any
    values:
    - views.view
    - use_tokens
    - preQuery
    - token
    - replace
  scoring:
    combine: all_pass
- id: token_views_filter_token_views_filter_example_token
  version: '1.0'
  applicable_bundles:
  - token_views_filter
  checks:
  - kind: must_contain_any
    values:
    - '[current-user:uid]'
    - current-user
    - current_user
  scoring:
    combine: all_pass
- id: token_views_filter_token_views_filter_known_value
  version: '1.0'
  applicable_bundles:
  - token_views_filter
  checks:
  - kind: must_contain_any
    values:
    - '[current-user:uid]'
    - current-user:uid
  scoring:
    combine: all_pass
- id: token_views_filter_token_views_filter_which_enabled
  version: '1.0'
  applicable_bundles:
  - token_views_filter
  checks:
  - kind: must_contain_any
    values:
    - title
  scoring:
    combine: all_pass
- id: token_views_filter_token_views_filter_enable_current_user
  version: '1.0'
  applicable_bundles:
  - token_views_filter
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
- id: token_views_filter_token_views_filter_enable_site_name
  version: '1.0'
  applicable_bundles:
  - token_views_filter
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
