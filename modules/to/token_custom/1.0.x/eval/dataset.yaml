    setup: agent-module-documentation/evaluation/verify/token_custom-known-type-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/token_custom-known-type-cleanup.sh
- id: token_custom-create-token
  input: 'On this Drupal site, use the token_custom module to create a custom token with machine name
    ''tc_task'' under the default ''custom'' token type, whose content is exactly the text: Support ticket
    resolved. Apply it to the live site so that [custom:tc_task] resolves to that text.'
  criteria: A token_custom entity with machine_name tc_task, bundle 'custom', content value 'Support ticket
    resolved' exists (e.g. via the Add Token form or TokenCustom::create([...])->save()), so \Drupal::token()->replace('[custom:tc_task]')
    returns text containing 'Support ticket resolved'.
  bundle: token_custom
  rubric_ref: rubric/token_custom_token_custom_create_token@1.0
