metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: token_custom
  version: 1.0.x
  note: 'Custom Tokens defines two entity types: token_custom (translatable content entity, base table
    token_custom; fields name, machine_name, type[bundle], description, content[text_long value+format])
    and token_custom_type (config bundle entity, config name token_custom.type.<machineName>; default
    type ''custom'' ships in config/install). Tokens resolve as [<type>:<machine_name>] via hook_token_info
    + hook_tokens using getFormattedContent()=check_markup(value,format), guarded by the cached allowlist
    token_custom.allowlist. Managed at /admin/structure/token-custom (configure route entity.token_custom.collection).
    Permissions: administer custom tokens, administer custom token types, access custom tokens overview.
    No Drush, no plugin types. Medium/hard cases are grounded in real entities: introspection reads back
    an existing token/type; execution creates a token (and a token type) and is verified by actually replacing
    the token via \Drupal::token().'
questions:
- id: token_custom-token-syntax
  input: Using the Drupal token_custom (Custom Tokens) module, if I create a custom token with machine
    name 'company_name' under the default token type, what token string do I use to output it, and where
    do I create it in the admin UI?
  criteria: Use [custom:company_name] (the default token type is 'custom'). Create it at Administration
    > Structure > Custom tokens (/admin/structure/token-custom) via 'Add Token', choosing the token type
    and entering the machine name and content.
  bundle: token_custom
  rubric_ref: rubric/token_custom_token_custom_token_syntax@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: token_custom-entities
  input: What two entity types does the token_custom module define, and which one is a configuration bundle?
    What default token type ships with the module?
  criteria: token_custom is a content entity (each token); token_custom_type is a config bundle entity
    grouping tokens into types. The default token type that ships in config/install is 'custom' (so tokens
    are [custom:...]).
  bundle: token_custom
  rubric_ref: rubric/token_custom_token_custom_entities@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: token_custom-permissions
  input: Which permissions does token_custom provide for controlling who can manage custom tokens and
    token types?
  criteria: 'Three permissions: ''administer custom tokens'' (create/edit/delete tokens, restricted),
    ''administer custom token types'' (manage token types, restricted), and ''access custom tokens overview''
    (view the overview page).'
  bundle: token_custom
  rubric_ref: rubric/token_custom_token_custom_permissions@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: token_custom-known-token
  input: This Drupal site has one custom token defined with the token_custom module. Inspect the live
    site and tell me the token's machine name and the text it outputs.
  criteria: The token is tc_greeting (type 'custom'); its content is 'Welcome to Example Co', so [custom:tc_greeting]
    outputs that text.
  bundle: token_custom
  rubric_ref: rubric/token_custom_token_custom_known_token@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/token_custom-known-token-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/token_custom-known-token-cleanup.sh
- id: token_custom-known-type
  input: Besides the default 'custom' token type, a custom token TYPE has been created on this site with
    the token_custom module. Inspect the live configuration and give the machine name of that additional
    token type.
  criteria: The additional custom token type is tc_promo (config entity token_custom.type.tc_promo), alongside
    the default 'custom' type.
  bundle: token_custom
  rubric_ref: rubric/token_custom_token_custom_known_type@1.0
  tags:
  - mode:introspection
  - difficulty:medium
