questions:
- id: token-browser-in-form
  input: In a Drupal 11 module I have a settings form. Add a widget that lets the user browse the available
    tokens for the `node` and `user` token types. Show the exact form render-array element(s) to add,
    plus one line of explanation.
  criteria: 'Adds token''s UI element: #theme => ''token_tree_link'' (or #type => ''token_tree_table'')
    with #token_types => [''node'', ''user''].'
  bundle: token
  rubric_ref: rubric/token_token_browser_in_form@1.0
  tags:
  - mode:recipe
- id: token-refresh-cache
  input: I added a new custom token via hook_token_info() on this Drupal site but it does not appear in
    the token browser yet. Give the single drush command to refresh it.
  criteria: drush cache:clear token (or drush cr).
  bundle: token
  rubric_ref: rubric/token_token_refresh_cache@1.0
  tags:
  - mode:recipe
- id: token-replace-in-code
  input: In PHP on a Drupal 11 site, replace the tokens in the string `[node:title]` for a given `$node`
    object and return the resulting text. Show the code.
  criteria: 'Uses the token service: \Drupal::token()->replace(''[node:title]'', [''node'' => $node]).'
  bundle: token
  rubric_ref: rubric/token_token_replace_in_code@1.0
  tags:
  - mode:recipe
- id: token-provide-custom
  input: I want to define a brand-new custom token for my module (its metadata and its value). Which two
    Drupal hooks do I implement? Name them.
  criteria: hook_token_info() to declare it and hook_tokens() to produce its value.
  bundle: token
  rubric_ref: rubric/token_token_provide_custom@1.0
  tags:
  - mode:recipe
- id: token-entity-mapping
  input: In code on this Drupal site, how do I get the token *type* name for the `taxonomy_term` entity
    type (it should resolve to `term`)? Name the service or method to use.
  criteria: The token.entity_mapper service (TokenEntityMapperInterface)->getTokenTypeForEntityType('taxonomy_term').
  bundle: token
  rubric_ref: rubric/token_token_entity_mapping@1.0
  tags:
  - mode:recipe
