rubrics:
- id: token_token_browser_in_form
  version: '1.0'
  applicable_bundles:
  - token
  checks:
  - kind: must_contain_any
    values:
    - token_tree_link
    - token_tree_table
  scoring:
    combine: all_pass
- id: token_token_refresh_cache
  version: '1.0'
  applicable_bundles:
  - token
  checks:
  - kind: must_contain_any
    values:
    - cache:clear token
    - cc token
    - drush cr
  scoring:
    combine: all_pass
- id: token_token_replace_in_code
  version: '1.0'
  applicable_bundles:
  - token
  checks:
  - kind: must_contain_any
    values:
    - ->replace(
    - \Drupal::token()
  scoring:
    combine: all_pass
- id: token_token_provide_custom
  version: '1.0'
  applicable_bundles:
  - token
  checks:
  - kind: must_contain_any
    values:
    - hook_token_info
    - hook_tokens
  scoring:
    combine: all_pass
- id: token_token_entity_mapping
  version: '1.0'
  applicable_bundles:
  - token
  checks:
  - kind: must_contain_any
    values:
    - token.entity_mapper
    - getTokenTypeForEntityType
    - TokenEntityMapper
  scoring:
    combine: all_pass
