- id: tls-add-language
  input: This Drupal site currently only has English enabled, so the toolbar language switcher has nothing
    to switch to. Enable the German (de) language so the switcher can offer it. Apply the change to the
    live site.
  criteria: The German language (langcode de) is added and enabled (via /admin/config/regional/language/add,
    `drush language:add de`, or ConfigurableLanguage::createFromLangcode('de')->save()), so \Drupal::languageManager()->getLanguages()
    includes 'de'.
  bundle: toolbar_language_switcher
  rubric_ref: rubric/toolbar_language_switcher_tls_add_language@1.0
