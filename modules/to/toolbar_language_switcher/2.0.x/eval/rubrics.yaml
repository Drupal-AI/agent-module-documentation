rubrics:
- id: toolbar_language_switcher_tls_how_appears
  version: '1.0'
  applicable_bundles:
  - toolbar_language_switcher
  checks:
  - kind: must_contain_any
    values:
    - hook_toolbar
    - use toolbar_language_switcher
    - toolbar_item
  scoring:
    combine: all_pass
- id: toolbar_language_switcher_tls_links_source
  version: '1.0'
  applicable_bundles:
  - toolbar_language_switcher
  checks:
  - kind: must_contain_any
    values:
    - tls.render.builder
    - getLanguageSwitchLinks
    - language_manager
  scoring:
    combine: all_pass
- id: toolbar_language_switcher_tls_config_deps
  version: '1.0'
  applicable_bundles:
  - toolbar_language_switcher
  checks:
  - kind: must_contain_any
    values:
    - no configuration
    - no settings
    - no configure
    - toolbar
    - language
  scoring:
    combine: all_pass
- id: toolbar_language_switcher_tls_known_role
  version: '1.0'
  applicable_bundles:
  - toolbar_language_switcher
  checks:
  - kind: must_contain_any
    values:
    - tls_eval_role
  scoring:
    combine: all_pass
- id: toolbar_language_switcher_tls_known_language
  version: '1.0'
  applicable_bundles:
  - toolbar_language_switcher
  checks:
  - kind: must_contain_any
    values:
    - es
  scoring:
    combine: all_pass
- id: toolbar_language_switcher_tls_grant_perm
  version: '1.0'
  applicable_bundles:
  - toolbar_language_switcher
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
- id: toolbar_language_switcher_tls_add_language
  version: '1.0'
  applicable_bundles:
  - toolbar_language_switcher
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
