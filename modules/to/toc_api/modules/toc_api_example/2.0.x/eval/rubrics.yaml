rubrics:
- id: toc_api_example_toc_api_example_which_hook
  version: '1.0'
  applicable_bundles:
  - toc_api_example
  checks:
  - kind: must_contain_any
    values:
    - hook_node_view
    - node_view
  scoring:
    combine: all_pass
- id: toc_api_example_toc_api_example_which_types
  version: '1.0'
  applicable_bundles:
  - toc_api_example
  checks:
  - kind: must_contain_any
    values:
    - article
    - page
    - full
  scoring:
    combine: all_pass
- id: toc_api_example_toc_api_example_when_visible
  version: '1.0'
  applicable_bundles:
  - toc_api_example
  checks:
  - kind: must_contain_any
    values:
    - isVisible
    - header_count
    - two
    - '2 '
    - top-level headers
    - enough headers
  scoring:
    combine: all_pass
- id: toc_api_example_toc_api_example_default_title
