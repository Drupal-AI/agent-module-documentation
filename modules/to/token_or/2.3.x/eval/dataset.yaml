metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: token_or
  version: 2.3.x
  note: 'Token Or is pure token syntax on top of the Token module: OR/fallback with ''|'', literal-string
    fallback with quotes, a swapped ''token'' service, and a ''tokens_pre'' alter. No UI, no config, no
    plugin type. Cases are `recipe` (response-graded), probing documented facts an agent would otherwise
    read source to answer; no site mutation.'
questions:
- id: token-or-fallback-syntax
  input: On a Drupal 11 site with the token_or module, I want a token that uses an Open Graph image field,
    but falls back to a header image field if the first is empty. Write the token expression.
  criteria: A single bracketed token whose candidates are separated by pipes, e.g. [node:field_og_image:entity:url|node:field_header_image:entity:url];
    the first non-empty candidate wins.
  bundle: token_or
  rubric_ref: rubric/token_or_token_or_fallback_syntax@1.0
  tags:
  - mode:recipe
- id: token-or-literal-string-fallback
  input: Using token_or, how do I add a hard-coded default string as the final fallback when every token
    in the chain is empty? Show an example.
  criteria: Wrap the literal in double quotes as the last candidate, e.g. [node:field_summary|"No description."];
    a quoted candidate is used verbatim (quotes stripped).
  bundle: token_or
  rubric_ref: rubric/token_or_token_or_literal_string_fallback@1.0
  tags:
  - mode:recipe
- id: token-or-chain-multiple
  input: Can I chain more than two tokens with token_or, and how are candidates evaluated? Give a three-candidate
    example.
  criteria: Yes—any number of candidates separated by |, evaluated left to right; the first non-empty
    result wins, e.g. [node:field_a|node:field_b|"default"].
  bundle: token_or
  rubric_ref: rubric/token_or_token_or_chain_multiple@1.0
  tags:
  - mode:recipe
- id: token-or-depends-on-token
  input: What module does token_or require, and how does it make its OR syntax work everywhere tokens
    are replaced?
  criteria: It depends on the Token module (token:token). TokenOrServiceProvider swaps the core 'token'
    service for Drupal\token_or\Token, which fires a 'tokens_pre' alter before replacement to expand [a|b]
    groups.
  bundle: token_or
  rubric_ref: rubric/token_or_token_or_depends_on_token@1.0
  tags:
  - mode:recipe
- id: token-or-clear-option
  input: With token_or, what happens to an OR token group like [node:field_a|node:field_b] when none of
    the candidates resolve? How do I make it disappear entirely?
  criteria: Without options the original [a|b] text is left in place; passing the 'clear' option (['clear'
    => TRUE]) removes the unresolved group entirely.
  bundle: token_or
  rubric_ref: rubric/token_or_token_or_clear_option@1.0
  tags:
  - mode:recipe
- id: token-or-custom-token
  input: Does token_or provide a plugin type or 'modifier' plugin for adding custom fallback tokens? How
    do I make my own token usable inside a token_or OR chain?
  criteria: No—token_or has no plugin/modifier type. Register the token with the standard Token API (hook_token_info()
    + hook_tokens()); returning an empty string lets the next candidate win, and it participates in [..|..]
    automatically.
  bundle: token_or
  rubric_ref: rubric/token_or_token_or_custom_token@1.0
  tags:
  - mode:recipe
- id: token-or-pre-alter-service
  input: Which service in token_or actually parses the pipe (|) OR syntax, and which hook triggers it?
  criteria: The token_or.tokens_pre_alter service (TokenOrTokensPreAlter) parses the | syntax; it is invoked
    via hook_tokens_pre_alter(), fired by the overridden token service before replacement.
  bundle: token_or
  rubric_ref: rubric/token_or_token_or_pre_alter_service@1.0
  tags:
  - mode:recipe
