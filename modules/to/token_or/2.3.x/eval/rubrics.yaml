rubrics:
- id: token_or_token_or_fallback_syntax
  version: '1.0'
  applicable_bundles:
  - token_or
  checks:
  - kind: must_contain_any
    values:
    - '|'
  scoring:
    combine: all_pass
- id: token_or_token_or_literal_string_fallback
  version: '1.0'
  applicable_bundles:
  - token_or
  checks:
  - kind: must_contain_any
    values:
    - '"'
    - double quote
    - quotes
  scoring:
    combine: all_pass
- id: token_or_token_or_chain_multiple
  version: '1.0'
  applicable_bundles:
  - token_or
  checks:
  - kind: must_contain_any
    values:
    - left to right
    - first non-empty
    - first that is not empty
    - '|'
  scoring:
    combine: all_pass
- id: token_or_token_or_depends_on_token
  version: '1.0'
  applicable_bundles:
  - token_or
  checks:
  - kind: must_contain_any
    values:
    - token
    - TokenOrServiceProvider
    - tokens_pre
  scoring:
    combine: all_pass
- id: token_or_token_or_clear_option
  version: '1.0'
  applicable_bundles:
  - token_or
  checks:
  - kind: must_contain_any
    values:
    - clear
  scoring:
    combine: all_pass
- id: token_or_token_or_custom_token
  version: '1.0'
  applicable_bundles:
  - token_or
  checks:
  - kind: must_contain_any
    values:
    - hook_token_info
    - hook_tokens
    - no plugin
    - Token API
  scoring:
    combine: all_pass
- id: token_or_token_or_pre_alter_service
  version: '1.0'
  applicable_bundles:
  - token_or
  checks:
  - kind: must_contain_any
    values:
    - token_or.tokens_pre_alter
    - TokenOrTokensPreAlter
    - hook_tokens_pre_alter
  scoring:
    combine: all_pass
