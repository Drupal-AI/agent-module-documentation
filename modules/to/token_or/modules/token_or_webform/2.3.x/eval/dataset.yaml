metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: token_or_webform
  version: 2.3.x
  note: token_or_webform is a submodule of token_or that decorates Webform's webform.token_manager service
    so token_or's [a|b|"literal"] OR/fallback syntax works inside Webform, with special handling for anonymous
    [current-user:*] tokens. No UI, no config, no plugin type. Cases are `recipe` (response-graded); no
    site mutation.
questions:
- id: token-or-webform-purpose
  input: I have token_or installed but its [a|b|"default"] fallback tokens don't work inside my Webform
    email handler. Which module do I need and why?
  criteria: Enable the token_or_webform submodule. Webform replaces tokens via its own webform.token_manager
    service (not the core token service token_or overrides), so token_or_webform decorates it to honour
    the | fallback syntax.
  bundle: token_or_webform
  rubric_ref: rubric/token_or_webform_token_or_webform_purpose@1.0
  tags:
  - mode:recipe
- id: token-or-webform-decorator
  input: How does token_or_webform integrate with Webform's token system?
  criteria: It decorates the webform.token_manager service (decoration priority 50) with TokenOrWebformTokenManager,
    a subclass of WebformTokenManager that overrides replace().
  bundle: token_or_webform
  rubric_ref: rubric/token_or_webform_token_or_webform_decorator@1.0
  tags:
  - mode:recipe
- id: token-or-webform-anonymous
  input: With token_or_webform, what happens to a token like [current-user:display-name|"Guest"] in a
    Webform email when the submitter is anonymous?
  criteria: 'For anonymous users the current-user: candidate is stripped (so it doesn''t render ''Anonymous'')
    and the next candidate is used—here the literal ''Guest''.'
  bundle: token_or_webform
  rubric_ref: rubric/token_or_webform_token_or_webform_anonymous@1.0
  tags:
  - mode:recipe
- id: token-or-webform-clear
  input: When token_or_webform processes a Webform text value containing a piped OR token that resolves
    to nothing, is the leftover [a|b] text kept or removed?
  criteria: Removed—token_or_webform forces the 'clear' option on for piped text, so unresolved OR groups
    are stripped rather than left as literal [a|b].
  bundle: token_or_webform
  rubric_ref: rubric/token_or_webform_token_or_webform_clear@1.0
  tags:
  - mode:recipe
- id: token-or-webform-passthrough
  input: Does token_or_webform change how normal (non-piped) Webform tokens are replaced?
  criteria: No—only text containing a | pipe is special-cased; text without | and array input pass straight
    through to the normal Webform token manager unchanged.
  bundle: token_or_webform
  rubric_ref: rubric/token_or_webform_token_or_webform_passthrough@1.0
  tags:
  - mode:recipe
- id: token-or-webform-dependencies
  input: What modules must be enabled for token_or_webform to work?
  criteria: Both Webform (webform:webform) and Token Or (token_or:token_or); token_or_webform is a submodule
    of token_or.
  bundle: token_or_webform
  rubric_ref: rubric/token_or_webform_token_or_webform_dependencies@1.0
  tags:
  - mode:recipe
