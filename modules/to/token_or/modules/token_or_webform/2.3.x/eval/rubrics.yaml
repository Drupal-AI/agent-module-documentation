rubrics:
- id: token_or_webform_token_or_webform_purpose
  version: '1.0'
  applicable_bundles:
  - token_or_webform
  checks:
  - kind: must_contain_any
    values:
    - token_or_webform
    - webform.token_manager
  scoring:
    combine: all_pass
- id: token_or_webform_token_or_webform_decorator
  version: '1.0'
  applicable_bundles:
  - token_or_webform
  checks:
  - kind: must_contain_any
    values:
    - decorates
    - decorator
    - WebformTokenManager
    - webform.token_manager
  scoring:
    combine: all_pass
- id: token_or_webform_token_or_webform_anonymous
  version: '1.0'
  applicable_bundles:
  - token_or_webform
  checks:
  - kind: must_contain_any
    values:
    - Guest
    - current-user
    - anonymous
  scoring:
    combine: all_pass
- id: token_or_webform_token_or_webform_clear
  version: '1.0'
  applicable_bundles:
  - token_or_webform
  checks:
  - kind: must_contain_any
    values:
    - clear
    - removed
  scoring:
    combine: all_pass
- id: token_or_webform_token_or_webform_passthrough
  version: '1.0'
  applicable_bundles:
  - token_or_webform
  checks:
  - kind: must_contain_any
    values:
    - 'no'
    - unchanged
    - pass
    - '|'
  scoring:
    combine: all_pass
- id: token_or_webform_token_or_webform_dependencies
  version: '1.0'
  applicable_bundles:
  - token_or_webform
  checks:
  - kind: must_contain_any
    values:
    - webform
    - token_or
  scoring:
    combine: all_pass
