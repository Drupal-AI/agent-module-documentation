rubrics:
- id: views_remote_data_views_remote_data_query_plugin
  version: '1.0'
  applicable_bundles:
  - views_remote_data
  checks:
  - kind: must_contain_any
    values:
    - views_remote_data_query
    - query_id
    - RemoteDataQueryEvent
    - hook_views_data
  scoring:
    combine: all_pass
- id: views_remote_data_views_remote_data_property_handler
  version: '1.0'
  applicable_bundles:
  - views_remote_data
  checks:
