metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: views_remote_data
  version: 1.0.x
  note: Views Remote Data is an API-only module (no UI) that lets a View be driven by remote data. Its
    surface is the Views query plugin views_remote_data_query, the Property field/filter/argument/sort
    handlers (plugin id views_remote_data_property, configured with a property_path), two cache plugins
    (views_remote_data_time, views_remote_data_tag), a wizard, and two events (RemoteDataQueryEvent, RemoteDataLoadEntitiesEvent).
    There is no live remote data source on this site, so medium/hard cases are grounded in VIEW CONFIG
    that uses this module's real plugin ids (the view config saves fine even without a live base table;
    verification reads config, it does not execute the view). Medium cases create a known view and read
    its property_path / cache plugin; hard cases require the agent to author a view that uses the remote-data
    query plugin + property field, or to switch a view's cache plugin to the remote-data time cache.
questions:
- id: views_remote_data-query-plugin
  input: How do I make a Drupal View pull from a remote API using the views_remote_data module? What tells
    Views to route a base table through the remote query, and which events do I answer?
  criteria: 'Declare a Views base table (hook_views_data) whose base sets query_id: views_remote_data_query,
    then subscribe to RemoteDataQueryEvent (add ResultRow results, using the conditions/sorts/limit/offset)
    and optionally RemoteDataLoadEntitiesEvent (attach $row->_entity).'
  bundle: views_remote_data
  rubric_ref: rubric/views_remote_data_views_remote_data_query_plugin@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: views_remote_data-property-handler
  input: In a views_remote_data View, how do I map a nested key from each remote record to a Views field?
    What is the handler/plugin id and the setting used?
  criteria: Use the Property handler (plugin id views_remote_data_property) as the field/filter/argument/sort,
    configured with a property_path (a dot path into the result row, e.g. name or foo.bar).
  bundle: views_remote_data
  rubric_ref: rubric/views_remote_data_views_remote_data_property_handler@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: views_remote_data-cache-plugins
  input: What caching plugins does views_remote_data provide for a remote-data View, and what does each
    do?
  criteria: views_remote_data_time (time-based caching of raw results and rendered output, with configurable
    lifespans) and views_remote_data_tag (tag-based caching invalidated by the cache tags your event bubbles).
  bundle: views_remote_data
  rubric_ref: rubric/views_remote_data_views_remote_data_cache_plugins@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: views_remote_data-known-field
  input: This site has a View that uses the views_remote_data module. Inspect the live view configuration
    for the view with id 'vrd_intro' and tell me the property_path configured on its Property field.
  criteria: The Property field on vrd_intro has property_path 'card.title' (plugin_id views_remote_data_property).
  bundle: views_remote_data
  rubric_ref: rubric/views_remote_data_views_remote_data_known_field@1.0
  tags:
  - mode:introspection
  - difficulty:medium
