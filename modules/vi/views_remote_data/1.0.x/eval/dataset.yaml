    cleanup: agent-module-documentation/evaluation/verify/views_remote_data-known-field-cleanup.sh
- id: views_remote_data-known-cache
  input: On this site there is a remote-data View with id 'vrd_cacheview'. Inspect its live configuration
    and tell me which caching plugin its default display uses.
  criteria: vrd_cacheview uses the views_remote_data_time cache plugin (time-based remote-data caching).
  bundle: views_remote_data
  rubric_ref: rubric/views_remote_data_views_remote_data_known_cache@1.0
