metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: views_base_url
  version: 2.1.x
  note: 'Views Base URL adds one global Views field handler, base_url (''Global: Base url''), registered
    on the ''views'' table via hook_views_data_alter (views_base_url.views.inc). It has no settings form,
    no configure route (configure=null), no permissions, no Drush, and defines no plugin TYPES. The field
    prints RequestContext::getCompleteBaseUrl(); it can be referenced as the [base_url] token inside a
    Global: Custom text field, or rendered as a link via show_link + show_link_options (link_path, link_text,
    link_class, link_title, link_rel, link_fragment, link_query, link_target), validated by schema views.field.base_url.
    All state lives in the view config under the base_url field handler. Medium/hard cases are grounded
    in that real view config: introspection reads back a base_url field''s link options; execution adds
    the base_url field to a view or turns it into a link with a link_path, verified against the live views.view
    config.'
questions:
- id: views_base_url-which-field
  input: In a Drupal View, I want to output the site's full base URL (like https://example.com). Using
    the views_base_url module, which field do I add to the view, and what is its handler/plugin id?
  criteria: 'Add the global field ''Global: Base url'' (handler/plugin id base_url), registered on the
    ''views'' table by views_base_url. It prints the complete base URL from RequestContext::getCompleteBaseUrl().'
  bundle: views_base_url
  rubric_ref: rubric/views_base_url_views_base_url_which_field@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: views_base_url-token
  input: Using views_base_url, how do I build a custom absolute link like <a href="...">Home</a> in a
    View so the href includes the site's base URL? What replacement token do I use and in which field?
  criteria: 'Add the Global: Base url field (tick Exclude from display), then add a Global: Custom text
    field below it and reference [base_url], e.g. <a href="[base_url]/home">Home</a>. Field order matters:
    the Custom text must come after the base_url field.'
  bundle: views_base_url
  rubric_ref: rubric/views_base_url_views_base_url_token@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: views_base_url-link-options
  input: The views_base_url 'Base url' field can render itself as a link instead of plain text. Which
    option turns that on, and name some of the link sub-options you can set (path, text, class, query,
    etc.)?
  criteria: 'Tick ''Display as link'' (show_link). Then set show_link_options: link_path (a Drupal path
    appended to the base URL), link_text, link_class, link_title, link_rel, link_fragment, link_query,
    link_target. Several accept {{ token }} replacement patterns.'
  bundle: views_base_url
  rubric_ref: rubric/views_base_url_views_base_url_link_options@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: views_base_url-known-field
  input: On this Drupal site there is a View with machine id 'views_base_url_intro' that uses the views_base_url
    'Base url' field rendered as a link. Inspect the live view configuration and tell me the link_path
    configured on that field.
  criteria: In views.view.views_base_url_intro the base_url field has show_link true and show_link_options.link_path
    = node/1.
  bundle: views_base_url
  rubric_ref: rubric/views_base_url_views_base_url_known_field@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/views_base_url-known-field-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/views_base_url-known-field-cleanup.sh
- id: views_base_url-known-class
  input: On this Drupal site there is a View with machine id 'views_base_url_style' whose views_base_url
    'Base url' field is rendered as a link with a custom CSS class. Inspect the live view configuration
    and tell me the CSS class configured for that link.
  criteria: In views.view.views_base_url_style the base_url field has show_link_options.link_class = vbu-highlight.
  bundle: views_base_url
  rubric_ref: rubric/views_base_url_views_base_url_known_class@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/views_base_url-known-class-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/views_base_url-known-class-cleanup.sh
- id: views_base_url-add-field
  input: 'On this Drupal site there is a View with machine id ''views_base_url_task'' whose default display
    only shows the node title. Using the views_base_url module, add its ''Global: Base url'' field to
    this view''s default display so the view outputs the site''s base URL. Apply the change to the live
    site.'
  criteria: The default display of views.view.views_base_url_task gains a field handler using the base_url
    plugin (table views, field/id base_url).
  bundle: views_base_url
  rubric_ref: rubric/views_base_url_views_base_url_add_field@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/views_base_url-add-field-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/views_base_url-add-field-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/views_base_url-add-field-verify.sh
- id: views_base_url-make-link
  input: On this Drupal site the View 'views_base_url_link_task' already has the views_base_url 'Base
    url' field, but it currently renders as plain text. Configure that field to render as a link (Display
    as link) pointing to the Drupal path 'node/1', and apply the change to the live site.
  criteria: In views.view.views_base_url_link_task the base_url field gets show_link = true and show_link_options.link_path
    = node/1.
  bundle: views_base_url
  rubric_ref: rubric/views_base_url_views_base_url_make_link@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/views_base_url-make-link-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/views_base_url-make-link-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/views_base_url-make-link-verify.sh
