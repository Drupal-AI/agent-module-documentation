rubrics:
- id: views_base_url_views_base_url_which_field
  version: '1.0'
  applicable_bundles:
  - views_base_url
  checks:
  - kind: must_contain_any
    values:
    - 'Global: Base url'
    - base_url
    - Base url
  scoring:
    combine: all_pass
- id: views_base_url_views_base_url_token
  version: '1.0'
  applicable_bundles:
  - views_base_url
  checks:
  - kind: must_contain_any
    values:
    - '[base_url]'
    - base_url
    - Custom text
    - 'Global: Custom text'
  scoring:
    combine: all_pass
- id: views_base_url_views_base_url_link_options
  version: '1.0'
  applicable_bundles:
  - views_base_url
  checks:
  - kind: must_contain_any
    values:
    - show_link
    - Display as link
    - link_path
    - show_link_options
  scoring:
    combine: all_pass
- id: views_base_url_views_base_url_known_field
  version: '1.0'
  applicable_bundles:
  - views_base_url
  checks:
  - kind: must_contain_any
    values:
    - node/1
  scoring:
    combine: all_pass
- id: views_base_url_views_base_url_known_class
  version: '1.0'
  applicable_bundles:
  - views_base_url
  checks:
  - kind: must_contain_any
    values:
    - vbu-highlight
  scoring:
    combine: all_pass
- id: views_base_url_views_base_url_add_field
  version: '1.0'
  applicable_bundles:
  - views_base_url
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
- id: views_base_url_views_base_url_make_link
  version: '1.0'
  applicable_bundles:
  - views_base_url
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
