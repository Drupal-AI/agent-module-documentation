    setup: agent-module-documentation/evaluation/verify/views_argument_token-raw-view-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/views_argument_token-raw-view-cleanup.sh
- id: views_argument_token-configure-current-user
  input: The view 'vat_task' on this site has a contextual filter on the user id (uid) that currently
    uses a fixed default value. Using the views_argument_token module, change that contextual filter's
    default value so it is provided by a token equal to the current user's id, [current-user:uid]. Apply
