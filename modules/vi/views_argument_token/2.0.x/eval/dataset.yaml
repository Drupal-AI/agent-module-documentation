metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: views_argument_token
  version: 2.0.x
  note: 'Views Argument Token adds a single Views argument_default plugin (id ''token'', class TokenArgument)
    that fills a contextual filter''s default value from a Drupal token resolved against the current user
    / route entity. No admin UI, configure=null, no permissions, no Drush. Its only persistent state is
    the plugin''s options inside a view config entity: display.<d>.display_options.arguments.<arg>.default_argument_type=''token''
    plus default_argument_options {argument, process, and_or, all_option, debug} (schema views.argument_default.token).
    All medium/hard cases are grounded in real view config: introspection reads the configured token string
    / options back from a view; execution switches an existing contextual filter to the token plugin and
    is verified against the live view config.'
questions:
- id: views_argument_token-how-to-use
  input: On a Drupal 11 site I want a Views contextual filter to default its value from a Drupal token
    like [current-user:uid] or [node:field_tags] instead of the URL. The views_argument_token module is
    installed. How do I set that up, and what kind of Views plugin does the module provide?
  criteria: views_argument_token registers a Views argument_default (default value) plugin with id 'token'.
    On the contextual filter, under 'When the filter value is not available', choose 'Provide default
    value', set Type to 'Token', and enter a token string such as [current-user:uid] or [node:field_tags].
    It is resolved at render time against the current user / route entity.
  bundle: views_argument_token
  rubric_ref: rubric/views_argument_token_views_argument_token_how_to_use@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: views_argument_token-raw-values
  input: In the views_argument_token 'Token' contextual-filter default, what does the 'Get fields raw
    values' option do, and when a field has multiple values how are they combined for the argument?
  criteria: '''Get fields raw values'' (option key ''process'') replaces field tokens with the field''s
    stored raw value (e.g. an entity-reference field''s target ID) instead of the token module''s rendered
    value. Multiple field values are joined by the ''and_or'' option: ''+'' means OR, '','' means AND,
    so the argument can drive a multi-value contextual filter.'
  bundle: views_argument_token
  rubric_ref: rubric/views_argument_token_views_argument_token_raw_values@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: views_argument_token-empty-value
  input: With views_argument_token, what happens when the configured token resolves to an empty value?
    Is there an option to still show all results?
  criteria: If the token resolves empty and the 'Send "all" if no value' option (all_option) is enabled,
    the plugin returns the literal argument 'all' (you must also enable the filter's 'all' exception argument)
    so the view shows everything; otherwise it returns an empty string. Any unresolved [type:name] token
    blanks the argument.
  bundle: views_argument_token
  rubric_ref: rubric/views_argument_token_views_argument_token_empty_value@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: views_argument_token-inspect-user-token
  input: This site has a view with machine name 'vat_user'. Its contextual filter uses the views_argument_token
    'token' default-value plugin. Inspect the live view configuration and state the exact token string
    configured as the default argument.
  criteria: 'The token string is [current-user:uid]: in views.view.vat_user the ''uid'' contextual filter
    has default_argument_type: token and default_argument_options.argument: ''[current-user:uid]''.'
  bundle: views_argument_token
  rubric_ref: rubric/views_argument_token_views_argument_token_inspect_user_token@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/views_argument_token-user-view-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/views_argument_token-user-view-cleanup.sh
- id: views_argument_token-inspect-raw-options
  input: 'This site has a view ''vat_raw'' whose contextual filter uses the views_argument_token ''token''
    default. Inspect the live configuration: is ''Get fields raw values'' enabled, and are multiple values
    combined with OR or AND?'
  criteria: 'Raw values are enabled (process: 1) and multiple values are combined with AND (and_or: '','').
    In views.view.vat_raw the token argument options are argument: ''[node:field_tags]'', process: 1,
    and_or: '',''.'
  bundle: views_argument_token
  rubric_ref: rubric/views_argument_token_views_argument_token_inspect_raw_options@1.0
  tags:
  - mode:introspection
  - difficulty:medium
