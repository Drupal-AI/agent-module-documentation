rubrics:
- id: views_simple_math_field_views_simple_math_field_add_column
  version: '1.0'
  applicable_bundles:
  - views_simple_math_field
  checks:
  - kind: must_contain_any
    values:
    - Simple Math Field
    - field_views_simple_math_field
    - Global
  scoring:
    combine: all_pass
- id: views_simple_math_field_views_simple_math_field_formula_syntax
  version: '1.0'
  applicable_bundles:
  - views_simple_math_field
  checks:
  - kind: must_contain_any
    values:
    - '@'
    - formula
    - token
  scoring:
    combine: all_pass
- id: views_simple_math_field_views_simple_math_field_division_zero
  version: '1.0'
  applicable_bundles:
  - views_simple_math_field
  checks:
  - kind: must_contain_any
    values:
    - eval-math
    - EvalMath
    - mute_logs
  scoring:
    combine: all_pass
- id: views_simple_math_field_views_simple_math_field_formula
  version: '1.0'
  applicable_bundles:
  - views_simple_math_field
  checks:
  - kind: must_contain_any
    values:
    - (@nid + @vid) / 2
    - '@nid + @vid'
  scoring:
    combine: all_pass
- id: views_simple_math_field_views_simple_math_field_mute_logs
  version: '1.0'
  applicable_bundles:
  - views_simple_math_field
  checks:
  - kind: must_contain_any
    values:
    - muted
    - mute_logs
    - 'yes'
    - enabled
    - 'true'
    - '1'
  scoring:
    combine: all_pass
- id: views_simple_math_field_views_simple_math_field_add_field
  version: '1.0'
  applicable_bundles:
  - views_simple_math_field
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
- id: views_simple_math_field_views_simple_math_field_set_formula
  version: '1.0'
  applicable_bundles:
  - views_simple_math_field
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
