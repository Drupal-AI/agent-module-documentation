rubrics:
- id: views_filters_summary_vfs_what_and_where
  version: '1.0'
  applicable_bundles:
  - views_filters_summary
  checks:
  - kind: must_contain_any
    values:
    - area
    - views_filters_summary
    - header
    - footer
  scoring:
    combine: all_pass
- id: views_filters_summary_vfs_content_tokens
  version: '1.0'
  applicable_bundles:
  - views_filters_summary
  checks:
  - kind: must_contain_any
    values:
    - '@total'
    - '@result_label'
    - '@exposed_filter_summary'
  scoring:
    combine: all_pass
- id: views_filters_summary_vfs_links_options
  version: '1.0'
  applicable_bundles:
  - views_filters_summary
  checks:
  - kind: must_contain_any
    values:
    - show_remove_link
    - show_reset_link
    - filters_reset_link_title
  scoring:
    combine: all_pass
- id: views_filters_summary_vfs_known_prefix
  version: '1.0'
  applicable_bundles:
  - views_filters_summary
  checks:
  - kind: must_contain_any
    values:
    - VFS Known Prefix 7Q
  scoring:
    combine: all_pass
- id: views_filters_summary_vfs_known_plural
  version: '1.0'
  applicable_bundles:
  - views_filters_summary
  checks:
  - kind: must_contain_any
    values:
    - vfsthings
  scoring:
    combine: all_pass
- id: views_filters_summary_vfs_add_area
  version: '1.0'
  applicable_bundles:
  - views_filters_summary
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
- id: views_filters_summary_vfs_enable_reset_link
  version: '1.0'
  applicable_bundles:
  - views_filters_summary
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
