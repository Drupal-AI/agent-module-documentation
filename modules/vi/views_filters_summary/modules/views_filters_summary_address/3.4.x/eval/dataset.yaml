metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: views_filters_summary_address
  version: 3.4.x
  note: 'views_filters_summary_address is a thin integration submodule of views_filters_summary. It has
    NO config, routes, permissions, or plugins; it only implements the alter hook(s) hook_views_filters_summary_plugin_alias,
    hook_views_filters_summary_valid_index (primary: views_filters_summary_plugin_alias) to let the parent''s
    Views summary area render Address''s filters. Companion module: address. Grounding: easy = code facts
    about the hook/behaviour; medium = live module-registry introspection (declared dependencies and the
    implemented hook, discoverable via the extension list / module source without the companion being
    active); hard = building/altering the parent views_filters_summary area on a real view (vfs_task /
    vfs_reset), verified against live view config — since the submodule''s own effect only manifests when
    its companion module plus a matching exposed filter render inside that area.'
questions:
- id: views_filters_summary_address-purpose
  input: What does the Drupal submodule views_filters_summary_address do, and which companion module (if
    any) does it integrate the Views Filters Summary with?
  criteria: 'Teaches Views Filters Summary how to render the Address module''s administrative-area (state/province)
    exposed filter. Dependencies: views_filters_summary, address.'
  bundle: views_filters_summary_address
  rubric_ref: rubric/views_filters_summary_address_views_filters_summary_address_purpose@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: views_filters_summary_address-hook
  input: Which views_filters_summary alter hook (or core hook) does the views_filters_summary_address
    submodule implement to do its job, and what does that implementation do?
  criteria: It implements hook_views_filters_summary_plugin_alias and hook_views_filters_summary_valid_index.
    This submodule implements `hook_views_filters_summary_plugin_alias()` to alias the Address module's
    `administrative_area` filter plugin to the built-in `list_field` handling, so its selected values
    are resolved to readable labels in the summary. It also implements `hook_views_filters_summary_valid_index()`
    to accept the string array indices that administrative-area filters use (e.g. `['AL' => 'AL']`). Requires
    the Address module.
  bundle: views_filters_summary_address
  rubric_ref: rubric/views_filters_summary_address_views_filters_summary_address_hook@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: views_filters_summary_address-detail
  input: In the views_filters_summary_address submodule, describe the specific mapping or transformation
    it applies for its supported filter type in the Views Filters Summary.
  criteria: This submodule implements `hook_views_filters_summary_plugin_alias()` to alias the Address
    module's `administrative_area` filter plugin to the built-in `list_field` handling, so its selected
    values are resolved to readable labels in the summary. It also implements `hook_views_filters_summary_valid_index()`
    to accept the string array indices that administrative-area filters use (e.g. `['AL' => 'AL']`). Requires
    the Address module.
  bundle: views_filters_summary_address
  rubric_ref: rubric/views_filters_summary_address_views_filters_summary_address_detail@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: views_filters_summary_address-deps-introspect
  input: On this Drupal site, inspect the module registry / extension info for views_filters_summary_address
    and report the module(s) it declares as dependencies in its info file.
  criteria: 'views_filters_summary_address declares these dependencies: views_filters_summary, address
    (readable via the extension list, e.g. \Drupal::service(''extension.list.module'')->getAllAvailableInfo()[''views_filters_summary_address''][''dependencies''],
    or the module''s .info.yml).'
  bundle: views_filters_summary_address
  rubric_ref: rubric/views_filters_summary_address_views_filters_summary_address_deps_introspect@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/views_filters_summary-noop-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/views_filters_summary-noop-cleanup.sh
- id: views_filters_summary_address-hook-introspect
  input: On this site, inspect the views_filters_summary_address submodule and report which views_filters_summary
    (or core) alter hook it implements.
  criteria: 'It implements hook_views_filters_summary_plugin_alias, hook_views_filters_summary_valid_index
    (primary: views_filters_summary_plugin_alias).'
  bundle: views_filters_summary_address
  rubric_ref: rubric/views_filters_summary_address_views_filters_summary_address_hook_introspect@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/views_filters_summary-noop-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/views_filters_summary-noop-cleanup.sh
- id: views_filters_summary_address-build-area
  input: The views_filters_summary_address submodule enhances the parent views_filters_summary area. On
    this site there is a view 'vfs_task' with an exposed Title filter but no filters summary. Add the
    'Views exposed filters summary' area handler (plugin id views_filters_summary) to a display of that
    view and save it.
  criteria: Add a handler with plugin_id 'views_filters_summary' under display_options.footer (or header/empty)
    of the vfs_task view and save it.
  bundle: views_filters_summary_address
  rubric_ref: rubric/views_filters_summary_address_views_filters_summary_address_build_area@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/views_filters_summary-area-add-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/views_filters_summary-area-add-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/views_filters_summary-area-add-verify.sh
- id: views_filters_summary_address-enable-reset-link
  input: On this site the view 'vfs_reset' shows a filters summary (the kind views_filters_summary_address
    enhances) but has no reset-all link. Turn on the reset-all link for that summary and save the change.
  criteria: Set the views_filters_summary area's show_reset_link option to TRUE on the vfs_reset view
    and save.
  bundle: views_filters_summary_address
  rubric_ref: rubric/views_filters_summary_address_views_filters_summary_address_enable_reset_link@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-layman
    reset: agent-module-documentation/evaluation/verify/views_filters_summary-reset-link-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/views_filters_summary-reset-link-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/views_filters_summary-reset-link-verify.sh
