metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: views_filters_summary_cvfb
  version: 3.4.x
  note: 'views_filters_summary_cvfb is a thin integration submodule of views_filters_summary. It has NO
    config, routes, permissions, or plugins; it only implements the alter hook(s) hook_library_info_alter
    (primary: library_info_alter) to let the parent''s Views summary area render Configurable Views Filter
    Block''s filters. Companion module: configurable_views_filter_block. Grounding: easy = code facts
    about the hook/behaviour; medium = live module-registry introspection (declared dependencies and the
    implemented hook, discoverable via the extension list / module source without the companion being
    active); hard = building/altering the parent views_filters_summary area on a real view (vfs_task /
    vfs_reset), verified against live view config — since the submodule''s own effect only manifests when
    its companion module plus a matching exposed filter render inside that area.'
questions:
- id: views_filters_summary_cvfb-purpose
  input: What does the Drupal submodule views_filters_summary_cvfb do, and which companion module (if
    any) does it integrate the Views Filters Summary with?
  criteria: 'Adds JavaScript so the Views Filters Summary remove/reset links work when the exposed filters
    are rendered in a Configurable Views Filter Block. Dependencies: views_filters_summary, configurable_views_filter_block.'
  bundle: views_filters_summary_cvfb
  rubric_ref: rubric/views_filters_summary_cvfb_views_filters_summary_cvfb_purpose@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: views_filters_summary_cvfb-hook
  input: Which views_filters_summary alter hook (or core hook) does the views_filters_summary_cvfb submodule
    implement to do its job, and what does that implementation do?
  criteria: It implements hook_library_info_alter. This submodule implements `hook_library_info_alter()`
    to append its `views-filters-summary-cvfb.js` script to the parent `views_filters_summary/views_filters_summary`
    library, adapting the summary's client-side behaviour to the Configurable Views Filter Block module
    (where the exposed form is rendered in a separate block). Requires the Configurable Views Filter Block
    module.
  bundle: views_filters_summary_cvfb
  rubric_ref: rubric/views_filters_summary_cvfb_views_filters_summary_cvfb_hook@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: views_filters_summary_cvfb-detail
  input: In the views_filters_summary_cvfb submodule, describe the specific mapping or transformation
    it applies for its supported filter type in the Views Filters Summary.
  criteria: This submodule implements `hook_library_info_alter()` to append its `views-filters-summary-cvfb.js`
    script to the parent `views_filters_summary/views_filters_summary` library, adapting the summary's
    client-side behaviour to the Configurable Views Filter Block module (where the exposed form is rendered
    in a separate block). Requires the Configurable Views Filter Block module.
  bundle: views_filters_summary_cvfb
  rubric_ref: rubric/views_filters_summary_cvfb_views_filters_summary_cvfb_detail@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: views_filters_summary_cvfb-deps-introspect
  input: On this Drupal site, inspect the module registry / extension info for views_filters_summary_cvfb
    and report the module(s) it declares as dependencies in its info file.
  criteria: 'views_filters_summary_cvfb declares these dependencies: views_filters_summary, configurable_views_filter_block
    (readable via the extension list, e.g. \Drupal::service(''extension.list.module'')->getAllAvailableInfo()[''views_filters_summary_cvfb''][''dependencies''],
    or the module''s .info.yml).'
  bundle: views_filters_summary_cvfb
  rubric_ref: rubric/views_filters_summary_cvfb_views_filters_summary_cvfb_deps_introspect@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/views_filters_summary-noop-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/views_filters_summary-noop-cleanup.sh
- id: views_filters_summary_cvfb-hook-introspect
  input: On this site, inspect the views_filters_summary_cvfb submodule and report which views_filters_summary
    (or core) alter hook it implements.
  criteria: 'It implements hook_library_info_alter (primary: library_info_alter).'
  bundle: views_filters_summary_cvfb
  rubric_ref: rubric/views_filters_summary_cvfb_views_filters_summary_cvfb_hook_introspect@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/views_filters_summary-noop-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/views_filters_summary-noop-cleanup.sh
- id: views_filters_summary_cvfb-build-area
  input: The views_filters_summary_cvfb submodule enhances the parent views_filters_summary area. On this
    site there is a view 'vfs_task' with an exposed Title filter but no filters summary. Add the 'Views
    exposed filters summary' area handler (plugin id views_filters_summary) to a display of that view
    and save it.
  criteria: Add a handler with plugin_id 'views_filters_summary' under display_options.footer (or header/empty)
    of the vfs_task view and save it.
  bundle: views_filters_summary_cvfb
  rubric_ref: rubric/views_filters_summary_cvfb_views_filters_summary_cvfb_build_area@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/views_filters_summary-area-add-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/views_filters_summary-area-add-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/views_filters_summary-area-add-verify.sh
- id: views_filters_summary_cvfb-enable-reset-link
  input: On this site the view 'vfs_reset' shows a filters summary (the kind views_filters_summary_cvfb
    enhances) but has no reset-all link. Turn on the reset-all link for that summary and save the change.
  criteria: Set the views_filters_summary area's show_reset_link option to TRUE on the vfs_reset view
    and save.
  bundle: views_filters_summary_cvfb
  rubric_ref: rubric/views_filters_summary_cvfb_views_filters_summary_cvfb_enable_reset_link@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-layman
    reset: agent-module-documentation/evaluation/verify/views_filters_summary-reset-link-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/views_filters_summary-reset-link-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/views_filters_summary-reset-link-verify.sh
