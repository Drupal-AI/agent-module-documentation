metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: views_filters_summary_verf
  version: 3.4.x
  note: 'views_filters_summary_verf is a thin integration submodule of views_filters_summary. It has NO
    config, routes, permissions, or plugins; it only implements the alter hook(s) hook_views_filters_summary_info_alter
    (primary: views_filters_summary_info_alter) to let the parent''s Views summary area render Views Entity
    Reference Filter''s filters. Companion module: verf. Grounding: easy = code facts about the hook/behaviour;
    medium = live module-registry introspection (declared dependencies and the implemented hook, discoverable
    via the extension list / module source without the companion being active); hard = building/altering
    the parent views_filters_summary area on a real view (vfs_task / vfs_reset), verified against live
    view config — since the submodule''s own effect only manifests when its companion module plus a matching
    exposed filter render inside that area.'
questions:
- id: views_filters_summary_verf-purpose
  input: What does the Drupal submodule views_filters_summary_verf do, and which companion module (if
    any) does it integrate the Views Filters Summary with?
  criteria: 'Renders referenced entity labels in the summary for the Views Entity Reference Filter (VERF)
    filter. Dependencies: views_filters_summary, verf.'
  bundle: views_filters_summary_verf
  rubric_ref: rubric/views_filters_summary_verf_views_filters_summary_verf_purpose@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: views_filters_summary_verf-hook
  input: Which views_filters_summary alter hook (or core hook) does the views_filters_summary_verf submodule
    implement to do its job, and what does that implementation do?
  criteria: It implements hook_views_filters_summary_info_alter. This submodule implements `hook_views_filters_summary_info_alter()`.
    For the `verf` filter it reads the filter's `verf_target_entity_type_id`, loads each selected referenced
    entity, and sets the summary values to their labels, so the summary shows readable entity names. Requires
    the Views Entity Reference Filter (verf) module.
  bundle: views_filters_summary_verf
  rubric_ref: rubric/views_filters_summary_verf_views_filters_summary_verf_hook@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: views_filters_summary_verf-detail
  input: In the views_filters_summary_verf submodule, describe the specific mapping or transformation
    it applies for its supported filter type in the Views Filters Summary.
  criteria: This submodule implements `hook_views_filters_summary_info_alter()`. For the `verf` filter
    it reads the filter's `verf_target_entity_type_id`, loads each selected referenced entity, and sets
    the summary values to their labels, so the summary shows readable entity names. Requires the Views
    Entity Reference Filter (verf) module.
  bundle: views_filters_summary_verf
  rubric_ref: rubric/views_filters_summary_verf_views_filters_summary_verf_detail@1.0
  tags:
