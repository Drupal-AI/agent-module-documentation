rubrics:
- id: views_json_source_views_json_source_how_to
  version: '1.0'
  applicable_bundles:
  - views_json_source
  checks:
  - kind: must_contain_any
    values:
    - json_file
    - row_apath
    - Row Apath
    - JSON File
  scoring:
    combine: all_pass
- id: views_json_source_views_json_source_apath
  version: '1.0'
  applicable_bundles:
  - views_json_source
  checks:
  - kind: must_contain_any
    values:
    - apath
    - row_apath
    - '%'
    - data/records
    - key=value
  scoring:
    combine: all_pass
- id: views_json_source_views_json_source_cache_setting
  version: '1.0'
  applicable_bundles:
  - views_json_source
  checks:
  - kind: must_contain_any
    values:
    - cache_ttl
    - views_json_source.settings
    - '86400'
  scoring:
    combine: all_pass
- id: views_json_source_views_json_source_cache_ttl
  version: '1.0'
  applicable_bundles:
  - views_json_source
  checks:
  - kind: must_contain_any
    values:
    - '120'
  scoring:
    combine: all_pass
- id: views_json_source_views_json_source_view_apath
  version: '1.0'
  applicable_bundles:
  - views_json_source
  checks:
  - kind: must_contain_any
    values:
    - data/records
  scoring:
    combine: all_pass
- id: views_json_source_views_json_source_set_ttl
  version: '1.0'
  applicable_bundles:
  - views_json_source
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
- id: views_json_source_views_json_source_build_view
  version: '1.0'
  applicable_bundles:
  - views_json_source
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
