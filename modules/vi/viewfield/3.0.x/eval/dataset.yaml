metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: viewfield
  version: 3.0.x
  note: Viewfield exposes one field type, one widget, and three formatters (no services/routes/permissions).
    Cases are `recipe` (response-graded) probing documented facts an agent would otherwise read source
    to answer; no site mutation. Module is a beta release.
questions:
- id: viewfield-field-type
  input: On a Drupal 11 site I want a field that references a View and renders it inline on a node. Which
    module and field type do I add, and what does one field value store?
  criteria: Add the Viewfield module's `viewfield` field type. Each value stores target_id (the View),
    display_id (the display), arguments (contextual filters), and items_to_display.
  bundle: viewfield
  rubric_ref: rubric/viewfield_viewfield_field_type@1.0
  tags:
  - mode:recipe
- id: viewfield-columns
  input: What columns/properties does the Drupal `viewfield` field type store besides the referenced view
    (target_id)?
  criteria: Beyond target_id it stores display_id (which view display), arguments (comma/slash-delimited
    contextual filters, token-aware), and items_to_display (item-count override).
  bundle: viewfield
  rubric_ref: rubric/viewfield_viewfield_columns@1.0
  tags:
  - mode:recipe
- id: viewfield-default-formatter
  input: Which Viewfield field formatter actually runs the referenced view and renders its output, and
    what is its machine id?
  criteria: The default formatter `viewfield_default` (label "Viewfield") executes the view via Views::getView()
    and renders it through the viewfield/viewfield_item templates.
  bundle: viewfield
  rubric_ref: rubric/viewfield_viewfield_default_formatter@1.0
  tags:
  - mode:recipe
- id: viewfield-token-arguments
  input: I want a viewfield to pass the current node's ID into the referenced view's contextual filter.
    How do I supply arguments, and are tokens supported?
  criteria: Enter the value in the widget's Arguments field (separate filters with /, multi-value with
    + or ,). Tokens are supported and replaced against the host entity, so use the node token for its
    ID.
  bundle: viewfield
  rubric_ref: rubric/viewfield_viewfield_token_arguments@1.0
  tags:
  - mode:recipe
- id: viewfield-force-default
  input: I want a Viewfield to always render one fixed view+display for every entity in a bundle and be
    hidden on the edit form (authors can't change it). Which field setting does that?
  criteria: Enable the `force_default` field setting ("Always use default value"). It hides the field
    on entity forms and renders the configured default value; a default value is then required.
  bundle: viewfield
  rubric_ref: rubric/viewfield_viewfield_force_default@1.0
  tags:
  - mode:recipe
- id: viewfield-restrict-views
  input: How do I limit which views and which display types content authors may choose in a viewfield?
  criteria: Use the `allowed_views` and `allowed_display_types` field settings (checkbox lists). Leaving
    them empty allows all enabled views / all display types.
  bundle: viewfield
  rubric_ref: rubric/viewfield_viewfield_restrict_views@1.0
  tags:
  - mode:recipe
- id: viewfield-rendered-entities
  input: Which Viewfield formatter renders the view's result rows as full entities in a chosen view mode,
    and what limitation does it have?
  criteria: The `viewfield_rendered` formatter ("Rendered entities") renders each result row's entity
    in a selected view mode; it only applies to single-cardinality fields and relies on the View for access
    control.
  bundle: viewfield
  rubric_ref: rubric/viewfield_viewfield_rendered_entities@1.0
  tags:
  - mode:recipe
