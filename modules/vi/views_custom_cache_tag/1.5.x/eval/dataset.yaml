metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: views_custom_cache_tag
  version: 1.5.x
  note: Views Custom Cache Tag ships one Views cache plugin, `custom_tag` ("Custom Tag based", class Drupal\views_custom_cache_tag\Plugin\views\cache\CustomTag),
    selected per view display; it attaches user-supplied cache tags to a view and strips the entity *_list
    tags so invalidation is manual. Easy cases are graded on response text; medium cases install a known
    view (custom_tag cache + known tags) to read back and delete it after; hard cases build/switch a view's
    display cache option verified against live state by exit code. The project's bundled views_custom_cache_tag_demo
    is a demo only and is not documented as a submodule.
questions:
- id: vcct-plugin-id
  input: On a Drupal 11 site, which contrib module lets me set my own cache tags on a View, and what is
    the machine id of the Views cache plugin it provides?
  criteria: Views Custom Cache Tag (views_custom_cache_tag). It provides the Views cache plugin id `custom_tag`
    ("Custom Tag based"), selected under a view display's Advanced -> Caching.
  bundle: views_custom_cache_tag
  rubric_ref: rubric/views_custom_cache_tag_vcct_plugin_id@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: vcct-where-set
  input: Using Views Custom Cache Tag, where do I enter the custom cache tags for a view and in what format?
    Does the module have its own admin settings page?
  criteria: 'There is no separate admin/settings page or configure route. You set it per display: edit
    the view, open Advanced -> Other -> Caching, choose ''Custom Tag based'' (custom_tag), and enter one
    cache tag per line in the ''Custom tag list'' textarea.'
  bundle: views_custom_cache_tag
  rubric_ref: rubric/views_custom_cache_tag_vcct_where_set@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: vcct-list-tag-behavior
  input: Why does Views Custom Cache Tag stop a view from being flushed on every node save, and how do
    I actually clear a view that uses it?
  criteria: Its getCacheTags() removes the entity list cache tags (e.g. node_list) that core's Tag plugin
    would add, so unrelated saves no longer invalidate the view. You clear it yourself from code by invalidating
    your configured tag, e.g. Cache::invalidateTags(['my_tag']).
  bundle: views_custom_cache_tag
  rubric_ref: rubric/views_custom_cache_tag_vcct_list_tag_behavior@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: vcct-introspect-tags
  input: This Drupal site has a View named vcct_eval_tags that caches with Views Custom Cache Tag. Inspect
    the running site (drush available) and tell me the exact custom cache tags configured on its default
    display.
  criteria: 'The vcct_eval_tags view''s default display uses the custom_tag cache plugin with two custom
    cache tags: eval:report and eval:widgets (read from views.view.vcct_eval_tags display.default.display_options.cache.options.custom_tag).'
  bundle: views_custom_cache_tag
  rubric_ref: rubric/views_custom_cache_tag_vcct_introspect_tags@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    persona: drupal-expert
    setup: agent-module-documentation/evaluation/verify/views_custom_cache_tag-introspect-tags-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/views_custom_cache_tag-introspect-tags-cleanup.sh
- id: vcct-introspect-plugin
  input: This Drupal site has a View named vcct_eval_plugin. Inspect the running site (drush available)
    and tell me which Views cache plugin its default display uses (give the plugin machine id).
  criteria: The vcct_eval_plugin view's default display cache type is custom_tag (the Views Custom Cache
    Tag plugin), configured with the custom tag eval:catalog and a 3600-second rendered-output lifespan.
  bundle: views_custom_cache_tag
  rubric_ref: rubric/views_custom_cache_tag_vcct_introspect_plugin@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    persona: drupal-expert
    setup: agent-module-documentation/evaluation/verify/views_custom_cache_tag-introspect-plugin-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/views_custom_cache_tag-introspect-plugin-cleanup.sh
- id: vcct-build-view
  input: On this Drupal site (DDEV, drush available), the Views Custom Cache Tag module is enabled. Create
    a new View with machine name exactly `vcct_hard_report` (a listing of content) and set its default
    display's cache plugin to Views Custom Cache Tag (the custom_tag plugin) with the custom cache tag
    `eval:hard:report`. Apply it to the running site with drush/config — do not just describe it. Summarize
    in one line what you created.
  criteria: A view vcct_hard_report exists whose default display cache option is type custom_tag with
    a custom_tag list containing eval:hard:report. Verified against live site state.
  bundle: views_custom_cache_tag
  rubric_ref: rubric/views_custom_cache_tag_vcct_build_view@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/views_custom_cache_tag-build-view-reset.sh
    verify: agent-module-documentation/evaluation/verify/views_custom_cache_tag-build-view-verify.sh
- id: vcct-switch-cache
  input: On this Drupal site (drush available), there is an existing View named vcct_hard_switch that
    currently uses the core Tag cache plugin. Switch its default display to use the Views Custom Cache
    Tag plugin (custom_tag) instead, with the custom cache tag `eval:hard:switch`. Apply the change to
    the running site — do not just describe it. State in one line what you changed.
  criteria: The vcct_hard_switch view's default display cache option is now type custom_tag with a custom_tag
    list containing eval:hard:switch (changed from the core tag plugin). Verified against live site state.
  bundle: views_custom_cache_tag
  rubric_ref: rubric/views_custom_cache_tag_vcct_switch_cache@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/views_custom_cache_tag-switch-cache-reset.sh
    verify: agent-module-documentation/evaluation/verify/views_custom_cache_tag-switch-cache-verify.sh
