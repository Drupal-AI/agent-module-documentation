rubrics:
- id: views_field_formatter_views_field_formatter_id
  version: '1.0'
  applicable_bundles:
  - views_field_formatter
  checks:
  - kind: must_contain_any
    values:
    - views_field_formatter
    - View
  scoring:
    combine: all_pass
- id: views_field_formatter_views_field_formatter_settings_keys
  version: '1.0'
  applicable_bundles:
  - views_field_formatter
  checks:
  - kind: must_contain_any
    values:
    - view
    - '::'
    - multiple
    - implode_character
  scoring:
    combine: all_pass
- id: views_field_formatter_views_field_formatter_arguments
  version: '1.0'
  applicable_bundles:
  - views_field_formatter
  checks:
  - kind: must_contain_any
    values:
    - argument
    - contextual
    - '#type'
    - view
  scoring:
    combine: all_pass
- id: views_field_formatter_views_field_formatter_known_view
  version: '1.0'
  applicable_bundles:
  - views_field_formatter
  checks:
  - kind: must_contain_any
    values:
    - frontpage
  scoring:
    combine: all_pass
- id: views_field_formatter_views_field_formatter_known_multiple
  version: '1.0'
  applicable_bundles:
  - views_field_formatter
  checks:
  - kind: must_contain_any
    values:
    - multiple
    - ', '
  scoring:
    combine: all_pass
- id: views_field_formatter_views_field_formatter_set_view
  version: '1.0'
  applicable_bundles:
  - views_field_formatter
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
- id: views_field_formatter_views_field_formatter_enable_multiple
  version: '1.0'
  applicable_bundles:
  - views_field_formatter
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
