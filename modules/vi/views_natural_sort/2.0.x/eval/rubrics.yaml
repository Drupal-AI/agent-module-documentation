rubrics:
- id: views_natural_sort_views_natural_sort_order_option
  version: '1.0'
  applicable_bundles:
  - views_natural_sort
  checks:
  - kind: must_contain_any
    values:
    - Sort ascending naturally
    - naturally
    - NASC
    - NDESC
    - natural
  scoring:
    combine: all_pass
- id: views_natural_sort_views_natural_sort_index_table
  version: '1.0'
  applicable_bundles:
  - views_natural_sort
  checks:
  - kind: must_contain_any
    values:
    - views_natural_sort
    - index
    - content
    - entity_insert
    - entity save
  scoring:
    combine: all_pass
- id: views_natural_sort_views_natural_sort_settings_keys
  version: '1.0'
  applicable_bundles:
  - views_natural_sort
  checks:
  - kind: must_contain_any
    values:
    - views_natural_sort.settings
    - /admin/structure/views/settings/views_natural_sort
    - Rebuild Index
    - remove_beginning_words
  scoring:
    combine: all_pass
- id: views_natural_sort_views_natural_sort_known_beginning_word
  version: '1.0'
  applicable_bundles:
  - views_natural_sort
  checks:
  - kind: must_contain_any
    values:
    - Xanadu
  scoring:
    combine: all_pass
- id: views_natural_sort_views_natural_sort_known_batch_size
  version: '1.0'
  applicable_bundles:
  - views_natural_sort
  checks:
  - kind: must_contain_any
    values:
    - '250'
  scoring:
    combine: all_pass
- id: views_natural_sort_views_natural_sort_view_natural
  version: '1.0'
  applicable_bundles:
  - views_natural_sort
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
- id: views_natural_sort_views_natural_sort_enable_days
  version: '1.0'
  applicable_bundles:
  - views_natural_sort
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
