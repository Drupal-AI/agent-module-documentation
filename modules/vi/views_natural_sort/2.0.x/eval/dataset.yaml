metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: views_natural_sort
  version: 2.0.x
  note: Views Natural Sort adds a Views sort handler id 'natural' (@ViewsSort) with NASC/NDESC orders,
    backed by an index table `views_natural_sort` (content column = transformed string). hook_views_data_alter
    upgrades eligible standard string sorts to 'natural'. Settings config object `views_natural_sort.settings`
    (form route views_natural_sort.settings, /admin/structure/views/settings/views_natural_sort, permission
    administer views) holds rebuild_items_per_batch and transformation_settings.<id>.{enabled,settings}
    for plugins remove_beginning_words/remove_words/remove_symbols/numbers/days_of_the_week. No drush;
    reindex is the form's Rebuild Index button / views_natural_sort_queue_data_for_rebuild(). Medium cases
    read the live settings config; hard cases switch a real view's title sort to natural, and toggle a
    transformation setting, verified against live config. Baseline restored explicitly in cleanup (rebuild_items_per_batch=100,
    days_of_the_week.enabled=false, default beginning words).
questions:
- id: views_natural_sort-order-option
  input: With Views Natural Sort enabled, how do I make a view's Title sort ignore a leading 'The'/'A'
    and sort naturally? What order option / sort plugin id does that correspond to?
  criteria: Edit the Title sort criterion and choose 'Sort ascending naturally' (or descending). That
    uses the module's sort handler id 'natural' with order NASC/NDESC; in config the sort's plugin_id
    is 'natural' and order 'NASC'/'NDESC'. Leading articles/words are stripped by the transformation pipeline.
  bundle: views_natural_sort
  rubric_ref: rubric/views_natural_sort_views_natural_sort_order_option@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: views_natural_sort-index-table
  input: How does Views Natural Sort actually sort — does it transform the title at query time? What database
    table does it use and when is it populated?
  criteria: It sorts on a precomputed index table named views_natural_sort (columns eid, entity_type,
    field, delta, content), where content is the transformed sortable string. Rows are written on hook_entity_insert/update
    (and removed on delete); the natural sort joins this table and orders by content. After bulk changes
    you rebuild the index.
  bundle: views_natural_sort
  rubric_ref: rubric/views_natural_sort_views_natural_sort_index_table@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: views_natural_sort-settings-keys
  input: Where do I configure which beginning words Views Natural Sort strips, and how do I rebuild its
    index? Name the config object / settings page and how reindexing is triggered.
  criteria: Config object views_natural_sort.settings (settings form at /admin/structure/views/settings/views_natural_sort,
    permission 'administer views'). Beginning words are transformation_settings.remove_beginning_words.settings.
    Reindex via the form's 'Rebuild Index' button (there is no drush command); saving the settings form
    also reindexes.
  bundle: views_natural_sort
  rubric_ref: rubric/views_natural_sort_views_natural_sort_settings_keys@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: views_natural_sort-known-beginning-word
  input: On this site, Views Natural Sort has been configured with a custom list of words to strip from
    the beginning of a title before sorting. Inspect the live configuration and list those beginning words
    (there is an unusual custom one).
  criteria: views_natural_sort.settings.transformation_settings.remove_beginning_words.settings is [The,
    A, An, La, Le, Il, Xanadu] — the unusual custom beginning word is 'Xanadu'.
  bundle: views_natural_sort
  rubric_ref: rubric/views_natural_sort_views_natural_sort_known_beginning_word@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/views_natural_sort-known-beginning-word-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/views_natural_sort-known-beginning-word-cleanup.sh
- id: views_natural_sort-known-batch-size
  input: This site's Views Natural Sort has a non-default reindex batch size configured. Inspect the live
    configuration and give the number of records it processes per batch.
  criteria: views_natural_sort.settings.rebuild_items_per_batch is 250 (default is 100).
  bundle: views_natural_sort
  rubric_ref: rubric/views_natural_sort_views_natural_sort_known_batch_size@1.0
  tags:
