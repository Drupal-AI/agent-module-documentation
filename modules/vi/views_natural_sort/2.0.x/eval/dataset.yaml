    cleanup: agent-module-documentation/evaluation/verify/views_natural_sort-known-batch-size-cleanup.sh
- id: views_natural_sort-view-natural
  input: The view 'views_natural_sort_demo' on this site sorts nodes by Title using the standard (ascending)
    sort. Using Views Natural Sort, change its default display's Title sort so it sorts ascending NATURALLY
