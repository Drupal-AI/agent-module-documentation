metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: views_data_export
  version: 1.10.x
  note: Views Data Export is configured entirely inside a View (no admin settings page) and adds a display/style
    plus a Drush command; all cases are `recipe` (response-graded), grounded in the module's agent docs.
questions:
- id: vde-display-type
  input: On a Drupal 11 site with Views Data Export installed, I want a View to produce a downloadable
    file instead of an HTML page. Which Views display type do I add to the View? Name it.
  criteria: Add the "Data export" display (machine name data_export, built on REST export) to the View.
  bundle: views_data_export
  rubric_ref: rubric/views_data_export_vde_display_type@1.0
  tags:
  - mode:recipe
- id: vde-csv-dependency
  input: I added a Data export display to a View and want to offer CSV output, but CSV is not available
    as a format. Which module does Views Data Export require for CSV export?
  criteria: CSV output requires the csv_serialization module (drupal/csv_serialization).
  bundle: views_data_export
  rubric_ref: rubric/views_data_export_vde_csv_dependency@1.0
  tags:
  - mode:recipe
- id: vde-formats
  input: In the Data export display's Format (style) settings on this Drupal site, which output file formats
    can I choose from? List them.
  criteria: The data_export style supports csv, xml, json, and xls/xlsx (XLS needs xls_serialization).
  bundle: views_data_export
  rubric_ref: rubric/views_data_export_vde_formats@1.0
  tags:
  - mode:recipe
- id: vde-large-export-batch
  input: I need to export tens of thousands of rows from a View to a file without running out of memory
    using Views Data Export. Which display option enables this, and what value do I set?
  criteria: Set export_method to `batch` (tunable with export_batch_size and export_limit) so large result
    sets are processed in batches.
  bundle: views_data_export
  rubric_ref: rubric/views_data_export_vde_large_export_batch@1.0
  tags:
  - mode:recipe
- id: vde-drush-command
  input: I want to run a Data export display headless from the CLI (for cron) on this Drupal site. Give
    the Drush command, including its alias, and the arguments it takes.
  criteria: drush views_data_export:views-data-export <view_name> <display_id> [arguments] (alias `vde`),
    e.g. drush vde my_view data_export_1.
  bundle: views_data_export
  rubric_ref: rubric/views_data_export_vde_drush_command@1.0
  tags:
  - mode:recipe
- id: vde-drush-output-file
  input: When running the Views Data Export Drush command, I want the generated export written to a specific
    file on disk instead of printed to stdout. Which option do I pass?
  criteria: Pass --output-file=<path> (relative to the Drupal webroot); add --force to overwrite an existing
    file. Without it, results print to stdout.
  bundle: views_data_export
  rubric_ref: rubric/views_data_export_vde_drush_output_file@1.0
  tags:
  - mode:recipe
- id: vde-row-alter-hook
  input: In a custom module on this Drupal site, I want to modify each row just before Views Data Export
    writes it to the export file. Which hook do I implement? Name it.
  criteria: Implement hook_views_data_export_row_alter(&$row, $result, $view) to transform each row before
    serialization.
  bundle: views_data_export
  rubric_ref: rubric/views_data_export_vde_row_alter_hook@1.0
  tags:
  - mode:recipe
- id: vde-download-access
  input: A user reports they can only download the Views Data Export files they generated themselves,
    not exports created by other users. Is this expected, and where is that enforced?
  criteria: 'Expected: downloads are access-checked in hook_file_access(), restricting a generated export
    file to the user who created it.'
  bundle: views_data_export
  rubric_ref: rubric/views_data_export_vde_download_access@1.0
  tags:
  - mode:recipe
