metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: views_geojson
  version: 1.4.x
  note: 'Provides a Views style plugin ''geojson'' (outputs a FeatureCollection) and a ''geojson_export''
    display (extends RestExport, defaults style to geojson). Style option data_source.value selects geometry:
    latlon (latitude+longitude fields), geofield, geolocation, or wkt; plus id_field/name_field/description_field;
    other fields become feature properties. Bounding box: contextual argument views_geojson_bbox_argument
    + argument-default BBoxQuery (reads a bbox query param). Hook hook_geojson_view_alter. Uses itamair/geophp.
    No settings page. Medium/hard inspect/build a geojson_export display / geojson style on real views
    (vgj_known_view / vgj_task_view).'
questions:
- id: vgj-how-output
  input: How do I output a Drupal View as GeoJSON for a Leaflet map using Views GeoJSON? Which Views style
    or display do I use?
  criteria: Add a 'GeoJSON export' display (plugin geojson_export) to your view, or set the display's
    style to 'GeoJSON' (style id geojson); it serializes rows into a GeoJSON FeatureCollection.
  bundle: views_geojson
  rubric_ref: rubric/views_geojson_vgj_how_output@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: vgj-data-source
  input: In the Views GeoJSON style settings, what data-source options can I choose to get each feature's
    geometry, and how do I set a feature's id/name/description?
  criteria: data_source can be latlon (a latitude + longitude field), geofield, geolocation, or wkt. Set
    id_field, name_field and description_field for the feature id/name/description; other fields become
    feature properties.
  bundle: views_geojson
  rubric_ref: rubric/views_geojson_vgj_data_source@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: vgj-bbox
  input: Using Views GeoJSON, how do I return only the features inside the current map viewport (bounding
    box)?
  criteria: Add the 'Bounding box' contextual filter (views_geojson_bbox_argument) and provide its default
    from the 'bbox' query parameter (argument-default BBoxQuery); the client passes ?bbox=minLon,minLat,maxLon,maxLat
    as the map moves.
  bundle: views_geojson
  rubric_ref: rubric/views_geojson_vgj_bbox@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: vgj-known-source
  input: 'On this site the View ''vgj_known_view'' has a GeoJSON export display. Inspect the view: which
    data source (geometry source) is the GeoJSON style configured to use?'
  criteria: The GeoJSON style uses the 'latlon' data source (a latitude field field_lat and longitude
    field field_lon). Read views.view.vgj_known_view display geojson_1 style.options.data_source.value.
  bundle: views_geojson
  rubric_ref: rubric/views_geojson_vgj_known_source@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/views_geojson-known-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/views_geojson-known-cleanup.sh
- id: vgj-add-display
  input: The View 'vgj_task_view' only has a default display. Add a GeoJSON export display (so the view
    can serve GeoJSON) and save the change to the live view.
  criteria: Add a display with display_plugin 'geojson_export' (or a display whose style type is 'geojson')
    to vgj_task_view and save. verify checks the view has such a GeoJSON-outputting display.
  bundle: views_geojson
  rubric_ref: rubric/views_geojson_vgj_add_display@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/views_geojson-add-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/views_geojson-add-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/views_geojson-add-verify.sh
