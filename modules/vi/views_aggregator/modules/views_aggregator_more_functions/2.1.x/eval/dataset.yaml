metadata:
  module: views_aggregator_more_functions
  version: 2.1.x
  part_of: views_aggregator
  note: Converted from the legacy 'cases' shape, which had no gradable checks. The checks were written
    from the expected points and need review.
questions:
- id: what-it-adds
  input: What does the views_aggregator_more_functions submodule add?
  criteria: 'Three aggregation functions for Views Aggregator Plus: views_aggregator_group_seq_number,
    views_aggregator_range_diff, and views_aggregator_percentage. It has no config, plugins, or permissions.'
  bundle: views_aggregator_more_functions
  rubric_ref: rubric/views_aggregator_more_functions_what_it_adds@1.0
  tags:
  - mode:recipe
- id: how-registered
  input: How are the extra functions registered?
  criteria: Via hook_views_aggregation_functions_info() in views_aggregator_more_functions.module; they
    then appear in the parent module's per-field group/column function selectors.
  bundle: views_aggregator_more_functions
  rubric_ref: rubric/views_aggregator_more_functions_how_registered@1.0
  tags:
  - mode:recipe
- id: percentage-column
  input: What does the Percentage function return for the column (totals) result?
  criteria: 100 (100%); each group value is that group's percentage of the whole.
  bundle: views_aggregator_more_functions
  rubric_ref: rubric/views_aggregator_more_functions_percentage_column@1.0
  tags:
  - mode:recipe
- id: dependency
  input: What does this submodule depend on?
  criteria: The views_aggregator module (Views Aggregator Plus); it does nothing on its own.
  bundle: views_aggregator_more_functions
  rubric_ref: rubric/views_aggregator_more_functions_dependency@1.0
  tags:
  - mode:recipe
