metadata:
  module: views_aggregator
  version: 2.1.x
  note: Converted from the legacy 'cases' shape, which had no gradable checks. The checks were written
    from the expected points and need review.
questions:
- id: style-plugin-id
  input: What is the Views style plugin id that Views Aggregator Plus provides and which core style does
    it extend?
  criteria: views_aggregator_plugin_style_table, labelled 'Table with aggregation options', extending
    the core table style (views.style.table).
  bundle: views_aggregator
  rubric_ref: rubric/views_aggregator_style_plugin_id@1.0
  tags:
  - mode:recipe
- id: no-permissions-no-config
  input: Does Views Aggregator Plus define permissions or a global configuration page?
  criteria: No. There are no permissions and no global settings; all configuration is per-view in the
    style options.
  bundle: views_aggregator
  rubric_ref: rubric/views_aggregator_no_permissions_no_config@1.0
  tags:
  - mode:recipe
- id: group-and-compress-rule
  input: What must be assigned before most group aggregation functions work?
  criteria: Exactly one field must be assigned the 'Group and compress' function (views_aggregator_group_and_compress).
    The only group function exempt is 'Filter rows'.
  bundle: views_aggregator
  rubric_ref: rubric/views_aggregator_group_and_compress_rule@1.0
  tags:
  - mode:recipe
- id: native-aggregation-conflict
  input: Can it be combined with Views' native SQL aggregation?
  criteria: 'No. In Advanced set ''Use aggregation: No''; VAgg+ aggregates post-query and conflicts with
    native aggregation.'
  bundle: views_aggregator
  rubric_ref: rubric/views_aggregator_native_aggregation_conflict@1.0
  tags:
  - mode:recipe
- id: add-custom-function
  input: How do you add a custom aggregation function?
  criteria: Implement hook_views_aggregation_functions_info() returning definitions keyed by function
    name with 'group', 'column' labels and optional 'is_renderable'. Alter existing ones with hook_views_aggregation_functions_info_alter().
  bundle: views_aggregator
  rubric_ref: rubric/views_aggregator_add_custom_function@1.0
  tags:
  - mode:recipe
- id: subtotals-mode
  input: How do you show per-group subtotals instead of collapsing rows?
  criteria: Set group_aggregation.group_aggregation_results to 1 ('no aggregation, results shown after
    each group'), optionally with result_label_prefix/suffix and grouping_row_class.
  bundle: views_aggregator
  rubric_ref: rubric/views_aggregator_subtotals_mode@1.0
  tags:
  - mode:recipe
- id: totals-position
  input: Where can the column aggregation (totals) row be displayed?
  criteria: In the table header (1), footer (2), or caption (3), via column_aggregation.totals_row_position;
    totals_per_page controls whole-resultset vs visible-page scope.
  bundle: views_aggregator
  rubric_ref: rubric/views_aggregator_totals_position@1.0
  tags:
  - mode:recipe
- id: submodule-functions
  input: What extra functions does the views_aggregator_more_functions submodule add?
  criteria: views_aggregator_group_seq_number (Group sequence no. / Group count), views_aggregator_range_diff
    (Range difference), and views_aggregator_percentage (Percentage / 100%).
  bundle: views_aggregator
  rubric_ref: rubric/views_aggregator_submodule_functions@1.0
  tags:
  - mode:recipe
