rubrics:
- id: views_aggregator_style_plugin_id
  version: '1.0'
  applicable_bundles:
  - views_aggregator
  checks:
  - kind: must_contain_any
    values:
    - views_aggregator_plugin_style_table
  - kind: must_contain_any
    values:
    - table
  scoring:
    combine: all_pass
- id: views_aggregator_no_permissions_no_config
  version: '1.0'
  applicable_bundles:
  - views_aggregator
  checks:
  - kind: must_contain_any
    values:
    - no permission
    - does not define
    - doesn't define
    - none
  - kind: must_contain_any
    values:
    - per-view
    - per view
    - style options
  scoring:
    combine: all_pass
- id: views_aggregator_group_and_compress_rule
  version: '1.0'
  applicable_bundles:
  - views_aggregator
  checks:
  - kind: must_contain_any
    values:
    - Group and compress
    - views_aggregator_group_and_compress
  scoring:
    combine: all_pass
- id: views_aggregator_native_aggregation_conflict
  version: '1.0'
  applicable_bundles:
  - views_aggregator
  checks:
  - kind: must_contain_any
    values:
    - Use aggregation
  scoring:
    combine: all_pass
- id: views_aggregator_add_custom_function
  version: '1.0'
  applicable_bundles:
  - views_aggregator
  checks:
  - kind: must_contain_any
    values:
    - hook_views_aggregation_functions_info
  scoring:
    combine: all_pass
- id: views_aggregator_subtotals_mode
  version: '1.0'
  applicable_bundles:
  - views_aggregator
  checks:
  - kind: must_contain_any
    values:
    - group_aggregation_results
    - after each group
  scoring:
    combine: all_pass
- id: views_aggregator_totals_position
  version: '1.0'
  applicable_bundles:
  - views_aggregator
  checks:
  - kind: must_contain_any
    values:
    - header
  - kind: must_contain_any
    values:
    - footer
  - kind: must_contain_any
    values:
    - caption
  scoring:
    combine: all_pass
- id: views_aggregator_submodule_functions
  version: '1.0'
  applicable_bundles:
  - views_aggregator
  checks:
  - kind: must_contain_any
    values:
    - views_aggregator_group_seq_number
    - Group sequence
  - kind: must_contain_any
    values:
    - views_aggregator_range_diff
    - Range difference
