  criteria: 'The root container title is ''vef_root_marker'': in views.view.vef_test at display.default.display_options.display_extenders.views_ef_fieldset.views_ef_fieldset.options.sort.root.title.
    Read with drush cget views.view.vef_test.'
  bundle: views_ef_fieldset
  rubric_ref: rubric/views_ef_fieldset_views_ef_fieldset_known_view@1.0
