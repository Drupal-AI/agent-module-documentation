metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: views_ef_fieldset
  version: 1.10.x
  note: Views EF Fieldset is a Views display-extender plugin (id views_ef_fieldset, class ViewsEFFieldset
    extends DefaultDisplayExtender) that groups a view's exposed filters/sorts/buttons into nested containers
    (container | details/Fieldset | vertical_tabs). It has no admin settings page (configure=null); all
    config is per view at display.<id>.display_options.display_extenders.views_ef_fieldset.views_ef_fieldset
    with keys enabled (bool) and options.sort (a flat map of items keyed by id, each with id, pid parent,
    weight, depth, type of container|filter|sort|buttons, and for containers container_type/title/description/open).
    At render, hook_form_views_exposed_form_alter rebuilds $form['filters']['children'] from that tree.
    Medium/hard cases use a namespaced view 'vef_test' built from the module's shipped test view, exercising
    that real config path.
questions:
- id: views_ef_fieldset-what-and-where
  input: What does the Drupal views_ef_fieldset module do, and where in the Views UI do I turn it on for
    a view?
  criteria: It groups a view's exposed form widgets (filters, sorts, buttons) into fieldsets/containers/vertical
    tabs. It is a Views display extender with no settings page; you enable it on the view's Exposed form
    settings via the 'Enable fieldset around exposed forms?' checkbox and build the grouping in the drag
    table.
  bundle: views_ef_fieldset
  rubric_ref: rubric/views_ef_fieldset_views_ef_fieldset_what_and_where@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: views_ef_fieldset-container-types
  input: In views_ef_fieldset, when I add a container to group exposed filters, what container types can
    I choose, and what render element does each produce?
  criteria: 'A container''s container_type can be ''container'' (a plain div), ''details'' (a collapsible
    Fieldset, honoring the open flag), or ''vertical_tabs''. These become the corresponding Form API #type
    on the rebuilt exposed form.'
  bundle: views_ef_fieldset
  rubric_ref: rubric/views_ef_fieldset_views_ef_fieldset_container_types@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: views_ef_fieldset-config-location
  input: Where is a views_ef_fieldset grouping stored in a Drupal view's configuration, and which top-level
    keys hold the on/off flag and the arrangement of items?
  criteria: In the view config under display.<display_id>.display_options.display_extenders.views_ef_fieldset.views_ef_fieldset,
    with 'enabled' (bool) and 'options.sort' (a flat map of items keyed by id, each with id/pid/weight/depth/type
    and, for containers, container_type/title/open).
  bundle: views_ef_fieldset
  rubric_ref: rubric/views_ef_fieldset_views_ef_fieldset_config_location@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: views_ef_fieldset-known-view
  input: On this Drupal site there is a view with machine name 'vef_test' that uses views_ef_fieldset.
    Inspect its configuration and tell me the title configured for the root (top-level) fieldset container
