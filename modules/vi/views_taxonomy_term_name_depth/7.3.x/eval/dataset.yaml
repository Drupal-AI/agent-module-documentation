metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: views_taxonomy_term_name_depth
  version: 7.3.x
  note: 'Views Taxonomy Term Name Depth provides one Views contextual filter (argument) handler, `taxonomy_index_name_depth`
    ("Has taxonomy term NAME (with depth)", exposed as node_field_data.term_node_taxonomy_name_depth),
    matching nodes by taxonomy TERM NAME (via Pathauto''s alias cleaner) with a configurable hierarchy
    depth; plus a companion default-argument plugin `taxonomy_tpid`. No settings form, no permissions,
    no Drush. Cases span three tiers: easy/recipe (response-graded facts about the plugin id and what
    it does), medium/introspection (a setup script builds a KNOWN view using the argument at a set depth,
    the agent inspects the live view config to answer, cleanup deletes the view), and hard/execution (reset
    clears state, the agent BUILDS a Content view whose contextual filter uses taxonomy_index_name_depth
    at depth 2, a verify script checks the live view config).'
questions:
- id: vttnd-plugin-id
  input: On a Drupal 11 site with the Views Taxonomy Term Name Depth module, what is the Views argument
    (contextual filter) plugin id it provides, and under what label does it appear when adding a contextual
    filter to a Content view?
  criteria: The argument handler plugin id is `taxonomy_index_name_depth`, exposed on the node base table
    as the contextual filter "Has taxonomy term NAME (with depth)" (field node_field_data.term_node_taxonomy_name_depth).
  bundle: views_taxonomy_term_name_depth
  rubric_ref: rubric/views_taxonomy_term_name_depth_vttnd_plugin_id@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: vttnd-what-it-does
  input: What does the Views Taxonomy Term Name Depth module's contextual filter match on, and what does
    its 'depth' option do?
  criteria: 'It filters content by taxonomy TERM NAME (not term id, resolved via Pathauto''s alias cleaner).
    The depth option walks the term hierarchy: a positive depth also includes nodes tagged with descendant/child
    terms, a negative depth includes ancestor/parent terms, and depth 0 matches only the exact term.'
  bundle: views_taxonomy_term_name_depth
  rubric_ref: rubric/views_taxonomy_term_name_depth_vttnd_what_it_does@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: vttnd-name-not-id
  input: How does the Views Taxonomy Term Name Depth contextual filter differ from Drupal core's 'Has
    taxonomy term ID (with depth)' filter, and which module must be installed for it to work?
  criteria: Core's filter keys off numeric term IDs; this module's `taxonomy_index_name_depth` argument
    accepts a human-readable term NAME in the URL. It requires the Pathauto module (a hard dependency)
    and uses pathauto.alias_cleaner to match cleaned names.
  bundle: views_taxonomy_term_name_depth
  rubric_ref: rubric/views_taxonomy_term_name_depth_vttnd_name_not_id@1.0
  tags:
  - mode:recipe
  - difficulty:easy
