metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: views_row_insert
  version: 2.2.x
  note: 'Views Row Insert provides one Views style plugin id ''row_insert'' (Drupal\views_row_insert\Plugin\views\style\ViewsRowInsert).
    No configure route (configure=null). State lives in the view config entity display.<id>.display_options.style
    (type: row_insert, options: use_plugin/data_mode/block_name/custom_row_data/rows_number/row_header/row_footer/row_limit_flag/row_limit/class_name/row_class/default_rows/strip_rows).
    Config schema views.style.row_insert. Medium/hard cases are grounded in that real view config: introspection
    reads back the style options of a seeded view; execution switches a view display''s style to row_insert
    / reconfigures its options, verified against the live view entity. The declared permission ''administer
    views row insert'' is unused in code.'
questions:
- id: views_row_insert-what-plugin
  input: In Drupal, I want to inject a Google AdSense block or some custom HTML into a view's results
    after every few rows. What does the views_row_insert module give me and where in a view do I turn
    it on?
  criteria: It adds a Views style plugin 'Row Insert' (id row_insert). You select it under the view display's
    Format section, choose Block or Custom content, and set 'Insert after every Nth row'. There is no
    separate admin settings page.
  bundle: views_row_insert
  rubric_ref: rubric/views_row_insert_views_row_insert_what_plugin@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: views_row_insert-option-keys
  input: For the views_row_insert 'Row Insert' style, which option controls how often the extra row is
    inserted, and which option holds the custom HTML that gets inserted? Name the option keys.
  criteria: rows_number sets 'insert after every Nth row'; custom_row_data holds the custom HTML (used
    when data_mode = vri_text). For a block instead, data_mode = vri_block and block_name selects the
    block.
  bundle: views_row_insert
  rubric_ref: rubric/views_row_insert_views_row_insert_option_keys@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: views_row_insert-block-vs-custom
  input: In views_row_insert, how do I tell it to insert a Drupal block versus arbitrary custom HTML,
    and is the custom HTML sanitized?
  criteria: 'The data_mode option chooses the source: vri_block inserts the block picked in block_name,
    vri_text inserts custom_row_data. The custom_row_data HTML is unrestricted/unsanitized (rendered with
    Twig raw), so only trusted view editors should set it.'
  bundle: views_row_insert
  rubric_ref: rubric/views_row_insert_views_row_insert_block_vs_custom@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: views_row_insert-known-rows-number
  input: On this Drupal site there is a view with machine name vri_known_view whose default display uses
    the Views Row Insert style. Inspect the live view configuration and state after how many rows it inserts
    the extra row (the rows_number option value).
  criteria: In views.view.vri_known_view the default display style is row_insert with options.rows_number
    = 4, so it inserts a row after every 4th row.
  bundle: views_row_insert
  rubric_ref: rubric/views_row_insert_views_row_insert_known_rows_number@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/views_row_insert-known-rows-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/views_row_insert-known-rows-cleanup.sh
- id: views_row_insert-known-custom-content
  input: The view vri_known_view on this site uses Views Row Insert to inject custom HTML. Inspect the
    live configuration and report the marker text contained in the custom content it inserts.
  criteria: The style options.custom_row_data is '<div class="promo">VRI-PROMO-XYZ</div>' (data_mode vri_text),
    so the marker is VRI-PROMO-XYZ.
  bundle: views_row_insert
  rubric_ref: rubric/views_row_insert_views_row_insert_known_custom_content@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/views_row_insert-known-rows-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/views_row_insert-known-rows-cleanup.sh
- id: views_row_insert-enable-style
  input: On this Drupal site there is a view vri_task_view whose default display currently uses the plain
    'Unformatted list' (default) style. Using views_row_insert, switch that display's style to Row Insert
    (row_insert) so it can inject rows, and save the change to the live site.
  criteria: In views.view.vri_task_view the default display display_options.style.type is set to row_insert
    (e.g. load the View, set the style type to row_insert with sensible options, and save).
  bundle: views_row_insert
  rubric_ref: rubric/views_row_insert_views_row_insert_enable_style@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/views_row_insert-enable-style-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/views_row_insert-enable-style-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/views_row_insert-enable-style-verify.sh
- id: views_row_insert-reconfigure
  input: The view vri_reconfig_view on this site already uses the Views Row Insert style, currently inserting
    after every 2nd row and NOT starting with an inserted row. Reconfigure it to insert after every 5th
    row and to start the output with an inserted row (the header option), then save to the live site.
  criteria: In views.view.vri_reconfig_view the row_insert style options set rows_number = 5 and row_header
    = true, saved to the live view entity.
  bundle: views_row_insert
  rubric_ref: rubric/views_row_insert_views_row_insert_reconfigure@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/views_row_insert-reconfig-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/views_row_insert-reconfig-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/views_row_insert-reconfig-verify.sh
