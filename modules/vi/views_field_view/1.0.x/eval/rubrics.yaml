rubrics:
- id: views_field_view_vfv_field_added
  version: '1.0'
  applicable_bundles:
  - views_field_view
  checks:
  - kind: must_contain_any
    values:
    - 'Global: View'
    - View field
    - '@ViewsField("view")'
    - embed
  scoring:
    combine: all_pass
- id: views_field_view_vfv_pass_field_as_argument
  version: '1.0'
  applicable_bundles:
  - views_field_view
  checks:
  - kind: must_contain_any
    values:
    - '{{ raw_fields.'
    - raw_fields
    - '{{ fields.'
  scoring:
    combine: all_pass
- id: views_field_view_vfv_token_types
  version: '1.0'
  applicable_bundles:
  - views_field_view
  checks:
  - kind: must_contain_any
    values:
    - raw_fields
    - raw_arguments
    - arguments
    - fields
  scoring:
    combine: all_pass
- id: views_field_view_vfv_field_order
  version: '1.0'
  applicable_bundles:
  - views_field_view
  checks:
  - kind: must_contain_any
    values:
    - render order
    - before
    - above
    - rearrange
    - up to and including
  scoring:
    combine: all_pass
- id: views_field_view_vfv_recursion
  version: '1.0'
  applicable_bundles:
  - views_field_view
  checks:
  - kind: must_contain_any
    values:
    - Recursion, stop!
    - recursion
    - evil
  scoring:
    combine: all_pass
- id: views_field_view_vfv_nested_listing
  version: '1.0'
  applicable_bundles:
  - views_field_view
  checks:
  - kind: must_contain_any
    values:
    - contextual filter
    - argument
    - child view
    - 'Global: View'
    - token
  scoring:
    combine: all_pass
- id: views_field_view_vfv_dependencies
  version: '1.0'
  applicable_bundles:
  - views_field_view
  checks:
  - kind: must_contain_any
    values:
    - views
    - no admin
    - no permissions
    - no settings form
  scoring:
    combine: all_pass
