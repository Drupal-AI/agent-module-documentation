metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: views_slideshow_cycle
  version: 5.0.x
  note: 'Views Slideshow Cycle is the reference engine submodule of views_slideshow: it provides the `views_slideshow_cycle`
    ViewsSlideshowType (jQuery Cycle), a large per-display options form, and Drush commands to fetch the
    external JS libraries. Cases are `recipe` (response-graded); no site mutation.'
questions:
- id: vssc-role
  input: What does the views_slideshow_cycle module do, and what does it depend on?
  criteria: It provides the `views_slideshow_cycle` slideshow type (jQuery Cycle engine) that animates
    a Views Slideshow; it depends on the base views_slideshow module.
  bundle: views_slideshow_cycle
  rubric_ref: rubric/views_slideshow_cycle_vssc_role@1.0
  tags:
  - mode:recipe
- id: vssc-plugin-id
  input: In a Views Slideshow display, which Slideshow Type value selects the jQuery Cycle engine, and
    which plugin class implements it?
  criteria: The `views_slideshow_cycle` slideshow type (id views_slideshow_cycle), implemented by Drupal\views_slideshow_cycle\Plugin\ViewsSlideshowType\Cycle
    (a ViewsSlideshowType plugin).
  bundle: views_slideshow_cycle
  rubric_ref: rubric/views_slideshow_cycle_vssc_plugin_id@1.0
  tags:
  - mode:recipe
- id: vssc-install-libs
  input: The Cycle slideshow shows a warning that the jQuery Cycle library is missing. What Drush command
    installs all the required JavaScript libraries?
  criteria: Run drush views:slideshow:lib (alias dl-cycle-lib) to download jQuery Cycle, HoverIntent,
    JSON2 and Pause into /libraries; per-library commands like drush views:slideshow:cycle also exist.
  bundle: views_slideshow_cycle
  rubric_ref: rubric/views_slideshow_cycle_vssc_install_libs@1.0
  tags:
  - mode:recipe
- id: vssc-stop-autorotate
  input: How do I stop a Views Slideshow Cycle from auto-rotating, and how do I change the transition
    effect and timing?
  criteria: Set timeout to 0 to disable auto-rotation; effect chooses the transition (default fade), timeout
    is ms between slides (default 5000), speed is transition duration ms (default 700).
  bundle: views_slideshow_cycle
  rubric_ref: rubric/views_slideshow_cycle_vssc_stop_autorotate@1.0
  tags:
  - mode:recipe
- id: vssc-pause-hover
  input: Which Cycle option pauses the slideshow when the visitor hovers over it, and what is its default?
  criteria: The `pause` option (Pause on hover), default 1/enabled, in the views_slideshow_cycle style
    options.
  bundle: views_slideshow_cycle
  rubric_ref: rubric/views_slideshow_cycle_vssc_pause_hover@1.0
  tags:
  - mode:recipe
- id: vssc-advanced-options
  input: I need a native jQuery Cycle option that isn't exposed in the Views Slideshow form. How can I
    set it?
  criteria: Use the 'jQuery Cycle Custom Options' section (advanced_options, stored as JSON) which exposes
    every native Cycle option; it requires json2.js installed under /libraries.
  bundle: views_slideshow_cycle
  rubric_ref: rubric/views_slideshow_cycle_vssc_advanced_options@1.0
  tags:
  - mode:recipe
- id: vssc-config-location
  input: Does views_slideshow_cycle have its own admin settings page? Where are its settings stored?
  criteria: No standalone settings page; its options live inside the host View's Slideshow style options
    under the views_slideshow_cycle key and export with the View.
  bundle: views_slideshow_cycle
  rubric_ref: rubric/views_slideshow_cycle_vssc_config_location@1.0
  tags:
  - mode:recipe
