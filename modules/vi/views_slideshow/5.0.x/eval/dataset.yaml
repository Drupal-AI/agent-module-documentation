metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: views_slideshow
  version: 5.0.x
  note: 'Views Slideshow is an API module: a `slideshow` Views style plus four plugin types (slideshow
    type, widget, widget type, skin), with no global config form — everything is per View display. It
    needs an engine submodule (views_slideshow_cycle) to animate. Cases are `recipe` (response-graded):
    they probe documented facts an agent would otherwise read source to answer; no site mutation.'
questions:
- id: vss-views-style
  input: On a Drupal 11 site I want to display the rows of a View as a rotating slideshow. Which module
    and which Views display format do I use, and is there a global admin settings page to configure it?
  criteria: Enable views_slideshow, set the display Format to 'Slideshow' (the `slideshow` Views style).
    There is no global settings form — configuration is per View display under Format settings.
  bundle: views_slideshow
  rubric_ref: rubric/views_slideshow_vss_views_style@1.0
  tags:
  - mode:recipe
- id: vss-needs-engine
  input: I enabled Views Slideshow and chose the Slideshow format but the settings form says no slideshow
    plugin is enabled / nothing animates. What else do I need to enable?
  criteria: Views Slideshow is only an API; you must enable an engine that provides a slideshow type —
    the bundled views_slideshow_cycle (jQuery Cycle) submodule, or another implementation.
  bundle: views_slideshow
  rubric_ref: rubric/views_slideshow_vss_needs_engine@1.0
  tags:
  - mode:recipe
- id: vss-plugin-types
  input: What plugin types does the views_slideshow module define for extending slideshows on Drupal 11?
  criteria: 'Four types: ViewsSlideshowType (engine), ViewsSlideshowWidget, ViewsSlideshowWidgetType,
    and ViewsSlideshowSkin — each discovered from src/Plugin/<TypeName> with a matching annotation and
    plugin manager.'
  bundle: views_slideshow
  rubric_ref: rubric/views_slideshow_vss_plugin_types@1.0
  tags:
  - mode:recipe
- id: vss-custom-engine
  input: I want to integrate a different JavaScript slider library as a Views Slideshow engine. Which
    plugin type do I implement and where does the class go?
  criteria: Implement a ViewsSlideshowType plugin (annotation @ViewsSlideshowType, extends ViewsSlideshowTypeBase)
    in src/Plugin/ViewsSlideshowType/; declare accepts/calls actions. The cycle submodule's Cycle plugin
    is the reference.
  bundle: views_slideshow
  rubric_ref: rubric/views_slideshow_vss_custom_engine@1.0
  tags:
  - mode:recipe
- id: vss-widgets
  input: How do I add previous/next controls, a pager and a slide counter to a Views Slideshow, and where
    do they appear?
  criteria: In the style's Widgets section enable the widget types (controls/pager/counter) per location
    (top and/or bottom) with a weight; bundled widgets include views_slideshow_controls_text, views_slideshow_pager_bullets,
    views_slideshow_pager_fields.
  bundle: views_slideshow
  rubric_ref: rubric/views_slideshow_vss_widgets@1.0
  tags:
  - mode:recipe
- id: vss-style-option-keys
  input: In an exported Views Slideshow display, which style option keys select the skin and the slideshow
    engine, and what are their defaults?
  criteria: slideshow_skin (default 'default') selects the skin; slideshow_type (default 'views_slideshow_cycle')
    selects the engine — both in the views.style.slideshow options.
  bundle: views_slideshow
  rubric_ref: rubric/views_slideshow_vss_style_option_keys@1.0
  tags:
  - mode:recipe
- id: vss-alter-hook
  input: From a custom module I want to alter the registered Views Slideshow type definitions. Which alter
    hook do I implement?
  criteria: Implement hook_views_slideshow_type_info() (the type manager's alterInfo); parallel hooks
    exist for widget, widget type, and skin registries.
  bundle: views_slideshow
  rubric_ref: rubric/views_slideshow_vss_alter_hook@1.0
  tags:
  - mode:recipe
- id: vss-templates
  input: Which template overrides the overall Views Slideshow output, and where do the pager/controls/counter
    templates live?
  criteria: The style renders via theme hook views_view_slideshow (views-view-slideshow.html.twig); copy
    the module's templates/ files (main-section, pager-*, controls-text*, slide-counter*) into your theme
    to override.
  bundle: views_slideshow
  rubric_ref: rubric/views_slideshow_vss_templates@1.0
  tags:
  - mode:recipe
