metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: viewsreference_filter
  version: 1.0.x
  note: 'Views Reference Field Filter provides a single ViewsReferenceSetting plugin (id ''exposed_filters'',
    label ''Exposed Filters - editor view'') for the viewsreference field. It has no config UI (configure=null),
    no permissions, no Drush, and no config schema of its own. It is switched on per field by adding ''exposed_filters''
    to that viewsreference field''s enabled_settings field setting (field.field.<entity>.<bundle>.<field>
    -> settings.enabled_settings), a setting defined by the parent viewsreference module. All medium/hard
    cases are grounded in that real field config: introspection reads which viewsreference field has exposed_filters
    enabled; execution turns exposed_filters on for a given field, verified against the live FieldConfig.'
questions:
- id: viewsreference_filter-plugin-id
  input: The Drupal contrib module viewsreference_filter extends the Views Reference (viewsreference)
    field. What kind of plugin does it add, and what is that plugin's machine id?
  criteria: It provides a ViewsReferenceSetting plugin with id 'exposed_filters' (label 'Exposed Filters
    - editor view') that lets editors set a referenced view's exposed filter values on the entity form.
  bundle: viewsreference_filter
  rubric_ref: rubric/viewsreference_filter_viewsreference_filter_plugin_id@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: viewsreference_filter-how-to-enable
  input: On a Drupal 11 site with viewsreference_filter installed, how do I turn on the editor exposed-filters
    feature for a specific Views reference field, and where is that choice stored in config?
  criteria: There is no settings page. You edit the viewsreference field and, under 'Enable extra settings',
    tick 'Exposed Filters - editor view'. It is stored as 'exposed_filters' in the field's enabled_settings
    setting, i.e. field.field.<entity>.<bundle>.<field> -> settings.enabled_settings.
  bundle: viewsreference_filter
  rubric_ref: rubric/viewsreference_filter_viewsreference_filter_how_to_enable@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: viewsreference_filter-show-on-page
  input: In viewsreference_filter, what does the 'Show Filters on Page' checkbox control, and what happens
    to the embedded view's exposed form when it is left unchecked?
  criteria: The checkbox (stored key vr_exposed_filters_visible) decides whether the visitor sees the
    view's exposed form. When unchecked, the editor's values are forced as fixed exposed input via setExposedInput()
    and the exposed form is hidden on the page (exposed_block forced TRUE); when checked, the exposed
    form is shown and visitors can override.
  bundle: viewsreference_filter
  rubric_ref: rubric/viewsreference_filter_viewsreference_filter_show_on_page@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: viewsreference_filter-known-field
  input: On this Drupal site, the Article content type has a Views reference field that has been configured
    with viewsreference_filter so editors can set exposed filter values. Inspect the live field configuration
    and give the machine name of that field.
  criteria: 'The field is field_vrf_known: its field config (field.field.node.article.field_vrf_known)
    has settings.enabled_settings containing ''exposed_filters''.'
  bundle: viewsreference_filter
  rubric_ref: rubric/viewsreference_filter_viewsreference_filter_known_field@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/viewsreference_filter-known-field-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/viewsreference_filter-known-field-cleanup.sh
- id: viewsreference_filter-which-enabled
  input: The Article content type on this site has two Views reference fields, field_vrf_on and field_vrf_off.
    Exactly one of them has the viewsreference_filter exposed-filters editor feature enabled. Inspect
    the live field configuration and state which field has it enabled.
  criteria: 'field_vrf_on has it enabled: its enabled_settings contains ''exposed_filters'', whereas field_vrf_off
    has an empty enabled_settings.'
  bundle: viewsreference_filter
  rubric_ref: rubric/viewsreference_filter_viewsreference_filter_which_enabled@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/viewsreference_filter-which-enabled-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/viewsreference_filter-which-enabled-cleanup.sh
- id: viewsreference_filter-enable-exposed
  input: On this Drupal site, the Article content type has a Views reference field field_vrf_task with
    the viewsreference_filter exposed-filters feature turned off. Using viewsreference_filter, enable
    the 'Exposed Filters - editor view' setting on that field and apply the change to the live site.
  criteria: Add 'exposed_filters' to field_vrf_task's enabled_settings field setting (e.g. load FieldConfig
    node.article.field_vrf_task, add exposed_filters to settings.enabled_settings, save), so field.field.node.article.field_vrf_task
    -> settings.enabled_settings contains exposed_filters.
  bundle: viewsreference_filter
  rubric_ref: rubric/viewsreference_filter_viewsreference_filter_enable_exposed@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/viewsreference_filter-enable-exposed-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/viewsreference_filter-enable-exposed-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/viewsreference_filter-enable-exposed-verify.sh
- id: viewsreference_filter-enable-exposed-layman
  input: On my site, articles have a field called field_vrf_task where I pick a view to show. I want my
    content editors to be able to set the view's filters (like category) right there on the article edit
    form. Please switch that on for the field_vrf_task field.
  criteria: 'The viewsreference_filter ''Exposed Filters - editor view'' setting is enabled on field_vrf_task:
    field.field.node.article.field_vrf_task -> settings.enabled_settings contains exposed_filters.'
  bundle: viewsreference_filter
  rubric_ref: rubric/viewsreference_filter_viewsreference_filter_enable_exposed_layman@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: site-owner
    reset: agent-module-documentation/evaluation/verify/viewsreference_filter-enable-exposed-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/viewsreference_filter-enable-exposed-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/viewsreference_filter-enable-exposed-verify.sh
