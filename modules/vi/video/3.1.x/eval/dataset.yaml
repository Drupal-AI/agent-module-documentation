metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: video
  version: 3.1.x
  note: Video exposes a `video` field type with upload/embed widgets, HTML5/embed formatters, a pluggable
    embed-provider plugin type, per-provider stream wrappers, and a video_transcode submodule. Cases are
    `recipe` (response-graded) probing documented facts an agent would otherwise read source to find;
    no site mutation.
questions:
- id: video-field-type-and-defaults
  input: On a Drupal 11 site, which field type does the Video module add, what core field type does it
    extend, and what are its default widget and formatter?
  criteria: It adds the `video` field type, which extends core FileItem; default widget is `video_embed`
    and default formatter is `video_embed_player`.
  bundle: video
  rubric_ref: rubric/video_video_field_type_and_defaults@1.0
  tags:
  - mode:recipe
- id: video-upload-vs-embed-widget
  input: I want editors to upload MP4/WebM files rather than paste a YouTube URL into a Video field. Which
    widget do I pick on Manage form display, and what is the other widget?
  criteria: Choose the `video_upload` widget for local file uploads (default extensions mp4 ogv webm);
    the `video_embed` widget is for pasting a remote provider URL.
  bundle: video
  rubric_ref: rubric/video_video_upload_vs_embed_widget@1.0
  tags:
  - mode:recipe
- id: video-html5-formatter
  input: Which Video formatter renders an uploaded file in an HTML5 <video> player, and name two of its
    playback settings.
  criteria: The `video_player` (HTML5 Video Player) formatter; settings include controls, autoplay, loop,
    muted, width, height, preload.
  bundle: video
  rubric_ref: rubric/video_video_html5_formatter@1.0
  tags:
  - mode:recipe
- id: video-add-provider-plugin
  input: I need to support embedding videos from a new host in the Drupal Video module. What plugin type
    / annotation do I implement, which directory does the plugin live in, and which annotation properties
    match the URL and set the stream scheme?
  criteria: Implement a @VideoEmbeddableProvider plugin under src/Plugin/video/Provider/ extending ProviderPluginBase;
    `regular_expressions` match the URL (named `id` capture) and `stream_wrapper` sets the scheme (equal
    to the plugin id).
  bundle: video
  rubric_ref: rubric/video_video_add_provider_plugin@1.0
  tags:
  - mode:recipe
- id: video-provider-manager-service
  input: In code on a Drupal site, which service lists the available Video embed providers and detects
    which provider handles a given URL, and which method does the URL matching?
  criteria: The video.provider_manager service (Drupal\video\ProviderManager); getProvidersOptionList()
    lists providers and loadApplicableDefinitionMatches() matches a URL to a provider.
  bundle: video
  rubric_ref: rubric/video_video_provider_manager_service@1.0
  tags:
  - mode:recipe
- id: video-bundled-providers
  input: Which remote video embed providers does the Video module ship with out of the box on Drupal 11?
  criteria: YouTube, Vimeo, Dailymotion, Facebook, Instagram, and Vine, each with a matching read-only
    stream wrapper.
  bundle: video
  rubric_ref: rubric/video_video_bundled_providers@1.0
  tags:
  - mode:recipe
- id: video-transcode-submodule
  input: I want to convert uploaded videos into web-compatible formats using local FFmpeg on a Drupal
    site with the Video module. Which submodule provides this?
  criteria: The video_transcode submodule adds local FFmpeg transcoding, reusable presets, and a `video_upload_transcode`
    (Video Upload & Convert) widget.
  bundle: video
  rubric_ref: rubric/video_video_transcode_submodule@1.0
  tags:
  - mode:recipe
- id: video-configure-location
  input: Where do I configure the Video module on a Drupal 11 site — is there a global admin settings
    page?
  criteria: There is no global settings page (info.yml declares no configure route); configuration is
    per field and on Manage form display (widget) and Manage display (formatter).
  bundle: video
  rubric_ref: rubric/video_video_configure_location@1.0
  tags:
  - mode:recipe
