metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: video_transcode
  version: 3.1.x
  note: video_transcode is a submodule of Video (part_of video). It adds a `transcoder` plugin type (ffmpeg),
    a video_transcode_preset config entity, a video_transcode_job content entity, a video_upload_transcode
    widget, and permissions. Cases are `recipe` (response-graded), probing documented facts; no site mutation.
questions:
- id: video-transcode-purpose-dep
  input: What does the video_transcode Drupal module do, and which module does it depend on?
  criteria: It converts uploaded video files into web-compatible formats using a transcoder (FFmpeg);
    it depends on the parent `video` module.
  bundle: video_transcode
  rubric_ref: rubric/video_transcode_video_transcode_purpose_dep@1.0
  tags:
  - mode:recipe
- id: video-transcode-plugin-type
  input: I want to add a custom cloud transcoding backend to the Drupal video_transcode module. Which
    annotation/plugin type do I implement, which directory does it live in, and which interface methods
    are required?
  criteria: Implement a @Transcoder plugin under src/Plugin/video/Transcoder/ extending TranscoderBase;
    TranscoderInterface requires getOutputFiles() and getVideoThumbnails(). Set isExternal=true for a
    cloud service.
  bundle: video_transcode
  rubric_ref: rubric/video_transcode_video_transcode_plugin_type@1.0
  tags:
  - mode:recipe
- id: video-transcode-bundled-plugin
  input: Which transcoder plugin ships with the video_transcode module by default, and is it a local or
    external service?
  criteria: The `ffmpeg` plugin ships by default; it is a local (isExternal = false) service.
  bundle: video_transcode
  rubric_ref: rubric/video_transcode_video_transcode_bundled_plugin@1.0
  tags:
  - mode:recipe
- id: video-transcode-preset-entity
  input: In video_transcode, where do I define reusable output settings (codec, resolution, bitrate),
    what kind of entity is it, and at what admin path is it managed?
  criteria: A `video_transcode_preset` config entity, managed at /admin/config/media/transcode-preset;
    properties include video_codec, wxh (resolution), video_bitrate, audio settings, watermark, etc.
  bundle: video_transcode
  rubric_ref: rubric/video_transcode_video_transcode_preset_entity@1.0
  tags:
  - mode:recipe
- id: video-transcode-widget
  input: Which field widget does video_transcode add so editors can upload a video and convert it in one
    step, and what widget does it extend?
  criteria: The `video_upload_transcode` ("Video Upload & Convert") widget, which extends the Video module's
    `video_upload` widget.
  bundle: video_transcode
  rubric_ref: rubric/video_transcode_video_transcode_widget@1.0
  tags:
  - mode:recipe
- id: video-transcode-permissions
  input: Which permission gates creating and editing video transcode presets on a Drupal site?
  criteria: The 'administer video transcode presets' permission; transcode jobs are gated by separate
    add/view/edit/delete transcode job entity permissions.
  bundle: video_transcode
  rubric_ref: rubric/video_transcode_video_transcode_permissions@1.0
  tags:
  - mode:recipe
