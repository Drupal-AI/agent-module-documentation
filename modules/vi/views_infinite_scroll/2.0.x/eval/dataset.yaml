metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: views_infinite_scroll
  version: 2.0.x
  note: Views Infinite Scroll is configured entirely inside a View's pager settings (no admin page, no
    permissions), so all cases are `recipe` (response-graded), not `execution` (live-state).
questions:
- id: vis-enable-pager
  input: On a Drupal 11 site with the Views Infinite Scroll module enabled, I have a View listing that
    currently uses numbered pages. How do I switch it to infinite scroll? Describe where in the View I
    make the change.
  criteria: In the View's Pager settings, click the current pager (Full / Mini) and choose the 'Infinite
    Scroll' (infinite_scroll) pager plugin. There is no admin settings page.
  bundle: views_infinite_scroll
  rubric_ref: rubric/views_infinite_scroll_vis_enable_pager@1.0
  tags:
  - mode:recipe
- id: vis-requires-views-pager
  input: Does Views Infinite Scroll replace the mini or full Views pager, or is it a separate kind of
    feature? Explain what it actually is.
  criteria: It is a Views pager plugin (infinite_scroll) that you select in the Pager settings instead
    of the 'Full' or 'Mini' pager. It requires a Views pager slot.
  bundle: views_infinite_scroll
  rubric_ref: rubric/views_infinite_scroll_vis_requires_views_pager@1.0
  tags:
  - mode:recipe
- id: vis-requires-ajax
  input: I selected the Infinite Scroll pager on my View but new results are not loading when I scroll.
    What View setting is required for it to work?
  criteria: The View must have AJAX enabled (Advanced → Use AJAX = Yes). The pager cannot append pages
    without it; the View edit form warns you if AJAX is off.
  bundle: views_infinite_scroll
  rubric_ref: rubric/views_infinite_scroll_vis_requires_ajax@1.0
  tags:
  - mode:recipe
- id: vis-auto-load-option
  input: Using the Views Infinite Scroll pager, I want the next page of results to load automatically
    as the user scrolls to the bottom, rather than requiring a button click. Which pager option controls
    this?
  criteria: Set the 'automatically_load_content' option to TRUE so the next page loads automatically on
    scroll; when FALSE, content only loads on button click.
  bundle: views_infinite_scroll
  rubric_ref: rubric/views_infinite_scroll_vis_auto_load_option@1.0
  tags:
  - mode:recipe
- id: vis-button-label
  input: I want to change the text on the Views Infinite Scroll 'load more' button to say 'Show more articles'.
    Which pager option do I set?
  criteria: Set the 'button_text' pager option to the desired label, e.g. 'Show more articles'.
  bundle: views_infinite_scroll
  rubric_ref: rubric/views_infinite_scroll_vis_button_label@1.0
  tags:
  - mode:recipe
- id: vis-initially-load-all
  input: With Views Infinite Scroll, if a user deep-links directly to page 3 of the listing, I want all
    earlier pages loaded on initial render too. Which pager option enables that?
  criteria: Enable the 'initially_load_all_pages' option to load all pages up to the current one on initial
    render (useful for deep-linking to a later page).
  bundle: views_infinite_scroll
  rubric_ref: rubric/views_infinite_scroll_vis_initially_load_all@1.0
  tags:
  - mode:recipe
- id: vis-js-library
  input: I want to override the JavaScript that Views Infinite Scroll uses to fetch and append the next
    page. What is the module's library, and how do I replace its script?
  criteria: The library is views_infinite_scroll/views-infinite-scroll (js/infinite-scroll.js, depends
    on core/jquery, core/once, core/drupal, core/drupal.debounce and views/views.ajax). Override it in
    your theme's *.libraries.yml via libraries-override with your own script.
  bundle: views_infinite_scroll
  rubric_ref: rubric/views_infinite_scroll_vis_js_library@1.0
  tags:
  - mode:recipe
- id: vis-theme-template
  input: How do I customize the markup of the Views Infinite Scroll pager (the wrapper and button) in
    my theme? Name the template.
  criteria: Override the templates/views-infinite-scroll-pager.html.twig template in your theme; hook_preprocess_views_infinite_scroll_pager()
    computes the next link and attributes.
  bundle: views_infinite_scroll
  rubric_ref: rubric/views_infinite_scroll_vis_theme_template@1.0
  tags:
  - mode:recipe
