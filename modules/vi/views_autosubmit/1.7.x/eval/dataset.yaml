metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: views_autosubmit
  version: 1.7.x
  note: 'Views Autosubmit ships one Views exposed_form plugin, id ''autosubmit'' (class Autosubmit extends
    ExposedFormPluginBase). It defines no new plugin type, no settings form, no configure route, no permissions,
    no Drush. Its state is entirely in the view display config at display_options.exposed_form.type: autosubmit
    with options.autosubmit_hide (bool, default TRUE) and options.timeout (int ms, default 500). Medium/hard
    cases are grounded in real view config: introspection reads back which view uses autosubmit and its
    timeout; execution switches a view''s exposed-form style to autosubmit and sets its options, verified
    against the live views.view config.'
questions:
- id: views_autosubmit-how-enable
  input: Using the views_autosubmit module, how do I make a View's exposed filter form submit automatically
    instead of requiring a click on Apply? Where in the Views UI do I select it?
  criteria: In the view editor, under Advanced -> Exposed form -> 'Exposed form style', change from Basic
    to 'Autosubmit' and Apply/Save. This sets display_options.exposed_form.type to 'autosubmit'. Usually
    also enable Use AJAX so results refresh in place.
  bundle: views_autosubmit
  rubric_ref: rubric/views_autosubmit_views_autosubmit_how_enable@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: views_autosubmit-options
  input: What options does the views_autosubmit 'Autosubmit' exposed form plugin provide, and what are
    their default values?
  criteria: 'Two options: autosubmit_hide (boolean, default TRUE) hides the submit button when JavaScript
    is enabled, and timeout (integer milliseconds, default 500) is the debounce delay after the user stops
    typing before the form auto-submits.'
  bundle: views_autosubmit
  rubric_ref: rubric/views_autosubmit_views_autosubmit_options@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: views_autosubmit-plugin-id
  input: What is the plugin id and plugin type of the exposed-form plugin provided by views_autosubmit,
    and which core base class does it extend?
  criteria: It is a Views exposed_form plugin with id 'autosubmit' (annotation @ViewsExposedForm), class
    Drupal\views_autosubmit\Plugin\views\exposed_form\Autosubmit, extending core ExposedFormPluginBase.
    It does not define a new plugin type.
  bundle: views_autosubmit
  rubric_ref: rubric/views_autosubmit_views_autosubmit_plugin_id@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: views_autosubmit-known-timeout
  input: On this Drupal site there is a view with machine name va_known that uses the Autosubmit exposed
    form. Inspect the live view configuration and report the timeout (in milliseconds) configured for
    its autosubmit exposed form.
  criteria: 'The va_known view''s default display has exposed_form.type: autosubmit with options.timeout:
    1200 (and autosubmit_hide: false).'
  bundle: views_autosubmit
  rubric_ref: rubric/views_autosubmit_views_autosubmit_known_timeout@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/views_autosubmit-known-timeout-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/views_autosubmit-known-timeout-cleanup.sh
- id: views_autosubmit-which-view
  input: This site has two views, va_auto and va_basic. Exactly one of them uses the views_autosubmit
    'Autosubmit' exposed form style. Inspect the live view configurations and state which view autosubmits
    its exposed filters.
  criteria: 'va_auto uses the autosubmit exposed form (display_options.exposed_form.type: autosubmit);
    va_basic uses the default ''basic'' exposed form.'
  bundle: views_autosubmit
  rubric_ref: rubric/views_autosubmit_views_autosubmit_which_view@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/views_autosubmit-which-view-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/views_autosubmit-which-view-cleanup.sh
- id: views_autosubmit-enable
  input: This Drupal site has a view with machine name va_task whose default display currently uses the
    'Basic' exposed form. Using the views_autosubmit module, change the default display's exposed form
    style to Autosubmit and save it to the live site.
  criteria: In views.view.va_task the default display's display_options.exposed_form.type is changed from
    'basic' to 'autosubmit' (e.g. edit the view and set Exposed form style to Autosubmit, or set the config
    and save).
  bundle: views_autosubmit
  rubric_ref: rubric/views_autosubmit_views_autosubmit_enable@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/views_autosubmit-enable-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/views_autosubmit-enable-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/views_autosubmit-enable-verify.sh
- id: views_autosubmit-configure
  input: The va_conf view on this site already uses the Autosubmit exposed form, but its submit button
    is shown and its typing timeout is 500 ms. Configure the autosubmit exposed form on va_conf's default
    display so the submit button is hidden (autosubmit_hide on) and the timeout is 2500 ms, and save it
    to the live site.
  criteria: 'In views.view.va_conf the default display''s exposed_form (type autosubmit) has options.autosubmit_hide:
    true and options.timeout: 2500.'
  bundle: views_autosubmit
  rubric_ref: rubric/views_autosubmit_views_autosubmit_configure@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/views_autosubmit-configure-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/views_autosubmit-configure-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/views_autosubmit-configure-verify.sh
