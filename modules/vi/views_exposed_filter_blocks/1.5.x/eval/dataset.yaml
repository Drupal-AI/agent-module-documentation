metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: views_exposed_filter_blocks
  version: 1.5.x
  note: 'Views exposed filter blocks provides a single core Block plugin, id ''views_exposed_filter_blocks_block''
    (category ''Views Exposed Filter Blocks''), that renders a view display''s exposed filter form as
    a standalone block placeable in any region. No configure route (configure=null), no permissions, no
    Drush, no plugin types. Its only persistent state is per-block config in each block.block.<id> config
    entity, with two module-specific settings: view_display (''<view_id>:<display_id>'', e.g. content:page_1)
    and form_state_always_process (boolean, default TRUE). All medium/hard cases are grounded in that
    real block config on the live site: introspection reads back a placed block''s view_display and form_state_always_process;
    execution places a block for content:page_1 and verifies the plugin id + settings against the live
    block.block config entity. The core ''content'' view (display page_1) is used as a stable target that
    ships with exposed filters.'
questions:
- id: vefb-block-plugin-id
  input: On a Drupal 11 site I have a view whose display is NOT a page (for example an EVA or attachment
    display) and I want its exposed filters to appear as a separate block in a sidebar. Using the views_exposed_filter_blocks
    module, how do I do that and what is the block plugin called?
  criteria: Enable the module and go to Structure > Block layout, click Place block, and add the 'Views
    exposed filter block' (plugin id views_exposed_filter_blocks_block, category 'Views Exposed Filter
    Blocks') in the desired region, then choose the view & display whose exposed filters to render. It
    works for any display plugin, not just page displays.
  bundle: views_exposed_filter_blocks
  rubric_ref: rubric/views_exposed_filter_blocks_vefb_block_plugin_id@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: vefb-two-settings
  input: What configuration settings does a views_exposed_filter_blocks block instance have, and what
    format is the value that selects which view/display's filters to show?
  criteria: 'Two settings: view_display, a ''<view_id>:<display_id>'' string (e.g. content:page_1) selecting
    the view and display; and form_state_always_process, a boolean (default TRUE) that makes the block
    process submitted input on build. They are stored on the block.block.<id> config entity under settings.'
  bundle: views_exposed_filter_blocks
  rubric_ref: rubric/views_exposed_filter_blocks_vefb_two_settings@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: vefb-vs-alternatives
  input: How does the views_exposed_filter_blocks module differ from views_block_filter_block, and which
    view display types does it support?
  criteria: views_block_filter_block is configured on the view and only works for 'block' display plugins;
    views_exposed_filter_blocks is configured entirely on the block (you pick the view & display in the
    block settings) and works for any display plugin, including eva, page, block, and attachment displays.
  bundle: views_exposed_filter_blocks
  rubric_ref: rubric/views_exposed_filter_blocks_vefb_vs_alternatives@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: vefb-which-view
  input: This Drupal site has a block named 'vefb_eval' placed with the views_exposed_filter_blocks module.
    Inspect the live block configuration and state which view and display its exposed filters come from.
  criteria: block.block.vefb_eval uses plugin views_exposed_filter_blocks_block and its settings.view_display
    is 'content:page_1', so it renders the exposed filters of the core Content view's page_1 display.
  bundle: views_exposed_filter_blocks
  rubric_ref: rubric/views_exposed_filter_blocks_vefb_which_view@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/views_exposed_filter_blocks-eval-target-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/views_exposed_filter_blocks-eval-target-cleanup.sh
- id: vefb-process-setting
  input: A views_exposed_filter_blocks block named 'vefb_eval2' is placed on this site. Its 'always process
    the form state' option has been set to a non-default value. Inspect the live block configuration and
    state whether that block processes the submitted form state on build (i.e. the value of form_state_always_process).
  criteria: In block.block.vefb_eval2 settings.form_state_always_process is FALSE (the default is TRUE),
    so the block does not process the submitted form state on build; it only submits values to the results
    view.
  bundle: views_exposed_filter_blocks
  rubric_ref: rubric/views_exposed_filter_blocks_vefb_process_setting@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/views_exposed_filter_blocks-eval-process-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/views_exposed_filter_blocks-eval-process-cleanup.sh
- id: vefb-place-block
  input: On this Drupal site, use the views_exposed_filter_blocks module to place a block with the machine
    id 'vefb_task' that renders the exposed filters of the core Content view's page_1 display. Apply the
    change to the live site (any region is fine).
  criteria: 'A block.block.vefb_task config entity with plugin: views_exposed_filter_blocks_block and
    settings.view_display: ''content:page_1'' (place the ''Views exposed filter block'' and select the
    Content view / page_1 display, or create the Block config entity directly).'
  bundle: views_exposed_filter_blocks
  rubric_ref: rubric/views_exposed_filter_blocks_vefb_place_block@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/views_exposed_filter_blocks-place-block-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/views_exposed_filter_blocks-place-block-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/views_exposed_filter_blocks-place-block-verify.sh
- id: vefb-feed-only
  input: On this Drupal site, use views_exposed_filter_blocks to place a block with machine id 'vefb_task2'
    that shows the exposed filters of the Content view's page_1 display, but configure it so the block
    only submits filter values to the results view and does NOT process/display submitted values itself
    (turn off 'always process the form state'). Apply the change to the live site.
  criteria: 'A block.block.vefb_task2 config entity with plugin: views_exposed_filter_blocks_block, settings.view_display:
    ''content:page_1'', and settings.form_state_always_process: false.'
  bundle: views_exposed_filter_blocks
  rubric_ref: rubric/views_exposed_filter_blocks_vefb_feed_only@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/views_exposed_filter_blocks-feed-only-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/views_exposed_filter_blocks-feed-only-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/views_exposed_filter_blocks-feed-only-verify.sh
