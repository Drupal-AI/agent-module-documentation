rubrics:
- id: views_exposed_filter_blocks_vefb_block_plugin_id
  version: '1.0'
  applicable_bundles:
  - views_exposed_filter_blocks
  checks:
  - kind: must_contain_any
    values:
    - views_exposed_filter_blocks_block
    - Views exposed filter block
    - Block layout
    - Place block
  scoring:
    combine: all_pass
- id: views_exposed_filter_blocks_vefb_two_settings
  version: '1.0'
  applicable_bundles:
  - views_exposed_filter_blocks
  checks:
  - kind: must_contain_any
    values:
    - view_display
    - form_state_always_process
    - view_id:display_id
    - <view_id>:<display_id>
  scoring:
    combine: all_pass
- id: views_exposed_filter_blocks_vefb_vs_alternatives
  version: '1.0'
  applicable_bundles:
  - views_exposed_filter_blocks
  checks:
  - kind: must_contain_any
    values:
    - any display
    - all types of view display
    - not just block
    - configured on the block
    - eva
  scoring:
    combine: all_pass
- id: views_exposed_filter_blocks_vefb_which_view
  version: '1.0'
  applicable_bundles:
  - views_exposed_filter_blocks
  checks:
  - kind: must_contain_any
    values:
    - content:page_1
    - content view
    - page_1
  scoring:
    combine: all_pass
- id: views_exposed_filter_blocks_vefb_process_setting
  version: '1.0'
  applicable_bundles:
  - views_exposed_filter_blocks
  checks:
  - kind: must_contain_any
    values:
    - 'false'
    - 'False'
    - 'FALSE'
    - does not process
    - will not process
    - disabled
    - turned off
  scoring:
    combine: all_pass
- id: views_exposed_filter_blocks_vefb_place_block
  version: '1.0'
  applicable_bundles:
  - views_exposed_filter_blocks
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
- id: views_exposed_filter_blocks_vefb_feed_only
  version: '1.0'
  applicable_bundles:
  - views_exposed_filter_blocks
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
