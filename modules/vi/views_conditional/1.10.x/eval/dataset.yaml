metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: views_conditional
  version: 1.10.x
  note: 'Views Conditional provides a single Views field handler configured entirely inside a view (no
    admin form, no config entity, no permissions). Cases are `recipe` (response-graded): they probe documented
    facts about the field id, operators, tokens, and the field-ordering requirement that an agent would
    otherwise read source to answer. No site mutation.'
questions:
- id: views_conditional-add-field
  input: On a Drupal 11 site I want a Views field that prints one thing when another field matches a condition
    and something else otherwise. Which module/field do I add and what is the Views field handler id?
  criteria: 'Add the Views Conditional module''s field, listed as ''Views: Views Conditional'' (handler
    id views_conditional_field), to the view''s Fields.'
  bundle: views_conditional
  rubric_ref: rubric/views_conditional_views_conditional_add_field@1.0
  tags:
  - mode:recipe
- id: views_conditional-field-ordering
  input: My Views Conditional field always outputs the Otherwise value and never sees the field I want
    to test. Why, and how do I fix the field ordering?
  criteria: The conditional field has no query and only reads fields rendered before it, so it must be
    placed AFTER (below) every field it references; the tested fields must appear above it in the field
    list.
  bundle: views_conditional
  rubric_ref: rubric/views_conditional_views_conditional_field_ordering@1.0
  tags:
  - mode:recipe
- id: views_conditional-operators
  input: What comparison operators can the Views Conditional field use in its 'Is...' setting?
  criteria: eq Equal to, neq NOT equal to, gt Greater than, gte Greater than or equals, lt Less than,
    lte Less than or equals, em Empty, nem NOT empty, cn Contains, ncn Does NOT contain, and length operators
    leq/lneq/lgt/llt.
  bundle: views_conditional
  rubric_ref: rubric/views_conditional_views_conditional_operators@1.0
  tags:
  - mode:recipe
- id: views_conditional-reference-other-field
  input: In the Views Conditional field's 'This value' or output text, how do I insert the value of another
    field in the same row, e.g. a field whose machine name is field_price?
  criteria: Use the {{ field_machine_name }} token, e.g. {{ field_price }}; only fields placed above the
    conditional field are available.
  bundle: views_conditional
  rubric_ref: rubric/views_conditional_views_conditional_reference_other_field@1.0
  tags:
  - mode:recipe
- id: views_conditional-exclude-from-display
  input: I only want the Views Conditional output to show, not the raw field it tests. How do I hide the
    source field while still using it in the condition?
  criteria: Set the source field to 'Exclude from display' so it is still rendered (and readable by the
    conditional field via its machine name token) but not shown.
  bundle: views_conditional
  rubric_ref: rubric/views_conditional_views_conditional_exclude_from_display@1.0
  tags:
  - mode:recipe
- id: views_conditional-date-tokens
  input: Which built-in replacement tokens does the Views Conditional field provide for the current date/time
    in the compare value or output?
  criteria: DATE_UNIX (current request time as a UNIX timestamp) and DATE_STAMP (current time in the default
    date format).
  bundle: views_conditional
  rubric_ref: rubric/views_conditional_views_conditional_date_tokens@1.0
  tags:
  - mode:recipe
- id: views_conditional-badge-usage
  input: I want a Views column that shows a 'Free' badge when field_price equals 0 and otherwise prints
    the price. Outline how to configure the Views Conditional field.
  criteria: Add field_price (excluded from display) above the conditional field, set If=field_price, condition=Equal
    to, This value=0, Then output=Free, Otherwise output={{ field_price }}.
  bundle: views_conditional
  rubric_ref: rubric/views_conditional_views_conditional_badge_usage@1.0
  tags:
  - mode:recipe
- id: views_conditional-strip-tags
  input: The Views Conditional output includes unwanted HTML markup wrapping my value. Which field option
    removes HTML tags from the output?
  criteria: Enable the 'Strip html tags from the output' option (strip_tags), which trims and strips tags
    from the rendered output.
  bundle: views_conditional
  rubric_ref: rubric/views_conditional_views_conditional_strip_tags@1.0
  tags:
  - mode:recipe
