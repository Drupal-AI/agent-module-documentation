rubrics:
- id: views_dependent_filters_views_dependent_filters_what_to_add
  version: '1.0'
  applicable_bundles:
  - views_dependent_filters
  checks:
  - kind: must_contain_any
    values:
    - Dependent filter
    - 'Global: Dependent filter'
    - views_dependent_filter
    - after the controller
    - before the dependent
  scoring:
    combine: all_pass
- id: views_dependent_filters_views_dependent_filters_options
  version: '1.0'
  applicable_bundles:
  - views_dependent_filters
  checks:
  - kind: must_contain_any
    values:
    - condition
    - not_empty
    - not empty
    - values
    - controller_filter
    - dependent_filters
    - negate
  scoring:
    combine: all_pass
- id: views_dependent_filters_views_dependent_filters_no_query
  version: '1.0'
  applicable_bundles:
  - views_dependent_filters
  checks:
  - kind: must_contain_any
    values:
    - no query
    - does not filter
    - '#states'
    - after_build
    - does nothing
    - fake filter
  scoring:
    combine: all_pass
- id: views_dependent_filters_views_dependent_filters_intro_a
  version: '1.0'
  applicable_bundles:
  - views_dependent_filters
  checks:
