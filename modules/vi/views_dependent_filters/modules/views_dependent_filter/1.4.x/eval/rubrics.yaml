rubrics:
- id: views_dependent_filter_views_dependent_filter_deprecated
  version: '1.0'
  applicable_bundles:
  - views_dependent_filter
  checks:
  - kind: must_contain_any
    values:
    - deprecated
    - uninstall
    - views_dependent_filters
    - database update
    - rename
  scoring:
    combine: all_pass
- id: views_dependent_filter_views_dependent_filter_update_hook
  version: '1.0'
  applicable_bundles:
  - views_dependent_filter
  checks:
  - kind: must_contain_any
    values:
    - uninstall
    - install
    - views_dependent_filters
    - re-save
    - dependencies
  scoring:
    combine: all_pass
- id: views_dependent_filter_views_dependent_filter_broken_plugin
  version: '1.0'
  applicable_bundles:
  - views_dependent_filter
  checks:
  - kind: must_contain_any
    values:
    - Broken
    - views_dependent_filter_obselete
    - no working
    - placeholder
  scoring:
    combine: all_pass
- id: views_dependent_filter_views_dependent_filter_is_installed
  version: '1.0'
  applicable_bundles:
  - views_dependent_filter
  checks:
  - kind: must_contain_any
    values:
    - enabled
    - installed
    - 'yes'
  scoring:
    combine: all_pass
- id: views_dependent_filter_views_dependent_filter_uninstall
  version: '1.0'
  applicable_bundles:
  - views_dependent_filter
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
