questions:
- id: views_dependent_filter-deprecated
  input: A Drupal site has a hidden module called 'views_dependent_filter' (singular) marked '(Deprecated)'.
    What is it, and what should be done about it?
  criteria: It is a deprecated shim from the project's original (incorrect) D8 machine name. The correctly
    named module is views_dependent_filters (plural). It should be removed by running database updates
    (drush updatedb) or uninstalling it; new sites should never enable it.
  bundle: views_dependent_filter
  rubric_ref: rubric/views_dependent_filter_views_dependent_filter_deprecated@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: views_dependent_filter-update-hook
  input: What does the update hook in the deprecated views_dependent_filter module (views_dependent_filter_update_8001)
    do when database updates are run?
  criteria: It collects every view that depends on the old views_dependent_filter module, uninstalls views_dependent_filter,
    installs views_dependent_filters, flushes caches, then re-saves those views so their dependencies
    recalculate to the new module name.
  bundle: views_dependent_filter
  rubric_ref: rubric/views_dependent_filter_views_dependent_filter_update_hook@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: views_dependent_filter-broken-plugin
  input: Does the deprecated views_dependent_filter module provide any working Views filter? What Views
    plugin does it register?
  criteria: No working filter. It registers only a Broken filter handler with id views_dependent_filter_obselete
    (class ViewsDependentFilter extends Broken), a safe placeholder so stale configs from the old module
    do not fatal before migration.
  bundle: views_dependent_filter
  rubric_ref: rubric/views_dependent_filter_views_dependent_filter_broken_plugin@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: views_dependent_filter-is-installed
  input: Is the deprecated 'views_dependent_filter' (singular) module currently installed/enabled on this
    Drupal site? Inspect the live module list to answer.
  criteria: Yes — views_dependent_filter (the hidden, deprecated singular module) is currently enabled;
    drush pm:list shows it as Enabled. It should be uninstalled in favour of views_dependent_filters.
  bundle: views_dependent_filter
  rubric_ref: rubric/views_dependent_filter_views_dependent_filter_is_installed@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/views_dependent_filter-installed-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/views_dependent_filter-installed-cleanup.sh
- id: views_dependent_filter-uninstall
  input: The deprecated 'views_dependent_filter' (singular) module is currently enabled on this site.
    It should not be. Uninstall it so only the correctly named views_dependent_filters remains, and apply
    the change to the live site.
  criteria: Uninstall the module (e.g. drush pmu views_dependent_filter -y, or run drush updatedb which
    its update_8001 hook uses). Afterwards \Drupal::moduleHandler()->moduleExists('views_dependent_filter')
    is FALSE.
  bundle: views_dependent_filter
  rubric_ref: rubric/views_dependent_filter_views_dependent_filter_uninstall@1.0
