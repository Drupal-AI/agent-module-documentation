metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: views_dependent_filter
  version: 1.4.x
  note: 'Deprecated, hidden legacy-rename shim for the parent views_dependent_filters. Ships a Broken
    filter (views_dependent_filter_obselete) and update hook views_dependent_filter_update_8001 which
    uninstalls this module, installs views_dependent_filters, and re-saves affected views. Correct end
    state is that this module is uninstalled. Baseline on this site: disabled. Medium enables it and the
    agent detects it via drush pm:list; hard enables it (verify FAILS) and the agent must uninstall it
