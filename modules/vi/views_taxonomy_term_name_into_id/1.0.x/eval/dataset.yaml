metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: views_taxonomy_term_name_into_id
  version: 1.0.x
  note: 'The module provides a single Views argument (contextual filter) validator plugin, id taxonomy_term_name_into_id
    (''Taxonomy term name as ID''), class Drupal\views_taxonomy_term_name_into_id\Plugin\views\argument_validator\TermNameAsId
    which extends core TermName. It converts a term NAME argument to the term ID so the efficient ''Has
    taxonomy term ID'' (taxonomy_index_tid) contextual filter can use human-readable URLs. No settings
    form, no configure route, no permissions, no services, no Drush. It is configured entirely inside
    a view: display.<d>.display_options.arguments.<arg>.validate.type = taxonomy_term_name_into_id with
    specify_validation: true and validate_options (bundles, transform, access, operation). Medium/hard
    cases build real views (prefixed vttnii_) from the module''s own test view and verify the validator
    config on the live view. hard cases mutate live view config and are verified against it. NOTE: on
    this shared site an unrelated contrib module currently makes a full Views handler discovery fatal
    after a cache clear, so setup/reset/verify write and read the view via raw config storage; a solving
    agent should likewise edit the view configuration (config:set / config storage / Views UI) rather
    than depend on programmatic View entity re-saves.'
questions:
- id: views_taxonomy_term_name_into_id-plugin-id
  input: In Drupal Views, I want a taxonomy listing page to accept the term NAME in the URL (e.g. /blog/jazz)
    but still use the efficient 'Has taxonomy term ID' contextual filter. Which module/validator does
    that, and what is the argument validator's plugin id?
  criteria: Use the Views Taxonomy Term Name Into ID module's argument validator 'Taxonomy term name as
    ID' (plugin id taxonomy_term_name_into_id). On the 'Has taxonomy term ID' contextual filter tick 'Specify
    validation criteria' and choose that validator; it converts the term name to its ID before the query
    runs.
  bundle: views_taxonomy_term_name_into_id
  rubric_ref: rubric/views_taxonomy_term_name_into_id_views_taxonomy_term_name_into_id_plugin_id@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: views_taxonomy_term_name_into_id-where-configured
  input: The views_taxonomy_term_name_into_id module has no settings page. Where and how do you actually
    turn on its 'Taxonomy term name as ID' validator?
  criteria: 'There is no configure route. You configure it inside a view: on a taxonomy term ID contextual
    filter, tick ''Specify validation criteria'' and set Validator to ''Taxonomy term name as ID''. In
    config it is arguments.<arg>.validate.type = taxonomy_term_name_into_id with specify_validation: true.'
  bundle: views_taxonomy_term_name_into_id
  rubric_ref: rubric/views_taxonomy_term_name_into_id_views_taxonomy_term_name_into_id_where_configured@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: views_taxonomy_term_name_into_id-uniqueness
  input: What happens with the views_taxonomy_term_name_into_id validator if two vocabularies contain
    a term with the same name, and how do you make the result predictable?
  criteria: The conversion assumes term names are unique; with duplicate names across vocabularies only
    the first accessible matching term is used. Restrict the validator to a single vocabulary via the
    'Filter to vocabulary' option (validate_options.bundles) to make it predictable.
  bundle: views_taxonomy_term_name_into_id
  rubric_ref: rubric/views_taxonomy_term_name_into_id_views_taxonomy_term_name_into_id_uniqueness@1.0
  tags:
  - mode:recipe
  - difficulty:easy
