rubrics:
- id: views_load_more_views_load_more_pager_id
  version: '1.0'
  applicable_bundles:
  - views_load_more
  checks:
  - kind: must_contain_any
    values:
    - load_more
    - Load more pager
    - Load more
  scoring:
    combine: all_pass
- id: views_load_more_views_load_more_option_keys
  version: '1.0'
  applicable_bundles:
  - views_load_more
  checks:
  - kind: must_contain_any
    values:
    - more_button_text
    - end_text
    - Finished text
    - Load more text
  scoring:
    combine: all_pass
- id: views_load_more_views_load_more_effects_selectors
  version: '1.0'
  applicable_bundles:
  - views_load_more
  checks:
  - kind: must_contain_any
    values:
    - content_selector
    - pager_selector
    - .view-content
    - pager--load-more
    - fadeIn
    - slideDown
  scoring:
    combine: all_pass
- id: views_load_more_views_load_more_known_button
  version: '1.0'
  applicable_bundles:
  - views_load_more
  checks:
  - kind: must_contain_any
    values:
    - VLM Show older items
  scoring:
    combine: all_pass
- id: views_load_more_views_load_more_known_finished
  version: '1.0'
  applicable_bundles:
  - views_load_more
  checks:
  - kind: must_contain_any
    values:
    - VLM All caught up
  scoring:
    combine: all_pass
- id: views_load_more_views_load_more_switch_pager
  version: '1.0'
  applicable_bundles:
  - views_load_more
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
- id: views_load_more_views_load_more_set_labels
  version: '1.0'
  applicable_bundles:
  - views_load_more
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
