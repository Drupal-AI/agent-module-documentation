metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: views_load_more
  version: 2.0.x
  note: 'Views Load More provides a single Views pager plugin (id: load_more, extends core Full). It has
    no configure route (configure=null), no settings form, no permissions, no Drush. Configuration lives
    entirely inside a view display''s pager option: type=load_more plus options.more_button_text, options.end_text,
    options.effects, options.advanced. Config schema id views.pager.load_more. Append behavior requires
    AJAX enabled on the display; a VLMEventSubscriber swaps the Views replace command for a viewsLoadMoreAppend
    command. Medium/hard cases are grounded in real view config: introspection reads the button label
    / finished text configured on a live view; execution switches a view''s pager to load_more and sets
    its labels, verified by pure config reads of views.view.<id>.display.default.display_options.pager.'
questions:
- id: views_load_more-pager-id
  input: In Drupal Views, I want a 'Load more' button that AJAX-appends the next page of results to the
    bottom of a view instead of showing numbered pages, using the Views Load More module. What is the
    pager plugin I select, and what else must be enabled on the display for results to actually append
    rather than reload?
  criteria: 'Set the display''s Pager to the ''Load more pager'' (plugin id load_more, which extends the
    Full pager) and enable AJAX on the display (Use AJAX: Yes). With AJAX on, a response subscriber replaces
    the Views insert command with a viewsLoadMoreAppend command that appends the new rows; without AJAX
    the button degrades to a plain next-page link.'
  bundle: views_load_more
  rubric_ref: rubric/views_load_more_views_load_more_pager_id@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: views_load_more-option-keys
  input: For the Views Load More pager, which pager option sets the text on the button, and which option
    sets the message shown when there are no more results to load?
  criteria: more_button_text (form label 'Load more text', default 'Load more') sets the button label;
    end_text (form label 'Finished text', default empty) sets the message shown in place of the button
    once the last page is reached, e.g. 'No more results'.
  bundle: views_load_more
  rubric_ref: rubric/views_load_more_views_load_more_option_keys@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: views_load_more-effects-selectors
  input: The Views Load More pager has an 'Advanced Options' section and a 'jQuery Effects' section. What
    are the two advanced CSS/jQuery selectors it lets you override (and their defaults), and what animation
    effect types can be chosen for appended rows?
  criteria: Advanced options let you override content_selector (default '> .view-content', the rows wrapper)
    and pager_selector (default '.pager--load-more', the pager) for themes with custom markup. The jQuery
    Effects section offers effect type None / fadeIn (Fade) / slideDown (Slide) with speed slow or fast.
  bundle: views_load_more
  rubric_ref: rubric/views_load_more_views_load_more_effects_selectors@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: views_load_more-known-button
  input: This Drupal site has a view named vlm_known that uses the Views Load More pager. Inspect its
    live configuration and state the exact button label (the more_button_text) configured on its default
    display.
  criteria: 'The more_button_text is ''VLM Show older items'': in views.view.vlm_known the default display''s
    pager (type load_more) has options.more_button_text set to ''VLM Show older items''.'
  bundle: views_load_more
  rubric_ref: rubric/views_load_more_views_load_more_known_button@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/views_load_more-btn-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/views_load_more-btn-cleanup.sh
- id: views_load_more-known-finished
  input: The view vlm_finish on this site uses the Views Load More pager and has a custom 'Finished text'
    configured (the message shown when there are no more results). Inspect the live configuration and
    give that finished text.
  criteria: 'The end_text (Finished text) is ''VLM All caught up'': in views.view.vlm_finish the default
    display''s load_more pager has options.end_text set to ''VLM All caught up''.'
  bundle: views_load_more
  rubric_ref: rubric/views_load_more_views_load_more_known_finished@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/views_load_more-finish-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/views_load_more-finish-cleanup.sh
- id: views_load_more-switch-pager
  input: On this Drupal site the view vlm_task currently uses a standard 'Full' (numbered) pager on its
    default display. Using the Views Load More module, change the default display's pager to the Load
    More pager and save the change to the live site.
  criteria: In views.view.vlm_task the default display's display_options.pager.type is set to load_more
    (e.g. edit the view's Pager to 'Load more pager' in the UI, or set pager.type = load_more in config
    and save).
  bundle: views_load_more
  rubric_ref: rubric/views_load_more_views_load_more_switch_pager@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/views_load_more-switch-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/views_load_more-switch-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/views_load_more-switch-verify.sh
- id: views_load_more-set-labels
  input: The view vlm_labels on this site already uses the Views Load More pager but with the default
    button text and no finished message. Configure its default-display pager so the button reads 'Load
    older articles' and the finished message (shown when there are no more results) reads 'That is everything'.
    Apply the change to the live site.
  criteria: In views.view.vlm_labels the default display's load_more pager options set more_button_text
    to 'Load older articles' and end_text to 'That is everything'.
  bundle: views_load_more
  rubric_ref: rubric/views_load_more_views_load_more_set_labels@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/views_load_more-labels-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/views_load_more-labels-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/views_load_more-labels-verify.sh
