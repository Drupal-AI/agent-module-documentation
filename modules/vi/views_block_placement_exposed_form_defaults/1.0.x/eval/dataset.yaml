metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: views_block_placement_exposed_form_defaults
  version: 1.0.x
  note: The module replaces the core Views Block display plugin class with ExposedFormBlockDisplay via
    hook_views_plugins_display_alter. It adds a display option customizable_exposed_filters (map filter
    id -> filter id) on the block display's 'Allow settings' section, stored at views.view.<id> -> display.<block_display>.display_options.customizable_exposed_filters.
    When the block is placed, default values for those filters are stored as exposed_filter_values on
    the placed block config and applied at render via preBlockBuild()->setExposedInput(). Schema is registered
    by hook_config_schema_info_alter (no config/schema dir). No admin page, permissions, or Drush. Medium/hard
    cases build/read a real namespaced view (vbpefd_*) with a block display carrying customizable_exposed_filters.
questions:
- id: views_block_placement_exposed_form_defaults-how-it-works
  input: What does the views_block_placement_exposed_form_defaults module let a site builder do, and how
    do you choose which exposed filters can be given default values on a Views block?
  criteria: It lets you set default values for a Views block's exposed filters per placement. In the block
    display's 'Allow settings' section it adds a 'Customizable filters' checkbox list; the chosen filters
    are saved as the display option customizable_exposed_filters. It works by replacing the core Views
    Block display plugin with ExposedFormBlockDisplay.
  bundle: views_block_placement_exposed_form_defaults
  rubric_ref: rubric/views_block_placement_exposed_form_defaults_views_block_placement_exposed_form_defaults_how_it_works@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: views_block_placement_exposed_form_defaults-where-stored
  input: When I place a Views block and set default values for its exposed filters using views_block_placement_exposed_form_defaults,
    where are those default values stored and how are they applied when the block renders?
  criteria: The per-placement defaults are stored on the placed block's configuration as exposed_filter_values
    (a schema key added to views_block). At render, ExposedFormBlockDisplay::preBlockBuild() calls $view->setExposedInput($exposed_filter_values)
    so the block loads pre-filtered.
  bundle: views_block_placement_exposed_form_defaults
  rubric_ref: rubric/views_block_placement_exposed_form_defaults_views_block_placement_exposed_form_defaults_where_stored@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: views_block_placement_exposed_form_defaults-mechanism
  input: How does views_block_placement_exposed_form_defaults hook into Views to add its behaviour, and
    does it define any admin page or permission?
  criteria: It implements hook_views_plugins_display_alter() to swap the core Views Block display plugin
    class for ExposedFormBlockDisplay (a subclass), and hook_config_schema_info_alter() to register the
    new config keys. It has no admin page, permission, config entity, or Drush command of its own.
  bundle: views_block_placement_exposed_form_defaults
  rubric_ref: rubric/views_block_placement_exposed_form_defaults_views_block_placement_exposed_form_defaults_mechanism@1.0
  tags:
  - mode:recipe
  - difficulty:easy
