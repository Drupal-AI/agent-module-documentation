rubrics:
- id: views_selective_filters_views_selective_filters_what
  version: '1.0'
  applicable_bundles:
  - views_selective_filters
  checks:
  - kind: must_contain_any
    values:
    - result set
    - present
    - distinct
    - only
    - no empty
    - options
  scoring:
    combine: all_pass
- id: views_selective_filters_views_selective_filters_how_to_add
  version: '1.0'
  applicable_bundles:
  - views_selective_filters
  checks:
  - kind: must_contain_any
    values:
    - selective
    - add the field
    - field
    - Hidden from display
    - expose
  scoring:
    combine: all_pass
- id: views_selective_filters_views_selective_filters_plugin_id
  version: '1.0'
  applicable_bundles:
  - views_selective_filters
  checks:
  - kind: must_contain_any
    values:
    - views_selective_filters_filter
    - '100'
    - selective_items_limit
  scoring:
    combine: all_pass
- id: views_selective_filters_views_selective_filters_known_view
  version: '1.0'
  applicable_bundles:
  - views_selective_filters
  checks:
  - kind: must_contain_any
    values:
    - views_selective_filters_filter
  scoring:
    combine: all_pass
- id: views_selective_filters_views_selective_filters_add_filter
  version: '1.0'
  applicable_bundles:
  - views_selective_filters
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
- id: views_selective_filters_views_selective_filters_add_filter_plain
  version: '1.0'
  applicable_bundles:
  - views_selective_filters
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
