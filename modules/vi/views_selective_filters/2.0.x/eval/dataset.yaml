metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: views_selective_filters
  version: 2.0.x
  note: 'Views Selective Filters has no config UI. It adds a synthetic ''<field>_selective'' variant of
    every filterable Views field via hook_views_data_alter(); a placed selective filter is stored in the
    view config with plugin_id ''views_selective_filters_filter'' (class Selective), which proxies the
    original filter but overrides getValueOptions() to only offer values present in the result set. Medium/hard
    cases are grounded in real view config: introspection reads a view that already has a selective filter
    and identifies it; execution adds a selective filter to a view, verified by the presence of a filter
    whose plugin_id is views_selective_filters_filter. The fixture views are minimal config entities used
    only for config introspection/verification, not full rendering.'
questions:
- id: views_selective_filters-what
  input: What does the Drupal 'Views Selective Filters' module do to an exposed Views filter, and what
    problem does it solve?
  criteria: It makes an exposed filter offer only the option values that actually appear in the current
    result set (so users can't pick a value that returns zero rows). It does this by adding a 'selective'
    variant of each filterable field.
  bundle: views_selective_filters
  rubric_ref: rubric/views_selective_filters_views_selective_filters_what@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: views_selective_filters-how-to-add
  input: How do I turn a normal exposed filter in a Drupal view into a selective one using the views_selective_filters
    module? Roughly what steps do I take in the Views UI?
  criteria: Add the field you want to filter on to the view (optionally 'Hidden from display'), then add
    the matching filter ending in '(selective)', expose it. The selective filter and the field must share
    the same base field.
  bundle: views_selective_filters
  rubric_ref: rubric/views_selective_filters_views_selective_filters_how_to_add@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: views_selective_filters-plugin-id
  input: In a Drupal view's configuration, what plugin id identifies a Views Selective Filters filter,
    and what is the default cap on how many distinct option values a selective filter will build before
    it rejects the field?
  criteria: The placed filter has plugin_id 'views_selective_filters_filter'. The default selective_items_limit
    is 100 distinct values, above which the field is rejected as unsuitable.
  bundle: views_selective_filters
  rubric_ref: rubric/views_selective_filters_views_selective_filters_plugin_id@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: views_selective_filters-known-view
  input: This Drupal site has a view with the machine name 'vsf_eval_view'. Inspect its configuration
    and tell me whether any of its exposed filters use Views Selective Filters, and name the filter plugin
    that indicates this.
  criteria: 'Yes: the default display has a filter (type_selective) whose plugin_id is views_selective_filters_filter,
    which is the Views Selective Filters plugin.'
  bundle: views_selective_filters
  rubric_ref: rubric/views_selective_filters_views_selective_filters_known_view@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/views_selective_filters-known-view-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/views_selective_filters-known-view-cleanup.sh
- id: views_selective_filters-add-filter
  input: On this Drupal site there is a view named 'vsf_eval_hard' (base table node_field_data) that currently
    has no filters. Add a Views Selective Filters exposed filter to its default display (using the views_selective_filters_filter
    plugin) and save the view.
  criteria: 'Add a filter entry to the vsf_eval_hard view''s default display with plugin_id ''views_selective_filters_filter''
    (e.g. a type_selective filter on node_field_data) and save. Verified: the view has a filter whose
    plugin_id is views_selective_filters_filter.'
  bundle: views_selective_filters
  rubric_ref: rubric/views_selective_filters_views_selective_filters_add_filter@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/views_selective_filters-add-filter-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/views_selective_filters-add-filter-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/views_selective_filters-add-filter-verify.sh
- id: views_selective_filters-add-filter-plain
  input: In the view 'vsf_eval_hard' on this site, make it so an exposed filter will only show the options
    that actually appear in the results, using the Views Selective Filters module. Apply the change to
    the saved view.
  criteria: 'Add a selective exposed filter (plugin_id views_selective_filters_filter) to the vsf_eval_hard
    view and save, so exposed options are limited to values in the result set. Verified: a filter with
    plugin_id views_selective_filters_filter exists on the view.'
  bundle: views_selective_filters
  rubric_ref: rubric/views_selective_filters_views_selective_filters_add_filter_plain@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: site-builder
    reset: agent-module-documentation/evaluation/verify/views_selective_filters-add-filter-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/views_selective_filters-add-filter-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/views_selective_filters-add-filter-verify.sh
