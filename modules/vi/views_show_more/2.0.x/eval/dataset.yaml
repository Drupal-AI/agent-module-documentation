  criteria: '12 items initially: views.view.vsm_eval default display -> display_options.pager.options.initial
    = 12 (then items_per_page per Show more click).'
  bundle: views_show_more
  rubric_ref: rubric/views_show_more_views_show_more_known_initial@1.0
