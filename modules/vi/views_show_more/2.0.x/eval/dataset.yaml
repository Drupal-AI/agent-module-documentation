metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: views_show_more
  version: 2.0.x
  note: 'Views Show More Pager provides one Views pager plugin, ''show_more'' (Show more pager), selectable
    in a view''s Pager section. Options (schema views.pager.show_more): show_more_text (button label,
    default ''Show more''), result_display_method (append | html=Replace), initial (first-page item count;
    0 = same as items_per_page), items_per_page (per-click batch), plus effects (animation) and advance
    (selectors, default content .view-content / pager .pager-show-more). Settings live in the view display''s
    pager options. Works AJAX and non-AJAX (built for AJAX; JS lib + response subscriber). No config/routes/permissions/Drush;
    requires core views. Medium cases create a namespaced view whose show_more pager has a distinctive
    initial / show_more_text and read it back. Hard cases switch a view''s pager to show_more / set the
    initial first-page count, verified against the live view config; reset creates the view with a core
    pager (or initial 0) so verify fails on empty state.'
questions:
- id: views_show_more-pager-id
  input: What does the Views Show More Pager module add to Views, and what is the pager plugin's machine
    id?
  criteria: It adds a Views pager plugin with id 'show_more' ('Show more pager') — a load-more button
    that fetches the next batch of results instead of numbered pages, selectable in a view's Pager section.
  bundle: views_show_more
  rubric_ref: rubric/views_show_more_views_show_more_pager_id@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: views_show_more-append-replace
  input: The Views Show More pager has a 'result display method' option. What are the two choices and
    how do they differ?
  criteria: Append (result_display_method 'append') adds the next batch after the existing rows (a true
    load-more in AJAX mode; page refresh in non-AJAX); Replace ('html') swaps the content with the next
    batch in both modes.
  bundle: views_show_more
  rubric_ref: rubric/views_show_more_views_show_more_append_replace@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: views_show_more-initial
  input: In the Views Show More pager, what does the 'Initial items' setting do, and what does a value
    of 0 mean?
  criteria: '''Initial'' sets how many items appear on the first page; each ''Show more'' click then loads
    ''items per page'' more. 0 means use the same count as items-per-page for the first page too.'
  bundle: views_show_more
  rubric_ref: rubric/views_show_more_views_show_more_initial@1.0
  tags:
  - mode:recipe
  - difficulty:easy
