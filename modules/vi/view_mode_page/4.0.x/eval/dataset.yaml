metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: view_mode_page
  version: 4.0.x
  note: View mode page renders an entity in a chosen view mode at an extra path. State is the view_mode_page_pattern
    config entity (config prefix view_mode_page.pattern.<id>) with fields type (AliasType plugin id, e.g.
    canonical_entities:node), pattern (path pattern, must contain % for the entity's normal URL/alias,
    e.g. /%/summary), view_mode (e.g. teaser, full, printable), selection_criteria, selection_logic, weight.
    Admin UI /admin/config/search/view-mode-page (route entity.view_mode_page_pattern.collection, permission
    administer view_mode_page). A path processor rewrites matching paths to the internal route /view_mode_page/{view_mode}/{entity_type}/{entity_id}
    via a sub-request (not a redirect). Medium/hard cases create/read real view_mode_page_pattern config
    entities.
questions:
- id: view_mode_page-teaser-path
  input: Using the view_mode_page module on Drupal 11, I want every node to also be viewable in its Teaser
    view mode at its normal URL followed by /summary. What do I create, and what must the path pattern
    contain?
  criteria: Create a view_mode_page pattern (config entity view_mode_page.pattern.*) at /admin/config/search/view-mode-page
    with type canonical_entities:node, view_mode 'teaser', and a path pattern that MUST contain % as the
    placeholder for the entity's normal URL/alias, e.g. /%/summary. Visiting /{alias}/summary then renders
    the node's teaser.
  bundle: view_mode_page
  rubric_ref: rubric/view_mode_page_view_mode_page_teaser_path@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: view_mode_page-resolution
  input: How does the view_mode_page module actually serve the extra path - is it an HTTP redirect, and
    which internal route/mechanism handles it?
  criteria: It is NOT a redirect. The inbound path processor (view_mode_page.path_processor, priority
    250) matches the request against each pattern's %-based pattern and rewrites it to the internal route
    view_mode_page.display_entity (/view_mode_page/{view_mode}/{entity_type}/{entity_id}); its controller
    renders the entity inline via a sub-request in the requested view mode.
  bundle: view_mode_page
  rubric_ref: rubric/view_mode_page_view_mode_page_resolution@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: view_mode_page-admin-and-plugin
  input: 'For the view_mode_page module: what is the admin path and permission to manage patterns, and
    what plugin type do patterns reference for their ''type'' field?'
  criteria: Manage patterns at /admin/config/search/view-mode-page (route entity.view_mode_page_pattern.collection),
    permission 'administer view_mode_page'. The 'type' field is an AliasType plugin id (manager view_mode_page.manager.alias_type);
    the shipped canonical_entities plugin is derived per entity type, e.g. canonical_entities:node.
  bundle: view_mode_page
  rubric_ref: rubric/view_mode_page_view_mode_page_admin_and_plugin@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: view_mode_page-introspect-viewmode
  input: This site already has a view_mode_page pattern configured with the id vmp_known. Inspect the
    live configuration and report which view mode it renders and its path pattern.
  criteria: The view_mode_page.pattern.vmp_known config entity has view_mode 'teaser' and pattern '/%/vmp-summary'
    (type canonical_entities:node).
  bundle: view_mode_page
  rubric_ref: rubric/view_mode_page_view_mode_page_introspect_viewmode@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/view_mode_page-introspect-viewmode-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/view_mode_page-introspect-viewmode-cleanup.sh
- id: view_mode_page-introspect-pattern
  input: A view_mode_page pattern with id vmp_alt exists on this site. Inspect the live configuration
    and state the exact path pattern string it uses and which view mode it applies.
  criteria: view_mode_page.pattern.vmp_alt uses path pattern '/%/vmp-detail' and view_mode 'full' (type
    canonical_entities:node).
  bundle: view_mode_page
  rubric_ref: rubric/view_mode_page_view_mode_page_introspect_pattern@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/view_mode_page-introspect-pattern-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/view_mode_page-introspect-pattern-cleanup.sh
- id: view_mode_page-build-teaser
  input: On this Drupal site, use the view_mode_page module to make every node render its Teaser view
    mode at its normal URL followed by /summary (path pattern /%/summary). Create and save the pattern
    on the live site.
  criteria: Create a view_mode_page_pattern config entity with pattern '/%/summary', view_mode 'teaser',
    and type 'canonical_entities:node' (e.g. via the storage handler or /admin/config/search/view-mode-page/add).
  bundle: view_mode_page
  rubric_ref: rubric/view_mode_page_view_mode_page_build_teaser@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/view_mode_page-build-teaser-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/view_mode_page-build-teaser-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/view_mode_page-build-teaser-verify.sh
- id: view_mode_page-build-print
  input: On my Drupal site I want a printer-friendly version of any article page to appear when you add
    /print to the end of its web address. Set that up using the view mode page module, using the site's
    'printable' display for the printer-friendly version.
  criteria: Create a view_mode_page_pattern config entity with pattern '/%/print', view_mode 'printable',
    type 'canonical_entities:node' so /{alias}/print renders the node in the printable view mode.
  bundle: view_mode_page
  rubric_ref: rubric/view_mode_page_view_mode_page_build_print@1.0
