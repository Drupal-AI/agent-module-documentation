rubrics:
- id: views_extras_vex_plugin_ids
  version: '1.0'
  applicable_bundles:
  - views_extras
  checks:
  - kind: must_contain_any
    values:
    - session
    - cookie
    - tempstore
  scoring:
    combine: all_pass
- id: views_extras_vex_cookie_prefix
  version: '1.0'
  applicable_bundles:
  - views_extras
  checks:
  - kind: must_contain_any
    values:
    - Drupal_visitor_mypref
    - Drupal_visitor_
  scoring:
    combine: all_pass
- id: views_extras_vex_extra_result_tokens
  version: '1.0'
  applicable_bundles:
  - views_extras
  checks:
  - kind: must_contain_any
    values:
    - '@total'
    - '@start'
    - '@end'
    - '@page_count'
    - '@current_page'
  scoring:
    combine: all_pass
- id: views_extras_vex_known_cookie_key
  version: '1.0'
  applicable_bundles:
  - views_extras
  checks:
  - kind: must_contain_any
    values:
    - vex_ckey
  scoring:
    combine: all_pass
- id: views_extras_vex_known_session_key
  version: '1.0'
  applicable_bundles:
  - views_extras
  checks:
  - kind: must_contain_any
    values:
    - vex_skey
  scoring:
    combine: all_pass
- id: views_extras_vex_set_cookie_arg
  version: '1.0'
  applicable_bundles:
  - views_extras
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
- id: views_extras_vex_add_extra_result
  version: '1.0'
  applicable_bundles:
  - views_extras
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
