metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: views_templates
  version: 1.7.x
  note: 'Views Templates is a developer API: modules define a @ViewsBuilder plugin (discovered from Plugin/ViewsTemplateBuilder)
    to ship a View as a template that site builders clone into a real View entity. Cases are `recipe`
    (response-graded) probing documented facts an agent would otherwise read source to answer; no site
    mutation.'
questions:
- id: views-templates-plugin-type
  input: In a Drupal 11 module I want to ship a pre-built View that Views Templates exposes. What plugin
    type do I define, in which src subdirectory does it live, and what annotation does it use?
  criteria: Define a ViewsBuilder plugin under src/Plugin/ViewsTemplateBuilder using the @ViewsBuilder
    annotation; it is discovered by plugin.manager.views_templates.builder.
  bundle: views_templates
  rubric_ref: rubric/views_templates_views_templates_plugin_type@1.0
  tags:
  - mode:recipe
- id: views-templates-two-base-classes
  input: Views Templates offers two base classes for building a View template. Which base class do I extend
    to build the View programmatically in code, and which do I extend to clone a View from a *.yml template
    file?
  criteria: Extend ViewsBuilderBase (override createView()) to build a View in code; extend ViewsDuplicateBuilderBase
    to clone a View from a *.yml template file.
  bundle: views_templates
  rubric_ref: rubric/views_templates_views_templates_two_base_classes@1.0
  tags:
  - mode:recipe
- id: views-templates-yml-location
  input: When using a ViewsDuplicateBuilderBase template, where in my module must the Views template YAML
    file live, and how is its filename determined?
  criteria: Put the YAML in the module's views_templates/ directory; the file is <view_template_id>.yml
    where view_template_id comes from the plugin annotation (loaded by the views_templates.loader service).
  bundle: views_templates
  rubric_ref: rubric/views_templates_views_templates_yml_location@1.0
  tags:
  - mode:recipe
- id: views-templates-replacements
  input: How do I substitute values (like a title or field id) into a cloned Views template with Views
    Templates, and how are the annotation keys turned into placeholders?
  criteria: Declare replace_values in the @ViewsBuilder annotation; each key becomes an __UPPERCASE placeholder
    that is replaced recursively in the template (keys and values), and a NULL value deletes the key.
  bundle: views_templates
  rubric_ref: rubric/views_templates_views_templates_replacements@1.0
  tags:
  - mode:recipe
- id: views-templates-create-ui
  input: As a site builder on Drupal 11, where in the admin UI do I create a new View from a registered
    Views Template, and what permission is required?
  criteria: Use the 'Add view from template' action at /admin/structure/views/template/list; the routes
    require the core 'administer views' permission.
  bundle: views_templates
  rubric_ref: rubric/views_templates_views_templates_create_ui@1.0
  tags:
  - mode:recipe
- id: views-templates-create-in-code
  input: In PHP, how do I instantiate a Views Templates builder plugin and create a View entity from it?
    Which service do I use?
  criteria: Get plugin.manager.views_templates.builder, createInstance(pluginId), then $builder->createView($options)
    which returns an unsaved View entity to save().
  bundle: views_templates
  rubric_ref: rubric/views_templates_views_templates_create_in_code@1.0
  tags:
  - mode:recipe
- id: views-templates-dependency
  input: What Drupal module does Views Templates depend on, and does it provide its own configuration
    UI or permissions?
  criteria: It depends only on core Views (drupal:views); it provides no settings form (configure is null)
    and no permissions of its own — the UI uses the core 'administer views' permission.
  bundle: views_templates
  rubric_ref: rubric/views_templates_views_templates_dependency@1.0
  tags:
  - mode:recipe
- id: views-templates-alter-hook
  input: Which alter hook lets me modify or remove Views Templates builder plugin definitions provided
    by other modules?
  criteria: Implement hook_views_template_builder_info_alter(&$definitions) (alter id views_template_builder_info)
    to add/modify/remove builder definitions.
  bundle: views_templates
  rubric_ref: rubric/views_templates_views_templates_alter_hook@1.0
  tags:
  - mode:recipe
