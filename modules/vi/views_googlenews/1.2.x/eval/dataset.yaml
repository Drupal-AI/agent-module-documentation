metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: views_googlenews
  version: 1.2.x
  note: 'Views Google News is Views-only. It provides a style plugin google_news (''Google News Feed'',
    display_types feed) and a row plugin google_news_fields (''Google News fields'') that map view fields
    to Google News sitemap XML tags via row options loc_field / news_title_field / news_publication_date_field
    (required) and news_publication_name_field / news_publication_language_field / news_access_field /
    news_genres_field / news_keywords_field / news_stock_tickers_field. Name defaults to the site name,
    language to the default language. It also invokes hook_views_googlenews_item_alter(). No settings
    form, permissions, or drush. All cases are grounded in that real style/row config: introspection reads
    back the plugin ids / field mapping on a live view; execution builds a Google News feed view or switches
    an existing feed display to the google_news format, verified against the live view config.'
questions:
- id: views_googlenews-how-to-feed
  input: On a Drupal 11 site with views_googlenews, how do I output a View of my articles as a Google
    News sitemap feed? Which Views display type and which format (style) do I use?
  criteria: Add a Feed display to the view and set its Format (style) to 'Google News Feed' (plugin id
    google_news, which only works on feed displays), then set the row style to 'Google News fields'. Give
    the feed display a path (e.g. news.xml).
  bundle: views_googlenews
  rubric_ref: rubric/views_googlenews_views_googlenews_how_to_feed@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: views_googlenews-row-mapping
  input: With views_googlenews, which Views row plugin renders each item, and how do I map the article
    URL, title and publication date to the Google News XML tags?
  criteria: 'Use the ''Google News fields'' row plugin (google_news_fields). In its settings map view
    fields to the row options: loc_field -> <loc>, news_title_field -> <news:title>, news_publication_date_field
    -> <news:publication_date> (these three are required); optional ones include news_keywords_field,
    news_access_field, news_genres_field, news_stock_tickers_field.'
  bundle: views_googlenews
  rubric_ref: rubric/views_googlenews_views_googlenews_row_mapping@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: views_googlenews-defaults
  input: In a views_googlenews feed, if I don't map a field for the publication name (<news:name>) or
    the language (<news:language>), what values are used? And which Google-recommended filter should the
    view have?
  criteria: 'The publication name defaults to the site name and the language to the site''s default language.
    Google recommends limiting to the last two days: add a ''Content: Authored on'' filter with operator
    ''is greater than or equal to'' and value offset ''now -2 days''.'
  bundle: views_googlenews
  rubric_ref: rubric/views_googlenews_views_googlenews_defaults@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: views_googlenews-style-id
  input: This site has a View named vgn_probe with a Feed display that outputs a Google News feed. Inspect
    the live view configuration and state the machine id of the Views style plugin its feed display uses.
  criteria: 'The feed display''s style plugin id is google_news (display feed_1: display_options.style.type
    = google_news; its row is google_news_fields).'
  bundle: views_googlenews
  rubric_ref: rubric/views_googlenews_views_googlenews_style_id@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/views_googlenews-probe-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/views_googlenews-probe-cleanup.sh
- id: views_googlenews-loc-mapping
  input: In the vgn_probe View's Google News feed display on this site, which view field id is mapped
    to the Google News <loc> element (the loc_field row option)? Inspect the live configuration.
  criteria: 'loc_field is mapped to view_node (display feed_1: display_options.row.options.loc_field =
    view_node).'
  bundle: views_googlenews
  rubric_ref: rubric/views_googlenews_views_googlenews_loc_mapping@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/views_googlenews-probe-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/views_googlenews-probe-cleanup.sh
- id: views_googlenews-build
  input: 'On this Drupal site, create a View with machine id vgn_news that has a Feed display rendering
    content as a Google News sitemap: the feed display must use the ''Google News Feed'' style and the
    ''Google News fields'' row. Apply it to the live site.'
  criteria: A view config views.view.vgn_news exists with a feed display whose display_options.style.type
    = google_news and display_options.row.type = google_news_fields (map loc/title/publication_date fields
    in the row options).
  bundle: views_googlenews
  rubric_ref: rubric/views_googlenews_views_googlenews_build@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/views_googlenews-build-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/views_googlenews-build-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/views_googlenews-build-verify.sh
- id: views_googlenews-switch
  input: 'This site has a View vgn_switch whose Feed display currently uses the default RSS format. Reconfigure
    that feed display to output a Google News sitemap instead: use the views_googlenews ''Google News
    Feed'' style and ''Google News fields'' row. Apply the change live.'
  criteria: In views.view.vgn_switch the feed display's display_options.style.type becomes google_news
    and display_options.row.type becomes google_news_fields (with the loc/title/publication_date row options
    mapped).
  bundle: views_googlenews
  rubric_ref: rubric/views_googlenews_views_googlenews_switch@1.0
  tags:
  - mode:execution
  - difficulty:hard
