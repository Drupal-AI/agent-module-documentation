metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: view_password
  version: 6.0.x
  note: 'View Password is a small client-side UX module: a config settings object listing form IDs, one
    permission, a hook_form_alter that attaches a JS behavior, and overridable icon SVGs. Cases are `recipe`
    (response-graded) — they probe documented facts an agent would otherwise read source to answer; no
    site mutation.'
questions:
- id: view-password-what-it-does
  input: On a Drupal 11 site I want users to be able to click an eye icon next to a password field to
    reveal what they typed before submitting. Which contrib module adds this show/hide password toggle?
  criteria: The View Password module (drupal/view_password) adds a client-side show/hide eye toggle button
    next to password fields on selected forms.
  bundle: view_password
  rubric_ref: rubric/view_password_view_password_what_it_does@1.0
  tags:
  - mode:recipe
- id: view-password-choose-forms
  input: How do I control which forms get the View Password show/hide toggle, and what is the default?
    Give the config key and object.
  criteria: Set the comma-separated form_ids key on the view_password.settings config object (default
    user_login_form), e.g. via the settings form at /admin/config/system/view-password-settings or drush
    cset.
  bundle: view_password
  rubric_ref: rubric/view_password_view_password_choose_forms@1.0
  tags:
  - mode:recipe
- id: view-password-settings-route
  input: What is the admin path and route name for the View Password settings form on a Drupal site?
  criteria: Route password.route at /admin/config/system/view-password-settings (Admin > Configuration
    > System > View Password Settings).
  bundle: view_password
  rubric_ref: rubric/view_password_view_password_settings_route@1.0
  tags:
  - mode:recipe
- id: view-password-permission
  input: Which permission does the View Password module define and what does it gate?
  criteria: The 'administer view password' permission gates access to the View Password settings form
    (choosing form IDs, classes, icons); it is the _permission on password.route.
  bundle: view_password
  rubric_ref: rubric/view_password_view_password_permission@1.0
  tags:
  - mode:recipe
- id: view-password-js-toggle
  input: How does View Password actually reveal the password in the browser — what does its JavaScript
    do when the toggle button is clicked?
  criteria: A Drupal.behaviors.pwd behavior (password.js) inserts a button.shwpd after each password input
    inside a .pwd-see form; clicking it toggles the input's type between 'password' and 'text' and swaps
    the eye-open/eye-close icon and aria-label.
  bundle: view_password
  rubric_ref: rubric/view_password_view_password_js_toggle@1.0
  tags:
  - mode:recipe
- id: view-password-custom-icons
  input: I want to replace the default eye icons in View Password with my own SVGs. Which two config keys
    set the icon paths and what format must the paths use?
  criteria: Set icon_exposed (open eye) and icon_hidden (closed eye) on view_password.settings to root-relative
    paths starting with a leading slash (/); they fall back to the module's default eye-open/eye-close
    SVGs.
  bundle: view_password
  rubric_ref: rubric/view_password_view_password_custom_icons@1.0
  tags:
  - mode:recipe
- id: view-password-library
  input: Which asset library does View Password attach to a configured form to enable the toggle, and
    what does it include?
  criteria: The view_password/pwd_lb library (css/password.css + js/password.js, depending on core/jquery,
    core/once, core/drupal, core/drupalSettings), attached by view_password_form_alter() to matching forms.
  bundle: view_password
  rubric_ref: rubric/view_password_view_password_library@1.0
  tags:
  - mode:recipe
- id: view-password-accessibility
  input: Is the View Password reveal control accessible? What does the toggle button expose for assistive
    technology?
  criteria: Yes — it is a real <button type="button"> whose aria-label flips between 'Show password' and
    'Hide password' (both translatable) as the state toggles.
  bundle: view_password
  rubric_ref: rubric/view_password_view_password_accessibility@1.0
  tags:
  - mode:recipe
