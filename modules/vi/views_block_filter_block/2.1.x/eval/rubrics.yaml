rubrics:
- id: views_block_filter_block_views_block_filter_block_how_to_enable
  version: '1.0'
  applicable_bundles:
  - views_block_filter_block
  checks:
  - kind: must_contain_any
    values:
    - Exposed form in block
    - exposed_block
    - exposed form in block
  scoring:
    combine: all_pass
- id: views_block_filter_block_views_block_filter_block_block_plugin_id
  version: '1.0'
  applicable_bundles:
  - views_block_filter_block
  checks:
  - kind: must_contain_any
    values:
    - views_exposed_filter_block
    - 'Exposed form:'
  scoring:
    combine: all_pass
- id: views_block_filter_block_views_block_filter_block_mechanism
  version: '1.0'
  applicable_bundles:
  - views_block_filter_block
  checks:
  - kind: must_contain_any
    values:
    - hook_views_plugins_display_alter
    - usesExposedFormInBlock
    - ctools
  scoring:
    combine: all_pass
- id: views_block_filter_block_views_block_filter_block_known_display
  version: '1.0'
  applicable_bundles:
  - views_block_filter_block
  checks:
  - kind: must_contain_any
    values:
    - views_exposed_filter_block:vbfb_demo-block_1
  scoring:
    combine: all_pass
- id: views_block_filter_block_views_block_filter_block_two_displays
  version: '1.0'
  applicable_bundles:
  - views_block_filter_block
  checks:
  - kind: must_contain_any
    values:
    - block_2
  scoring:
    combine: all_pass
- id: views_block_filter_block_views_block_filter_block_enable_exposed_block
  version: '1.0'
  applicable_bundles:
  - views_block_filter_block
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
- id: views_block_filter_block_views_block_filter_block_place_filter_block
  version: '1.0'
  applicable_bundles:
  - views_block_filter_block
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
