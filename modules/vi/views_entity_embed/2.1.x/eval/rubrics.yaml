rubrics:
- id: views_entity_embed_vee_tag_filter
  version: '1.0'
  applicable_bundles:
  - views_entity_embed
  checks:
  - kind: must_contain_any
    values:
    - drupal-views
    - views_embed
  scoring:
    combine: all_pass
- id: views_entity_embed_vee_setup_steps
  version: '1.0'
  applicable_bundles:
  - views_entity_embed
  checks:
  - kind: must_contain_any
    values:
    - views_embed
    - Display embedded views
    - drupal-views
    - embed button
  scoring:
    combine: all_pass
- id: views_entity_embed_vee_embed_type
  version: '1.0'
  applicable_bundles:
  - views_entity_embed
  checks:
  - kind: must_contain_any
    values:
    - embed_views
  scoring:
    combine: all_pass
- id: views_entity_embed_vee_known_button
  version: '1.0'
  applicable_bundles:
  - views_entity_embed
  checks:
  - kind: must_contain_any
    values:
    - content
  scoring:
    combine: all_pass
- id: views_entity_embed_vee_known_format
  version: '1.0'
  applicable_bundles:
  - views_entity_embed
  checks:
  - kind: must_contain_any
    values:
    - vee_fmt
  scoring:
    combine: all_pass
- id: views_entity_embed_vee_build_button
  version: '1.0'
  applicable_bundles:
  - views_entity_embed
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
- id: views_entity_embed_vee_enable_filter
  version: '1.0'
  applicable_bundles:
  - views_entity_embed
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
