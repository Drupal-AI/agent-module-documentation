metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: views_entity_embed
  version: 2.1.x
  note: Views Entity Embed embeds Views in CKEditor via the Embed/Entity Embed framework. It provides
    an embed_views EmbedType, a views_embed text filter (title 'Display embedded views') that renders
    <drupal-views data-view-name data-view-display data-view-arguments> tags, and installs an embed button
    (config embed.button.views, type_id embed_views). An embed button's type_settings can restrict views
    (filter_views/views_options) and displays (filter_displays/display_options). No settings page, permissions,
    Drush, or config schema of its own. Medium/hard cases create/inspect namespaced vee_* embed_button
    entities and vee_* text formats via drush; verify checks embed_button type_id or the format's views_embed
    filter + allowed <drupal-views> tag.
questions:
- id: vee-tag-filter
  input: With the Views Entity Embed Drupal module, what HTML element is placed in the text to embed a
    view, which two data-attributes on it are required, and which text filter renders it?
  criteria: A <drupal-views> element carrying data-view-name and data-view-display (optionally data-view-arguments).
    The 'Display embedded views' filter (id views_embed) finds and renders those tags.
  bundle: views_entity_embed
  rubric_ref: rubric/views_entity_embed_vee_tag_filter@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: vee-setup-steps
  input: How do I set up Views Entity Embed on a text format so editors can embed views? Mention the filter,
    the allowed-HTML requirement, and the embed button.
  criteria: Enable the Display embedded views (views_embed) filter on the format; if Limit allowed HTML
    tags is on, allow the <drupal-views> tag with its data-view-* attributes; and create/place an embed
    button of type Views (embed_views) in the CKEditor toolbar.
  bundle: views_entity_embed
  rubric_ref: rubric/views_entity_embed_vee_setup_steps@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: vee-embed-type
  input: In Views Entity Embed, what is the machine id of the embed type used for the embed button, and
    what can that button optionally restrict?
  criteria: The embed type id is embed_views. A button of that type can optionally restrict which Views
    are allowed (filter_views/views_options) and which display plugins are allowed (filter_displays/display_options);
    leaving them off allows all.
  bundle: views_entity_embed
  rubric_ref: rubric/views_entity_embed_vee_embed_type@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: vee-known-button
  input: On this site there is a Views Entity Embed embed button with id vee_known that has been restricted
    to allow only one View. Inspect the live embed button configuration and state which View id it is
    limited to.
  criteria: 'It is restricted to the ''content'' View: embed.button.vee_known has type_id embed_views
    with type_settings.filter_views: 1 and type_settings.views_options containing content.'
  bundle: views_entity_embed
  rubric_ref: rubric/views_entity_embed_vee_known_button@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/views_entity_embed-known-button-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/views_entity_embed-known-button-cleanup.sh
