  input: A text format on this site has been configured so that embedded views will render. Inspect the
    live filter configuration and give the machine name (format id) of the format that has the Views Entity
    Embed 'Display embedded views' filter enabled.
  criteria: 'The format is vee_fmt: filter.format.vee_fmt has filters.views_embed.status: true.'
  bundle: views_entity_embed
  rubric_ref: rubric/views_entity_embed_vee_known_format@1.0
  tags:
