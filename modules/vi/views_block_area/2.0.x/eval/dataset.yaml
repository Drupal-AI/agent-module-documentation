    cleanup: agent-module-documentation/evaluation/verify/views_block_area-add-area-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/views_block_area-add-area-verify.sh
    unused_text_checks:
      must_not_contain: []
- id: views_block_area-add-field
  input: The view vba_field_task on this site needs the site's branding block shown as a field in its
    results. Using the views_block_area 'Block field' handler, add the core Site branding block (block
    plugin id system_branding_block) as a field on the vba_field_task view, and apply it live.
  criteria: 'The vba_field_task view has a views_block_field field handler with block_id: system_branding_block.'
  bundle: views_block_area
  rubric_ref: rubric/views_block_area_views_block_area_add_field@1.0
