metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: views_block_area
  version: 2.0.x
  note: 'Views Block Area adds two Views handlers via hook_views_data(): an area handler ''views_block_area''
    (Global: Block area, usable in header/footer/no-results) and a field handler ''views_block_field''
    (Content block: Block Field). Both render an arbitrary non-context-aware block plugin, with options
    block_id, block_title, hide_label, empty. There is no settings form or configure route; configuration
    lives inside each view''s display config. Medium/hard cases build/read namespaced vba_* views whose
    displays carry these handlers, verified by loading the View config entity via drush. Context-aware
    blocks are excluded from the selectable list.'
questions:
- id: views_block_area-two-handlers
  input: What does the views_block_area module add to Views, and which two handler ids does it provide?
  criteria: 'It exposes any block plugin inside a view. It provides an area handler ''views_block_area''
    (Global: Block area, for header/footer/no-results) and a field handler ''views_block_field'' (Content
    block: Block Field).'
  bundle: views_block_area
  rubric_ref: rubric/views_block_area_views_block_area_two_handlers@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: views_block_area-add-to-header
  input: Using views_block_area, how do I put a block into a view's header or footer, and what options
    can I set on it?
  criteria: 'Edit the view, click Add next to Header (or Footer / No results behavior), choose ''Global:
    Block area'', and pick the block. Options: block_id (which block), block_title (title override), hide_label,
    and empty (render even with no results).'
  bundle: views_block_area
  rubric_ref: rubric/views_block_area_views_block_area_add_to_header@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: views_block_area-unsupported-blocks
  input: Which kind of blocks does views_block_area NOT let you select, and why?
  criteria: Context-aware blocks (block definitions with a 'context' key) are excluded from the selectable
    list because a view cannot supply the runtime context they require. Broken blocks and block_content
    derivatives whose content entity is gone also render as nothing.
  bundle: views_block_area
  rubric_ref: rubric/views_block_area_views_block_area_unsupported_blocks@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: views_block_area-known-area
  input: On this Drupal site there is a view (machine name vba_known) that uses views_block_area to place
    a block in its header. Inspect the view's configuration and state the block plugin id (block_id) it
    renders in the header.
  criteria: 'The vba_known view''s default display header has a views_block_area handler with block_id:
    system_powered_by_block. Read it with `drush cget views.view.vba_known` or by loading the View entity.'
  bundle: views_block_area
  rubric_ref: rubric/views_block_area_views_block_area_known_area@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/views_block_area-known-area-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/views_block_area-known-area-cleanup.sh
- id: views_block_area-known-field
  input: This site has a view (machine name vba_fld) that uses the views_block_area 'Block field' handler
    to render a block as a field. Inspect the view configuration and report which block plugin id it shows.
  criteria: 'The vba_fld view has a views_block_field field handler with block_id: system_branding_block.
    Discoverable via `drush cget views.view.vba_fld`.'
  bundle: views_block_area
  rubric_ref: rubric/views_block_area_views_block_area_known_field@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/views_block_area-known-field-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/views_block_area-known-field-cleanup.sh
- id: views_block_area-add-area
  input: On this Drupal site there is a view with machine name vba_task. Using the views_block_area module,
    add a Block area to this view (e.g. in its footer) that renders the core 'Powered by Drupal' block
    (block plugin id system_powered_by_block). Apply the change to the live site.
  criteria: 'The vba_task view has a views_block_area handler (header/footer/empty) with block_id: system_powered_by_block.'
  bundle: views_block_area
  rubric_ref: rubric/views_block_area_views_block_area_add_area@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
