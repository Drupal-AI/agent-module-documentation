rubrics:
- id: views_daterange_filters_vdf_operators_list
  version: '1.0'
  applicable_bundles:
  - views_daterange_filters
  checks:
  - kind: must_contain_any
    values:
    - includes
    - overlaps
    - ends_by
    - not_ended
    - Ends by
    - Not ended
    - Overlaps
  scoring:
    combine: all_pass
- id: views_daterange_filters_vdf_how_attaches
  version: '1.0'
  applicable_bundles:
  - views_daterange_filters
  checks:
  - kind: must_contain_any
    values:
    - views_daterange_filters_daterange
    - field_views_data_alter
    - hook_field_views_data_alter
    - daterange
    - date_recur
  scoring:
    combine: all_pass
- id: views_daterange_filters_vdf_end_column
  version: '1.0'
  applicable_bundles:
  - views_daterange_filters
  checks:
  - kind: must_contain_any
    values:
    - _end_value
    - field_when_end_value
    - getEndFieldName
    - substr
  scoring:
    combine: all_pass
- id: views_daterange_filters_vdf_known_operator
  version: '1.0'
  applicable_bundles:
  - views_daterange_filters
  checks:
  - kind: must_contain_any
    values:
    - overlaps
  scoring:
    combine: all_pass
- id: views_daterange_filters_vdf_known_plugin
  version: '1.0'
  applicable_bundles:
  - views_daterange_filters
  checks:
  - kind: must_contain_any
    values:
    - views_daterange_filters_daterange
  scoring:
    combine: all_pass
- id: views_daterange_filters_vdf_build_view
  version: '1.0'
  applicable_bundles:
  - views_daterange_filters
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
- id: views_daterange_filters_vdf_switch_operator
  version: '1.0'
  applicable_bundles:
  - views_daterange_filters
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
