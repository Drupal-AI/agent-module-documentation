metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: views_arg_order_sort
  version: 2.0.x
  note: 'Views Arg Order Sort adds a Views sort handler (UI label ''Multi-item Argument Order'', plugin
    id views_arg_order_sort_default, declared via hook_views_data as a #global sort on table views_arg_order_sort
    field weight) that orders rows to match the order of values in a chosen multi-item contextual filter
    by building a CASE ... WHEN ... THEN <pos> expression. Options: argument_number (0-indexed contextual
    filter), inherit_type (derive column from that argument), field_type (table::field like node::nid
    when not inheriting), null_below, and standard order (DESC reverses). No configure route, permission,
    Drush; all state lives in a view config entity''s display sorts. Medium/hard cases are grounded in
    real view config: introspection reads the sort''s plugin id / field_type; execution adds the sort
    to a view''s display with a given argument_number or explicit field_type, verified against the live
    views.view config.'
questions:
- id: vaos-sort-name
  input: In Views, I pass a list of node IDs like 5,3,9 into a contextual filter and want the results
    returned in that exact order using the views_arg_order_sort module. Which Views sort do I add (its
    UI label or plugin id)?
  criteria: Add the 'Multi-item Argument Order' sort criterion (plugin id views_arg_order_sort_default).
    It builds a CASE expression so rows sort by their position in the argument values.
  bundle: views_arg_order_sort
  rubric_ref: rubric/views_arg_order_sort_vaos_sort_name@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: vaos-options
  input: For the views_arg_order_sort 'Multi-item Argument Order' sort, how do I tell it which contextual
    filter to read, and how does it know which database column to sort on?
  criteria: argument_number (0-indexed) selects which contextual filter's values to use. With inherit_type
    on (default) it derives the sort column from that argument's own handler; turn inherit_type off to
    set an explicit field_type like node::nid. null_below places non-matching rows at the end, and a DESC
    order reverses the argument sequence.
  bundle: views_arg_order_sort
  rubric_ref: rubric/views_arg_order_sort_vaos_options@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: vaos-how-order
  input: How does views_arg_order_sort actually make the query return rows in the order of the passed
    argument values?
  criteria: Its query() splits the chosen argument's values (on + or ,) and emits an ORDER BY CASE <col>
    WHEN <val0> THEN 0 WHEN <val1> THEN 1 ... ELSE <null_o> END, so each row sorts by its position in
    the argument list; non-matching rows go first or last depending on null_below and direction.
  bundle: views_arg_order_sort
  rubric_ref: rubric/views_arg_order_sort_vaos_how_order@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: vaos-which-plugin
  input: On this Drupal site the view with machine id 'vaos_intro_view' has a sort added by the views_arg_order_sort
    module. Inspect the live view configuration and give the sort plugin id it uses.
  criteria: views_arg_order_sort_default (the 'Multi-item Argument Order' sort), in vaos_intro_view's
    display sorts.
  bundle: views_arg_order_sort
  rubric_ref: rubric/views_arg_order_sort_vaos_which_plugin@1.0
  tags:
