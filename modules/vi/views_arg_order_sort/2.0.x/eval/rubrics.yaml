rubrics:
- id: views_arg_order_sort_vaos_sort_name
  version: '1.0'
  applicable_bundles:
  - views_arg_order_sort
  checks:
  - kind: must_contain_any
    values:
    - Multi-item Argument Order
    - views_arg_order_sort_default
  scoring:
    combine: all_pass
- id: views_arg_order_sort_vaos_options
  version: '1.0'
  applicable_bundles:
  - views_arg_order_sort
  checks:
  - kind: must_contain_any
    values:
    - argument_number
    - inherit_type
    - field_type
  scoring:
    combine: all_pass
- id: views_arg_order_sort_vaos_how_order
  version: '1.0'
  applicable_bundles:
  - views_arg_order_sort
  checks:
  - kind: must_contain_any
    values:
    - CASE
    - ORDER BY
    - position
    - argument order
  scoring:
    combine: all_pass
- id: views_arg_order_sort_vaos_which_plugin
  version: '1.0'
  applicable_bundles:
  - views_arg_order_sort
  checks:
  - kind: must_contain_any
    values:
    - views_arg_order_sort_default
  scoring:
    combine: all_pass
- id: views_arg_order_sort_vaos_field_type
  version: '1.0'
  applicable_bundles:
  - views_arg_order_sort
  checks:
  - kind: must_contain_any
    values:
    - node::nid
  scoring:
    combine: all_pass
- id: views_arg_order_sort_vaos_add_sort_inherit
  version: '1.0'
  applicable_bundles:
  - views_arg_order_sort
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
- id: views_arg_order_sort_vaos_add_sort_fieldtype
  version: '1.0'
  applicable_bundles:
  - views_arg_order_sort
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
