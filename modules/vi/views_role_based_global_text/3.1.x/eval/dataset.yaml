metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: views_role_based_global_text
  version: 3.1.x
  note: 'Overrides the core Views ''text'' area plugin class with RoleBasedGlobalText (via hook_views_plugins_area_alter),
    adding a Roles fieldset (roles checkboxes + negate) to any Global: Text area. Options stored in the
    display''s area handler under roles_fieldset.roles and roles_fieldset.negate. Empty roles = show to
    everyone; roles+no negate = only those roles; roles+negate = everyone except those roles. No config
    schema/permissions/Drush. Medium/hard read and write these options on a real view (vrbgt_role_view
    / vrbgt_task_view).'
questions:
- id: vrbgt-how-restrict
  input: 'Using views_role_based_global_text, how do I show a Views ''Global: Text area'' (e.g. a header)
    only to certain user roles, and what happens if I select no roles?'
  criteria: 'The module adds a Roles fieldset to the Global: Text area settings; check the roles that
    should see it. If no role is selected the text is shown to everyone (default behaviour).'
  bundle: views_role_based_global_text
  rubric_ref: rubric/views_role_based_global_text_vrbgt_how_restrict@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: vrbgt-negate
  input: 'What does the ''Negate'' option do on a Global: Text area provided by views_role_based_global_text?'
  criteria: With roles selected and Negate on, the text is shown to everyone EXCEPT users with the selected
    roles (instead of only to those roles).
  bundle: views_role_based_global_text
  rubric_ref: rubric/views_role_based_global_text_vrbgt_negate@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: vrbgt-storage
  input: 'Where are the role settings for a views_role_based_global_text Global: Text area stored, and
    what handler class implements the behaviour?'
  criteria: They are stored in the view's area handler options under roles_fieldset.roles and roles_fieldset.negate;
    the class RoleBasedGlobalText (extending core's Text area handler) implements it, swapped in via hook_views_plugins_area_alter().
  bundle: views_role_based_global_text
  rubric_ref: rubric/views_role_based_global_text_vrbgt_storage@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: vrbgt-known-view
  input: 'On this site the View ''vrbgt_role_view'' has a header Global: Text area with role-based visibility
    configured. Inspect the view configuration: which role is selected and is the selection negated (i.e.
    who actually sees the text)?'
  criteria: The header text area selects the 'anonymous' role with negate = TRUE, so the text is shown
    to everyone EXCEPT anonymous users (i.e. only logged-in users). Read views.view.vrbgt_role_view display.default.display_options.header.area_text.roles_fieldset.
  bundle: views_role_based_global_text
  rubric_ref: rubric/views_role_based_global_text_vrbgt_known_view@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/views_role_based_global_text-known-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/views_role_based_global_text-known-cleanup.sh
- id: vrbgt-restrict
  input: 'The View ''vrbgt_task_view'' has a header Global: Text area that is currently shown to everyone.
    Using views_role_based_global_text, restrict it so only users with the ''authenticated'' role see
    it, and save the change to the live view.'
  criteria: Set the header area's roles_fieldset.roles to include 'authenticated' (authenticated => authenticated)
    with negate FALSE and save the view. verify checks roles_fieldset.roles['authenticated'] is truthy
    on vrbgt_task_view.
  bundle: views_role_based_global_text
  rubric_ref: rubric/views_role_based_global_text_vrbgt_restrict@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/views_role_based_global_text-restrict-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/views_role_based_global_text-restrict-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/views_role_based_global_text-restrict-verify.sh
