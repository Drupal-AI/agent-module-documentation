rubrics:
- id: views_role_based_global_text_vrbgt_how_restrict
  version: '1.0'
  applicable_bundles:
  - views_role_based_global_text
  checks:
  - kind: must_contain_any
    values:
    - 'Global: Text'
    - roles
    - Roles
    - text area
  scoring:
    combine: all_pass
- id: views_role_based_global_text_vrbgt_negate
  version: '1.0'
  applicable_bundles:
  - views_role_based_global_text
  checks:
  - kind: must_contain_any
    values:
    - except
    - exclude
    - negate
  scoring:
    combine: all_pass
- id: views_role_based_global_text_vrbgt_storage
  version: '1.0'
  applicable_bundles:
  - views_role_based_global_text
  checks:
  - kind: must_contain_any
    values:
    - roles_fieldset
    - RoleBasedGlobalText
    - area
  scoring:
    combine: all_pass
- id: views_role_based_global_text_vrbgt_known_view
  version: '1.0'
  applicable_bundles:
  - views_role_based_global_text
  checks:
  - kind: must_contain_any
    values:
    - anonymous
  scoring:
    combine: all_pass
- id: views_role_based_global_text_vrbgt_restrict
  version: '1.0'
  applicable_bundles:
  - views_role_based_global_text
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
