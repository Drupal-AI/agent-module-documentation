metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: views_accordion
  version: 2.0.x
  note: 'Views Accordion is a single Views style/format plugin with no admin form, permissions, or services.
    Cases are `recipe` (response-graded): they probe documented facts (the style id/format, first-field-as-header,
    Fields row requirement, jquery_ui_accordion dependency, one-open-at-a-time, key options) an agent
    would otherwise read source to answer; no site mutation.'
questions:
- id: views-accordion-style-selection
  input: On a Drupal 11 site I want a view's results shown as a jQuery UI accordion. Which Views setting/plugin
    do I choose to do this?
  criteria: Set the view's Format/Style to the 'jQuery UI accordion' style plugin (id views_accordion)
    provided by the Views Accordion module.
  bundle: views_accordion
  rubric_ref: rubric/views_accordion_views_accordion_style_selection@1.0
  tags:
  - mode:recipe
- id: views-accordion-header-field
  input: Using the Views Accordion style, which field of each row becomes the clickable accordion header/trigger?
  criteria: The first field (first non-excluded field in order of appearance) of each row is used as the
    accordion header/trigger; the remaining fields form the panel.
  bundle: views_accordion
  rubric_ref: rubric/views_accordion_views_accordion_header_field@1.0
  tags:
  - mode:recipe
- id: views-accordion-fields-row-requirement
  input: My view fails validation with the Views Accordion style. What row style does the view need, and
    how many fields at minimum?
  criteria: The row style must be set to Fields (the style errors 'requires Fields as row style'), and
    you need at least two fields so the header and panel are distinct.
  bundle: views_accordion
  rubric_ref: rubric/views_accordion_views_accordion_fields_row_requirement@1.0
  tags:
  - mode:recipe
- id: views-accordion-dependency
  input: Which contrib module must be installed for Views Accordion to work, since it supplies the jQuery
    UI Accordion library?
  criteria: The jquery_ui_accordion contrib module (drupal/jquery_ui_accordion ^2.0), alongside core views,
    provides the jQuery UI Accordion library.
  bundle: views_accordion
  rubric_ref: rubric/views_accordion_views_accordion_dependency@1.0
  tags:
  - mode:recipe
- id: views-accordion-one-open
  input: With the Views Accordion style, can more than one section be open at once, and which option lets
    all sections be closed at the same time?
  criteria: By default only one section is open at a time (standard jQuery UI accordion); enabling the
    Collapsible option lets the active section close so all sections can be closed at once.
  bundle: views_accordion
  rubric_ref: rubric/views_accordion_views_accordion_one_open@1.0
  tags:
  - mode:recipe
- id: views-accordion-start-open-random
  input: In the Views Accordion style options, how do I make a random section open on each page load,
    and what other values does the 'Row to display opened on start' option accept?
  criteria: Set 'Row to display opened on start' (row-start-open) to 'Random'; it also accepts a specific
    row number or 'None' (None requires Collapsible enabled).
  bundle: views_accordion
  rubric_ref: rubric/views_accordion_views_accordion_start_open_random@1.0
  tags:
  - mode:recipe
- id: views-accordion-disable-if-one
  input: Which Views Accordion option prevents the accordion from rendering when the view returns fewer
    than two results?
  criteria: The 'Disable if only one result' option (disableifone) skips rendering the accordion when
    there are fewer than 2 results.
  bundle: views_accordion
  rubric_ref: rubric/views_accordion_views_accordion_disable_if_one@1.0
  tags:
  - mode:recipe
- id: views-accordion-template
  input: I want to override the HTML markup that the Views Accordion style outputs. Which theme template
    do I copy and override?
  criteria: Override the views-accordion-view.html.twig template (theme hook views_accordion_view); keep
    the per-row wrapping div the accordion JS requires.
  bundle: views_accordion
  rubric_ref: rubric/views_accordion_views_accordion_template@1.0
  tags:
  - mode:recipe
