metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: views_moderation_state_weights
  version: 1.1.x
  note: 'Views moderation state weights exposes content_moderation state weights to Views. Real, verifiable
    surface: (a) two Views handlers added by hook_views_data() to every MODERATED entity''s data + revision
    tables - field handler moderation_state_weight_field and sort handler moderation_state_weight_sort,
    both titled ''Moderation state weight''; (b) an internal DB table views_moderation_state_weights (PK
    workflow+moderation_state, column weight) populated on install and re-synced by content_moderation
    workflow insert/update/delete hooks. No config UI, permissions, Drush, or exported config. Medium
    cases seed a namespaced content_moderation workflow with a distinctive state weight and read it back
    from the module''s table; hard cases moderate a namespaced content type (so the handler appears in
    Views data) and add the module''s sort/field handler to a base view, verified against the saved view
    config. ENV NOTE: saving a View on this shared site can trigger an unrelated group-module AssertionError
    during the terminate/route-rebuild phase; the save still persists and the separate verify script reads
    the correct live state.'
questions:
- id: views_moderation_state_weights-handlers
  input: I want to sort a Drupal Views listing by content moderation workflow order (draft, then review,
    then published) rather than alphabetically by state. The views_moderation_state_weights module helps.
    What Views field and sort does it add, and what is that column called in the Views UI?
  criteria: It adds a Views field handler (moderation_state_weight_field) and a Views sort handler (moderation_state_weight_sort),
    both labelled 'Moderation state weight', on moderated entity tables. Add the 'Moderation state weight'
    sort to order by workflow weight.
  bundle: views_moderation_state_weights
  rubric_ref: rubric/views_moderation_state_weights_views_moderation_state_weights_handlers@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: views_moderation_state_weights-requirements
  input: What does the views_moderation_state_weights module require to be enabled, and on which entities
    do its Views field/sort handlers become available?
  criteria: It depends on content_moderation, views and workflows. Its handlers are added (via hook_views_data)
    only to entity types/tables that actually have a content_moderation workflow assigned (moderated entity
    types), including their revision tables.
  bundle: views_moderation_state_weights
  rubric_ref: rubric/views_moderation_state_weights_views_moderation_state_weights_requirements@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: views_moderation_state_weights-sync-table
  input: How does the views_moderation_state_weights module know each moderation state's weight for sorting,
    and how is that kept up to date when a workflow changes?
  criteria: It maintains an internal DB table named views_moderation_state_weights (workflow, moderation_state,
    weight). It is populated on install and re-synced by content_moderation workflow insert/update/delete
    hooks (update deletes then re-inserts the workflow's rows).
  bundle: views_moderation_state_weights
  rubric_ref: rubric/views_moderation_state_weights_views_moderation_state_weights_sync_table@1.0
  tags:
  - mode:recipe
  - difficulty:easy
