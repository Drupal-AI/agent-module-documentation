metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: views_rss
  version: 2.4.x
  note: 'views_rss is the plugin-machinery-only parent: style plugin id rss_fields and row plugin id views_rss_fields
    (from src/Plugin/views/style/RssFields.php and src/Plugin/views/row/RssFields.php), each requiring
    the other, with per-View config at display.<id>.display_options.style.options.channel.<namespace>.<module>.<element>
    (channel) and ...row.options.item.<namespace>.<module>.<element> (item). All actual RSS elements come
    from the 5 submodules via hook_views_rss_namespaces()/hook_views_rss_channel_elements()/hook_views_rss_item_elements().
    Medium/hard cases are grounded in real Views config entities (vrss_p_* machine names) built directly
    via the View entity API, mirroring what the style/row options forms would save.'
questions:
- id: views_rss-style-row-plugins
  input: The Drupal contrib module views_rss (Advanced Views RSS Feed) replaces core's RSS style for a
    Views Feed display. What are the exact plugin ids of its style plugin and its row plugin, and what
    do they require of each other?
  criteria: The style plugin id is rss_fields ("Advanced RSS feed") and the row plugin id is views_rss_fields
    (also "Advanced RSS feed"). Each plugin's validate() requires the other to be in use on the same Feed
    display, and the row plugin additionally requires the views_rss_core submodule to be enabled.
  bundle: views_rss
  rubric_ref: rubric/views_rss_views_rss_style_row_plugins@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: views_rss-element-hooks
  input: Which hooks does the views_rss module invite other modules to implement in order to add RSS <channel>/<item>
    elements and XML namespaces to a feed built with its style/row plugins?
  criteria: hook_views_rss_namespaces(), hook_views_rss_channel_elements(), and hook_views_rss_item_elements()
    (plus _alter() variants of each, and hook_views_rss_date_sources()). views_rss_get() in views_rss.module
    invokes these on every implementing module and caches the merged result in the 'data' cache bin.
  bundle: views_rss
  rubric_ref: rubric/views_rss_views_rss_element_hooks@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: views_rss-rfc822-date
  input: views_rss installs a custom date format for RSS output. What is its machine name/pattern, and
    what PHP mechanism does the module use to format a timestamp with it?
  criteria: It installs core.date_format.rfc822 with pattern 'D, d M y H:i:s O'. views_rss_format_date($timestamp)
    formats a UNIX timestamp using PHP's \DateTimeInterface::RFC822 constant via date().
  bundle: views_rss
  rubric_ref: rubric/views_rss_views_rss_rfc822_date@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: views_rss-channel-description
  input: This Drupal site has a View called vrss_p_desc with an RSS feed display already configured using
    the Advanced Views RSS Feed style plugin. Inspect its live configuration and report the configured
    text of the channel <description> element.
  criteria: 'Views RSS QA marker: kiwi-9182 - found at views.view.vrss_p_desc: display.feed_1.display_options.style.options.channel.core.views_rss_core.description.'
  bundle: views_rss
  rubric_ref: rubric/views_rss_views_rss_channel_description@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/views_rss-channel-description-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/views_rss-channel-description-cleanup.sh
- id: views_rss-item-title-field
  input: This Drupal site has a View called vrss_p_item with an RSS feed display already configured using
    the Advanced Views RSS Feed row plugin, mapping some View field to the item <title> RSS element. Inspect
    its live configuration and report which field id is mapped to the item title element.
  criteria: 'field_vrss_marker_7734 - found at views.view.vrss_p_item: display.feed_1.display_options.row.options.item.core.views_rss_core.title.'
  bundle: views_rss
  rubric_ref: rubric/views_rss_views_rss_item_title_field@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/views_rss-item-title-field-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/views_rss-item-title-field-cleanup.sh
- id: views_rss-build-feed
  input: On this Drupal site, build a new View called vrss_p_task, base table Content (node), with a Feed
    display using the Advanced Views RSS Feed style plugin (rss_fields) and row plugin (views_rss_fields),
    mapping the item <title> RSS element to the node's title field. Apply the change to the live site.
  criteria: views.view.vrss_p_task has a display whose display_options.style.type is rss_fields, display_options.row.type
    is views_rss_fields, and display_options.row.options.item.core.views_rss_core.title is set to a non-empty
    field id (e.g. 'title').
  bundle: views_rss
  rubric_ref: rubric/views_rss_views_rss_build_feed@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/views_rss-build-feed-reset.sh
    verify: agent-module-documentation/evaluation/verify/views_rss-build-feed-verify.sh
- id: views_rss-feed-in-links
  input: On this Drupal site, build a new View called vrss_p_links with a Feed display using the Advanced
    Views RSS Feed style plugin (rss_fields), and enable the 'Display feed icon in the links attached
    to the view' option in the style plugin's Other feed settings. Apply the change to the live site.
  criteria: views.view.vrss_p_links has a display whose display_options.style.type is rss_fields and display_options.style.options.feed_settings.feed_in_links
    is truthy (1/true).
  bundle: views_rss
  rubric_ref: rubric/views_rss_views_rss_feed_in_links@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/views_rss-feed-in-links-reset.sh
    verify: agent-module-documentation/evaluation/verify/views_rss-feed-in-links-verify.sh
