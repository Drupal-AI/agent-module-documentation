    - views_view_row_rss
    - views_rss_format_preprocess_views_view_row_rss
  scoring:
    combine: all_pass
- id: views_rss_format_views_rss_format_attribute_conversion
  version: '1.0'
  applicable_bundles:
  - views_rss_format
  checks:
  - kind: must_contain_any
