rubrics:
- id: views_rss_dc_views_rss_dc_namespace
  version: '1.0'
  applicable_bundles:
  - views_rss_dc
  checks:
  - kind: must_contain_any
    values:
    - dc
    - purl.org/dc/elements/1.1
  scoring:
    combine: all_pass
- id: views_rss_dc_views_rss_dc_date_format
  version: '1.0'
  applicable_bundles:
  - views_rss_dc
  checks:
  - kind: must_contain_any
    values:
    - ISO-8601
    - ISO 8601
    - date('c'
    - date("c"
  scoring:
    combine: all_pass
- id: views_rss_dc_views_rss_dc_elements_list
  version: '1.0'
  applicable_bundles:
  - views_rss_dc
  checks:
  - kind: must_contain_any
    values:
    - dc:title
    - dc:creator
    - dc:subject
    - dc:description
    - dc:publisher
    - dc:contributor
    - dc:date
    - dc:type
    - dc:format
    - dc:identifier
    - dc:source
    - dc:language
    - dc:relation
    - dc:coverage
    - dc:rights
  scoring:
    combine: all_pass
- id: views_rss_dc_views_rss_dc_item_date_field
  version: '1.0'
  applicable_bundles:
  - views_rss_dc
  checks:
  - kind: must_contain_any
    values:
    - field_vrss_dc_marker_3301
  scoring:
    combine: all_pass
- id: views_rss_dc_views_rss_dc_item_publisher_field
  version: '1.0'
  applicable_bundles:
  - views_rss_dc
  checks:
  - kind: must_contain_any
    values:
    - field_vrss_dc_marker_6642
  scoring:
    combine: all_pass
- id: views_rss_dc_views_rss_dc_item_creator
  version: '1.0'
  applicable_bundles:
  - views_rss_dc
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
- id: views_rss_dc_views_rss_dc_item_rights
  version: '1.0'
  applicable_bundles:
  - views_rss_dc
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
