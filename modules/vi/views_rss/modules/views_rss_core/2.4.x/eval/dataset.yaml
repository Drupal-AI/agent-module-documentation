metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: views_rss_core
  version: 2.4.x
  note: 'views_rss_core registers the standard RSS 2.0 channel/item elements via hook_views_rss_channel_elements()/hook_views_rss_item_elements()
    under namespace ''core'', module key ''views_rss_core''. It is a hard dependency of the parent''s
    row plugin (views_rss_fields refuses to save without it, since an item needs title or description).
    Medium/hard cases target elements unique to this submodule not used in the parent''s own eval set:
    channel <image> and <ttl>, item <enclosure> and <guid>, grounded in real Views config entities (vrss_c_*
    machine names).'
questions:
- id: views_rss_core-required-module
  input: Why does the views_rss row plugin (views_rss_fields) refuse to save a View unless views_rss_core
    is enabled?
  criteria: RSS 2.0 requires every item to carry a title or a description, and views_rss_core is the submodule
    that provides those (and every other core RSS) elements; RssFields::validate() on the row plugin checks
    views_rss_core is enabled and that at least one of item.core.views_rss_core.title / .description is
    configured.
  bundle: views_rss_core
  rubric_ref: rubric/views_rss_core_views_rss_core_required_module@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: views_rss_core-item-elements-list
  input: Name at least three RSS <item> elements that the views_rss_core submodule registers via hook_views_rss_item_elements().
  criteria: views_rss_core_views_rss_item_elements() registers title, link, description, author, category,
    comments, enclosure, guid, pubDate, source, and content:encoded.
  bundle: views_rss_core
  rubric_ref: rubric/views_rss_core_views_rss_core_item_elements_list@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: views_rss_core-date-format-elements
  input: How does views_rss_core derive the channel <lastBuildDate> element, and in what format is it
    output?
  criteria: views_rss_core_preprocess_views_view_rss() scans every item's pubDate value, takes the most
    recent one, and sets it as the channel <lastBuildDate> value, formatted via views_rss_format_date()
    using PHP's RFC-822 date constant.
  bundle: views_rss_core
  rubric_ref: rubric/views_rss_core_views_rss_core_date_format_elements@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: views_rss_core-channel-image
  input: This Drupal site has a View called vrss_c_image with an RSS feed display already configured using
    the Advanced Views RSS Feed style plugin. Inspect its live configuration and report the configured
    channel <image> path.
  criteria: 'sites/default/files/vrss-core-qa-9911.png - found at views.view.vrss_c_image: display.feed_1.display_options.style.options.channel.core.views_rss_core.image.'
  bundle: views_rss_core
  rubric_ref: rubric/views_rss_core_views_rss_core_channel_image@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/views_rss_core-channel-image-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/views_rss_core-channel-image-cleanup.sh
- id: views_rss_core-item-enclosure-field
  input: This Drupal site has a View called vrss_c_enclosure with an RSS feed display already configured
    using the Advanced Views RSS Feed row plugin, mapping some field to the item <enclosure> element.
    Inspect its live configuration and report which field id is mapped to the enclosure element.
  criteria: 'field_vrss_core_marker_5521 - found at views.view.vrss_c_enclosure: display.feed_1.display_options.row.options.item.core.views_rss_core.enclosure.'
  bundle: views_rss_core
  rubric_ref: rubric/views_rss_core_views_rss_core_item_enclosure_field@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/views_rss_core-item-enclosure-field-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/views_rss_core-item-enclosure-field-cleanup.sh
- id: views_rss_core-channel-ttl
  input: On this Drupal site, build a new View called vrss_c_ttl with a Feed display using the Advanced
    Views RSS Feed style plugin (rss_fields), and set the channel <ttl> element to 45. Apply the change
    to the live site.
  criteria: views.view.vrss_c_ttl has a display whose display_options.style.type is rss_fields and display_options.style.options.channel.core.views_rss_core.ttl
    is '45'.
  bundle: views_rss_core
  rubric_ref: rubric/views_rss_core_views_rss_core_channel_ttl@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/views_rss_core-channel-ttl-reset.sh
    verify: agent-module-documentation/evaluation/verify/views_rss_core-channel-ttl-verify.sh
- id: views_rss_core-item-guid
  input: On this Drupal site, build a new View called vrss_c_guid with a Feed display using the Advanced
    Views RSS Feed row plugin (views_rss_fields), mapping a field called field_vrss_core_guid_src to the
    item <guid> RSS element. Apply the change to the live site.
  criteria: views.view.vrss_c_guid has a display whose display_options.row.type is views_rss_fields and
    display_options.row.options.item.core.views_rss_core.guid is a non-empty field id.
  bundle: views_rss_core
  rubric_ref: rubric/views_rss_core_views_rss_core_item_guid@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/views_rss_core-item-guid-reset.sh
    verify: agent-module-documentation/evaluation/verify/views_rss_core-item-guid-verify.sh
