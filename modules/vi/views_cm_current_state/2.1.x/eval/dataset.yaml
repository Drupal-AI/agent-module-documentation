metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: views_cm_current_state
  version: 2.1.x
  note: 'views_cm_current_state adds exactly one Views field handler, current_state_views_field (class
    CurrentStateViewsField, @ViewsField), registered in views_cm_current_state.views.inc via hook_views_data()
    on the special global ''views'' table under the ''Content revision'' group, so it is offered in every
    view. render() loads each row entity''s LATEST revision (getLatestRevisionId/loadRevision) and returns
    that revision''s moderation_state label via content_moderation.moderation_information, falling back
    to Published/Unpublished. It has no config, no settings form (configure=null), no schema, no permissions,
    no Drush, and defines no plugin type of its own. In a view config the field is keyed current_state_views_field
    with table ''views''. Medium/hard cases are grounded in real views config: introspection reads back
    which view contains the field; execution adds the field to a view''s default display, verified against
    the live views.view config entity.'
questions:
- id: vccs-field-name
  input: On a Drupal site using content moderation, I want a Views column that shows each row's current
    moderation state. The contrib module views_cm_current_state provides it. What is the name/id of the
    Views field it adds, and under which group does it appear in the Views 'Add field' dialog?
  criteria: It adds a single Views field, 'Current state' (plugin id current_state_views_field), registered
    via hook_views_data() on the global 'views' table under the 'Content revision' group, so it is available
    in every view.
  bundle: views_cm_current_state
  rubric_ref: rubric/views_cm_current_state_vccs_field_name@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: vccs-latest-revision
  input: How does the views_cm_current_state 'Current state' field differ from core's 'Moderation state'
    Views field, and what does it show when the row's entity is not under content moderation?
  criteria: The field loads and reports the entity's LATEST revision's moderation state (e.g. a pending
    draft/forward revision), whereas core's moderation_state field reflects the loaded default/published
    revision, so the two can differ. If the latest revision has no moderation_state (entity not moderated)
    it falls back to 'Published' or 'Unpublished' based on the published flag.
  bundle: views_cm_current_state
  rubric_ref: rubric/views_cm_current_state_vccs_latest_revision@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: vccs-dependencies
  input: Which Drupal modules must be enabled for views_cm_current_state to work, and does it add its
    own configuration form or permissions?
  criteria: It depends on views and content_moderation. It has no configuration form (configure is null),
    no config schema, no permissions, and no Drush commands; you just add the 'Current state' field to
    a view.
  bundle: views_cm_current_state
  rubric_ref: rubric/views_cm_current_state_vccs_dependencies@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: vccs-known-view
  input: This site has a view that already includes the views_cm_current_state 'Current state' field (plugin
    id current_state_views_field). Inspect the live views configuration and give the machine id of that
    view.
  criteria: 'The view is vccs_known: its default display''s fields contain a component with plugin_id
    current_state_views_field (table ''views'').'
  bundle: views_cm_current_state
  rubric_ref: rubric/views_cm_current_state_vccs_known_view@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/views_cm_current_state-known-view-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/views_cm_current_state-known-view-cleanup.sh
- id: vccs-known-view-table
  input: 'On this site the view ''vccs_known'' shows a current moderation state column via views_cm_current_state.
    Inspect its configuration: which Views table is that field attached to (the ''table'' key of the current_state_views_field
    component)?'
  criteria: 'The current_state_views_field component in vccs_known uses table: views (the special/global
    Views table), which is why views_cm_current_state exposes the field to every view.'
  bundle: views_cm_current_state
  rubric_ref: rubric/views_cm_current_state_vccs_known_view_table@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/views_cm_current_state-known-view-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/views_cm_current_state-known-view-cleanup.sh
- id: vccs-add-field
  input: This site has a view with machine id 'vccs_task' that currently shows only a Title field. Using
    the views_cm_current_state module, add its 'Current state' field (plugin id current_state_views_field)
    to the view's default display and save the change to the live site.
  criteria: Add a field component to display.default.display_options.fields of views.view.vccs_task with
    id/field/plugin_id = current_state_views_field and table = views, then save the view (via the Views
    UI 'Add field' under 'Content revision', or by editing the view config entity).
  bundle: views_cm_current_state
  rubric_ref: rubric/views_cm_current_state_vccs_add_field@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/views_cm_current_state-add-field-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/views_cm_current_state-add-field-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/views_cm_current_state-add-field-verify.sh
- id: vccs-add-field-layman
  input: On my site there's a content listing called 'vccs_task' that shows a Title column. I want it
    to also show the workflow status (draft, published, etc.) of the newest version of each item, the
    way editors see it. I have the views_cm_current_state module installed. Please add that status column
    and save it.
  criteria: 'The correct end state is identical to the expert phrasing: the vccs_task view''s default
    display gains a field component with plugin_id current_state_views_field (the module''s ''Current
    state'' field), saved to live config.'
  bundle: views_cm_current_state
  rubric_ref: rubric/views_cm_current_state_vccs_add_field_layman@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: site-owner
    reset: agent-module-documentation/evaluation/verify/views_cm_current_state-add-field-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/views_cm_current_state-add-field-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/views_cm_current_state-add-field-verify.sh
