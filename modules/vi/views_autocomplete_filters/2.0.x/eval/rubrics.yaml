rubrics:
- id: views_autocomplete_filters_vaf_which_filters
  version: '1.0'
  applicable_bundles:
  - views_autocomplete_filters
  checks:
  - kind: must_contain_any
    values:
    - string
    - combine
    - search_api_fulltext
    - search_api_text
  scoring:
    combine: all_pass
- id: views_autocomplete_filters_vaf_suggestions_source
  version: '1.0'
  applicable_bundles:
  - views_autocomplete_filters
  checks:
  - kind: must_contain_any
    values:
    - view's own results
    - re-executes the view
    - results of the view
    - view result
    - the view's results
  scoring:
    combine: all_pass
- id: views_autocomplete_filters_vaf_dependency
  version: '1.0'
  applicable_bundles:
  - views_autocomplete_filters
  checks:
