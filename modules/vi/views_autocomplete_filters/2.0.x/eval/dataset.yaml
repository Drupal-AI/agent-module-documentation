metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: views_autocomplete_filters
  version: 2.0.x
  note: 'Views Autocomplete Filters has no admin settings form, no permissions, and no callable service
    API — it extends four Views filter handlers and adds one internal autocomplete route. Cases are `recipe`
    (response-graded): they probe documented facts an agent would otherwise read source to answer; no
    site mutation.'
questions:
- id: vaf-which-filters
  input: On a Drupal 11 site, which Views exposed filter types can Views Autocomplete Filters add an autocomplete
    dropdown to?
  criteria: 'It extends four filter handlers: string, combine, search_api_text, and search_api_fulltext
    (the last two require Search API).'
  bundle: views_autocomplete_filters
  rubric_ref: rubric/views_autocomplete_filters_vaf_which_filters@1.0
  tags:
  - mode:recipe
- id: vaf-suggestions-source
  input: Where do the autocomplete suggestions for a Views Autocomplete Filters exposed filter come from?
  criteria: Suggestions come from re-executing the view with the typed string and rendering the chosen
    'autocomplete_field' from the view's own result rows — not a generic entity lookup.
  bundle: views_autocomplete_filters
  rubric_ref: rubric/views_autocomplete_filters_vaf_suggestions_source@1.0
  tags:
  - mode:recipe
- id: vaf-dependency
  input: What module does Views Autocomplete Filters require, and what does it optionally integrate with?
  criteria: It requires core Views (drupal:views) only; it optionally integrates with Search API to extend
    search_api_text / search_api_fulltext filters.
  bundle: views_autocomplete_filters
  rubric_ref: rubric/views_autocomplete_filters_vaf_dependency@1.0
  tags:
  - mode:recipe
- id: vaf-enable-on-filter
  input: In the Views UI, what are the key steps to turn an exposed Title text filter into an autocomplete
    filter with Views Autocomplete Filters?
  criteria: Add the field to the view's field list, expose the same filter with a text operator (e.g.
    Contains), check 'Use Autocomplete', then set 'Field with autocomplete results' to that field.
  bundle: views_autocomplete_filters
  rubric_ref: rubric/views_autocomplete_filters_vaf_enable_on_filter@1.0
  tags:
  - mode:recipe
- id: vaf-operator
  input: Why does the 'Use Autocomplete' checkbox sometimes not appear on an exposed Views string filter,
    and which operator is recommended?
  criteria: The checkbox only appears when the exposed filter value renders as a single textfield; pick
    a text operator such as Contains (recommended) rather than a select/range operator.
  bundle: views_autocomplete_filters
  rubric_ref: rubric/views_autocomplete_filters_vaf_operator@1.0
  tags:
  - mode:recipe
- id: vaf-route
  input: Which route/controller serves the autocomplete suggestions for Views Autocomplete Filters?
  criteria: Route views_filters.autocomplete (path /views-autocomplete-filters/{view_name}/{view_display}/{filter_name}/{view_args}),
    handled by ViewsAutocompleteFiltersController::autocomplete().
  bundle: views_autocomplete_filters
  rubric_ref: rubric/views_autocomplete_filters_vaf_route@1.0
  tags:
  - mode:recipe
- id: vaf-min-chars-items
  input: Which Views Autocomplete Filters options limit how soon suggestions appear and how many are returned,
    and what are their defaults?
  criteria: autocomplete_min_chars (default 0) sets the minimum characters before suggesting; autocomplete_items
    (default 10, 0 = no limit) caps the number of suggestions.
  bundle: views_autocomplete_filters
  rubric_ref: rubric/views_autocomplete_filters_vaf_min_chars_items@1.0
  tags:
  - mode:recipe
- id: vaf-dependent
  input: How do I make the autocomplete suggestions for one exposed filter respect the values set in the
    view's other exposed filters?
  criteria: Enable the 'Suggestions depend on other filter fields' option (autocomplete_dependent), which
    narrows suggestions using the other exposed filter inputs.
  bundle: views_autocomplete_filters
  rubric_ref: rubric/views_autocomplete_filters_vaf_dependent@1.0
  tags:
  - mode:recipe
