rubrics:
- id: views_ical_views_ical_recommended_plugins
  version: '1.0'
  applicable_bundles:
  - views_ical
  checks:
  - kind: must_contain_any
    values:
    - iCal Style Wizard
    - ical_wizard
    - iCal fields row wizard
    - ical_fields_wizard
    - iCal display
  scoring:
    combine: all_pass
- id: views_ical_views_ical_date_format
  version: '1.0'
  applicable_bundles:
  - views_ical
  checks:
  - kind: must_contain_any
    values:
    - Ymd\THis\Z
    - views_ical
    - Views iCal date
    - UTC
  scoring:
    combine: all_pass
- id: views_ical_views_ical_libraries
  version: '1.0'
  applicable_bundles:
  - views_ical
  checks:
  - kind: must_contain_any
    values:
    - eluceo/ical
    - html2text
  scoring:
    combine: all_pass
- id: views_ical_views_ical_inspect_style
  version: '1.0'
  applicable_bundles:
  - views_ical
  checks:
  - kind: must_contain_any
    values:
    - ical_wizard
  scoring:
    combine: all_pass
- id: views_ical_views_ical_inspect_filename
  version: '1.0'
  applicable_bundles:
  - views_ical
  checks:
  - kind: must_contain_any
    values:
    - calendar.ics
  scoring:
    combine: all_pass
- id: views_ical_views_ical_build_feed
  version: '1.0'
  applicable_bundles:
  - views_ical
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
- id: views_ical_views_ical_add_display_layman
  version: '1.0'
  applicable_bundles:
  - views_ical
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
