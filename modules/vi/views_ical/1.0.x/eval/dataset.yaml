metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: views_ical
  version: 1.0.x
  note: 'views_ical renders a View''s results as an iCalendar (.ics) feed via Views plugins only (no settings
    page, no permissions, no Drush; configure=null). Real ids grounded in src/Plugin/views/: display ''ical''
    (extends Feed, adds a ''filename'' option); styles ''ical_wizard'' (recommended) and ''ical'' (legacy);
    rows ''ical_fields_wizard'' and ''ical_fields''. Installs a locked core date format ''views_ical''
    (pattern Ymd\THis\Z). Bundles eluceo/ical and html2text. Medium cases create views whose display config
    carries these plugin ids / the filename option and the agent reads views.view.* config back; hard
    cases build (or extend) a view with an iCal feed display, verified by scanning the live view config
    for an ''ical'' display plugin or an ''ical''/''ical_wizard'' style.'
questions:
- id: views_ical-recommended-plugins
  input: I want to publish a subscribable .ics calendar feed from a Drupal view using the views_ical module.
    What is the recommended way to set it up — which display, style (Format) and row (Show) plugins should
    I pick?
  criteria: Add an iCal display (display plugin 'ical') to the view, set the Format/style to 'iCal Style
    Wizard' (ical_wizard) and Show/row to 'iCal fields row wizard' (ical_fields_wizard), then add fields
    (start date, end date, title) and map them to iCal properties in the style settings. The wizard pair
    is recommended over the legacy 'ical' style / 'ical_fields' row.
  bundle: views_ical
  rubric_ref: rubric/views_ical_views_ical_recommended_plugins@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: views_ical-date-format
  input: In the views_ical module, what date format/pattern do iCal timestamps use, and does the module
    provide a ready-made date format I can apply to date fields?
  criteria: iCal timestamps use the pattern Ymd\THis\Z (UTC, hence the trailing Z). The module installs
    a locked core date format with id 'views_ical' labelled 'Views iCal date' using exactly that pattern,
    which you select as the date field formatter (with a UTC timezone override).
  bundle: views_ical
  rubric_ref: rubric/views_ical_views_ical_date_format@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: views_ical-libraries
  input: Does the views_ical Drupal module depend on any external PHP libraries via Composer? If so, which
    ones?
  criteria: Yes — its composer.json requires eluceo/ical (^0.17), used to build the VCALENDAR/VEVENT output,
    and html2text/html2text (^4.0), used to convert HTML descriptions to plain text.
  bundle: views_ical
  rubric_ref: rubric/views_ical_views_ical_libraries@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: views_ical-inspect-style
  input: This Drupal site has a view named 'vical_wizard' that outputs an iCal feed. Inspect the live
    view configuration and tell me the machine name of the Views style plugin its iCal display uses.
  criteria: The iCal display of view vical_wizard uses style plugin ical_wizard (the iCal Style Wizard).
    Found in views.view.vical_wizard under display.ical_1.display_options.style.type.
  bundle: views_ical
  rubric_ref: rubric/views_ical_views_ical_inspect_style@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/views_ical-wizard-style-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/views_ical-wizard-style-cleanup.sh
- id: views_ical-inspect-filename
  input: On this site there is a view 'vical_named' whose iCal display is configured to download the .ics
    file with a specific filename. Inspect the live view config and tell me the exact download filename
    that is set.
  criteria: The iCal display sets filename 'calendar.ics' (the ical display plugin's 'filename' option,
    which drives the Content-Disposition header). Found in views.view.vical_named under display.ical_1.display_options.filename.
  bundle: views_ical
  rubric_ref: rubric/views_ical_views_ical_inspect_filename@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/views_ical-filename-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/views_ical-filename-cleanup.sh
- id: views_ical-build-feed
  input: Using views_ical, create a new View with machine name 'vical_task' that outputs an iCalendar
    (.ics) feed of content. Add an iCal display and use the iCal Style Wizard (ical_wizard) style with
    the iCal fields row wizard (ical_fields_wizard). Apply it to the live site.
  criteria: views.view.vical_task exists with a display whose display_plugin is 'ical' and/or whose style.type
    is 'ical_wizard' (row 'ical_fields_wizard').
  bundle: views_ical
  rubric_ref: rubric/views_ical_views_ical_build_feed@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/views_ical-build-feed-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/views_ical-build-feed-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/views_ical-build-feed-verify.sh
- id: views_ical-add-display-layman
  input: There is already a view called 'vical_base' listing my content on a page. I want visitors to
    be able to subscribe to it as a calendar. Add a downloadable calendar (.ics) feed to that existing
    view using the calendar module I have installed (views_ical), and save it.
  criteria: views.view.vical_base now has an added iCal feed display (display_plugin 'ical' and/or style
    type 'ical'/'ical_wizard') in addition to its original page display.
  bundle: views_ical
  rubric_ref: rubric/views_ical_views_ical_add_display_layman@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: site-owner
    reset: agent-module-documentation/evaluation/verify/views_ical-add-display-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/views_ical-add-display-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/views_ical-add-display-verify.sh
