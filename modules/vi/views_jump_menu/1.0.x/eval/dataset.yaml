metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: views_jump_menu
  version: 1.0.x
  note: Views Jump Menu provides a single Views style plugin (id `jump_menu`) that renders rows as a <select>
    dropdown navigating to each row's URL. It has no admin form, permissions, services, or Drush. Cases
    are `recipe` (response-graded) — they probe documented facts an agent would otherwise read source
    to answer; no site mutation.
questions:
- id: vjm-style-plugin-id
  input: On a Drupal 11 site with Views Jump Menu, how do I make a view render its results as a jump-menu
    dropdown? Name the Views plugin type and the plugin id.
  criteria: It is a Views style (format) plugin with id `jump_menu` (class JumpMenu extends StylePluginBase).
    Set the display's Format to Jump Menu; the display must use the Fields row style.
  bundle: views_jump_menu
  rubric_ref: rubric/views_jump_menu_vjm_style_plugin_id@1.0
  tags:
  - mode:recipe
- id: vjm-label-url-fields
  input: Which two style options must I set so the Views Jump Menu shows text and links somewhere when
    an option is chosen?
  criteria: Set `label_field` (the field whose text is each option's label) and `url_field` (the field
    providing each option's destination URL). No options render until label_field is set.
  bundle: views_jump_menu
  rubric_ref: rubric/views_jump_menu_vjm_label_url_fields@1.0
  tags:
  - mode:recipe
- id: vjm-no-config-form
  input: Where is the admin settings page for Views Jump Menu and what permission controls it?
  criteria: There is none — no configure route, no settings form, and no permissions. All configuration
    is per-view in the display's Format (style) options.
  bundle: views_jump_menu
  rubric_ref: rubric/views_jump_menu_vjm_no_config_form@1.0
  tags:
  - mode:recipe
- id: vjm-new-window
  input: How do I make the Views Jump Menu open the selected destination in a new browser tab?
  criteria: Enable the `new_window` style option ("Open link in new window"). The JS then calls window.open(url,
    '_blank', 'noopener') instead of setting window.location.
  bundle: views_jump_menu
  rubric_ref: rubric/views_jump_menu_vjm_new_window@1.0
  tags:
  - mode:recipe
- id: vjm-canonical-url
  input: In Views Jump Menu, when does each option link to the entity's canonical aliased URL versus the
    field's rendered value?
  criteria: When the chosen URL field is an unaltered EntityLink handler, preprocess uses getEntity($row)->toUrl('canonical');
    if the field text has been rewritten (alter_text), it uses the field's rendered output instead.
  bundle: views_jump_menu
  rubric_ref: rubric/views_jump_menu_vjm_canonical_url@1.0
  tags:
  - mode:recipe
- id: vjm-theme-hook
  input: I want to override the HTML markup of the Views Jump Menu select. Which theme hook / template
    do I copy?
  criteria: Override the `views_jump_menu` theme hook by copying templates/views-jump-menu.html.twig into
    your theme. It renders a <select> with a placeholder option and one <option data-url=...> per row.
  bundle: views_jump_menu
  rubric_ref: rubric/views_jump_menu_vjm_theme_hook@1.0
  tags:
  - mode:recipe
- id: vjm-select-text-aria
  input: Which Views Jump Menu options set the placeholder prompt text and the screen-reader label of
    the dropdown?
  criteria: '`select_text` sets the pre-selected first option''s text (default ''-- Select --''); `select_label`
    sets the <select> aria-label for accessibility.'
  bundle: views_jump_menu
  rubric_ref: rubric/views_jump_menu_vjm_select_text_aria@1.0
  tags:
  - mode:recipe
- id: vjm-dependencies
  input: What does the Views Jump Menu module depend on, and does it require any contrib modules or libraries?
  criteria: It depends only on core `views` (drupal:views). No other contrib modules, PHP libraries, or
    external dependencies; license GPL-2.0-or-later.
  bundle: views_jump_menu
  rubric_ref: rubric/views_jump_menu_vjm_dependencies@1.0
  tags:
  - mode:recipe
