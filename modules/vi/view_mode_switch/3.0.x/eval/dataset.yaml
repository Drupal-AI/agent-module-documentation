metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: view_mode_switch
  version: 3.0.x
  note: view_mode_switch provides a field type. Its config is the field storage setting origin_view_modes
    (field.storage.node.<field>.settings.origin_view_modes = the view modes the field takes over) and
    the field instance setting allowed_view_modes (field.field.node.<bundle>.<field>.settings.allowed_view_modes
    = what an editor may switch to). Node ships the 'full' and 'teaser' view modes. Medium cases create
    field_vms with a known origin/allowed set and the agent reads it back with drush cget; hard cases
    require building/altering the field, verified against the live field config. All artifacts are namespaced
    field_vms* and removed on cleanup.
questions:
- id: vms-field-type
  input: On a Drupal site with the View Mode Switch Field module, what field type does it provide and
    what are the two key settings that control which view modes it takes over versus which an editor may
    choose?
  criteria: It provides the 'view_mode_switch' field type. Storage setting origin_view_modes = the view
    mode(s) the field takes over; field (instance) setting allowed_view_modes = the view modes an editor
    is allowed to switch to.
  bundle: view_mode_switch
  rubric_ref: rubric/view_mode_switch_vms_field_type@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: vms-switch-mechanism
  input: How does the View Mode Switch Field module actually change which view mode an entity renders
    in at display time?
  criteria: It implements hook_entity_view_mode_alter(); the view_mode_switch service's getViewModeToSwitchTo()
    checks the entity's switch field and, if the entity is viewed in one of the field's origin view modes,
    replaces the active view mode with the editor's chosen one.
  bundle: view_mode_switch
  rubric_ref: rubric/view_mode_switch_vms_switch_mechanism@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: vms-origin-vs-allowed
  input: In the View Mode Switch Field module, what is the difference between 'origin_view_modes' and
    'allowed_view_modes', and at which config level does each live?
  criteria: origin_view_modes is a field STORAGE setting listing the view modes the field hijacks/overrides;
    allowed_view_modes is a field INSTANCE setting listing which view modes an editor may switch to. Origin
    = what it takes over, allowed = what can be chosen.
  bundle: view_mode_switch
  rubric_ref: rubric/view_mode_switch_vms_origin_vs_allowed@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: vms-known-origin
  input: On this Drupal site, the Article content type has a View Mode Switch field named field_vms. Inspect
    the live field configuration and tell me which origin view mode the field is configured to take over.
  criteria: 'field.storage.node.field_vms settings.origin_view_modes = [''teaser''] (read with: drush
    cget field.storage.node.field_vms settings.origin_view_modes).'
  bundle: view_mode_switch
  rubric_ref: rubric/view_mode_switch_vms_known_origin@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/view_mode_switch-known-origin-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/view_mode_switch-known-origin-cleanup.sh
- id: vms-known-allowed
  input: On this Drupal site, the Article content type has a View Mode Switch field field_vms. Inspect
    the live field instance configuration and tell me which view modes an editor is allowed to switch
    to.
  criteria: 'field.field.node.article.field_vms settings.allowed_view_modes includes ''full'' (and ''teaser'');
    read with: drush cget field.field.node.article.field_vms settings.allowed_view_modes.'
  bundle: view_mode_switch
  rubric_ref: rubric/view_mode_switch_vms_known_allowed@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/view_mode_switch-known-allowed-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/view_mode_switch-known-allowed-cleanup.sh
- id: vms-create-field
  input: On this Drupal site, add a View Mode Switch field named field_vms to the Article content type.
    It must take over the 'full' view mode (origin) and let editors switch to either 'teaser' or 'full'.
    Apply the change to the live site.
  criteria: Create a field_vms field storage of type view_mode_switch with settings.origin_view_modes
    = ['full'] and an Article instance with settings.allowed_view_modes including 'teaser' and 'full'.
  bundle: view_mode_switch
  rubric_ref: rubric/view_mode_switch_vms_create_field@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/view_mode_switch-create-field-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/view_mode_switch-create-field-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/view_mode_switch-create-field-verify.sh
- id: vms-add-allowed
  input: On this Drupal site, the Article content type already has a View Mode Switch field field_vms
    that currently only lets editors switch to the 'teaser' view mode. Update it so editors can ALSO switch
    to the 'full' view mode. Apply the change to the live site.
  criteria: In field.field.node.article.field_vms add 'full' to settings.allowed_view_modes (keeping 'teaser').
  bundle: view_mode_switch
  rubric_ref: rubric/view_mode_switch_vms_add_allowed@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/view_mode_switch-add-allowed-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/view_mode_switch-add-allowed-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/view_mode_switch-add-allowed-verify.sh
