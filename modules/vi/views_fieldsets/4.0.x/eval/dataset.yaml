metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: views_fieldsets
  version: 4.0.x
  note: 'Views Fieldsets adds one Views field handler (id `fieldset`) plus theme hooks and an alter hook.
    Cases are `recipe` (response-graded): they probe documented facts an agent would otherwise read source
    to answer; no site mutation.'
questions:
- id: vf-field-id
  input: On a Drupal 11 site, how do I group several fields of a View inside a fieldset/details box? Name
    the Views field I add.
  criteria: 'Add the Views field with handler id `fieldset` (labeled "Global: Fieldset"), then in the
    Rearrange screen drag other fields underneath it to make them children.'
  bundle: views_fieldsets
  rubric_ref: rubric/views_fieldsets_vf_field_id@1.0
  tags:
  - mode:recipe
- id: vf-wrapper-options
  input: What wrapper types can the Views Fieldsets field render into, and which option controls it?
  criteria: The `wrapper` option chooses one of `details`, `fieldset`, or `div` (default `fieldset`).
  bundle: views_fieldsets
  rubric_ref: rubric/views_fieldsets_vf_wrapper_options@1.0
  tags:
  - mode:recipe
- id: vf-options-list
  input: Which settings does the Fieldset Views field expose, and can the legend use tokens?
  criteria: 'Options: fields (children), wrapper, legend, classes, collapsible, collapsed. The legend
    and classes support Views row tokens like {{ title }}.'
  bundle: views_fieldsets
  rubric_ref: rubric/views_fieldsets_vf_options_list@1.0
  tags:
  - mode:recipe
- id: vf-empty-hidden
  input: In Views Fieldsets, what happens to a group whose child fields are all empty?
  criteria: The wrapper is only output when at least one child has non-empty content (show_fieldset);
    otherwise the fieldset is not rendered.
  bundle: views_fieldsets
  rubric_ref: rubric/views_fieldsets_vf_empty_hidden@1.0
  tags:
  - mode:recipe
- id: vf-wrapper-alter
  input: I want to add a custom wrapper type (e.g. a Bootstrap card) to the Views Fieldsets wrapper dropdown.
    Which hook do I implement?
  criteria: Implement hook_views_fieldsets_wrapper_types_alter(array &$data) to add a key => label entry,
    and provide a matching views_fieldsets_<key> theme hook/template.
  bundle: views_fieldsets
  rubric_ref: rubric/views_fieldsets_vf_wrapper_alter@1.0
  tags:
  - mode:recipe
- id: vf-theme-hooks
  input: Which theme hooks / Twig templates does Views Fieldsets provide for overriding a group's markup?
  criteria: 'Three: views_fieldsets_fieldset, views_fieldsets_details, views_fieldsets_div (templates
    views-fieldsets-fieldset/details/div.html.twig), with per-view/display/field theme suggestions.'
  bundle: views_fieldsets
  rubric_ref: rubric/views_fieldsets_vf_theme_hooks@1.0
  tags:
  - mode:recipe
- id: vf-dependencies
  input: What are Views Fieldsets' module dependencies and does it add a config UI, permissions, or Drush
    commands?
  criteria: It needs only Views (core); no separate config UI route, no permissions, no Drush commands.
    Configuration lives inside each view.
  bundle: views_fieldsets
  rubric_ref: rubric/views_fieldsets_vf_dependencies@1.0
  tags:
  - mode:recipe
