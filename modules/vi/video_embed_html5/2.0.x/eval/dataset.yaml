metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: video_embed_html5
  version: 2.0.x
  note: Video Embed HTML5 adds one video_embed_field provider plugin, html_5, matching URLs ending in
    mp4/ogg/webm and rendering a native <video> via the video_embed_html5 theme. Its only config is video_embed_html5.config
    (add_placeholder bool default true; placeholder file id, default null), form route video_embed_html5.config.form.
    A field is restricted to this provider via the video_embed_field field setting allowed_providers=['html_5'].
    Medium cases read a known add_placeholder value and a known allowed_providers on a created field (field_veh_known).
    Hard cases create a namespaced video_embed field restricted to html_5 (field_veh_video) and toggle
    the placeholder config. Fields are namespaced field_veh_*, and scripts restore add_placeholder=true.
    No drush cr (config/entity reads are live) to avoid an unrelated shared-site group-module cache-rebuild
    fault.
questions:
- id: video_embed_html5-url-types
  input: The video_embed_html5 module adds an HTML5 provider to Video Embed Field. What kind of video
    URLs does that provider recognise?
  criteria: The html_5 provider's getIdFromInput() regex matches any URL ending in mp4, ogg, or webm;
    those direct video links render in a native HTML5 <video> player.
  bundle: video_embed_html5
  rubric_ref: rubric/video_embed_html5_video_embed_html5_url_types@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: video_embed_html5-how-to-use
  input: How do I embed a self-hosted MP4 video on a node using video_embed_html5?
  criteria: Add a Video Embed field (from video_embed_field) to the content type and paste a direct link
    ending in .mp4 (or .ogg/.webm). The html_5 provider handles it automatically and renders a native
    <video> element.
  bundle: video_embed_html5
  rubric_ref: rubric/video_embed_html5_video_embed_html5_how_to_use@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: video_embed_html5-config-keys
  input: What settings does video_embed_html5 expose, in which config object, and what do they control?
  criteria: video_embed_html5.config has add_placeholder (bool, default true) and placeholder (an optional
    uploaded image). They control whether/what placeholder image shows while a client-side (canvas) thumbnail
    is generated when php_ffmpeg is not installed. Set at /admin/config/media/video-embed-html5.
  bundle: video_embed_html5
  rubric_ref: rubric/video_embed_html5_video_embed_html5_config_keys@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: video_embed_html5-placeholder-state
  input: On this Drupal site, the video_embed_html5 placeholder behaviour has been changed from its default.
    Inspect the live configuration and state whether the 'add placeholder' option is currently enabled
    or disabled.
  criteria: add_placeholder is false (disabled) in video_embed_html5.config; the shipped default is true.
  bundle: video_embed_html5
  rubric_ref: rubric/video_embed_html5_video_embed_html5_placeholder_state@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/video_embed_html5-placeholder-state-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/video_embed_html5-placeholder-state-cleanup.sh
- id: video_embed_html5-allowed-provider
  input: The Article content type has a Video Embed field that has been restricted to a single provider.
    Inspect the live field configuration and state which video provider it is limited to.
  criteria: The field_veh_known Video Embed field has allowed_providers set to ['html_5'] (only the HTML5
    provider), in FieldConfig node.article.field_veh_known.
  bundle: video_embed_html5
  rubric_ref: rubric/video_embed_html5_video_embed_html5_allowed_provider@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/video_embed_html5-allowed-provider-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/video_embed_html5-allowed-provider-cleanup.sh
- id: video_embed_html5-add-video-field
  input: On this Drupal site, add a Video Embed field named field_veh_video to the Article content type
    and restrict it so that only the HTML5 provider is allowed. Apply the change to the live site.
  criteria: A video_embed_field field storage node.field_veh_video exists on the article bundle, and its
    FieldConfig allowed_providers setting is ['html_5'].
  bundle: video_embed_html5
  rubric_ref: rubric/video_embed_html5_video_embed_html5_add_video_field@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/video_embed_html5-add-video-field-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/video_embed_html5-add-video-field-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/video_embed_html5-add-video-field-verify.sh
- id: video_embed_html5-disable-placeholder
  input: On this site, turn off the 'add placeholder while generating video thumbnail' option for Video
    Embed HTML5, and apply the change to the live site.
  criteria: video_embed_html5.config add_placeholder is set to false.
  bundle: video_embed_html5
  rubric_ref: rubric/video_embed_html5_video_embed_html5_disable_placeholder@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/video_embed_html5-disable-placeholder-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/video_embed_html5-disable-placeholder-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/video_embed_html5-disable-placeholder-verify.sh
