  - video_embed_html5
  checks:
  - kind: must_contain_any
    values:
    - html_5
    - HTML5
  scoring:
    combine: all_pass
- id: video_embed_html5_video_embed_html5_add_video_field
  version: '1.0'
  applicable_bundles:
  - video_embed_html5
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
- id: video_embed_html5_video_embed_html5_disable_placeholder
  version: '1.0'
  applicable_bundles:
  - video_embed_html5
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
