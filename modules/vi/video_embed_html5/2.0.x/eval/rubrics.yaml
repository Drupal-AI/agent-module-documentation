rubrics:
- id: video_embed_html5_video_embed_html5_url_types
  version: '1.0'
  applicable_bundles:
  - video_embed_html5
  checks:
  - kind: must_contain_any
    values:
    - mp4
    - webm
    - ogg
  scoring:
    combine: all_pass
- id: video_embed_html5_video_embed_html5_how_to_use
  version: '1.0'
  applicable_bundles:
  - video_embed_html5
  checks:
  - kind: must_contain_any
    values:
    - Video Embed
    - video_embed_field
    - HTML5
    - provider
    - mp4
  scoring:
    combine: all_pass
- id: video_embed_html5_video_embed_html5_config_keys
  version: '1.0'
  applicable_bundles:
  - video_embed_html5
  checks:
  - kind: must_contain_any
    values:
    - add_placeholder
    - placeholder
    - video_embed_html5.config
  scoring:
    combine: all_pass
- id: video_embed_html5_video_embed_html5_placeholder_state
  version: '1.0'
  applicable_bundles:
  - video_embed_html5
  checks:
  - kind: must_contain_any
    values:
    - disabled
    - 'false'
    - 'off'
    - not enabled
    - turned off
    - '0'
  scoring:
    combine: all_pass
- id: video_embed_html5_video_embed_html5_allowed_provider
  version: '1.0'
