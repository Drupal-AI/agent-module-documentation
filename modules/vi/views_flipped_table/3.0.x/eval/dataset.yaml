metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: views_flipped_table
  version: 3.0.x
  note: views_flipped_table provides one Views style plugin, flipped_table ('Flipped Table'), extending
    core's Table style. It transposes the table (results become columns, fields become rows) and adds
    one extra option, flipped_table_header_first_field (bool, default TRUE). Theme hook views_view_flipped_table
    / template views-view-flipped-table.html.twig; preprocessor ViewsFlippedTableThemeHooks. In a view
    config it is display.<id>.display_options.style.type = flipped_table with options under style.options
    (all core Table options inherited; row_class options hidden). No settings form (configure=null), no
    permissions, no Drush, no own config schema. Introspection/execution cases build real views (vft_*)
    and read/verify the live view config's style type and the header option.
questions:
- id: views_flipped_table-style-id
  input: In the Drupal views_flipped_table module, what is the machine name (id) of the Views style plugin
    it adds, and which core Views style does it extend?
  criteria: It adds the Views style plugin id 'flipped_table' (title 'Flipped Table'), which extends the
    core Table style (Drupal\views\Plugin\views\style\Table) and transposes rows/columns.
  bundle: views_flipped_table
  rubric_ref: rubric/views_flipped_table_views_flipped_table_style_id@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: views_flipped_table-extra-option
  input: The Flipped Table style from views_flipped_table adds one extra style option on top of the core
    table settings. What is that option's machine name and what does it do?
  criteria: It adds flipped_table_header_first_field (default TRUE, 'Show the first field as the table
    header') - when on, the first field's flipped row is rendered inside <th> header cells.
  bundle: views_flipped_table
  rubric_ref: rubric/views_flipped_table_views_flipped_table_extra_option@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: views_flipped_table-theme
  input: Which theme hook / Twig template does the views_flipped_table Flipped Table style render with,
    and how do I override its markup?
  criteria: Theme hook views_view_flipped_table, template views-view-flipped-table.html.twig (preprocessed
    by ViewsFlippedTableThemeHooks). Override the twig template in your theme to change the markup; no
    CSS is shipped.
  bundle: views_flipped_table
  rubric_ref: rubric/views_flipped_table_views_flipped_table_theme@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: views_flipped_table-known-style
  input: On this Drupal site there is a view with machine name 'vft_demo'. Inspect the live view and tell
    me which Views display style (format) its default display uses.
  criteria: 'vft_demo''s default display uses the flipped_table style: display.default.display_options.style.type
    = flipped_table.'
  bundle: views_flipped_table
  rubric_ref: rubric/views_flipped_table_views_flipped_table_known_style@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/views_flipped_table-known-style-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/views_flipped_table-known-style-cleanup.sh
- id: views_flipped_table-option-value
  input: The view 'vft_probe' on this site uses the Flipped Table style. Inspect its live configuration
    and tell me whether its 'Show the first field as the table header' option (flipped_table_header_first_field)
    is enabled or disabled.
  criteria: vft_probe uses the flipped_table style and its flipped_table_header_first_field option is
    set to false (disabled) in style.options.
  bundle: views_flipped_table
  rubric_ref: rubric/views_flipped_table_views_flipped_table_option_value@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/views_flipped_table-option-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/views_flipped_table-option-cleanup.sh
- id: views_flipped_table-switch-style
  input: On this site the view 'vft_task' currently uses the standard Table format. Change its default
    display to use the views_flipped_table 'Flipped Table' style instead, and save it to the live site.
  criteria: Set display.default.display_options.style.type to 'flipped_table' on view vft_task and save.
    Because flipped_table extends the core Table style, the existing table options remain valid.
  bundle: views_flipped_table
  rubric_ref: rubric/views_flipped_table_views_flipped_table_switch_style@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/views_flipped_table-switch-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/views_flipped_table-switch-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/views_flipped_table-switch-verify.sh
- id: views_flipped_table-header-off
  input: The view 'vft_task2' on this site is a Flipped Table, and right now it is showing the first field
    as a bold header row. Turn that off so the first field is shown like the other rows, and save the
    change.
  criteria: Set style.options.flipped_table_header_first_field to false on vft_task2's flipped_table display
    and save, so the first field renders as normal <td> cells rather than <th> headers.
  bundle: views_flipped_table
  rubric_ref: rubric/views_flipped_table_views_flipped_table_header_off@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: site-owner
    reset: agent-module-documentation/evaluation/verify/views_flipped_table-header-off-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/views_flipped_table-header-off-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/views_flipped_table-header-off-verify.sh
