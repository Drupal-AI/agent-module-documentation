metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: views_bulk_edit
  version: 3.0.x
  note: VBE provides a 'Modify field values' bulk action (a VBO action plus a core Action deriver), controls
    editable fields via the bulk_edit form mode, offers per-field change methods, and defines one permission.
    Cases are `recipe` (response-graded) probing documented facts an agent would otherwise read source
    to answer; no site mutation.
questions:
- id: vbe-vbo-relationship
  input: Does the Drupal Views Bulk Edit module hard-require Views Bulk Operations, and what does VBO
    add if I install it?
  criteria: VBE's info.yml declares no module dependency on VBO (VBO is a composer suggest / test dependency).
    VBE works with core Actions alone, but installing views_bulk_operations adds batching, 'select all
    results', and persistent cross-page selection.
  bundle: views_bulk_edit
  rubric_ref: rubric/views_bulk_edit_vbe_vbo_relationship@1.0
  tags:
  - mode:recipe
- id: vbe-add-action-to-view
  input: How do I make the Views Bulk Edit 'Modify field values' action available on a View using VBO?
  criteria: Add a 'Views bulk operations' (Global) field to the View display, then tick the 'Modify field
    values' action (plugin id views_bulk_edit) in the field settings.
  bundle: views_bulk_edit
  rubric_ref: rubric/views_bulk_edit_vbe_add_action_to_view@1.0
  tags:
  - mode:recipe
- id: vbe-action-ids
  input: What Action plugins does Views Bulk Edit provide and how do they differ?
  criteria: 'Two: ''views_bulk_edit'' (a VBO action extending ViewsBulkOperationsActionBase, type '''')
    and ''entity:edit_action'' (a core Action extending EntityActionBase, derived per fieldable entity
    type, with confirm form at /admin/content/bulk-edit).'
  bundle: views_bulk_edit
  rubric_ref: rubric/views_bulk_edit_vbe_action_ids@1.0
  tags:
  - mode:recipe
- id: vbe-control-fields-form-mode
  input: In Views Bulk Edit, how do I control which fields are available for bulk editing for a given
    content type?
  criteria: Define a form mode with machine name 'bulk_edit' (at /admin/structure/display-modes/form)
    and configure its fields per bundle; the action renders that form-mode display. If none exists, the
    default form display is used.
  bundle: views_bulk_edit
  rubric_ref: rubric/views_bulk_edit_vbe_control_fields_form_mode@1.0
  tags:
  - mode:recipe
- id: vbe-change-methods
  input: When bulk editing a text field vs a multi-value field with Views Bulk Edit, what per-field change
    options are offered?
  criteria: Replace is always offered; 'Append to the current value' is offered for string/text fields;
    'Add a new value' is offered when the field's cardinality is not 1 (multi-value).
  bundle: views_bulk_edit
  rubric_ref: rubric/views_bulk_edit_vbe_change_methods@1.0
  tags:
  - mode:recipe
- id: vbe-revision
  input: Can Views Bulk Edit create a new revision for each entity it bulk-edits, and what happens to
    the revision log?
  criteria: Yes — revisionable (RevisionLogInterface) entities show a 'Create new revision' checkbox and
    a revision log field; if the log is left blank VBE writes an auto message listing the changed fields.
  bundle: views_bulk_edit
  rubric_ref: rubric/views_bulk_edit_vbe_revision@1.0
  tags:
  - mode:recipe
- id: vbe-permission
  input: What permission does Views Bulk Edit define and what does it gate?
  criteria: '''use views bulk edit'' gates the confirm form route (/admin/content/bulk-edit); actions
    are additionally gated per entity by ''update'' access.'
  bundle: views_bulk_edit
  rubric_ref: rubric/views_bulk_edit_vbe_permission@1.0
  tags:
  - mode:recipe
- id: vbe-large-result-sets
  input: In the Views Bulk Edit 'Modify field values' action settings, which preconfiguration option affects
    performance on large result sets and what should I do?
  criteria: The 'Get entity bundles from results' (get_bundles_from_results) checkbox; on large 'all results'
    sets uncheck it and add a bundle filter (node type, vocabulary, etc.) to the view to avoid performance
    problems.
  bundle: views_bulk_edit
  rubric_ref: rubric/views_bulk_edit_vbe_large_result_sets@1.0
  tags:
  - mode:recipe
