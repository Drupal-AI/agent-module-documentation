rubrics:
- id: views_contextual_filters_or_vcfo_setting_name
  version: '1.0'
  applicable_bundles:
  - views_contextual_filters_or
  checks:
  - kind: must_contain_any
    values:
    - Contextual filters OR
    - contextual_filters_or
  scoring:
    combine: all_pass
- id: views_contextual_filters_or_vcfo_how_it_works
  version: '1.0'
  applicable_bundles:
  - views_contextual_filters_or
  checks:
  - kind: must_contain_any
    values:
    - ExtendedSql
    - views_query
    - OR group
    - setWhereGroup
  scoring:
    combine: all_pass
- id: views_contextual_filters_or_vcfo_search_api
  version: '1.0'
  applicable_bundles:
  - views_contextual_filters_or
  checks:
  - kind: must_contain_any
    values:
    - ExtendedSearchApiQuery
    - search_api_query
    - search_api
  scoring:
    combine: all_pass
- id: views_contextual_filters_or_vcfo_inspect_flag
  version: '1.0'
  applicable_bundles:
  - views_contextual_filters_or
  checks:
  - kind: must_contain_any
    values:
    - contextual_filters_or
    - OR
  scoring:
    combine: all_pass
- id: views_contextual_filters_or_vcfo_inspect_arguments
  version: '1.0'
  applicable_bundles:
  - views_contextual_filters_or
  checks:
  - kind: must_contain_any
    values:
    - nid
    - uid
  scoring:
    combine: all_pass
- id: views_contextual_filters_or_vcfo_enable_or_existing
  version: '1.0'
  applicable_bundles:
  - views_contextual_filters_or
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
- id: views_contextual_filters_or_vcfo_build_or_view
  version: '1.0'
  applicable_bundles:
  - views_contextual_filters_or
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
