metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: views_contextual_filters_or
  version: 1.5.x
  note: 'The module''s entire feature surface is one per-display boolean, `contextual_filters_or`, stored
    at display.<id>.display_options.query.options.contextual_filters_or, which flips a Views display''s
    default WHERE group (group 0 — where contextual filters/arguments add conditions) from AND to OR.
    It works by class-overriding the views_query (ExtendedSql) and search_api_query (ExtendedSearchApiQuery)
    plugins and registering the boolean via hook_config_schema_info_alter(). Cases span three tiers: `recipe`
    (easy — response-graded facts about the setting, config path, and swapped plugins); `introspection`
    (medium — a known view with OR configured is installed on the live site and the agent must read it
    back via drush); and `execution` (hard — the agent must build/enable the OR behaviour on a view, verified
    against live config).'
questions:
- id: vcfo-setting-name
  input: In Drupal Views I have a display with several contextual filters (arguments) and I want the view
    to match rows satisfying ANY of them instead of ALL of them. The Views Contextual Filters OR module
    adds one setting for this. What is the setting called, where in the view-edit UI does it appear, and
    what is its config key on the display?
  criteria: 'It adds a checkbox ''Contextual filters OR'' under the display''s Query settings; enabling
    it stores contextual_filters_or: true at display.<id>.display_options.query.options.contextual_filters_or,
    turning the arguments'' default WHERE group from AND into OR.'
  bundle: views_contextual_filters_or
  rubric_ref: rubric/views_contextual_filters_or_vcfo_setting_name@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: vcfo-how-it-works
  input: How does the Views Contextual Filters OR module actually change a view's SQL — which Views query
    plugin class does it swap in, and what does that class change about the WHERE conditions when the
    option is on?
  criteria: 'Via hook_views_plugins_query_alter() it overrides the views_query plugin class with ExtendedSql
    (extends core Sql). Its addWhere()/addWhereExpression()/addHavingExpression() create the default group
    (group 0, where contextual filters add conditions) as an OR group instead of AND when contextual_filters_or
    is enabled ($op = ''OR'' : ''AND''; setWhereGroup($op, $group)).'
  bundle: views_contextual_filters_or
  rubric_ref: rubric/views_contextual_filters_or_vcfo_how_it_works@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: vcfo-search-api
  input: Does Views Contextual Filters OR work with Search API views, and if so how is it wired for them?
  criteria: Yes. When search_api is installed it overrides the search_api_query plugin class with ExtendedSearchApiQuery
    and registers contextual_filters_or on the views.query.search_api_query config schema; in build()
    it merges type => OR into the default group (group 0) so Search API contextual filters OR together.
  bundle: views_contextual_filters_or
  rubric_ref: rubric/views_contextual_filters_or_vcfo_search_api@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: vcfo-inspect-flag
  input: 'This Drupal site (drush available) has a view with machine name `vcfo_eval_known` that uses
    the Views Contextual Filters OR module. Inspect the live site and tell me: are that view''s contextual
    filters combined with OR or with AND, and what is the exact config key that stores this?'
  criteria: The vcfo_eval_known default display has query.options.contextual_filters_or = true (config
    key display.default.display_options.query.options.contextual_filters_or), so its contextual filters
    are OR'd, not AND'd.
  bundle: views_contextual_filters_or
  rubric_ref: rubric/views_contextual_filters_or_vcfo_inspect_flag@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    persona: drupal-expert
    setup: agent-module-documentation/evaluation/verify/views_contextual_filters_or-inspect-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/views_contextual_filters_or-inspect-cleanup.sh
- id: vcfo-inspect-arguments
  input: This Drupal site (drush available) has a view `vcfo_eval_known` whose contextual filters are
    set to OR. Inspect the live site and list which contextual filters (arguments) are defined on its
    default display.
  criteria: 'The default display defines two contextual filters (arguments): nid (node_nid) and uid (numeric),
    read from display.default.display_options.arguments.'
  bundle: views_contextual_filters_or
  rubric_ref: rubric/views_contextual_filters_or_vcfo_inspect_arguments@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    persona: drupal-expert
    setup: agent-module-documentation/evaluation/verify/views_contextual_filters_or-inspect-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/views_contextual_filters_or-inspect-cleanup.sh
- id: vcfo-enable-or-existing
  input: On this Drupal site (drush available) there is a view with machine name `vcfo_eval_toggle` that
    already has two contextual filters, but they currently combine with AND. Using the Views Contextual
    Filters OR module, make that view's contextual filters combine with OR instead. Apply it to the live
    site config; don't just describe it. One-line summary.
  criteria: The vcfo_eval_toggle default display's query.options.contextual_filters_or is set to true
    (its two contextual filters retained), so the module now OR's its contextual filters. Verified against
    live config.
  bundle: views_contextual_filters_or
  rubric_ref: rubric/views_contextual_filters_or_vcfo_enable_or_existing@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/views_contextual_filters_or-enable-or-existing-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/views_contextual_filters_or-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/views_contextual_filters_or-enable-or-existing-verify.sh
- id: vcfo-build-or-view
  input: On this Drupal site (drush available) build a new View with machine name `vcfo_eval_build` on
    the content (node_field_data) base table. Give its default display at least two contextual filters
    (for example node ID and author uid) and, using the Views Contextual Filters OR module, configure
    the display so those contextual filters combine with OR rather than AND. Apply it to the live site
    config; don't just describe it. One-line summary.
  criteria: A view vcfo_eval_build exists whose default display has >=2 contextual filters (arguments)
    and query.options.contextual_filters_or = true, so the module OR's its contextual filters. Verified
    against live config.
  bundle: views_contextual_filters_or
  rubric_ref: rubric/views_contextual_filters_or_vcfo_build_or_view@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/views_contextual_filters_or-build-or-view-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/views_contextual_filters_or-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/views_contextual_filters_or-build-or-view-verify.sh
