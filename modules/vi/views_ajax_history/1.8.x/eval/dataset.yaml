metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: views_ajax_history
  version: 1.8.x
  note: 'Views AJAX History has no settings form; it is configured per view via a Views display extender
    and ships a JS library that hooks Views AJAX into the History API. Cases are `recipe` (response-graded):
    they probe documented facts an agent would otherwise read source for. No site mutation.'
questions:
- id: vah-requires-use-ajax
  input: On a Drupal 11 site, what must already be true about a view before Views AJAX History can push
    filter/pager state to the browser URL, and where do I turn the feature on?
  criteria: The view's 'Use AJAX' option must be enabled; then tick the 'AJAX history' checkbox that appears
    in the Use AJAX dialog under Advanced. hook_views_pre_render only attaches when $view->ajaxEnabled()
    is true.
  bundle: views_ajax_history
  rubric_ref: rubric/views_ajax_history_vah_requires_use_ajax@1.0
  tags:
  - mode:recipe
- id: vah-display-extender
  input: Which kind of Views plugin does Views AJAX History provide to add its per-view options, and what
    is the plugin id?
  criteria: A Views display extender plugin with id 'ajax_history' (class AjaxHistory), registered in
    views.settings display_extenders on install.
  bundle: views_ajax_history
  rubric_ref: rubric/views_ajax_history_vah_display_extender@1.0
  tags:
  - mode:recipe
- id: vah-config-keys
  input: What are the two configuration keys Views AJAX History stores per view display, and what does
    each do?
  criteria: enable_history (boolean) turns history on for the display; exclude_args (text, newline-separated)
    lists query-key prefixes to strip from the pushed URL. Stored under display_extenders.ajax_history
    and schema-defined.
  bundle: views_ajax_history
  rubric_ref: rubric/views_ajax_history_vah_config_keys@1.0
  tags:
  - mode:recipe
- id: vah-back-forward-bookmark
  input: Once enabled, how does Views AJAX History make the browser back/forward buttons and bookmarking
    work for an AJAX view?
  criteria: It calls history.pushState() with a cleaned URL each time a filter/pager changes (so the URL
    is bookmarkable/shareable) and binds a popstate handler (loadView) that re-issues the Views AJAX request
    on back/forward.
  bundle: views_ajax_history
  rubric_ref: rubric/views_ajax_history_vah_back_forward_bookmark@1.0
  tags:
  - mode:recipe
- id: vah-js-library
  input: Which asset library does Views AJAX History attach to an AJAX view, and which core Drupal.Ajax
    methods does its JavaScript override?
  criteria: The views_ajax_history/history library (js/views_ajax_history.js). It overrides Drupal.Ajax.prototype
    beforeSerialize (pager clicks), beforeSubmit (exposed-form submits), and beforeSend (AJAX URL cleanup).
  bundle: views_ajax_history
  rubric_ref: rubric/views_ajax_history_vah_js_library@1.0
  tags:
  - mode:recipe
- id: vah-exclude-args
  input: I want certain query parameters kept out of the URL that Views AJAX History writes to browser
    history. Which per-view option controls this and how are the entries matched?
  criteria: 'The ''Exclude query arguments from the URL'' option (exclude_args): one query key per line,
    each matched with a ''starts with'' comparison and removed from the pushed URL (passed to JS as excludeArgs).'
  bundle: views_ajax_history
  rubric_ref: rubric/views_ajax_history_vah_exclude_args@1.0
  tags:
  - mode:recipe
- id: vah-dependency
  input: What is the only Drupal module dependency of Views AJAX History, and does it add an admin settings
    form or any permissions?
  criteria: It depends only on core Views (drupal:views). It has no site-wide settings form (configure
    is null) and provides no permissions or Drush commands; configuration is per view via the display
    extender.
  bundle: views_ajax_history
  rubric_ref: rubric/views_ajax_history_vah_dependency@1.0
  tags:
  - mode:recipe
- id: vah-page-reset
  input: When a user applies a new exposed filter on an AJAX view with history enabled, what does the
    module do with the pager 'page' parameter in the URL?
  criteria: In beforeSubmit the module removes the 'page' query parameter so a newly applied filter returns
    fresh results from the first page rather than an out-of-range page.
  bundle: views_ajax_history
  rubric_ref: rubric/views_ajax_history_vah_page_reset@1.0
  tags:
  - mode:recipe
