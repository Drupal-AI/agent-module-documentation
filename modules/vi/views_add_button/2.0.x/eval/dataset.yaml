metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: views_add_button
  version: 2.0.x
  note: 'Views Add Button adds a configurable entity ''add'' button to Views. Real surface: two Views
    handlers registered by hook_views_data_alter() on the ''views'' table - area handler views_add_button_area
    (field views_add_button, shown as ''Global: Entity Add Button'') and field handler views_add_button_field.
    Handler options (schema views.area.views_add_button_area / views.field.views_add_button_field) include
    type (''<entity_type>+<bundle>''), button_text, button_classes, query_string, context, destination,
    tokenize, render_plugin, access_plugin. URL/access come from @ViewsAddButton plugins (plugin.manager.views_add_button,
    namespace Plugin/views_add_button) selected by target_entity: built-ins views_add_button_node (node.add),
    _taxonomy, _user, _eck_entity, _default (fallback /{type}/add/{bundle}). No configure route, permissions,
    or Drush; requires views + token. Medium cases read back a seeded view''s add-button options (button_text,
    button_classes); hard cases add the area and field handlers to a base view, verified against the saved
    view config. ENV NOTE: saving a View on this shared site can trigger an unrelated group-module error
    during route rebuild; the save persists and the separate verify script reads correct live state.'
questions:
- id: views_add_button-how-to-add
  input: How do I add an 'add content' button to the top of a Drupal View using the views_add_button module,
    and what is the handler called in the Views UI?
  criteria: 'Add the ''Global: Entity Add Button'' area (handler views_add_button_area) to the view''s
    Header (or Footer), or add the ''Entity Add Button'' field (views_add_button_field). Then choose the
    entity type/bundle and button text. No settings page is needed.'
  bundle: views_add_button
  rubric_ref: rubric/views_add_button_views_add_button_how_to_add@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: views_add_button-options
  input: What can I configure on a views_add_button 'Entity Add Button', and can the options use tokens?
  criteria: You configure the target entity type/bundle (type as '<entity_type>+<bundle>'), button text,
    button classes (to style the <a> as a button), a query string, an entity context, prefix/suffix/access-denied
    HTML, a destination toggle, and tokenize. Every option except the Entity Type supports tokens; tokenize
    pulls values from the first result row.
  bundle: views_add_button
  rubric_ref: rubric/views_add_button_views_add_button_options@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: views_add_button-plugin-urls
  input: How does views_add_button work out the correct 'add' URL and create-access for different entity
    types, and how would I support a custom entity?
  criteria: 'It uses @ViewsAddButton plugins selected by target_entity: built-ins for node (node.add route),
    taxonomy_term, user, ECK, and a Default plugin that assumes /{entity_type}/add/{bundle}. To support
    a custom entity, add your own @ViewsAddButton plugin implementing generateUrl()/checkAccess() (or
    set render_plugin/access_plugin on the handler).'
  bundle: views_add_button
  rubric_ref: rubric/views_add_button_views_add_button_plugin_urls@1.0
  tags:
  - mode:recipe
  - difficulty:easy
