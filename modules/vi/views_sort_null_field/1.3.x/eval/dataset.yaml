    cleanup: agent-module-documentation/evaluation/verify/views_sort_null_field-known-cleanup.sh
- id: views_sort_null_field-known-order
  input: The View 'vsnf_known' on this site has a views_sort_null_field null sort configured on its integer
    field. Inspect the running site and say whether empty (NULL) values are sorted to the TOP or the BOTTOM
    of the results, based on that sort's configured order.
  criteria: The null_sort is configured with order DESC, which is 'Sort NULL first' — empty values go
    to the TOP of the results.
  bundle: views_sort_null_field
  rubric_ref: rubric/views_sort_null_field_views_sort_null_field_known_order@1.0
  tags:
