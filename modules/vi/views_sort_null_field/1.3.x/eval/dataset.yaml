- id: views_sort_null_field-add-null-last
  input: This site has a View 'vsnf_task' listing Article nodes, sorted ascending by the integer field
    field_vsnf_task, but nodes with an empty value currently appear first. Using views_sort_null_field,
    add a null sort to the default display so that empty (NULL) values are ordered LAST, and save the
    view.
  criteria: Add a sort with plugin_id null_sort on field_vsnf_task_value_null_sort (table node__field_vsnf_task)
    to the default display of view vsnf_task with order ASC (NULL last), and save. The verify checks the
    saved view's default display has a null_sort sort with order ASC.
  bundle: views_sort_null_field
