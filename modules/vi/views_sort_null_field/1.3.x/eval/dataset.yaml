metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: views_sort_null_field
  version: 1.3.x
  note: 'Views Sort Null Field registers one Views sort plugin, null_sort (@ViewsSort), and via hook_field_views_data_alter()
    exposes a <column>_null_sort sort for each nullable field column (e.g. field_foo_value_null_sort on
    node__field_foo). The handler adds ORDER BY ''<table>.<column> IS NULL'': ASC = NULLs last, DESC =
    NULLs first. No config UI, permissions or schema. Medium cases create a real nullable integer field
    on Article plus a view whose sorts include a null_sort, and the agent introspects the stored view
    config. Hard cases give the agent a view that has a plain field sort but no null_sort and require
    adding a null_sort with the correct order, verified against the saved view entity.'
questions:
- id: views_sort_null_field-empty-last
  input: In a Drupal View I sort nodes ascending by an optional integer field, but rows with no value
    show up at the top. Using the views_sort_null_field module, how do I make the empty ones appear at
    the bottom instead?
  criteria: Add the field's 'null sort' handler (the Sort criteria list shows '<Label> null sort', plugin
    null_sort) and set it to ASC ('Sort NULL last'), then keep your normal field sort after it. ASC orders
    by '<table>.<column> IS NULL' so populated rows (0) come before empty rows (1).
  bundle: views_sort_null_field
  rubric_ref: rubric/views_sort_null_field_views_sort_null_field_empty_last@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: views_sort_null_field-plugin-id
  input: What is the machine name of the Views sort plugin that views_sort_null_field provides, and how
    does its sort handler appear in the Views data for a field like field_weight?
  criteria: The plugin id is null_sort (class NullSort, @ViewsSort("null_sort")). hook_field_views_data_alter()
    adds a '<column>_null_sort' sort to each nullable column, e.g. field_weight_value_null_sort on table
    node__field_weight.
  bundle: views_sort_null_field
  rubric_ref: rubric/views_sort_null_field_views_sort_null_field_plugin_id@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: views_sort_null_field-asc-desc
  input: For the views_sort_null_field 'null sort' handler, what is the difference between sorting ASC
    and DESC?
  criteria: ASC ('Sort NULL last') puts empty/NULL rows at the bottom; DESC ('Sort NULL first') puts them
    at the top. It orders by the expression '<table>.<column> IS NULL' which is 1 for empty rows and 0
    for populated rows.
  bundle: views_sort_null_field
  rubric_ref: rubric/views_sort_null_field_views_sort_null_field_asc_desc@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: views_sort_null_field-known-plugin
