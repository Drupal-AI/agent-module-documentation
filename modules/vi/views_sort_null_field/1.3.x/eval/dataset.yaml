    sort criterion.
  criteria: The view vsnf_known has a sort on field_vsnf_known_value_null_sort whose plugin_id is null_sort
    (table node__field_vsnf_known).
  bundle: views_sort_null_field
  rubric_ref: rubric/views_sort_null_field_views_sort_null_field_known_plugin@1.0
  tags:
  - mode:introspection
  - difficulty:medium
