    site.
  criteria: 'views.view.vmcf_task''s default display has an argument whose plugin_id is menu_children,
    table node, field menu_children_filter (e.g. via the Views UI ''Add contextual filter'' -> ''Content:
    Menu children'', or by saving a View config entity with a matching arguments entry).'
  bundle: views_menu_children_filter
  rubric_ref: rubric/views_menu_children_filter_views_menu_children_filter_build_argument@1.0
