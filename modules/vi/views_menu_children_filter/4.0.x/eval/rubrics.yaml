rubrics:
- id: views_menu_children_filter_views_menu_children_filter_plugin_ids
  version: '1.0'
  applicable_bundles:
  - views_menu_children_filter
  checks:
  - kind: must_contain_any
    values:
    - menu_children
    - 'plugin_id: menu_children'
    - '"menu_children"'
  scoring:
    combine: all_pass
- id: views_menu_children_filter_views_menu_children_filter_purpose
  version: '1.0'
  applicable_bundles:
  - views_menu_children_filter
  checks:
  - kind: must_contain_any
    values:
    - menu children
    - child nodes
    - children of a node
    - child menu items
  scoring:
    combine: all_pass
- id: views_menu_children_filter_views_menu_children_filter_join
  version: '1.0'
  applicable_bundles:
  - views_menu_children_filter
  checks:
  - kind: must_contain_any
    values:
    - menu_link_content_data
    - entity:node/
    - link__uri
  scoring:
    combine: all_pass
- id: views_menu_children_filter_views_menu_children_filter_argument_config
  version: '1.0'
  applicable_bundles:
  - views_menu_children_filter
  checks:
  - kind: must_contain_any
    values:
    - menu_children_filter
    - argument
    - contextual filter
  scoring:
    combine: all_pass
- id: views_menu_children_filter_views_menu_children_filter_sort_config
  version: '1.0'
  applicable_bundles:
  - views_menu_children_filter
  checks:
  - kind: must_contain_any
    values:
    - menu_children_sort
    - sort
  scoring:
    combine: all_pass
- id: views_menu_children_filter_views_menu_children_filter_build_argument
  version: '1.0'
  applicable_bundles:
  - views_menu_children_filter
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
- id: views_menu_children_filter_views_menu_children_filter_build_sort
  version: '1.0'
  applicable_bundles:
  - views_menu_children_filter
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
