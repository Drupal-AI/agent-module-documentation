rubrics:
- id: symfony_mailer_log_sml_settings_keys
  version: '1.0'
  applicable_bundles:
  - symfony_mailer_log
  checks:
  - kind: must_contain_any
    values:
    - symfony_mailer_log.settings
    - log_expiry
    - max_age
  scoring:
    combine: all_pass
- id: symfony_mailer_log_sml_how_to_log
  version: '1.0'
  applicable_bundles:
  - symfony_mailer_log
  checks:
  - kind: must_contain_any
    values:
    - Log email
    - adjuster
    - policy
    - mailer policy
    - EmailAdjuster
  scoring:
    combine: all_pass
- id: symfony_mailer_log_sml_entity_and_report
  version: '1.0'
  applicable_bundles:
  - symfony_mailer_log
  checks:
  - kind: must_contain_any
    values:
    - symfony_mailer_log
    - /admin/reports/symfony_mailer_log
    - view symfony mailer log entries
  scoring:
    combine: all_pass
- id: symfony_mailer_log_sml_known_maxage
  version: '1.0'
  applicable_bundles:
  - symfony_mailer_log
  checks:
  - kind: must_contain_any
    values:
    - P2W
  scoring:
    combine: all_pass
- id: symfony_mailer_log_sml_known_entry
  version: '1.0'
  applicable_bundles:
  - symfony_mailer_log
  checks:
  - kind: must_contain_any
    values:
    - SMLOG Known Subject 7F3
  scoring:
    combine: all_pass
- id: symfony_mailer_log_sml_enable_logging
  version: '1.0'
  applicable_bundles:
  - symfony_mailer_log
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
- id: symfony_mailer_log_sml_purge_policy
  version: '1.0'
  applicable_bundles:
  - symfony_mailer_log
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
