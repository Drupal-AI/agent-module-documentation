metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: element_class_formatter_responsive_image
  version: 2.1.x
  note: 'Submodule of element_class_formatter. Adds one field formatter, responsive_image_class (''Responsive
    image (with class)''), for image fields: it extends core ResponsiveImageFormatter and mixes in ElementEntityClassTrait
    to add an ''Element class'' setting applied to the image element (#item_attributes). Requires element_class_formatter
    + core responsive_image. No settings page, no configure route, no permissions, no Drush. Settings
    stored in core.entity_view_display.<entity>.<bundle>.<mode> -> content.<field>.type = responsive_image_class
    + settings.class; schema field.formatter.settings.responsive_image_class. Medium/hard cases are grounded
    in that display config: introspection reads the configured formatter/class on an image field; execution
    switches an image field to responsive_image_class with a given class, verified against the live entity_view_display.'
questions:
- id: ecf_responsive_image-formatter
  input: How do I add a CSS class to a Responsive Image field's element in Drupal, and what is the formatter
    id provided by element_class_formatter_responsive_image?
  criteria: Use the 'Responsive image (with class)' formatter (id responsive_image_class) on the image
    field's Manage display row; it works like the core Responsive Image formatter plus an 'Element class'
    field applied to the image element.
  bundle: element_class_formatter_responsive_image
  rubric_ref: rubric/element_class_formatter_responsive_image_ecf_responsive_image_formatter@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: ecf_responsive_image-fieldtype
  input: Which field type does the responsive_image_class formatter apply to, and what modules does it
    require?
  criteria: It applies to image fields and requires element_class_formatter plus core's responsive_image
    module. It extends core's ResponsiveImageFormatter.
  bundle: element_class_formatter_responsive_image
  rubric_ref: rubric/element_class_formatter_responsive_image_ecf_responsive_image_fieldtype@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: ecf_responsive_image-stored
  input: Where is the class set on a responsive image (via element_class_formatter_responsive_image) stored
    in configuration?
  criteria: 'In the field''s component of core.entity_view_display.<entity>.<bundle>.<mode>: type = responsive_image_class
    and settings.class = the space-separated classes (schema field.formatter.settings.responsive_image_class).'
  bundle: element_class_formatter_responsive_image
  rubric_ref: rubric/element_class_formatter_responsive_image_ecf_responsive_image_stored@1.0
  tags:
  - mode:recipe
  - difficulty:easy
