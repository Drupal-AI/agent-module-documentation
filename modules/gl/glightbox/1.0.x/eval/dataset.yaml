metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: glightbox
  version: 1.0.x
  note: 'GLightbox integrates the pure-JS GLightbox library. Global config object glightbox.settings (groups
    custom/advanced/plyr) is edited at /admin/config/media/glightbox (route glightbox.admin_settings).
    Two image field formatters: glightbox and glightbox_responsive. ?glightbox=no disables it (glightbox.activation_check).
    Depends on core image; needs the GLightbox/Plyr/DOM Purify JS libs in /libraries. hook_glightbox_settings_alter
    overrides JS options. Medium/hard cases are grounded in the real glightbox.settings config (custom.width)
    and a namespaced image field (field_glb_img) using the glightbox formatter.'
questions:
- id: glightbox-config-route
  input: Where do I configure the global GLightbox settings on a Drupal 11 site, and what config object
    stores them?
  criteria: 'The settings form is at /admin/config/media/glightbox (route glightbox.admin_settings, permission
    ''administer site configuration''); it writes the glightbox.settings config object (groups: custom,
    advanced, plyr).'
  bundle: glightbox
  rubric_ref: rubric/glightbox_glightbox_config_route@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: glightbox-formatters
  input: Which field formatters does the GLightbox module provide to make images open in a lightbox, and
    what field type are they for?
  criteria: 'It provides two image field formatters: ''glightbox'' (opens the image in a GLightbox popup)
    and ''glightbox_responsive'' (same, using a responsive image style). Both apply to image fields and
    are set on Manage display.'
  bundle: glightbox
  rubric_ref: rubric/glightbox_glightbox_formatters@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: glightbox-disable-per-request
  input: Is there a quick way to load a GLightbox-enabled page without the lightbox behavior wiring up,
    for debugging? What external libraries does GLightbox require?
  criteria: Append ?glightbox=no to the URL; the glightbox.activation_check service then returns inactive
    so the lightbox isn't attached. GLightbox requires the GLightbox JS library (plus DOM Purify, and
    Plyr for video) installed under /libraries, and core's Image module.
  bundle: glightbox
  rubric_ref: rubric/glightbox_glightbox_disable_per_request@1.0
  tags:
  - mode:recipe
  - difficulty:easy
