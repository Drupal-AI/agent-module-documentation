metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: glightbox_inline
  version: 1.0.x
  note: GLightbox Inline (submodule of glightbox) opens on-page elements, pages, videos, or images in
    a GLightbox popup when a link has the class 'glightbox-inline'. href = a CSS selector (#id), a path/URL
    (/node/42, https://...), or a media URL; optional data-glightbox sets modal size. It attaches its
    library on every page via hook_page_attachments; no config, permissions, or Drush. Medium/hard cases
    are grounded in the class contract (content whose body uses a glightbox-inline link) and the module's
    enabled state.
questions:
- id: glightbox_inline-open-element
  input: With the glightbox_inline module enabled, how do I make a link open an element that is already
    on the page (e.g. a hidden div with id 'signup') inside a GLightbox popup?
  criteria: Add the class 'glightbox-inline' to the link and set its href to the element's selector, e.g.
    <a class="glightbox-inline" href="#signup">Open</a>. GLightbox opens the first element matching that
    selector in the modal.
  bundle: glightbox_inline
  rubric_ref: rubric/glightbox_inline_glightbox_inline_open_element@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: glightbox_inline-open-page
  input: Using glightbox_inline, how do I open a whole page (like /node/42) or a video URL inside the
    lightbox instead of an on-page element? How do I control the popup size?
  criteria: 'Give the glightbox-inline link an href that is a path or URL (e.g. href="/node/42", or a
    YouTube/MP4 URL) and it loads that page/video in the modal (content can also load via AJAX). Control
    the modal size with data-glightbox, e.g. data-glightbox="width: 700; height: auto".'
  bundle: glightbox_inline
  rubric_ref: rubric/glightbox_inline_glightbox_inline_open_page@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: glightbox_inline-dependency
  input: What does the glightbox_inline module require to work, and does it have any configuration options?
  criteria: It requires the main GLightbox module (which needs the GLightbox JS library in /libraries).
    It has no configuration, permissions, or Drush; enabling it and adding the glightbox-inline class
    is the whole setup. It attaches its library on every page via hook_page_attachments.
  bundle: glightbox_inline
  rubric_ref: rubric/glightbox_inline_glightbox_inline_dependency@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: glightbox_inline-find-class
  input: On this Drupal site there is a published Article whose body uses glightbox_inline to open on-page
    content in a popup. Inspect the content and state the CSS class that triggers the inline GLightbox.
  criteria: 'The trigger class is glightbox-inline. The Article ''glb inline demo'' body contains <a class="glightbox-inline"
    href="#glb-target">, which opens the on-page #glb-target element in the lightbox.'
  bundle: glightbox_inline
  rubric_ref: rubric/glightbox_inline_glightbox_inline_find_class@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/glightbox_inline-content-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/glightbox_inline-content-cleanup.sh
