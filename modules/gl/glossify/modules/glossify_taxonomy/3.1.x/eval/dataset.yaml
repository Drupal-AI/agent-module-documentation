metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: glossify_taxonomy
  version: 3.1.x
  note: 'Glossify Taxonomy provides the glossify_taxonomy text-format filter (''Glossify: Tooltips with
    taxonomy''), a GlossifyBase subclass that turns published taxonomy term names into links/tooltips
    (tooltip text = term description__value). Settings (prefixed glossify_taxonomy_*): case_sensitivity,
    first_only (default TRUE), ignore_tags, type (tooltips|links|tooltips_links), tooltip_truncate, vocabs
    (source vocabularies, ;-joined, required when enabled), urlpattern (default /taxonomy/term/[id]),
    synonyms_field. Query tag glossify_taxonomy_tooltip; also fires a glossify_taxonomy_vocabs alter.
    Config lives in filter.format.<format> -> filters.glossify_taxonomy.settings. Medium cases read a
    configured filter (vocab/type, urlpattern); hard cases enable it as tooltips and as links (urlpattern
    /glossary/[id]) sourcing the ''tags'' vocabulary. Config-based verification (drush rendering hits
    a core theme-registry limit on this shared site). Fixtures create/tear down their own gl_tax_* text
    formats.'
questions:
- id: glossify_taxonomy-what-filter
  input: What does the glossify_taxonomy filter do, where does its tooltip text come from, and where do
    you enable it?
  criteria: 'The ''Glossify: Tooltips with taxonomy'' filter (id glossify_taxonomy) turns published taxonomy
    term names of the selected vocabularies into links to their term pages and/or hover tooltips whose
    text is the term description. Enable it on a text format at /admin/config/content/formats.'
  bundle: glossify_taxonomy
  rubric_ref: rubric/glossify_taxonomy_glossify_taxonomy_what_filter@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: glossify_taxonomy-required-and-default
  input: For the glossify_taxonomy filter, which setting is required when enabling it and what is the
    default URL pattern for links?
  criteria: You must select at least one source vocabulary (glossify_taxonomy_vocabs) - required when
    enabled. The default URL pattern is /taxonomy/term/[id].
  bundle: glossify_taxonomy
  rubric_ref: rubric/glossify_taxonomy_glossify_taxonomy_required_and_default@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: glossify_taxonomy-vocabs-alter
  input: Which hooks let other modules change which taxonomy terms/vocabularies the glossify_taxonomy
    filter uses as its source?
  criteria: The term-source query is tagged glossify_taxonomy_tooltip (alter with hook_query_glossify_taxonomy_tooltip_alter()),
    and before querying the filter runs a glossify_taxonomy_vocabs alter (hook_glossify_taxonomy_vocabs_alter())
    so modules can change the vocabulary list.
  bundle: glossify_taxonomy
  rubric_ref: rubric/glossify_taxonomy_glossify_taxonomy_vocabs_alter@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: glossify_taxonomy-known-vocab
  input: The text format 'gl_tax_known' has the glossify_taxonomy filter enabled. Inspect its configuration
    and report which vocabulary is used as the term source and whether matches are shown as tooltips or
    links.
  criteria: The glossify_taxonomy filter on gl_tax_known has glossify_taxonomy_vocabs = 'tags' and glossify_taxonomy_type
    = 'tooltips'.
  bundle: glossify_taxonomy
  rubric_ref: rubric/glossify_taxonomy_glossify_taxonomy_known_vocab@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/glossify_taxonomy-known-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/glossify_taxonomy-known-cleanup.sh
- id: glossify_taxonomy-known-url
  input: The text format 'gl_tax_url' has the glossify_taxonomy filter enabled. Inspect it and report
    the URL pattern it links matched terms to and whether matching is case sensitive.
  criteria: The glossify_taxonomy filter on gl_tax_url has glossify_taxonomy_urlpattern = '/gl-term/[id]',
    type = 'links', and glossify_taxonomy_case_sensitivity = false (case-insensitive).
  bundle: glossify_taxonomy
  rubric_ref: rubric/glossify_taxonomy_glossify_taxonomy_known_url@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/glossify_taxonomy-url-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/glossify_taxonomy-url-cleanup.sh
- id: glossify_taxonomy-enable-tooltips
  input: On this site there is a text format 'gl_tax_build'. Using the glossify_taxonomy module, configure
    it so that taxonomy terms from the 'tags' vocabulary become hover tooltips in text using this format.
    Apply the change to the live site.
  criteria: Enable the glossify_taxonomy filter on filter.format.gl_tax_build with glossify_taxonomy_type
    = 'tooltips' and glossify_taxonomy_vocabs including 'tags'.
  bundle: glossify_taxonomy
  rubric_ref: rubric/glossify_taxonomy_glossify_taxonomy_enable_tooltips@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/glossify_taxonomy-tooltip-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/glossify_taxonomy-tooltip-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/glossify_taxonomy-tooltip-verify.sh
- id: glossify_taxonomy-enable-links
  input: On this site there is a text format 'gl_tax_link_build'. Using glossify_taxonomy, configure it
    so that taxonomy terms from the 'tags' vocabulary become links using the URL pattern /glossary/[id].
    Apply the change to the live site.
  criteria: Enable glossify_taxonomy on filter.format.gl_tax_link_build with glossify_taxonomy_type =
    'links' (or tooltips_links), glossify_taxonomy_vocabs including 'tags', and glossify_taxonomy_urlpattern
    = '/glossary/[id]'.
  bundle: glossify_taxonomy
  rubric_ref: rubric/glossify_taxonomy_glossify_taxonomy_enable_links@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/glossify_taxonomy-link-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/glossify_taxonomy-link-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/glossify_taxonomy-link-verify.sh
