rubrics:
- id: glossify_commerce_glossify_commerce_what_filter
  version: '1.0'
  applicable_bundles:
  - glossify_commerce
  checks:
  - kind: must_contain_any
    values:
    - glossify_commerce_product
    - 'Glossify: Tooltips with commerce product'
    - product
    - Commerce
  scoring:
    combine: all_pass
- id: glossify_commerce_glossify_commerce_settings_keys
  version: '1.0'
  applicable_bundles:
  - glossify_commerce
  checks:
  - kind: must_contain_any
    values:
    - bundles
    - urlpattern
    - /product/[id]
  scoring:
    combine: all_pass
- id: glossify_commerce_glossify_commerce_query_tag
  version: '1.0'
  applicable_bundles:
  - glossify_commerce
  checks:
  - kind: must_contain_any
    values:
    - glossify_commerce_product_tooltip
    - hook_query
  scoring:
    combine: all_pass
- id: glossify_commerce_glossify_commerce_known_config
  version: '1.0'
  applicable_bundles:
  - glossify_commerce
  checks:
  - kind: must_contain_any
    values:
    - default
    - /shop/[id]
  scoring:
    combine: all_pass
- id: glossify_commerce_glossify_commerce_enable_links
  version: '1.0'
  applicable_bundles:
  - glossify_commerce
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
