metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: glossify_commerce
  version: 3.1.x
  note: 'Glossify Commerce provides the glossify_commerce_product text-format filter (''Glossify: Tooltips
    with commerce product''), a GlossifyBase subclass that turns published Commerce product titles into
    links/tooltips (tooltip text = product body). Requires Drupal Commerce (commerce_product). Its settings
    keys are UN-prefixed: case_sensitivity, first_only, ignore_tags, glossify_type (tooltips|links|tooltips_links),
    tooltip_truncate, bundles (source product types, ;-joined, required when enabled), urlpattern (default
    /product/[id]), synonyms_field. Query tag glossify_commerce_product_tooltip. Config lives in filter.format.<format>
    -> filters.glossify_commerce_product.settings. Trivial-submodule tiers (3 easy / 1 medium / 1 hard),
    config-based (no product fixtures needed - the site has no commerce store, and drush rendering hits
    a core theme-registry limit on this shared site). Fixtures create/tear down their own gl_com_* text
    formats and reference the existing ''default'' product type.'
questions:
- id: glossify_commerce-what-filter
  input: What does the glossify_commerce module add, what does it auto-link, and what does it require?
  criteria: 'It adds the ''Glossify: Tooltips with commerce product'' filter (id glossify_commerce_product),
    which turns published Commerce product titles of selected product types into links to those products
    and/or tooltips (from the product body). It requires Drupal Commerce (commerce_product).'
  bundle: glossify_commerce
  rubric_ref: rubric/glossify_commerce_glossify_commerce_what_filter@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: glossify_commerce-settings-keys
  input: The glossify_commerce filter's setting keys differ from the node/taxonomy Glossify filters. Which
    setting selects the source product types, and what is the default URL pattern?
  criteria: 'Unlike the node/taxonomy filters, glossify_commerce''s keys are un-prefixed: ''bundles''
    selects the source product types (required when enabled) and ''urlpattern'' defaults to /product/[id].
    (Others: case_sensitivity, first_only, glossify_type, tooltip_truncate, synonyms_field.)'
  bundle: glossify_commerce
  rubric_ref: rubric/glossify_commerce_glossify_commerce_settings_keys@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: glossify_commerce-query-tag
  input: Which query tag does the glossify_commerce filter add so other modules can alter which products
    are used as the term source?
  criteria: The product-source query is tagged glossify_commerce_product_tooltip, alterable via hook_query_glossify_commerce_product_tooltip_alter().
  bundle: glossify_commerce
  rubric_ref: rubric/glossify_commerce_glossify_commerce_query_tag@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: glossify_commerce-known-config
  input: The text format 'gl_com_known' has the glossify_commerce_product filter enabled. Inspect its
    configuration and report which product type is the source and the URL pattern the links use.
  criteria: The glossify_commerce_product filter on gl_com_known has bundles = 'default' and urlpattern
    = '/shop/[id]' (glossify_type links). Read via drush cget filter.format.gl_com_known filters.glossify_commerce_product.
  bundle: glossify_commerce
  rubric_ref: rubric/glossify_commerce_glossify_commerce_known_config@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/glossify_commerce-known-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/glossify_commerce-known-cleanup.sh
- id: glossify_commerce-enable-links
  input: On this site there is a text format 'gl_com_build'. Using the glossify_commerce module, configure
    it so that titles of 'default' Commerce products are automatically turned into links to those products
    in text using this format. Apply the change to the live site.
  criteria: Enable the glossify_commerce_product filter on filter.format.gl_com_build with glossify_type
    = 'links' (or tooltips_links) and bundles including 'default' (default urlpattern /product/[id]).
  bundle: glossify_commerce
  rubric_ref: rubric/glossify_commerce_glossify_commerce_enable_links@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/glossify_commerce-build-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/glossify_commerce-build-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/glossify_commerce-build-verify.sh
