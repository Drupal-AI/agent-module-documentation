metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: glossify_node
  version: 3.1.x
  note: 'Glossify Node provides the glossify_node text-format filter (''Glossify: Tooltips with nodes''),
    a GlossifyBase subclass that turns published node titles into links/tooltips (tooltip text = node
    body). Settings (prefixed glossify_node_*): case_sensitivity, first_only, ignore_tags, type (tooltips|links|tooltips_links),
    tooltip_truncate, bundles (source content types, ;-joined, required when enabled), urlpattern (default
    /node/[id]), synonyms_field. Query tag glossify_node_tooltip. Config lives in filter.format.<format>
    -> filters.glossify_node.settings. Trivial-submodule tiers (3 easy / 1 medium / 1 hard). Medium reads
    a configured glossify_node filter (which content type + urlpattern); hard enables the filter on a
    namespaced format to link Article titles. Config-based (no rendering, since drush render hits a core
    theme-registry limit on this shared site). Fixtures create/tear down their own gl_node_* text formats.'
questions:
- id: glossify_node-what-filter
  input: Which text-format filter does the glossify_node module add, what does it auto-link, and where
    do you enable it?
  criteria: 'It adds the ''Glossify: Tooltips with nodes'' filter (id glossify_node), which turns published
    node titles of the selected content types into links to those nodes and/or hover tooltips (from the
    node body). Enable it on a text format at /admin/config/content/formats.'
  bundle: glossify_node
  rubric_ref: rubric/glossify_node_glossify_node_what_filter@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: glossify_node-required-setting
  input: When enabling the glossify_node filter, which setting is required, and what is the default URL
    pattern used for the generated links?
  criteria: You must select at least one source content type (glossify_node_bundles) - it is required
    when the filter is enabled. The default URL pattern is /node/[id], where [id] is replaced by the node
    id.
  bundle: glossify_node
  rubric_ref: rubric/glossify_node_glossify_node_required_setting@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: glossify_node-tooltip-source
  input: In the glossify_node filter, where does the tooltip text come from, and how can other modules
    exclude certain nodes from the term source?
  criteria: The tooltip text is the node's body field (node__body). The term-source query is tagged glossify_node_tooltip,
    so other modules can alter/exclude nodes via hook_query_glossify_node_tooltip_alter().
  bundle: glossify_node
  rubric_ref: rubric/glossify_node_glossify_node_tooltip_source@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: glossify_node-known-config
  input: The text format 'gl_node_known' has the glossify_node filter enabled. Inspect its configuration
    and report which content type is used as the source of titles and the URL pattern the links use.
  criteria: The glossify_node filter on gl_node_known has glossify_node_bundles = 'article' and glossify_node_urlpattern
    = '/wiki/[id]' (type links). Read via drush cget filter.format.gl_node_known filters.glossify_node.
  bundle: glossify_node
  rubric_ref: rubric/glossify_node_glossify_node_known_config@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/glossify_node-known-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/glossify_node-known-cleanup.sh
- id: glossify_node-enable-links
  input: On this site there is a text format 'gl_node_build'. Using the glossify_node module, configure
    it so that titles of Article content are automatically turned into links to those articles in text
    using this format. Apply the change to the live site.
  criteria: Enable the glossify_node filter on filter.format.gl_node_build with glossify_node_type = 'links'
    (or tooltips_links) and glossify_node_bundles including 'article'.
  bundle: glossify_node
  rubric_ref: rubric/glossify_node_glossify_node_enable_links@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/glossify_node-build-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/glossify_node-build-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/glossify_node-build-verify.sh
