metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: glossify
  version: 3.1.x
  note: 'Glossify is an API/base module: the abstract GlossifyBase filter plugin (parseTooltipMatch engine)
    plus two theme hooks (glossify_link -> <a class="glossify-tooltip-link">, glossify_tooltip -> <abbr
    tabindex="0" class="glossify-tooltip-tip">) and templates. It has no filter of its own; you enable
    a submodule (glossify_node/glossify_taxonomy/glossify_commerce) filter on a text format. Shared engine
    features: display type tooltips|links|tooltips_links, urlpattern with an [id] token, first-only matching,
    case sensitivity, ignore_tags, tooltip truncation to 300 chars, synonyms from a chosen plain-text
    field, and skipping any element with class glossify-exclude and existing <a>/<abbr>. Filter settings
    live in the text-format config entity (filter.format.<format> -> filters.<id>.settings). NOTE: rendered-output
    evals are avoided because on this shared site rendering a themed element via drush hits a core theme-registry
    PCRE ''regular expression is too large'' error (too many modules); the medium/hard cases below exercise
    the engine''s shared settings through the glossify_taxonomy filter and are graded on real config (introspection
    reads it, execution writes it), which is what actually configures the engine. Fixtures create/tear
    down their own namespaced gl_p_* text formats.'
questions:
- id: glossify-output-markup
  input: When a Glossify filter matches a term, what HTML does it output in 'tooltips' mode versus 'links'
    mode, and what CSS classes does it use?
  criteria: Tooltips mode wraps the term in <abbr tabindex="0" class="glossify-tooltip-tip" title="...">
    (theme glossify_tooltip). Links mode wraps it in <a class="glossify-tooltip-link" href="..."> (theme
    glossify_link); tooltips_links adds a title to the link.
  bundle: glossify
  rubric_ref: rubric/glossify_glossify_output_markup@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: glossify-exclude
  input: Using Glossify, how can an editor stop a particular occurrence of a term in the text from being
    turned into a link or tooltip, without disabling the filter?
  criteria: Wrap the text in an element with the class glossify-exclude (e.g. <span class="glossify-exclude">Term</span>).
    The parseTooltipMatch engine skips any node inside an element with that class (and also skips existing
    <a>/<abbr> and any configured ignore_tags).
  bundle: glossify
  rubric_ref: rubric/glossify_glossify_exclude@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: glossify-architecture
  input: The Glossify module by itself doesn't glossify anything. How do you actually use it, and what
    does its GlossifyBase class provide to the pieces that do?
  criteria: Glossify provides the abstract GlossifyBase filter (the matching engine parseTooltipMatch,
    synonyms, first-only, case sensitivity, exclude/ignore handling) plus theme hooks. You enable one
    of its submodules' filters - glossify_node, glossify_taxonomy, or glossify_commerce - on a text format;
    each subclasses GlossifyBase and supplies its term source.
  bundle: glossify
  rubric_ref: rubric/glossify_glossify_architecture@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: glossify-known-format
  input: A text format 'gl_p_known' on this site has a Glossify filter enabled. Inspect its configuration
    and report which display type it uses (tooltips, links, or both) and the URL pattern it links matched
    terms to.
  criteria: The gl_p_known format has the glossify_taxonomy filter enabled with type 'tooltips_links'
    and urlpattern '/gloss/[id]'. Read via drush cget filter.format.gl_p_known filters.glossify_taxonomy.
  bundle: glossify
  rubric_ref: rubric/glossify_glossify_known_format@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/glossify-parent-known-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/glossify-parent-known-cleanup.sh
- id: glossify-ignore-tags
  input: The text format 'gl_p_ignore' has a Glossify filter. Inspect it and list which HTML tags the
    filter is configured to ignore (skip when glossifying).
  criteria: The glossify_taxonomy filter on gl_p_ignore has ignore_tags 'h1,h2,gl_marker' - matches inside
    those tags are skipped.
  bundle: glossify
  rubric_ref: rubric/glossify_glossify_ignore_tags@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/glossify-parent-ignore-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/glossify-parent-ignore-cleanup.sh
- id: glossify-enable-tooltips
  input: On this site there is a text format 'gl_p_build'. Using the Glossify module, configure it so
    that taxonomy terms from the 'tags' vocabulary are automatically turned into hover tooltips in text
    using this format. Apply the change to the live site.
  criteria: Enable the glossify_taxonomy filter on filter.format.gl_p_build with glossify_taxonomy_type
    = 'tooltips' and glossify_taxonomy_vocabs including 'tags'.
  bundle: glossify
  rubric_ref: rubric/glossify_glossify_enable_tooltips@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/glossify-parent-tooltip-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/glossify-parent-tooltip-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/glossify-parent-tooltip-verify.sh
- id: glossify-enable-links
  input: On this site there is a text format 'gl_p_link_build'. Using Glossify, configure it so that matched
    taxonomy terms (from the 'tags' vocabulary) become links using the URL pattern /glossary/[id]. Apply
    the change to the live site.
  criteria: Enable glossify_taxonomy on filter.format.gl_p_link_build with glossify_taxonomy_type = 'links'
    (or 'tooltips_links'), glossify_taxonomy_vocabs including 'tags', and glossify_taxonomy_urlpattern
    = '/glossary/[id]'.
  bundle: glossify
  rubric_ref: rubric/glossify_glossify_enable_links@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/glossify-parent-link-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/glossify-parent-link-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/glossify-parent-link-verify.sh
