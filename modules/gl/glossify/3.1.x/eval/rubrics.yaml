rubrics:
- id: glossify_glossify_output_markup
  version: '1.0'
  applicable_bundles:
  - glossify
  checks:
  - kind: must_contain_any
    values:
    - glossify-tooltip-tip
    - glossify-tooltip-link
    - abbr
  scoring:
    combine: all_pass
- id: glossify_glossify_exclude
  version: '1.0'
  applicable_bundles:
  - glossify
  checks:
  - kind: must_contain_any
    values:
    - glossify-exclude
  scoring:
    combine: all_pass
- id: glossify_glossify_architecture
  version: '1.0'
  applicable_bundles:
  - glossify
  checks:
  - kind: must_contain_any
    values:
    - GlossifyBase
    - glossify_node
    - glossify_taxonomy
    - glossify_commerce
    - submodule
  scoring:
    combine: all_pass
- id: glossify_glossify_known_format
  version: '1.0'
  applicable_bundles:
  - glossify
  checks:
  - kind: must_contain_any
    values:
    - tooltips_links
    - /gloss/[id]
  scoring:
    combine: all_pass
- id: glossify_glossify_ignore_tags
  version: '1.0'
  applicable_bundles:
  - glossify
  checks:
  - kind: must_contain_any
    values:
    - gl_marker
    - h1
    - h2
  scoring:
    combine: all_pass
- id: glossify_glossify_enable_tooltips
  version: '1.0'
  applicable_bundles:
  - glossify
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
- id: glossify_glossify_enable_links
  version: '1.0'
  applicable_bundles:
  - glossify
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
