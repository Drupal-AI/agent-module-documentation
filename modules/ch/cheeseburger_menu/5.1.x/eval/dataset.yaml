metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: cheeseburger_menu
  version: 5.1.x
  note: 'Cheeseburger Menu provides two Block plugins (cheeseburger_menu = the off-canvas panel, cheeseburger_menu_trigger
    = the button) and no central admin page (configure=null), no permissions, no Drush. All config lives
    on block.block.<id> config entities under settings (schema block.settings.cheeseburger_menu / block.settings.cheeseburger_menu_trigger).
    The panel aggregates a settings.menus sequence, each entry {id, menu_type: menu|taxonomy_vocabulary,
    weight, settings{max_depth, icon, title...}}, plus color/opacity settings and toggles (default_css,
    default_js, show_navigation, parent_menu_as_link, track_active_trail, invoke_hooks). Three alter hooks
    fire only when invoke_hooks is TRUE. Medium/hard cases are grounded in that real block config: introspection
    reads back a placed block''s color; execution places a cheeseburger_menu block aggregating a menu,
    verified against the live block.block config entity.'
questions:
- id: cheeseburger_menu-blocks
  input: How do I add a Cheeseburger Menu (hamburger menu) to a Drupal site? Which block(s) does the module
    provide and how are they related?
  criteria: 'You place two blocks via Structure > Block layout: the ''Cheeseburger menu'' block (cheeseburger_menu)
    which renders the off-canvas panel, and the ''Cheeseburger menu trigger'' block (cheeseburger_menu_trigger)
    which opens/closes it. The trigger references the menu block via its block_to_trigger setting. There
    is no separate settings page; all configuration is in the blocks.'
  bundle: cheeseburger_menu
  rubric_ref: rubric/cheeseburger_menu_cheeseburger_menu_blocks@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: cheeseburger_menu-sources
  input: What kinds of sources can a Cheeseburger Menu block aggregate into its panel, and where is that
    stored in the block configuration?
  criteria: It aggregates any number of menus and/or taxonomy vocabularies into one ordered tree. Stored
    in the block's settings.menus sequence, each entry has menu_type ('menu' or 'taxonomy_vocabulary'),
    id, weight and a settings map (max_depth, initial_visibility_level, title options, icon, etc.).
  bundle: cheeseburger_menu
  rubric_ref: rubric/cheeseburger_menu_cheeseburger_menu_sources@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: cheeseburger_menu-hooks
  input: I want to add a CSS class to specific items in a Cheeseburger Menu programmatically. Which hook
    do I implement, and what setting must be enabled for it to run?
  criteria: 'Implement hook_cheeseburger_menu_item_alter(CheeseburgerMenuItem $item) and use $item->attribute
    / labelAttribute / triggerAttribute addClass(). It only fires when the menu block''s ''Invoke hooks''
    (invoke_hooks) setting is TRUE (off by default for performance). Related hooks: hook_cheeseburger_menu_alter()
    and hook_cheeseburger_menu_tree_manipulators_alter().'
  bundle: cheeseburger_menu
  rubric_ref: rubric/cheeseburger_menu_cheeseburger_menu_hooks@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: cheeseburger_menu-known-color
  input: This Drupal site has a placed Cheeseburger Menu block with the machine id 'cbm_known'. Inspect
    its live configuration and report the left-side background color it is set to.
  criteria: 'block.block.cbm_known has settings.left_side_background_color = #654321.'
  bundle: cheeseburger_menu
  rubric_ref: rubric/cheeseburger_menu_cheeseburger_menu_known_color@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/cheeseburger_menu-known-color-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/cheeseburger_menu-known-color-cleanup.sh
- id: cheeseburger_menu-place-block
  input: On this Drupal site, place a Cheeseburger Menu block with the machine id 'cbm_task' that aggregates
    the site's Main navigation menu. Apply the change to the live site.
  criteria: A block.block.cbm_task config entity exists with plugin cheeseburger_menu and settings.menus
    containing at least one entry (e.g. main with menu_type 'menu'). Placeable via Block::create([...'plugin'=>'cheeseburger_menu','settings'=>['menus'=>['main'=>['id'=>'main','menu_type'=>'menu','weight'=>0,'settings'=>[]]]]])->save().
  bundle: cheeseburger_menu
  rubric_ref: rubric/cheeseburger_menu_cheeseburger_menu_place_block@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/cheeseburger_menu-place-block-reset.sh
    verify: agent-module-documentation/evaluation/verify/cheeseburger_menu-place-block-verify.sh
- id: cheeseburger_menu-place-block-layman
  input: I want a slide-out hamburger menu on my Drupal site showing my main navigation. Set one up (call
    it 'cbm_task') and switch it on.
  criteria: 'Same verified end state as the expert variant: a placed cheeseburger_menu block ''cbm_task''
    aggregating at least one menu (the Main menu).'
  bundle: cheeseburger_menu
  rubric_ref: rubric/cheeseburger_menu_cheeseburger_menu_place_block_layman@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: site-owner
    reset: agent-module-documentation/evaluation/verify/cheeseburger_menu-place-block-reset.sh
    verify: agent-module-documentation/evaluation/verify/cheeseburger_menu-place-block-verify.sh
