rubrics:
- id: change_pwd_page_change_pwd_standalone_path
  version: '1.0'
  applicable_bundles:
  - change_pwd_page
  checks:
  - kind: must_contain_any
    values:
    - /user/change-password
    - /user/{user}/change-password
    - change_pwd_page.change_password_form
  scoring:
    combine: all_pass
- id: change_pwd_page_change_pwd_user_form_change
  version: '1.0'
  applicable_bundles:
  - change_pwd_page
  checks:
  - kind: must_contain_any
    values:
    - pass
    - user_form
    - hides
    - '#access'
  scoring:
    combine: all_pass
- id: change_pwd_page_change_pwd_password_policy_key
  version: '1.0'
  applicable_bundles:
  - change_pwd_page
  checks:
  - kind: must_contain_any
    values:
    - change_password_route
    - password_policy.settings
    - change_pwd_page.change_password_form
  scoring:
    combine: all_pass
- id: change_pwd_page_change_pwd_pp_route_known
  version: '1.0'
  applicable_bundles:
  - change_pwd_page
  checks:
  - kind: must_contain_any
    values:
    - change_pwd_page.change_password_form
  scoring:
    combine: all_pass
- id: change_pwd_page_change_pwd_pp_route_changed
  version: '1.0'
  applicable_bundles:
  - change_pwd_page
  checks:
  - kind: must_contain_any
    values:
    - user.pass
  scoring:
    combine: all_pass
- id: change_pwd_page_change_pwd_wire_pp_route
  version: '1.0'
  applicable_bundles:
  - change_pwd_page
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
- id: change_pwd_page_change_pwd_fix_wrong_route
  version: '1.0'
  applicable_bundles:
  - change_pwd_page
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
