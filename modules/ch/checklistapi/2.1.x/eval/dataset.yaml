metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: checklistapi
  version: 2.1.x
  note: 'Checklist API is a developer-facing API: an info hook defines checklists, from which routes and
    permissions are auto-generated, and progress is saved to config or state. Cases are `recipe` (response-graded)
    since they probe documented facts an agent would otherwise read source to answer; no site mutation.'
questions:
- id: checklistapi-define-hook
  input: On a Drupal 11 site I want my module to define a new fillable checklist with Checklist API. Which
    hook do I implement, and what are the required keys of each checklist definition?
  criteria: 'Implement hook_checklistapi_checklist_info(), returning an array keyed by checklist ID. Each
    definition needs at least #title and #path (a route is only built when both are present), typically
    with a #callback returning the groups/items.'
  bundle: checklistapi
  rubric_ref: rubric/checklistapi_checklistapi_define_hook@1.0
  tags:
  - mode:recipe
- id: checklistapi-items-structure
  input: How do I structure the checklist items for a Checklist API checklist, and how do groups render?
    How do I make an item start checked automatically?
  criteria: 'The #callback returns an array of groups (rendered as vertical tabs), each with #title and
    item arrays. Each item has a #title, optional #description, #weight, and links (#text/#url). Set #default_value
    => TRUE to auto-check a programmatically verifiable item.'
  bundle: checklistapi
  rubric_ref: rubric/checklistapi_checklistapi_items_structure@1.0
  tags:
  - mode:recipe
- id: checklistapi-progress-storage
  input: Where does Checklist API save a checklist's progress, and how do I choose between the two backends?
    What data does it record about who completed an item?
  criteria: 'Progress saves to config (default, object checklistapi.progress.{id}, exportable) or state
    (key checklistapi.progress.{id}), chosen per checklist with the #storage key. Each checked item records
    #completed (timestamp) and #uid (user) of its first completion, plus overall #changed, #changed_by,
    #completed_items.'
  bundle: checklistapi
  rubric_ref: rubric/checklistapi_checklistapi_progress_storage@1.0
  tags:
  - mode:recipe
- id: checklistapi-generated-routes-perms
  input: After I define a checklist with Checklist API, what routes and permissions get created automatically
    for it?
  criteria: Per checklist it auto-generates routes checklistapi.checklists.{id} (view/fill) and checklistapi.checklists.{id}.clear,
    plus permissions 'view {id} checklistapi checklist' and 'edit {id} checklistapi checklist', alongside
    universal 'view any' / 'edit any' permissions.
  bundle: checklistapi
  rubric_ref: rubric/checklistapi_checklistapi_generated_routes_perms@1.0
  tags:
  - mode:recipe
- id: checklistapi-alter
  input: Another module defined a Checklist API checklist and I want to add and remove some of its items.
    Which hook do I use, and is there anything I cannot change with it?
  criteria: 'Implement hook_checklistapi_checklist_info_alter(array &$definitions) to add/move/remove
    checklists, groups, and items by reference. The #path cannot be altered here (routes are already built).'
  bundle: checklistapi
  rubric_ref: rubric/checklistapi_checklistapi_alter@1.0
  tags:
  - mode:recipe
- id: checklistapi-load-in-code
  input: In PHP, how do I load a Checklist API checklist and read how many items are complete and who
    last updated it?
  criteria: Use checklistapi_checklist_load($id) to get a ChecklistapiChecklist, then getNumberCompleted(),
    getNumberOfItems(), getPercentComplete(), getLastUpdatedUser(), getLastUpdatedDate().
  bundle: checklistapi
  rubric_ref: rubric/checklistapi_checklistapi_load_in_code@1.0
  tags:
  - mode:recipe
- id: checklistapi-drush
  input: Which Drush commands does Checklist API provide to see my checklists and their progress from
    the CLI?
  criteria: drush checklistapi:list shows a table of all checklists with progress; drush checklistapi:info
    <id> shows one checklist's items with completion detail.
  bundle: checklistapi
  rubric_ref: rubric/checklistapi_checklistapi_drush@1.0
  tags:
  - mode:recipe
- id: checklistapi-report-permission
  input: Where does Checklist API show an overview of all checklists in the admin UI, and which permission
    controls access to it?
  criteria: The Checklists report at /admin/reports/checklistapi (route checklistapi.report), gated by
    the 'view checklistapi checklists report' permission.
  bundle: checklistapi
  rubric_ref: rubric/checklistapi_checklistapi_report_permission@1.0
  tags:
  - mode:recipe
