rubrics:
- id: checklistapi_checklistapi_define_hook
  version: '1.0'
  applicable_bundles:
  - checklistapi
  checks:
  - kind: must_contain_any
    values:
    - hook_checklistapi_checklist_info
    - checklistapi_checklist_info
  scoring:
    combine: all_pass
- id: checklistapi_checklistapi_items_structure
  version: '1.0'
  applicable_bundles:
  - checklistapi
  checks:
  - kind: must_contain_any
    values:
    - '#default_value'
    - vertical tab
    - callback_checklistapi_checklist_items
  scoring:
    combine: all_pass
- id: checklistapi_checklistapi_progress_storage
  version: '1.0'
  applicable_bundles:
  - checklistapi
  checks:
  - kind: must_contain_any
    values:
    - '#storage'
    - checklistapi.progress
    - config
    - state
  scoring:
    combine: all_pass
- id: checklistapi_checklistapi_generated_routes_perms
  version: '1.0'
  applicable_bundles:
  - checklistapi
  checks:
  - kind: must_contain_any
    values:
    - checklistapi.checklists.
    - view {id} checklistapi checklist
    - edit {id} checklistapi checklist
    - per-checklist
  scoring:
    combine: all_pass
- id: checklistapi_checklistapi_alter
  version: '1.0'
  applicable_bundles:
  - checklistapi
  checks:
  - kind: must_contain_any
    values:
    - hook_checklistapi_checklist_info_alter
    - checklistapi_checklist_info_alter
  scoring:
    combine: all_pass
- id: checklistapi_checklistapi_load_in_code
  version: '1.0'
  applicable_bundles:
  - checklistapi
  checks:
  - kind: must_contain_any
    values:
    - checklistapi_checklist_load
    - getPercentComplete
    - getNumberCompleted
  scoring:
    combine: all_pass
- id: checklistapi_checklistapi_drush
  version: '1.0'
  applicable_bundles:
  - checklistapi
  checks:
  - kind: must_contain_any
    values:
    - checklistapi:list
    - checklistapi:info
  scoring:
    combine: all_pass
- id: checklistapi_checklistapi_report_permission
  version: '1.0'
  applicable_bundles:
  - checklistapi
  checks:
  - kind: must_contain_any
    values:
    - /admin/reports/checklistapi
    - checklistapi.report
    - view checklistapi checklists report
  scoring:
    combine: all_pass
