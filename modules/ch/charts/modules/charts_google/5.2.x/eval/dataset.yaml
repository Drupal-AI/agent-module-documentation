metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: charts_google
  version: 5.2.x
  note: Thin library submodule registering the Google Charts backend for the charts module; adds a table
    chart type and loads Google's loader.js. Cases are `recipe` (response-graded); no site mutation.
questions:
- id: charts-google-enable
  input: I want my Charts module charts to render with Google Charts. Which submodule do I enable and
    what library id does it register?
  criteria: Enable charts_google; it registers the Chart library plugin id `google` (Google Charts), then
    select Google as the library.
  bundle: charts_google
  rubric_ref: rubric/charts_google_charts_google_enable@1.0
  tags:
  - mode:recipe
- id: charts-google-loader
  input: How is the Google Charts library loaded when using charts_google, and can I fully self-host it?
  criteria: It loads Google's loader.js (google/charts v45 from gstatic.com); the actual chart code streams
    from Google's servers, so it is effectively always remote and cannot be fully self-hosted.
  bundle: charts_google
  rubric_ref: rubric/charts_google_charts_google_loader@1.0
  tags:
  - mode:recipe
- id: charts-google-table
  input: Which chart type does the Google Charts submodule add on top of the base Charts chart types?
  criteria: charts_google adds the `table` visualization type via charts_google.charts_types.yml.
  bundle: charts_google
  rubric_ref: rubric/charts_google_charts_google_table@1.0
  tags:
  - mode:recipe
- id: charts-google-types
  input: Does Google Charts support boxplot and candlestick charts through the Charts module?
  criteria: Yes — google supports area, bar, boxplot, bubble, candlestick, column, donut, gauge, line,
    pie, scatter, spline, and table.
  bundle: charts_google
  rubric_ref: rubric/charts_google_charts_google_types@1.0
  tags:
  - mode:recipe
- id: charts-google-select
  input: In a Charts render array, how do I force a chart to use Google Charts?
  criteria: Set '#chart_library' => 'google' on the chart element (or select Google in the Views style
    / block / field, or as the site default library).
  bundle: charts_google
  rubric_ref: rubric/charts_google_charts_google_select@1.0
  tags:
  - mode:recipe
