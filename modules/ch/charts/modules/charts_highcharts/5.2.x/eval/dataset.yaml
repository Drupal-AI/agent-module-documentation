metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: charts_highcharts
  version: 5.2.x
  note: Library submodule registering the Highcharts backend for the charts module; adds solidgauge/dumbbell
    types and a ColorChanger form; commercial license required for commercial use. Cases are `recipe`
    (response-graded); no site mutation.
questions:
- id: charts-highcharts-enable
  input: I want my Charts module charts to render with Highcharts. Which submodule do I enable and what
    library id does it register?
  criteria: Enable charts_highcharts; it registers the Chart library plugin id `highcharts` (Highcharts),
    then select Highcharts as the library.
  bundle: charts_highcharts
  rubric_ref: rubric/charts_highcharts_charts_highcharts_enable@1.0
  tags:
  - mode:recipe
- id: charts-highcharts-license
  input: Are there any licensing concerns with using the Highcharts backend in the Charts module on a
    commercial site?
  criteria: Yes — Highcharts is free for non-commercial use but requires a commercial license for commercial
    use; consider charts_chartjs (MIT) if that is a concern.
  bundle: charts_highcharts
  rubric_ref: rubric/charts_highcharts_charts_highcharts_license@1.0
  tags:
  - mode:recipe
- id: charts-highcharts-extra-types
  input: Which chart types does the Highcharts submodule add beyond the base Charts chart types?
  criteria: charts_highcharts adds solidgauge and dumbbell types via charts_highcharts.charts_types.yml;
    it also supports heatmap, boxplot, arearange, etc.
  bundle: charts_highcharts
  rubric_ref: rubric/charts_highcharts_charts_highcharts_extra_types@1.0
  tags:
  - mode:recipe
- id: charts-highcharts-cdn
  input: Where does charts_highcharts load the Highcharts JavaScript from by default, and how do I self-host
    it?
  criteria: By default from the jsDelivr CDN (highcharts 12.5.0 plus add-on modules); disable the CDN
    option and install the drupal-library packages into /libraries/highcharts* to self-host.
  bundle: charts_highcharts
  rubric_ref: rubric/charts_highcharts_charts_highcharts_cdn@1.0
  tags:
  - mode:recipe
- id: charts-highcharts-colorchanger
  input: Does the Highcharts charts submodule provide a way for editors to recolor a chart interactively?
  criteria: Yes — charts_highcharts ships a ColorChanger form (src/Form/ColorChanger.php) for live recoloring
    of a rendered chart.
  bundle: charts_highcharts
  rubric_ref: rubric/charts_highcharts_charts_highcharts_colorchanger@1.0
  tags:
  - mode:recipe
- id: charts-highcharts-widest
  input: I need the charting library with the broadest chart-type coverage in the Charts module (heatmap,
    boxplot, arearange, etc.). Which backend?
  criteria: Highcharts (charts_highcharts) has the widest chart-type coverage, including heatmap, boxplot,
    arearange, dumbbell, and solidgauge.
  bundle: charts_highcharts
  rubric_ref: rubric/charts_highcharts_charts_highcharts_widest@1.0
  tags:
  - mode:recipe
