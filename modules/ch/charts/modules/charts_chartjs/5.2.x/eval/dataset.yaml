metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: charts_chartjs
  version: 5.2.x
  note: Thin library submodule registering the Chart.js backend for the charts module; adds a polarArea
    chart type. Cases are `recipe` (response-graded); no site mutation.
questions:
- id: charts-chartjs-enable
  input: I want my Charts module charts to render with Chart.js. Which submodule do I enable and what
    library id does it register?
  criteria: Enable charts_chartjs; it registers the Chart library plugin id `chartjs` (Chart.js), then
    select Chart.js as the library.
  bundle: charts_chartjs
  rubric_ref: rubric/charts_chartjs_charts_chartjs_enable@1.0
  tags:
  - mode:recipe
- id: charts-chartjs-open-source
  input: I need a Charts library that is fully open-source with no commercial license restrictions. Which
    backend should I use?
  criteria: Use charts_chartjs — Chart.js is MIT-licensed and fully open-source, unlike Highcharts which
    needs a commercial license for commercial use.
  bundle: charts_chartjs
  rubric_ref: rubric/charts_chartjs_charts_chartjs_open_source@1.0
  tags:
  - mode:recipe
- id: charts-chartjs-polararea
  input: Which chart type does the Chart.js charts submodule add that the base Charts module doesn't define?
  criteria: charts_chartjs adds the polarArea chart type via charts_chartjs.charts_types.yml.
  bundle: charts_chartjs
  rubric_ref: rubric/charts_chartjs_charts_chartjs_polararea@1.0
  tags:
  - mode:recipe
- id: charts-chartjs-deps
  input: What external JavaScript packages does charts_chartjs pull in?
  criteria: Chart.js ^4.4 plus the chartjs-adapter-date-fns and chartjs-plugin-datalabels plugins, installed
    as npm-asset packages or via CDN.
  bundle: charts_chartjs
  rubric_ref: rubric/charts_chartjs_charts_chartjs_deps@1.0
  tags:
  - mode:recipe
- id: charts-chartjs-local
  input: How do I install Chart.js locally for charts_chartjs instead of using a CDN?
  criteria: Disable the CDN option and install the npm-asset packages via asset-packagist/composer-installers-extender
    into /libraries/chartjs (or use the npm libraries:copy script).
  bundle: charts_chartjs
  rubric_ref: rubric/charts_chartjs_charts_chartjs_local@1.0
  tags:
  - mode:recipe
