metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: charts_billboard
  version: 5.2.x
  note: Thin library submodule registering the Billboard.js Chart backend for the charts module. Cases
    are `recipe` (response-graded); no site mutation.
questions:
- id: charts-billboard-enable
  input: I want my Charts module charts to render with Billboard.js. Which submodule do I enable and what
    library id does it register?
  criteria: Enable charts_billboard; it registers the Chart library plugin id `billboard` (Billboard.js),
    then select Billboard.js as the library.
  bundle: charts_billboard
  rubric_ref: rubric/charts_billboard_charts_billboard_enable@1.0
  tags:
  - mode:recipe
- id: charts-billboard-deps
  input: Which external JavaScript libraries does charts_billboard require?
  criteria: Billboard.js 3.10.3 and D3 7.9.0 (Billboard.js is a D3-based fork of C3), loaded from CDN
    by default.
  bundle: charts_billboard
  rubric_ref: rubric/charts_billboard_charts_billboard_deps@1.0
  tags:
  - mode:recipe
- id: charts-billboard-local
  input: How do I serve the Billboard.js and D3 files locally instead of from a CDN with charts_billboard?
  criteria: Disable the CDN option in Charts advanced settings and install billboard/d3 into /libraries
    via Composer (billboardjs/billboard, d3/d3) or the npm libraries:copy script.
  bundle: charts_billboard
  rubric_ref: rubric/charts_billboard_charts_billboard_local@1.0
  tags:
  - mode:recipe
- id: charts-billboard-select
  input: In a Charts render array, how do I force a chart to use Billboard.js?
  criteria: Set '#chart_library' => 'billboard' on the chart element (or select Billboard.js in the Views
    style / block / field, or as the site default library).
  bundle: charts_billboard
  rubric_ref: rubric/charts_billboard_charts_billboard_select@1.0
  tags:
  - mode:recipe
- id: charts-billboard-types
  input: Does Billboard.js support candlestick and gauge charts through the Charts module?
  criteria: Yes — billboard supports area, arearange, bar, bubble, candlestick, column, donut, gauge,
    line, pie, scatter, and spline.
  bundle: charts_billboard
  rubric_ref: rubric/charts_billboard_charts_billboard_types@1.0
  tags:
  - mode:recipe
