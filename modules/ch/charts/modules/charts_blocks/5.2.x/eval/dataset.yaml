metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: charts_blocks
  version: 5.2.x
  note: Charts Blocks is a charts submodule providing block plugins (charts_block and charts_canvas_block)
    for standalone, hand-entered charts. Cases are `recipe` (response-graded); no site mutation.
questions:
- id: charts-blocks-purpose
  input: I want to add a chart to a Drupal region without building a View. Which charts submodule do I
    enable?
  criteria: Enable the charts_blocks submodule; it provides block plugins that render a chart from hand-entered
    data, no View needed.
  bundle: charts_blocks
  rubric_ref: rubric/charts_blocks_charts_blocks_purpose@1.0
  tags:
  - mode:recipe
- id: charts-blocks-block-id
  input: After enabling Charts Blocks, what is the block I place in Block layout to show a chart, and
    how do I supply its data?
  criteria: Place the "Charts block" (charts_block) and enter labels + series values in its AJAX data-collector
    table, choosing library and chart type.
  bundle: charts_blocks
  rubric_ref: rubric/charts_blocks_charts_blocks_block_id@1.0
  tags:
  - mode:recipe
- id: charts-blocks-canvas
  input: Which Charts Blocks block works inside Drupal Canvas, and how is its data entered?
  criteria: The "Chart (Canvas)" block (charts_canvas_block) is Canvas-friendly; it avoids the AJAX data-collector
    table and takes data as CSV or JSON in a textarea.
  bundle: charts_blocks
  rubric_ref: rubric/charts_blocks_charts_blocks_canvas@1.0
  tags:
  - mode:recipe
- id: charts-blocks-needs-library
  input: I enabled charts_blocks and placed a Charts block but it doesn't draw anything. What else is
    required?
  criteria: charts_blocks depends on charts and still needs a charting-library submodule enabled (e.g.
    charts_highcharts) and selected before anything renders.
  bundle: charts_blocks
  rubric_ref: rubric/charts_blocks_charts_blocks_needs_library@1.0
  tags:
  - mode:recipe
- id: charts-blocks-layout-builder
  input: Can I use a Charts Blocks chart inside a Layout Builder section?
  criteria: Yes — the chart blocks are standard block plugins, so they can be placed in Block layout,
    Layout Builder sections, or Drupal Canvas.
  bundle: charts_blocks
  rubric_ref: rubric/charts_blocks_charts_blocks_layout_builder@1.0
  tags:
  - mode:recipe
