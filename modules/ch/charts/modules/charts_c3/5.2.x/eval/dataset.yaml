metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: charts_c3
  version: 5.2.x
  note: Thin library submodule registering the C3.js Chart backend for the charts module. Cases are `recipe`
    (response-graded); no site mutation.
questions:
- id: charts-c3-enable
  input: I want my Charts module charts to render with C3.js. Which submodule do I enable and what library
    id does it register?
  criteria: Enable charts_c3; it registers the Chart library plugin id `c3` (C3.js), then select C3 as
    the library.
  bundle: charts_c3
  rubric_ref: rubric/charts_c3_charts_c3_enable@1.0
  tags:
  - mode:recipe
- id: charts-c3-deps
  input: Which external JavaScript libraries does charts_c3 require?
  criteria: C3.js 0.7.20 and D3 7.9.0 (C3 is a D3-based chart library), loaded from CDN by default.
  bundle: charts_c3
  rubric_ref: rubric/charts_c3_charts_c3_deps@1.0
  tags:
  - mode:recipe
- id: charts-c3-local
  input: How do I serve the C3.js and D3 files locally instead of from a CDN with charts_c3?
  criteria: Disable the CDN option in Charts advanced settings and install c3/d3 into /libraries via Composer
    (c3js/c3, d3/d3) or the npm libraries:copy script.
  bundle: charts_c3
  rubric_ref: rubric/charts_c3_charts_c3_local@1.0
  tags:
  - mode:recipe
- id: charts-c3-select
  input: In a Charts render array, how do I force a chart to use C3.js?
  criteria: Set '#chart_library' => 'c3' on the chart element (or select C3 in the Views style / block
    / field, or as the site default library).
  bundle: charts_c3
  rubric_ref: rubric/charts_c3_charts_c3_select@1.0
  tags:
  - mode:recipe
- id: charts-c3-vs-billboard
  input: How does the C3.js charts backend relate to Billboard.js in the Charts module?
  criteria: Billboard.js is a fork of C3.js; both are D3-based, so charts_c3 and charts_billboard behave
    similarly.
  bundle: charts_c3
  rubric_ref: rubric/charts_c3_charts_c3_vs_billboard@1.0
  tags:
  - mode:recipe
