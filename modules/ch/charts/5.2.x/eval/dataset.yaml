metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: charts
  version: 5.2.x
  note: 'Charts is a library-agnostic charting framework: a Views style, a chart_config field type/formatter,
    a `chart` render element, two plugin types (chart library + chart type), a config settings object,
    and alter hooks. Cases are `recipe` (response-graded) probing documented facts an agent would otherwise
    read source to answer; no site mutation.'
questions:
- id: charts-needs-library-submodule
  input: I enabled the Drupal `charts` module but no chart renders. Why, and what do I need to do?
  criteria: The core charts module ships no charting library; you must enable a library submodule (e.g.
    charts_highcharts, charts_chartjs, charts_google, charts_billboard, or charts_c3) and select it as
    the default library.
  bundle: charts
  rubric_ref: rubric/charts_charts_needs_library_submodule@1.0
  tags:
  - mode:recipe
- id: charts-views-style
  input: How do I render a Drupal View as a chart with the Charts module? Name the Views style/plugin
    id.
  criteria: Set the View's Format to the Charts "Chart" Views style (plugin id `chart`, theme views_view_charts),
    then pick the library, chart type, and label/data fields.
  bundle: charts
  rubric_ref: rubric/charts_charts_views_style@1.0
  tags:
  - mode:recipe
- id: charts-render-element
  input: In PHP, build a column chart programmatically with the Charts module using a render array. Show
    the element type.
  criteria: Use a render array with '#type' => 'chart', '#chart_type' => 'column', a 'series' child of
    '#type' => 'chart_data', and an 'xaxis' of '#type' => 'chart_xaxis'; render it with the renderer service.
  bundle: charts
  rubric_ref: rubric/charts_charts_render_element@1.0
  tags:
  - mode:recipe
- id: charts-library-plugin-type
  input: I want to add support for a new JavaScript charting library to the Charts module. Which plugin
    type, manager, and attribute do I implement?
  criteria: 'Create a Chart library plugin in src/Plugin/chart/Library, extend ChartBase / implement ChartInterface,
    and declare it with the #[Chart(id, name, types)] attribute; it is discovered by ChartManager (plugin.manager.charts).'
  bundle: charts
  rubric_ref: rubric/charts_charts_library_plugin_type@1.0
  tags:
  - mode:recipe
- id: charts-add-chart-type
  input: How do I add a custom chart type (like candlestick) and make a specific library support it in
    the Charts module?
  criteria: Define the type in a {module}.charts_types.yml file (label, axis, axis_inverted, stacking)
    and add it to a library with hook_charts_plugin_supported_chart_types_alter().
  bundle: charts
  rubric_ref: rubric/charts_charts_add_chart_type@1.0
  tags:
  - mode:recipe
- id: charts-default-settings
  input: Which config object and admin path hold the Charts module's default library, default chart type,
    and color palette?
  criteria: The charts.settings config object (charts_default_settings.library, .type, .display.colors),
    edited at /admin/config/content/charts (route charts.settings).
  bundle: charts
  rubric_ref: rubric/charts_charts_default_settings@1.0
  tags:
  - mode:recipe
- id: charts-cdn-toggle
  input: How do I make the Charts module load charting library JavaScript from local /libraries copies
    instead of a CDN?
  criteria: Disable the CDN option on the advanced settings form (/admin/config/content/charts/advanced)
    — set advanced.requirements.cdn to false in charts.settings — so libraries load from local /libraries
    copies.
  bundle: charts
  rubric_ref: rubric/charts_charts_cdn_toggle@1.0
  tags:
  - mode:recipe
- id: charts-definition-alter-hook
  input: I need to set a Highcharts-specific option on a chart just before it is passed to the library.
    Which Charts hook do I implement?
  criteria: Implement hook_chart_definition_alter(array &$definition, array $element, $chart_id) and branch
    on $element['#chart_library'] to set library-specific options.
  bundle: charts
  rubric_ref: rubric/charts_charts_definition_alter_hook@1.0
  tags:
  - mode:recipe
