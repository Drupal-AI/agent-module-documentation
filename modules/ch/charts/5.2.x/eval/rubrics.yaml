rubrics:
- id: charts_charts_needs_library_submodule
  version: '1.0'
  applicable_bundles:
  - charts
  checks:
  - kind: must_contain_any
    values:
    - charts_highcharts
    - charts_chartjs
    - charts_google
    - charts_billboard
    - charts_c3
    - library submodule
  scoring:
    combine: all_pass
- id: charts_charts_views_style
  version: '1.0'
  applicable_bundles:
  - charts
  checks:
  - kind: must_contain_any
    values:
    - Chart
    - 'id: chart'
    - '"chart"'
    - views_view_charts
    - ChartsPluginStyleChart
  scoring:
    combine: all_pass
- id: charts_charts_render_element
  version: '1.0'
  applicable_bundles:
  - charts
  checks:
  - kind: must_contain_any
    values:
    - '''#type'' => ''chart'''
    - '#type => ''chart'''
    - chart_data
    - chart_xaxis
  scoring:
    combine: all_pass
- id: charts_charts_library_plugin_type
  version: '1.0'
  applicable_bundles:
  - charts
  checks:
  - kind: must_contain_any
    values:
    - Plugin/chart/Library
    - ChartManager
    - plugin.manager.charts
    - Chart attribute
    - '#[Chart'
  scoring:
    combine: all_pass
- id: charts_charts_add_chart_type
  version: '1.0'
  applicable_bundles:
  - charts
  checks:
  - kind: must_contain_any
    values:
    - charts_types.yml
    - hook_charts_plugin_supported_chart_types_alter
  scoring:
    combine: all_pass
- id: charts_charts_default_settings
  version: '1.0'
  applicable_bundles:
  - charts
  checks:
  - kind: must_contain_any
    values:
    - charts.settings
    - /admin/config/content/charts
  scoring:
    combine: all_pass
- id: charts_charts_cdn_toggle
  version: '1.0'
  applicable_bundles:
  - charts
  checks:
  - kind: must_contain_any
    values:
    - cdn
    - advanced.requirements.cdn
    - /admin/config/content/charts/advanced
  scoring:
    combine: all_pass
- id: charts_charts_definition_alter_hook
  version: '1.0'
  applicable_bundles:
  - charts
  checks:
  - kind: must_contain_any
    values:
    - hook_chart_definition_alter
    - chart_definition_alter
  scoring:
    combine: all_pass
