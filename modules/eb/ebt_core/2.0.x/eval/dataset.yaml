metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: ebt_core
  version: 2.0.x
  note: 'EBT Core is base infrastructure for the Extra Block Types ecosystem. It provides: a site-wide
    settings form at route ebt_core.settings (/admin/config/content/ebt-core, permission ''administer
    site configuration'') editing the config object ebt_core.settings (keys ebt_core_primary_color, ebt_core_secondary_color,
    ebt_core_background_color [default #0d77b5], ebt_core_mobile_breakpoint [640], ebt_core_tablet_breakpoint
    [1020], ebt_core_desktop_breakpoint [1320], and ebt_core_x*small/large widths); an ebt_settings field
    type with widgets ebt_settings_default/ebt_settings_simple and formatter ebt_settings_default, plus
    the shipped field.storage.block_content.field_ebt_settings; services ebt_core.generate_css / ebt_core.generate_js;
    and theme/preprocess plumbing keyed to the ebt_ block bundle prefix. No permissions or Drush of its
    own; provides config schema. easy = recipe facts. medium = introspect live ebt_core.settings config
    values (setup writes a known value, cleanup restores the shipped default). hard = the agent writes
    ebt_core.settings config values, verified against live config (reset restores shipped defaults).'
questions:
- id: ebt-core-settings-route
  input: 'In the Drupal ebt_core (Extra Block Types: Core) module, what is the configuration route/path
    for its site-wide settings, which config object stores those settings, and what is the default background
    color?'
  criteria: 'The settings form is at route ebt_core.settings, path /admin/config/content/ebt-core (permission
    ''administer site configuration''), editing the config object ebt_core.settings. The default background
    color is #0d77b5.'
  bundle: ebt_core
  rubric_ref: rubric/ebt_core_ebt_core_settings_route@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: ebt-core-field
  input: What field type does the Drupal ebt_core module define to store a block's design options, and
    what widgets/formatter does it provide? Where is that design field stored by default?
  criteria: It defines the ebt_settings field type (widgets ebt_settings_default and ebt_settings_simple,
    formatter ebt_settings_default). The module ships the field.storage.block_content.field_ebt_settings
    storage, so EBT block types store their design options in field_ebt_settings on block_content.
  bundle: ebt_core
  rubric_ref: rubric/ebt_core_ebt_core_field@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: ebt-core-breakpoints
  input: What are the default responsive breakpoint values configured by the Drupal ebt_core module, and
    what config keys hold them?
  criteria: In ebt_core.settings the defaults are ebt_core_mobile_breakpoint=640, ebt_core_tablet_breakpoint=1020,
    ebt_core_desktop_breakpoint=1320 (the form requires the three to be different). Named container widths
    (ebt_core_xxsmall_width .. ebt_core_xxlarge_width) are also stored there.
  bundle: ebt_core
  rubric_ref: rubric/ebt_core_ebt_core_breakpoints@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: ebt-core-known-bg
  input: 'On this Drupal site, inspect the ebt_core (Extra Block Types) configuration: what is the currently
    configured EBT background color value?'
  criteria: 'The configured value is #abcdef: ebt_core.settings -> ebt_core_background_color = ''#abcdef''
    (read via drush cget ebt_core.settings ebt_core_background_color).'
  bundle: ebt_core
  rubric_ref: rubric/ebt_core_ebt_core_known_bg@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/ebt_core-known-bg-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/ebt_core-known-bg-cleanup.sh
- id: ebt-core-known-breakpoint
  input: On this Drupal site, inspect the ebt_core configuration and report the currently configured EBT
    mobile breakpoint value.
  criteria: 'The configured mobile breakpoint is 555: ebt_core.settings -> ebt_core_mobile_breakpoint
    = ''555''.'
  bundle: ebt_core
  rubric_ref: rubric/ebt_core_ebt_core_known_breakpoint@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/ebt_core-known-breakpoint-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/ebt_core-known-breakpoint-cleanup.sh
- id: ebt-core-set-secondary-color
  input: 'On this Drupal site, using the ebt_core (Extra Block Types) settings, set the EBT secondary
    color to #ff8800. Apply the change to the live site configuration.'
  criteria: ebt_core.settings -> ebt_core_secondary_color === '#ff8800' (e.g. drush cset ebt_core.settings
    ebt_core_secondary_color '#ff8800' -y, or via the settings form at /admin/config/content/ebt-core).
  bundle: ebt_core
  rubric_ref: rubric/ebt_core_ebt_core_set_secondary_color@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/ebt_core-set-secondary-color-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/ebt_core-set-secondary-color-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/ebt_core-set-secondary-color-verify.sh
- id: ebt-core-set-breakpoint
  input: On this Drupal site, using the ebt_core settings, change the EBT mobile breakpoint to 500. Apply
    the change to the live site configuration.
  criteria: ebt_core.settings -> ebt_core_mobile_breakpoint === '500' (e.g. drush cset ebt_core.settings
    ebt_core_mobile_breakpoint '500' -y).
  bundle: ebt_core
  rubric_ref: rubric/ebt_core_ebt_core_set_breakpoint@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/ebt_core-set-breakpoint-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/ebt_core-set-breakpoint-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/ebt_core-set-breakpoint-verify.sh
