rubrics:
- id: ebt_core_starterkit_ebt_sk_command
  version: '1.0'
  applicable_bundles:
  - ebt_core_starterkit
  checks:
  - kind: must_contain_any
    values:
    - ebt:module
    - ebt-module
    - generate
  scoring:
    combine: all_pass
- id: ebt_core_starterkit_ebt_sk_generates
  version: '1.0'
  applicable_bundles:
  - ebt_core_starterkit
  checks:
  - kind: must_contain_any
    values:
    - block_content
    - block type
    - templates
    - scaffold
  scoring:
    combine: all_pass
- id: ebt_core_starterkit_ebt_sk_requirements
  version: '1.0'
  applicable_bundles:
  - ebt_core_starterkit
  checks:
  - kind: must_contain_any
    values:
    - Drush 12
    - 12+
    - '12'
  scoring:
    combine: all_pass
- id: ebt_core_starterkit_ebt_sk_generator_registered
  version: '1.0'
  applicable_bundles:
  - ebt_core_starterkit
  checks:
  - kind: must_contain_any
    values:
    - ebt:module
    - ebt-module
  scoring:
    combine: all_pass
- id: ebt_core_starterkit_ebt_sk_scaffold
  version: '1.0'
  applicable_bundles:
  - ebt_core_starterkit
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
