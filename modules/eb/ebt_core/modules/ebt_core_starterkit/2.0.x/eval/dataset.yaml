metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: ebt_core_starterkit
  version: 2.0.x
  note: 'Glue/developer submodule of ebt_core. Provides a DrupalCodeGenerator generator EbtGenerator exposed
    as the Drush command ''ebt:module'' (alias ebt-module, type MODULE_COMPONENT). Running it scaffolds
    a full EBT block-type module (info.yml, libraries.yml, block_content type + form/view display + body/field_ebt_settings
    field config, block Twig templates, InstallTest, README, composer.json, CSS). Requires Drush 12+ (hook_requirements).
    Depends on ebt_core, block_content, media. No config/permissions/plugins of its own beyond the generator.
    As a glue module: 3 easy / 1 medium / 1 hard. medium introspects that the ebt:module generator is
    registered with drush on the live site. hard: the agent runs the generator to scaffold a namespaced
    module (ebt_skprobe) into web/modules/custom/ebt_skprobe (NOT enabled), verified by the generated
    files on disk. drush generate accepts non-interactive answers via repeated --answer and a --destination
    path.'
questions:
- id: ebt-sk-command
  input: In the Drupal ebt_core_starterkit module, what Drush command does it add, and what does that
    command do?
  criteria: It adds the Drush generator 'drush generate ebt:module' (alias ebt-module), which scaffolds
    a new EBT block-type module (info/libraries yml, a block_content type with form/view displays and
    body + field_ebt_settings fields, Twig templates, an install test, README, composer.json, CSS).
  bundle: ebt_core_starterkit
  rubric_ref: rubric/ebt_core_starterkit_ebt_sk_command@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: ebt-sk-generates
  input: What does the ebt_core_starterkit generator produce when you run it for a new EBT module?
  criteria: 'A complete EBT block-type module: {machine_name}.info.yml and .libraries.yml, config/install
    for a block_content type plus its form/view displays and body + field_ebt_settings field instances,
    block--block-content--* and block--inline-block--* Twig templates, a functional InstallTest, README,
    composer.json, and CSS.'
  bundle: ebt_core_starterkit
  rubric_ref: rubric/ebt_core_starterkit_ebt_sk_generates@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: ebt-sk-requirements
  input: What version of Drush does the Drupal ebt_core_starterkit module require, and why does the machine
    name of a generated EBT module matter?
  criteria: It requires Drush 12+ (its hook_requirements blocks install on older Drush). The generated
    module's machine name should use the ebt_ prefix so EBT Core's theme/preprocess plumbing (which keys
    on the ebt_ bundle prefix) applies to it.
  bundle: ebt_core_starterkit
  rubric_ref: rubric/ebt_core_starterkit_ebt_sk_requirements@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: ebt-sk-generator-registered
  input: 'On this Drupal site, inspect the available Drush generators: what is the name (and/or alias)
    of the EBT module scaffolding generator provided by ebt_core_starterkit?'
  criteria: The generator is named ebt:module (alias ebt-module), listed by 'drush generate' among the
    available generators (label 'EBT module').
  bundle: ebt_core_starterkit
  rubric_ref: rubric/ebt_core_starterkit_ebt_sk_generator_registered@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/ebt_core_starterkit-generator-registered-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/ebt_core_starterkit-generator-registered-cleanup.sh
- id: ebt-sk-scaffold
  input: 'On this Drupal site, use the ebt_core_starterkit generator to scaffold a new EBT block-type
    module named ebt_skprobe (human name ''EBT SK Probe''), placing the generated files under web/modules/custom/ebt_skprobe.
    Do NOT enable the module. (Hint: drush generate ebt:module accepts non-interactive answers, e.g. --answer=ebt_skprobe
    --answer=''EBT SK Probe'' --destination=web/modules/custom/ebt_skprobe.)'
  criteria: The generator wrote web/modules/custom/ebt_skprobe/ebt_skprobe.info.yml and web/modules/custom/ebt_skprobe/config/install/block_content.type.ebt_skprobe.yml
    (a scaffolded EBT block-type module). The module is left on disk, not enabled.
  bundle: ebt_core_starterkit
  rubric_ref: rubric/ebt_core_starterkit_ebt_sk_scaffold@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/ebt_core_starterkit-scaffold-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/ebt_core_starterkit-scaffold-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/ebt_core_starterkit-scaffold-verify.sh
