rubrics:
- id: ebt_core_remove_helper_ebt_rh_path
  version: '1.0'
  applicable_bundles:
  - ebt_core_remove_helper
  checks:
  - kind: must_contain_any
    values:
    - remove-ebt-blocks
    - /admin/structure/block/remove-ebt-blocks
  scoring:
    combine: all_pass
- id: ebt_core_remove_helper_ebt_rh_operations
  version: '1.0'
  applicable_bundles:
  - ebt_core_remove_helper
  checks:
  - kind: must_contain_any
    values:
    - field_ebt_settings
    - field storage
    - EBT blocks
  scoring:
    combine: all_pass
- id: ebt_core_remove_helper_ebt_rh_identify
  version: '1.0'
  applicable_bundles:
  - ebt_core_remove_helper
  checks:
  - kind: must_contain_any
    values:
    - ebt_
    - prefix
    - block_content
  scoring:
    combine: all_pass
- id: ebt_core_remove_helper_ebt_rh_known_types
  version: '1.0'
  applicable_bundles:
  - ebt_core_remove_helper
  checks:
  - kind: must_contain_any
    values:
    - ebt_rhprobe
  scoring:
    combine: all_pass
- id: ebt_core_remove_helper_ebt_rh_remove_blocks
  version: '1.0'
  applicable_bundles:
  - ebt_core_remove_helper
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
