metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: ebt_core_remove_helper
  version: 2.0.x
  note: 'Glue submodule of ebt_core. Provides one admin form route ebt_core_remove_helper.ebt_remove_helper
    at /admin/structure/block/remove-ebt-blocks (local task ''Remove All EBT Blocks'', permission administer
    site configuration). EbtRemoveHelperForm offers two operations: remove_all_ebt_blocks (Batch-deletes
    all block_content of ebt_-prefixed bundles) and remove_ebt_settings_field_storage (deletes field_ebt_settings
    storage only when no ebt_ block types remain). EBT content is identified by the ebt_ bundle machine-name
    prefix. No config/permissions/Drush/plugins of its own. As a glue module: 3 easy / 1 medium / 1 hard.
    medium introspects which block_content types are EBT-prefixed on the live site. hard: the agent removes
    the EBT block(s) of a specific namespaced EBT type (the module''s core purpose), verified against
    live block_content. Cases are scoped to a dedicated ebt_-prefixed block type so no other agents''
    content is touched.'
questions:
- id: ebt-rh-path
  input: In the Drupal ebt_core_remove_helper module, at what admin path is its 'Remove EBT Blocks' form,
    and what does the form let you do?
  criteria: 'The form is at /admin/structure/block/remove-ebt-blocks (route ebt_core_remove_helper.ebt_remove_helper,
    a local task ''Remove All EBT Blocks''). It offers two operations: Remove All EBT Blocks and Remove
    EBT Settings Field Storage.'
  bundle: ebt_core_remove_helper
  rubric_ref: rubric/ebt_core_remove_helper_ebt_rh_path@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: ebt-rh-operations
  input: What are the two operations offered by the ebt_core_remove_helper form in Drupal, and what does
    each do?
  criteria: 1) Remove All EBT Blocks — batch-deletes every block_content of ebt_-prefixed bundles. 2)
    Remove EBT Settings Field Storage — deletes the field_ebt_settings field storage, but only when no
    ebt_ block types remain.
  bundle: ebt_core_remove_helper
  rubric_ref: rubric/ebt_core_remove_helper_ebt_rh_operations@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: ebt-rh-identify
  input: How does the Drupal ebt_core_remove_helper module decide which blocks/block types count as 'EBT'
    ones to remove?
  criteria: It treats any block_content type whose machine name starts with the ebt_ prefix as an EBT
    block type (getAllEbtBlockTypes filters block_content_type storage by that prefix), and removes block_content
    entities of those bundles.
  bundle: ebt_core_remove_helper
  rubric_ref: rubric/ebt_core_remove_helper_ebt_rh_identify@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: ebt-rh-known-types
  input: On this Drupal site, the ebt_core_remove_helper module considers a block content type to be an
    'EBT' type by its machine-name prefix. Inspect the live site and give the machine name of the EBT-prefixed
    block content type that currently exists.
  criteria: The EBT-prefixed block content type is ebt_rhprobe (a block_content_type whose id starts with
    ebt_), discoverable by listing block_content_type entities and filtering for the ebt_ prefix.
  bundle: ebt_core_remove_helper
  rubric_ref: rubric/ebt_core_remove_helper_ebt_rh_known_types@1.0
