rubrics:
- id: kint_kint_dump_functions
  version: '1.0'
  applicable_bundles:
  - kint
  checks:
  - kind: must_contain_any
    values:
    - d()
    - s()
    - d(
    - twig
    - Twig
  scoring:
    combine: all_pass
- id: kint_kint_settings_and_permission
  version: '1.0'
  applicable_bundles:
  - kint
  checks:
  - kind: must_contain_any
    values:
    - /admin/config/development/kint
    - access kint dumps
  scoring:
    combine: all_pass
- id: kint_kint_early_and_theme
  version: '1.0'
  applicable_bundles:
  - kint
  checks:
  - kind: must_contain_any
    values:
    - early_enable
    - rich_theme
  scoring:
    combine: all_pass
- id: kint_kint_theme_known
  version: '1.0'
  applicable_bundles:
  - kint
  checks:
  - kind: must_contain_any
    values:
    - solarized-dark.css
    - solarized-dark
  scoring:
    combine: all_pass
- id: kint_kint_helper_known
  version: '1.0'
  applicable_bundles:
  - kint
  checks:
  - kind: must_contain_any
    values:
    - kdump
  scoring:
    combine: all_pass
- id: kint_kint_set_theme
  version: '1.0'
  applicable_bundles:
  - kint
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
- id: kint_kint_add_helper
  version: '1.0'
  applicable_bundles:
  - kint
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
