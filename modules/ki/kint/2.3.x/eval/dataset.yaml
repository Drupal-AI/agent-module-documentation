metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: kint
  version: 2.3.x
  note: 'Kint integrates the Kint PHP dumper. Global dump helpers d() (rich) and s() (plain) work in PHP
    and Twig; each helper is a kint.helper.<name> config object (prefix kint.helper.) with keys renderer
    (FQCN of a Kint renderer), cli_detection (bool), mode (default|exit|messenger). Ships kint.helper.d
    and kint.helper.s. Main settings in kint.settings: early_enable (bool, default false), date_format
    (string nullable, default ''[c]''), rich_theme (string, default ''original.css''), use_kint_trace_in_devel
    (bool, default true). Settings form at route kint.form (/admin/config/development/kint). Output gated
    by permission ''access kint dumps'' after auth (and early_enable before auth). Medium/hard cases read
    and write those real config objects (kint.settings and kint.helper.*).'
questions:
- id: kint-dump-functions
  input: After enabling the Kint module for Drupal, which dump helper functions does it give you to inspect
    variables, and can you use them in Twig templates?
  criteria: It provides the global d() (rich renderer) and s() (plain renderer) dump functions, usable
    in PHP and, via kint-twig, in Twig templates ({{ d(var) }}) when Twig development mode is on.
  bundle: kint
  rubric_ref: rubric/kint_kint_dump_functions@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: kint-settings-and-permission
  input: Where is the Kint settings page in a Drupal site, and which permission controls whether a user
    sees Kint dump output after logging in?
  criteria: Settings are at /admin/config/development/kint (route kint.form). After authentication, the
    'access kint dumps' permission controls whether dump output is shown.
  bundle: kint
  rubric_ref: rubric/kint_kint_settings_and_permission@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: kint-early-and-theme
  input: Which Kint config setting decides whether dumps are visible before a user authenticates, and
    which setting chooses the rich renderer's visual theme?
  criteria: early_enable (kint.settings) controls visibility of dumps before authentication; rich_theme
    (kint.settings) selects the rich renderer theme (e.g. original.css, solarized-dark.css, or a custom
    CSS path).
  bundle: kint
  rubric_ref: rubric/kint_kint_early_and_theme@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: kint-theme-known
  input: On this Drupal site, Kint's rich renderer theme has been customized. Inspect the live Kint configuration
    and report which rich renderer theme is currently selected.
  criteria: kint.settings:rich_theme is 'solarized-dark.css' (and early_enable is on). Read with `drush
    cget kint.settings rich_theme`.
  bundle: kint
  rubric_ref: rubric/kint_kint_theme_known@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/kint-theme-known-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/kint-theme-known-cleanup.sh
- id: kint-helper-known
  input: On this Drupal site, a custom Kint dump helper function has been configured in addition to the
    default d and s. Inspect the live Kint helper configuration and name the extra helper function.
  criteria: Besides kint.helper.d and kint.helper.s there is kint.helper.kdump, i.e. a custom dump function
    named kdump. List them with `drush config:status` / configFactory listAll('kint.helper.').
  bundle: kint
  rubric_ref: rubric/kint_kint_helper_known@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/kint-helper-known-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/kint-helper-known-cleanup.sh
- id: kint-set-theme
  input: On this Drupal site, configure Kint to use the 'Aante dark' rich renderer theme (aante-dark.css)
    and set the dump footer date format to '[Y-m-d]'. Apply the change to the live site.
  criteria: kint.settings has rich_theme 'aante-dark.css' and date_format '[Y-m-d]'.
  bundle: kint
  rubric_ref: rubric/kint_kint_set_theme@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/kint-set-theme-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/kint-set-theme-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/kint-set-theme-verify.sh
- id: kint-add-helper
  input: On this Drupal site, add a new Kint dump helper function named 'kdd' that behaves as a 'dump
    and die' (mode exit) using the Rich renderer. Apply the change to the live site.
  criteria: A config object kint.helper.kdd exists with mode 'exit' and renderer Kint\Renderer\RichRenderer
    (creating the global kdd() dump-and-die helper).
  bundle: kint
  rubric_ref: rubric/kint_kint_add_helper@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/kint-add-helper-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/kint-add-helper-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/kint-add-helper-verify.sh
