rubrics:
- id: type_tray_type_tray_categories_config
  version: '1.0'
  applicable_bundles:
  - type_tray
  checks:
  - kind: must_contain_any
    values:
    - type_tray.settings
    - key|label
    - /admin/config/content/type-tray/settings
  scoring:
    combine: all_pass
- id: type_tray_type_tray_per_type_settings
  version: '1.0'
  applicable_bundles:
  - type_tray
  checks:
  - kind: must_contain_any
    values:
    - third_party_settings
    - type_category
    - type_weight
    - type_icon
  scoring:
    combine: all_pass
- id: type_tray_type_tray_node_add_takeover
  version: '1.0'
  applicable_bundles:
  - type_tray
  checks:
  - kind: must_contain_any
    values:
    - node.add_page
    - route subscriber
    - RouteSubscriber
    - layout=
  scoring:
    combine: all_pass
- id: type_tray_type_tray_known_category
  version: '1.0'
  applicable_bundles:
  - type_tray
  checks:
  - kind: must_contain_any
    values:
    - tt_marketing
    - Marketing
  scoring:
    combine: all_pass
- id: type_tray_type_tray_fallback_label
  version: '1.0'
  applicable_bundles:
  - type_tray
  checks:
  - kind: must_contain_any
    values:
    - Other content
  scoring:
    combine: all_pass
- id: type_tray_type_tray_configure_categories
  version: '1.0'
  applicable_bundles:
  - type_tray
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
- id: type_tray_type_tray_existing_link
  version: '1.0'
  applicable_bundles:
  - type_tray
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
