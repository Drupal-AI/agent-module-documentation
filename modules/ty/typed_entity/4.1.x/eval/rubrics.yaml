rubrics:
- id: typed_entity_typed_entity_attribute
  version: '1.0'
  applicable_bundles:
  - typed_entity
  checks:
  - kind: must_contain_any
    values:
    - '#[TypedRepository'
    - TypedRepository
    - Plugin/TypedRepositories
  scoring:
    combine: all_pass
- id: typed_entity_typed_entity_manager_service
  version: '1.0'
  applicable_bundles:
  - typed_entity
  checks:
  - kind: must_contain_any
    values:
    - RepositoryManager
    - ->wrap(
    - wrap(
    - typed_entity_repository_manager
  scoring:
    combine: all_pass
- id: typed_entity_typed_entity_variants
  version: '1.0'
  applicable_bundles:
  - typed_entity
  checks:
  - kind: must_contain_any
    values:
    - ClassWithVariants
    - applies(
    - applies
    - negotiateVariant
  scoring:
    combine: all_pass
- id: typed_entity_typed_entity_registered_repos
  version: '1.0'
  applicable_bundles:
  - typed_entity
  checks:
  - kind: must_contain_any
    values:
    - node.article
    - node
    - article
  scoring:
    combine: all_pass
- id: typed_entity_typed_entity_article_variant_wrapper
  version: '1.0'
  applicable_bundles:
  - typed_entity
  checks:
  - kind: must_contain_any
    values:
    - BakingArticle
  scoring:
    combine: all_pass
- id: typed_entity_typed_entity_create_article
  version: '1.0'
  applicable_bundles:
  - typed_entity
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
- id: typed_entity_typed_entity_create_user
  version: '1.0'
  applicable_bundles:
  - typed_entity
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
