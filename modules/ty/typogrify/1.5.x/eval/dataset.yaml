metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: typogrify
  version: 1.5.x
  note: 'Typogrify provides a core text-format filter plugin (id: typogrify) plus a Twig |typogrify filter.
    There is no configure route (configure=null); you enable and tune it per text format under Text formats
    and editors. Its settings are stored at filter.format.<format> -> filters.typogrify.settings and covered
    by schema filter_settings.typogrify. Scalar toggles: smartypants_enabled, smartypants_hyphens (1/2/3),
    space_hyphens, wrap_ampersand, widont_enabled, space_to_nbsp, hyphenate_shy, wrap_abbr, wrap_caps,
    wrap_initial_quotes, wrap_numbers; serialized-map settings: ligatures, arrows, fractions, quotes.
    Medium/hard cases are grounded in real text-format config: introspection reads which format has typogrify
    enabled and a setting value; execution enables the filter on a format and sets space_hyphens. The
    Twig extension service is typogrify.twig_extension. Uses namespaced throwaway formats (typogrify_eval*).'
questions:
- id: typogrify-how-to-enable
  input: How do I switch on the typographic refinements from the typogrify module for content on my Drupal
    site? Is there a global settings page?
  criteria: 'There is no global settings page (configure=null). Typogrify is a text-format filter: edit
    a text format at Configuration -> Content authoring -> Text formats and editors, enable the ''Typogrify''
    filter, and set its per-filter options. It applies to any content rendered through that format.'
  bundle: typogrify
  rubric_ref: rubric/typogrify_typogrify_how_to_enable@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: typogrify-twig-filter
  input: Does typogrify offer a way to apply typographic refinements directly in a Twig template, and
    how would I apply just widow-prevention to a heading?
  criteria: Yes. The typogrify.twig_extension adds a |typogrify Twig filter. Use {{ title|typogrify(['widont'])
    }} to apply only widow prevention; {{ text|typogrify }} with no options applies the full default pipeline.
    Valid options are amp, widont, smartypants, caps, initial_quotes, dash.
  bundle: typogrify
  rubric_ref: rubric/typogrify_typogrify_twig_filter@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: typogrify-what-it-does
  input: Name several of the typographic refinements the typogrify filter can perform and a couple of
    the setting keys that toggle them.
  criteria: It can produce smart quotes and en/em dashes (smartypants_enabled, smartypants_hyphens), prevent
    widows (widont_enabled), wrap ampersands (wrap_ampersand) and capital runs (wrap_caps) in styled spans,
    wrap initial quotes (wrap_initial_quotes), add non-breaking spaces before punctuation (space_to_nbsp),
    and convert ligatures/arrows/fractions/quotes.
  bundle: typogrify
  rubric_ref: rubric/typogrify_typogrify_what_it_does@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: typogrify-which-format
  input: On this Drupal site, exactly one text format has the Typogrify filter enabled. Inspect the live
    filter-format configuration and tell me the machine name of that text format.
  criteria: The text format 'typogrify_eval' has the Typogrify filter enabled (filter.format.typogrify_eval
    -> filters.typogrify.status = true).
  bundle: typogrify
  rubric_ref: rubric/typogrify_typogrify_which_format@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/typogrify-format-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/typogrify-format-cleanup.sh
- id: typogrify-dash-mode
  input: On this site the text format 'typogrify_eval2' has the Typogrify filter enabled with a specific
    dash-replacement mode configured. Inspect the live configuration and tell me the value of the Typogrify
    dash setting (smartypants_hyphens) on that format.
  criteria: smartypants_hyphens is 2 on filter.format.typogrify_eval2 -> filters.typogrify.settings (mode
    2 = '---' for em-dashes, '--' for en-dashes).
  bundle: typogrify
  rubric_ref: rubric/typogrify_typogrify_dash_mode@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/typogrify-dashmode-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/typogrify-dashmode-cleanup.sh
- id: typogrify-enable-on-format
  input: On this Drupal site there is a text format with machine name 'typogrify_eval_h' that does not
    yet use Typogrify. Enable the Typogrify filter on that text format and apply the change to the live
    site.
  criteria: Enable the typogrify filter on filter.format.typogrify_eval_h, e.g. $f = FilterFormat::load('typogrify_eval_h');
    $f->setFilterConfig('typogrify', ['status' => TRUE, 'weight' => 10])->save(); so filters.typogrify.status
    is true.
  bundle: typogrify
  rubric_ref: rubric/typogrify_typogrify_enable_on_format@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/typogrify-enable-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/typogrify-enable-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/typogrify-enable-verify.sh
- id: typogrify-set-space-hyphens
  input: On this Drupal site the text format 'typogrify_eval_h2' already has the Typogrify filter enabled.
    Configure that filter so it also replaces stand-alone dashes (a normal dash surrounded by spaces)
    with em-dashes. Apply the change to the live site.
  criteria: Set the Typogrify filter's space_hyphens setting to 1 on filter.format.typogrify_eval_h2 (filters.typogrify.settings.space_hyphens
    = 1), e.g. via setFilterConfig('typogrify', ['status'=>TRUE,'weight'=>10,'settings'=>['space_hyphens'=>1]])->save().
  bundle: typogrify
  rubric_ref: rubric/typogrify_typogrify_set_space_hyphens@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/typogrify-spacehyphens-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/typogrify-spacehyphens-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/typogrify-spacehyphens-verify.sh
