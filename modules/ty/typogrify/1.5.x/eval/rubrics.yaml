rubrics:
- id: typogrify_typogrify_how_to_enable
  version: '1.0'
  applicable_bundles:
  - typogrify
  checks:
  - kind: must_contain_any
    values:
    - text format
    - text formats
    - filter
    - typogrify
    - Content authoring
  scoring:
    combine: all_pass
- id: typogrify_typogrify_twig_filter
  version: '1.0'
  applicable_bundles:
  - typogrify
  checks:
  - kind: must_contain_any
    values:
    - '|typogrify'
    - typogrify
    - widont
    - twig
  scoring:
    combine: all_pass
- id: typogrify_typogrify_what_it_does
  version: '1.0'
  applicable_bundles:
  - typogrify
  checks:
  - kind: must_contain_any
    values:
    - smartypants
    - widont
    - ampersand
    - wrap_caps
    - quotation
    - wrap_ampersand
    - smartypants_enabled
  scoring:
    combine: all_pass
- id: typogrify_typogrify_which_format
  version: '1.0'
  applicable_bundles:
  - typogrify
  checks:
  - kind: must_contain_any
    values:
    - typogrify_eval
  scoring:
    combine: all_pass
- id: typogrify_typogrify_dash_mode
  version: '1.0'
  applicable_bundles:
  - typogrify
  checks:
  - kind: must_contain_any
    values:
    - '2'
  scoring:
    combine: all_pass
- id: typogrify_typogrify_enable_on_format
  version: '1.0'
  applicable_bundles:
  - typogrify
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
- id: typogrify_typogrify_set_space_hyphens
  version: '1.0'
  applicable_bundles:
  - typogrify
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
