metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: easy_encryption_admin
  version: 1.0.x
  note: Optional submodule of Easy Encryption. Adds a UI for key transfer (list/export/import) and private-key
    migration. Keys list at /admin/config/system/easy-encryption/keys (route easy_encryption_admin.keys,
    the configure route); import (easy_encryption_admin.keys_import), export (keys_export), migrate private
    key (migrate_private_key). All gated by permission 'administer easy encryption keys' (restrict access).
    Requires easy_encryption. No config schema/Drush/plugins. Introspection reads which role has the permission;
    execution grants the permission to a role and ensures the module is enabled. Namespaced roles (eea_*),
    no node operations.
questions:
- id: easy_encryption_admin-perm-route
  input: The easy_encryption_admin module adds an admin UI for Easy Encryption keys. Which permission
    controls access to it, and at what admin path is the keys page?
  criteria: The 'administer easy encryption keys' permission (restrict access) gates it. The keys list
    is at /admin/config/system/easy-encryption/keys (route easy_encryption_admin.keys, the module's configure
    route).
  bundle: easy_encryption_admin
  rubric_ref: rubric/easy_encryption_admin_easy_encryption_admin_perm_route@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: easy_encryption_admin-what
  input: What can you do from the easy_encryption_admin UI?
  criteria: List known encryption keys with usage counts, export a key as a portable package and import
    a key package (key transfer, optionally activating it), and migrate the active private key from the
    database to the filesystem.
  bundle: easy_encryption_admin
  rubric_ref: rubric/easy_encryption_admin_easy_encryption_admin_what@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: easy_encryption_admin-import
  input: How do I move an Easy Encryption encryption key to another site using the easy_encryption_admin
    UI?
  criteria: On the source site, use the Export operation on the keys page to download the key package;
    on the target site, use the Import encryption key form (route easy_encryption_admin.keys_import) to
    import that package, optionally activating it. Then deploy the config with the encrypted Key entities.
  bundle: easy_encryption_admin
  rubric_ref: rubric/easy_encryption_admin_easy_encryption_admin_import@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: easy_encryption_admin-known-role
  input: On this Drupal site a role has been given the permission to manage Easy Encryption keys (the
    easy_encryption_admin keys UI). Inspect the live roles and give the machine name of the role that
    can administer Easy Encryption keys.
  criteria: The role eea_operator has the 'administer easy encryption keys' permission.
  bundle: easy_encryption_admin
  rubric_ref: rubric/easy_encryption_admin_easy_encryption_admin_known_role@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/easy_encryption_admin-known-role-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/easy_encryption_admin-known-role-cleanup.sh
- id: easy_encryption_admin-known-perm
  input: On this Drupal site the role eea_viewer has been granted access to the Easy Encryption keys admin
    UI. Inspect the live site and state the exact permission machine name that grants that access.
  criteria: The permission is 'administer easy encryption keys' (granted to role eea_viewer).
  bundle: easy_encryption_admin
  rubric_ref: rubric/easy_encryption_admin_easy_encryption_admin_known_perm@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/easy_encryption_admin-known-perm-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/easy_encryption_admin-known-perm-cleanup.sh
- id: easy_encryption_admin-grant-role
  input: On this Drupal site, create a role with machine name eea_keymanager and grant it the permission
    that lets it use the Easy Encryption keys admin UI (import/export keys). Apply it to the live site.
  criteria: Create Role eea_keymanager and grant it 'administer easy encryption keys' (Role::create(['id'=>'eea_keymanager',...])->grantPermission('administer
    easy encryption keys')->save()).
  bundle: easy_encryption_admin
  rubric_ref: rubric/easy_encryption_admin_easy_encryption_admin_grant_role@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/easy_encryption_admin-grant-role-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/easy_encryption_admin-grant-role-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/easy_encryption_admin-grant-role-verify.sh
- id: easy_encryption_admin-ensure-enabled
  input: On this Drupal site I want to be able to import and export my encryption keys from the admin
    screens instead of the command line. Make sure the module that provides that Easy Encryption keys
    admin UI is turned on.
  criteria: Enable the easy_encryption_admin module (drush en easy_encryption_admin -y). It provides the
    keys UI at /admin/config/system/easy-encryption/keys (route easy_encryption_admin.keys) for import/export
    and private-key migration.
  bundle: easy_encryption_admin
  rubric_ref: rubric/easy_encryption_admin_easy_encryption_admin_ensure_enabled@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-layman
    reset: agent-module-documentation/evaluation/verify/easy_encryption_admin-enabled-reset.sh
    verify: agent-module-documentation/evaluation/verify/easy_encryption_admin-enabled-verify.sh
