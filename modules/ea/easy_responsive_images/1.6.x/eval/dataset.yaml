metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: easy_responsive_images
  version: 1.6.x
  note: Easy Responsive Images generates image styles named responsive_<width>w (scale), responsive_<w>_<h>_<width>w
    (aspect crop) and responsive_<height>h (fixed height) from a settings form at /admin/config/media/image-styles/generate
    (config easy_responsive_images.settings; only shipped default is lazy_loading_threshold=1250). Output
    via the easy_responsive_images field formatter (image fields) or the image_url Twig filter. Medium
    cases read back known config (maximum_width=1600) and generated styles (responsive_320w/640w). Hard
    cases (1) generate responsive_300w/600w/900w scale styles (image_scale effect at matching width) and
    (2) switch an image field's view-display formatter to easy_responsive_images. Fixtures are namespaced
    (field_erim_img); the responsive_* style names are the module's own fixed naming and are removed by
    reset/cleanup by exact name.
questions:
- id: easy_responsive_images-generate-naming
  input: Using the easy_responsive_images module, how do I generate a set of responsive image styles,
    and what are the generated image styles named?
  criteria: Go to /admin/config/media/image-styles/generate, enter a min/max width, a step and optional
    aspect ratios, and save. It creates styles named responsive_<width>w (scale), responsive_<w>_<h>_<width>w
    (aspect-ratio crop) and responsive_<height>h.
  bundle: easy_responsive_images
  rubric_ref: rubric/easy_responsive_images_easy_responsive_images_generate_naming@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: easy_responsive_images-twig-filter
  input: In a custom Twig template, how do I build a URL to one of the responsive image styles created
    by easy_responsive_images from a file URI?
  criteria: 'Use the image_url Twig filter: {{ file.uri.value|image_url(''responsive_16_9_550w'') }}.
    It returns the derivative URL (WebP/Avif when those modules are installed).'
  bundle: easy_responsive_images
  rubric_ref: rubric/easy_responsive_images_easy_responsive_images_twig_filter@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: easy_responsive_images-formatter
  input: Which field formatter does easy_responsive_images provide for image fields, and what are its
    main display options?
  criteria: The 'Easy Responsive Images' formatter (id easy_responsive_images) for image fields, with
    options image_handling (scale or aspect_ratio), aspect_ratio, multiplier (1x-4x) and cover. It emits
    a data-srcset and the resizer JS loads the best derivative.
  bundle: easy_responsive_images
  rubric_ref: rubric/easy_responsive_images_easy_responsive_images_formatter@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: easy_responsive_images-known-maxwidth
  input: On this site, easy_responsive_images has been configured with a specific width range for style
    generation. Inspect the live configuration and state the maximum image width it is set to generate
    up to.
  criteria: maximum_width = 1600 in easy_responsive_images.settings (min 400, step 400, aspect ratios
    16:9).
  bundle: easy_responsive_images
  rubric_ref: rubric/easy_responsive_images_easy_responsive_images_known_maxwidth@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/easy_responsive_images-config-maxwidth-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/easy_responsive_images-config-maxwidth-cleanup.sh
- id: easy_responsive_images-styles-present
  input: Which responsive image styles generated by easy_responsive_images currently exist on this site?
    Inspect the live image styles and name them.
  criteria: responsive_320w and responsive_640w (scale styles with an image_scale effect).
  bundle: easy_responsive_images
  rubric_ref: rubric/easy_responsive_images_easy_responsive_images_styles_present@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/easy_responsive_images-styles-present-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/easy_responsive_images-styles-present-cleanup.sh
- id: easy_responsive_images-generate-scale
  input: Using easy_responsive_images, generate responsive scale image styles for widths from 300 to 900
    pixels in steps of 300 (i.e. 300, 600 and 900), applying the change to the live site.
  criteria: Image styles responsive_300w, responsive_600w and responsive_900w exist, each with an image_scale
    effect at width 300/600/900 (e.g. set minimum_width=300, maximum_width=900, threshold_width=300 and
    generate, or create the styles directly).
  bundle: easy_responsive_images
  rubric_ref: rubric/easy_responsive_images_easy_responsive_images_generate_scale@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/easy_responsive_images-generate-scale-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/easy_responsive_images-generate-scale-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/easy_responsive_images-generate-scale-verify.sh
- id: easy_responsive_images-set-formatter
  input: The Article content type has an image field field_erim_img. Configure its default display so
    the image is output responsively using the easy_responsive_images field formatter, and apply the change
    to the live site.
  criteria: In core.entity_view_display.node.article.default the field_erim_img component uses type 'easy_responsive_images'
    (set via Manage display or the entity_view_display component).
  bundle: easy_responsive_images
  rubric_ref: rubric/easy_responsive_images_easy_responsive_images_set_formatter@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/easy_responsive_images-formatter-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/easy_responsive_images-formatter-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/easy_responsive_images-formatter-verify.sh
