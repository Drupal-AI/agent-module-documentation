rubrics:
- id: easy_responsive_images_easy_responsive_images_generate_naming
  version: '1.0'
  applicable_bundles:
  - easy_responsive_images
  checks:
  - kind: must_contain_any
    values:
    - responsive_
    - image-styles/generate
    - Generate image styles
  scoring:
    combine: all_pass
- id: easy_responsive_images_easy_responsive_images_twig_filter
  version: '1.0'
  applicable_bundles:
  - easy_responsive_images
  checks:
  - kind: must_contain_any
    values:
    - image_url
    - '|image_url'
  scoring:
    combine: all_pass
- id: easy_responsive_images_easy_responsive_images_formatter
  version: '1.0'
  applicable_bundles:
  - easy_responsive_images
  checks:
  - kind: must_contain_any
    values:
    - easy_responsive_images
    - image_handling
    - aspect_ratio
    - multiplier
  scoring:
    combine: all_pass
- id: easy_responsive_images_easy_responsive_images_known_maxwidth
  version: '1.0'
  applicable_bundles:
  - easy_responsive_images
  checks:
  - kind: must_contain_any
    values:
    - '1600'
  scoring:
    combine: all_pass
- id: easy_responsive_images_easy_responsive_images_styles_present
  version: '1.0'
  applicable_bundles:
  - easy_responsive_images
  checks:
  - kind: must_contain_any
    values:
    - responsive_320w
    - responsive_640w
  scoring:
    combine: all_pass
- id: easy_responsive_images_easy_responsive_images_generate_scale
  version: '1.0'
  applicable_bundles:
  - easy_responsive_images
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
- id: easy_responsive_images_easy_responsive_images_set_formatter
  version: '1.0'
  applicable_bundles:
  - easy_responsive_images
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
