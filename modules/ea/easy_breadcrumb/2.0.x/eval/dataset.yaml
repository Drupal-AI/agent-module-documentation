metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: easy_breadcrumb
  version: 2.0.x
  note: Easy Breadcrumb is configured entirely through one settings form (config object `easy_breadcrumb.settings`)
    with no plugin types, hooks API, or Drush commands, so all cases are `recipe` (response-graded), not
    `execution` (live-state).
questions:
- id: easybreadcrumb-mechanism
  input: On a Drupal 11 site, how does the Easy Breadcrumb module override the site's core breadcrumb,
    and what does it build each crumb from? Name the mechanism.
  criteria: It registers a high-priority breadcrumb_builder service (Drupal\easy_breadcrumb\EasyBreadcrumbBuilder)
    that replaces the core system breadcrumb and constructs each crumb from the current URL / path-alias
    segments plus the real page title.
  bundle: easy_breadcrumb
  rubric_ref: rubric/easy_breadcrumb_easybreadcrumb_mechanism@1.0
  tags:
  - mode:recipe
- id: easybreadcrumb-config-object
  input: Which Drupal config object stores all of Easy Breadcrumb's settings, and what drush command reads
    its current values?
  criteria: All settings live in the easy_breadcrumb.settings config object; read them with `drush config:get
    easy_breadcrumb.settings`.
  bundle: easy_breadcrumb
  rubric_ref: rubric/easy_breadcrumb_easybreadcrumb_config_object@1.0
  tags:
  - mode:recipe
- id: easybreadcrumb-admin-route
  input: Where is the Easy Breadcrumb configuration form on a Drupal site — give the admin URL path and
    the route name.
  criteria: 'At Admin > Configuration > User interface > Easy Breadcrumb: path /admin/config/user-interface/easy-breadcrumb,
    route easy_breadcrumb.general_settings_form.'
  bundle: easy_breadcrumb
  rubric_ref: rubric/easy_breadcrumb_easybreadcrumb_admin_route@1.0
  tags:
  - mode:recipe
- id: easybreadcrumb-permission
  input: Which permission gates access to the Easy Breadcrumb settings form on a Drupal site? Give its
    exact machine name.
  criteria: The 'administer easy breadcrumb' permission (declared in easy_breadcrumb.permissions.yml)
    is the only permission; it controls who may change the configuration.
  bundle: easy_breadcrumb
  rubric_ref: rubric/easy_breadcrumb_easybreadcrumb_permission@1.0
  tags:
  - mode:recipe
- id: easybreadcrumb-title-segment
  input: I want Easy Breadcrumb to append the current page title as the last breadcrumb crumb, and I want
    that final crumb to be a clickable link. Which `easy_breadcrumb.settings` keys control these two behaviors?
  criteria: include_title_segment (append the page title as the last crumb, default true) and title_segment_as_link
    (render that current-page crumb as a link, default false).
  bundle: easy_breadcrumb
  rubric_ref: rubric/easy_breadcrumb_easybreadcrumb_title_segment@1.0
  tags:
  - mode:recipe
- id: easybreadcrumb-home-segment
  input: In Easy Breadcrumb, which setting turns the leading Home crumb on or off, and which setting changes
    its label text (e.g. rename 'Home' to 'Start')?
  criteria: include_home_segment toggles the leading Home crumb (default true); home_segment_title sets
    its label (default 'Home').
  bundle: easy_breadcrumb
  rubric_ref: rubric/easy_breadcrumb_easybreadcrumb_home_segment@1.0
  tags:
  - mode:recipe
- id: easybreadcrumb-capitalization
  input: I want Easy Breadcrumb to capitalize each word of every breadcrumb segment. Which setting key
    controls segment casing, and what are its allowed values?
  criteria: capitalizator_mode controls casing; allowed values are none, ucfirst, ucwords (capitalize
    each word, the default), and ucall. Related keys include capitalizator_ignored_words and capitalizator_forced_words.
  bundle: easy_breadcrumb
  rubric_ref: rubric/easy_breadcrumb_easybreadcrumb_capitalization@1.0
  tags:
  - mode:recipe
- id: easybreadcrumb-json-ld
  input: I need Easy Breadcrumb to emit BreadcrumbList JSON-LD structured data into the page head for
    SEO. Which `easy_breadcrumb.settings` key enables this?
  criteria: Set add_structured_data_json_ld to true (default false); it attaches a <script type="application/ld+json">
    BreadcrumbList to the system_breadcrumb_block output.
  bundle: easy_breadcrumb
  rubric_ref: rubric/easy_breadcrumb_easybreadcrumb_json_ld@1.0
  tags:
  - mode:recipe
