rubrics:
- id: easy_email_override_eeo_mechanism
  version: '1.0'
  applicable_bundles:
  - easy_email_override
  checks:
  - kind: must_contain_any
    values:
    - plugin.manager.mail
    - decorat
    - MailManager
  scoring:
    combine: all_pass
- id: easy_email_override_eeo_override_entity
  version: '1.0'
  applicable_bundles:
  - easy_email_override
  checks:
  - kind: must_contain_any
    values:
    - module
    - key
    - easy_email_type
    - param_map
    - copied_fields
  scoring:
    combine: all_pass
- id: easy_email_override_eeo_password_reset
  version: '1.0'
  applicable_bundles:
  - easy_email_override
  checks:
  - kind: must_contain_any
    values:
    - password_reset
    - user
  scoring:
    combine: all_pass
- id: easy_email_override_eeo_declare_email
  version: '1.0'
  applicable_bundles:
  - easy_email_override
  checks:
  - kind: must_contain_any
    values:
    - emails.yml
    - label
    - module
    - key
  scoring:
    combine: all_pass
- id: easy_email_override_eeo_configure_route
  version: '1.0'
  applicable_bundles:
  - easy_email_override
  checks:
  - kind: must_contain_any
    values:
    - email-templates/overrides
    - entity.easy_email_override.collection
    - administer site configuration
  scoring:
    combine: all_pass
- id: easy_email_override_eeo_plugin_manager
  version: '1.0'
  applicable_bundles:
  - easy_email_override
  checks:
  - kind: must_contain_any
    values:
    - plugin.manager.easy_email_override
    - DeclaredEmailManager
  scoring:
    combine: all_pass
