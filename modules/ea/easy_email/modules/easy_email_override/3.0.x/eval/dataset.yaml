metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: easy_email_override
  version: 3.0.x
  note: easy_email_override replaces core/contrib emails with Easy Email templates via a mail-manager
    decorator and an easy_email_override config entity, with overridable emails declared as emails.yml
    plugins. Cases are `recipe` (response-graded) probing documented facts; no site mutation.
questions:
- id: eeo-mechanism
  input: How does Easy Email Overrides replace a core module's email with an Easy Email template at runtime?
  criteria: It decorates the core plugin.manager.mail service (MailManager decorator); on each mail()
    call it checks for an easy_email_override config entity matching the mail's module + key and, if found,
    builds and sends an Easy Email from the mapped template instead.
  bundle: easy_email_override
  rubric_ref: rubric/easy_email_override_eeo_mechanism@1.0
  tags:
  - mode:recipe
- id: eeo-override-entity
  input: What does an easy_email_override config entity store to map a core email onto an Easy Email template?
  criteria: It stores the target module and key, the easy_email_type template to use, a param_map ({source,
    destination} mapping original mail params onto template fields), and copied_fields booleans (from,
    reply_to, to, cc, bcc, subject, body_html, body_plain, attachments) controlling which parts come from
    the original mail vs the template.
  bundle: easy_email_override
  rubric_ref: rubric/easy_email_override_eeo_override_entity@1.0
  tags:
  - mode:recipe
- id: eeo-password-reset
  input: I want to send the Drupal user password-reset email as branded HTML. Can Easy Email Overrides
    do this, and what module/key does it target?
  criteria: Yes — the submodule declares the user password_reset email (module user, key password_reset)
    as overridable; create an easy_email_override mapping it to an easy_email_type template.
  bundle: easy_email_override
  rubric_ref: rubric/easy_email_override_eeo_password_reset@1.0
  tags:
  - mode:recipe
- id: eeo-declare-email
  input: In my custom module, how do I declare one of my emails so site builders can override it with
    an Easy Email template? Which file and required keys?
  criteria: Ship a {module}.emails.yml file declaring the email with required properties label, module,
    and key (plus optional params, e.g. entity:user, and weight). The DeclaredEmailManager (plugin.manager.easy_email_override)
    discovers it.
  bundle: easy_email_override
  rubric_ref: rubric/easy_email_override_eeo_declare_email@1.0
  tags:
  - mode:recipe
- id: eeo-configure-route
  input: Where in the admin UI are Easy Email overrides managed, and what permission gates them?
  criteria: At Admin → Structure → Email templates → Overrides (/admin/structure/email-templates/overrides,
    route entity.easy_email_override.collection). Access is gated by core 'administer site configuration';
    the submodule defines no permissions of its own.
  bundle: easy_email_override
  rubric_ref: rubric/easy_email_override_eeo_configure_route@1.0
  tags:
  - mode:recipe
- id: eeo-plugin-manager
  input: Which service lists all emails currently declared as overridable in Easy Email Overrides?
  criteria: The plugin.manager.easy_email_override service (DeclaredEmailManager); getDefinitions() returns
    all declared emails whose module is enabled.
  bundle: easy_email_override
  rubric_ref: rubric/easy_email_override_eeo_plugin_manager@1.0
  tags:
  - mode:recipe
