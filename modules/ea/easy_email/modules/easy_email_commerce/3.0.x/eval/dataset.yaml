metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: easy_email_commerce
  version: 3.0.x
  note: 'easy_email_commerce is an integration submodule of easy_email: it adds commerce_order email tokens
    and declares the Commerce order-receipt email. Cases are `recipe` (response-graded) probing documented
    facts; no site mutation.'
questions:
- id: eec-purpose
  input: What does the Easy Email Commerce submodule do and what does it depend on?
  criteria: 'It integrates Easy Email with Drupal Commerce: adds commerce_order email tokens and declares
    the Commerce order_receipt email as an override target. Depends on easy_email, commerce_order, and
    commerce_price.'
  bundle: easy_email_commerce
  rubric_ref: rubric/easy_email_commerce_eec_purpose@1.0
  tags:
  - mode:recipe
- id: eec-order-token
  input: Which token renders a whole Commerce order as HTML suitable for an Easy Email body?
  criteria: '[commerce_order:easy_email_html] renders the whole order as email-ready HTML (with an easy_email_plain
    plain-text variant).'
  bundle: easy_email_commerce
  rubric_ref: rubric/easy_email_commerce_eec_order_token@1.0
  tags:
  - mode:recipe
- id: eec-partial-tokens
  input: In an Easy Email Commerce order email, how do I render just the order items table, the billing
    address, and the totals separately?
  criteria: 'Use the granular commerce_order tokens: easy_email_order_items_html/_plain (items), easy_email_billing_profile_html/_plain
    (billing address), and easy_email_totals_html/_plain (totals). Shipping-profile and payment-method
    variants also exist.'
  bundle: easy_email_commerce
  rubric_ref: rubric/easy_email_commerce_eec_partial_tokens@1.0
  tags:
  - mode:recipe
- id: eec-declared-receipt
  input: How does Easy Email Commerce let me replace Commerce's built-in order receipt email, and what
    parameter does that declared email carry?
  criteria: It declares a commerce.order_receipt email (key order_receipt, module commerce) with an order
    param of type entity:commerce_order, which the easy_email_override submodule can map to an easy_email_type
    template to override the default receipt.
  bundle: easy_email_commerce
  rubric_ref: rubric/easy_email_commerce_eec_declared_receipt@1.0
  tags:
  - mode:recipe
- id: eec-provides
  input: Does the Easy Email Commerce submodule define its own entities, permissions, or config UI?
  criteria: No — it defines no entities, permissions, routes, or services of its own (configure is null).
    It only provides commerce_order email tokens (plus their Twig templates) and the declared order_receipt
    email.
  bundle: easy_email_commerce
  rubric_ref: rubric/easy_email_commerce_eec_provides@1.0
  tags:
  - mode:recipe
- id: eec-theming
  input: How do I restyle the rendered Commerce order that appears in an Easy Email Commerce email?
  criteria: Override the module's Twig templates (templates/easy-email-commerce-*.html.twig, theme hooks
    like easy_email_commerce_order_html) in your theme to restyle the order, items, addresses, payment
    method, and totals.
  bundle: easy_email_commerce
  rubric_ref: rubric/easy_email_commerce_eec_theming@1.0
  tags:
  - mode:recipe
