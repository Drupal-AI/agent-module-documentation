metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: easy_email
  version: 3.0.x
  note: Easy Email exposes an easy_email_type config template, an easy_email content entity, a handler/evaluator
    service API, tokens/attachments/cc-bcc, a preview/send flow, a Drush purge command, and a permission
    set. Cases are `recipe` (response-graded) probing documented facts an agent would otherwise read source
    to answer; no site mutation.
questions:
- id: easy-email-two-entities
  input: In Easy Email on Drupal 11, what are the two entity types involved in sending an email and how
    do they relate? Give their machine names and which is config vs content.
  criteria: 'easy_email_type is a config entity (the reusable template/bundle: subject, body, cc/bcc,
    attachments); easy_email is a revisionable content entity representing one actual email, whose bundle
    is an easy_email_type.'
  bundle: easy_email
  rubric_ref: rubric/easy_email_easy_email_two_entities@1.0
  tags:
  - mode:recipe
- id: easy-email-send-in-code
  input: On a Drupal 11 site with Easy Email, programmatically create and send an email from a template
    with machine id 'my_template'. Which service and methods do I use?
  criteria: 'Use the easy_email.handler service (EmailHandler): createEmail([''type'' => ''my_template''])
    then sendEmail($email). preview() previews without sending; duplicateExists() guards against duplicate
    sends.'
  bundle: easy_email
  rubric_ref: rubric/easy_email_easy_email_send_in_code@1.0
  tags:
  - mode:recipe
- id: easy-email-preview
  input: How can I preview an Easy Email template's rendered output (HTML and plain text) before sending
    it, both in the UI and in code?
  criteria: In the UI use the template preview route entity.easy_email_type.preview (.../templates/{id}/preview)
    with preview_html / preview_plain variants; in code call EmailHandler::preview($email).
  bundle: easy_email
  rubric_ref: rubric/easy_email_easy_email_preview@1.0
  tags:
  - mode:recipe
- id: easy-email-tokens-cc-bcc
  input: In an Easy Email template, can I use tokens in the recipient/CC/BCC and subject fields, and how
    do I set CC and BCC? What module dependency provides tokens?
  criteria: Yes — every template field (recipient, cc, bcc, subject, body, from, attachment) supports
    token replacement via the required token module. The template config has recipient, cc, and bcc sequences;
    the entity has setCCAddresses()/setBCCAddresses() and id-based variants.
  bundle: easy_email
  rubric_ref: rubric/easy_email_easy_email_tokens_cc_bcc@1.0
  tags:
  - mode:recipe
- id: easy-email-attachments
  input: How do Easy Email dynamic attachments work and how is attachment security configured globally?
  criteria: 'Attachments are specified per template by token or relative path (attachment sequence, with
    attachmentScheme/attachmentDirectory for saved copies). Global security lives on easy_email.settings:
    allowed/blocked_attachment_extensions, allowed/blocked_attachment_mime_types, allowed_attachment_paths,
    max_attachment_size (default 10.0 MB).'
  bundle: easy_email
  rubric_ref: rubric/easy_email_easy_email_attachments@1.0
  tags:
  - mode:recipe
- id: easy-email-log-purge
  input: Easy Email logs every sent email. How is the email log purged of old entries, and what config
    controls automatic purging?
  criteria: Sent emails are logged as easy_email entities (Admin → Reports → Email log). The easy_email.purger
    service purges old ones; easy_email.settings keys purge_on_cron (default true) and purge_cron_limit
    (50) control cron purging, and a Drush purge command (PurgeCommands) runs it on demand.
  bundle: easy_email
  rubric_ref: rubric/easy_email_easy_email_log_purge@1.0
  tags:
  - mode:recipe
- id: easy-email-permissions
  input: Which Easy Email permission gates administering email templates, and which gates viewing all
    logged (sent) emails?
  criteria: '''administer email types'' gates creating/editing/deleting email templates (easy_email_type);
    ''view all email entities'' gates viewing all logged emails in the email log.'
  bundle: easy_email
  rubric_ref: rubric/easy_email_easy_email_permissions@1.0
  tags:
  - mode:recipe
- id: easy-email-mailer-requirement
  input: What additional module must be enabled for Easy Email to actually deliver HTML emails on Drupal
    11?
  criteria: An HTML mailer module — Symfony Mailer or Symfony Mailer Lite (only one is needed) — must
    be enabled alongside Easy Email.
  bundle: easy_email
  rubric_ref: rubric/easy_email_easy_email_mailer_requirement@1.0
  tags:
  - mode:recipe
