rubrics:
- id: breadcrumb_extra_field_breadcrumb_extra_field_what
  version: '1.0'
  applicable_bundles:
  - breadcrumb_extra_field
  checks:
  - kind: must_contain_any
    values:
    - extra field
    - Manage display
    - between fields
    - pseudo
  scoring:
    combine: all_pass
- id: breadcrumb_extra_field_breadcrumb_extra_field_setup_steps
  version: '1.0'
  applicable_bundles:
  - breadcrumb_extra_field
  checks:
  - kind: must_contain_any
    values:
    - /admin/config/system/breadcrumb-extra-field
    - Manage display
    - breadcrumb_extra_field.settings
  scoring:
    combine: all_pass
- id: breadcrumb_extra_field_breadcrumb_extra_field_config_key
  version: '1.0'
  applicable_bundles:
  - breadcrumb_extra_field
  checks:
  - kind: must_contain_any
    values:
    - administer breadcrumb extra field
    - breadcrumb_extra_field_admin
  scoring:
    combine: all_pass
- id: breadcrumb_extra_field_breadcrumb_extra_field_enabled_bundle
  version: '1.0'
  applicable_bundles:
  - breadcrumb_extra_field
  checks:
  - kind: must_contain_any
    values:
    - article
  scoring:
    combine: all_pass
- id: breadcrumb_extra_field_breadcrumb_extra_field_enable_page
  version: '1.0'
  applicable_bundles:
  - breadcrumb_extra_field
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
- id: breadcrumb_extra_field_breadcrumb_extra_field_place_field
  version: '1.0'
  applicable_bundles:
  - breadcrumb_extra_field
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
