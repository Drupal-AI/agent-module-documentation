metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: breadcrumb_extra_field
  version: 4.0.x
  note: 'Breadcrumb Extra Field exposes the site breadcrumb as a display extra field (''breadcrumb'')
    so it can be positioned among fields on Manage display. Setup is two steps: (1) enable an entity type/bundle
    in config breadcrumb_extra_field.settings:breadcrumb_extra_field_admin (nested map entity_type ->
    {bundle -> bundle|0}) via the form at /admin/config/system/breadcrumb-extra-field (perm ''administer
    breadcrumb extra field''); hook_entity_extra_field_info then exposes the hidden ''breadcrumb'' display
    extra field; (2) place that field on the entity_view_display (setComponent ''breadcrumb''). hook_entity_view
    renders it from the core ''breadcrumb'' service. Changing the config must invalidate the entity_field_info
    cache tag. No storage/plugins/services/Drush. Medium reads back which bundle is enabled; hard cases
    enable node/page in config and place the field on the Article display, verified live.'
questions:
- id: breadcrumb_extra_field-what
  input: What does the breadcrumb_extra_field Drupal module let you do that the theme's normal breadcrumb
    region does not, and how does the breadcrumb become positionable?
  criteria: It adds the site breadcrumb as a display extra field ('Breadcrumb') on selected entity bundles,
    so you can drag it into any position on the entity's Manage display and print the breadcrumb between
    fields instead of only in the theme's fixed breadcrumb region.
  bundle: breadcrumb_extra_field
  rubric_ref: rubric/breadcrumb_extra_field_breadcrumb_extra_field_what@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: breadcrumb_extra_field-setup-steps
  input: After enabling breadcrumb_extra_field, what are the steps to actually show the breadcrumb field
    on an Article page? Where is the settings form?
  criteria: 'Two steps: (1) on the settings form at /admin/config/system/breadcrumb-extra-field, tick
    the entity type/bundle (e.g. node/Article) to enable the extra field; (2) on the Article Manage display,
    drag the now-available ''Breadcrumb'' field out of Disabled into the content region and save.'
  bundle: breadcrumb_extra_field
  rubric_ref: rubric/breadcrumb_extra_field_breadcrumb_extra_field_setup_steps@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: breadcrumb_extra_field-config-key
  input: Which permission gates the breadcrumb_extra_field settings, and what config key stores the list
    of entity types/bundles that have the breadcrumb field enabled?
  criteria: The permission is 'administer breadcrumb extra field'. Enabled entity types/bundles are stored
    in breadcrumb_extra_field.settings:breadcrumb_extra_field_admin, a nested map of entity_type -> {
    bundle -> bundle|0 }.
  bundle: breadcrumb_extra_field
  rubric_ref: rubric/breadcrumb_extra_field_breadcrumb_extra_field_config_key@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: breadcrumb_extra_field-enabled-bundle
  input: On this Drupal site, for which entity type and bundle has the breadcrumb_extra_field breadcrumb
    been enabled? Inspect the live configuration.
  criteria: node / article — breadcrumb_extra_field.settings:breadcrumb_extra_field_admin has node.article
    enabled (truthy).
  bundle: breadcrumb_extra_field
  rubric_ref: rubric/breadcrumb_extra_field_breadcrumb_extra_field_enabled_bundle@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/breadcrumb_extra_field-enabled-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/breadcrumb_extra_field-enabled-cleanup.sh
- id: breadcrumb_extra_field-enable-page
  input: On this Drupal site, use breadcrumb_extra_field to make the Breadcrumb extra field available
    on the 'Basic page' (node/page) content type's display (enable it for that bundle). Apply the change
    to the live site.
  criteria: Set breadcrumb_extra_field.settings:breadcrumb_extra_field_admin so node.page is enabled (e.g.
    ['node' => ['page' => 'page']]) and invalidate the entity_field_info cache tag (or drush cr); the
    'breadcrumb' display extra field then appears on node/page.
  bundle: breadcrumb_extra_field
  rubric_ref: rubric/breadcrumb_extra_field_breadcrumb_extra_field_enable_page@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/breadcrumb_extra_field-enable-page-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/breadcrumb_extra_field-enable-page-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/breadcrumb_extra_field-enable-page-verify.sh
- id: breadcrumb_extra_field-place-field
  input: On this Drupal site the Breadcrumb extra field is already enabled for the Article content type.
    Now make it actually show on Article pages by placing the Breadcrumb field into the content region
    of the Article default view display. Apply the change to the live site.
  criteria: Add a 'breadcrumb' component to core.entity_view_display.node.article.default (e.g. $display->setComponent('breadcrumb',
    ['weight' => -40, 'region' => 'content'])->save(), or drag it out of Disabled on Manage display).
  bundle: breadcrumb_extra_field
  rubric_ref: rubric/breadcrumb_extra_field_breadcrumb_extra_field_place_field@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/breadcrumb_extra_field-place-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/breadcrumb_extra_field-place-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/breadcrumb_extra_field-place-verify.sh
