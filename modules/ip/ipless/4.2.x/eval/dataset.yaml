metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: ipless
  version: 4.2.x
  note: 'Simple Less (ipless) compiles .less files declared under a ''less:'' key in *.libraries.yml into
    CSS using wikimedia/less.php, writing output to public://ipless/. It has NO config entity of its own:
    its four boolean flags live in core''s system.performance config under an ''ipless'' mapping (enabled,
    modedev, sourcemap, watch_mode), added via hook_config_schema_info_alter and surfaced on the Performance
    form (configure route system.performance_settings). On a fresh install the ''ipless'' key is absent
    (all getters treat missing as FALSE). Compilation runs in HtmlResponseIplessSubscriber (kernel.response
    prio 4); a full rebuild is flagged by state key ipless.force_rebuild. Drush: ipless:generate (alias
    ipless). Service: ipless.base (Drupal\ipless\Ipless). Event: ipless.file_compilation. Hook: hook_less_alter.
    Medium/hard cases are grounded in the real system.performance ipless.* flags.'
questions:
- id: ipless-declare-less
  input: Using the Simple Less (ipless) Drupal module, how do I tell Drupal to compile a Less file from
    my theme, and where does the compiled CSS end up? Show the libraries.yml syntax.
  criteria: 'Declare the file under a ''less:'' key in your *.libraries.yml (e.g. less: { theme: { css/styles.less:
    { output: css/gen/styles.css } } }). With compilation enabled, ipless compiles it via wikimedia/less.php
    to public://ipless/{extension}-{library}--{file}.css and injects it as the library''s css.'
  bundle: ipless
  rubric_ref: rubric/ipless_ipless_declare_less@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: ipless-enable-where
  input: I installed the Simple Less (ipless) module but there is no dedicated settings page for it. Where
    do I enable Less compilation, and in which core configuration object are its settings stored?
  criteria: 'There is no config entity of its own; ipless adds its options to the core Performance page
    (/admin/config/development/performance, route system.performance_settings). The flags are stored in
    the system.performance config under an ''ipless'' mapping: ipless.enabled, ipless.modedev, ipless.sourcemap,
    ipless.watch_mode.'
  bundle: ipless
  rubric_ref: rubric/ipless_ipless_enable_where@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: ipless-drush-generate
  input: Which Drush command does the Simple Less (ipless) module provide to precompile all Less stylesheets
    across the site, and what is its alias?
  criteria: 'drush ipless:generate (alias: drush ipless) — it calls Ipless::generateAllLibraries() to
    compile every installed module/theme library''s Less into public://ipless/.'
  bundle: ipless
  rubric_ref: rubric/ipless_ipless_drush_generate@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: ipless-status
  input: On this Drupal site, is Simple Less (ipless) compilation currently enabled, and is its developer
    (recompile-on-every-request) mode on or off? Inspect the live configuration to answer.
  criteria: 'Reading system.performance: ipless.enabled is TRUE (compilation is enabled) but ipless.modedev
    is FALSE, so developer mode is OFF.'
  bundle: ipless
  rubric_ref: rubric/ipless_ipless_status@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/ipless-status-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/ipless-clear-cleanup.sh
- id: ipless-watch-mode
  input: The Simple Less (ipless) module is set up on this site. Inspect the live system.performance configuration
    and state whether watch mode (live CSS refresh) is currently active.
  criteria: In system.performance, ipless.modedev is TRUE and ipless.watch_mode is TRUE, so watch mode
    is active (it only takes effect when developer mode is also on).
  bundle: ipless
  rubric_ref: rubric/ipless_ipless_watch_mode@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/ipless-watch-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/ipless-clear-cleanup.sh
- id: ipless-enable-compilation
  input: On this Drupal site, enable Simple Less (ipless) CSS compilation by setting the ipless.enabled
    flag in the system.performance configuration to true. Apply the change to the live site.
  criteria: Set system.performance -> ipless.enabled to TRUE (e.g. drush cset system.performance ipless.enabled
    1, or tick 'Less compilation enabled' on the Performance page and save).
  bundle: ipless
  rubric_ref: rubric/ipless_ipless_enable_compilation@1.0
  tags:
  - mode:execution
  - difficulty:hard
