rubrics:
- id: ip_anon_ip_anon_enable
  version: '1.0'
  applicable_bundles:
  - ip_anon
  checks:
  - kind: must_contain_any
    values:
    - policy
    - Anonymize
    - admin/config/people/ip_anon
  scoring:
    combine: all_pass
- id: ip_anon_ip_anon_period_meaning
  version: '1.0'
  applicable_bundles:
  - ip_anon
  checks:
  - kind: must_contain_any
    values:
    - second
    - '-1'
    - forever
    - never
  scoring:
    combine: all_pass
- id: ip_anon_ip_anon_drush
  version: '1.0'
  applicable_bundles:
  - ip_anon
  checks:
  - kind: must_contain_any
    values:
    - ip_anon:scrub
    - ip_anon:policy
  scoring:
    combine: all_pass
- id: ip_anon_ip_anon_known_watchdog
  version: '1.0'
  applicable_bundles:
  - ip_anon
  checks:
  - kind: must_contain_any
    values:
    - '3600'
  scoring:
    combine: all_pass
- id: ip_anon_ip_anon_known_sessions
  version: '1.0'
  applicable_bundles:
  - ip_anon
  checks:
  - kind: must_contain_any
    values:
    - '86400'
  scoring:
    combine: all_pass
- id: ip_anon_ip_anon_set_sessions
  version: '1.0'
  applicable_bundles:
  - ip_anon
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
- id: ip_anon_ip_anon_set_watchdog
  version: '1.0'
  applicable_bundles:
  - ip_anon
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
