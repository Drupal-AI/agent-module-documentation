rubrics:
- id: ip2country_ip2country_lookup_service
  version: '1.0'
  applicable_bundles:
  - ip2country
  checks:
  - kind: must_contain_any
    values:
    - ip2country.lookup
    - getCountry
  scoring:
    combine: all_pass
- id: ip2country_ip2country_user_storage
  version: '1.0'
  applicable_bundles:
  - ip2country
  checks:
  - kind: must_contain_any
    values:
    - user.data
    - country_iso_code_2
    - user data
  scoring:
    combine: all_pass
- id: ip2country_ip2country_update_command
  version: '1.0'
  applicable_bundles:
  - ip2country
  checks:
  - kind: must_contain_any
    values:
    - ip2country:update
    - ip-update
    - --registry
  scoring:
    combine: all_pass
- id: ip2country_ip2country_known_rir
  version: '1.0'
  applicable_bundles:
  - ip2country
  checks:
  - kind: must_contain_any
    values:
    - ripe
  scoring:
    combine: all_pass
- id: ip2country_ip2country_known_batch
  version: '1.0'
  applicable_bundles:
  - ip2country
  checks:
  - kind: must_contain_any
    values:
    - '500'
  scoring:
    combine: all_pass
- id: ip2country_ip2country_set_registry
  version: '1.0'
  applicable_bundles:
  - ip2country
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
- id: ip2country_ip2country_enable_spoof
  version: '1.0'
  applicable_bundles:
  - ip2country
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
