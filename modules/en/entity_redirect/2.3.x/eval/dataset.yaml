metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: entity_redirect
  version: 2.3.x
  note: 'Entity Redirect adds a configurable post-save redirect after add/edit/delete of an entity, set
    PER BUNDLE via third-party settings on the bundle config entity plus a form submit handler. No global
    settings page, no configure route (configure=null), no Drush. One permission: ''set external entity
    redirects'' (gates the External URL destination). Config path: <bundle_config>.third_party_settings.entity_redirect.redirect.<action>
    where action is add|edit|delete|anonymous, each with {active, destination, url, external}. destination
    values: default, add_form, edit_form, created, url (local path), previous_page, layout_builder (needs
    layout_builder), external (needs the permission). ''active'' must be TRUE or the redirect is skipped.
    Schema ships for node.type, media.type, taxonomy.vocabulary, contact.form, paragraphs.paragraphs_type,
    profile.type, webform.settings. Medium/hard cases are grounded in real node.type third-party settings
    on namespaced content types (er_*).'
questions:
- id: entity_redirect-add-another
  input: On a Drupal site I want editors to be returned to a fresh 'add content' form immediately after
    saving a new node of a content type, for fast repeated data entry. Which module provides this and
    what redirect option do I choose?
  criteria: Use the Entity Redirect module. On the content type edit form, in 'Redirect after Entity Operations',
    enable the Add action and set its destination to 'Add Form' (add_form) so saving a new node returns
    to a fresh add form.
  bundle: entity_redirect
  rubric_ref: rubric/entity_redirect_entity_redirect_add_another@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: entity_redirect-where
  input: Where is Entity Redirect configured (it has no global settings page), and where/how is the choice
    stored in config?
  criteria: It is configured per bundle on that bundle's edit form (e.g. content type edit page, workflow
    tab, 'Redirect after Entity Operations'). It is stored on the bundle config entity at third_party_settings.entity_redirect.redirect.<action>.{active,destination,url,external}.
  bundle: entity_redirect
  rubric_ref: rubric/entity_redirect_entity_redirect_where@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: entity_redirect-destinations
  input: What redirect destinations does Entity Redirect offer after saving an entity, and which permission
    is required to redirect to an external URL?
  criteria: 'Destinations: default, add_form, edit_form, created (view the entity), url (a local path),
    previous_page (the referrer), layout_builder (with Layout Builder enabled), and external (a full external
    URL). The external option requires the ''set external entity redirects'' permission.'
  bundle: entity_redirect
  rubric_ref: rubric/entity_redirect_entity_redirect_destinations@1.0
  tags:
  - mode:recipe
  - difficulty:easy
