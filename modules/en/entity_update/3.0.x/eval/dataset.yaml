metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: entity_update
  version: 3.0.x
  note: 'Entity Update applies pending entity-type/field-storage schema changes, including on entity types
    that hold data, by serialising rows into its own `entity_update` database table (hook_schema in entity_update.install),
    deleting them, applying the schema change through CustomEntityDefinitionUpdateManager, and recreating
    them. It exposes two Drush commands - entity:update (alias upe) and entity:check (alias upec) - a
    web UI under /admin/config/development/entity-update gated by core''s ''administer software updates'',
    and exactly one config object, entity_update.settings, whose `excludes` mapping lists entity type
    ids that must never be deleted and recreated (shipped default: user, user_role). Medium cases read
    back a known excludes list and a seeded backup table; hard cases require writing the excludes config
    and emptying the backup table (what `drush upe --clean` / EntityUpdate::cleanupEntityBackup() does).'
questions:
- id: entity_update-show-pending
  input: On a Drupal 11 site with the entity_update contrib module installed, which Drush command shows
    me the pending entity schema updates without changing anything, and what is the command's alias?
  criteria: drush entity:update --show, alias drush upe --show. It calls EntityCheck::showEntityStatusCli()
    and just prints the change summary. The read-only companion command is entity:check (alias upec),
    e.g. `drush upec node` or `drush upec block --types`.
  bundle: entity_update
  rubric_ref: rubric/entity_update_entity_update_show_pending@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: entity_update-data-safe-option
  input: Using the Drupal entity_update module, my entity type already contains content and `drush upe
    --basic` fails because of it. Which option runs the data-preserving update instead, and which two
    options let me retry the restore and then clear the module's backup data afterwards?
  criteria: 'Use `drush upe --all` (EntityUpdate::safeUpdateMain()): it backs the entities up into the
    module''s entity_update table, deletes them, applies the schema change, then recreates them. If the
    recreation fails, `drush upe --rescue` recreates the entities from that backup table, and `drush upe
    --clean` empties the backup table once everything is confirmed good. You can also target a single
    entity type with `drush upe ENTITY_TYPE_ID`.'
  bundle: entity_update
  rubric_ref: rubric/entity_update_entity_update_data_safe_option@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: entity_update-excludes-config
  input: The Drupal entity_update module can delete and recreate entities in order to change their schema.
    How do I tell it that certain entity types must never be touched that way, where is that stored, and
    which entity types does the module protect out of the box?
  criteria: Tick them on the settings form at /admin/config/development/entity-update/settings ('Entity
    types to exclude'). It is saved in the single config object entity_update.settings under the `excludes`
    mapping. The shipped default (config/install/entity_update.settings.yml) protects `user` and `user_role`.
  bundle: entity_update
  rubric_ref: rubric/entity_update_entity_update_excludes_config@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: entity_update-known-excludes
  input: On this Drupal site the entity_update module has been configured with a specific list of entity
    types that must be protected from being deleted and recreated during a schema update. Inspect the
    live configuration and list exactly which entity types are currently excluded.
  criteria: user, user_role, taxonomy_term and menu_link_content - readable with `drush config:get entity_update.settings
    excludes`.
  bundle: entity_update
  rubric_ref: rubric/entity_update_entity_update_known_excludes@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/entity_update-excludes-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/entity_update-excludes-cleanup.sh
- id: entity_update-backup-table
  input: The entity_update module keeps its own database table for entities it has parked while changing
    a schema. On this Drupal site that table currently has rows in it. Inspect the running site and tell
    me the table name, how many rows it holds and which entity_type value they carry.
  criteria: The table is `entity_update` (created by entity_update_schema()). It holds 2 rows with entity_type
    'eu_probe' (entity ids 4242 and 4343). Readable with `drush sql:query "SELECT entity_type, entity_id
    FROM entity_update"` or a db select in drush php:eval.
  bundle: entity_update
  rubric_ref: rubric/entity_update_entity_update_backup_table@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/entity_update-backup-table-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/entity_update-backup-table-cleanup.sh
- id: entity_update-add-excludes
  input: On this Drupal site, configure the entity_update module so that, in addition to the entity types
    it already protects, the entity types 'taxonomy_term' and 'taxonomy_vocabulary' are excluded from
    being deleted and recreated during an entity schema update. Keep the existing protections in place
    and apply the change to the live site.
  criteria: entity_update.settings -> excludes must contain truthy entries for user, user_role, taxonomy_term
    and taxonomy_vocabulary (e.g. via the 'Entity types to exclude' checkboxes at /admin/config/development/entity-update/settings,
    or by editing the config object directly).
  bundle: entity_update
  rubric_ref: rubric/entity_update_entity_update_add_excludes@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/entity_update-add-excludes-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/entity_update-add-excludes-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/entity_update-add-excludes-verify.sh
- id: entity_update-clean-backup
  input: A previous entity schema update on this Drupal site left leftover parked entity data behind in
    the entity_update module's own backup storage. The recreation has already been confirmed as successful,
    so that leftover data is no longer needed. Please clear it out on the live site using the module's
    own functionality.
  criteria: Run `drush upe --clean` (or call \Drupal\entity_update\EntityUpdate::cleanupEntityBackup()),
    which empties the module's `entity_update` backup table. Verify passes when that table has 0 rows.
  bundle: entity_update
  rubric_ref: rubric/entity_update_entity_update_clean_backup@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: site-builder-layman
    reset: agent-module-documentation/evaluation/verify/entity_update-clean-backup-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/entity_update-clean-backup-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/entity_update-clean-backup-verify.sh
