metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: entity_reference_override_revisions
  version: 2.0.x
  note: EXPERIMENTAL thin field-plugin submodule of entity_reference_override. Provides the field type
    entity_reference_override_revisions ('Entity reference revisions w/custom text', class Drupal\entity_reference_override_revisions\Plugin\Field\FieldType\EntityReferenceOverrideRevisions,
    extends entity_reference_revisions' EntityReferenceRevisionsItem), adding ONE override column (varchar
    255; NO override_format) and field setting override_label. default_widget entity_reference_override_revisions_autocomplete;
    default_formatter reuses the parent module's entity_reference_override_label. No config form, no permissions,
    no services. Depends on entity_reference_override + entity_reference_revisions. Medium introspects
    the live field-type plugin definition (cheap plugin.manager.field.field_type read). Hard has the agent
    write the field-storage-creation CODE into a deletable scratch file under web/sites/default/ (entity_reference_override_revisions_field.eval.php)
    which verify greps and reset deletes -- scratch-file authoring is used because on THIS shared site
    attaching field/display config for this type is very slow (canvas reacts to field definitions) and
    'drush cr' fatals in an unrelated canvas/ui_patterns collision. Facts grounded in src/Plugin/Field/FieldType/EntityReferenceOverrideRevisions.php
    and src/Plugin/Field/FieldWidget/.
questions:
- id: entity_reference_override_revisions-field-type
  input: I use Entity Reference Revisions (e.g. with Paragraphs) and want a per-reference custom title.
    Which field type does the entity_reference_override_revisions submodule add, and what does it extend?
  criteria: It adds the field type entity_reference_override_revisions ('Entity reference revisions w/custom
    text'), a subclass of Entity Reference Revisions' EntityReferenceRevisionsItem, with an extra 'override'
    text column for overriding the referenced revision's title.
  bundle: entity_reference_override_revisions
  rubric_ref: rubric/entity_reference_override_revisions_entity_reference_override_revisions_field_type@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: entity_reference_override_revisions-no-format
  input: For the entity_reference_override_revisions field type, which formatter is used by default to
    apply the override, and does it support a text-format (WYSIWYG) override like the base entity_reference_override
    field?
  criteria: Its default_formatter is the parent module's entity_reference_override_label (so the same
    override_action modes apply). Unlike the base entity_reference_override type it has NO override_format
    setting -- the override is plain text only (override column is varchar 255).
  bundle: entity_reference_override_revisions
  rubric_ref: rubric/entity_reference_override_revisions_entity_reference_override_revisions_no_format@1.0
  tags:
  - mode:recipe
  - difficulty:easy
