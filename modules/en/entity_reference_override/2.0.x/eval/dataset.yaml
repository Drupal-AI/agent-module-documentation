metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: entity_reference_override
  version: 2.0.x
  note: 'entity_reference_override adds the field type entity_reference_override (''Entity reference w/custom
    text''), a subclass of core EntityReferenceItem with extra storage columns override (varchar 4094)
    + override_format, field settings override_label + override_format, widgets entity_reference_override_autocomplete
    (default) + entity_reference_override_select, and formatters entity_reference_override_label (default,
    with override_action in {title,title-append,suffix,class,hide}) + entity_reference_override_entity.
    It has NO admin UI (configure=null), no permissions, no Drush, no plugin TYPES. Medium cases introspect
    the LIVE plugin definitions (field-type class + provided formatters), read cheaply via plugin.manager.field.field_type
    / plugin.manager.field.formatter. Hard cases have the agent write the field-creation / formatter-config
    CODE into deletable scratch files under web/sites/default/ (entity_reference_override_field.eval.php,
    entity_reference_override_formatter.eval.php) which verify greps and reset deletes. NOTE: hard cases
    use scratch-file authoring rather than live field creation on purpose -- on THIS shared site ''canvas''
    is enabled and reacts to field/display definition changes, so attaching a FieldConfig or saving a
    view display for this field type is extremely slow / hangs, and a full ''drush cr'' fatals in an unrelated
    canvas/ui_patterns component-manager collision; the scratch-file approach still verifies real filesystem
    state the agent produced. All facts grounded in src/Plugin/Field/**, entity_reference_override.module
    and config/schema.'
questions:
- id: entity_reference_override-field-type
  input: I want an entity reference field where I can also type a custom per-reference title. Which Drupal
    field type does entity_reference_override add, and what does it store beyond a normal reference?
  criteria: It adds the field type entity_reference_override ('Entity reference w/custom text'), a subclass
    of core's entity reference that stores an extra 'override' text value (and override_format) per reference,
    used to override the referenced entity's title (or class/note/field).
  bundle: entity_reference_override
  rubric_ref: rubric/entity_reference_override_entity_reference_override_field_type@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: entity_reference_override-override-action
  input: With the entity_reference_override Label formatter, what are the ways the custom text can be
    applied to the referenced entity's title? Name the options.
  criteria: 'The entity_reference_override_label formatter has an override_action setting: title (replace
    the title), title-append (append to the title), suffix (add a note after the link), class (add a CSS
    class to the link), or hide.'
  bundle: entity_reference_override
  rubric_ref: rubric/entity_reference_override_entity_reference_override_override_action@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: entity_reference_override-widgets-formatters
  input: Which widgets and formatters does the entity_reference_override module provide for its field
    type?
  criteria: 'Widgets: entity_reference_override_autocomplete (default) and entity_reference_override_select.
    Formatters: entity_reference_override_label (default; Label with override) and entity_reference_override_entity
    (Rendered entity with override).'
  bundle: entity_reference_override
  rubric_ref: rubric/entity_reference_override_entity_reference_override_widgets_formatters@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: entity_reference_override-fieldtype-class
  input: On this running Drupal site, inspect the field-type plugin definitions and tell me the PHP class
    that implements the entity_reference_override field type, plus its default widget and default formatter.
  criteria: 'Class Drupal\entity_reference_override\Plugin\Field\FieldType\EntityReferenceOverride; default_widget
    entity_reference_override_autocomplete; default_formatter entity_reference_override_label. Discoverable
    with: drush php:eval "var_export(\Drupal::service(''plugin.manager.field.field_type'')->getDefinition(''entity_reference_override''));".'
  bundle: entity_reference_override
  rubric_ref: rubric/entity_reference_override_entity_reference_override_fieldtype_class@1.0
  tags:
  - mode:introspection
  - difficulty:medium
