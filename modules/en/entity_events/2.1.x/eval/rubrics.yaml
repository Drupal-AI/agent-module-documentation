rubrics:
- id: entity_events_entity_events_event_names
  version: '1.0'
  applicable_bundles:
  - entity_events
  checks:
  - kind: must_contain_any
    values:
    - event.insert
    - event.update
    - event.presave
    - event.delete
    - event.predelete
  scoring:
    combine: all_pass
- id: entity_events_entity_events_event_object
  version: '1.0'
  applicable_bundles:
  - entity_events
  checks:
  - kind: must_contain_any
    values:
    - getEntity
    - getEventType
    - EntityEvent
  scoring:
    combine: all_pass
- id: entity_events_entity_events_how_to_subscribe
  version: '1.0'
  applicable_bundles:
  - entity_events
  checks:
  - kind: must_contain_any
    values:
    - EntityEventInsertSubscriber
    - event_subscriber
    - onEntityInsert
  scoring:
    combine: all_pass
- id: entity_events_entity_events_live_update_eventname
  version: '1.0'
  applicable_bundles:
  - entity_events
  checks:
  - kind: must_contain_any
    values:
    - event.update
  scoring:
    combine: all_pass
- id: entity_events_entity_events_live_predelete_eventname
  version: '1.0'
  applicable_bundles:
  - entity_events
  checks:
  - kind: must_contain_any
    values:
    - event.predelete
  scoring:
    combine: all_pass
- id: entity_events_entity_events_insert_subscriber
  version: '1.0'
  applicable_bundles:
  - entity_events
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
- id: entity_events_entity_events_delete_subscriber
  version: '1.0'
  applicable_bundles:
  - entity_events
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
