metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: entity_delete_log
  version: 1.2.x
  note: 'Entity Delete Log logs entity deletions to the base table `entity_delete_log`. Which types are
    logged is stored in simple config `entity_delete_log.settings` key `entity_types` (array of entity-type
    ids; empty/absent = nothing logged). Settings form at /admin/config/content/entity-delete-log (route
    entity_delete_log.settings, perm ''administer site configuration''); report at /admin/reports/entity-delete-log
    (Views view `entity_delete_log`, perm ''access site reports''). Two alter hooks: hook_entity_delete_log_alter
    (must RETURN $variables) and hook_entity_delete_log_post_process. No plugins, no Drush, no own permissions,
    no config schema. Medium/hard cases are grounded in the real config key and the real table columns
    (entity_type/entity_title/uid/deleted).'
questions:
- id: entity_delete_log-config-key
  input: On a Drupal site using the entity_delete_log module, how do I choose which entity types get logged
    when deleted, and where is that choice stored (config object and key)?
  criteria: Tick the entity types on /admin/config/content/entity-delete-log (route entity_delete_log.settings,
    permission 'administer site configuration'). The selection is stored in simple config entity_delete_log.settings
    under the key entity_types (an array of entity-type ids). Empty/absent means nothing is logged.
  bundle: entity_delete_log
  rubric_ref: rubric/entity_delete_log_entity_delete_log_config_key@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: entity_delete_log-where-stored
  input: Where does entity_delete_log store the deletion records, and where can an editor review them
    in the UI (and with what permission)?
  criteria: Records are inserted into the base database table `entity_delete_log` (columns include entity_id,
    entity_type, entity_bundle, entity_title, author, revisions, created, deleted, uid). Editors review
    them at /admin/reports/entity-delete-log, a Views view gated by the 'access site reports' permission.
  bundle: entity_delete_log
  rubric_ref: rubric/entity_delete_log_entity_delete_log_where_stored@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: entity_delete_log-alter-hooks
  input: Which hooks does entity_delete_log invite a custom module to implement to change the logged data
    before insertion or react afterwards?
  criteria: hook_entity_delete_log_alter($entity, $type, $variables) is called before insertion and must
    RETURN the $variables array (invokeAll replaces $variables with the return value); hook_entity_delete_log_post_process($entity,
    $type, $variables) runs after a successful insert (the $variables then also include entity_delete_log_id).
  bundle: entity_delete_log
  rubric_ref: rubric/entity_delete_log_entity_delete_log_alter_hooks@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: entity_delete_log-which-types-configured
  input: On this Drupal site, entity_delete_log has been configured to log deletions for a specific set
    of entity types. Inspect the live configuration and list which entity types are currently enabled
    for deletion logging.
  criteria: The config entity_delete_log.settings key entity_types is set to [taxonomy_term, user] (read
    via `drush cget entity_delete_log.settings entity_types`).
  bundle: entity_delete_log
  rubric_ref: rubric/entity_delete_log_entity_delete_log_which_types_configured@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/entity_delete_log-configured-types-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/entity_delete_log-configured-types-cleanup.sh
- id: entity_delete_log-read-logged-row
  input: The entity_delete_log table on this site has recorded at least one entity deletion. Inspect the
    live database and give the entity_title of the logged deletion.
  criteria: A row exists in the `entity_delete_log` table with entity_title = 'edl_seed_title' (entity_type
    node). Found via e.g. `drush sqlq "SELECT entity_type, entity_title FROM entity_delete_log"`.
  bundle: entity_delete_log
  rubric_ref: rubric/entity_delete_log_entity_delete_log_read_logged_row@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/entity_delete_log-logged-row-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/entity_delete_log-logged-row-cleanup.sh
- id: entity_delete_log-log-node-deletion
  input: 'Using the entity_delete_log module, make this Drupal site record node deletions, then prove
    it works: configure logging for the node entity type, create an Article node titled exactly ''edl_task_node'',
    and delete it. After you are done there must be a deletion-log entry for that node.'
  criteria: Set entity_delete_log.settings entity_types to include 'node', create an Article titled 'edl_task_node',
    then delete it. hook_entity_delete() inserts a row into the entity_delete_log table with entity_type='node'
    and entity_title='edl_task_node'.
  bundle: entity_delete_log
  rubric_ref: rubric/entity_delete_log_entity_delete_log_log_node_deletion@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/entity_delete_log-log-node-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/entity_delete_log-log-node-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/entity_delete_log-log-node-verify.sh
- id: entity_delete_log-log-term-deletion
  input: I want a record kept whenever someone deletes a taxonomy term on this site. Turn that on using
    the Entity Delete Log module, then show it works by adding a term called 'edl_task_term' to the Tags
    vocabulary and deleting it — afterwards there should be a logged record of that term's deletion.
  criteria: Add 'taxonomy_term' to entity_delete_log.settings entity_types, create a term named 'edl_task_term'
    in the tags vocabulary, then delete it. A row is inserted into entity_delete_log with entity_type='taxonomy_term'
    and entity_title='edl_task_term'.
  bundle: entity_delete_log
  rubric_ref: rubric/entity_delete_log_entity_delete_log_log_term_deletion@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: site-owner
    reset: agent-module-documentation/evaluation/verify/entity_delete_log-log-term-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/entity_delete_log-log-term-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/entity_delete_log-log-term-verify.sh
