metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: entity_browser_block
  version: 2.0.x
  note: Entity Browser Block ships a single derivable block plugin (id entity_browser_block) whose deriver
    EntityBrowserBlockDeriver creates one derivative per entity_browser config entity (plugin id entity_browser_block:{browser}).
    No settings form, configure route, permissions, services, or submodules. Its persistent state is a
    block.block.* config entity whose settings carry entity_ids (ordered entity_type:entity_id strings)
    and view_modes (map id -> view-mode machine name). Medium/hard cases are grounded in a real placed
    block config entity; setup/reset scripts first create the required entity_browser (eval_browser) so
    the derivative resolves.
questions:
- id: entity_browser_block-purpose
  input: On a Drupal 11 site I want a block that renders a few entities I hand-pick through an Entity
    Browser, each in a chosen view mode, without writing code. Which contrib module provides this and
    what does it give me?
  criteria: Entity Browser Block provides a block plugin, derived per Entity Browser, that renders entities
    you select through that browser in a chosen view mode per entity.
  bundle: entity_browser_block
  rubric_ref: rubric/entity_browser_block_entity_browser_block_purpose@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: entity_browser_block-deriver
  input: How does Entity Browser Block make a separate block available for each Entity Browser on the
    site? Name the mechanism and class, and give the format of the resulting block plugin id.
  criteria: The entity_browser_block plugin uses a deriver, EntityBrowserBlockDeriver, which emits one
    derivative per entity_browser config entity; the plugin id is entity_browser_block:{browser_machine_name}.
  bundle: entity_browser_block
  rubric_ref: rubric/entity_browser_block_entity_browser_block_deriver@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: entity_browser_block-settings
  input: What does an Entity Browser Block store in its block configuration to remember which entities
    to show and how to render them? Name the two settings keys and their formats.
  criteria: It stores entity_ids (an ordered list of entity_type:entity_id strings, e.g. node:1) and view_modes
    (a map keyed by those same ids to a view-mode machine name like teaser). Schema block.settings.entity_browser_block:*.
  bundle: entity_browser_block
  rubric_ref: rubric/entity_browser_block_entity_browser_block_settings@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: entity_browser_block-known-selection
  input: This Drupal site has an Entity Browser Block placed on it. Inspect the live block configuration
    and tell me which entity it renders and in which view mode.
  criteria: 'The placed block (block.block.ebb_eval_known) references entity_ids [node:1] and renders
    it with view_modes {node:1: teaser} — i.e. node 1 in the teaser view mode.'
  bundle: entity_browser_block
  rubric_ref: rubric/entity_browser_block_entity_browser_block_known_selection@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/entity_browser_block-known-selection-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/entity_browser_block-known-selection-cleanup.sh
- id: entity_browser_block-known-browser
  input: An Entity Browser Block is placed on this site. Which Entity Browser is it derived from (what
    is the block plugin id), and how can you tell from the block configuration?
  criteria: The block's plugin id is entity_browser_block:eval_browser, so it is derived from the entity_browser
    config entity named eval_browser (also visible as a config dependency entity_browser.browser.eval_browser).
  bundle: entity_browser_block
  rubric_ref: rubric/entity_browser_block_entity_browser_block_known_browser@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/entity_browser_block-known-browser-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/entity_browser_block-known-browser-cleanup.sh
- id: entity_browser_block-place-teaser
  input: On this Drupal site the Entity Browser Block module is enabled and an Entity Browser named 'eval_browser'
    exists. Place an Entity Browser Block derived from that browser into the Olivero theme's 'content'
    region that renders node 1 (entity id node:1) in the 'teaser' view mode. Save it as a real block config
    entity so it takes effect on the live site.
  criteria: A block.block.* config entity in the olivero theme whose plugin is entity_browser_block:eval_browser,
    with settings.entity_ids containing node:1 and settings.view_modes['node:1'] == teaser.
  bundle: entity_browser_block
  rubric_ref: rubric/entity_browser_block_entity_browser_block_place_teaser@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/entity_browser_block-place-teaser-reset.sh
    verify: agent-module-documentation/evaluation/verify/entity_browser_block-place-teaser-verify.sh
- id: entity_browser_block-place-full
  input: On this Drupal site the Entity Browser Block module is enabled and an Entity Browser named 'eval_browser'
    exists. Configure and place an Entity Browser Block (derived from eval_browser) in the Olivero theme's
    'sidebar' region that displays node 1 (entity id node:1) using the 'full' view mode. Persist it as
    a block config entity on the live site.
  criteria: A block.block.* config entity in the olivero theme, region sidebar, plugin entity_browser_block:eval_browser,
    with settings.entity_ids containing node:1 and settings.view_modes['node:1'] == full.
  bundle: entity_browser_block
  rubric_ref: rubric/entity_browser_block_entity_browser_block_place_full@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/entity_browser_block-place-full-reset.sh
    verify: agent-module-documentation/evaluation/verify/entity_browser_block-place-full-verify.sh
