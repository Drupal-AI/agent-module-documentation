metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: entity_class_formatter
  version: 2.0.x
  note: 'Entity Class Formatter is a single field formatter (id entity_class_formatter, label ''Entity
    Class'') plus one hook_entity_view_alter(). The formatter''s viewElements() returns an empty array;
    the hook copies the field''s values onto $build[''#attributes''][<attr>] of the rendered entity. Settings
    are prefix, suffix, attr (default ''class'') and field (entity-reference only); attr is required in
    the UI for decimal/float/integer fields. Supported field types: boolean, decimal, entity_reference,
    float, integer, list_string, string. There is no settings form and no configure route - all state
    is the component in core.entity_view_display.<entity>.<bundle>.<mode>. Every medium/hard case therefore
    reads or writes that real view-display component on node.article.default.'
questions:
- id: entity_class_formatter-what-it-does
  input: On a Drupal 11 site I want the value of a node field to end up as a CSS class on the rendered
    node's wrapper element, without the field itself being printed. The entity_class_formatter contrib
    module is installed. What do I configure, and what is the machine name of the formatter?
  criteria: On the bundle's Manage display page choose the 'Entity Class' format (formatter id entity_class_formatter)
    for that field. The formatter renders nothing; the module's hook_entity_view_alter() appends the field's
    values to $build['#attributes']['class'] of the entity, so the class shows up on the entity wrapper.
    The choice is stored in core.entity_view_display.<entity>.<bundle>.<view_mode> under content.<field>.type.
  bundle: entity_class_formatter
  rubric_ref: rubric/entity_class_formatter_entity_class_formatter_what_it_does@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: entity_class_formatter-settings
  input: What settings does the Drupal entity_class_formatter field formatter expose, and which one do
    I use to write the field value into a data-* attribute instead of the class attribute? Are there field
    types where that setting is mandatory?
  criteria: 'Four settings: prefix, suffix, attr and field. ''attr'' is the attribute name to use instead
    of ''class'' (e.g. data-variant) and it is #required in the settings form for decimal, float and integer
    fields. ''prefix''/''suffix'' are concatenated around each value. ''field'' only appears for entity_reference
    fields and names a field on the referenced entity to read instead of its label.'
  bundle: entity_class_formatter
  rubric_ref: rubric/entity_class_formatter_entity_class_formatter_settings@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: entity_class_formatter-value-rules
  input: Which field types can the Drupal entity_class_formatter formatter be used on, and what value
    does it contribute for an entity reference field and for a boolean field?
  criteria: Supported field types are boolean, decimal, entity_reference, float, integer, list_string
    and string. For an entity_reference field it uses each referenced entity's label(), unless the 'field'
    setting names a field on the referenced entity, in which case it recurses into that field's values.
    For a boolean field it uses the field definition's on_label when the value is truthy and off_label
    otherwise. Plain values are split on spaces into several classes when the target attribute is 'class'.
  bundle: entity_class_formatter
  rubric_ref: rubric/entity_class_formatter_entity_class_formatter_value_rules@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: entity_class_formatter-known-settings
  input: On this Drupal site the Article content type has a field named field_ecf_known that is rendered
    with the Entity Class formatter from the entity_class_formatter module. Inspect the live default view
    display for Article and tell me the exact prefix and suffix configured for that formatter.
  criteria: 'prefix is ''ecfx-'' and suffix is ''-tone'': in core.entity_view_display.node.article.default
    the field_ecf_known component has type entity_class_formatter with settings.prefix = ''ecfx-'' and
    settings.suffix = ''-tone''.'
  bundle: entity_class_formatter
  rubric_ref: rubric/entity_class_formatter_entity_class_formatter_known_settings@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/entity_class_formatter-known-settings-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/entity_class_formatter-known-settings-cleanup.sh
- id: entity_class_formatter-known-attr
  input: This Drupal site's Article content type has two string fields, field_ecf_attr and field_ecf_plain.
