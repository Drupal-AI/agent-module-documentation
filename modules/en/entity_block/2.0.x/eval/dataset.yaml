metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: entity_block
  version: 2.0.x
  note: Entity Block ships a single derivable block plugin (deriver) that renders any content entity in
    a chosen view mode as a block; no settings form, permissions, services, or submodules. Cases are `recipe`
    (response-graded) since they probe documented facts an agent would otherwise read source to answer;
    no site mutation.
questions:
- id: entity-block-purpose
  input: On a Drupal 11 site I want to render a specific existing node as a block, in a chosen view mode,
    without writing code. Which contrib module provides this and what does it give me?
  criteria: The Entity Block module provides a block plugin that renders any content entity in a selected
    view mode as a block.
  bundle: entity_block
  rubric_ref: rubric/entity_block_entity_block_purpose@1.0
  tags:
  - mode:recipe
- id: entity-block-place
  input: How do I place an Entity Block to show a content entity? Walk through the steps.
  criteria: Create the entity, then in Block layout or Layout Builder place the derivative for that entity
    type, pick the entity via the entity_autocomplete field and choose a view mode, then save.
  bundle: entity_block
  rubric_ref: rubric/entity_block_entity_block_place@1.0
  tags:
  - mode:recipe
- id: entity-block-deriver
  input: How does Entity Block make a separate block available for each entity type (node, media, etc.)?
    Name the mechanism and class.
  criteria: The entity_block plugin uses a deriver, EntityBlockDeriver, which creates one derivative per
    content entity type that has a view builder.
  bundle: entity_block
  rubric_ref: rubric/entity_block_entity_block_deriver@1.0
  tags:
  - mode:recipe
- id: entity-block-config-keys
  input: What does an Entity Block store in its block configuration, and where is the schema defined?
  criteria: It stores the entity ID (`entity`) and `view_mode` (plus label_display); schema is block.settings.entity_block:*
    in config/schema/entity_block.schema.yml.
  bundle: entity_block
  rubric_ref: rubric/entity_block_entity_block_config_keys@1.0
  tags:
  - mode:recipe
- id: entity-block-access
  input: If a user cannot view the entity referenced by an Entity Block, will they see the block? How
    is that enforced?
  criteria: No — blockAccess() checks the entity's 'view' access and returns forbidden if the user cannot
    view it.
  bundle: entity_block
  rubric_ref: rubric/entity_block_entity_block_access@1.0
  tags:
  - mode:recipe
- id: entity-block-title
  input: By default an Entity Block does not show a title. How is its title generated, and how do I set
    my own?
  criteria: With label_display off the title is auto-generated from the entity label (as '<entity label>
    (<admin label>)'); enable Display title to set a custom label.
  bundle: entity_block
  rubric_ref: rubric/entity_block_entity_block_title@1.0
  tags:
  - mode:recipe
- id: entity-block-reuse
  input: I want to reuse one piece of content across several pages/regions without duplicating it. Can
    Entity Block do this and how does it stay in sync?
  criteria: Yes — place Entity Blocks referencing the same entity anywhere; the block merges the entity's
    cache tags/contexts/max-age so it updates when the entity changes.
  bundle: entity_block
  rubric_ref: rubric/entity_block_entity_block_reuse@1.0
  tags:
  - mode:recipe
