    cleanup: agent-module-documentation/evaluation/verify/entity_access_by_role_field-fallback-cleanup.sh
- id: entity_access_by_role_field-operations
  input: On this Drupal site, the Article content type has an Entity Access by Role field named field_eabrf_ops.
