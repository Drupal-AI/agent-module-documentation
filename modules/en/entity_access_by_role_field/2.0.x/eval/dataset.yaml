metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: entity_access_by_role_field
  version: 2.0.x
  note: 'Entity Access by Role Field provides a field type entity_access_by_role_field whose values are
    role_id + access (allowed|forbidden), enforced by hook_entity_access (entity_access_by_role_field_entity_access).
    Per field instance you set ''operations'' (subset of view/update/delete; edit=update) and ''empty_roles_access_fallback''
    (neutral|allowed|forbidden). One restricted permission ''bypass entity_access_by_role_field permissions''.
    No configure route. It does NOT alter Views queries. All medium/hard cases are grounded in real field-instance
    config on node.article: introspection reads back a field''s fallback and operations settings; execution
    changes a field''s fallback and creates a new field of the type, verified against live FieldConfig.
    Fields are namespaced field_eabrf_*.'
questions:
- id: entity_access_by_role_field-mechanism
  input: How does the Drupal module entity_access_by_role_field decide whether a user can access an entity?
    What field does it add and which access hook enforces it?
  criteria: It adds a field of type entity_access_by_role_field holding role_id + access (allowed/forbidden)
    pairs, and enforces it in hook_entity_access() (entity_access_by_role_field_entity_access), intersecting
    the entity's selected roles with the current user's roles.
  bundle: entity_access_by_role_field
  rubric_ref: rubric/entity_access_by_role_field_entity_access_by_role_field_mechanism@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: entity_access_by_role_field-instance-settings
  input: When configuring an 'Entity Access by Role' field instance in entity_access_by_role_field, which
    two per-field settings control which operations are governed and what happens when no role is selected?
    Give their setting keys and possible values.
  criteria: operations (a subset of view/update/delete; edit is 'update') and empty_roles_access_fallback
    (neutral | allowed | forbidden).
  bundle: entity_access_by_role_field
  rubric_ref: rubric/entity_access_by_role_field_entity_access_by_role_field_instance_settings@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: entity_access_by_role_field-bypass-perm
  input: Which permission lets a user skip all of entity_access_by_role_field's per-entity access checks,
    and what does it do?
  criteria: The restricted permission 'bypass entity_access_by_role_field permissions' — a user who has
    it is always allowed and the field logic is short-circuited.
  bundle: entity_access_by_role_field
  rubric_ref: rubric/entity_access_by_role_field_entity_access_by_role_field_bypass_perm@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: entity_access_by_role_field-fallback
  input: On this Drupal site, the Article content type has an Entity Access by Role field named field_eabrf_fb.
    When a content editor leaves its roles empty, what access fallback applies? Inspect the live field
    configuration.
  criteria: forbidden — field.field.node.article.field_eabrf_fb settings.empty_roles_access_fallback is
    'forbidden'.
  bundle: entity_access_by_role_field
  rubric_ref: rubric/entity_access_by_role_field_entity_access_by_role_field_fallback@1.0
  tags:
  - mode:introspection
  - difficulty:medium
