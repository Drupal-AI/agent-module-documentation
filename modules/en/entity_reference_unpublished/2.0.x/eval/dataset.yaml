metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: entity_reference_unpublished
  version: 2.0.x
  note: Grounded in the three selection handlers (unpublished, unpublished_media, unpublished_taxonomy_term)
    and the field-config setting that selects them (settings.handler). Medium/hard cases create namespaced
    entity_reference fields (field_eru_*) on node.article targeting node or taxonomy_term and read/write
    field.field settings.handler. Cleanup deletes only the field_eru_* storages it created. node and taxonomy_term
    are core; no media dependency is required.
questions:
- id: eru-handler-ids
  input: The entity_reference_unpublished module adds selection handlers so a reference field can point
    at unpublished content. What are the three handler (plugin) ids it provides and which entity type
    does each target?
  criteria: unpublished (node), unpublished_media (media), and unpublished_taxonomy_term (taxonomy_term).
  bundle: entity_reference_unpublished
  rubric_ref: rubric/entity_reference_unpublished_eru_handler_ids@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: eru-how-to-use
  input: How do I make an existing node entity-reference field able to reference unpublished nodes using
    entity_reference_unpublished? What do I change on the field?
  criteria: Edit the field and set its Reference method (the selection handler) to 'Unpublished Default';
    in config this sets the field's settings.handler to 'unpublished'.
  bundle: entity_reference_unpublished
  rubric_ref: rubric/entity_reference_unpublished_eru_how_to_use@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: eru-why-it-works
  input: Why do the entity_reference_unpublished handlers return unpublished entities when core's normal
    node/media/term reference handlers do not? What base class do they extend?
  criteria: They extend the generic DefaultSelection base class instead of the entity-specific handlers
    (NodeSelection/MediaSelection/TermSelection) that add a published-only (status = 1) query condition,
    so that condition is never applied and unpublished entities are returned.
  bundle: entity_reference_unpublished
  rubric_ref: rubric/entity_reference_unpublished_eru_why_it_works@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: eru-known-node-handler
  input: On this Drupal site, the Article content type has an entity-reference field field_eru_known that
    points at nodes. Inspect the live field configuration and tell me which entity-reference selection
    handler it uses.
  criteria: 'unpublished: field.field.node.article.field_eru_known has settings.handler = ''unpublished''
    (Unpublished Default), so it can reference unpublished nodes.'
  bundle: entity_reference_unpublished
  rubric_ref: rubric/entity_reference_unpublished_eru_known_node_handler@1.0
  tags:
