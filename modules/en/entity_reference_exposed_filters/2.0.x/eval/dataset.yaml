metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: entity_reference_exposed_filters
  version: 2.0.x
  note: 'Provides one Views filter plugin, eref_node_titles (class EREFNodeTitles extends ManyToOne),
    registered on the node_field_data table via hook_views_data_alter(). It turns a node entity-reference
    relationship into an exposed dropdown of referenced node titles. No admin UI (configure=null), no
    permissions, no Drush. All medium/hard cases are grounded in real Views config / views data: introspection
    reads a view that uses the filter and the views-data registration; execution adds/removes the eref_node_titles
    filter in a live view''s config and a verify inspects views.view.eref_eval. NOTE: a fully working
    filter also needs a node entity-reference relationship in the view; the verify checks the filter''s
    presence/plugin_id in config, which is the module-specific, deterministically-checkable part.'
questions:
- id: eref-filter-id
  input: What Views filter does the entity_reference_exposed_filters module provide, what is its machine
    id, and on which Views table is it available?
  criteria: It provides the filter 'Entity Reference Exposed Filters Node Titles' with id eref_node_titles
    (class EREFNodeTitles extends ManyToOne), registered on the node_field_data (Content) table via hook_views_data_alter().
  bundle: entity_reference_exposed_filters
  rubric_ref: rubric/entity_reference_exposed_filters_eref_filter_id@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: eref-relationship
  input: To use the entity_reference_exposed_filters 'node titles' filter in a View, what must the View
    already have, and is the filter exposed or not?
  criteria: The View needs a standard node entity-reference relationship (a 'Content referenced from ...'
    relationship). The eref_node_titles filter is always exposed (its expose button is disabled) and marks
    itself broken if there is no valid relationship.
  bundle: entity_reference_exposed_filters
  rubric_ref: rubric/entity_reference_exposed_filters_eref_relationship@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: eref-options
  input: Which extra options does the entity_reference_exposed_filters node-titles filter offer for controlling
    its list of options (e.g. sorting and published status)?
  criteria: sort_by (nid/title), sort_order (ASC/DESC), sort_bundle_order (ASC/DESC), get_unpublished
    (Unpublished/Published/All), and get_filter_no_results (drop options that would return no results).
  bundle: entity_reference_exposed_filters
  rubric_ref: rubric/entity_reference_exposed_filters_eref_options@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: eref-view-filter
  input: On this Drupal site there is a View with machine name 'eref_eval'. Inspect its configuration
    and report the plugin id of the filter it uses from the entity_reference_exposed_filters module.
  criteria: The eref_eval view's default display has a filter with plugin_id eref_node_titles (read via
    'drush cget views.view.eref_eval' or by loading the view).
  bundle: entity_reference_exposed_filters
  rubric_ref: rubric/entity_reference_exposed_filters_eref_view_filter@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/entity_reference_exposed_filters-view-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/entity_reference_exposed_filters-view-cleanup.sh
- id: eref-views-data
  input: On this Drupal site, inspect the Views data for the node_field_data (Content) table and report
    the machine id of the filter that the entity_reference_exposed_filters module adds to it.
  criteria: Views data for node_field_data includes a filter with id eref_node_titles (from hook_views_data_alter).
    Inspect via \Drupal::service('views.views_data')->get('node_field_data')['eref_node_titles'].
  bundle: entity_reference_exposed_filters
  rubric_ref: rubric/entity_reference_exposed_filters_eref_views_data@1.0
