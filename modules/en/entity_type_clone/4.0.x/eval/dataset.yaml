metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: entity_type_clone
  version: 4.0.x
  note: 'Entity Type Clone is two forms and a batch worker: entity_type_clone.type (/admin/config/entity-type-clone,
    the module''s configure route) clones a bundle plus its FieldConfigs and its enabled form/view displays,
    and entity_type_clone.role (/admin/config/role-clone) creates a new user_role and calls user_role_grant_permissions()
    with the source role''s permissions. Both routes require the single permission ''access entity type
    clone'', which also gates the ''Clone X'' entity operation added to node/paragraph/taxonomy_term/profile
    bundle listings. Clonable entity types are block_content, node and taxonomy_term always, plus paragraph/profile/storage
    when those modules exist. The module has no config, no schema, no services, no Drush commands and
    no plugin types. Medium cases read live role permissions and live bundle/field configuration; hard
    cases require actually producing the cloned bundle (type + field + both displays) and the cloned role
    (identical permission set) on the running site.'
questions:
- id: entity_type_clone-where-and-permission
  input: The entity_type_clone module is installed on a Drupal 11 site. What are the two admin paths it
    adds, and which permission does a user need to use them?
  criteria: It adds /admin/config/entity-type-clone (route entity_type_clone.type, the module's configure
    route, for cloning bundles) and /admin/config/role-clone (route entity_type_clone.role, for cloning
    user roles). Both require the permission 'access entity type clone', which also controls the 'Clone
    <label>' operation link added to the content type, vocabulary, paragraph type and profile type listings.
  bundle: entity_type_clone
  rubric_ref: rubric/entity_type_clone_entity_type_clone_where_and_permission@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: entity_type_clone-what-is-clonable
  input: Which entity types can Drupal's entity_type_clone module clone bundles for, and what does the
    clone actually copy across besides the bundle itself?
  criteria: Always block_content, node and taxonomy_term; plus paragraph, profile and storage when the
    paragraphs, profile or storage modules are enabled. The batch copies the bundle entity itself, every
    bundle-level FieldConfig (base fields and taxonomy's 'parent' are skipped, and fields already present
    on the target are skipped), every enabled form-mode and view-mode display, third-party view-display
    settings such as field_group, and the source's extra-field visibility. Field storage is shared, not
    duplicated, and no content is cloned.
  bundle: entity_type_clone
  rubric_ref: rubric/entity_type_clone_entity_type_clone_what_is_clonable@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: entity_type_clone-role-clone
  input: How does the role cloning feature of Drupal's entity_type_clone module work - what exactly ends
    up on the new role, and what is not copied?
  criteria: The CloneRole form at /admin/config/role-clone creates a new user_role entity from the label
    and machine name you type, then calls user_role_grant_permissions($new_id, $source_role->getPermissions()),
    so the clone gets exactly the source role's permission list. Nothing else is copied - not the weight,
    not is_admin, and no users are assigned to the new role.
  bundle: entity_type_clone
  rubric_ref: rubric/entity_type_clone_entity_type_clone_role_clone@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: entity_type_clone-role-perm
  input: On this Drupal site there are two roles whose machine names start with etc_probe_. Inspect the
    running site and tell me which one of them is allowed to use the Entity Type Clone admin forms, and
    name the permission that decides it.
  criteria: etc_probe_beta. It holds the permission 'access entity type clone' (the requirement on both
    entity_type_clone.type and entity_type_clone.role); etc_probe_alpha only has 'access content'.
  bundle: entity_type_clone
  rubric_ref: rubric/entity_type_clone_entity_type_clone_role_perm@1.0
  tags:
