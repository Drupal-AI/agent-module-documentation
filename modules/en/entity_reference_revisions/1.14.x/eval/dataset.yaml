metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: entity_reference_revisions
  version: 1.14.x
  note: ERR is an API/field-infrastructure module (foundation for Paragraphs) with no config UI, so all
    cases are `recipe` (response-graded), not `execution` (live-state). Cases probe the field type's dual
    storage columns, how it differs from core entity_reference, the needs-save interface, and the orphan-purge
    surface.
questions:
- id: err-field-type-columns
  input: On a Drupal 11 site, which field type does the Entity Reference Revisions module provide, and
    what does a single field item store beyond a plain entity reference? Name the field type id and the
    stored properties.
  criteria: The `entity_reference_revisions` field type. Each item stores both `target_id` (the referenced
    entity ID) and `target_revision_id` (the specific pinned revision), plus a computed `entity` property
    that loads that revision.
  bundle: entity_reference_revisions
  rubric_ref: rubric/entity_reference_revisions_err_field_type_columns@1.0
  tags:
  - mode:recipe
- id: err-vs-core-entity-reference
  input: How does an entity_reference_revisions field differ from a core entity_reference field on a Drupal
    site? Explain in terms of what each one resolves to.
  criteria: Core entity_reference stores only target_id and always resolves to the target's default/current
    revision. ERR additionally stores target_revision_id, so a host revision pins the exact child revision
    that existed when the host was saved — enabling revisionable composite children like Paragraphs.
  bundle: entity_reference_revisions
  rubric_ref: rubric/entity_reference_revisions_err_vs_core_entity_reference@1.0
  tags:
  - mode:recipe
- id: err-widget-formatters
  input: For an entity_reference_revisions field in Drupal, which widget attaches an existing referenced
    entity via autocomplete, and which formatter renders the referenced revision in a chosen view mode?
    Name the plugin ids.
  criteria: 'Widget: `entity_reference_revisions_autocomplete`. Formatter: `entity_reference_revisions_entity_view`
    (renders in a view mode); the `entity_reference_revisions_label` formatter shows just the label, optionally
    linked.'
  bundle: entity_reference_revisions
  rubric_ref: rubric/entity_reference_revisions_err_widget_formatters@1.0
  tags:
  - mode:recipe
- id: err-needs-save
  input: In a custom Drupal module I have a child content entity that should get a new revision saved
    automatically whenever its parent host entity is saved through an entity_reference_revisions field.
    What interface/trait from the ERR module should the child entity use, and what methods does it provide?
  criteria: Implement `EntityNeedsSaveInterface` and use `EntityNeedsSaveTrait`, which provide `needsSave()`
    / `setNeedsSave(bool)`. On host save, ERR creates a new revision of any referenced entity whose needsSave()
    is TRUE and updates its target_revision_id.
  bundle: entity_reference_revisions
  rubric_ref: rubric/entity_reference_revisions_err_needs_save@1.0
  tags:
  - mode:recipe
- id: err-read-item-api
  input: In PHP on a Drupal site, given a host entity `$host` with an entity_reference_revisions field
    `field_children`, how do I read the pinned revision ID and the loaded child entity of the first item?
    Show the code.
  criteria: $item = $host->get('field_children')->get(0); then $item->target_id, $item->target_revision_id
    (the pinned revision), and $item->entity (the loaded target revision).
  bundle: entity_reference_revisions
  rubric_ref: rubric/entity_reference_revisions_err_read_item_api@1.0
  tags:
  - mode:recipe
- id: err-orphan-purge-drush
  input: Composite child entities (e.g. paragraphs) whose parent no longer references them have piled
    up as orphan revisions on a Drupal site. Which drush command does the Entity Reference Revisions module
    provide to purge them for the `paragraph` entity type?
  criteria: 'drush err:purge paragraph (alias: errp). The <types> argument is a comma-delimited list of
    composite entity type ids; running err:purge with no argument prompts interactively.'
  bundle: entity_reference_revisions
  rubric_ref: rubric/entity_reference_revisions_err_orphan_purge_drush@1.0
  tags:
  - mode:recipe
- id: err-orphan-purger-service
  input: Programmatically on a Drupal site, which ERR service finds and deletes orphaned composite revisions,
    and what permission gates the admin orphan-deletion form? Name the service id and the permission.
  criteria: Service `entity_reference_revisions.orphan_purger` (EntityReferenceRevisionsOrphanPurger)
    with getCompositeEntityTypes() and setBatch($types). The admin delete form is gated by the `delete
    orphan revisions` permission; a queue worker processes purge jobs on cron.
  bundle: entity_reference_revisions
  rubric_ref: rubric/entity_reference_revisions_err_orphan_purger_service@1.0
  tags:
  - mode:recipe
