metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: entitygroupfield
  version: 2.0.x
  note: 'Grounded in the real computed base field `entitygroupfield`, which the module attaches to entity
    types that have a Group relation. On this site the `user` entity type always has it (group memberships)
    and it sits in the HIDDEN region by default. Medium/hard cases add/inspect a widget component for
    `entitygroupfield` on core.entity_form_display.user.user.default. Reset/cleanup restore baseline by
    removing the component (returns the field to the hidden region). Widgets: entitygroupfield_select_widget
    (default), entitygroupfield_autocomplete_widget.'
questions:
- id: egf-widgets
  input: The entitygroupfield module lets editors set an entity's groups from its own edit form. Which
    two field widgets does it provide for that, and where do you enable the field for a given content
    type?
  criteria: It provides the 'Group select' (entitygroupfield_select_widget, default) and 'Group autocomplete'
    (entitygroupfield_autocomplete_widget) widgets. You enable the field by adding its widget on the entity's
    Manage form display (the computed 'entitygroupfield' field is hidden by default).
  bundle: entitygroupfield
  rubric_ref: rubric/entitygroupfield_egf_widgets@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: egf-formatters
  input: What formatters does entitygroupfield provide to display an entity's parent group, and which
    is the default?
  criteria: parent_group_label_formatter (default, shows the group label with an optional link), parent_group_entity_formatter
    (renders the group entity in a view mode), and parent_group_id_formatter (outputs the group ID).
  bundle: entitygroupfield
  rubric_ref: rubric/entitygroupfield_egf_formatters@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: egf-dependency-field
  input: What module does entitygroupfield require, and how is its 'Groups' field added to an entity type
    — is it a normal configurable field you create by hand?
  criteria: It requires the group module. The 'entitygroupfield' field is a computed base field (no_ui=TRUE)
    automatically attached to every entity type that has a Group relation; it is placed in the hidden
    region by default, not created by hand.
  bundle: entitygroupfield
  rubric_ref: rubric/entitygroupfield_egf_dependency_field@1.0
  tags:
  - mode:recipe
  - difficulty:easy
