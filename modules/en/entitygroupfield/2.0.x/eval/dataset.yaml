  criteria: 'entitygroupfield_select_widget (Group select): in core.entity_form_display.user.user.default
    the entitygroupfield component uses type entitygroupfield_select_widget.'
  bundle: entitygroupfield
  rubric_ref: rubric/entitygroupfield_egf_known_widget@1.0
