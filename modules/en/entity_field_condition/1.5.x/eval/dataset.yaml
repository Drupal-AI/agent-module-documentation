metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: entity_field_condition
  version: 1.5.x
  note: 'Entity Field Condition provides ONE Condition plugin, node_field, that checks whether a node
    in context has a chosen field whose value is NULL / equals (specified, ===) / contains (regex preg_match)
    a configured value. It requires a node context and is most commonly used for block visibility, where
    its settings are stored under a placed block''s config at block.block.<id> -> visibility.node_field
    (keys: id, entity_type_id=node, entity_bundle, field, value_source, value, negate, context_mapping).
    Config schema id condition.plugin.node_field. No settings form (configure=null), no permissions, no
    Drush, no plugin types. medium/hard cases are grounded in that real block visibility config: introspection
    reads back the field/value or value_source from a placed block; execution adds a node_field condition
    to a placed block and is verified against the live block config.'
questions:
- id: efc-plugin-id-and-sources
  input: In the Drupal contrib module entity_field_condition, what is the machine name (plugin id) of
    the Condition plugin it provides, and what are the three 'Value Source' comparison options it offers
    for checking a node field's value?
  criteria: 'The plugin id is node_field. Its value_source options are: null (''Is NULL''), specified
    (exact === match), and contains (regex preg_match against the field value).'
  bundle: entity_field_condition
  rubric_ref: rubric/entity_field_condition_efc_plugin_id_and_sources@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: efc-where-stored
  input: I want a block to appear only when the current node's field has a certain value, using entity_field_condition.
    Which condition do I use, and where does that configuration get stored for a placed block?
  criteria: 'Use the node_field condition in the block''s Visibility settings. For a placed block it is
    stored in the block config entity block.block.<id> under visibility.node_field (with keys entity_bundle,
    field, value_source, value, negate, context_mapping). Config schema id: condition.plugin.node_field.'
  bundle: entity_field_condition
  rubric_ref: rubric/entity_field_condition_efc_where_stored@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: efc-any-bundle-and-context
  input: Does the entity_field_condition node_field condition require selecting a specific content type,
    and what entity context does it need to evaluate?
  criteria: 'No specific type is required: entity_bundle can be left empty to mean ''Any bundle''. The
    condition requires a node context (@ContextDefinition entity:node); in block visibility the mapping
    is @node.node_route_context:node. It evaluates against the field of the node in context.'
  bundle: entity_field_condition
  rubric_ref: rubric/entity_field_condition_efc_any_bundle_and_context@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: efc-known-block-value
  input: On this site a block with machine id 'efc_known_block' has an entity_field_condition 'Node Field'
    visibility condition. Inspect the live block configuration and state the exact value the condition
    compares the node field against.
  criteria: The condition compares the Article node's 'title' field to the value 'EFC Target Value' (value_source
    specified). Found in block.block.efc_known_block -> visibility.node_field.value.
  bundle: entity_field_condition
  rubric_ref: rubric/entity_field_condition_efc_known_block_value@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/efc-known-block-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/efc-known-block-cleanup.sh
- id: efc-source-block-mode
  input: The placed block 'efc_source_block' on this site uses the entity_field_condition node_field visibility
    condition. Inspect the live configuration and state which Value Source (comparison mode) it is configured
    to use.
  criteria: It uses value_source 'contains' (regex preg_match), configured on the node 'title' field with
    value 'news'. Found in block.block.efc_source_block -> visibility.node_field.value_source.
  bundle: entity_field_condition
