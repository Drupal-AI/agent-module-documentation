  applicable_bundles:
  - entity_pager
  checks:
  - kind: must_contain_any
    values:
    - Entity Pager
    - entity_pager
    - style
  scoring:
    combine: all_pass
- id: entity_pager_entity_pager_circular_option
  version: '1.0'
  applicable_bundles:
  - entity_pager
  checks:
  - kind: must_contain_any
    values:
    - circular_paging
