metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: entity_pager
  version: 2.0.x
  note: 'Entity Pager provides a single Views style plugin (id ''entity_pager'', class Drupal\entity_pager\Plugin\views\style\EntityPager)
    that renders prev/All/next navigation on an entity''s canonical page from a View listing the sibling
    entities. No configure route (configure=null), no settings form, no permissions, no Drush. Its only
    persistent state is each View''s style config: views.view.<id> -> display.<d>.display_options.style
    (type + options link_prev/link_next/link_all_url/link_all_text/display_all/display_count/circular_paging/show_disabled_links/relationship).
    A demo View ''entity_pager_example'' ships DISABLED with a block display ''entity_pager_example_block''.
    Medium cases enable that demo View and set sentinel style options for the agent to read back; hard
    cases toggle circular_paging on the demo View and build a new View that uses the entity_pager style.
    Depends on core Views only.'
questions:
- id: entity_pager-which-format
  input: On a Drupal 11 site I want Next/Previous links on each Article node's page so visitors can walk
    through the articles. The entity_pager module is installed. Which Views format/style do I select,
    and does entity_pager have its own admin settings page?
  criteria: Build a View (usually a block display) listing the entities, then set its Format/style to
    'Entity Pager' (style plugin id entity_pager). There is no admin settings page (configure=null); all
    options live in the View's style settings and it depends on core Views.
  bundle: entity_pager
  rubric_ref: rubric/entity_pager_entity_pager_which_format@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: entity_pager-circular-option
  input: In the entity_pager Views style, which option makes the pager wrap around so that clicking 'next'
    on the last item goes to the first item (and 'prev' on the first goes to the last)?
  criteria: 'The ''Circular paging'' style option (config key circular_paging: true) wraps last->first
    and first->last. When it is off, the ends show disabled links if ''show_disabled_links'' is on.'
  bundle: entity_pager
  rubric_ref: rubric/entity_pager_entity_pager_circular_option@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: entity_pager-all-link-token
  input: With the entity_pager Views style, how do I make the middle 'All' link point to a page derived
    from the current entity, e.g. a referenced company, and show that company's title as the link text?
  criteria: Set the 'All link URL' (link_all_url) and 'All link label' (link_all_text) to a token that
    relates to the entity, e.g. an entity-reference token like [node:field_company]; putting the same
    reference token in the label box auto-renders the referenced entity's title. Tokens are replaced against
    the current entity.
  bundle: entity_pager
  rubric_ref: rubric/entity_pager_entity_pager_all_link_token@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: entity_pager-known-next-label
  input: This Drupal site has an enabled View that uses the Entity Pager style. Inspect the live Views
    configuration and report the exact text configured as the Next-link label on that View's default display.
  criteria: The entity_pager_example View's default display uses the entity_pager style with link_next
    set to 'EP_NEXT_SENTINEL_42 >' (read from views.view.entity_pager_example -> display.default.display_options.style.options.link_next).
  bundle: entity_pager
  rubric_ref: rubric/entity_pager_entity_pager_known_next_label@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/entity_pager-known-label-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/entity_pager-known-label-cleanup.sh
- id: entity_pager-inspect-all-label
  input: An enabled View on this site uses the Entity Pager style with circular paging turned on. Inspect
    the live configuration and report the label text configured for the middle 'All' link on its default
    display.
  criteria: In views.view.entity_pager_example -> display.default.display_options.style.options, circular_paging
    is TRUE and link_all_text is 'EP_ALL_SENTINEL_77'.
  bundle: entity_pager
  rubric_ref: rubric/entity_pager_entity_pager_inspect_all_label@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/entity_pager-circular-state-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/entity_pager-circular-state-cleanup.sh
- id: entity_pager-enable-circular
  input: This site has an enabled View 'entity_pager_example' whose default display uses the Entity Pager
    style. Turn ON circular paging for that display (so the pager wraps last->first) and save the change
    to the live site.
  criteria: Set display.default.display_options.style.options.circular_paging to TRUE on views.view.entity_pager_example
    and save (e.g. via the View entity API or drush).
  bundle: entity_pager
