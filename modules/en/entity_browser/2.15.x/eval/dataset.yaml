# Generated from evals.json by evaluation/to_commons.py.
# Edit evals.json and rerun the script; do not edit this file.
metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: entity_browser
  version: 2.15.x
  note: Entity Browser exposes its configuration through the entity_browser.browser.* config entity plus
    six plugin managers, so all cases are `recipe` (response-graded) and require no site mutation.
questions:
- id: entitybrowser-config-entity
  input: On a Drupal 11 site using Entity Browser, what is the machine name / config prefix of the config
    entity that stores a single browser's configuration, and where is its admin UI? Name the config entity
    and the admin route or path.
  criteria: Each browser is the config entity entity_browser.browser.{name}, managed at /admin/config/content/entity_browser
    (route entity.entity_browser.collection).
  bundle: entity_browser
  rubric_ref: rubric/entity_browser_entitybrowser_config_entity@1.0
  tags:
  - mode:recipe
- id: entitybrowser-four-parts
  input: I'm assembling an entity browser. Which four pluggable parts make up a browser config entity,
    i.e. the four plugin types selected per browser? Name them.
  criteria: display, widget_selector, widgets, and selection_display (Display, Widget, WidgetSelector,
    SelectionDisplay plugin types).
  bundle: entity_browser
  rubric_ref: rubric/entity_browser_entitybrowser_four_parts@1.0
  tags:
  - mode:recipe
- id: entitybrowser-plugin-namespace
  input: I want to add a custom Widget plugin to Entity Browser in my module. What PHP namespace / directory
    does the plugin class go in, which annotation does it use, and which base class does it extend?
  criteria: Class in src/Plugin/EntityBrowser/Widget/, annotated @EntityBrowserWidget, extending Drupal\entity_browser\WidgetBase.
  bundle: entity_browser
  rubric_ref: rubric/entity_browser_entitybrowser_plugin_namespace@1.0
  tags:
  - mode:recipe
- id: entitybrowser-display-types
  input: In Entity Browser, the Display plugin decides how a browser opens. What are the three core display
    plugins that ship with the module?
  criteria: iframe, modal, and standalone (standalone has its own page/route).
  bundle: entity_browser
  rubric_ref: rubric/entity_browser_entitybrowser_display_types@1.0
  tags:
  - mode:recipe
- id: entitybrowser-field-widget
  input: I have an entity_reference field and want editors to pick items through an Entity Browser instead
    of the autocomplete. On Manage form display, which field widget do I choose, and what is its machine
    name?
  criteria: The 'Entity browser' widget, machine name entity_reference_browser (for file/image fields
    it is entity_browser_file).
  bundle: entity_browser
  rubric_ref: rubric/entity_browser_entitybrowser_field_widget@1.0
  tags:
  - mode:recipe
- id: entitybrowser-render-element
  input: In custom PHP on a Drupal 11 site, I want to embed a configured entity browser inline in my own
    form and get the selected entities back. Which form/render element type do I use, and how do I convert
    its submitted value into entity objects?
  criteria: 'Use ''#type'' => ''entity_browser'' (EntityBrowserElement) with #entity_browser set to the
    browser id; convert the type:id value with EntityBrowserElement::processEntityIds().'
  bundle: entity_browser
  rubric_ref: rubric/entity_browser_entitybrowser_render_element@1.0
  tags:
  - mode:recipe
- id: entitybrowser-example-submodule
  input: I want ready-made example entity browsers to look at and copy, without building configuration
    from scratch. Which Entity Browser submodule provides them, and what is its machine name?
  criteria: The Entity Browser example submodule, machine name entity_browser_example, which ships example
    browsers.
  bundle: entity_browser
  rubric_ref: rubric/entity_browser_entitybrowser_example_submodule@1.0
  tags:
  - mode:recipe
- id: entitybrowser-standalone-permission
  input: In Entity Browser, a browser with a standalone display exposes its own page/route. What permission
    gates access to that browser's pages, and what is the pattern of the auto-generated per-browser permission?
  criteria: 'A dynamic permission per route-exposing browser: ''access {browser_id} entity browser pages''
    (e.g. access sample entity browser pages); the admin permission is ''administer entity browsers''.'
  bundle: entity_browser
  rubric_ref: rubric/entity_browser_entitybrowser_standalone_permission@1.0
  tags:
  - mode:recipe
