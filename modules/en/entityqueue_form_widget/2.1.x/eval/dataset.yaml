metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: entityqueue_form_widget
  version: 2.1.x
  note: 'Entityqueue Form Widget is one hook-service class (EntityqueueFormWidgetHooks, hook_form_node_form_alter)
    that adds an ''Entityqueues settings'' details element to the node form''s advanced/sidebar group
    with a checkbox per subqueue whose queue targets the node''s entity type+bundle; on submit it addItem/removeItem
    on the EntitySubqueue. No configure route, no own permissions (reuses Entityqueue''s ''update <queue>
    entityqueue'' / ''manipulate all entityqueues''), no plugins, no Drush. Evals ground in real Entityqueue
    config: introspection reads a queue that would show on Article forms; execution creates a node/article-targeting
    queue and verifies the widget offers its checkbox by rendering the Article node form as user 1.'
questions:
- id: entityqueue_form_widget-where-appears
  input: After enabling the entityqueue_form_widget module on a Drupal site, where does its queue widget
    show up for editors, and on which forms?
  criteria: It implements hook_form_node_form_alter(), so it appears on node add/edit forms as an 'Entityqueues
    settings' details element placed in the advanced group (the right sidebar), listing checkboxes for
    the matching entityqueues.
  bundle: entityqueue_form_widget
  rubric_ref: rubric/entityqueue_form_widget_entityqueue_form_widget_where_appears@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: entityqueue_form_widget-which-queues
  input: With entityqueue_form_widget, what determines whether a given entityqueue's checkbox shows up
    on a particular node's edit form?
  criteria: A subqueue's checkbox shows only when its parent queue's entity settings target_type equals
    the node's entity type (node) AND the queue's handler_settings.target_bundles is empty or contains
    the node's bundle (getAllowedSubqueueList()). Additionally the user must have 'update <queue> entityqueue'
    or 'manipulate all entityqueues'.
  bundle: entityqueue_form_widget
  rubric_ref: rubric/entityqueue_form_widget_entityqueue_form_widget_which_queues@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: entityqueue_form_widget-permissions
  input: Does the entityqueue_form_widget module define its own permissions? Which permission must an
    editor have to see and use a queue's checkbox on the node form?
  criteria: 'No, it defines no permissions of its own. It reuses Entityqueue''s permissions: an editor
    needs ''update <queue_id> entityqueue'' (per queue) or ''manipulate all entityqueues'' for that queue''s
    checkbox to be rendered.'
  bundle: entityqueue_form_widget
  rubric_ref: rubric/entityqueue_form_widget_entityqueue_form_widget_permissions@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: entityqueue_form_widget-which-queue-intro
  input: On this Drupal site, an entityqueue is configured that the Entityqueue Form Widget would display
    on Article node edit forms. Inspect the live entityqueue configuration and give the machine name of
    that queue and the bundle it targets.
  criteria: The queue is eqfw_intro; its entity_settings.target_type is node and handler_settings.target_bundles
    contains article, so the widget lists it on Article node forms. Discoverable via `drush cget entityqueue.entity_queue.eqfw_intro`
    or `drush config:status | grep entity_queue`.
  bundle: entityqueue_form_widget
  rubric_ref: rubric/entityqueue_form_widget_entityqueue_form_widget_which_queue_intro@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/entityqueue_form_widget-queue-intro-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/entityqueue_form_widget-queue-intro-cleanup.sh
- id: entityqueue_form_widget-queue-target-type
  input: On this Drupal site there is an entityqueue (eqfw_intro) that the Entityqueue Form Widget would
    surface on node forms. Inspect the live entityqueue configuration and state which entity type its
    parent queue targets (the value that decides which node forms show its checkbox).
  criteria: eqfw_intro's parent queue has entity_settings.target_type = node, which is why the widget
    only shows it on node forms (and, via target_bundles=article, only on Article). Discoverable via `drush
    cget entityqueue.entity_queue.eqfw_intro entity_settings.target_type`.
  bundle: entityqueue_form_widget
  rubric_ref: rubric/entityqueue_form_widget_entityqueue_form_widget_queue_target_type@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/entityqueue_form_widget-queue-intro-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/entityqueue_form_widget-queue-intro-cleanup.sh
- id: entityqueue_form_widget-make-appear
  input: On this Drupal site, make the Entityqueue Form Widget offer a queue named eqfw_task on Article
    node add/edit forms. Create an entityqueue with machine id eqfw_task that targets Article nodes, so
    the widget renders its checkbox. Apply the change to the live site.
  criteria: An entityqueue eqfw_task exists with entity_settings.target_type=node and handler_settings.target_bundles
    including article (e.g. EntityQueue::create(['id'=>'eqfw_task','label'=>...,'handler'=>'simple','entity_settings'=>['target_type'=>'node','handler'=>'default','handler_settings'=>['target_bundles'=>['article'=>'article']]]])->save()).
    Rendering the Article node form then includes $form['entityqueue_form_widget']['entityqueues']['eqfw_task'].
  bundle: entityqueue_form_widget
  rubric_ref: rubric/entityqueue_form_widget_entityqueue_form_widget_make_appear@1.0
