    verify: agent-module-documentation/evaluation/verify/entity_usage_views_field-restrict-node-verify.sh
- id: euvf-expose-node-and-media
  input: Configure Entity Usage on this site so that the entity_usage_views_field 'Entity usage count'
    field is available for the node and media entity types (and only those two). Apply the change to the
    live site.
  criteria: Set entity_usage.settings:track_enabled_target_entity_types to exactly ['node','media'] (order
