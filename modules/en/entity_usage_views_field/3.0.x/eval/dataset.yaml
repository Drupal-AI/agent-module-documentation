    setup: agent-module-documentation/evaluation/verify/entity_usage_views_field-tracked-media-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/entity_usage_views_field-tracked-media-cleanup.sh
- id: euvf-restrict-node
  input: On this Drupal site, configure Entity Usage so that entity_usage_views_field's 'Entity usage
    count' field is exposed for the node entity type ONLY (and not for media or any other type). Apply
    the change to the live site.
  criteria: Set entity_usage.settings:track_enabled_target_entity_types to exactly ['node'] (e.g. drush
    cset entity_usage.settings track_enabled_target_entity_types '[node]', or via the Entity Usage settings
    form / configFactory). The usage-count Views field is then registered only on the node table.
  bundle: entity_usage_views_field
  rubric_ref: rubric/entity_usage_views_field_euvf_restrict_node@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
