    cleanup: agent-module-documentation/evaluation/verify/entity_share_websub_subscriber-known-hub-url-cleanup.sh
- id: entity_share_websub_subscriber-configure-settings
  input: Configure entity_share_websub_subscriber on this site so that Entity Share's default Synchronize
    button is hidden and the hub subscribe endpoint path is set to /eswsub-target. Apply the change to
