metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: entity_share_websub_subscriber
  version: 1.1.x
  note: Subscriber submodule of entity_share_websub; the only configurable one. Real config object entity_share_websub_subscriber.settings
    with keys hide_default_button, break_subscription_on_edit, import_config, subscribe_hub_url (default
    /subscribe), cancel_title/description/text/confirm_text. Settings form at /admin/config/entity-share-websub-subscriber
    (permission 'administer entity share websub subscriber settings'). Callback routes /subscription/{subscription_key}
    are _access TRUE, authenticated via X-Hub-Signature. Medium introspection reads back a known config
    value; hard execution writes config keys, verified against live config. Easy cases cover config route/keys,
    callback auth, and the pull-form buttons.
questions:
- id: entity_share_websub_subscriber-config-route
  input: On a site with entity_share_websub_subscriber, where is its settings form, and which single setting
    must you choose for the automated background sync to work?
  criteria: The form is at /admin/config/entity-share-websub-subscriber (route entity_share_websub_subscriber.settings,
    config object entity_share_websub_subscriber.settings). You must select an 'Import config' (import_config)
    — the Entity Share import configuration the automated sync uses.
  bundle: entity_share_websub_subscriber
  rubric_ref: rubric/entity_share_websub_subscriber_entity_share_websub_subscriber_config_route@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: entity_share_websub_subscriber-callback-auth
  input: The entity_share_websub_subscriber module exposes /subscription/{subscription_key} callback routes
    with no permission requirement (_access TRUE). How are incoming hub requests to these routes actually
    authenticated?
  criteria: They are authenticated by recomputing the X-Hub-Signature (HMAC sha256 over the request data
    with the per-subscription secret, via the base module's SignatureTrait) and comparing it to the incoming
    header. There is no Drupal permission; a mismatch is rejected (update/delete still return 202 to prevent
    brute-forcing).
  bundle: entity_share_websub_subscriber
  rubric_ref: rubric/entity_share_websub_subscriber_entity_share_websub_subscriber_callback_auth@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: entity_share_websub_subscriber-pull-buttons
  input: How does a content editor actually subscribe to remote content with entity_share_websub_subscriber,
    and what setting hides Entity Share's default manual sync button?
  criteria: The module adds Subscribe/Unsubscribe buttons (and a status column) to the Entity Share client
    pull form; the editor selects entities and clicks Subscribe. Setting hide_default_button = true removes
    Entity Share's built-in 'Synchronize' button from that form.
  bundle: entity_share_websub_subscriber
  rubric_ref: rubric/entity_share_websub_subscriber_entity_share_websub_subscriber_pull_buttons@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: entity_share_websub_subscriber-known-hub-url
  input: This site's entity_share_websub_subscriber has been configured with a custom hub subscribe endpoint
    path. Inspect the live configuration and report the value of the subscribe hub URL setting.
  criteria: config entity_share_websub_subscriber.settings has subscribe_hub_url = /eswsub-known-hub (drush
    cget entity_share_websub_subscriber.settings subscribe_hub_url).
  bundle: entity_share_websub_subscriber
  rubric_ref: rubric/entity_share_websub_subscriber_entity_share_websub_subscriber_known_hub_url@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
