rubrics:
- id: entity_share_websub_subscriber_entity_share_websub_subscriber_config_route
  version: '1.0'
  applicable_bundles:
  - entity_share_websub_subscriber
  checks:
  - kind: must_contain_any
    values:
    - /admin/config/entity-share-websub-subscriber
    - entity_share_websub_subscriber.settings
    - import_config
    - import config
  scoring:
    combine: all_pass
- id: entity_share_websub_subscriber_entity_share_websub_subscriber_callback_auth
  version: '1.0'
  applicable_bundles:
  - entity_share_websub_subscriber
  checks:
  - kind: must_contain_any
    values:
    - X-Hub-Signature
    - signature
    - secret
    - SignatureTrait
  scoring:
    combine: all_pass
- id: entity_share_websub_subscriber_entity_share_websub_subscriber_pull_buttons
  version: '1.0'
  applicable_bundles:
  - entity_share_websub_subscriber
  checks:
  - kind: must_contain_any
    values:
    - pull form
    - Subscribe
    - Unsubscribe
    - hide_default_button
  scoring:
    combine: all_pass
- id: entity_share_websub_subscriber_entity_share_websub_subscriber_known_hub_url
  version: '1.0'
  applicable_bundles:
  - entity_share_websub_subscriber
  checks:
  - kind: must_contain_any
    values:
    - /eswsub-known-hub
  scoring:
    combine: all_pass
- id: entity_share_websub_subscriber_entity_share_websub_subscriber_configure_settings
  version: '1.0'
  applicable_bundles:
  - entity_share_websub_subscriber
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
- id: entity_share_websub_subscriber_entity_share_websub_subscriber_known_cancel_title
  version: '1.0'
  applicable_bundles:
  - entity_share_websub_subscriber
  checks:
  - kind: must_contain_any
    values:
    - ESW Cancel Now?
  scoring:
    combine: all_pass
- id: entity_share_websub_subscriber_entity_share_websub_subscriber_enable_break
  version: '1.0'
  applicable_bundles:
  - entity_share_websub_subscriber
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
