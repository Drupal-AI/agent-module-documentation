rubrics:
- id: entity_share_websub_entity_share_websub_what_protocol
  version: '1.0'
  applicable_bundles:
  - entity_share_websub
  checks:
  - kind: must_contain_any
    values:
    - Entity Share
    - entity_share
    - WebSub
    - websub
    - PubSubHubbub
    - pubsubhubbub
  scoring:
    combine: all_pass
- id: entity_share_websub_entity_share_websub_submodules
  version: '1.0'
  applicable_bundles:
  - entity_share_websub
  checks:
  - kind: must_contain_any
    values:
    - entity_share_websub_hub
    - entity_share_websub_subscriber
    - hub
    - subscriber
  scoring:
    combine: all_pass
- id: entity_share_websub_entity_share_websub_signature
  version: '1.0'
  applicable_bundles:
  - entity_share_websub
  checks:
  - kind: must_contain_any
    values:
    - SignatureTrait
    - getSignature
    - X-Hub-Signature
    - sha256
  scoring:
    combine: all_pass
- id: entity_share_websub_entity_share_websub_hub_worker_delay
  version: '1.0'
  applicable_bundles:
  - entity_share_websub
  checks:
  - kind: must_contain_any
    values:
    - hub_worker_delay
    - queue worker
    - HubWorker
    - entity_share_websub
    - process_on_terminate
    - delay
  scoring:
    combine: all_pass
- id: entity_share_websub_entity_share_websub_submodules_enabled
  version: '1.0'
  applicable_bundles:
  - entity_share_websub
  checks:
  - kind: must_contain_any
    values:
    - entity_share_websub_hub
    - entity_share_websub_subscriber
  scoring:
    combine: all_pass
- id: entity_share_websub_entity_share_websub_enable_hub
  version: '1.0'
  applicable_bundles:
  - entity_share_websub
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
