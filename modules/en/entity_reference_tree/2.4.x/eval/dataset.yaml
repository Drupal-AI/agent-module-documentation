metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: entity_reference_tree
  version: 2.4.x
  note: 'Entity Reference Tree provides one field widget ''entity_reference_tree'' (EntityReferenceTreeWidget,
    extends EntityReferenceAutocompleteWidget, multiple_values=TRUE) for entity_reference fields, selected
    on Manage form display. It adds a jsTree modal (checkbox hierarchy + search) beside the autocomplete;
    tree JSON at /admin/entity_reference_tree/json/{entity_type}/{bundles}; builders are tagged services
    entity_reference_tree_builder (TaxonomyTreeBuilder, EntityTreeBuilder). Widget settings schema field.widget.settings.entity_reference_tree:
    theme, dots, worker, disable_animation, force_text, label, dialog_title, placeholder, match_operator,
    match_limit, size, autocomplete_maxlength. Hook: hook_entity_reference_tree_create_term_node_alter.
    No configure route/permission/drush. Medium/hard cases create namespaced entity_reference fields (field_ert_*)
    on node.article and read/set the widget type + settings on the default form display.'
questions:
- id: ert-widget-enable
  input: What field widget does the entity_reference_tree module add, which field type does it work on,
    and where do you switch a field to use it?
  criteria: It adds the 'Entity reference tree widget' (id entity_reference_tree) for entity_reference
    fields. You select it in the field's Manage form display (the widget column), no separate settings
    page.
  bundle: entity_reference_tree
  rubric_ref: rubric/entity_reference_tree_ert_widget_enable@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: ert-widget-settings
  input: Name several settings the entity_reference_tree widget exposes (for example the jsTree theme,
    the button label, the dialog title, autocomplete limits).
  criteria: Settings (field.widget.settings.entity_reference_tree) include theme, dots, worker, disable_animation,
    force_text, label (button label), dialog_title, placeholder, match_operator, match_limit, size, and
    autocomplete_maxlength.
  bundle: entity_reference_tree
  rubric_ref: rubric/entity_reference_tree_ert_widget_settings@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: ert-ui-library
  input: What kind of UI does the entity_reference_tree widget present to editors to select references,
    and which JavaScript tree library does it use?
  criteria: A button opens a modal dialog containing a jsTree hierarchy with checkboxes and a search box;
    editors browse/search and tick entities, which fill the autocomplete field. It bundles the jsTree
    JS library.
  bundle: entity_reference_tree
  rubric_ref: rubric/entity_reference_tree_ert_ui_library@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: ert-known-widget
  input: The Article content type on this site has an entity reference field named field_ert_known. Inspect
    the live default form display and state which field widget that field is using.
  criteria: 'field_ert_known uses the entity_reference_tree widget: in core.entity_form_display.node.article.default
    its component type is entity_reference_tree.'
  bundle: entity_reference_tree
  rubric_ref: rubric/entity_reference_tree_ert_known_widget@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/entity_reference_tree-known-widget-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/entity_reference_tree-known-widget-cleanup.sh
- id: ert-known-theme
  input: On this site an Article entity reference field field_ert_theme uses the Entity Reference Tree
    widget with a specific jsTree theme configured. Inspect the live form display and report the jsTree
    theme set for that widget.
  criteria: 'The widget''s theme setting is default-dark: in core.entity_form_display.node.article.default
    the field_ert_theme component has type entity_reference_tree with settings.theme = default-dark.'
  bundle: entity_reference_tree
  rubric_ref: rubric/entity_reference_tree_ert_known_theme@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/entity_reference_tree-known-theme-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/entity_reference_tree-known-theme-cleanup.sh
- id: ert-switch-widget
  input: The Article content type has an entity reference field field_ert_task that currently uses the
    default autocomplete widget on its default form display. Using the entity_reference_tree module, change
    that field to use the Entity Reference Tree widget, and apply it to the live site.
  criteria: Set the field_ert_task component's widget type to entity_reference_tree in core.entity_form_display.node.article.default
    (via Manage form display, or $fd->setComponent('field_ert_task', ['type' => 'entity_reference_tree',
    ...])->save()).
  bundle: entity_reference_tree
  rubric_ref: rubric/entity_reference_tree_ert_switch_widget@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/entity_reference_tree-switch-widget-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/entity_reference_tree-switch-widget-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/entity_reference_tree-switch-widget-verify.sh
- id: ert-set-dialog-title
  input: The Article field field_ert_dialog already uses the Entity Reference Tree widget, but its popup
    has no custom title. Configure that widget so the tree picker's dialog title reads 'Select items',
    and apply the change to the live site.
  criteria: Set the entity_reference_tree widget's dialog_title setting to 'Select items' for field_ert_dialog
    in core.entity_form_display.node.article.default (settings.dialog_title = 'Select items').
  bundle: entity_reference_tree
  rubric_ref: rubric/entity_reference_tree_ert_set_dialog_title@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: site-owner
    reset: agent-module-documentation/evaluation/verify/entity_reference_tree-set-dialog-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/entity_reference_tree-set-dialog-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/entity_reference_tree-set-dialog-verify.sh
