metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: entity_export_csv
  version: 2.1.x
  note: 'Entity Export CSV exports content entities to CSV. Real, grounded facts: configure route entity_export_csv.settings
    (config object entity_export_csv.settings) whitelists exportable entity types/bundles; export form
    at /admin/content/entity-export-csv; permissions ''administer entity export csv'' and ''use entity
    export csv''; a field_type_export plugin type (manager plugin.manager.field_type_export, annotation
    @FieldTypeExport, base FieldTypeExportBase, override massageExportPropertyValue()); built-in exporters
    include default_export (weight 100 fallback), link_export, address_export, datetime_export, etc.;
    reusable exports are entity_export_csv config entities (config prefix entity_export_csv.entity_export_csv.*)
    with keys entity_type_id, bundle, delimiter, fields[<field>]{enable,order,exporter,form.options}.
    Medium introspection reads back a saved config entity''s delimiter/exporter and a settings value;
    hard execution creates a saved export config entity verified against live config.'
questions:
- id: eec-plugin-extension
  input: In the Drupal entity_export_csv module, how do I add support for exporting a custom or contrib
    field type to CSV? Name the plugin type / annotation and the main method to override.
  criteria: 'Add a field_type_export plugin: a class in Plugin/FieldTypeExport/ annotated @FieldTypeExport
    (declaring field_type), extending FieldTypeExportBase, overriding massageExportPropertyValue() (and
    optionally buildConfigurationForm/getColumns). It is discovered by plugin.manager.field_type_export.'
  bundle: entity_export_csv
  rubric_ref: rubric/entity_export_csv_eec_plugin_extension@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: eec-where-configured
  input: After enabling entity_export_csv, where do I choose which entity types can be exported, where
    do users actually run an export, and which permissions control access?
  criteria: Whitelist entity types/bundles at the settings form /admin/config/content/entity-export-csv/settings
    (config object entity_export_csv.settings, permission 'administer entity export csv'). Users export
    at /admin/content/entity-export-csv (permission 'use entity export csv').
  bundle: entity_export_csv
  rubric_ref: rubric/entity_export_csv_eec_where_configured@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: eec-saved-config-shape
  input: entity_export_csv lets you save reusable export definitions. What kind of object stores them
    and which keys control the CSV delimiter and how each field is rendered?
  criteria: They are entity_export_csv config entities (prefix entity_export_csv.entity_export_csv.*)
    holding entity_type_id, bundle, delimiter, and a fields map keyed by field machine name; each field
    entry has enable, order, exporter (the field_type_export plugin id) and form.options.
  bundle: entity_export_csv
  rubric_ref: rubric/entity_export_csv_eec_saved_config_shape@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: eec-known-config
  input: This Drupal site has a saved Entity Export CSV configuration with id eec_known. Inspect the live
    configuration and report its CSV delimiter character and which field_type_export exporter plugin is
    used to export the title field.
  criteria: eec_known targets node/article with delimiter '|' and exports the title field with the default_export
    exporter (config entity_export_csv.entity_export_csv.eec_known).
  bundle: entity_export_csv
  rubric_ref: rubric/entity_export_csv_eec_known_config@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/entity_export_csv-known-config-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/entity_export_csv-known-config-cleanup.sh
- id: eec-settings-enabled
  input: On this site, which content entity type has been enabled for export in the entity_export_csv
    settings (its entity_types.<id>.enable is set to true)? Inspect the live entity_export_csv.settings
    configuration to answer.
  criteria: 'The user entity type is enabled: entity_export_csv.settings entity_types.user.enable is true.'
  bundle: entity_export_csv
  rubric_ref: rubric/entity_export_csv_eec_settings_enabled@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/entity_export_csv-settings-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/entity_export_csv-settings-cleanup.sh
