rubrics:
- id: entity_export_csv_eec_plugin_extension
  version: '1.0'
  applicable_bundles:
  - entity_export_csv
  checks:
  - kind: must_contain_any
    values:
    - field_type_export
    - '@FieldTypeExport'
    - FieldTypeExportBase
    - massageExportPropertyValue
  scoring:
    combine: all_pass
- id: entity_export_csv_eec_where_configured
  version: '1.0'
  applicable_bundles:
  - entity_export_csv
  checks:
  - kind: must_contain_any
    values:
    - entity_export_csv.settings
    - /admin/config/content/entity-export-csv
    - /admin/content/entity-export-csv
    - administer entity export csv
    - use entity export csv
  scoring:
    combine: all_pass
- id: entity_export_csv_eec_saved_config_shape
  version: '1.0'
  applicable_bundles:
  - entity_export_csv
  checks:
  - kind: must_contain_any
    values:
    - config entity
    - entity_export_csv
    - delimiter
    - exporter
    - fields
  scoring:
    combine: all_pass
- id: entity_export_csv_eec_known_config
  version: '1.0'
  applicable_bundles:
  - entity_export_csv
  checks:
  - kind: must_contain_any
    values:
    - default_export
  scoring:
    combine: all_pass
- id: entity_export_csv_eec_settings_enabled
  version: '1.0'
  applicable_bundles:
  - entity_export_csv
  checks:
  - kind: must_contain_any
    values:
    - user
  scoring:
    combine: all_pass
- id: entity_export_csv_eec_create_config
  version: '1.0'
  applicable_bundles:
  - entity_export_csv
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
- id: entity_export_csv_eec_create_user_config
  version: '1.0'
  applicable_bundles:
  - entity_export_csv
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
