metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: entity_browser_table
  version: 2.0.x
  note: Entity Browser - Table Layout ships exactly one field-widget plugin, entity_reference_browser_table_widget
    (class EntityReferenceBrowserTableWidget), which subclasses entity_browser's EntityReferenceBrowserWidget
    and renders the current selection as a sortable table. It applies to entity_reference and entity_reference_revisions
    fields and is chosen per field on Manage form display (stored as the component 'type' in a core.entity_form_display
    config entity). Its only added setting is additional_fields.options.status (a Status column); all
    other settings are inherited from Entity Browser. configure=null, no routes/permissions/Drush/plugin
    types. Medium introspection reads back which Article field uses the widget; hard execution switches
    a field's form-display widget to the table widget, verified against the live entity_form_display.
questions:
- id: entity_browser_table-widget-id
  input: In Drupal, I want a multi-value entity reference field to show its currently selected entities
    as a sortable table (with drag-to-reorder) instead of Entity Browser's default card grid. Which module
    provides this, and what is the machine name of the field widget I select on Manage form display?
  criteria: The Entity Browser - Table Layout module (entity_browser_table) provides a field widget whose
    id is entity_reference_browser_table_widget, labelled 'Entity Browser - Table'. Select it as the widget
    for the reference field on the bundle's Manage form display.
  bundle: entity_browser_table
  rubric_ref: rubric/entity_browser_table_entity_browser_table_widget_id@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: entity_browser_table-field-types
  input: Which field types does the entity_browser_table 'Entity Browser - Table' widget support, and
    which Entity Browser widget class does it extend?
  criteria: It supports entity_reference and entity_reference_revisions fields, and the widget class EntityReferenceBrowserTableWidget
    extends entity_browser's EntityReferenceBrowserWidget, overriding only how the current selection is
    displayed (a table).
  bundle: entity_browser_table
  rubric_ref: rubric/entity_browser_table_entity_browser_table_field_types@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: entity_browser_table-status-column
  input: The entity_browser_table widget can add an extra 'Status' column to its table. Which widget setting
    enables it, and what does the column show?
  criteria: Tick the widget's 'Additional Fields' checkbox (setting additional_fields.options.status).
    The Status column shows the entity's Content Moderation state when the entity is moderated, otherwise
    Published/Unpublished derived from the status field.
  bundle: entity_browser_table
  rubric_ref: rubric/entity_browser_table_entity_browser_table_status_column@1.0
  tags:
  - mode:recipe
  - difficulty:easy
