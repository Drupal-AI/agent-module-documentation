metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: entityreference_filter_search_api
  version: 2.0.x
  part_of: entityreference_filter
  note: Optional submodule of entityreference_filter that extends the curated reference-view-driven Views
    filter to Search API index fields. It only adds the plugin `entityreference_filter_view_result_search_api`
    (subclass of the parent filter + SearchApiFilterTrait). Cases are `recipe` (response-graded) probing
    documented facts; no site mutation.
questions:
- id: erfsa-purpose
  input: I use the Views Reference Filter module and want its curated, reference-view-driven exposed filter
    to work on a Search API index view. What do I need to enable?
  criteria: Enable the entityreference_filter_search_api submodule (it requires both entityreference_filter
    and search_api). Once enabled, hook_views_data_alter() attaches the reference filter to Search-API-indexed
    entity-id / entity-reference fields; without it those Search API fields are skipped.
  bundle: entityreference_filter_search_api
  rubric_ref: rubric/entityreference_filter_search_api_erfsa_purpose@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: erfsa-plugin-id
  input: What is the Views filter plugin id the Search API integration of Views Reference Filter provides,
    and what class/trait implements it?
  criteria: Plugin id entityreference_filter_view_result_search_api, class EntityReferenceFilterViewResultSearchApi
    which extends the parent EntityReferenceFilterViewResult and uses core Search API's SearchApiFilterTrait.
    Its config schema inherits views.filter.entityreference_filter_view_result.
  bundle: entityreference_filter_search_api
  rubric_ref: rubric/entityreference_filter_search_api_erfsa_plugin_id@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: erfsa-dependencies
  input: What are the module dependencies of entityreference_filter_search_api, and does it add any admin
    UI, permissions, or Drush commands?
  criteria: It depends on entityreference_filter:entityreference_filter and search_api:search_api. It
    has no configuration route (configure is null) and adds no permissions, routes, services, or Drush
    commands — it only registers the Search API filter plugin variant.
  bundle: entityreference_filter_search_api
  rubric_ref: rubric/entityreference_filter_search_api_erfsa_dependencies@1.0
  tags:
  - mode:recipe
  - difficulty:easy
