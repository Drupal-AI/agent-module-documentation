metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: entity_hierarchy_breadcrumb
  version: 3.3.x
  note: Submodule of entity_hierarchy. Registers a breadcrumb_builder service entity_hierarchy.breadcrumb
    (class HierarchyBasedBreadcrumbBuilder) at priority 10 that builds breadcrumbs from an entity's entity_reference_hierarchy
    ancestor chain on canonical, non-admin entity routes. No config, no permissions, no Drush. Medium
    introspects the enabled service; hard toggles the module (uninstall -> agent enables -> verify installed
    + service present).
questions:
- id: ehb-how-enable
  input: I use Entity Hierarchy with a parent field on my pages. How do I make Drupal build each page's
    breadcrumb from that hierarchy field, and how much configuration does it need?
  criteria: 'Enable the entity_hierarchy_breadcrumb submodule. There is no configuration: any entity type
    with an entity_reference_hierarchy field automatically gets breadcrumbs built from its ancestor chain.'
  bundle: entity_hierarchy_breadcrumb
  rubric_ref: rubric/entity_hierarchy_breadcrumb_ehb_how_enable@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: ehb-service
  input: In entity_hierarchy_breadcrumb, what service provides the breadcrumbs and how is it registered
    (tag and priority)?
  criteria: The service entity_hierarchy.breadcrumb (class HierarchyBasedBreadcrumbBuilder) is tagged
    breadcrumb_builder with priority 10.
  bundle: entity_hierarchy_breadcrumb
  rubric_ref: rubric/entity_hierarchy_breadcrumb_ehb_service@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: ehb-applies
  input: When does the entity_hierarchy_breadcrumb builder apply, and does it run on admin pages?
  criteria: applies() is TRUE on a canonical entity route where the entity has an entity_reference_hierarchy
    field, and it does NOT apply on admin routes (it checks router.admin_context).
  bundle: entity_hierarchy_breadcrumb
  rubric_ref: rubric/entity_hierarchy_breadcrumb_ehb_applies@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: ehb-enabled-priority
  input: On this site, is the entity_hierarchy_breadcrumb breadcrumb builder active, and what priority
    is its breadcrumb_builder service tagged with?
  criteria: Yes; the entity_hierarchy.breadcrumb service is tagged breadcrumb_builder at priority 10 (inspect
    the service tag / container).
  bundle: entity_hierarchy_breadcrumb
  rubric_ref: rubric/entity_hierarchy_breadcrumb_ehb_enabled_priority@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/entity_hierarchy_breadcrumb-enabled-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/entity_hierarchy_breadcrumb-enabled-cleanup.sh
- id: ehb-enable
  input: This site uses Entity Hierarchy but breadcrumbs are not following the hierarchy. Turn on hierarchy-based
    breadcrumbs by installing the appropriate Entity Hierarchy submodule, and apply it to the live site.
  criteria: Enable entity_hierarchy_breadcrumb (drush en entity_hierarchy_breadcrumb -y). verify checks
    the module is installed and the entity_hierarchy.breadcrumb service exists.
  bundle: entity_hierarchy_breadcrumb
  rubric_ref: rubric/entity_hierarchy_breadcrumb_ehb_enable@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/entity_hierarchy_breadcrumb-enable-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/entity_hierarchy_breadcrumb-enable-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/entity_hierarchy_breadcrumb-enable-verify.sh
