rubrics:
- id: entity_hierarchy_workbench_access_ehwa_what
  version: '1.0'
  applicable_bundles:
  - entity_hierarchy_workbench_access
  checks:
  - kind: must_contain_any
    values:
    - workbench access
    - section
    - descendants
    - access scheme
  scoring:
    combine: all_pass
- id: entity_hierarchy_workbench_access_ehwa_plugin_id
  version: '1.0'
  applicable_bundles:
  - entity_hierarchy_workbench_access
  checks:
  - kind: must_contain_any
    values:
    - AccessControlHierarchy
    - entity_hierarchy
    - access control hierarchy
  scoring:
    combine: all_pass
- id: entity_hierarchy_workbench_access_ehwa_configure
  version: '1.0'
  applicable_bundles:
  - entity_hierarchy_workbench_access
  checks:
  - kind: must_contain_any
    values:
    - access scheme
    - workbench_access
    - no settings
    - workbench access
  scoring:
    combine: all_pass
- id: entity_hierarchy_workbench_access_ehwa_enabled
  version: '1.0'
  applicable_bundles:
  - entity_hierarchy_workbench_access
  checks:
  - kind: must_contain_any
    values:
    - installed
    - enabled
    - entity_hierarchy
  scoring:
    combine: all_pass
- id: entity_hierarchy_workbench_access_ehwa_enable
  version: '1.0'
  applicable_bundles:
  - entity_hierarchy_workbench_access
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
