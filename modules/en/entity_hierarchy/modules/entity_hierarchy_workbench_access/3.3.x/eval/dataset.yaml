metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: entity_hierarchy_workbench_access
  version: 3.3.x
  note: Submodule of entity_hierarchy; depends on workbench_access. Provides a Workbench Access AccessControlHierarchy
    plugin (id 'entity_hierarchy', derived per hierarchy field by WorkbenchAccessControlDeriver) so a
    Workbench Access access scheme can use an entity_reference_hierarchy field as its section hierarchy;
    a section = a tree node and includes its descendants. Adds a ValidHierarchySection constraint and
    a dedicated cache bin entity_hierarchy_wba. Configured entirely via Workbench Access's access-scheme
    UI. Medium/hard verify the module + plugin availability (a full scheme needs a hierarchy field, so
    the reliable execution check is that the module is installed and the workbench_access scheme plugin
    manager is present).
questions:
- id: ehwa-what
  input: What does Entity Hierarchy Workbench Access let you do, and what is a 'section' when using it?
  criteria: 'It lets a Workbench Access access scheme use an Entity Hierarchy field as its section hierarchy:
    a section is a node in the tree, and access to a section includes that node and all its hierarchy
    descendants.'
  bundle: entity_hierarchy_workbench_access
  rubric_ref: rubric/entity_hierarchy_workbench_access_ehwa_what@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: ehwa-plugin-id
  input: In entity_hierarchy_workbench_access, what kind of plugin does it add to Workbench Access and
    what is its id?
  criteria: It adds a Workbench Access AccessControlHierarchy plugin with id 'entity_hierarchy' (derived
    per hierarchy field by WorkbenchAccessControlDeriver).
  bundle: entity_hierarchy_workbench_access
  rubric_ref: rubric/entity_hierarchy_workbench_access_ehwa_plugin_id@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: ehwa-configure
  input: How do you configure Entity Hierarchy Workbench Access - does it have its own settings page?
  criteria: It has no settings page of its own; you create a Workbench Access access scheme of type 'Entity
    hierarchy' (choosing the entity type + hierarchy field and bundles) at /admin/config/workflow/workbench_access,
    then assign users/roles to sections there.
  bundle: entity_hierarchy_workbench_access
  rubric_ref: rubric/entity_hierarchy_workbench_access_ehwa_configure@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: ehwa-enabled
  input: Is the Entity Hierarchy Workbench Access integration installed on this site, and (if so) is the
    Workbench Access access-scheme plugin system available to it?
  criteria: Yes, entity_hierarchy_workbench_access is installed and the workbench_access scheme plugin
    manager (plugin.manager.workbench_access.scheme) is available (the 'entity_hierarchy' access control
    hierarchy is provided; concrete derivatives appear once a hierarchy field exists).
  bundle: entity_hierarchy_workbench_access
  rubric_ref: rubric/entity_hierarchy_workbench_access_ehwa_enabled@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/entity_hierarchy_workbench_access-enabled-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/entity_hierarchy_workbench_access-enabled-cleanup.sh
- id: ehwa-enable
  input: The site wants to base its Workbench Access editorial sections on its Entity Hierarchy tree.
    Install the Entity Hierarchy submodule that integrates with Workbench Access, and apply it to the
    live site.
  criteria: Enable entity_hierarchy_workbench_access (drush en entity_hierarchy_workbench_access -y),
    which also enables its workbench_access dependency. verify checks the module is installed and the
    workbench_access scheme plugin manager is present.
  bundle: entity_hierarchy_workbench_access
  rubric_ref: rubric/entity_hierarchy_workbench_access_ehwa_enable@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/entity_hierarchy_workbench_access-enable-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/entity_hierarchy_workbench_access-enable-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/entity_hierarchy_workbench_access-enable-verify.sh
