metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: entity_hierarchy_microsite
  version: 3.3.x
  note: Submodule of entity_hierarchy. Defines the entity_hierarchy_microsite content entity (fields name,
    home [entity_reference to landing node], generate_menu [bool], logo [media]) managed at /admin/structure/entity-hierarchy-microsites
    (route entity.entity_hierarchy_microsite.collection, permission 'administer entity hierarchy microsites').
    Provides blocks entity_hierarchy_microsite_menu and entity_hierarchy_microsite_branding, condition
    entity_hierarchy_microsite_child, a cache context, and the ChildOfMicrositeLookup service. Medium
    introspects a created Microsite entity; hard creates a Microsite entity pointing at a given home node,
    verified against live entities.
questions:
- id: ehm-what-is-microsite
  input: In Entity Hierarchy Microsites, what is a 'microsite' and which field determines the section
    of the tree it covers? Where do you manage microsites in the admin UI?
  criteria: A microsite is an entity_hierarchy_microsite entity whose 'home' field points at a landing
    node; the microsite covers that node and its hierarchy descendants. Manage them at /admin/structure/entity-hierarchy-microsites.
  bundle: entity_hierarchy_microsite
  rubric_ref: rubric/entity_hierarchy_microsite_ehm_what_is_microsite@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: ehm-blocks
  input: Which blocks and block visibility condition does Entity Hierarchy Microsites provide for building
    a section's navigation and scoping blocks to that section?
  criteria: Blocks entity_hierarchy_microsite_menu (section menu) and entity_hierarchy_microsite_branding
    (logo), plus the block visibility condition entity_hierarchy_microsite_child ('is a child of a microsite').
  bundle: entity_hierarchy_microsite
  rubric_ref: rubric/entity_hierarchy_microsite_ehm_blocks@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: ehm-auto-menu
  input: How does Entity Hierarchy Microsites build a microsite's navigation menu, and where can you override
    individual generated menu items?
  criteria: When generate_menu is TRUE it auto-derives links for the home node and its descendants into
    the entity-hierarchy-microsite menu; individual items are overridden via eh_microsite_menu_override
    entities (so regeneration doesn't clobber them).
  bundle: entity_hierarchy_microsite
  rubric_ref: rubric/entity_hierarchy_microsite_ehm_auto_menu@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: ehm-known-site
  input: On this site a microsite (entity_hierarchy_microsite entity) has been configured. Inspect the
    live entities and give the microsite's name and the title of its home/landing node.
  criteria: The microsite is 'EHM Known Site' and its home node is the Article titled 'EHM Home Node'
    (load the entity_hierarchy_microsite entity and follow its home reference).
  bundle: entity_hierarchy_microsite
  rubric_ref: rubric/entity_hierarchy_microsite_ehm_known_site@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/entity_hierarchy_microsite-known-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/entity_hierarchy_microsite-known-cleanup.sh
- id: ehm-create-site
  input: On this site there is an Article titled 'EHM Task Home'. Using Entity Hierarchy Microsites, create
    a microsite named 'EHM Task Site' whose home/landing page is that node, and save it to the live site.
  criteria: 'Create a Microsite entity: Microsite::create([''name'' => ''EHM Task Site'', ''home'' =>
    [''target_id'' => <EHM Task Home nid>]])->save(). verify confirms a microsite named ''EHM Task Site''
    exists with home pointing at the EHM Task Home node.'
  bundle: entity_hierarchy_microsite
  rubric_ref: rubric/entity_hierarchy_microsite_ehm_create_site@1.0
