metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: entity
  version: 1.6.x
  note: Entity API is a passive developer framework module (handlers/providers wired into an entity type
    annotation) with no UI or config surface of its own, so all cases are `recipe` (response-graded),
    not `execution` (live-state).
questions:
- id: entityapi-permission-provider-handler
  input: In a Drupal 11 module I define a custom content entity type and want the module to auto-generate
    the full view/create/update/delete permission matrix instead of hand-writing each permission string.
    Which handler do I declare in the entity type annotation, and under which handler key?
  criteria: Declare handlers.permission_provider = "Drupal\entity\EntityPermissionProvider" in the entity
    type annotation; it generates the view/create/update/duplicate/delete (own/any, per bundle) permission
    set automatically.
  bundle: entity
  rubric_ref: rubric/entity_entityapi_permission_provider_handler@1.0
  tags:
  - mode:recipe
- id: entityapi-access-control-handler
  input: I attached the entity module's permission provider to my custom entity type. What access handler
    must I also declare so those generated permissions are actually enforced, and what happens if I use
    it without a permission provider?
  criteria: Declare handlers.access = "Drupal\entity\EntityAccessControlHandler". It requires EntityPermissionProvider
    and throws otherwise; it maps operations to the generated permissions with owner-aware checks.
  bundle: entity
  rubric_ref: rubric/entity_entityapi_access_control_handler@1.0
  tags:
  - mode:recipe
- id: entityapi-view-own-uncacheable
  input: For my custom entity type I need a 'view own' permission (each user can view only entities they
    authored). The default entity permission provider does not emit that. Which pair of handlers from
    the entity module should I use instead, and why is the tradeoff named the way it is?
  criteria: Use UncacheableEntityPermissionProvider (+ UncacheableEntityAccessControlHandler); they add
    'view own $entity_type' permissions which force per-user page caching, hence 'uncacheable'.
  bundle: entity
  rubric_ref: rubric/entity_entityapi_view_own_uncacheable@1.0
  tags:
  - mode:recipe
- id: entityapi-permission-granularity
  input: I want per-bundle granularity for my entity type's permissions (e.g. 'view article my_entity'
    rather than just 'view my_entity'). Which entity type key controls whether the generated permissions
    are per-type or per-bundle, and what values does it take?
  criteria: The entity type's permission_granularity key, set to 'bundle' (vs 'entity_type'), drives whether
    EntityPermissionProvider generates per-bundle permission strings like 'view $bundle $entity_type'.
  bundle: entity
  rubric_ref: rubric/entity_entityapi_permission_granularity@1.0
  tags:
  - mode:recipe
- id: entityapi-query-access-handler
  input: Single-entity access checks work, but users still see rows they shouldn't in entity queries and
    Views listings for my custom entity type. Which entity module handler extends permission enforcement
    to queries/Views/list builders, and under which annotation handler key does it go?
  criteria: Declare handlers.query_access = "Drupal\entity\QueryAccess\QueryAccessHandler"; it builds
    conditions from the generic permissions and applies them via EntityQueryAlter and ViewsQueryAlter.
  bundle: entity
  rubric_ref: rubric/entity_entityapi_query_access_handler@1.0
  tags:
  - mode:recipe
- id: entityapi-query-access-event
  input: Using the entity module's Query Access API, I need to add a custom condition (only show rows
    where field_owner equals the current user) on top of the built-in permission conditions. What event
    do I subscribe to, and how is the event name constructed for entity type `my_entity`?
  criteria: Subscribe to the QueryAccessEvent named 'entity.query_access.my_entity' and add conditions
    via $event->getConditions() (a ConditionGroup, e.g. addCondition('field_owner', ...)).
  bundle: entity
  rubric_ref: rubric/entity_entityapi_query_access_event@1.0
  tags:
  - mode:recipe
- id: entityapi-bundle-plugin
  input: I want a module to define an entity type's bundles and their fields entirely in code rather than
    as config, using the entity module. Which plugin interface does each bundle implement, and which field
    definition class do I return from it?
  criteria: Each bundle is a plugin implementing BundlePluginInterface (buildFieldDefinitions()), returning
    BundleFieldDefinition objects; the entity type declares a bundle_plugin_type and bundle_plugin handler
    (BundlePluginHandler).
  bundle: entity
  rubric_ref: rubric/entity_entityapi_bundle_plugin@1.0
  tags:
  - mode:recipe
- id: entityapi-revisionable-base
  input: My custom revisionable entity's revision links (version-history / revert) don't resolve correctly.
    The entity module provides a base class to fix the revision URL route parameters. Which base class
    should my entity extend instead of core's?
  criteria: Extend Drupal\entity\Revision\RevisionableContentEntityBase, which fixes the revision route
    parameters (adds {entity_type}_revision) so revision links resolve; pair with RevisionRouteProvider.
  bundle: entity
  rubric_ref: rubric/entity_entityapi_revisionable_base@1.0
  tags:
  - mode:recipe
