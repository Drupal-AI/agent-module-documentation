rubrics:
- id: entity_reference_purger_erp_enable_field
  version: '1.0'
  applicable_bundles:
  - entity_reference_purger
  checks:
  - kind: must_contain_any
    values:
    - remove_orphaned
    - Remove orphaned entity references
    - third party setting
    - third_party_settings
    - field edit form
    - field settings
  scoring:
    combine: all_pass
- id: entity_reference_purger_erp_queue_option
  version: '1.0'
  applicable_bundles:
  - entity_reference_purger
  checks:
  - kind: must_contain_any
    values:
    - queue
    - cron
    - entity_reference_purger
    - QueueWorker
    - queue worker
  scoring:
    combine: all_pass
- id: entity_reference_purger_erp_base_field
  version: '1.0'
  applicable_bundles:
  - entity_reference_purger
  checks:
  - kind: must_contain_any
    values:
    - setSetting
    - entity_reference_purger
    - remove_orphaned
    - BaseFieldDefinition
  scoring:
    combine: all_pass
- id: entity_reference_purger_erp_immediate_field
  version: '1.0'
  applicable_bundles:
  - entity_reference_purger
  checks:
  - kind: must_contain_any
    values:
    - immediate
    - immediately
    - not use the queue
    - without the queue
    - use_queue
    - 'false'
  scoring:
    combine: all_pass
- id: entity_reference_purger_erp_queued_field
  version: '1.0'
  applicable_bundles:
  - entity_reference_purger
  checks:
  - kind: must_contain_any
    values:
    - queue
    - queued
  scoring:
    combine: all_pass
- id: entity_reference_purger_erp_enable_purge
  version: '1.0'
  applicable_bundles:
  - entity_reference_purger
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
- id: entity_reference_purger_erp_switch_to_queue
  version: '1.0'
  applicable_bundles:
  - entity_reference_purger
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
