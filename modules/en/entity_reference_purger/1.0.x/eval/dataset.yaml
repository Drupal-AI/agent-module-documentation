metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: entity_reference_purger
  version: 1.0.x
  note: 'Entity Reference Purger removes orphaned entity_reference values from parent entities when the
    referenced entity is deleted. It is enabled per entity_reference field via two boolean third-party
    settings under ''entity_reference_purger'': remove_orphaned (turn purging on) and use_queue (defer
    to the cron queue vs purge immediately). For config fields these live on FieldConfig third_party_settings
    (config field.field.<entity>.<bundle>.<field> -> third_party_settings.entity_reference_purger.*) and
    are exposed on the field edit form; for base fields via ->setSetting(''entity_reference_purger'',
    [...]). Logic is in hook_entity_delete(); queued purges are drained by the entity_reference_purger
    QueueWorker (cron time 60). No admin page, no permissions, no Drush, no configure route, no plugin
    types defined. Medium/hard cases are grounded in real FieldConfig third-party settings: introspection
    reads use_queue on a live field; execution enables remove_orphaned and turns on use_queue, verified
    against live field.field config.'
questions:
- id: erp-enable-field
  input: How do I make the entity_reference_purger module clean up orphaned references for a specific
    entity reference field (added via Manage fields), and where is that choice stored?
  criteria: 'On the entity_reference field''s edit form, in the ''Entity Reference Purger'' section, tick
    ''Remove orphaned entity references''. It is stored as a third-party setting on the FieldConfig: field.field.<entity>.<bundle>.<field>
    -> third_party_settings.entity_reference_purger.remove_orphaned: true.'
  bundle: entity_reference_purger
  rubric_ref: rubric/entity_reference_purger_erp_enable_field@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: erp-queue-option
  input: The entity_reference_purger field settings have a 'Use queue' option. What does enabling use_queue
    do, and what processes the queued purges?
  criteria: With use_queue on, deletions push jobs onto the 'entity_reference_purger' queue instead of
    purging immediately; the entity_reference_purger QueueWorker (cron time 60) drains them on cron (or
    via drush queue:run entity_reference_purger). Recommended when a delete could orphan many references.
  bundle: entity_reference_purger
  rubric_ref: rubric/entity_reference_purger_erp_queue_option@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: erp-base-field
  input: How do I enable entity_reference_purger orphan removal on a base entity_reference field defined
    in code (a BaseFieldDefinition), rather than through the UI?
  criteria: Add ->setSetting('entity_reference_purger', ['remove_orphaned' => TRUE, 'use_queue' => FALSE])
    to the BaseFieldDefinition. The module reads it via getSetting('entity_reference_purger') for base
    fields (and getThirdPartySettings for config fields).
  bundle: entity_reference_purger
  rubric_ref: rubric/entity_reference_purger_erp_base_field@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: erp-immediate-field
  input: 'On this Drupal site the Article content type has an entity reference field field_erp_ref that
    uses entity_reference_purger. Inspect the live field configuration: is it set to remove orphaned references
    immediately, or via the queue?'
  criteria: field_erp_ref has entity_reference_purger.remove_orphaned = true and use_queue = false, so
    orphaned references are removed immediately on delete (not via the queue).
  bundle: entity_reference_purger
  rubric_ref: rubric/entity_reference_purger_erp_immediate_field@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/entity_reference_purger-immediate-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/entity_reference_purger-immediate-cleanup.sh
