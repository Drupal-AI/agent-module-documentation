rubrics:
- id: ga4_google_analytics_ga4_config_object
  version: '1.0'
  applicable_bundles:
  - ga4_google_analytics
  checks:
  - kind: must_contain_any
    values:
    - ga4_google_analytics.config
    - measurement_id
  scoring:
    combine: all_pass
- id: ga4_google_analytics_ga4_visibility_controls
  version: '1.0'
  applicable_bundles:
  - ga4_google_analytics
  checks:
  - kind: must_contain_any
    values:
    - ga4_access_pages
    - ga4_access_roles
    - request_path
    - negate
  scoring:
    combine: all_pass
- id: ga4_google_analytics_ga4_klaro_attributes
  version: '1.0'
  applicable_bundles:
  - ga4_google_analytics
  checks:
  - kind: must_contain_any
    values:
    - scripts_custom_attributes
    - Custom Attributes
    - type="text/plain"
    - data-name
  scoring:
    combine: all_pass
- id: ga4_google_analytics_ga4_known_id
  version: '1.0'
  applicable_bundles:
  - ga4_google_analytics
  checks:
  - kind: must_contain_any
    values:
    - G-DEMO7A4B2C
  scoring:
    combine: all_pass
- id: ga4_google_analytics_ga4_known_scope
  version: '1.0'
  applicable_bundles:
  - ga4_google_analytics
  checks:
  - kind: must_contain_any
    values:
    - administrator
  scoring:
    combine: all_pass
- id: ga4_google_analytics_ga4_set_id
  version: '1.0'
  applicable_bundles:
  - ga4_google_analytics
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
- id: ga4_google_analytics_ga4_restrict_pages
  version: '1.0'
  applicable_bundles:
  - ga4_google_analytics
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
