metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: workbench_moderation_actions
  version: 2.1.x
  note: 'WBM actions replaces core''s node publish/unpublish bulk actions with one bulk action per Workbench
    Moderation state. It defines a single core Action plugin id ''state_change'' with StateChangeDeriver,
    whose derivatives are keyed <entity_type>__<state_id> (e.g. node__archived, block_content__draft).
    hook_install creates one ''action'' config entity per derivative (id state_change__<type>__<state>,
    plugin state_change:<type>__<state>, type = entity type id). Its persistent, verifiable state is therefore
    these ''action'' config entities. Medium/hard cases create/read/delete those Action config entities
    (router-safe, no serialization). Requires Workbench Moderation (contrib), NOT core Content Moderation.
    NOTE: on this shared site the actions were not auto-created at install time, and creating bundles/roles
    or serializing entities fatals, so evals stick to Action config entities.'
questions:
- id: wma-what-it-does
  input: What does the workbench_moderation_actions (WBM actions) module do to the bulk Action dropdown
    on /admin/content, and which core actions does it replace?
  criteria: On install it deletes core's node_publish_action and node_unpublish_action and creates one
    bulk action per Workbench Moderation state (the state_change action plugin, derived per entity type
    x state), so editors can 'Set <Entity> as <State>' for many nodes at once.
  bundle: workbench_moderation_actions
  rubric_ref: rubric/workbench_moderation_actions_wma_what_it_does@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: wma-deriver-ids
  input: In workbench_moderation_actions, what is the Action plugin id and how are its derivatives named
    for, say, setting nodes to the 'archived' state?
  criteria: The Action plugin id is 'state_change' with StateChangeDeriver; derivatives are keyed <entity_type_id>__<state_id>,
    so the node->archived derivative is state_change:node__archived (its action config entity id is state_change__node__archived).
  bundle: workbench_moderation_actions
  rubric_ref: rubric/workbench_moderation_actions_wma_deriver_ids@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: wma-requires-workbench
  input: Which moderation system does workbench_moderation_actions require, and what happens to the core
    publish/unpublish actions if I later uninstall it?
  criteria: It requires the contrib Workbench Moderation module (not core Content Moderation). hook_uninstall
    restores node_publish_action and node_unpublish_action from the node module's default config.
  bundle: workbench_moderation_actions
  rubric_ref: rubric/workbench_moderation_actions_wma_requires_workbench@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: wma-known-archived
  input: On this Drupal site there is a workbench_moderation_actions bulk action config entity with id
    state_change__node__archived. Inspect the live action and state which moderation state it sets content
    to.
  criteria: It sets nodes to the 'archived' moderation state - the action's plugin is state_change:node__archived
    (the derivative key <entity_type>__<state> encodes node + archived).
  bundle: workbench_moderation_actions
  rubric_ref: rubric/workbench_moderation_actions_wma_known_archived@1.0
  tags:
  - mode:introspection
  - difficulty:medium
