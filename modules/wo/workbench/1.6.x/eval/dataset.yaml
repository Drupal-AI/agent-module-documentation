metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: workbench
  version: 1.6.x
  note: Workbench provides a Views-driven editorial dashboard, a settings config object mapping Views
    to five regions, two permissions, and three alter/content hooks. Cases are `recipe` (response-graded)
    since they probe documented facts an agent would otherwise read source to answer; no site mutation.
questions:
- id: workbench-dashboard-path
  input: On a Drupal 11 site with the Workbench module, what path do content editors visit for their personalized
    "My Workbench" dashboard, and what permission gates access to it?
  criteria: The dashboard is at /admin/workbench (route workbench.content), gated by the 'access workbench'
    permission; a Workbench toolbar tab links to it.
  bundle: workbench
  rubric_ref: rubric/workbench_workbench_dashboard_path@1.0
  tags:
  - mode:recipe
- id: workbench-tabs
  input: Besides the main My Workbench overview, which sub-tabs/pages does Workbench provide and what
    are their paths?
  criteria: My edits (/admin/workbench/content/edited), All recent content (/admin/workbench/content/all),
    and Create content (/admin/workbench/create, emulates node/add and is not a View).
  bundle: workbench
  rubric_ref: rubric/workbench_workbench_tabs@1.0
  tags:
  - mode:recipe
- id: workbench-views
  input: Which Views ship with Workbench to power the dashboard regions?
  criteria: 'Three Views: workbench_current_user (Current user), workbench_edited (Edits by user), and
    workbench_recent_content (Recent content), all requiring ''access workbench''.'
  bundle: workbench
  rubric_ref: rubric/workbench_workbench_views@1.0
  tags:
  - mode:recipe
- id: workbench-region-config
  input: How do I change which View + display renders the main region of the Workbench overview page?
    Name the config object and a region key.
  criteria: The mapping is in the workbench.settings config object; set a region key such as overview_main
    to a 'view_id:display_id' string, e.g. drush cset workbench.settings overview_main my_view:block_1
    (or via the form at /admin/config/workflow/workbench).
  bundle: workbench
  rubric_ref: rubric/workbench_workbench_region_config@1.0
  tags:
  - mode:recipe
- id: workbench-custom-tab-hook
  input: In a custom Drupal module I want to replace one of the Workbench dashboard regions with my own
    custom View or render array. Which hook do I implement?
  criteria: Implement hook_workbench_content_alter(array &$output, ?array $context = NULL), setting $output[region]['#view_id']
    and ['#view_display'], or replacing the region with any render array.
  bundle: workbench
  rubric_ref: rubric/workbench_workbench_custom_tab_hook@1.0
  tags:
  - mode:recipe
- id: workbench-permissions
  input: What are the two permissions Workbench defines, and which one gates the settings form that maps
    Views to dashboard regions?
  criteria: '''access workbench'' gates the whole My Workbench area; ''administer workbench'' gates the
    settings form at /admin/config/workflow/workbench.'
  bundle: workbench
  rubric_ref: rubric/workbench_workbench_permissions@1.0
  tags:
  - mode:recipe
- id: workbench-purpose
  input: What is the Workbench module for on a Drupal site?
  criteria: 'It is an editorial landing page: a personalized ''My Workbench'' content-management dashboard
    for editors that lists content they created/edited and lets them create content, all in one Views-driven
    place.'
  bundle: workbench
  rubric_ref: rubric/workbench_workbench_purpose@1.0
  tags:
  - mode:recipe
- id: workbench-info-block-hook
  input: Which Workbench hook lets a module add status/message lines to the Workbench information block?
  criteria: Implement hook_workbench_block() to return an array of message strings rendered in the WorkbenchBlock
    (plugin id workbench_block).
  bundle: workbench
  rubric_ref: rubric/workbench_workbench_info_block_hook@1.0
  tags:
  - mode:recipe
