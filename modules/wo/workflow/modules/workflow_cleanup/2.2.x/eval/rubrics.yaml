rubrics:
- id: workflow_cleanup_workflow_cleanup_what
  version: '1.0'
  applicable_bundles:
  - workflow_cleanup
  checks:
  - kind: must_contain_any
    values:
    - orphaned
    - inactive
    - states
    - delete
  scoring:
    combine: all_pass
- id: workflow_cleanup_workflow_cleanup_route
  version: '1.0'
  applicable_bundles:
  - workflow_cleanup
  checks:
  - kind: must_contain_any
    values:
    - workflow.cleanup.settings
    - /admin/config/workflow/workflow/cleanup
    - administer workflow
  scoring:
    combine: all_pass
- id: workflow_cleanup_workflow_cleanup_orphan_vs_inactive
  version: '1.0'
  applicable_bundles:
  - workflow_cleanup
  checks:
  - kind: must_contain_any
    values:
    - getWorkflow
    - isActive
    - no longer
    - does not exist
    - marked inactive
  scoring:
    combine: all_pass
- id: workflow_cleanup_workflow_cleanup_orphan_state
  version: '1.0'
  applicable_bundles:
  - workflow_cleanup
  checks:
  - kind: must_contain_any
    values:
    - wc_orphan
  scoring:
    combine: all_pass
- id: workflow_cleanup_workflow_cleanup_inactive_state
  version: '1.0'
  applicable_bundles:
  - workflow_cleanup
  checks:
  - kind: must_contain_any
    values:
    - wc_wf_old
  scoring:
    combine: all_pass
- id: workflow_cleanup_workflow_cleanup_delete_orphan
  version: '1.0'
  applicable_bundles:
  - workflow_cleanup
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
- id: workflow_cleanup_workflow_cleanup_delete_inactive
  version: '1.0'
  applicable_bundles:
  - workflow_cleanup
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
