metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: workflow_devel
  version: 2.2.x
  note: Workflow Devel (submodule of Workflow) is a development aid that implements every workflow hook
    and the WorkflowEvents PRE/POST_TRANSITION events, emitting a message on each call so you can trace
    the transition lifecycle. It ships no config, schema, routes or permissions of its own, so its only
    live state is whether it is installed. Introspection cases inspect the live module registry (enabled?
    dependencies?); execution cases enable / uninstall it, verified via \Drupal::moduleHandler()->moduleExists().
    All cases restore the baseline (module uninstalled, since it is development-only and not enabled by
    default).
questions:
- id: workflow_devel-purpose
  input: What is the Workflow Devel submodule for, and what does it do when a workflow state transition
    happens?
  criteria: 'It is a tool for developing Workflow add-ons: it implements every hook in workflow.api.php
    (plus related core hooks and the transition events) and shows a message each time one is called, so
    you can see which hooks fire and in what order during a transition.'
  bundle: workflow_devel
  rubric_ref: rubric/workflow_devel_workflow_devel_purpose@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: workflow_devel-events
  input: Which Workflow transition events does the Workflow Devel module's event subscriber react to?
  criteria: WorkflowDevelEventSubscriber subscribes to WorkflowEvents::PRE_TRANSITION ('workflow.pre_transition')
    and WorkflowEvents::POST_TRANSITION ('workflow.post_transition').
  bundle: workflow_devel
  rubric_ref: rubric/workflow_devel_workflow_devel_events@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: workflow_devel-production
  input: Should I enable Workflow Devel on a production site, and does it add any configuration, routes
    or permissions?
  criteria: No — it is for development only (its description says do not enable on production). It adds
    no config, schema, routes or permissions of its own; it only implements hooks/events and prints messages.
  bundle: workflow_devel
  rubric_ref: rubric/workflow_devel_workflow_devel_production@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: workflow_devel-is-enabled
  input: Is the Workflow Devel (workflow_devel) module currently installed/enabled on this Drupal site?
    Check the running site and answer.
  criteria: Yes — workflow_devel is currently enabled (\Drupal::moduleHandler()->moduleExists('workflow_devel')
    is TRUE; it also appears in drush pm:list as enabled).
  bundle: workflow_devel
  rubric_ref: rubric/workflow_devel_workflow_devel_is_enabled@1.0
