rubrics:
- id: workflow_operations_workflow_operations_obsolete
  version: '1.0'
  applicable_bundles:
  - workflow_operations
  checks:
  - kind: must_contain_any
    values:
    - obsolete
    - incorporated
    - main module
    - edit comment
    - revert
  scoring:
    combine: all_pass
- id: workflow_operations_workflow_operations_permissions_now
  version: '1.0'
  applicable_bundles:
  - workflow_operations
  checks:
  - kind: must_contain_any
    values:
    - workflow_transition
    - WorkflowPermissions
    - main module
    - revert
    - edit
  scoring:
    combine: all_pass
- id: workflow_operations_workflow_operations_ships
  version: '1.0'
  applicable_bundles:
  - workflow_operations
  checks:
  - kind: must_contain_any
    values:
    - info.yml
    - only
    - hidden
    - placeholder
    - no code
  scoring:
    combine: all_pass
- id: workflow_operations_workflow_operations_is_enabled
  version: '1.0'
  applicable_bundles:
  - workflow_operations
  checks:
  - kind: must_contain_any
    values:
    - enabled
    - installed
    - 'yes'
  scoring:
    combine: all_pass
- id: workflow_operations_workflow_operations_dependency
  version: '1.0'
  applicable_bundles:
  - workflow_operations
  checks:
  - kind: must_contain_any
    values:
    - workflow
  scoring:
    combine: all_pass
- id: workflow_operations_workflow_operations_enable
  version: '1.0'
  applicable_bundles:
  - workflow_operations
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
- id: workflow_operations_workflow_operations_uninstall
  version: '1.0'
  applicable_bundles:
  - workflow_operations
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
