- id: workflow_access-grant-editor
  input: On this Drupal site there is a workflow 'wa_wf' with a 'Needs Review' state (state id wa_wf_review).
    Using Workflow Access, grant the 'content_editor' role both view and update access to content in that
    state, and apply the change to the live site.
  criteria: In config workflow_access.role, the wa_wf_review key grants content_editor grant_view=1 and
