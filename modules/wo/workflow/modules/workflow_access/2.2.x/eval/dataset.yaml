metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: workflow_access
  version: 2.2.x
  note: Workflow Access (submodule of Workflow) controls node access per workflow state and role via core's
    node grant system (node-only). Per-state grants live in config workflow_access.role keyed by state
    id (sid) -> role => {grant_view, grant_update, grant_delete}. Conflict priority is workflow_access.settings:workflow_access_priority
    (default 0). Fixtures build a namespaced workflow 'wa_wf' (raw config, integer weights) and read/write
    workflow_access.role for its states; content_editor and anonymous are real roles on this site. All
    fixtures are torn down and the priority restored to 0.
questions:
- id: workflow_access-what-and-limit
  input: What does the Workflow Access submodule do, and what is its major limitation regarding entity
    types?
  criteria: It controls access to content per workflow state and role (view/update/delete) through Drupal's
    node grant system. Because it uses node_access, it only works for node entities (one workflow per
    entity type).
  bundle: workflow_access
  rubric_ref: rubric/workflow_access_workflow_access_what_and_limit@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: workflow_access-where-stored
  input: In Workflow Access, where do I set which roles can view/update/delete content in each workflow
    state, and in which config object are those grants stored?
  criteria: On each workflow's Access tab (/admin/config/workflow/workflow/{workflow_type}/access) you
    tick view/update/delete per state and role. Grants are stored in the config object workflow_access.role,
    keyed by state id, as role => {grant_view, grant_update, grant_delete}.
  bundle: workflow_access
  rubric_ref: rubric/workflow_access_workflow_access_where_stored@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: workflow_access-priority
  input: Other node access modules conflict with Workflow Access on my site. Which setting does Workflow
    Access provide to resolve that, and where is it?
  criteria: The workflow_access_priority setting (config workflow_access.settings), set at /admin/config/workflow/workflow/access,
    controls the node-grant priority so Workflow Access can win or yield against other node-access modules.
  bundle: workflow_access
  rubric_ref: rubric/workflow_access_workflow_access_priority@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: workflow_access-known-grant
  input: On this Drupal site, the workflow 'wa_wf' has a 'Needs Review' state (wa_wf_review) with Workflow
    Access grants configured. Inspect the live configuration and state which role is allowed to edit (update)
    content in that state.
  criteria: In workflow_access.role, the wa_wf_review key grants the content_editor role grant_view and
    grant_update, so content_editor can edit content in the Needs Review state.
  bundle: workflow_access
  rubric_ref: rubric/workflow_access_workflow_access_known_grant@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/workflow_access-known-grant-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/workflow_access-known-grant-cleanup.sh
