questions:
- id: workflow_ui-obsolete
  input: What is the Workflow UI (workflow_ui) submodule, and do I need to enable it to administer workflows
    on a current Drupal site?
  criteria: Workflow UI is obsolete and hidden; the admin UI is now incorporated into the main 'workflow'
    module. You do not need to enable it — manage workflows at /admin/config/workflow/workflow provided
    by the parent module.
  bundle: workflow_ui
  rubric_ref: rubric/workflow_ui_workflow_ui_obsolete@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: workflow_ui-where-ui
  input: If Workflow UI is obsolete, where does the actual workflow administration interface come from
    now, and at what path?
  criteria: The admin UI is provided by the main 'workflow' module at /admin/config/workflow/workflow
    (route entity.workflow_type.collection, declared in workflow.routing.yml).
  bundle: workflow_ui
  rubric_ref: rubric/workflow_ui_workflow_ui_where_ui@1.0
  tags:
  - mode:recipe
  - difficulty:easy
