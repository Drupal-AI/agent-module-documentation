rubrics:
- id: workflowfield_workflowfield_residual
  version: '1.0'
  applicable_bundles:
  - workflowfield
  checks:
  - kind: must_contain_any
    values:
    - residual
    - no need
    - hidden
    - beta6
    - main module
  scoring:
    combine: all_pass
- id: workflowfield_workflowfield_field_type_now
  version: '1.0'
  applicable_bundles:
  - workflowfield
  checks:
  - kind: must_contain_any
    values:
    - main module
    - workflow module
    - Workflow state
    - WorkflowItem
    - field of type
  scoring:
    combine: all_pass
- id: workflowfield_workflowfield_ships
  version: '1.0'
  applicable_bundles:
  - workflowfield
  checks:
  - kind: must_contain_any
    values:
    - info.yml
    - only
    - hidden
    - no dependencies
    - placeholder
  scoring:
    combine: all_pass
- id: workflowfield_workflowfield_is_enabled
  version: '1.0'
  applicable_bundles:
  - workflowfield
  checks:
  - kind: must_contain_any
    values:
    - enabled
    - installed
    - 'yes'
  scoring:
    combine: all_pass
- id: workflowfield_workflowfield_dependencies
  version: '1.0'
  applicable_bundles:
  - workflowfield
  checks:
  - kind: must_contain_any
    values:
    - no dependencies
    - none
    - no dependency
    - does not
  scoring:
    combine: all_pass
- id: workflowfield_workflowfield_enable
  version: '1.0'
  applicable_bundles:
  - workflowfield
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
- id: workflowfield_workflowfield_uninstall
  version: '1.0'
  applicable_bundles:
  - workflowfield
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
