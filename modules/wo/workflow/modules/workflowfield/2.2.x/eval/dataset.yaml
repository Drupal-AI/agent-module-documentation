metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: workflowfield
  version: 2.2.x
  note: 'Workflow Field (machine name workflowfield, directory workflow_field) is a RESIDUAL, hidden submodule:
    the ''workflow'' field type it once provided now lives in the main workflow module. It ships only
    an info.yml (hidden: TRUE, no dependencies, no code/config/permissions). Its only live state is whether
    it is installed, so introspection reads the module registry and execution enables/uninstalls it, verified
    via \Drupal::moduleHandler()->moduleExists(''workflowfield''). Baseline: not installed.'
questions:
- id: workflowfield-residual
  input: What is the workflowfield (Workflow Field) submodule, and do I need to enable it on a current
    Drupal Workflow install?
  criteria: workflowfield is a residual, hidden submodule; the workflow field type now lives in the main
    workflow module. You do not need to enable it on workflow 8.x-1.0-beta6 or later.
  bundle: workflowfield
  rubric_ref: rubric/workflowfield_workflowfield_residual@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: workflowfield-field-type-now
  input: The workflowfield submodule used to provide the 'workflow' field type. Where does that field
    type come from now, and how do I add a workflow to content?
  criteria: The 'workflow' field type (WorkflowItem, label 'Workflow state') is provided by the main workflow
    module. Add a 'Workflow state' field to a bundle and bind it to a workflow via the workflow_type storage
    setting.
  bundle: workflowfield
  rubric_ref: rubric/workflowfield_workflowfield_field_type_now@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: workflowfield-ships
  input: What does the workflowfield submodule ship in its current release, and does it declare any module
    dependencies?
  criteria: 'It ships only an info.yml (marked hidden: TRUE) with no code and no declared module dependencies.
    It is an empty residual placeholder for upgrade compatibility.'
  bundle: workflowfield
  rubric_ref: rubric/workflowfield_workflowfield_ships@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: workflowfield-is-enabled
  input: Is the workflowfield module currently installed/enabled on this Drupal site? Check the running
    site and answer.
  criteria: Yes — for this check workflowfield is installed (\Drupal::moduleHandler()->moduleExists('workflowfield')
    is TRUE), though it is a hidden module.
  bundle: workflowfield
  rubric_ref: rubric/workflowfield_workflowfield_is_enabled@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/workflowfield-enabled-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/workflowfield-enabled-cleanup.sh
- id: workflowfield-dependencies
  input: The workflowfield module is enabled on this site. Inspect the running site and state whether
    it declares any module dependencies.
  criteria: workflowfield declares no module dependencies in its info.yml (unlike the other Workflow submodules,
    it does not even depend on workflow) — it is an empty residual module.
  bundle: workflowfield
  rubric_ref: rubric/workflowfield_workflowfield_dependencies@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/workflowfield-enabled-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/workflowfield-enabled-cleanup.sh
- id: workflowfield-enable
  input: For an upgrade-compatibility test, install/enable the (hidden, residual) workflowfield module
    on this live Drupal site.
  criteria: Enable the module (e.g. drush en workflowfield -y; it is hidden but installable). Verified
    by \Drupal::moduleHandler()->moduleExists('workflowfield') being TRUE.
  bundle: workflowfield
  rubric_ref: rubric/workflowfield_workflowfield_enable@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/workflowfield-enable-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/workflowfield-enable-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/workflowfield-enable-verify.sh
- id: workflowfield-uninstall
  input: The residual workflowfield module is enabled on this site but it is not needed on current Workflow
    installs. Uninstall workflowfield from the live site.
  criteria: Uninstall the module (e.g. drush pmu workflowfield -y). Verified by \Drupal::moduleHandler()->moduleExists('workflowfield')
    being FALSE.
  bundle: workflowfield
  rubric_ref: rubric/workflowfield_workflowfield_uninstall@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: site-owner
    reset: agent-module-documentation/evaluation/verify/workflowfield-uninstall-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/workflowfield-uninstall-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/workflowfield-uninstall-verify.sh
