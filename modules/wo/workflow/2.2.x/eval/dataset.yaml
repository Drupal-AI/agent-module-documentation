metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: workflow
  version: 2.2.x
  note: Workflow is a configurable state machine attached to entities via a field. A Workflow is a workflow_type
    config entity (workflow.workflow.<wid>) with workflow_state config entities (workflow.state.<sid>,
    sid = <wid>_<name>, plus an implicit <wid>_creation) and workflow_config_transition config entities
    (workflow.transition.<tid>, from_sid/to_sid + roles). A field of type 'workflow' bound via storage
    setting workflow_type puts it on content. Fixtures are built via raw config writes with integer state
    weights (a NULL weight makes WorkflowState::sort() fatal, and createState()/createTransition() are
    statically cached per request). Medium cases read back the states of a known workflow and which workflow
    a field binds to; hard cases attach a workflow field to Article and add a transition, verified against
    live config. All fixtures are namespaced wf_* / field_wf_* and torn down.
questions:
- id: workflow-what-is-it
  input: In the Drupal contrib module Workflow, what does a 'workflow' consist of, and which configuration
    entities represent it? Name the config entity types for the workflow, its states, and its transitions.
  criteria: A Workflow is a workflow_type config entity that has states (workflow_state config entities,
    including an implicit (creation) state) and transitions (workflow_config_transition config entities)
    declaring which state can move to which, restricted per role.
  bundle: workflow
  rubric_ref: rubric/workflow_workflow_what_is_it@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: workflow-attach-to-content
  input: How do I actually put a Workflow onto a content type in Drupal so editors can change its state?
    What kind of field do I add and how is it linked to the workflow?
  criteria: Add a field of type 'workflow' (label 'Workflow state', widget workflow_default) to the bundle,
    and set its storage setting workflow_type to the workflow's id. The field's allowed values come from
    the workflow's states.
  bundle: workflow
  rubric_ref: rubric/workflow_workflow_attach_to_content@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: workflow-participate-permission
  input: Which permission do I grant a role so its users are allowed to move content through a Workflow's
    state transitions? Explain the naming pattern (it includes the workflow id).
  criteria: Grant 'create <wid> workflow_transition' (the 'Participate in workflow' permission), where
    <wid> is the workflow's machine id. These per-workflow permissions are generated dynamically by WorkflowPermissions;
    per-transition role restrictions further refine it.
  bundle: workflow
  rubric_ref: rubric/workflow_workflow_participate_permission@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: workflow-known-states
  input: On this Drupal site there is a Workflow with machine id 'wf_known'. Inspect the live configuration
    and list the workflow states it defines (their machine names or labels).
  criteria: wf_known has the states wf_known_creation ((creation)), wf_known_draft (Draft) and wf_known_published
    (Published), stored as workflow.state.* config entities with wid=wf_known.
  bundle: workflow
  rubric_ref: rubric/workflow_workflow_known_states@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/workflow-known-states-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/workflow-known-states-cleanup.sh
- id: workflow-field-binding
  input: On this Drupal site, the Article content type has a Workflow field named 'field_wf_known'. Inspect
    the live field configuration and state which Workflow (workflow_type) that field is bound to.
  criteria: The field_wf_known field storage (type 'workflow') has the storage setting workflow_type =
    wf_field, so the field is bound to the wf_field workflow.
  bundle: workflow
  rubric_ref: rubric/workflow_workflow_field_binding@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/workflow-field-binding-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/workflow-field-binding-cleanup.sh
- id: workflow-attach-field
  input: On this Drupal site there is a Workflow with id 'wf_attach'. Attach it to the Article content
    type by adding a Workflow-state field named 'field_wf_attach' bound to that workflow, and apply the
    change to the live site.
  criteria: Create a field storage field_wf_attach on node of type 'workflow' with storage setting workflow_type=wf_attach,
    and a field instance on the article bundle. Verified against the live field config.
  bundle: workflow
  rubric_ref: rubric/workflow_workflow_attach_field@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/workflow-attach-field-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/workflow-attach-field-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/workflow-attach-field-verify.sh
- id: workflow-add-transition
  input: On this Drupal site there is a Workflow 'wf_trans' with the states (creation), Draft, Published
    and Archived. It currently allows creation->draft and draft->published. Add a new allowed transition
    from the Published state (wf_trans_published) to the Archived state (wf_trans_archived) and apply
    it to the live site.
  criteria: Create a workflow_config_transition in workflow wf_trans with from_sid=wf_trans_published
    and to_sid=wf_trans_archived (e.g. via the workflow's Transitions admin page, or $workflow->createTransition('wf_trans_published','wf_trans_archived')).
    Verified against the live transition config.
  bundle: workflow
  rubric_ref: rubric/workflow_workflow_add_transition@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/workflow-add-transition-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/workflow-add-transition-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/workflow-add-transition-verify.sh
