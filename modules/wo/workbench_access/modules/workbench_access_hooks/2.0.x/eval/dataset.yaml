metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: workbench_access_hooks
  part_of: workbench_access
  version: 2.0.x
  note: Light-doc, recipe-only. workbench_access_hooks is a hidden, test-only submodule of workbench_access
    that exists purely as a worked example of one alter hook. Recipe/easy cases only (response-graded,
    no site mutation); no introspection or execution tiers are meaningful for a module with no config,
    services, or UI.
questions:
- id: wahooks-hook-name-easy
  input: The workbench_access_hooks submodule exists to demonstrate a single Workbench Access alter hook
    that rewrites an access scheme's stored settings. What is the name of that hook?
  criteria: hook_workbench_access_scheme_update_alter()
  bundle: workbench_access_hooks
  rubric_ref: rubric/workbench_access_hooks_wahooks_hook_name_easy@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: wahooks-part-of-easy
  input: What is workbench_access_hooks — is it a standalone contrib module, and which project does it
    ship inside? Note anything about whether it is meant for production.
  criteria: It is a hidden, test-only submodule that ships inside the workbench_access project (under
    tests/modules); not for production.
  bundle: workbench_access_hooks
  rubric_ref: rubric/workbench_access_hooks_wahooks_part_of_easy@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: wahooks-alter-target-easy
  input: In workbench_access_hooks' example implementation of hook_workbench_access_scheme_update_alter(),
    which piece of an access scheme's data is the hook designed to rewrite (the by-reference argument
    it modifies)?
  criteria: It rewrites the access scheme's scheme_settings — the $settings array is modified by reference
    (the example sets it to ['test' => 'test']).
  bundle: workbench_access_hooks
  rubric_ref: rubric/workbench_access_hooks_wahooks_alter_target_easy@1.0
  tags:
  - mode:recipe
  - difficulty:easy
