# Generated from evals.json by evaluation/to_commons.py.
# Edit evals.json and rerun the script; do not edit this file.
metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: workbench_access
  version: 2.0.x
  note: 'Difficulty-tiered. easy/recipe (response-graded, no site mutation) probes workbench_access-specific
    architecture facts an unfamiliar agent would have to read source to answer: the access_scheme config
    entity, the AccessControlHierarchy plugin type and its bundled taxonomy/menu plugins, and sections.
    medium/introspection asks about the CURRENT live setup: a setup script saves a KNOWN access_scheme
    config entity and the model must inspect the running site with drush to read its hierarchy plugin
    id and scheme_settings back; a cleanup script deletes it after. hard/execution (persona drupal-expert)
    requires the model to actually CREATE an access_scheme config entity with a specific id and hierarchy
    plugin on the live site (verified against site state), not just answer questions.'
questions:
- id: wa-config-entity-type-easy
  input: In the Drupal workbench_access module, editorial access is configured through one central config
    entity type. What is that config entity type id?
  criteria: The access_scheme config entity type (config prefix workbench_access.access_scheme.<id>).
  bundle: workbench_access
  rubric_ref: rubric/workbench_access_wa_config_entity_type_easy@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: wa-plugin-type-easy
  input: workbench_access defines a plugin type that turns some existing hierarchy into editorial 'sections';
    an access_scheme names one of these in its `scheme` key. What is the plugin type (and its Plugin/
    namespace)?
  criteria: The AccessControlHierarchy plugin type (namespace Plugin/AccessControlHierarchy), managed
    by plugin.manager.workbench_access.scheme.
  bundle: workbench_access
  rubric_ref: rubric/workbench_access_wa_plugin_type_easy@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: wa-bundled-plugins-easy
  input: Which two AccessControlHierarchy plugins ship inside the workbench_access module itself (the
    two hierarchy sources you can pick when creating an access scheme out of the box)? Give their plugin
    ids.
  criteria: taxonomy (sections from a vocabulary) and menu (sections from a menu tree).
  bundle: workbench_access
  rubric_ref: rubric/workbench_access_wa_bundled_plugins_easy@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: wa-sections-permission-easy
  input: In workbench_access, content is filed into editorial 'sections' and editors are assigned to them.
    Which permission machine name lets a user bypass all section checks and reach every section? Give
    the exact permission.
  criteria: bypass workbench access
  bundle: workbench_access
  rubric_ref: rubric/workbench_access_wa_sections_permission_easy@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: wa-known-scheme-plugin-medium
  input: This Drupal site (drush available) already has a workbench_access access scheme configured with
    the machine name `wa_eval_editorial`. Inspect the live configuration and tell me which AccessControlHierarchy
    plugin (the `scheme` key) that access scheme uses. Give the exact plugin id.
  criteria: The wa_eval_editorial access_scheme uses the `taxonomy` hierarchy plugin. Read back from the
    live workbench_access.access_scheme.wa_eval_editorial config.
  bundle: workbench_access
  rubric_ref: rubric/workbench_access_wa_known_scheme_plugin_medium@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    persona: drupal-expert
    setup: agent-module-documentation/evaluation/verify/workbench_access-known-scheme-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/workbench_access-known-scheme-cleanup.sh
- id: wa-known-scheme-vocab-medium
  input: On this Drupal site the workbench_access access scheme `wa_eval_editorial` is already configured.
    Inspect its live configuration with drush and tell me which taxonomy vocabulary is listed in its scheme_settings
    (the vocabulary its editorial sections come from).
  criteria: scheme_settings.vocabularies contains `tags`. Read back from the live workbench_access.access_scheme.wa_eval_editorial
    config.
  bundle: workbench_access
  rubric_ref: rubric/workbench_access_wa_known_scheme_vocab_medium@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    persona: drupal-expert
    setup: agent-module-documentation/evaluation/verify/workbench_access-known-scheme-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/workbench_access-known-scheme-cleanup.sh
- id: wa-known-menu-scheme-medium
  input: This site has a second workbench_access access scheme with the machine name `wa_eval_nav`. Inspect
    the live configuration with drush and tell me which AccessControlHierarchy plugin (the `scheme` key)
    it is driven by. Give the exact plugin id.
  criteria: The wa_eval_nav access_scheme uses the `menu` hierarchy plugin. Read back from the live workbench_access.access_scheme.wa_eval_nav
    config.
  bundle: workbench_access
  rubric_ref: rubric/workbench_access_wa_known_menu_scheme_medium@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    persona: drupal-expert
    setup: agent-module-documentation/evaluation/verify/workbench_access-known-menu-scheme-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/workbench_access-known-menu-scheme-cleanup.sh
- id: wa-build-taxonomy-scheme-expert
  input: On this Drupal site (drush available, workbench_access installed) build and SAVE a new access_scheme
    config entity with the machine name `section_taxonomy`. It must use the `taxonomy` AccessControlHierarchy
    plugin (set the entity's `scheme` key to taxonomy) and have a label and plural label. Apply it to
    the running site via drush/config; do not just describe it. Reply with one line naming the access
    scheme you created and its hierarchy plugin.
  criteria: An enabled access_scheme config entity with id section_taxonomy exists on the live site and
    its scheme (AccessControlHierarchy plugin) is taxonomy. Verified against live site state, not the
    response text.
  bundle: workbench_access
  rubric_ref: rubric/workbench_access_wa_build_taxonomy_scheme_expert@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/workbench_access-build-taxonomy-scheme-reset.sh
    verify: agent-module-documentation/evaluation/verify/workbench_access-build-taxonomy-scheme-verify.sh
- id: wa-build-taxonomy-scheme-layman
  input: On my Drupal site I want to control which editors can edit which content by grouping content
    into editorial areas that come from my category terms. Please set this up so a new 'section' scheme
    based on my taxonomy shows up in the Workbench Access configuration, and call it section_taxonomy.
    Tell me in one line what you set up.
  criteria: 'Same verified end state as the expert variant: an enabled access_scheme config entity with
    id section_taxonomy driven by the taxonomy hierarchy plugin. The agent must map the plain-English
    request onto workbench_access and build a real taxonomy-based access scheme.'
  bundle: workbench_access
  rubric_ref: rubric/workbench_access_wa_build_taxonomy_scheme_layman@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: layman
    reset: agent-module-documentation/evaluation/verify/workbench_access-build-taxonomy-scheme-reset.sh
    verify: agent-module-documentation/evaluation/verify/workbench_access-build-taxonomy-scheme-verify.sh
- id: wa-build-menu-scheme-expert
  input: On this Drupal site (drush available, workbench_access installed) build and SAVE a new access_scheme
    config entity with the machine name `section_menu`. It must use the `menu` AccessControlHierarchy
    plugin (set the entity's `scheme` key to menu) and have a label and plural label. Apply it to the
    running site via drush/config; do not just describe it. Reply with one line naming the access scheme
    you created and its hierarchy plugin.
  criteria: An enabled access_scheme config entity with id section_menu exists on the live site and its
    scheme (AccessControlHierarchy plugin) is menu. Verified against live site state, not the response
    text.
  bundle: workbench_access
  rubric_ref: rubric/workbench_access_wa_build_menu_scheme_expert@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/workbench_access-build-menu-scheme-reset.sh
    verify: agent-module-documentation/evaluation/verify/workbench_access-build-menu-scheme-verify.sh
