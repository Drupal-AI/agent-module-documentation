metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: workflow_buttons_trash
  version: 1.0.x
  note: 'Submodule of workflow_buttons. Installs one content_moderation workflow, workflows.workflow.workflow_buttons_trash_publishing
    (''Publishing (with draft and soft delete)''), with states draft/published/trash/unpublished and a
    ''delete'' transition that moves content to the trash state (soft delete), plus restore_draft and
    restore_publish transitions; default_moderation_state draft. Also registers a ''Trash'' local task
    at /admin/content/trash (route has title+permission only, no controller in this release). No settings
    form, config schema, permissions, or Drush. Medium/hard cases are grounded in the shipped workflow
    config (reliably writable): introspection reads the trash state / delete-transition labels; execution
    restores the deleted workflow and fixes its default moderation state, verified against live config.'
questions:
- id: workflow_buttons_trash-what
  input: What does the workflow_buttons_trash (Trash workflow) module provide, and what happens when content
    is deleted under it?
  criteria: 'It installs a content_moderation workflow (workflow_buttons_trash_publishing) with a soft-delete
    ''Trash'' state: the ''delete'' transition moves content to the trash state instead of removing it,
    and restore_draft / restore_publish transitions bring it back.'
  bundle: workflow_buttons_trash
  rubric_ref: rubric/workflow_buttons_trash_workflow_buttons_trash_what@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: workflow_buttons_trash-states
  input: Which workflow does workflow_buttons_trash install and what states does it have?
  criteria: It installs workflows.workflow.workflow_buttons_trash_publishing ('Publishing (with draft
    and soft delete)') with states draft, published, trash, and unpublished; default_moderation_state
    is draft.
  bundle: workflow_buttons_trash
  rubric_ref: rubric/workflow_buttons_trash_workflow_buttons_trash_states@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: workflow_buttons_trash-restore
  input: Under the Trash workflow (workflow_buttons_trash), how does an editor get content back out of
    Trash, and is there a Trash listing?
  criteria: The restore_draft (trash -> draft) and restore_publish (trash -> published) transitions bring
    content back. The submodule also registers a 'Trash' local task at /admin/content/trash (title/permission
    only in this release).
  bundle: workflow_buttons_trash
  rubric_ref: rubric/workflow_buttons_trash_workflow_buttons_trash_restore@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: workflow_buttons_trash-read-trashlabel
  input: On this site the Trash workflow has been customised. Inspect the live workflow_buttons_trash_publishing
    workflow config and state the label of its soft-delete (trash) state.
  criteria: In workflows.workflow.workflow_buttons_trash_publishing the trash state's label is 'Recycle
    Bin Eval' (type_settings.states.trash.label).
  bundle: workflow_buttons_trash
  rubric_ref: rubric/workflow_buttons_trash_workflow_buttons_trash_read_trashlabel@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/workflow_buttons_trash-trashlabel-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/workflow_buttons_trash-trashlabel-cleanup.sh
- id: workflow_buttons_trash-read-deletelabel
  input: Inspect the live Trash workflow config on this site and state the label of the transition that
    moves content into the Trash state.
  criteria: The 'delete' transition (from draft/published/unpublished to trash) has label 'Move to Bin
    Eval' (type_settings.transitions.delete.label).
  bundle: workflow_buttons_trash
  rubric_ref: rubric/workflow_buttons_trash_workflow_buttons_trash_read_deletelabel@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/workflow_buttons_trash-deletelabel-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/workflow_buttons_trash-deletelabel-cleanup.sh
- id: workflow_buttons_trash-restore-workflow
  input: The Trash workflow (workflows.workflow.workflow_buttons_trash_publishing) has been deleted from
    this site. Restore it so it again has a 'trash' state and a delete transition that moves content to
    trash. Apply the change to the live site.
  criteria: workflows.workflow.workflow_buttons_trash_publishing exists again with a trash state and a
    'delete' transition whose 'to' is trash -- e.g. re-import the submodule's config/install/workflows.workflow.workflow_buttons_trash_publishing.yml
    (drush config:import --partial, or set the config data from the file).
  bundle: workflow_buttons_trash
  rubric_ref: rubric/workflow_buttons_trash_workflow_buttons_trash_restore_workflow@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/workflow_buttons_trash-restore-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/workflow_buttons_trash-restore-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/workflow_buttons_trash-restore-verify.sh
- id: workflow_buttons_trash-fix-default
  input: Someone changed the Trash workflow's default moderation state to Published. Restore the workflow_buttons_trash_publishing
    workflow so new content starts in the Draft state. Apply the change to the live site.
  criteria: workflows.workflow.workflow_buttons_trash_publishing type_settings.default_moderation_state
    is set back to 'draft'.
  bundle: workflow_buttons_trash
  rubric_ref: rubric/workflow_buttons_trash_workflow_buttons_trash_fix_default@1.0
