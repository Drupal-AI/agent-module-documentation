rubrics:
- id: workflow_buttons_workflow_buttons_enable
  version: '1.0'
  applicable_bundles:
  - workflow_buttons
  checks:
  - kind: must_contain_any
    values:
    - Manage form display
    - moderation_state
    - Workflow buttons
    - widget
  scoring:
    combine: all_pass
- id: workflow_buttons_workflow_buttons_top_setting
  version: '1.0'
  applicable_bundles:
  - workflow_buttons
  checks:
  - kind: must_contain_any
    values:
    - top_buttons
    - top and bottom
    - workflow-buttons
    - admin/config/workflow
  scoring:
    combine: all_pass
- id: workflow_buttons_workflow_buttons_labels
  version: '1.0'
  applicable_bundles:
  - workflow_buttons
  checks:
  - kind: must_contain_any
    values:
    - transition
    - show_current_state
    - current state
    - meta
  scoring:
    combine: all_pass
- id: workflow_buttons_workflow_buttons_read_top
  version: '1.0'
  applicable_bundles:
  - workflow_buttons
  checks:
  - kind: must_contain_any
    values:
    - 'true'
    - top and bottom
    - both
    - top
  scoring:
    combine: all_pass
- id: workflow_buttons_workflow_buttons_read_bottom
  version: '1.0'
  applicable_bundles:
  - workflow_buttons
  checks:
  - kind: must_contain_any
    values:
    - bottom
    - 'false'
    - only
  scoring:
    combine: all_pass
- id: workflow_buttons_workflow_buttons_enable_top
  version: '1.0'
  applicable_bundles:
  - workflow_buttons
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
- id: workflow_buttons_workflow_buttons_bottom_only
  version: '1.0'
  applicable_bundles:
  - workflow_buttons
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
