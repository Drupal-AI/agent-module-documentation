rubrics:
- id: workbench_moderation_workbench_moderation_default_states
  version: '1.0'
  applicable_bundles:
  - workbench_moderation
  checks:
  - kind: must_contain_any
    values:
    - draft
    - needs_review
    - Needs Review
    - published
    - archived
  scoring:
    combine: all_pass
- id: workbench_moderation_workbench_moderation_enable_where
  version: '1.0'
  applicable_bundles:
  - workbench_moderation
  checks:
  - kind: must_contain_any
    values:
    - third party setting
    - third_party_settings
    - workbench_moderation
    - allowed_moderation_states
    - default_moderation_state
    - Moderation tab
  scoring:
    combine: all_pass
- id: workbench_moderation_workbench_moderation_transition_permission
  version: '1.0'
  applicable_bundles:
  - workbench_moderation
  checks:
  - kind: must_contain_any
    values:
    - use draft_published transition
    - 'use '
    - transition
    - permission
  scoring:
    combine: all_pass
- id: workbench_moderation_workbench_moderation_known_state
  version: '1.0'
  applicable_bundles:
  - workbench_moderation
  checks:
  - kind: must_contain_any
    values:
    - Legal Review
  scoring:
    combine: all_pass
- id: workbench_moderation_workbench_moderation_known_bundle
  version: '1.0'
  applicable_bundles:
  - workbench_moderation
  checks:
  - kind: must_contain_any
    values:
    - needs_review
    - Needs Review
  scoring:
    combine: all_pass
- id: workbench_moderation_workbench_moderation_add_state
  version: '1.0'
  applicable_bundles:
  - workbench_moderation
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
- id: workbench_moderation_workbench_moderation_enable_article
  version: '1.0'
  applicable_bundles:
  - workbench_moderation
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
