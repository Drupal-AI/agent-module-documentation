metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: workbench_moderation
  version: 1.9.x
  note: 'Workbench Moderation adds moderation states (config entity moderation_state: id,label,published,default_revision)
    and transitions (config entity moderation_state_transition: id,label,stateFrom,stateTo,weight). Defaults:
    states draft/needs_review/published/archived. Moderation is enabled per bundle via a third-party setting
    on the bundle config (node.type.<bundle> -> third_party_settings.workbench_moderation: enabled/allowed_moderation_states/default_moderation_state).
    No external services. All medium/hard cases are grounded in live config verifiable via drush php:eval:
    introspection reads a custom moderation_state and the Article bundle''s default state; execution creates
    a custom moderation_state and enables moderation on the Article node type. Baseline: Article is NOT
    moderated; cleanup unsets the third-party settings to restore it.'
questions:
- id: workbench_moderation-default-states
  input: What moderation states does Workbench Moderation provide out of the box?
  criteria: 'Four default moderation_state config entities: draft (Draft), needs_review (Needs Review),
    published (Published), archived (Archived), with default transitions between them.'
  bundle: workbench_moderation
  rubric_ref: rubric/workbench_moderation_workbench_moderation_default_states@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: workbench_moderation-enable-where
  input: How do I turn on Workbench Moderation for a content type, and where is that stored in configuration?
  criteria: Enable it per bundle (e.g. the Moderation tab on the content type), which stores a third-party
    setting on the bundle config (node.type.<bundle> -> third_party_settings.workbench_moderation) with
    enabled, allowed_moderation_states, and default_moderation_state. Enabling forces revisions on.
  bundle: workbench_moderation
  rubric_ref: rubric/workbench_moderation_workbench_moderation_enable_where@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: workbench_moderation-transition-permission
  input: With Workbench Moderation, how do I control which roles can move content through a given transition
    (for example, publishing)? What form do the per-transition permissions take?
  criteria: Each moderation_state_transition creates a dynamic permission named 'use <transition_id> transition'
    (e.g. 'use draft_published transition'); grant it to the roles allowed to perform that transition.
  bundle: workbench_moderation
  rubric_ref: rubric/workbench_moderation_workbench_moderation_transition_permission@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: workbench_moderation-known-state
  input: This site has a custom Workbench Moderation state added for testing. Inspect the live moderation_state
    config entities and tell me the label of the custom state whose machine id is wbm_eval_legal and whether
    it is a published state.
  criteria: 'The moderation_state wbm_eval_legal has label ''Legal Review'' and is an unpublished state
    (published: false).'
  bundle: workbench_moderation
  rubric_ref: rubric/workbench_moderation_workbench_moderation_known_state@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/workbench_moderation-state-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/workbench_moderation-state-cleanup.sh
- id: workbench_moderation-known-bundle
  input: Workbench Moderation is enabled on the Article content type on this site. Inspect the live configuration
    and tell me which moderation state new Article content starts in by default.
  criteria: The Article node type's third_party_settings.workbench_moderation.default_moderation_state
    is needs_review.
  bundle: workbench_moderation
  rubric_ref: rubric/workbench_moderation_workbench_moderation_known_bundle@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/workbench_moderation-bundle-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/workbench_moderation-bundle-cleanup.sh
- id: workbench_moderation-add-state
  input: Using Workbench Moderation, create a new moderation state with machine id 'wbm_task_state' and
    label 'Task State' that is an UNPUBLISHED state (content in it is not published). Apply the change
    to the live site.
  criteria: Create a moderation_state config entity, e.g. ModerationState::create(['id' => 'wbm_task_state',
    'label' => 'Task State', 'published' => FALSE, 'default_revision' => FALSE])->save(); verify checks
    it exists and isPublishedState() is FALSE.
  bundle: workbench_moderation
  rubric_ref: rubric/workbench_moderation_workbench_moderation_add_state@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/workbench_moderation-addstate-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/workbench_moderation-addstate-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/workbench_moderation-addstate-verify.sh
- id: workbench_moderation-enable-article
  input: Enable Workbench Moderation on the Article content type, allowing the draft and published states
    and making draft the default state for new content. Apply the change to the live site.
  criteria: 'On the article node type set third-party settings for workbench_moderation: enabled = TRUE,
    allowed_moderation_states = [''draft'',''published''], default_moderation_state = ''draft'', then
    save. verify checks enabled === TRUE.'
  bundle: workbench_moderation
  rubric_ref: rubric/workbench_moderation_workbench_moderation_enable_article@1.0
