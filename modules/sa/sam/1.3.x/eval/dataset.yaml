metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: sam
  version: 1.3.x
  note: 'Simple Add More is a small, JS-driven field-widget UX module: one config object, one permission,
    one alter hook, a fixed allow-list of widget types, and a per-widget third-party opt-out. Cases are
    `recipe` (response-graded) probing documented facts an agent would otherwise read source to answer;
    no site mutation.'
questions:
- id: sam-what-it-does
  input: On a Drupal 11 site, what does the 'Simple Add More' (sam) module do to a multi-value field form,
    and does it apply to unlimited-cardinality fields?
  criteria: It hides surplus empty elements on fixed limited-cardinality (> 1) fields, showing one empty
    element plus an 'Add another item' button. It does NOT apply to unlimited (-1) or single-value fields.
  bundle: sam
  rubric_ref: rubric/sam_sam_what_it_does@1.0
  tags:
  - mode:recipe
- id: sam-config-object
  input: Which config object and key control the label of the 'Add another item' button in the sam (Simple
    Add More) module, and what is its default value?
  criteria: The add_more_label key on the sam.settings config object; default 'Add another item'.
  bundle: sam
  rubric_ref: rubric/sam_sam_config_object@1.0
  tags:
  - mode:recipe
- id: sam-settings-route
  input: What is the route name and admin path of the Simple Add More settings form on a Drupal site?
  criteria: Route sam.admin_settings at /admin/config/content/simple-add-more-settings.
  bundle: sam
  rubric_ref: rubric/sam_sam_settings_route@1.0
  tags:
  - mode:recipe
- id: sam-permission
  input: Which permission does the sam (Simple Add More) module define to gate its settings form?
  criteria: The 'administer sam' permission gates the Simple Add More settings form.
  bundle: sam
  rubric_ref: rubric/sam_sam_permission@1.0
  tags:
  - mode:recipe
- id: sam-add-widget-type
  input: I have a custom field widget and want the Simple Add More module to simplify it. Which hook do
    I implement to add my widget to the supported list?
  criteria: Implement hook_sam_allowed_widget_types_alter(array &$widget_types) and append the widget's
    plugin id.
  bundle: sam
  rubric_ref: rubric/sam_sam_add_widget_type@1.0
  tags:
  - mode:recipe
- id: sam-per-widget-optout
  input: How do I disable Simple Add More for just one specific widget on one form display without turning
    off the module? Name the setting.
  criteria: Check the 'Skip Simple Add More simplification' box on the widget in Manage form display;
    stored as the third-party setting sam.skip_simplification (boolean).
  bundle: sam
  rubric_ref: rubric/sam_sam_per_widget_optout@1.0
  tags:
  - mode:recipe
- id: sam-help-text-placeholder
  input: In the Simple Add More help-text settings (help_text_singular / help_text_plural), what placeholder
    token inserts the number of remaining addable items?
  criteria: The @count placeholder, e.g. '@count additional items can be added'.
  bundle: sam
  rubric_ref: rubric/sam_sam_help_text_placeholder@1.0
  tags:
  - mode:recipe
