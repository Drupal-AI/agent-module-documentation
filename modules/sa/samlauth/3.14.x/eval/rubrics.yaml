rubrics:
- id: samlauth_samlauth_external_library
  version: '1.0'
  applicable_bundles:
  - samlauth
  checks:
  - kind: must_contain_any
    values:
    - onelogin/php-saml
    - php-saml
  scoring:
    combine: all_pass
- id: samlauth_samlauth_acs_metadata_routes
  version: '1.0'
  applicable_bundles:
  - samlauth
  checks:
  - kind: must_contain_any
    values:
    - /saml/acs
  scoring:
    combine: all_pass
- id: samlauth_samlauth_config_object
  version: '1.0'
  applicable_bundles:
  - samlauth
  checks:
  - kind: must_contain_any
    values:
    - samlauth.authentication
    - unique_id_attribute
  scoring:
    combine: all_pass
- id: samlauth_samlauth_externalauth_linkage
  version: '1.0'
  applicable_bundles:
  - samlauth
  checks:
  - kind: must_contain_any
    values:
    - externalauth
    - authmap
  scoring:
    combine: all_pass
- id: samlauth_samlauth_user_sync_event
  version: '1.0'
  applicable_bundles:
  - samlauth
  checks:
  - kind: must_contain_any
    values:
    - USER_SYNC
    - samlauth.user_sync
    - SamlauthUserSyncEvent
  scoring:
    combine: all_pass
- id: samlauth_samlauth_library_config_alter
  version: '1.0'
  applicable_bundles:
  - samlauth
  checks:
  - kind: must_contain_any
    values:
    - LIBRARY_CONFIG_ALTER
    - samlauth.library_config_alter
    - SamlauthLibraryConfigAlterEvent
  scoring:
    combine: all_pass
- id: samlauth_samlauth_service
  version: '1.0'
  applicable_bundles:
  - samlauth
  checks:
  - kind: must_contain_any
    values:
    - samlauth.saml
    - SamlService
  scoring:
    combine: all_pass
- id: samlauth_samlauth_permissions
  version: '1.0'
  applicable_bundles:
  - samlauth
  checks:
  - kind: must_contain_any
    values:
    - configure saml
    - view sp metadata
  scoring:
    combine: all_pass
