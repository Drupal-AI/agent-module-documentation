metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: samlauth
  version: 3.14.x
  note: samlauth makes Drupal a SAML 2.0 Service Provider on top of externalauth + onelogin/php-saml.
    Cases are `recipe` (response-graded) probing documented facts (config keys, /saml/* routes, external
    lib, externalauth linkage, sync events) an agent would otherwise read source to answer; no site mutation.
questions:
- id: samlauth-external-library
  input: Which external (non-Drupal) PHP library does the Drupal samlauth module require to do the SAML
    message handling?
  criteria: onelogin/php-saml (the OneLogin / SAML-Toolkits SAML PHP Toolkit), required via composer (^3.8.1
    || ^4.3.1).
  bundle: samlauth
  rubric_ref: rubric/samlauth_samlauth_external_library@1.0
  tags:
  - mode:recipe
- id: samlauth-acs-metadata-routes
  input: On a Drupal site using samlauth, which URL path is the Assertion Consumer Service that receives
    the IdP response, and which path publishes the SP metadata XML?
  criteria: /saml/acs is the ACS endpoint that validates the IdP response; /saml/metadata publishes the
    SP metadata XML (gated by the 'view sp metadata' permission).
  bundle: samlauth
  rubric_ref: rubric/samlauth_samlauth_acs_metadata_routes@1.0
  tags:
  - mode:recipe
- id: samlauth-config-object
  input: Which config object holds all samlauth SP/IdP settings, and which key identifies each SAML login
    as a stable unique identifier?
  criteria: All settings live in samlauth.authentication; the unique_id_attribute key holds the never-changing
    Unique ID (a NameID or named attribute).
  bundle: samlauth
  rubric_ref: rubric/samlauth_samlauth_config_object@1.0
  tags:
  - mode:recipe
- id: samlauth-externalauth-linkage
  input: How does samlauth remember which Drupal user a given SAML login belongs to, and which module/table
    stores that link?
  criteria: samlauth depends on the externalauth module and stores the SAML-login-to-Drupal-user link
    in externalauth's authmap table under provider 'samlauth' (managed at /admin/people/authmap/samlauth).
  bundle: samlauth
  rubric_ref: rubric/samlauth_samlauth_externalauth_linkage@1.0
  tags:
  - mode:recipe
- id: samlauth-user-sync-event
  input: In a custom Drupal module I want to set extra user fields from SAML attributes during login,
    and be able to block the login by throwing. Which samlauth event should I subscribe to?
  criteria: Subscribe to SamlauthEvents::USER_SYNC (SamlauthUserSyncEvent); call markAccountChanged()
    to persist changes, or throw an exception to prevent the login/registration.
  bundle: samlauth
  rubric_ref: rubric/samlauth_samlauth_user_sync_event@1.0
  tags:
  - mode:recipe
- id: samlauth-library-config-alter
  input: I need to set an advanced php-saml toolkit setting that samlauth doesn't expose in its UI (e.g.
    requestedAuthnContext). Which samlauth event lets me alter the OneLogin config array?
  criteria: Subscribe to SamlauthEvents::LIBRARY_CONFIG_ALTER (SamlauthLibraryConfigAlterEvent); use getConfig()/setConfig()
    to modify the settings array before OneLogin\Saml2\Auth is built, keyed on getPurpose().
  bundle: samlauth
  rubric_ref: rubric/samlauth_samlauth_library_config_alter@1.0
  tags:
  - mode:recipe
- id: samlauth-service
  input: Which Drupal service id and class does samlauth provide to drive SAML login/acs/logout and read
    the returned attributes?
  criteria: The samlauth.saml service (Drupal\samlauth\SamlService); e.g. getAttributes() reads the validated
    SAML attributes and acs() processes the IdP response.
  bundle: samlauth
  rubric_ref: rubric/samlauth_samlauth_service@1.0
  tags:
  - mode:recipe
- id: samlauth-permissions
  input: What are the two permissions samlauth defines, and which one is needed to reach the SP metadata
    URL?
  criteria: '''configure saml'' gates the admin configuration forms; ''view sp metadata'' gates /saml/metadata.'
  bundle: samlauth
  rubric_ref: rubric/samlauth_samlauth_permissions@1.0
  tags:
  - mode:recipe
