rubrics:
- id: samlauth_user_fields_suf_purpose
  version: '1.0'
  applicable_bundles:
  - samlauth_user_fields
  checks:
  - kind: must_contain_any
    values:
    - samlauth_user_fields
    - /admin/config/people/saml/user-fields
  scoring:
    combine: all_pass
- id: samlauth_user_fields_suf_config_object
  version: '1.0'
  applicable_bundles:
  - samlauth_user_fields
  checks:
  - kind: must_contain_any
    values:
    - samlauth_user_fields.mappings
    - attribute_name
    - field_name
  scoring:
    combine: all_pass
- id: samlauth_user_fields_suf_events
  version: '1.0'
  applicable_bundles:
  - samlauth_user_fields
  checks:
  - kind: must_contain_any
    values:
    - USER_SYNC
    - USER_LINK
    - event subscriber
    - samlauth.user_sync
  scoring:
    combine: all_pass
- id: samlauth_user_fields_suf_linking_options
  version: '1.0'
  applicable_bundles:
  - samlauth_user_fields
  checks:
  - kind: must_contain_any
    values:
    - link_first_user
    - ignore_blocked
  scoring:
    combine: all_pass
- id: samlauth_user_fields_suf_permission
  version: '1.0'
  applicable_bundles:
  - samlauth_user_fields
  checks:
  - kind: must_contain_any
    values:
    - configure saml
  scoring:
    combine: all_pass
- id: samlauth_user_fields_suf_multivalue_limitation
  version: '1.0'
  applicable_bundles:
  - samlauth_user_fields
  checks:
  - kind: must_contain_any
    values:
    - first value
    - only the first
  scoring:
    combine: all_pass
