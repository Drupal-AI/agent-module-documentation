metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: samlauth_user_fields
  version: 3.14.x
  note: samlauth submodule mapping SAML attributes onto user fields via the parent's USER_SYNC/USER_LINK
    events. Cases are `recipe` (response-graded) probing documented config keys, the config route, event
    mechanics and the multi-value limitation; no site mutation.
questions:
- id: suf-purpose
  input: On a Drupal site with samlauth, which submodule lets me map arbitrary SAML attributes onto Drupal
    user profile fields, and where do I configure it?
  criteria: The samlauth_user_fields submodule; configure attribute→field mappings at /admin/config/people/saml/user-fields.
  bundle: samlauth_user_fields
  rubric_ref: rubric/samlauth_user_fields_suf_purpose@1.0
  tags:
  - mode:recipe
- id: suf-config-object
  input: Which config object stores the samlauth_user_fields attribute-to-field mappings, and what keys
    make up one mapping?
  criteria: The samlauth_user_fields.mappings config object; each field_mappings entry has attribute_name,
    field_name and link_user_order.
  bundle: samlauth_user_fields
  rubric_ref: rubric/samlauth_user_fields_suf_config_object@1.0
  tags:
  - mode:recipe
- id: suf-events
  input: How does samlauth_user_fields actually write the attribute values onto the user account — what
    mechanism does it hook into?
  criteria: It is an event subscriber to samlauth's USER_SYNC (writes mapped fields, calls markAccountChanged)
    and USER_LINK (links an existing user by field value).
  bundle: samlauth_user_fields
  rubric_ref: rubric/samlauth_user_fields_suf_events@1.0
  tags:
  - mode:recipe
- id: suf-linking-options
  input: In samlauth_user_fields, which setting picks the first user when several match during account
    linking, and which one skips blocked accounts?
  criteria: link_first_user links the first match when several users match; ignore_blocked skips blocked
    accounts during linking.
  bundle: samlauth_user_fields
  rubric_ref: rubric/samlauth_user_fields_suf_linking_options@1.0
  tags:
  - mode:recipe
- id: suf-permission
  input: Which permission gates the samlauth_user_fields mapping UI — does it define its own?
  criteria: It defines no permission of its own; the mapping forms reuse the parent module's 'configure
    saml' permission.
  bundle: samlauth_user_fields
  rubric_ref: rubric/samlauth_user_fields_suf_permission@1.0
  tags:
  - mode:recipe
- id: suf-multivalue-limitation
  input: If a SAML attribute mapped by samlauth_user_fields contains multiple values, what happens?
  criteria: Only the first value of a multi-value attribute is used; the rest are ignored (known limitation).
  bundle: samlauth_user_fields
  rubric_ref: rubric/samlauth_user_fields_suf_multivalue_limitation@1.0
  tags:
  - mode:recipe
