metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: samlauth_user_roles
  version: 3.14.x
  note: samlauth submodule assigning Drupal roles from a SAML attribute via the parent's USER_SYNC event.
    Cases are `recipe` (response-graded) probing documented config keys, the config route, event mechanics
    and role-sync behavior; no site mutation.
questions:
- id: sur-purpose
  input: On a Drupal site with samlauth, which submodule assigns Drupal roles based on a SAML group/attribute
    claim, and where is it configured?
  criteria: The samlauth_user_roles submodule; configure attribute→role mapping at /admin/config/people/saml/user-roles.
  bundle: samlauth_user_roles
  rubric_ref: rubric/samlauth_user_roles_sur_purpose@1.0
  tags:
  - mode:recipe
- id: sur-config-object
  input: Which config object holds the samlauth_user_roles mapping, and which two keys define the SAML
    attribute to read and the value→role map?
  criteria: The samlauth_user_roles.mapping config object; saml_attribute names the attribute/claim and
    value_map maps attribute_value → role_machine_name.
  bundle: samlauth_user_roles
  rubric_ref: rubric/samlauth_user_roles_sur_config_object@1.0
  tags:
  - mode:recipe
- id: sur-event
  input: How does samlauth_user_roles actually assign roles during SAML login — what does it hook into?
  criteria: It is an event subscriber to samlauth's USER_SYNC event; it adjusts the account's roles and
    marks it changed so samlauth saves it.
  bundle: samlauth_user_roles
  rubric_ref: rubric/samlauth_user_roles_sur_event@1.0
  tags:
  - mode:recipe
- id: sur-default-unassign
  input: In samlauth_user_roles, which setting grants roles to every SAML user, and which removes roles
    first so membership stays in sync with the IdP?
  criteria: default_roles is granted to all SAML users; unassign_roles is removed first before defaults
    and mapped roles are added.
  bundle: samlauth_user_roles
  rubric_ref: rubric/samlauth_user_roles_sur_default_unassign@1.0
  tags:
  - mode:recipe
- id: sur-first-login
  input: How do I make samlauth_user_roles change a user's roles only on their first SAML login and leave
    later manual role edits alone?
  criteria: Enable only_first_login; it then skips role changes when the event is not a first login (isFirstLogin()
    is false).
  bundle: samlauth_user_roles
  rubric_ref: rubric/samlauth_user_roles_sur_first_login@1.0
  tags:
  - mode:recipe
- id: sur-multivalue-separator
  input: My IdP sends all groups in one delimited string attribute. How does samlauth_user_roles split
    it into individual role lookups?
  criteria: Set saml_attribute_separator; the attribute value is split on it and each piece is looked
    up in value_map.
  bundle: samlauth_user_roles
  rubric_ref: rubric/samlauth_user_roles_sur_multivalue_separator@1.0
  tags:
  - mode:recipe
