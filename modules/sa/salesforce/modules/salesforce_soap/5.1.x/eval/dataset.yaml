metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: salesforce_soap
  version: 5.1.x
  note: Salesforce Soap exposes exactly one service, salesforce.soap_client (Drupal\salesforce_soap\Soap\SoapClient),
    wrapping the Salesforce SOAP Partner API and authenticating via the suite's auth-provider manager.
    It has NO config, permissions, plugins or Drush of its own. Therefore the only local, verifiable state
    relevant to this module is (a) that its service is registered and (b) the suite's default auth provider
    the SOAP client authenticates with (salesforce.settings.salesforce_auth_provider). One medium introspects
    the service's presence; the other medium and both hard cases exercise salesforce_auth_provider (shared
    suite config, framed from the SOAP client's perspective), verified by pure reads. Cleanup restores
    salesforce_auth_provider to '' and leaves the module enabled (campaign baseline). Real SOAP calls
    need ext-soap + a live org and are out of scope.
questions:
- id: salesforce_soap-service
  input: What does the Salesforce Soap module provide, and how would I use it from code?
  criteria: It provides the salesforce.soap_client service (Drupal\salesforce_soap\Soap\SoapClient) that
    wraps the Salesforce SOAP (Partner) API. Get it with \Drupal::service('salesforce.soap_client') or
    inject it; it has no config of its own.
  bundle: salesforce_soap
  rubric_ref: rubric/salesforce_soap_salesforce_soap_service@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: salesforce_soap-auth
  input: How does the Salesforce SOAP client authenticate - does it need its own credentials configuration?
  criteria: 'No separate config: the SOAP client authenticates through the same auth-provider system as
    REST (plugin.manager.salesforce.auth_providers), using a salesforce_auth authorization and the suite
    default salesforce.settings.salesforce_auth_provider.'
  bundle: salesforce_soap
  rubric_ref: rubric/salesforce_soap_salesforce_soap_auth@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: salesforce_soap-requirements
  input: What are the prerequisites/limits of the Salesforce Soap module - does it add configuration or
    permissions, and what PHP extension does it require?
  criteria: It requires the PHP ext-soap extension and adds no configuration, permissions, plugins, or
    Drush - it is a pure service that reuses the suite's authorization.
  bundle: salesforce_soap
  rubric_ref: rubric/salesforce_soap_salesforce_soap_requirements@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: salesforce_soap-service-present
  input: On this Drupal site, is the Salesforce SOAP client service available? Inspect the site and give
    the service id if present.
  criteria: 'Yes: the salesforce.soap_client service is registered (the SoapClient wrapping the Salesforce
    SOAP Partner API).'
  bundle: salesforce_soap
  rubric_ref: rubric/salesforce_soap_salesforce_soap_service_present@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/salesforce_soap-service-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/salesforce_soap-service-cleanup.sh
- id: salesforce_soap-known-auth
  input: On this Drupal site, which Salesforce authorization will the SOAP client authenticate with (the
    suite's default provider)? Inspect the live Salesforce settings and give the id.
  criteria: 'It uses soap_prod: salesforce.settings.salesforce_auth_provider = soap_prod, which the SOAP
    client (like REST) authenticates with.'
  bundle: salesforce_soap
  rubric_ref: rubric/salesforce_soap_salesforce_soap_known_auth@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/salesforce_soap-known-auth-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/salesforce_soap-known-auth-cleanup.sh
- id: salesforce_soap-set-auth
  input: On this Drupal site, make the Salesforce SOAP client (and the rest of the suite) authenticate
    using the authorization with id soap_auth by setting it as the default Salesforce auth provider. Apply
    the change to the live site.
  criteria: salesforce.settings.salesforce_auth_provider is set to soap_auth (the authorization the SOAP
    client uses).
  bundle: salesforce_soap
  rubric_ref: rubric/salesforce_soap_salesforce_soap_set_auth@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/salesforce_soap-set-auth-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/salesforce_soap-set-auth-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/salesforce_soap-set-auth-verify.sh
- id: salesforce_soap-repoint-auth
  input: On this Drupal site the default Salesforce authorization (used by the SOAP client) is set to
    old_soap. Repoint it to the authorization soap_sandbox. Apply the change to the live site.
  criteria: salesforce.settings.salesforce_auth_provider is set to soap_sandbox.
  bundle: salesforce_soap
  rubric_ref: rubric/salesforce_soap_salesforce_soap_repoint_auth@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/salesforce_soap-set-auth2-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/salesforce_soap-set-auth2-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/salesforce_soap-set-auth2-verify.sh
