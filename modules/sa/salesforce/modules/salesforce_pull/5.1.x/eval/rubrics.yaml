rubrics:
- id: salesforce_pull_salesforce_pull_triggers
  version: '1.0'
  applicable_bundles:
  - salesforce_pull
  checks:
  - kind: must_contain_any
    values:
    - sync_triggers
    - pull_create
    - pull_update
    - pull_delete
  scoring:
    combine: all_pass
- id: salesforce_pull_salesforce_pull_scope
  version: '1.0'
  applicable_bundles:
  - salesforce_pull
  checks:
  - kind: must_contain_any
    values:
    - pull_where_clause
    - pull_trigger_date
    - pull_record_type_filter
  scoring:
    combine: all_pass
- id: salesforce_pull_salesforce_pull_queue
  version: '1.0'
  applicable_bundles:
  - salesforce_pull
  checks:
  - kind: must_contain_any
    values:
    - cron
    - pull_max_queue_size
    - queue
    - standalone
  scoring:
    combine: all_pass
- id: salesforce_pull_salesforce_pull_known_trigger
  version: '1.0'
  applicable_bundles:
  - salesforce_pull
  checks:
  - kind: must_contain_any
    values:
    - pull_create
    - 'yes'
    - create
  scoring:
    combine: all_pass
- id: salesforce_pull_salesforce_pull_known_queue
  version: '1.0'
  applicable_bundles:
  - salesforce_pull
  checks:
  - kind: must_contain_any
    values:
    - '750'
  scoring:
    combine: all_pass
- id: salesforce_pull_salesforce_pull_enable_update
  version: '1.0'
  applicable_bundles:
  - salesforce_pull
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
- id: salesforce_pull_salesforce_pull_set_queue
  version: '1.0'
  applicable_bundles:
  - salesforce_pull
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
