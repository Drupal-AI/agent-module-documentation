metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: salesforce_jwt
  version: 5.1.x
  note: 'Salesforce JWT Auth Provider adds key-based (JWT bearer) auth via two @SalesforceAuthProvider
    plugins: jwt and jwt_govcloud. Each authorization is a salesforce_auth config entity with provider=jwt
    and provider_settings (login_url, consumer_key, username, encrypt_key referencing a Key entity). Creating/reading
    the auth config entity is local (no connection needed - only AUTHORIZING/token exchange needs the
    org), so all medium/hard cases are grounded in real salesforce_auth config entities created/read/modified
    locally and verified by pure reads. Namespaced sfj_* auth entities are removed on cleanup.'
questions:
- id: salesforce_jwt-what
  input: What kind of Salesforce authentication does the Salesforce JWT Auth Provider module add, and
    what are its plugin ids?
  criteria: It adds key-based JWT bearer (server-to-server) authentication - no interactive login. It
    provides the auth-provider plugins jwt and jwt_govcloud, which sign a JWT assertion with a private
    key stored via the Key module.
  bundle: salesforce_jwt
  rubric_ref: rubric/salesforce_jwt_salesforce_jwt_what@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: salesforce_jwt-settings
  input: When configuring a JWT Salesforce authorization, what settings do you provide (consumer key,
    login URL, key, user), and where is the private signing key stored?
  criteria: 'A jwt salesforce_auth stores provider_settings: login_url (production https://login.salesforce.com
    or sandbox https://test.salesforce.com), consumer_key (connected app), username (to impersonate),
    and encrypt_key - the id of a Key module entity holding the private key that signs the JWT.'
  bundle: salesforce_jwt
  rubric_ref: rubric/salesforce_jwt_salesforce_jwt_settings@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: salesforce_jwt-sandbox-url
  input: For a JWT Salesforce authorization, what login_url do I use to connect to a Salesforce sandbox
    versus production?
  criteria: Use https://test.salesforce.com for a sandbox and https://login.salesforce.com for production,
    set as the login_url in the jwt authorization's provider_settings.
  bundle: salesforce_jwt
  rubric_ref: rubric/salesforce_jwt_salesforce_jwt_sandbox_url@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: salesforce_jwt-known-provider
  input: On this Drupal site there is a Salesforce authorization named sfj_known. Inspect its live configuration
    and state which auth provider it uses.
  criteria: 'It uses the jwt provider: salesforce_auth sfj_known has provider = jwt (key-based JWT authentication).'
  bundle: salesforce_jwt
  rubric_ref: rubric/salesforce_jwt_salesforce_jwt_known_provider@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/salesforce_jwt-known-provider-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/salesforce_jwt-known-provider-cleanup.sh
- id: salesforce_jwt-known-loginurl
  input: On this Drupal site there is a JWT Salesforce authorization named sfj_env. Inspect its live configuration
    and state its login URL - is it pointing at production or a sandbox?
  criteria: 'It points at production: salesforce_auth sfj_env has provider_settings.login_url = https://login.salesforce.com.'
  bundle: salesforce_jwt
  rubric_ref: rubric/salesforce_jwt_salesforce_jwt_known_loginurl@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/salesforce_jwt-known-loginurl-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/salesforce_jwt-known-loginurl-cleanup.sh
- id: salesforce_jwt-create
  input: On this Drupal site, create a Salesforce authorization named sfj_task that uses key-based JWT
    authentication (the jwt provider). Apply the change to the live site (you do not need to complete
    the token exchange with Salesforce).
  criteria: A salesforce_auth config entity sfj_task exists with provider = jwt (created via the Salesforce
    auth UI or the salesforce_auth storage).
  bundle: salesforce_jwt
  rubric_ref: rubric/salesforce_jwt_salesforce_jwt_create@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/salesforce_jwt-create-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/salesforce_jwt-create-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/salesforce_jwt-create-verify.sh
- id: salesforce_jwt-set-loginurl
  input: On this Drupal site there is a JWT Salesforce authorization sfj_ltask currently pointed at a
    sandbox. Repoint it to production by setting its login URL to https://login.salesforce.com. Apply
    the change to the live site.
  criteria: salesforce_auth sfj_ltask has provider_settings.login_url = https://login.salesforce.com.
  bundle: salesforce_jwt
  rubric_ref: rubric/salesforce_jwt_salesforce_jwt_set_loginurl@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/salesforce_jwt-set-loginurl-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/salesforce_jwt-set-loginurl-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/salesforce_jwt-set-loginurl-verify.sh
