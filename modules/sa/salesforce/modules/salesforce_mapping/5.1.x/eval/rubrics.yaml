rubrics:
- id: salesforce_mapping_salesforce_mapping_entity
  version: '1.0'
  applicable_bundles:
  - salesforce_mapping
  checks:
  - kind: must_contain_any
    values:
    - salesforce_mapping
    - sync_triggers
    - salesforce_object_type
  scoring:
    combine: all_pass
- id: salesforce_mapping_salesforce_mapping_field_plugins
  version: '1.0'
  applicable_bundles:
  - salesforce_mapping
  checks:
  - kind: must_contain_any
    values:
    - salesforce_mapping_field
    - properties
    - record_type
    - field_mappings
  scoring:
    combine: all_pass
- id: salesforce_mapping_salesforce_mapping_mapped_object
  version: '1.0'
  applicable_bundles:
  - salesforce_mapping
  checks:
  - kind: must_contain_any
    values:
    - salesforce_mapped_object
    - mapped object
  scoring:
    combine: all_pass
- id: salesforce_mapping_salesforce_mapping_known_object
  version: '1.0'
  applicable_bundles:
  - salesforce_mapping
  checks:
  - kind: must_contain_any
    values:
    - Contact
  scoring:
    combine: all_pass
- id: salesforce_mapping_salesforce_mapping_known_triggers
  version: '1.0'
  applicable_bundles:
  - salesforce_mapping
  checks:
  - kind: must_contain_any
    values:
    - push_create
    - push_update
  scoring:
    combine: all_pass
- id: salesforce_mapping_salesforce_mapping_create
  version: '1.0'
  applicable_bundles:
  - salesforce_mapping
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
- id: salesforce_mapping_salesforce_mapping_set_triggers
  version: '1.0'
  applicable_bundles:
  - salesforce_mapping
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
