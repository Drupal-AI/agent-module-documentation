metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: salesforce_mapping
  version: 5.1.x
  note: Salesforce Mapping provides the salesforce_mapping config entity (maps a Drupal entity type/bundle
    to a Salesforce object, with sync_triggers push_create/push_update/push_delete/pull_create/pull_update/pull_delete
    and a field_mappings array of SalesforceMappingField plugin instances), the salesforce_mapped_object
    content entity, and the salesforce_mapping_field plugin type (properties, properties_extended, record_type,
    broken). Mapping is pure config and needs no Salesforce connection, so all medium/hard cases are grounded
    in real salesforce_mapping config entities created/read/modified locally, verified by pure entity
    reads. Cleanup deletes the namespaced sfm_* mappings.
questions:
- id: salesforce_mapping-entity
  input: In the Salesforce suite, what config entity defines the mapping between a Drupal entity and a
    Salesforce object, and what does it record about which events sync?
  criteria: 'The salesforce_mapping config entity maps a drupal_entity_type/drupal_bundle to a salesforce_object_type.
    Its sync_triggers control which events sync: push_create/push_update/push_delete (Drupal->SF) and
    pull_create/pull_update/pull_delete (SF->Drupal).'
  bundle: salesforce_mapping
  rubric_ref: rubric/salesforce_mapping_salesforce_mapping_entity@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: salesforce_mapping-field-plugins
  input: How are individual field mappings represented in the Salesforce Mapping module, and what are
    the built-in field-mapping plugin types?
  criteria: 'Each field mapping is a SalesforceMappingField plugin instance in the mapping''s field_mappings
    array (plugin type salesforce_mapping_field). Built-in plugins: properties and properties_extended
    (map a Drupal field/property to a Salesforce field), record_type (map the SF record type), and broken
    (placeholder for an unavailable field).'
  bundle: salesforce_mapping
  rubric_ref: rubric/salesforce_mapping_salesforce_mapping_field_plugins@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: salesforce_mapping-mapped-object
  input: In the Salesforce suite, what entity tracks the link between a specific Drupal entity and its
    corresponding Salesforce record (its Salesforce Id)?
  criteria: The salesforce_mapped_object content entity records the link between a specific Drupal entity
    and its Salesforce record (SFID). It is revisioned (capped by salesforce.settings.limit_mapped_object_revisions)
    and created/updated by push/pull.
  bundle: salesforce_mapping
  rubric_ref: rubric/salesforce_mapping_salesforce_mapping_mapped_object@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: salesforce_mapping-known-object
  input: On this Drupal site there is a Salesforce mapping named sfm_known. Inspect its live configuration
    and state which Salesforce object type it maps to.
  criteria: 'It maps to the Contact object: salesforce_mapping sfm_known has salesforce_object_type =
    Contact (mapping the Drupal user entity to Salesforce Contact).'
  bundle: salesforce_mapping
  rubric_ref: rubric/salesforce_mapping_salesforce_mapping_known_object@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/salesforce_mapping-known-obj-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/salesforce_mapping-known-obj-cleanup.sh
- id: salesforce_mapping-known-triggers
  input: On this Drupal site there is a Salesforce mapping named sfm_trig. Inspect its live configuration
    and state which sync triggers are enabled.
  criteria: Only the push_create and push_update sync triggers are enabled on sfm_trig (all pull_* and
    push_delete are false), so it pushes on Drupal entity create and update.
  bundle: salesforce_mapping
  rubric_ref: rubric/salesforce_mapping_salesforce_mapping_known_triggers@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/salesforce_mapping-known-triggers-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/salesforce_mapping-known-triggers-cleanup.sh
- id: salesforce_mapping-create
  input: On this Drupal site, create a Salesforce mapping with machine name sfm_task that maps the Drupal
