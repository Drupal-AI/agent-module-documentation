  criteria: A salesforce_mapping config entity sfm_task exists with salesforce_object_type = Lead, drupal_entity_type
    = user, drupal_bundle = user (created via the mapping UI or the salesforce_mapping storage).
  bundle: salesforce_mapping
  rubric_ref: rubric/salesforce_mapping_salesforce_mapping_create@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/salesforce_mapping-create-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/salesforce_mapping-create-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/salesforce_mapping-create-verify.sh
- id: salesforce_mapping-set-triggers
  input: On this Drupal site there is a Salesforce mapping sfm_ttask with all sync triggers disabled.
    Configure it to push to Salesforce whenever the Drupal entity is created or updated (enable the push-on-create
    and push-on-update triggers). Apply the change to the live site.
  criteria: salesforce_mapping sfm_ttask has sync_triggers.push_create = true and sync_triggers.push_update
