metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: salesforce_example
  version: 5.1.x
  note: 'Salesforce Example is a developer demo module: it installs an example salesforce_mapping (salesforce_example_contact:
    Drupal user -> Salesforce Contact), provides a SalesforceMappingField plugin id ''hardcoded'' (''Hardcoded
    Value'') that maps a constant to a Salesforce field, and ships a SalesforceExampleSubscriber demonstrating
    the suite''s push/pull events. No config/permissions of its own. Everything is local config/plugins
    verifiable without a Salesforce connection. Medium cases introspect the shipped example mapping; hard
    cases build salesforce_mapping entities that use the example''s hardcoded field plugin, verified by
    pure reads. Namespaced sfe_* mappings removed on cleanup; the shipped example mapping is read-only
    in these cases.'
questions:
- id: salesforce_example-what
  input: What does the Salesforce Example module demonstrate, and what does its example mapping connect?
  criteria: 'It is a demo: it ships an example mapping (salesforce_example_contact) mapping the Drupal
    user entity to the Salesforce Contact object, a ''hardcoded'' field-mapping plugin, and an event subscriber
    (SalesforceExampleSubscriber) showing how to handle push/pull events.'
  bundle: salesforce_example
  rubric_ref: rubric/salesforce_example_salesforce_example_what@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: salesforce_example-hardcoded
  input: The Salesforce Example module adds a field-mapping plugin for putting a constant value into a
    Salesforce field. What is its plugin id and a use for it?
  criteria: 'The plugin id is hardcoded (''Hardcoded Value''). Use it in a mapping''s field_mappings (drupal_field_type:
    hardcoded) to map a constant value to a Salesforce field - e.g. tag every pushed record with a fixed
    LeadSource.'
  bundle: salesforce_example
  rubric_ref: rubric/salesforce_example_salesforce_example_hardcoded@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: salesforce_example-events
  input: Which Salesforce suite events does the Salesforce Example event subscriber demonstrate handling?
  criteria: SalesforceExampleSubscriber demonstrates handling events such as PUSH_PARAMS (alter params),
    PUSH_ALLOWED (veto a push), PUSH_SUCCESS/PUSH_FAIL, and PULL_QUERY/PULL_PREPULL/PULL_PRESAVE.
  bundle: salesforce_example
  rubric_ref: rubric/salesforce_example_salesforce_example_events@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: salesforce_example-known-object
  input: On this Drupal site, the Salesforce Example module's example mapping is present. Inspect its
    live configuration and state which Salesforce object it maps to.
  criteria: 'It maps to Contact: the salesforce_mapping salesforce_example_contact has salesforce_object_type
    = Contact.'
  bundle: salesforce_example
  rubric_ref: rubric/salesforce_example_salesforce_example_known_object@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/salesforce_example-ensure-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/salesforce_example-ensure-cleanup.sh
- id: salesforce_example-known-entity
  input: On this Drupal site, which Drupal entity does the Salesforce Example module's example mapping
    (salesforce_example_contact) map? Inspect the live configuration and answer.
  criteria: 'It maps the Drupal user entity: salesforce_mapping salesforce_example_contact has drupal_entity_type
    = user (bundle user), mapped to Salesforce Contact.'
  bundle: salesforce_example
  rubric_ref: rubric/salesforce_example_salesforce_example_known_entity@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/salesforce_example-ensure-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/salesforce_example-ensure-cleanup.sh
- id: salesforce_example-use-hardcoded
  input: On this Drupal site, create a Salesforce mapping named sfe_task (Drupal user to Salesforce Contact)
    that includes a field mapping using the Salesforce Example 'hardcoded' field plugin to set a constant
    value on a Salesforce field. Apply the change to the live site.
  criteria: A salesforce_mapping sfe_task exists whose field_mappings contains an entry with drupal_field_type
    = hardcoded (the Hardcoded Value plugin mapping a constant to a Salesforce field).
  bundle: salesforce_example
  rubric_ref: rubric/salesforce_example_salesforce_example_use_hardcoded@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/salesforce_example-hardcoded-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/salesforce_example-hardcoded-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/salesforce_example-hardcoded-verify.sh
- id: salesforce_example-hardcoded-leadsource
  input: On this Drupal site, create a Salesforce mapping named sfe_ttask that uses the 'hardcoded' field
    plugin to set a constant value into the Salesforce LeadSource field. Apply the change to the live
    site.
  criteria: A salesforce_mapping sfe_ttask exists whose field_mappings contains a hardcoded entry with
    salesforce_field = LeadSource.
  bundle: salesforce_example
  rubric_ref: rubric/salesforce_example_salesforce_example_hardcoded_leadsource@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/salesforce_example-hardcoded-target-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/salesforce_example-hardcoded-target-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/salesforce_example-hardcoded-target-verify.sh
