metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: salesforce_logger
  version: 5.1.x
  note: 'Salesforce Logger writes Salesforce suite events to Drupal''s logger at a configurable threshold.
    Its whole surface is the salesforce_logger.settings config object: log_level (salesforce.error | salesforce.warning
    | salesforce.notice), log_push_success (bool), log_push_params (bool), log_push_params_maxlength,
    log_push_params_sanitized_fields. No connection needed - all medium/hard cases are grounded in that
    local config, verified by pure reads. Cleanup restores shipped defaults (log_level salesforce.error,
    log_push_success false).'
questions:
- id: salesforce_logger-levels
  input: In the Salesforce Logger module, what config controls how much Salesforce logging happens, and
    what are the possible log levels?
  criteria: 'salesforce_logger.settings.log_level sets the minimum severity: salesforce.error (errors
    only), salesforce.warning (warnings and errors), or salesforce.notice (all Salesforce events).'
  bundle: salesforce_logger
  rubric_ref: rubric/salesforce_logger_salesforce_logger_levels@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: salesforce_logger-push-params
  input: The Salesforce Logger can log the data sent to Salesforce on push, which may be sensitive. Which
    settings control logging the push params, truncating them, and redacting fields?
  criteria: log_push_params logs the params sent on push; log_push_params_maxlength truncates them; log_push_params_sanitized_fields
    lists fields to redact; log_push_success additionally logs successful pushes.
  bundle: salesforce_logger
  rubric_ref: rubric/salesforce_logger_salesforce_logger_push_params@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: salesforce_logger-default
  input: By default, what does Salesforce Logger log - all events or just errors? And where does it send
    them?
  criteria: By default log_level is salesforce.error, so only errors are logged. Events are written to
    Drupal's logging system (watchdog/dblog).
  bundle: salesforce_logger
  rubric_ref: rubric/salesforce_logger_salesforce_logger_default@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: salesforce_logger-known-level
  input: On this Drupal site, at what level is Salesforce Logger configured to log? Inspect the live configuration
    and give the log_level value.
  criteria: 'The log level is salesforce.warning (log warnings and errors): salesforce_logger.settings
    log_level = salesforce.warning.'
  bundle: salesforce_logger
  rubric_ref: rubric/salesforce_logger_salesforce_logger_known_level@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/salesforce_logger-known-level-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/salesforce_logger-known-level-cleanup.sh
- id: salesforce_logger-known-success
  input: On this Drupal site, is Salesforce Logger configured to also log successful pushes to Salesforce
    (not just failures)? Inspect the live configuration and say yes or no.
  criteria: 'Yes: salesforce_logger.settings log_push_success is true, so successful pushes are logged
    as well.'
  bundle: salesforce_logger
  rubric_ref: rubric/salesforce_logger_salesforce_logger_known_success@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/salesforce_logger-known-success-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/salesforce_logger-known-success-cleanup.sh
- id: salesforce_logger-set-level
