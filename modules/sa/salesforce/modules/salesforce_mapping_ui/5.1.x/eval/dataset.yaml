metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: salesforce_mapping_ui
  version: 5.1.x
  note: 'Salesforce Mapping UI is the admin interface (routes, list builders, forms) for managing salesforce_mapping
    config entities and salesforce_mapped_object records. It has no config/plugins/Drush of its own; access
    is gated by the salesforce_mapping permissions (administer salesforce mapping, view salesforce mapping,
    administer salesforce mapped objects). Medium/hard cases are grounded in real, local, verifiable state:
    user.role config (which role can administer/view mappings) and the salesforce_mapping config entity
    the UI creates - verified by pure reads. Namespaced sfmu_* roles/mappings are removed on cleanup.'
questions:
- id: salesforce_mapping_ui-where
  input: Where in the Drupal admin do I manage Salesforce mappings with the Salesforce Mapping UI module,
    and which permission is required?
  criteria: The mappings list is at /admin/structure/salesforce/mappings (route entity.salesforce_mapping.list),
    with add/edit/fields/enable/disable/delete forms; it requires the 'administer salesforce mapping'
    permission. Mapped objects are at /admin/content/salesforce.
  bundle: salesforce_mapping_ui
  rubric_ref: rubric/salesforce_mapping_ui_salesforce_mapping_ui_where@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: salesforce_mapping_ui-fields-form
  input: How do I build the individual field mappings for a Salesforce mapping in the UI?
  criteria: 'Use the field-mapping form at /admin/structure/salesforce/mappings/manage/{mapping}/fields:
    each row selects a SalesforceMappingField plugin (properties, record_type, ...), a Drupal field/property,
    a Salesforce field, and a direction. This builds the mapping''s field_mappings.'
  bundle: salesforce_mapping_ui
  rubric_ref: rubric/salesforce_mapping_ui_salesforce_mapping_ui_fields_form@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: salesforce_mapping_ui-no-config
  input: Does the Salesforce Mapping UI module store its own configuration, or does it manage another
    module's entities?
  criteria: It has no config of its own - it is the UI layer that manages the salesforce_mapping config
    entities (and salesforce_mapped_object records) defined by the salesforce_mapping module.
  bundle: salesforce_mapping_ui
  rubric_ref: rubric/salesforce_mapping_ui_salesforce_mapping_ui_no_config@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: salesforce_mapping_ui-known-admin-role
  input: On this Drupal site, one role has been granted access to manage Salesforce mappings via the UI.
    Inspect the roles and name the role that can administer Salesforce mappings.
  criteria: 'The role is sfmu_known: user.role.sfmu_known includes the ''administer salesforce mapping''
    permission.'
  bundle: salesforce_mapping_ui
  rubric_ref: rubric/salesforce_mapping_ui_salesforce_mapping_ui_known_admin_role@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/salesforce_mapping_ui-known-admin-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/salesforce_mapping_ui-known-admin-cleanup.sh
- id: salesforce_mapping_ui-known-view-role
  input: On this Drupal site the role sfmu_view has a single Salesforce mapping related permission. Inspect
    its configuration and state which permission it has.
  criteria: 'It has ''view salesforce mapping'': user.role.sfmu_view grants the view-mappings permission
    (read-only access to mapping config).'
  bundle: salesforce_mapping_ui
  rubric_ref: rubric/salesforce_mapping_ui_salesforce_mapping_ui_known_view_role@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/salesforce_mapping_ui-known-view-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/salesforce_mapping_ui-known-view-cleanup.sh
- id: salesforce_mapping_ui-grant-admin
  input: On this Drupal site there is a role sfmu_task that cannot manage Salesforce mappings. Grant it
    permission to administer Salesforce mappings (so it can use the mapping UI). Apply the change to the
    live site.
  criteria: The role sfmu_task is granted 'administer salesforce mapping' (user.role.sfmu_task permissions
    include it).
  bundle: salesforce_mapping_ui
  rubric_ref: rubric/salesforce_mapping_ui_salesforce_mapping_ui_grant_admin@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/salesforce_mapping_ui-grant-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/salesforce_mapping_ui-grant-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/salesforce_mapping_ui-grant-verify.sh
- id: salesforce_mapping_ui-create-mapping
  input: On this Drupal site, set up a new Salesforce mapping named sfmu_map that connects Drupal users
    to Salesforce Contacts, the kind of thing you would create in the Salesforce mappings screen. Apply
    the change to the live site.
  criteria: A salesforce_mapping config entity sfmu_map exists (created via the mapping UI add form at
    /admin/structure/salesforce/mappings/add or the salesforce_mapping storage), mapping the Drupal user
    entity to the Salesforce Contact object.
  bundle: salesforce_mapping_ui
  rubric_ref: rubric/salesforce_mapping_ui_salesforce_mapping_ui_create_mapping@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-layman
    reset: agent-module-documentation/evaluation/verify/salesforce_mapping_ui-create-map-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/salesforce_mapping_ui-create-map-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/salesforce_mapping_ui-create-map-verify.sh
