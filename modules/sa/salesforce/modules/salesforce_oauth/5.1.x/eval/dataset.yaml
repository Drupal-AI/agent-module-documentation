metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: salesforce_oauth
  version: 5.1.x
  note: Salesforce OAuth user-agent Provider adds the 'oauth' @SalesforceAuthProvider plugin; an OAuth
    authorization is a salesforce_auth config entity (provider=oauth, provider_settings consumer_key/consumer_secret/login_url)
    completed via the browser callback route salesforce.oauth_callback. Creating/authorizing an OAuth
    entity requires the external org + a browser (it cannot be scripted offline - saving one triggers
    the callback route), so the LOCAL, verifiable surface these evals use is salesforce.settings.salesforce_auth_provider
    (the suite's DEFAULT authorization id, which an OAuth authorization populates). Medium/hard cases
    set/read/clear that value, verified by pure config reads; cleanup restores it to '' (the shipped baseline).
questions:
- id: salesforce_oauth-what
  input: What authentication method does the Salesforce OAuth user-agent Provider add, and how does it
    differ from the JWT provider?
  criteria: 'It adds the interactive OAuth user-agent flow (auth provider id ''oauth''): an admin authorizes
    Drupal against a Salesforce connected app in the browser, and the access/refresh token is stored.
    JWT, by contrast, is unattended server-to-server auth using a signing key.'
  bundle: salesforce_oauth
  rubric_ref: rubric/salesforce_oauth_salesforce_oauth_what@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: salesforce_oauth-settings
  input: When setting up an OAuth Salesforce authorization, what provider settings do you configure, and
    what route/callback completes the flow?
  criteria: An oauth salesforce_auth stores provider_settings consumer_key, consumer_secret and login_url.
    You create it at the salesforce.auth_config UI; completing it redirects to Salesforce and back to
    the salesforce.oauth_callback route, storing the token.
  bundle: salesforce_oauth
  rubric_ref: rubric/salesforce_oauth_salesforce_oauth_settings@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: salesforce_oauth-default-setting
  input: Once I have created a Salesforce authorization, which setting tells the Salesforce suite to use
    it as the default authorization for API calls?
  criteria: salesforce.settings.salesforce_auth_provider holds the id of the default salesforce_auth authorization
    used by the client.
  bundle: salesforce_oauth
  rubric_ref: rubric/salesforce_oauth_salesforce_oauth_default_setting@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: salesforce_oauth-known-default
  input: On this Drupal site, which Salesforce authorization is configured as the default provider? Inspect
    the live Salesforce settings and give the id.
  criteria: 'The default authorization is prod_oauth: salesforce.settings.salesforce_auth_provider = prod_oauth.'
  bundle: salesforce_oauth
  rubric_ref: rubric/salesforce_oauth_salesforce_oauth_known_default@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
