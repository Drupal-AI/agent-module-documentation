metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: salesforce_webform
  version: 5.1.x
  note: Salesforce Webform adds two SalesforceMappingField plugins - WebformElements and WebformEntityElements
    - that expose a webform's elements as mappable sources in a salesforce_mapping. You map a webform
    by creating a salesforce_mapping with drupal_entity_type=webform_submission (drupal_bundle = webform
    id) to a Salesforce object, and salesforce_push sends submissions. No config/permissions/Drush of
    its own. Since real pushing needs a Salesforce connection, medium/hard cases are grounded in the LOCAL
    salesforce_mapping config (a webform_submission mapping), created/read/modified with no connection
    and verified by pure reads. Namespaced sfw_* mappings removed on cleanup.
questions:
- id: salesforce_webform-plugins
  input: What does the Salesforce Webform module add to let webform submissions map to Salesforce, and
    what are the plugin names?
  criteria: It adds two SalesforceMappingField plugins - WebformElements ('Webform elements') and WebformEntityElements
    ('Webform Entity Elements') - that expose a webform's elements as the Drupal source of a field mapping,
    so submissions can push to Salesforce.
  bundle: salesforce_webform
  rubric_ref: rubric/salesforce_webform_salesforce_webform_plugins@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: salesforce_webform-how-map
  input: How do I set up pushing a webform's submissions to Salesforce - what Drupal entity type does
    the mapping use?
  criteria: Create a salesforce_mapping with drupal_entity_type = webform_submission (drupal_bundle =
    the webform id) mapped to a Salesforce object, map each webform element (WebformElements plugin) to
    a Salesforce field, enable the push_create trigger, and salesforce_push sends new submissions.
  bundle: salesforce_webform
  rubric_ref: rubric/salesforce_webform_salesforce_webform_how_map@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: salesforce_webform-deps
  input: What does the Salesforce Webform module depend on, and does it add its own configuration?
  criteria: It depends on salesforce_mapping and webform, and adds no config/permissions/Drush of its
    own - it only extends the salesforce_mapping field-plugin system with webform source plugins.
  bundle: salesforce_webform
  rubric_ref: rubric/salesforce_webform_salesforce_webform_deps@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: salesforce_webform-known-entity
  input: On this Drupal site there is a Salesforce mapping sfw_known that maps webform submissions. Inspect
    its live configuration and state which Drupal entity type it maps.
  criteria: 'It maps the webform_submission entity type: salesforce_mapping sfw_known has drupal_entity_type
    = webform_submission (mapping submissions to a Salesforce object).'
  bundle: salesforce_webform
  rubric_ref: rubric/salesforce_webform_salesforce_webform_known_entity@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/salesforce_webform-known-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/salesforce_webform-known-cleanup.sh
- id: salesforce_webform-known-object
  input: On this Drupal site the Salesforce mapping sfw_known pushes webform submissions to a Salesforce
    object. Inspect its live configuration and state which Salesforce object type it targets.
  criteria: 'It targets the Lead object: salesforce_mapping sfw_known has salesforce_object_type = Lead.'
  bundle: salesforce_webform
  rubric_ref: rubric/salesforce_webform_salesforce_webform_known_object@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/salesforce_webform-known-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/salesforce_webform-known-cleanup.sh
- id: salesforce_webform-create
  input: On this Drupal site, create a Salesforce mapping named sfw_task that maps Webform submissions
    (drupal_entity_type webform_submission) to the Salesforce Lead object, so form submissions can be
    pushed to Salesforce. Apply the change to the live site.
  criteria: A salesforce_mapping config entity sfw_task exists with drupal_entity_type = webform_submission
    and salesforce_object_type = Lead.
  bundle: salesforce_webform
  rubric_ref: rubric/salesforce_webform_salesforce_webform_create@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/salesforce_webform-create-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/salesforce_webform-create-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/salesforce_webform-create-verify.sh
- id: salesforce_webform-set-object
  input: On this Drupal site there is a webform-submission Salesforce mapping sfw_otask currently pushing
    to the Lead object. Change it to push to the Contact object instead. Apply the change to the live
    site.
  criteria: salesforce_mapping sfw_otask has salesforce_object_type = Contact (changed from Lead).
  bundle: salesforce_webform
  rubric_ref: rubric/salesforce_webform_salesforce_webform_set_object@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/salesforce_webform-set-object-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/salesforce_webform-set-object-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/salesforce_webform-set-object-verify.sh
