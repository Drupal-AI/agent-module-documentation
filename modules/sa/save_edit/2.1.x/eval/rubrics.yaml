rubrics:
- id: save_edit_save_edit_what_it_does
  version: '1.0'
  applicable_bundles:
  - save_edit
  checks:
  - kind: must_contain_any
    values:
    - edit-form
    - edit form
    - back to
    - Save & Edit
    - redirect
  scoring:
    combine: all_pass
- id: save_edit_save_edit_enable_content_type
  version: '1.0'
  applicable_bundles:
  - save_edit
  checks:
  - kind: must_contain_any
    values:
    - node_types
    - save_edit.settings
    - use save and edit
  scoring:
    combine: all_pass
- id: save_edit_save_edit_auto_unpublish
  version: '1.0'
  applicable_bundles:
  - save_edit
  checks:
  - kind: must_contain_any
    values:
    - unpublish_new_only
    - unpublish
  scoring:
    combine: all_pass
- id: save_edit_save_edit_current_label
  version: '1.0'
  applicable_bundles:
  - save_edit
  checks:
  - kind: must_contain_any
    values:
    - Apply Now
  scoring:
    combine: all_pass
- id: save_edit_save_edit_which_content_type
  version: '1.0'
  applicable_bundles:
  - save_edit
  checks:
  - kind: must_contain_any
    values:
    - saveedit_probe
  scoring:
    combine: all_pass
- id: save_edit_save_edit_enable_on_type
  version: '1.0'
  applicable_bundles:
  - save_edit
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
- id: save_edit_save_edit_relabel_and_hide
  version: '1.0'
  applicable_bundles:
  - save_edit
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
