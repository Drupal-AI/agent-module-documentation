rubrics:
- id: ultimenu_ultimenu_model
  version: '1.0'
  applicable_bundles:
  - ultimenu
  checks:
  - kind: must_contain_any
    values:
    - menu item
    - menu items
    - region
    - regions
  scoring:
    combine: all_pass
- id: ultimenu_ultimenu_configure_route
  version: '1.0'
  applicable_bundles:
  - ultimenu
  checks:
  - kind: must_contain_any
    values:
    - /admin/structure/ultimenu
    - ultimenu.settings
    - administer ultimenu
  scoring:
    combine: all_pass
- id: ultimenu_ultimenu_block_plugin_id
  version: '1.0'
  applicable_bundles:
  - ultimenu
  checks:
  - kind: must_contain_any
    values:
    - ultimenu_block
    - ultimenu_block:ultimenu-main
    - derivative
  scoring:
    combine: all_pass
- id: ultimenu_ultimenu_which_menu_enabled
  version: '1.0'
  applicable_bundles:
  - ultimenu
  checks:
  - kind: must_contain_any
    values:
    - footer
  scoring:
    combine: all_pass
- id: ultimenu_ultimenu_ajaxmw_value
  version: '1.0'
  applicable_bundles:
  - ultimenu
  checks:
  - kind: must_contain_any
    values:
    - 481px
    - '481'
  scoring:
    combine: all_pass
- id: ultimenu_ultimenu_enable_block
  version: '1.0'
  applicable_bundles:
  - ultimenu
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
- id: ultimenu_ultimenu_place_block
  version: '1.0'
  applicable_bundles:
  - ultimenu
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
