metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: ultimenu
  version: 3.0.x
  note: 'Ultimenu derives a mega-menu block from a menu and turns each enabled top-level menu item into
    a dynamic region. Its persistent state is (a) the ultimenu.settings config object (keys blocks, regions,
    goodies, skins, fallback_text, ajaxmw, icon_class, offcanvases) and (b) block config entities using
    the derivative plugin ultimenu_block:ultimenu-<menu>. A menu only becomes a placeable block after
    it is listed non-empty in ultimenu.settings:blocks (checkbox stores <menu>: <menu>). There is no config/install
    default, so ultimenu.settings does not exist until first saved. Configure route ultimenu.settings
    (/admin/structure/ultimenu), permission ''administer ultimenu''. Depends on Blazy 3.x and core block+menu.
    Medium reads back which menu is configured as an Ultimenu block; hard cases enable a menu as an Ultimenu
    block and place a real Ultimenu block instance, both verified against live config/state.'
questions:
- id: ultimenu-model
  input: 'Explain the core idea of the Drupal Ultimenu module: what becomes a block and what becomes a
    region, and where do those regions come from?'
  criteria: An Ultimenu block is derived from a menu; each enabled top-level menu item of that menu becomes
    a dynamic region you can place ordinary blocks into (a block that contains regions containing blocks).
    The regions are contributed at runtime via hook_system_info_alter(), so you do not edit the theme
    .info.yml.
  bundle: ultimenu
  rubric_ref: rubric/ultimenu_ultimenu_model@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: ultimenu-configure-route
  input: On a Drupal site with Ultimenu enabled, what is the admin path and configuration route of the
    Ultimenu settings form, and which permission gates it?
  criteria: 'The settings form is at /admin/structure/ultimenu, route ultimenu.settings, gated by the
    ''administer ultimenu'' permission. It edits the ultimenu.settings config object (keys: blocks, regions,
    goodies, skins, fallback_text, ajaxmw, icon_class, offcanvases).'
  bundle: ultimenu
  rubric_ref: rubric/ultimenu_ultimenu_configure_route@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: ultimenu-block-plugin-id
  input: In Ultimenu, what is the machine id of the block plugin it provides, and how is a per-menu block
    instance identified? Give the derivative id form for the Main navigation menu.
  criteria: The block plugin id is ultimenu_block; a deriver yields one derivative per menu enabled under
    ultimenu.settings:blocks, with id ultimenu_block:ultimenu-<menu> — for Main navigation that is ultimenu_block:ultimenu-main.
  bundle: ultimenu
  rubric_ref: rubric/ultimenu_ultimenu_block_plugin_id@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: ultimenu-which-menu-enabled
  input: This Drupal site has Ultimenu installed and one menu has been enabled as an Ultimenu mega-menu
    block. Inspect the live ultimenu.settings configuration and name which menu (machine name) is configured
    as an Ultimenu block.
  criteria: 'The ''footer'' menu is enabled: ultimenu.settings has blocks.footer = ''footer'', so the
    derivative block ultimenu_block:ultimenu-footer is available.'
  bundle: ultimenu
  rubric_ref: rubric/ultimenu_ultimenu_which_menu_enabled@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/ultimenu-enabled-block-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/ultimenu-enabled-block-cleanup.sh
- id: ultimenu-ajaxmw-value
  input: This Ultimenu site has an AJAX mobile max-width configured (below which flyout panels auto-load
    instead of opening on click). Inspect the live ultimenu.settings configuration and give the configured
    value.
  criteria: ultimenu.settings has ajaxmw = '481px' (the AJAX mobile max-width).
  bundle: ultimenu
  rubric_ref: rubric/ultimenu_ultimenu_ajaxmw_value@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/ultimenu-ajaxmw-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/ultimenu-ajaxmw-cleanup.sh
- id: ultimenu-enable-block
  input: On this Drupal site with Ultimenu installed, enable the 'content' menu as an Ultimenu mega-menu
    block so that its derivative block becomes placeable. Apply the change to the live site's ultimenu.settings
    configuration.
  criteria: Set ultimenu.settings blocks.content = 'content' (e.g. tick 'content' under Ultimenu blocks
    and Save, or edit config in code) and clear block plugin definitions. Verify checks blocks.content
    is non-empty and the plugin ultimenu_block:ultimenu-content exists.
  bundle: ultimenu
  rubric_ref: rubric/ultimenu_ultimenu_enable_block@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/ultimenu-enable-block-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/ultimenu-enable-block-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/ultimenu-enable-block-verify.sh
- id: ultimenu-place-block
  input: On this Drupal site the 'main' menu is already enabled as an Ultimenu block. Place an instance
    of the Main navigation Ultimenu block into a normal region of the default theme (olivero) and apply
    it to the live site.
  criteria: Create a block config entity with plugin ultimenu_block:ultimenu-main placed in an ordinary
    (non-Ultimenu) region such as header. Verify passes when such a block instance exists and its region
    does not start with 'ultimenu'.
  bundle: ultimenu
  rubric_ref: rubric/ultimenu_ultimenu_place_block@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/ultimenu-place-block-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/ultimenu-place-block-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/ultimenu-place-block-verify.sh
