metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: eca_webform
  version: 2.0.x
  note: 'ECA Webform provides (1) one derived ECA event plugin, base id ''webform'', with 25 derivatives
    ''webform:<hook>'' (e.g. webform:submission_form_alter, webform:submission_access, webform:element_alter,
    webform:options_alter, webform:access_rules) mirroring Webform''s alter/access hooks and exposing
    args as [webform:*] tokens; and (2) four core #[Action] plugins: eca_webform_submission_get_data and
    eca_webform_submission_set_data (type webform_submission; keys field_name + token_name/field_value)
    and eca_webform_get_third_party_setting / eca_webform_set_third_party_setting (type webform; keys
    provider, setting_name, token_name/setting_value). No configure route, permissions, or Drush. Usage
    is entirely within ECA models (eca.eca.<id> config entities), so medium cases read back a seeded model''s
    action plugin/config, and hard cases build an ECA model referencing an eca_webform action or event
    (verified on the live eca config entity). An ECA model with empty events still saves and preserves
    its actions, which the get-data verify relies on.'
questions:
- id: eca_webform-event-id
  input: Using the eca_webform module, I want to start an ECA model when a webform submission form is
    being built (the submission_form_alter hook). What is the ECA event plugin id I select, and what is
    the base plugin id that all eca_webform events derive from?
  criteria: The event plugin id is webform:submission_form_alter. All eca_webform events derive from the
    single base plugin id 'webform' (derivative id = 'webform:' + hook key), one derivative per Webform
    hook.
  bundle: eca_webform
  rubric_ref: rubric/eca_webform_eca_webform_event_id@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: eca_webform-getdata-action
  input: In an ECA model reacting to a webform submission, which eca_webform action reads a submitted
    element value into an ECA token, and which two configuration keys does it take (one for the element,
    one for the destination token)?
  criteria: The action is eca_webform_submission_get_data (type webform_submission). It takes field_name
    (the element machine name to read via getElementData()) and token_name (the ECA token the value is
    written into). Both are token-aware.
  bundle: eca_webform
  rubric_ref: rubric/eca_webform_eca_webform_getdata_action@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: eca_webform-third-party-actions
  input: eca_webform also ships actions to read and write a webform's third-party settings. Name the two
    action plugin ids and the object type they operate on, and list their configuration keys.
  criteria: eca_webform_get_third_party_setting and eca_webform_set_third_party_setting, both of type
    'webform'. Common keys provider and setting_name; get- adds token_name (destination token), set- adds
    setting_value (the value to store).
  bundle: eca_webform
  rubric_ref: rubric/eca_webform_eca_webform_third_party_actions@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: eca_webform-known-action
  input: This site has an ECA model with machine name ecawf_known that contains a single eca_webform action.
    Inspect the live ECA configuration and state the action's plugin id.
  criteria: The ecawf_known model's action uses plugin eca_webform_submission_set_data (readable from
    the eca.eca.ecawf_known config entity actions, e.g. $eca->get('actions')['act_set']['plugin']).
  bundle: eca_webform
  rubric_ref: rubric/eca_webform_eca_webform_known_action@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/eca_webform-known-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/eca_webform-known-cleanup.sh
- id: eca_webform-field-token
  input: An ECA model named ecawf_field on this site uses an eca_webform 'Get submission data' action.
    Inspect the live configuration and state the token name (token_name) that the action writes the read
    value into.
  criteria: The get-data action in ecawf_field has token_name = submitted_email (in the action's configuration
    inside eca.eca.ecawf_field; it reads element field_name=email).
  bundle: eca_webform
  rubric_ref: rubric/eca_webform_eca_webform_field_token@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/eca_webform-field-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/eca_webform-field-cleanup.sh
- id: eca_webform-build-getdata
  input: On this Drupal site, create an ECA model with machine name ecawf_task that includes an eca_webform
    'Get submission data' action (plugin eca_webform_submission_get_data), configured with a field_name
    (an element machine name) and a token_name for the result. Save the model to the live site.
  criteria: An eca.eca.ecawf_task config entity exists whose actions include one with plugin=eca_webform_submission_get_data
    (with field_name and token_name in its configuration). Create it via the eca storage, e.g. \Drupal::entityTypeManager()->getStorage('eca')->create([...])->save().
  bundle: eca_webform
  rubric_ref: rubric/eca_webform_eca_webform_build_getdata@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/eca_webform-build-getdata-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/eca_webform-build-getdata-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/eca_webform-build-getdata-verify.sh
- id: eca_webform-build-event
  input: Create an ECA model with machine name ecawf_task2 that is triggered by the eca_webform submission-form-alter
    event (event plugin webform:submission_form_alter), and save it to the live site.
  criteria: An eca.eca.ecawf_task2 config entity whose events include one with plugin=webform:submission_form_alter
    (the base plugin is 'webform', derivative 'submission_form_alter').
  bundle: eca_webform
  rubric_ref: rubric/eca_webform_eca_webform_build_event@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/eca_webform-build-event-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/eca_webform-build-event-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/eca_webform-build-event-verify.sh
