rubrics:
- id: eca_webform_eca_webform_event_id
  version: '1.0'
  applicable_bundles:
  - eca_webform
  checks:
  - kind: must_contain_any
    values:
    - webform:submission_form_alter
    - 'webform:'
  scoring:
    combine: all_pass
- id: eca_webform_eca_webform_getdata_action
  version: '1.0'
  applicable_bundles:
  - eca_webform
  checks:
  - kind: must_contain_any
    values:
    - eca_webform_submission_get_data
    - field_name
    - token_name
  scoring:
    combine: all_pass
- id: eca_webform_eca_webform_third_party_actions
  version: '1.0'
  applicable_bundles:
  - eca_webform
  checks:
  - kind: must_contain_any
    values:
    - eca_webform_get_third_party_setting
    - eca_webform_set_third_party_setting
  scoring:
    combine: all_pass
- id: eca_webform_eca_webform_known_action
  version: '1.0'
  applicable_bundles:
  - eca_webform
  checks:
  - kind: must_contain_any
    values:
    - eca_webform_submission_set_data
  scoring:
    combine: all_pass
- id: eca_webform_eca_webform_field_token
  version: '1.0'
  applicable_bundles:
  - eca_webform
  checks:
  - kind: must_contain_any
    values:
    - submitted_email
  scoring:
    combine: all_pass
- id: eca_webform_eca_webform_build_getdata
  version: '1.0'
  applicable_bundles:
  - eca_webform
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
- id: eca_webform_eca_webform_build_event
  version: '1.0'
  applicable_bundles:
  - eca_webform
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
