metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: mailchimp_transactional_template
  version: 1.2.x
  note: 'Submodule of mailchimp_transactional. Defines the config entity type mailchimp_transactional_template
    (class Entity\TemplateMap), config prefix mailchimp_transactional_template.mailchimp_transactional_template.<id>,
    exported fields id,label,template_name,content_area,only_use_merge_vars,mailsystem_key. Admin route
    mailchimp_transactional_template.admin at admin/config/services/mailchimp_transactional/templates;
    permission ''administer mailchimp transactional templates''. A ServiceProvider overrides mailchimp_transactional.service
    with TemplateService, which matches a Template Map (exact <module>_<key>, then <module>, then default-system)
    and sends via the API sendTemplate(), else falls back to the base send. Templates live in the external
    Mailchimp account, so all medium/hard cases are grounded ONLY in the local Template Map config entities:
    setup/reset write known maps, verify/introspection read them back.'
questions:
- id: mailchimp_transactional_template-what
  input: What does the mailchimp_transactional_template submodule let me do, and what config entity does
    it use to connect Drupal mail to a Mailchimp template?
  criteria: It lets you wrap Drupal's outgoing email in a Mailchimp Transactional template by creating
    Template Map config entities (mailchimp_transactional_template) that link a module/mail-key (or default-system)
    to a template_name and the editable content_area where the Drupal email body is injected.
  bundle: mailchimp_transactional_template
  rubric_ref: rubric/mailchimp_transactional_template_mailchimp_transactional_template_what@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: mailchimp_transactional_template-fields
  input: Which fields does a Mailchimp Transactional Template Map store, and how does the module decide
    which map applies to a given email?
  criteria: A Template Map stores id, label, template_name, content_area, only_use_merge_vars, and mailsystem_key.
    At send time it matches the mailsystem_key against the exact <module>_<key>, then the bare <module>,
    then a 'default-system' map (mailchimp_transactional_template_load_by_mailsystem), and sends via the
    API sendTemplate() if a map is found.
  bundle: mailchimp_transactional_template
  rubric_ref: rubric/mailchimp_transactional_template_mailchimp_transactional_template_fields@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: mailchimp_transactional_template-override
  input: How does the mailchimp_transactional_template module actually change how emails are sent, and
    what happens if no template map matches a message?
  criteria: Its ServiceProvider overrides the base mailchimp_transactional.service with TemplateService.
    On send, TemplateService looks up a matching Template Map and, if found, calls the API sendTemplate()
    injecting the body into content_area; if no map matches it delegates back to the base Service::send()
    (a plain, non-templated send).
  bundle: mailchimp_transactional_template
  rubric_ref: rubric/mailchimp_transactional_template_mailchimp_transactional_template_override@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: mailchimp_transactional_template-inspect-map
  input: This site has a Mailchimp Transactional Template Map configured as the site-wide default. Inspect
    the live configuration and tell me which Mailchimp template name it uses and which content area the
    email body is placed into.
  criteria: The mtt_default Template Map (mailsystem_key default-system) uses template_name 'welcome-brand'
    and injects the body into content_area 'main_content'.
  bundle: mailchimp_transactional_template
  rubric_ref: rubric/mailchimp_transactional_template_mailchimp_transactional_template_inspect_map@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/mailchimp_transactional_template-known-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/mailchimp_transactional_template-known-cleanup.sh
- id: mailchimp_transactional_template-inspect-scope
  input: 'For the Mailchimp Transactional Template Map on this site, inspect the live configuration: does
    it apply to one specific module/mail-key, or to the whole site by default?'
  criteria: 'It applies site-wide by default: the mtt_default Template Map has mailsystem_key = ''default-system'',
    so it is used for any mail sent through Mailchimp Transactional that has no more specific map.'
  bundle: mailchimp_transactional_template
  rubric_ref: rubric/mailchimp_transactional_template_mailchimp_transactional_template_inspect_scope@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/mailchimp_transactional_template-known-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/mailchimp_transactional_template-known-cleanup.sh
- id: mailchimp_transactional_template-create-map
  input: Using the mailchimp_transactional_template module, configure this site so that all Mailchimp
    Transactional email uses the Mailchimp template named 'newsletter' by default. Create a site-wide
    (default-system) Template Map pointing at the 'newsletter' template and apply it to the live site.
  criteria: A mailchimp_transactional_template config entity exists with mailsystem_key = 'default-system'
    and template_name = 'newsletter' (created via the storage/entity API or the admin form at admin/config/services/mailchimp_transactional/templates).
  bundle: mailchimp_transactional_template
  rubric_ref: rubric/mailchimp_transactional_template_mailchimp_transactional_template_create_map@1.0
  tags:
  - mode:execution
  - difficulty:hard
