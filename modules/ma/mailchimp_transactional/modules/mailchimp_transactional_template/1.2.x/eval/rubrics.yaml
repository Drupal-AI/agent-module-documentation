rubrics:
- id: mailchimp_transactional_template_mailchimp_transactional_template_what
  version: '1.0'
  applicable_bundles:
  - mailchimp_transactional_template
  checks:
  - kind: must_contain_any
    values:
    - Template Map
    - mailchimp_transactional_template
    - content area
    - content_area
    - template
    - editable
  scoring:
    combine: all_pass
- id: mailchimp_transactional_template_mailchimp_transactional_template_fields
  version: '1.0'
  applicable_bundles:
  - mailchimp_transactional_template
  checks:
  - kind: must_contain_any
    values:
    - mailsystem_key
    - template_name
    - content_area
    - default-system
    - only_use_merge_vars
  scoring:
    combine: all_pass
- id: mailchimp_transactional_template_mailchimp_transactional_template_override
  version: '1.0'
  applicable_bundles:
  - mailchimp_transactional_template
  checks:
  - kind: must_contain_any
    values:
    - ServiceProvider
    - TemplateService
    - sendTemplate
    - override
    - fall back
    - falls back
    - base
  scoring:
    combine: all_pass
- id: mailchimp_transactional_template_mailchimp_transactional_template_inspect_map
  version: '1.0'
  applicable_bundles:
  - mailchimp_transactional_template
  checks:
  - kind: must_contain_any
    values:
    - welcome-brand
    - main_content
  scoring:
    combine: all_pass
- id: mailchimp_transactional_template_mailchimp_transactional_template_inspect_scope
  version: '1.0'
  applicable_bundles:
  - mailchimp_transactional_template
  checks:
  - kind: must_contain_any
    values:
    - default-system
    - default
    - site-wide
    - whole site
  scoring:
    combine: all_pass
- id: mailchimp_transactional_template_mailchimp_transactional_template_create_map
  version: '1.0'
  applicable_bundles:
  - mailchimp_transactional_template
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
- id: mailchimp_transactional_template_mailchimp_transactional_template_set_content_area
  version: '1.0'
  applicable_bundles:
  - mailchimp_transactional_template
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
