metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: mailchimp_transactional_activity
  version: 1.2.x
  note: 'Submodule of mailchimp_transactional. Defines the config entity type mailchimp_transactional_activity
    (class Entity\Activity), config prefix mailchimp_transactional_activity.mailchimp_transactional_activity.<id>,
    exported fields id,label,entity_type,bundle,entity_path,email_property,enabled. Admin list route mailchimp_transactional_activity.admin
    at admin/config/services/mailchimp_transactional/activity. Permissions: administer mailchimp transactional
    activity, view mailchimp transactional activity. For each ENABLED mapping, Routing\ActivityRoutes::routes()
    adds a dynamic route entity.<entity_type>.activity at <entity_type>/{entity}/activity (permission
    view mailchimp transactional activity); ActivityController::overview() fetches history from the external
    Mailchimp API. The API is external, so all medium/hard cases are grounded ONLY in the local config
    entities: setup/reset write known Activity mappings, verify/introspection read them back.'
questions:
- id: mailchimp_transactional_activity-what
  input: What does the mailchimp_transactional_activity submodule add to a Drupal site, and what has to
    hold the email address it looks up?
  criteria: It adds a per-entity 'Mailchimp Transactional Activity' tab that shows an entity's email delivery
    history from the Mailchimp Transactional API. You create mailchimp_transactional_activity config entities
    mapping an entity type + bundle to the property that holds the email address (email_property, e.g.
    user/mail); each enabled mapping registers a route on that entity type.
  bundle: mailchimp_transactional_activity
  rubric_ref: rubric/mailchimp_transactional_activity_mailchimp_transactional_activity_what@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: mailchimp_transactional_activity-permissions
  input: Which permissions does mailchimp_transactional_activity define and what does each control?
  criteria: '''administer mailchimp transactional activity'' (restricted) controls adding/editing/deleting
    the Activity mappings at admin/config/services/mailchimp_transactional/activity; ''view mailchimp
    transactional activity'' controls who can see the per-entity activity tab (in addition to being able
    to view the entity).'
  bundle: mailchimp_transactional_activity
  rubric_ref: rubric/mailchimp_transactional_activity_mailchimp_transactional_activity_permissions@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: mailchimp_transactional_activity-routing
  input: How does mailchimp_transactional_activity make an activity tab appear on, say, user pages? Where
    do the routes come from?
  criteria: For each enabled Activity config entity, Routing\ActivityRoutes::routes() (a route_callbacks
    entry) dynamically defines a route entity.<entity_type>.activity at <entity_type>/{entity}/activity,
    requiring 'view mailchimp transactional activity'. ActivityController::overview() renders the email
    history. Rebuild routes after adding/enabling a mapping.
  bundle: mailchimp_transactional_activity
  rubric_ref: rubric/mailchimp_transactional_activity_mailchimp_transactional_activity_routing@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: mailchimp_transactional_activity-inspect-mapping
  input: This site has a Mailchimp Transactional Activity mapping configured. Inspect the live configuration
    and tell me which entity type it targets and which property it reads the email address from.
  criteria: 'The mta_user mapping targets the user entity type and reads the email from the ''mail'' property:
    config mailchimp_transactional_activity.mailchimp_transactional_activity.mta_user has entity_type=user,
    bundle=user, email_property=mail, enabled=true.'
  bundle: mailchimp_transactional_activity
  rubric_ref: rubric/mailchimp_transactional_activity_mailchimp_transactional_activity_inspect_mapping@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/mailchimp_transactional_activity-known-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/mailchimp_transactional_activity-known-cleanup.sh
- id: mailchimp_transactional_activity-inspect-disabled
  input: This site has two Mailchimp Transactional Activity mappings. Inspect the live configuration and
    tell me which one is disabled (its activity tab is not active).
  criteria: 'The mta_off mapping (node/article, email_property field_email) is disabled: its ''enabled''
    flag is false, whereas mta_user (user/mail) is enabled.'
  bundle: mailchimp_transactional_activity
  rubric_ref: rubric/mailchimp_transactional_activity_mailchimp_transactional_activity_inspect_disabled@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/mailchimp_transactional_activity-known-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/mailchimp_transactional_activity-known-cleanup.sh
- id: mailchimp_transactional_activity-create-mapping
  input: Using the mailchimp_transactional_activity module, configure this site so that user pages get
    a Mailchimp Transactional Activity tab driven by the account's email address. Create an enabled Activity
    mapping for the User entity that reads the email from the user's 'mail' property, and apply it to
    the live site.
  criteria: A mailchimp_transactional_activity config entity exists with entity_type=user, email_property=mail,
    enabled=true (created via the storage/entity API or the admin form at admin/config/services/mailchimp_transactional/activity).
  bundle: mailchimp_transactional_activity
  rubric_ref: rubric/mailchimp_transactional_activity_mailchimp_transactional_activity_create_mapping@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/mailchimp_transactional_activity-create-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/mailchimp_transactional_activity-create-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/mailchimp_transactional_activity-create-verify.sh
- id: mailchimp_transactional_activity-enable-mapping
  input: There is an existing Mailchimp Transactional Activity configuration named 'mta_toggle' but the
    activity tab is currently switched off. Turn it on so the tab becomes active, and apply the change
    to the live site.
  criteria: The mailchimp_transactional_activity.mailchimp_transactional_activity.mta_toggle config entity
    has enabled = true.
  bundle: mailchimp_transactional_activity
  rubric_ref: rubric/mailchimp_transactional_activity_mailchimp_transactional_activity_enable_mapping@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: site-owner
    reset: agent-module-documentation/evaluation/verify/mailchimp_transactional_activity-enable-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/mailchimp_transactional_activity-enable-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/mailchimp_transactional_activity-enable-verify.sh
