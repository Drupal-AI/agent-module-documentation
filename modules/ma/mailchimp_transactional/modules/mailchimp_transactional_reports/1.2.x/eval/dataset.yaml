metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: mailchimp_transactional_reports
  version: 1.2.x
  note: 'Submodule of mailchimp_transactional. Two admin report pages sourced from the external Mailchimp
    Transactional API: dashboard (admin/reports/mailchimp_transactional, ReportsController::dashboard,
    getTagsAllTimeSeries volume chart) and account summary (admin/reports/mailchimp_transactional/summary,
    getUser). Service mailchimp_transactional_reports.service (ReportsService) caches via cache.mailchimp_transactional.
    No config entity or settings. The DEFINED permission is ''view mailchimp transactional reports'' (with
    spaces); NOTE the route _permission requirement is misspelled ''view mailchimp_transactional reports''
    (underscore), so by default only user 1 reaches the pages. Because report DATA is external API, all
    medium/hard cases are grounded ONLY in local role/permission config: setup/reset write known role
    grants of the defined permission, verify/introspection read them back.'
questions:
- id: mailchimp_transactional_reports-pages
  input: What does the mailchimp_transactional_reports submodule add, and at what admin path is its dashboard?
  criteria: 'It adds admin report pages under Reports: a dashboard at admin/reports/mailchimp_transactional
    charting sent/bounced/rejected volume (from the API getTagsAllTimeSeries), and an account summary
    at admin/reports/mailchimp_transactional/summary (from getUser). Data comes from the Mailchimp Transactional
    API.'
  bundle: mailchimp_transactional_reports
  rubric_ref: rubric/mailchimp_transactional_reports_mailchimp_transactional_reports_pages@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: mailchimp_transactional_reports-permission
  input: Which permission does mailchimp_transactional_reports define to gate its report pages, and is
    there anything unusual about how the routes reference it?
  criteria: The defined permission is 'view mailchimp transactional reports' (restricted). Note the routes'
    _permission requirement is written 'view mailchimp_transactional reports' (with an underscore), which
    does not match the defined permission, so by default only user 1 can reach the pages until reconciled.
  bundle: mailchimp_transactional_reports
  rubric_ref: rubric/mailchimp_transactional_reports_mailchimp_transactional_reports_permission@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: mailchimp_transactional_reports-data-source
  input: Where does the data on the mailchimp_transactional_reports dashboard come from, and how is it
    kept from hammering the source?
  criteria: All report data is fetched from the external Mailchimp Transactional API via mailchimp_transactional_reports.service
    (ReportsService), which wraps the base module's API client; results are cached in the cache.mailchimp_transactional
    bin to avoid repeated API calls.
  bundle: mailchimp_transactional_reports
  rubric_ref: rubric/mailchimp_transactional_reports_mailchimp_transactional_reports_data_source@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: mailchimp_transactional_reports-inspect-role
  input: On this site, one role has been granted access to the Mailchimp Transactional reports and another
    has not. Inspect the live role/permission configuration and tell me which role can view the Mailchimp
    Transactional reports.
  criteria: Role mtr_a has the 'view mailchimp transactional reports' permission (mtr_b does not), so
    mtr_a can view the reports.
  bundle: mailchimp_transactional_reports
  rubric_ref: rubric/mailchimp_transactional_reports_mailchimp_transactional_reports_inspect_role@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/mailchimp_transactional_reports-roles-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/mailchimp_transactional_reports-roles-cleanup.sh
- id: mailchimp_transactional_reports-inspect-perm-name
  input: Inspect the permissions granted to the role 'mtr_a' on this site and give the exact machine name
    of the Mailchimp Transactional reports permission it holds.
  criteria: Role mtr_a holds the permission 'view mailchimp transactional reports' (the machine name defined
    by mailchimp_transactional_reports).
  bundle: mailchimp_transactional_reports
  rubric_ref: rubric/mailchimp_transactional_reports_mailchimp_transactional_reports_inspect_perm_name@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/mailchimp_transactional_reports-roles-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/mailchimp_transactional_reports-roles-cleanup.sh
- id: mailchimp_transactional_reports-grant-role
  input: There is a role 'mtr_task' on this site that should be able to see the Mailchimp Transactional
    reporting pages. Grant that role the permission that the mailchimp_transactional_reports module defines
    for viewing reports, and apply it to the live site.
  criteria: Role mtr_task is granted 'view mailchimp transactional reports' (e.g. drush role:perm:add
    mtr_task 'view mailchimp transactional reports').
  bundle: mailchimp_transactional_reports
  rubric_ref: rubric/mailchimp_transactional_reports_mailchimp_transactional_reports_grant_role@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/mailchimp_transactional_reports-grant-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/mailchimp_transactional_reports-grant-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/mailchimp_transactional_reports-grant-verify.sh
- id: mailchimp_transactional_reports-new-role
  input: I want a new user role called 'mtr_new' whose only special power is being able to view the Mailchimp
    Transactional email reports. Create that role and give it the right permission, on the live site.
  criteria: A role with id 'mtr_new' exists and has the 'view mailchimp transactional reports' permission
    granted.
  bundle: mailchimp_transactional_reports
  rubric_ref: rubric/mailchimp_transactional_reports_mailchimp_transactional_reports_new_role@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: site-owner
    reset: agent-module-documentation/evaluation/verify/mailchimp_transactional_reports-newrole-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/mailchimp_transactional_reports-newrole-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/mailchimp_transactional_reports-newrole-verify.sh
