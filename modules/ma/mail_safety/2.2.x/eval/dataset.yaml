metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: mail_safety
  version: 2.2.x
  note: 'Mail Safety intercepts outgoing mail via hook_mail_alter(). All persistent state is the config
    object mail_safety.settings (keys: enabled, send_mail_to_dashboard, send_mail_to_default_mail, default_mail_address,
    log_retention_period) plus rows in the mail_safety_dashboard DB table. No entities, no plugins, no
    Drush. Medium cases write a known value into mail_safety.settings and read it back; hard cases set
    the config so the site stops/captures/reroutes mail and verify the live config object. Baseline (shipped
    defaults): all booleans false, default_mail_address='''', log_retention_period=''''.'
questions:
- id: mail_safety-stop-outgoing
  input: On a Drupal 11 site with the Mail Safety module enabled, which configuration object and boolean
    key do I set to stop every outgoing email from actually being delivered?
  criteria: 'Set mail_safety.settings:enabled to TRUE. Mail Safety''s hook_mail_alter() then sets $message[''send'']
    = FALSE on every mail, so nothing is delivered normally (route/UI: /admin/config/development/mail_safety/settings).'
  bundle: mail_safety
  rubric_ref: rubric/mail_safety_mail_safety_stop_outgoing@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: mail_safety-where-stored
  input: When Mail Safety captures outgoing emails to its dashboard, which database table stores the caught
    messages?
  criteria: Caught mails are stored (PHP-serialized) as rows in the mail_safety_dashboard table (columns
    mail_id, sent, mail), written by MailSafetyController::insert() when send_mail_to_dashboard is on.
  bundle: mail_safety
  rubric_ref: rubric/mail_safety_mail_safety_where_stored@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: mail_safety-reroute-keys
  input: I want Mail Safety to send every outgoing email to one single test inbox instead of the real
    recipients. Which two mail_safety.settings keys control that?
  criteria: Turn on send_mail_to_default_mail and set default_mail_address to the single inbox. Mail Safety
    rewrites $message['to'] to that address (and unsets Cc/Bcc), then lets that copy send.
  bundle: mail_safety
  rubric_ref: rubric/mail_safety_mail_safety_reroute_keys@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: mail_safety-known-address
  input: This Drupal site has Mail Safety configured to reroute all outgoing mail to a single address.
    Inspect the live configuration and report that address.
  criteria: 'The address is mailsafety_probe@qa.example: mail_safety.settings has send_mail_to_default_mail=true
    and default_mail_address=''mailsafety_probe@qa.example'' (drush cget mail_safety.settings default_mail_address).'
  bundle: mail_safety
  rubric_ref: rubric/mail_safety_mail_safety_known_address@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/mail_safety-default-address-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/mail_safety-default-address-cleanup.sh
- id: mail_safety-known-retention
  input: Mail Safety on this site is configured to automatically purge old dashboard entries on cron.
    Inspect the live configuration and report the log retention period, in seconds.
  criteria: log_retention_period is 604800 seconds (1 week) in mail_safety.settings; mail_safety_cron()
    deletes dashboard rows whose 'sent' timestamp is older than REQUEST_TIME - 604800.
  bundle: mail_safety
  rubric_ref: rubric/mail_safety_mail_safety_known_retention@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/mail_safety-retention-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/mail_safety-retention-cleanup.sh
- id: mail_safety-stop-and-capture
  input: On this Drupal site, configure the Mail Safety module so that it stops all outgoing emails from
    being delivered and instead captures every one of them to the Mail Safety dashboard. Apply the change
    to the live site.
  criteria: Set mail_safety.settings:enabled=TRUE and mail_safety.settings:send_mail_to_dashboard=TRUE
    (e.g. drush cset, or tick 'Stop outgoing mails' + 'Send mail to dashboard' on the settings form).
    Caught mail then lands in the mail_safety_dashboard table instead of being sent.
  bundle: mail_safety
  rubric_ref: rubric/mail_safety_mail_safety_stop_and_capture@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/mail_safety-stop-and-capture-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/mail_safety-stop-and-capture-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/mail_safety-stop-and-capture-verify.sh
- id: mail_safety-reroute
  input: Our staging site keeps emailing real customers. Using the Mail Safety module, make it so every
    outgoing email on this site goes to the single address safety-inbox@example.test instead of the real
    recipients. Apply the change to the live site.
  criteria: In mail_safety.settings set send_mail_to_default_mail=TRUE and default_mail_address='safety-inbox@example.test'
    (enabling 'enabled' too so delivery is intercepted). Mail Safety rewrites every message's recipient
    to that address.
  bundle: mail_safety
  rubric_ref: rubric/mail_safety_mail_safety_reroute@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: site-owner
    reset: agent-module-documentation/evaluation/verify/mail_safety-reroute-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/mail_safety-reroute-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/mail_safety-reroute-verify.sh
