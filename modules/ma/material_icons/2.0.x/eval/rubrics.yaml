rubrics:
- id: material_icons_material_icons_field_render
  version: '1.0'
  applicable_bundles:
  - material_icons
  checks:
  - kind: must_contain_any
    values:
    - material_icons
    - <i
    - material_icon
    - icon
    - family
    - classes
  scoring:
    combine: all_pass
- id: material_icons_material_icons_ckeditor
  version: '1.0'
  applicable_bundles:
  - material_icons
  checks:
  - kind: must_contain_any
    values:
    - toolbar
    - text format
    - Material Icons
    - CKEditor
  scoring:
    combine: all_pass
- id: material_icons_material_icons_families_config
  version: '1.0'
  applicable_bundles:
  - material_icons
  checks:
  - kind: must_contain_any
    values:
    - material_icons.settings
    - families
    - baseline
  scoring:
    combine: all_pass
- id: material_icons_material_icons_enabled_families
  version: '1.0'
  applicable_bundles:
  - material_icons
  checks:
  - kind: must_contain_any
    values:
    - two-tone
  scoring:
    combine: all_pass
- id: material_icons_material_icons_widget_default_style
  version: '1.0'
  applicable_bundles:
  - material_icons
  checks:
  - kind: must_contain_any
    values:
    - outlined
  scoring:
    combine: all_pass
- id: material_icons_material_icons_add_field
  version: '1.0'
  applicable_bundles:
  - material_icons
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
- id: material_icons_material_icons_enable_families
  version: '1.0'
  applicable_bundles:
  - material_icons
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
