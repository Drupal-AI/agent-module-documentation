metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: material_icons
  version: 2.0.x
  note: Material Icons provides a material_icons field type (columns icon/family/classes) with a matching
    widget (settings allow_style/default_style/allow_classes) and formatter (theme material_icon -> <i
    class="{family} {classes}">{icon}</i>), plus a CKEditor 5 button. Which icon font families load site-wide
    is controlled by material_icons.settings -> families (default ['baseline']). Medium cases read known
    values (an enabled families list; a widget default_style on a created field). Hard cases create a
    material_icons field on Article (field_mi_icon) and enable extra families. All fields are namespaced
    (field_mi_*), and scripts restore the shipped families default ['baseline'] explicitly. No drush cr
    (config/entity reads are live) to avoid an unrelated shared-site group-module cache-rebuild fault.
questions:
- id: material_icons-field-render
  input: The Drupal module material_icons provides a field type for icons. What is the field type's id,
    what three pieces of data does it store, and what HTML does its formatter output for one icon?
  criteria: Field type id material_icons stores icon (name), family (style), and classes. Its formatter
    themes each value with the material_icon template as <i class="{family} {classes}">{icon}</i>.
  bundle: material_icons
  rubric_ref: rubric/material_icons_material_icons_field_render@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: material_icons-ckeditor
  input: How do I let editors insert Material Icons into rich text with CKEditor 5 using the material_icons
    module?
  criteria: In Text formats and editors, configure a CKEditor 5 format and drag the 'Material Icons' button
    into the Active toolbar (ensure <span class> is allowed). The button opens the icon-picker dialog
    and inserts a <span> with the icon classes.
  bundle: material_icons
  rubric_ref: rubric/material_icons_material_icons_ckeditor@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: material_icons-families-config
  input: Which configuration object and key control the Material Icons font styles (families) that get
    loaded on every page, and what is the shipped default?
  criteria: material_icons.settings -> families (a list of family keys). The shipped default is ['baseline']
    (Material Icons Filled). Each enabled family is attached site-wide as an external Google Fonts stylesheet.
  bundle: material_icons
  rubric_ref: rubric/material_icons_material_icons_families_config@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: material_icons-enabled-families
  input: On this site, more than one Material Icons font family has been enabled. Inspect the live material_icons
    configuration and list the enabled families.
  criteria: material_icons.settings families is ['baseline', 'two-tone'] (Filled plus Two-Tone).
  bundle: material_icons
  rubric_ref: rubric/material_icons_material_icons_enabled_families@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/material_icons-enabled-families-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/material_icons-enabled-families-cleanup.sh
- id: material_icons-widget-default-style
  input: The Article content type has a Material Icons field whose widget has been configured with a specific
    default icon style. Inspect the live default form display for Article and state the widget's configured
    default style.
  criteria: The field_mi_known widget has default_style = 'outlined' in core.entity_form_display.node.article.default
    under content.field_mi_known.settings.default_style.
  bundle: material_icons
  rubric_ref: rubric/material_icons_material_icons_widget_default_style@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/material_icons-widget-default-style-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/material_icons-widget-default-style-cleanup.sh
- id: material_icons-add-field
  input: On this Drupal site, add a Material Icons field named field_mi_icon to the Article content type
    (using the material_icons field type). Apply the change to the live site.
  criteria: A field storage node.field_mi_icon of type material_icons exists and is attached to the article
    bundle (FieldConfig node.article.field_mi_icon).
  bundle: material_icons
  rubric_ref: rubric/material_icons_material_icons_add_field@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/material_icons-add-field-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/material_icons-add-field-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/material_icons-add-field-verify.sh
- id: material_icons-enable-families
  input: On this site, enable the 'Outlined' and 'Sharp' Material Icons families (in addition to the default
    Filled/baseline) so those style packs load on the pages. Apply the change to the live site.
  criteria: material_icons.settings families includes both 'outlined' and 'sharp' (e.g. ['baseline','outlined','sharp']).
  bundle: material_icons
  rubric_ref: rubric/material_icons_material_icons_enable_families@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/material_icons-enable-families-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/material_icons-enable-families-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/material_icons-enable-families-verify.sh
