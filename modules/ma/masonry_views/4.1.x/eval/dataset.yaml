metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: masonry_views
  version: 4.1.x
  note: 'Masonry Views provides a single Views style plugin (@ViewsStyle id ''masonry'', theme views_view_masonry)
    selected as a view display''s Format. It delegates layout options and rendering to the required masonry
    module''s masonry.service. Configuration lives entirely in the view display''s display_options.style
    ({type: masonry, options: {gutterWidth, layoutColumnWidth, isLayoutResizable, ...}}). No config page,
    permissions, schema, or Drush. Introspection reads the style options of a live masonry-style view;
    execution switches a view''s Format to masonry and sets a masonry layout option, both verified against
    the live views.view config entity.'
questions:
- id: masonry_views-how-to-use
  input: How do I display a Drupal View's results as a masonry grid using the masonry_views module? What
    do I change on the view?
  criteria: Set the view display's Format (style plugin) to 'Masonry' (plugin id 'masonry'). It renders
    results via the views_view_masonry theme hook, wrapping each row as a .masonry-item inside a .masonry-layout-<view-id>
    container.
  bundle: masonry_views
  rubric_ref: rubric/masonry_views_masonry_views_how_to_use@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: masonry_views-dependency
  input: What does masonry_views depend on to actually lay out the grid, and what happens if the jQuery
    Masonry library is missing?
  criteria: It requires the separate 'masonry' module (>= 4.x) and its jQuery Masonry library; masonry_views
    delegates options and rendering to masonry.service. Without the library the options form is disabled
    ('These options have been disabled as the jQuery Masonry plugin is not installed.') and no layout
    JS is attached.
  bundle: masonry_views
  rubric_ref: rubric/masonry_views_masonry_views_dependency@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: masonry_views-markup
  input: Which theme hook and CSS classes does masonry_views use to render items, so I can target them
    with CSS?
  criteria: Theme hook views_view_masonry (template views-view-masonry.html.twig). Each row is wrapped
    in a div with class 'masonry-item', inside a container with class 'masonry-layout-<view-id>' (and
    'masonry-group-<n>' when grouping); the rows container also carries data-drupal-masonry-layout.
  bundle: masonry_views
  rubric_ref: rubric/masonry_views_masonry_views_markup@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: masonry_views-probe-gutter
  input: On this Drupal site there is a view named 'masonry_views_probe' that uses the Masonry style.
    Inspect its live configuration and state the configured gutter width (gutterWidth) value.
  criteria: gutterWidth is 17 (views.view.masonry_views_probe display.default.display_options.style.options.gutterWidth).
  bundle: masonry_views
  rubric_ref: rubric/masonry_views_masonry_views_probe_gutter@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
