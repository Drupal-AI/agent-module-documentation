- id: markdown-switch-parser
  input: The text format 'md_switch' on this site uses the Markdown module with the CommonMark parser.
    Reconfigure its Markdown filter to use the Parsedown parser (parser id parsedown) instead, keeping
    the filter enabled. Apply the change live.
  criteria: In filter.format.md_switch the Markdown filter stays enabled and filters.markdown.settings.id
