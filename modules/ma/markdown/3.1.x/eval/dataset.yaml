metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: markdown
  version: 3.1.x
  note: 'Markdown provides a text-format filter (plugin id ''markdown''), a ''markdown'' service (Drupal\markdown\Markdown)
    with parse()/getParser()/load()/loadFile()/loadUrl()/save(), a Twig |markdown filter and markdown()
    function, and three plugin types (parser, extension, allowed_html) with managers plugin.manager.markdown.parser/.extension/.allowed_html.
    Parser plugin ids on this site include commonmark, commonmark-gfm, parsedown, parsedown-extra, php-markdown,
    php-markdown-extra. Admin UI at markdown.overview (/admin/config/content/markdown, perm ''administer
    markdown''). A text format stores the filter at filters.markdown with status and settings.id (the
    parser). Cases are grounded in that real filter config: introspection reads back the configured parser
    on a live text format; execution enables the Markdown filter on a format and switches its parser,
    verified against the live filter_format config.'
questions:
- id: markdown-enable-filter
  input: On a Drupal 11 site with the Markdown module, how do I let editors write content in Markdown
    that renders to HTML? What do I add to a text format?
  criteria: Enable the 'Markdown' filter (filter plugin id 'markdown') on a text format (Configuration
    > Content authoring > Text formats and editors). On the filter_format it is stored at filters.markdown.status
    = true with settings.id set to the chosen parser.
  bundle: markdown
  rubric_ref: rubric/markdown_markdown_enable_filter@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: markdown-service
  input: With the Markdown module, how do I convert a Markdown string to HTML in custom PHP code, and
    how do I render Markdown from a Twig template?
  criteria: 'Use the ''markdown'' service: \Drupal::service(''markdown'')->parse($string) returns a ParsedMarkdown
    that stringifies to HTML (also loadFile()/loadUrl() for files/URLs). In Twig use the {{ var|markdown
    }} filter or markdown(var) function.'
  bundle: markdown
  rubric_ref: rubric/markdown_markdown_service@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: markdown-parsers
  input: Which Markdown parser libraries does the Drupal Markdown module support, and how are they made
    available? Name at least one parser plugin id.
  criteria: 'It supports pluggable parsers backed by external Composer libraries: CommonMark (commonmark,
    commonmark-gfm), Parsedown (parsedown, parsedown-extra) and PHP Markdown (php-markdown, php-markdown-extra).
    You install the library via Composer (e.g. league/commonmark); the module detects installed parsers
    and marks missing ones. They are markdown.parser plugins.'
  bundle: markdown
  rubric_ref: rubric/markdown_markdown_parsers@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: markdown-parser-probe
  input: This Drupal site has a text format 'md_probe' that renders Markdown. Inspect its live configuration
    and state which Markdown parser plugin id its Markdown filter is configured to use.
  criteria: The Markdown filter on md_probe uses the parsedown parser (filter.format.md_probe -> filters.markdown.settings.id
    = parsedown).
  bundle: markdown
  rubric_ref: rubric/markdown_markdown_parser_probe@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/markdown-parser-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/markdown-parser-cleanup.sh
- id: markdown-enabled-probe
  input: Inspect the 'md_enabled' text format on this Drupal site and state which Markdown parser its
    Markdown filter uses.
  criteria: The md_enabled format's Markdown filter uses the commonmark parser (filter.format.md_enabled
    -> filters.markdown.settings.id = commonmark).
  bundle: markdown
  rubric_ref: rubric/markdown_markdown_enabled_probe@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/markdown-enabled-setup.sh
