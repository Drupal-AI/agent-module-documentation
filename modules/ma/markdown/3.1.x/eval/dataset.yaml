- id: markdown-enable
  input: On this Drupal site, create a text format with machine id md_task named 'MD Task' that has the
    Markdown module's Markdown filter enabled, so content in that format is rendered from Markdown to
    HTML. Apply the change to the live site.
  criteria: A filter.format.md_task config entity exists with filters.markdown.status = true (the Markdown
    filter enabled, with a parser in settings.id).
  bundle: markdown
  rubric_ref: rubric/markdown_markdown_enable@1.0
  tags:
  - mode:execution
