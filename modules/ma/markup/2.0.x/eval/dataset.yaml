metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: markup
  version: 2.0.x
  note: Markup ships one Field API plugin trio (markup field type/widget/formatter) whose content lives
    in the field settings (a text_format), not per entity, plus two module hooks. Cases are `recipe` (response-graded)
    probing documented facts an agent would otherwise read source to answer; no site mutation.
questions:
- id: markup-what-is-it
  input: On a Drupal 11 site, what does the Markup module's field type do and how is the displayed markup
    defined?
  criteria: 'It provides a `markup` field type whose HTML/markup is defined once in the field settings
    (a text_format: value + format), not entered per entity; the same markup renders on both the edit
    form (widget) and the display (formatter).'
  bundle: markup
  rubric_ref: rubric/markup_markup_what_is_it@1.0
  tags:
  - mode:recipe
- id: markup-add-field
  input: How do I add a Markup field to a content type and set the markup it shows?
  criteria: In Manage fields, Add field and pick 'Markup' (field type id markup), then in the field settings
    form fill the required text_format 'Markup' element (markup value + text format). No module-level
    settings page exists.
  bundle: markup
  rubric_ref: rubric/markup_markup_add_field@1.0
  tags:
  - mode:recipe
- id: markup-cardinality
  input: Why can't I set the number of values (cardinality) on a Markup field in Drupal?
  criteria: The module implements hook_form_field_storage_config_edit_form_alter() and removes the cardinality_container
    from the storage edit form for markup fields, forcing single (cardinality 1).
  bundle: markup
  rubric_ref: rubric/markup_markup_cardinality@1.0
  tags:
  - mode:recipe
- id: markup-plugin-ids
  input: What are the field type, widget, and formatter plugin ids provided by the Drupal Markup module?
  criteria: 'All three are id `markup`: field type MarkupItem (default_widget=markup, default_formatter=markup,
    category formatted_text), widget MarkupWidget, formatter MarkupFormatter.'
  bundle: markup
  rubric_ref: rubric/markup_markup_plugin_ids@1.0
  tags:
  - mode:recipe
- id: markup-editors-only
  input: With the Markup module, how do I show the markup only to content editors on the edit form but
    not to site visitors on the rendered page?
  criteria: Keep the widget in Manage form display (shown on the edit form) but set the field's formatter
    to hidden in Manage display, since the widget renders on the form and the formatter renders on the
    display.
  bundle: markup
  rubric_ref: rubric/markup_markup_editors_only@1.0
  tags:
  - mode:recipe
- id: markup-config-permissions
  input: Does the Markup module have a configuration page, permissions, or Drush commands?
  criteria: No — configure is null (no admin settings page or menu), it defines no permissions and no
    Drush commands; all setup is in the per-field settings. It depends only on core field and ships a
    config schema for the field setting.
  bundle: markup
  rubric_ref: rubric/markup_markup_config_permissions@1.0
  tags:
  - mode:recipe
- id: markup-render-mechanism
  input: Internally, what render element does the Markup module's widget and formatter use to output the
    markup?
  criteria: Both build a `#type => processed_text` render element with `#text` = the field setting markup.value
    and `#format` = markup.format, so the markup is run through the chosen text format.
  bundle: markup
  rubric_ref: rubric/markup_markup_render_mechanism@1.0
  tags:
  - mode:recipe
