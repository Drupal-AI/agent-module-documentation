metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: markdownify_path
  version: 1.1.x
  note: Submodule of markdownify. Its only behaviour is an inbound path processor (markdownify.alias_path_processor,
    priority 101) that makes appending .md work on human-readable PATH ALIASES, not just canonical /node/N
    paths. No config, no schema, no permissions. Easy cases cover that behaviour; the medium introspection
    checks the submodule is enabled on the live site; the hard case verifies the capability end-to-end
    by requesting an aliased page's .md (200 text/markdown) after enabling the submodule (reset disables
    it so verify fails on empty state).
questions:
- id: markdownify_path-what
  input: In the markdownify_path submodule of Markdownify, what extra capability do you get compared to
    the base markdownify module?
  criteria: It lets you access the Markdown version of content by appending .md to a human-readable path
    ALIAS (e.g. /blog/my-post.md), whereas the base module only handles the canonical path (/node/1.md).
  bundle: markdownify_path
  rubric_ref: rubric/markdownify_path_markdownify_path_what@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: markdownify_path-mechanism
  input: How does markdownify_path implement .md support on path aliases, and what core module does it
    require?
  criteria: It registers an inbound path processor (service markdownify.alias_path_processor, MarkdownifyAliasPathProcessor,
    tagged path_processor_inbound priority 101) that strips .md, resolves the alias via path_alias.manager
    and rewrites to the Markdownify system path. It requires the core 'path' module (and the parent markdownify).
  bundle: markdownify_path
  rubric_ref: rubric/markdownify_path_markdownify_path_mechanism@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: markdownify_path-config
  input: What configuration does markdownify_path need after installation?
  criteria: None. The submodule has no settings form, no config schema and no permissions; enabling it
    (drush en markdownify_path) is the entire setup.
  bundle: markdownify_path
  rubric_ref: rubric/markdownify_path_markdownify_path_config@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: markdownify_path-enabled
  input: On this Drupal site, is Markdown access via human-readable path aliases (the markdownify_path
    submodule) currently available? Inspect the live site and say whether that submodule is enabled.
  criteria: Yes — the markdownify_path module is enabled (e.g. `drush pm:list --status=enabled` lists
    markdownify_path), so appending .md to a path alias resolves to the Markdown version.
  bundle: markdownify_path
  rubric_ref: rubric/markdownify_path_markdownify_path_enabled@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/markdownify_path-enabled-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/markdownify_path-enabled-cleanup.sh
- id: markdownify_path-alias-md
  input: On this Drupal site there is a page whose URL alias is /mmp-md-node. Appending .md to that alias
    (/mmp-md-node.md) currently does not return the Markdown version. Using the Markdownify feature set,
    make the Markdown version reachable at the alias URL /mmp-md-node.md. Apply the change to the live
    site.
  criteria: Enable the markdownify_path submodule (`drush en markdownify_path -y`); its inbound path processor
    then resolves /mmp-md-node.md to the aliased node and returns a 200 text/markdown response.
  bundle: markdownify_path
  rubric_ref: rubric/markdownify_path_markdownify_path_alias_md@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/markdownify_path-alias-md-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/markdownify_path-alias-md-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/markdownify_path-alias-md-verify.sh
