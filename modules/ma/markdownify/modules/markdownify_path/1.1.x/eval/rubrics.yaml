rubrics:
- id: markdownify_path_markdownify_path_what
  version: '1.0'
  applicable_bundles:
  - markdownify_path
  checks:
  - kind: must_contain_any
    values:
    - alias
    - path alias
    - human-readable
  scoring:
    combine: all_pass
- id: markdownify_path_markdownify_path_mechanism
  version: '1.0'
  applicable_bundles:
  - markdownify_path
  checks:
  - kind: must_contain_any
    values:
    - path processor
    - path_processor_inbound
    - alias manager
    - MarkdownifyAliasPathProcessor
    - path
  scoring:
    combine: all_pass
- id: markdownify_path_markdownify_path_config
  version: '1.0'
  applicable_bundles:
  - markdownify_path
  checks:
  - kind: must_contain_any
    values:
    - no config
    - no configuration
    - nothing
    - just enable
    - no settings
  scoring:
    combine: all_pass
- id: markdownify_path_markdownify_path_enabled
  version: '1.0'
  applicable_bundles:
  - markdownify_path
  checks:
  - kind: must_contain_any
    values:
    - enabled
    - markdownify_path
    - 'yes'
    - installed
  scoring:
    combine: all_pass
- id: markdownify_path_markdownify_path_alias_md
  version: '1.0'
  applicable_bundles:
  - markdownify_path
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
