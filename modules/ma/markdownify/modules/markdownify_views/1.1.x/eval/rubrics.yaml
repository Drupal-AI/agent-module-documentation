rubrics:
- id: markdownify_views_markdownify_views_what
  version: '1.0'
  applicable_bundles:
  - markdownify_views
  checks:
  - kind: must_contain_any
    values:
    - page
    - views page
    - listing
    - page display
  scoring:
    combine: all_pass
- id: markdownify_views_markdownify_views_mechanism
  version: '1.0'
  applicable_bundles:
  - markdownify_views
  checks:
  - kind: must_contain_any
    values:
    - route subscriber
    - MarkdownifyViewsRoutes
    - MarkdownifyViewPageController
    - html_converter
  scoring:
    combine: all_pass
- id: markdownify_views_markdownify_views_known_bug
  version: '1.0'
  applicable_bundles:
  - markdownify_views
  checks:
  - kind: must_contain_any
    values:
    - contextualLinks
    - not initialise
    - not initialized
    - create()
    - ViewPageController
    - typed property
  scoring:
    combine: all_pass
- id: markdownify_views_markdownify_views_enabled
  version: '1.0'
  applicable_bundles:
  - markdownify_views
  checks:
  - kind: must_contain_any
    values:
    - enabled
    - markdownify_views
    - 'yes'
    - installed
  scoring:
    combine: all_pass
