rubrics:
- id: mail_login_mail_login_enable
  version: '1.0'
  applicable_bundles:
  - mail_login
  checks:
  - kind: must_contain_any
    values:
    - mail_login_enabled
    - mail_login.settings
  scoring:
    combine: all_pass
- id: mail_login_mail_login_email_only
  version: '1.0'
  applicable_bundles:
  - mail_login
  checks:
  - kind: must_contain_any
    values:
    - mail_login_email_only
  scoring:
    combine: all_pass
- id: mail_login_mail_login_resolve_email
  version: '1.0'
  applicable_bundles:
  - mail_login
  checks:
  - kind: must_contain_any
    values:
    - user.auth
    - AuthDecorator
    - lookupAccount
    - loadByProperties
    - mail
  scoring:
    combine: all_pass
- id: mail_login_mail_login_case_sensitive
  version: '1.0'
  applicable_bundles:
  - mail_login
  checks:
