metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: mail_login
  version: 4.2.x
  note: Mail Login exposes one config object (mail_login.settings), a decorator of core's user.auth service,
    a form_alter validator, and one permission. Cases are `recipe` (response-graded) since they probe
    documented facts an agent would otherwise read source to answer; no site mutation.
questions:
- id: mail-login-enable
  input: On a Drupal 11 site I want users to be able to log in with their email address using the Mail
    Login module. Which config object and key turn this on, and what is the default?
  criteria: The mail_login_enabled key (default 1, i.e. enabled) on the mail_login.settings config object
    turns on login by email address.
  bundle: mail_login
  rubric_ref: rubric/mail_login_mail_login_enable@1.0
  tags:
  - mode:recipe
- id: mail-login-email-only
  input: With Mail Login, how do I disable username login so users can ONLY sign in with their email address?
    What happens if someone types a username?
  criteria: Set mail_login_email_only to 1 on mail_login.settings. A non-email identifier is then rejected
    with an error like 'Login by username has been disabled. Use your email address instead.'
  bundle: mail_login
  rubric_ref: rubric/mail_login_mail_login_email_only@1.0
  tags:
  - mode:recipe
- id: mail-login-resolve-email
  input: How does the Mail Login module resolve a submitted email address to a user account during login
    on Drupal 11?
  criteria: It decorates core's user.auth service (AuthDecorator); lookupAccount() validates the identifier
    with FILTER_VALIDATE_EMAIL and loads the user by the 'mail' property before authenticating.
  bundle: mail_login
  rubric_ref: rubric/mail_login_mail_login_resolve_email@1.0
  tags:
  - mode:recipe
- id: mail-login-case-sensitive
  input: Which Mail Login setting controls whether email addresses are matched case-sensitively during
    login, and what does turning it off do?
  criteria: mail_login_case_sensitive (default 1) on mail_login.settings. Set to 0 for case-insensitive
    matching, which is accepted only when exactly one account matches (RFC 5321 permits case-sensitivity).
  bundle: mail_login
  rubric_ref: rubric/mail_login_mail_login_case_sensitive@1.0
  tags:
  - mode:recipe
- id: mail-login-labels
  input: I want to change the login form's username field label and description with Mail Login. Which
    setting must be enabled, and which keys hold the mixed username/email labels?
  criteria: Enable mail_login_override_login_labels; then mail_login_username_title and mail_login_username_description
    (and the email-only / password-reset variants) set the login form labels. All are translatable.
  bundle: mail_login
  rubric_ref: rubric/mail_login_mail_login_labels@1.0
  tags:
  - mode:recipe
- id: mail-login-config-route
  input: Where is the Mail Login configuration form and what permission protects it on a Drupal site?
  criteria: The settings form is at /admin/config/people/mail-login (route mail_login.admin), gated by
    the 'administer mail login' permission.
  bundle: mail_login
  rubric_ref: rubric/mail_login_mail_login_config_route@1.0
  tags:
  - mode:recipe
- id: mail-login-not-registration
  input: Does the Mail Login module change how users register accounts, or only how they log in? How does
    it differ from login_emailusername?
  criteria: Mail Login only affects authentication and the login/password-reset forms (by decorating user.auth
    and altering user_login_form / user_pass); it does not change user registration. Unlike login_emailusername,
    it adds an explicit email-only mode and case-sensitivity handling rather than registration-side changes.
  bundle: mail_login
  rubric_ref: rubric/mail_login_mail_login_not_registration@1.0
  tags:
  - mode:recipe
- id: mail-login-flood
  input: How does Mail Login keep Drupal's flood control working when a user logs in with an email address
    instead of a username?
  criteria: Its validator (mail_login_validate_authentication, added via hook_form_alter before ::validateFinal)
    translates the submitted email to the canonical username and rewrites the 'name' value so flood control
    keys on one consistent identifier.
  bundle: mail_login
  rubric_ref: rubric/mail_login_mail_login_flood@1.0
  tags:
  - mode:recipe
