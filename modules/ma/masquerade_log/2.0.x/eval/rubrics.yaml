rubrics:
- id: masquerade_log_masquerade_log_what_it_does
  version: '1.0'
  applicable_bundles:
  - masquerade_log
  checks:
  - kind: must_contain_any
    values:
    - original user
    - masquerading
    - no configuration
    - original_uid
    - original_username
  scoring:
    combine: all_pass
- id: masquerade_log_masquerade_log_suffix_format
  version: '1.0'
  applicable_bundles:
  - masquerade_log
  checks:
  - kind: must_contain_any
    values:
    - masquerading
    - '@original_uid'
    - '@original_username'
    - uid
  scoring:
    combine: all_pass
- id: masquerade_log_masquerade_log_mechanism
  version: '1.0'
  applicable_bundles:
  - masquerade_log
  checks:
  - kind: must_contain_any
    values:
    - decorat
    - ServiceModifierInterface
    - logger
    - MasqueradeLogLogger
    - tagged
  scoring:
    combine: all_pass
- id: masquerade_log_masquerade_log_dblog_decorator
  version: '1.0'
  applicable_bundles:
  - masquerade_log
  checks:
  - kind: must_contain_any
    values:
    - MasqueradeLogLogger
    - Drupal\masquerade_log\MasqueradeLogLogger
  scoring:
    combine: all_pass
- id: masquerade_log_masquerade_log_decorator_is_psr
  version: '1.0'
  applicable_bundles:
  - masquerade_log
  checks:
  - kind: must_contain_any
    values:
    - MasqueradeLogLogger
    - LoggerInterface
  scoring:
    combine: all_pass
- id: masquerade_log_masquerade_log_enable
  version: '1.0'
  applicable_bundles:
  - masquerade_log
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
