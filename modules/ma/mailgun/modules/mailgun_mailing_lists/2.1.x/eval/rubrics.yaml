rubrics:
- id: mailgun_mailing_lists_mailgun_ml_what
  version: '1.0'
  applicable_bundles:
  - mailgun_mailing_lists
  checks:
  - kind: must_contain_any
    values:
    - mailing_list_subscribe
    - subscribe
    - mailing list
    - block
  scoring:
    combine: all_pass
- id: mailgun_mailing_lists_mailgun_ml_where
  version: '1.0'
  applicable_bundles:
  - mailgun_mailing_lists
  checks:
  - kind: must_contain_any
    values:
    - mailing-lists
    - mailgun_mailing_lists.admin_settings_form
    - administer mailgun
    - /admin/config/services/mailgun
  scoring:
    combine: all_pass
- id: mailgun_mailing_lists_mailgun_ml_block_setting
  version: '1.0'
  applicable_bundles:
  - mailgun_mailing_lists
  checks:
  - kind: must_contain_any
    values:
    - mailing_list
    - list address
    - address
    - block
  scoring:
    combine: all_pass
- id: mailgun_mailing_lists_mailgun_ml_known_block
  version: '1.0'
  applicable_bundles:
  - mailgun_mailing_lists
  checks:
  - kind: must_contain_any
    values:
    - newsletter@lists.example.com
  scoring:
    combine: all_pass
- id: mailgun_mailing_lists_mailgun_ml_block_label
  version: '1.0'
  applicable_bundles:
  - mailgun_mailing_lists
  checks:
  - kind: must_contain_any
    values:
    - Join Our Newsletter
  scoring:
    combine: all_pass
- id: mailgun_mailing_lists_mailgun_ml_place_block
  version: '1.0'
  applicable_bundles:
  - mailgun_mailing_lists
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
- id: mailgun_mailing_lists_mailgun_ml_place_sidebar
  version: '1.0'
  applicable_bundles:
  - mailgun_mailing_lists
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
