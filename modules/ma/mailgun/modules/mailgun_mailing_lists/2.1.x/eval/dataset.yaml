metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: mailgun_mailing_lists
  version: 2.1.x
  note: Submodule of Mailgun. Provides an admin page to manage Mailgun mailing lists (route mailgun_mailing_lists.admin_settings_form
    at /admin/config/services/mailgun/settings/mailing-lists, permission 'administer mailgun' from the
    parent) plus a placeable Block plugin mailing_list_subscribe whose block setting 'mailing_list' holds
    the list address to subscribe visitors to. List creation/member ops call the Mailgun HTTP API (need
    the parent's API key), but placing/configuring the subscribe block is local Drupal block config. Medium/hard
    cases are grounded in real block placements (mlist_known/mlist_task) and read settings.mailing_list
    from the Block config entity (no API call on save/read).
questions:
- id: mailgun_ml-what
  input: What does the Drupal mailgun_mailing_lists submodule add, and what block does it provide for
    visitors?
  criteria: It lets you manage Mailgun mailing lists from Drupal (admin page under the Mailgun settings)
    and provides a 'Mailing list subscribe form' block (plugin id mailing_list_subscribe) that shows an
    email field and subscribes visitors to a configured Mailgun list.
  bundle: mailgun_mailing_lists
  rubric_ref: rubric/mailgun_mailing_lists_mailgun_ml_what@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: mailgun_ml-where
  input: In mailgun_mailing_lists, where do I manage the Mailgun lists in the admin and what permission
    is needed?
  criteria: At /admin/config/services/mailgun/settings/mailing-lists (route mailgun_mailing_lists.admin_settings_form,
    a tab under the Mailgun settings). It reuses the parent module's 'administer mailgun' permission.
  bundle: mailgun_mailing_lists
  rubric_ref: rubric/mailgun_mailing_lists_mailgun_ml_where@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: mailgun_ml-block-setting
  input: When I place the mailing_list_subscribe block from mailgun_mailing_lists, what do I configure
    on it so it subscribes people to the right Mailgun list?
  criteria: 'The block has a ''mailing_list'' setting: the Mailgun list address to subscribe submitted
    emails to. It is stored in the block config entity under settings.mailing_list.'
  bundle: mailgun_mailing_lists
  rubric_ref: rubric/mailgun_mailing_lists_mailgun_ml_block_setting@1.0
  tags:
