questions:
- id: mailgun_ete-what
  input: What does the Drupal mailgun_email_templates_examples submodule give me, and do I need to configure
    anything to use it?
  criteria: It ships example HTML email Twig templates (password reset, user, the Mailgun test email)
    via hook_theme() suggestions of the parent 'mailgun' theme hook. There is no configuration - enabling
    it is the whole setup; you customize by overriding the templates in your theme.
  bundle: mailgun_email_templates_examples
  rubric_ref: rubric/mailgun_email_templates_examples_mailgun_ete_what@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: mailgun_ete-hooks
  input: Which theme hooks / template files does mailgun_email_templates_examples register, and what makes
    them apply to Mailgun's emails?
  criteria: It registers mailgun__test_form_email, mailgun__password_reset and mailgun__user, each declared
    with base hook => 'mailgun' (so they are template suggestions of the parent Mailgun 'mailgun' theme
    hook). Templates are templates/mailgun--*.html.twig.
  bundle: mailgun_email_templates_examples
  rubric_ref: rubric/mailgun_email_templates_examples_mailgun_ete_hooks@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: mailgun_ete-override
  input: How do I change the look of the Mailgun password-reset email provided by mailgun_email_templates_examples?
  criteria: Copy templates/mailgun--password-reset.html.twig into your active theme's templates/ directory,
    edit it, and clear caches; the theme copy overrides the submodule's example.
  bundle: mailgun_email_templates_examples
  rubric_ref: rubric/mailgun_email_templates_examples_mailgun_ete_override@1.0
  tags:
  - mode:recipe
  - difficulty:easy
