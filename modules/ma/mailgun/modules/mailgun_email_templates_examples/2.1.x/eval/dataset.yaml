  module: mailgun_email_templates_examples
  version: 2.1.x
  note: 'Submodule of Mailgun. Purely presentation: hook_theme() registers three theme hooks (mailgun__test_form_email,
    mailgun__password_reset, mailgun__user), each a suggestion of the parent ''mailgun'' theme hook, backed
    by Twig files in templates/. No config, routes, permissions, services or Drush. Medium/hard cases
