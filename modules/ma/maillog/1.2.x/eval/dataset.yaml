# Generated from evals.json by evaluation/to_commons.py.
# Edit evals.json and rerun the script; do not edit this file.
metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: maillog
  version: 1.2.x
  note: 'Maillog is a mail-developer tool: a core Mail plugin (''maillog'') set as system.mail interface.default
    on install, which logs outgoing mail to the {maillog} DB table, can display mail on-screen (verbose),
    and can suppress delivery. Everything is driven by config object maillog.settings (keys: send, log,
    verbose, nosend_notify, log_notify, body_trimmed, base64_remove, cron_enabled, keep_limit_type in
    {time_to_keep,number_to_keep}, time_to_keep, number_to_keep). Shipped defaults: send=true, log=true,
    verbose=true, everything else false/null except keep_limit_type=time_to_keep. Permissions: view/delete/administer
    maillog. Drush: maillog:clear (truncates the table). Log list at /admin/reports/maillog (a View).
    Medium cases read maillog.settings off the live site; hard cases set config and verify it. Cleanup/reset
    restore the shipped defaults explicitly (not via State).'
questions:
- id: maillog-clear-and-suppress
  input: On a staging site using the Maillog module, which Drush command wipes all logged emails, and
    which setting stops the site from actually delivering mail?
  criteria: drush maillog:clear truncates the {maillog} table (deletes all logged entries). To stop real
    delivery, set maillog.settings 'send' to false; Maillog will still log/display the mail but not send
    it.
  bundle: maillog
  rubric_ref: rubric/maillog_maillog_clear_and_suppress@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: maillog-config-object
  input: What config object stores Maillog's options, name a few of its keys, and what does the module
    change about the site's mail system when you install it?
  criteria: Options live in maillog.settings (keys include send, log, verbose, body_trimmed, base64_remove,
    cron_enabled, keep_limit_type, time_to_keep, number_to_keep). On install Maillog sets system.mail
    interface.default = maillog (making its Mail plugin the active backend); uninstall restores php_mail.
  bundle: maillog
  rubric_ref: rubric/maillog_maillog_config_object@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: maillog-permissions-report
  input: Which permissions does the Maillog module define, and at what admin path can you browse the emails
    it has logged?
  criteria: 'Maillog defines three permissions: ''view maillog'', ''delete maillog'', and ''administer
    maillog'' (all restrict access). Logged emails are browsable via a View at /admin/reports/maillog.'
  bundle: maillog
  rubric_ref: rubric/maillog_maillog_permissions_report@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: maillog-delivery-state
  input: On this site Maillog is installed. Inspect the live configuration and tell me whether the site
    is currently delivering emails for real or whether Maillog is suppressing delivery.
  criteria: 'Delivery is currently suppressed: maillog.settings ''send'' is false, so Maillog logs the
    emails but does not deliver them (log is still true).'
  bundle: maillog
  rubric_ref: rubric/maillog_maillog_delivery_state@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/maillog-delivery-state-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/maillog-delivery-state-cleanup.sh
- id: maillog-retention
  input: This site has Maillog's automatic log cleanup configured. Inspect the live configuration and
    describe the retention policy (what triggers cleanup and how much it keeps).
  criteria: Cron cleanup is enabled (cron_enabled = true) with keep_limit_type = number_to_keep and number_to_keep
    = 100, so on cron Maillog keeps only the newest 100 logged emails.
  bundle: maillog
  rubric_ref: rubric/maillog_maillog_retention@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/maillog-retention-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/maillog-retention-cleanup.sh
- id: maillog-suppress
  input: This is a staging copy of a production site and it must NOT send real emails, but you still want
    a copy of every message for debugging. Using the Maillog module, configure the site so that outgoing
    email is not delivered but is still logged. Apply the change to the live site.
  criteria: Set maillog.settings 'send' to false (boolean) and keep 'log' true, then save. The verify
    checks that send === false.
  bundle: maillog
  rubric_ref: rubric/maillog_maillog_suppress@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/maillog-suppress-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/maillog-suppress-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/maillog-suppress-verify.sh
- id: maillog-cron-retention
  input: The Maillog log table on this site keeps growing. Configure Maillog so that its automatic cleanup
    runs on cron and deletes logged emails older than 30 days. Apply the change to the live site.
  criteria: Set maillog.settings cron_enabled = true, keep_limit_type = 'time_to_keep', and time_to_keep
    = 30, then save. The verify checks cron_enabled === true, keep_limit_type === 'time_to_keep', and
    time_to_keep === 30.
  bundle: maillog
  rubric_ref: rubric/maillog_maillog_cron_retention@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: site-builder
    reset: agent-module-documentation/evaluation/verify/maillog-cron-retention-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/maillog-cron-retention-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/maillog-cron-retention-verify.sh
