rubrics:
- id: mailsystem_mailsystem_admin_route
  version: '1.0'
  applicable_bundles:
  - mailsystem
  checks:
  - kind: must_contain_any
    values:
    - /admin/config/system/mailsystem
    - mailsystem.settings
  scoring:
    combine: all_pass
- id: mailsystem_mailsystem_formatter_vs_sender
  version: '1.0'
  applicable_bundles:
  - mailsystem
  checks:
  - kind: must_contain_any
    values:
    - formatter
    - sender
  scoring:
    combine: all_pass
- id: mailsystem_mailsystem_config_object
  version: '1.0'
  applicable_bundles:
  - mailsystem
  checks:
  - kind: must_contain_any
    values:
    - mailsystem.settings
    - defaults
    - modules
  scoring:
    combine: all_pass
- id: mailsystem_mailsystem_mail_theme
  version: '1.0'
  applicable_bundles:
  - mailsystem
  checks:
  - kind: must_contain_any
    values:
    - theme
    - default
    - current
    - mailsystem_get_mail_theme
  scoring:
    combine: all_pass
- id: mailsystem_mailsystem_permission
  version: '1.0'
  applicable_bundles:
  - mailsystem
  checks:
  - kind: must_contain_any
    values:
    - administer_mailsystem
    - administer mailsystem
  scoring:
    combine: all_pass
- id: mailsystem_mailsystem_smtp_pairing
  version: '1.0'
  applicable_bundles:
  - mailsystem
  checks:
  - kind: must_contain_any
    values:
    - sender
    - formatter
    - settings form
    - mailsystem.settings
    - /admin/config/system/mailsystem
  scoring:
    combine: all_pass
- id: mailsystem_mailsystem_manager_service
  version: '1.0'
  applicable_bundles:
  - mailsystem
  checks:
  - kind: must_contain_any
    values:
    - plugin.manager.mail
    - MailsystemManager
    - MailManager
  scoring:
    combine: all_pass
- id: mailsystem_mailsystem_custom_backend
  version: '1.0'
  applicable_bundles:
  - mailsystem
  checks:
  - kind: must_contain_any
    values:
    - '@Mail'
    - MailInterface
    - Drupal\Core\Annotation\Mail
  scoring:
    combine: all_pass
