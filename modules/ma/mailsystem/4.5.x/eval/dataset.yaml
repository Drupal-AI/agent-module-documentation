metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: mailsystem
  version: 4.5.x
  note: Mail System is primarily a configuration/UI + API integration point for choosing mail formatter/sender
    plugins. These are `recipe` (response-graded) cases probing mailsystem-specific, load-bearing facts
    grounded in the docs; none mutate site state.
questions:
- id: mailsystem-admin-route
  input: On a Drupal 11 site with the Mail System module enabled, where do I configure which mail backend
    Drupal uses? Give the admin URL path (and the route name if you know it).
  criteria: Admin -> Configuration -> System -> Mail System at /admin/config/system/mailsystem (route
    mailsystem.settings).
  bundle: mailsystem
  rubric_ref: rubric/mailsystem_mailsystem_admin_route@1.0
  tags:
  - mode:recipe
- id: mailsystem-formatter-vs-sender
  input: In the Mail System module each backend choice is a pair of plugins. What are the two roles I
    pick, and what does each one do?
  criteria: A formatter (builds the message body/headers via format()) and a sender (actually sends it
    via mail()). Both are core MailInterface plugins and can differ, e.g. Mime Mail formatting + SMTP
    sending.
  bundle: mailsystem
  rubric_ref: rubric/mailsystem_mailsystem_formatter_vs_sender@1.0
  tags:
  - mode:recipe
- id: mailsystem-config-object
  input: I want to set Mail System's routing in exported configuration rather than clicking through the
    UI. What is the config object, and what are its top-level keys for the site default vs per-module/per-key
    overrides?
  criteria: The mailsystem.settings config object, with `defaults` (sender/formatter used when nothing
    else matches), `modules` (per-module and per-key overrides, where `_default` covers every key of a
    module), and `theme`.
  bundle: mailsystem
  rubric_ref: rubric/mailsystem_mailsystem_config_object@1.0
  tags:
  - mode:recipe
- id: mailsystem-mail-theme
  input: Using Mail System, how do I control which theme renders my HTML emails? What are the accepted
    values for that setting?
  criteria: 'Set the `theme` key in mailsystem.settings (also on the form): `default` (site default theme),
    `current` (active theme at send time), or a specific theme machine name. Resolved by mailsystem_get_mail_theme().'
  bundle: mailsystem
  rubric_ref: rubric/mailsystem_mailsystem_mail_theme@1.0
  tags:
  - mode:recipe
- id: mailsystem-permission
  input: Which permission gates access to the Mail System settings form on a Drupal site?
  criteria: The `administer_mailsystem` permission gates route mailsystem.settings / the settings form.
  bundle: mailsystem
  rubric_ref: rubric/mailsystem_mailsystem_permission@1.0
  tags:
  - mode:recipe
- id: mailsystem-smtp-pairing
  input: I installed the SMTP module (and Symfony Mailer for formatting) on my Drupal 11 site. How do
    I make Drupal actually send all mail through SMTP while formatting with Symfony Mailer using Mail
    System? Describe the wiring, not code.
  criteria: Those contrib modules register mail plugins; on the Mail System settings form set the site
    default sender to the SMTP plugin and the formatter to the Symfony/Mime Mail plugin. Install the modules
    first, then select their plugins on the form (or set them in mailsystem.settings).
  bundle: mailsystem
  rubric_ref: rubric/mailsystem_mailsystem_smtp_pairing@1.0
  tags:
  - mode:recipe
- id: mailsystem-manager-service
  input: How does Mail System hook into Drupal's mail pipeline at runtime, and do I need to call anything
    special to route mail through it in code?
  criteria: It replaces the core plugin.manager.mail service with MailsystemManager (extends core MailManager)
    via a service provider. You keep calling the standard \Drupal::service('plugin.manager.mail')->mail($module,
    $key, ...); mailsystem picks the formatter/sender pair for that $module/$key from mailsystem.settings,
    so no special API call is needed.
  bundle: mailsystem
  rubric_ref: rubric/mailsystem_mailsystem_manager_service@1.0
  tags:
  - mode:recipe
- id: mailsystem-custom-backend
  input: I wrote a custom mail backend and want it to appear as a selectable option on the Mail System
    settings form. What kind of plugin do I create — is there a mailsystem-specific plugin type?
  criteria: Register a normal core mail plugin (the @Mail / Drupal\Core\Annotation\Mail annotation, implementing
    MailInterface). It then shows up as a selectable formatter/sender on the form. There is no mailsystem-specific
    plugin type to implement.
  bundle: mailsystem
  rubric_ref: rubric/mailsystem_mailsystem_custom_backend@1.0
  tags:
  - mode:recipe
