metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: magnific_popup
  version: 2.1.x
  note: 'Magnific Popup is a field formatter with no configure route. Its state is the field''s display
    component in core.entity_view_display.<entity>.<bundle>.<mode>: component type ''magnific_popup''
    plus settings thumbnail_image_style, popup_image_style, gallery_type (all_items|first_item|separate_items),
    vertical_fit. Medium cases create an image field on Article, set its magnific_popup formatter to a
    known config, and the agent reads it back with drush cget; hard cases create the field with a non-magnific
    or partial formatter and the agent must set the formatter/settings, verified against the live entity_view_display.
    Image styles thumbnail/medium/large are core defaults.'
questions:
- id: magnific-popup-formatter-id
  input: On a Drupal site with the Magnific Popup module, what is the machine id of the field formatter
    it provides for image fields, and on which entity configuration page do you select it?
  criteria: The formatter id is magnific_popup (targets the core 'image' field type). You select it as
    the field's format on the entity's Manage display page; there is no separate settings/configure route.
  bundle: magnific_popup
  rubric_ref: rubric/magnific_popup_magnific_popup_formatter_id@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: magnific-popup-gallery-types
  input: The Magnific Popup image formatter has a 'gallery type' setting. What are its possible values
    and what does each do?
  criteria: gallery_type is one of all_items (all thumbnails shown, grouped into one gallery), first_item
    (only the first thumbnail is visible but the popup galleries through all), or separate_items (each
    item is an independent popup, no gallery).
  bundle: magnific_popup
  rubric_ref: rubric/magnific_popup_magnific_popup_gallery_types@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: magnific-popup-video
  input: Can Magnific Popup open embedded videos (YouTube/Vimeo) in a lightbox on a Drupal site, and what
    is required for that?
  criteria: Yes - the module also ships the video_embed_field_magnific_popup formatter for video_embed_field
    fields, which is only available/usable when the Video Embed Field contrib module is installed.
  bundle: magnific_popup
  rubric_ref: rubric/magnific_popup_magnific_popup_video@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: magnific-popup-known-gallery
  input: On this Drupal site, the Article content type has an image field field_mfp_gal that uses the
    Magnific Popup formatter on its default display. Inspect the live display configuration and tell me
    which gallery type is configured for that formatter.
  criteria: The field_mfp_gal component in core.entity_view_display.node.article.default uses type magnific_popup
    with settings.gallery_type = first_item.
  bundle: magnific_popup
  rubric_ref: rubric/magnific_popup_magnific_popup_known_gallery@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/magnific_popup-known-gallery-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/magnific_popup-known-gallery-cleanup.sh
- id: magnific-popup-known-style
  input: On this Drupal site, the Article content type has an image field field_mfp_sty rendered with
    the Magnific Popup formatter. Inspect the live display configuration and tell me which image style
    is used for the popup (large) image.
  criteria: The field_mfp_sty component in core.entity_view_display.node.article.default uses type magnific_popup
    with settings.popup_image_style = large (thumbnail_image_style = thumbnail).
  bundle: magnific_popup
  rubric_ref: rubric/magnific_popup_magnific_popup_known_style@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/magnific_popup-known-style-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/magnific_popup-known-style-cleanup.sh
- id: magnific-popup-set-formatter
  input: On this Drupal site, the Article content type has an image field field_mfp_task that currently
    uses the default image formatter on its default view display. Reconfigure that display so the field
    is rendered with the Magnific Popup formatter, grouped as a single gallery of all items. Apply the
    change to the live site.
  criteria: In core.entity_view_display.node.article.default set the field_mfp_task component type to
    magnific_popup with settings.gallery_type = all_items.
  bundle: magnific_popup
  rubric_ref: rubric/magnific_popup_magnific_popup_set_formatter@1.0
  tags:
