metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: bpmn_io
  version: 3.0.x
  note: bpmn_io is a graphical BPMN.io (bpmn-js) editor exposed as a Modeler plugin for modeler_api; model-owner
    modules (ECA, AI Agents) use it to edit their config entities visually. It has no settings form, permissions,
    or config schema. Cases are `recipe` (response-graded) probing documented facts an agent would otherwise
    read source to answer; no site mutation.
questions:
- id: bpmn_io-purpose
  input: On a Drupal 11 site, what does the bpmn_io module provide and which framework does it plug into
    so that ECA models or AI agents can be edited visually?
  criteria: It integrates the bpmn-js (BPMN.io) graphical editor into Drupal's admin UI as a Modeler plugin
    for the modeler_api framework; model-owner modules like ECA and AI Agents use it to edit their config
    entities as BPMN diagrams.
  bundle: bpmn_io
  rubric_ref: rubric/bpmn_io_bpmn_io_purpose@1.0
  tags:
  - mode:recipe
- id: bpmn_io-plugin-type
  input: Does bpmn_io define its own plugin type? Which modeler_api plugin type does it implement, and
    what is the plugin id?
  criteria: It does not define a plugin type; it implements modeler_api's Modeler plugin type (attribute
    Modeler, base ModelerBase, namespace Plugin/ModelerApiModeler) with plugin id `bpmn_io`.
  bundle: bpmn_io
  rubric_ref: rubric/bpmn_io_bpmn_io_plugin_type@1.0
  tags:
  - mode:recipe
- id: bpmn_io-dependency
  input: What Drupal module must be installed for bpmn_io to work, and what is the composer command to
    install bpmn_io?
  criteria: It depends on drupal/modeler_api (modeler_api:modeler_api). Install with `composer require
    drupal/bpmn_io`, which pulls modeler_api, then `drush en bpmn_io -y`.
  bundle: bpmn_io
  rubric_ref: rubric/bpmn_io_bpmn_io_dependency@1.0
  tags:
  - mode:recipe
- id: bpmn_io-theme-requirement
  input: The BPMN.iO modeler shows a warning and won't render under my custom admin theme. Which themes
    does it support by default, and which hook lets me whitelist another theme?
  criteria: By default it supports the Claro and Gin admin themes (or subthemes of them). Implement hook_bpmn_io_supported_themes_alter(array
    &$supported_themes) to add your theme to the list.
  bundle: bpmn_io
  rubric_ref: rubric/bpmn_io_bpmn_io_theme_requirement@1.0
  tags:
  - mode:recipe
- id: bpmn_io-configure
  input: Where is the admin settings form for the bpmn_io module and what permissions does it define?
  criteria: bpmn_io has no admin settings form (configure is null), no permissions, and no config schema
    of its own; you enable it and select it as the modeler from a model-owner module such as ECA or AI
    Agents.
  bundle: bpmn_io
  rubric_ref: rubric/bpmn_io_bpmn_io_configure@1.0
  tags:
  - mode:recipe
- id: bpmn_io-storage-format
  input: In what format does bpmn_io store the diagram, and which service converts that data into modeler_api
    components?
  criteria: Diagrams are stored as BPMN 2.0 XML. The bpmn_io.parser service (Drupal\bpmn_io\Service\Parser)
    parses that XML into modeler_api Component objects and serializes edits back to XML.
  bundle: bpmn_io
  rubric_ref: rubric/bpmn_io_bpmn_io_storage_format@1.0
  tags:
  - mode:recipe
- id: bpmn_io-convert
  input: I have an existing ECA/agent config entity that was created without a diagram. How does bpmn_io
    turn it into a laid-out BPMN model?
  criteria: The Modeler plugin's convert() method renders an empty model and attaches the entity's components/annotations/colors
    as drupalSettings.bpmn_io_convert plus the bpmn_io/convert library, which lays the components out
    on the canvas client-side.
  bundle: bpmn_io
  rubric_ref: rubric/bpmn_io_bpmn_io_convert@1.0
  tags:
  - mode:recipe
- id: bpmn_io-component-mapping
  input: Which BPMN element does bpmn_io map a modeler_api ELEMENT (action) component to, and which BPMN
    element does a LINK (sequence) component map to?
  criteria: An ELEMENT component maps to bpmn:Task and a LINK component maps to bpmn:SequenceFlow (per
    BpmnIo::SUPPORTED_COMPONENT_TYPES; START->bpmn:StartEvent, GATEWAY->bpmn:Gateway, SUBPROCESS->bpmn:SubProcess,
    ANNOTATION->bpmn:TextAnnotation).
  bundle: bpmn_io
  rubric_ref: rubric/bpmn_io_bpmn_io_component_mapping@1.0
  tags:
  - mode:recipe
