metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: time_range
  version: 9.0.x
  note: Time Range provides a single field widget (id time_range, label 'Time range') for the core daterange
    field type. It stores no data of its own - it only changes the manage-form-display widget so that
    a Date range field renders as time-only start/end HTML5 inputs. Its two settings are start_label (default
    'Start time') and end_label (default 'End time'), schema field.widget.settings.time_range. There is
    no configure route, no permissions, no drush. Medium cases create daterange fields on Article with
    the time_range widget configured and ask the agent to read back labels / which field uses the widget;
    hard cases require the agent to switch a field's widget to time_range and to set custom labels, verified
    against the live core.entity_form_display config. All fixtures use namespaced field_tr_* fields on
    the existing Article content type.
questions:
- id: tr-field-type
  input: What core field type does the Drupal time_range module's Time Range widget work with, and what
    does the widget hide compared to the default widget?
  criteria: The Time range widget (id time_range) applies to the core daterange field type (a 'Date range'
    field with the Date and time type). It hides the date element and shows only start-time and end-time
    HTML5 time inputs.
  bundle: time_range
  rubric_ref: rubric/time_range_tr_field_type@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: tr-settings
  input: Which two settings does the time_range field widget expose on the Manage form display page, and
    what do they default to?
  criteria: start_label (default 'Start time') and end_label (default 'End time'); they retitle the start
    and end time inputs. Schema field.widget.settings.time_range.
  bundle: time_range
  rubric_ref: rubric/time_range_tr_settings@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: tr-stores-data
  input: Does the time_range module define its own field type and store time data, or is it only a widget?
    Where does the actual value live?
  criteria: It is only a form widget; it does not define a field type or store data. Storage is provided
    by core's Date range (daterange) field. The widget only changes how the value is entered on the form.
  bundle: time_range
  rubric_ref: rubric/time_range_tr_stores_data@1.0
  tags:
  - mode:recipe
  - difficulty:easy
