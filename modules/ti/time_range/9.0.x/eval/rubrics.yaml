rubrics:
- id: time_range_tr_field_type
  version: '1.0'
  applicable_bundles:
  - time_range
  checks:
  - kind: must_contain_any
    values:
    - daterange
    - datetime_range
    - Date range
    - date element
    - time only
    - time-only
  scoring:
    combine: all_pass
- id: time_range_tr_settings
  version: '1.0'
  applicable_bundles:
  - time_range
  checks:
  - kind: must_contain_any
    values:
    - start_label
    - end_label
    - Start time
    - End time
  scoring:
    combine: all_pass
- id: time_range_tr_stores_data
  version: '1.0'
  applicable_bundles:
  - time_range
  checks:
  - kind: must_contain_any
    values:
    - widget
    - does not store
    - no data
    - core
    - daterange
    - datetime_range
  scoring:
    combine: all_pass
- id: time_range_tr_known_labels
  version: '1.0'
  applicable_bundles:
  - time_range
  checks:
  - kind: must_contain_any
    values:
    - Opens
    - Closes
  scoring:
    combine: all_pass
- id: time_range_tr_which_widget
  version: '1.0'
  applicable_bundles:
  - time_range
  checks:
  - kind: must_contain_any
    values:
    - field_tr_which
  scoring:
    combine: all_pass
- id: time_range_tr_select_widget
  version: '1.0'
  applicable_bundles:
  - time_range
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
- id: time_range_tr_set_labels
  version: '1.0'
  applicable_bundles:
  - time_range
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
