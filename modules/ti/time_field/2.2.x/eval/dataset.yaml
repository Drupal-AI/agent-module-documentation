metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: time_field
  version: 2.2.x
  note: 'Time Field provides two field types (time, time_range) that store a time of day as an integer
    number of seconds past midnight, plus HTML5-time widgets, PHP-date-format-string formatters, a reusable
    #type => ''time'' element, a Time value object, Token support, and a Feeds target. Cases are `recipe`
    (response-graded) probing documented facts an agent would otherwise read source to answer; no site
    mutation.'
questions:
- id: time-field-types
  input: On Drupal 11 I want to store just a time of day (no date) on a content type, and separately an
    opening/closing time range. Which module and which two field types do I use?
  criteria: Use the Time Field module. It provides the 'time' field type for a single time of day and
    the 'time_range' field type for a start/end (from/to) pair.
  bundle: time_field
  rubric_ref: rubric/time_field_time_field_types@1.0
  tags:
  - mode:recipe
- id: time-storage-model
  input: How does Time Field store a time value in the database? What integer would 09:00 be stored as?
  criteria: As an unsigned integer number of seconds elapsed since midnight (0 to 86400). 09:00:00 is
    stored as 32400 (9 * 3600). The time_range field stores 'from' (required) and a nullable 'to'.
  bundle: time_field
  rubric_ref: rubric/time_field_time_storage_model@1.0
  tags:
  - mode:recipe
- id: time-output-format
  input: I want a Time field to display in 24-hour HH:MM form instead of the default 12-hour am/pm. Which
    formatter setting controls this and what is its default?
  criteria: The time_formatter's 'time_format' setting, a PHP date-format string; its default is 'h:i
    a'. Set it to 'H:i' (or 'G:i') for 24-hour output.
  bundle: time_field
  rubric_ref: rubric/time_field_time_output_format@1.0
  tags:
  - mode:recipe
- id: time-range-template
  input: For a time_range field I want output like '9:00 am ~ 5:00 pm'. Which formatter setting defines
    the layout and what placeholder keys must it contain?
  criteria: The time_range_formatter's 'timerange_format' setting (default 'start ~ end'); it must contain
    the literal keys 'start' and 'end', which are replaced by the formatted from/to times. The per-time
    format comes from its 'time_format' setting.
  bundle: time_field
  rubric_ref: rubric/time_field_time_range_template@1.0
  tags:
  - mode:recipe
- id: time-seconds-widget
  input: The Time widget only lets editors pick hours and minutes. How do I let them enter seconds, and
    how do I control the seconds increment?
  criteria: Enable the widget's 'enabled' setting (Add seconds parameter to input widget); the 'step'
    setting (default 5) sets the input's seconds step attribute. Both time_widget and time_range_widget
    share these settings.
  bundle: time_field
  rubric_ref: rubric/time_field_time_seconds_widget@1.0
  tags:
  - mode:recipe
- id: time-default-now
  input: Can a Time field default to the current time when new content is created? How is that configured
    and stored?
  criteria: Yes. The field's default-value form shows a 'Current time' checkbox; when checked the stored
    default is the literal 'now', resolved at entity-create time to request_time minus today-midnight
    (seconds past midnight).
  bundle: time_field
  rubric_ref: rubric/time_field_time_default_now@1.0
  tags:
  - mode:recipe
- id: time-value-object
  input: In custom PHP I have a Time Field value of 34200. Which class do I use to turn it into a formatted
    string, and which method converts a stored value into that object?
  criteria: 'Use the Drupal\time_field\Time value object: Time::createFromTimestamp(34200)->format(''h:i
    a''). Other factories include createFromHtml5Format() and createFromDateTime(); getTimestamp() returns
    seconds-past-midnight.'
  bundle: time_field
  rubric_ref: rubric/time_field_time_value_object@1.0
  tags:
  - mode:recipe
- id: time-form-element
  input: I want a native HTML5 time input in my own custom Drupal form, reusing Time Field. Is there a
    render element for that?
  criteria: 'Yes. Time Field defines a #type => ''time'' form element (TimeElement, @FormElement(''time'')).
    Use it directly in a form array; its value callback returns seconds-past-midnight. Optional ''#show_seconds''
    toggles seconds. Theme hook input__time.'
  bundle: time_field
  rubric_ref: rubric/time_field_time_form_element@1.0
  tags:
  - mode:recipe
- id: time-tokens
  input: Does Time Field expose tokens, and how would I output the 'from' value of a time_range field
    with a custom format?
  criteria: 'Yes, it implements hook_token_info/hook_tokens with ''time'' and ''time_range'' types. Use
    [time_range:from:<format>] (or [time_range:to:<format>]) for a custom PHP date format; [time_range:from]
    defaults to ''g:i a''. For a single time field: [time:<format>].'
  bundle: time_field
  rubric_ref: rubric/time_field_time_tokens@1.0
  tags:
  - mode:recipe
- id: time-dependencies-config
  input: What does Time Field depend on, and is there a central admin settings page or permissions to
    configure?
  criteria: It depends only on core 'datetime' (nothing outside core). There is no global admin settings
    page and no permissions; all configuration is per field via Field UI (widget/formatter settings).
  bundle: time_field
  rubric_ref: rubric/time_field_time_dependencies_config@1.0
  tags:
  - mode:recipe
- id: time-feeds-target
  input: Can I import time-of-day values from a feed into a Time field with the Feeds module? What is
    the mapping target?
  criteria: Yes. Time Field provides a Feeds target 'time_feeds_target' for the 'time' field type; string
    inputs are parsed via Time::createFromHtml5Format() and stored as seconds-past-midnight. Feeds is
    an optional dependency.
  bundle: time_field
  rubric_ref: rubric/time_field_time_feeds_target@1.0
  tags:
  - mode:recipe
- id: time-range-open-ended
  input: For a time_range field, can I leave the end time empty (open-ended range)? How is that stored
    and displayed?
  criteria: Yes. The 'to' column is nullable (empty inputs are saved as NULL via massageFormValues). When
    only 'from' is set the formatter outputs just the start time; when only 'to' is set it outputs just
    the end time.
  bundle: time_field
  rubric_ref: rubric/time_field_time_range_open_ended@1.0
  tags:
  - mode:recipe
