rubrics:
- id: time_field_time_field_types
  version: '1.0'
  applicable_bundles:
  - time_field
  checks:
  - kind: must_contain_any
    values:
    - time_field
    - Time Field
  scoring:
    combine: all_pass
- id: time_field_time_storage_model
  version: '1.0'
  applicable_bundles:
  - time_field
  checks:
  - kind: must_contain_any
    values:
    - seconds past midnight
    - seconds passed through midnight
    - '32400'
  scoring:
    combine: all_pass
- id: time_field_time_output_format
  version: '1.0'
  applicable_bundles:
  - time_field
  checks:
  - kind: must_contain_any
    values:
    - time_format
    - H:i
  scoring:
    combine: all_pass
- id: time_field_time_range_template
  version: '1.0'
  applicable_bundles:
  - time_field
  checks:
  - kind: must_contain_any
    values:
    - timerange_format
    - start ~ end
  scoring:
    combine: all_pass
- id: time_field_time_seconds_widget
  version: '1.0'
  applicable_bundles:
  - time_field
  checks:
  - kind: must_contain_any
    values:
    - enabled
    - step
  scoring:
    combine: all_pass
- id: time_field_time_default_now
  version: '1.0'
  applicable_bundles:
  - time_field
  checks:
  - kind: must_contain_any
    values:
    - Current time
    - now
    - use_current_time
  scoring:
    combine: all_pass
- id: time_field_time_value_object
  version: '1.0'
  applicable_bundles:
  - time_field
  checks:
  - kind: must_contain_any
    values:
    - Drupal\time_field\Time
    - createFromTimestamp
  scoring:
    combine: all_pass
- id: time_field_time_form_element
  version: '1.0'
  applicable_bundles:
  - time_field
  checks:
  - kind: must_contain_any
    values:
    - '''time'''
    - '#type'
    - input__time
  scoring:
    combine: all_pass
- id: time_field_time_tokens
  version: '1.0'
  applicable_bundles:
  - time_field
  checks:
  - kind: must_contain_any
    values:
    - time_range:from
    - '[time_range:from'
  scoring:
    combine: all_pass
- id: time_field_time_dependencies_config
  version: '1.0'
  applicable_bundles:
  - time_field
  checks:
  - kind: must_contain_any
    values:
    - datetime
    - 'no'
    - per field
    - Field UI
  scoring:
    combine: all_pass
- id: time_field_time_feeds_target
  version: '1.0'
  applicable_bundles:
  - time_field
  checks:
  - kind: must_contain_any
    values:
    - time_feeds_target
    - FeedsTarget
  scoring:
    combine: all_pass
- id: time_field_time_range_open_ended
  version: '1.0'
  applicable_bundles:
  - time_field
  checks:
  - kind: must_contain_any
    values:
    - 'null'
    - nullable
    - to
  scoring:
    combine: all_pass
