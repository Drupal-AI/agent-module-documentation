metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: tinypng
  version: 2.0.x
  note: TinyPNG integrates the external TinyPNG/Tinify API via the tinify/tinify lib. Config object tinypng.settings
    (api_key, on_upload, upload_method upload|download, image_action); settings form tinypng.settings.form
    at /admin/config/tinypng, permission 'administer tynipng' (literal misspelling). Per-image-style compression
    is the third-party setting image.style.<name>.third_party.tinypng.tinypng_compress (checkbox shown
    only when image_action on + api_key set); a RouteSubscriber compresses flagged style derivatives.
    Services tinypng.compress (TinyPng), tinypng.image_handler. No Drush, no plugin types. Because the
    real API needs a key the agent won't have, ALL evals are grounded in local config/third-party settings
    only — no image is actually sent to TinyPNG.
questions:
- id: tinypng-settings-location
  input: On a Drupal site with the tinypng module enabled, where do I set the TinyPNG API key, what config
    object stores it, and which permission controls that settings page?
  criteria: 'Set it on the TinyPNG settings form at /admin/config/tinypng (route tinypng.settings.form),
    stored as tinypng.settings.api_key. The page is gated by the permission ''administer tynipng'' (note:
    that id is misspelled in the module).'
  bundle: tinypng
  rubric_ref: rubric/tinypng_tinypng_settings_location@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: tinypng-compress-image-style
  input: With the tinypng module, how do I make just one image style's derivatives get compressed by TinyPNG,
    and where is that choice stored?
  criteria: 'Enable the ''Enable TinyPNG image action'' (image_action) setting and set an API key; then
    on the image style''s edit form tick ''Compress with TinyPNG''. It is stored as a third-party setting
    image.style.<name>.third_party.tinypng.tinypng_compress: true. A route subscriber compresses that
    style''s derivatives.'
  bundle: tinypng
  rubric_ref: rubric/tinypng_tinypng_compress_image_style@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: tinypng-upload-methods
  input: The tinypng module offers an 'Integration Method' setting with two options for compressing on
    upload. What are they (config key upload_method) and when do you pick each?
  criteria: upload_method is 'upload' or 'download'. 'upload' sends the image bytes to TinyPNG (required
    on localhost / non-public sites); 'download' gives TinyPNG a public URL to fetch the image (requires
    the site to be reachable from the internet). It applies when 'Compress on upload' (on_upload) is enabled.
  bundle: tinypng
  rubric_ref: rubric/tinypng_tinypng_upload_methods@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: tinypng-which-settings
  input: On this Drupal site, inspect the live tinypng configuration and report whether images are compressed
    on upload and which integration/upload method is set.
  criteria: 'tinypng.settings has on_upload = true (compress on upload enabled) and upload_method = ''download''.
    Discoverable via `drush cget tinypng.settings` (on_upload: true, upload_method: download).'
  bundle: tinypng
  rubric_ref: rubric/tinypng_tinypng_which_settings@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/tinypng-settings-intro-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/tinypng-settings-intro-cleanup.sh
- id: tinypng-which-style
  input: On this Drupal site, one image style is configured to have its derivatives compressed by TinyPNG.
    Inspect the live image style configuration and give the machine name of that image style.
  criteria: 'The image style tinypng_intro carries the third-party setting tinypng.tinypng_compress: true.
    Discoverable via `drush cget image.style.tinypng_intro` (third_party_settings.tinypng.tinypng_compress:
    true) or ImageStyle::load(''tinypng_intro'')->getThirdPartySetting(''tinypng'',''tinypng_compress'').'
  bundle: tinypng
  rubric_ref: rubric/tinypng_tinypng_which_style@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/tinypng-style-intro-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/tinypng-style-intro-cleanup.sh
- id: tinypng-enable-style-compression
  input: On this Drupal site there is an image style named tinypng_task. Using the tinypng module, configure
    that image style so its derivatives are compressed with TinyPNG. Apply the change to the live site
    (you do not need a working API key for this configuration step).
  criteria: The image style tinypng_task carries third-party setting tinypng.tinypng_compress = TRUE,
    e.g. ImageStyle::load('tinypng_task')->setThirdPartySetting('tinypng','tinypng_compress',TRUE)->save(),
    or tick 'Compress with TinyPNG' on its edit form.
  bundle: tinypng
  rubric_ref: rubric/tinypng_tinypng_enable_style_compression@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/tinypng-compress-style-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/tinypng-compress-style-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/tinypng-compress-style-verify.sh
- id: tinypng-enable-style-compression-layman
  input: I have an image preset called tinypng_task on my Drupal site and I want the pictures it produces
    to be squished smaller by TinyPNG. Please turn that on for this preset and save it. (No need for a
    real TinyPNG account key for this step.)
  criteria: 'Same end state as the expert phrasing: image style tinypng_task has third-party setting tinypng.tinypng_compress
    = TRUE.'
  bundle: tinypng
  rubric_ref: rubric/tinypng_tinypng_enable_style_compression_layman@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: site-owner
    reset: agent-module-documentation/evaluation/verify/tinypng-compress-style-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/tinypng-compress-style-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/tinypng-compress-style-verify.sh
