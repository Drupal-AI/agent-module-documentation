metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: tiny_slider
  version: 1.1.x
  note: 'Integrates Tiny Slider 2. No configure route. Field formatter id ''tiny_slider_field_formatter''
    (label ''Tiny Slider Carousel'', field types image + entity_reference), Views style id ''tiny_slider''.
    Drush command tiny_slider:download / ts:dl fetches the JS library into /libraries/tiny-slider (library
    is NOT bundled; hook_requirements warns if missing, but display config can still be set). Shared option
    keys from TinySliderGlobal::defaultSettings(): items, gutter, mode, nav, autoplay(+hoverPause/buttonOutput),
    controls, slideBy, loop, center, speed, responsive items, advancedMode+configJson. Formatter settings
    live in entity_view_display; Views options in the view entity. Medium reads a seeded formatter (items=5);
    hard switches a field''s formatter to tiny_slider and reconfigures items/autoplay, verified against
    the live entity_view_display.'
questions:
- id: tiny_slider-formatter-id
  input: I want to display a multi-value image field as a carousel on a Drupal site using the tiny_slider
    module. Which field formatter do I choose and which field types does it support?
  criteria: On Manage display pick the 'Tiny Slider Carousel' formatter (id tiny_slider_field_formatter).
    It supports image and entity_reference fields. There is also a 'TinySlider' Views style (id tiny_slider)
    for view rows.
  bundle: tiny_slider
  rubric_ref: rubric/tiny_slider_tiny_slider_formatter_id@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: tiny_slider-install-library
  input: After enabling tiny_slider the slider does not initialize and there is a requirements error about
    the library. How do I install the Tiny Slider JS library, including any drush command?
  criteria: The Tiny Slider JS library is not bundled; it must be placed in /libraries/tiny-slider. Run
    drush tiny_slider:download (alias ts:dl) to fetch and extract it there, or download the release manually.
    hook_requirements() clears once /libraries/tiny-slider/dist/tiny-slider.js exists.
  bundle: tiny_slider
  rubric_ref: rubric/tiny_slider_tiny_slider_install_library@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: tiny_slider-options
  input: In the tiny_slider formatter/Views style, which option controls how many slides are visible and
    how do I turn on auto-advance? Is there a way to pass raw Tiny Slider options the form does not expose?
  criteria: The 'items' option sets how many slides show; 'autoplay' turns on auto-advance. For anything
    the form omits, enable advancedMode and paste a raw Tiny Slider JSON options object into configJson,
    which overrides the individual settings when it is valid JSON.
  bundle: tiny_slider
  rubric_ref: rubric/tiny_slider_tiny_slider_options@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: tiny_slider-known-items
  input: On this Drupal site the Article content type has an image field field_ts_known displayed with
    the Tiny Slider formatter. Inspect the live default view display and report how many items (slides)
    it is configured to show.
  criteria: In core.entity_view_display.node.article.default the field_ts_known component uses formatter
    tiny_slider_field_formatter with settings.items = 5.
  bundle: tiny_slider
  rubric_ref: rubric/tiny_slider_tiny_slider_known_items@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/tiny_slider-known-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/tiny_slider-known-cleanup.sh
- id: tiny_slider-known-formatter
  input: The Article field field_ts_known on this site is rendered as a slider. Inspect the live display
    configuration and name the exact field formatter plugin applied to it.
  criteria: The field_ts_known component in node.article.default uses formatter type tiny_slider_field_formatter
    (label 'Tiny Slider Carousel').
  bundle: tiny_slider
  rubric_ref: rubric/tiny_slider_tiny_slider_known_formatter@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/tiny_slider-known-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/tiny_slider-known-cleanup.sh
- id: tiny_slider-apply-formatter
  input: On this Drupal site the Article content type has an image field field_ts_task currently shown
    with the core Image formatter. Using tiny_slider, change its default display to render as a Tiny Slider
    carousel (tiny_slider_field_formatter) and save it to the live site.
  criteria: In core.entity_view_display.node.article.default the field_ts_task component type is set to
    tiny_slider_field_formatter (set the formatter on Manage display or via the entity_view_display and
    save).
  bundle: tiny_slider
  rubric_ref: rubric/tiny_slider_tiny_slider_apply_formatter@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/tiny_slider-apply-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/tiny_slider-apply-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/tiny_slider-apply-verify.sh
- id: tiny_slider-tune-options
  input: The Article field field_ts_tune on this site already uses the Tiny Slider formatter, currently
    showing 1 item with autoplay off. Reconfigure it to show 4 items and enable autoplay, and apply the
    change to the live site.
  criteria: In node.article.default the field_ts_tune tiny_slider_field_formatter settings set items =
    4 and autoplay = true, saved to the live display.
  bundle: tiny_slider
  rubric_ref: rubric/tiny_slider_tiny_slider_tune_options@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/tiny_slider-tune-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/tiny_slider-tune-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/tiny_slider-tune-verify.sh
