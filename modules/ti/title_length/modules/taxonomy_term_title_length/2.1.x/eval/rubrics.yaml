rubrics:
- id: taxonomy_term_title_length_taxonomy_term_title_length_default_recipe
  version: '1.0'
  applicable_bundles:
  - taxonomy_term_title_length
  checks:
  - kind: must_contain_any
    values:
    - '500'
    - taxonomy_term_title_length_chars
    - settings.php
    - title_length:update
  scoring:
    combine: all_pass
- id: taxonomy_term_title_length_taxonomy_term_title_length_mechanism_recipe
  version: '1.0'
  applicable_bundles:
  - taxonomy_term_title_length
  checks:
  - kind: must_contain_any
    values:
    - taxonomy_term_field_data
    - name
    - changeField
    - changeLength
    - taxonomy_term_title_length.taxonomy_term
  scoring:
    combine: all_pass
- id: taxonomy_term_title_length_taxonomy_term_title_length_uninstall_recipe
  version: '1.0'
  applicable_bundles:
  - taxonomy_term_title_length
  checks:
  - kind: must_contain_any
    values:
    - '255'
    - ModuleUninstallValidatorException
    - shrink
    - longer than 255
  scoring:
    combine: all_pass
- id: taxonomy_term_title_length_taxonomy_term_title_length_width_introspect
  version: '1.0'
  applicable_bundles:
  - taxonomy_term_title_length
  checks:
  - kind: must_contain_any
    values:
    - '777'
  scoring:
    combine: all_pass
- id: taxonomy_term_title_length_taxonomy_term_title_length_widen_execute
  version: '1.0'
  applicable_bundles:
  - taxonomy_term_title_length
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
