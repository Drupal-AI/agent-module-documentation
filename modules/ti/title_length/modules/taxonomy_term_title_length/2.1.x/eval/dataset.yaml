metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: taxonomy_term_title_length
  version: 2.1.x
  note: 'taxonomy_term_title_length is the title_length submodule that widens the taxonomy term ''name''
    column beyond core''s 255 (default 500). Concrete subclass Drupal\taxonomy_term_title_length\TaxonomyTermTitleLength
    extends EntityTitleLength (entity ''taxonomy_term'', field ''name''); service id taxonomy_term_title_length.taxonomy_term.
    getLength() = Settings::get(''taxonomy_term_title_length_chars'') ?: 500; changeLength() runs Schema::changeField()
    on the term data table (taxonomy_term_field_data.name, and the revision table when revisionable) and
    re-installs the name base-field storage definition. A hook_entity_base_field_info_alter() sets the
    runtime name max_length to getLength(). No UI/config object/permissions. Tiers read/verify the REAL
    taxonomy_term_field_data.name column width (the base-field max_length mirrors getLength() via the
    hook, so the schema column is the source of truth). This is a trivial glue submodule, so it uses 3
    easy / 1 medium / 1 hard.'
questions:
- id: taxonomy_term_title_length-default-recipe
  input: After enabling the Drupal taxonomy_term_title_length module, how long can taxonomy term names
    be by default, and how do I change that limit?
  criteria: Default is 500 characters (EntityTitleLengthInterface::DEFAULT_LENGTH). Override it with $settings['taxonomy_term_title_length_chars']
    = <n>; in settings.php, then re-apply with `drush title_length:update taxonomy_term`.
  bundle: taxonomy_term_title_length
  rubric_ref: rubric/taxonomy_term_title_length_taxonomy_term_title_length_default_recipe@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: taxonomy_term_title_length-mechanism-recipe
  input: How does taxonomy_term_title_length make taxonomy term names longer — which entity, field, database
    column and service/hook are involved?
  criteria: It targets entity taxonomy_term, field 'name'. On install the taxonomy_term_title_length.taxonomy_term
    service's changeLength() runs Schema::changeField() to widen the term name column (taxonomy_term_field_data.name,
    plus the revision table) and re-installs the name base-field storage definition; a hook_entity_base_field_info_alter()
    sets the runtime name max_length to getLength().
  bundle: taxonomy_term_title_length
  rubric_ref: rubric/taxonomy_term_title_length_taxonomy_term_title_length_mechanism_recipe@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: taxonomy_term_title_length-uninstall-recipe
  input: What happens to taxonomy term names if I uninstall taxonomy_term_title_length, and when is the
    uninstall blocked?
  criteria: Uninstall shrinks the term name column back to 255 (ORIGINAL_LENGTH). It first calls checkIfExistEntitiesWithLongTitles()
    and throws ModuleUninstallValidatorException if any taxonomy term or term revision already has a name
    longer than 255 (shorten or delete those first).
  bundle: taxonomy_term_title_length
  rubric_ref: rubric/taxonomy_term_title_length_taxonomy_term_title_length_uninstall_recipe@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: taxonomy_term_title_length-width-introspect
  input: On this Drupal site the maximum taxonomy term name length has been changed from the module default.
    Inspect the live database schema and report the current maximum length of the taxonomy term name column.
  criteria: The taxonomy_term_field_data.name column is varchar(777). Read information_schema.COLUMNS
    for TABLE_NAME='taxonomy_term_field_data', COLUMN_NAME='name' (the base-field max_length also reports
    777 via the runtime hook, but the schema column is the source of truth).
  bundle: taxonomy_term_title_length
  rubric_ref: rubric/taxonomy_term_title_length_taxonomy_term_title_length_width_introspect@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/taxonomy_term_title_length-width-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/taxonomy_term_title_length-width-cleanup.sh
- id: taxonomy_term_title_length-widen-execute
  input: On this Drupal site, taxonomy term names are currently capped at 255 characters. Using the taxonomy_term_title_length
    module, make term names able to store up to 620 characters and apply the change to the database.
  criteria: Widen the term name column to 620, e.g. \Drupal::service('taxonomy_term_title_length.taxonomy_term')->changeLength(620);
    or $settings['taxonomy_term_title_length_chars']=620 in settings.php then `drush title_length:update
    taxonomy_term`. Verify checks taxonomy_term_field_data.name CHARACTER_MAXIMUM_LENGTH === 620.
  bundle: taxonomy_term_title_length
  rubric_ref: rubric/taxonomy_term_title_length_taxonomy_term_title_length_widen_execute@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/taxonomy_term_title_length-widen-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/taxonomy_term_title_length-widen-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/taxonomy_term_title_length-widen-verify.sh
