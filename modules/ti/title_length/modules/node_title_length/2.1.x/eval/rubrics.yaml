rubrics:
- id: node_title_length_node_title_length_default_recipe
  version: '1.0'
  applicable_bundles:
  - node_title_length
  checks:
  - kind: must_contain_any
    values:
    - '500'
    - node_title_length_chars
    - settings.php
    - title_length:update
  scoring:
    combine: all_pass
- id: node_title_length_node_title_length_mechanism_recipe
  version: '1.0'
  applicable_bundles:
  - node_title_length
  checks:
  - kind: must_contain_any
    values:
    - node_field_data
    - changeField
    - changeLength
    - entity_base_field_info_alter
    - node_title_length.node
  scoring:
    combine: all_pass
- id: node_title_length_node_title_length_uninstall_recipe
  version: '1.0'
  applicable_bundles:
  - node_title_length
  checks:
  - kind: must_contain_any
    values:
    - '255'
    - ModuleUninstallValidatorException
    - shrink
    - longer than 255
  scoring:
    combine: all_pass
- id: node_title_length_node_title_length_width_introspect
  version: '1.0'
  applicable_bundles:
  - node_title_length
  checks:
  - kind: must_contain_any
    values:
    - '823'
  scoring:
    combine: all_pass
- id: node_title_length_node_title_length_width_small_introspect
  version: '1.0'
  applicable_bundles:
  - node_title_length
  checks:
  - kind: must_contain_any
    values:
    - '384'
  scoring:
    combine: all_pass
- id: node_title_length_node_title_length_widen_execute
  version: '1.0'
  applicable_bundles:
  - node_title_length
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
- id: node_title_length_node_title_length_revision_execute
  version: '1.0'
  applicable_bundles:
  - node_title_length
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
