metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: time_formatter
  version: 2.0.x
  note: 'Time Formatter provides one field formatter plugin, number_time (''Time''), for integer/decimal/float
    fields. It interprets the numeric value as seconds or milliseconds and renders a time string. Settings
    (config schema field.formatter.settings.number_time): storage (0=Seconds,1=Milliseconds; default 1),
    display (0=''123h 59m 59s 999ms'',1=''123h 59m 59s'',2=''123:59:59.999'',3=''123:59:59''; default
    2), hours (0=Always,1=Optional,2=Never; default 0). No settings page, permission, drush, or plugin
    type. Cases are grounded in that real formatter config on an entity_view_display: introspection reads
    back the formatter/settings on a live field display; execution applies the number_time formatter to
    a field and changes its settings, verified against the live view display config.'
questions:
- id: time_formatter-what
  input: I have an integer field on a Drupal 11 site that stores a duration. Which formatter does the
    time_formatter module add to display it as a time, and which field types can use it?
  criteria: The 'Time' formatter (plugin id number_time), available on integer, decimal and float fields.
    Set it as the field's format on Manage display to render the number as a time string.
  bundle: time_formatter
  rubric_ref: rubric/time_formatter_time_formatter_what@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: time_formatter-settings
  input: What settings does the time_formatter 'Time' (number_time) formatter offer, and what does the
    storage setting mean?
  criteria: 'Three settings: storage (Seconds vs Milliseconds - how to interpret the stored number, default
    Milliseconds), display (the output format, e.g. 123h 59m 59s 999ms / 123:59:59.999 / 123:59:59), and
    hours (Always / Optional / Never).'
  bundle: time_formatter
  rubric_ref: rubric/time_formatter_time_formatter_settings@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: time_formatter-formats
  input: Which display formats can the time_formatter number_time formatter produce, and which of its
    formats include milliseconds?
  criteria: 'Four display options: ''123h 59m 59s 999ms'' (0) and ''123:59:59.999'' (2) include milliseconds;
    ''123h 59m 59s'' (1) and ''123:59:59'' (3) drop them. Default is ''123:59:59.999''.'
  bundle: time_formatter
  rubric_ref: rubric/time_formatter_time_formatter_formats@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: time_formatter-probe
  input: On this Drupal site, the Article field field_tf_probe is displayed with the time_formatter module.
    Inspect the live default view display and state which formatter plugin id is configured for that field.
  criteria: The formatter is number_time ('Time'), from core.entity_view_display.node.article.default
    -> content.field_tf_probe.type (settings storage=0/Seconds, display=3).
  bundle: time_formatter
  rubric_ref: rubric/time_formatter_time_formatter_probe@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
