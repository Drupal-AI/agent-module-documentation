metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: jquery_downgrade
  version: 1.0.x
  note: jQuery Downgrade swaps Drupal 11's jQuery 4 for jQuery 3 (CDN 3.6.4) on selected nodes, Views
    pages, or themes. It has one config object jquery_downgrade.settings (keys node_ids [ints], view_routes
    [strings], enable_theme_downgrade [bool], downgrade_themes [strings]), one settings form at route
    jquery_downgrade.settings (/admin/config/development/jquery-downgrade, permission 'administer site
    configuration'), one OOP hook JQueryDowngradeHooks::alterAttachments() implementing hook_page_attachments_alter
    (unsets core/jquery, attaches jquery_downgrade/jquery_legacy), and one library jquery_legacy. No permissions
    of its own, no Drush, no plugin types. Medium/hard cases are grounded in the real jquery_downgrade.settings
    config object; the module ships no config/install so baseline is empty lists.
questions:
- id: jquery_downgrade-config-object
  input: Using the jquery_downgrade module on Drupal 11, what config object holds its settings and what
    are the keys that decide where jQuery 3 is loaded instead of jQuery 4?
  criteria: The config object is jquery_downgrade.settings, with keys node_ids (node IDs), view_routes
    (Views page route names), enable_theme_downgrade (bool) and downgrade_themes (theme machine names).
  bundle: jquery_downgrade
  rubric_ref: rubric/jquery_downgrade_jquery_downgrade_config_object@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: jquery_downgrade-mechanism
  input: How does the jquery_downgrade module actually replace jQuery 4 with jQuery 3 on a matching page?
    Which hook does it use and what does it do to the page's libraries?
  criteria: 'Its OOP hook JQueryDowngradeHooks::alterAttachments() implements hook_page_attachments_alter():
    when the current node/route/theme matches, it unsets the core/jquery library and attaches jquery_downgrade/jquery_legacy
    (jQuery 3.6.4 from code.jquery.com).'
  bundle: jquery_downgrade
  rubric_ref: rubric/jquery_downgrade_jquery_downgrade_mechanism@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: jquery_downgrade-configure-route
  input: Where is the jquery_downgrade settings form (path and permission)?
  criteria: The form is at /admin/config/development/jquery-downgrade (route jquery_downgrade.settings),
    gated by the 'administer site configuration' permission.
  bundle: jquery_downgrade
  rubric_ref: rubric/jquery_downgrade_jquery_downgrade_configure_route@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: jquery_downgrade-known
