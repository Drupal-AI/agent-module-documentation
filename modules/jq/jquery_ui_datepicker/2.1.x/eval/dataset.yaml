metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: jquery_ui_datepicker
  version: 2.1.x
  note: jquery_ui_datepicker is a thin asset/library provider that re-supplies the jQuery UI Datepicker
    library after core removed it. It has no config UI, permissions, services, or PHP API, so all cases
    are `recipe` (response-graded), not `execution` (live-state).
questions:
- id: jqueryuidatepicker-attach-library
  input: In a Drupal 11 module I have a render array and I want to attach the jQuery UI Datepicker asset
    library provided by the jquery_ui_datepicker module so the widget's JS/CSS load. Show the exact line
    to add.
  criteria: 'Add to the render array: $build[''#attached''][''library''][] = ''jquery_ui_datepicker/datepicker'';'
  bundle: jquery_ui_datepicker
  rubric_ref: rubric/jquery_ui_datepicker_jqueryuidatepicker_attach_library@1.0
  tags:
  - mode:recipe
- id: jqueryuidatepicker-library-name
  input: What is the exact Drupal asset library identifier (module/library form) that the jquery_ui_datepicker
    module declares for the jQuery UI Datepicker component?
  criteria: The library id is jquery_ui_datepicker/datepicker.
  bundle: jquery_ui_datepicker
  rubric_ref: rubric/jquery_ui_datepicker_jqueryuidatepicker_library_name@1.0
  tags:
  - mode:recipe
- id: jqueryuidatepicker-purpose
  input: Why would I install the jquery_ui_datepicker contrib module on a Drupal 10 or 11 site? What problem
    does it solve?
  criteria: jQuery UI was deprecated and progressively removed from Drupal core; this module re-provides
    the jQuery UI Datepicker asset library so legacy code that relies on it keeps working on Drupal 9.2+/10/11.
  bundle: jquery_ui_datepicker
  rubric_ref: rubric/jquery_ui_datepicker_jqueryuidatepicker_purpose@1.0
  tags:
  - mode:recipe
- id: jqueryuidatepicker-dependency
  input: Which Drupal module does jquery_ui_datepicker depend on to supply the underlying vendored jQuery
    UI files?
  criteria: It depends on the base jquery_ui module (composer drupal/jquery_ui), which vendors the core
    jQuery UI files.
  bundle: jquery_ui_datepicker
  rubric_ref: rubric/jquery_ui_datepicker_jqueryuidatepicker_dependency@1.0
  tags:
  - mode:recipe
- id: jqueryuidatepicker-theme-libraries-yml
  input: In my theme's *.libraries.yml I want one of my theme libraries to pull in the jQuery UI Datepicker
    library from the jquery_ui_datepicker module as a dependency. What dependency string do I reference?
  criteria: 'Reference jquery_ui_datepicker/datepicker under the dependencies: key of your theme/module
    library.'
  bundle: jquery_ui_datepicker
  rubric_ref: rubric/jquery_ui_datepicker_jqueryuidatepicker_theme_libraries_yml@1.0
  tags:
  - mode:recipe
- id: jqueryuidatepicker-no-config
  input: I enabled jquery_ui_datepicker and I'm looking for its configuration/settings page and permissions
    to set up the datepicker. Where are they?
  criteria: There are none — the module is a library-only compatibility shim with no config UI, permissions,
    services, or PHP API. You just enable it and attach the library.
  bundle: jquery_ui_datepicker
  rubric_ref: rubric/jquery_ui_datepicker_jqueryuidatepicker_no_config@1.0
  tags:
  - mode:recipe
- id: jqueryuidatepicker-page-attachments
  input: In a custom Drupal module, how can I make the jQuery UI Datepicker library available site-wide
    by attaching it in a hook? Name the hook and show attaching the library.
  criteria: Implement hook_page_attachments() and add $attachments['#attached']['library'][] = 'jquery_ui_datepicker/datepicker';
  bundle: jquery_ui_datepicker
  rubric_ref: rubric/jquery_ui_datepicker_jqueryuidatepicker_page_attachments@1.0
  tags:
  - mode:recipe
