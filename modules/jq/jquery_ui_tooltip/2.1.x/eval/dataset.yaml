metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: jquery_ui_tooltip
  version: 2.1.x
  note: jquery_ui_tooltip is a passive asset/library provider (no config UI, no permissions, no services,
    no config schema) that ships only an .info.yml; the tooltip library is registered by the jquery_ui
    base module's hook_library_info_alter(). All cases are `recipe` (response-graded), not `execution`
    (live-state). Facts are grounded in data.json, usage.md, agent/start.md and agent/theming/jquery_ui_tooltip.md.
questions:
- id: jquerytooltip-why-exists
  input: On a Drupal 11 site, why would I install the contrib `jquery_ui_tooltip` module? What does it
    actually provide?
  criteria: It re-provides the single jQuery UI Tooltip widget as an attachable asset library after jQuery
    UI was deprecated and removed from Drupal core, so existing code that calls .tooltip() keeps working.
    It is not a feature/config module.
  bundle: jquery_ui_tooltip
  rubric_ref: rubric/jquery_ui_tooltip_jquerytooltip_why_exists@1.0
  tags:
  - mode:recipe
- id: jquerytooltip-attach-library
  input: In a Drupal 11 render array I need the jQuery UI tooltip widget. Give the exact `#attached` line
    to attach it.
  criteria: $build['#attached']['library'][] = 'jquery_ui_tooltip/tooltip';
  bundle: jquery_ui_tooltip
  rubric_ref: rubric/jquery_ui_tooltip_jquerytooltip_attach_library@1.0
  tags:
  - mode:recipe
- id: jquerytooltip-library-id
  input: What is the machine name of the library this module makes available to attach?
  criteria: The attachable library id is jquery_ui_tooltip/tooltip (vendored jQuery UI 1.13.2 tooltip-min.js
    plus base-theme tooltip.css).
  bundle: jquery_ui_tooltip
  rubric_ref: rubric/jquery_ui_tooltip_jquerytooltip_library_id@1.0
  tags:
  - mode:recipe
- id: jquerytooltip-jquery-ui-dependency
  input: Does jquery_ui_tooltip work on its own, or does it require another module?
  criteria: It hard-depends on the jquery_ui base module (>=8.x-1.7 / drupal/jquery_ui ^1.7); the tooltip
    library's dependencies (jquery_ui/widget, jquery_ui/position and internal jquery_ui helpers) come
    from that module, so jquery_ui must be enabled.
  bundle: jquery_ui_tooltip
  rubric_ref: rubric/jquery_ui_tooltip_jquerytooltip_jquery_ui_dependency@1.0
  tags:
  - mode:recipe
- id: jquerytooltip-depend-in-libraries-yml
  input: In my own module's *.libraries.yml, how do I make my JS library pull in the jQuery UI tooltip
    widget? Show the YAML.
  criteria: Under your library's `dependencies:` list `- jquery_ui_tooltip/tooltip`; Drupal loads the
    widget JS/CSS and its jquery_ui dependency chain in order.
  bundle: jquery_ui_tooltip
  rubric_ref: rubric/jquery_ui_tooltip_jquerytooltip_depend_in_libraries_yml@1.0
  tags:
  - mode:recipe
- id: jquerytooltip-no-config-surface
  input: Where is the configuration/settings page for jquery_ui_tooltip, and what permissions does it
    add?
  criteria: 'There is none: jquery_ui_tooltip has no configuration UI, no permissions, no services and
    no config schema. You enable it and attach the jquery_ui_tooltip/tooltip library.'
  bundle: jquery_ui_tooltip
  rubric_ref: rubric/jquery_ui_tooltip_jquerytooltip_no_config_surface@1.0
  tags:
  - mode:recipe
- id: jquerytooltip-where-defined
  input: This module ships only an .info.yml with no *.libraries.yml. So where does the `tooltip` library
    definition actually come from?
  criteria: The jquery_ui base module's hook_library_info_alter() reads jquery_ui.libraries.data.json
    and registers the tooltip definition under this module's jquery_ui_tooltip namespace; jquery_ui_tooltip
    itself carries only an .info.yml.
  bundle: jquery_ui_tooltip
  rubric_ref: rubric/jquery_ui_tooltip_jquerytooltip_where_defined@1.0
  tags:
  - mode:recipe
- id: jquerytooltip-migrate-core-ref
  input: My legacy code references the old core `core/jquery.ui.tooltip` library and I get deprecation
    errors. What do I replace it with?
  criteria: Replace core/jquery.ui.tooltip with jquery_ui_tooltip/tooltip (with the jquery_ui base module
    enabled).
  bundle: jquery_ui_tooltip
  rubric_ref: rubric/jquery_ui_tooltip_jquerytooltip_migrate_core_ref@1.0
  tags:
  - mode:recipe
