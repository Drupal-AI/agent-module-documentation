metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: jquery_minicolors
  version: 2.1.x
  note: 'jQuery MiniColors provides one field widget ''jquery_minicolors_widget'' (extends core StringTextfieldWidget)
    for ''string'' (Text plain) fields; the color is stored as a plain string. Per-field state is the
    entity_form_display component: type=jquery_minicolors_widget plus widget settings (control, format
    hex/rgb, swatches, position, theme, ...) under field.widget.settings.jquery_minicolors_widget. It
    needs the external jQuery MiniColors JS library at /libraries/jquery-minicolors (front-end only; irrelevant
    to config verification). No config object, no permissions, no Drush, no plugin type. Medium cases
    seed a real string field using the widget (and a known format setting); hard cases require switching
    a string field''s widget to jquery_minicolors_widget, verified against the live form display.'
questions:
- id: jqmc-field-type-widget
  input: Which Drupal field type can the jQuery MiniColors color-picker widget be used on, and what is
    the widget's plugin id?
  criteria: The widget id is jquery_minicolors_widget; it works on 'string' (Text plain) fields (it extends
    core's StringTextfieldWidget) and stores the color as a plain string.
  bundle: jquery_minicolors
  rubric_ref: rubric/jquery_minicolors_jqmc_field_type_widget@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: jqmc-library-requirement
  input: The jQuery MiniColors picker isn't showing up on my color field. What external library does the
    module need and where must it be installed?
  criteria: It needs the jQuery MiniColors JS library (v2.2.4) installed at /libraries/jquery-minicolors/,
    with jquery.minicolors.min.js and jquery.minicolors.css present. hook_requirements() reports it on
    /admin/reports/status if missing.
  bundle: jquery_minicolors
  rubric_ref: rubric/jquery_minicolors_jqmc_library_requirement@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: jqmc-settings
  input: Name some of the settings you can configure on the jQuery MiniColors field widget (for example,
    to choose the color notation or show preset colors).
  criteria: Settings include control (hue/brightness/saturation/wheel), format (hex/rgb), opacity, swatches
    (preset colors), position, theme (default/bootstrap), inline, letter_case, animation/show/hide speeds,
    change_delay, keywords, plus core size/placeholder.
  bundle: jquery_minicolors
  rubric_ref: rubric/jquery_minicolors_jqmc_settings@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: jqmc-known-field
  input: On this Drupal site, the Article content type has one field whose edit widget is the jQuery MiniColors
    color picker. Inspect the live default form display for Article and give the machine name of that
    field.
  criteria: 'field_jqmc_known — in core.entity_form_display.node.article.default its component has type:
    jquery_minicolors_widget.'
  bundle: jquery_minicolors
  rubric_ref: rubric/jquery_minicolors_jqmc_known_field@1.0
  tags:
  - mode:introspection
