    cleanup: agent-module-documentation/evaluation/verify/jquery_minicolors-known-field-cleanup.sh
- id: jqmc-known-format
  input: The Article field 'field_jqmc_fmt' uses the jQuery MiniColors widget on this site. Inspect the
    live form-display configuration and state which color format (notation) that widget is configured
    to use.
