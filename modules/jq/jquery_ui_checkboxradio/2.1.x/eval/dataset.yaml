metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: jquery_ui_checkboxradio
  version: 2.1.x
  note: jquery_ui_checkboxradio is a passive asset/library provider (no config UI, no permissions, no
    services, no .module or .libraries.yml of its own), so all cases are `recipe` (response-graded), not
    `execution` (live-state). Facts are grounded in data.json, usage.md, and agent/theming/jquery_ui_checkboxradio.md.
questions:
- id: checkboxradio-why-exists
  input: On a Drupal 11 site, why would I install the contrib `jquery_ui_checkboxradio` module? What does
    it actually provide?
  criteria: It re-provides the single jQuery UI Checkboxradio widget asset library as a contrib module
    after jQuery UI was deprecated and removed from Drupal core, so existing themes/modules keep working.
    It has no config, permissions or services.
  bundle: jquery_ui_checkboxradio
  rubric_ref: rubric/jquery_ui_checkboxradio_checkboxradio_why_exists@1.0
  tags:
  - mode:recipe
- id: checkboxradio-library-id
  input: What is the exact library id provided for the jQuery UI Checkboxradio widget?
  criteria: jquery_ui_checkboxradio/checkboxradio
  bundle: jquery_ui_checkboxradio
  rubric_ref: rubric/jquery_ui_checkboxradio_checkboxradio_library_id@1.0
  tags:
  - mode:recipe
- id: checkboxradio-attach-attached
  input: In a Drupal 11 render array I need the jQuery UI Checkboxradio widget. Give the exact `#attached`
    line to attach it.
  criteria: $build['#attached']['library'][] = 'jquery_ui_checkboxradio/checkboxradio';
  bundle: jquery_ui_checkboxradio
  rubric_ref: rubric/jquery_ui_checkboxradio_checkboxradio_attach_attached@1.0
  tags:
  - mode:recipe
- id: checkboxradio-depend-in-libraries-yml
  input: In my own module's *.libraries.yml, how do I make my JS library depend on the jQuery UI Checkboxradio
    widget? Show the YAML.
  criteria: Under my library's `dependencies:` list `- jquery_ui_checkboxradio/checkboxradio`.
  bundle: jquery_ui_checkboxradio
  rubric_ref: rubric/jquery_ui_checkboxradio_checkboxradio_depend_in_libraries_yml@1.0
  tags:
  - mode:recipe
- id: checkboxradio-depends-on-jquery-ui
  input: Does the jquery_ui_checkboxradio module have its own libraries file, or does it depend on another
    module to register the Checkboxradio library?
  criteria: It has no *.libraries.yml of its own. It depends on the base jquery_ui module (>=8.x-1.7 /
    composer ^1.7), whose hook_library_info_alter() reads jquery_ui.libraries.data.json and registers
    the jquery_ui_checkboxradio/checkboxradio library and vendored assets.
  bundle: jquery_ui_checkboxradio
  rubric_ref: rubric/jquery_ui_checkboxradio_checkboxradio_depends_on_jquery_ui@1.0
  tags:
  - mode:recipe
- id: checkboxradio-no-config-surface
  input: Where is the configuration/settings page for the jquery_ui_checkboxradio module, and what permissions
    does it add?
  criteria: 'There is none: jquery_ui_checkboxradio has no configuration UI, no permissions and no services.
    You simply install it and attach the library you need.'
  bundle: jquery_ui_checkboxradio
  rubric_ref: rubric/jquery_ui_checkboxradio_checkboxradio_no_config_surface@1.0
  tags:
  - mode:recipe
- id: checkboxradio-transitive-deps
  input: If I attach jquery_ui_checkboxradio/checkboxradio, do I also need to attach jquery_ui/widget
    myself?
  criteria: No. The checkboxradio library declares its dependencies (core/jquery, jquery_ui/widget, and
    jQuery UI internal helper libraries), so they are pulled in automatically.
  bundle: jquery_ui_checkboxradio
  rubric_ref: rubric/jquery_ui_checkboxradio_checkboxradio_transitive_deps@1.0
  tags:
  - mode:recipe
