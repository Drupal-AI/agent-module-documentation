metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: jquery_ui_sortable
  version: 2.1.x
  note: 'jquery_ui_sortable is a thin asset/library shim that re-supplies the jQuery UI Sortable library
    (removed from core) as the Drupal library id jquery_ui_sortable/sortable, filled in by the jquery_ui
    module. It has no config, permissions, services, plugins, or PHP API, so the only live state is: (a)
    the module being enabled, and (b) the jquery_ui_sortable/sortable library resolving to the vendored
    sortable-min.js asset. Easy cases are recipe (response-graded). Medium cases inspect the LIVE library
    registry. Hard cases uninstall the module (verify FAILS because the library no longer resolves) and
    require the agent to re-enable it so the library resolves again. Nothing else depends on jquery_ui_sortable
    on this site, so uninstall/enable is safe; baseline = enabled.'
questions:
- id: jquery_ui_sortable-library-id
  input: In a Drupal 11 module/theme I need the jQuery UI Sortable behaviour that used to be at core/jquery.ui.sortable.
    Using the jquery_ui_sortable module, what is the exact asset library id I should attach instead, and
    how do I attach it to a render array?
  criteria: 'The library id is jquery_ui_sortable/sortable. Attach it with $build[''#attached''][''library''][]
    = ''jquery_ui_sortable/sortable''; (or list it under dependencies: in a *.libraries.yml).'
  bundle: jquery_ui_sortable
  rubric_ref: rubric/jquery_ui_sortable_jquery_ui_sortable_library_id@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: jquery_ui_sortable-replaces
  input: Why would I install the jquery_ui_sortable contrib module on Drupal 10/11, and which removed
    core library does it replace?
  criteria: jQuery UI was deprecated and removed from core; this module re-provides the Sortable library
    so legacy code keeps working. It replaces the removed core/jquery.ui.sortable library with jquery_ui_sortable/sortable.
  bundle: jquery_ui_sortable
  rubric_ref: rubric/jquery_ui_sortable_jquery_ui_sortable_replaces@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: jquery_ui_sortable-dependency-config
  input: Which module does jquery_ui_sortable depend on to supply the actual jQuery UI files, and does
    jquery_ui_sortable have any configuration page or permissions?
  criteria: It depends on the base jquery_ui module (which vendors the jQuery UI files and fills in the
    empty sortable library). It has no configuration page, no permissions, no services and no PHP API
    — you just enable it and attach the library.
  bundle: jquery_ui_sortable
  rubric_ref: rubric/jquery_ui_sortable_jquery_ui_sortable_dependency_config@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: jquery_ui_sortable-lib-resolves
  input: On this running Drupal site, confirm whether the jquery_ui_sortable/sortable asset library resolves,
    and tell me the path of the JavaScript file it loads.
  criteria: The jquery_ui_sortable/sortable library resolves and loads the vendored jQuery UI file, e.g.
    modules/contrib/jquery_ui/assets/vendor/jquery.ui/ui/widgets/sortable-min.js.
  bundle: jquery_ui_sortable
  rubric_ref: rubric/jquery_ui_sortable_jquery_ui_sortable_lib_resolves@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/jquery_ui_sortable-lib-resolves-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/jquery_ui_sortable-lib-resolves-cleanup.sh
- id: jquery_ui_sortable-provider
  input: On this live site the jquery_ui_sortable/sortable library is only a stub that gets filled in.
    Inspect the resolved library and tell me which module actually supplies the vendored jQuery UI sortable
    JavaScript file.
  criteria: The vendored file is supplied by the jquery_ui module — the resolved JS path is under modules/contrib/jquery_ui/assets/vendor/jquery.ui/...
    (jquery_ui_sortable declares an empty library that jquery_ui fills in).
  bundle: jquery_ui_sortable
  rubric_ref: rubric/jquery_ui_sortable_jquery_ui_sortable_provider@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/jquery_ui_sortable-provider-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/jquery_ui_sortable-provider-cleanup.sh
- id: jquery_ui_sortable-restore
  input: On this Drupal site a theme attaches the jquery_ui_sortable/sortable library, but that library
    currently does not resolve (its module was uninstalled). Restore it so the jquery_ui_sortable/sortable
    library is available again. Apply the change to the live site.
  criteria: Enable (install) the jquery_ui_sortable module (drush en jquery_ui_sortable) so the jquery_ui_sortable/sortable
    library resolves again.
  bundle: jquery_ui_sortable
  rubric_ref: rubric/jquery_ui_sortable_jquery_ui_sortable_restore@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/jquery_ui_sortable-restore-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/jquery_ui_sortable-restore-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/jquery_ui_sortable-restore-verify.sh
- id: jquery_ui_sortable-resolve-js
  input: My site's drag-to-reorder widget broke because the jQuery UI Sortable JavaScript is no longer
    being provided. Get the jquery_ui_sortable module's sortable library working again on this live site
    so the sortable JavaScript file loads.
  criteria: Enable the jquery_ui_sortable module and rebuild caches so jquery_ui_sortable/sortable resolves
    to the vendored sortable-min.js asset.
  bundle: jquery_ui_sortable
  rubric_ref: rubric/jquery_ui_sortable_jquery_ui_sortable_resolve_js@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: site-owner
    reset: agent-module-documentation/evaluation/verify/jquery_ui_sortable-resolve-js-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/jquery_ui_sortable-resolve-js-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/jquery_ui_sortable-resolve-js-verify.sh
