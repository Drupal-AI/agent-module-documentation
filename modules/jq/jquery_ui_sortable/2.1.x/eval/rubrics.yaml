rubrics:
- id: jquery_ui_sortable_jquery_ui_sortable_library_id
  version: '1.0'
  applicable_bundles:
  - jquery_ui_sortable
  checks:
  - kind: must_contain_any
    values:
    - jquery_ui_sortable/sortable
    - '#attached'
  scoring:
    combine: all_pass
- id: jquery_ui_sortable_jquery_ui_sortable_replaces
  version: '1.0'
  applicable_bundles:
  - jquery_ui_sortable
  checks:
  - kind: must_contain_any
    values:
    - core/jquery.ui.sortable
    - removed from core
    - deprecated
    - no longer in core
  scoring:
    combine: all_pass
- id: jquery_ui_sortable_jquery_ui_sortable_dependency_config
  version: '1.0'
  applicable_bundles:
  - jquery_ui_sortable
  checks:
  - kind: must_contain_any
    values:
    - jquery_ui
  scoring:
    combine: all_pass
- id: jquery_ui_sortable_jquery_ui_sortable_lib_resolves
  version: '1.0'
  applicable_bundles:
  - jquery_ui_sortable
  checks:
