- id: jquery_ui_sortable_jquery_ui_sortable_resolve_js
  version: '1.0'
  applicable_bundles:
  - jquery_ui_sortable
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
