metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: jquery_ui
  version: 1.8.x
  note: jquery_ui is a passive asset/library provider (no config UI, no permissions, no services), so
    all cases are `recipe` (response-graded), not `execution` (live-state). Facts are grounded in data.json,
    usage.md, and agent/start.md.
questions:
- id: jqueryui-why-exists
  input: On a Drupal 11 site, why would I install the contrib `jquery_ui` module? What does it actually
    provide?
  criteria: It re-provides the jQuery UI asset library (JS, CSS themes, images) as a contrib module after
    jQuery UI was deprecated and removed from Drupal core, so existing themes/modules keep working. It
    is not a feature module.
  bundle: jquery_ui
  rubric_ref: rubric/jquery_ui_jqueryui_why_exists@1.0
  tags:
  - mode:recipe
- id: jqueryui-attach-core-library
  input: In a Drupal 11 render array I need the jQuery UI base. Give the exact `#attached` line to attach
    it.
  criteria: $build['#attached']['library'][] = 'jquery_ui/core';
  bundle: jquery_ui
  rubric_ref: rubric/jquery_ui_jqueryui_attach_core_library@1.0
  tags:
  - mode:recipe
- id: jqueryui-base-library-names
  input: Which base libraries does the jquery_ui module declare in jquery_ui.libraries.yml? Name them.
  criteria: jquery_ui/core, jquery_ui/widget, jquery_ui/mouse, jquery_ui/position, and jquery_ui/locale.
  bundle: jquery_ui
  rubric_ref: rubric/jquery_ui_jqueryui_base_library_names@1.0
  tags:
  - mode:recipe
- id: jqueryui-migrate-core-refs
  input: My custom theme still references the old core `core/jquery.ui` and `core/jquery.ui.widget` libraries
    and I get deprecation errors. What do I replace them with?
  criteria: Replace core/jquery.ui with jquery_ui/core, and core/jquery.ui.widget with jquery_ui/widget.
  bundle: jquery_ui
  rubric_ref: rubric/jquery_ui_jqueryui_migrate_core_refs@1.0
  tags:
  - mode:recipe
- id: jqueryui-depend-in-libraries-yml
  input: In my own module's *.libraries.yml, how do I make my JS library depend on the jQuery UI base
    and widget factory? Show the YAML.
  criteria: Under my library's `dependencies:` list `- jquery_ui/core` and `- jquery_ui/widget`.
  bundle: jquery_ui
  rubric_ref: rubric/jquery_ui_jqueryui_depend_in_libraries_yml@1.0
  tags:
  - mode:recipe
- id: jqueryui-widget-companion-modules
  input: I need the jQuery UI datepicker or dialog widget on a Drupal 11 site. Does the jquery_ui module
    itself provide those widgets, or do I need something else?
  criteria: The jquery_ui module only provides the base assets; individual widgets like datepicker and
    dialog live in separate companion projects (e.g. jquery_ui_datepicker, jquery_ui_dialog) that build
    on this base.
  bundle: jquery_ui
  rubric_ref: rubric/jquery_ui_jqueryui_widget_companion_modules@1.0
  tags:
  - mode:recipe
- id: jqueryui-no-config-surface
  input: Where is the configuration/settings page for the jquery_ui module, and what permissions does
    it add?
  criteria: 'There is none: jquery_ui has no configuration UI, no permissions and no services. You simply
    install it and attach the libraries you need.'
  bundle: jquery_ui
  rubric_ref: rubric/jquery_ui_jqueryui_no_config_surface@1.0
  tags:
  - mode:recipe
- id: jqueryui-locale-datepicker
  input: What is the jquery_ui/locale library for?
  criteria: jquery_ui/locale wires the jQuery UI datepicker into Drupal's localization so it uses translated
    date regions/settings.
  bundle: jquery_ui
  rubric_ref: rubric/jquery_ui_jqueryui_locale_datepicker@1.0
  tags:
  - mode:recipe
