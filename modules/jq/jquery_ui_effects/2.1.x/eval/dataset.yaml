metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: jquery_ui_effects
  version: 2.1.x
  note: jquery_ui_effects is a passive asset/library provider (no config UI, no permissions, no services,
    no .module). Its libraries are declared by the base jquery_ui module's hook_library_info_alter reading
    jquery_ui.libraries.data.json. All cases are `recipe` (response-graded). Facts are grounded in data.json,
    usage.md, and agent/api/jquery_ui_effects.md.
questions:
- id: jqueryuieffects-why-exists
  input: On a Drupal 11 site, why would I install the contrib `jquery_ui_effects` module? What does it
    provide?
  criteria: It re-provides the jQuery UI Effects asset library as a contrib module after jQuery UI was
    deprecated and removed from Drupal core, so existing themes/modules keep working. It has no config,
    permissions or services.
  bundle: jquery_ui_effects
  rubric_ref: rubric/jquery_ui_effects_jqueryuieffects_why_exists@1.0
  tags:
  - mode:recipe
- id: jqueryuieffects-depends-on-jquery-ui
  input: Does jquery_ui_effects work on its own, or does it need another module enabled?
  criteria: It depends on the base jquery_ui module (jquery_ui:jquery_ui >=8.x-1.7). Both must be enabled;
    the base module actually registers the effects libraries.
  bundle: jquery_ui_effects
  rubric_ref: rubric/jquery_ui_effects_jqueryuieffects_depends_on_jquery_ui@1.0
  tags:
  - mode:recipe
- id: jqueryuieffects-attach-fade
  input: In a Drupal 11 render array, give the exact `#attached` line to load the jQuery UI fade effect.
  criteria: $build['#attached']['library'][] = 'jquery_ui_effects/fade';
  bundle: jquery_ui_effects
  rubric_ref: rubric/jquery_ui_effects_jqueryuieffects_attach_fade@1.0
  tags:
  - mode:recipe
- id: jqueryuieffects-core-library
  input: What is the `jquery_ui_effects/core` library and when do I need it?
  criteria: jquery_ui_effects/core is the effects engine (adds .effect(), effect-aware .show()/.hide()/.toggle(),
    easings and color animation). Every individual effect depends on it, so attaching a specific effect
    pulls it in automatically.
  bundle: jquery_ui_effects
  rubric_ref: rubric/jquery_ui_effects_jqueryuieffects_core_library@1.0
  tags:
  - mode:recipe
- id: jqueryuieffects-list-effects
  input: Which individual jQuery UI effect sub-libraries can I attach with this module? Name several.
  criteria: blind, bounce, clip, drop, explode, fade, fold, highlight, puff, pulsate, scale, shake, size,
    slide and transfer — each as jquery_ui_effects/<name>, each depending on jquery_ui_effects/core.
  bundle: jquery_ui_effects
  rubric_ref: rubric/jquery_ui_effects_jqueryuieffects_list_effects@1.0
  tags:
  - mode:recipe
- id: jqueryuieffects-depend-in-libraries-yml
  input: In my own module's *.libraries.yml, how do I make my JS depend on the jQuery UI slide effect?
    Show the YAML.
  criteria: Under my library's `dependencies:` list `- jquery_ui_effects/slide` (it pulls in jquery_ui_effects/core
    automatically).
  bundle: jquery_ui_effects
  rubric_ref: rubric/jquery_ui_effects_jqueryuieffects_depend_in_libraries_yml@1.0
  tags:
  - mode:recipe
- id: jqueryuieffects-no-config-surface
  input: Where is the configuration/settings page for jquery_ui_effects, and what permissions does it
    add?
  criteria: 'There is none: jquery_ui_effects has no configuration UI, no permissions and no services.
    You simply install it and attach the effect library ids.'
  bundle: jquery_ui_effects
  rubric_ref: rubric/jquery_ui_effects_jqueryuieffects_no_config_surface@1.0
  tags:
  - mode:recipe
- id: jqueryuieffects-no-libraries-yml
  input: The jquery_ui_effects module has no jquery_ui_effects.libraries.yml. How do its libraries get
    declared?
  criteria: 'The base jquery_ui module declares them: its jquery_ui_library_info_alter() reads jquery_ui.libraries.data.json
    and registers entries under the jquery_ui_effects namespace.'
  bundle: jquery_ui_effects
  rubric_ref: rubric/jquery_ui_effects_jqueryuieffects_no_libraries_yml@1.0
  tags:
  - mode:recipe
