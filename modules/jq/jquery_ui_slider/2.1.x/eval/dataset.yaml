metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: jquery_ui_slider
  version: 2.1.x
  note: jquery_ui_slider is an asset-library provider (a compatibility shim) with no config UI, permissions,
    services, or PHP API, so all cases are `recipe` (response-graded), not `execution` (live-state).
questions:
- id: jqueryuislider-attach-library
  input: In a custom Drupal 11 module I have a render array in `$build`. Attach the jQuery UI Slider library
    provided by the jquery_ui_slider module so the slider widget works on the page. Show the exact PHP
    line.
  criteria: $build['#attached']['library'][] = 'jquery_ui_slider/slider';
  bundle: jquery_ui_slider
  rubric_ref: rubric/jquery_ui_slider_jqueryuislider_attach_library@1.0
  tags:
  - mode:recipe
- id: jqueryuislider-library-name
  input: What is the exact library identifier (the `provider/library-name` string) that the jquery_ui_slider
    module declares for the jQuery UI Slider asset library?
  criteria: The library is `jquery_ui_slider/slider`.
  bundle: jquery_ui_slider
  rubric_ref: rubric/jquery_ui_slider_jqueryuislider_library_name@1.0
  tags:
  - mode:recipe
- id: jqueryuislider-why-needed
  input: Why does a contrib module like jquery_ui_slider exist for Drupal 9.2+/10/11 when the jQuery UI
    Slider used to just be in core? Explain in one or two sentences.
  criteria: jQuery UI was deprecated and progressively removed from Drupal core, so this module re-provides
    the jQuery UI Slider asset library for code that still needs it.
  bundle: jquery_ui_slider
  rubric_ref: rubric/jquery_ui_slider_jqueryuislider_why_needed@1.0
  tags:
  - mode:recipe
- id: jqueryuislider-dependency
  input: Which module does jquery_ui_slider depend on to obtain the underlying vendored jQuery UI JavaScript
    files? Name it.
  criteria: It depends on the base `jquery_ui` module (drupal/jquery_ui), which vendors the underlying
    jQuery UI files.
  bundle: jquery_ui_slider
  rubric_ref: rubric/jquery_ui_slider_jqueryuislider_dependency@1.0
  tags:
  - mode:recipe
- id: jqueryuislider-composer-require
  input: Give the Composer command to add the jquery_ui_slider module to a Drupal site.
  criteria: composer require drupal/jquery_ui_slider (which also pulls in drupal/jquery_ui).
  bundle: jquery_ui_slider
  rubric_ref: rubric/jquery_ui_slider_jqueryuislider_composer_require@1.0
  tags:
  - mode:recipe
- id: jqueryuislider-no-config
  input: After enabling jquery_ui_slider, where in the Drupal admin UI do I configure it, and what permissions
    does it add? Answer accurately.
  criteria: 'There is nothing to configure: the module has no configuration UI, no settings page, and
    no permissions. You just enable it and attach the `jquery_ui_slider/slider` library.'
  bundle: jquery_ui_slider
  rubric_ref: rubric/jquery_ui_slider_jqueryuislider_no_config@1.0
  tags:
  - mode:recipe
- id: jqueryuislider-theme-libraries-yml
  input: In a custom theme I want the jQuery UI Slider library loaded whenever my own library loads, instead
    of attaching it in PHP. How do I reference jquery_ui_slider's library as a dependency in my theme's
    *.libraries.yml?
  criteria: Under your library's `dependencies:` list in the theme's *.libraries.yml, add `- jquery_ui_slider/slider`.
  bundle: jquery_ui_slider
  rubric_ref: rubric/jquery_ui_slider_jqueryuislider_theme_libraries_yml@1.0
  tags:
  - mode:recipe
