metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: jquery_ui_button
  version: 2.1.x
  note: jquery_ui_button is a passive asset/library provider (no config UI, no permissions, no services,
    no entities, no plugin types, no .module or .libraries.yml of its own), so it has no introspection
    or execution surface. There is no setup-config to save and read back (nothing is configurable) and
    nothing for the agent to build and verify against live state. Per the eval spec, medium (introspection)
    and hard (execution) tiers are therefore OMITTED as they cannot be authored without fabrication. The
    single registered library and its assets/dependencies (jquery_ui_button/button -> jQuery UI 1.13.2
    button-min.js + base/button.css) are a STATIC fact, so they are covered as easy recipe cases. Facts
    are grounded in data.json, usage.md, agent/theming/jquery_ui_button.md, and live library.discovery
    introspection of jquery_ui_button/button.
questions:
- id: button-why-exists
  input: On a Drupal 11 site, why would I install the contrib `jquery_ui_button` module? What does it
    actually provide?
  criteria: It re-provides the single jQuery UI Button widget asset library as a contrib module after
    jQuery UI was deprecated and removed from Drupal core, so existing themes/modules that used $.fn.button()/buttonset()
    keep working. It has no config, permissions or services.
  bundle: jquery_ui_button
  rubric_ref: rubric/jquery_ui_button_button_why_exists@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: button-library-id
  input: What is the exact library id provided for the jQuery UI Button widget, and is there a separate
    buttonset library?
  criteria: The library id is jquery_ui_button/button. There is no separate buttonset library — the button
    widget covers the legacy buttonset() behavior.
  bundle: jquery_ui_button
  rubric_ref: rubric/jquery_ui_button_button_library_id@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: button-attach-attached
  input: In a Drupal 11 render array I need the jQuery UI Button widget. Give the exact `#attached` line
    to attach it.
  criteria: $build['#attached']['library'][] = 'jquery_ui_button/button';
  bundle: jquery_ui_button
  rubric_ref: rubric/jquery_ui_button_button_attach_attached@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: button-depend-in-libraries-yml
  input: In my own module's *.libraries.yml, how do I make my JS library depend on the jQuery UI Button
    widget? Show the YAML.
  criteria: Under my library's `dependencies:` list `- jquery_ui_button/button`.
  bundle: jquery_ui_button
  rubric_ref: rubric/jquery_ui_button_button_depend_in_libraries_yml@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: button-depends-on-jquery-ui
  input: Does the jquery_ui_button module have its own libraries file, or does it depend on another module
    to register the Button library? Which modules does it depend on?
  criteria: It has no *.libraries.yml of its own. It depends on the base jquery_ui module (>=8.x-1.7 /
    composer ^1.7), whose hook_library_info_alter() reads jquery_ui.libraries.data.json and registers
    the jquery_ui_button/button library and vendored assets. It also depends on jquery_ui_controlgroup
    and jquery_ui_checkboxradio (>=2.1).
  bundle: jquery_ui_button
  rubric_ref: rubric/jquery_ui_button_button_depends_on_jquery_ui@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: button-no-config-surface
  input: Where is the configuration/settings page for the jquery_ui_button module, and what permissions
    does it add?
  criteria: 'There is none: jquery_ui_button has no configuration UI, no permissions and no services.
    You simply install it and attach the library you need.'
  bundle: jquery_ui_button
  rubric_ref: rubric/jquery_ui_button_button_no_config_surface@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: button-transitive-deps
  input: If I attach jquery_ui_button/button, do I also need to attach jquery_ui/widget, jquery_ui_controlgroup/controlgroup
    or jquery_ui_checkboxradio/checkboxradio myself?
  criteria: No. The button library declares its dependencies (core/jquery, jquery_ui_controlgroup/controlgroup,
    jquery_ui_checkboxradio/checkboxradio, jquery_ui/internal.keycode, jquery_ui/widget, jquery_ui/internal.widget-css),
    so they are pulled in automatically.
  bundle: jquery_ui_button
  rubric_ref: rubric/jquery_ui_button_button_transitive_deps@1.0
  tags:
  - mode:recipe
  - difficulty:easy
