metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: jquery_ui_tabs
  version: 2.1.x
  note: jquery_ui_tabs is a passive asset/library provider (no config UI, no permissions, no services,
    no PHP of its own — the tabs library is declared by the base jquery_ui module's hook_library_info_alter).
    All cases are `recipe` (response-graded), not `execution` (live-state). Facts are grounded in data.json,
    usage.md, and agent/theming/jquery_ui_tabs.md.
questions:
- id: jqtabs-why-exists
  input: On a Drupal 11 site, why would I install the contrib `jquery_ui_tabs` module? What does it provide?
  criteria: It re-provides the jQuery UI Tabs widget as an asset library after jQuery UI was deprecated
    and removed from Drupal core, so existing themes/modules that render tabs keep working. It is not
    a feature/config module.
  bundle: jquery_ui_tabs
  rubric_ref: rubric/jquery_ui_tabs_jqtabs_why_exists@1.0
  tags:
  - mode:recipe
- id: jqtabs-library-id
  input: What is the exact library id I attach to get the jQuery UI Tabs widget from the jquery_ui_tabs
    module?
  criteria: jquery_ui_tabs/tabs
  bundle: jquery_ui_tabs
  rubric_ref: rubric/jquery_ui_tabs_jqtabs_library_id@1.0
  tags:
  - mode:recipe
- id: jqtabs-attach-attached
  input: In a Drupal 11 render array I need the jQuery UI Tabs widget. Give the exact `#attached` line
    to attach it.
  criteria: $build['#attached']['library'][] = 'jquery_ui_tabs/tabs';
  bundle: jquery_ui_tabs
  rubric_ref: rubric/jquery_ui_tabs_jqtabs_attach_attached@1.0
  tags:
  - mode:recipe
- id: jqtabs-depends-jquery-ui
  input: Does jquery_ui_tabs work on its own, or does it need another module? Where does its library definition
    actually come from?
  criteria: It depends on the base jquery_ui module (jquery_ui:jquery_ui >=8.x-1.7). jquery_ui_tabs ships
    no *.libraries.yml itself; the base jquery_ui module declares the `tabs` library on its behalf via
    hook_library_info_alter() reading jquery_ui.libraries.data.json.
  bundle: jquery_ui_tabs
  rubric_ref: rubric/jquery_ui_tabs_jqtabs_depends_jquery_ui@1.0
  tags:
  - mode:recipe
- id: jqtabs-depend-in-libraries-yml
  input: In my own module's *.libraries.yml, how do I make my JS library depend on the jQuery UI tabs
    widget? Show the YAML.
  criteria: Under my library's `dependencies:` list `- jquery_ui_tabs/tabs`.
  bundle: jquery_ui_tabs
  rubric_ref: rubric/jquery_ui_tabs_jqtabs_depend_in_libraries_yml@1.0
  tags:
  - mode:recipe
- id: jqtabs-no-config-surface
  input: Where is the configuration/settings page for the jquery_ui_tabs module, and what permissions
    does it add?
  criteria: 'There is none: jquery_ui_tabs has no configuration UI, no permissions and no services. You
    install it, attach jquery_ui_tabs/tabs, and initialize .tabs() in your own JS.'
  bundle: jquery_ui_tabs
  rubric_ref: rubric/jquery_ui_tabs_jqtabs_no_config_surface@1.0
  tags:
  - mode:recipe
- id: jqtabs-migrate-core-refs
  input: My legacy code relied on the jQuery UI tabs widget from core (core/jquery.ui) and now it's gone.
    What do I install and reference instead?
  criteria: Install the jquery_ui_tabs contrib module and reference the jquery_ui_tabs/tabs library instead
    of the removed core jQuery UI tabs assets.
  bundle: jquery_ui_tabs
  rubric_ref: rubric/jquery_ui_tabs_jqtabs_migrate_core_refs@1.0
  tags:
  - mode:recipe
- id: jqtabs-auto-init
  input: After attaching jquery_ui_tabs/tabs, does it automatically turn my markup into tabs?
  criteria: No. The library only loads the widget assets (tabs-min.js and tabs.css). You still call .tabs()
    on your element from your own JavaScript, typically inside a Drupal.behaviors attach.
  bundle: jquery_ui_tabs
  rubric_ref: rubric/jquery_ui_tabs_jqtabs_auto_init@1.0
  tags:
  - mode:recipe
