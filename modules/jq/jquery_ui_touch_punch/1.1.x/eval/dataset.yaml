metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: jquery_ui_touch_punch
  version: 1.1.x
  note: jquery_ui_touch_punch is a pure asset-library provider (no config, permissions, plugins, or PHP
    API). It re-provides the Touch Punch shim as a Drupal asset library after jQuery UI was removed from
    core, so all cases are `recipe` (response-graded), not `execution` (live-state).
questions:
- id: touchpunch-library-name
  input: On a Drupal 11 site with the jquery_ui_touch_punch module installed, what is the exact machine
    name of the asset library it declares that I would attach to add touch support? Give just the library
    id.
  criteria: The module declares the asset library `jquery_ui_touch_punch/touch-punch`.
  bundle: jquery_ui_touch_punch
  rubric_ref: rubric/jquery_ui_touch_punch_touchpunch_library_name@1.0
  tags:
  - mode:recipe
- id: touchpunch-attach-in-render
  input: In a Drupal 11 module I build a render array `$build` for a page that uses jQuery UI draggable.
    Show the one line that attaches Touch Punch so the widget also works on touch screens.
  criteria: 'Attach the library: $build[''#attached''][''library''][] = ''jquery_ui_touch_punch/touch-punch'';'
  bundle: jquery_ui_touch_punch
  rubric_ref: rubric/jquery_ui_touch_punch_touchpunch_attach_in_render@1.0
  tags:
  - mode:recipe
- id: touchpunch-library-dependency
  input: What jQuery UI asset library does the jquery_ui_touch_punch/touch-punch library depend on (so
    jQuery UI is loaded before the shim runs)? Name it.
  criteria: It depends on the `jquery_ui/core` asset library.
  bundle: jquery_ui_touch_punch
  rubric_ref: rubric/jquery_ui_touch_punch_touchpunch_library_dependency@1.0
  tags:
  - mode:recipe
- id: touchpunch-module-dependency
  input: Before I can use jquery_ui_touch_punch on Drupal 11, which contrib module must also be installed
    as its dependency? Name the module.
  criteria: It requires the jQuery UI module (`jquery_ui`), since jQuery UI was removed from core.
  bundle: jquery_ui_touch_punch
  rubric_ref: rubric/jquery_ui_touch_punch_touchpunch_module_dependency@1.0
  tags:
  - mode:recipe
- id: touchpunch-what-it-does
  input: Why would I install jquery_ui_touch_punch on a Drupal 11 site? Explain in one or two sentences
    what problem it solves for jQuery UI widgets.
  criteria: jQuery UI mouse widgets (draggable, sortable, sliders, resizable) only respond to mouse events;
    Touch Punch is a shim that translates touchstart/touchmove/touchend into simulated mouse events so
    those widgets work on touch screens (phones/tablets).
  bundle: jquery_ui_touch_punch
  rubric_ref: rubric/jquery_ui_touch_punch_touchpunch_what_it_does@1.0
  tags:
  - mode:recipe
- id: touchpunch-external-js
  input: jquery_ui_touch_punch ships as a library provider but relies on an external JavaScript file.
    Where must that Touch Punch JS be placed on disk, and what is the underlying composer package that
    provides it?
  criteria: The Touch Punch JS lives under `/libraries` (e.g. /libraries/jquery-ui-touch-punch/jquery.ui.touch-punch.min.js),
    provided by the composer package `politsin/jquery-ui-touch-punch`.
  bundle: jquery_ui_touch_punch
  rubric_ref: rubric/jquery_ui_touch_punch_touchpunch_external_js@1.0
  tags:
  - mode:recipe
- id: touchpunch-no-config
  input: Where is the settings/configuration page for jquery_ui_touch_punch on a Drupal 11 site, and what
    options does it expose?
  criteria: It has no configuration, settings page, permissions, or UI; you simply attach the `jquery_ui_touch_punch/touch-punch`
    library where touch support is needed.
  bundle: jquery_ui_touch_punch
  rubric_ref: rubric/jquery_ui_touch_punch_touchpunch_no_config@1.0
  tags:
  - mode:recipe
