rubrics:
- id: jquery_ui_touch_punch_touchpunch_library_name
  version: '1.0'
  applicable_bundles:
  - jquery_ui_touch_punch
  checks:
  - kind: must_contain_any
    values:
    - jquery_ui_touch_punch/touch-punch
  scoring:
    combine: all_pass
- id: jquery_ui_touch_punch_touchpunch_attach_in_render
  version: '1.0'
  applicable_bundles:
  - jquery_ui_touch_punch
  checks:
  - kind: must_contain_any
    values:
    - '#attached'
    - jquery_ui_touch_punch/touch-punch
  scoring:
    combine: all_pass
- id: jquery_ui_touch_punch_touchpunch_library_dependency
  version: '1.0'
  applicable_bundles:
  - jquery_ui_touch_punch
  checks:
  - kind: must_contain_any
    values:
    - jquery_ui/core
  scoring:
    combine: all_pass
- id: jquery_ui_touch_punch_touchpunch_module_dependency
  version: '1.0'
  applicable_bundles:
  - jquery_ui_touch_punch
  checks:
  - kind: must_contain_any
    values:
    - jquery_ui
  scoring:
    combine: all_pass
- id: jquery_ui_touch_punch_touchpunch_what_it_does
  version: '1.0'
  applicable_bundles:
  - jquery_ui_touch_punch
  checks:
  - kind: must_contain_any
    values:
    - touch
    - mobile
    - draggable
    - sortable
    - slider
    - resizable
  scoring:
    combine: all_pass
- id: jquery_ui_touch_punch_touchpunch_external_js
  version: '1.0'
  applicable_bundles:
  - jquery_ui_touch_punch
  checks:
  - kind: must_contain_any
    values:
    - /libraries
    - politsin/jquery-ui-touch-punch
  scoring:
    combine: all_pass
- id: jquery_ui_touch_punch_touchpunch_no_config
  version: '1.0'
  applicable_bundles:
  - jquery_ui_touch_punch
  checks:
  - kind: must_contain_any
    values:
    - no config
    - no configuration
    - no settings
    - attach
    - nothing to configure
  scoring:
    combine: all_pass
