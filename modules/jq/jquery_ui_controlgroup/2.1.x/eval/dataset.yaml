metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: jquery_ui_controlgroup
  version: 2.1.x
  note: 'jquery_ui_controlgroup is a passive asset/library provider: it ships only an .info.yml (no *.libraries.yml,
    PHP, config entities, settings, permissions, plugins, or services), and the base jquery_ui module
    registers the `jquery_ui_controlgroup/controlgroup` library on its behalf. There is therefore NO execution
    surface to build and verify, so HARD (mode: execution) cases are intentionally OMITTED. One MEDIUM
    (mode: introspection) case is included: it needs no setup/cleanup because there is no config to seed
    — instead the agent must query the LIVE library registry (a real static live fact) and report the
    actual JS/CSS asset filenames, which proves it can inspect running-site state rather than recite docs.
    Remaining cases are EASY (recipe), response-graded, grounded in data.json, usage.md, and agent/*.'
questions:
- id: controlgroup-what-it-provides
  input: On a Drupal 11 site, what does the contrib `jquery_ui_controlgroup` module actually provide,
    and what is the id of the asset library it exposes?
  criteria: It re-provides the jQuery UI Controlgroup widget as a Drupal asset library after jQuery UI
    was removed from core. The library id is jquery_ui_controlgroup/controlgroup. It is a thin dependency-provider,
    not a feature module.
  bundle: jquery_ui_controlgroup
  rubric_ref: rubric/jquery_ui_controlgroup_controlgroup_what_it_provides@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: controlgroup-why-exists
  input: Why does the jquery_ui_controlgroup module exist as a separate contrib project, and what does
    it depend on?
  criteria: Drupal core removed the bundled jQuery UI libraries and split each widget into its own contrib
    project. jquery_ui_controlgroup re-exposes the Controlgroup widget and depends on the base jquery_ui
    module (>=8.x-1.7), which ships the actual jQuery UI assets. It is a compatibility bridge for legacy
    code.
  bundle: jquery_ui_controlgroup
  rubric_ref: rubric/jquery_ui_controlgroup_controlgroup_why_exists@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: controlgroup-depend-in-libraries-yml
  input: In my own module's *.libraries.yml, how do I make my JS library depend on jQuery UI Controlgroup
    so its assets load? Show the YAML.
  criteria: Under your library's `dependencies:` list `- jquery_ui_controlgroup/controlgroup`. Attaching
    that library also pulls in core/jquery, jquery_ui/widget, and jquery_ui/internal.widget-css automatically.
  bundle: jquery_ui_controlgroup
  rubric_ref: rubric/jquery_ui_controlgroup_controlgroup_depend_in_libraries_yml@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: controlgroup-no-config-surface
  input: Where is the configuration/settings page for the jquery_ui_controlgroup module, and what permissions
    does it add?
  criteria: 'There is none: jquery_ui_controlgroup has no configuration UI (its configure route is null),
    no permissions, no plugins and no services. You just install it and attach the jquery_ui_controlgroup/controlgroup
    library where you need it.'
  bundle: jquery_ui_controlgroup
  rubric_ref: rubric/jquery_ui_controlgroup_controlgroup_no_config_surface@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: controlgroup-live-library-assets
  input: On this live Drupal site, is `jquery_ui_controlgroup/controlgroup` a registered asset library?
    Inspect the running site's library registry (do not guess) and report the JS and CSS asset files it
    declares.
  criteria: Yes. Querying the library.discovery service (e.g. `drush php:eval` on \Drupal::service('library.discovery')->getLibrariesByExtension('jquery_ui_controlgroup'))
    shows the `controlgroup` library (jQuery UI 1.13.2). Its JS asset is controlgroup-min.js and its CSS
    asset is controlgroup.css, both served from the base jquery_ui module at modules/contrib/jquery_ui/assets/vendor/jquery.ui/
    (ui/widgets/controlgroup-min.js and themes/base/controlgroup.css).
  bundle: jquery_ui_controlgroup
  rubric_ref: rubric/jquery_ui_controlgroup_controlgroup_live_library_assets@1.0
  tags:
  - mode:introspection
  - difficulty:medium
