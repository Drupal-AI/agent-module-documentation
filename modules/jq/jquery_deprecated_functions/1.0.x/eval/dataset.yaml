metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: jquery_deprecated_functions
  version: 1.0.x
  note: 'Config-less front-end shim. Its only live state is the asset library jquery_deprecated_functions/global-scripts
    (header:true, JS weight -20, depends on core/jquery), attached on every page via the info.yml libraries
    key and hook_page_attachments (OOP hook class JqueryDeprecatedFunctionsHooks). Medium cases introspect
    the live library registry via library.discovery. Hard cases require the module to be installed so
    the shims exist (reset uninstalls it; verify checks the module is installed and the library is discoverable).
    All grounded in real code: real function list ($.trim, $.isFunction, $.parseJSON, ...), real library
    id/metadata.'
questions:
- id: jqdf-what-and-why
  input: Why would a Drupal 11 site need the jquery_deprecated_functions module, and does it require any
    configuration after enabling it?
  criteria: Drupal 11 ships jQuery 4, which removed many utility functions that older JS/contrib code
    still calls, causing errors. The module re-adds them site-wide. It needs no configuration - just enable
    it.
  bundle: jquery_deprecated_functions
  rubric_ref: rubric/jquery_deprecated_functions_jqdf_what_and_why@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: jqdf-which-functions
  input: Name several of the deprecated jQuery functions that the jquery_deprecated_functions module restores.
  criteria: It restores $.trim, $.isFunction/$.fn.isFunction, $.type, $.isArray, $.camelCase, $.isWindow,
    $.nodeName, $.isNumeric, jQuery.now, jQuery.parseJSON, $.unique/$.fn.unique, plus jQuery.fx.interval,
    jQuery.cssNumber and jQuery.cssProps.
  bundle: jquery_deprecated_functions
  rubric_ref: rubric/jquery_deprecated_functions_jqdf_which_functions@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: jqdf-library-attach
  input: What is the name of the asset library that jquery_deprecated_functions defines, and how is it
    attached to pages?
  criteria: 'The library is jquery_deprecated_functions/global-scripts. It is attached to every page both
    via the libraries: key in the module .info.yml and via hook_page_attachments() (the OOP hook class
    JqueryDeprecatedFunctionsHooks). It depends on core/jquery and loads in the header.'
  bundle: jquery_deprecated_functions
  rubric_ref: rubric/jquery_deprecated_functions_jqdf_library_attach@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: jqdf-library-dependency
  input: Inspect this running Drupal site's asset library registry and report which core library the jquery_deprecated_functions/global-scripts
    library depends on.
  criteria: The global-scripts library declares a dependency on core/jquery (visible via \Drupal::service('library.discovery')->getLibraryByName('jquery_deprecated_functions','global-scripts')).
  bundle: jquery_deprecated_functions
  rubric_ref: rubric/jquery_deprecated_functions_jqdf_library_dependency@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/jqdf-registry-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/jqdf-registry-cleanup.sh
- id: jqdf-library-header-weight
  input: Inspect the live asset library definition for jquery_deprecated_functions/global-scripts on this
    site. Is it configured to load in the page header, and what is the JS file's weight?
  criteria: 'Yes, it loads in the header (header: true) and its single JS file has weight -20, so the
    shims are defined before other scripts run.'
  bundle: jquery_deprecated_functions
  rubric_ref: rubric/jquery_deprecated_functions_jqdf_library_header_weight@1.0
  tags:
  - mode:introspection
  - difficulty:medium
