metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: jquery_ui_droppable
  version: 2.1.x
  note: jquery_ui_droppable is a passive asset/library provider (no config UI, no permissions, no services,
    no plugins), so all cases are `recipe` (response-graded), not `execution` (live-state). Facts are
    grounded in data.json, usage.md, and agent/start.md + agent/api/jquery_ui_droppable.md.
questions:
- id: droppable-why-exists
  input: On a Drupal 11 site, why would I install the contrib `jquery_ui_droppable` module? What does
    it actually provide?
  criteria: It re-provides the jQuery UI Droppable interaction library as a contrib module after jQuery
    UI was deprecated and removed from Drupal core, so existing themes/modules keep working. It is not
    a feature module.
  bundle: jquery_ui_droppable
  rubric_ref: rubric/jquery_ui_droppable_droppable_why_exists@1.0
  tags:
  - mode:recipe
- id: droppable-library-id
  input: What is the exact library id that the jquery_ui_droppable module declares?
  criteria: jquery_ui_droppable/droppable (declared empty in jquery_ui_droppable.libraries.yml and filled
    in by the base jquery_ui module).
  bundle: jquery_ui_droppable
  rubric_ref: rubric/jquery_ui_droppable_droppable_library_id@1.0
  tags:
  - mode:recipe
- id: droppable-attach-render-array
  input: In a Drupal 11 render array I need jQuery UI droppable. Give the exact `#attached` line.
  criteria: $build['#attached']['library'][] = 'jquery_ui_droppable/droppable';
  bundle: jquery_ui_droppable
  rubric_ref: rubric/jquery_ui_droppable_droppable_attach_render_array@1.0
  tags:
  - mode:recipe
- id: droppable-depend-in-libraries-yml
  input: In my own module's *.libraries.yml, how do I make my JS library depend on jQuery UI droppable?
    Show the YAML.
  criteria: Under my library's `dependencies:` list `- jquery_ui_droppable/droppable`.
  bundle: jquery_ui_droppable
  rubric_ref: rubric/jquery_ui_droppable_droppable_depend_in_libraries_yml@1.0
  tags:
  - mode:recipe
- id: droppable-migrate-core-ref
  input: My theme still references `core/jquery.ui.droppable` and I get deprecation errors. What do I
    replace it with?
  criteria: Replace core/jquery.ui.droppable with jquery_ui_droppable/droppable.
  bundle: jquery_ui_droppable
  rubric_ref: rubric/jquery_ui_droppable_droppable_migrate_core_ref@1.0
  tags:
  - mode:recipe
- id: droppable-dependencies
  input: What other modules does jquery_ui_droppable require, and why?
  criteria: It depends on jquery_ui (the base that fills in the library, >=8.x-1.7) and jquery_ui_draggable
    (>=2.1), since a drop target needs draggable items to accept.
  bundle: jquery_ui_droppable
  rubric_ref: rubric/jquery_ui_droppable_droppable_dependencies@1.0
  tags:
  - mode:recipe
- id: droppable-no-config-surface
  input: Where is the configuration/settings page for jquery_ui_droppable, and what permissions does it
    add?
  criteria: 'There is none: jquery_ui_droppable has no configuration UI, no permissions, no services and
    no plugins. You install it and attach the jquery_ui_droppable/droppable library.'
  bundle: jquery_ui_droppable
  rubric_ref: rubric/jquery_ui_droppable_droppable_no_config_surface@1.0
  tags:
  - mode:recipe
