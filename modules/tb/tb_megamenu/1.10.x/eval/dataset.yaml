metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: tb_megamenu
  version: 1.10.x
  note: 'TB Mega Menu builds multi-column mega menus on top of Drupal core menus. Cases are `recipe` (response-graded)
    and probe tb_megamenu-specific facts drawn only from source: the tb_megamenu config entity keyed {menu}__{theme},
    the entity.tb_megamenu.collection admin route, the derivative tb_megamenu_menu_block block plugin,
    the block_config animation/style option values, JSON-string storage of block_config/menu_config, and
    the tb_megamenu.menu_builder service. No site mutation, no drush.'
questions:
- id: tbmm-config-entity-id
  input: In Drupal 11 with TB Mega Menu (tb_megamenu) 1.x, what kind of Drupal object stores a single
    mega menu's layout, and how is its ID formed? Answer briefly.
  criteria: Each mega menu is a `tb_megamenu` config entity (config prefix menu_config, i.e. tb_megamenu.menu_config.{id})
    whose id is {menu}__{theme}, e.g. main__olivero, pairing one core menu with one theme.
  bundle: tb_megamenu
  rubric_ref: rubric/tb_megamenu_tbmm_config_entity_id@1.0
  tags:
  - mode:recipe
- id: tbmm-admin-route
  input: Where in the Drupal admin do I create and manage TB Mega Menu menus, and what is the configure
    route name?
  criteria: At Structure -> TB Mega Menu (/admin/structure/tb-megamenu), route entity.tb_megamenu.collection;
    add/edit/delete forms hang off that path. All gated by the 'administer tb_megamenu' permission.
  bundle: tb_megamenu
  rubric_ref: rubric/tb_megamenu_tbmm_admin_route@1.0
  tags:
  - mode:recipe
- id: tbmm-block-plugin
  input: How do I display a TB Mega Menu on the site once it is configured? Name the block plugin involved
    and how there is one per menu.
  criteria: 'Place a block: the tb_megamenu_menu_block block plugin uses a deriver (Plugin\Derivative\TBMegaMenuBlock)
    to expose one derivative block per configured menu (in the ''TB Mega Menu'' category); add it to a
    region via Block layout.'
  bundle: tb_megamenu
  rubric_ref: rubric/tb_megamenu_tbmm_block_plugin@1.0
  tags:
  - mode:recipe
- id: tbmm-animation-options
  input: In TB Mega Menu 1.x, what animation effects can a mega menu block use, and what are the default
    animation and default color style?
  criteria: Animation options are none, fading, slide, zoom, elastic (default 'none'); color style options
    are Default(''), black, blue, green (default Default). Duration defaults to 400ms and delay to 200ms.
  bundle: tb_megamenu
  rubric_ref: rubric/tb_megamenu_tbmm_animation_options@1.0
  tags:
  - mode:recipe
- id: tbmm-json-storage
  input: In the tb_megamenu config entity, how are the block_config and menu_config values stored, and
    what should I use to read them safely?
  criteria: block_config and menu_config are stored as JSON-encoded strings on the config entity. Read
    them via the entity's getBlockConfig()/getMenuConfig() (which decode and HTML-escape item classes/captions/xicons/labels
    for XSS safety) and write via setBlockConfig()/setMenuConfig().
  bundle: tb_megamenu
  rubric_ref: rubric/tb_megamenu_tbmm_json_storage@1.0
  tags:
  - mode:recipe
- id: tbmm-builder-service
  input: Which service in TB Mega Menu would I call to programmatically load a menu's decoded configuration
    or render its block, and what is its id?
  criteria: The tb_megamenu.menu_builder service (Drupal\tb_megamenu\TBMegaMenuBuilder, interface TBMegaMenuBuilderInterface);
    e.g. getMenus(), getMenuConfig($menu,$theme), getBlockConfig(), renderBlock(), getAllBlocks().
  bundle: tb_megamenu
  rubric_ref: rubric/tb_megamenu_tbmm_builder_service@1.0
  tags:
  - mode:recipe
- id: tbmm-core-menu-sync
  input: Does TB Mega Menu replace Drupal core menus, and what happens when I edit the underlying menu
    in core? Answer briefly.
  criteria: 'It does not replace core menus: a mega menu is built on top of an existing core menu, reading
    the core menu tree and merging its stored per-item config, so edits made in core''s menu UI stay synchronized
    into the mega menu.'
  bundle: tb_megamenu
  rubric_ref: rubric/tb_megamenu_tbmm_core_menu_sync@1.0
  tags:
  - mode:recipe
