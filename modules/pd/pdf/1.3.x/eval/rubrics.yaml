rubrics:
- id: pdf_pdf_formatter_ids
  version: '1.0'
  applicable_bundles:
  - pdf
  checks:
  - kind: must_contain_any
    values:
    - pdf_default
    - pdf_thumbnail
    - pdf_pages
  scoring:
    combine: all_pass
- id: pdf_pdf_custom_viewer_key
  version: '1.0'
  applicable_bundles:
  - pdf
  checks:
  - kind: must_contain_any
    values:
    - custom_viewer
    - pdf.settings
    - /admin/config/media/pdfjs
  scoring:
    combine: all_pass
- id: pdf_pdf_library_location
  version: '1.0'
  applicable_bundles:
  - pdf
  checks:
  - kind: must_contain_any
    values:
    - libraries/pdf.js
    - /libraries/pdf.js/
    - libraries/pdf.js/build/pdf.js
    - libraries/pdf.js/web/viewer.html
  scoring:
    combine: all_pass
- id: pdf_pdf_known_custom_viewer
  version: '1.0'
  applicable_bundles:
  - pdf
  checks:
  - kind: must_contain_any
    values:
    - /themes/custom/acme/pdfjs/viewer.html
  scoring:
    combine: all_pass
- id: pdf_pdf_known_formatter_settings
  version: '1.0'
  applicable_bundles:
  - pdf
  checks:
  - kind: must_contain_any
    values:
    - page-width
  scoring:
    combine: all_pass
- id: pdf_pdf_which_formatter
  version: '1.0'
  applicable_bundles:
  - pdf
  checks:
  - kind: must_contain_any
    values:
    - field_pdf_scroll
  scoring:
    combine: all_pass
- id: pdf_pdf_default_viewer_display
  version: '1.0'
  applicable_bundles:
  - pdf
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
- id: pdf_pdf_thumbnail_display_layman
  version: '1.0'
  applicable_bundles:
  - pdf
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
- id: pdf_pdf_custom_viewer_role
  version: '1.0'
  applicable_bundles:
  - pdf
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
