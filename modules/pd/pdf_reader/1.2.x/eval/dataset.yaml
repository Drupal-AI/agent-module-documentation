metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: pdf_reader
  version: 1.2.x
  note: 'PDF Reader ships one field formatter, FieldPdfReaderFields (label ''PDF Reader''), for field
    types string, file, and uri. It is configured per field on Manage display; its settings (pdf_width,
    pdf_height, renderer, embed_view_fit, embed_hide_toolbar, download, link_placement) are stored as
    ordinary formatter settings on the entity_view_display component. Renderers: google, ms, embed, pdf-js,
    and colorbox (only with Colorbox + Libraries). Easy cases are grounded in the real plugin id, renderers,
    field types, and settings. Medium/hard cases create a string field on Article and set/read the PDF
    Reader formatter on the view display. SMOKE-TEST STATUS: the medium/hard scripts create field storage,
    which was NOT possible on the shared eval site at authoring time because a pre-existing broken commerce_giftcard
    entity state makes every route rebuild (triggered by field-storage creation) fatal; consequently the
    medium/hard cases here were NOT smoke-tested. The scripts follow the proven field-creation + view-display
    pattern and are expected to pass once field-storage creation works again. Easy cases require no site
    changes.'
questions:
- id: pdf_reader-formatter-and-fields
  input: In the Drupal pdf_reader module, what is the field formatter's plugin id, and which field types
    can it be applied to?
  criteria: The formatter plugin id is FieldPdfReaderFields (label 'PDF Reader'), applicable to field
    types string, file, and uri.
  bundle: pdf_reader
  rubric_ref: rubric/pdf_reader_pdf_reader_formatter_and_fields@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: pdf_reader-renderers
  input: Which PDF renderers does the pdf_reader formatter offer, and which one needs an extra module?
  criteria: The 'renderer' setting offers google (Google Docs Viewer), ms (Microsoft Office viewer), embed
    (direct embed), and pdf-js (bundled pdf.js). The colorbox renderer appears only when the Colorbox
    and Libraries modules are enabled.
  bundle: pdf_reader
  rubric_ref: rubric/pdf_reader_pdf_reader_renderers@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: pdf_reader-settings-keys
  input: What settings does the pdf_reader (PDF Reader) field formatter expose, and what are the default
    width/height and renderer?
  criteria: 'Settings: pdf_width (default 600), pdf_height (default 780), renderer (default google), embed_view_fit
    (Fit/FitH/FitV, direct-embed only), embed_hide_toolbar, download, link_placement (top/bottom).'
  bundle: pdf_reader
  rubric_ref: rubric/pdf_reader_pdf_reader_settings_keys@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: pdf_reader-known-formatter
  input: On this Drupal site, the Article content type has a field (field_pdf_known) configured to display
    through PDF Reader. Inspect the live Article default view display and state which renderer that field's
    PDF Reader formatter uses.
  criteria: field_pdf_known uses the FieldPdfReaderFields formatter with renderer = pdf-js in core.entity_view_display.node.article.default.
  bundle: pdf_reader
  rubric_ref: rubric/pdf_reader_pdf_reader_known_formatter@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/pdf_reader-known-formatter-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/pdf_reader-known-formatter-cleanup.sh
- id: pdf_reader-known-renderer
  input: The Article content type on this site has a field named field_pdf_render displayed with PDF Reader.
    Inspect the live view-display configuration and state which renderer it uses and whether a download
    link is enabled.
  criteria: field_pdf_render uses FieldPdfReaderFields with renderer = embed (direct embed), embed_view_fit
    = FitH, embed_hide_toolbar = true, and download = true (link_placement = bottom).
  bundle: pdf_reader
  rubric_ref: rubric/pdf_reader_pdf_reader_known_renderer@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/pdf_reader-known-renderer-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/pdf_reader-known-renderer-cleanup.sh
- id: pdf_reader-set-formatter
  input: On this Drupal site, the Article content type has a plain-text field field_pdf_task that holds
    a PDF URL. Configure the Article default view display so this field renders with the pdf_reader module's
    PDF Reader formatter. Apply the change to the live site.
  criteria: In core.entity_view_display.node.article.default the field_pdf_task component uses type FieldPdfReaderFields
    (PDF Reader formatter).
  bundle: pdf_reader
  rubric_ref: rubric/pdf_reader_pdf_reader_set_formatter@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/pdf_reader-set-formatter-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/pdf_reader-set-formatter-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/pdf_reader-set-formatter-verify.sh
- id: pdf_reader-set-formatter-doc
  input: My Article pages have a field (field_pdf_doc) with a link to a PDF document, but it just shows
    the URL as text. I want the PDF itself to appear embedded on the page. Make that happen using the
    PDF Reader module.
  criteria: In core.entity_view_display.node.article.default the field_pdf_doc component uses type FieldPdfReaderFields
    (PDF Reader formatter).
  bundle: pdf_reader
  rubric_ref: rubric/pdf_reader_pdf_reader_set_formatter_doc@1.0
