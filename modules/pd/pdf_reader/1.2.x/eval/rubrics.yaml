rubrics:
- id: pdf_reader_pdf_reader_formatter_and_fields
  version: '1.0'
  applicable_bundles:
  - pdf_reader
  checks:
  - kind: must_contain_any
    values:
    - FieldPdfReaderFields
    - file
    - string
    - uri
  scoring:
    combine: all_pass
- id: pdf_reader_pdf_reader_renderers
  version: '1.0'
  applicable_bundles:
  - pdf_reader
  checks:
  - kind: must_contain_any
    values:
    - google
    - pdf-js
    - embed
    - ms
    - colorbox
  scoring:
    combine: all_pass
- id: pdf_reader_pdf_reader_settings_keys
  version: '1.0'
  applicable_bundles:
  - pdf_reader
  checks:
  - kind: must_contain_any
    values:
    - pdf_width
    - pdf_height
    - renderer
    - download
    - link_placement
  scoring:
    combine: all_pass
- id: pdf_reader_pdf_reader_known_formatter
  version: '1.0'
  applicable_bundles:
  - pdf_reader
  checks:
  - kind: must_contain_any
    values:
    - pdf-js
    - pdf.js
  scoring:
    combine: all_pass
- id: pdf_reader_pdf_reader_known_renderer
  version: '1.0'
  applicable_bundles:
  - pdf_reader
  checks:
  - kind: must_contain_any
    values:
    - embed
  scoring:
    combine: all_pass
- id: pdf_reader_pdf_reader_set_formatter
  version: '1.0'
  applicable_bundles:
  - pdf_reader
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
- id: pdf_reader_pdf_reader_set_formatter_doc
  version: '1.0'
  applicable_bundles:
  - pdf_reader
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
