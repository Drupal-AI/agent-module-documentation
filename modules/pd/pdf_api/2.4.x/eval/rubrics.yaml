rubrics:
- id: pdf_api_pdf_api_config_object
  version: '1.0'
  applicable_bundles:
  - pdf_api
  checks:
  - kind: must_contain_any
    values:
    - pdf_api.dom_pdf.settings
    - /admin/config/system/pdf-api
    - pdf_api.settings
  scoring:
    combine: all_pass
- id: pdf_api_pdf_api_backends
  version: '1.0'
  applicable_bundles:
  - pdf_api
  checks:
  - kind: must_contain_any
    values:
    - dompdf
    - mpdf
    - tcpdf
    - wkhtmltopdf
    - plugin.manager.pdf_generator
  scoring:
    combine: all_pass
- id: pdf_api_pdf_api_new_backend
  version: '1.0'
  applicable_bundles:
  - pdf_api
  checks:
  - kind: must_contain_any
    values:
    - '@PdfGenerator'
    - Plugin/PdfGenerator
    - PdfGeneratorInterface
    - PdfGeneratorBase
  scoring:
    combine: all_pass
- id: pdf_api_pdf_api_known_dpi
  version: '1.0'
  applicable_bundles:
  - pdf_api
  checks:
  - kind: must_contain_any
    values:
    - '150'
  scoring:
    combine: all_pass
- id: pdf_api_pdf_api_remote_disabled
  version: '1.0'
  applicable_bundles:
  - pdf_api
  checks:
  - kind: must_contain_any
    values:
    - isRemoteEnabled
    - 'false'
    - disabled
    - not allowed
    - 'no'
  scoring:
    combine: all_pass
- id: pdf_api_pdf_api_set_dpi_font
  version: '1.0'
  applicable_bundles:
  - pdf_api
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
- id: pdf_api_pdf_api_disable_js
  version: '1.0'
  applicable_bundles:
  - pdf_api
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
