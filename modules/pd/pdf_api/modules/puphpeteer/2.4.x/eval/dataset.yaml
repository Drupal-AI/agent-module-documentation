metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: puphpeteer
  version: 2.4.x
  note: Puphpeteer is a pdf_api submodule adding a 'puphpeteer' PdfGenerator backend that renders HTML
    to PDF with headless Chrome/Puppeteer (NigelCunningham\Puphpeteer\Puppeteer). It is intentionally
    NOT enabled in this environment (needs Node.js + the Puppeteer library / Chromium). Its behaviour
    is driven by the config object puphpeteer.settings (route puphpeteer.config at /admin/config/system/pdf-api/puphpeteer).
    Medium/hard cases are grounded in that real config object and its documented keys/defaults (executable_path=''
    , service=false, service_url='', pagedjs=false). Because the config object is not installed by default
    (module disabled), setup/reset scripts create it and cleanup DELETES it to restore the disabled baseline.
    No PDF is actually generated, so Node is not required to run these cases.
questions:
- id: puphpeteer-what-backend
  input: In the Drupal pdf_api ecosystem, what does the puphpeteer submodule add, and what external runtime
    does it require to actually generate a PDF?
  criteria: It registers a 'puphpeteer' PdfGenerator backend for pdf_api that renders HTML with a real
    headless Chrome browser driven by Puppeteer, giving full CSS/JS fidelity. It requires a Node.js runtime
    plus the Puppeteer library (NigelCunningham/puphpeteer, which installs Chromium).
  bundle: puphpeteer
  rubric_ref: rubric/puphpeteer_puphpeteer_what_backend@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: puphpeteer-external-service
  input: How do I configure the Drupal puphpeteer backend to connect to an already-running (external)
    Chrome/Puppeteer instance instead of launching its own? Name the config object and the keys involved.
  criteria: In the puphpeteer.settings config object set service to true and service_url to the browserURL
    to connect to (used by puppeteer.connect). Editable at /admin/config/system/pdf-api/puphpeteer.
  bundle: puphpeteer
  rubric_ref: rubric/puphpeteer_puphpeteer_external_service@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: puphpeteer-pagedjs
  input: Which puphpeteer setting makes it load paged.js for print-oriented pagination, and where is the
    puphpeteer settings form?
  criteria: Enable the pagedjs boolean in puphpeteer.settings. The settings form is route puphpeteer.config
    at /admin/config/system/pdf-api/puphpeteer.
  bundle: puphpeteer
  rubric_ref: rubric/puphpeteer_puphpeteer_pagedjs@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: puphpeteer-known-service-url
  input: On this site, the puphpeteer backend has been configured to use an external Puppeteer service.
    Inspect the live puphpeteer configuration and report the service URL it will connect to.
  criteria: 'In puphpeteer.settings, service is true and service_url is http://chrome:9222. Read with:
    drush cget puphpeteer.settings service_url.'
  bundle: puphpeteer
  rubric_ref: rubric/puphpeteer_puphpeteer_known_service_url@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/puphpeteer-known-service-url-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/puphpeteer-known-service-url-cleanup.sh
- id: puphpeteer-known-headless
  input: Someone has been debugging the puphpeteer PDF backend on this site. Inspect the live puphpeteer
    configuration and state whether Chrome is currently set to run in headless mode.
  criteria: 'No — in puphpeteer.settings the headless key is false (default is true). Read with: drush
    cget puphpeteer.settings headless.'
  bundle: puphpeteer
  rubric_ref: rubric/puphpeteer_puphpeteer_known_headless@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/puphpeteer-known-headless-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/puphpeteer-known-headless-cleanup.sh
- id: puphpeteer-set-executable
  input: The puphpeteer backend on this site needs to know where Node lives. Configure its executable
    path to /usr/bin/node in the puphpeteer configuration and apply it to the live site.
  criteria: In the puphpeteer.settings config object set executable_path to /usr/bin/node (e.g. drush
    cset -y puphpeteer.settings executable_path /usr/bin/node).
  bundle: puphpeteer
  rubric_ref: rubric/puphpeteer_puphpeteer_set_executable@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/puphpeteer-set-executable-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/puphpeteer-set-executable-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/puphpeteer-set-executable-verify.sh
- id: puphpeteer-enable-pagedjs
  input: Configure the puphpeteer PDF backend on this site to load paged.js so print-oriented pagination
    is applied. Apply the change to the live configuration.
  criteria: In the puphpeteer.settings config object set pagedjs to true (e.g. drush cset -y puphpeteer.settings
    pagedjs 1). The default is false.
  bundle: puphpeteer
  rubric_ref: rubric/puphpeteer_puphpeteer_enable_pagedjs@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/puphpeteer-enable-pagedjs-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/puphpeteer-enable-pagedjs-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/puphpeteer-enable-pagedjs-verify.sh
