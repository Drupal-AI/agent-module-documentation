rubrics:
- id: puphpeteer_puphpeteer_what_backend
  version: '1.0'
  applicable_bundles:
  - puphpeteer
  checks:
  - kind: must_contain_any
    values:
    - Puppeteer
    - headless Chrome
    - headless chrome
    - Node
    - node.js
  scoring:
    combine: all_pass
- id: puphpeteer_puphpeteer_external_service
  version: '1.0'
  applicable_bundles:
  - puphpeteer
  checks:
  - kind: must_contain_any
    values:
    - puphpeteer.settings
    - service
    - service_url
  scoring:
    combine: all_pass
- id: puphpeteer_puphpeteer_pagedjs
  version: '1.0'
  applicable_bundles:
  - puphpeteer
  checks:
  - kind: must_contain_any
    values:
    - pagedjs
    - /admin/config/system/pdf-api/puphpeteer
    - puphpeteer.config
  scoring:
    combine: all_pass
- id: puphpeteer_puphpeteer_known_service_url
  version: '1.0'
  applicable_bundles:
  - puphpeteer
  checks:
  - kind: must_contain_any
    values:
    - http://chrome:9222
    - chrome:9222
  scoring:
    combine: all_pass
- id: puphpeteer_puphpeteer_known_headless
  version: '1.0'
  applicable_bundles:
  - puphpeteer
  checks:
  - kind: must_contain_any
    values:
    - 'false'
    - not headless
    - non-headless
    - 'no'
    - headed
  scoring:
    combine: all_pass
- id: puphpeteer_puphpeteer_set_executable
  version: '1.0'
  applicable_bundles:
  - puphpeteer
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
- id: puphpeteer_puphpeteer_enable_pagedjs
  version: '1.0'
  applicable_bundles:
  - puphpeteer
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
