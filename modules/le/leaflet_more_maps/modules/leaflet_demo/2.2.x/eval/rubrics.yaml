rubrics:
- id: leaflet_demo_leaflet_demo_purpose_and_path
  version: '1.0'
  applicable_bundles:
  - leaflet_demo
  checks:
  - kind: must_contain_any
    values:
    - /admin/config/system/leaflet-more-maps/demo
    - leaflet_demo.demo_page
  scoring:
    combine: all_pass
- id: leaflet_demo_leaflet_demo_data_source
  version: '1.0'
  applicable_bundles:
  - leaflet_demo
  checks:
  - kind: must_contain_any
    values:
    - leaflet.service
    - LeafletService
    - leaflet_map_get_info
  scoring:
    combine: all_pass
- id: leaflet_demo_leaflet_demo_dependency
  version: '1.0'
  applicable_bundles:
  - leaflet_demo
  checks:
  - kind: must_contain_any
    values:
    - leaflet:leaflet
    - ip_geoloc
    - IP Geolocation
  scoring:
    combine: all_pass
- id: leaflet_demo_leaflet_demo_enabled_state
  version: '1.0'
  applicable_bundles:
  - leaflet_demo
  checks:
  - kind: must_contain_any
    values:
    - enabled
    - /admin/config/system/leaflet-more-maps/demo
  scoring:
    combine: all_pass
- id: leaflet_demo_leaflet_demo_custom_map_visible
  version: '1.0'
  applicable_bundles:
  - leaflet_demo
  checks:
  - kind: must_contain_any
    values:
    - LMM Demo Showcase Combo
  scoring:
    combine: all_pass
- id: leaflet_demo_leaflet_demo_enable_module
  version: '1.0'
  applicable_bundles:
  - leaflet_demo
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
- id: leaflet_demo_leaflet_demo_enable_with_custom_map
  version: '1.0'
  applicable_bundles:
  - leaflet_demo
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
