rubrics:
- id: leaflet_more_maps_leaflet_more_maps_dependency_and_route
  version: '1.0'
  applicable_bundles:
  - leaflet_more_maps
  checks:
  - kind: must_contain_any
    values:
    - leaflet
    - /admin/config/system/leaflet-more-maps
    - leaflet_more_maps.settings
  scoring:
    combine: all_pass
- id: leaflet_more_maps_leaflet_more_maps_extension_hook
  version: '1.0'
  applicable_bundles:
  - leaflet_more_maps
  checks:
  - kind: must_contain_any
    values:
    - hook_leaflet_more_maps_list_alter
    - leaflet_more_maps_list_alter
  scoring:
    combine: all_pass
- id: leaflet_more_maps_leaflet_more_maps_which_need_keys
  version: '1.0'
  applicable_bundles:
  - leaflet_more_maps
  checks:
  - kind: must_contain_any
    values:
    - HERE
    - here_api_key
    - Navionics
    - navionics
  scoring:
    combine: all_pass
- id: leaflet_more_maps_leaflet_more_maps_thunderforest_key
  version: '1.0'
  applicable_bundles:
  - leaflet_more_maps
  checks:
  - kind: must_contain_any
    values:
    - lmm-eval-tfkey-7f3a9c
  scoring:
    combine: all_pass
- id: leaflet_more_maps_leaflet_more_maps_custom_map_config
  version: '1.0'
  applicable_bundles:
  - leaflet_more_maps
  checks:
  - kind: must_contain_any
    values:
    - LMM Weather Combo
  scoring:
    combine: all_pass
- id: leaflet_more_maps_leaflet_more_maps_thunderforest_threading
  version: '1.0'
  applicable_bundles:
  - leaflet_more_maps
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
- id: leaflet_more_maps_leaflet_more_maps_custom_map_assembly
  version: '1.0'
  applicable_bundles:
  - leaflet_more_maps
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
