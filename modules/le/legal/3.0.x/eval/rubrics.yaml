rubrics:
- id: legal_legal_where_enter_terms
  version: '1.0'
  applicable_bundles:
  - legal
  checks:
  - kind: must_contain_any
    values:
    - /admin/config/people/legal
    - config/people/legal
    - legal.config_legal
  scoring:
    combine: all_pass
- id: legal_legal_add_terms_code
  version: '1.0'
  applicable_bundles:
  - legal
  checks:
  - kind: must_contain_any
    values:
    - Conditions::create
    - legal_conditions
    - legal_version
  scoring:
    combine: all_pass
- id: legal_legal_display_styles
  version: '1.0'
  applicable_bundles:
  - legal
  checks:
  - kind: must_contain_any
    values:
    - registration_terms_style
    - Scroll box
    - HTML
    - Page link
  scoring:
    combine: all_pass
- id: legal_legal_accept_every_login
  version: '1.0'
  applicable_bundles:
  - legal
  checks:
  - kind: must_contain_any
    values:
    - every login
    - every
    - 'true'
    - accept_every_login
  scoring:
    combine: all_pass
- id: legal_legal_reg_style_configured
  version: '1.0'
  applicable_bundles:
  - legal
  checks:
  - kind: must_contain_any
    values:
    - HTML
    - '2'
  scoring:
    combine: all_pass
- id: legal_legal_create_terms
  version: '1.0'
  applicable_bundles:
  - legal
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
- id: legal_legal_require_every_login_exempt_admin
  version: '1.0'
  applicable_bundles:
  - legal
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
