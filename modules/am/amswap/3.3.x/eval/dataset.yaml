metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: amswap
  version: 3.3.x
  note: 'Admin Menu Swap replaces the toolbar administration (''Manage'') menu per role. Its only persistent
    state is the config object amswap.amswapconfig -> role_menu_pairs, a sequence of {role, menu, ignored_roles[]}.
    Config route amswap.amswap_config_form at /admin/config/amswap, permission ''administer amswap''.
    Depends on toolbar + user. Medium/hard cases are grounded in that real config: introspection reads
    back which menu/ignored_roles a pair carries; execution builds a role-menu pair verified against amswap.amswapconfig.
    Test roles are namespaced amswap_* and menus used (''tools'',''footer'',''main'') are core default
    menus.'
questions:
- id: amswap-where-configured
  input: Using the Drupal contrib module amswap (Admin Menu Swap), how do I make a particular user role
    see a different administration (Manage) toolbar menu? Name the config page/route and the permission
    required.
  criteria: Go to /admin/config/amswap (route amswap.amswap_config_form, permission 'administer amswap')
    and add a role-menu pair choosing the menu to display and the role it applies to. Pairs are saved
    in amswap.amswapconfig:role_menu_pairs.
  bundle: amswap
  rubric_ref: rubric/amswap_amswap_where_configured@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: amswap-config-shape
  input: In the amswap module, which config object stores the role-to-menu mappings, and what fields does
    each stored pair contain?
  criteria: The config object amswap.amswapconfig has one key, role_menu_pairs, a sequence of mappings
    each with role (role id), menu (menu id to show), and optional ignored_roles (roles that suppress
    the pair).
  bundle: amswap
  rubric_ref: rubric/amswap_amswap_config_shape@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: amswap-no-match
  input: With amswap installed, what admin toolbar menu does a user see if none of the configured role-menu
    pairs match their roles, and what is the purpose of a pair's 'ignored_roles'?
  criteria: If no pair matches the user's roles, amswap falls back to the default 'admin' (system.admin)
    administration menu. A pair's ignored_roles lists roles that, if the user also has any of them, cause
    that pair to be skipped.
  bundle: amswap
  rubric_ref: rubric/amswap_amswap_no_match@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: amswap-known-menu
  input: On this Drupal site, amswap is configured so the 'amswap_reviewer' role gets a swapped administration
    menu. Inspect the live amswap configuration and state which menu is shown to that role.
  criteria: 'The amswap_reviewer role is paired with the ''tools'' menu: amswap.amswapconfig:role_menu_pairs
    has {role: amswap_reviewer, menu: tools}.'
  bundle: amswap
  rubric_ref: rubric/amswap_amswap_known_menu@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/amswap-known-menu-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/amswap-known-menu-cleanup.sh
- id: amswap-ignored-roles
  input: On this site the amswap role-menu pair for the 'amswap_reviewer' role is configured to be skipped
    for users who also hold a certain role. Inspect the live amswap configuration and name the role listed
    in that pair's ignored_roles.
  criteria: 'The pair''s ignored_roles contains ''administrator'': in amswap.amswapconfig the amswap_reviewer
    pair has ignored_roles: [administrator], so users who are also administrators keep the default menu.'
  bundle: amswap
  rubric_ref: rubric/amswap_amswap_ignored_roles@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/amswap-ignored-roles-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/amswap-ignored-roles-cleanup.sh
- id: amswap-set-pair
  input: On this Drupal site there is a role 'amswap_task'. Using the amswap module, configure the administration
    toolbar so that users with the amswap_task role see the 'tools' menu as their Manage menu. Apply the
    change to the live site.
  criteria: 'amswap.amswapconfig:role_menu_pairs contains a pair {role: amswap_task, menu: tools} (add
    it via /admin/config/amswap or by setting the config directly).'
  bundle: amswap
  rubric_ref: rubric/amswap_amswap_set_pair@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/amswap-set-pair-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/amswap-set-pair-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/amswap-set-pair-verify.sh
- id: amswap-ignore-pair
  input: On this Drupal site there is a role 'amswap_task2'. Using amswap, configure the toolbar so amswap_task2
    users see the 'footer' menu as their administration menu, EXCEPT when the user is also an 'administrator'
    (in which case the swap should be skipped). Apply the change to the live site.
  criteria: 'amswap.amswapconfig:role_menu_pairs contains a pair {role: amswap_task2, menu: footer, ignored_roles:
    [administrator]}.'
  bundle: amswap
  rubric_ref: rubric/amswap_amswap_ignore_pair@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/amswap-ignore-pair-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/amswap-ignore-pair-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/amswap-ignore-pair-verify.sh
