metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: simplenews
  version: 4.1.x
  note: Simplenews has a three-entity model (newsletter config entity, subscriber content entity, issue
    = node with a field), spool+cron sending, double opt-in, a subscription-manager service, a recipient-handler
    plugin type, and six permissions. Cases are `recipe` (response-graded) probing documented facts an
    agent would otherwise read source to answer; no site mutation.
questions:
- id: simplenews-three-entity-model
  input: In Simplenews on Drupal 11, what is the difference between a newsletter, a subscriber, and a
    newsletter issue, and what entity/type is each?
  criteria: A newsletter is a simplenews_newsletter config entity (a list/category); a subscriber is a
    simplenews_subscriber content entity keyed by email; an issue is a node whose content type has the
    simplenews_issue field.
  bundle: simplenews
  rubric_ref: rubric/simplenews_simplenews_three_entity_model@1.0
  tags:
  - mode:recipe
- id: simplenews-issue-field-on-node
  input: How do I make a content type able to be sent as a Simplenews newsletter issue?
  criteria: Attach the simplenews_issue field to the content type (via the content type edit form); each
    node of that type then becomes an issue with a Newsletter tab to send/test.
  bundle: simplenews
  rubric_ref: rubric/simplenews_simplenews_issue_field_on_node@1.0
  tags:
  - mode:recipe
- id: simplenews-sending-spool-cron
  input: How does Simplenews actually send a newsletter issue to subscribers — describe the spool and
    cron flow and the two services involved.
  criteria: Sending an issue writes one spool row per recipient via simplenews.spool_storage (addIssue);
    simplenews.mailer->sendSpool() drains it during cron (mail.throttle mails per run) or immediately
    when mail.use_cron is FALSE.
  bundle: simplenews
  rubric_ref: rubric/simplenews_simplenews_sending_spool_cron@1.0
  tags:
  - mode:recipe
- id: simplenews-throttle-cron-setting
  input: Which Simplenews settings control whether mails are sent during cron and how many go out per
    cron run? Give the config object and keys.
  criteria: 'On simplenews.settings: mail.use_cron (default TRUE) sends the spool during cron; mail.throttle
    (default 20) is the number of mails per cron run.'
  bundle: simplenews
  rubric_ref: rubric/simplenews_simplenews_throttle_cron_setting@1.0
  tags:
  - mode:recipe
- id: simplenews-subscribe-in-code
  input: In PHP on a Drupal 11 site, subscribe an email address to a Simplenews newsletter programmatically
    and check whether it is already subscribed. Which service and methods?
  criteria: 'Use the simplenews.subscription_manager service: subscribe($mail, $newsletter_id, $langcode)
    to subscribe and isSubscribed($mail, $newsletter_id) to check.'
  bundle: simplenews
  rubric_ref: rubric/simplenews_simplenews_subscribe_in_code@1.0
  tags:
  - mode:recipe
- id: simplenews-double-optin
  input: How does Simplenews handle double opt-in for anonymous subscribers, and which setting disables
    the confirmation step?
  criteria: Anonymous subscribers are created UNCONFIRMED and emailed a hash-authenticated confirmation
    link before becoming ACTIVE; subscription.skip_verification (default FALSE) on simplenews.settings
    disables the confirmation.
  bundle: simplenews
  rubric_ref: rubric/simplenews_simplenews_double_optin@1.0
  tags:
  - mode:recipe
- id: simplenews-recipient-handler-plugin
  input: In Simplenews, how do I control which subscribers receive a given newsletter issue, and what
    plugin type / default plugin is involved?
  criteria: Recipients are chosen by a simplenews_recipient_handler plugin; the default simplenews_all
    sends to all active subscribers. Implement a custom handler or restrict via the newsletter's allowed_handlers.
  bundle: simplenews
  rubric_ref: rubric/simplenews_simplenews_recipient_handler_plugin@1.0
  tags:
  - mode:recipe
- id: simplenews-permissions
  input: Which Simplenews permission lets front-end visitors subscribe to newsletters, and which one gates
    sending newsletter issues?
  criteria: '''subscribe to newsletters'' allows front-end subscribing (block/subscriptions page); ''send
    newsletter'' gates sending/queuing issues. (Admin gated by ''administer newsletters'' / ''administer
    simplenews subscriptions'' / ''administer simplenews settings''.)'
  bundle: simplenews
  rubric_ref: rubric/simplenews_simplenews_permissions@1.0
  tags:
  - mode:recipe
