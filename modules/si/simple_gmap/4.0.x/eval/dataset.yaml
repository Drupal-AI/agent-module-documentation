metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: simple_gmap
  version: 4.0.x
  note: Simple Google Maps ships a single field formatter (`simple_gmap`) and nothing else — no field
    type, no permissions, no admin settings page. Cases are `recipe` (response-graded) probing documented
    facts an agent would otherwise read source to answer; no site mutation.
questions:
- id: simple_gmap-what-it-provides
  input: On a Drupal 11 site I have a plain text field holding an address like `100 Madison Ave, New York,
    NY`. How do I display it as an embedded Google Map? Which module/formatter and where do I set it?
  criteria: Enable Simple Google Maps and, on the field's Manage display (or as a Views field), choose
    the 'Google Map from one-line address' (simple_gmap) formatter. No custom field type is needed.
  bundle: simple_gmap
  rubric_ref: rubric/simple_gmap_simple_gmap_what_it_provides@1.0
  tags:
  - mode:recipe
- id: simple_gmap-field-types
  input: Which field types can the Simple Google Maps formatter be applied to on a Drupal site?
  criteria: The simple_gmap formatter supports string, string_long, computed, and computed_string field
    types — ordinary core Text fields (single- or multi-line).
  bundle: simple_gmap
  rubric_ref: rubric/simple_gmap_simple_gmap_field_types@1.0
  tags:
  - mode:recipe
- id: simple_gmap-zoom-and-maptype
  input: In the Simple Google Maps formatter settings, which setting keys control the zoom level and the
    map type, and what values does the map type accept?
  criteria: zoom_level (1-20, default 14) sets zoom; map_type sets the map type with values m (Map), k
    (Satellite), h (Hybrid), p (Terrain). Both apply to embedded and linked maps.
  bundle: simple_gmap
  rubric_ref: rubric/simple_gmap_simple_gmap_zoom_and_maptype@1.0
  tags:
  - mode:recipe
- id: simple_gmap-dynamic-vs-static
  input: The Simple Google Maps formatter can show a dynamic embedded map or a static map image. Which
    setting keys turn each on, and which one needs a Google Maps API key?
  criteria: include_map enables the dynamic iframe map (no API key needed); include_static_map enables
    the static map image, which requires the apikey setting.
  bundle: simple_gmap
  rubric_ref: rubric/simple_gmap_simple_gmap_dynamic_vs_static@1.0
  tags:
  - mode:recipe
- id: simple_gmap-api-key
  input: Does the Simple Google Maps embedded iframe map require a Google Maps API key? When is an API
    key actually needed?
  criteria: The dynamic iframe map and the map link need no API key. An API key (apikey setting) is only
    required for the static map image (include_static_map).
  bundle: simple_gmap
  rubric_ref: rubric/simple_gmap_simple_gmap_api_key@1.0
  tags:
  - mode:recipe
- id: simple_gmap-iframe-size
  input: How do I set the size of the embedded Simple Google Maps map, and what size format do static
    maps require?
  criteria: Set iframe_width and iframe_height (px or percent, e.g. 600px or 100%, default 200). Static
    maps only accept bare pixel values without the px suffix (e.g. 600).
  bundle: simple_gmap
  rubric_ref: rubric/simple_gmap_simple_gmap_iframe_size@1.0
  tags:
  - mode:recipe
- id: simple_gmap-link-and-text
  input: With the Simple Google Maps formatter, how do I render just a link to Google Maps (instead of
    an embedded map), and how do I make the link text be the address itself?
  criteria: Enable include_link for a link to Google Maps (turn off include_map). Set link_text to the
    literal 'use_address' to use the entered address as the link text.
  bundle: simple_gmap
  rubric_ref: rubric/simple_gmap_simple_gmap_link_and_text@1.0
  tags:
  - mode:recipe
- id: simple_gmap-theme-override
  input: I want to customize the HTML markup that the Simple Google Maps formatter outputs. Which theme
    hook / template do I override?
  criteria: Override the simple_gmap_output theme hook / simple-gmap-output.html.twig template (copy it
    into your theme and rebuild caches).
  bundle: simple_gmap
  rubric_ref: rubric/simple_gmap_simple_gmap_theme_override@1.0
  tags:
  - mode:recipe
