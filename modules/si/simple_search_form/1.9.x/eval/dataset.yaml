metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: simple_search_form
  version: 1.9.x
  note: 'Simple Search Form provides one Block plugin ''simple_search_form_block'' (a GET-method search
    input + submit) whose entire state lives on placed `block` config entities under settings (schema
    block.settings.simple_search_form_block). Required settings: action_path (must start with / ? or #)
    and get_parameter; submitting redirects to action_path?get_parameter=<typed>. No configure route,
    no permissions, no Drush, no plugin type. Medium cases place a block with known settings and read
    them back from live config; hard cases require placing a working simple_search_form_block with specified
    action_path + get_parameter, verified by scanning live blocks for the plugin + matching settings.
    Blocks are placed in the olivero theme ''content'' region on this site.'
questions:
- id: ssf-required-settings
  input: The Simple Search Form module gives you a block. What is the block plugin's id, and which two
    settings must you provide for the search form to work?
  criteria: 'Block plugin id simple_search_form_block. Required settings: action_path (the URL to submit
    to; must start with /, ? or #) and get_parameter (the query-string key the typed text is sent as).'
  bundle: simple_search_form
  rubric_ref: rubric/simple_search_form_ssf_required_settings@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: ssf-result-url
  input: A Simple Search Form block is configured with Path = /search and GET parameter = q. If a visitor
    types 'shoes' and submits, what URL does the browser go to?
  criteria: /search?q=shoes — the form uses method=get, so it navigates to action_path?get_parameter=<value>.
  bundle: simple_search_form
  rubric_ref: rubric/simple_search_form_ssf_result_url@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: ssf-autocomplete
  input: How do I get autocomplete suggestions in a Simple Search Form search input?
  criteria: Enable the search_api_autocomplete module; then the block's Input element type gains a 'Search
    API Autocomplete' option, and you fill the search_id/display/filter (and optional arguments) in the
    block form.
  bundle: simple_search_form
  rubric_ref: rubric/simple_search_form_ssf_autocomplete@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: ssf-known-parameter
  input: This site has a Simple Search Form block placed (block id 'ssf_medium'). Inspect the live block
    configuration and report which GET parameter name it submits and which path it submits to.
  criteria: 'It submits the GET parameter ''q_ssf'' to the path ''/ssf-search'' (block.block.ssf_medium
    settings: get_parameter=q_ssf, action_path=/ssf-search).'
  bundle: simple_search_form
  rubric_ref: rubric/simple_search_form_ssf_known_parameter@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/simple_search_form-known-parameter-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/simple_search_form-known-parameter-cleanup.sh
- id: ssf-known-submit-label
  input: A Simple Search Form block (id 'ssf_medium2') is placed on this site. Inspect the live block
    configuration and state the text shown on its submit button.
  criteria: '''Go SSF'' — block.block.ssf_medium2 settings.submit_label is ''Go SSF''.'
  bundle: simple_search_form
  rubric_ref: rubric/simple_search_form_ssf_known_submit_label@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/simple_search_form-known-submit-label-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/simple_search_form-known-submit-label-cleanup.sh
- id: ssf-place-block
  input: Using the Simple Search Form module, place a simple_search_form_block in the 'content' region
    of the olivero theme, configured so it submits the GET parameter 'keys_ssf' to the path '/ssf-results'.
    Apply it to the live site.
  criteria: A placed block with plugin simple_search_form_block whose settings.get_parameter = 'keys_ssf'
    and settings.action_path = '/ssf-results' (e.g. Block::create([...,'plugin'=>'simple_search_form_block','settings'=>['action_path'=>'/ssf-results','get_parameter'=>'keys_ssf',...]])->save()).
  bundle: simple_search_form
  rubric_ref: rubric/simple_search_form_ssf_place_block@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/simple_search_form-place-block-a-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/simple_search_form-place-block-a-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/simple_search_form-place-block-a-verify.sh
- id: ssf-place-block-layman
  input: I want a search box on my site. When someone types in it and hits enter, it should take them
    to my /ssf-find page and put what they typed in the address as a query called 'search_terms'. Set
    that up on the live site with the Simple Search Form module.
  criteria: A placed simple_search_form_block whose settings.action_path = '/ssf-find' and settings.get_parameter
    = 'search_terms'.
  bundle: simple_search_form
  rubric_ref: rubric/simple_search_form_ssf_place_block_layman@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: site-owner-layman
    reset: agent-module-documentation/evaluation/verify/simple_search_form-place-block-b-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/simple_search_form-place-block-b-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/simple_search_form-place-block-b-verify.sh
