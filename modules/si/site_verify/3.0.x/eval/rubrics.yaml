rubrics:
- id: site_verify_site_verify_config_entity_basics
  version: '1.0'
  applicable_bundles:
  - site_verify
  checks:
  - kind: must_contain_any
    values:
    - site_verification
    - entity.site_verification.collection
    - /admin/config/search/verifications
  scoring:
    combine: all_pass
- id: site_verify_site_verify_meta_vs_file
  version: '1.0'
  applicable_bundles:
  - site_verify
  checks:
  - kind: must_contain_any
    values:
    - front page
    - meta tag
    - site root
    - text/plain
  scoring:
    combine: all_pass
- id: site_verify_site_verify_permissions
  version: '1.0'
  applicable_bundles:
  - site_verify
  checks:
  - kind: must_contain_any
    values:
    - administer site verify
    - manage file based site verifications
  scoring:
    combine: all_pass
- id: site_verify_site_verify_meta_token
  version: '1.0'
  applicable_bundles:
  - site_verify
  checks:
  - kind: must_contain_any
    values:
    - gsc-9f8e7d6c5b4a3210
  scoring:
    combine: all_pass
- id: site_verify_site_verify_file_enabled
  version: '1.0'
  applicable_bundles:
  - site_verify
  checks:
  - kind: must_contain_any
    values:
    - sv_file_on
  scoring:
    combine: all_pass
- id: site_verify_site_verify_create_meta
  version: '1.0'
  applicable_bundles:
  - site_verify
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
- id: site_verify_site_verify_create_file
  version: '1.0'
  applicable_bundles:
  - site_verify
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
