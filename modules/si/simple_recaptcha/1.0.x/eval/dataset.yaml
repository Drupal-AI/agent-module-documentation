metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: simple_recaptcha
  version: 1.0.x
  note: 'Simple Google reCaptcha attaches reCAPTCHA to forms listed in config object simple_recaptcha.config
    (keys form_ids CSV with * wildcards, recaptcha_type v2|v3, site_key/secret_key, site_key_v3/secret_key_v3,
    v3_score int default 80, recaptcha_use_globally bool, hide_badge_v3 bool). NOTE the route is simple_recaptcha.settings
    but the config OBJECT is simple_recaptcha.config. Actually verifying a captcha requires Google reCAPTCHA
    keys (external), so all medium/hard cases are grounded in the LOCAL config object only, verifiable
    via drush php:eval: introspection reads back the protected form_ids and the v3 type/score; execution
    adds a form to form_ids and switches to v3 with a score threshold. Booleans/integers are set via the
    config API to avoid drush config:set mis-casting.'
questions:
- id: simple_recaptcha-config-object
  input: Using the simple_recaptcha module, which forms get reCAPTCHA is controlled by a config value.
    What is the config object's name and the key that lists the protected form IDs?
  criteria: The config object is simple_recaptcha.config (note the admin route is simple_recaptcha.settings).
    Its 'form_ids' key is a comma-separated list of form IDs to protect, supporting * wildcards.
  bundle: simple_recaptcha
  rubric_ref: rubric/simple_recaptcha_simple_recaptcha_config_object@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: simple_recaptcha-versions
  input: Which reCAPTCHA versions does the simple_recaptcha module support, and which config key selects
    between them?
  criteria: It supports reCAPTCHA v2 (checkbox) and v3 (invisible); the recaptcha_type key in simple_recaptcha.config
    selects 'v2' or 'v3'. For v3 the v3_score key sets the minimum score.
  bundle: simple_recaptcha
  rubric_ref: rubric/simple_recaptcha_simple_recaptcha_versions@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: simple_recaptcha-bypass
  input: How can certain users or forms skip the reCAPTCHA that simple_recaptcha adds? Name the permission
    and the alter hook.
  criteria: Users with the 'bypass simple_recaptcha' permission skip reCAPTCHA on all forms; code can
    also implement hook_simple_recaptcha_bypass_alter(&$form, &$result) and set $result = TRUE to leave
    a given form unprotected.
  bundle: simple_recaptcha
  rubric_ref: rubric/simple_recaptcha_simple_recaptcha_bypass@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: simple_recaptcha-known-formids
  input: On this site, inspect the simple_recaptcha configuration and tell me which forms are currently
    protected by reCAPTCHA (the configured form IDs).
  criteria: config simple_recaptcha.config form_ids = 'user_login_form,contact_message_feedback,webform_submission_*'
    (so the login form, the feedback contact form, and all webform submission forms are protected).
  bundle: simple_recaptcha
  rubric_ref: rubric/simple_recaptcha_simple_recaptcha_known_formids@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/simple_recaptcha-formids-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/simple_recaptcha-formids-cleanup.sh
- id: simple_recaptcha-known-v3
  input: Inspect the live simple_recaptcha configuration and tell me which reCAPTCHA version is active
    and, if it is v3, what minimum score threshold is configured.
  criteria: recaptcha_type is v3 and v3_score is 65 in config simple_recaptcha.config.
  bundle: simple_recaptcha
  rubric_ref: rubric/simple_recaptcha_simple_recaptcha_known_v3@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/simple_recaptcha-v3-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/simple_recaptcha-v3-cleanup.sh
- id: simple_recaptcha-protect-login
  input: Configure the simple_recaptcha module so that the user login form (form id user_login_form) is
    protected by reCAPTCHA, in addition to whatever is already protected. Apply the change to the live
    site.
  criteria: Add user_login_form to the comma-separated form_ids in config simple_recaptcha.config (e.g.
    set form_ids to 'user_pass,user_register_form,user_login_form') and save. verify checks user_login_form
    is in the list.
  bundle: simple_recaptcha
  rubric_ref: rubric/simple_recaptcha_simple_recaptcha_protect_login@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/simple_recaptcha-protect-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/simple_recaptcha-protect-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/simple_recaptcha-protect-verify.sh
- id: simple_recaptcha-switch-v3
  input: Switch the simple_recaptcha module to reCAPTCHA v3 (invisible) and set the minimum acceptable
    score to 75. Apply the change to the live site's configuration.
  criteria: In config simple_recaptcha.config set recaptcha_type = 'v3' and v3_score = 75 and save (e.g.
    \Drupal::configFactory()->getEditable('simple_recaptcha.config')->set('recaptcha_type','v3')->set('v3_score',75)->save()).
  bundle: simple_recaptcha
  rubric_ref: rubric/simple_recaptcha_simple_recaptcha_switch_v3@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/simple_recaptcha-switchv3-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/simple_recaptcha-switchv3-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/simple_recaptcha-switchv3-verify.sh
