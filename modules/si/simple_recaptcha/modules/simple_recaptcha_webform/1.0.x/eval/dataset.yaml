    cleanup: agent-module-documentation/evaluation/verify/simple_recaptcha_webform-handler-cleanup.sh
- id: simple_recaptcha_webform-known-message
  input: The webform srw_msg has a simple_recaptcha handler with a custom v3 error message. Inspect the
    live webform configuration and quote that error message.
  criteria: The handler's v3_error_message is 'Bots are not welcome here.'
  bundle: simple_recaptcha_webform
  rubric_ref: rubric/simple_recaptcha_webform_simple_recaptcha_webform_known_message@1.0
  tags:
