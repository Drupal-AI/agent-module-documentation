    cleanup: agent-module-documentation/evaluation/verify/simple_recaptcha_webform-message-cleanup.sh
- id: simple_recaptcha_webform-add-handler
  input: The webform srw_task currently has no reCAPTCHA protection. Using the simple_recaptcha_webform
    submodule, add its reCAPTCHA handler to the srw_task webform and apply the change to the live site.
  criteria: Add a webform handler with plugin id simple_recaptcha to the srw_task webform and save, e.g.
    create it via the webform handler plugin manager and $webform->addWebformHandler($handler); $webform->save();
    verify checks the webform has a handler whose plugin id is simple_recaptcha.
  bundle: simple_recaptcha_webform
  rubric_ref: rubric/simple_recaptcha_webform_simple_recaptcha_webform_add_handler@1.0
