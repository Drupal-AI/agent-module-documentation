metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: simple_recaptcha_webform
  version: 1.0.x
  note: 'Bridges simple_recaptcha and webform via a single Webform handler plugin (id simple_recaptcha).
    Handler settings: recaptcha_type (v2|v3), v3_score (default 90), v3_error_message, hide_badge_v3.
    The site/secret keys still come from the parent module''s global simple_recaptcha.config. Actually
    verifying a captcha needs Google keys (external), so all medium/hard cases are grounded in LOCAL webform-handler
    config verifiable via drush php:eval on a throwaway webform: introspection reads back the handler''s
    type/score/message; execution adds and configures the handler on a webform. Uses namespaced test webforms
    (srw_*).'
questions:
- id: simple_recaptcha_webform-handler-id
  input: The simple_recaptcha_webform submodule lets me add reCAPTCHA to a single webform. What is the
    id of the Webform handler plugin it provides, and where do I add it?
  criteria: It provides a Webform handler plugin with id 'simple_recaptcha' (label reCAPTCHA). Add it
    on a webform via Settings -> Handlers -> Add handler -> reCAPTCHA.
  bundle: simple_recaptcha_webform
  rubric_ref: rubric/simple_recaptcha_webform_simple_recaptcha_webform_handler_id@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: simple_recaptcha_webform-handler-settings
  input: What settings can I configure on the simple_recaptcha webform handler for reCAPTCHA v3?
  criteria: On the handler you set recaptcha_type (v2 or v3) and, for v3, v3_score (minimum score, default
    90), v3_error_message (shown when the check fails), and hide_badge_v3.
  bundle: simple_recaptcha_webform
  rubric_ref: rubric/simple_recaptcha_webform_simple_recaptcha_webform_handler_settings@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: simple_recaptcha_webform-keys-source
  input: When using the simple_recaptcha webform handler, where do the actual reCAPTCHA site key and secret
    key come from?
  criteria: The keys are NOT on the handler; they come from the parent simple_recaptcha module's global
    config simple_recaptcha.config (site_key/secret_key for v2, site_key_v3/secret_key_v3 for v3). The
    handler only chooses the version and scoring per webform.
  bundle: simple_recaptcha_webform
  rubric_ref: rubric/simple_recaptcha_webform_simple_recaptcha_webform_keys_source@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: simple_recaptcha_webform-known-handler
  input: A webform named srw_known on this site has the simple_recaptcha handler attached. Inspect its
    live configuration and tell me which reCAPTCHA version and which minimum score the handler is set
    to.
  criteria: The srw_known webform's simple_recaptcha handler is configured with recaptcha_type v3 and
    v3_score 88.
  bundle: simple_recaptcha_webform
  rubric_ref: rubric/simple_recaptcha_webform_simple_recaptcha_webform_known_handler@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
