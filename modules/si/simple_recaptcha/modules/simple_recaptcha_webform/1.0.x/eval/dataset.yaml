- id: simple_recaptcha_webform-configure-v3
  input: On the webform srw_cfg, add the simple_recaptcha handler configured to use reCAPTCHA v3 with
    a minimum score of 70, and apply the change to the live site.
  criteria: Add a simple_recaptcha handler to srw_cfg with settings recaptcha_type = 'v3' and v3_score
