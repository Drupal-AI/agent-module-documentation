rubrics:
- id: similarterms_similarterms_related_block
  version: '1.0'
  applicable_bundles:
  - similarterms
  checks:
  - kind: must_contain_any
    values:
    - Similar by terms
    - contextual filter
    - similar_nid
    - similar_terms_arg
    - sort
    - Similarity
  scoring:
    combine: all_pass
- id: similarterms_similarterms_min_match
  version: '1.0'
  applicable_bundles:
  - similarterms
  checks:
  - kind: must_contain_any
    values:
    - min_match_percentage
    - percentage
    - 100%
    - exact
    - all the same terms
    - HAVING
  scoring:
    combine: all_pass
- id: similarterms_similarterms_weights_and_entity_index
  version: '1.0'
  applicable_bundles:
  - similarterms
  checks:
  - kind: must_contain_any
    values:
    - weight
    - term weight
    - sum of term weights
    - taxonomy_entity_index
    - Taxonomy Entity Index
  scoring:
    combine: all_pass
- id: similarterms_similarterms_inspect_min_match
  version: '1.0'
  applicable_bundles:
  - similarterms
  checks:
  - kind: must_contain_any
    values:
    - '75'
  scoring:
    combine: all_pass
- id: similarterms_similarterms_inspect_field_display
  version: '1.0'
  applicable_bundles:
  - similarterms
  checks:
  - kind: must_contain_any
    values:
    - weight
    - sum of
    - count_type
    - '2'
  scoring:
    combine: all_pass
- id: similarterms_similarterms_add_argument
  version: '1.0'
  applicable_bundles:
  - similarterms
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
- id: similarterms_similarterms_add_weight_sort
  version: '1.0'
  applicable_bundles:
  - similarterms
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
