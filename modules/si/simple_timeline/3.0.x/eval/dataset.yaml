metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: simple_timeline
  version: 3.0.x
  note: 'Simple Timeline is a single Views style plugin (id simple_timeline, class SimpleTimeline extending
    StylePluginBase, theme views_view_simple_timeline). It has no settings form, no configure route, no
    permissions, no Drush. Its only persistent state is a view display''s style config: views.view.<id>
    -> display.<display>.display_options.style.{type, options}. The four options are position_items (alternate/left/right),
    position_marker (marker-top/marker-center/marker-bottom), wrapper_class (default wrapper-list) and
    class (default item-list). medium/hard cases create namespaced views (st_*) with base_table node_field_data
    and read/write the style config; cleanup deletes the view.'
questions:
- id: simple_timeline-style-id
  input: How do I display a Drupal view as a vertical timeline using the simple_timeline module? What
    kind of plugin does it provide and how do I use it?
  criteria: It provides a Views style plugin 'simple_timeline' ('Simple Timeline'). In a view choose Format
    -> Simple Timeline; the rows are then rendered on a vertical timeline.
  bundle: simple_timeline
  rubric_ref: rubric/simple_timeline_simple_timeline_style_id@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: simple_timeline-item-position
  input: In the simple_timeline views style, how can I control whether items appear on the left, right,
    or alternate around the timeline line? Which option key controls that and what are its values?
  criteria: The style option position_items controls it, with values alternate (default), left, or right.
  bundle: simple_timeline
  rubric_ref: rubric/simple_timeline_simple_timeline_item_position@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: simple_timeline-marker-css
  input: In the simple_timeline module, which option sets the marker's vertical position, and how do I
    change the timeline line colour or the marker's look?
  criteria: 'position_marker (marker-top / marker-center / marker-bottom) sets the marker''s vertical
    position. Colours/shapes are changed with CSS in your theme, e.g. `ul.timeline-list:after { background-color:
    ... }` for the line and `span.timeline-marker { ... }` for the marker.'
  bundle: simple_timeline
  rubric_ref: rubric/simple_timeline_simple_timeline_marker_css@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: simple_timeline-items
  input: On this Drupal site there is a view named 'st_demo' that renders its rows with the Simple Timeline
    style. Inspect the live view configuration and state how its items are positioned relative to the
    timeline (alternate, left, or right).
  criteria: 'position_items is ''left''. Read it from views.view.st_demo default display: display_options.style.options.position_items.'
  bundle: simple_timeline
  rubric_ref: rubric/simple_timeline_simple_timeline_items@1.0
  tags:
  - mode:introspection
  - difficulty:medium
