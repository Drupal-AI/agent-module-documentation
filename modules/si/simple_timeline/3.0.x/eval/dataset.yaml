  criteria: 'position_marker is ''marker-bottom''. Read it from views.view.st_marker default display:
    display_options.style.options.position_marker.'
  bundle: simple_timeline
  rubric_ref: rubric/simple_timeline_simple_timeline_marker@1.0
  tags:
