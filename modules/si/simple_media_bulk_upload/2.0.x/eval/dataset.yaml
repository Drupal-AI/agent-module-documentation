metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: simple_media_bulk_upload
  version: 2.0.x
  note: 'Simple Media Bulk Upload provides a DropzoneJS-backed bulk upload form at /admin/content/media/bulk-upload
    (route simple_media_bulk_upload.bulk_upload, permission ''dropzone upload files'') that creates one
    Media entity per dropped file, and a settings form (route simple_media_bulk_upload.config_form) with
    a single config key simple_media_bulk_upload.settings:max_files (default 30, 0 = unlimited). Its only
    persistent, per-site configuration is max_files, so medium/hard cases are grounded in that real config
    value: introspection reads the current max_files, execution sets it and verifies against live config.
    Actual file uploads need a browser/DropzoneJS and file-based media types, so cases do not attempt
    real uploads.'
questions:
- id: simple_media_bulk_upload-form-route
  input: In the Simple Media Bulk Upload module for Drupal, what is the path of the bulk upload form and
    which permission is required to reach it?
  criteria: The form is at /admin/content/media/bulk-upload (route simple_media_bulk_upload.bulk_upload)
    and requires the 'dropzone upload files' permission (provided by the dropzonejs dependency).
  bundle: simple_media_bulk_upload
  rubric_ref: rubric/simple_media_bulk_upload_simple_media_bulk_upload_form_route@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: simple_media_bulk_upload-maxfiles-key
  input: Which config setting limits how many files can be uploaded at once in Simple Media Bulk Upload,
    what is its default, and how do I make uploads unlimited?
  criteria: The setting is max_files in the simple_media_bulk_upload.settings config object (edited at
    /admin/config/media/simple-media-bulk-upload). Default is 30; set it to 0 for no limit.
  bundle: simple_media_bulk_upload
  rubric_ref: rubric/simple_media_bulk_upload_simple_media_bulk_upload_maxfiles_key@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: simple_media_bulk_upload-which-media-types
  input: Simple Media Bulk Upload only lets you bulk upload into certain media types. Which media types
    are offered, and what module does it depend on for the drag-and-drop widget?
  criteria: 'Only media types whose source field is file-based (a FileItem or subclass: file, image, video
    file, audio file) and that the user can create are offered. The drag-and-drop widget comes from the
    dropzonejs module dependency.'
  bundle: simple_media_bulk_upload
  rubric_ref: rubric/simple_media_bulk_upload_simple_media_bulk_upload_which_media_types@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: simple_media_bulk_upload-maxfiles-known
  input: On this Drupal site, how many files does Simple Media Bulk Upload currently allow a user to upload
    at once? Inspect the live configuration and give the number.
  criteria: 12 — read from config simple_media_bulk_upload.settings:max_files (e.g. drush cget simple_media_bulk_upload.settings
    max_files).
  bundle: simple_media_bulk_upload
  rubric_ref: rubric/simple_media_bulk_upload_simple_media_bulk_upload_maxfiles_known@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/simple_media_bulk_upload-maxfiles-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/simple_media_bulk_upload-maxfiles-cleanup.sh
- id: simple_media_bulk_upload-unlimited-known
  input: 'Inspect this site''s Simple Media Bulk Upload configuration: is there currently a limit on how
    many files can be bulk uploaded at once, or is it unlimited? Explain how you can tell.'
  criteria: 'Unlimited: max_files is 0 in simple_media_bulk_upload.settings, and 0 means no limit.'
  bundle: simple_media_bulk_upload
  rubric_ref: rubric/simple_media_bulk_upload_simple_media_bulk_upload_unlimited_known@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/simple_media_bulk_upload-unlimited-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/simple_media_bulk_upload-unlimited-cleanup.sh
- id: simple_media_bulk_upload-set-limit
  input: On this Drupal site, change Simple Media Bulk Upload so that at most 100 files can be uploaded
    at once. Apply the change to the live site.
  criteria: Set simple_media_bulk_upload.settings:max_files to 100 (e.g. drush cset simple_media_bulk_upload.settings
    max_files 100 -y, or via /admin/config/media/simple-media-bulk-upload). Verified against live config.
  bundle: simple_media_bulk_upload
  rubric_ref: rubric/simple_media_bulk_upload_simple_media_bulk_upload_set_limit@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/simple_media_bulk_upload-set-limit-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/simple_media_bulk_upload-set-limit-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/simple_media_bulk_upload-set-limit-verify.sh
- id: simple_media_bulk_upload-make-unlimited
  input: A content editor complains that Simple Media Bulk Upload stops them after a fixed number of files.
    Reconfigure this site so there is no cap at all on the number of files they can bulk upload, and apply
    it live.
  criteria: Set simple_media_bulk_upload.settings:max_files to 0 (0 means unlimited). Verified against
    live config.
  bundle: simple_media_bulk_upload
  rubric_ref: rubric/simple_media_bulk_upload_simple_media_bulk_upload_make_unlimited@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: site-builder
    reset: agent-module-documentation/evaluation/verify/simple_media_bulk_upload-unlimited-exec-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/simple_media_bulk_upload-unlimited-exec-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/simple_media_bulk_upload-unlimited-exec-verify.sh
