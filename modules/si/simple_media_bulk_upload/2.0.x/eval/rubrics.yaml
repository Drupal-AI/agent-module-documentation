rubrics:
- id: simple_media_bulk_upload_simple_media_bulk_upload_form_route
  version: '1.0'
  applicable_bundles:
  - simple_media_bulk_upload
  checks:
  - kind: must_contain_any
    values:
    - /admin/content/media/bulk-upload
    - admin/content/media/bulk-upload
    - dropzone upload files
  scoring:
    combine: all_pass
- id: simple_media_bulk_upload_simple_media_bulk_upload_maxfiles_key
  version: '1.0'
  applicable_bundles:
  - simple_media_bulk_upload
  checks:
  - kind: must_contain_any
    values:
    - max_files
    - simple_media_bulk_upload.settings
  scoring:
    combine: all_pass
- id: simple_media_bulk_upload_simple_media_bulk_upload_which_media_types
  version: '1.0'
  applicable_bundles:
  - simple_media_bulk_upload
  checks:
  - kind: must_contain_any
    values:
    - dropzonejs
    - dropzone
    - file-based
    - file
    - source field
  scoring:
    combine: all_pass
- id: simple_media_bulk_upload_simple_media_bulk_upload_maxfiles_known
  version: '1.0'
  applicable_bundles:
  - simple_media_bulk_upload
  checks:
  - kind: must_contain_any
    values:
    - '12'
  scoring:
    combine: all_pass
- id: simple_media_bulk_upload_simple_media_bulk_upload_unlimited_known
  version: '1.0'
  applicable_bundles:
  - simple_media_bulk_upload
  checks:
  - kind: must_contain_any
    values:
    - unlimited
    - no limit
    - '0'
  scoring:
    combine: all_pass
- id: simple_media_bulk_upload_simple_media_bulk_upload_set_limit
  version: '1.0'
  applicable_bundles:
  - simple_media_bulk_upload
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
- id: simple_media_bulk_upload_simple_media_bulk_upload_make_unlimited
  version: '1.0'
  applicable_bundles:
  - simple_media_bulk_upload
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
