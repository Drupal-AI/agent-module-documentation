- id: simple-image-rotate-enable-task
  input: On this site the Article content type has an image field field_sir_task. Using simple_image_rotate,
    enable the rotate function on that field, and apply the change to the live site.
  criteria: 'Set the third-party setting on the field''s FieldConfig: FieldConfig::loadByName(''node'',''article'',''field_sir_task'')->setThirdPartySetting(''simple_image_rotate'',''enable_rotate'',TRUE)->save()
