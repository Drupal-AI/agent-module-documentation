  input: The Article content type has two image fields, field_sir_on and field_sir_off. Exactly one has
    simple_image_rotate rotation enabled. Inspect the live configuration and say which one.
  criteria: 'field_sir_on has rotation enabled: its FieldConfig has third_party_settings.simple_image_rotate.enable_rotate
    = true, whereas field_sir_off does not.'
  bundle: simple_image_rotate
  rubric_ref: rubric/simple_image_rotate_simple_image_rotate_on_vs_off@1.0
