- id: simple-image-rotate-enable-photo
  input: I want my editors to be able to rotate the photos they upload to the 'Photo' image field (field_sir_photo)
    on Articles. Turn on the rotate feature for that field on the live site.
  criteria: Enable the rotate function on the field_sir_photo image field by setting third_party_settings.simple_image_rotate.enable_rotate
