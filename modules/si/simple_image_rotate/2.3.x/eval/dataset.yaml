metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: simple_image_rotate
  version: 2.3.x
  note: 'Simple Image Rotate adds a ''Rotate image clockwise'' button to core image field widgets; the
    rotation is applied to the file on entity save (hook_entity_presave rewrites it to an _r<n> name,
    idempotent). It has NO settings page and NO config object; rotation is enabled per image field via
    the third-party setting simple_image_rotate.enable_rotate (boolean) on the field''s FieldConfig, and
    the button also requires the ''rotate images'' permission. Medium/hard cases are grounded in that
    real third-party setting on image fields on the Article content type (namespaced field_sir_*); each
    case creates/inspects/toggles the enable_rotate setting and cleans up its own fields. (Role/permission
    cases are avoided: this shared site currently cannot rebuild its router — an unrelated gdpr/workbench_moderation
    issue makes role saves throw — so the ''rotate images'' permission side is documented but not used
    in a live case.)'
questions:
- id: simple-image-rotate-how-to-enable
  input: How do I turn on image rotation for an image field with the simple_image_rotate module, and what
    else does a user need to see the rotate button?
  criteria: On the image field's edit form tick 'Enable rotate function', which stores the third-party
    setting simple_image_rotate.enable_rotate = true on the field's FieldConfig. The 'Rotate image clockwise'
    button then appears for users who also have the 'rotate images' permission.
  bundle: simple_image_rotate
  rubric_ref: rubric/simple_image_rotate_simple_image_rotate_how_to_enable@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: simple-image-rotate-mechanism
  input: When an editor rotates an image with simple_image_rotate, when and how is the actual image file
    changed?
  criteria: The JS rotates only the preview and records an angle; on entity save hook_entity_presave()
    moves the file to a new _r<counter> filename, rotates the real image via the image factory, updates
    width/height/filesize, and resets the angle to 0 (so it is idempotent).
  bundle: simple_image_rotate
  rubric_ref: rubric/simple_image_rotate_simple_image_rotate_mechanism@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: simple-image-rotate-scope
  input: Which fields does simple_image_rotate work on, does it have a settings page, and what does it
    depend on?
  criteria: It works only on core image fields and depends on the core Image module. It has no settings
    page (configure is null) and no config object — it is enabled per image field via the enable_rotate
    third-party setting, plus the 'rotate images' permission.
  bundle: simple_image_rotate
  rubric_ref: rubric/simple_image_rotate_simple_image_rotate_scope@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: simple-image-rotate-known-field
  input: On this site, the Article content type has an image field with simple_image_rotate rotation enabled.
    Inspect the live field configuration and give the machine name of that field.
  criteria: 'The field is field_sir_known: its FieldConfig on node.article carries third_party_settings.simple_image_rotate.enable_rotate
    = true.'
  bundle: simple_image_rotate
  rubric_ref: rubric/simple_image_rotate_simple_image_rotate_known_field@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/simple_image_rotate-known-field-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/simple_image_rotate-known-field-cleanup.sh
