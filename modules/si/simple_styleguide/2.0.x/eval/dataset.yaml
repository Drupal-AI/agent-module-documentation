metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: simple_styleguide
  version: 2.0.x
  note: 'Simple Styleguide renders one page at /simple-styleguide (route simple_styleguide.controller,
    permission ''access style guide'') showing selected built-in patterns, a colour palette, and custom
    patterns. Settings live in config object simple_styleguide.styleguidesettings (keys default_patterns
    = a checkboxes map over the 11 built-ins headings/text/lists/blockquote/rule/table/alerts/breadcrumbs/forms/buttons/pagination,
    and default_colors = array of ''#hex|class|desc'' strings). Custom patterns are styleguide_pattern
    config entities (config names simple_styleguide.styleguide_pattern.<id>; fields id,label,pattern(raw
    html),description,weight; admin_permission ''administer style guide'') managed at /admin/config/styleguide/patterns.
    Two permissions: ''access style guide'', ''administer style guide'' (restrict access). Theme hooks
    simple_styleguide + simple_styleguide_pattern (per-id suggestion simple_styleguide_pattern__<id>);
    library simple_styleguide.default; page forced noindex,nofollow. No Drush, no plugin types. Medium
    cases read the live config entity + settings; hard cases create a custom pattern entity and toggle
    built-in patterns, verified against live config.'
questions:
- id: simple_styleguide-page-and-entity
  input: In the simple_styleguide module, at what path is the styleguide page shown, what permission controls
    access to it, and what kind of entity stores a custom pattern I add?
  criteria: The styleguide renders at /simple-styleguide (route simple_styleguide.controller), gated by
    the 'access style guide' permission. Custom patterns are 'styleguide_pattern' config entities (config
    names simple_styleguide.styleguide_pattern.<id>).
  bundle: simple_styleguide
  rubric_ref: rubric/simple_styleguide_simple_styleguide_page_and_entity@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: simple_styleguide-default-patterns-list
  input: Which built-in default patterns can I toggle on the simple_styleguide settings form, and in which
    config object is that selection stored?
  criteria: The 11 built-ins are headings, text, lists, blockquote, rule, table, alerts, breadcrumbs,
    forms, buttons, pagination. The selection is stored under key default_patterns in the config object
    simple_styleguide.styleguidesettings (colours are in default_colors as '#hex|class|desc' strings).
  bundle: simple_styleguide
  rubric_ref: rubric/simple_styleguide_simple_styleguide_default_patterns_list@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: simple_styleguide-permissions
  input: What permissions does the simple_styleguide module define and what does each control?
  criteria: '''access style guide'' controls viewing the /simple-styleguide page; ''administer style guide''
    (restrict access) is the admin permission for managing custom styleguide_pattern entities. The settings
    form itself is gated by core ''administer site configuration''.'
  bundle: simple_styleguide
  rubric_ref: rubric/simple_styleguide_simple_styleguide_permissions@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: simple_styleguide-live-custom-pattern
  input: This site has a custom Simple Styleguide pattern configured. Inspect the site's styleguide_pattern
    config entities and tell me the machine name (id) of the custom pattern.
  criteria: The custom pattern's id is ssg_known (config simple_styleguide.styleguide_pattern.ssg_known,
    label 'SSG Known Card'). Find it via the styleguide_pattern entity storage or drush config:get.
  bundle: simple_styleguide
  rubric_ref: rubric/simple_styleguide_simple_styleguide_live_custom_pattern@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/simple_styleguide-known-pattern-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/simple_styleguide-known-pattern-cleanup.sh
- id: simple_styleguide-live-default-patterns
  input: On this site, which built-in Simple Styleguide default patterns are currently enabled to appear
    on the styleguide page? Inspect the live configuration and name them.
  criteria: headings and buttons are enabled; all other built-ins are disabled (0). Read simple_styleguide.styleguidesettings.default_patterns,
    e.g. drush cget simple_styleguide.styleguidesettings default_patterns.
  bundle: simple_styleguide
  rubric_ref: rubric/simple_styleguide_simple_styleguide_live_default_patterns@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/simple_styleguide-default-patterns-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/simple_styleguide-default-patterns-cleanup.sh
- id: simple_styleguide-create-pattern
  input: On this site, use the simple_styleguide module to add a custom styleguide pattern with machine
    name 'ssg_task', label 'SSG Task Card', and raw HTML pattern '<div class="ssg-task">Task</div>'. Apply
    the change to the live site.
  criteria: Create a styleguide_pattern config entity id=ssg_task, label='SSG Task Card', pattern='<div
    class="ssg-task">Task</div>' (StyleguidePattern::create([...])->save() or the Add styleguide pattern
    form at /admin/config/styleguide/patterns/add). Stored as simple_styleguide.styleguide_pattern.ssg_task.
  bundle: simple_styleguide
  rubric_ref: rubric/simple_styleguide_simple_styleguide_create_pattern@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/simple_styleguide-create-pattern-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/simple_styleguide-create-pattern-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/simple_styleguide-create-pattern-verify.sh
- id: simple_styleguide-enable-defaults
  input: On this site, configure the simple_styleguide module so that the built-in 'blockquote' and 'table'
    default patterns are shown on the styleguide page. Apply the change to the live site.
  criteria: In simple_styleguide.styleguidesettings set default_patterns.blockquote and default_patterns.table
    to a truthy value (their own key), e.g. via the settings form at /admin/config/styleguide/settings
    or config edit.
  bundle: simple_styleguide
  rubric_ref: rubric/simple_styleguide_simple_styleguide_enable_defaults@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/simple_styleguide-enable-defaults-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/simple_styleguide-enable-defaults-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/simple_styleguide-enable-defaults-verify.sh
