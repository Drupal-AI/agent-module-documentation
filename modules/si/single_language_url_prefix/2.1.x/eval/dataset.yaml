metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: single_language_url_prefix
  version: 2.1.x
  note: Single Language URL Prefix keeps the language URL prefix (e.g. /en) on a site with only one enabled
    language, which core normally drops. It works via a path processor (single_language_url_prefix.path_processor
    / SingleLanguageNegotiationUrl) and only acts when exactly one language is enabled and core language
    negotiation URL source is path prefix with a prefix set. Its own persistent state is a single config
    value single_language_url_prefix.settings.excluded_paths (newline-separated paths/patterns, matched
    with core path.matcher) listing paths that keep working WITHOUT the prefix; the settings form is /admin/config/regional/language/single-language-url-prefix
    (permission administer languages). The module ships default config but no config schema, so excluded_paths
    is an untyped string. Medium cases read the live excluded_paths value; hard cases set excluded_paths,
    verified live. Baselines are restored explicitly (excluded_paths => '') since State is unreliable
    on this site.
questions:
- id: single_language_url_prefix-what
  input: What problem does the Drupal single_language_url_prefix module solve, and when would I need it?
  criteria: Core only adds the language URL prefix (e.g. /en) when more than one language is enabled;
    on a single-language (monolingual) site it drops the prefix. This module re-adds the prefix for the
    single-language case via a path processor, so URLs keep their language segment.
  bundle: single_language_url_prefix
  rubric_ref: rubric/single_language_url_prefix_single_language_url_prefix_what@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: single_language_url_prefix-exclude
  input: Using single_language_url_prefix, how do I stop certain paths (like /admin) from getting the
    language prefix, and where is that list stored?
  criteria: Add them to the Excluded Paths list on the settings form at /admin/config/regional/language/single-language-url-prefix
    (one path per line, wildcards allowed, matched with core's path.matcher). It is stored in single_language_url_prefix.settings.excluded_paths.
  bundle: single_language_url_prefix
  rubric_ref: rubric/single_language_url_prefix_single_language_url_prefix_exclude@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: single_language_url_prefix-requirement
  input: For single_language_url_prefix to actually add the prefix to URLs, how must Drupal's core language
    negotiation be configured?
  criteria: 'Core URL language negotiation must be enabled with source = path prefix and a prefix configured
    for the single language (language.negotiation url: source path_prefix, prefixes: {<langcode>: ''<prefix>''}).
    It also only acts when exactly one language is enabled; with two or more the module is a no-op.'
  bundle: single_language_url_prefix
  rubric_ref: rubric/single_language_url_prefix_single_language_url_prefix_requirement@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: single_language_url_prefix-read-excluded
  input: On this Drupal site, single_language_url_prefix has some paths configured to be excluded from
    the language prefix. Inspect the live configuration and list the excluded path(s).
  criteria: 'The excluded paths are /slup-secret and /slup-secret/*: single_language_url_prefix.settings.excluded_paths
    = "/slup-secret\n/slup-secret/*".'
  bundle: single_language_url_prefix
  rubric_ref: rubric/single_language_url_prefix_single_language_url_prefix_read_excluded@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/single_language_url_prefix-excluded-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/single_language_url_prefix-excluded-cleanup.sh
- id: single_language_url_prefix-read-wildcard
  input: On this Drupal site, which path pattern is currently excluded from the single_language_url_prefix
    language prefix? Inspect the live configuration and state the pattern.
  criteria: 'The excluded pattern is /reports/*: single_language_url_prefix.settings.excluded_paths =
    ''/reports/*''.'
  bundle: single_language_url_prefix
  rubric_ref: rubric/single_language_url_prefix_single_language_url_prefix_read_wildcard@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/single_language_url_prefix-excluded-wild-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/single_language_url_prefix-excluded-wild-cleanup.sh
- id: single_language_url_prefix-exclude-admin
  input: 'On this Drupal site, configure single_language_url_prefix so that the admin area is excluded
    from the language URL prefix: exclude both the path /admin and the pattern /admin/*. Apply the change
    to the live site.'
  criteria: Set single_language_url_prefix.settings.excluded_paths to include a line '/admin' and a line
    '/admin/*' (via the Excluded Paths textarea on /admin/config/regional/language/single-language-url-prefix,
    or by saving the config).
  bundle: single_language_url_prefix
  rubric_ref: rubric/single_language_url_prefix_single_language_url_prefix_exclude_admin@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/single_language_url_prefix-set-admin-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/single_language_url_prefix-set-admin-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/single_language_url_prefix-set-admin-verify.sh
- id: single_language_url_prefix-exclude-api
  input: My one-language site adds a /en to the front of every URL, but my API endpoints under /api/ are
    called by other systems and must not get that language bit. Please make everything under /api/ skip
    the language prefix, and save it on the live site.
  criteria: Add the pattern /api/* to single_language_url_prefix.settings.excluded_paths (via the Excluded
    Paths textarea on the module's settings form, or by saving the config) so paths under /api are served
    without the language prefix.
  bundle: single_language_url_prefix
  rubric_ref: rubric/single_language_url_prefix_single_language_url_prefix_exclude_api@1.0
