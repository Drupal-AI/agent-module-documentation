    values:
    - single language
    - one language
    - monolingual
    - prefix
  scoring:
    combine: all_pass
- id: single_language_url_prefix_single_language_url_prefix_exclude
  version: '1.0'
  applicable_bundles:
  - single_language_url_prefix
  checks:
