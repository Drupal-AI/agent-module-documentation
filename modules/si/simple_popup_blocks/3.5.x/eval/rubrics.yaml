rubrics:
- id: simple_popup_blocks_spb_config_object
  version: '1.0'
  applicable_bundles:
  - simple_popup_blocks
  checks:
  - kind: must_contain_any
    values:
    - simple_popup_blocks.popup_
    - config object
    - CSS selector
    - identifier
  scoring:
    combine: all_pass
- id: simple_popup_blocks_spb_trigger_options
  version: '1.0'
  applicable_bundles:
  - simple_popup_blocks
  checks:
  - kind: must_contain_any
    values:
    - trigger_method
    - automatic
    - on click
    - browser
    - tab close
  scoring:
    combine: all_pass
- id: simple_popup_blocks_spb_layout_and_type
  version: '1.0'
  applicable_bundles:
  - simple_popup_blocks
  checks:
  - kind: must_contain_any
    values:
    - layout
    - center
    - '4'
    - type
  scoring:
    combine: all_pass
- id: simple_popup_blocks_spb_known_promo
  version: '1.0'
  applicable_bundles:
  - simple_popup_blocks
  checks:
  - kind: must_contain_any
    values:
    - promo-banner
    - top bar
    - top-bar
    - manual
    - click
  scoring:
    combine: all_pass
- id: simple_popup_blocks_spb_known_frequency
  version: '1.0'
  applicable_bundles:
  - simple_popup_blocks
  checks:
  - kind: must_contain_any
    values:
    - daily
    - '86400'
    - time frequency
    - use_time_frequency
  scoring:
    combine: all_pass
- id: simple_popup_blocks_spb_create_newsletter
  version: '1.0'
  applicable_bundles:
  - simple_popup_blocks
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
- id: simple_popup_blocks_spb_create_exit_offer
  version: '1.0'
  applicable_bundles:
  - simple_popup_blocks
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
