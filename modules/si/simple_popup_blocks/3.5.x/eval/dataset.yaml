metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: simple_popup_blocks
  version: 3.5.x
  note: 'Three tiers. easy/recipe: response-graded on the per-popup config object, the trigger-method
    and layout/type enums. medium/introspection: setup writes a known simple_popup_blocks.popup_<uid>
    config object live, agent reads it back with drush, cleanup deletes it. hard/execution: reset deletes
    any popup with the target selector so verify FAILS on empty, agent CREATES a simple_popup_blocks.popup_
    config object, verify reads it live (exit 0 = pass).'
questions:
- id: spb-config-object
  input: In the Simple Popup Blocks module, where is each popup stored? Name the config object and describe
    how a Drupal block is turned into a popup.
  criteria: 'Each popup is a standalone simple config object named simple_popup_blocks.popup_<uid> (schema
    pattern simple_popup_blocks.*). You point it at existing markup by CSS selector: type 0 targets a
    Drupal block (identifier = block config id, rendered as block-<id>), type 1 targets a custom CSS id/class.
    The module ships no popup content or styling of its own.'
  bundle: simple_popup_blocks
  rubric_ref: rubric/simple_popup_blocks_spb_config_object@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: spb-trigger-options
  input: What trigger methods can a Simple Popup Blocks popup use, and which config key selects them?
    Give the values.
  criteria: 'The trigger_method key: 0 = Automatic (shown after `delay` seconds), 1 = Manual on click
    of `trigger_selector` (which must start with . or #), 2 = Before browser/tab close (exit intent).'
  bundle: simple_popup_blocks
  rubric_ref: rubric/simple_popup_blocks_spb_trigger_options@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: spb-layout-and-type
  input: In Simple Popup Blocks, which config key sets where the popup appears on screen and what value
    gives a centered popup? Also, what is the difference between type 0 and type 1?
  criteria: 'The `layout` key (0-9) sets position: 0 top-left, 1 top-right, 2 bottom-left, 3 bottom-right,
    4 center, 5 top-center, 6 top-bar, 7 bottom-bar, 8 left-bar, 9 right-bar — so 4 is centered. `type`
    0 targets a Drupal block, `type` 1 targets a custom CSS id/class (with css_selector 0=class/./, 1=id/#).'
  bundle: simple_popup_blocks
  rubric_ref: rubric/simple_popup_blocks_spb_layout_and_type@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: spb-known-promo
  input: 'This Drupal 11 site has a Simple Popup Blocks popup configured. Inspect the live configuration
    and report: which element it targets (the identifier), where it appears on screen (its layout), and
    how it is triggered.'
  criteria: 'The popup simple_popup_blocks.popup_known_promo targets the custom CSS id promo-banner (type
    1, css_selector 1), uses layout 6 (top bar), and is triggered manually on click (trigger_method 1)
    of trigger_selector #open-promo. Written by the setup script.'
  bundle: simple_popup_blocks
  rubric_ref: rubric/simple_popup_blocks_spb_known_promo@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/simple_popup_blocks-known-promo-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/simple_popup_blocks-known-promo-cleanup.sh
