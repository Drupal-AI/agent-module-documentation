metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: simple_menu_icons
  version: 3.1.x
  note: 'Simple Menu Icons adds an ''icon_upload'' managed_file field to the menu_link_content edit form;
    the chosen icon is stored on the menu link''s own link options under menu_icon (fid, uri). It generates
    a CSS file (public://simple_menu_icons_css/menu_icons_<suffix>.css) that paints each icon as a background-image
    on menu-icon-<mlid> classes added by hook_preprocess_menu; the CSS suffix lives in State key simple_menu_icons_css_suffix.
    There is NO config entity, settings page (configure=null), permission, plugin, Drush command, or config
    schema. All medium/hard cases are grounded in the real persistent state: the per-menu-link options.menu_icon
    on menu_link_content entities (created in the ''main'' menu, namespaced with ''SMI '' titles).'
questions:
- id: simple_menu_icons-how-to-add
  input: On a Drupal 11 site with the Simple Menu Icons module, how do I give a menu link an icon, and
    where does that icon association get stored?
  criteria: There is no settings page. Edit a custom menu link (menu_link_content) and use the added 'Icon
    image' managed-file field (icon_upload). The uploaded file is stored on the menu link's own link options
    under menu_icon (fid + uri).
  bundle: simple_menu_icons
  rubric_ref: rubric/simple_menu_icons_simple_menu_icons_how_to_add@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: simple_menu_icons-file-types
  input: What image file types can I upload for a menu icon with the Simple Menu Icons module in Drupal?
  criteria: The icon_upload field allows gif, png, jpg, jpeg and svg files (upload location public://menu_icons/).
  bundle: simple_menu_icons
  rubric_ref: rubric/simple_menu_icons_simple_menu_icons_file_types@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: simple_menu_icons-rendering
  input: How does Simple Menu Icons actually make the icon appear next to a Drupal menu item — does it
    add an <img> tag?
  criteria: It adds no <img> markup. hook_preprocess_menu adds menu-icon and menu-icon-<mlid> classes
    to each item, and the module generates a CSS file that sets the icon as a background-image on those
    classes (with left padding = icon width). hook_css_alter injects that generated file.
  bundle: simple_menu_icons
  rubric_ref: rubric/simple_menu_icons_simple_menu_icons_rendering@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: simple_menu_icons-which-link
  input: On this Drupal site the 'main' menu contains a couple of custom menu links. Exactly one of them
    has a Simple Menu Icons icon configured. Inspect the live menu links and tell me the title of the
    one that has an icon.
  criteria: 'The link titled ''SMI Known Icon Link'' has an icon: its menu_link_content link options contain
    menu_icon (uri public://menu_icons/smi_known.svg). ''SMI Plain Link'' has no menu_icon.'
  bundle: simple_menu_icons
  rubric_ref: rubric/simple_menu_icons_simple_menu_icons_which_link@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/simple_menu_icons-which-link-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/simple_menu_icons-which-link-cleanup.sh
- id: simple_menu_icons-icon-uri
  input: On this Drupal site there is a custom menu link titled 'SMI URI Link' in the main menu with a
    Simple Menu Icons icon configured. Inspect the live menu link and tell me the file URI of its configured
    icon.
  criteria: public://menu_icons/smi_dashboard.svg — stored at the menu link's link options menu_icon.uri.
  bundle: simple_menu_icons
  rubric_ref: rubric/simple_menu_icons_simple_menu_icons_icon_uri@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/simple_menu_icons-icon-uri-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/simple_menu_icons-icon-uri-cleanup.sh
- id: simple_menu_icons-add-icon
  input: On this Drupal site the 'main' menu has a custom menu link titled 'SMI Task Link' with no icon.
    Using the way Simple Menu Icons stores icons, configure an icon on that menu link so it has a menu_icon
    set in its link options. Apply the change to the live site.
  criteria: The 'SMI Task Link' menu_link_content entity's link options get a menu_icon entry with a non-empty
    uri (and/or fid), e.g. options['menu_icon']['uri'] = 'public://menu_icons/whatever.svg', then the
    link is saved.
  bundle: simple_menu_icons
  rubric_ref: rubric/simple_menu_icons_simple_menu_icons_add_icon@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/simple_menu_icons-add-icon-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/simple_menu_icons-add-icon-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/simple_menu_icons-add-icon-verify.sh
- id: simple_menu_icons-set-specific
  input: On this Drupal site the 'main' menu has a custom menu link titled 'SMI Target Link'. Set its
    Simple Menu Icons icon so the icon file URI is exactly public://menu_icons/smi_target.svg, storing
    it the way the module expects. Apply the change to the live site.
  criteria: The 'SMI Target Link' menu_link_content link options menu_icon.uri is set to public://menu_icons/smi_target.svg
    and the link is saved.
  bundle: simple_menu_icons
  rubric_ref: rubric/simple_menu_icons_simple_menu_icons_set_specific@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/simple_menu_icons-set-specific-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/simple_menu_icons-set-specific-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/simple_menu_icons-set-specific-verify.sh
