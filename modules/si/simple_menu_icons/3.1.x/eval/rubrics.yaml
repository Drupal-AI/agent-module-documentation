rubrics:
- id: simple_menu_icons_simple_menu_icons_how_to_add
  version: '1.0'
  applicable_bundles:
  - simple_menu_icons
  checks:
  - kind: must_contain_any
    values:
    - menu link
    - menu_link_content
    - managed_file
    - menu_icon
    - icon_upload
    - link options
  scoring:
    combine: all_pass
- id: simple_menu_icons_simple_menu_icons_file_types
  version: '1.0'
  applicable_bundles:
  - simple_menu_icons
  checks:
  - kind: must_contain_any
    values:
    - svg
    - png
    - gif
    - jpg
    - jpeg
  scoring:
    combine: all_pass
- id: simple_menu_icons_simple_menu_icons_rendering
  version: '1.0'
  applicable_bundles:
  - simple_menu_icons
  checks:
  - kind: must_contain_any
    values:
    - background-image
    - CSS
    - menu-icon
    - background image
  scoring:
    combine: all_pass
- id: simple_menu_icons_simple_menu_icons_which_link
  version: '1.0'
  applicable_bundles:
  - simple_menu_icons
  checks:
  - kind: must_contain_any
    values:
    - SMI Known Icon Link
  scoring:
    combine: all_pass
- id: simple_menu_icons_simple_menu_icons_icon_uri
  version: '1.0'
  applicable_bundles:
  - simple_menu_icons
  checks:
  - kind: must_contain_any
    values:
    - smi_dashboard.svg
    - public://menu_icons/smi_dashboard.svg
  scoring:
    combine: all_pass
- id: simple_menu_icons_simple_menu_icons_add_icon
  version: '1.0'
  applicable_bundles:
  - simple_menu_icons
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
- id: simple_menu_icons_simple_menu_icons_set_specific
  version: '1.0'
  applicable_bundles:
  - simple_menu_icons
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
