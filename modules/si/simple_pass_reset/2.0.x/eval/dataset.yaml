questions:
- id: spr-redirect-key
  input: In the simple_pass_reset module, which configuration setting controls where a user is redirected
    after they reset their password and are logged in, and what is its default value?
  criteria: simple_pass_reset.settings:login_redirection controls the post-reset redirect; it defaults
    to /user.
  bundle: simple_pass_reset
  rubric_ref: rubric/simple_pass_reset_spr_redirect_key@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: spr-route-permission
  input: Where is the simple_pass_reset settings form, and which permission is required to access it?
  criteria: The settings form is at /admin/config/people/accounts/simple_pass_reset (route simple_pass_reset.admin_settings),
    gated by the 'administer simple pass reset' permission.
  bundle: simple_pass_reset
  rubric_ref: rubric/simple_pass_reset_spr_route_permission@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: spr-mechanism
  input: How does simple_pass_reset change the standard Drupal password-reset experience? Which core route
    does it override to skip the extra one-time-login page?
  criteria: A RouteSubscriber overrides the core user.reset route so its controller/title become 'Choose
    a new password' and it uses a custom access check; the user lands directly on the set-password form
    and is logged in on submit, skipping the intermediate one-time-login page.
  bundle: simple_pass_reset
  rubric_ref: rubric/simple_pass_reset_spr_mechanism@1.0
  tags:
  - mode:recipe
  - difficulty:easy
