rubrics:
- id: site_settings_site_settings_entity_model
  version: '1.0'
  applicable_bundles:
  - site_settings
  checks:
  - kind: must_contain_any
    values:
    - site_setting_entity
    - site_setting_entity_type
  scoring:
    combine: all_pass
- id: site_settings_site_settings_twig_functions
  version: '1.0'
  applicable_bundles:
  - site_settings
  checks:
  - kind: must_contain_any
    values:
    - site_setting_field
    - site_settings_by_name
    - site_setting(
  scoring:
    combine: all_pass
- id: site_settings_site_settings_loader_plugin
