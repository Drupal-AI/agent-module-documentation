metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: simple_sitemap
  version: 4.2.x
  note: Simple XML Sitemap exposes a generator service, two plugin types, drush commands, config entities
    and permissions. All cases are `recipe` (response-graded), not `execution` (no live-state mutation).
questions:
- id: simplesitemap-drush-generate
  input: On a Drupal 11 site with Simple XML Sitemap installed, I want to (re)generate all XML sitemaps
    from the command line. Give the single drush command (an alias is fine).
  criteria: drush simple-sitemap:generate (alias drush ssg) regenerates all sitemaps, continuing any in-progress
    queue generation.
  bundle: simple_sitemap
  rubric_ref: rubric/simple_sitemap_simplesitemap_drush_generate@1.0
  tags:
  - mode:recipe
- id: simplesitemap-drush-rebuild-queue
  input: With Simple XML Sitemap, I want to truncate and re-populate the generation queue for only the
    `default` and `news` sitemaps, without generating yet. Give the drush command including the flag to
    scope it to those variants.
  criteria: drush simple-sitemap:rebuild-queue --variants=default,news (alias drush ssr) rebuilds the
    queue for just those variants.
  bundle: simple_sitemap
  rubric_ref: rubric/simple_sitemap_simplesitemap_drush_rebuild_queue@1.0
  tags:
  - mode:recipe
- id: simplesitemap-generator-service
  input: In PHP on a Drupal 11 site, I want to programmatically trigger Simple XML Sitemap generation
    and read a global setting. Which service do I load, and what is its class? Show the service id.
  criteria: The simple_sitemap.generator service (Drupal\simple_sitemap\Manager\Generator); e.g. \Drupal::service('simple_sitemap.generator')->generate()
    and ->getSetting()/->saveSetting().
  bundle: simple_sitemap
  rubric_ref: rubric/simple_sitemap_simplesitemap_generator_service@1.0
  tags:
  - mode:recipe
- id: simplesitemap-enable-bundle-in-code
  input: In custom code on a Drupal 11 site, enable the `node` entity type for Simple XML Sitemap indexing
    and set the `article` bundle to be indexed with priority 0.5 and changefreq weekly. Which manager
    and methods do I use?
  criteria: 'Use the generator''s entityManager() (Drupal\simple_sitemap\Manager\EntityManager): ->enableEntityType(''node'')
    then ->setBundleSettings(''node'', ''article'', [''index'' => TRUE, ''priority'' => 0.5, ''changefreq''
    => ''weekly'']).'
  bundle: simple_sitemap
  rubric_ref: rubric/simple_sitemap_simplesitemap_enable_bundle_in_code@1.0
  tags:
  - mode:recipe
- id: simplesitemap-urlgenerator-plugin
  input: I want to write a custom plugin for Simple XML Sitemap that produces the list of links to index.
    What plugin type is that, what is its plugin namespace, and what annotation/base class do I use?
  criteria: A UrlGenerator plugin in namespace Plugin/simple_sitemap/UrlGenerator, using the @UrlGenerator
    annotation and extending UrlGeneratorBase (or EntityUrlGeneratorBase).
  bundle: simple_sitemap
  rubric_ref: rubric/simple_sitemap_simplesitemap_urlgenerator_plugin@1.0
  tags:
  - mode:recipe
- id: simplesitemap-sitemapgenerator-plugin
  input: For Simple XML Sitemap, which plugin type writes the actual XML document, what is its plugin
    namespace, and what is the id of its plugin manager service?
  criteria: A SitemapGenerator plugin (namespace Plugin/simple_sitemap/SitemapGenerator, @SitemapGenerator
    annotation, SitemapGeneratorBase base), managed by plugin.manager.simple_sitemap.sitemap_generator.
  bundle: simple_sitemap
  rubric_ref: rubric/simple_sitemap_simplesitemap_sitemapgenerator_plugin@1.0
  tags:
  - mode:recipe
- id: simplesitemap-permissions
  input: For Simple XML Sitemap, I want editors to be able to toggle sitemap inclusion on individual entity
    edit forms but NOT reach the full admin UI. Name the two permission machine names the module defines
    and which one to grant.
  criteria: Grant 'edit entity sitemap settings' (per-entity toggle) rather than 'administer sitemap settings'
    (full admin UI).
  bundle: simple_sitemap
  rubric_ref: rubric/simple_sitemap_simplesitemap_permissions@1.0
  tags:
  - mode:recipe
- id: simplesitemap-submodules
  input: Which Simple XML Sitemap submodule adds search-engine submission / IndexNow, and which one adds
    Views route integration? Name both submodule machine names.
  criteria: simple_sitemap_engines adds search-engine submission/IndexNow (and the 'index entity on save'
    permission); simple_sitemap_views adds Views route integration (the `views` URL generator).
  bundle: simple_sitemap
  rubric_ref: rubric/simple_sitemap_simplesitemap_submodules@1.0
  tags:
  - mode:recipe
