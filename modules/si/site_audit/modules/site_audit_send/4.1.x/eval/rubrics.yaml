rubrics:
- id: site_audit_send_sas_what
  version: '1.0'
  applicable_bundles:
  - site_audit_send
  checks:
  - kind: must_contain_any
    values:
    - remote
    - site_audit_send
    - site_audit settings
    - /admin/reports/site-audit/settings
    - remote_url
  scoring:
    combine: all_pass
- id: site_audit_send_sas_config_keys
  version: '1.0'
  applicable_bundles:
  - site_audit_send
  checks:
  - kind: must_contain_any
    values:
    - cron_send_interval
    - cron_save_interval
    - cron_delete_interval
    - remote_url
    - site_audit_send.settings
  scoring:
    combine: all_pass
- id: site_audit_send_sas_rest_client
  version: '1.0'
  applicable_bundles:
  - site_audit_send
  checks:
  - kind: must_contain_any
    values:
    - site_audit_send.rest_client
    - RestClient
    - postReport
  scoring:
    combine: all_pass
- id: site_audit_send_sas_known_url
  version: '1.0'
  applicable_bundles:
  - site_audit_send
  checks:
  - kind: must_contain_any
    values:
    - sas-known.example.com
  scoring:
    combine: all_pass
- id: site_audit_send_sas_known_interval
  version: '1.0'
  applicable_bundles:
  - site_audit_send
  checks:
  - kind: must_contain_any
    values:
    - '3600'
  scoring:
    combine: all_pass
- id: site_audit_send_sas_set_url
  version: '1.0'
  applicable_bundles:
  - site_audit_send
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
- id: site_audit_send_sas_set_cron_save
  version: '1.0'
  applicable_bundles:
  - site_audit_send
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
