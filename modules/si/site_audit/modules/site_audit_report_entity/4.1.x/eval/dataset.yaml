metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: site_audit_report_entity
  version: 4.1.x
  note: 'site_audit_report_entity (submodule of site_audit) defines the revisionable content entity ''site_audit_report''
    (base table site_audit_report) with base fields label, uri, data (serialized audit JSON). Routes under
    /admin/reports/site-audit/reports; settings config site_audit_report_entity.settings (key ''example'');
    permissions create/view/edit/delete + ''administer site audit report''. Static helpers: SiteAuditReport::saveReport()/sendReport()/audit().
    Medium cases read a known entity label / a known settings value; hard cases create a report entity
    and grant a role the view permission, verified against live state.'
questions:
- id: sare-what
  input: What does the site_audit_report_entity submodule add to a Drupal site, and where can saved audit
    reports be viewed?
  criteria: It adds a revisionable content entity type 'site_audit_report' so audit runs can be saved,
    listed, viewed and kept over time. The collection is at /admin/reports/site-audit/reports; each report
    stores a label, site uri, and the serialized audit data.
  bundle: site_audit_report_entity
  rubric_ref: rubric/site_audit_report_entity_sare_what@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: sare-permissions
  input: Which permissions does the site_audit_report_entity module define for controlling access to saved
    site audit reports?
  criteria: create site audit report, view site audit report, edit site audit report, delete site audit
    report, and administer site audit report (the entity's admin permission, restricted).
  bundle: site_audit_report_entity
  rubric_ref: rubric/site_audit_report_entity_sare_permissions@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: sare-save-api
  input: How can I save the result of a site audit as an entity programmatically using the site_audit_report_entity
    module?
  criteria: Call the static helper SiteAuditReport::saveReport($label, $revision_log) (Drupal\site_audit_report_entity\Entity\SiteAuditReport),
    which runs a full audit and saves a new site_audit_report entity; its absolute URL is on $entity->link.
    For a fixture without running an audit, SiteAuditReport::create(['label'=>..., 'data'=>[]])->save().
  bundle: site_audit_report_entity
  rubric_ref: rubric/site_audit_report_entity_sare_save_api@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: sare-known-entity
  input: This Drupal site has a saved site_audit_report entity. Inspect the live site and report the label
    of that saved report.
  criteria: A site_audit_report entity exists with label SARE_Known_Report (query the site_audit_report
    storage / entity type).
  bundle: site_audit_report_entity
  rubric_ref: rubric/site_audit_report_entity_sare_known_entity@1.0
  tags:
  - mode:introspection
  - difficulty:medium
