  criteria: Create a site_audit_report entity labelled SARE_Task, e.g. SiteAuditReport::create(['label'=>'SARE_Task','data'=>[]])->save().
    Verify checks at least one site_audit_report entity with that label exists.
  bundle: site_audit_report_entity
