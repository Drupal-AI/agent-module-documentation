- id: sare-grant-view
  input: On this Drupal site, create a role with the machine name 'sare_viewer' and grant it the site_audit_report_entity
    permission that lets it view saved site audit reports. Apply the change to the live site.
  criteria: Create role sare_viewer and grant it 'view site audit report' (e.g. Role::create(['id'=>'sare_viewer','label'=>'SARE
