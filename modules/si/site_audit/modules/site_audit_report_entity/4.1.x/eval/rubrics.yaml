rubrics:
- id: site_audit_report_entity_sare_what
  version: '1.0'
  applicable_bundles:
  - site_audit_report_entity
  checks:
  - kind: must_contain_any
    values:
    - site_audit_report
    - entity
    - /admin/reports/site-audit/reports
    - saved
  scoring:
    combine: all_pass
- id: site_audit_report_entity_sare_permissions
  version: '1.0'
  applicable_bundles:
  - site_audit_report_entity
  checks:
  - kind: must_contain_any
    values:
    - view site audit report
    - create site audit report
    - delete site audit report
    - administer site audit report
  scoring:
    combine: all_pass
- id: site_audit_report_entity_sare_save_api
  version: '1.0'
  applicable_bundles:
  - site_audit_report_entity
  checks:
