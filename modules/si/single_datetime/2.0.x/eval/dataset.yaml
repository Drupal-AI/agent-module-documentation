metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: single_datetime
  version: 2.0.x
  note: 'Single DateTimePicker registers Field widget plugins (single_date_time_widget for datetime, single_date_time_timestamp_widget
    for timestamp/created; single_date_time_range_widget for daterange lives in the single_datetime_range
    submodule) plus a single_date_time Form API element. It has no configure route, no settings form,
    no permissions, no Drush, and defines no plugin type of its own. Its persistent state is the widget
    type + the widget settings (SingleDateTimeBase::defaultSettings(): hour_format 12h/24h, allow_seconds,
    allow_times 5/10/15/30/60, allowed_hours, disable_days, exclude_date, inline, mask, datetimepicker_theme
    default/dark, start_date, min_date, max_date, year_start, year_end, allow_blank) stored on a field
    component inside an entity_form_display config entity. Medium/hard cases are grounded in that real
    config on a namespaced content type single_datetime_eval with field_sdt_* datetime fields, verified
    by reading/writing core.entity_form_display.node.single_datetime_eval.default.'
questions:
- id: single_datetime-widget-ids
  input: In the Drupal contrib module single_datetime (Single DateTimePicker), what is the field widget
    plugin id used for a core datetime field, and which widget handles timestamp/created fields? Name
    them.
  criteria: single_date_time_widget is used for datetime fields; single_date_time_timestamp_widget handles
    timestamp and created fields. (The daterange widget single_date_time_range_widget is provided by the
    single_datetime_range submodule.) You select it on the field's row in Manage form display.
  bundle: single_datetime
  rubric_ref: rubric/single_datetime_single_datetime_widget_ids@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: single_datetime-settings
  input: The Single DateTimePicker (single_datetime) widget has several per-widget settings. Which setting
    controls the minute granularity of the time picker, and which controls 12- vs 24-hour display? Give
    the setting keys and their allowed values.
  criteria: allow_times sets minute granularity with allowed values 5, 10, 15, 30 or 60 (default 15).
    hour_format sets 12h or 24h (default 24h). Other settings include allow_seconds, allowed_hours, disable_days,
    exclude_date, inline, mask, datetimepicker_theme, min_date/max_date, year_start/year_end and allow_blank.
  bundle: single_datetime
  rubric_ref: rubric/single_datetime_single_datetime_settings@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: single_datetime-library-element
  input: single_datetime relies on an external JavaScript library and also exposes a Form API render element
    so you can add the picker to a custom form. What external library path does it expect, and what is
    the Form API element type / helper class for custom forms?
  criteria: It needs the xdan jQuery DateTimePicker library at /libraries/jquery-datetimepicker (attached
    via the single_datetime/datetimepicker library). For custom forms use the '#type' => 'single_date_time'
    render element, and \Drupal\single_datetime\AttributeHelper (defaultWidget()/allElementAttributes())
    to attach the data-* attributes to a plain textfield.
  bundle: single_datetime
  rubric_ref: rubric/single_datetime_single_datetime_library_element@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: single_datetime-known-widget
  input: On this Drupal site there is a content type single_datetime_eval whose default form display has
    one datetime field configured with the Single DateTimePicker widget. Inspect the live form display
    and give (a) the field machine name and (b) its configured hour_format setting.
  criteria: field_sdt_known uses widget single_date_time_widget with hour_format 12h (and allow_times
    30), per core.entity_form_display.node.single_datetime_eval.default.
  bundle: single_datetime
  rubric_ref: rubric/single_datetime_single_datetime_known_widget@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/single_datetime-known-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/single_datetime-teardown.sh
- id: single_datetime-which-picker
  input: The single_datetime_eval content type on this site has two datetime fields, field_sdt_on and
    field_sdt_off. Exactly one uses the Single DateTimePicker widget and the other uses core's default
    datetime widget. Inspect the live form display and state which field uses the Single DateTimePicker.
  criteria: field_sdt_on uses single_date_time_widget; field_sdt_off uses datetime_default. Read core.entity_form_display.node.single_datetime_eval.default
    content.<field>.type.
  bundle: single_datetime
  rubric_ref: rubric/single_datetime_single_datetime_which_picker@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/single_datetime-which-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/single_datetime-teardown.sh
- id: single_datetime-assign-widget
  input: On this site the content type single_datetime_eval has a datetime field field_sdt_task currently
    using core's 'Date and time' (datetime_default) widget on the default form display. Using single_datetime,
    change that field's widget to the Single DateTimePicker and apply it to the live site.
  criteria: Set the field_sdt_task component in core.entity_form_display.node.single_datetime_eval.default
    to type single_date_time_widget (via Manage form display or by loading the entity_form_display and
    setComponent+save).
  bundle: single_datetime
  rubric_ref: rubric/single_datetime_single_datetime_assign_widget@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/single_datetime-assign-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/single_datetime-teardown.sh
    verify: agent-module-documentation/evaluation/verify/single_datetime-assign-verify.sh
- id: single_datetime-configure-12h
  input: On this site the datetime field field_sdt_conf on the single_datetime_eval content type already
    uses the Single DateTimePicker widget but is set to 24-hour display. Reconfigure its widget so the
    time picker uses 12-hour (AM/PM) format, and apply it to the live default form display.
  criteria: In core.entity_form_display.node.single_datetime_eval.default the field_sdt_conf component
    keeps type single_date_time_widget and sets settings.hour_format to 12h.
  bundle: single_datetime
  rubric_ref: rubric/single_datetime_single_datetime_configure_12h@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/single_datetime-configure-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/single_datetime-teardown.sh
    verify: agent-module-documentation/evaluation/verify/single_datetime-configure-verify.sh
