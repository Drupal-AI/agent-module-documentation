metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: single_datetime_range
  version: 2.0.x
  note: single_datetime_range is a submodule of single_datetime that adds one field widget, single_date_time_range_widget
    (class SingleDateTimeRangeWidget), for core daterange (Datetime Range) fields. It extends the parent's
    SingleDateTimeBase, so it shares every parent widget setting (hour_format 12h/24h, allow_times 5/10/15/30/60,
    disable_days, exclude_date, inline, mask, datetimepicker_theme, min_date/max_date, year_start/year_end,
    allow_blank, allow_seconds, allowed_hours) and applies them to BOTH the start (value) and end (end_value)
    inputs. It adds a validateSingleDateTime callback enforcing start <= end. It has no configure route,
    no settings form, no permissions, no Drush, and defines no plugin type. It requires the parent single_datetime
    module enabled (its info.yml only declares datetime_range) plus the xdan JS library. Medium/hard cases
    are grounded in real config on a namespaced content type sdt_range_eval with field_sdtr_* daterange
    fields, verified by reading/writing core.entity_form_display.node.sdt_range_eval.default.
questions:
- id: single_datetime_range-widget-id
  input: In the single_datetime_range submodule, what is the field widget plugin id it provides, and which
    core field type does it apply to?
  criteria: It provides the single_date_time_range_widget widget (label 'Single Date Time Picker') for
    the core daterange (Datetime Range) field type, rendering both the start and end inputs with the xdan
    datetimepicker. Select it on the field's row in Manage form display.
  bundle: single_datetime_range
  rubric_ref: rubric/single_datetime_range_single_datetime_range_widget_id@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: single_datetime_range-validation
  input: Does the single_datetime_range widget enforce any ordering between the start and end of a date
    range, and how? What happens if the end is before the start?
  criteria: Yes. The widget replaces core's validateStartEnd with its own validateSingleDateTime element-validate
    callback; if the end date is before the start date it sets a form error ('The @title end date cannot
    be before the start date'). It uses its own validator because the values arrive as strings rather
    than DrupalDateTime objects.
  bundle: single_datetime_range
  rubric_ref: rubric/single_datetime_range_single_datetime_range_validation@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: single_datetime_range-settings-shared
  input: The single_datetime_range widget doesn't define its own settings form. Where do its per-widget
    settings (like hour_format and minute granularity) come from, and do they apply to just the start
    input or both start and end?
  criteria: The widget extends single_datetime's SingleDateTimeBase, inheriting its full settings set
    (hour_format, allow_seconds, allow_times, allowed_hours, disable_days, exclude_date, inline, mask,
    datetimepicker_theme, start_date, min_date, max_date, year_start, year_end, allow_blank). The settings
    are merged into both the start (value) and end (end_value) single_date_time elements, so they apply
    to both inputs.
  bundle: single_datetime_range
  rubric_ref: rubric/single_datetime_range_single_datetime_range_settings_shared@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: single_datetime_range-known-widget
  input: On this Drupal site there is a content type sdt_range_eval whose default form display has one
    Datetime Range field configured with the Single DateTimePicker range widget. Inspect the live form
    display and give (a) the field machine name and (b) its configured hour_format setting.
  criteria: field_sdtr_known uses widget single_date_time_range_widget with hour_format 12h (and allow_times
    30), per core.entity_form_display.node.sdt_range_eval.default.
  bundle: single_datetime_range
  rubric_ref: rubric/single_datetime_range_single_datetime_range_known_widget@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/single_datetime_range-known-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/single_datetime_range-teardown.sh
- id: single_datetime_range-which-picker
  input: The sdt_range_eval content type on this site has two Datetime Range fields, field_sdtr_on and
    field_sdtr_off. Exactly one uses the Single DateTimePicker range widget and the other uses core's
    default daterange widget. Inspect the live form display and state which field uses the Single DateTimePicker.
  criteria: field_sdtr_on uses single_date_time_range_widget; field_sdtr_off uses daterange_default. Read
    core.entity_form_display.node.sdt_range_eval.default content.<field>.type.
  bundle: single_datetime_range
  rubric_ref: rubric/single_datetime_range_single_datetime_range_which_picker@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/single_datetime_range-which-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/single_datetime_range-teardown.sh
- id: single_datetime_range-assign-widget
  input: On this site the content type sdt_range_eval has a Datetime Range field field_sdtr_task currently
    using core's default 'Date and time range' (daterange_default) widget on the default form display.
    Using single_datetime_range, change that field's widget to the Single DateTimePicker and apply it
    to the live site.
  criteria: Set the field_sdtr_task component in core.entity_form_display.node.sdt_range_eval.default
    to type single_date_time_range_widget (via Manage form display, or by getting the form display via
    entity_display.repository and setComponent+save).
  bundle: single_datetime_range
  rubric_ref: rubric/single_datetime_range_single_datetime_range_assign_widget@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/single_datetime_range-assign-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/single_datetime_range-teardown.sh
    verify: agent-module-documentation/evaluation/verify/single_datetime_range-assign-verify.sh
- id: single_datetime_range-configure-12h
  input: On this site the Datetime Range field field_sdtr_conf on the sdt_range_eval content type already
    uses the Single DateTimePicker range widget but is set to 24-hour display. Reconfigure its widget
    so the time picker uses 12-hour (AM/PM) format, and apply it to the live default form display.
  criteria: In core.entity_form_display.node.sdt_range_eval.default the field_sdtr_conf component keeps
    type single_date_time_range_widget and sets settings.hour_format to 12h.
  bundle: single_datetime_range
  rubric_ref: rubric/single_datetime_range_single_datetime_range_configure_12h@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/single_datetime_range-configure-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/single_datetime_range-teardown.sh
    verify: agent-module-documentation/evaluation/verify/single_datetime_range-configure-verify.sh
