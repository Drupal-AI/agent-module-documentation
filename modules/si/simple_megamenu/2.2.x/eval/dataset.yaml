metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: simple_megamenu
  version: 2.2.x
  note: Simple Mega Menu defines a fieldable/revisionable/translatable content entity 'simple_mega_menu'
    with a config bundle entity 'simple_mega_menu_type' (config prefix simple_megamenu.simple_mega_menu_type,
    key field targetMenu = list of menu machine names it applies to). A menu link content item in a targeted
    menu gets a Simple Mega Menu entity-autocomplete; the chosen entity id is stored on the link options
    as attributes['data-simple-mega-menu']. Rendering is via two Twig functions has_megamenu(url) and
    view_megamenu(url, view_mode); shipped view modes 'before' and 'after'. No global settings page (configure=null).
    Medium/hard cases use namespaced bundles (smm_known/smm_probe/smm_task/smm_ct) and exercise the real
    targetMenu config and simple_mega_menu entity storage.
questions:
- id: simple_megamenu-twig-functions
  input: In the Drupal simple_megamenu module, which two Twig functions render or detect a mega menu attached
    to a menu link, and what does each do?
  criteria: has_megamenu(url) returns TRUE when the menu link's Url carries an attached mega menu (the
    data-simple-mega-menu attribute), and view_megamenu(url, view_mode) renders the attached simple_mega_menu
    entity in the given view mode (e.g. 'before' or 'after').
  bundle: simple_megamenu
  rubric_ref: rubric/simple_megamenu_simple_megamenu_twig_functions@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: simple_megamenu-attachment
  input: How does simple_megamenu associate a mega menu entity with a specific menu link in Drupal, and
    where is that association stored?
  criteria: On the menu link content edit form (for links in a targeted menu) it adds a Simple Mega Menu
    entity-autocomplete; the selected entity id is stored on the menu link's link options as attributes['data-simple-mega-menu'].
  bundle: simple_megamenu
  rubric_ref: rubric/simple_megamenu_simple_megamenu_attachment@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: simple_megamenu-target-menu-config
  input: In simple_megamenu, what decides on which menus a given mega menu type (bundle) can be used,
    and what is the config property called?
  criteria: Each simple_mega_menu_type bundle has a targetMenu property - a list of menu machine names.
    The mega-menu autocomplete only appears on menu links whose menu is listed in some bundle's targetMenu.
  bundle: simple_megamenu
  rubric_ref: rubric/simple_megamenu_simple_megamenu_target_menu_config@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: simple_megamenu-known-target
  input: On this Drupal site there is a Simple mega menu type (bundle) with machine name 'smm_known'.
    Inspect the live configuration and tell me which menu it is set to apply to (its target menu).
  criteria: 'smm_known targets the ''main'' menu: simple_megamenu.simple_mega_menu_type.smm_known targetMenu
    contains ''main''. Read with drush cget simple_megamenu.simple_mega_menu_type.smm_known.'
  bundle: simple_megamenu
  rubric_ref: rubric/simple_megamenu_simple_megamenu_known_target@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/simple_megamenu-known-menu-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/simple_megamenu-known-menu-cleanup.sh
- id: simple_megamenu-known-entity
  input: On this Drupal site, a Simple mega menu entity has been created in the 'smm_probe' bundle. Inspect
    the live simple_mega_menu entities and report the name of that entity.
  criteria: The entity's name is 'SMM Known Panel' (bundle smm_probe). Find it via the simple_mega_menu
    storage, e.g. loadByProperties(['type' => 'smm_probe']) or the /admin/content/simple_mega_menu list.
  bundle: simple_megamenu
  rubric_ref: rubric/simple_megamenu_simple_megamenu_known_entity@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/simple_megamenu-known-entity-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/simple_megamenu-known-entity-cleanup.sh
- id: simple_megamenu-target-main
  input: On this Drupal site, the Simple mega menu type (bundle) 'smm_task' exists but is not attached
    to any menu. Configure it so that it applies to the 'main' menu, and apply the change to the live
    site.
  criteria: Set the smm_task bundle's targetMenu to include 'main' (edit the mega menu type at /admin/structure/simple_mega_menu_type
    or set targetMenu on simple_megamenu.simple_mega_menu_type.smm_task), then save.
  bundle: simple_megamenu
  rubric_ref: rubric/simple_megamenu_simple_megamenu_target_main@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/simple_megamenu-target-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/simple_megamenu-target-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/simple_megamenu-target-verify.sh
- id: simple_megamenu-create-entity
  input: On this Drupal site there is a Simple mega menu type called 'smm_ct'. Create a new Simple mega
    menu entity of that type named exactly 'SMM Promo', and save it to the live site.
  criteria: Create a simple_mega_menu entity with type 'smm_ct' and name 'SMM Promo' (via /admin/content/simple_mega_menu/add/smm_ct
    or SimpleMegaMenu::create(['type' => 'smm_ct', 'name' => 'SMM Promo'])->save()).
  bundle: simple_megamenu
  rubric_ref: rubric/simple_megamenu_simple_megamenu_create_entity@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: site-owner
    reset: agent-module-documentation/evaluation/verify/simple_megamenu-create-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/simple_megamenu-create-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/simple_megamenu-create-verify.sh
