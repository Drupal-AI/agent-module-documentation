metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: simple_megamenu_example
  version: 2.2.x
  note: simple_megamenu_example is a starter-kit submodule of simple_megamenu. On install it ships (config/install)
    a simple_mega_menu_type bundle 'megamenu' (label MegaMenu, targetMenu main), five fields on the simple_mega_menu
    'megamenu' bundle (field_image image, field_image_link link, field_image_title string, field_text
    text_long, field_links link), an image style 'simple_megamenu', before/after/default displays, and
    a simple-mega-menu--megamenu.html.twig template. It has no configure route, permissions, plugins or
    Drush. Cases are grounded in that shipped config and the parent entity storage.
questions:
- id: simple_megamenu_example-what
  input: What does the simple_megamenu_example submodule give you when you enable it on a Drupal site?
  criteria: It installs a ready-made 'megamenu' Simple mega menu type (bundle) with example image/link/text
    fields, before/after view modes, an image style and a template - a working starting example you can
    copy and adapt.
  bundle: simple_megamenu_example
  rubric_ref: rubric/simple_megamenu_example_simple_megamenu_example_what@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: simple_megamenu_example-fields
  input: Which example fields does the simple_megamenu_example 'megamenu' bundle ship for building a mega
    menu?
  criteria: The megamenu bundle ships field_image (image), field_image_link (link), field_image_title
    (string), field_text (text_long) and field_links (link).
  bundle: simple_megamenu_example
  rubric_ref: rubric/simple_megamenu_example_simple_megamenu_example_fields@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: simple_megamenu_example-target-menu
  input: Out of the box, which menu is the simple_megamenu_example 'megamenu' bundle configured to apply
    to?
  criteria: The megamenu bundle's targetMenu is set to the 'main' (Main navigation) menu.
  bundle: simple_megamenu_example
  rubric_ref: rubric/simple_megamenu_example_simple_megamenu_example_target_menu@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: simple_megamenu_example-known-fields
  input: On this Drupal site, the simple_megamenu_example 'megamenu' bundle is installed. Inspect the
    live configuration and name at least two fields defined on that mega menu bundle.
  criteria: The megamenu bundle has field_image, field_image_link, field_image_title, field_text and field_links.
    Discover via field config, e.g. drush cget field.field.simple_mega_menu.megamenu.field_image or the
    Manage fields page.
  bundle: simple_megamenu_example
  rubric_ref: rubric/simple_megamenu_example_simple_megamenu_example_known_fields@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/simple_megamenu_example-fields-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/simple_megamenu_example-fields-cleanup.sh
- id: simple_megamenu_example-create-entity
  input: On this Drupal site, use the example 'megamenu' mega menu type to create a new Simple mega menu
    entity named exactly 'Example Promo', and save it to the live site.
  criteria: Create a simple_mega_menu entity with type 'megamenu' and name 'Example Promo' (via /admin/content/simple_mega_menu/add/megamenu
    or SimpleMegaMenu::create(['type' => 'megamenu', 'name' => 'Example Promo'])->save()).
  bundle: simple_megamenu_example
  rubric_ref: rubric/simple_megamenu_example_simple_megamenu_example_create_entity@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: site-owner
    reset: agent-module-documentation/evaluation/verify/simple_megamenu_example-create-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/simple_megamenu_example-create-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/simple_megamenu_example-create-verify.sh
