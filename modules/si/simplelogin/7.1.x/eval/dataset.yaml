metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: simplelogin
  version: 7.1.x
  note: 'Simple Login restyles the anonymous /user, /user/login, /user/register, /user/password pages
    with a background image/color and a centered form card. All state is the simplelogin.settings config
    object (form /admin/config/simplelogin, route simplelogin.admin_settings_form, permission ''administer
    site configuration''). Keys + shipped defaults: background_active=false, background_image=[], background_color=''#00bfff'',
    background_opacity=false, button_background=false, wrapper_width=360, unset_active_css=false, unset_css='''',
    visually_hidden_labels=true. No plugins, no Drush; themed paths extendable via hook_simplelogin_paths_alter();
    template page--simplelogin.html.twig. Medium cases write a distinctive value into simplelogin.settings
    and read it back; hard cases build real config (background_color; button_background+wrapper_width)
    verified against live config. reset/cleanup restore the shipped defaults explicitly.'
questions:
- id: simplelogin-config-location
  input: In the simplelogin Drupal module, which config object and admin path control the login-page styling,
    and what permission is required to reach the settings form?
  criteria: Settings live in simplelogin.settings, edited at /admin/config/simplelogin (route simplelogin.admin_settings_form),
    gated by the core 'administer site configuration' permission.
  bundle: simplelogin
  rubric_ref: rubric/simplelogin_simplelogin_config_location@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: simplelogin-which-pages
  input: Which pages does the simplelogin module restyle, and for which users does the styling apply?
  criteria: It styles the anonymous user pages /user, /user/login, /user/password and /user/register (only
    for not-logged-in users). The path list can be extended with hook_simplelogin_paths_alter().
  bundle: simplelogin
  rubric_ref: rubric/simplelogin_simplelogin_which_pages@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: simplelogin-background-keys
  input: In simplelogin.settings, which keys decide whether the login page uses a background image versus
    a solid color, and where is the color stored?
  criteria: 'background_active (boolean) selects image vs color: when true the page uses the managed file(s)
    in background_image, when false it uses the hex value in background_color (default #00bfff).'
  bundle: simplelogin
  rubric_ref: rubric/simplelogin_simplelogin_background_keys@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: simplelogin-read-color
  input: On this Drupal site, inspect the Simple Login configuration and state the login-page background
    color that is currently configured.
  criteria: 'simplelogin.settings background_color is #123456. Read via `drush cget simplelogin.settings
    background_color`.'
  bundle: simplelogin
  rubric_ref: rubric/simplelogin_simplelogin_read_color@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/simplelogin-color-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/simplelogin-color-cleanup.sh
- id: simplelogin-read-width
  input: On this Drupal site, inspect the Simple Login configuration and state the configured width (in
    pixels) of the login form card/wrapper.
  criteria: simplelogin.settings wrapper_width is 480. Read via `drush cget simplelogin.settings wrapper_width`.
  bundle: simplelogin
  rubric_ref: rubric/simplelogin_simplelogin_read_width@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/simplelogin-width-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/simplelogin-width-cleanup.sh
- id: simplelogin-set-color
  input: 'On this Drupal site, configure Simple Login so the login pages use the solid background color
    #ff8800. Apply the change to the live site''s configuration.'
  criteria: 'Set simplelogin.settings background_color to ''#ff8800'', e.g. `drush cset simplelogin.settings
    background_color ''#ff8800'' -y` or via the settings form. Verified: background_color === ''#ff8800''.'
  bundle: simplelogin
  rubric_ref: rubric/simplelogin_simplelogin_set_color@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/simplelogin-set-color-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/simplelogin-set-color-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/simplelogin-set-color-verify.sh
    unused_text_checks:
      must_not_contain: []
- id: simplelogin-button-and-width
  input: On this Drupal site, configure Simple Login to tint the submit buttons and links with the background
    color (the 'button background' option) and to make the login form card 500 pixels wide. Apply both
    changes to the live site's configuration.
  criteria: 'In simplelogin.settings set button_background to true and wrapper_width to 500, e.g. `drush
    cset simplelogin.settings button_background 1 -y` and `drush cset simplelogin.settings wrapper_width
    500 -y`, or via the settings form. Verified: button_background === true AND wrapper_width === 500.'
  bundle: simplelogin
  rubric_ref: rubric/simplelogin_simplelogin_button_and_width@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/simplelogin-button-width-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/simplelogin-button-width-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/simplelogin-button-width-verify.sh
    unused_text_checks:
      must_not_contain: []
