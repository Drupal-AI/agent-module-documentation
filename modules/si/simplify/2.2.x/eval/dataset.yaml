metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: simplify
  version: 2.2.x
  note: 'Simplify hides selected built-in form elements from entity add/edit forms. Its global state lives
    in the simplify.global config object: a boolean simplify_admin plus one array-of-string key per entity
    type (simplify_nodes_global, simplify_users_global, simplify_comments_global, simplify_taxonomies_global,
    simplify_blocks_global, simplify_media_global, simplify_menu_links_global, simplify_profiles_global,
    simplify_eck_global). The valid element keys are fixed in simplify_get_fields() (e.g. nodes: author,
    options, revision_information, meta, format, path, menu, comment, book; users: status, timezone, format,
    contact). Per-bundle overrides live in simplify.content_type.*, simplify.comment_type.*, simplify.vocabulary.*,
    simplify.block_type.*. Two permissions: administer simplify (settings form) and view hidden fields
    (bypass hiding). Introspection cases save a known simplify.global then read it back; execution cases
    reset simplify.global and require the agent to write the correct element keys, verified live.'
questions:
- id: simplify-node-elements
  input: Using the Drupal contrib module Simplify (drupal/simplify), name at least three of the built-in
    node edit-form sections/elements it can hide from content editors.
  criteria: 'On node forms Simplify can hide: Authoring information (author), Text format selection (format),
    Promotion options (options), Revision information (revision_information), Status metadata (meta),
    and — when the relevant module is on — Book outline, Comment settings, Menu settings, URL path settings
    (path) and Content translation.'
  bundle: simplify
  rubric_ref: rubric/simplify_simplify_node_elements@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: simplify-config-object
  input: I enabled the Simplify module on Drupal 11. Which configuration object stores the site-wide (global)
    list of fields to hide, and what is the config key that holds the elements hidden from all node forms?
  criteria: The global settings live in the config object simplify.global (edited at /admin/config/user-interface/simplify,
    route simplify.admin). The node elements hidden on every node form are stored as an array of keys
    under simplify_nodes_global.
  bundle: simplify
  rubric_ref: rubric/simplify_simplify_config_object@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: simplify-permissions
  input: In the Simplify module, which permission lets a user bypass Simplify entirely and still see all
    the hidden fields, and which permission is needed to reach its configuration form?
  criteria: The 'view hidden fields' permission exempts a user from Simplify (they see every hidden field).
    The 'administer simplify' permission grants access to the settings form and the per-bundle Simplify
    sections.
  bundle: simplify
  rubric_ref: rubric/simplify_simplify_permissions@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: simplify-current-hidden-nodes
  input: On this Drupal site, Simplify has been configured to hide some elements from all node edit forms.
    Inspect the live Simplify configuration and tell me which node-form elements are currently being hidden
    globally.
  criteria: simplify.global:simplify_nodes_global is set to [author, options, revision_information] —
    i.e. Authoring information, Promotion options and Revision information are hidden on all node forms.
  bundle: simplify
  rubric_ref: rubric/simplify_simplify_current_hidden_nodes@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/simplify-hidden-node-fields-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/simplify-hidden-node-fields-cleanup.sh
- id: simplify-admin-override
  input: On this Drupal site with Simplify enabled, is the module currently configured to ALSO hide fields
    from administrator users (User 1 and users with an admin role), or do admins still see everything?
    Inspect the live Simplify configuration to answer.
  criteria: Yes — simplify.global:simplify_admin is set to TRUE ('Hide fields from admin users' is on),
    so admin/User 1 are also subject to Simplify. (simplify_users_global also has [status], hiding the
    Status control on user forms.)
  bundle: simplify
  rubric_ref: rubric/simplify_simplify_admin_override@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/simplify-admin-flag-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/simplify-admin-flag-cleanup.sh
- id: simplify-hide-node-authoring
  input: On this Drupal site, configure the Simplify module so that the 'Authoring information' and 'Promotion
    options' sections are hidden from ALL node add/edit forms site-wide (the global setting, not a per-content-type
    override). Apply the change to the live site.
  criteria: simplify.global:simplify_nodes_global contains both 'author' (Authoring information) and 'options'
    (Promotion options), so both sections are hidden on every node form.
  bundle: simplify
  rubric_ref: rubric/simplify_simplify_hide_node_authoring@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/simplify-hide-node-authoring-reset.sh
    verify: agent-module-documentation/evaluation/verify/simplify-hide-node-authoring-verify.sh
- id: simplify-hide-user-status
  input: On this Drupal site with Simplify enabled, configure it so that the 'Status (blocked/active)'
    control is hidden from the user account forms site-wide. Apply the change to the live site's Simplify
    global configuration.
  criteria: simplify.global:simplify_users_global contains 'status', so the account Status (blocked/active)
    control is hidden on user add/edit forms.
  bundle: simplify
  rubric_ref: rubric/simplify_simplify_hide_user_status@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/simplify-hide-user-status-reset.sh
    verify: agent-module-documentation/evaluation/verify/simplify-hide-user-status-verify.sh
