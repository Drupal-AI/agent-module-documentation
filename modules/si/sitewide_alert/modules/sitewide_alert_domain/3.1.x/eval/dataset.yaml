metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: sitewide_alert_domain
  version: 3.1.x
  part_of: sitewide_alert
  note: 'Light-doc experimental submodule of sitewide_alert. Recipe-only cases probe what it adds: per-domain
    scoping of alerts by decorating the alert manager service, requiring the Domain / Domain Access Entity
    modules. No site mutation.'
questions:
- id: swad-purpose
  input: On a multi-domain Drupal site, which Sitewide Alert submodule lets me show a given alert only
    on specific domains, and what does it require?
  criteria: The sitewide_alert_domain submodule (experimental); it requires the Domain (domain) and Domain
    Access Entity (domain_entity) modules installed and configured, plus the parent sitewide_alert module.
  bundle: sitewide_alert_domain
  rubric_ref: rubric/sitewide_alert_domain_swad_purpose@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: swad-mechanism
  input: How does the Sitewide Alert Domain submodule technically restrict alerts to certain domains —
    what service pattern does it use?
  criteria: It decorates the parent sitewide_alert.sitewide_alert_manager service with SitewideAlertDomainManager,
    which filters the alerts returned for a request by the current negotiated domain.
  bundle: sitewide_alert_domain
  rubric_ref: rubric/sitewide_alert_domain_swad_mechanism@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: swad-setup
  input: After enabling Sitewide Alert Domain, where do I turn on domain support for the alert entity
    and expose the domain field to editors?
  criteria: Enable domain support for the sitewide_alert entity type at /admin/config/domain/entities
    (per Domain Access Entity docs), then expose the Domain Access field on the alert form at /admin/config/sitewide_alerts/form-display.
  bundle: sitewide_alert_domain
  rubric_ref: rubric/sitewide_alert_domain_swad_setup@1.0
  tags:
  - mode:recipe
  - difficulty:easy
