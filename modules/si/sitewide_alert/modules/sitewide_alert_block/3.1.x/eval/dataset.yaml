metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: sitewide_alert_block
  version: 3.1.x
  part_of: sitewide_alert
  note: 'Light-doc submodule of sitewide_alert. Recipe-only cases probe the one thing this submodule adds:
    a placeable ''Sitewide Alert'' block (plugin id sitewide_alert_block) so alerts render in a region/Layout
    Builder instead of the default top-of-page injection. No site mutation.'
questions:
- id: swab-purpose
  input: In the Sitewide Alert project, which submodule lets me render alerts inside a chosen theme region
    or Layout Builder section instead of forcibly at the top of every page, and how does it do it?
  criteria: 'The sitewide_alert_block submodule: it provides a ''Sitewide Alert'' block plugin you place
    in a region via Block layout or Layout Builder, instead of the parent module''s default top-of-page
    injection.'
  bundle: sitewide_alert_block
  rubric_ref: rubric/sitewide_alert_block_swab_purpose@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: swab-plugin-id
  input: After enabling the Sitewide Alert Block submodule, what is the machine name / plugin id of the
    block I place, and where do I place it?
  criteria: The block plugin id is sitewide_alert_block (admin label 'Sitewide Alert'); place it in a
    theme region at /admin/structure/block or in a Layout Builder layout.
  bundle: sitewide_alert_block
  rubric_ref: rubric/sitewide_alert_block_swab_plugin_id@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: swab-dependency
  input: Does Sitewide Alert Block replace the alert entities and settings, or reuse them? What does it
    depend on?
  criteria: It depends on the parent sitewide_alert module and reuses the same alert entities, styles,
    scheduling and dismissal — only the placement (a block) changes.
  bundle: sitewide_alert_block
  rubric_ref: rubric/sitewide_alert_block_swab_dependency@1.0
  tags:
  - mode:recipe
  - difficulty:easy
