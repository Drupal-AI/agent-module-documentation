rubrics:
- id: sitewide_alert_swa_entity_type
  version: '1.0'
  applicable_bundles:
  - sitewide_alert
  checks:
  - kind: must_contain_any
    values:
    - sitewide_alert
    - content entity
  scoring:
    combine: all_pass
- id: sitewide_alert_swa_drush_create
  version: '1.0'
  applicable_bundles:
  - sitewide_alert
  checks:
  - kind: must_contain_any
    values:
    - sitewide-alert:create
    - sitewide-alert:disable
  scoring:
    combine: all_pass
- id: sitewide_alert_swa_styles_config
  version: '1.0'
  applicable_bundles:
  - sitewide_alert
  checks:
  - kind: must_contain_any
    values:
    - alert_styles
    - sitewide_alert.settings
  scoring:
    combine: all_pass
- id: sitewide_alert_swa_view_permission
  version: '1.0'
  applicable_bundles:
  - sitewide_alert
  checks:
  - kind: must_contain_any
    values:
    - view published sitewide alert entities
  scoring:
    combine: all_pass
- id: sitewide_alert_swa_intro_message
  version: '1.0'
  applicable_bundles:
  - sitewide_alert
  checks:
  - kind: must_contain_any
    values:
    - Scheduled maintenance on Sunday at 03:00 UTC.
  scoring:
    combine: all_pass
- id: sitewide_alert_swa_intro_style
  version: '1.0'
  applicable_bundles:
  - sitewide_alert
  checks:
  - kind: must_contain_any
    values:
    - danger
  scoring:
    combine: all_pass
- id: sitewide_alert_swa_intro_active_count
  version: '1.0'
  applicable_bundles:
  - sitewide_alert
  checks:
  - kind: must_contain_any
    values:
    - Eval Maintenance Notice
  scoring:
    combine: all_pass
- id: sitewide_alert_swa_build_outage
  version: '1.0'
  applicable_bundles:
  - sitewide_alert
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
- id: sitewide_alert_swa_build_scheduled
  version: '1.0'
  applicable_bundles:
  - sitewide_alert
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
