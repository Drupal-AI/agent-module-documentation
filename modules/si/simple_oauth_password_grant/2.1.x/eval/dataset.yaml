metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: simple_oauth_password_grant
  version: 2.1.x
  note: 'Developer/API module. It adds ONE plugin to Simple OAuth''s Oauth2Grant plugin type: id ''password''
    (Drupal\simple_oauth_password_grant\Plugin\Oauth2Grant\Password), wrapping the PHP League PasswordGrant.
    There is no settings page (configure=null), no permissions, no Drush. The grant is turned on per Consumer
    entity via its multi-value grant_types field (value ''password''); a client then POSTs grant_type=password
    + client_id/client_secret/username/password to Simple OAuth''s /oauth/token. Credential checks (username
    OR email, active users only) and flood protection live in service simple_oauth_password_grant.repositories.user.
    Easy cases probe that surface as text. Medium/hard cases are grounded in Consumer config the agent
    can create WITHOUT any live token exchange: enabling the password grant in a consumer''s grant_types,
    verified against the consumer entity. Consumers are namespaced with sopg_* client_ids.'
questions:
- id: simple_oauth_password_grant-how-to-get-token
  input: I enabled simple_oauth_password_grant on a decoupled Drupal 11 site. How does a trusted first-party
    client obtain an OAuth2 access token using a Drupal user's credentials? Give the grant_type value
    and the parameters to POST.
  criteria: POST to Simple OAuth's token endpoint (/oauth/token) with grant_type=password plus client_id,
    client_secret, username and password. The username may be the Drupal username or the account email.
    You first enable the Password grant on the consumer. Response returns an access_token (and refresh_token
    when allowed).
  bundle: simple_oauth_password_grant
  rubric_ref: rubric/simple_oauth_password_grant_simple_oauth_password_grant_how_to_get_token@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: simple_oauth_password_grant-enable-where
  input: There is no admin settings page for simple_oauth_password_grant. On a Simple OAuth Consumer,
    where/how do I turn the password grant on?
  criteria: Enable the 'Password' grant on the specific Consumer entity by adding 'password' to its grant_types
    field (Configuration > Web services > Consumers, tick Password). configure is null; there is no module
    settings form.
  bundle: simple_oauth_password_grant
  rubric_ref: rubric/simple_oauth_password_grant_simple_oauth_password_grant_enable_where@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: simple_oauth_password_grant-username-or-email
  input: With the simple_oauth_password_grant password grant, can a user authenticate with their email
    address instead of their Drupal username, and what protects the token endpoint against brute-force
    login attempts?
  criteria: Yes - the username field accepts the Drupal username or the account email (email matched first
    when it contains @). The module's UserRepository applies core flood protection using user.flood limits
    (IP event oauth2_password_grant.failed_login_ip and per-user oauth2_password_grant.failed_login_user),
    throwing a 403 flood_ip_blocked / flood_user_blocked when exceeded.
  bundle: simple_oauth_password_grant
  rubric_ref: rubric/simple_oauth_password_grant_simple_oauth_password_grant_username_or_email@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: simple_oauth_password_grant-consumer-grants
  input: This Drupal site has a Simple OAuth Consumer labelled 'SOPG Probe Consumer'. Inspect the live
    consumer configuration and state whether the OAuth2 password grant is enabled on it.
  criteria: Yes - the consumer (client_id sopg_probe_client) has grant_types including 'password' (and
    'refresh_token').
  bundle: simple_oauth_password_grant
  rubric_ref: rubric/simple_oauth_password_grant_simple_oauth_password_grant_consumer_grants@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/simple_oauth_password_grant-known-consumer-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/simple_oauth_password_grant-known-consumer-cleanup.sh
- id: simple_oauth_password_grant-consumer-client-id
  input: On this site exactly one Simple OAuth Consumer has the password grant enabled. Inspect the live
    consumers and report that consumer's client_id.
  criteria: The consumer with grant_types containing 'password' has client_id sopg_probe_client (label
    'SOPG Probe Consumer').
  bundle: simple_oauth_password_grant
  rubric_ref: rubric/simple_oauth_password_grant_simple_oauth_password_grant_consumer_client_id@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/simple_oauth_password_grant-known-consumer-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/simple_oauth_password_grant-known-consumer-cleanup.sh
- id: simple_oauth_password_grant-enable-grant
  input: On this Drupal site there is a Simple OAuth Consumer with client_id 'sopg_task_client' that does
    NOT currently allow the password grant. Enable the OAuth2 password grant on that consumer and save
    it to the live site.
  criteria: The consumer with client_id sopg_task_client has 'password' added to its grant_types field
    (value saved on the consumer entity).
  bundle: simple_oauth_password_grant
  rubric_ref: rubric/simple_oauth_password_grant_simple_oauth_password_grant_enable_grant@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/simple_oauth_password_grant-enable-grant-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/simple_oauth_password_grant-enable-grant-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/simple_oauth_password_grant-enable-grant-verify.sh
- id: simple_oauth_password_grant-create-consumer
  input: On this Drupal site, create a Simple OAuth Consumer with client_id 'sopg_new_client' that has
    the OAuth2 password grant enabled, and save it to the live site.
  criteria: A consumer entity with client_id sopg_new_client exists and its grant_types field includes
    'password'.
  bundle: simple_oauth_password_grant
  rubric_ref: rubric/simple_oauth_password_grant_simple_oauth_password_grant_create_consumer@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/simple_oauth_password_grant-create-consumer-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/simple_oauth_password_grant-create-consumer-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/simple_oauth_password_grant-create-consumer-verify.sh
