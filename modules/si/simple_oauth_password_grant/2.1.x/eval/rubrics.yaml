rubrics:
- id: simple_oauth_password_grant_simple_oauth_password_grant_how_to_get_token
  version: '1.0'
  applicable_bundles:
  - simple_oauth_password_grant
  checks:
  - kind: must_contain_any
    values:
    - grant_type=password
    - '"password"'
    - password
    - client_id
    - username
  scoring:
    combine: all_pass
- id: simple_oauth_password_grant_simple_oauth_password_grant_enable_where
  version: '1.0'
  applicable_bundles:
  - simple_oauth_password_grant
  checks:
  - kind: must_contain_any
    values:
    - grant_types
    - grant types
    - Consumer
    - Password
  scoring:
    combine: all_pass
- id: simple_oauth_password_grant_simple_oauth_password_grant_username_or_email
  version: '1.0'
  applicable_bundles:
  - simple_oauth_password_grant
  checks:
  - kind: must_contain_any
    values:
    - email
    - flood
    - user.flood
  scoring:
    combine: all_pass
- id: simple_oauth_password_grant_simple_oauth_password_grant_consumer_grants
  version: '1.0'
