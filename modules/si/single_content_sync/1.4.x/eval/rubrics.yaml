rubrics:
- id: single_content_sync_scs_entity_export_tab
  version: '1.0'
  applicable_bundles:
  - single_content_sync
  checks:
  - kind: must_contain_any
    values:
    - /export
    - Export
    - yml
    - zip
  scoring:
    combine: all_pass
- id: single_content_sync_scs_drush_export
  version: '1.0'
  applicable_bundles:
  - single_content_sync
  checks:
  - kind: must_contain_any
    values:
    - content:export
    - --assets
    - --bundle
  scoring:
    combine: all_pass
- id: single_content_sync_scs_drush_import
  version: '1.0'
  applicable_bundles:
  - single_content_sync
  checks:
  - kind: must_contain_any
    values:
    - content:import
  scoring:
    combine: all_pass
- id: single_content_sync_scs_import_on_deploy
  version: '1.0'
  applicable_bundles:
  - single_content_sync
  checks:
  - kind: must_contain_any
    values:
    - single_content_sync.importer
    - importFromFile
    - importFromZip
  scoring:
    combine: all_pass
- id: single_content_sync_scs_field_processor_plugin
  version: '1.0'
  applicable_bundles:
  - single_content_sync
  checks:
  - kind: must_contain_any
    values:
    - SingleContentSyncFieldProcessor
    - field_type
  scoring:
    combine: all_pass
- id: single_content_sync_scs_base_fields_processor_plugin
  version: '1.0'
  applicable_bundles:
  - single_content_sync
  checks:
  - kind: must_contain_any
    values:
    - SingleContentSyncBaseFieldsProcessor
    - entity_type
  scoring:
    combine: all_pass
- id: single_content_sync_scs_permission_import
  version: '1.0'
  applicable_bundles:
  - single_content_sync
  checks:
  - kind: must_contain_any
    values:
    - import single content
    - export node content
    - export {entity_type} content
  scoring:
    combine: all_pass
- id: single_content_sync_scs_site_uuid_check
  version: '1.0'
  applicable_bundles:
  - single_content_sync
  checks:
  - kind: must_contain_any
    values:
    - site_uuid_check
    - single_content_sync.settings
  scoring:
    combine: all_pass
