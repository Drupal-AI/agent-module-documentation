metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: single_content_sync
  version: 1.4.x
  note: 'single_content_sync exports one content entity (plus references/assets) to YAML/ZIP and imports
    it elsewhere. Cases are `recipe` (response-graded): they probe documented facts an agent would otherwise
    read source to answer; no site mutation.'
questions:
- id: scs-entity-export-tab
  input: On a Drupal 11 site with Single Content Sync, how do I export a single node (with its referenced
    entities) from the UI, and what are the two download formats offered?
  criteria: 'Use the Export tab/operation on the entity (e.g. /node/{node}/export). Two buttons: ''Download
    as a file'' (a .yml, no assets) and ''Download as a zip with all assets'' (.zip bundling referenced
    files).'
  bundle: single_content_sync
  rubric_ref: rubric/single_content_sync_scs_entity_export_tab@1.0
  tags:
  - mode:recipe
- id: scs-drush-export
  input: Which Single Content Sync drush command exports content, and how do I export all article nodes
    including their assets?
  criteria: drush content:export exports content (default entity type node). e.g. drush content:export
    node --bundle="article" --assets — --assets bundles referenced assets and forces a ZIP.
  bundle: single_content_sync
  rubric_ref: rubric/single_content_sync_scs_drush_export@1.0
  tags:
  - mode:recipe
- id: scs-drush-import
  input: How do I import a previously exported .zip content bundle on another Drupal site using Single
    Content Sync's drush command?
  criteria: drush content:import <path> where path is relative to Drupal root, e.g. drush content:import
    export-folder/content-bulk-export.zip; .zip is imported as a bundle (content + assets).
  bundle: single_content_sync
  rubric_ref: rubric/single_content_sync_scs_drush_import@1.0
  tags:
  - mode:recipe
- id: scs-import-on-deploy
  input: In a Drupal custom module I want to import a content YAML file on deploy from a hook_update_N.
    Which service and method do I call?
  criteria: 'Call the single_content_sync.importer service: importFromFile($path) for a .yml, or importFromZip($path)
    for a .zip bundle.'
  bundle: single_content_sync
  rubric_ref: rubric/single_content_sync_scs_import_on_deploy@1.0
  tags:
  - mode:recipe
- id: scs-field-processor-plugin
  input: How do I customize how Single Content Sync serializes/imports a specific custom field type? Name
    the plugin type, its annotation, and the key property that binds it to a field type.
  criteria: Create a SingleContentSyncFieldProcessor plugin in src/Plugin/SingleContentSyncFieldProcessor/,
    annotated @SingleContentSyncFieldProcessor with id, label and field_type; implement exportFieldValue()/importFieldValue().
  bundle: single_content_sync
  rubric_ref: rubric/single_content_sync_scs_field_processor_plugin@1.0
  tags:
  - mode:recipe
- id: scs-base-fields-processor-plugin
  input: In Single Content Sync, which plugin type handles the base-field export/import logic for a whole
    entity type, and what annotation property selects the entity type?
  criteria: SingleContentSyncBaseFieldsProcessor plugins (in src/Plugin/SingleContentSyncBaseFieldsProcessor/),
    annotation @SingleContentSyncBaseFieldsProcessor with an entity_type property; fallback is the generic
    plugin.
  bundle: single_content_sync
  rubric_ref: rubric/single_content_sync_scs_base_fields_processor_plugin@1.0
  tags:
  - mode:recipe
- id: scs-permission-import
  input: What permission gates the Single Content Sync import page, and what pattern do the per-entity-type
    export permissions follow?
  criteria: '''import single content'' gates the /admin/content/import page; export is gated by dynamic
    per-type permissions named ''export {entity_type} content'' (e.g. ''export node content'').'
  bundle: single_content_sync
  rubric_ref: rubric/single_content_sync_scs_permission_import@1.0
  tags:
  - mode:recipe
- id: scs-site-uuid-check
  input: When moving content between two Drupal sites with Single Content Sync, which setting can block
    importing content that came from a different site, and what config object holds it?
  criteria: The site_uuid_check key (default true) on the single_content_sync.settings config object refuses
    to import content whose source site UUID differs from the current site.
  bundle: single_content_sync
  rubric_ref: rubric/single_content_sync_scs_site_uuid_check@1.0
  tags:
  - mode:recipe
