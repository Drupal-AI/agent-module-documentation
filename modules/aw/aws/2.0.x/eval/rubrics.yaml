rubrics:
- id: aws_aws_get_client
  version: '1.0'
  applicable_bundles:
  - aws
  checks:
  - kind: must_contain_any
    values:
    - aws.client_factory
    - getClient
    - getClientArgs
  scoring:
    combine: all_pass
- id: aws_aws_profile_storage
  version: '1.0'
  applicable_bundles:
  - aws
  checks:
  - kind: must_contain_any
    values:
    - aws.profile
    - aws_profile
    - aws_access_key_id
    - region
  scoring:
    combine: all_pass
- id: aws_aws_credential_order
  version: '1.0'
  applicable_bundles:
  - aws
  checks:
  - kind: must_contain_any
    values:
    - aws_role_arn
    - default provider
    - CredentialProvider
    - STS
    - instance profile
  scoring:
    combine: all_pass
- id: aws_aws_known_region
  version: '1.0'
  applicable_bundles:
  - aws
  checks:
  - kind: must_contain_any
    values:
    - us-west-2
  scoring:
    combine: all_pass
- id: aws_aws_known_override
  version: '1.0'
  applicable_bundles:
  - aws
  checks:
  - kind: must_contain_any
    values:
    - aws_svc_eval
  scoring:
    combine: all_pass
- id: aws_aws_create_profile
  version: '1.0'
  applicable_bundles:
  - aws
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
- id: aws_aws_set_override
  version: '1.0'
  applicable_bundles:
  - aws
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
