metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: double_field
  version: 5.0.x
  note: 'Double field defines a single field type, double_field, whose item has two properties, ''first''
    and ''second''; mainPropertyName() is NULL so there is no ->value. Each subfield independently picks
    one of ten storage types from DoubleField::subfieldTypes() (boolean, string, text, integer, float,
    numeric, email, telephone, datetime_iso8601, uri) under settings.storage.<subfield>.type, locked once
    the field has data. Instance settings add per-subfield label, required, list + allowed_values (list-capable
    types only - not boolean and not text), min/max for numerics and on_label/off_label for booleans;
    these become real Symfony constraints via DoubleField::getConstraints(). It ships one widget (double_field)
    whose per-subfield sub-widget is constrained by getSubWidgets(), and four formatters: double_field_unformatted_list
    (the default), double_field_html_list (list_type ul/ol/dl), double_field_details (open) and double_field_table
    (number_column, first/second_column_label). There is no settings form and no configure route (configure=null),
    no permissions, no ordinary services and no Drush commands, so all state is field/form-display/view-display
    config. Note the config-vs-runtime shape difference: allowed_values is exported as a sequence of {value,
    label} mappings but set in PHP as a flat key => label array. Every medium and hard case below is grounded
    in those real config keys and plugin ids.'
questions:
- id: double_field-subfield-types
  input: I am using the Drupal contrib module double_field on Drupal 11. What are the two value properties
    of a double_field item called, and where in the field configuration do I choose what data type each
    of them stores?
  criteria: 'The two properties are ''first'' and ''second'' (mainPropertyName() returns NULL, so there
    is no ->value - you use $entity->field_x->first and ->second). Each one''s data type is a field STORAGE
    setting: settings.storage.first.type and settings.storage.second.type in field.storage.<entity>.<field>,
    chosen from boolean, string, text, integer, float, numeric, email, telephone, datetime_iso8601 and
    uri. Related keys maxlength (string/telephone), precision and scale (numeric) and datetime_type (datetime_iso8601)
    apply per type, and all of them are disabled once the field holds data.'
  bundle: double_field
  rubric_ref: rubric/double_field_double_field_subfield_types@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: double_field-formatters
  input: Which field formatter plugins does the Drupal double_field module provide, and which one would
    I pick to render each field item as an HTML definition list with the first subfield as the term and
    the second as the description?
  criteria: 'Four formatters: double_field_unformatted_list (Unformatted List, the field type''s default_formatter),
    double_field_html_list (HTML List), double_field_details (Details) and double_field_table (Table).
    For a definition list, pick double_field_html_list and set its list_type setting to ''dl'' - that
    switches it to the double_field_definition_list theme hook, which emits <dt>{{ item.first }}</dt><dd>{{
    item.second }}</dd>. The other list_type options are ''ul'' (default) and ''ol''.'
  bundle: double_field
  rubric_ref: rubric/double_field_double_field_formatters@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: double_field-allowed-values-types
  input: In the Drupal double_field module I want to restrict one subfield to a fixed list of allowed
    values, like a select list. Which setting turns that on, and are there subfield storage types where
    that option is not offered?
  criteria: Tick 'Limit allowed values' on that subfield in the field (instance) settings - the boolean
    setting is settings.<first|second>.list, and the values go in settings.<first|second>.allowed_values.
    DoubleField::isListAllowed() only offers it for string, integer, float, numeric, email, telephone,
    uri and datetime_iso8601, so it is NOT available for boolean or text subfields. Turning it on adds
    an AllowedValues constraint and makes the 'select' and 'radios' sub-widgets available for that subfield.
    In exported config allowed_values is a sequence of {value, label} mappings, though in PHP you set
    it as a flat key => label array.
  bundle: double_field
  rubric_ref: rubric/double_field_double_field_allowed_values_types@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: double_field-known-storage
  input: This Drupal site has a Double Field called field_df_specs on the Article content type. Inspect
    the live site and tell me what data type its SECOND subfield stores, together with the precision and
    scale configured for it.
  criteria: The second subfield stores type 'numeric' (labelled Decimal in the UI) with precision 14 and
    scale 3. This is in field.storage.node.field_df_specs under settings.storage.second. The first subfield
    is type 'string' with maxlength 64.
  bundle: double_field
  rubric_ref: rubric/double_field_double_field_known_storage@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/double_field-known-storage-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/double_field-known-storage-cleanup.sh
- id: double_field-allowed-values
  input: On this Drupal site, the Article content type has a Double Field field_df_rating whose first
    subfield is restricted to a fixed list of values. Inspect the running site and list the allowed value
    keys an editor may choose from.
  criteria: 'The keys are gold, silver and bronze (labels Gold, Silver, Bronze). In field.field.node.article.field_df_rating
    the first subfield has list: true and allowed_values as a sequence of {value, label} mappings. The
    second subfield is a free integer bounded by min 0 and max 10.'
  bundle: double_field
  rubric_ref: rubric/double_field_double_field_allowed_values@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/double_field-allowed-values-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/double_field-allowed-values-cleanup.sh
- id: double_field-table-formatter
  input: The Article content type on this Drupal site has a Double Field field_df_hours that is rendered
    as a table in the default view mode. Inspect the live display configuration and tell me the two column
    header labels that have been configured for it.
  criteria: '''Weekday'' and ''Hours''. In core.entity_view_display.node.article.default the field_df_hours
    component uses the double_field_table formatter with settings.first_column_label: Weekday and settings.second_column_label:
    Hours; number_column is also on with number_column_label ''#''.'
  bundle: double_field
  rubric_ref: rubric/double_field_double_field_table_formatter@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/double_field-table-formatter-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/double_field-table-formatter-cleanup.sh
- id: double_field-create-field
  input: On this Drupal site, add a Double Field to the Article content type using the double_field contrib
    module. The field machine name must be field_df_task. Its first subfield must store text limited to
    64 characters, its second subfield must store an integer, both subfields must be required, and the
    field must use the module's own double_field widget on the default form display. Apply the change
    to the live site.
  criteria: 'A FieldStorageConfig node.field_df_task of type double_field whose settings.storage.first
    is {type: string, maxlength: 64} and settings.storage.second is {type: integer}; a FieldConfig on
    node.article with settings.first.required and settings.second.required both TRUE; and a component
    in core.entity_form_display.node.article.default with type: double_field.'
  bundle: double_field
  rubric_ref: rubric/double_field_double_field_create_field@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/double_field-create-field-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/double_field-create-field-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/double_field-create-field-verify.sh
- id: double_field-definition-list-layman
  input: My Drupal Articles have an FAQ field (field_df_faq) where each entry is a question and its answer.
    Right now they all run together in a plain list. I want them shown properly as a glossary-style list
    where each question is the heading term and its answer sits underneath it as the description. Please
    change the default display on the live site so it renders that way.
  criteria: 'In core.entity_view_display.node.article.default the field_df_faq component must switch from
    double_field_unformatted_list to the double_field_html_list formatter with settings.list_type: ''dl''.
    That routes rendering through the double_field_definition_list theme hook, emitting <dl> with the
    first subfield in <dt> and the second in <dd>.'
  bundle: double_field
  rubric_ref: rubric/double_field_double_field_definition_list_layman@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: site-owner
    reset: agent-module-documentation/evaluation/verify/double_field-definition-list-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/double_field-definition-list-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/double_field-definition-list-verify.sh
