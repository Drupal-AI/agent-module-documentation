rubrics:
- id: dotenv_dotenv_init_command
  version: '1.0'
  applicable_bundles:
  - dotenv
  checks:
  - kind: must_contain_any
    values:
    - dotenv:init
    - drush dotenv:init
  scoring:
    combine: all_pass
- id: dotenv_dotenv_read_in_settings
  version: '1.0'
  applicable_bundles:
  - dotenv
  checks:
  - kind: must_contain_any
    values:
    - $_ENV
    - _ENV
    - $_SERVER
  scoring:
    combine: all_pass
- id: dotenv_dotenv_dump_production
  version: '1.0'
  applicable_bundles:
  - dotenv
  checks:
  - kind: must_contain_any
    values:
    - dotenv:dump
    - .env.local.php
  scoring:
    combine: all_pass
- id: dotenv_dotenv_known_token
  version: '1.0'
  applicable_bundles:
  - dotenv
  checks:
  - kind: must_contain_any
    values:
    - probe-9f3a7c
  scoring:
    combine: all_pass
- id: dotenv_dotenv_mail_var
  version: '1.0'
  applicable_bundles:
  - dotenv
  checks:
  - kind: must_contain_any
    values:
    - alerts@probe.example
  scoring:
    combine: all_pass
- id: dotenv_dotenv_create_env
  version: '1.0'
  applicable_bundles:
  - dotenv
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
- id: dotenv_dotenv_dump_compile
  version: '1.0'
  applicable_bundles:
  - dotenv
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
