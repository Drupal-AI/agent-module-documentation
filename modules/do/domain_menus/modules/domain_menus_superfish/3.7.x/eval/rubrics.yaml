rubrics:
- id: domain_menus_superfish_domain_menus_superfish_block_id
  version: '1.0'
  applicable_bundles:
  - domain_menus_superfish
  checks:
  - kind: must_contain_any
    values:
    - domain_menus_active_domain_superfish_block
    - SuperfishBlock
  scoring:
    combine: all_pass
- id: domain_menus_superfish_domain_menus_superfish_menu_name
  version: '1.0'
  applicable_bundles:
  - domain_menus_superfish
  checks:
  - kind: must_contain_any
    values:
    - menu_name
    - domain_menus_menu_names
    - domain menu name
  scoring:
    combine: all_pass
- id: domain_menus_superfish_domain_menus_superfish_known_block
  version: '1.0'
  applicable_bundles:
  - domain_menus_superfish
  checks:
  - kind: must_contain_any
    values:
    - footer
  scoring:
    combine: all_pass
- id: domain_menus_superfish_domain_menus_superfish_place_block
  version: '1.0'
  applicable_bundles:
  - domain_menus_superfish
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
