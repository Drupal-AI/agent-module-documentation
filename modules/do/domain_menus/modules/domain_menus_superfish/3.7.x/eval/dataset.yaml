metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: domain_menus_superfish
  version: 3.7.x
  note: domain_menus_superfish is a glue submodule providing one block plugin, domain_menus_active_domain_superfish_block
    (DomainMenusSuperfishBlock, extends superfish's SuperfishBlock, category 'Superfish'). It adds a single
    'menu_name' setting whose options come from domain_menus.settings:domain_menus_menu_names; getDerivativeId()
    resolves it to dm<activeDomainId>-<name> at render. No config object, permissions, Drush, or configure
    route. Block config entities can be created/read without any Domain records (rendering needs a domain,
    but placement/config does not). Medium reads back a placed block's menu_name; hard places a block
    using this plugin, verified by scanning block config entities for the plugin id. Fixture block ids
    are namespaced dmsuperfish_*.
questions:
- id: domain_menus_superfish-block-id
  input: The domain_menus_superfish module adds a block for showing a domain's menu with Superfish. What
    is the block's plugin id and which block class does it extend?
  criteria: The block plugin id is domain_menus_active_domain_superfish_block (class DomainMenusSuperfishBlock),
    which extends superfish's SuperfishBlock and appears under the 'Superfish' block category.
  bundle: domain_menus_superfish
  rubric_ref: rubric/domain_menus_superfish_domain_menus_superfish_block_id@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: domain_menus_superfish-menu-name
  input: When placing the domain_menus_superfish block, what extra setting does it add beyond the normal
    Superfish options, and where do that setting's options come from?
  criteria: It adds a required 'menu_name' select; its options are the domain-menu names from domain_menus.settings:domain_menus_menu_names.
    At render, getDerivativeId() turns the chosen name into the active domain's menu id dm<activeDomainId>-<name>.
  bundle: domain_menus_superfish
  rubric_ref: rubric/domain_menus_superfish_domain_menus_superfish_menu_name@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: domain_menus_superfish-known-block
  input: On this Drupal site there is a placed block that uses the domain_menus_superfish Superfish domain-menu
    block. Inspect the block configuration and tell me which domain menu name (menu_name setting) it is
    configured to show.
  criteria: The block's menu_name setting is 'footer' (block config entity with plugin domain_menus_active_domain_superfish_block;
    read settings.menu_name).
  bundle: domain_menus_superfish
  rubric_ref: rubric/domain_menus_superfish_domain_menus_superfish_known_block@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/domain_menus_superfish-known-block-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/domain_menus_superfish-known-block-cleanup.sh
- id: domain_menus_superfish-place-block
  input: On this Drupal site, place the domain_menus_superfish 'Domain menus active domain menu' (Superfish)
    block so it shows the domain menu named 'main'. Apply the placement to the live site.
  criteria: A block config entity exists whose plugin is domain_menus_active_domain_superfish_block with
    settings.menu_name = 'main' (e.g. Block::create(['id'=>'...','theme'=>default,'region'=>'content','plugin'=>'domain_menus_active_domain_superfish_block','settings'=>['id'=>'domain_menus_active_domain_superfish_block','label'=>'...','menu_name'=>'main']])->save()).
  bundle: domain_menus_superfish
  rubric_ref: rubric/domain_menus_superfish_domain_menus_superfish_place_block@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/domain_menus_superfish-place-block-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/domain_menus_superfish-place-block-reset.sh
    verify: agent-module-documentation/evaluation/verify/domain_menus_superfish-place-block-verify.sh
