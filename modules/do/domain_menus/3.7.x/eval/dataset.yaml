metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: domain_menus
  version: 3.7.x
  note: 'Domain Menus gives each Domain its own menus. A menu is a ''domain menu'' when its config entity
    carries a non-empty domain_menus.domains third-party setting (auto-created ones also have domain_menus.auto-created=1).
    Settings form route domain_menus.settings (/admin/config/domain/domain_menus) writes config object
    domain_menus.settings (domain_menus_menu_names, domain_menus_filter_node_autocomplete, hide toggles,
    etc.). Auto-generated menu id pattern is dm<domainId>-<name> (DomainMenusConstants::DOMAIN_MENUS_MENU_ID_PATTERN
    = ''dm%u-%s''). Two permissions: ''edit assigned domain menus'', ''edit active domain menus''. No
    domains are configured on this test site, so medium/hard are grounded in the menu third-party-setting
    marker, which works without domain records. Fixture menus are namespaced domainmenus_* to avoid the
    reserved dm[number]- pattern.'
questions:
- id: domain_menus-id-pattern
  input: In the Drupal domain_menus module, how are the auto-created per-domain menus named (the machine-name
    pattern), and what should I avoid naming my own menus?
  criteria: Auto-created domain menus are named dm<domainId>-<name> (constant DOMAIN_MENUS_MENU_ID_PATTERN
    = 'dm%u-%s', e.g. dm1-main). Avoid machine-naming your own menus in the dm[number]- pattern to prevent
    conflicts.
  bundle: domain_menus
  rubric_ref: rubric/domain_menus_domain_menus_id_pattern@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: domain_menus-marker
  input: How does the domain_menus module know that a given Drupal menu is a 'domain menu'? Where is that
    stored on the menu?
  criteria: A menu is a domain menu when its config entity has a non-empty 'domains' third-party setting
    in the domain_menus namespace (menu->getThirdPartySetting('domain_menus','domains')). Machine-created
    ones also carry domain_menus.auto-created = 1. Set it on the menu edit form's Domain(s) checkboxes
    or via setThirdPartySetting().
  bundle: domain_menus
  rubric_ref: rubric/domain_menus_domain_menus_marker@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: domain_menus-permissions
  input: Which permissions does domain_menus add for delegating menu editing to per-domain editors, and
    how do they differ?
  criteria: '''Edit assigned domain menus'' lets a user edit the domain menus of the domains they are
    assigned; ''Edit active domain menus'' further limits that to the currently active domain''s menus.
    Both rely on the domain_access module for the user-domain assignment; ''administer menu'' can edit
    any menu.'
  bundle: domain_menus
  rubric_ref: rubric/domain_menus_domain_menus_permissions@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: domain_menus-known-menu
  input: On this Drupal site, exactly one menu has been marked as a domain menu via the domain_menus module.
    Inspect the menu configuration and give the machine name of that domain menu.
  criteria: 'The domain menu is domainmenus_intro: its menu config entity has a non-empty domain_menus.domains
    third-party setting (getThirdPartySetting(''domain_menus'',''domains'')), which is what marks it as
    a domain menu.'
  bundle: domain_menus
  rubric_ref: rubric/domain_menus_domain_menus_known_menu@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/domain_menus-known-menu-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/domain_menus-known-menu-cleanup.sh
- id: domain_menus-mark-menu
  input: On this Drupal site there is a plain menu with machine name domainmenus_task. Using the domain_menus
    module's mechanism, mark it as a domain menu by assigning it to a domain (any domain id is fine for
    this task). Apply the change to the live site.
  criteria: The menu domainmenus_task has a non-empty 'domains' third-party setting in the domain_menus
    namespace (e.g. Menu::load('domainmenus_task')->setThirdPartySetting('domain_menus','domains',['default'=>'default'])->save()),
    so _domain_menus_is_domain_menu() returns TRUE.
  bundle: domain_menus
  rubric_ref: rubric/domain_menus_domain_menus_mark_menu@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/domain_menus-mark-menu-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/domain_menus-mark-menu-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/domain_menus-mark-menu-verify.sh
