rubrics:
- id: domain_menus_domain_menus_id_pattern
  version: '1.0'
  applicable_bundles:
  - domain_menus
  checks:
  - kind: must_contain_any
    values:
    - dm%u-%s
    - dm<
    - dm[number]-
    - dm1-main
    - DOMAIN_MENUS_MENU_ID_PATTERN
  scoring:
    combine: all_pass
- id: domain_menus_domain_menus_marker
  version: '1.0'
  applicable_bundles:
  - domain_menus
  checks:
  - kind: must_contain_any
    values:
    - third party setting
    - third_party_settings
    - domain_menus.domains
    - setThirdPartySetting
    - domains
  scoring:
    combine: all_pass
- id: domain_menus_domain_menus_permissions
  version: '1.0'
  applicable_bundles:
  - domain_menus
  checks:
  - kind: must_contain_any
    values:
    - edit assigned domain menus
    - edit active domain menus
  scoring:
    combine: all_pass
- id: domain_menus_domain_menus_known_menu
  version: '1.0'
  applicable_bundles:
  - domain_menus
  checks:
  - kind: must_contain_any
    values:
    - domainmenus_intro
  scoring:
    combine: all_pass
- id: domain_menus_domain_menus_mark_menu
  version: '1.0'
  applicable_bundles:
  - domain_menus
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
