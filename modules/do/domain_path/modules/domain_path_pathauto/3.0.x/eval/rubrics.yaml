rubrics:
- id: domain_path_pathauto_domain_path_pathauto_decorators
  version: '1.0'
  applicable_bundles:
  - domain_path_pathauto
  checks:
  - kind: must_contain_any
    values:
    - pathauto.generator
    - DomainPathautoGenerator
    - pathauto.alias_storage_helper
    - decorat
  scoring:
    combine: all_pass
- id: domain_path_pathauto_domain_path_pathauto_state_store
  version: '1.0'
  applicable_bundles:
  - domain_path_pathauto
  checks:
  - kind: must_contain_any
    values:
    - key-value
    - key_value
    - domain_path_pathauto_state
    - domain_path_pathauto_state.{domain_id}
  scoring:
    combine: all_pass
- id: domain_path_pathauto_domain_path_pathauto_hook_context
  version: '1.0'
  applicable_bundles:
  - domain_path_pathauto
  checks:
  - kind: must_contain_any
    values:
    - hook_pathauto_alias_alter
    - domain_id
    - context
  scoring:
    combine: all_pass
- id: domain_path_pathauto_domain_path_pathauto_generator_class
  version: '1.0'
  applicable_bundles:
  - domain_path_pathauto
  checks:
  - kind: must_contain_any
    values:
    - DomainPathautoGenerator
  scoring:
    combine: all_pass
- id: domain_path_pathauto_domain_path_pathauto_storage_helper_class
  version: '1.0'
  applicable_bundles:
  - domain_path_pathauto
  checks:
  - kind: must_contain_any
    values:
    - DomainAliasStorageHelper
  scoring:
    combine: all_pass
- id: domain_path_pathauto_domain_path_pathauto_purge_state
  version: '1.0'
  applicable_bundles:
  - domain_path_pathauto
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
- id: domain_path_pathauto_domain_path_pathauto_purge_domain
  version: '1.0'
  applicable_bundles:
  - domain_path_pathauto
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
