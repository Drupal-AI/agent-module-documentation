metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: domain_path_pathauto
  version: 3.0.x
  note: 'Domain Path Pathauto integrates Pathauto with Domain Path for per-domain automatic aliases. It
    decorates pathauto.generator (-> DomainPathautoGenerator) and pathauto.alias_storage_helper (-> DomainAliasStorageHelper),
    adds a per-domain ''Generate automatic URL alias'' checkbox (DomainPathautoWidget), and stores auto/manual
    state per domain+entity-type in key-value collections named domain_path_pathauto_state.{domain_id}.{entity_type};
    on domain delete it purges every such collection for the domain. No config/UI/permissions of its own;
    module weight 11. Medium cases inspect the live service container (which class backs the decorated
    pathauto services). Hard cases exercise the documented domain-scoped pathauto-state key-value store
    (purge a domain''s state), verified against the key_value table. NOTE: the submodule''s core feature
    (generating per-domain aliases on entity save) needs a node, deliberately avoided because this shared
    site has a broken field (field_ld_disp) whose missing table makes node deletion fail, so test nodes
    cannot be torn down; the hard cases target the same domain-state cleanup path that domainDelete()
    uses.'
questions:
- id: domain_path_pathauto-decorators
  input: How does domain_path_pathauto make Pathauto generate aliases per domain? Which Pathauto services
    does it decorate?
  criteria: It decorates pathauto.generator with DomainPathautoGenerator (overriding updateEntityAlias()
    to generate a per-domain alias for each domain_path item in CREATE state) and pathauto.alias_storage_helper
    with DomainAliasStorageHelper, plus a domain_path_pathauto.alias_uniquifier for per-domain uniqueness.
  bundle: domain_path_pathauto
  rubric_ref: rubric/domain_path_pathauto_domain_path_pathauto_decorators@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: domain_path_pathauto-state-store
  input: In domain_path_pathauto, where is the per-domain 'automatic vs manual alias' state stored, and
    how is it namespaced?
  criteria: In the key-value store, in domain-scoped collections named domain_path_pathauto_state.{domain_id}.{entity_type}.
    CREATE state means Pathauto generates the alias; SKIP means it is manual.
  bundle: domain_path_pathauto
  rubric_ref: rubric/domain_path_pathauto_domain_path_pathauto_state_store@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: domain_path_pathauto-hook-context
  input: If I want to alter a domain-specific automatically-generated alias produced by domain_path_pathauto,
    which hook do I implement and how do I know it is for a specific domain?
  criteria: Implement hook_pathauto_alias_alter(&$alias, &$context) (or hook_pathauto_pattern_alter for
    the pattern). When the alias is generated for a domain, $context['domain_id'] is set.
  bundle: domain_path_pathauto
  rubric_ref: rubric/domain_path_pathauto_domain_path_pathauto_hook_context@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: domain_path_pathauto-generator-class
  input: On this Drupal site, which PHP class currently backs the pathauto.generator service? Inspect
    the live service container and give the class name.
  criteria: Because domain_path_pathauto decorates it, pathauto.generator is backed by Drupal\domain_path_pathauto\DomainPathautoGenerator.
  bundle: domain_path_pathauto
  rubric_ref: rubric/domain_path_pathauto_domain_path_pathauto_generator_class@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/domain_path_pathauto-enabled-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/domain_path_pathauto-enabled-cleanup.sh
- id: domain_path_pathauto-storage-helper-class
  input: On this site, which class currently backs the pathauto.alias_storage_helper service? Inspect
    the live container and answer.
  criteria: domain_path_pathauto decorates it, so pathauto.alias_storage_helper is backed by Drupal\domain_path_pathauto\DomainAliasStorageHelper.
  bundle: domain_path_pathauto
  rubric_ref: rubric/domain_path_pathauto_domain_path_pathauto_storage_helper_class@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/domain_path_pathauto-enabled-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/domain_path_pathauto-enabled-cleanup.sh
- id: domain_path_pathauto-purge-state
  input: On this Drupal site, domain_path_pathauto has left pathauto-state key-value data for the domain
    'dpp_task' (in the collection domain_path_pathauto_state.dpp_task.node). Purge that domain's domain_path_pathauto
    pathauto state from the key-value store. Apply the change to the live site.
  criteria: Delete the key-value data in collection(s) named domain_path_pathauto_state.dpp_task.* (e.g.
    \Drupal::keyValue('domain_path_pathauto_state.dpp_task.node')->deleteAll()), leaving no key_value
    rows under that domain prefix. This is what the submodule's domainDelete() does when a domain is deleted.
  bundle: domain_path_pathauto
  rubric_ref: rubric/domain_path_pathauto_domain_path_pathauto_purge_state@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/domain_path_pathauto-purge-state-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/domain_path_pathauto-purge-state-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/domain_path_pathauto-purge-state-verify.sh
- id: domain_path_pathauto-purge-domain
  input: 'On this Drupal site, the domain ''dpp_task2'' has domain_path_pathauto pathauto-state stored
    across more than one entity type (collections domain_path_pathauto_state.dpp_task2.node and domain_path_pathauto_state.dpp_task2.taxonomy_term).
    The domain is being decommissioned: purge ALL of its domain_path_pathauto pathauto state (every collection
    for that domain) from the key-value store. Apply the change live.'
  criteria: Find every key-value collection whose name starts with domain_path_pathauto_state.dpp_task2.
    and deleteAll() each, leaving zero key_value rows under that prefix (mirroring the submodule's domainDelete()).
  bundle: domain_path_pathauto
  rubric_ref: rubric/domain_path_pathauto_domain_path_pathauto_purge_domain@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/domain_path_pathauto-purge-domain-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/domain_path_pathauto-purge-domain-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/domain_path_pathauto-purge-domain-verify.sh
