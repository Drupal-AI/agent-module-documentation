rubrics:
- id: domain_path_domain_path_how_stored
  version: '1.0'
  applicable_bundles:
  - domain_path
  checks:
  - kind: must_contain_any
    values:
    - path_alias
    - domain_id
  scoring:
    combine: all_pass
- id: domain_path_domain_path_settings_object
  version: '1.0'
  applicable_bundles:
  - domain_path
  checks:
  - kind: must_contain_any
    values:
    - domain_path.settings
    - entity_types
    - entity.domain_path_settings
    - /admin/config/domain/domain_path
  scoring:
    combine: all_pass
- id: domain_path_domain_path_alias_title_options
  version: '1.0'
  applicable_bundles:
  - domain_path
  checks:
  - kind: must_contain_any
    values:
    - alias_title
    - hostname
    - name
    - url
  scoring:
    combine: all_pass
- id: domain_path_domain_path_alias_title_value
  version: '1.0'
  applicable_bundles:
  - domain_path
  checks:
  - kind: must_contain_any
    values:
    - hostname
  scoring:
    combine: all_pass
- id: domain_path_domain_path_known_alias
  version: '1.0'
  applicable_bundles:
  - domain_path
  checks:
  - kind: must_contain_any
    values:
    - /dp-known-alias
    - dp-known-alias
  scoring:
    combine: all_pass
- id: domain_path_domain_path_create_alias
  version: '1.0'
  applicable_bundles:
  - domain_path
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
- id: domain_path_domain_path_enable_entity_type
  version: '1.0'
  applicable_bundles:
  - domain_path
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
