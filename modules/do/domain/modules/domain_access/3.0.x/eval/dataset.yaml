metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: domain_access
  version: 3.0.x
  part_of: domain
  note: 'Domain Access is a submodule of Domain (light-documented): per-domain access control for content
    and users. These are recipe (easy) cases only, graded on response text; no site changes.'
questions:
- id: domain_access-fields
  input: The Domain Access module adds fields to content (and users) to control which domains an item
    belongs to. Name the two fields it adds and what each does.
  criteria: 'field_domain_access (entity-reference to domain, cardinality -1: the domains the item is
    assigned to) and field_domain_all_affiliates (boolean: publish to all domains / affiliates).'
  bundle: domain_access
  rubric_ref: rubric/domain_access_domain_access_fields@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: domain_access-editor-permissions
  input: How does Domain Access let a site give an editor rights on only their assigned domains rather
    than site-wide? Name a couple of the per-domain permissions it defines.
  criteria: It defines per-domain permissions such as 'create domain content', 'edit domain content',
    'delete domain content', 'view unpublished domain content', 'publish to any assigned domain', and
    'assign domain editors', plus per-bundle 'create/update/delete <type> content on assigned domains'
    — granted relative to the user's assigned domains, not site-wide.
  bundle: domain_access
  rubric_ref: rubric/domain_access_domain_access_editor_permissions@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: domain_access-settings
  input: Which config object and settings form control Domain Access behaviour (such as putting the domain
    field on the node advanced tab), and at what admin path is the form?
  criteria: The domain_access.settings config object (route domain_access.settings at /admin/config/domain/domain_access);
    keys include node_advanced_tab, node_advanced_tab_open, access_fields_removal, per_bundle_grants.
  bundle: domain_access
  rubric_ref: rubric/domain_access_domain_access_settings@1.0
  tags:
  - mode:recipe
  - difficulty:easy
