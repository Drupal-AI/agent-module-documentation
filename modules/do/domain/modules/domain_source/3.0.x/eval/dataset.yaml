metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: domain_source
  version: 3.0.x
  part_of: domain
  note: 'Domain Source is a submodule of Domain (light-documented): assigns content a canonical source
    domain and rewrites its outbound URLs to it. These are recipe (easy) cases only, graded on response
    text; no site changes.'
questions:
- id: domain_source-field
  input: What does the Domain Source module do to a node's outbound URLs, and which field on the node
    controls it?
  criteria: It rewrites the node's outbound URLs to point at its canonical 'source' domain instead of
    the currently active domain. The field_domain_source field (single-value entity-reference to a domain)
    sets that source domain.
  bundle: domain_source
  rubric_ref: rubric/domain_source_domain_source_field@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: domain_source-canonical-purpose
  input: Why would a multi-domain Drupal site (using Domain Access) also enable Domain Source? What problem
    does it solve?
  criteria: When one node is shared across several affiliate domains, Domain Source gives it a single
    canonical URL (its source domain) so links, feeds, and shares point at one authoritative host, avoiding
    duplicate-content/SEO problems.
  bundle: domain_source
  rubric_ref: rubric/domain_source_domain_source_canonical_purpose@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: domain_source-exclude-routes
  input: In Domain Source, how can you stop certain routes from having their URLs rewritten to the source
    domain? Name the config object / setting and an alter hook.
  criteria: Set exclude_routes in the domain_source.settings config (form at /admin/config/domain/domain_source),
    or alter it in code with hook_domain_source_excluded_route_names_alter / hook_domain_source_excluded_paths_alter.
  bundle: domain_source
  rubric_ref: rubric/domain_source_domain_source_exclude_routes@1.0
  tags:
  - mode:recipe
  - difficulty:easy
