    then a simple_sitemap variant ''dss_eval'' of that type with status TRUE. Verified by the type existing
    with that third-party setting and the variant existing.'
  bundle: domain_simple_sitemap
  rubric_ref: rubric/domain_simple_sitemap_domain_simple_sitemap_create_variant@1.0
