metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: domain_simple_sitemap
  version: 3.0.x
  note: 'Domain Access Simple Sitemap bridges simple_sitemap and domain_access. Its own config object
    domain_simple_sitemap.settings has two booleans: domain_simple_sitemap_filter (node source vs node
    access filter) and domain_simple_sitemap_replace_homepage (rewrite front-page URL; needs domain_config/domain_site_settings).
    Settings UI /admin/config/domain/domain_simple_sitemap/config (route domain_simple_sitemap.settings,
    permission ''administer domains''). Per domain the DomainSitemapManager creates a simple_sitemap_type
    + simple_sitemap variant whose id equals the domain id, using the domain_entity url generator, with
    third-party setting domain_simple_sitemap.sitemap_domain = <domain id>. This site has no Domain entities,
    so the hard case is grounded in the module''s real data model: creating the sitemap type + variant
    (with the sitemap_domain third-party setting) that the manager produces for a domain id, verified
    against live config entities. Baseline: domain_simple_sitemap_filter = 0, domain_simple_sitemap_replace_homepage
    = 0; no dss_* sitemap type/variant.'
questions:
- id: domain-simple-sitemap-settings
  input: What are the two configuration options provided by the domain_simple_sitemap module, and where
    do you set them?
  criteria: 'domain_simple_sitemap.settings has two booleans: domain_simple_sitemap_filter (filter the
    domain sitemap by node source instead of node access) and domain_simple_sitemap_replace_homepage (rewrite
    the domain front-page link to the domain base URL; needs domain_config or domain_site_settings). Set
    them at /admin/config/domain/domain_simple_sitemap/config (route domain_simple_sitemap.settings, permission
    ''administer domains'').'
  bundle: domain_simple_sitemap
  rubric_ref: rubric/domain_simple_sitemap_domain_simple_sitemap_settings@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: domain-simple-sitemap-variant-model
  input: How does domain_simple_sitemap represent a domain's sitemap, and when is it created automatically?
  criteria: For each Domain it creates a simple_sitemap_type and a simple_sitemap variant whose id equals
    the domain id, using the domain_entity URL generator, and tags the type with third-party setting domain_simple_sitemap.sitemap_domain
    = <domain id>. It is created automatically on hook_domain_insert (and removed on hook_domain_delete)
    via the DomainSitemapManager service.
  bundle: domain_simple_sitemap
  rubric_ref: rubric/domain_simple_sitemap_domain_simple_sitemap_variant_model@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: domain-simple-sitemap-existing-domains
  input: I installed domain_simple_sitemap after I already had several domains. How do I create sitemap
    variants for those existing domains?
  criteria: On the settings form (/admin/config/domain/domain_simple_sitemap/config) click 'Generate domain's
    sitemap variants', which batch-runs DomainSitemapManager::addSitemapVariant() for every active domain.
    Programmatically you can call the domain_simple_sitemap.manager service's addSitemapVariant() per
    domain. Then rebuild via Simple Sitemap's 'Rebuild queue & generate'.
  bundle: domain_simple_sitemap
  rubric_ref: rubric/domain_simple_sitemap_domain_simple_sitemap_existing_domains@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: domain-simple-sitemap-filter-value
  input: On this site, is domain_simple_sitemap configured to filter domain sitemaps by node source or
    by node access? Inspect the live configuration and give the value of the relevant setting.
  criteria: 'By node source: domain_simple_sitemap.settings:domain_simple_sitemap_filter is 1 (TRUE) on
    this site, which means ''use node source instead of node access as filter''.'
  bundle: domain_simple_sitemap
  rubric_ref: rubric/domain_simple_sitemap_domain_simple_sitemap_filter_value@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/domain_simple_sitemap-filter-value-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/domain_simple_sitemap-filter-value-cleanup.sh
- id: domain-simple-sitemap-replace-homepage-value
  input: Is domain_simple_sitemap currently set to replace a domain's front-page URL with the domain base
    URL in generated sitemaps on this site? Inspect the live configuration and name the setting.
  criteria: 'Yes: domain_simple_sitemap.settings:domain_simple_sitemap_replace_homepage is 1 (TRUE) on
    this site.'
  bundle: domain_simple_sitemap
  rubric_ref: rubric/domain_simple_sitemap_domain_simple_sitemap_replace_homepage_value@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/domain_simple_sitemap-replace-homepage-value-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/domain_simple_sitemap-replace-homepage-value-cleanup.sh
- id: domain-simple-sitemap-create-variant
  input: 'Create the domain sitemap that domain_simple_sitemap would produce for a domain whose id is
    dss_eval: a simple_sitemap_type with id dss_eval (using the domain_entity url generator and carrying
    the third-party setting domain_simple_sitemap.sitemap_domain = dss_eval) and a matching simple_sitemap
    variant with id dss_eval. Apply it to the live site.'
  criteria: 'Mirror DomainSitemapManager::addSitemapVariant(): create a simple_sitemap_type ''dss_eval''
