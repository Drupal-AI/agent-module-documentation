rubrics:
- id: domain_simple_sitemap_domain_simple_sitemap_settings
  version: '1.0'
  applicable_bundles:
  - domain_simple_sitemap
  checks:
  - kind: must_contain_any
    values:
    - domain_simple_sitemap_filter
    - domain_simple_sitemap_replace_homepage
    - /admin/config/domain/domain_simple_sitemap/config
  scoring:
    combine: all_pass
- id: domain_simple_sitemap_domain_simple_sitemap_variant_model
  version: '1.0'
  applicable_bundles:
  - domain_simple_sitemap
  checks:
  - kind: must_contain_any
    values:
    - simple_sitemap_type
    - variant
    - sitemap_domain
    - domain_entity
    - hook_domain_insert
    - domain id
  scoring:
    combine: all_pass
- id: domain_simple_sitemap_domain_simple_sitemap_existing_domains
  version: '1.0'
  applicable_bundles:
  - domain_simple_sitemap
  checks:
  - kind: must_contain_any
    values:
    - Generate domain's sitemap variants
    - generate
    - button
    - DomainSitemapManager
    - addSitemapVariant
  scoring:
    combine: all_pass
- id: domain_simple_sitemap_domain_simple_sitemap_filter_value
  version: '1.0'
  applicable_bundles:
  - domain_simple_sitemap
  checks:
  - kind: must_contain_any
    values:
    - source
    - '1'
    - 'true'
  scoring:
    combine: all_pass
- id: domain_simple_sitemap_domain_simple_sitemap_replace_homepage_value
  version: '1.0'
  applicable_bundles:
  - domain_simple_sitemap
  checks:
  - kind: must_contain_any
    values:
    - domain_simple_sitemap_replace_homepage
    - '1'
    - 'true'
    - replace
  scoring:
    combine: all_pass
- id: domain_simple_sitemap_domain_simple_sitemap_create_variant
  version: '1.0'
  applicable_bundles:
  - domain_simple_sitemap
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
- id: domain_simple_sitemap_domain_simple_sitemap_filter_by_source
  version: '1.0'
  applicable_bundles:
  - domain_simple_sitemap
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
