metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: eva
  version: 3.1.x
  note: EVA provides a single Views display plugin (id entity_view) that attaches a view to a content
    entity's display as a pseudo-field, passing the entity as a contextual argument. It has no admin settings
    form. Cases are `recipe` (response-graded) probing documented facts an agent would otherwise read
    source to answer; no site mutation.
questions:
- id: eva-attach-view-display
  input: On a Drupal 11 site I want a view to render on a node page attached to the entity's display,
    not as its own page or block. Which module and which Views display type do I use?
  criteria: Use the EVA module and add its 'EVA' Views display (plugin id entity_view), which attaches
    the view to a content entity's display.
  bundle: eva
  rubric_ref: rubric/eva_eva_attach_view_display@1.0
  tags:
  - mode:recipe
- id: eva-entity-as-argument
  input: Using EVA, how do I pass the current entity's ID to the attached view's contextual filter automatically?
    What are the argument mode options?
  criteria: Set the display's Arguments mode (argument_mode) to 'id' to pass $entity->id() as the argument;
    options are None, id, and token (token replaces a slash-separated token string against the entity).
  bundle: eva
  rubric_ref: rubric/eva_eva_entity_as_argument@1.0
  tags:
  - mode:recipe
- id: eva-pseudo-field-manage-display
  input: After adding an EVA display to a view, where does the view appear so I can position it among
    a node's fields, and what kind of field is it?
  criteria: It appears as a pseudo-field (extra field via hook_entity_extra_field_info) on the entity's
    Manage display page, where it can be reordered/disabled like a field.
  bundle: eva
  rubric_ref: rubric/eva_eva_pseudo_field_manage_display@1.0
  tags:
  - mode:recipe
- id: eva-related-content-node
  input: I want a 'related articles' view shown on each node page, filtered by that node using EVA. Outline
    the steps to bind the view to the node entity type and pass the node as the argument.
  criteria: Add an EVA (entity_view) display, set entity type to node (optionally specific bundles), add
    a contextual filter to the view, set argument mode to id or a token like [node:...], then place the
    pseudo-field on the node's Manage display.
  bundle: eva
  rubric_ref: rubric/eva_eva_related_content_node@1.0
  tags:
  - mode:recipe
- id: eva-dependency-views
  input: What module dependency does EVA require, and does it need any contributed modules?
  criteria: EVA depends on core Views (drupal:views) only; no contributed modules are required. drupal/token
    is an optional suggestion for a token browser.
  bundle: eva
  rubric_ref: rubric/eva_eva_dependency_views@1.0
  tags:
  - mode:recipe
- id: eva-scope-bundles
  input: In EVA, how do I attach the view to only certain bundles of an entity type, and what happens
    if I select no bundles?
  criteria: Set the Bundles option on the EVA display to the desired bundles; if none are selected the
    display attaches to all bundles of the entity type.
  bundle: eva
  rubric_ref: rubric/eva_eva_scope_bundles@1.0
  tags:
  - mode:recipe
- id: eva-token-argument
  input: How can I pass something other than the entity ID (e.g. the node's author uid) as the view argument
    in EVA?
  criteria: Set argument mode to 'token' and enter a slash-separated token string in default_argument
    (e.g. [node:author:uid]); EVA token-replaces it against the entity and splits on '/'.
  bundle: eva
  rubric_ref: rubric/eva_eva_token_argument@1.0
  tags:
  - mode:recipe
