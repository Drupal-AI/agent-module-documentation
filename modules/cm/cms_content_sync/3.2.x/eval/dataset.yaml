metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: cms_content_sync
  version: 3.2.x
  note: Content Sync syndicates entities between Drupal sites through an external content-sync.io Sync
    Core backend; there is no backend on this eval site, so all cases are grounded in the module's two
    config entities (cms_content_sync_pool, cms_content_sync_flow), its Drush commands, its plugin types
    and its permissions - NOT in live push/pull. Pool::create() and Flow::create() persist to config without
    contacting any backend. In 3.2.x the Pool config_export only includes id/label/backend_url; a Flow
    requires variant=simple (the only variant with a controller) or it throws on save.
questions:
- id: cms_content_sync-config-entities
  input: In the Drupal module cms_content_sync (Content Sync / content-sync.io), what are the two config
    entity types that model syndication, and what does each represent?
  criteria: A Pool (cms_content_sync_pool) is the shared syndication channel (identified by a backend_url
    Sync Core URL); a Flow (cms_content_sync_flow) declares which entity types/bundles this site pushes
    or pulls and to/from which pools.
  bundle: cms_content_sync
  rubric_ref: rubric/cms_content_sync_cms_content_sync_config_entities@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: cms_content_sync-register-command
  input: Using the cms_content_sync module's Drush commands, which command registers the current site
    with the Sync Core backend, and which command pushes a flow's entities?
  criteria: 'drush cms_content_sync:register <environment_type> <contract> <space> <token> (alias csr)
    registers the site; drush cms_content_sync:push <flow_id> (alias cs-push) pushes a flow''s entities.
    Other commands: cms_content_sync:pull, cms_content_sync:configuration-export (cse), cms_content_sync:reset-status-entities,
    cms_content_sync:check-entity-flags.'
  bundle: cms_content_sync
  rubric_ref: rubric/cms_content_sync_cms_content_sync_register_command@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: cms_content_sync-plugin-types
  input: cms_content_sync serializes each entity and field during sync via plugins. What are the two plugin
    types it defines, and what is one bundled handler for each?
  criteria: It defines cms_content_sync_entity_handler (annotation @EntityHandler; e.g. DefaultNodeHandler,
    DefaultMediaHandler, DefaultTaxonomyHandler) and cms_content_sync_field_handler (annotation @FieldHandler;
    e.g. DefaultFieldHandler, DefaultEntityReferenceHandler, DefaultParagraphsReferenceHandler). Handlers
    live in src/Plugin/cms_content_sync/entity_handler and .../field_handler.
  bundle: cms_content_sync
  rubric_ref: rubric/cms_content_sync_cms_content_sync_plugin_types@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: cms_content_sync-known-pool-url
  input: This Drupal site has a cms_content_sync Pool configured. Inspect the live configuration and report
    the backend (Sync Core) URL of the pool whose machine id is ccs_known_pool.
  criteria: The Pool ccs_known_pool has backend_url https://known.content-sync.example (config cms_content_sync.pool.ccs_known_pool).
    Read it with drush cget cms_content_sync.pool.ccs_known_pool or Pool::load('ccs_known_pool')->backend_url.
  bundle: cms_content_sync
  rubric_ref: rubric/cms_content_sync_cms_content_sync_known_pool_url@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
