metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: cms_content_sync_simple_sitemap
  version: 3.2.x
  note: 'Glue submodule: one event subscriber (SimpleSitemapSyncExtend, service cms_content_sync_simple_sitemap.event_subscriber)
    that carries per-entity Simple Sitemap settings across sites via Content Sync push/pull events. No
    config/UI/Drush/permissions. Medium introspects the running container for that subscriber; hard is
    an enable-the-integration task (safe to toggle - no dependents). No sync backend needed.'
questions:
- id: ccs-ss-what
  input: What does the cms_content_sync_simple_sitemap module do, and which contrib module does it require
    besides cms_content_sync?
  criteria: It carries an entity's Simple Sitemap settings (inclusion, priority, changefreq) with it during
    Content Sync push/pull, preserving per-entity sitemap configuration across sites. It requires the
    contrib simple_sitemap module plus cms_content_sync.
  bundle: cms_content_sync_simple_sitemap
  rubric_ref: rubric/cms_content_sync_simple_sitemap_ccs_ss_what@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: ccs-ss-events
  input: How does cms_content_sync_simple_sitemap integrate with Content Sync? Name the Content Sync events
    its subscriber listens to.
  criteria: Through one event subscriber (SimpleSitemapSyncExtend) subscribing to BeforeEntityTypeExport,
    BeforeEntityPush and AfterEntityPull.
  bundle: cms_content_sync_simple_sitemap
  rubric_ref: rubric/cms_content_sync_simple_sitemap_ccs_ss_events@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: ccs-ss-versions
  input: The cms_content_sync_simple_sitemap module adds a property to the Content Sync payload. What
    is that property named, and which major versions of Simple Sitemap does the integration support?
  criteria: The property is named 'simple_sitemap' (SimpleSitemapSyncExtend::PROPERTY_NAME). The integration
    supports Simple Sitemap v3 and v4 APIs.
  bundle: cms_content_sync_simple_sitemap
  rubric_ref: rubric/cms_content_sync_simple_sitemap_ccs_ss_versions@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: ccs-ss-subscriber-service
  input: On this running Drupal site, the cms_content_sync_simple_sitemap integration is active. Inspect
    the service container and give the machine id of the event subscriber service this module registers.
  criteria: The service id is cms_content_sync_simple_sitemap.event_subscriber (class SimpleSitemapSyncExtend).
    Confirm with drush ev '\Drupal::getContainer()->has("cms_content_sync_simple_sitemap.event_subscriber")'.
  bundle: cms_content_sync_simple_sitemap
  rubric_ref: rubric/cms_content_sync_simple_sitemap_ccs_ss_subscriber_service@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/cms_content_sync_simple_sitemap-subscriber-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/cms_content_sync_simple_sitemap-subscriber-cleanup.sh
- id: ccs-ss-enable
  input: This Drupal site uses Content Sync and the contrib simple_sitemap module. Enable the Content
    Sync integration that keeps per-entity Simple Sitemap settings in sync across sites during push/pull.
  criteria: The cms_content_sync_simple_sitemap module is enabled (e.g. drush en cms_content_sync_simple_sitemap
    -y), registering the SimpleSitemapSyncExtend event subscriber.
  bundle: cms_content_sync_simple_sitemap
  rubric_ref: rubric/cms_content_sync_simple_sitemap_ccs_ss_enable@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/cms_content_sync_simple_sitemap-enable-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/cms_content_sync_simple_sitemap-enable-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/cms_content_sync_simple_sitemap-enable-verify.sh
