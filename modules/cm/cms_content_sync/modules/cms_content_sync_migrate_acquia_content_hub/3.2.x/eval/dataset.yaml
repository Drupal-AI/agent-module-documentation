metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: cms_content_sync_migrate_acquia_content_hub
  version: 3.2.x
  note: Migration helper that builds Content Sync Pools/Flows from an existing Acquia Content Hub config.
    It hard-depends on acquia_contenthub, which is NOT installed on this eval site, so the submodule cannot
    be enabled here. Recipe cases are grounded in its source (forms, drush command content_sync_migrate_acquia_content_hub
    / mach, default pool machine name 'content'); medium/hard are grounded in the migration's OUTPUT -
    standard cms_content_sync_pool/flow config entities - which are created and inspected via the parent
    module's already-enabled config entities without contacting any backend.
questions:
- id: ccs-mach-what
  input: What is the purpose of the cms_content_sync_migrate_acquia_content_hub module, and what Content
    Sync configuration does it produce?
  criteria: It bootstraps a Content Sync setup from an existing Acquia Content Hub configuration, creating
    standard cms_content_sync_pool and cms_content_sync_flow config entities (plus EntityStatus records)
    so a site can move from Acquia Content Hub to Content Sync without configuring syndication from scratch.
  bundle: cms_content_sync_migrate_acquia_content_hub
  rubric_ref: rubric/cms_content_sync_migrate_acquia_content_hub_ccs_mach_what@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: ccs-mach-drush
  input: Which Drush command does cms_content_sync_migrate_acquia_content_hub provide (and its alias),
    and which options are required to run it?
  criteria: content_sync_migrate_acquia_content_hub (alias mach); required options --type, --backend_url
    and --authentication_type (optional --site_id, --node_push_behavior, --sync).
  bundle: cms_content_sync_migrate_acquia_content_hub
  rubric_ref: rubric/cms_content_sync_migrate_acquia_content_hub_ccs_mach_drush@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: ccs-mach-default-pool
  input: When cms_content_sync_migrate_acquia_content_hub runs its migration, what is the machine name
    of the default Content Sync Pool it creates?
  criteria: The default pool machine name is 'content' (label 'Content') - MigrationBase::DEFAULT_POOL_MACHINE_NAME,
    created via Pool::createPool().
  bundle: cms_content_sync_migrate_acquia_content_hub
  rubric_ref: rubric/cms_content_sync_migrate_acquia_content_hub_ccs_mach_default_pool@1.0
  tags:
