    by cms_content_sync_custom_field_example. Inspect the live field configuration and give the machine
    name of that field and its field type.
  criteria: The field is field_ccs_known and its type is cs_custom_field (FieldStorageConfig node.field_ccs_known,
    type cs_custom_field).
  bundle: cms_content_sync_custom_field_example
  rubric_ref: rubric/cms_content_sync_custom_field_example_ccs_cfe_known_field@1.0
  tags:
