questions:
- id: ccs-cfe-field-type
  input: The cms_content_sync_custom_field_example submodule ships a sample field type used to demonstrate
    a Content Sync field handler. What is the machine name (plugin id) of that field type?
  criteria: The field type id is cs_custom_field (Plugin/Field/FieldType/CustomField, @FieldType id=cs_custom_field),
    with an accompanying widget and formatter.
  bundle: cms_content_sync_custom_field_example
  rubric_ref: rubric/cms_content_sync_custom_field_example_ccs_cfe_field_type@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: ccs-cfe-field-handler
  input: In cms_content_sync_custom_field_example, how does the example CustomFieldHandler tell Content
    Sync it applies to the cs_custom_field field, and what plugin annotation/base does it use?
  criteria: CustomFieldHandler is a @FieldHandler (id cms_content_sync_custom_field_handler) extending
    DefaultFieldHandler; its static supports($entity_type,$bundle,$field_name,$field) returns TRUE when
    $field->getType() is cs_custom_field.
  bundle: cms_content_sync_custom_field_example
  rubric_ref: rubric/cms_content_sync_custom_field_example_ccs_cfe_field_handler@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: ccs-cfe-ignore-handler
  input: The example submodule includes an IgnoreFieldHandler. What does it demonstrate and which field
    does it match?
  criteria: IgnoreFieldHandler (@FieldHandler id cms_content_sync_ignore_field_handler) matches the field
    named field_ignore_example and returns TRUE from push/pull without transferring any data, i.e. it
    shows how to exclude a field from syndication.
  bundle: cms_content_sync_custom_field_example
  rubric_ref: rubric/cms_content_sync_custom_field_example_ccs_cfe_ignore_handler@1.0
  tags:
  - mode:recipe
  - difficulty:easy
