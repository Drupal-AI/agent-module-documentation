metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: cms_content_sync_draggableviews
  version: 3.2.x
  note: 'Glue submodule: a single event subscriber (DraggableViewsSyncExtend, service cms_content_sync_draggableviews.event_subscriber)
    that carries DraggableViews weights across sites via Content Sync push/pull events. No config/UI/Drush/permissions.
    Medium introspects the running site''s container for that subscriber; hard is an enable-the-integration
    task (module toggling is safe - it has no dependents). No sync backend is needed for either.'
questions:
- id: ccs-dv-what
  input: What does the cms_content_sync_draggableviews module do, and which contrib module does it require
    besides cms_content_sync?
  criteria: It makes DraggableViews manual-ordering weights travel with entities during Content Sync push/pull
    (reading/writing the draggableviews_structure table), so drag ordering is preserved across syndicated
    sites. It requires the contrib draggableviews module plus cms_content_sync.
  bundle: cms_content_sync_draggableviews
  rubric_ref: rubric/cms_content_sync_draggableviews_ccs_dv_what@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: ccs-dv-events
  input: How does cms_content_sync_draggableviews hook into Content Sync? Name the Content Sync events
    its subscriber listens to.
  criteria: Via one event subscriber (DraggableViewsSyncExtend) subscribing to BeforeEntityTypeExport
    (add a draggableviews property), BeforeEntityPush (attach weight rows) and AfterEntityPull (write
    weights back).
  bundle: cms_content_sync_draggableviews
  rubric_ref: rubric/cms_content_sync_draggableviews_ccs_dv_events@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: ccs-dv-property
  input: cms_content_sync_draggableviews adds an extra property to the Content Sync payload/entity-type
    export. What is that property named, and where does the weight data come from?
  criteria: The property is named 'draggableviews' (DraggableViewsSyncExtend::PROPERTY_NAME); the weight
    data is read from and written to the draggableviews_structure database table.
  bundle: cms_content_sync_draggableviews
  rubric_ref: rubric/cms_content_sync_draggableviews_ccs_dv_property@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: ccs-dv-subscriber-service
  input: On this running Drupal site, the cms_content_sync_draggableviews integration is active. Inspect
    the site's service container and give the machine id of the event subscriber service this module registers.
  criteria: The service id is cms_content_sync_draggableviews.event_subscriber (class DraggableViewsSyncExtend).
    Confirm with drush ev '\Drupal::getContainer()->has("cms_content_sync_draggableviews.event_subscriber")'.
  bundle: cms_content_sync_draggableviews
  rubric_ref: rubric/cms_content_sync_draggableviews_ccs_dv_subscriber_service@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/cms_content_sync_draggableviews-subscriber-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/cms_content_sync_draggableviews-subscriber-cleanup.sh
- id: ccs-dv-enable
  input: This Drupal site uses Content Sync and the contrib draggableviews module. Enable the Content
    Sync integration that keeps DraggableViews ordering in sync across sites, so that drag-ordering weights
    are carried during push/pull.
  criteria: The cms_content_sync_draggableviews module is enabled (e.g. drush en cms_content_sync_draggableviews
    -y), which registers the DraggableViewsSyncExtend event subscriber.
  bundle: cms_content_sync_draggableviews
  rubric_ref: rubric/cms_content_sync_draggableviews_ccs_dv_enable@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/cms_content_sync_draggableviews-enable-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/cms_content_sync_draggableviews-enable-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/cms_content_sync_draggableviews-enable-verify.sh
