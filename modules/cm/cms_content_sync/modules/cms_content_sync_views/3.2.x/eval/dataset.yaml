metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: cms_content_sync_views
  version: 3.2.x
  note: 'Views integration for Content Sync''s cms_content_sync_entity_status records: Views field/filter
    plugins, a DER base field, and three system.action VBO configs (export_status_entity ''Force Push'',
    import_status_entity, reset_status_entity of type cms_content_sync_entity_status). Hard dependency
    of cms_content_sync_health, so the module is NOT toggled in these cases. Medium introspects the shipped
    action config; hard creates a namespaced action config entity reusing the module''s export_status_entity
    plugin. No sync backend needed.'
questions:
- id: ccs-views-what
  input: What does cms_content_sync_views provide, and which extra contrib module does it require (and
    why)?
  criteria: It provides a Views integration over Content Sync's cms_content_sync_entity_status records
    (Views fields, filters and bulk actions). It requires dynamic_entity_reference because the status
    entity references many entity types from one table, so a DER base field is needed for Views to join
    to the referenced entity.
  bundle: cms_content_sync_views
  rubric_ref: rubric/cms_content_sync_views_ccs_views_what@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: ccs-views-actions
  input: cms_content_sync_views installs bulk-operation actions on sync-status records. Name the three
    actions it ships (their machine ids or what they do).
  criteria: export_status_entity (label 'Force Push', push), import_status_entity (pull) and reset_status_entity
    (reset) - system.action config entities of type cms_content_sync_entity_status, backed by PushStatusEntity/PullStatusEntity/ResetStatusEntity
    action plugins.
  bundle: cms_content_sync_views
  rubric_ref: rubric/cms_content_sync_views_ccs_views_actions@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: ccs-views-plugins
  input: Name some of the Views field or filter plugins that cms_content_sync_views adds for building
    sync-status listings.
  criteria: 'Field plugins: SyncState, PoolLabel, FlowLabel, EntityTypeLabel, ParentEntity, RenderedFlags.
    Filter plugins: SyncState, EntityType, Flags, Flow, Pool. Registered via hook_views_data_alter.'
  bundle: cms_content_sync_views
  rubric_ref: rubric/cms_content_sync_views_ccs_views_plugins@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: ccs-views-action-label
  input: On this site, cms_content_sync_views is enabled. Inspect the live configuration of its 'export_status_entity'
    action and report that action's label.
  criteria: The action system.action.export_status_entity has label 'Force Push' (drush cget system.action.export_status_entity
    label).
  bundle: cms_content_sync_views
  rubric_ref: rubric/cms_content_sync_views_ccs_views_action_label@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/cms_content_sync_views-action-label-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/cms_content_sync_views-action-label-cleanup.sh
- id: ccs-views-create-action
  input: 'On this Drupal site, create a bulk-operation action (system.action config entity) with machine
    id ''ccs_views_task_action'' and label ''CCS Task Force Push'' that reuses the Content Sync Views
    force-push action plugin. It must target the sync-status entity: set the action type to cms_content_sync_entity_status
    and its plugin to export_status_entity. Apply it to the live site.'
  criteria: A system.action config entity ccs_views_task_action exists with type cms_content_sync_entity_status
    and plugin export_status_entity, e.g. Action::create(['id'=>'ccs_views_task_action','label'=>'CCS
    Task Force Push','type'=>'cms_content_sync_entity_status','plugin'=>'export_status_entity','configuration'=>[]])->save().
  bundle: cms_content_sync_views
  rubric_ref: rubric/cms_content_sync_views_ccs_views_create_action@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/cms_content_sync_views-create-action-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/cms_content_sync_views-create-action-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/cms_content_sync_views-create-action-verify.sh
