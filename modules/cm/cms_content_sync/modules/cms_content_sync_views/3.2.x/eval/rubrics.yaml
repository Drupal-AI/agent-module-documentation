rubrics:
- id: cms_content_sync_views_ccs_views_what
  version: '1.0'
  applicable_bundles:
  - cms_content_sync_views
  checks:
  - kind: must_contain_any
    values:
    - dynamic_entity_reference
    - dynamic entity reference
    - entity status
    - sync status
    - views integration
  scoring:
    combine: all_pass
- id: cms_content_sync_views_ccs_views_actions
  version: '1.0'
  applicable_bundles:
  - cms_content_sync_views
  checks:
  - kind: must_contain_any
    values:
    - export_status_entity
    - import_status_entity
    - reset_status_entity
    - Force Push
  scoring:
    combine: all_pass
- id: cms_content_sync_views_ccs_views_plugins
  version: '1.0'
  applicable_bundles:
  - cms_content_sync_views
  checks:
  - kind: must_contain_any
    values:
    - SyncState
    - PoolLabel
    - FlowLabel
    - EntityTypeLabel
    - RenderedFlags
    - Flags
    - Pool
    - Flow
  scoring:
    combine: all_pass
- id: cms_content_sync_views_ccs_views_action_label
  version: '1.0'
  applicable_bundles:
  - cms_content_sync_views
  checks:
  - kind: must_contain_any
    values:
    - Force Push
  scoring:
    combine: all_pass
- id: cms_content_sync_views_ccs_views_create_action
  version: '1.0'
  applicable_bundles:
  - cms_content_sync_views
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
