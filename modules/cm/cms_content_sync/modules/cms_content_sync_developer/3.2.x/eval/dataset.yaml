metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: cms_content_sync_developer
  version: 3.2.x
  note: 'Developer helper submodule for Content Sync: version-mismatch warnings plus Drush commands (csuf,
    csfed). Its only persistent state is the cms_content_sync.developer config key version_mismatch (a
    map keyed by flow id), which is safe to read/write via the config factory without any sync backend.
    Medium reads that config; hard writes it.'
questions:
- id: ccs-dev-update-flows-command
  input: In the cms_content_sync_developer module, which Drush command re-exports/updates all Content
    Sync flow configurations (and clears version warnings), and what is its alias?
  criteria: cms_content_sync_developer:update-flows, alias csuf.
  bundle: cms_content_sync_developer
  rubric_ref: rubric/cms_content_sync_developer_ccs_dev_update_flows_command@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: ccs-dev-force-deletion
  input: The cms_content_sync_developer module adds a Drush command to force-delete an entity from Content
    Sync's bookkeeping. What is the command (or alias) and which options select the entity?
  criteria: cms_content_sync_developer:force-entity-deletion (alias csfed); selects the entity with --entity_uuid=<uuid>
    or --bundle=<bundle> on a given entity type, e.g. drush csfed node --entity_uuid=...
  bundle: cms_content_sync_developer
  rubric_ref: rubric/cms_content_sync_developer_ccs_dev_force_deletion@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: ccs-dev-version-mismatch-config
  input: The cms_content_sync_developer module warns site builders about out-of-date flows. Which config
    object and key hold that version-mismatch state, and how is it kept out of exported configuration?
  criteria: State lives in the cms_content_sync.developer config under the key version_mismatch (a map
    keyed by flow id). hook_config_ignore_settings_alter() adds cms_content_sync.developer:version_mismatch
    to config_ignore so it is not exported.
  bundle: cms_content_sync_developer
  rubric_ref: rubric/cms_content_sync_developer_ccs_dev_version_mismatch_config@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: ccs-dev-known-mismatch
  input: On this site, the cms_content_sync_developer module currently records a version mismatch for
    exactly one flow. Inspect the live cms_content_sync.developer configuration and give the machine id
    of the flow that is flagged.
  criteria: 'The flow ccs_known_flow is flagged: cms_content_sync.developer:version_mismatch contains
    the key ccs_known_flow. Read with drush cget cms_content_sync.developer version_mismatch.'
  bundle: cms_content_sync_developer
  rubric_ref: rubric/cms_content_sync_developer_ccs_dev_known_mismatch@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/cms_content_sync_developer-known-mismatch-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/cms_content_sync_developer-known-mismatch-cleanup.sh
- id: ccs-dev-flag-mismatch
  input: On this site, use the cms_content_sync_developer state configuration to flag the flow with machine
    id 'ccs_task_flow' as having a version mismatch. That is, add ccs_task_flow as a key under version_mismatch
    in the cms_content_sync.developer config and apply it to the live site.
  criteria: cms_content_sync.developer:version_mismatch is a map containing the key ccs_task_flow, e.g.
    \Drupal::configFactory()->getEditable('cms_content_sync.developer')->set('version_mismatch', ['ccs_task_flow'
    => ['name' => 'CCS Task Flow']])->save();
  bundle: cms_content_sync_developer
  rubric_ref: rubric/cms_content_sync_developer_ccs_dev_flag_mismatch@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/cms_content_sync_developer-flag-mismatch-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/cms_content_sync_developer-flag-mismatch-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/cms_content_sync_developer-flag-mismatch-verify.sh
