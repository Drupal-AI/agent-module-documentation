metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: cms_content_sync_health
  version: 3.2.x
  note: 'Read-only Sync Health dashboard over Content Sync EntityStatus records. Real artifacts: routes
    under /admin/content/sync-health, the permission ''access sync health'', and the bundled view content_sync_entity_status.
    Medium/hard are grounded in that permission and user roles (creatable/inspectable via drush, no sync
    backend needed).'
questions:
- id: ccs-health-route
  input: The cms_content_sync_health module adds a reporting dashboard. At what admin path is the Sync
    Health overview, and what does the dashboard report on?
  criteria: The Sync Health overview is at /admin/content/sync-health (route entity.cms_content_sync.sync_health);
    it reports per-entity syndication status (from EntityStatus records) and flow version mismatches.
  bundle: cms_content_sync_health
  rubric_ref: rubric/cms_content_sync_health_ccs_health_route@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: ccs-health-permission
  input: Which permission does cms_content_sync_health define to control access to its Sync Health dashboard?
  criteria: The permission is 'access sync health' (defined in cms_content_sync_health.permissions.yml);
    it gates all Sync Health routes.
  bundle: cms_content_sync_health
  rubric_ref: rubric/cms_content_sync_health_ccs_health_permission@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: ccs-health-view
  input: The Sync Health dashboard includes an 'Entity Status' tab. Which bundled Views view backs it,
    and which submodule does cms_content_sync_health depend on for that views integration?
  criteria: The Entity Status tab is backed by the bundled view content_sync_entity_status (views.view.content_sync_entity_status).
    It depends on the cms_content_sync_views submodule (plus dynamic_entity_reference and views).
  bundle: cms_content_sync_health
  rubric_ref: rubric/cms_content_sync_health_ccs_health_view@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: ccs-health-known-role
  input: On this site, exactly one custom user role has been granted access to the Content Sync Sync Health
    dashboard. Inspect the live roles/permissions and give the machine id of that role.
  criteria: The role ccs_health_known has the 'access sync health' permission (check drush role:list or
    user.role.ccs_health_known permissions).
  bundle: cms_content_sync_health
  rubric_ref: rubric/cms_content_sync_health_ccs_health_known_role@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/cms_content_sync_health-known-role-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/cms_content_sync_health-known-role-cleanup.sh
- id: ccs-health-grant-role
  input: On this Drupal site, create a user role with machine id 'ccs_health_viewer' (label 'CCS Health
    Viewer') and grant it the permission that lets it view the Content Sync Sync Health dashboard. Apply
    it to the live site.
  criteria: A role ccs_health_viewer exists and has the 'access sync health' permission (e.g. drush role:create
    ccs_health_viewer 'CCS Health Viewer'; drush role:perm:add ccs_health_viewer 'access sync health').
  bundle: cms_content_sync_health
  rubric_ref: rubric/cms_content_sync_health_ccs_health_grant_role@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/cms_content_sync_health-grant-role-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/cms_content_sync_health-grant-role-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/cms_content_sync_health-grant-role-verify.sh
