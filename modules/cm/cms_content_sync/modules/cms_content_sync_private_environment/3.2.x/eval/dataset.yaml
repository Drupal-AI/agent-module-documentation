metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: cms_content_sync_private_environment
  version: 3.2.x
  note: 'Lets a backend-unreachable (local/firewalled) site poll the Sync Core for queued requests instead
    of receiving pushes. Real artifacts: the Drush command cms_content_sync_private_environment:poll (cspep),
    a cron handler, and the route cms_content_sync_private_environment.private_environment (/admin/config/services/cms_content_sync/private-environment).
    No config/permission/plugins. Medium introspects the registered route on the live site; hard is an
    enable-the-integration task (safe to toggle - no dependents). No backend needed.'
questions:
- id: ccs-pe-what
  input: What problem does cms_content_sync_private_environment solve, and by what mechanism (push vs
    poll) does it work?
  criteria: It lets a site the Sync Core backend cannot reach inbound (e.g. a local/firewalled dev environment)
    take part in syndication by polling the backend for queued requests instead of receiving inbound push
    calls.
  bundle: cms_content_sync_private_environment
  rubric_ref: rubric/cms_content_sync_private_environment_ccs_pe_what@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: ccs-pe-poll-command
  input: Which Drush command does cms_content_sync_private_environment provide to poll the backend, what
    is its alias, and what does its limit argument accept?
  criteria: cms_content_sync_private_environment:poll (alias cspep); the limit argument is 'watch', 'all',
    or a fixed number, with options --pollInterval (watch mode, default 15s) and --host.
  bundle: cms_content_sync_private_environment
  rubric_ref: rubric/cms_content_sync_private_environment_ccs_pe_poll_command@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: ccs-pe-cron-auth
  input: Besides the Drush command, how else can cms_content_sync_private_environment process pending
    sync requests, and what authentication must be configured for Content Sync for it to work?
  criteria: It also processes requests on cron (hook_cron calls RequestHandlerController::processRequests
    when enabled). It requires Basic Auth to be enabled and configured for Content Sync.
  bundle: cms_content_sync_private_environment
  rubric_ref: rubric/cms_content_sync_private_environment_ccs_pe_cron_auth@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: ccs-pe-route
  input: On this running site, the cms_content_sync_private_environment module is enabled. Inspect the
    site's registered routes and give the URL path of its private-environment request handler route.
  criteria: The route cms_content_sync_private_environment.private_environment has path /admin/config/services/cms_content_sync/private-environment
    (drush route --name=cms_content_sync_private_environment.private_environment).
  bundle: cms_content_sync_private_environment
  rubric_ref: rubric/cms_content_sync_private_environment_ccs_pe_route@1.0
  tags:
  - mode:introspection
  - difficulty:medium
