rubrics:
- id: better_search_better_search_change_placeholder
  version: '1.0'
  applicable_bundles:
  - better_search
  checks:
  - kind: must_contain_any
    values:
    - better_search.settings
    - placeholder_text
    - /admin/config/search/better-search
    - better-search
  scoring:
    combine: all_pass
- id: better_search_better_search_themes
  version: '1.0'
  applicable_bundles:
  - better_search
  checks:
  - kind: must_contain_any
    values:
    - background_fade
    - Expand on Hover
    - on_hover_button
    - theme
  scoring:
    combine: all_pass
- id: better_search_better_search_which_form
  version: '1.0'
  applicable_bundles:
  - better_search
  checks:
  - kind: must_contain_any
    values:
    - search_block_form
    - block_form_id
    - search_form
  scoring:
    combine: all_pass
- id: better_search_better_search_known_placeholder
  version: '1.0'
  applicable_bundles:
  - better_search
  checks:
  - kind: must_contain_any
    values:
    - Find content here
  scoring:
    combine: all_pass
- id: better_search_better_search_known_theme
  version: '1.0'
  applicable_bundles:
  - better_search
  checks:
  - kind: must_contain_any
    values:
    - Slide Icon
    - on_hover_button
    - '3'
  scoring:
    combine: all_pass
- id: better_search_better_search_set_theme
  version: '1.0'
  applicable_bundles:
  - better_search
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
- id: better_search_better_search_set_placeholder
  version: '1.0'
  applicable_bundles:
  - better_search
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
