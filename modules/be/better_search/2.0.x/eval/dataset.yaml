metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: better_search
  version: 2.0.x
  note: 'Better Search Block themes the core search block and (optionally) the search-results page form
    via hook_form_alter() + CSS. All state is one config object, better_search.settings, with keys placeholder_text,
    theme (int 0-3: 0 background fade, 1 expand on hover, 2 expand icon on hover, 3 slide icon on hover),
    size, searchpage_enable, searchpage_submit_not_visible, input_name (default keys), block_form_id (default
    search_block_form). Settings form is route better_search_settings at /admin/config/search/better-search,
    gated by the ''administer Better Search settings'' permission. No schema, plugins, services or Drush.
    Medium cases seed known placeholder/theme values to read back; hard cases have the agent change the
    theme and the placeholder, verified against live config.'
questions:
- id: better_search-change-placeholder
  input: Using the Drupal Better Search Block module, how do I change the placeholder text shown inside
    the search box, and in which config object / settings page is that stored?
  criteria: Set placeholder_text on the settings form at /admin/config/search/better-search (route better_search_settings);
    it is saved to config better_search.settings key placeholder_text.
  bundle: better_search
  rubric_ref: rubric/better_search_better_search_change_placeholder@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: better_search-themes
  input: What animation styles does the Better Search Block module offer for the search box, and how is
    the chosen style stored in configuration?
  criteria: 'Four CSS styles selected by the integer theme key in better_search.settings: 0 Background
    Fade (better_search/background_fade), 1 Expand on Hover, 2 Expand Icon on Hover (increase_icon_size),
    3 Slide Icon on Hover (on_hover_button).'
  bundle: better_search
  rubric_ref: rubric/better_search_better_search_themes@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: better_search-which-form
  input: Which form does Better Search Block restyle by default, and how would I make it style a different
    (custom) search block instead?
  criteria: Its hook_form_alter() targets the form id in better_search.settings block_form_id (default
    search_block_form) plus core's search_form. To style a custom search form, change block_form_id (and
    input_name) in the advanced settings.
  bundle: better_search
  rubric_ref: rubric/better_search_better_search_which_form@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: better_search-known-placeholder
  input: On this Drupal site, Better Search Block has a custom placeholder configured for the search box.
    Inspect the live configuration and state the exact placeholder text.
  criteria: The placeholder is 'Find content here' (config better_search.settings key placeholder_text).
  bundle: better_search
  rubric_ref: rubric/better_search_better_search_known_placeholder@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/better_search-known-placeholder-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/better_search-known-placeholder-cleanup.sh
- id: better_search-known-theme
  input: Which Better Search Block animation style is currently active on this site? Inspect the live
    configuration and identify the style (by its theme value and/or name).
  criteria: theme is 3, i.e. 'Slide Icon on Hover' (library better_search/on_hover_button), in config
    better_search.settings.
  bundle: better_search
  rubric_ref: rubric/better_search_better_search_known_theme@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/better_search-known-theme-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/better_search-known-theme-cleanup.sh
- id: better_search-set-theme
  input: On this Drupal site, configure Better Search Block to use the 'Expand on Hover' animation style
    for the search box, and apply the change to the live site.
  criteria: config better_search.settings theme is set to 1 (Expand on Hover), e.g. drush cset better_search.settings
    theme 1, or the 'Expand on Hover' radio on /admin/config/search/better-search.
  bundle: better_search
  rubric_ref: rubric/better_search_better_search_set_theme@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/better_search-set-theme-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/better_search-set-theme-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/better_search-set-theme-verify.sh
- id: better_search-set-placeholder
  input: I want my search box to show the words 'Type to search' inside it before anyone types. Set that
    up on my Drupal site using Better Search Block.
  criteria: config better_search.settings placeholder_text is set to 'Type to search', e.g. drush cset
    better_search.settings placeholder_text 'Type to search', or the Placeholder Text field on /admin/config/search/better-search.
  bundle: better_search
  rubric_ref: rubric/better_search_better_search_set_placeholder@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: site-owner
    reset: agent-module-documentation/evaluation/verify/better_search-set-placeholder-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/better_search-set-placeholder-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/better_search-set-placeholder-verify.sh
