questions:
- id: bssb-per-node-purpose
  input: What does the Better Social Sharing Buttons per Node submodule let a Drupal site do that the
    base Better Social Sharing Buttons module does not?
  criteria: It lets editors turn the social sharing buttons on or off on individual nodes (a per-node
    toggle), configured per content type, instead of only having one global setting.
  bundle: better_social_sharing_buttons_per_node
  rubric_ref: rubric/better_social_sharing_buttons_per_node_bssb_per_node_purpose@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: bssb-per-node-permission
  input: Which permission does the better_social_sharing_buttons_per_node module define to control who
    can change the sharing-buttons display state on nodes?
  criteria: The `edit social sharing buttons node display` permission.
  bundle: better_social_sharing_buttons_per_node
  rubric_ref: rubric/better_social_sharing_buttons_per_node_bssb_per_node_permission@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: bssb-per-node-config-location
  input: The per-node submodule has no settings form of its own. Where are its settings stored, and which
    three keys control it for a content type?
  criteria: 'There is no config UI (configure: null). Settings are stored as third-party settings on the
    node_type under the better_social_sharing_buttons_per_node namespace, with keys `active` (enable for
    the type), `override` (allow per-node toggle) and `override_default` (default state for new nodes).
    It also adds a boolean node base field better_social_sharing_buttons_active.'
  bundle: better_social_sharing_buttons_per_node
  rubric_ref: rubric/better_social_sharing_buttons_per_node_bssb_per_node_config_location@1.0
  tags:
  - mode:recipe
  - difficulty:easy
