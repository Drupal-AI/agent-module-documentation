metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: better_social_sharing_buttons
  version: 5.0.x
  note: 'Three tiers. easy/recipe: response-graded on the block, config keys, default networks, iconset
    and sizing. medium/introspection: setup writes a known enabled-networks set / icon width live, agent
    reads it back, cleanup restores defaults. hard/execution: reset restores install defaults, agent configures
    a required network set + icon size, verify reads better_social_sharing_buttons.settings live (exit
    0 = pass).'
questions:
- id: bssb-block-and-render
  input: How does the Better Social Sharing Buttons module put share buttons on a Drupal page, and does
    it call any external tracking service to do it? Name the block plugin id.
  criteria: It provides a block (plugin id social_sharing_buttons_block, admin_label 'Better Social Sharing
    Buttons'), plus optional node/paragraph pseudo-fields and Twig Tweak. Each button is a plain link
    to the network's own share URL opened in a new tab — no external API, tracker, or ad-server calls
    — and icons come from a single inlined minified SVG sprite.
  bundle: better_social_sharing_buttons
  rubric_ref: rubric/better_social_sharing_buttons_bssb_block_and_render@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: bssb-config-keys
  input: Which Drupal config object holds Better Social Sharing Buttons' global settings, and which keys
    control the icon size and the icon set? What are their default values?
  criteria: 'Config object better_social_sharing_buttons.settings. `width` sets the icon size (default
    20px), `radius` the corner radius (default 3px), and `iconset` the icon set: social-icons--square
    (colored, default) or social-icons--no-color (flat).'
  bundle: better_social_sharing_buttons
  rubric_ref: rubric/better_social_sharing_buttons_bssb_config_keys@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: bssb-default-networks
  input: Out of the box, which social networks does Better Social Sharing Buttons enable by default, and
    where in the admin UI do you change the enabled set?
  criteria: 'Enabled by default: Facebook, X, Email, LinkedIn (all other networks ship disabled). Change
    them on the settings form at /admin/config/services/better_social_sharing_buttons/config (route better_social_sharing_buttons.config),
    which needs the ''administer site configuration'' permission.'
  bundle: better_social_sharing_buttons
  rubric_ref: rubric/better_social_sharing_buttons_bssb_default_networks@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: bssb-known-width
  input: On this Drupal 11 site, inspect the live Better Social Sharing Buttons configuration and report
    the current icon size (width) and which icon set is selected.
  criteria: The live better_social_sharing_buttons.settings has width = 44px and iconset = social-icons--no-color
    (set by the setup script).
  bundle: better_social_sharing_buttons
  rubric_ref: rubric/better_social_sharing_buttons_bssb_known_width@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/better_social_sharing_buttons-known-width-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/better_social_sharing_buttons-known-width-cleanup.sh
