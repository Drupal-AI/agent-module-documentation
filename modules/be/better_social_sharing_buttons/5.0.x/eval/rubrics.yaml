rubrics:
- id: better_social_sharing_buttons_bssb_block_and_render
  version: '1.0'
  applicable_bundles:
  - better_social_sharing_buttons
  checks:
  - kind: must_contain_any
    values:
    - social_sharing_buttons_block
    - block
    - no external
    - no tracker
    - SVG sprite
  scoring:
    combine: all_pass
- id: better_social_sharing_buttons_bssb_config_keys
  version: '1.0'
  applicable_bundles:
  - better_social_sharing_buttons
  checks:
  - kind: must_contain_any
    values:
    - better_social_sharing_buttons.settings
    - width
    - iconset
  scoring:
    combine: all_pass
- id: better_social_sharing_buttons_bssb_default_networks
  version: '1.0'
  applicable_bundles:
  - better_social_sharing_buttons
  checks:
  - kind: must_contain_any
    values:
    - facebook
    - linkedin
    - /admin/config/services/better_social_sharing_buttons/config
    - better_social_sharing_buttons.config
  scoring:
    combine: all_pass
- id: better_social_sharing_buttons_bssb_known_width
  version: '1.0'
  applicable_bundles:
  - better_social_sharing_buttons
  checks:
  - kind: must_contain_any
    values:
    - 44px
    - social-icons--no-color
  scoring:
    combine: all_pass
- id: better_social_sharing_buttons_bssb_known_networks
  version: '1.0'
  applicable_bundles:
  - better_social_sharing_buttons
  checks:
  - kind: must_contain_any
    values:
    - bluesky
  scoring:
    combine: all_pass
- id: better_social_sharing_buttons_bssb_configure_networks_and_size
  version: '1.0'
  applicable_bundles:
  - better_social_sharing_buttons
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
- id: better_social_sharing_buttons_bssb_flat_circular_icons
  version: '1.0'
  applicable_bundles:
  - better_social_sharing_buttons
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
