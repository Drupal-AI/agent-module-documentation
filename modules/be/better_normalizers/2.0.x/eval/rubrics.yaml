rubrics:
- id: better_normalizers_better_normalizers_what
  version: '1.0'
  applicable_bundles:
  - better_normalizers
  checks:
  - kind: must_contain_any
    values:
    - hal
    - normalizer
    - file
    - menu link
  scoring:
    combine: all_pass
- id: better_normalizers_better_normalizers_file_data
  version: '1.0'
  applicable_bundles:
  - better_normalizers
  checks:
  - kind: must_contain_any
    values:
    - base64
    - data
    - contents
    - denormalize
  scoring:
    combine: all_pass
- id: better_normalizers_better_normalizers_menu_embed
  version: '1.0'
  applicable_bundles:
  - better_normalizers
  checks:
  - kind: must_contain_any
    values:
    - MenuLinkContentNormalizer
    - embed
    - target
    - parent
  scoring:
    combine: all_pass
- id: better_normalizers_better_normalizers_inspect_property
  version: '1.0'
  applicable_bundles:
  - better_normalizers
  checks:
  - kind: must_contain_any
    values:
    - data
    - base64
  scoring:
    combine: all_pass
- id: better_normalizers_better_normalizers_inspect_normalizer
  version: '1.0'
  applicable_bundles:
  - better_normalizers
  checks:
  - kind: must_contain_any
    values:
    - FileEntityNormalizer
    - base64
    - contents
  scoring:
    combine: all_pass
- id: better_normalizers_better_normalizers_serialize_file
  version: '1.0'
  applicable_bundles:
  - better_normalizers
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
- id: better_normalizers_better_normalizers_restore_file
  version: '1.0'
  applicable_bundles:
  - better_normalizers
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
