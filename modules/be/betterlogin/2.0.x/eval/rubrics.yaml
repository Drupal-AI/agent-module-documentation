rubrics:
- id: betterlogin_betterlogin_what_it_does
  version: '1.0'
  applicable_bundles:
  - betterlogin
  checks:
  - kind: must_contain_any
    values:
    - page--user--login
    - page__user__login
    - template
    - betterlogin/betterlogin_css
  scoring:
    combine: all_pass
- id: betterlogin_betterlogin_no_config
  version: '1.0'
  applicable_bundles:
  - betterlogin
  checks:
  - kind: must_contain_any
    values:
    - no config
    - no settings
    - no configuration
    - immediately
    - out of the box
    - configure
    - works on install
    - on enable
  scoring:
    combine: all_pass
- id: betterlogin_betterlogin_template_vars
  version: '1.0'
  applicable_bundles:
  - betterlogin
  checks:
  - kind: must_contain_any
    values:
    - register_url
    - site_name
    - logo
    - user.register
  scoring:
    combine: all_pass
- id: betterlogin_betterlogin_known_register_setting
  version: '1.0'
  applicable_bundles:
  - betterlogin
  checks:
  - kind: must_contain_any
    values:
    - admin_only
  scoring:
    combine: all_pass
- id: betterlogin_betterlogin_known_site_name
  version: '1.0'
  applicable_bundles:
  - betterlogin
  checks:
  - kind: must_contain_any
    values:
    - BetterloginQA Portal
  scoring:
    combine: all_pass
- id: betterlogin_betterlogin_show_register_link
  version: '1.0'
  applicable_bundles:
  - betterlogin
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
- id: betterlogin_betterlogin_hide_register_link
  version: '1.0'
  applicable_bundles:
  - betterlogin
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
