metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: better_exposed_filters
  version: 7.1.x
  note: 'BEF is a Views exposed-form plugin with no global admin page (configure is null) — it is configured
    per view display. Cases are all `recipe` (response-graded): they probe load-bearing BEF facts (the
    `bef` exposed form plugin, widget ids, plugin types/namespaces, where config is stored, alter hook)
    that an agent would otherwise read source to answer. No live-state assertions.'
questions:
- id: bef-enable-on-view
  input: On a Drupal 11 view I want to use Better Exposed Filters. There is no admin config page. How
    do I turn BEF on for a display? Name the setting to change.
  criteria: BEF has no global admin page; it is enabled per view display. In the display's Exposed form
    section set the Exposed form style to Better Exposed Filters (exposed form plugin id `bef`), then
    open its Settings.
  bundle: better_exposed_filters
  rubric_ref: rubric/better_exposed_filters_bef_enable_on_view@1.0
  tags:
  - mode:recipe
- id: bef-config-storage
  input: Where is a view's Better Exposed Filters configuration stored, and does `drush config:export`
    capture it? I want it to deploy with the view.
  criteria: Settings live inside the display's exposed_form.options.bef config (schema in config/schema/better_exposed_filters.*.schema.yml).
    It is part of the view, so it exports/deploys with the view — no separate config entity, and drush
    config:export captures it.
  bundle: better_exposed_filters
  rubric_ref: rubric/better_exposed_filters_bef_config_storage@1.0
  tags:
  - mode:recipe
- id: bef-checkbox-widget-id
  input: I have a taxonomy exposed filter rendered as a multi-select box in a Drupal view. Using Better
    Exposed Filters, which widget renders it as checkboxes, and what is that widget's plugin id?
  criteria: Choose the Checkboxes/Radio buttons widget, whose plugin id is `bef`, in the filter's BEF
    widget selector. (Related filter widgets include bef_links, bef_single, bef_hidden, bef_number, bef_sliders.)
  bundle: better_exposed_filters
  rubric_ref: rubric/better_exposed_filters_bef_checkbox_widget_id@1.0
  tags:
  - mode:recipe
- id: bef-slider-widget
  input: I want a range slider on a numeric price exposed filter in a Drupal view using Better Exposed
    Filters. What is the widget id, and which JS library does the slider rely on?
  criteria: Select the Sliders widget (plugin id `bef_sliders`); it uses the noUiSlider library (drupal/nouislider_js,
    attached via the better_exposed_filters/sliders library which depends on better_exposed_filters/nouislider).
  bundle: better_exposed_filters
  rubric_ref: rubric/better_exposed_filters_bef_slider_widget@1.0
  tags:
  - mode:recipe
- id: bef-plugin-types
  input: I want to add a custom Better Exposed Filters filter widget as a plugin in my Drupal module.
    What plugin namespace does the class go in, which attribute annotates it, and which base class should
    it extend?
  criteria: 'Put the class under namespace Drupal\<module>\Plugin\better_exposed_filters\filter, annotate
    it with the #[FiltersWidget] attribute (Drupal\better_exposed_filters\Attribute\FiltersWidget; legacy
    annotation @BetterExposedFiltersFilterWidget), and extend FilterWidgetBase. Then clear caches so it
    appears in the widget selector.'
  bundle: better_exposed_filters
  rubric_ref: rubric/better_exposed_filters_bef_plugin_types@1.0
  tags:
  - mode:recipe
- id: bef-three-plugin-types
  input: How many plugin types does Better Exposed Filters define for its widgets, and what are they?
    Name the manager service for the filter widgets.
  criteria: BEF defines three widget plugin types — filter, pager, and sort — each with its own BetterExposedFiltersWidgetManager.
    The filter manager service is plugin.manager.better_exposed_filters_filter_widget.
  bundle: better_exposed_filters
  rubric_ref: rubric/better_exposed_filters_bef_three_plugin_types@1.0
  tags:
  - mode:recipe
- id: bef-options-alter-hook
  input: In code on a Drupal 11 site I want to force a Better Exposed Filters slider's min/max regardless
    of the stored view config. Which hook do I implement?
  criteria: Implement hook_better_exposed_filters_options_alter(array &$options, ViewExecutable $view,
    DisplayPluginBase $displayHandler) and set the slider_options bef_slider_min / bef_slider_max on the
    relevant field key.
  bundle: better_exposed_filters
  rubric_ref: rubric/better_exposed_filters_bef_options_alter_hook@1.0
  tags:
  - mode:recipe
- id: bef-theme-template
  input: I want to override the markup Better Exposed Filters uses to render a checkbox exposed filter
    in my Drupal theme. What Twig template do I copy, and where are BEF's theme hooks registered?
  criteria: Copy bef-checkboxes.html.twig (theme hook bef_checkboxes) into your theme and clear caches.
    BEF's templates are registered via hook_theme in includes/better_exposed_filters.theme.inc, each with
    a template_preprocess_bef_*() function.
  bundle: better_exposed_filters
  rubric_ref: rubric/better_exposed_filters_bef_theme_template@1.0
  tags:
  - mode:recipe
