metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: better_messages
  version: 2.0.x
  note: 'Better Messages restyles Drupal status/warning/error messages as animated, positionable popups
    via one config object better_messages.settings. Admin form route better_messages.settings_form (/admin/config/user-interface/better-messages),
    permission ''configure better messages''. Settings keys: position (center/tl/tr/bl/br), vertical,
    horizontal, fixed, width, autoclose (seconds; 0=off), disable_autoclose, show_countdown, hover_autoclose,
    opendelay, popin/popout {effect,duration}, jquery_ui {draggable,resizable}, visibility (condition
    plugin config). It also ships a Condition plugin message_type and a context provider better_messages.context.
    No Drush, no field/entity. Medium/hard cases are grounded in the real config object; cleanup/reset
    restore the SHIPPED DEFAULTS explicitly (position center, autoclose 0, width 400px, draggable 1, resizable
    0, fade in/out slow) rather than stashing baseline in State.'
questions:
- id: better_messages-where-config
  input: Where do I configure the Better Messages module on a Drupal 11 site, which permission is needed,
    and which config object stores its settings?
  criteria: Configure it at /admin/config/user-interface/better-messages (route better_messages.settings_form),
    which requires the 'configure better messages' permission. All settings live in the better_messages.settings
    config object.
  bundle: better_messages
  rubric_ref: rubric/better_messages_better_messages_where_config@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: better_messages-autoclose
  input: With Better Messages, how do I make popup messages automatically disappear after a few seconds,
    and how do I show a countdown or keep them open while the user hovers?
  criteria: Set the 'autoclose' setting to the number of seconds (0 disables timed auto-close). show_countdown
    toggles the countdown timer and hover_autoclose keeps a message open while hovered. disable_autoclose
    can hard-disable auto-close.
  bundle: better_messages
  rubric_ref: rubric/better_messages_better_messages_autoclose@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: better_messages-position-draggable
  input: In Better Messages, how do I place the message box in a screen corner and let users drag or resize
    it? Name the relevant settings and any module dependencies.
  criteria: Use the 'position' setting (center/tl/tr/bl/br) with vertical/horizontal offsets, and enable
    jquery_ui.draggable / jquery_ui.resizable. Dragging/resizing rely on the jquery_ui_draggable and jquery_ui_resizable
    modules (dependencies).
  bundle: better_messages
  rubric_ref: rubric/better_messages_better_messages_position_draggable@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: better_messages-known-position
  input: On this Drupal site, Better Messages has been configured with a non-default screen position.
    Inspect the live better_messages.settings configuration and state where the message box is positioned.
  criteria: better_messages.settings.position is 'tr' (top right).
  bundle: better_messages
  rubric_ref: rubric/better_messages_better_messages_known_position@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/better_messages-known-settings-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/better_messages-known-settings-cleanup.sh
- id: better_messages-known-autoclose
  input: Better Messages on this site is set to auto-close popups after a fixed number of seconds. Inspect
    the live better_messages.settings configuration and report that auto-close time in seconds.
  criteria: better_messages.settings.autoclose is 7 (seconds).
  bundle: better_messages
  rubric_ref: rubric/better_messages_better_messages_known_autoclose@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/better_messages-known-settings-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/better_messages-known-settings-cleanup.sh
- id: better_messages-set-autoclose
  input: On this Drupal site, configure Better Messages so that popup messages automatically close after
    5 seconds. Apply the change to the live site.
  criteria: better_messages.settings.autoclose is set to 5 (e.g. drush cset better_messages.settings autoclose
    5, or via the settings form).
  bundle: better_messages
  rubric_ref: rubric/better_messages_better_messages_set_autoclose@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/better_messages-set-autoclose-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/better_messages-set-autoclose-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/better_messages-set-autoclose-verify.sh
- id: better_messages-set-position
  input: On this Drupal site, configure Better Messages so the message box appears in the top-right corner
    of the screen instead of the center. Apply the change to the live site.
  criteria: better_messages.settings.position is set to 'tr' (top right).
  bundle: better_messages
  rubric_ref: rubric/better_messages_better_messages_set_position@1.0
  tags:
  - mode:execution
