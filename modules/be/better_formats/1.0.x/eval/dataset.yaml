metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: better_formats
  version: 1.0.x
  note: 'Better Formats has one global config (better_formats.settings -> per_field_core, the ''Use field
    default'' toggle, shipped FALSE) and per-field third-party settings on FieldConfig entities (field.field.<entity>.<bundle>.<field>.third_party.better_formats:
    allowed_formats_toggle, allowed_formats, default_order_toggle, default_order_wrapper.formats). It
    also adds permissions: ''hide format tips'', ''hide more format tips link'', and dynamic ''hide format
    selection for <entity_type>''. Medium cases read back per_field_core and a field''s allowed_formats.
    Hard cases toggle per_field_core on, and restrict a namespaced Article long-text field (field_bf_task)
    to only basic_html. Fields created/removed are namespaced (field_bf_med / field_bf_task); the site
    has basic_html/full_html/restricted_html/plain_text formats.'
questions:
- id: better_formats-global-setting
  input: What does the Better Formats module's global settings page control, where is it, and what is
    the config key?
  criteria: Its settings page is at /admin/config/content/formats/settings (route better_formats.settings,
    permission 'administer filters'). The only key is per_field_core ('Use field default') in config better_formats.settings;
    when on, you can set a field's default text format via its Default Value form even with no value entered.
  bundle: better_formats
  rubric_ref: rubric/better_formats_better_formats_global_setting@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: better_formats-allowed-formats
  input: With Better Formats, how do I restrict which text formats are available on one specific text
    field, and where is that stored?
  criteria: 'On the field''s config edit form, use the ''Text Formats'' fieldset: tick ''Limit allowed
    text formats'' and check the ones to allow. It is stored as third-party settings on the FieldConfig:
    field.field.<entity>.<bundle>.<field>.third_party.better_formats.allowed_formats_toggle and .allowed_formats.'
  bundle: better_formats
  rubric_ref: rubric/better_formats_better_formats_allowed_formats@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: better_formats-permissions
  input: What permissions does the Better Formats module add for controlling the text-format UI?
  criteria: It adds 'hide format tips', 'hide more format tips link', and a dynamic 'hide format selection
    for <entity_type>' permission per fieldable entity type (e.g. hide format selection for node). Users
    with 'administer filters' are exempt.
  bundle: better_formats
  rubric_ref: rubric/better_formats_better_formats_permissions@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: better_formats-global-configured
  input: Is the Better Formats global 'Use field default' option currently enabled on this site? Inspect
    the live configuration and answer.
  criteria: Yes — better_formats.settings per_field_core is TRUE, so the 'Use field default' behaviour
    is enabled.
  bundle: better_formats
  rubric_ref: rubric/better_formats_better_formats_global_configured@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/better_formats-global-setting-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/better_formats-global-setting-cleanup.sh
- id: better_formats-field-allowed
  input: On the Article content type there is a long-text field 'field_bf_med' whose Better Formats settings
    limit which text formats can be used. Inspect the live field configuration and state which text format(s)
    are allowed on it.
  criteria: 'Only basic_html is allowed: field_bf_med''s third_party.better_formats has allowed_formats_toggle=true
    and allowed_formats containing only basic_html.'
  bundle: better_formats
  rubric_ref: rubric/better_formats_better_formats_field_allowed@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/better_formats-field-allowed-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/better_formats-field-allowed-cleanup.sh
- id: better_formats-enable-global
  input: Using the Better Formats module, enable the global 'Use field default' option so field-level
    default text formats can be set from the Default Value form. Apply the change to the live site.
  criteria: Set per_field_core to TRUE in config better_formats.settings (e.g. via the settings form at
    /admin/config/content/formats/settings or drush config-set).
  bundle: better_formats
  rubric_ref: rubric/better_formats_better_formats_enable_global@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/better_formats-global-setting-cleanup.sh
    cleanup: agent-module-documentation/evaluation/verify/better_formats-global-setting-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/better_formats-global-verify.sh
    unused_text_checks:
      must_contain_any: []
      must_not_contain: []
- id: better_formats-restrict-field
  input: The Article type has a text field called field_bf_task. I only want editors to be able to use
    the 'Basic HTML' format in that field and nothing else. Use the Better Formats module to lock it down
    to just Basic HTML, and apply it to the site.
  criteria: 'On FieldConfig node.article.field_bf_task set third_party.better_formats.allowed_formats_toggle=true
    and allowed_formats to only basic_html (e.g. {basic_html: basic_html}), so basic_html is the sole
    allowed format.'
  bundle: better_formats
  rubric_ref: rubric/better_formats_better_formats_restrict_field@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-layman
    reset: agent-module-documentation/evaluation/verify/better_formats-field-task-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/better_formats-field-task-reset.sh
    verify: agent-module-documentation/evaluation/verify/better_formats-field-task-verify.sh
    unused_text_checks:
      must_contain_any: []
      must_not_contain: []
