rubrics:
- id: better_formats_better_formats_global_setting
  version: '1.0'
  applicable_bundles:
  - better_formats
  checks:
  - kind: must_contain_any
    values:
    - per_field_core
    - /admin/config/content/formats/settings
    - Use field default
  scoring:
    combine: all_pass
- id: better_formats_better_formats_allowed_formats
  version: '1.0'
  applicable_bundles:
  - better_formats
  checks:
  - kind: must_contain_any
    values:
    - allowed_formats
    - third party
    - third_party
    - field config
  scoring:
    combine: all_pass
- id: better_formats_better_formats_permissions
  version: '1.0'
  applicable_bundles:
  - better_formats
  checks:
  - kind: must_contain_any
    values:
    - hide format tips
    - hide more format tips link
    - hide format selection
  scoring:
    combine: all_pass
- id: better_formats_better_formats_global_configured
  version: '1.0'
  applicable_bundles:
  - better_formats
  checks:
  - kind: must_contain_any
    values:
    - 'true'
    - enabled
    - 'on'
    - 'yes'
  scoring:
    combine: all_pass
- id: better_formats_better_formats_field_allowed
  version: '1.0'
  applicable_bundles:
  - better_formats
  checks:
  - kind: must_contain_any
    values:
    - basic_html
  scoring:
    combine: all_pass
- id: better_formats_better_formats_enable_global
  version: '1.0'
  applicable_bundles:
  - better_formats
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
- id: better_formats_better_formats_restrict_field
  version: '1.0'
  applicable_bundles:
  - better_formats
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
