rubrics:
- id: updated_updated_how_to_show
  version: '1.0'
  applicable_bundles:
  - updated
  checks:
  - kind: must_contain_any
    values:
    - updated_date_block
    - Last Updated date block
    - block
    - display_updated
  scoring:
    combine: all_pass
- id: updated_updated_block_settings
  version: '1.0'
  applicable_bundles:
  - updated
  checks:
  - kind: must_contain_any
    values:
    - date_prefix
    - date_format
    - custom_date_format
    - timezone
    - prefix
    - format
  scoring:
    combine: all_pass
- id: updated_updated_permission
  version: '1.0'
  applicable_bundles:
  - updated
  checks:
  - kind: must_contain_any
    values:
    - administer node last updated date
    - Configure the display of the node last updated date
  scoring:
    combine: all_pass
- id: updated_updated_block_prefix
  version: '1.0'
  applicable_bundles:
  - updated
  checks:
  - kind: must_contain_any
    values:
    - Revised on
  scoring:
    combine: all_pass
- id: updated_updated_ct_default
  version: '1.0'
  applicable_bundles:
  - updated
  checks:
  - kind: must_contain_any
    values:
    - 'yes'
    - 'true'
    - default
    - display_updated
  scoring:
    combine: all_pass
- id: updated_updated_place_block
  version: '1.0'
  applicable_bundles:
  - updated
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
- id: updated_updated_ct_default_on
  version: '1.0'
  applicable_bundles:
  - updated
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
