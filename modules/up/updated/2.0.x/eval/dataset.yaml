metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: updated
  version: 2.0.x
  note: Last Updated shows a node's 'changed' date via the block plugin updated_date_block (context node;
    settings date_prefix, date_format, custom_date_format, timezone; schema block.settings.updated_date_block).
    Visibility per node is gated by a boolean base field display_updated (added to every node type, default
    FALSE); blockAccess forbids when it is FALSE. A per-content-type default is stored as a BaseFieldOverride
    (core.base_field_override.node.<bundle>.display_updated). Permission 'administer node last updated
    date' gates toggling. No configure route. Medium cases seed a placed block with a known prefix / set
    the Article default to TRUE and the agent reads them back; hard cases place the block (verify FAILS
    on empty) and turn on the Article content-type default (verify creates a dummy Article and checks
    display_updated). Artifacts namespaced updated_* / the module's own display_updated field on the shared
    'article' type (restored to FALSE).
questions:
- id: updated-how-to-show
  input: Using the 'updated' (Last Updated) Drupal module, how do I display a node's last-updated date
    on the page, and what controls whether it shows for a given node?
  criteria: Place the 'Last Updated date block' (plugin updated_date_block) in a region via Block layout.
    Whether it shows on a node is controlled by the per-node 'Display updated date' checkbox (the display_updated
    boolean base field); the block's access is forbidden when display_updated is FALSE.
  bundle: updated
  rubric_ref: rubric/updated_updated_how_to_show@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: updated-block-settings
  input: What display options does the 'Last Updated date block' from the updated module provide for the
    date it prints?
  criteria: 'Settings (block.settings.updated_date_block): date_prefix (text before the date), date_format
    (a core date-format machine name or ''custom''), custom_date_format (PHP format used when date_format=custom),
    and timezone (empty = site/user timezone).'
  bundle: updated
  rubric_ref: rubric/updated_updated_block_settings@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: updated-permission
  input: Which permission does the 'updated' (Last Updated) module define, and what does it control?
  criteria: The permission 'administer node last updated date' (label 'Configure the display of the node
    last updated date'). Without it, the 'Display updated date' checkbox is disabled on both the node
    form and the content-type form; it only governs this module's block, not other ways of showing the
    changed date.
  bundle: updated
  rubric_ref: rubric/updated_updated_permission@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: updated-block-prefix
  input: This site has the 'Last Updated date block' placed. Inspect its live configuration and report
    the date prefix text it is configured to show before the updated date.
  criteria: The block (plugin updated_date_block, config block.block.updated_med) has settings.date_prefix
    = 'Revised on'.
  bundle: updated
  rubric_ref: rubric/updated_updated_block_prefix@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/updated-block-prefix-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/updated-block-prefix-cleanup.sh
- id: updated-ct-default
  input: On this site, do newly created Article nodes default to displaying their last-updated date (the
    'updated' module setting)? Inspect the live configuration to answer.
  criteria: Yes. The Article content type's display_updated default is TRUE (core.base_field_override.node.article.display_updated
    default_value [{value:1}]), so new Articles default to showing the updated date (still overridable
    per node).
  bundle: updated
  rubric_ref: rubric/updated_updated_ct_default@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/updated-ct-default-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/updated-ct-default-cleanup.sh
- id: updated-place-block
  input: Using the 'updated' (Last Updated) module, place its 'Last Updated date block' (plugin updated_date_block)
    into the main content region of the site's default theme, and apply the change to the live site.
  criteria: Create a block placement (block.block.<id>) with plugin updated_date_block, region content,
    in the default theme, enabled. e.g. Block::create(['id'=>'updated_task','theme'=><default>,'plugin'=>'updated_date_block','region'=>'content','settings'=>[...],'visibility'=>[]])->save().
  bundle: updated
