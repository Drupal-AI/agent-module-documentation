- id: updated-ct-default-on
  input: Using the 'updated' (Last Updated) module, make new Article nodes default to displaying their
    last-updated date (turn the content-type default on for Article). Apply the change to the live site.
  criteria: Set the Article display_updated default to TRUE (the content type's 'Display updated date.'
