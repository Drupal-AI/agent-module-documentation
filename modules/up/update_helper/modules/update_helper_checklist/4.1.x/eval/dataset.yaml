metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: update_helper_checklist
  version: 4.1.x
  note: 'update_helper_checklist is a submodule of update_helper that integrates with checklistapi. It
    registers a checklist ''update_helper_checklist'' at /admin/config/development/update-helper (state
    storage) whose items come from scanning every enabled module dir for a file named updates_checklist.yml.
    Per-hook status is stored in the content entity update_helper_checklist_update. The service update_helper_checklist.update_checklist
    (Drupal\update_helper_checklist\UpdateChecklist) exposes markAllUpdates/markUpdatesSuccessful/markUpdatesFailed/getUpdateVersions.
    It auto-marks items via the update_helper.configuration.update event and extends ''drush generate
    configuration-update'' via COMMAND_GCU_* events; a ''Pending updates'' toolbar item shows while the
    checklist is <100% (permission: view update_helper_checklist checklistapi checklist). It has NO config
    of its own, so medium cases introspect the live container (service class + entity type), verified
    with drush php:eval. Hard cases have the agent write correct code/YAML into deletable scratch files
    under web/sites/default/ (update_helper_checklist_file.eval.yml, update_helper_checklist_mark.eval.php)
    which verify greps and reset deletes -- no cache rebuild (this shared site''s ''drush cr'' fatals
    in an unrelated canvas/ui_patterns collision). Facts grounded in update_helper_checklist.module, .install,
    src/UpdateChecklist.php, src/Entity/Update.php and update_helper_checklist.services.yml.'
questions:
- id: update_helper_checklist-where
  input: With the Drupal update_helper_checklist module, where do the checklist items come from, and at
    what admin path is the checklist shown?
  criteria: Items are gathered by scanning every enabled module's directory for a file named updates_checklist.yml.
    The checklist is shown at /admin/config/development/update-helper (checklist id update_helper_checklist,
    state storage).
  bundle: update_helper_checklist
  rubric_ref: rubric/update_helper_checklist_update_helper_checklist_where@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: update_helper_checklist-mark-service
  input: In code, how do I mark a module's configuration updates as complete using update_helper_checklist?
    Which service and method?
  criteria: Use the update_helper_checklist.update_checklist service (Drupal\update_helper_checklist\UpdateChecklist).
    Call markUpdatesSuccessful(['mymodule' => ['mymodule_update_9001']]) (or markUpdatesFailed(), or markAllUpdates()
    to mark everything).
  bundle: update_helper_checklist
  rubric_ref: rubric/update_helper_checklist_update_helper_checklist_mark_service@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: update_helper_checklist-yaml-format
  input: What does an updates_checklist.yml file for the Drupal update_helper_checklist module look like?
    How are versions and individual update hooks represented?
  criteria: It is YAML grouped by version key (e.g. v2.1.0) with a '#title' and '#description', and under
    each version one entry per update-hook name (e.g. mymodule_update_9001) with '#title', '#description',
    and optional '#description_successful' / '#description_failed'.
  bundle: update_helper_checklist
  rubric_ref: rubric/update_helper_checklist_update_helper_checklist_yaml_format@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: update_helper_checklist-service-class
  input: On this running Drupal site, update_helper_checklist is enabled. Which service marks configuration
    updates complete for its checklist, and what class does it resolve to? Inspect the live container.
  criteria: 'Service id update_helper_checklist.update_checklist, class Drupal\update_helper_checklist\UpdateChecklist.
    Discoverable with: drush php:eval "echo get_class(\Drupal::service(''update_helper_checklist.update_checklist''));".'
  bundle: update_helper_checklist
  rubric_ref: rubric/update_helper_checklist_update_helper_checklist_service_class@1.0
