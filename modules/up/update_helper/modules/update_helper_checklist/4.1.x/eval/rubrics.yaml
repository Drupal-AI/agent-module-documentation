rubrics:
- id: update_helper_checklist_update_helper_checklist_where
  version: '1.0'
  applicable_bundles:
  - update_helper_checklist
  checks:
  - kind: must_contain_any
    values:
    - updates_checklist.yml
    - /admin/config/development/update-helper
    - update-helper
  scoring:
    combine: all_pass
- id: update_helper_checklist_update_helper_checklist_mark_service
  version: '1.0'
  applicable_bundles:
  - update_helper_checklist
  checks:
  - kind: must_contain_any
    values:
    - update_helper_checklist.update_checklist
    - markUpdatesSuccessful
    - markAllUpdates
    - UpdateChecklist
  scoring:
    combine: all_pass
- id: update_helper_checklist_update_helper_checklist_yaml_format
  version: '1.0'
  applicable_bundles:
  - update_helper_checklist
  checks:
  - kind: must_contain_any
    values:
    - '#title'
    - '#description'
    - updates_checklist.yml
    - update_8001
    - version
  scoring:
    combine: all_pass
- id: update_helper_checklist_update_helper_checklist_service_class
  version: '1.0'
  applicable_bundles:
  - update_helper_checklist
  checks:
  - kind: must_contain_any
    values:
    - update_helper_checklist.update_checklist
    - UpdateChecklist
  scoring:
    combine: all_pass
- id: update_helper_checklist_update_helper_checklist_entity_type
  version: '1.0'
  applicable_bundles:
  - update_helper_checklist
  checks:
  - kind: must_contain_any
    values:
    - update_helper_checklist_update
  scoring:
    combine: all_pass
- id: update_helper_checklist_update_helper_checklist_write_yaml
  version: '1.0'
  applicable_bundles:
  - update_helper_checklist
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
- id: update_helper_checklist_update_helper_checklist_write_mark
  version: '1.0'
  applicable_bundles:
  - update_helper_checklist
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
