rubrics:
- id: update_helper_update_helper_apply_cud
  version: '1.0'
  applicable_bundles:
  - update_helper
  checks:
  - kind: must_contain_any
    values:
    - update_helper.updater
    - executeUpdate
    - logger()->output()
    - Updater
  scoring:
    combine: all_pass
- id: update_helper_update_helper_generate_command
  version: '1.0'
  applicable_bundles:
  - update_helper
  checks:
  - kind: must_contain_any
    values:
    - drush generate
    - configuration-update
    - update_helper:configuration-update
    - config-update
    - config/update
  scoring:
    combine: all_pass
- id: update_helper_update_helper_cud_format
  version: '1.0'
  applicable_bundles:
  - update_helper
  checks:
  - kind: must_contain_any
    values:
    - expected_config
    - update_actions
    - __global_actions
    - expected
  scoring:
    combine: all_pass
- id: update_helper_update_helper_updater_service_class
  version: '1.0'
  applicable_bundles:
  - update_helper
  checks:
  - kind: must_contain_any
    values:
    - update_helper.updater
    - Drupal\update_helper\Updater
    - Updater
  scoring:
    combine: all_pass
- id: update_helper_update_helper_differ_service_class
  version: '1.0'
  applicable_bundles:
  - update_helper
  checks:
  - kind: must_contain_any
    values:
    - update_helper.config_differ
    - ReversibleConfigDiffer
  scoring:
    combine: all_pass
- id: update_helper_update_helper_write_update_hook
  version: '1.0'
  applicable_bundles:
  - update_helper
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
- id: update_helper_update_helper_write_cud
  version: '1.0'
  applicable_bundles:
  - update_helper
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
