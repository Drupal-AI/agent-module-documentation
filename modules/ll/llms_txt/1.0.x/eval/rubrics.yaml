rubrics:
- id: llms_txt_llms_url
  version: '1.0'
  applicable_bundles:
  - llms_txt
  checks:
  - kind: must_contain_any
    values:
    - /llms.txt
    - llms.txt
    - text/markdown
    - LLM
    - AI
  scoring:
    combine: all_pass
- id: llms_txt_llms_body
  version: '1.0'
  applicable_bundles:
  - llms_txt
  checks:
  - kind: must_contain_any
    values:
    - llms_txt.settings
    - content
    - /admin/content/llms-txt
    - configuration
  scoring:
    combine: all_pass
- id: llms_txt_llms_menu_token
  version: '1.0'
  applicable_bundles:
  - llms_txt
  checks:
  - kind: must_contain_any
    values:
    - llms_txt_markdown_menu
  scoring:
    combine: all_pass
- id: llms_txt_llms_known_body
  version: '1.0'
  applicable_bundles:
  - llms_txt
  checks:
  - kind: must_contain_any
    values:
    - LLMS_TXT_EVAL_MARKER
  scoring:
    combine: all_pass
- id: llms_txt_llms_known_section
  version: '1.0'
  applicable_bundles:
  - llms_txt
  checks:
  - kind: must_contain_any
    values:
    - LLMS Eval Docs
  scoring:
    combine: all_pass
- id: llms_txt_llms_create_section
  version: '1.0'
  applicable_bundles:
  - llms_txt
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
- id: llms_txt_llms_set_body
  version: '1.0'
  applicable_bundles:
  - llms_txt
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
