rubrics:
- id: ldap_ldap_is_meta
  version: '1.0'
  applicable_bundles:
  - ldap
  checks:
  - kind: must_contain_any
    values:
    - meta
    - ldap_servers
  scoring:
    combine: all_pass
- id: ldap_ldap_submodule_roles
  version: '1.0'
  applicable_bundles:
  - ldap
  checks:
  - kind: must_contain_any
    values:
    - ldap_authentication
    - ldap_authorization
  scoring:
    combine: all_pass
- id: ldap_ldap_external_libs
  version: '1.0'
  applicable_bundles:
  - ldap
  checks:
  - kind: must_contain_any
    values:
    - symfony/ldap
  scoring:
    combine: all_pass
- id: ldap_ldap_admin_permission
  version: '1.0'
  applicable_bundles:
  - ldap
  checks:
  - kind: must_contain_any
    values:
    - administer ldap
    - /admin/config/people/ldap
  scoring:
    combine: all_pass
- id: ldap_ldap_provisioning_submodule
  version: '1.0'
  applicable_bundles:
  - ldap
  checks:
  - kind: must_contain_any
    values:
    - ldap_user
    - ldap_query
  scoring:
    combine: all_pass
