metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: ldap_authentication
  version: 4.12.x
  part_of: ldap
  note: Probes the authentication settings object, the mixed/exclusive mode, DN allow/exclude rules, the
    allowuser hook and the login validator service. Recipe (response-graded); no site mutation.
questions:
- id: ldap-auth-mode
  input: Which config key on ldap_authentication.settings decides whether both LDAP and local Drupal accounts
    can log in versus LDAP-only, and what is its default value?
  criteria: The authenticationMode key on ldap_authentication.settings; default 'mixed' allows both LDAP
    and local accounts (the other value makes login exclusive/LDAP-only).
  bundle: ldap_authentication
  rubric_ref: rubric/ldap_authentication_ldap_auth_mode@1.0
  tags:
  - mode:recipe
- id: ldap-auth-dn-rules
  input: In ldap_authentication, which two settings whitelist and blacklist users based on text contained
    in their DN?
  criteria: allowOnlyIfTextInDn (whitelist) and excludeIfTextInDn (blacklist) on ldap_authentication.settings.
  bundle: ldap_authentication
  rubric_ref: rubric/ldap_authentication_ldap_auth_dn_rules@1.0
  tags:
  - mode:recipe
- id: ldap-auth-deny-hook
  input: I want a custom Drupal module to deny an LDAP login after examining the user's LDAP entry. Which
    hook do I implement?
  criteria: Implement hook_ldap_authentication_allowuser_results_alter(Entry $ldap_user, string $name,
    bool &$hook_result) and set $hook_result to FALSE to deny.
  bundle: ldap_authentication
  rubric_ref: rubric/ldap_authentication_ldap_auth_deny_hook@1.0
  tags:
  - mode:recipe
- id: ldap-auth-configure-route
  input: What is the route name and path of the LDAP Authentication settings form on Drupal 11?
  criteria: Route ldap_authentication.admin_form at /admin/config/people/ldap/authentication (permission
    'administer ldap').
  bundle: ldap_authentication
  rubric_ref: rubric/ldap_authentication_ldap_auth_configure_route@1.0
  tags:
  - mode:recipe
- id: ldap-auth-validator-service
  input: Which service validates submitted credentials against LDAP during the standard Drupal login,
    in the ldap_authentication module?
  criteria: The ldap_authentication.login_validator service (class LoginValidatorLoginForm); LoginValidatorSso
    handles SSO.
  bundle: ldap_authentication
  rubric_ref: rubric/ldap_authentication_ldap_auth_validator_service@1.0
  tags:
  - mode:recipe
- id: ldap-auth-skip-admins
  input: Which ldap_authentication setting keeps administrator accounts authenticating locally to avoid
    lockout, and what is its default?
  criteria: The skipAdministrators key (default true) on ldap_authentication.settings lets admin accounts
    bypass LDAP authentication.
  bundle: ldap_authentication
  rubric_ref: rubric/ldap_authentication_ldap_auth_skip_admins@1.0
  tags:
  - mode:recipe
