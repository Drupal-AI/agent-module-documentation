rubrics:
- id: ldap_servers_ldap_servers_entity_type
  version: '1.0'
  applicable_bundles:
  - ldap_servers
  checks:
  - kind: must_contain_any
    values:
    - ldap_server
    - Drupal\ldap_servers\Entity\Server
  scoring:
    combine: all_pass
- id: ldap_servers_ldap_servers_bind_service
  version: '1.0'
  applicable_bundles:
  - ldap_servers
  checks:
  - kind: must_contain_any
    values:
    - ldap.bridge
    - setServerById
    - LdapBridge
  scoring:
    combine: all_pass
- id: ldap_servers_ldap_servers_group_memberships
  version: '1.0'
  applicable_bundles:
  - ldap_servers
  checks:
  - kind: must_contain_any
    values:
    - ldap.group_manager
    - groupMembershipsFromUser
    - LdapGroupManager
  scoring:
    combine: all_pass
- id: ldap_servers_ldap_servers_puid
  version: '1.0'
  applicable_bundles:
  - ldap_servers
  checks:
  - kind: must_contain_any
    values:
    - getUserAccountFromPuid
    - ldap.user_manager
  scoring:
    combine: all_pass
- id: ldap_servers_ldap_servers_configure_route
  version: '1.0'
  applicable_bundles:
  - ldap_servers
  checks:
  - kind: must_contain_any
    values:
    - entity.ldap_server.collection
    - /admin/config/people/ldap/server
  scoring:
    combine: all_pass
- id: ldap_servers_ldap_servers_detailed_logging
  version: '1.0'
  applicable_bundles:
  - ldap_servers
  checks:
  - kind: must_contain_any
    values:
    - watchdog_detail
    - ldap_servers.settings
  scoring:
    combine: all_pass
