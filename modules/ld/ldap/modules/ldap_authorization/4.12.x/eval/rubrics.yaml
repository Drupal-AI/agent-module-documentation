rubrics:
- id: ldap_authorization_ldap_authz_plugin
  version: '1.0'
  applicable_bundles:
  - ldap_authorization
  checks:
  - kind: must_contain_any
    values:
    - ldap_provider
    - LDAPAuthorizationProvider
    - AuthorizationProvider
  scoring:
    combine: all_pass
- id: ldap_authorization_ldap_authz_no_route
  version: '1.0'
  applicable_bundles:
  - ldap_authorization
  checks:
  - kind: must_contain_any
    values:
    - authorization
    - 'no'
    - profile
  scoring:
    combine: all_pass
- id: ldap_authorization_ldap_authz_regex
  version: '1.0'
  applicable_bundles:
  - ldap_authorization
  checks:
  - kind: must_contain_any
    values:
    - query
    - is_regex
  scoring:
    combine: all_pass
- id: ldap_authorization_ldap_authz_revocation
  version: '1.0'
  applicable_bundles:
  - ldap_authorization
  checks:
  - kind: must_contain_any
    values:
    - revocationSupported
    - syncOnLogonSupported
    - revocation
  scoring:
    combine: all_pass
- id: ldap_authorization_ldap_authz_server_setting
  version: '1.0'
  applicable_bundles:
  - ldap_authorization
  checks:
  - kind: must_contain_any
    values:
    - server
    - only_ldap_authenticated
  scoring:
    combine: all_pass
- id: ldap_authorization_ldap_authz_dependencies
  version: '1.0'
  applicable_bundles:
  - ldap_authorization
  checks:
  - kind: must_contain_any
    values:
    - authorization
    - ldap_servers
    - ldap_user
  scoring:
    combine: all_pass
