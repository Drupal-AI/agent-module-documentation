metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: ldap_authorization
  version: 4.12.x
  part_of: ldap
  note: Probes the Authorization provider plugin, its lack of its own admin route, mapping/regex config
    and revocation/sync-on-logon behaviour. Recipe (response-graded); no site mutation.
questions:
- id: ldap-authz-plugin
  input: On a Drupal 11 site, how does ldap_authorization integrate with the Authorization module, and
    what is the provider plugin id and class?
  criteria: It registers an @AuthorizationProvider plugin id 'ldap_provider' (class LDAPAuthorizationProvider)
    that the Authorization module uses to grant consumers such as Drupal roles from LDAP groups.
  bundle: ldap_authorization
  rubric_ref: rubric/ldap_authorization_ldap_authz_plugin@1.0
  tags:
  - mode:recipe
- id: ldap-authz-no-route
  input: Where do I configure LDAP-group-to-Drupal-role mapping — does ldap_authorization have its own
    settings page?
  criteria: ldap_authorization has no admin route of its own; you configure it inside an Authorization
    module profile, pairing the ldap_provider provider with a consumer (e.g. Drupal roles).
  bundle: ldap_authorization
  rubric_ref: rubric/ldap_authorization_ldap_authz_no_route@1.0
  tags:
  - mode:recipe
- id: ldap-authz-regex
  input: In an ldap_authorization mapping, which two config keys hold the LDAP group to match and the
    flag that treats it as a regular expression?
  criteria: The 'query' key (the LDAP group DN/value) and the 'is_regex' boolean, in authorization.provider_mappings.plugin.ldap_provider.
  bundle: ldap_authorization
  rubric_ref: rubric/ldap_authorization_ldap_authz_regex@1.0
  tags:
  - mode:recipe
- id: ldap-authz-revocation
  input: Does the LDAP authorization provider support removing Drupal roles when a user leaves an LDAP
    group, and re-checking on login?
  criteria: Yes; the plugin declares revocationSupported = TRUE (roles revoked when the group is lost)
    and syncOnLogonSupported = TRUE (re-evaluated on each login).
  bundle: ldap_authorization
  rubric_ref: rubric/ldap_authorization_ldap_authz_revocation@1.0
  tags:
  - mode:recipe
- id: ldap-authz-server-setting
  input: Which provider setting selects the LDAP server used to read group membership, and which one restricts
    mapping to LDAP-authenticated users only?
  criteria: status.server picks the ldap_server to read groups from; status.only_ldap_authenticated restricts
    the mapping to users authenticated via LDAP.
  bundle: ldap_authorization
  rubric_ref: rubric/ldap_authorization_ldap_authz_server_setting@1.0
  tags:
  - mode:recipe
- id: ldap-authz-dependencies
  input: Which modules must be enabled for ldap_authorization to work on Drupal 11?
  criteria: It depends on ldap_servers, ldap_user and the authorization module (plus, transitively, symfony/ldap
    and externalauth).
  bundle: ldap_authorization
  rubric_ref: rubric/ldap_authorization_ldap_authz_dependencies@1.0
  tags:
  - mode:recipe
