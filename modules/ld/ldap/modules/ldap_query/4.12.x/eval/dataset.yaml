metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: ldap_query
  version: 4.12.x
  part_of: ldap
  note: Probes the ldap_query_entity config entity, its fields, the ldap.query service and Views integration.
    Recipe (response-graded); no site mutation.
questions:
- id: ldap-query-entity-type
  input: On a Drupal 11 site with the LDAP suite, what config entity type stores a reusable LDAP search,
    and what class defines it?
  criteria: The 'ldap_query_entity' config entity, defined by Drupal\ldap_query\Entity\QueryEntity.
  bundle: ldap_query
  rubric_ref: rubric/ldap_query_ldap_query_entity_type@1.0
  tags:
  - mode:recipe
- id: ldap-query-service
  input: Which service runs a stored LDAP query in code, and which methods load a query, execute it, and
    return the entries?
  criteria: 'The ldap.query service (QueryController): load($id), execute() (optionally with an override
    filter), then getRawResults() returns Symfony Entry[].'
  bundle: ldap_query
  rubric_ref: rubric/ldap_query_ldap_query_service@1.0
  tags:
  - mode:recipe
- id: ldap-query-fields
  input: Which stored fields on an ldap_query_entity define what and where it searches (the server, base
    DN, filter and returned attributes)?
  criteria: server_id, base_dn, filter and attributes (plus scope, size_limit, time_limit, dereference).
  bundle: ldap_query
  rubric_ref: rubric/ldap_query_ldap_query_fields@1.0
  tags:
  - mode:recipe
- id: ldap-query-views
  input: Can I surface the results of an LDAP query in a Drupal View, and what does ldap_query provide
    for that?
  criteria: Yes; ldap_query ships a custom Views query backend (LdapQuery) plus field, filter, sort and
    argument handlers so LDAP entries can be listed in a View.
  bundle: ldap_query
  rubric_ref: rubric/ldap_query_ldap_query_views@1.0
  tags:
  - mode:recipe
- id: ldap-query-configure-route
  input: What route and path list the configured LDAP queries on Drupal 11?
  criteria: Route entity.ldap_query_entity.collection at /admin/config/people/ldap/query (permission 'administer
    ldap').
  bundle: ldap_query
  rubric_ref: rubric/ldap_query_ldap_query_configure_route@1.0
  tags:
  - mode:recipe
- id: ldap-query-override-filter
  input: How do I run a stored LDAP query but with a different filter than the one saved on the entity,
    using the ldap.query service?
  criteria: Pass the filter string to QueryController::execute($filter); this overrides the stored filter
    (as the Views backend does for exposed filters).
  bundle: ldap_query
  rubric_ref: rubric/ldap_query_ldap_query_override_filter@1.0
  tags:
  - mode:recipe
