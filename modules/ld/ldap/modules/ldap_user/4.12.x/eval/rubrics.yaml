rubrics:
- id: ldap_user_ldap_user_processor_service
  version: '1.0'
  applicable_bundles:
  - ldap_user
  checks:
  - kind: must_contain_any
    values:
    - ldap.drupal_user_processor
    - ldapAssociateDrupalAccount
    - DrupalUserProcessor
  scoring:
    combine: all_pass
- id: ldap_user_ldap_user_triggers
  version: '1.0'
  applicable_bundles:
  - ldap_user
  checks:
  - kind: must_contain_any
    values:
    - drupalAcctProvisionTriggers
    - ldapEntryProvisionTriggers
  scoring:
    combine: all_pass
- id: ldap_user_ldap_user_orphans
  version: '1.0'
  applicable_bundles:
  - ldap_user
  checks:
  - kind: must_contain_any
    values:
    - ldap.orphan_processor
    - orphanedDrupalAcctBehavior
    - OrphanProcessor
  scoring:
    combine: all_pass
- id: ldap_user_ldap_user_mapping_hook
  version: '1.0'
  applicable_bundles:
  - ldap_user
  checks:
  - kind: must_contain_any
    values:
    - hook_ldap_user_attributes_alter
    - ldap_user_attributes_alter
  scoring:
    combine: all_pass
- id: ldap_user_ldap_user_edit_hook
  version: '1.0'
  applicable_bundles:
  - ldap_user
  checks:
  - kind: must_contain_any
    values:
    - hook_ldap_user_edit_user_alter
    - ldap_user_edit_user_alter
  scoring:
    combine: all_pass
- id: ldap_user_ldap_user_events
  version: '1.0'
  applicable_bundles:
  - ldap_user
  checks:
  - kind: must_contain_any
    values:
    - LdapNewUserCreatedEvent
    - LdapUserLoginEvent
    - LdapUserUpdatedEvent
    - LdapUserDeletedEvent
  scoring:
    combine: all_pass
