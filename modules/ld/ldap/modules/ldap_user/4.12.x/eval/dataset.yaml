metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: ldap_user
  version: 4.12.x
  part_of: ldap
  note: Probes the provisioning settings, the DrupalUserProcessor service, orphan handling, the mapping
    hooks and the lifecycle events. Recipe (response-graded); no site mutation.
questions:
- id: ldap-user-processor-service
  input: On a Drupal 11 site with the LDAP suite, which service creates/associates a Drupal user account
    from LDAP data, and which method links an existing Drupal account to its LDAP identity?
  criteria: The ldap.drupal_user_processor service (DrupalUserProcessor); ldapAssociateDrupalAccount()
    links an existing account, createDrupalUserFromLdapEntry() provisions a new one.
  bundle: ldap_user
  rubric_ref: rubric/ldap_user_ldap_user_processor_service@1.0
  tags:
  - mode:recipe
- id: ldap-user-triggers
  input: Which two config keys on ldap_user.settings hold the provisioning trigger events for creating
    Drupal accounts versus writing LDAP entries?
  criteria: 'drupalAcctProvisionTriggers (Drupal account provisioning: on login, on update/create) and
    ldapEntryProvisionTriggers (LDAP entry provisioning: on update/create, on login, on delete, on manual
    creation).'
  bundle: ldap_user
  rubric_ref: rubric/ldap_user_ldap_user_triggers@1.0
  tags:
  - mode:recipe
- id: ldap-user-orphans
  input: In ldap_user, which service handles Drupal accounts whose LDAP entry no longer exists, and which
    config key sets the default behaviour?
  criteria: The ldap.orphan_processor service (OrphanProcessor); the orphanedDrupalAcctBehavior key (default
    ldap_user_orphan_email) sets what happens to orphaned accounts.
  bundle: ldap_user
  rubric_ref: rubric/ldap_user_ldap_user_orphans@1.0
  tags:
  - mode:recipe
- id: ldap-user-mapping-hook
  input: Which hook lets a custom module add a Drupal user field as an available target on the LDAP user
    provisioning mapping form?
  criteria: Implement hook_ldap_user_attributes_alter(array &$available_user_attrs, array &$params).
  bundle: ldap_user
  rubric_ref: rubric/ldap_user_ldap_user_mapping_hook@1.0
  tags:
  - mode:recipe
- id: ldap-user-edit-hook
  input: Which hook lets me alter the Drupal user account with data from its LDAP entry during synchronization?
  criteria: Implement hook_ldap_user_edit_user_alter(UserInterface $account, Entry $entry, array $context).
  bundle: ldap_user
  rubric_ref: rubric/ldap_user_ldap_user_edit_hook@1.0
  tags:
  - mode:recipe
- id: ldap-user-events
  input: Which events does ldap_user dispatch that I can subscribe to when an LDAP-driven Drupal account
    is created, updated, logs in, or is deleted?
  criteria: LdapUserLoginEvent, LdapNewUserCreatedEvent, LdapUserUpdatedEvent and LdapUserDeletedEvent
    in Drupal\ldap_user\Event.
  bundle: ldap_user
  rubric_ref: rubric/ldap_user_ldap_user_events@1.0
  tags:
  - mode:recipe
