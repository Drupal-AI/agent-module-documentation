metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: ldap
  version: 4.13.x
  note: '`ldap` is an umbrella/meta project; cases probe the suite structure (which submodule does what,
    the shared permission/UI, external libs) that an agent would otherwise read multiple info.yml files
    to answer. Recipe (response-graded); no site mutation.'
questions:
- id: ldap-is-meta
  input: On Drupal 11, is the top-level `ldap` module where LDAP authentication logic lives, or is it
    a meta package? Which submodule is the required base for everything else?
  criteria: The top-level ldap module is a meta/umbrella package (its info.yml only depends on ldap:ldap_servers).
    ldap_servers is the required base that defines the ldap_server config entity and connection services.
  bundle: ldap
  rubric_ref: rubric/ldap_ldap_is_meta@1.0
  tags:
  - mode:recipe
- id: ldap-submodule-roles
  input: In the Drupal LDAP suite, which submodule validates the login form against LDAP, and which submodule
    grants Drupal roles from LDAP group membership?
  criteria: ldap_authentication validates the Drupal login against LDAP servers; ldap_authorization grants
    Drupal roles from LDAP groups via the authorization module.
  bundle: ldap
  rubric_ref: rubric/ldap_ldap_submodule_roles@1.0
  tags:
  - mode:recipe
- id: ldap-external-libs
  input: Which external PHP library and which two contrib modules does drupal/ldap require via composer?
  criteria: It requires symfony/ldap (the PHP LDAP bridge) plus drupal/externalauth and drupal/authorization.
  bundle: ldap
  rubric_ref: rubric/ldap_ldap_external_libs@1.0
  tags:
  - mode:recipe
- id: ldap-admin-permission
  input: What single permission gates all of the LDAP suite's admin screens, and under which admin path
    do they live?
  criteria: The 'administer ldap' permission (defined by ldap_servers) gates every LDAP admin route; they
    live under /admin/config/people/ldap.
  bundle: ldap
  rubric_ref: rubric/ldap_ldap_admin_permission@1.0
  tags:
  - mode:recipe
- id: ldap-provisioning-submodule
  input: In the Drupal LDAP suite, which submodule maps LDAP entries to Drupal user fields and provisions
    accounts, and which one stores reusable directory searches usable in Views?
  criteria: ldap_user handles attribute mapping/provisioning of Drupal accounts (and reverse LDAP provisioning);
    ldap_query stores ldap_query_entity searches and exposes them to Views.
  bundle: ldap
  rubric_ref: rubric/ldap_ldap_provisioning_submodule@1.0
  tags:
  - mode:recipe
