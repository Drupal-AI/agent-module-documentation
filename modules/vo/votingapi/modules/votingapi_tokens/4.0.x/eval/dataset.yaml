metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: votingapi_tokens
  version: 4.0.x
  part_of: votingapi
  note: Lightweight Voting API submodule that exposes vote aggregates as dynamic tokens. Recipe cases
    probe the token pattern and dependencies. No site mutation.
questions:
- id: votingapi-tokens-pattern
  input: With the Voting API Tokens submodule enabled on Drupal 11, what token would print the average
    'vote'-type rating of a node? Describe the token pattern and its four available tokens.
  criteria: Use [votingapi_node_token:vote_average:vote]. The group is votingapi_<entity_type>_token and
    the four dynamic tokens are vote_count, vote_average, best_vote, and worst_vote, each taking the vote
    type as the final argument.
  bundle: votingapi_tokens
  rubric_ref: rubric/votingapi_tokens_votingapi_tokens_pattern@1.0
  tags:
  - mode:recipe
- id: votingapi-tokens-deps
  input: What modules must be enabled for the Voting API Tokens submodule to work, and does it add any
    admin UI or permissions?
  criteria: It depends on votingapi and the contrib token module. It provides no admin UI, permissions,
    config, or Drush commands — enabling it is all that is required.
  bundle: votingapi_tokens
  rubric_ref: rubric/votingapi_tokens_votingapi_tokens_deps@1.0
  tags:
  - mode:recipe
