metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: votingapi
  version: 4.0.x
  note: 'Voting API is a developer voting/rating framework. Cases are mostly `recipe` (response-graded)
    and probe votingapi-specific facts: the vote content entity vs vote_result vs vote_type config entity,
    the VoteResultFunction plugin type and its built-ins, how to cast a vote and read results, the calculation
    schedule setting, and the drush commands. One `execution` case mutates the live site (writes votes)
    and is graded by verify scripts. Voting API has no UI for casting votes, so that case is a code-writing
    task.'
questions:
- id: votingapi-cast-and-aggregate
  input: On this Drupal site (drush available), use the Voting API programmatically. Make sure a vote
    type with machine name `eval_rating` exists (a percent/points value type), then cast a rating vote
    of value 80 on the node with id 1 as an anonymous user, and recalculate the results so an aggregated
    result is stored. Do this by running real code against the live site (e.g. via drush php), not by
    describing it. One-line summary of what you did.
  criteria: 'Created the eval_rating vote type, cast a vote of value 80 on node 1 (anonymous, uid 0) and
    saved it, then recalculated results so a vote_result aggregate for node 1 is stored. Verified against
    live site: a vote entity on (node,1) has value ~80 and a vote_result row for node 1 exists.'
  bundle: votingapi
  rubric_ref: rubric/votingapi_votingapi_cast_and_aggregate@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/votingapi-reset.sh
    verify: agent-module-documentation/evaluation/verify/votingapi-cast-vote.sh
- id: votingapi-thumbs-cast-and-aggregate
  input: On this Drupal site (drush available), use the Voting API programmatically to build a thumbs-up
    feature. Create a vote type with machine name `eval_thumbs` that uses the `points` value type, then
    cast a single thumbs-up vote of value +1 on the node with id 1 as an anonymous user (uid 0), and recalculate
    so an aggregated result is stored for node 1 under the eval_thumbs type. Do this by running real code
    against the live site (e.g. via drush php), not by describing it. One-line summary of what you did.
  criteria: 'Created the eval_thumbs vote type (value_type points), cast a +1 vote on node 1 as anonymous
    (uid 0), and recalculated so a vote_result aggregate for node 1 under eval_thumbs is stored. Verified
    live: the eval_thumbs vote_type exists with points value type, an anonymous eval_thumbs vote of value
    1 is on (node,1), and an eval_thumbs vote_result row for node 1 exists.'
  bundle: votingapi
  rubric_ref: rubric/votingapi_votingapi_thumbs_cast_and_aggregate@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/votingapi-thumbs-reset.sh
    verify: agent-module-documentation/evaluation/verify/votingapi-thumbs-verify.sh
- id: votingapi-average-eighty
  input: On this Drupal site (drush available), use the Voting API programmatically. Create a vote type
    with machine name `eval_avg` (percent value type), then cast three votes of values 60, 80 and 100
    on the node with id 1 using that type, and recalculate the aggregate results so the stored average
    result for node 1 is 80. Do this by running real code against the live site (e.g. via drush php),
    not by describing it. One-line summary of what you did.
  criteria: 'Created the eval_avg vote type, cast three eval_avg votes of values 60, 80 and 100 on node
    1, then recalculated results so the vote_average aggregate for node 1 is 80. Verified live: at least
    three eval_avg vote entities exist on (node,1) and the stored eval_avg vote_average result for node
    1 is within tolerance of 80.'
  bundle: votingapi
  rubric_ref: rubric/votingapi_votingapi_average_eighty@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/votingapi-average-reset.sh
    verify: agent-module-documentation/evaluation/verify/votingapi-average-verify.sh
- id: votingapi-intro-vote-type-value-type
  input: 'On this Drupal 11 site (Voting API 4.x, drush available), a vote type with machine name `eval_intro_vt`
    already exists. Inspect the live site (e.g. via drush php) and tell me: what is its value type?'
  criteria: The eval_intro_vt vote type uses the `percent` value type (VoteType::getValueType() returns
    'percent'; loadable via the vote_type config entity storage).
  bundle: votingapi
  rubric_ref: rubric/votingapi_votingapi_intro_vote_type_value_type@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    persona: drupal-expert
    setup: agent-module-documentation/evaluation/verify/votingapi-intro-vote-type-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/votingapi-intro-vote-type-cleanup.sh
- id: votingapi-intro-votes-count-average
  input: 'On this Drupal 11 site (Voting API 4.x, drush available), some votes of the default `vote` type
    have already been cast on the node with id 1. Inspect the live site (e.g. via drush php, querying
    the vote content entities) and tell me: how many votes have been cast on node 1, and what is their
    average value?'
  criteria: Three votes have been cast on node 1 (values 10, 20, 90), with an average value of 40. Read
    by loading the `vote` content entities for (node,1) — count is 3, mean of the values is 40.
  bundle: votingapi
  rubric_ref: rubric/votingapi_votingapi_intro_votes_count_average@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    persona: drupal-expert
    setup: agent-module-documentation/evaluation/verify/votingapi-intro-votes-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/votingapi-intro-votes-cleanup.sh
- id: votingapi-intro-results-functions
  input: 'On this Drupal 11 site (Voting API 4.x, drush available), aggregate voting results have already
    been calculated for the node with id 1. Inspect the live site (e.g. via the plugin.manager.votingapi.resultfunction
    service''s getResults(''node'', 1), or the votingapi_result table) and tell me: what aggregated result
    functions are stored for node 1?'
  criteria: The stored aggregate result functions for node 1 (under the `vote` type) are vote_count, vote_average,
    vote_sum, vote_maximum, vote_minimum and vote_median — the built-in VoteResultFunction plugins that
    ran during recalculation.
  bundle: votingapi
  rubric_ref: rubric/votingapi_votingapi_intro_results_functions@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    persona: drupal-expert
    setup: agent-module-documentation/evaluation/verify/votingapi-intro-results-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/votingapi-intro-results-cleanup.sh
- id: votingapi-three-entity-types
  input: In Drupal 11 with Voting API 4.x, name the objects used to store (a) a single cast vote, (b)
    an aggregate result, and (c) a vote type/bundle. Say which are content entities and which is config.
    Answer briefly.
  criteria: A single vote is a `vote` content entity (table votingapi_vote); an aggregate result is a
    `vote_result` content entity (table votingapi_result); a vote type is a `vote_type` config entity
    that acts as the bundle of `vote`. Vote and vote_result are content entities, vote_type is a config
    entity.
  bundle: votingapi
  rubric_ref: rubric/votingapi_votingapi_three_entity_types@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: votingapi-cast-vote
  input: Show the code to cast a vote of value 1 (points) on node 42 for the default 'vote' type using
    Voting API 4.x, and explain how the aggregate result is then updated.
  criteria: 'Create a Vote entity: Vote::create([''type'' => ''vote'']), then setVotedEntityType(''node''),
    setVotedEntityId(42), setValueType(''points''), setValue(1), and save(). On save, if votingapi.settings
    calculation_schedule is ''immediate'' (default) the results for that entity and vote type are recalculated
    automatically.'
  bundle: votingapi
  rubric_ref: rubric/votingapi_votingapi_cast_vote@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: votingapi-result-plugin
  input: In Voting API 4.x, what plugin type do I implement to add a custom aggregate calculation (like
    a weighted score), what method must it implement, and where does discovery happen? Name the built-in
    ones too.
  criteria: 'Implement a VoteResultFunction plugin (attribute \Drupal\votingapi\Attribute\VoteResultFunction,
    base class VoteResultFunctionBase) in src/Plugin/VoteResultFunction/. It must implement calculateResult(array
    $votes): float. Built-ins: Count (vote_count), Average (vote_average), Sum (vote_sum), Maximum (vote_maximum),
    Minimum (vote_minimum), Median (vote_median).'
  bundle: votingapi
  rubric_ref: rubric/votingapi_votingapi_result_plugin@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: votingapi-read-results
  input: With Voting API 4.x, how do I read the cached aggregate voting results for node 42 in code? Name
    the service and method and describe the return shape.
  criteria: Use the plugin.manager.votingapi.resultfunction service (VoteResultFunctionManagerInterface)
    and call getResults('node', 42). It returns a nested array keyed by vote type then function id, e.g.
    $results['vote']['vote_count'] and $results['vote']['vote_average'].
  bundle: votingapi
  rubric_ref: rubric/votingapi_votingapi_read_results@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: votingapi-calculation-schedule
  input: On a high-traffic Drupal 11 site using Voting API 4.x, I want vote results tallied at cron instead
    of on every vote. Which config setting do I change, to what value, and what config object holds it?
  criteria: Set calculation_schedule to 'cron' in the votingapi.settings config object (default is 'immediate';
    'manual' disables auto-tally). e.g. drush config:set votingapi.settings calculation_schedule cron.
    The settings form is at /admin/config/search/votingapi (route votingapi.admin_settings).
  bundle: votingapi
  rubric_ref: rubric/votingapi_votingapi_calculation_schedule@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: votingapi-drush
  input: Which Drush commands does Voting API 4.x provide to (a) generate test votes, (b) rebuild results
    from raw votes, and (c) delete all voting data?
  criteria: voting:generate (genv) creates dummy votes, voting:recalculate (vcalc) rebuilds aggregate
    results from raw votes, and voting:flush (vflush) deletes all voting data (both votingapi_vote and
    votingapi_result).
  bundle: votingapi
  rubric_ref: rubric/votingapi_votingapi_drush@1.0
  tags:
  - mode:recipe
  - difficulty:easy
