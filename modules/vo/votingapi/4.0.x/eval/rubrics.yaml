rubrics:
- id: votingapi_votingapi_cast_and_aggregate
  version: '1.0'
  applicable_bundles:
  - votingapi
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
