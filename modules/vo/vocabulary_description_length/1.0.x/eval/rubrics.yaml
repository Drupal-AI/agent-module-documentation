rubrics:
- id: vocabulary_description_length_vocabulary_description_length_what
  version: '1.0'
  applicable_bundles:
  - vocabulary_description_length
  checks:
  - kind: must_contain_any
    values:
    - textarea
    - taxonomy_vocabulary_form
    - description
  scoring:
    combine: all_pass
- id: vocabulary_description_length_vocabulary_description_length_storage
  version: '1.0'
  applicable_bundles:
  - vocabulary_description_length
  checks:
  - kind: must_contain_any
    values:
    - no configuration
    - does not change
    - no config
    - widget
    - form
    - textarea
    - taxonomy.vocabulary
  scoring:
    combine: all_pass
- id: vocabulary_description_length_vocabulary_description_length_scope
  version: '1.0'
  applicable_bundles:
  - vocabulary_description_length
  checks:
  - kind: must_contain_any
    values:
    - only
    - vocabulary form
    - taxonomy_vocabulary_form
    - not
  scoring:
    combine: all_pass
- id: vocabulary_description_length_vocabulary_description_length_known
  version: '1.0'
  applicable_bundles:
