metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: vocabulary_description_length
  version: 1.0.x
  note: 'Vocabulary Description Length is a single-hook module: hook_form_taxonomy_vocabulary_form_alter
    sets the Description element''s #type to ''textarea'' so long descriptions are practical to type.
    It has NO config, schema, permissions, services, Drush or configure route, and does NOT change storage
    - a vocabulary description is an unlimited string in taxonomy.vocabulary.<vid> either way. Because
    its only effect is on the vocabulary form widget (observable only by rendering that admin form), the
    medium/hard cases are grounded in the vocabulary config the module targets: introspection reads a
    vocabulary''s (long) description; execution builds a vocabulary that HAS a long multi-line description
    (the end state the module enables). Fixtures are created with raw config writes because full config-entity
    saves via the entity API are currently blocked by an unrelated broken commerce_giftcard field on this
    shared site.'
questions:
- id: vocabulary_description_length-what
  input: What does the Drupal module vocabulary_description_length change, and how? Which form does it
    alter and what does it do to the description field?
  criteria: 'It implements hook_form_FORM_ID_alter() for taxonomy_vocabulary_form and sets the Description
    element''s #type to ''textarea'' (instead of core''s single-line textfield), so editors can comfortably
    enter long, multi-line vocabulary descriptions.'
  bundle: vocabulary_description_length
  rubric_ref: rubric/vocabulary_description_length_vocabulary_description_length_what@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: vocabulary_description_length-storage
  input: If I install vocabulary_description_length, does it change how or where a vocabulary's description
    is stored, or add a length limit? Does it need any configuration?
  criteria: No. It has no configuration and no configure route. It only changes the vocabulary form widget
    (textfield -> textarea); the description is still stored as an unlimited string in the taxonomy.vocabulary.<vid>
    config object, with no new length limit or validation and no front-end change.
  bundle: vocabulary_description_length
  rubric_ref: rubric/vocabulary_description_length_vocabulary_description_length_storage@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: vocabulary_description_length-scope
  input: Does vocabulary_description_length affect taxonomy term descriptions or other entity forms, or
    only the vocabulary form?
  criteria: Only the vocabulary form (taxonomy_vocabulary_form). It does not touch term descriptions or
    any other form/entity - its single form-alter is scoped to the vocabulary add/edit form.
  bundle: vocabulary_description_length
  rubric_ref: rubric/vocabulary_description_length_vocabulary_description_length_scope@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: vocabulary_description_length-known
  input: One taxonomy vocabulary on this site has a long, multi-paragraph description. Inspect the live
    configuration, name that vocabulary (its machine name), and summarise what its description is about.
  criteria: The vocabulary vdl_known has a long description (about editorial tag governance/naming conventions
    and term review). Read it with `drush cget taxonomy.vocabulary.vdl_known description`.
  bundle: vocabulary_description_length
  rubric_ref: rubric/vocabulary_description_length_vocabulary_description_length_known@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/vocabulary_description_length-known-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/vocabulary_description_length-known-cleanup.sh
- id: vocabulary_description_length-longshort
  input: This site has two vocabularies, vdl_long and vdl_short. Inspect their live configuration and
    state which one has the long multi-paragraph description.
  criteria: vdl_long has the long description; vdl_short has only a short one-line description. Compare
    `drush cget taxonomy.vocabulary.vdl_long description` and `... vdl_short description`.
  bundle: vocabulary_description_length
  rubric_ref: rubric/vocabulary_description_length_vocabulary_description_length_longshort@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/vocabulary_description_length-longshort-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/vocabulary_description_length-longshort-cleanup.sh
- id: vocabulary_description_length-create
  input: On this Drupal site (which has vocabulary_description_length enabled so long descriptions are
    supported), create a taxonomy vocabulary with machine name vdl_task and give it a long, multi-paragraph
    description (several sentences across more than one line explaining its purpose and editorial rules).
    Apply it to the live site.
  criteria: Create taxonomy vocabulary vdl_task whose description is a multi-line string of at least ~200
    characters (the vocabulary form's textarea, provided by this module, makes such a description practical
    to enter).
  bundle: vocabulary_description_length
  rubric_ref: rubric/vocabulary_description_length_vocabulary_description_length_create@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/vocabulary_description_length-create-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/vocabulary_description_length-create-reset.sh
    verify: agent-module-documentation/evaluation/verify/vocabulary_description_length-create-verify.sh
- id: vocabulary_description_length-edit
  input: The vocabulary vdl_edit on this site currently has only a short one-line description. Replace
    it with a long, multi-paragraph description (several sentences across multiple lines) documenting
    the vocabulary's purpose and usage rules. Apply the change to the live site.
  criteria: Update taxonomy vocabulary vdl_edit so its description is a multi-line string of at least
    ~200 characters.
  bundle: vocabulary_description_length
  rubric_ref: rubric/vocabulary_description_length_vocabulary_description_length_edit@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/vocabulary_description_length-edit-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/vocabulary_description_length-edit-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/vocabulary_description_length-edit-verify.sh
