metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: pcb_redis
  version: 4.0.x
  note: 'pcb_redis is a glue-shim submodule of pcb that registers ONE service, cache.backend.permanent_redis
    (PermanentRedisBackendFactory -> PermanentRedisBackend). This site has no live Redis server configured,
    so per the campaign brief the medium/hard cases are grounded in the local service/plugin definition
    and module lifecycle (server-independent): the observable live state is whether pcb_redis is installed
    and its backend service is registered in the container - checkable with \Drupal::hasService(''cache.backend.permanent_redis'')
    and \Drupal::moduleHandler()->moduleExists(''pcb_redis'') - not on a running Redis instance. The redis
    contrib module is already enabled at baseline; pcb_redis is uninstalled at baseline. Scripts only
    enable/uninstall pcb_redis (never touch redis).'
questions:
- id: pcb-redis-service
  input: The pcb_redis submodule of Permanent Cache Bin adds a Redis-backed permanent cache backend. What
    is the machine name of the cache backend service it registers, and what does its factory extend?
  criteria: It registers the service cache.backend.permanent_redis, whose factory PermanentRedisBackendFactory
    extends the Redis module's CacheBackendFactory and returns a PermanentRedisBackend (Redis backend
    + pcb's PermanentBackendTrait).
  bundle: pcb_redis
  rubric_ref: rubric/pcb_redis_pcb_redis_service@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: pcb-redis-point-bin
  input: With pcb_redis enabled, how do I make a cache bin named 'stock' use the Redis permanent backend
    (surviving drush cr)?
  criteria: 'Register a cache.stock service tagged { name: cache.bin, default_backend: cache.backend.permanent_redis
    }, or in settings.php set $settings[''cache''][''bins''][''stock''] = ''cache.backend.permanent_redis''.'
  bundle: pcb_redis
  rubric_ref: rubric/pcb_redis_pcb_redis_point_bin@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: pcb-redis-requirements
  input: What does the pcb_redis submodule depend on, and what else is needed for it to actually store
    cache in Redis?
  criteria: It depends on the contrib Redis module (redis:redis >= 8.x-1.0-rc2) and the parent pcb module,
    and needs a working Redis server wired into Drupal for the bin to actually be stored in Redis.
  bundle: pcb_redis
  rubric_ref: rubric/pcb_redis_pcb_redis_requirements@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: pcb-redis-service-live
  input: On this Drupal site, inspect the live service container and tell me the exact machine name of
    the permanent Redis cache backend service that is currently available.
  criteria: 'The service cache.backend.permanent_redis is registered (pcb_redis is installed). Check with:
    drush php:eval ''var_export(\Drupal::hasService("cache.backend.permanent_redis"));''.'
  bundle: pcb_redis
  rubric_ref: rubric/pcb_redis_pcb_redis_service_live@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/pcb_redis-service-live-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/pcb_redis-service-live-cleanup.sh
- id: pcb-redis-which-module
  input: On this Drupal site a permanent Redis cache backend is available. Inspect the live site and tell
    me which module provides it (which pcb submodule is installed).
  criteria: The pcb_redis submodule is installed (drush pm:list shows pcb_redis enabled); it provides
    the cache.backend.permanent_redis service.
  bundle: pcb_redis
  rubric_ref: rubric/pcb_redis_pcb_redis_which_module@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/pcb_redis-which-module-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/pcb_redis-which-module-cleanup.sh
- id: pcb-redis-enable
  input: On this Drupal site, the Redis contrib module is enabled but pcb's Redis permanent-cache integration
    is not. Make a permanent Redis cache backend service (cache.backend.permanent_redis) available on
    the site. Apply the change to the live site.
  criteria: Enable the pcb_redis submodule (drush en pcb_redis -y); afterwards \Drupal::hasService('cache.backend.permanent_redis')
    is TRUE and the module is installed.
  bundle: pcb_redis
  rubric_ref: rubric/pcb_redis_pcb_redis_enable@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/pcb_redis-enable-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/pcb_redis-enable-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/pcb_redis-enable-verify.sh
- id: pcb-redis-uninstall
  input: On this Drupal site, pcb's Redis permanent-cache integration submodule is currently installed
    but the ops team wants it removed so its permanent Redis backend service is no longer registered.
    Uninstall it. Apply the change to the live site.
  criteria: Uninstall the pcb_redis submodule (drush pmu pcb_redis -y); afterwards \Drupal::moduleHandler()->moduleExists('pcb_redis')
    is FALSE and \Drupal::hasService('cache.backend.permanent_redis') is FALSE.
  bundle: pcb_redis
  rubric_ref: rubric/pcb_redis_pcb_redis_uninstall@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
