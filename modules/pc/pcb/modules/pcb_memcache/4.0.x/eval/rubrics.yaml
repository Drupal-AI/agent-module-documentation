rubrics:
- id: pcb_memcache_pcb_memcache_service
  version: '1.0'
  applicable_bundles:
  - pcb_memcache
  checks:
  - kind: must_contain_any
    values:
    - cache.backend.permanent_memcache
  scoring:
    combine: all_pass
- id: pcb_memcache_pcb_memcache_point_bin
  version: '1.0'
  applicable_bundles:
  - pcb_memcache
  checks:
  - kind: must_contain_any
    values:
    - cache.backend.permanent_memcache
    - $settings['cache']['bins']
    - default_backend
  scoring:
    combine: all_pass
- id: pcb_memcache_pcb_memcache_requirements
  version: '1.0'
  applicable_bundles:
  - pcb_memcache
  checks:
  - kind: must_contain_any
    values:
    - memcache
    - pcb
  scoring:
    combine: all_pass
- id: pcb_memcache_pcb_memcache_service_live
  version: '1.0'
  applicable_bundles:
  - pcb_memcache
  checks:
  - kind: must_contain_any
    values:
    - cache.backend.permanent_memcache
  scoring:
    combine: all_pass
- id: pcb_memcache_pcb_memcache_which_module
  version: '1.0'
  applicable_bundles:
  - pcb_memcache
  checks:
  - kind: must_contain_any
    values:
    - pcb_memcache
  scoring:
    combine: all_pass
- id: pcb_memcache_pcb_memcache_enable
  version: '1.0'
  applicable_bundles:
  - pcb_memcache
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
- id: pcb_memcache_pcb_memcache_uninstall
  version: '1.0'
  applicable_bundles:
  - pcb_memcache
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
