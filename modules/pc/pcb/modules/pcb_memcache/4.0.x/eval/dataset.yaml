metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: pcb_memcache
  version: 4.0.x
  note: 'pcb_memcache is a glue-shim submodule of pcb that registers ONE service, cache.backend.permanent_memcache
    (PermanentMemcacheBackendFactory -> PermanentMemcacheBackend). This site has no live Memcache server
    configured, so per the campaign brief the medium/hard cases are grounded in the local service/plugin
    definition and module lifecycle (server-independent): the observable live state is whether pcb_memcache
    is installed and its backend service is registered in the container - checkable with \Drupal::hasService(''cache.backend.permanent_memcache'')
    and \Drupal::moduleHandler()->moduleExists(''pcb_memcache'') - not on a running Memcache instance.
    At baseline both pcb_memcache and its dependency memcache are uninstalled; enabling pcb_memcache also
    enables memcache, so cleanup/reset uninstall BOTH to restore baseline.'
questions:
- id: pcb-memcache-service
  input: The pcb_memcache submodule of Permanent Cache Bin adds a Memcache-backed permanent cache backend.
    What is the machine name of the cache backend service it registers, and what does its factory extend?
  criteria: It registers the service cache.backend.permanent_memcache, whose factory PermanentMemcacheBackendFactory
    extends the Memcache module's backend factory and returns a PermanentMemcacheBackend (Memcache backend
    + pcb's PermanentBackendTrait).
  bundle: pcb_memcache
  rubric_ref: rubric/pcb_memcache_pcb_memcache_service@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: pcb-memcache-point-bin
  input: With pcb_memcache enabled, how do I make a cache bin named 'stock' use the Memcache permanent
    backend (surviving drush cr)?
  criteria: 'Register a cache.stock service tagged { name: cache.bin, default_backend: cache.backend.permanent_memcache
    }, or in settings.php set $settings[''cache''][''bins''][''stock''] = ''cache.backend.permanent_memcache''.'
  bundle: pcb_memcache
  rubric_ref: rubric/pcb_memcache_pcb_memcache_point_bin@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: pcb-memcache-requirements
  input: What does the pcb_memcache submodule depend on, and what else is needed for it to actually store
    cache in Memcache?
  criteria: It depends on the contrib Memcache module (memcache:memcache >= 2.0) and the parent pcb module,
    and needs a working Memcache server wired into Drupal for the bin to actually be stored in Memcache.
  bundle: pcb_memcache
  rubric_ref: rubric/pcb_memcache_pcb_memcache_requirements@1.0
  tags:
  - mode:recipe
  - difficulty:easy
