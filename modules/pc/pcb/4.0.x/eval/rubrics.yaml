rubrics:
- id: pcb_pcb_survives_cr
  version: '1.0'
  applicable_bundles:
  - pcb
  checks:
  - kind: must_contain_any
    values:
    - cache.backend.permanent_database
    - deleteAllPermanent
  scoring:
    combine: all_pass
- id: pcb_pcb_drush_flush
  version: '1.0'
  applicable_bundles:
  - pcb
  checks:
  - kind: must_contain_any
    values:
    - pcbf
    - pcb:flush
    - pcb-list
    - pcb:list
  scoring:
    combine: all_pass
- id: pcb_pcb_register_bin
  version: '1.0'
  applicable_bundles:
  - pcb
  checks:
  - kind: must_contain_any
    values:
    - 'default_backend: cache.backend.permanent_database'
    - cache.backend.permanent_database
    - $settings['cache']['bins']
  scoring:
    combine: all_pass
- id: pcb_pcb_read_permanent_value
  version: '1.0'
  applicable_bundles:
  - pcb
  checks:
  - kind: must_contain_any
    values:
    - PCB_MEDIUM_TOKEN
  scoring:
    combine: all_pass
- id: pcb_pcb_value_survives
  version: '1.0'
  applicable_bundles:
  - pcb
  checks:
  - kind: must_contain_any
    values:
    - PCB_SURVIVED_TOKEN
  scoring:
    combine: all_pass
- id: pcb_pcb_cache_persist
  version: '1.0'
  applicable_bundles:
  - pcb
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
- id: pcb_pcb_explicit_flush
  version: '1.0'
  applicable_bundles:
  - pcb
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
