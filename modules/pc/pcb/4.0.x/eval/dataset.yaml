metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: pcb
  version: 4.0.x
  note: 'pcb has no config object; its behavior is the permanent cache backend service cache.backend.permanent_database,
    whose deleteAll() is a no-op and whose deleteAllPermanent() explicitly clears the bin. Medium/hard
    cases are grounded in that real backend at the DATABASE level (no external server needed): scripts
    create/populate/clear an ad-hoc permanent bin via the factory service and check the cache_<bin> table.
    Bins are namespaced pcb_* and their tables are dropped on cleanup. Drush: pcbf / pcb:flush-all / pcb-list.'
questions:
- id: pcb-survives-cr
  input: On a Drupal site with the Permanent Cache Bin (pcb) module, which service backs a cache bin so
    its entries are NOT wiped by 'drush cr', and what method actually clears such a bin when you really
    want to?
  criteria: Back the bin with cache.backend.permanent_database (or the memcache/redis variants). Its deleteAll()
    is a no-op so drush cr leaves the data intact; deleteAllPermanent() is the method that actually clears
    the bin.
  bundle: pcb
  rubric_ref: rubric/pcb_pcb_survives_cr@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: pcb-drush-flush
  input: Using the pcb module's Drush commands, how do I flush a single permanent cache bin called 'stock',
    and how do I list which bins use a permanent backend?
  criteria: Flush one bin with 'drush pcbf stock' (alias of pcb:flush). List permanent bins with 'drush
    pcb-list' (pcb:list). 'drush pcb:flush-all' clears every permanent bin.
  bundle: pcb
  rubric_ref: rubric/pcb_pcb_drush_flush@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: pcb-register-bin
  input: With the pcb module installed, how do I make a cache bin named 'stock' use the permanent (survives-cache-rebuild)
    backend?
  criteria: 'Either register a cache.stock service tagged { name: cache.bin, default_backend: cache.backend.permanent_database
    }, or in settings.php set $settings[''cache''][''bins''][''stock''] = ''cache.backend.permanent_database''.'
  bundle: pcb
  rubric_ref: rubric/pcb_pcb_register_bin@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: pcb-read-permanent-value
  input: On this Drupal site, a value has been cached in a pcb permanent database cache bin named 'pcb_med'
    under the cache key 'pcb_mkey'. Read it back from the live site and tell me the cached value.
  criteria: 'Load the bin via the permanent backend factory and read the item: \Drupal::service(''cache.backend.permanent_database'')->get(''pcb_med'')->get(''pcb_mkey'')->data
    === ''PCB_MEDIUM_TOKEN''.'
  bundle: pcb
  rubric_ref: rubric/pcb_pcb_read_permanent_value@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/pcb-read-permanent-value-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/pcb-read-permanent-value-cleanup.sh
- id: pcb-value-survives
  input: 'On this Drupal site, an entry is cached in the pcb permanent database bin ''pcb_med2'' under
    key ''pcb_mkey2'', and a cache-rebuild-style deleteAll() has already been called on that bin. Inspect
    the live site: is the entry still there, and what is its value?'
  criteria: It is still there because a permanent bin's deleteAll() is a no-op. The cached value is PCB_SURVIVED_TOKEN
    (read via cache.backend.permanent_database ->get('pcb_med2')->get('pcb_mkey2')).
  bundle: pcb
  rubric_ref: rubric/pcb_pcb_value_survives@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/pcb-value-survives-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/pcb-value-survives-cleanup.sh
- id: pcb-cache-persist
  input: On this Drupal site, use the pcb module's permanent database cache backend to cache the value
    'pcb_persist' under the key 'pcb_key' in a cache bin named 'pcb_task', such that the entry is NOT
    removed by a cache-rebuild-style deleteAll() on that bin. Apply it to the live site.
  criteria: 'Store via the permanent factory: \Drupal::service(''cache.backend.permanent_database'')->get(''pcb_task'')->set(''pcb_key'',
    ''pcb_persist''); because its deleteAll() is a no-op the value survives a rebuild-style clear.'
  bundle: pcb
  rubric_ref: rubric/pcb_pcb_cache_persist@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/pcb-cache-persist-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/pcb-cache-persist-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/pcb-cache-persist-verify.sh
- id: pcb-explicit-flush
  input: On this Drupal site, the pcb permanent database cache bin 'pcb_clear' currently holds a cached
    entry. Explicitly flush ONLY that permanent bin so it becomes empty - without doing a full site cache
    rebuild. Apply it to the live site.
  criteria: 'A permanent bin''s deleteAll() is a no-op, so you must call deleteAllPermanent(): \Drupal::service(''cache.backend.permanent_database'')->get(''pcb_clear'')->deleteAllPermanent();
    (equivalent to ''drush pcbf pcb_clear'' when the bin is registered). A plain ''drush cr'' would NOT
    clear it.'
  bundle: pcb
  rubric_ref: rubric/pcb_pcb_explicit_flush@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/pcb-explicit-flush-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/pcb-explicit-flush-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/pcb-explicit-flush-verify.sh
