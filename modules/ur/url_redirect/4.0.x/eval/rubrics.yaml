rubrics:
- id: url_redirect_url_redirect_entity_shape
  version: '1.0'
  applicable_bundles:
  - url_redirect
  checks:
  - kind: must_contain_any
    values:
    - url_redirect config entity
    - config entity
    - url_redirect.url_redirect
    - redirect_for
    - redirect_path
  scoring:
    combine: all_pass
- id: url_redirect_url_redirect_mechanism
  version: '1.0'
  applicable_bundles:
  - url_redirect
  checks:
  - kind: must_contain_any
    values:
    - '301'
    - TrustedRedirectResponse
    - priority 33
    - wildcard
    - path.matcher
  scoring:
    combine: all_pass
- id: url_redirect_url_redirect_known_dest
  version: '1.0'
  applicable_bundles:
  - url_redirect
  checks:
  - kind: must_contain_any
    values:
    - /urlr-known-dest
  scoring:
    combine: all_pass
- id: url_redirect_url_redirect_target_role
  version: '1.0'
  applicable_bundles:
  - url_redirect
  checks:
  - kind: must_contain_any
    values:
    - anonymous
  scoring:
    combine: all_pass
- id: url_redirect_url_redirect_create_rule
  version: '1.0'
  applicable_bundles:
  - url_redirect
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
- id: url_redirect_url_redirect_external_rule
  version: '1.0'
  applicable_bundles:
  - url_redirect
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
