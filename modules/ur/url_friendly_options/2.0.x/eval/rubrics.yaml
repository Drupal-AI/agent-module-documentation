rubrics:
- id: url_friendly_options_url_friendly_options_what_it_enforces
  version: '1.0'
  applicable_bundles:
  - url_friendly_options
  checks:
  - kind: must_contain_any
    values:
    - hyphen
    - alphanumeric
    - alpha-numeric
    - URL-friendly
    - url-friendly
  scoring:
    combine: all_pass
- id: url_friendly_options_url_friendly_options_bypass_hook
  version: '1.0'
  applicable_bundles:
  - url_friendly_options
  checks:
  - kind: must_contain_any
    values:
    - hook_url_friendly_options_bypass_field_validation
    - url_friendly_options_bypass_field_validation
  scoring:
    combine: all_pass
- id: url_friendly_options_url_friendly_options_existing_values
  version: '1.0'
  applicable_bundles:
  - url_friendly_options
  checks:
  - kind: must_contain_any
    values:
    - does not change
    - won't change
    - will not change
    - not change existing
    - status report
    - requirements
    - hook_requirements
  scoring:
    combine: all_pass
- id: url_friendly_options_url_friendly_options_noncompliant_field
  version: '1.0'
  applicable_bundles:
  - url_friendly_options
  checks:
  - kind: must_contain_any
    values:
    - bad_key
  scoring:
    combine: all_pass
- id: url_friendly_options_url_friendly_options_which_field
  version: '1.0'
  applicable_bundles:
  - url_friendly_options
  checks:
  - kind: must_contain_any
    values:
    - field_ufo_bad
  scoring:
    combine: all_pass
- id: url_friendly_options_url_friendly_options_create_compliant
  version: '1.0'
  applicable_bundles:
  - url_friendly_options
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
- id: url_friendly_options_url_friendly_options_fix_keys
  version: '1.0'
  applicable_bundles:
  - url_friendly_options
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
