    on article. Every key must match ^[a-zA-Z0-9-]*[a-zA-Z0-9]+$ and there must be >= 2 options.
  bundle: url_friendly_options
  rubric_ref: rubric/url_friendly_options_url_friendly_options_create_compliant@1.0
