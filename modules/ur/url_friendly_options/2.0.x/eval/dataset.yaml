metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: url_friendly_options
  version: 2.0.x
  note: 'URL-friendly Options has no config, no configure route, no permissions, no Drush, no plugins.
    It alters field_config_edit_form for options-list fields: adds an #element_validate that rejects allowed-values
    keys not matching ^[a-zA-Z0-9-]*[a-zA-Z0-9]+$, and overrides the machine-name element to use hyphens.
    hook_requirements() (runtime) flags existing list_string field storages with non-compliant keys. hook_url_friendly_options_bypass_field_validation($field_name,$entity_type_id)
    exempts a field. It never rewrites existing values. Medium/hard cases create namespaced list_string
    fields (field_ufo_*) on node.article (programmatic creation bypasses the form validation) and read/assert
    their allowed_values keys against the module''s URL-friendly rule.'
questions:
- id: url_friendly_options-what-it-enforces
  input: What does the Drupal url_friendly_options module enforce on option-list (select/list) fields,
    and what characters are allowed in the option keys?
  criteria: 'It enforces that option-list field keys (allowed_values keys) are URL-friendly: only alphanumeric
    characters and hyphens (regex ^[a-zA-Z0-9-]*[a-zA-Z0-9]+$), so they work as clean URL segments / Views
    contextual-filter arguments. It also makes the machine-name helper suggest hyphens instead of underscores.'
  bundle: url_friendly_options
  rubric_ref: rubric/url_friendly_options_url_friendly_options_what_it_enforces@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: url_friendly_options-bypass-hook
  input: A developer needs one specific field to be exempt from url_friendly_options validation. Which
    hook do they implement, and what should it return?
  criteria: Implement hook_url_friendly_options_bypass_field_validation($field_name, $entity_type_id)
    and return TRUE for the field to exempt (FALSE otherwise). It bypasses both the field-form validation
    and the status-report requirements check.
  bundle: url_friendly_options
  rubric_ref: rubric/url_friendly_options_url_friendly_options_bypass_hook@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: url_friendly_options-existing-values
  input: If I enable url_friendly_options on a site that already has option-list fields with underscore
    keys, does it rewrite the existing keys? How would I find out which fields are non-compliant?
  criteria: No - it never changes existing stored values. It blocks adding/editing values while non-compliant
    keys exist (the field form won't validate), and its hook_requirements() adds a status-report error
    at /admin/reports/status listing the entity_type.field_name of any list_string storage with non-URL-friendly
    keys.
  bundle: url_friendly_options
  rubric_ref: rubric/url_friendly_options_url_friendly_options_existing_values@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: url_friendly_options-noncompliant-field
  input: This site has an option-list field named field_ufo_known on the Article content type. Inspect
    its live allowed-values and identify which option key is NOT URL-friendly according to url_friendly_options'
    rules.
  criteria: The key 'bad_key' is not URL-friendly (underscore is not allowed). field.storage.node.field_ufo_known
    allowed_values has keys bad_key and good-key; only bad_key fails the ^[a-zA-Z0-9-]*[a-zA-Z0-9]+$ rule.
  bundle: url_friendly_options
  rubric_ref: rubric/url_friendly_options_url_friendly_options_noncompliant_field@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/url_friendly_options-noncompliant-field-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/url_friendly_options-noncompliant-field-cleanup.sh
- id: url_friendly_options-which-field
  input: The Article content type on this site has two option-list fields, field_ufo_ok and field_ufo_bad.
    Inspect their live allowed-values and state which field would fail url_friendly_options' URL-friendly
    key check.
  criteria: 'field_ufo_bad fails: its allowed_values include the key ''light_grey'' (underscore), which
    is not URL-friendly. field_ufo_ok uses red and dark-blue, which are both valid.'
  bundle: url_friendly_options
  rubric_ref: rubric/url_friendly_options_url_friendly_options_which_field@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/url_friendly_options-which-field-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/url_friendly_options-which-field-cleanup.sh
- id: url_friendly_options-create-compliant
  input: 'On this site, add an option-list (list_string) field named field_ufo_task to the Article content
    type with at least two allowed values, choosing option keys that satisfy url_friendly_options (URL-friendly:
    only letters, numbers and hyphens). Apply the change to the live site.'
