rubrics:
- id: webform_encrypt_webform_encrypt_where_stored
  version: '1.0'
  applicable_bundles:
  - webform_encrypt
  checks:
  - kind: must_contain_any
    values:
    - third_party_settings
    - third party setting
    - webform_encrypt
    - encrypt_profile
    - Advanced
  scoring:
    combine: all_pass
- id: webform_encrypt_webform_encrypt_view_permission
  version: '1.0'
  applicable_bundles:
  - webform_encrypt
  checks:
  - kind: must_contain_any
    values:
    - view encrypted values
    - '[Value Encrypted]'
    - Value Encrypted
  scoring:
    combine: all_pass
- id: webform_encrypt_webform_encrypt_how_runtime
  version: '1.0'
  applicable_bundles:
  - webform_encrypt
  checks:
  - kind: must_contain_any
    values:
    - WebformEncryptSubmissionStorage
    - storage
    - doPreSave
    - hook_entity_type_alter
    - storage class
  scoring:
    combine: all_pass
- id: webform_encrypt_webform_encrypt_which_element
  version: '1.0'
  applicable_bundles:
  - webform_encrypt
  checks:
  - kind: must_contain_any
    values:
    - ssn
  scoring:
    combine: all_pass
- id: webform_encrypt_webform_encrypt_which_profile
  version: '1.0'
  applicable_bundles:
  - webform_encrypt
  checks:
  - kind: must_contain_any
    values:
    - we_test_profile
  scoring:
    combine: all_pass
- id: webform_encrypt_webform_encrypt_enable_encryption
  version: '1.0'
  applicable_bundles:
  - webform_encrypt
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
- id: webform_encrypt_webform_encrypt_encrypt_with_profile
  version: '1.0'
  applicable_bundles:
  - webform_encrypt
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
