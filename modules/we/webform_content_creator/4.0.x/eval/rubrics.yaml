rubrics:
- id: webform_content_creator_webform_content_creator_what
  version: '1.0'
  applicable_bundles:
  - webform_content_creator
  checks:
  - kind: must_contain_any
    values:
    - webform_content_creator
    - config entity
    - admin/config/webform_content_creator
    - createContent
    - hook_webform_submission
    - target_bundle
    - mapping
  scoring:
    combine: all_pass
- id: webform_content_creator_webform_content_creator_mapping_storage
  version: '1.0'
  applicable_bundles:
  - webform_content_creator
  checks:
  - kind: must_contain_any
    values:
    - elements
    - webform_field
    - custom_value
    - custom_check
    - title
    - Manage fields
  scoring:
    combine: all_pass
- id: webform_content_creator_webform_content_creator_mapping_plugin_type
  version: '1.0'
  applicable_bundles:
  - webform_content_creator
  checks:
  - kind: must_contain_any
    values:
    - WebformContentCreatorFieldMapping
    - default_mapping
    - field_types
    - plugin.manager.webform_content_creator.field_mapping
    - FieldMappingBase
  scoring:
    combine: all_pass
- id: webform_content_creator_webform_content_creator_inspect_mapping
  version: '1.0'
  applicable_bundles:
  - webform_content_creator
  checks:
  - kind: must_contain_any
    values:
    - contact
    - article
  scoring:
    combine: all_pass
- id: webform_content_creator_webform_content_creator_inspect_sync
  version: '1.0'
  applicable_bundles:
  - webform_content_creator
  checks:
  - kind: must_contain_any
    values:
    - sync_content
    - 'yes'
    - update
    - edit synchronization
    - 'true'
  scoring:
    combine: all_pass
- id: webform_content_creator_webform_content_creator_create_config
  version: '1.0'
  applicable_bundles:
  - webform_content_creator
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
- id: webform_content_creator_webform_content_creator_enable_sync
  version: '1.0'
  applicable_bundles:
  - webform_content_creator
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
