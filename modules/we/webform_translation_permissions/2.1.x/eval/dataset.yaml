metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: webform_translation_permissions
  version: 2.1.x
  note: Webform Translation Permissions defines two permissions, 'translate any webform' and 'translate
    own webform', so a user can translate webform config without the broad core 'translate configuration'
    permission. There is no config UI (configure=null); behaviour is permission-driven (plus a custom
    access check and a Translate operation link). Medium cases read which of the two permissions a known
    role holds; hard cases build roles that hold the granular permission WITHOUT 'translate configuration'.
    All roles are namespaced wtp_* and deleted by cleanup/reset. No drush cr (config/entity reads are
    live) to avoid an unrelated shared-site group-module cache-rebuild fault.
questions:
- id: webform_translation_permissions-perms
  input: What permissions does the webform_translation_permissions module add?
  criteria: 'It defines two permissions: ''translate any webform'' and ''translate own webform'' (''own''
    = the current authenticated user owns the webform).'
  bundle: webform_translation_permissions
  rubric_ref: rubric/webform_translation_permissions_webform_translation_permissions_perms@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: webform_translation_permissions-why
  input: Why would I use webform_translation_permissions instead of just granting a user the core 'translate
    configuration' permission?
  criteria: Core's 'translate configuration' lets a user translate every config entity on the site. This
    module scopes translation down to webforms, so you can let someone translate webforms (any, or only
    their own) without granting the broad 'translate configuration' permission.
  bundle: webform_translation_permissions
  rubric_ref: rubric/webform_translation_permissions_webform_translation_permissions_why@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: webform_translation_permissions-deps
  input: What modules does webform_translation_permissions depend on, and does it add any settings page?
  criteria: It depends on the webform module and core config_translation. It has no settings page (configure
    is null); you just grant the two permissions at /admin/people/permissions.
  bundle: webform_translation_permissions
  rubric_ref: rubric/webform_translation_permissions_webform_translation_permissions_deps@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: webform_translation_permissions-own-role
  input: This site has a role named wtp_own_role that was granted one of the webform_translation_permissions
    permissions. Inspect the live role configuration and state which webform-translation permission it
    holds.
  criteria: The wtp_own_role role holds the 'translate own webform' permission (and not 'translate any
    webform').
  bundle: webform_translation_permissions
  rubric_ref: rubric/webform_translation_permissions_webform_translation_permissions_own_role@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/webform_translation_permissions-own-role-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/webform_translation_permissions-own-role-cleanup.sh
- id: webform_translation_permissions-any-role
  input: This site has a role named wtp_any_role configured with a webform_translation_permissions permission.
    Inspect the live role and state exactly which webform-translation permission it grants.
  criteria: The wtp_any_role role holds the 'translate any webform' permission.
  bundle: webform_translation_permissions
  rubric_ref: rubric/webform_translation_permissions_webform_translation_permissions_any_role@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/webform_translation_permissions-any-role-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/webform_translation_permissions-any-role-cleanup.sh
- id: webform_translation_permissions-create-any-role
  input: On this Drupal site, create a role with machine name wtp_translator that can translate ANY webform
    using the webform_translation_permissions module, but must NOT have the site-wide 'translate configuration'
    permission. Apply the change to the live site.
  criteria: A user role wtp_translator exists, holds the 'translate any webform' permission, and does
    NOT hold 'translate configuration'.
  bundle: webform_translation_permissions
  rubric_ref: rubric/webform_translation_permissions_webform_translation_permissions_create_any_role@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/webform_translation_permissions-create-any-role-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/webform_translation_permissions-create-any-role-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/webform_translation_permissions-create-any-role-verify.sh
- id: webform_translation_permissions-create-own-role
  input: On this Drupal site, create a role with machine name wtp_owner that lets a user translate ONLY
    the webforms they own (using webform_translation_permissions), without granting them the ability to
    translate any webform. Apply the change to the live site.
  criteria: A user role wtp_owner exists, holds 'translate own webform', and does NOT hold 'translate
    any webform' (nor 'translate configuration').
  bundle: webform_translation_permissions
  rubric_ref: rubric/webform_translation_permissions_webform_translation_permissions_create_own_role@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/webform_translation_permissions-create-own-role-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/webform_translation_permissions-create-own-role-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/webform_translation_permissions-create-own-role-verify.sh
