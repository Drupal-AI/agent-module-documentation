metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: webform_validation
  version: 2.0.x
  note: 'Webform Validation adds three cross-element rules to Webform elements: equal values (#equal__enabled
    + #equal__components), compare two values (#compare__enabled + #compare__component + #compare__operator
    one of > >= < <= + #compare__custom_error), and some of several (#some_of_several__enabled + #some_of_several__components
    + #some_of_several__completed + #some_of_several__final_validation). No admin page/config schema/permissions/Drush/plugin
    types/configure route. Rules are stored as #-prefixed element properties inside a webform.webform.<id>
    config entity''s elements YAML; runtime validation is WebformValidateConstraint::validate appended
    to the submission form #validate. Supported types: ALLOWED_TYPES (date, datetime, email, hidden, number,
    select, tel, textarea, textfield, webform_document_file, webform_entity_checkboxes, webform_signature,
    webform_time); compare limited to ALLOWED_TYPES_COMPARE (date, datetime, number, webform_time). Medium/hard
    cases are grounded in real webform element config: introspection reads a configured rule; execution
    adds an equal or compare rule to a webform element.'
questions:
- id: webform_validation-rules-list
  input: What cross-field validation rules does the Drupal webform_validation module add to Webform, and
    where in the UI do you configure them?
  criteria: 'Three rules configured per element in the ''Form extra validation'' fieldset when editing
    a webform element: Equal values (components must match), Compare two values (>, >=, <, <=), and Some
    of several (require N of a group of components).'
  bundle: webform_validation
  rubric_ref: rubric/webform_validation_webform_validation_rules_list@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: webform_validation-equal-property
  input: Using the Drupal webform_validation module, how do I make a 'Confirm email' webform element require
    the same value as the 'Email' element? Which element properties store this and where are they saved?
  criteria: 'Enable the ''Equal values'' rule on the Confirm email element and select the Email element.
    This stores #equal__enabled: 1 and #equal__components (a map of element keys) on that element inside
    the webform config entity''s elements YAML.'
  bundle: webform_validation
  rubric_ref: rubric/webform_validation_webform_validation_equal_property@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: webform_validation-compare-types
  input: In the Drupal webform_validation module, which element types can use the 'Compare two values'
    rule, and what operators are available?
  criteria: 'Compare only applies to types in ALLOWED_TYPES_COMPARE: date, datetime, number, webform_time.
    Operators are >, >=, <, <= (set via #compare__operator), with an optional #compare__custom_error message.'
  bundle: webform_validation
  rubric_ref: rubric/webform_validation_webform_validation_compare_types@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: webform_validation-which-rule
  input: On this Drupal site there is a webform with machine id wfv_known. One of its elements has a webform_validation
    cross-field rule configured. Inspect the live webform configuration and state which element has a
    rule, which rule it is, and which element it validates against.
  criteria: 'The wfv_confirm element has an ''Equal values'' rule: #equal__enabled: 1 with #equal__components
    mapping wfv_email, so wfv_confirm must equal wfv_email.'
  bundle: webform_validation
  rubric_ref: rubric/webform_validation_webform_validation_which_rule@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/webform_validation-which-rule-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/webform_validation-which-rule-cleanup.sh
- id: webform_validation-compare-operator
  input: On this Drupal site the webform wfv_compare has a webform_validation 'Compare two values' rule
    on one of its number elements. Inspect the live configuration and state which comparison operator
    is configured and against which element.
  criteria: 'The wfv_max element has #compare__enabled: 1, #compare__component: wfv_min and #compare__operator:
    ''>'', so wfv_min must be greater than wfv_max per the module''s compare semantics.'
  bundle: webform_validation
  rubric_ref: rubric/webform_validation_webform_validation_compare_operator@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/webform_validation-compare-operator-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/webform_validation-compare-operator-cleanup.sh
- id: webform_validation-add-equal
  input: On this Drupal site the webform wfv_task has two email elements, wfv_email and wfv_confirm, with
    no validation. Using the webform_validation module, configure the wfv_confirm element so it must hold
    the same value as wfv_email, and apply the change to the live site.
  criteria: 'On webform wfv_task the wfv_confirm element carries #equal__enabled: 1 and #equal__components
    including wfv_email (set via the element''s ''Form extra validation'' > Equal values, or by editing
    the webform elements config).'
  bundle: webform_validation
  rubric_ref: rubric/webform_validation_webform_validation_add_equal@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/webform_validation-add-equal-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/webform_validation-add-equal-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/webform_validation-add-equal-verify.sh
- id: webform_validation-add-compare
  input: On this Drupal site the webform wfv_range has two number elements, wfv_start and wfv_end, with
    no validation. Using the webform_validation module, add a 'Compare two values' rule to the wfv_end
    element that compares it against wfv_start using the greater-than '>' operator, and apply the change
    to the live site.
  criteria: 'On webform wfv_range the wfv_end element carries #compare__enabled: 1, #compare__component:
    wfv_start and #compare__operator: ''>'' (set via the element''s ''Form extra validation'' > Compare,
    or by editing the webform elements config). Note the module''s compare semantics: with ''>'' the compared-with
    element wfv_start must be greater than wfv_end.'
  bundle: webform_validation
  rubric_ref: rubric/webform_validation_webform_validation_add_compare@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/webform_validation-add-compare-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/webform_validation-add-compare-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/webform_validation-add-compare-verify.sh
