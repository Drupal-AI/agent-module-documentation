rubrics:
- id: webprofiler_webprofiler_what_and_where
  version: '1.0'
  applicable_bundles:
  - webprofiler
  checks:
  - kind: must_contain_any
    values:
    - /admin/config/development/devel/webprofiler
    - profiler
    - toolbar
    - not be used in production
    - development
  scoring:
    combine: all_pass
- id: webprofiler_webprofiler_permissions
  version: '1.0'
  applicable_bundles:
  - webprofiler
  checks:
  - kind: must_contain_any
    values:
    - access webprofiler
    - view webprofiler toolbar
  scoring:
    combine: all_pass
- id: webprofiler_webprofiler_time_metrics
  version: '1.0'
  applicable_bundles:
  - webprofiler
  checks:
  - kind: must_contain_any
    values:
    - tracer_plugin
    - StopwatchTracer
    - settings.php
  scoring:
    combine: all_pass
- id: webprofiler_webprofiler_known_ide
  version: '1.0'
  applicable_bundles:
  - webprofiler
  checks:
  - kind: must_contain_any
    values:
    - vscode://file/%f:%l
  scoring:
    combine: all_pass
- id: webprofiler_webprofiler_configure_redirects
  version: '1.0'
  applicable_bundles:
  - webprofiler
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
- id: webprofiler_webprofiler_known_highlight
  version: '1.0'
  applicable_bundles:
  - webprofiler
  checks:
  - kind: must_contain_any
    values:
    - '37'
  scoring:
    combine: all_pass
- id: webprofiler_webprofiler_configure_query_log
  version: '1.0'
  applicable_bundles:
  - webprofiler
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
