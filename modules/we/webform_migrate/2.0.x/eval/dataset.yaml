metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: webform_migrate
  version: 2.0.x
  note: 'Webform Migrate provides Migrate API source plugins (d6_webform, d7_webform, d6_webform_submission,
    d7_webform_submission; all DrupalSqlBase, source_module=webform) and matching migration definitions
    in migrations/. Webform migrations use destination entity:webform; submissions use entity:webform_submission
    and depend on the webform migration. Two alter hooks (hook_webform_migrate_d7_webform_element_ELEMENT_TYPE_alter
    and the d6 variant, called from buildFormElements()) customize generated Webform elements YAML. No
    admin UI/configure route/permissions/config schema. NOTE for graders: this site''s migrate source-plugin
    manager and `drush migrate:status` currently fatal because an unrelated contrib module (disqus) ships
    a PHP-incompatible migrate source plugin; therefore medium/hard cases are grounded in migrate_plus.migration
    CONFIG ENTITIES that reference webform_migrate''s source plugins by id (config load/save does not
    instantiate the source plugin, so it is unaffected). migrate_plus + migrate_tools are enabled.'
questions:
- id: wm-migration-ids
  input: I'm upgrading a Drupal 7 site's webforms with the webform_migrate module. What are the migration/source
    plugin ids for the D7 webforms and their submissions, and what Migrate destination plugin does each
    use?
  criteria: d7_webform migrates the forms to destination entity:webform; d7_webform_submission migrates
    responses to destination entity:webform_submission (and depends on d7_webform). D6 equivalents are
    d6_webform and d6_webform_submission.
  bundle: webform_migrate
  rubric_ref: rubric/webform_migrate_wm_migration_ids@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: wm-source-base
  input: In webform_migrate, what base class do the migrate source plugins extend, and which database
    do they read from when a migration runs?
  criteria: They extend Drupal\migrate_drupal\Plugin\migrate\source\DrupalSqlBase, which reads the Migrate
    source database connection (the legacy D6/D7 site DB, typically the 'migrate' connection) — not the
    current Drupal site database.
  bundle: webform_migrate
  rubric_ref: rubric/webform_migrate_wm_source_base@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: wm-element-hook
  input: A Drupal 7 webform uses a custom component type that webform_migrate doesn't map correctly. Which
    hook do I implement to customize the generated Webform elements YAML for that element type during
    migration?
  criteria: Implement hook_webform_migrate_d7_webform_element_ELEMENT_TYPE_alter(&$markup, $indent, $element)
    (or the d6 variant), invoked from D7Webform::buildFormElements(); append to or rewrite $markup to
    set the correct '#type' / options for that element type.
  bundle: webform_migrate
  rubric_ref: rubric/webform_migrate_wm_element_hook@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: wm-known-submission-migration
  input: This Drupal site has a migration configuration (a migrate_plus migration config entity) with
    id wm_known_migration that uses one of webform_migrate's source plugins. Inspect the live configuration
    and report the exact source plugin id it uses.
  criteria: wm_known_migration's source.plugin is d7_webform_submission (config migrate_plus.migration.wm_known_migration),
    destination entity:webform_submission.
  bundle: webform_migrate
  rubric_ref: rubric/webform_migrate_wm_known_submission_migration@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/webform_migrate-known-submission-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/webform_migrate-known-submission-cleanup.sh
- id: wm-known-form-migration
  input: On this site there is a migrate_plus migration config entity wm_known_form that migrates D7 webforms
    with webform_migrate. Inspect the live config and state its source plugin id and its Migrate destination
    plugin.
  criteria: wm_known_form uses source.plugin d7_webform and destination.plugin entity:webform (config
    migrate_plus.migration.wm_known_form).
  bundle: webform_migrate
  rubric_ref: rubric/webform_migrate_wm_known_form_migration@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/webform_migrate-known-form-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/webform_migrate-known-form-cleanup.sh
- id: wm-create-form-migration
  input: 'Using webform_migrate on this Drupal site, create a migration (a migrate_plus.migration config
    entity) with id webform_migrate_task that migrates Drupal 7 webforms: use webform_migrate''s D7 webform
    source plugin and the Webform config-entity Migrate destination. Save it to the live site.'
  criteria: A migrate_plus.migration.webform_migrate_task config entity exists with source.plugin = d7_webform
    and destination.plugin = entity:webform.
  bundle: webform_migrate
  rubric_ref: rubric/webform_migrate_wm_create_form_migration@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/webform_migrate-create-form-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/webform_migrate-create-form-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/webform_migrate-create-form-verify.sh
- id: wm-create-submission-migration
  input: 'Using webform_migrate, create a migration config entity (migrate_plus.migration) with id webform_migrate_sub_task
    that migrates Drupal 7 webform SUBMISSIONS: use webform_migrate''s D7 webform submission source plugin
    and the webform submission Migrate destination. Apply it to the live site.'
  criteria: A migrate_plus.migration.webform_migrate_sub_task config entity exists with source.plugin
    = d7_webform_submission and destination.plugin = entity:webform_submission.
  bundle: webform_migrate
  rubric_ref: rubric/webform_migrate_wm_create_submission_migration@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/webform_migrate-create-submission-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/webform_migrate-create-submission-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/webform_migrate-create-submission-verify.sh
