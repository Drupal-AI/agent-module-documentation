metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: webform_entity_handler
  version: 2.0.x
  note: 'Provides one Webform handler plugin id ''webform_entity_handler'' (label Entity) that creates/updates
    a content entity from a submission. No configure route, no permissions, no Drush. State lives in webform.webform.<id>
    under handlers.<handler_id> (id: webform_entity_handler, settings: operation/skip_if_exists/entity_type_id/entity_properties/entity_values/entity_revision/states).
    entity_type_id is ''<type>:<bundle>'' e.g. node:article; operation _default = create new, input:<key>
    = update by element. Medium/hard cases are grounded in real handler config on a seeded webform: introspection
    reads back the handler''s target entity type / operation; execution adds a handler to a handler-less
    webform, or retargets an existing handler, verified via Webform::getHandlers() on the live site.'
questions:
- id: webform_entity_handler-what-it-does
  input: I want a Drupal Webform to create a node every time someone submits it. Which module/handler
    does that and how do I attach it to a webform?
  criteria: Use the Webform Entity Handler module's 'Entity' handler (plugin id webform_entity_handler).
    On the webform go to Settings > Emails/Handlers > Add handler > Entity, pick the entity type/bundle
    and operation, and map submission elements to the entity's fields.
  bundle: webform_entity_handler
  rubric_ref: rubric/webform_entity_handler_webform_entity_handler_what_it_does@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: webform_entity_handler-settings-keys
  input: In the webform_entity_handler 'Entity' handler settings, which key stores the target entity type
    and bundle, and what is the format of its value? How do you tell it to create a new entity versus
    update an existing one?
  criteria: 'entity_type_id holds ''<entity_type>:<bundle>'' (e.g. node:article). The operation setting
    controls create vs update: ''_default'' creates a new entity, while ''input:<element_key>'' updates
    the entity whose ID is stored in that submission element.'
  bundle: webform_entity_handler
  rubric_ref: rubric/webform_entity_handler_webform_entity_handler_settings_keys@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: webform_entity_handler-mapping-syntax
  input: With the webform_entity_handler Entity handler, how do I map a submission element's value onto
    an entity field, and how do I set a field to NULL? Do tokens work?
  criteria: In entity_values[field][property] use 'input:<element_key>' (pipe path 'input:parent|child'
    for composites) to copy a submitted value, '_null_' to set NULL, or any literal which is token-replaced.
    The handler has tokens=TRUE so tokens are supported everywhere.
  bundle: webform_entity_handler
  rubric_ref: rubric/webform_entity_handler_webform_entity_handler_mapping_syntax@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: webform_entity_handler-known-target
  input: On this Drupal site the webform with machine name weh_known has a Webform Entity Handler attached.
    Inspect the live webform configuration and state which entity type and bundle that handler creates.
  criteria: The handler on weh_known has settings.entity_type_id = node:article, so it creates Article
    nodes (operation _default = create new).
  bundle: webform_entity_handler
  rubric_ref: rubric/webform_entity_handler_webform_entity_handler_known_target@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/webform_entity_handler-known-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/webform_entity_handler-known-cleanup.sh
- id: webform_entity_handler-known-operation
  input: The webform weh_known on this site has a Webform Entity Handler. Inspect its live configuration
    and say whether it is configured to create a brand-new entity or to update an existing one (name the
    operation value).
  criteria: The handler settings.operation is '_default', which means it creates a new entity (an existing-entity
    update would use 'input:<element_key>' or a custom entity ID).
  bundle: webform_entity_handler
  rubric_ref: rubric/webform_entity_handler_webform_entity_handler_known_operation@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/webform_entity_handler-known-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/webform_entity_handler-known-cleanup.sh
- id: webform_entity_handler-add-handler
  input: On this Drupal site there is a webform with machine name weh_task that currently has no handlers.
    Using webform_entity_handler, add an 'Entity' handler to it that creates a node of type Article (node:article)
    on completed submissions, and save it to the live site.
  criteria: The webform weh_task gains a handler with plugin id webform_entity_handler whose settings.entity_type_id
    = node:article (add it via the handler manager or the Handlers UI and save the webform).
  bundle: webform_entity_handler
  rubric_ref: rubric/webform_entity_handler_webform_entity_handler_add_handler@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
