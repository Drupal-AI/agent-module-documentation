    verify: agent-module-documentation/evaluation/verify/webform_entity_handler-add-verify.sh
- id: webform_entity_handler-retarget
  input: The webform weh_retarget on this site has a Webform Entity Handler that currently creates Article
    nodes (node:article). Change that handler so it creates Basic page nodes (node:page) instead, and
    apply the change to the live site.
  criteria: On weh_retarget the webform_entity_handler handler's settings.entity_type_id is changed from
    node:article to node:page and the webform is saved.
  bundle: webform_entity_handler
  rubric_ref: rubric/webform_entity_handler_webform_entity_handler_retarget@1.0
