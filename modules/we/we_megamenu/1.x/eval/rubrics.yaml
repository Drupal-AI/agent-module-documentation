rubrics:
- id: we_megamenu_we_megamenu_where_stored
  version: '1.0'
  applicable_bundles:
  - we_megamenu
  checks:
  - kind: must_contain_any
    values:
    - we_megamenu
    - data_config
    - database table
    - menu_name
    - (menu_name, theme)
  scoring:
    combine: all_pass
- id: we_megamenu_we_megamenu_render_block
  version: '1.0'
  applicable_bundles:
  - we_megamenu
  checks:
  - kind: must_contain_any
    values:
    - we_megamenu_block
    - we_megamenu_block:main
    - Place block
    - Mega Menu
  scoring:
    combine: all_pass
- id: we_megamenu_we_megamenu_permission_path
  version: '1.0'
  applicable_bundles:
  - we_megamenu
  checks:
  - kind: must_contain_any
    values:
    - administer we_megamenu
    - /admin/structure/we-mega-menu
  scoring:
    combine: all_pass
- id: we_megamenu_we_megamenu_open_mode
  version: '1.0'
  applicable_bundles:
  - we_megamenu
  checks:
  - kind: must_contain_any
    values:
    - click
    - clicked
  scoring:
    combine: all_pass
- id: we_megamenu_we_megamenu_which_configured
  version: '1.0'
  applicable_bundles:
  - we_megamenu
  checks:
  - kind: must_contain_any
    values:
    - we_mm_a
  scoring:
    combine: all_pass
- id: we_megamenu_we_megamenu_build_click
  version: '1.0'
  applicable_bundles:
  - we_megamenu
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
- id: we_megamenu_we_megamenu_place_block
  version: '1.0'
  applicable_bundles:
  - we_megamenu
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
