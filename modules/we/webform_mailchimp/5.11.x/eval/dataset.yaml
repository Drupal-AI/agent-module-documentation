metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: webform_mailchimp
  version: 5.11.x
  note: 'Webform MailChimp provides one Webform handler (plugin id ''mailchimp'') that subscribes webform
    submitters to a Mailchimp audience. Handler settings (schema webform.handler.mailchimp): list (audience
    id), email (webform element), double_optin (bool default TRUE), mergevars (YAML), interest_groups
    (nested sequence), control (gate field). Actually subscribing needs a Mailchimp API key + audience
    (external, in the mailchimp module), so all medium/hard cases are grounded in the LOCAL webform-handler
    config verifiable via drush php:eval on throwaway webforms (wmc_*): the ''list'' is just a stored
    string here. Introspection reads back the target list and the double-opt-in/email settings; execution
    adds and configures the handler.'
questions:
- id: webform_mailchimp-handler-id
  input: How do I make a webform subscribe people to a Mailchimp audience using the webform_mailchimp
    module? What is the handler's plugin id and how do I add it?
  criteria: Add the Webform handler with plugin id 'mailchimp' to the webform (Settings -> Handlers ->
    Add handler -> MailChimp). It subscribes submitters to the configured audience on submit.
  bundle: webform_mailchimp
  rubric_ref: rubric/webform_mailchimp_webform_mailchimp_handler_id@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: webform_mailchimp-settings
  input: What does the webform_mailchimp handler let me configure, and where does the Mailchimp API key
    come from?
  criteria: On the handler you set the target list (audience), which webform element is the email, double_optin,
    a mergevars YAML mapping to Mailchimp merge fields, interest_groups, and a control field. The API
    key and audience metadata come from the separate Mailchimp module, not this handler.
  bundle: webform_mailchimp
  rubric_ref: rubric/webform_mailchimp_webform_mailchimp_settings@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: webform_mailchimp-hook
  input: Which hook does webform_mailchimp provide to change the Mailchimp merge fields before a submission
    is sent?
  criteria: Implement hook_webform_mailchimp_lists_mergevars_alter(&$mergevars, $submission, $handler)
    to add or rewrite merge fields before they are sent to Mailchimp.
  bundle: webform_mailchimp
  rubric_ref: rubric/webform_mailchimp_webform_mailchimp_hook@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: webform_mailchimp-known-list
  input: A webform named wmc_known on this site sends submissions to a Mailchimp audience. Inspect the
    live webform configuration and tell me the Mailchimp list (audience) id its mailchimp handler is configured
    to use.
  criteria: The wmc_known webform's mailchimp handler targets list 'eval_audience_9'.
  bundle: webform_mailchimp
  rubric_ref: rubric/webform_mailchimp_webform_mailchimp_known_list@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/webform_mailchimp-list-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/webform_mailchimp-list-cleanup.sh
- id: webform_mailchimp-known-optin
  input: Inspect the mailchimp handler on the wmc_optin webform and tell me whether double opt-in is enabled
    and which webform element it uses as the subscriber email address.
  criteria: On wmc_optin the mailchimp handler has double_optin = false and uses the 'contact_email' element
    for the email address.
  bundle: webform_mailchimp
  rubric_ref: rubric/webform_mailchimp_webform_mailchimp_known_optin@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/webform_mailchimp-optin-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/webform_mailchimp-optin-cleanup.sh
- id: webform_mailchimp-add-handler
  input: On the webform wmc_task, add the webform_mailchimp handler so that submissions are subscribed
    to the Mailchimp audience with id 'eval_list_777', using the webform's 'email' element as the address.
    Apply the change to the live site.
  criteria: Add a webform handler (plugin id mailchimp) to wmc_task with settings.list = 'eval_list_777'
    and settings.email = 'email', then save. verify checks the webform has a mailchimp handler whose list
    is eval_list_777.
  bundle: webform_mailchimp
  rubric_ref: rubric/webform_mailchimp_webform_mailchimp_add_handler@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/webform_mailchimp-add-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/webform_mailchimp-add-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/webform_mailchimp-add-verify.sh
- id: webform_mailchimp-disable-optin
  input: On the webform wmc_cfg, add the webform_mailchimp handler configured with double opt-in DISABLED
    (single opt-in). Apply the change to the live site.
  criteria: Add a mailchimp handler to wmc_cfg with settings.double_optin = FALSE and save. verify checks
    the webform has a mailchimp handler whose double_optin is exactly FALSE.
  bundle: webform_mailchimp
  rubric_ref: rubric/webform_mailchimp_webform_mailchimp_disable_optin@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/webform_mailchimp-nooptin-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/webform_mailchimp-nooptin-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/webform_mailchimp-nooptin-verify.sh
