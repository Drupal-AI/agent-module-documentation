rubrics:
- id: webform_node_analysis_webform_node_analysis_node_route
  version: '1.0'
  applicable_bundles:
  - webform_node_analysis
  checks:
  - kind: must_contain_any
    values:
    - /node/{node}/webform/results/analysis
    - results/analysis
    - field_name
  scoring:
    combine: all_pass
- id: webform_node_analysis_webform_node_analysis_requires_field
  version: '1.0'
  applicable_bundles:
  - webform_node_analysis
  checks:
  - kind: must_contain_any
    values:
    - webform field
    - field_config
    - deriver
    - local task
    - WebformNodeAnalysisLocalTask
  scoring:
    combine: all_pass
- id: webform_node_analysis_webform_node_analysis_storage_and_block
  version: '1.0'
  applicable_bundles:
  - webform_node_analysis
  checks:
  - kind: must_contain_any
    values:
    - third party setting
    - third_party_settings
    - webform_analysis
    - webform_node_analysis_block
  scoring:
    combine: all_pass
- id: webform_node_analysis_webform_node_analysis_introspect_chart
  version: '1.0'
  applicable_bundles:
  - webform_node_analysis
  checks:
  - kind: must_contain_any
    values:
    - ColumnChart
    - newsletter
  scoring:
    combine: all_pass
- id: webform_node_analysis_webform_node_analysis_introspect_draft
  version: '1.0'
  applicable_bundles:
  - webform_node_analysis
  checks:
  - kind: must_contain_any
    values:
    - in_draft
    - draft
    - satisfaction
  scoring:
    combine: all_pass
- id: webform_node_analysis_webform_node_analysis_configure_column
  version: '1.0'
  applicable_bundles:
  - webform_node_analysis
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
- id: webform_node_analysis_webform_node_analysis_configure_pie
  version: '1.0'
  applicable_bundles:
  - webform_node_analysis
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
