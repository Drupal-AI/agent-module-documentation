metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: webform_analysis
  version: 1.2.x
  note: 'Webform Analysis adds a per-webform Analysis results tab (/admin/structure/webform/manage/{webform}/results/analysis,
    route entity.webform.results_analysis) that charts submission stats. Its configuration is stored as
    THIRD-PARTY SETTINGS on the webform config entity under namespace ''webform_analysis'': components
    (element keys array), chart_type (''''=Table|PieChart|ColumnChart), start_date, end_date (timestamps),
    in_draft (bool). Chart choices come from WebformAnalysis::getChartTypeOptions(). No global settings
    page, no own permission (reuses webform''s view-any-submission access), no Drush. Medium/hard cases
    use a dedicated fixture webform ''wanalysis_fixture'' (elements: satisfaction select, newsletter checkbox)
    and only toggle its third-party settings, which is a clean, route-neutral operation on this shared
    site.'
questions:
- id: webform_analysis-chart-and-tab
  input: On a Drupal site with the webform_analysis module, where do I view the statistics/analysis for
    a webform's submissions, and what chart display types does the module offer?
  criteria: Each webform gets an 'Analysis' tab under its Results at /admin/structure/webform/manage/{webform}/results/analysis
    (route entity.webform.results_analysis). Chart types (WebformAnalysis::getChartTypeOptions) are Table
    (''), PieChart, and ColumnChart.
  bundle: webform_analysis
  rubric_ref: rubric/webform_analysis_webform_analysis_chart_and_tab@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: webform_analysis-where-stored
  input: In the webform_analysis module, where are a webform's analysis settings (which elements to analyse
    and the chart type) stored, and what are the setting keys?
  criteria: 'They are stored as third-party settings on the webform config entity under the ''webform_analysis''
    namespace: components (array of element keys), chart_type ('''' | PieChart | ColumnChart), start_date,
    end_date (timestamps) and in_draft (bool). There is no global settings page.'
  bundle: webform_analysis
  rubric_ref: rubric/webform_analysis_webform_analysis_where_stored@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: webform_analysis-code-and-block
  input: Using the webform_analysis module, how would I compute the count of each submitted value for
    a webform element in code, and what is the id of the block the module provides for embedding analysis?
  criteria: 'Instantiate the handler: $a = new Drupal\webform_analysis\WebformAnalysis($webform); then
    $a->getComponentValuesCount(''element_key'') returns value => count (querying webform_submission_data,
    honouring in_draft and date filters). The provided block plugin id is webform_analysis_block.'
  bundle: webform_analysis
  rubric_ref: rubric/webform_analysis_webform_analysis_code_and_block@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: webform_analysis-introspect-charttype
  input: On this site, the webform with id 'wanalysis_fixture' has webform_analysis configured. Inspect
    the live configuration and report which chart type it uses and which element(s) it analyses.
  criteria: The wanalysis_fixture webform's third-party settings under webform_analysis have chart_type
    'PieChart' and components ['satisfaction'].
  bundle: webform_analysis
  rubric_ref: rubric/webform_analysis_webform_analysis_introspect_charttype@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/webform_analysis-introspect-charttype-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/webform_analysis-introspect-charttype-cleanup.sh
- id: webform_analysis-introspect-components
  input: The webform 'wanalysis_fixture' on this site has webform_analysis set up to analyse some of its
    elements and has a setting about draft submissions. Inspect the live configuration and report which
    elements are analysed and whether draft submissions are included.
  criteria: wanalysis_fixture's webform_analysis third-party settings have components ['satisfaction','newsletter']
    and in_draft = true (draft submissions are included).
  bundle: webform_analysis
  rubric_ref: rubric/webform_analysis_webform_analysis_introspect_components@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/webform_analysis-introspect-components-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/webform_analysis-introspect-components-cleanup.sh
- id: webform_analysis-configure-column
  input: On this Drupal site, use the webform_analysis module to configure the webform 'wanalysis_fixture'
    so that its 'satisfaction' element is analysed and displayed as a Column Chart. Apply the change to
    the live site.
  criteria: 'Set the wanalysis_fixture webform''s webform_analysis third-party settings: components to
    include ''satisfaction'' and chart_type to ''ColumnChart'' (e.g. $w->setThirdPartySetting(''webform_analysis'',''components'',[''satisfaction'']);
    $w->setThirdPartySetting(''webform_analysis'',''chart_type'',''ColumnChart''); $w->save();).'
  bundle: webform_analysis
  rubric_ref: rubric/webform_analysis_webform_analysis_configure_column@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/webform_analysis-configure-column-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/webform_analysis-configure-column-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/webform_analysis-configure-column-verify.sh
- id: webform_analysis-configure-pie
  input: On my Drupal site I want the results of the 'satisfaction' question on the webform 'wanalysis_fixture'
    shown as a pie chart on that webform's analysis page. Set that up using the webform analysis module
    and save it.
  criteria: 'Set the wanalysis_fixture webform''s webform_analysis third-party settings: components to
    include ''satisfaction'' and chart_type to ''PieChart'', then save the webform.'
  bundle: webform_analysis
  rubric_ref: rubric/webform_analysis_webform_analysis_configure_pie@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-layman
    reset: agent-module-documentation/evaluation/verify/webform_analysis-configure-pie-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/webform_analysis-configure-pie-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/webform_analysis-configure-pie-verify.sh
