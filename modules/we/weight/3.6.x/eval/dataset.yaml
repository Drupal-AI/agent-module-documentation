metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: weight
  version: 3.6.x
  note: Weight ships one field type plus its widget, formatter, and a Views drag-order integration; it
    has no config UI, permissions, services, or plugin types. Cases are `recipe` (response-graded) probing
    documented facts an agent would otherwise read source to answer; no site mutation.
questions:
- id: weight-field-type-machine-name
  input: On a Drupal 11 site I want to manually order nodes. Which field type does the Weight module add,
    and what is its machine name?
  criteria: The module adds a single field type with machine name `weight`, added to a bundle via Manage
    fields → Add field → General → Weight.
  bundle: weight
  rubric_ref: rubric/weight_weight_field_type_machine_name@1.0
  tags:
  - mode:recipe
- id: weight-range-setting
  input: When adding a Weight field, which setting controls the span of selectable weights, what is its
    default, and what values does a range of 20 allow?
  criteria: The `range` field setting (default 20) makes the widget offer every integer from -range to
    +range, so a range of 20 allows weights from -20 to 20.
  bundle: weight
  rubric_ref: rubric/weight_weight_range_setting@1.0
  tags:
  - mode:recipe
- id: weight-default-widget
  input: What is the default widget for a Weight field on a Drupal site, and what UI does it present to
    editors?
  criteria: The default widget is the Weight Selector (`weight_selector`), a select list of every integer
    from -range to +range.
  bundle: weight
  rubric_ref: rubric/weight_weight_default_widget@1.0
  tags:
  - mode:recipe
- id: weight-sort-view
  input: I added a weight field but my list still isn't reordered. How do I make a View or query actually
    display entities in weight order?
  criteria: Storing a weight does not reorder anything; add a Sort criterion (or query ->sort()) on the
    weight field's `_value` column ascending so lower weights come first.
  bundle: weight
  rubric_ref: rubric/weight_weight_sort_view@1.0
  tags:
  - mode:recipe
- id: weight-views-drag-order
  input: How do I build a drag-and-drop reorder screen for entities using the Weight module and Views?
  criteria: Create a table View, add the Weight Selector (`weight_selector`) Views field handler; weight's
    hook_preprocess_views_view_table() attaches tabledrag so rows become draggable and saved weights write
    back to each entity on submit.
  bundle: weight
  rubric_ref: rubric/weight_weight_views_drag_order@1.0
  tags:
  - mode:recipe
- id: weight-unsigned-storage
  input: Which Weight field storage setting restricts stored values to non-negative integers, and what
    is its default?
  criteria: The storage-level `unsigned` setting (default false) restricts the integer column to non-negative
    values.
  bundle: weight
  rubric_ref: rubric/weight_weight_unsigned_storage@1.0
  tags:
  - mode:recipe
- id: weight-dependencies
  input: What Drupal modules does the Weight module depend on?
  criteria: Only core's Field module (drupal:field); it requires no modules outside Drupal core.
  bundle: weight
  rubric_ref: rubric/weight_weight_dependencies@1.0
  tags:
  - mode:recipe
- id: weight-default-formatter
  input: Which formatter is used by default to display a Weight field value, and does the module ship
    its own formatter?
  criteria: The default formatter is core's `number_integer`; the module also ships a minimal `default_weight`
    formatter that prints the raw value.
  bundle: weight
  rubric_ref: rubric/weight_weight_default_formatter@1.0
  tags:
  - mode:recipe
