rubrics:
- id: webform_spam_words_wsw_global_config_keys
  version: '1.0'
  applicable_bundles:
  - webform_spam_words
  checks:
  - kind: must_contain_any
    values:
    - webform_spam_words.settings
  scoring:
    combine: all_pass
- id: webform_spam_words_wsw_configure_route_permission
  version: '1.0'
  applicable_bundles:
  - webform_spam_words
  checks:
  - kind: must_contain_any
    values:
    - edit webform spam words
  scoring:
    combine: all_pass
- id: webform_spam_words_wsw_handler_plugin_id
  version: '1.0'
  applicable_bundles:
  - webform_spam_words
  checks:
  - kind: must_contain_any
    values:
    - webform_spam_words
  scoring:
    combine: all_pass
- id: webform_spam_words_wsw_known_config_field
  version: '1.0'
  applicable_bundles:
  - webform_spam_words
  checks:
  - kind: must_contain_any
    values:
    - subject
  scoring:
    combine: all_pass
- id: webform_spam_words_wsw_known_config_message
  version: '1.0'
  applicable_bundles:
  - webform_spam_words
  checks:
  - kind: must_contain_any
    values:
    - Your submission was rejected due to prohibited content
  scoring:
    combine: all_pass
- id: webform_spam_words_wsw_global_config_build
  version: '1.0'
  applicable_bundles:
  - webform_spam_words
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
- id: webform_spam_words_wsw_handler_attach
  version: '1.0'
  applicable_bundles:
  - webform_spam_words
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
