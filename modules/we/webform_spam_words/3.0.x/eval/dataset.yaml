metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: webform_spam_words
  version: 3.0.x
  note: 'Webform Spam Words has two independent, easily-conflated pieces: a global settings form (config
    object webform_spam_words.settings) that is never read by anything except itself, and a per-webform
    WebformHandler plugin (id webform_spam_words) whose defaultConfiguration() ships spam_words as a bare
    string (''SEO'') rather than an array -- because validateSpam() does foreach($spam_words as $word),
    an untouched default handler silently blocks nothing (verified: PHP emits a foreach-on-scalar warning
    and skips the loop body). Easy cases probe the config keys/route/permission and the handler''s real
    behavior. Medium cases write two distinct known global configs and ask the agent to read back a field,
    an error message. Hard cases are (1) build the global settings config to a specific spam_words+spam_field_name
    combination (reset restores shipped defaults, which correctly fails verify), and (2) attach a real
    webform_spam_words handler (as an array, per the footgun above) to a namespaced webform wsw_test.'
questions:
- id: wsw-global-config-keys
  input: The Drupal contrib module webform_spam_words has a global settings config object. Give its machine
    name, its three configuration keys, the default value of the field-name key, and one or two of the
    default spam words it ships with.
  criteria: Config object `webform_spam_words.settings` with keys `spam_words` (sequence, defaults SEO,
    Digital Marketing, Click Here, unsubscribe, FREE, trial), `spam_text_message` (string), and `spam_field_name`
    (string, default `message`).
  bundle: webform_spam_words
  rubric_ref: rubric/webform_spam_words_wsw_global_config_keys@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: wsw-configure-route-permission
  input: What is the admin path and route name for webform_spam_words' global settings form, and which
    permission(s) let a user access it?
  criteria: 'Route `webform_spam_words.config` at `/admin/config/webform/webform-spam-words`; access requires
    EITHER `administer webform` OR the module''s own `edit webform spam words` permission (the routing.yml
    uses `_permission: ''administer webform+edit webform spam words''`, and `+` is Drupal''s OR syntax
    for route permissions).'
  bundle: webform_spam_words
  rubric_ref: rubric/webform_spam_words_wsw_configure_route_permission@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: wsw-handler-plugin-id
  input: webform_spam_words provides a Webform submission handler. What is its plugin id, and what does
    it actually do when a submission is validated?
  criteria: Plugin id `webform_spam_words` (class BlockWordsWebformHandler). On validateForm() it splits
    its configured spam_field_name on commas, and for each named field checks the (lowercased) submitted
    value for any configured spam word as a substring; a match calls setErrorByName() with the configured
    spam_text_message, blocking the submission. Attaching this handler to a webform is required -- the
    module's global settings form alone blocks nothing.
  bundle: webform_spam_words
  rubric_ref: rubric/webform_spam_words_wsw_handler_plugin_id@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: wsw-known-config-field
  input: This Drupal site's webform_spam_words global settings (webform_spam_words.settings) have already
    been configured with a specific field name to check. Inspect the live config and tell me which single
    field name is currently set as spam_field_name.
  criteria: 'spam_field_name is `subject` (spam_words also includes `casino`, spam_text_message is `Blocked:
    spam detected`).'
  bundle: webform_spam_words
  rubric_ref: rubric/webform_spam_words_wsw_known_config_field@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/webform_spam_words-known-config-field-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/webform_spam_words-known-config-field-cleanup.sh
- id: wsw-known-config-message
  input: This Drupal site's webform_spam_words global settings (webform_spam_words.settings) have already
    been configured with a custom error message. Inspect the live config and give me the exact spam_text_message
    text that would be shown to a blocked submitter.
  criteria: spam_text_message is `Your submission was rejected due to prohibited content.` (spam_field_name
    is `email,phone`, spam_words includes `lottery` and `inheritance`).
  bundle: webform_spam_words
  rubric_ref: rubric/webform_spam_words_wsw_known_config_message@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/webform_spam_words-known-config-message-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/webform_spam_words-known-config-message-cleanup.sh
- id: wsw-global-config-build
  input: On this Drupal site, configure webform_spam_words' global settings (webform_spam_words.settings)
    so that the spam word list includes 'viagra' and the field name being checked is exactly 'email'.
    Apply the change to the live site's configuration.
  criteria: webform_spam_words.settings has spam_words containing `viagra` and spam_field_name exactly
    `email`, e.g. via `drush config:set webform_spam_words.settings spam_field_name email` and adding
    `viagra` to the spam_words sequence, or by saving the settings form at /admin/config/webform/webform-spam-words.
  bundle: webform_spam_words
  rubric_ref: rubric/webform_spam_words_wsw_global_config_build@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/webform_spam_words-global-config-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/webform_spam_words-global-config-reset.sh
    verify: agent-module-documentation/evaluation/verify/webform_spam_words-global-config-verify.sh
- id: wsw-handler-attach
  input: On this Drupal site there is a webform 'wsw_test' with a 'message' textarea element but no spam
    protection. Attach the webform_spam_words handler (plugin id webform_spam_words) to this webform so
    it checks the 'message' field, giving it at least one spam word. Remember spam_words must be configured
    as an array, not a bare string, or the handler silently does nothing. Apply the change to the live
    webform.
  criteria: 'The wsw_test webform''s `handlers` config gains an entry with `id: webform_spam_words`, `settings.spam_field_name`
    including `message`, and `settings.spam_words` as a non-empty array of one or more words, e.g. via
    Webform::load(''wsw_test'')->addWebformHandler() with a handler instance from plugin.manager.webform.handler,
    or by writing the handler block directly into the webform''s config and saving.'
  bundle: webform_spam_words
  rubric_ref: rubric/webform_spam_words_wsw_handler_attach@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/webform_spam_words-handler-build-reset.sh
