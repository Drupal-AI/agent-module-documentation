metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: webform_xlsx_export
  version: 1.6.x
  note: 'Webform XLSX Export contributes exactly one plugin: @WebformExporter(id = "xlsx", label = "XLSX")
    in Drupal\webform_xlsx_export\Plugin\WebformExporter\XlsxExporter, extending Webform''s TabularBaseWebformExporter
    and writing real Office Open XML via phpoffice/phpspreadsheet. It has no configure route (configure:
    null), no permissions, no config object, no config schema and no Drush commands of its own -- it is
    used through Webform''s Results->Download form and Webform''s own `drush webform:export --exporter=xlsx`.
    Per-webform saved export settings live in webform *state* under the key ''results.export'' ($webform->getState(''results.export'')),
    not in config. hook_requirements() reports whether PhpSpreadsheet is installed. Medium cases read
    back that real webform state; hard cases produce a real .xlsx file and a real saved export setting.'
questions:
- id: webform_xlsx_export-plugin-id
  input: On a Drupal 11 site with the webform_xlsx_export module, what is the machine id of the exporter
    plugin it adds, which Webform base class does it extend, and which PHP library does it need?
  criteria: The plugin is @WebformExporter(id = "xlsx", label = "XLSX"), class Drupal\webform_xlsx_export\Plugin\WebformExporter\XlsxExporter,
    extending Drupal\webform\Plugin\WebformExporter\TabularBaseWebformExporter. It requires phpoffice/phpspreadsheet
    (^3.5), which hook_requirements() checks on the status report.
  bundle: webform_xlsx_export
  rubric_ref: rubric/webform_xlsx_export_webform_xlsx_export_plugin_id@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: webform_xlsx_export-drush-usage
  input: How do I export the submissions of a webform called 'contact' to a real Excel .xlsx file from
    the command line on a Drupal site that has webform_xlsx_export installed? Does the module add its
    own Drush command?
  criteria: 'The module adds no Drush command of its own; it plugs into Webform''s own command: drush
    webform:export contact --exporter=xlsx --destination=/tmp/contact.xlsx (alias wfx). --destination
    is effectively required because the default is to print the export to stdout.'
  bundle: webform_xlsx_export
  rubric_ref: rubric/webform_xlsx_export_webform_xlsx_export_drush_usage@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: webform_xlsx_export-why-and-quirks
  input: Why would I use the Drupal webform_xlsx_export module instead of the 'table' export that Webform
    already provides? And how does the module make sure a submitted answer that starts with '=' does not
    end up as a spreadsheet formula?
  criteria: Webform's table exporter writes an HTML table with an .xls extension, which recent Excel versions
    warn about because it is not a real Excel file; this module writes genuine Office Open XML with PhpSpreadsheet.
    In writeSubmission(), any string value longer than one character that begins with '=' is written using
    a PhpOffice\PhpSpreadsheet\Cell\StringValueBinder so it is stored as text and not evaluated as a formula.
  bundle: webform_xlsx_export
  rubric_ref: rubric/webform_xlsx_export_webform_xlsx_export_why_and_quirks@1.0
  tags:
  - mode:recipe
  - difficulty:easy
