metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: akamai
  version: 5.1.x
  note: 'All cases are grounded in the akamai.settings config object (config/schema/akamai.schema.yml)
    and the module''s routes/permissions/plugins. No case makes a real call to Akamai''s API; medium/hard
    cases only read/write local Drupal config, so they are safe offline. Baseline (config/install/akamai.settings.yml):
    disabled=FALSE, storage_method=file, timeout=5, domain={production:TRUE,staging:FALSE}, action_v3={delete:TRUE,invalidate:FALSE},
    edge_cache_tag_header=FALSE.'
questions:
- id: akamai-killswitch
  input: On a Drupal site using the akamai module, how do I temporarily stop the site from sending any
    cache-clear/purge calls to Akamai without uninstalling the module? Name the setting and where it lives.
  criteria: Set the 'disabled' key in the akamai.settings config to TRUE (the 'Disable all calls to Akamai'
    killswitch on /admin/config/akamai/config), e.g. `drush config:set akamai.settings disabled 1`.
  bundle: akamai
  rubric_ref: rubric/akamai_akamai_killswitch@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: akamai-credential-storage
  input: The akamai module can store its API credentials (client token, client secret, access token) in
    two different ways. What are they, and which config key selects between them?
  criteria: The storage_method setting is either 'file' (an .edgerc file referenced by edgerc_path/edgerc_section)
    or 'key' (the Key module, where client_token/client_secret/access_token hold Key entity IDs). The
    'key' option only appears when the key module is enabled.
  bundle: akamai
  rubric_ref: rubric/akamai_akamai_credential_storage@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: akamai-tag-purger
  input: Using the akamai module with the Purge module, which purger plugin clears content from Akamai
    by cache tag rather than by URL, and what response header does the module emit so Akamai indexes Drupal's
    cache tags?
  criteria: The akamai_tag purger (AkamaiTagPurger) purges by cache tag; enabling edge_cache_tag_header
    makes the CacheableResponseSubscriber send the Edge-Cache-Tag response header carrying Drupal cache
    tags.
  bundle: akamai
  rubric_ref: rubric/akamai_akamai_tag_purger@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: akamai-which-network
  input: On this Drupal site the akamai module is configured. Which Akamai network is it currently set
    to purge against — production or staging? Inspect the live configuration to answer.
  criteria: 'staging: in akamai.settings the domain mapping has staging=TRUE and production=FALSE.'
  bundle: akamai
  rubric_ref: rubric/akamai_akamai_which_network@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/akamai-which-network-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/akamai-which-network-cleanup.sh
- id: akamai-timeout-value
  input: On this Drupal site, inspect the akamai module configuration and tell me the API request timeout
    (in seconds) that is currently configured.
  criteria: '17 seconds: akamai.settings:timeout is 17.'
  bundle: akamai
  rubric_ref: rubric/akamai_akamai_timeout_value@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/akamai-timeout-value-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/akamai-timeout-value-cleanup.sh
- id: akamai-enable-edge-cache-tag
  input: On this Drupal site, configure the akamai module so that responses include the Edge-Cache-Tag
    header (exposing Drupal cache tags to Akamai). Apply the change to the live site.
  criteria: akamai.settings:edge_cache_tag_header is set to TRUE (e.g. `drush config:set akamai.settings
    edge_cache_tag_header 1 -y`).
  bundle: akamai
  rubric_ref: rubric/akamai_akamai_enable_edge_cache_tag@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/akamai-enable-edge-cache-tag-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/akamai-enable-edge-cache-tag-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/akamai-enable-edge-cache-tag-verify.sh
- id: akamai-switch-to-staging
  input: On this Drupal site, configure the akamai module to purge against the Akamai STAGING network
    instead of production. Apply the change to the live configuration.
  criteria: 'In akamai.settings the domain mapping is {staging: TRUE, production: FALSE}.'
  bundle: akamai
  rubric_ref: rubric/akamai_akamai_switch_to_staging@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/akamai-switch-to-staging-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/akamai-switch-to-staging-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/akamai-switch-to-staging-verify.sh
