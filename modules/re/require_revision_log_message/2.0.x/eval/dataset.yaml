metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: require_revision_log_message
  version: 2.0.x
  note: 'Require Revision Log Message makes the node revision log message a required field for selected
    content types. Its entire persistent state is one config object, require_revision_log_message.adminsettings,
    with two keys: content_types (a sequence of node-type machine names the rule applies to) and require_for_new_nodes
    (boolean; when FALSE the rule only fires on edits of existing nodes). Two permissions: administer
    require_revision_log_message (settings form access) and bypass require_revision_log_message (skip
    the requirement). Configure route require_revision_log_message.admin_settings_form at /admin/config/require-revision-log/adminsettings.
    No services, plugins, drush, or entities. All medium/hard cases are grounded in that real config object
    and verified with drush; the shipped baseline is content_types {} + require_for_new_nodes false (the
    config object does not exist on a fresh install).'
questions:
- id: rrlm-config-key
  input: In the Drupal contrib module require_revision_log_message, which config object and key store
    the list of content types that must have a revision log message filled in?
  criteria: The config object require_revision_log_message.adminsettings holds a content_types sequence
    of node-type machine names; a type is 'on' when its machine name is a value in that list. A separate
    boolean require_for_new_nodes controls whether the rule also applies to new nodes.
  bundle: require_revision_log_message
  rubric_ref: rubric/require_revision_log_message_rrlm_config_key@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: rrlm-permissions
  input: A site admin wants some editors to be exempt from require_revision_log_message so they can save
    nodes without a revision log message. Which permission do they need, and what is the other permission
    this module defines?
  criteria: Grant the exempt role the 'bypass require_revision_log_message' permission (the form alter
    early-returns for users who have it). The other permission, 'administer require_revision_log_message',
    gates the settings form.
  bundle: require_revision_log_message
  rubric_ref: rubric/require_revision_log_message_rrlm_permissions@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: rrlm-new-nodes-behavior
  input: By default, does require_revision_log_message force a revision log message when an editor creates
    a brand-new node, or only when editing an existing one? How do you change that?
  criteria: By default it only applies when editing an existing node (a new node is skipped because require_for_new_nodes
    defaults to FALSE). Enable require_for_new_nodes (tick 'Require revision log message for new nodes'
    on the settings form) to also enforce it on node creation.
  bundle: require_revision_log_message
  rubric_ref: rubric/require_revision_log_message_rrlm_new_nodes_behavior@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: rrlm-which-types
  input: On this Drupal site, require_revision_log_message is enabled and configured. Inspect the live
    configuration and tell me which content type(s) are set to require a revision log message.
  criteria: 'The content type blog_post requires a revision log message: require_revision_log_message.adminsettings
    -> content_types contains { blog_post: blog_post }.'
  bundle: require_revision_log_message
  rubric_ref: rubric/require_revision_log_message_rrlm_which_types@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/require_revision_log_message-content-types-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/require_revision_log_message-content-types-cleanup.sh
- id: rrlm-new-nodes-configured
  input: On this Drupal site, is require_revision_log_message currently configured to require a revision
    log message when creating NEW nodes (not just when editing existing ones)? Inspect the live configuration
    to answer.
  criteria: Yes. require_revision_log_message.adminsettings -> require_for_new_nodes is TRUE, so the log
    message is required on new nodes as well as edits.
  bundle: require_revision_log_message
  rubric_ref: rubric/require_revision_log_message_rrlm_new_nodes_configured@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/require_revision_log_message-new-nodes-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/require_revision_log_message-new-nodes-cleanup.sh
- id: rrlm-require-article
  input: On this Drupal site, use the require_revision_log_message module to make the Article content
    type require a revision log message. Apply the change to the live site's configuration.
  criteria: 'In require_revision_log_message.adminsettings, content_types includes ''article'' (e.g. set
    content_types to {article: article} via the settings form or config API and save).'
  bundle: require_revision_log_message
  rubric_ref: rubric/require_revision_log_message_rrlm_require_article@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/require_revision_log_message-require-article-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/require_revision_log_message-require-article-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/require_revision_log_message-require-article-verify.sh
- id: rrlm-enable-new-nodes
  input: Article already requires a revision log message on this site, but only when editing existing
    articles. Configure require_revision_log_message so that a revision log message is also required when
    creating a brand-new node. Apply the change live.
  criteria: Set require_revision_log_message.adminsettings -> require_for_new_nodes to TRUE (tick 'Require
    revision log message for new nodes' on the settings form, or set it via the config API and save).
  bundle: require_revision_log_message
  rubric_ref: rubric/require_revision_log_message_rrlm_enable_new_nodes@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: site-owner
    reset: agent-module-documentation/evaluation/verify/require_revision_log_message-new-nodes-exec-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/require_revision_log_message-new-nodes-exec-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/require_revision_log_message-new-nodes-exec-verify.sh
