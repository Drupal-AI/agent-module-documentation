metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: replicate_ui
  version: 1.3.x
  note: 'Replicate UI is a thin UI layer over the Replicate module''s replicate.replicator service. It
    has one config object (replicate_ui.settings: entity_types + check_edit_access), one permission (replicate
    entities), and a settings form at /admin/config/content/replicate; enabling an entity type dynamically
    registers an entity.{type}.replicate route, a Replicate local task, an entity-operation link, an entity_replicate
    Action, a Rules action and a replicate_ui_link Views field. Easy cases are response-graded. Medium
    cases share one setup that saves a known replicate_ui.settings (entity_types=[node,taxonomy_term],
    check_edit_access=true) and a cleanup that restores baseline. Hard cases FAIL on empty state, PASS
    after the agent builds config / clones an entity, and leave the site clean.'
questions:
- id: replicate_ui-settings-keys
  input: On a Drupal 11 site using the replicate_ui module, which configuration object controls the module,
    and which two keys decide (a) which entity types get a Replicate UI and (b) whether the user must
    also have edit access on the original before replicating?
  criteria: The config object is replicate_ui.settings. entity_types (a list of content entity type machine
    ids) selects which types are replicable; check_edit_access (boolean) additionally requires core update/edit
    access on the original entity when true.
  bundle: replicate_ui
  rubric_ref: rubric/replicate_ui_replicate_ui_settings_keys@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: replicate_ui-service
  input: The replicate_ui module does not clone entities itself — it delegates to the Replicate module.
    In custom PHP on a Drupal site, which service and method do I call to deep-clone AND save a content
    entity the way Replicate UI does?
  criteria: Call the replicate.replicator service (\Drupal\replicate\Replicator) and its replicateEntity($entity)
    method, which clones the entity (including referenced children) and saves it, returning the new copy.
    cloneEntity() clones without saving.
  bundle: replicate_ui
  rubric_ref: rubric/replicate_ui_replicate_ui_service@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: replicate_ui-permission-route
  input: 'For the Drupal replicate_ui module: what is the machine name of the permission that lets a role
    use the Replicate UI, and at what admin path is the settings form where you choose which entity types
    are replicable?'
  criteria: The permission machine name is 'replicate entities'. The settings form is at /admin/config/content/replicate
    (route replicate_ui.settings). Note the user also needs core create access on the entity type for
    the Replicate tab/operation to appear.
  bundle: replicate_ui
  rubric_ref: rubric/replicate_ui_replicate_ui_permission_route@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: replicate_ui-known-enabled-types
  input: This Drupal site already has replicate_ui configured. Using drush, inspect the live configuration
    and tell me exactly which entity types currently have the Replicate UI enabled.
  criteria: 'Read from replicate_ui.settings.entity_types: the Replicate UI is enabled for node and taxonomy_term.'
  bundle: replicate_ui
  rubric_ref: rubric/replicate_ui_replicate_ui_known_enabled_types@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    persona: drupal-expert
    setup: agent-module-documentation/evaluation/verify/replicate_ui-known-settings-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/replicate_ui-known-settings-cleanup.sh
- id: replicate_ui-known-edit-access
  input: On this Drupal site, inspect the live replicate_ui configuration with drush and tell me whether
    replicating an entity currently also requires the user to have edit access on the original entity.
    Answer with the exact setting and its value.
  criteria: Yes. replicate_ui.settings.check_edit_access is set to true, so each replicate route also
    requires core update (edit) access on the original entity.
  bundle: replicate_ui
  rubric_ref: rubric/replicate_ui_replicate_ui_known_edit_access@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    persona: drupal-expert
    setup: agent-module-documentation/evaluation/verify/replicate_ui-known-settings-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/replicate_ui-known-settings-cleanup.sh
- id: replicate_ui-known-node-route
  input: Given how replicate_ui is currently configured on this live site, what is the URL path of the
    route that lets an editor replicate a node? Inspect the running site (routes/config) with drush to
    answer, do not guess.
  criteria: Because node is enabled in replicate_ui.settings, the dynamically registered route entity.node.replicate
    exists at /node/{node}/replicate.
  bundle: replicate_ui
  rubric_ref: rubric/replicate_ui_replicate_ui_known_node_route@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    persona: drupal-expert
    setup: agent-module-documentation/evaluation/verify/replicate_ui-known-settings-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/replicate_ui-known-settings-cleanup.sh
- id: replicate_ui-enable-node
  input: On this Drupal site, configure the replicate_ui module so that editors get a Replicate tab/operation
    on nodes. Apply it live so that the replicate route for nodes actually exists (path /node/{node}/replicate).
  criteria: replicate_ui.settings.entity_types now includes 'node' and, after a router/cache rebuild,
    the route entity.node.replicate exists at /node/{node}/replicate.
  bundle: replicate_ui
  rubric_ref: rubric/replicate_ui_replicate_ui_enable_node@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/replicate_ui-enable-node-reset.sh
    verify: agent-module-documentation/evaluation/verify/replicate_ui-enable-node-verify.sh
- id: replicate_ui-enable-taxonomy-editaccess
  input: On this Drupal site, use the replicate_ui module to enable replication for taxonomy terms, and
    configure it so that a user must also be able to edit the original term before they may replicate
    it. Apply it live.
  criteria: 'replicate_ui.settings.entity_types includes ''taxonomy_term'' and check_edit_access is true;
    after a rebuild the route entity.taxonomy_term.replicate exists and carries the _entity_access: taxonomy_term.update
    requirement.'
  bundle: replicate_ui
  rubric_ref: rubric/replicate_ui_replicate_ui_enable_taxonomy_editaccess@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/replicate_ui-enable-taxonomy-reset.sh
    verify: agent-module-documentation/evaluation/verify/replicate_ui-enable-taxonomy-verify.sh
- id: replicate_ui-clone-node
  input: On this Drupal site there is an article node titled 'Replicate Eval Source'. Using the deep-clone
    service that the replicate_ui module builds on, create a duplicate (a saved copy) of that node.
  criteria: After calling replicate.replicator->replicateEntity() (which copies the label and saves),
    at least two nodes whose title starts with 'Replicate Eval Source' exist on the live site.
  bundle: replicate_ui
  rubric_ref: rubric/replicate_ui_replicate_ui_clone_node@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/replicate_ui-clone-node-reset.sh
    verify: agent-module-documentation/evaluation/verify/replicate_ui-clone-node-verify.sh
