rubrics:
- id: reassign_user_content_reassign_user_content_cancel_method
  version: '1.0'
  applicable_bundles:
  - reassign_user_content
  checks:
  - kind: must_contain_any
    values:
    - user_cancel_reassign_content
    - cancel method
    - reassign
    - another user
    - belong to another user
  scoring:
    combine: all_pass
- id: reassign_user_content_reassign_user_content_comments
  version: '1.0'
  applicable_bundles:
  - reassign_user_content
  checks:
  - kind: must_contain_any
    values:
    - anonymiz
    - anonymous
    - owner set to 0
    - not reassigned
  scoring:
    combine: all_pass
- id: reassign_user_content_reassign_user_content_bulk_action
  version: '1.0'
  applicable_bundles:
  - reassign_user_content
  checks:
  - kind: must_contain_any
    values:
    - reassign_user_content_action
    - Reassign selected content to user
    - /admin/content/reassign-author
    - reassign-author
  scoring:
    combine: all_pass
- id: reassign_user_content_reassign_user_content_known_author
  version: '1.0'
  applicable_bundles:
  - reassign_user_content
  checks:
  - kind: must_contain_any
    values:
    - ruc_author
  scoring:
    combine: all_pass
- id: reassign_user_content_reassign_user_content_reassign_node
  version: '1.0'
  applicable_bundles:
  - reassign_user_content
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
- id: reassign_user_content_reassign_user_content_count_authored
  version: '1.0'
  applicable_bundles:
  - reassign_user_content
  checks:
  - kind: must_contain_any
    values:
    - '3'
  scoring:
    combine: all_pass
- id: reassign_user_content_reassign_user_content_reassign_all
  version: '1.0'
  applicable_bundles:
  - reassign_user_content
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
