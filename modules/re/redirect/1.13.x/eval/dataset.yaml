- id: redirect-create-in-code
  input: In PHP on a Drupal 11 site, programmatically create a redirect from `old/path` to `node/1` with
    a 301 status code. Show the code.
  criteria: 'Uses the Redirect entity: Redirect::create() then setSource(''old/path''), setRedirect(''node/1''),
    setStatusCode(301), save().'
  bundle: redirect
  rubric_ref: rubric/redirect_redirect_create_in_code@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: redirect-lookup-service
  input: On a Drupal 11 site I want to look up whether a given source path already has a redirect before
    creating a new one. Which service do I use and which method performs the main lookup?
  criteria: The redirect.repository service (RedirectRepository); findMatchingRedirect() is the main lookup,
    findBySourcePath() also returns matches.
  bundle: redirect
  rubric_ref: rubric/redirect_redirect_lookup_service@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: redirect-auto-on-alias-change
  input: I want Redirect to automatically create a redirect when a node's URL alias changes so SEO ranking
    survives. Which config setting controls this, and what config object holds it?
  criteria: The auto_redirect key (default true) in the redirect.settings config object controls auto-creating
    a redirect when an alias changes.
  bundle: redirect
  rubric_ref: rubric/redirect_redirect_auto_on_alias_change@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: redirect-default-status-code
  input: How do I change the site-wide default HTTP status code used for new redirects on a Drupal site?
    Give the config key and a drush command.
  criteria: Set the default_status_code key (default 301) on redirect.settings, e.g. drush cset redirect.settings
    default_status_code 302.
  bundle: redirect
  rubric_ref: rubric/redirect_redirect_default_status_code@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: redirect-permissions
  input: What are the two permission machine names Redirect provides, and which one gates the global settings
    form versus managing individual redirects?
  criteria: '''administer redirects'' gates creating/editing/deleting individual redirects; ''administer
    redirect settings'' gates the global settings form.'
  bundle: redirect
  rubric_ref: rubric/redirect_redirect_permissions@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: redirect-submodules
  input: Which Redirect submodule logs 404s so I can turn frequent missing-page requests into redirects,
    and which submodule redirects between whole domains?
  criteria: redirect_404 logs 404s and turns frequent misses into redirects; redirect_domain redirects
    between whole domains.
  bundle: redirect
  rubric_ref: rubric/redirect_redirect_submodules@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: redirect-response-hook
  input: In a custom Drupal module I want to alter the redirect response just before it is sent (e.g.
    add a message or change the target). Which hook do I implement?
  criteria: Implement hook_redirect_response_alter(TrustedRedirectResponse $response, Redirect $redirect).
  bundle: redirect
  rubric_ref: rubric/redirect_redirect_response_hook@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: redirect-query-passthrough
  input: Which Redirect setting controls whether the incoming query string is kept (passed through) when
    a request is redirected, and what is its default?
  criteria: The passthrough_querystring key on redirect.settings (default true) keeps the incoming query
    string on redirect.
  bundle: redirect
  rubric_ref: rubric/redirect_redirect_query_passthrough@1.0
  tags:
  - mode:recipe
  - difficulty:easy
