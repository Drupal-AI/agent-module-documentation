metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: redirect
  version: 1.13.x
  note: 'Redirect exposes a content entity, a config settings object, two submodules, and a small service
    API. Cases span three difficulty tiers: `easy`/`recipe` (response-graded) probe documented facts an
    agent would otherwise read source to answer; `medium`/`introspection` cases install a KNOWN redirect
    via `setup`, have the agent read it back from the live site (drush), grade on response text, then
    `cleanup`; `hard`/`execution` cases mutate live state and are graded by reset -> model -> verify against
    real redirect entities.'
questions:
- id: redirect-build-301
  input: On this Drupal site (drush available), create a permanent (301) URL redirect so that visits to
    the path `eval-old-page` are forwarded to the site's front page. Create the redirect as a real redirect
    entity on the live site; don't just describe it. One-line summary.
  criteria: A redirect entity with source path `eval-old-page`, status_code 301, and a non-empty target
    pointing to the front page (internal:/ , <front>, or route:<front>) exists on the live site. Verified
    against live site state.
  bundle: redirect
  rubric_ref: rubric/redirect_redirect_build_301@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/redirect-reset.sh
    verify: agent-module-documentation/evaluation/verify/redirect-old-page.sh
- id: redirect-build-temp-page
  input: On this Drupal site (drush available), create a temporary (302) URL redirect so that visits to
    the path `eval-temp-page` are forwarded to `/node/1`. Create the redirect as a real redirect entity
    on the live site; don't just describe it. One-line summary.
  criteria: A redirect entity with source path `eval-temp-page`, status_code 302, and target node/1 (stored
    as internal:/node/1) exists on the live site. Verified against live site state.
  bundle: redirect
  rubric_ref: rubric/redirect_redirect_build_temp_page@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/redirect-temp-page-reset.sh
    verify: agent-module-documentation/evaluation/verify/redirect-temp-page-verify.sh
- id: redirect-build-external
  input: On this Drupal site (drush available), create a permanent (301) URL redirect so that visits to
    the path `eval-ext` are forwarded to the external URL https://www.drupal.org . Create the redirect
    as a real redirect entity on the live site; don't just describe it. One-line summary.
  criteria: A redirect entity with source path `eval-ext`, status_code 301, and a target that is an external
    http(s) URL (e.g. https://www.drupal.org) exists on the live site. Verified against live site state.
  bundle: redirect
  rubric_ref: rubric/redirect_redirect_build_external@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/redirect-ext-reset.sh
    verify: agent-module-documentation/evaluation/verify/redirect-ext-verify.sh
- id: redirect-intro-target-and-code
  input: A redirect already exists on this site for the path `eval-intro-src` — where does it point and
    with what HTTP status code? Inspect the live site (drush available) to answer.
  criteria: The eval-intro-src redirect points to node/1 (stored internal:/node/1) with HTTP status code
    302. Read back from live site state via drush.
  bundle: redirect
  rubric_ref: rubric/redirect_redirect_intro_target_and_code@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    persona: drupal-expert
    setup: agent-module-documentation/evaluation/verify/redirect-intro-src-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/redirect-intro-src-cleanup.sh
- id: redirect-intro-status-code
  input: What status code (301 or 302) does the `eval-intro-src` redirect use on this site? Inspect the
    live site (drush available) to answer.
  criteria: The eval-intro-src redirect uses HTTP status code 302 (temporary). Read back from live site
    state via drush.
  bundle: redirect
  rubric_ref: rubric/redirect_redirect_intro_status_code@1.0
  tags:
  - mode:introspection
  - difficulty:medium
