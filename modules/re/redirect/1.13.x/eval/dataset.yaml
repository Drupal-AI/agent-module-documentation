    persona: drupal-expert
    setup: agent-module-documentation/evaluation/verify/redirect-intro-src-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/redirect-intro-src-cleanup.sh
- id: redirect-intro-target
  input: What is the target (destination) of the `eval-intro-src` redirect on this site? Inspect the live
    site (drush available) to answer.
  criteria: The eval-intro-src redirect targets node/1 (stored as internal:/node/1). Read back from live
    site state via drush.
  bundle: redirect
  rubric_ref: rubric/redirect_redirect_intro_target@1.0
  tags:
  - mode:introspection
  - difficulty:medium
