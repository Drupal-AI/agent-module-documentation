rubrics:
- id: registration_role_registration_role_config_name
  version: '1.0'
  applicable_bundles:
  - registration_role
  checks:
  - kind: must_contain_any
    values:
    - registration_role.setting
    - role_to_select
    - /admin/people/registration-role
  scoring:
    combine: all_pass
- id: registration_role_registration_role_modes
  version: '1.0'
  applicable_bundles:
  - registration_role
  checks:
  - kind: must_contain_any
    values:
    - admin
    - self registration
  scoring:
    combine: all_pass
- id: registration_role_registration_role_when_applied
  version: '1.0'
  applicable_bundles:
  - registration_role
  checks:
  - kind: must_contain_any
    values:
    - presave
    - isNew
  scoring:
    combine: all_pass
- id: registration_role_registration_role_known_role
  version: '1.0'
  applicable_bundles:
  - registration_role
  checks:
  - kind: must_contain_any
    values:
    - registration_role_known
  scoring:
    combine: all_pass
- id: registration_role_registration_role_mode_check
  version: '1.0'
  applicable_bundles:
  - registration_role
  checks:
  - kind: must_contain_any
    values:
    - registration_role_alpha
    - registration_role_beta
  scoring:
    combine: all_pass
- id: registration_role_registration_role_assign_role
  version: '1.0'
  applicable_bundles:
  - registration_role
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
- id: registration_role_registration_role_selfonly
  version: '1.0'
  applicable_bundles:
  - registration_role
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
