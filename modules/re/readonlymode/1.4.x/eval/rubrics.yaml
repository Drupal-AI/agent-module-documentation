rubrics:
- id: readonlymode_rom_enable_where
  version: '1.0'
  applicable_bundles:
  - readonlymode
  checks:
  - kind: must_contain_any
    values:
    - readonlymode.settings
    - enabled
    - system.site_maintenance_mode
    - maintenance
  scoring:
    combine: all_pass
- id: readonlymode_rom_permissions
  version: '1.0'
  applicable_bundles:
  - readonlymode
  checks:
  - kind: must_contain_any
    values:
    - readonlymode access forms
    - readonlymode access messages
  scoring:
    combine: all_pass
- id: readonlymode_rom_allow_forms_how
  version: '1.0'
  applicable_bundles:
  - readonlymode
  checks:
  - kind: must_contain_any
    values:
    - forms.additional.edit
    - additional
    - wildcard
    - one per line
    - newline
  scoring:
    combine: all_pass
- id: readonlymode_rom_known_redirect
  version: '1.0'
  applicable_bundles:
  - readonlymode
  checks:
  - kind: must_contain_any
    values:
    - /rom-under-maintenance
    - rom-under-maintenance
  scoring:
    combine: all_pass
- id: readonlymode_rom_known_allowed_form
  version: '1.0'
  applicable_bundles:
  - readonlymode
  checks:
  - kind: must_contain_any
    values:
    - rom_probe_widget_form
  scoring:
    combine: all_pass
- id: readonlymode_rom_enable
  version: '1.0'
  applicable_bundles:
  - readonlymode
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
- id: readonlymode_rom_allow_form
  version: '1.0'
  applicable_bundles:
  - readonlymode
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
