metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: readonlymode
  version: 1.4.x
  note: 'Read Only Mode blocks form submissions site-wide when enabled while keeping the site readable.
    All state lives in the readonlymode.settings config object (enabled 0/1, url redirect, messages.default/not_saved,
    forms.default.edit/view shipped allow-lists, forms.additional.edit/view newline-separated custom form
    IDs with * wildcards). Its UI is grafted onto the core Maintenance mode form (system.site_maintenance_mode).
    It defines two permissions: ''readonlymode access forms'' (bypass) and ''readonlymode access messages''
    (see notices). No Drush. Medium/hard cases are grounded in that config object read/written via drush
    cget/cset.'
questions:
- id: rom-enable-where
  input: On a Drupal site with the readonlymode module, how do I turn Read Only Mode on, and where is
    that stored? Name the config object/key and the admin form it is attached to.
  criteria: Set readonlymode.settings:enabled to 1 (drush cset readonlymode.settings enabled 1). The UI
    is a 'Read Only Mode' section on the core Maintenance mode form (system.site_maintenance_mode, /admin/config/development/maintenance).
  bundle: readonlymode
  rubric_ref: rubric/readonlymode_rom_enable_where@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: rom-permissions
  input: What permissions does the Drupal readonlymode module define and what does each one do?
  criteria: '''readonlymode access forms'' lets a user bypass the lock and submit any form while Read
    Only Mode is on; ''readonlymode access messages'' controls who sees the read-only notices/warnings.'
  bundle: readonlymode
  rubric_ref: rubric/readonlymode_rom_permissions@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: rom-allow-forms-how
  input: While readonlymode is enabled, how can I let a specific set of forms (e.g. all webforms) still
    be submitted? Which config value controls that and what format does it use?
  criteria: Add form IDs to readonlymode.settings:forms.additional.edit (submittable) or forms.additional.view
    (view-only). It is a newline-separated string and supports the * wildcard, e.g. webform* matches all
    webforms.
  bundle: readonlymode
  rubric_ref: rubric/readonlymode_rom_allow_forms_how@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: rom-known-redirect
  input: On this Drupal site, Read Only Mode has been configured. Inspect the live readonlymode configuration
    and report whether it is enabled and what redirect path (if any) is set for blocked edit attempts.
  criteria: Read Only Mode is enabled (readonlymode.settings:enabled = 1) and the redirect url is /rom-under-maintenance
    (drush cget readonlymode.settings).
  bundle: readonlymode
  rubric_ref: rubric/readonlymode_rom_known_redirect@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/readonlymode-enabled-url-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/readonlymode-enabled-url-cleanup.sh
- id: rom-known-allowed-form
  input: This site's readonlymode configuration has one extra custom form added to the list of forms that
    may still be submitted while Read Only Mode is active. Inspect the live configuration and give that
    form ID.
  criteria: The custom allowed form is rom_probe_widget_form, in readonlymode.settings:forms.additional.edit.
  bundle: readonlymode
  rubric_ref: rubric/readonlymode_rom_known_allowed_form@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/readonlymode-allowed-form-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/readonlymode-allowed-form-cleanup.sh
- id: rom-enable
  input: Using the readonlymode module, put this Drupal site into Read Only Mode so that content changes
    are blocked. Apply the change to the live site configuration.
  criteria: readonlymode.settings:enabled is set to 1 (e.g. drush cset readonlymode.settings enabled 1).
  bundle: readonlymode
  rubric_ref: rubric/readonlymode_rom_enable@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/readonlymode-enable-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/readonlymode-enable-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/readonlymode-enable-verify.sh
- id: rom-allow-form
  input: On this site, configure the readonlymode module so that the form with ID contact_message_feedback_form
    is allowed to be submitted even while Read Only Mode is active. Apply the change to the live configuration.
  criteria: readonlymode.settings:forms.additional.edit contains contact_message_feedback_form (newline-separated
    allow-list of submittable forms).
  bundle: readonlymode
  rubric_ref: rubric/readonlymode_rom_allow_form@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/readonlymode-allow-form-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/readonlymode-allow-form-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/readonlymode-allow-form-verify.sh
