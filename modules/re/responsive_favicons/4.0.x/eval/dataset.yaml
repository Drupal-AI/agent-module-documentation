metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: responsive_favicons
  version: 4.0.x
  note: Responsive Favicons is a config-form-driven UI module (one settings form, one config object, two
    alter hooks, no Drush/plugins). All cases are `recipe` (response-graded), not `execution`.
questions:
- id: rf-config-route
  input: On a Drupal 11 site with the Responsive Favicons module, what is the admin path (or route name)
    to configure the favicons? Give the URL.
  criteria: The settings form is at /admin/config/user-interface/responsive_favicons (route responsive_favicons.admin).
  bundle: responsive_favicons
  rubric_ref: rubric/responsive_favicons_rf_config_route@1.0
  tags:
  - mode:recipe
- id: rf-permission
  input: Which permission gates access to the Responsive Favicons settings form on a Drupal site? Give
    the exact permission machine string.
  criteria: administer responsive favicons.
  bundle: responsive_favicons
  rubric_ref: rubric/responsive_favicons_rf_permission@1.0
  tags:
  - mode:recipe
- id: rf-remove-default
  input: Using Responsive Favicons, I want Drupal to stop emitting its default core/theme favicon.ico
    so it doesn't conflict with my uploaded icons. Which config key on responsive_favicons.settings do
    I enable, and give a drush command to set it.
  criteria: Set remove_default to 1, e.g. drush cset responsive_favicons.settings remove_default 1 -y.
  bundle: responsive_favicons
  rubric_ref: rubric/responsive_favicons_rf_remove_default@1.0
  tags:
  - mode:recipe
- id: rf-favicon-ico-htaccess
  input: After enabling Responsive Favicons, requests to /favicon.ico still aren't served by the module.
    What one-line change to the Drupal .htaccess is required so the module can handle /favicon.ico?
  criteria: Comment out the line `RewriteCond %{REQUEST_URI} !=/favicon.ico` in .htaccess.
  bundle: responsive_favicons
  rubric_ref: rubric/responsive_favicons_rf_favicon_ico_htaccess@1.0
  tags:
  - mode:recipe
- id: rf-alter-tags-hook
  input: In a custom Drupal module I want to programmatically modify the favicon link/meta tags that the
    Responsive Favicons module adds to the page head. Which hook do I implement? Name it.
  criteria: Implement hook_responsive_favicons_tags_alter(array &$tags).
  bundle: responsive_favicons
  rubric_ref: rubric/responsive_favicons_rf_alter_tags_hook@1.0
  tags:
  - mode:recipe
- id: rf-path-mode
  input: With Responsive Favicons, instead of uploading a zip I want to point the module at favicon files
    that already live in my theme directory. Which config value of path_type do I use, and what does the
    path key then reference?
  criteria: Set path_type to 'path' (internal path mode); path is then a directory relative to DRUPAL_ROOT,
    e.g. /themes/custom/mytheme/favicons.
  bundle: responsive_favicons
  rubric_ref: rubric/responsive_favicons_rf_path_mode@1.0
  tags:
  - mode:recipe
