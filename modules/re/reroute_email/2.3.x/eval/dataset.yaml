metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: reroute_email
  version: 2.3.x
  note: 'Reroute Email exposes a single config object (reroute_email.settings), a hook_mail_alter interception
    mechanism, a RerouteEmailHandler plugin type, and one submodule. Cases are `recipe` (response-graded):
    they probe documented config keys and mechanisms an agent would otherwise read source to answer; no
    site mutation.'
questions:
- id: reroute-enable-and-address
  input: On a Drupal 11 staging site I want to reroute all outgoing email to qa@example.com. Which config
    object and which two keys do I set, and give a drush command.
  criteria: Set enable=true and address='qa@example.com' on reroute_email.settings, e.g. drush config:set
    --input-format=yaml reroute_email.settings enable true -y and drush config:set reroute_email.settings
    address "qa@example.com" -y.
  bundle: reroute_email
  rubric_ref: rubric/reroute_email_reroute_enable_and_address@1.0
  tags:
  - mode:recipe
- id: reroute-abort-all
  input: With Reroute Email enabled, how do I make the site abort all outgoing emails instead of sending
    them anywhere?
  criteria: Leave the address setting as an empty string (enable rerouting with address=''); when the
    rerouting address resolves to empty the mail is aborted rather than sent.
  bundle: reroute_email
  rubric_ref: rubric/reroute_email_reroute_abort_all@1.0
  tags:
  - mode:recipe
- id: reroute-allowlist
  input: I want emails to my own domain example.com to still be delivered normally while everything else
    is rerouted. Which Reroute Email setting do I use and what value?
  criteria: Use the allowed (allowlist) key on reroute_email.settings with a pattern like *@example.com;
    allowlisted addresses/domains/patterns pass through un-rerouted.
  bundle: reroute_email
  rubric_ref: rubric/reroute_email_reroute_allowlist@1.0
  tags:
  - mode:recipe
- id: reroute-dev-only-settings-php
  input: How do I make sure Reroute Email is on for the test environment but hard-off in production, driven
    per environment rather than by shared config?
  criteria: 'Override in each environment''s settings.php: on test set $config[''reroute_email.settings''][''enable'']
    = TRUE; (and [''address'']), on live set $config[''reroute_email.settings''][''enable''] = FALSE;.'
  bundle: reroute_email
  rubric_ref: rubric/reroute_email_reroute_dev_only_settings_php@1.0
  tags:
  - mode:recipe
- id: reroute-mailkeys-filter
  input: I only want Reroute Email to reroute messages from one specific module, leaving all other outgoing
    mail untouched. Which setting controls this?
  criteria: Use the mailkeys key (list of module names / mail keys to reroute); only those are rerouted.
    The inverse is mailkeys_skip, which exempts listed keys.
  bundle: reroute_email
  rubric_ref: rubric/reroute_email_reroute_mailkeys_filter@1.0
  tags:
  - mode:recipe
- id: reroute-force-header
  input: In a custom Drupal module I want one specific email to always be rerouted regardless of the global
    Reroute Email settings. What mechanism does the module provide?
  criteria: Add the X-Rerouted-Force header to the message (TRUE forces rerouting, FALSE forces skipping),
    overriding the global reroute_email.settings for that message.
  bundle: reroute_email
  rubric_ref: rubric/reroute_email_reroute_force_header@1.0
  tags:
  - mode:recipe
- id: reroute-mechanism-hook
  input: How does Reroute Email actually intercept outgoing mail in Drupal, and how does it ensure it
    runs after other modules?
  criteria: It implements hook_mail_alter() to rewrite recipients, and uses hook_module_implements_alter()
    to force its implementation to run last (keeping queue_mail after it).
  bundle: reroute_email
  rubric_ref: rubric/reroute_email_reroute_mechanism_hook@1.0
  tags:
  - mode:recipe
- id: reroute-permission
  input: Which permission gates the Reroute Email settings and test email forms?
  criteria: 'The ''administer reroute email'' permission (restrict access: true) gates both the settings
    form and the test email form.'
  bundle: reroute_email
  rubric_ref: rubric/reroute_email_reroute_permission@1.0
  tags:
  - mode:recipe
