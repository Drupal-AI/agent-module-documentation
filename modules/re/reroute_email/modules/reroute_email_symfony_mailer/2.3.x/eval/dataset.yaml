metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: reroute_email_symfony_mailer
  version: 2.3.x
  note: Submodule of Reroute Email. It exists because the Symfony Mailer pipeline never invokes hook_mail_alter(),
    so the parent module's interception does not fire; this submodule plugs reroute logic into Symfony
    Mailer's adjuster/handler/builder pipeline instead. All cases are `recipe` (response-graded) — the
    submodule adds no new config route, reusing reroute_email.settings.
questions:
- id: reroutesf-why-exists
  input: My Drupal 11 site uses the symfony_mailer module as its mail transport, and the plain Reroute
    Email module is enabled but outgoing test mail is NOT being rerouted. Why does the base Reroute Email
    interception fail here, and what do I install to fix it?
  criteria: Core Reroute Email intercepts via hook_mail_alter(), which Symfony Mailer's send pipeline
    never invokes, so nothing is rerouted. Enable the reroute_email_symfony_mailer submodule, which plugs
    the reroute logic into Symfony Mailer's pipeline instead.
  bundle: reroute_email_symfony_mailer
  rubric_ref: rubric/reroute_email_symfony_mailer_reroutesf_why_exists@1.0
  tags:
  - mode:recipe
- id: reroutesf-handler-plugin
  input: In the reroute_email_symfony_mailer submodule, which plugin actually adapts the shared reroute
    logic to Symfony Mailer's EmailInterface (get/set To/Cc/Bcc, headers, body), and what does it throw
    to abort/skip a message?
  criteria: The SymfonyMailer RerouteEmailHandler plugin (applied = {"symfony_mailer_adjuster"}), a subclass
    of RerouteEmailHandlerPluginBase that adapts to Symfony Mailer's EmailInterface. To abort a message
    it throws Drupal\symfony_mailer\Exception\SkipMailException.
  bundle: reroute_email_symfony_mailer
  rubric_ref: rubric/reroute_email_symfony_mailer_reroutesf_handler_plugin@1.0
  tags:
  - mode:recipe
- id: reroutesf-adjuster-global-vs-policy
  input: On a Symfony Mailer site with reroute_email_symfony_mailer enabled, I want one specific mailer
    policy to reroute to a different address than the site-wide reroute setting. Which plugin/setting
    controls global vs per-policy behavior, and how do I switch to per-policy overrides?
  criteria: The EmailAdjuster plugin (id reroute_email) exposes a per-policy settings form with a 'Use
    global configuration' checkbox (use_global, default on → uses reroute_email.settings). Uncheck it
    to set per-policy overrides (address, allowlist, roles, mail-key filters) on that mailer policy.
  bundle: reroute_email_symfony_mailer
  rubric_ref: rubric/reroute_email_symfony_mailer_reroutesf_adjuster_global_vs_policy@1.0
  tags:
  - mode:recipe
- id: reroutesf-test-form-builder
  input: How does the Reroute Email test form send its test message through Symfony Mailer instead of
    the classic mail system in the reroute_email_symfony_mailer submodule? Name the plugin and the send
    mechanism.
  criteria: An EmailBuilder plugin (id reroute_email, sub-type test_email_form) lets the test form send
    via Symfony Mailer. A hook_form_FORM_ID_alter swaps the submit handler to email_factory->sendTypedEmail('reroute_email',
    'test_email_form', $params) and displays the applied mailer policy.
  bundle: reroute_email_symfony_mailer
  rubric_ref: rubric/reroute_email_symfony_mailer_reroutesf_test_form_builder@1.0
  tags:
  - mode:recipe
- id: reroutesf-dependencies
  input: What modules must be present for reroute_email_symfony_mailer to work, and does enabling it add
    a new settings/config route of its own?
  criteria: It depends on both reroute_email and symfony_mailer (drush en reroute_email_symfony_mailer
    pulls them in). It adds no new settings route — it reuses the parent module's reroute_email.settings
    config and form.
  bundle: reroute_email_symfony_mailer
  rubric_ref: rubric/reroute_email_symfony_mailer_reroutesf_dependencies@1.0
  tags:
  - mode:recipe
- id: reroutesf-adjuster-weight
  input: In the reroute_email_symfony_mailer submodule, how is the reroute adjuster ordered relative to
    the other Symfony Mailer adjusters, and how is that ordering enforced?
  criteria: The reroute_email adjuster is forced to run after every other adjuster; hook_mailer_adjuster_info_alter()
    bumps its weight to max(weight) + 100 so it has the highest weight.
  bundle: reroute_email_symfony_mailer
  rubric_ref: rubric/reroute_email_symfony_mailer_reroutesf_adjuster_weight@1.0
  tags:
  - mode:recipe
