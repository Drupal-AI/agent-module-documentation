rubrics:
- id: remove_username_remove_username_what_it_does
  version: '1.0'
  applicable_bundles:
  - remove_username
  checks:
  - kind: must_contain_any
    values:
    - email
    - mail
    - username
    - name
    - hidden
    - presave
  scoring:
    combine: all_pass
- id: remove_username_remove_username_login_label
  version: '1.0'
  applicable_bundles:
  - remove_username
  checks:
  - kind: must_contain_any
    values:
    - Email address
    - relabel
    - label
    - title
    - email
  scoring:
    combine: all_pass
- id: remove_username_remove_username_no_config
  version: '1.0'
  applicable_bundles:
  - remove_username
  checks:
  - kind: must_contain_any
    values:
    - no config
    - no configuration
    - no settings
    - configure
    - hook
    - form_alter
  scoring:
    combine: all_pass
- id: remove_username_remove_username_known_user
  version: '1.0'
  applicable_bundles:
  - remove_username
  checks:
  - kind: must_contain_any
    values:
    - ru_known@example.com
  scoring:
    combine: all_pass
- id: remove_username_remove_username_override_check
  version: '1.0'
  applicable_bundles:
  - remove_username
  checks:
  - kind: must_contain_any
    values:
    - ru_known2@example.com
  scoring:
    combine: all_pass
- id: remove_username_remove_username_create_user
  version: '1.0'
  applicable_bundles:
  - remove_username
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
- id: remove_username_remove_username_change_email
  version: '1.0'
  applicable_bundles:
  - remove_username
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
