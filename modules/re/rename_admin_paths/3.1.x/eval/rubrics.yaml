rubrics:
- id: rename_admin_paths_rap_rename_admin_prefix
  version: '1.0'
  applicable_bundles:
  - rename_admin_paths
  checks:
  - kind: must_contain_any
    values:
    - rename_admin_paths.settings
    - admin_path_value
  scoring:
    combine: all_pass
- id: rename_admin_paths_rap_rename_user_prefix
  version: '1.0'
  applicable_bundles:
  - rename_admin_paths
  checks:
  - kind: must_contain_any
    values:
    - user_path
    - user_path_value
  scoring:
    combine: all_pass
- id: rename_admin_paths_rap_settings_keys
  version: '1.0'
  applicable_bundles:
  - rename_admin_paths
  checks:
  - kind: must_contain_any
    values:
    - admin_path
    - admin_path_value
    - user_path
    - user_path_value
  scoring:
    combine: all_pass
- id: rename_admin_paths_rap_mechanism
  version: '1.0'
  applicable_bundles:
  - rename_admin_paths
  checks:
  - kind: must_contain_any
    values:
    - RoutingEvents::ALTER
    - event subscriber
    - RenameAdminPathsEventSubscriber
    - route collection
    - RouteCollection
  scoring:
    combine: all_pass
- id: rename_admin_paths_rap_not_real_security
  version: '1.0'
  applicable_bundles:
  - rename_admin_paths
  checks:
  - kind: must_contain_any
    values:
    - obscurity
    - not real security
    - not access control
    - not a substitute
  scoring:
    combine: all_pass
- id: rename_admin_paths_rap_cache_rebuild
  version: '1.0'
  applicable_bundles:
  - rename_admin_paths
  checks:
  - kind: must_contain_any
    values:
    - rebuild
    - router
    - drush cr
    - cache
  scoring:
    combine: all_pass
- id: rename_admin_paths_rap_configure_route
  version: '1.0'
  applicable_bundles:
  - rename_admin_paths
  checks:
  - kind: must_contain_any
    values:
    - rename_admin_paths.admin
    - /admin/config/system/rename-admin-paths
    - administer path admin
  scoring:
    combine: all_pass
- id: rename_admin_paths_rap_value_validation
  version: '1.0'
  applicable_bundles:
  - rename_admin_paths
  checks:
  - kind: must_contain_any
    values:
    - reserved
    - admin
    - letters
    - numbers
    - hyphens
    - underscores
    - empty
  scoring:
    combine: all_pass
