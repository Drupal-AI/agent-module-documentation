metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: rename_admin_paths
  version: 3.1.x
  note: Rename Admin Paths exposes a config settings object and a single route-alter event subscriber;
    it has no plugins, services API, or Drush commands. Cases are `recipe` (response-graded) probing documented
    facts an agent would otherwise read source to answer; no site mutation.
questions:
- id: rap-rename-admin-prefix
  input: On a Drupal 11 site I want to change the /admin URL prefix to /backend using the Rename Admin
    Paths module. Which config object and keys do I set, and what values enable the rename?
  criteria: Set admin_path to 1 (enable) and admin_path_value to 'backend' in the rename_admin_paths.settings
    config object (via the settings form or drush cset).
  bundle: rename_admin_paths
  rubric_ref: rubric/rename_admin_paths_rap_rename_admin_prefix@1.0
  tags:
  - mode:recipe
- id: rap-rename-user-prefix
  input: I want to rename the /user path prefix to /member with Rename Admin Paths to cut down on bot
    registrations. Which settings keys control the user prefix?
  criteria: user_path (integer, 1 to enable) and user_path_value (string, e.g. 'member') in rename_admin_paths.settings
    control the /user prefix rename.
  bundle: rename_admin_paths
  rubric_ref: rubric/rename_admin_paths_rap_rename_user_prefix@1.0
  tags:
  - mode:recipe
- id: rap-settings-keys
  input: List the four configuration keys the Rename Admin Paths module stores and what each does.
  criteria: admin_path (enable flag 0/1), admin_path_value (replacement term, default backend), user_path
    (enable flag 0/1), user_path_value (replacement term, default member), all in rename_admin_paths.settings.
  bundle: rename_admin_paths
  rubric_ref: rubric/rename_admin_paths_rap_settings_keys@1.0
  tags:
  - mode:recipe
- id: rap-mechanism
  input: How does Rename Admin Paths actually change the URLs — what mechanism rewrites the paths on a
    Drupal site?
  criteria: An event subscriber (RenameAdminPathsEventSubscriber) on RoutingEvents::ALTER iterates the
    route collection and rewrites the leading /admin or /user segment of matching routes when the prefix
    is enabled.
  bundle: rename_admin_paths
  rubric_ref: rubric/rename_admin_paths_rap_mechanism@1.0
  tags:
  - mode:recipe
- id: rap-not-real-security
  input: Is renaming /admin with the Rename Admin Paths module a real security control I can rely on to
    protect the backend?
  criteria: No — it is security-by-obscurity/branding, not access control. It hides default URLs and can
    reduce bot spam, but you must still use real permissions and authentication hardening.
  bundle: rename_admin_paths
  rubric_ref: rubric/rename_admin_paths_rap_not_real_security@1.0
  tags:
  - mode:recipe
- id: rap-cache-rebuild
  input: After I import renamed Rename Admin Paths config into production, the new /backend path doesn't
    work yet. What step makes the renamed routes take effect?
  criteria: The routes must be rebuilt. The settings form calls router.builder->rebuild() on save; after
    a config import, rebuild routes / clear cache (e.g. drush cr) for the renamed paths to take effect.
  bundle: rename_admin_paths
  rubric_ref: rubric/rename_admin_paths_rap_cache_rebuild@1.0
  tags:
  - mode:recipe
- id: rap-configure-route
  input: Where do I configure Rename Admin Paths in the Drupal admin UI, and what permission is required?
  criteria: The settings form at /admin/config/system/rename-admin-paths (route rename_admin_paths.admin),
    gated by the 'administer path admin' permission.
  bundle: rename_admin_paths
  rubric_ref: rubric/rename_admin_paths_rap_configure_route@1.0
  tags:
  - mode:recipe
- id: rap-value-validation
  input: What replacement values does Rename Admin Paths reject when I try to rename a path?
  criteria: It rejects empty values, values with characters other than letters/numbers/hyphens/underscores,
    and the reserved default names 'admin' or 'user'.
  bundle: rename_admin_paths
  rubric_ref: rubric/rename_admin_paths_rap_value_validation@1.0
  tags:
  - mode:recipe
