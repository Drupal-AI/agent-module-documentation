metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: revision_manager
  version: 1.0.x
  note: 'Revision Manager prunes old revisions of any revisionable content entity type via RevisionManager
    plugins: ''amount'' (settings.amount = keep newest N) and ''age'' (settings.age = delete older than
    N months). Global config lives in revision_manager.settings: enabled_entities (map entity_type=>bool),
    defaults (entity_type=>plugin_id=>{id,status,settings}), disable_automatic_queueing, verbose_log.
    Bundle overrides are third-party settings on the bundle config entity, e.g. node.type.article -> third_party_settings.revision_manager.amount
    = {id,status,settings:{amount:N}}. Both plugins enabled => conservative (delete only if all agree);
    current + forward revisions always kept. Cleanup is queue-based (remove_revisions queue); Drush ''rm:queue''
    enqueues all enabled entities. Permission administer revision_manager; settings route revision_manager.settings
    at /admin/config/content/revision-manager. Shipped install defaults: enabled_entities {}, defaults
    {}, disable_automatic_queueing false, verbose_log false. medium cases read back configured Amount
    count / enabled entity types; hard cases write a global Amount default and a per-bundle override,
    verified against live config.'
questions:
- id: revision_manager-plugins
  input: What two revision-retention strategies (plugins) does the Drupal revision_manager module ship,
    and what does each one do?
  criteria: It ships the 'amount' plugin (keep a minimum number of the newest revisions, settings.amount)
    and the 'age' plugin (delete revisions older than a chosen number of months, settings.age). Both always
    preserve the current and forward revisions.
  bundle: revision_manager
  rubric_ref: rubric/revision_manager_revision_manager_plugins@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: revision_manager-drush
  input: Which Drush command does revision_manager provide to schedule revision cleanup, and what does
    it actually do?
  criteria: drush rm:queue batch-enqueues all enabled entities (respecting each type/bundle's enabled
    plugins) into the remove_revisions queue; the actual deletions happen when that queue is processed
    (e.g. by cron).
  bundle: revision_manager
  rubric_ref: rubric/revision_manager_revision_manager_drush@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: revision_manager-combining
  input: If I enable BOTH the Amount and Age criteria in revision_manager for a content type, how does
    it decide which revisions get deleted?
  criteria: 'Deletion becomes conservative: a revision is deleted only if EVERY enabled plugin independently
    flags it (the intersection of Amount''s and Age''s decisions). The more criteria you enable, the fewer
    revisions are removed; current and forward revisions are never deleted.'
  bundle: revision_manager
  rubric_ref: rubric/revision_manager_revision_manager_combining@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: revision_manager-amount-count
  input: On this site, revision management is enabled for nodes with the Amount plugin. Inspect the live
    revision_manager configuration and state the minimum number of revisions it is set to keep for nodes.
  criteria: 'It keeps 7 revisions: revision_manager.settings -> defaults.node.amount.settings.amount =
    7 (with amount.status true and enabled_entities.node true).'
  bundle: revision_manager
  rubric_ref: rubric/revision_manager_revision_manager_amount_count@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/revision_manager-amount-default-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/revision_manager-amount-default-cleanup.sh
- id: revision_manager-enabled-types
  input: Inspect the live revision_manager configuration on this site and list which entity types currently
    have revision management enabled.
  criteria: 'Node and taxonomy_term are enabled: revision_manager.settings -> enabled_entities has node:
    true and taxonomy_term: true.'
  bundle: revision_manager
  rubric_ref: rubric/revision_manager_revision_manager_enabled_types@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/revision_manager-enabled-types-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/revision_manager-enabled-types-cleanup.sh
- id: revision_manager-enable-node
  input: Using the revision_manager module, enable revision management for the node entity type and set
    its default Amount policy to keep a minimum of 3 revisions. Apply the change to the live configuration.
  criteria: 'revision_manager.settings has enabled_entities.node = true and defaults.node.amount = {id:
    amount, status: true, settings: {amount: 3}}.'
  bundle: revision_manager
  rubric_ref: rubric/revision_manager_revision_manager_enable_node@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/revision_manager-enable-node-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/revision_manager-enable-node-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/revision_manager-enable-node-verify.sh
- id: revision_manager-bundle-override
  input: Revision management is enabled for nodes on this site. Override the policy for the Article content
    type specifically so that Articles keep a minimum of 10 revisions (Amount plugin), stored as a bundle-level
    override. Apply the change to the live site.
  criteria: The node.type.article config entity gains a third-party setting revision_manager.amount with
    settings.amount = 10 (status true), overriding the entity-type default for Articles.
  bundle: revision_manager
  rubric_ref: rubric/revision_manager_revision_manager_bundle_override@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/revision_manager-bundle-override-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/revision_manager-bundle-override-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/revision_manager-bundle-override-verify.sh
