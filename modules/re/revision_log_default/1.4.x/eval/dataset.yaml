metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: revision_log_default
  version: 1.4.x
  note: 'Revision Log Default is a zero-config behaviour module: one hook_entity_presave() that fills
    an empty revision log message on any ContentEntity implementing RevisionLogInterface. New entity =>
    ''Created new <bundle label>'' (e.g. ''Created new Article''); new translation => ''Created <language>
    translation''; update => ''Updated the <Field label> field'' (list of changed field labels) or ''Updated
    <bundle label>''. It never overwrites a provided message. No configure route, no permissions, no Drush,
    no plugins, no config schema. Medium cases are grounded in real generated state: setup saves a node
    so the module fills the message, agent reads it back via drush. Hard cases require the agent to create/edit
    a node WITHOUT a log message and let the module populate it, verified against the live node''s revision
    log message.'
questions:
- id: rld-created-message
  input: I enabled the Revision Log Default module. When I save a brand-new Article node without typing
    a revision log message, what message does it record, and which hook produces it?
  criteria: For a new entity it records 'Created new <bundle label>', e.g. 'Created new Article'. It is
    produced by revision_log_default_entity_presave() (hook_entity_presave), which only fills the message
    when it is empty.
  bundle: revision_log_default
  rubric_ref: rubric/revision_log_default_rld_created_message@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: rld-when-fires
  input: Does the Revision Log Default module overwrite a revision log message I typed myself? Which entities
    does it act on, and when does it decide to generate a message?
  criteria: It never overwrites a message you provided; it only acts when getRevisionLogMessage() is empty.
    It runs on save (hook_entity_presave) for content entities that implement RevisionLogInterface (nodes
    and other revisionable types).
  bundle: revision_log_default
  rubric_ref: rubric/revision_log_default_rld_when_fires@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: rld-update-message
  input: With Revision Log Default enabled, if I edit a node and change one field (say the Title) and
    save a new revision without a log message, what revision log message gets generated? And how does
    the module handle content-moderation workflows?
  criteria: It diffs the entity against its original and records 'Updated the <Field label> field' (e.g.
    'Updated the Title field'), listing multiple changed field labels if several changed, or 'Updated
    <label>' if none can be identified. For content_moderation/workbench_moderation entities it diffs
    against the latest revision rather than the default revision.
  bundle: revision_log_default
  rubric_ref: rubric/revision_log_default_rld_update_message@1.0
  tags:
  - mode:recipe
  - difficulty:easy
