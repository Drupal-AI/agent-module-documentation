metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: redirect_metrics
  version: 2.0.x
  note: Redirect metrics adds two base fields to the contrib `redirect` entity (access_count integer init
    0, last_access timestamp) via hook_entity_base_field_info, increments them from a KernelEvents::RESPONSE
    subscriber keyed on the X_REDIRECT_ID response header, and ships one View `redirect_metrics` with
    page_1 'Popular redirects' (admin/config/search/redirect/popular, sort access_count DESC) and page_2
    'Stale redirects' (admin/config/search/redirect/stale, filter last_access < -6 months). No settings
    form, no permissions, no drush, no plugins. Medium cases seed real redirect entities with known metric
    values and read them back; hard cases mutate real live state (the shipped View config, and a redirect
    entity whose access_count the module initialises) verified against the running site.
questions:
- id: redirect_metrics-base-fields
  input: The Drupal contrib module redirect_metrics tracks how redirects are used. Which two fields does
    it add to the redirect entity to store that data, and what does each hold?
  criteria: 'It adds two base fields to the redirect entity via hook_entity_base_field_info(): access_count
    (integer, initial value 0 = number of times the redirect was used) and last_access (timestamp = last
    time it was hit).'
  bundle: redirect_metrics
  rubric_ref: rubric/redirect_metrics_redirect_metrics_base_fields@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: redirect_metrics-counting-mechanism
  input: How does redirect_metrics know when a redirect has been used, so it can increment the count?
    Name the response header it keys on and where the logic runs.
  criteria: A response-event subscriber (redirect_metrics.request_subscriber) on KernelEvents::RESPONSE
    reads the X_REDIRECT_ID header that the redirect module sets on its redirect response, loads that
    redirect, increments access_count, sets last_access to the request time, and saves it.
  bundle: redirect_metrics
  rubric_ref: rubric/redirect_metrics_redirect_metrics_counting_mechanism@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: redirect_metrics-report-paths
  input: After enabling redirect_metrics, what report pages does it add for viewing redirect usage, and
    at which admin paths?
  criteria: 'It ships a View with two page displays: ''Popular redirects'' at admin/config/search/redirect/popular
    (sorted by access_count DESC) and ''Stale redirects'' at admin/config/search/redirect/stale (redirects
    whose last_access is older than 6 months), both as tabs under admin/config/search/redirect.'
  bundle: redirect_metrics
  rubric_ref: rubric/redirect_metrics_redirect_metrics_report_paths@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: redirect_metrics-known-count
  input: On this Drupal site there is a redirect whose source path is 'rm-known-src'. Using redirect_metrics'
    tracking fields, inspect the live redirect entity and state how many times it has been accessed (its
    access_count value).
  criteria: The redirect from rm-known-src has access_count = 42 (stored on the redirect entity's redirect_metrics
    base field access_count).
  bundle: redirect_metrics
  rubric_ref: rubric/redirect_metrics_redirect_metrics_known_count@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
