metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: registration_workflow
  version: 3.4.x
  note: Submodule of registration. Adds one dynamic permission per workflow transition (use <workflow>
    <transition> transition), a transition route/form, and Cancel/transition UI operations. Config object
    registration_workflow.settings has require_update_access (default true) and prevent_complete_own (default
    false). Cases are grounded in that config object and the permission naming.
questions:
- id: regwf-what
  input: What does the Registration Workflow submodule add on top of the base registration workflow states,
    and how does it let a role be allowed to cancel registrations?
  criteria: It adds a permission per workflow transition and UI operations/buttons for transitions. To
    allow cancelling, grant the 'use registration cancel transition' permission (plus, by default, update
    access to the registration).
  bundle: registration_workflow
  rubric_ref: rubric/registration_workflow_regwf_what@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: regwf-permission-name
  input: In the Registration Workflow submodule, what is the naming pattern for the permission that governs
    a specific workflow transition? Give the permission that controls completing a registration in the
    default 'registration' workflow.
  criteria: 'Pattern: `use <workflow_id> <transition_id> transition`. Completing uses `use registration
    complete transition`.'
  bundle: registration_workflow
  rubric_ref: rubric/registration_workflow_regwf_permission_name@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: regwf-settings
  input: Which two settings does the Registration Workflow submodule expose in registration_workflow.settings,
    and what do they do?
  criteria: require_update_access (default true) requires the user to also have update access to the registration
    to transition it; prevent_complete_own (default false) stops users completing their own registrations.
  bundle: registration_workflow
  rubric_ref: rubric/registration_workflow_regwf_settings@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: regwf-known
  input: On this site, inspect the Registration Workflow configuration and state whether users are currently
    allowed to complete their own registrations.
  criteria: 'No - users cannot complete their own registrations: registration_workflow.settings.prevent_complete_own
    is currently true.'
  bundle: registration_workflow
  rubric_ref: rubric/registration_workflow_regwf_known@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/registration_workflow-known-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/registration_workflow-known-cleanup.sh
- id: regwf-enable-prevent
  input: On this site, configure Registration Workflow so that users are not allowed to complete (approve)
    their own registrations, and apply the change to the live site.
  criteria: registration_workflow.settings.prevent_complete_own = true (set via config factory and save).
  bundle: registration_workflow
  rubric_ref: rubric/registration_workflow_regwf_enable_prevent@1.0
