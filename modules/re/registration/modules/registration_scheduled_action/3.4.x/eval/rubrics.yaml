rubrics:
- id: registration_scheduled_action_regsa_what
  version: '1.0'
  applicable_bundles:
  - registration_scheduled_action
  checks:
  - kind: must_contain_any
    values:
    - cron
    - before
    - after
    - email
    - schedule
  scoring:
    combine: all_pass
- id: registration_scheduled_action_regsa_datetime
  version: '1.0'
  applicable_bundles:
  - registration_scheduled_action
  checks:
  - kind: must_contain_any
    values:
    - length
    - position
    - before
    - after
    - days
  scoring:
    combine: all_pass
- id: registration_scheduled_action_regsa_plugin
  version: '1.0'
  applicable_bundles:
  - registration_scheduled_action
  checks:
  - kind: must_contain_any
    values:
    - registration_send_email_action
    - QueryableActionInterface
    - action plugin
  scoring:
    combine: all_pass
- id: registration_scheduled_action_regsa_known
  version: '1.0'
  applicable_bundles:
  - registration_scheduled_action
  checks:
  - kind: must_contain_any
    values:
    - '7'
  scoring:
    combine: all_pass
- id: registration_scheduled_action_regsa_create
  version: '1.0'
  applicable_bundles:
  - registration_scheduled_action
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
