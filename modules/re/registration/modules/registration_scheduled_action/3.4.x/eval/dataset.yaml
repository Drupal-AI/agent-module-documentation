metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: registration_scheduled_action
  version: 3.4.x
  note: Submodule of registration. Provides a registration_scheduled_action config entity (managed at
    /admin/structure/registration/schedule) that wraps a registration-type Action plugin (e.g. registration_send_email_action)
    with a datetime offset (length/type/position before|after) run by a cron worker. Medium reads a known
    scheduled action; hard creates one, verified as a live config entity.
questions:
- id: regsa-what
  input: What does the Registration Scheduled Action submodule let you build, and what runs the scheduled
    actions?
  criteria: It lets you define cron-driven actions (usually emails) that run a configurable time before/after
    a registration date across matching registrations. A cron worker (RegistrationSchedule) evaluates
    and runs them.
  bundle: registration_scheduled_action
  rubric_ref: rubric/registration_scheduled_action_regsa_what@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: regsa-datetime
  input: How is the timing of a Registration Scheduled Action expressed in its configuration? Name the
    parts of the datetime offset and their allowed values.
  criteria: A datetime mapping with length (integer), type (minutes/hours/days/months) and position (before/after)
    - e.g. length 3, type days, position before = '3 days before'.
  bundle: registration_scheduled_action
  rubric_ref: rubric/registration_scheduled_action_regsa_datetime@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: regsa-plugin
  input: A Registration Scheduled Action runs an action plugin. Which kind of plugin can it run, and what
    is a typical example provided by the base Registration module?
  criteria: A core Action plugin of type 'registration' that implements QueryableActionInterface; the
    typical example is registration_send_email_action (email registrants).
  bundle: registration_scheduled_action
  rubric_ref: rubric/registration_scheduled_action_regsa_plugin@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: regsa-known
  input: This site has a registration scheduled action named reg_sched_known. Inspect its configuration
    and state how far before (or after) the date it is scheduled to run - i.e. its length and period.
  criteria: '7 days before: registration_scheduled_action.reg_sched_known has datetime.length = 7, datetime.type
    = days, datetime.position = before.'
  bundle: registration_scheduled_action
  rubric_ref: rubric/registration_scheduled_action_regsa_known@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/registration_scheduled_action-known-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/registration_scheduled_action-known-cleanup.sh
- id: regsa-create
  input: On this site, create a Registration Scheduled Action with machine name reg_sched_build that emails
    registrants (using the registration_send_email_action plugin) 3 days before the relevant date. Apply
    the change to the live site.
  criteria: A registration_scheduled_action config entity reg_sched_build exists with plugin=registration_send_email_action
    and datetime {length:3, type:days, position:before}.
  bundle: registration_scheduled_action
  rubric_ref: rubric/registration_scheduled_action_regsa_create@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/registration_scheduled_action-enable-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/registration_scheduled_action-enable-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/registration_scheduled_action-enable-verify.sh
