metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: registration_admin_overrides
  version: 3.4.x
  note: Submodule of registration. Adds five per-registration-type third-party booleans under key registration_admin_overrides
    (status, maximum_spaces, capacity, open, close) plus five matching restricted permissions. An override
    applies only when the type enables the boolean AND the account has the permission. Cases are grounded
    in that third-party config on a registration_type.
questions:
- id: regao-what-overrides
  input: The Registration Administrative Overrides submodule lets privileged users bypass registration
    limits. Which specific limits can be overridden, and what two things must both be true for an override
    to take effect for a given user?
  criteria: It can override status (disabled host), maximum_spaces, capacity, open date and close date.
    An override applies only when the registration type enables that override (third-party setting) AND
    the account has the matching 'registration override ...' permission (or administer registration).
  bundle: registration_admin_overrides
  rubric_ref: rubric/registration_admin_overrides_regao_what_overrides@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: regao-where-stored
  input: In Registration Administrative Overrides, where exactly is the per-event-type override configuration
    stored? Give the config location and key.
  criteria: 'As third-party settings on the registration_type config entity: registration.type.<id> ->
    third_party_settings.registration_admin_overrides.{status,maximum_spaces,capacity,open,close} (each
    a boolean). There is no separate settings form.'
  bundle: registration_admin_overrides
  rubric_ref: rubric/registration_admin_overrides_regao_where_stored@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: regao-permissions
  input: Which permission does a user need to be allowed to add a registration AFTER an event's close
    date when using Registration Administrative Overrides?
  criteria: The 'registration override close' permission (and the registration type must enable the 'close'
    override). 'administer registration' also implies it.
  bundle: registration_admin_overrides
  rubric_ref: rubric/registration_admin_overrides_regao_permissions@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: regao-known-override
  input: This site has a registration type reg_ovr with exactly one administrative override enabled. Inspect
    its configuration and state which override (which limit an admin may bypass) is turned on.
  criteria: 'capacity: registration.type.reg_ovr has third_party_settings.registration_admin_overrides.capacity
    = true (all others false).'
  bundle: registration_admin_overrides
  rubric_ref: rubric/registration_admin_overrides_regao_known_override@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/registration_admin_overrides-known-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/registration_admin_overrides-known-cleanup.sh
- id: regao-enable-close
  input: On this site, the registration type reg_ovr currently has all administrative overrides disabled.
    Using Registration Administrative Overrides, enable the override that lets a permitted user register
    after the close date, and apply the change to the live site.
  criteria: registration.type.reg_ovr has third_party_settings.registration_admin_overrides.close = true
    (setThirdPartySetting('registration_admin_overrides','close',TRUE)).
  bundle: registration_admin_overrides
  rubric_ref: rubric/registration_admin_overrides_regao_enable_close@1.0
