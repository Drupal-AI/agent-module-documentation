metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: registration_cancel_by
  version: 3.4.x
  note: Submodule of registration (depends on registration_workflow). Adds a cancel_by datetime base field
    to the registration_settings entity plus a CancelByConstraint; a CancelByAccessCheck denies the cancel
    transition after the deadline unless the account has 'bypass cancel by access'. Medium reads a known
    cancel_by off a registration_settings entity; hard sets cancel_by on a registration_settings entity,
    verified live. Fixtures use synthetic host node ids (no node required).
questions:
- id: regcb-what
  input: What does the Registration Cancel By submodule add, and where is the cancel-by deadline stored?
    Does it have its own settings form or config object?
  criteria: It adds a cancel_by datetime base field to each host's registration_settings entity (edited
    on the host's registration settings form). There is no config object or dedicated settings form; the
    deadline is per host.
  bundle: registration_cancel_by
  rubric_ref: rubric/registration_cancel_by_regcb_what@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: regcb-permission
  input: In Registration Cancel By, which permission lets a user cancel a registration even after the
    cancel-by deadline has passed?
  criteria: The `bypass cancel by access` permission; without it, cancellation is blocked once the host's
    cancel_by date has passed.
  bundle: registration_cancel_by
  rubric_ref: rubric/registration_cancel_by_regcb_permission@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: regcb-depends
  input: Why does Registration Cancel By depend on the Registration Workflow submodule?
  criteria: Because cancellation is a workflow transition; Cancel By enforces the deadline on that cancel
    transition (via CancelByAccessCheck on the cancel route), so it needs Registration Workflow.
  bundle: registration_cancel_by
  rubric_ref: rubric/registration_cancel_by_regcb_depends@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: regcb-known
  input: On this site a registration settings record exists for a host (node entity id 999601) with a
    cancellation deadline set. Inspect the live registration_settings and give the cancel-by date/time
    configured for that host.
  criteria: '2030-09-15T17:00:00: the registration_settings entity for node/999601 has cancel_by = 2030-09-15T17:00:00.'
  bundle: registration_cancel_by
  rubric_ref: rubric/registration_cancel_by_regcb_known@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/registration_cancel_by-known-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/registration_cancel_by-known-cleanup.sh
- id: regcb-set
  input: On this site there is a registration settings record for a host (node entity id 999602) with
    no cancellation deadline. Using Registration Cancel By, set its cancel-by deadline to 2030-12-31T17:00:00
    and apply the change to the live site.
  criteria: The registration_settings entity for node/999602 has cancel_by = 2030-12-31T17:00:00 (set
    the cancel_by field on the settings entity and save).
  bundle: registration_cancel_by
  rubric_ref: rubric/registration_cancel_by_regcb_set@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/registration_cancel_by-enable-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/registration_cancel_by-enable-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/registration_cancel_by-enable-verify.sh
