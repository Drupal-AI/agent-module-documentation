rubrics:
- id: registration_purger_regpurge_what
  version: '1.0'
  applicable_bundles:
  - registration_purger
  checks:
  - kind: must_contain_any
    values:
    - delete
    - purge
    - registration settings
    - registrations
  scoring:
    combine: all_pass
- id: registration_purger_regpurge_keys
  version: '1.0'
  applicable_bundles:
  - registration_purger
  checks:
  - kind: must_contain_any
    values:
    - registration_purger.settings
    - purge_registration_on_delete
    - purge_registration_on_update
  scoring:
    combine: all_pass
- id: registration_purger_regpurge_on_update
  version: '1.0'
  applicable_bundles:
  - registration_purger
  checks:
  - kind: must_contain_any
    values:
    - purge_registration_on_update
    - on_update
    - update
  scoring:
    combine: all_pass
- id: registration_purger_regpurge_known
  version: '1.0'
  applicable_bundles:
  - registration_purger
  checks:
  - kind: must_contain_any
    values:
    - 'true'
    - 'yes'
    - enabled
    - 'on'
  scoring:
    combine: all_pass
- id: registration_purger_regpurge_enable_update
  version: '1.0'
  applicable_bundles:
  - registration_purger
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
