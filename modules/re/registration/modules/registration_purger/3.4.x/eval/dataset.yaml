metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: registration_purger
  version: 3.4.x
  note: 'Submodule of registration. One config object registration_purger.settings with four booleans:
    purge_registration_on_delete (default true), purge_registration_settings_on_delete (true), purge_registration_on_update
    (false), purge_registration_settings_on_update (false). Hooks entity_delete/entity_update call registration_purger.purger.
    Cases are grounded in that config object.'
questions:
- id: regpurge-what
  input: What does the Registration Purger submodule do by default when a host entity (e.g. an event node)
    is deleted?
  criteria: By default (purge_registration_on_delete and purge_registration_settings_on_delete both true)
    it deletes that host's registrations and its registration_settings entity when the host is deleted,
    preventing orphaned data.
  bundle: registration_purger
  rubric_ref: rubric/registration_purger_regpurge_what@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: regpurge-keys
  input: Which config object and keys control the Registration Purger, and what are their default values?
  criteria: registration_purger.settings with purge_registration_on_delete (true), purge_registration_settings_on_delete
    (true), purge_registration_on_update (false), purge_registration_settings_on_update (false).
  bundle: registration_purger
  rubric_ref: rubric/registration_purger_regpurge_keys@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: regpurge-on-update
  input: How do you make Registration Purger also delete a host's registrations when the host is edited
    so that registration is disabled (not only when the host is deleted)?
  criteria: Set purge_registration_on_update (and/or purge_registration_settings_on_update) to true in
    registration_purger.settings; these default to false and cover the entity_update path where registration
    becomes disabled.
  bundle: registration_purger
  rubric_ref: rubric/registration_purger_regpurge_on_update@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: regpurge-known
  input: On this site, inspect the Registration Purger configuration and state whether it currently purges
    a host's registrations when the host is updated to disable registration (the on-update behaviour).
  criteria: 'Yes / true: registration_purger.settings.purge_registration_on_update is currently true.'
  bundle: registration_purger
  rubric_ref: rubric/registration_purger_regpurge_known@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/registration_purger-known-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/registration_purger-known-cleanup.sh
- id: regpurge-enable-update
  input: On this site, configure Registration Purger so that when a host entity is updated to disable
    registration, its registrations are automatically deleted. Apply the change to the live site.
  criteria: registration_purger.settings.purge_registration_on_update = true (set it via config factory
    and save).
  bundle: registration_purger
  rubric_ref: rubric/registration_purger_regpurge_enable_update@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/registration_purger-enable-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/registration_purger-enable-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/registration_purger-enable-verify.sh
