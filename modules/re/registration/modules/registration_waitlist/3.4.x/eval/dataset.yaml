metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: registration_waitlist
  version: 3.4.x
  note: Submodule of registration. Adds a `waitlist` workflow state, per-host settings registration_waitlist_capacity
    (int) and registration_waitlist_autofill (bool), and per-registration-type third-party settings under
    key registration_waitlist (confirmation_email, confirmation_email_subject/message, autofill_sort_field/order).
    Medium reads a wait-list capacity off a registration_settings entity; hard enables the wait-list confirmation
    email on a registration type.
questions:
- id: regwl-what-state
  input: What does the Registration Wait List submodule add so that people can still sign up after an
    event is full, and what is the name of the registration state it uses?
  criteria: It adds a `waitlist` workflow state; when a host reaches capacity a new registration is placed
    in the waitlist state instead of being rejected. Wait-listed registrations do not consume standard
    capacity.
  bundle: registration_waitlist
  rubric_ref: rubric/registration_waitlist_regwl_what_state@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: regwl-capacity-setting
  input: In the Registration Wait List submodule, which per-host setting limits how many wait-list places
    exist, and which setting causes wait-listed people to be promoted automatically when a spot opens?
  criteria: registration_waitlist_capacity (integer, default 0) caps the wait list; registration_waitlist_autofill
    (boolean) enables automatic promotion of wait-listed registrations into freed standard capacity.
  bundle: registration_waitlist
  rubric_ref: rubric/registration_waitlist_regwl_capacity_setting@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: regwl-autofill-order
  input: By default, in what order does the Registration Wait List submodule promote wait-listed registrations
    into open slots, and which per-type settings control that order?
  criteria: 'By default oldest-first: Registration ID ascending. The per-registration-type third-party
    settings autofill_sort_field (default registration_id) and autofill_sort_order (ASC) control it.'
  bundle: registration_waitlist
  rubric_ref: rubric/registration_waitlist_regwl_autofill_order@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: regwl-known-capacity
  input: On this site a registration settings record exists for a host (node entity id 999501) with a
    wait list configured. Inspect the live registration_settings and state the wait-list capacity configured
    for that host.
  criteria: '15: the registration_settings entity for node/999501 has registration_waitlist_capacity =
    15.'
  bundle: registration_waitlist
  rubric_ref: rubric/registration_waitlist_regwl_known_capacity@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/registration_waitlist-known-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/registration_waitlist-known-cleanup.sh
- id: regwl-enable-confirmation
  input: On this site, the registration type reg_wl does not email people when they are added to the wait
    list. Using the Registration Wait List submodule, enable the wait-list confirmation email for this
    registration type and apply the change to the live site.
  criteria: registration.type.reg_wl has third_party_settings.registration_waitlist.confirmation_email
    = true (setThirdPartySetting('registration_waitlist','confirmation_email',TRUE)).
  bundle: registration_waitlist
  rubric_ref: rubric/registration_waitlist_regwl_enable_confirmation@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/registration_waitlist-enable-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/registration_waitlist-enable-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/registration_waitlist-enable-verify.sh
