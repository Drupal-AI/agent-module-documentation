rubrics:
- id: registration_waitlist_regwl_what_state
  version: '1.0'
  applicable_bundles:
  - registration_waitlist
  checks:
  - kind: must_contain_any
    values:
    - waitlist
    - wait list
  scoring:
    combine: all_pass
- id: registration_waitlist_regwl_capacity_setting
  version: '1.0'
  applicable_bundles:
  - registration_waitlist
  checks:
  - kind: must_contain_any
    values:
    - registration_waitlist_capacity
    - registration_waitlist_autofill
    - autofill
  scoring:
    combine: all_pass
- id: registration_waitlist_regwl_autofill_order
  version: '1.0'
  applicable_bundles:
  - registration_waitlist
  checks:
  - kind: must_contain_any
    values:
    - autofill_sort_field
    - autofill_sort_order
    - registration_id
    - oldest
  scoring:
    combine: all_pass
- id: registration_waitlist_regwl_known_capacity
  version: '1.0'
  applicable_bundles:
  - registration_waitlist
  checks:
  - kind: must_contain_any
    values:
    - '15'
  scoring:
    combine: all_pass
- id: registration_waitlist_regwl_enable_confirmation
  version: '1.0'
  applicable_bundles:
  - registration_waitlist
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
