rubrics:
- id: registration_change_host_regch_what
  version: '1.0'
  applicable_bundles:
  - registration_change_host
  checks:
  - kind: must_contain_any
    values:
    - multistep
    - single_step
    - single-step
    - change host
  scoring:
    combine: all_pass
- id: registration_change_host_regch_permissions
  version: '1.0'
  applicable_bundles:
  - registration_change_host
  checks:
  - kind: must_contain_any
    values:
    - change host any registration
    - change host own registration
  scoring:
    combine: all_pass
- id: registration_change_host_regch_data_loss
  version: '1.0'
  applicable_bundles:
  - registration_change_host
  checks:
  - kind: must_contain_any
    values:
    - allow_data_loss
  scoring:
    combine: all_pass
- id: registration_change_host_regch_known_workflow
  version: '1.0'
  applicable_bundles:
  - registration_change_host
  checks:
  - kind: must_contain_any
    values:
    - single_step
    - single-step
    - single step
  scoring:
    combine: all_pass
- id: registration_change_host_regch_set_singlestep
  version: '1.0'
  applicable_bundles:
  - registration_change_host
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
