metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: registration_change_host
  version: 3.4.x
  note: Submodule of registration. Lets an existing registration be moved to another host. Config object
    registration_change_host.settings has `workflow` (multistep default | single_step) plus title strings;
    per-type third-party allow_data_loss; permissions change host any/own registration; manager service
    registration_change_host.manager. Cases are grounded in that config object and permissions.
questions:
- id: regch-what
  input: What does the Registration Change Host submodule let you do, and which two change flows does
    it support?
  criteria: 'It lets an existing registration be moved to a different host entity. Two flows selected
    by registration_change_host.settings.workflow: `multistep` (choose a new host, then confirm) or `single_step`
    (one form).'
  bundle: registration_change_host
  rubric_ref: rubric/registration_change_host_regch_what@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: regch-permissions
  input: Which permissions does Registration Change Host add to control who may move a registration to
    a different host?
  criteria: '`change host any registration` (any registration) and `change host own registration` (the
    user''s own registrations).'
  bundle: registration_change_host
  rubric_ref: rubric/registration_change_host_regch_permissions@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: regch-data-loss
  input: In Registration Change Host, what per-registration-type setting decides whether a registration
    may be moved to a host of a different registration type (where type-specific field data could be lost)?
  criteria: The third-party boolean `allow_data_loss` on the registration type (registration.type.*.third_party.registration_change_host.allow_data_loss,
    default false).
  bundle: registration_change_host
  rubric_ref: rubric/registration_change_host_regch_data_loss@1.0
  tags:
  - mode:recipe
  - difficulty:easy
