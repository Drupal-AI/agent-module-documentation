rubrics:
- id: registration_inline_entity_form_regief_what
  version: '1.0'
  applicable_bundles:
  - registration_inline_entity_form
  checks:
  - kind: must_contain_any
    values:
    - inline
    - host edit form
    - Inline Entity Form
    - registration settings
  scoring:
    combine: all_pass
- id: registration_inline_entity_form_regief_widget
  version: '1.0'
  applicable_bundles:
  - registration_inline_entity_form
  checks:
  - kind: must_contain_any
    values:
    - inline_entity_form_settings
    - Manage form display
    - form display
  scoring:
    combine: all_pass
- id: registration_inline_entity_form_regief_permission
  version: '1.0'
  applicable_bundles:
  - registration_inline_entity_form
  checks:
  - kind: must_contain_any
    values:
    - edit registration settings
  scoring:
    combine: all_pass
- id: registration_inline_entity_form_regief_known
  version: '1.0'
  applicable_bundles:
  - registration_inline_entity_form
  checks:
  - kind: must_contain_any
    values:
    - inline_entity_form_settings
  scoring:
    combine: all_pass
- id: registration_inline_entity_form_regief_set_widget
  version: '1.0'
  applicable_bundles:
  - registration_inline_entity_form
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
