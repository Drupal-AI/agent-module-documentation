metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: registration_inline_entity_form
  version: 3.4.x
  note: Submodule of registration (depends on inline_entity_form). Provides a field widget `inline_entity_form_settings`
    (for the registration field type) that embeds the host's registration settings inline on the host
    edit form, plus the permission `edit registration settings`. Medium/hard are grounded in a registration
    field's form-display widget on node.article.
questions:
- id: regief-what
  input: What does the Registration Inline Entity Form submodule let editors do, and which module does
    it integrate with?
  criteria: It integrates with the contrib Inline Entity Form module so that a host's registration settings
    can be edited inline on the host's own edit form (instead of a separate settings page).
  bundle: registration_inline_entity_form
  rubric_ref: rubric/registration_inline_entity_form_regief_what@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: regief-widget
  input: How do you turn on inline editing of registration settings for an event content type using this
    submodule? Name the field widget involved.
  criteria: On the host bundle's Manage form display, set the registration field's widget to `inline_entity_form_settings`
    ('Inline entity form - Settings').
  bundle: registration_inline_entity_form
  rubric_ref: rubric/registration_inline_entity_form_regief_widget@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: regief-permission
  input: Which permission does Registration Inline Entity Form add to allow editing registration settings
    on host entities?
  criteria: The `edit registration settings` permission - edit all registration settings for new and existing
    hosts regardless of registration type.
  bundle: registration_inline_entity_form
  rubric_ref: rubric/registration_inline_entity_form_regief_permission@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: regief-known
  input: On this site, the Article content type has a Registration field named field_reg_ief. Inspect
    the default form display for Article and state which field widget is configured for that field.
  criteria: 'inline_entity_form_settings: in core.entity_form_display.node.article.default the field_reg_ief
    component uses the inline_entity_form_settings widget.'
  bundle: registration_inline_entity_form
  rubric_ref: rubric/registration_inline_entity_form_regief_known@1.0
  tags:
  - mode:introspection
  - difficulty:medium
