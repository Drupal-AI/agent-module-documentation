metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: registration_confirmation
  version: 3.4.x
  note: 'Submodule of registration. Adds three per-registration-type third-party settings under key registration_confirmation:
    enable (bool), subject (string), message ({value,format}). An EventSubscriber emails the registrant
    on completion. Cases are grounded in that third-party config on a registration_type.'
questions:
- id: regconf-what
  input: What does the Registration Confirmation submodule do, when does it send its email, and which
    three settings does it add to each registration type?
  criteria: 'It sends a confirmation email to the registrant immediately when a registration reaches the
    completed state. It adds three per-registration-type third-party settings: enable (boolean), subject
    (string), and message (text_format value/format).'
  bundle: registration_confirmation
  rubric_ref: rubric/registration_confirmation_regconf_what@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: regconf-where
  input: In the Registration Confirmation submodule, where is the confirmation subject and message stored
    for a given event type, and is there a global settings page?
  criteria: 'There is no global settings page; it is configured per registration type as third-party settings:
    registration.type.<id> -> third_party_settings.registration_confirmation.{enable,subject,message}.'
  bundle: registration_confirmation
  rubric_ref: rubric/registration_confirmation_regconf_where@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: regconf-tokens
  input: Can the Registration Confirmation email include the event's title dynamically, and what makes
    that work?
  criteria: Yes - the subject and message support tokens (e.g. [node:title], plus registration/host tokens)
    which resolve at send time when the Token module is installed.
  bundle: registration_confirmation
  rubric_ref: rubric/registration_confirmation_regconf_tokens@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: regconf-known-subject
  input: This site has a registration type reg_conf that sends a confirmation email. Inspect its configuration
    and give the exact confirmation email subject line configured for it.
  criteria: '''Reg Conf Confirmed'': registration.type.reg_conf has third_party_settings.registration_confirmation.subject
    = ''Reg Conf Confirmed'' (enable = true).'
  bundle: registration_confirmation
  rubric_ref: rubric/registration_confirmation_regconf_known_subject@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/registration_confirmation-known-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/registration_confirmation-known-cleanup.sh
- id: regconf-enable
  input: On this site, the registration type reg_conf does not currently send a confirmation email. Using
    the Registration Confirmation submodule, turn on the confirmation email for this registration type
    and apply the change to the live site.
  criteria: registration.type.reg_conf has third_party_settings.registration_confirmation.enable = true
    (setThirdPartySetting('registration_confirmation','enable',TRUE)).
  bundle: registration_confirmation
  rubric_ref: rubric/registration_confirmation_regconf_enable@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/registration_confirmation-enable-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/registration_confirmation-enable-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/registration_confirmation-enable-verify.sh
