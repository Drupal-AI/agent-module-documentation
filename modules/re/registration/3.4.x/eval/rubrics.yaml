rubrics:
- id: registration_registration_enable_on_entity
  version: '1.0'
  applicable_bundles:
  - registration
  checks:
  - kind: must_contain_any
    values:
    - allowed_types
    - registration_type
    - field of type
    - Registration field
  scoring:
    combine: all_pass
- id: registration_registration_type_keys
  version: '1.0'
  applicable_bundles:
  - registration
  checks:
  - kind: must_contain_any
    values:
    - defaultState
    - heldExpireTime
    - heldExpireState
    - workflow
  scoring:
    combine: all_pass
- id: registration_registration_host_limits
  version: '1.0'
  applicable_bundles:
  - registration
  checks:
  - kind: must_contain_any
    values:
    - capacity
    - open
    - close
  scoring:
    combine: all_pass
- id: registration_registration_known_type
  version: '1.0'
  applicable_bundles:
  - registration
  checks:
  - kind: must_contain_any
    values:
    - '72'
  scoring:
    combine: all_pass
- id: registration_registration_global_queue_threshold
  version: '1.0'
  applicable_bundles:
  - registration
  checks:
  - kind: must_contain_any
    values:
    - '25'
  scoring:
    combine: all_pass
- id: registration_registration_build_type
  version: '1.0'
  applicable_bundles:
  - registration
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
- id: registration_registration_add_field
  version: '1.0'
  applicable_bundles:
  - registration
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
