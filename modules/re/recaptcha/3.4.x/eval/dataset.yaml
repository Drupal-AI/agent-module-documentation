metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: recaptcha
  version: 3.4.x
  note: reCAPTCHA plugs into the core CAPTCHA framework via hook_captcha() rather than defining its own
    plugin type; it has a settings form but these recipe cases probe load-bearing facts (dependency, challenge
    registration, config keys, route, permission) response-graded, with no site mutation.
questions:
- id: recaptcha-requires-captcha
  input: On a Drupal 11 site I want to add a Google reCAPTCHA challenge to forms using the reCAPTCHA module.
    Which other contrib module must also be enabled for it to work, and why?
  criteria: The CAPTCHA module (drupal/captcha) is a hard dependency; reCAPTCHA registers its challenge
    through CAPTCHA's framework and is assigned to forms via the CAPTCHA admin UI.
  bundle: recaptcha
  rubric_ref: rubric/recaptcha_recaptcha_requires_captcha@1.0
  tags:
  - mode:recipe
- id: recaptcha-challenge-type
  input: How does the reCAPTCHA module expose its challenge to the CAPTCHA module? Name the hook it implements
    and the challenge type string it registers.
  criteria: It implements hook_captcha() (recaptcha_captcha()); on $op === 'list' it returns ['reCAPTCHA'],
    the selectable challenge type used as a captcha_point challenge.
  bundle: recaptcha
  rubric_ref: rubric/recaptcha_recaptcha_challenge_type@1.0
  tags:
  - mode:recipe
- id: recaptcha-config-keys
  input: Which config object stores the reCAPTCHA module's settings, and what are the two key names that
    hold the public and private keys from the Google reCAPTCHA console?
  criteria: The recaptcha.settings config object; site_key holds the public key and secret_key holds the
    private/secret key used for server-side verification.
  bundle: recaptcha
  rubric_ref: rubric/recaptcha_recaptcha_config_keys@1.0
  tags:
  - mode:recipe
- id: recaptcha-admin-route
  input: Where do I enter the reCAPTCHA site key and secret key in the Drupal admin UI? Give the settings
    form's path or route name.
  criteria: At Admin > Configuration > People > CAPTCHA > reCAPTCHA, path /admin/config/people/captcha/recaptcha
    (route recaptcha.admin_settings_form).
  bundle: recaptcha
  rubric_ref: rubric/recaptcha_recaptcha_admin_route@1.0
  tags:
  - mode:recipe
- id: recaptcha-permission
  input: Which permission controls access to the reCAPTCHA settings form on a Drupal site? Give the exact
    permission string.
  criteria: The 'administer recaptcha' permission gates the settings form where the site key, secret key
    and widget options are configured.
  bundle: recaptcha
  rubric_ref: rubric/recaptcha_recaptcha_permission@1.0
  tags:
  - mode:recipe
- id: recaptcha-attach-to-form
  input: I have keys entered on the reCAPTCHA settings form. Now how do I actually make the reCAPTCHA
    challenge appear on my user registration form? Do I need to write code?
  criteria: 'No code needed: go to the CAPTCHA settings (/admin/config/people/captcha) and assign the
    reCAPTCHA challenge type to the form''s form_id (or as the default).'
  bundle: recaptcha
  rubric_ref: rubric/recaptcha_recaptcha_attach_to_form@1.0
  tags:
  - mode:recipe
- id: recaptcha-verify-hostname
  input: The reCAPTCHA config has settings for stricter validation and for use in regions where google.com
    is blocked. Name the two recaptcha.settings keys that control these and what each does.
  criteria: verify_hostname locally validates the response hostname; use_globally swaps www.google.com
    for the www.recaptcha.net endpoint for regions where google.com is blocked.
  bundle: recaptcha
  rubric_ref: rubric/recaptcha_recaptcha_verify_hostname@1.0
  tags:
  - mode:recipe
