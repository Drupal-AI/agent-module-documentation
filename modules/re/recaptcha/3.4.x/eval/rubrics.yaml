rubrics:
- id: recaptcha_recaptcha_requires_captcha
  version: '1.0'
  applicable_bundles:
  - recaptcha
  checks:
  - kind: must_contain_any
    values:
    - captcha
    - CAPTCHA module
  scoring:
    combine: all_pass
- id: recaptcha_recaptcha_challenge_type
  version: '1.0'
  applicable_bundles:
  - recaptcha
  checks:
  - kind: must_contain_any
    values:
    - hook_captcha
    - recaptcha_captcha
    - reCAPTCHA
  scoring:
    combine: all_pass
- id: recaptcha_recaptcha_config_keys
  version: '1.0'
  applicable_bundles:
  - recaptcha
  checks:
  - kind: must_contain_any
    values:
    - recaptcha.settings
  scoring:
    combine: all_pass
- id: recaptcha_recaptcha_admin_route
  version: '1.0'
  applicable_bundles:
  - recaptcha
  checks:
  - kind: must_contain_any
    values:
    - /admin/config/people/captcha/recaptcha
    - recaptcha.admin_settings_form
  scoring:
    combine: all_pass
- id: recaptcha_recaptcha_permission
  version: '1.0'
  applicable_bundles:
  - recaptcha
  checks:
  - kind: must_contain_any
    values:
    - administer recaptcha
  scoring:
    combine: all_pass
- id: recaptcha_recaptcha_attach_to_form
  version: '1.0'
  applicable_bundles:
  - recaptcha
  checks:
  - kind: must_contain_any
    values:
    - CAPTCHA settings
    - /admin/config/people/captcha
    - form_id
    - assign
  scoring:
    combine: all_pass
- id: recaptcha_recaptcha_verify_hostname
  version: '1.0'
  applicable_bundles:
  - recaptcha
  checks:
  - kind: must_contain_any
    values:
    - verify_hostname
    - use_globally
  scoring:
    combine: all_pass
