metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: responsive_menu
  version: 4.4.x
  note: responsive_menu stores all behaviour in the single config object `responsive_menu.settings` (no
    config entities, no plugin types, no permissions of its own). Easy cases probe load-bearing facts
    (config object, keys, blocks, route, library); medium reads a known live config back; hard builds
    a specific settings combination verified against live config.
questions:
- id: responsive_menu-config-object
  input: On a Drupal 11 site using the Responsive menu (4.4.x) module, which single config object stores
    all of the module's settings, and which key in it selects the Drupal menu that is rendered as the
    horizontal desktop menu?
  criteria: Everything lives in the `responsive_menu.settings` config object; the `horizontal_menu` key
    holds the machine name of the menu rendered by the Horizontal menu block.
  bundle: responsive_menu
  rubric_ref: rubric/responsive_menu_responsive_menu_config_object@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: responsive_menu-admin-route
  input: Where do I configure the Responsive menu module in the Drupal admin UI, what is the route name
    of that settings form, and which permission does it require?
  criteria: Admin -> Configuration -> User interface -> Responsive menu at /admin/config/user-interface/responsive-menu,
    route responsive_menu.settings, gated by the 'administer site configuration' permission.
  bundle: responsive_menu
  rubric_ref: rubric/responsive_menu_responsive_menu_admin_route@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: responsive_menu-blocks
  input: Responsive menu (4.4.x) renders nothing until you place its blocks. Which two block plugins does
    it provide, and what does each one do?
  criteria: The `responsive_menu_toggle` block ('Responsive menu mobile icon', the burger toggle that
    opens the off-canvas panel) and the `responsive_menu_horizontal_menu` block ('Horizontal menu', the
    desktop-width menu shown past the breakpoint).
  bundle: responsive_menu
  rubric_ref: rubric/responsive_menu_responsive_menu_blocks@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: responsive_menu-off-canvas-menus-key
  input: In the Responsive menu module I want the off-canvas mobile panel to combine my 'main' and 'footer'
    menus into one. Which config key holds the off-canvas menu(s) and what format does it take for multiple
    menus?
  criteria: The `off_canvas_menus` key in responsive_menu.settings; it is a comma-delimited list of menu
    machine names (e.g. `main,footer`) which are merged in order into a single off-canvas menu.
  bundle: responsive_menu
  rubric_ref: rubric/responsive_menu_responsive_menu_off_canvas_menus_key@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: responsive_menu-known-setup
  input: 'On this live Drupal site the Responsive menu module is already configured. Inspect the running
    configuration and tell me: which Drupal menu is set as the horizontal (desktop) menu, which menu feeds
    the off-canvas mobile panel, which side does the off-canvas panel slide out from, and is the drag/swipe-to-open
    gesture enabled?'
  criteria: 'Reading responsive_menu.settings: horizontal_menu=admin, off_canvas_menus=footer, off_canvas_position=right,
    and drag is enabled (true). Breakpoint is Large / (min-width: 1000px), theme theme-white.'
  bundle: responsive_menu
  rubric_ref: rubric/responsive_menu_responsive_menu_known_setup@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/responsive_menu-known-setup-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/responsive_menu-known-setup-cleanup.sh
- id: responsive_menu-known-breakpoint
  input: On this live Drupal site, at what breakpoint (media query) does the Responsive menu module switch
    from the mobile off-canvas menu to the horizontal desktop menu, and which off-canvas mmenu theme (colour)
    is configured? Read the running configuration.
  criteria: 'responsive_menu.settings has horizontal_breakpoint=Large with horizontal_media_query ''(min-width:
    1000px)'', and off_canvas_theme=theme-white.'
  bundle: responsive_menu
  rubric_ref: rubric/responsive_menu_responsive_menu_known_breakpoint@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/responsive_menu-known-setup-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/responsive_menu-known-setup-cleanup.sh
