rubrics:
- id: responsive_menu_responsive_menu_config_object
  version: '1.0'
  applicable_bundles:
  - responsive_menu
  checks:
  - kind: must_contain_any
    values:
    - responsive_menu.settings
    - horizontal_menu
  scoring:
    combine: all_pass
- id: responsive_menu_responsive_menu_admin_route
  version: '1.0'
  applicable_bundles:
  - responsive_menu
  checks:
  - kind: must_contain_any
    values:
    - responsive_menu.settings
    - /admin/config/user-interface/responsive-menu
    - administer site configuration
  scoring:
    combine: all_pass
- id: responsive_menu_responsive_menu_blocks
  version: '1.0'
  applicable_bundles:
  - responsive_menu
  checks:
  - kind: must_contain_any
    values:
    - responsive_menu_toggle
    - responsive_menu_horizontal_menu
  scoring:
    combine: all_pass
- id: responsive_menu_responsive_menu_off_canvas_menus_key
  version: '1.0'
  applicable_bundles:
  - responsive_menu
  checks:
  - kind: must_contain_any
    values:
    - off_canvas_menus
    - comma
  scoring:
    combine: all_pass
- id: responsive_menu_responsive_menu_known_setup
  version: '1.0'
  applicable_bundles:
  - responsive_menu
  checks:
  - kind: must_contain_any
    values:
    - admin
  scoring:
    combine: all_pass
- id: responsive_menu_responsive_menu_known_breakpoint
  version: '1.0'
  applicable_bundles:
  - responsive_menu
  checks:
  - kind: must_contain_any
    values:
    - 1000px
    - Large
    - theme-white
  scoring:
    combine: all_pass
- id: responsive_menu_responsive_menu_build_config
  version: '1.0'
  applicable_bundles:
  - responsive_menu
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
- id: responsive_menu_responsive_menu_build_off_canvas
  version: '1.0'
  applicable_bundles:
  - responsive_menu
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
