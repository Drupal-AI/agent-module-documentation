metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: rest_export_nested
  version: 1.3.x
  note: Provides one Views display plugin, id 'rest_export_nested' (title 'REST export nested', extends
    core RestExport). Its render() renders via the serializer then decodes any field value that is a JSON
    string into real nested JSON (json_decode, with an HTML-entity-decoded fallback), and turns the literal
    'null' into real null. Typical use with Views Field View to embed a child view's rows as nested JSON.
    Adds an 'auth' display option. No settings page. Medium/hard read/build a Views display of plugin
    rest_export_nested on real views (ren_known_view / ren_task_view).
questions:
- id: ren-which-display
  input: I have a Views REST feed where one field contains a JSON string that comes out escaped as text.
    Which module/display makes it come out as real nested JSON, and what display do I add to my view?
  criteria: 'Use REST Export Nested: add a display of type ''REST export nested'' (plugin id rest_export_nested)
    to your view; it decodes any JSON-string field into nested JSON in the output.'
  bundle: rest_export_nested
  rubric_ref: rubric/rest_export_nested_ren_which_display@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: ren-what-it-does
  input: How does the REST export nested display decide which fields to turn into nested JSON, and what
    happens to a field whose value is the string 'null'?
  criteria: For every row it runs json_decode() (and an HTML-entity-decoded fallback) on each string field
    value; if it parses, the string is replaced with the decoded object/array. The literal string 'null'
    is converted to a real null.
  bundle: rest_export_nested
  rubric_ref: rubric/rest_export_nested_ren_what_it_does@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: ren-views-field-view
  input: What is the typical way to embed a child view's rows as nested JSON inside a parent REST export
    nested feed?
  criteria: 'Use Views Field View: build a child ''REST export''/''REST export nested'' display of the
    related content, then in the parent ''REST export nested'' display add a Views field pointing at the
    child view/display and pass the host id as its contextual filter; the child JSON string is decoded
    into nested JSON.'
  bundle: rest_export_nested
  rubric_ref: rubric/rest_export_nested_ren_views_field_view@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: ren-known-display
  input: 'On this site the View ''ren_known_view'' exposes a REST export that supports nested JSON. Inspect
    the view: what is the display plugin id of that display and at what path is it served?'
  criteria: The display uses plugin id rest_export_nested and is served at path 'ren-known' (views.view.ren_known_view
    display rest_export_1).
  bundle: rest_export_nested
  rubric_ref: rubric/rest_export_nested_ren_known_display@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/rest_export_nested-known-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/rest_export_nested-known-cleanup.sh
- id: ren-add-display
  input: The View 'ren_task_view' currently only has a default display. Add a 'REST export nested' display
    to it so it can output nested JSON, and save the change to the live view.
  criteria: Add a display with display_plugin 'rest_export_nested' (e.g. give it a path and serializer
    style) to ren_task_view and save. verify checks the view has a display whose display_plugin is rest_export_nested.
  bundle: rest_export_nested
  rubric_ref: rubric/rest_export_nested_ren_add_display@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/rest_export_nested-add-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/rest_export_nested-add-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/rest_export_nested-add-verify.sh
