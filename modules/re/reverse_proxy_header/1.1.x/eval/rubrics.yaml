rubrics:
- id: reverse_proxy_header_reverse_proxy_header_configure_where
  version: '1.0'
  applicable_bundles:
  - reverse_proxy_header
  checks:
  - kind: must_contain_any
    values:
    - settings.php
    - $settings
    - reverse_proxy_header
    - no admin
    - no UI
    - no settings page
  scoring:
    combine: all_pass
- id: reverse_proxy_header_reverse_proxy_header_trust_flag
  version: '1.0'
  applicable_bundles:
  - reverse_proxy_header
  checks:
  - kind: must_contain_any
    values:
    - reverse_proxy_header_trusted_addresses_ignore
    - trusted
    - spoof
    - reverse_proxy_addresses
    - reverse_proxy
  scoring:
    combine: all_pass
- id: reverse_proxy_header_reverse_proxy_header_how_picks_ip
  version: '1.0'
  applicable_bundles:
  - reverse_proxy_header
  checks:
  - kind: must_contain_any
    values:
    - REMOTE_ADDR
    - FILTER_VALIDATE_IP
    - first
    - '350'
    - KernelEvents
    - priority
  scoring:
    combine: all_pass
- id: reverse_proxy_header_reverse_proxy_header_known_header
  version: '1.0'
  applicable_bundles:
  - reverse_proxy_header
  checks:
  - kind: must_contain_any
    values:
    - HTTP_X_RPH_KNOWN_HEADER
  scoring:
    combine: all_pass
- id: reverse_proxy_header_reverse_proxy_header_ignore_flag
  version: '1.0'
  applicable_bundles:
  - reverse_proxy_header
  checks:
  - kind: must_contain_any
    values:
    - reverse_proxy_header_trusted_addresses_ignore
    - 'TRUE'
    - 'true'
    - 'yes'
    - always
  scoring:
    combine: all_pass
- id: reverse_proxy_header_reverse_proxy_header_set_header
  version: '1.0'
  applicable_bundles:
  - reverse_proxy_header
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
- id: reverse_proxy_header_reverse_proxy_header_always_trust
  version: '1.0'
  applicable_bundles:
  - reverse_proxy_header
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
