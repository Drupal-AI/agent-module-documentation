  input: On this Drupal site, configure the reverse_proxy_header module so Drupal reads the real client
    IP from the HTTP header HTTP_X_RPH_TASK_HEADER. Apply the change so it is live (readable via Settings).
  criteria: settings.php now sets $settings['reverse_proxy_header'] = 'HTTP_X_RPH_TASK_HEADER'; so \Drupal\Core\Site\Settings::get('reverse_proxy_header')
    returns that value.
  bundle: reverse_proxy_header
