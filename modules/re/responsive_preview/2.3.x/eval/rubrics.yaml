rubrics:
- id: responsive_preview_rp_device_entity
  version: '1.0'
  applicable_bundles:
  - responsive_preview
  checks:
  - kind: must_contain_any
    values:
    - config entity
    - responsive_preview_device
    - config_entity
  scoring:
    combine: all_pass
- id: responsive_preview_rp_add_custom_device
  version: '1.0'
  applicable_bundles:
  - responsive_preview
  checks:
  - kind: must_contain_any
    values:
    - dppx
    - dimensions
  scoring:
    combine: all_pass
- id: responsive_preview_rp_hide_device
  version: '1.0'
  applicable_bundles:
  - responsive_preview
  checks:
  - kind: must_contain_any
    values:
    - status
    - Show device in list
  scoring:
    combine: all_pass
- id: responsive_preview_rp_permissions
  version: '1.0'
  applicable_bundles:
  - responsive_preview
  checks:
  - kind: must_contain_any
    values:
    - access responsive preview
