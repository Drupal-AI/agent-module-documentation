metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: responsive_preview
  version: 2.3.x
  note: Responsive Preview adds a toolbar tab that reloads the current page in an iframe sized to `responsive_preview_device`
    config entities, exposes a `responsive_preview` service and a control block, and gates behavior with
    two permissions. Cases are `recipe` (response-graded) probing documented facts an agent would otherwise
    read source to answer; no site mutation.
questions:
- id: rp-device-entity
  input: On a Drupal 11 site using Responsive Preview, what kind of thing is a 'device' (phone, tablet,
    desktop) and where do I manage them?
  criteria: A device is a `responsive_preview_device` configuration entity. Manage them at Admin > Configuration
    > User interface > Responsive preview (/admin/config/user-interface/responsive-preview), the collection
    route entity.responsive_preview_device.collection.
  bundle: responsive_preview
  rubric_ref: rubric/responsive_preview_rp_device_entity@1.0
  tags:
  - mode:recipe
- id: rp-add-custom-device
  input: I want to add a custom device to Responsive Preview with a specific width, height and pixel density.
    Which fields does a device define?
  criteria: A device defines id, label, weight, status (show in list), orientation (portrait/landscape)
    and dimensions (width, height, dppx = dots per pixel). Add one via the Add Device form or a responsive_preview.device.{id}.yml
    config file.
  bundle: responsive_preview
  rubric_ref: rubric/responsive_preview_rp_add_custom_device@1.0
  tags:
  - mode:recipe
- id: rp-hide-device
  input: How do I remove one of the default devices from the Responsive Preview toolbar list without deleting
    it? Which field controls whether a device appears?
  criteria: Set the device's status to 0 (uncheck 'Show device in list'); only devices with status = 1
    are rendered in the toolbar list. Its weight controls the order.
  bundle: responsive_preview
  rubric_ref: rubric/responsive_preview_rp_hide_device@1.0
  tags:
  - mode:recipe
- id: rp-permissions
  input: In Responsive Preview, which permission lets an editor use the preview toolbar, and which one
    lets a user manage the device definitions?
  criteria: '''access responsive preview'' gates using the toolbar/block/preview; ''administer responsive
    preview'' (the entity admin_permission) gates managing the device config entities.'
  bundle: responsive_preview
  rubric_ref: rubric/responsive_preview_rp_permissions@1.0
  tags:
  - mode:recipe
- id: rp-query-flag
  input: How does Responsive Preview render a page inside the device frame without the admin toolbar showing?
    What marks a request as a preview?
  criteria: The preview URL carries the query parameter responsive_preview=enabled; hook_preprocess_html
    (ResponsivePreview::preprocessHtml) detects it and unsets the toolbar, navigation, top_bar and contextual
    links from the framed page.
  bundle: responsive_preview
  rubric_ref: rubric/responsive_preview_rp_query_flag@1.0
  tags:
  - mode:recipe
- id: rp-service
  input: In custom code on a Responsive Preview site, which service do I call to get the preview URL for
    the current page or the renderable device list?
  criteria: 'Use the ''responsive_preview'' service (Drupal\responsive_preview\ResponsivePreview): getPreviewUrl()
    returns the current page''s preview URL, getRenderableDevicesList() returns the render array of enabled
    devices.'
  bundle: responsive_preview
  rubric_ref: rubric/responsive_preview_rp_service@1.0
  tags:
  - mode:recipe
- id: rp-block
  input: My theme doesn't use the Drupal admin toolbar. Can I still expose the Responsive Preview device
    controls somewhere on the page?
  criteria: Yes — place the 'Responsive preview controls' block (plugin id responsive_preview_block) in
    a region; it renders the same device list and requires the 'access responsive preview' permission.
  bundle: responsive_preview
  rubric_ref: rubric/responsive_preview_rp_block@1.0
  tags:
  - mode:recipe
- id: rp-node-preview
  input: Can Responsive Preview preview an unsaved node while I'm editing it, and what determines whether
    it's available for a content type?
  criteria: Yes. On node add/edit forms it wires a hidden ajax_responsive_preview element to the form's
    Preview button (AJAX) so the draft can be previewed. It is suppressed when the content type's Preview
    mode is disabled (DRUPAL_DISABLED).
  bundle: responsive_preview
  rubric_ref: rubric/responsive_preview_rp_node_preview@1.0
  tags:
  - mode:recipe
