metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: responsive_preview_navigation
  version: 2.3.x
  note: Submodule of responsive_preview that registers a core Navigation TopBarItem plugin surfacing device-preview
    icons. Cases are `recipe` (response-graded) probing documented facts; no site mutation.
questions:
- id: rpn-purpose
  input: My Drupal 11 site uses the new core Navigation top bar, not the classic admin toolbar. How do
    I get Responsive Preview's device controls to appear there?
  criteria: Enable the responsive_preview_navigation submodule; it registers a TopBarItem plugin (responsive_icons)
    in the Navigation top bar's Tools region, requiring the responsive_preview and core navigation modules.
  bundle: responsive_preview_navigation
  rubric_ref: rubric/responsive_preview_navigation_rpn_purpose@1.0
  tags:
  - mode:recipe
- id: rpn-deps
  input: What does the Responsive Preview Navigation submodule depend on and what core version does it
    need?
  criteria: It depends on drupal:responsive_preview and the core drupal:navigation module, and requires
    Drupal ^11.1 (TopBar API).
  bundle: responsive_preview_navigation
  rubric_ref: rubric/responsive_preview_navigation_rpn_deps@1.0
  tags:
  - mode:recipe
- id: rpn-permission
  input: Does Responsive Preview Navigation add its own permission to control who sees the top-bar preview
    icons?
  criteria: No — it defines no permissions of its own; the top-bar item is gated by the parent module's
    'access responsive preview' permission.
  bundle: responsive_preview_navigation
  rubric_ref: rubric/responsive_preview_navigation_rpn_permission@1.0
  tags:
  - mode:recipe
- id: rpn-devices
  input: Which device buttons does the Responsive Preview Navigation top-bar item show, and are they the
    same configurable devices as the main module?
  criteria: It shows two hardcoded buttons — Desktop (1280x768, dppx 1, landscape) and Mobile (768x1280,
    dppx 2, portrait) — defined in the ResponsiveIcons plugin, not the responsive_preview_device config
    entities.
  bundle: responsive_preview_navigation
  rubric_ref: rubric/responsive_preview_navigation_rpn_devices@1.0
  tags:
  - mode:recipe
