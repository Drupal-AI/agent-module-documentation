rubrics:
- id: rest_views_rest_views_handler_name
  version: '1.0'
  applicable_bundles:
  - rest_views
  checks:
  - kind: must_contain_any
    values:
    - serializable
    - field_export
    - Field (serializable)
  scoring:
    combine: all_pass
- id: rest_views_rest_views_formatters
  version: '1.0'
  applicable_bundles:
  - rest_views
  checks:
  - kind: must_contain_any
    values:
    - boolean_export
    - number_export
  scoring:
    combine: all_pass
- id: rest_views_rest_views_nested_reference
  version: '1.0'
  applicable_bundles:
  - rest_views
  checks:
  - kind: must_contain_any
    values:
    - entity_reference_export
    - entity_reference_entity_id_export
    - entity_path
  scoring:
    combine: all_pass
- id: rest_views_rest_views_known_handler
  version: '1.0'
  applicable_bundles:
  - rest_views
  checks:
  - kind: must_contain_any
    values:
    - field_export
    - number_export
  scoring:
    combine: all_pass
- id: rest_views_rest_views_known_boolean
  version: '1.0'
  applicable_bundles:
  - rest_views
  checks:
  - kind: must_contain_any
    values:
    - boolean_export
  scoring:
    combine: all_pass
- id: rest_views_rest_views_serializable
  version: '1.0'
  applicable_bundles:
  - rest_views
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
- id: rest_views_rest_views_number_formatter
  version: '1.0'
  applicable_bundles:
  - rest_views
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
