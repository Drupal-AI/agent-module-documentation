- id: rest_views-number-formatter
  input: The REST Export view rv_num on this site already exports the node id (nid) with the serializable
    handler, but it is using a plain integer formatter, so the value comes out as a string. Using rest_views,
    set that field's formatter to the one that outputs a real JSON number. Apply the change to the live
    view.
  criteria: In views.view.rv_num the nid field keeps plugin_id field_export and its 'type' (formatter)
    is set to number_export.
  bundle: rest_views
  rubric_ref: rubric/rest_views_rest_views_number_formatter@1.0
