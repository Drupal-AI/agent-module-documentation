metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: rest_views_revisions
  version: 3.1.x
  note: REST Views Entity Revisions is a submodule of rest_views. It contributes one field formatter,
    'entity_reference_revisions_export' (class EntityReferenceRevisionsExportFormatter extends the parent's
    EntityReferenceExportFormatter, field type entity_reference_revisions), for serializing ERR/Paragraphs
    references as nested structures. It adds no views_data_alter (rest_views already provides the field_export
    serializable handler for ERR fields). The formatter only works with the field_export handler. Requires
    entity_reference_revisions + rest_views. No config/route/permissions/Drush/plugin types. Medium cases
    read the live plugin registry and a real view config; hard cases enable the submodule (verify the
    formatter is registered) and set the formatter on a real REST export view config (config-level, verified
    against views.view).
questions:
- id: rest_views_revisions-formatter
  input: With rest_views_revisions, how do I export a Paragraphs (entity reference revisions) field as
    nested JSON in a Views REST Export, and what is the formatter id?
  criteria: Use the field's serializable (field_export) handler and set its formatter to entity_reference_revisions_export.
    It serializes the referenced revisioned entities (Paragraphs) as a nested structure.
  bundle: rest_views_revisions
  rubric_ref: rubric/rest_views_revisions_rest_views_revisions_formatter@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: rest_views_revisions-extends
  input: What field type does the rest_views_revisions export formatter apply to, and which parent formatter
    does it build on?
  criteria: It applies to the entity_reference_revisions field type (Paragraphs) and extends the parent
    rest_views EntityReferenceExportFormatter (the entity_reference_export formatter).
  bundle: rest_views_revisions
  rubric_ref: rubric/rest_views_revisions_rest_views_revisions_extends@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: rest_views_revisions-requires
  input: Which modules does the rest_views_revisions submodule require, and does it add its own serializable
