metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: rest_views_search_api
  version: 3.1.x
  note: REST Views Search API is a submodule of rest_views. It adds a serializable Views field handler
    'search_api_field_export' (class SearchApiEntityFieldExport, @ViewsField, extends Search API's SearchApiEntityField)
    via hook_views_data_alter() for search_api_field handlers (exposed as <field>_export), so a Search
    API field serializes as structured data using rest_views' SerializedData + normalizers. Unlike the
    field-formatter submodules, the serializable behavior here is a Views FIELD handler (plugin_id), not
    a formatter. Requires rest_views + search_api. No config/route/permissions/Drush/plugin types. Medium
    cases read the live views field plugin registry and a real view config; hard cases enable the submodule
    (verify the handler is registered) and set the search_api_field_export handler on a REST export view
    config (config-level, verified against views.view).
questions:
- id: rest_views_search_api-handler
  input: With rest_views_search_api, how do I export a Search API field as structured JSON in a Views
    REST Export, and what is the Views field handler called?
  criteria: In a Search API-based REST Export view, add the Search API field's (serializable) variant,
    which uses the plugin_id search_api_field_export (class SearchApiEntityFieldExport). It serializes
    the (possibly nested) Search API field values as data.
  bundle: rest_views_search_api
  rubric_ref: rubric/rest_views_search_api_rest_views_search_api_handler@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: rest_views_search_api-mechanism
  input: How does rest_views_search_api add its serializable handler, and is it a field formatter or a
    Views field handler?
  criteria: It uses hook_views_data_alter() to clone every search_api_field handler into a <field>_export
    entry with field.id = search_api_field_export. It is a Views field handler (plugin_id), class SearchApiEntityFieldExport
    extending Search API's SearchApiEntityField, not a field formatter.
  bundle: rest_views_search_api
  rubric_ref: rubric/rest_views_search_api_rest_views_search_api_mechanism@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: rest_views_search_api-requires
