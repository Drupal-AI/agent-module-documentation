rubrics:
- id: rest_views_geo_rest_views_geo_formatter
  version: '1.0'
  applicable_bundles:
  - rest_views_geo
  checks:
  - kind: must_contain_any
    values:
    - geolocation_latlng_formatter_export
    - Export
    - lat
    - lng
  scoring:
    combine: all_pass
- id: rest_views_geo_rest_views_geo_requires_handler
  version: '1.0'
  applicable_bundles:
  - rest_views_geo
  checks:
  - kind: must_contain_any
    values:
    - field_export
    - serializable
    - rest_views
    - geolocation
  scoring:
    combine: all_pass
- id: rest_views_geo_rest_views_geo_output_shape
  version: '1.0'
  applicable_bundles:
  - rest_views_geo
  checks:
  - kind: must_contain_any
    values:
    - lat
    - lng
  scoring:
    combine: all_pass
- id: rest_views_geo_rest_views_geo_formatter_id
  version: '1.0'
  applicable_bundles:
  - rest_views_geo
  checks:
  - kind: must_contain_any
    values:
    - geolocation_latlng_formatter_export
  scoring:
    combine: all_pass
- id: rest_views_geo_rest_views_geo_known_view
  version: '1.0'
  applicable_bundles:
  - rest_views_geo
  checks:
  - kind: must_contain_any
    values:
    - geolocation_latlng_formatter_export
  scoring:
    combine: all_pass
- id: rest_views_geo_rest_views_geo_enable
  version: '1.0'
  applicable_bundles:
  - rest_views_geo
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
- id: rest_views_geo_rest_views_geo_set_formatter
  version: '1.0'
  applicable_bundles:
  - rest_views_geo
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
