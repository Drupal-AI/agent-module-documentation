metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: rest_views_geo
  version: 3.1.x
  note: REST Views Geo is a submodule of rest_views. It provides a field formatter 'geolocation_latlng_formatter_export'
    (class GeolocationLatLngExportFormatter, field type geolocation) that emits SerializedData(['lat'=>...,
    'lng'=>...]), and a hook_views_data_alter() that adds a field_export serializable handler for geolocation_field
    handlers. It works only with the serializable (field_export) handler; requires rest_views + geolocation.
    No config/route/permissions/Drush/plugin types. Medium cases read the live plugin registry and a real
    view config; hard cases enable the submodule (verify the formatter is registered) and set the geo
    export formatter on a real REST export view config. View-config cases apply the formatter id to a
    serializable field entry (config-level, verified against views.view config).
questions:
- id: rest_views_geo-formatter
  input: With the rest_views_geo submodule, how do I export a Geolocation field as latitude/longitude
    JSON in a Views REST Export, and what is the formatter called?
  criteria: Add the geolocation field's serializable ((field_export)) handler and set its formatter to
    'Export' (geolocation_latlng_formatter_export). It outputs {lat, lng} per value.
  bundle: rest_views_geo
  rubric_ref: rubric/rest_views_geo_rest_views_geo_formatter@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: rest_views_geo-requires-handler
  input: Does the rest_views_geo export formatter work with any Views field handler, and what modules
    does the submodule require?
  criteria: It only works with the serializable handler (plugin_id field_export) from the parent rest_views
    module. The submodule requires rest_views and the geolocation module.
  bundle: rest_views_geo
  rubric_ref: rubric/rest_views_geo_rest_views_geo_requires_handler@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: rest_views_geo-output-shape
  input: What data structure does the rest_views_geo formatter output for each value of a geolocation
    field?
  criteria: It outputs a JSON object with 'lat' and 'lng' keys (SerializedData(['lat' => $item->lat, 'lng'
    => $item->lng])); multiple values become an array of such objects.
  bundle: rest_views_geo
  rubric_ref: rubric/rest_views_geo_rest_views_geo_output_shape@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: rest_views_geo-formatter-id
  input: On this Drupal site, inspect the registered field formatters and give the id of the export formatter
    that the rest_views_geo module provides for geolocation fields.
  criteria: The rest_views_geo module provides the field formatter geolocation_latlng_formatter_export
    (provider rest_views_geo).
  bundle: rest_views_geo
  rubric_ref: rubric/rest_views_geo_rest_views_geo_formatter_id@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/rvgeo-formatter-id-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/rvgeo-formatter-id-cleanup.sh
- id: rest_views_geo-known-view
  input: This site has a REST Export view rvg_known that exports a field using a rest_views_geo formatter.
    Inspect the live view config and state which formatter (type) that field uses.
  criteria: The rvg_known view's field uses plugin_id field_export with type geolocation_latlng_formatter_export.
  bundle: rest_views_geo
  rubric_ref: rubric/rest_views_geo_rest_views_geo_known_view@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/rvgeo-known-view-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/rvgeo-known-view-cleanup.sh
- id: rest_views_geo-enable
  input: On this Drupal site, make the geolocation export field formatter available so a Views REST Export
    can serialize a Geolocation field as lat/lng, by enabling the appropriate rest_views submodule. Apply
    it to the live site.
  criteria: The rest_views_geo module is enabled (e.g. drush en rest_views_geo), so the field formatter
    geolocation_latlng_formatter_export is registered.
  bundle: rest_views_geo
  rubric_ref: rubric/rest_views_geo_rest_views_geo_enable@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/rvgeo-enable-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/rvgeo-enable-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/rvgeo-enable-verify.sh
- id: rest_views_geo-set-formatter
  input: The REST Export view rvg_task on this site has a serializable field that currently uses a plain
    formatter. Using rest_views_geo, set that field's formatter to the geolocation lat/lng export formatter
    and save it to the live view.
  criteria: In views.view.rvg_task the field keeps plugin_id field_export and its type (formatter) is
    set to geolocation_latlng_formatter_export.
  bundle: rest_views_geo
  rubric_ref: rubric/rest_views_geo_rest_views_geo_set_formatter@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/rvgeo-set-formatter-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/rvgeo-set-formatter-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/rvgeo-set-formatter-verify.sh
