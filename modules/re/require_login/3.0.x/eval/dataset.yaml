- id: require_login-private-paths
  input: This site currently requires login on every page (require_login default). Reconfigure require_login
    so that login is required ONLY on paths under /private (that is, the path /private itself and everything
    beneath it, /private/*), using the Request Path condition without negation. Apply the change to the
    live site.
  criteria: 'In require_login.settings the requirements.request_path condition has negate false and pages
    containing ''/private'' and ''/private/*'' (e.g. pages: "/private\n/private/*"), so login is enforced
    only on those paths.'
  bundle: require_login
  rubric_ref: rubric/require_login_require_login_private_paths@1.0
