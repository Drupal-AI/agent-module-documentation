metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: require_login
  version: 3.0.x
  note: 'Require Login forces authentication for anonymous users via LoginEventSubscriber (KernelEvents::REQUEST
    priority 31 + EXCEPTION) calling the require_login.requirements_manager service. Default config require_login.settings
    requires login on ALL pages (single request_path condition with empty pages, which evaluates TRUE
    everywhere). Config keys: login_path (blank => /user/login), login_message, login_destination, requirements
    (AND-combined condition plugin configs), extra.include_403 / extra.include_404. Settings UI /admin/config/people/login-requirements
    (route require_login.settings, permission ''administer require login''). PROTECTED_ROUTES (login/register/pass/reset
    + css/js/image-style asset routes) are always reachable. Hook: hook_require_login_evaluation_alter(&$eval).
    No Drush, no plugin types. Medium/hard cases are grounded in the real require_login.settings config;
    reset/cleanup restore the shipped defaults explicitly.'
questions:
- id: require_login-default-behavior
  input: I just installed and enabled the Drupal require_login module with its default settings. What
    happens to an anonymous visitor who tries to view a page, and are there any pages they can still reach?
  criteria: 'By default every page requires login: anonymous users are redirected to the login page (login_path,
    default /user/login) with a destination back to the requested URL. The login, register and password-reset
    routes plus CSS/JS/image-style asset routes (PROTECTED_ROUTES) stay reachable so users can actually
    log in.'
  bundle: require_login
  rubric_ref: rubric/require_login_require_login_default_behavior@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: require_login-where-config
  input: Where do I configure the require_login module, what config object stores its settings, and what
    permission controls access to that settings page?
  criteria: Configure at /admin/config/people/login-requirements (route require_login.settings). Settings
    are stored in the require_login.settings config object. Access is gated by the 'administer require
    login' permission (restricted).
  bundle: require_login
  rubric_ref: rubric/require_login_require_login_where_config@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: require_login-limit-pages
  input: With require_login, how do I require login only on certain paths (e.g. everything under /members)
    instead of the whole site, and how do I also force login on the access-denied and not-found pages?
  criteria: 'Use the Request Path condition under Requirements: set its pages to a newline list like /members
    and /members/* with negate off, so login is only required there (all conditions are AND-combined).
    Enable Extra options ''Include 403'' (extra.include_403) and ''Include 404'' (extra.include_404) to
    also gate the access-denied and not-found pages.'
  bundle: require_login
  rubric_ref: rubric/require_login_require_login_limit_pages@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: require_login-known-message
  input: On this Drupal site require_login has been configured with a custom login redirect message and
    a fixed login destination. Inspect the live configuration and tell me the exact login redirect message
    text and the login destination path.
  criteria: 'require_login.settings has login_message: ''Please sign in to view members content'' and
    login_destination: /dashboard.'
  bundle: require_login
  rubric_ref: rubric/require_login_require_login_known_message@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/require_login-known-message-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/require_login-known-message-cleanup.sh
- id: require_login-known-pages
  input: The require_login module on this site has been limited so login is only required on a subset
    of paths. Inspect the live configuration and state which path pattern(s) currently trigger the login
    requirement.
  criteria: The request_path requirement in require_login.settings has pages set to '/reports' and '/reports/*'
    with negate false, so login is required only on those paths.
  bundle: require_login
  rubric_ref: rubric/require_login_require_login_known_pages@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/require_login-known-pages-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/require_login-known-pages-cleanup.sh
- id: require_login-message-403
  input: 'On this Drupal site, configure the require_login module so that anonymous users redirected to
    login see the message exactly: Members only. Please log in. Also enable the option that also requires
    login on the 403 access-denied page. Apply the changes to the live site.'
  criteria: In require_login.settings, login_message is 'Members only. Please log in.' and extra.include_403
    is true (set via the settings form at /admin/config/people/login-requirements or by editing the config
    object).
  bundle: require_login
  rubric_ref: rubric/require_login_require_login_message_403@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
