rubrics:
- id: responsive_menus_responsive_menus_config_and_default
  version: '1.0'
  applicable_bundles:
  - responsive_menus
  checks:
  - kind: must_contain_any
    values:
    - responsive_menus.configuration
    - responsive_menus_simple
    - style
  scoring:
    combine: all_pass
- id: responsive_menus_responsive_menus_add_style
  version: '1.0'
  applicable_bundles:
  - responsive_menus
  checks:
  - kind: must_contain_any
    values:
    - '@ResponsiveMenus'
    - Plugin/ResponsiveMenus
    - plugin.manager.responsive_menus
    - ResponsiveMenusPluginBase
  scoring:
    combine: all_pass
- id: responsive_menus_responsive_menus_shipped_styles
  version: '1.0'
  applicable_bundles:
  - responsive_menus
  checks:
  - kind: must_contain_any
    values:
    - responsive_menus_simple
    - mean_menu
    - Simple
    - Mean Menu
  scoring:
    combine: all_pass
- id: responsive_menus_responsive_menus_known_style
  version: '1.0'
  applicable_bundles:
  - responsive_menus
  checks:
  - kind: must_contain_any
    values:
    - mean_menu
  scoring:
    combine: all_pass
- id: responsive_menus_responsive_menus_set_style
  version: '1.0'
  applicable_bundles:
  - responsive_menus
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
