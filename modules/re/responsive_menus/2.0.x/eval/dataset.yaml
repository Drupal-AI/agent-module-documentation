metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: responsive_menus
  version: 2.0.x
  note: 'Responsive Menus attaches a JS ''style'' (a @ResponsiveMenus plugin) to CSS/jQuery selectors
    to make menus mobile-friendly. Settings form route responsive_menus.admin (permission ''administer
    responsive menus'') writes config object responsive_menus.configuration with keys style (default responsive_menus_simple),
    ignore_admin (default true), style_settings (per-style map). Shipped enabled styles: responsive_menus_simple,
    mean_menu. Plugin manager plugin.manager.responsive_menus, annotation Drupal\responsive_menus\Annotation\ResponsiveMenus.
    Medium reads back a customized active style; hard switches the active style to mean_menu and is verified
    against live config.'
questions:
- id: responsive_menus-config-and-default
  input: On a Drupal site with the responsive_menus module, which config object stores its settings, what
    is the config key for the active menu style, and what is the default style?
  criteria: 'Config object responsive_menus.configuration holds the settings; the active style is the
    ''style'' key, defaulting to responsive_menus_simple (the ''Simple expanding'' style). Other keys:
    ignore_admin (default true) and style_settings.'
  bundle: responsive_menus
  rubric_ref: rubric/responsive_menus_responsive_menus_config_and_default@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: responsive_menus-add-style
  input: How do I add my own responsive menu style to the responsive_menus module in Drupal 10/11? Which
    plugin type / annotation and manager are involved?
  criteria: 'Create a plugin in your module''s Plugin/ResponsiveMenus/ namespace with the @ResponsiveMenus
    annotation (id, label, library), extending ResponsiveMenusPluginBase; it is discovered by plugin.manager.responsive_menus.
    Implement defaultSettings(), settingsForm(), and getJsSettings(). (Legacy: hook_responsive_menus_style_info
    / hook_responsive_menus_styles_alter.)'
  bundle: responsive_menus
  rubric_ref: rubric/responsive_menus_responsive_menus_add_style@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: responsive_menus-shipped-styles
  input: Which responsive menu styles ship ready-to-use with the responsive_menus module without downloading
    extra libraries?
  criteria: 'Two styles ship enabled: ''Simple expanding'' (responsive_menus_simple, the default) and
    ''Mean Menu'' (mean_menu). Sidr, codrops Multi-level, Google Nexus, and Multi-level Push Menu require
    downloading their external libraries.'
  bundle: responsive_menus
  rubric_ref: rubric/responsive_menus_responsive_menus_shipped_styles@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: responsive_menus-known-style
  input: On this Drupal site the Responsive Menus module has been configured with a non-default style.
    Inspect the live configuration and tell me which responsive menu style is currently active.
  criteria: The active style is mean_menu (Mean Menu), stored at responsive_menus.configuration -> style
    (drush cget responsive_menus.configuration style).
  bundle: responsive_menus
  rubric_ref: rubric/responsive_menus_responsive_menus_known_style@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/responsive_menus-known-style-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/responsive_menus-known-style-cleanup.sh
- id: responsive_menus-set-style
  input: On this Drupal site, configure the Responsive Menus module to use the Mean Menu style instead
    of the default. Apply the change to the live configuration.
  criteria: responsive_menus.configuration -> style is set to mean_menu (drush cset responsive_menus.configuration
    style mean_menu -y).
  bundle: responsive_menus
  rubric_ref: rubric/responsive_menus_responsive_menus_set_style@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/responsive_menus-set-style-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/responsive_menus-set-style-reset.sh
    verify: agent-module-documentation/evaluation/verify/responsive_menus-set-style-verify.sh
