rubrics:
- id: responsive_table_filter_responsive_table_filter_what_it_does
  version: '1.0'
  applicable_bundles:
  - responsive_table_filter
  checks:
  - kind: must_contain_any
    values:
    - figure
    - overflow-x
    - wrapper
    - tabindex
    - aria-label
  scoring:
    combine: all_pass
- id: responsive_table_filter_responsive_table_filter_how_to_enable
  version: '1.0'
  applicable_bundles:
  - responsive_table_filter
  checks:
  - kind: must_contain_any
    values:
    - filter_responsive_table
    - text format
    - text formats
    - admin/config/content/formats
  scoring:
    combine: all_pass
- id: responsive_table_filter_responsive_table_filter_settings_keys
  version: '1.0'
  applicable_bundles:
  - responsive_table_filter
  checks:
  - kind: must_contain_any
    values:
    - wrapper_element
    - wrapper_classes
  scoring:
    combine: all_pass
- id: responsive_table_filter_responsive_table_filter_known_wrapper
  version: '1.0'
  applicable_bundles:
  - responsive_table_filter
  checks:
  - kind: must_contain_any
    values:
    - section
  scoring:
    combine: all_pass
- id: responsive_table_filter_responsive_table_filter_known_classes
  version: '1.0'
  applicable_bundles:
  - responsive_table_filter
  checks:
  - kind: must_contain_any
    values:
    - rtf-scroll-known
  scoring:
    combine: all_pass
- id: responsive_table_filter_responsive_table_filter_enable_filter
  version: '1.0'
  applicable_bundles:
  - responsive_table_filter
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
- id: responsive_table_filter_responsive_table_filter_set_wrapper
  version: '1.0'
  applicable_bundles:
  - responsive_table_filter
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
