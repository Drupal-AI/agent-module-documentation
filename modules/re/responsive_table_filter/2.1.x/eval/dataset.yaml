- id: responsive_table_filter-set-wrapper
  input: On this Drupal site, the text format 'rtf_wrap' already wraps tables responsively using a <figure>
    element. Change it so the Responsive Table Filter wraps tables in a <div> element instead, and apply
    the change.
  criteria: In filter.format.rtf_wrap, the filter_responsive_table is enabled and its settings.wrapper_element
    is 'div' (set the wrapper_element setting to div and save the format).
