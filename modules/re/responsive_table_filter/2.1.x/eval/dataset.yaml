- id: responsive_table_filter-enable-filter
  input: On this Drupal site there is a text format with machine name 'rtf_task'. Enable the Responsive
    Table Filter (filter_responsive_table) on that text format and apply the change to the live site.
  criteria: In filter.format.rtf_task, filters.filter_responsive_table.status is TRUE (e.g. tick 'Responsive
    Table filter' on the format at admin/config/content/formats/manage/rtf_task, or call FilterFormat::load('rtf_task')->setFilterConfig('filter_responsive_table',
    ['status' => TRUE])->save()).
  bundle: responsive_table_filter
  rubric_ref: rubric/responsive_table_filter_responsive_table_filter_enable_filter@1.0
