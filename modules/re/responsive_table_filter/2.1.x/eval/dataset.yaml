metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: responsive_table_filter
  version: 2.1.x
  note: Responsive Table Filter ships one text-format filter, filter_responsive_table, that wraps <table>
    tags in a scrollable wrapper (figure by default) with tabindex=0 and aria-label='Scrollable table'.
    Settings wrapper_element (default figure) and wrapper_classes (default responsive-figure-table) are
    stored per text format at filter.format.<id> -> filters.filter_responsive_table.{status,settings}.
    No configure route, no permissions, no Drush. Medium/hard cases create a dedicated namespaced text
    format (rtf_*) and read/verify that filter's live config; cleanup deletes the throwaway format.
questions:
- id: responsive_table_filter-what-it-does
  input: What does the Drupal contrib module Responsive Table Filter do to a <table> in rendered content,
    and what makes the table actually scroll on small screens? Mention the wrapper and the accessibility
    attributes it adds.
  criteria: Its filter (filter_responsive_table) wraps each <table> in a wrapper element (a <figure> by
    default, class responsive-figure-table) with tabindex="0" and aria-label="Scrollable table". The attached
    CSS gives that wrapper max-width:100% and overflow-x:auto, which makes wide tables scroll horizontally.
  bundle: responsive_table_filter
  rubric_ref: rubric/responsive_table_filter_responsive_table_filter_what_it_does@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: responsive_table_filter-how-to-enable
  input: There is no settings page for Responsive Table Filter after I enabled the module. How do I actually
    turn it on, and what is the filter's plugin id?
  criteria: It has no dedicated config page (configure=null). You enable the 'Responsive Table filter'
    (plugin id filter_responsive_table) per text format at Configuration > Content authoring > Text formats
    and editors (admin/config/content/formats).
  bundle: responsive_table_filter
  rubric_ref: rubric/responsive_table_filter_responsive_table_filter_how_to_enable@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: responsive_table_filter-settings-keys
  input: Which two settings does the Responsive Table Filter expose per text format, what are their defaults,
    and how would I change the wrapper from a figure to a div?
  criteria: wrapper_element (default 'figure') and wrapper_classes (default 'responsive-figure-table').
    Set wrapper_element to 'div' in the filter's settings on the text format (filters.filter_responsive_table.settings.wrapper_element).
  bundle: responsive_table_filter
  rubric_ref: rubric/responsive_table_filter_responsive_table_filter_settings_keys@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: responsive_table_filter-known-wrapper
  input: On this Drupal site, a text format named 'rtf_known' has the Responsive Table Filter enabled.
    Inspect the live configuration of that format and state which HTML element the filter wraps tables
    in (its wrapper_element setting).
  criteria: 'The filter_responsive_table on filter.format.rtf_known has wrapper_element: section (and
    wrapper_classes: rtf-scroll-known).'
  bundle: responsive_table_filter
  rubric_ref: rubric/responsive_table_filter_responsive_table_filter_known_wrapper@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/responsive_table_filter-known-wrapper-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/responsive_table_filter-known-wrapper-cleanup.sh
- id: responsive_table_filter-known-classes
  input: On this Drupal site, the text format 'rtf_known' has the Responsive Table Filter enabled. Inspect
    the live configuration and state the CSS class(es) it puts on the wrapper element (its wrapper_classes
    setting).
  criteria: 'The filter_responsive_table on filter.format.rtf_known has wrapper_classes: rtf-scroll-known
    (and wrapper_element: section).'
  bundle: responsive_table_filter
  rubric_ref: rubric/responsive_table_filter_responsive_table_filter_known_classes@1.0
