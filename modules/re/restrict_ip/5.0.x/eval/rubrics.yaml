rubrics:
- id: restrict_ip_restrict_ip_drush_toggle
  version: '1.0'
  applicable_bundles:
  - restrict_ip
  checks:
  - kind: must_contain_any
    values:
    - restrict_ip:disable
    - ripd
  scoring:
    combine: all_pass
- id: restrict_ip_restrict_ip_settings_php_unlock
  version: '1.0'
  applicable_bundles:
  - restrict_ip
  checks:
  - kind: must_contain_any
    values:
    - restrict_ip.settings
    - ip_whitelist
    - '''enable'''
  scoring:
    combine: all_pass
- id: restrict_ip_restrict_ip_config_route_perm
  version: '1.0'
  applicable_bundles:
  - restrict_ip
  checks:
  - kind: must_contain_any
    values:
    - admin/config/people/restrict_ip
    - administer restricted ip addresses
    - restrict_ip.admin_page
  scoring:
    combine: all_pass
- id: restrict_ip_restrict_ip_known_mail
  version: '1.0'
  applicable_bundles:
  - restrict_ip
  checks:
  - kind: must_contain_any
    values:
    - ripblocked@example.com
  scoring:
    combine: all_pass
- id: restrict_ip_restrict_ip_role_bypass
  version: '1.0'
  applicable_bundles:
  - restrict_ip
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
- id: restrict_ip_restrict_ip_known_dblog
  version: '1.0'
  applicable_bundles:
  - restrict_ip
  checks:
  - kind: must_contain_any
    values:
    - dblog
    - 'yes'
    - enabled
    - 'true'
    - logs
    - logging
  scoring:
    combine: all_pass
- id: restrict_ip_restrict_ip_contact_email
  version: '1.0'
  applicable_bundles:
  - restrict_ip
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
