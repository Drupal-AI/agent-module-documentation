    cleanup: agent-module-documentation/evaluation/verify/rest_api_authentication-method-cleanup.sh
- id: rest_api_authentication-enable
  input: On this Drupal site, turn on REST & JSON API Authentication so that unauthenticated /jsonapi
    and ?_format REST requests are no longer served. Apply the change to the live configuration.
  criteria: 'Set enable_authentication = 1 in rest_api_authentication.settings (via the auth settings
    form or drush config): \Drupal::configFactory()->getEditable(''rest_api_authentication.settings'')->set(''enable_authentication'',
    1)->save();'
  bundle: rest_api_authentication
