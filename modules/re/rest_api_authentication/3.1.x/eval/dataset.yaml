metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: rest_api_authentication
  version: 3.1.x
  note: 'miniOrange module that secures REST/JSON:API by registering a Drupal authentication_provider
    (RestAPI, id rest_api_authentication, priority 150). When enable_authentication=1 the provider applies()
    to /jsonapi/ and ?_format= requests and validates credentials by method: 0 basic_auth, 1 api_key,
    2 oauth, 3 jwt, 4 external_oauth (oauth/jwt/headless-sso/multi-app are premium). All state is the
    rest_api_authentication.settings config object (enable_authentication, authentication_method, api_token,
    applications map, default_application_id, plus miniOrange customer fields). Runtime authentication
    of a real HTTP request and any miniOrange/external OAuth call is out of scope for the eval env, so
    EVERY case is grounded in the local config/auth-provider only: medium reads whether protection is
    on / which method the default app uses; hard turns protection on and sets the expected api_token -
    all verified by drush cget, no external auth. Install baseline sets only customer_* fields; the enable/applications/api_token
    keys are absent until configured, and cleanup clears them back to that baseline.'
questions:
- id: rest_api_authentication-how
  input: How does the REST & JSON API Authentication module secure a Drupal site's API, which requests
    does it protect, and what single setting turns that protection on?
  criteria: It registers a Drupal authentication provider (RestAPI, id rest_api_authentication, priority
    150). When enable_authentication=1 in rest_api_authentication.settings, the provider applies() to
    requests whose URI contains /jsonapi/ or ?_format= and requires valid credentials; normal page requests
    are untouched.
  bundle: rest_api_authentication
  rubric_ref: rubric/rest_api_authentication_rest_api_authentication_how@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: rest_api_authentication-methods
  input: Which API authentication methods does the REST & JSON API Authentication module support for validating
    incoming API requests?
  criteria: Basic Auth (method 0), API key (1), OAuth (2), JWT (3), and external OAuth (4). Basic Auth
    and API key are in the free version; OAuth/JWT/external OAuth (and headless SSO / multiple applications)
    are premium miniOrange features.
  bundle: rest_api_authentication
  rubric_ref: rubric/rest_api_authentication_rest_api_authentication_methods@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: rest_api_authentication-config-object
  input: On a Drupal site with the REST & JSON API Authentication module, in which configuration object
    are its settings stored, and which key is the master on/off switch for API protection?
  criteria: All settings live in the rest_api_authentication.settings config object; enable_authentication
    (0/1) is the master switch that activates the authentication provider.
  bundle: rest_api_authentication
  rubric_ref: rubric/rest_api_authentication_rest_api_authentication_config_object@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: rest_api_authentication-is-enabled
  input: On this Drupal site, is REST/JSON:API authentication protection currently active? Inspect the
    live configuration to answer.
  criteria: 'Yes - protection is enabled: rest_api_authentication.settings has enable_authentication =
    1, so the auth provider protects /jsonapi/ and ?_format= API requests.'
  bundle: rest_api_authentication
  rubric_ref: rubric/rest_api_authentication_rest_api_authentication_is_enabled@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/rest_api_authentication-enabled-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/rest_api_authentication-enabled-cleanup.sh
- id: rest_api_authentication-default-method
  input: On this site, the REST & JSON API Authentication module has a default API application configured.
    Inspect the live configuration and tell me which authentication method that default application uses.
  criteria: 'The default application (app-eval-1) uses the API key method: its authentication_method is
    1, which maps to api_key (rest_api_authentication.settings applications + default_application_id).'
  bundle: rest_api_authentication
  rubric_ref: rubric/rest_api_authentication_rest_api_authentication_default_method@1.0
  tags:
