rubrics:
- id: reporting_reporting_what_header
  version: '1.0'
  applicable_bundles:
  - reporting
  checks:
  - kind: must_contain_any
    values:
    - Reporting-Endpoints
    - /system/reporting
  scoring:
    combine: all_pass
- id: reporting_reporting_endpoint_entity
  version: '1.0'
  applicable_bundles:
  - reporting
  checks:
  - kind: must_contain_any
    values:
    - config entity
    - reporting_endpoint
    - /admin/config/system/reporting
    - '410'
  scoring:
    combine: all_pass
- id: reporting_reporting_content_types
  version: '1.0'
  applicable_bundles:
  - reporting
  checks:
  - kind: must_contain_any
    values:
    - application/reports+json
    - application/csp-report
    - logger
    - watchdog
    - reporting
  scoring:
    combine: all_pass
- id: reporting_reporting_known_endpoint
  version: '1.0'
  applicable_bundles:
  - reporting
  checks:
  - kind: must_contain_any
    values:
    - reporting_ep_known
  scoring:
    combine: all_pass
- id: reporting_reporting_which_disabled
  version: '1.0'
  applicable_bundles:
  - reporting
  checks:
  - kind: must_contain_any
    values:
    - reporting_ep_off
  scoring:
    combine: all_pass
- id: reporting_reporting_create_endpoint
  version: '1.0'
  applicable_bundles:
  - reporting
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
- id: reporting_reporting_disable_endpoint
  version: '1.0'
  applicable_bundles:
  - reporting
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
