metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: reporting
  version: 2.1.x
  note: Reporting implements the W3C Reporting API. Core state is the `reporting_endpoint` config entity
    (reporting.reporting_endpoint.<id>, keys id/label/status); a ships-enabled 'default' endpoint exists.
    Enabled endpoints are advertised in a Reporting-Endpoints response header pointing at /system/reporting/{id},
    which logs POSTed reports to the 'reporting' logger channel. configure route = entity.reporting_endpoint.collection
    (/admin/config/system/reporting); admin routes need 'administer site configuration', the report page
    /admin/reports/reporting needs 'access site reports' + dblog. No custom permission, no drush. Medium/hard
    cases are grounded in the real reporting_endpoint config entity (namespaced ids reporting_ep_*), never
    touching the shipped 'default'.
questions:
- id: reporting-what-header
  input: What HTTP response header does the Reporting module add to advertise its endpoints to browsers,
    and what URL path do browsers POST their reports to?
  criteria: It adds a `Reporting-Endpoints` header (a structured-fields dictionary of id="absolute URL")
    for each enabled reporting_endpoint. Browsers POST reports to /system/reporting/{endpoint_id}, which
    the module logs.
  bundle: reporting
  rubric_ref: rubric/reporting_reporting_what_header@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: reporting-endpoint-entity
  input: In the Drupal Reporting module, what kind of entity is a 'reporting endpoint', where do you manage
    them, and what happens when you disable one?
  criteria: A reporting endpoint is a config entity (reporting_endpoint), managed at /admin/config/system/reporting
    (route entity.reporting_endpoint.collection, permission 'administer site configuration'). Disabling
    it (status=false) drops it from the Reporting-Endpoints header and makes its /system/reporting/{id}
    URL return 410 Gone.
  bundle: reporting
  rubric_ref: rubric/reporting_reporting_endpoint_entity@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: reporting-content-types
  input: Which request Content-Types does the Reporting module's endpoint controller accept for incoming
    reports, and where do accepted reports end up?
  criteria: The log controller accepts application/reports+json (Reporting API) and application/csp-report
    (legacy CSP report-uri, incl. Firefox's format which it normalizes); other content types get 415.
    Valid reports are written to the 'reporting' logger channel (viewable at /admin/reports/reporting
    with dblog). Success returns 202.
  bundle: reporting
  rubric_ref: rubric/reporting_reporting_content_types@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: reporting-known-endpoint
  input: Besides the shipped 'default' endpoint, this site has one additional reporting endpoint configured.
    Inspect the live configuration and give the machine name (id) of that additional reporting endpoint.
  criteria: The additional endpoint is the reporting_endpoint config entity with id 'reporting_ep_known'
    (label 'Known CSP Collector'), config name reporting.reporting_endpoint.reporting_ep_known.
  bundle: reporting
  rubric_ref: rubric/reporting_reporting_known_endpoint@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/reporting-known-endpoint-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/reporting-known-endpoint-cleanup.sh
- id: reporting-which-disabled
  input: This site has two custom reporting endpoints, 'reporting_ep_on' and 'reporting_ep_off'. Exactly
    one is disabled (so its /system/reporting URL would return 410). Inspect the live config and state
    which endpoint id is disabled.
  criteria: 'reporting_ep_off has status=false (disabled); reporting_ep_on has status=true. Read via drush
    cget reporting.reporting_endpoint.reporting_ep_off (status: false).'
  bundle: reporting
  rubric_ref: rubric/reporting_reporting_which_disabled@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/reporting-which-disabled-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/reporting-which-disabled-cleanup.sh
- id: reporting-create-endpoint
  input: Using the Reporting module, create a new, enabled reporting endpoint whose machine id is exactly
    'reporting_ep_task' (any label). Apply it to the live site so it is advertised to browsers.
  criteria: A reporting_endpoint config entity with id 'reporting_ep_task' and status TRUE exists (ReportingEndpoint::create(['id'=>'reporting_ep_task','label'=>...,'status'=>TRUE])->save()),
    so /system/reporting/reporting_ep_task accepts reports and appears in the Reporting-Endpoints header.
  bundle: reporting
  rubric_ref: rubric/reporting_reporting_create_endpoint@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/reporting-create-endpoint-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/reporting-create-endpoint-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/reporting-create-endpoint-verify.sh
- id: reporting-disable-endpoint
  input: This site has an enabled reporting endpoint 'reporting_ep_toggle'. Using the Reporting module,
    disable it (so its /system/reporting URL returns 410 Gone and it drops out of the Reporting-Endpoints
    header), and apply the change to the live site.
  criteria: The reporting_endpoint 'reporting_ep_toggle' still exists but its status is FALSE ($e->disable()->save()
    or set status false), so the endpoint is no longer advertised and returns 410.
  bundle: reporting
  rubric_ref: rubric/reporting_reporting_disable_endpoint@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/reporting-disable-endpoint-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/reporting-disable-endpoint-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/reporting-disable-endpoint-verify.sh
