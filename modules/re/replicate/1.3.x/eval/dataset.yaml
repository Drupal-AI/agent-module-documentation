metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: replicate
  version: 1.3.x
  note: 'Replicate is a developer-only API (no UI/config/permissions) exposing one service and four events.
    Cases are `recipe` (response-graded): they probe documented facts an agent would otherwise read the
    source to answer; no site mutation.'
questions:
- id: replicate-clone-service
  input: On a Drupal 11 site, which service do I use to duplicate a content entity in code, and which
    method clones AND saves it versus returning an unsaved clone?
  criteria: The replicate.replicator service (Drupal\replicate\Replicator). replicateEntity()/replicateByEntityId()
    clone and save; cloneEntity()/cloneByEntityId() return an unsaved clone.
  bundle: replicate
  rubric_ref: rubric/replicate_replicate_clone_service@1.0
  tags:
  - mode:recipe
- id: replicate-clone-by-id
  input: In PHP, replicate (clone and save) node 1 on a Drupal 11 site using the Replicate module. Show
    the code.
  criteria: Get \Drupal::service('replicate.replicator') and call replicateByEntityId('node', 1) (or load
    the node and call replicateEntity($node)).
  bundle: replicate
  rubric_ref: rubric/replicate_replicate_clone_by_id@1.0
  tags:
  - mode:recipe
- id: replicate-field-event
  input: Using the Replicate module, I want to control how one specific field type is duplicated when
    an entity is cloned. Which event do I subscribe to and what does the listener receive?
  criteria: Subscribe to replicate__entity_field__{field_type} (built via ReplicatorEvents::replicateEntityField());
    the listener gets a ReplicateEntityFieldEvent with getFieldItemList() (the field on the clone) and
    getEntity() (the clone).
  bundle: replicate
  rubric_ref: rubric/replicate_replicate_field_event@1.0
  tags:
  - mode:recipe
- id: replicate-entity-event
  input: With the Replicate module, which event lets me change how a whole entity of a given type is replicated
    (for example append ' [clone]' to every cloned node title), and what class is dispatched?
  criteria: Subscribe to replicate__entity__{entity_type_id} (ReplicateEntityEvent, carries the original)
    or replicate__alter (ReplicateAlterEvent, carries clone + original) to adjust the whole cloned entity.
  bundle: replicate
  rubric_ref: rubric/replicate_replicate_entity_event@1.0
  tags:
  - mode:recipe
- id: replicate-deep-vs-shallow
  input: When Replicate clones an entity, are entity-reference fields deep-cloned or shallow by default,
    and how do I make a referenced entity be deep-cloned instead?
  criteria: By default the clone is shallow (createDuplicate copies reference values, so targets are shared).
    To deep-clone, subscribe to the reference field's replicate__entity_field__ event and replace each
    target with a fresh clone by re-invoking replicate.replicator (recursion), as the Layout Builder inline-block
    subscriber does.
  bundle: replicate
  rubric_ref: rubric/replicate_replicate_deep_vs_shallow@1.0
  tags:
  - mode:recipe
- id: replicate-no-ui
  input: Does the Replicate module provide an admin UI, configuration form, or permissions for cloning
    content, or is it a developer API?
  criteria: 'It is a developer-only API: no admin UI, no configuration, no permissions. Cloning is done
    in code via the replicate.replicator service; UI modules like Quick Node Clone / Entity Clone build
    on this pattern.'
  bundle: replicate
  rubric_ref: rubric/replicate_replicate_no_ui@1.0
  tags:
  - mode:recipe
- id: replicate-after-save
  input: With Replicate, which event fires after a replicated entity has been saved so I can react (log,
    queue, notify), and which constant names it?
  criteria: The replicate__after_save event (ReplicatorEvents::AFTER_SAVE), dispatched as an AfterSaveEvent
    whose getEntity() is the saved clone; it only fires from the replicate* (save) methods.
  bundle: replicate
  rubric_ref: rubric/replicate_replicate_after_save@1.0
  tags:
  - mode:recipe
