metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: remove_http_headers
  version: 2.1.x
  note: Remove HTTP Headers exposes a single config object, one permission, an HTTP stack middleware,
    and a small ConfigManager API. Cases are `recipe` (response-graded) since they probe documented facts
    an agent would otherwise read source to answer; no site mutation.
questions:
- id: rhh-config-key
  input: On a Drupal 11 site I want to control which HTTP response headers the Remove HTTP Headers module
    strips. Which config object and key hold the list?
  criteria: The headers_to_remove key (a sequence of header-name strings) on the remove_http_headers.settings
    config object.
  bundle: remove_http_headers
  rubric_ref: rubric/remove_http_headers_rhh_config_key@1.0
  tags:
  - mode:recipe
- id: rhh-default-headers
  input: Which HTTP response headers does the Remove HTTP Headers module remove by default on a fresh
    install?
  criteria: By default headers_to_remove contains X-Generator, X-Drupal-Dynamic-Cache, and X-Drupal-Cache.
  bundle: remove_http_headers
  rubric_ref: rubric/remove_http_headers_rhh_default_headers@1.0
  tags:
  - mode:recipe
- id: rhh-hide-generator
  input: I want to hide the Drupal version fingerprint from my site's responses. Which header should I
    remove with the Remove HTTP Headers module, and what extra effect does removing it have on the HTML?
  criteria: Remove the X-Generator header; when it is in the list the module also strips Drupal's default
    <meta name="Generator"> tag from the HTML <head> via hook_page_attachments_alter().
  bundle: remove_http_headers
  rubric_ref: rubric/remove_http_headers_rhh_hide_generator@1.0
  tags:
  - mode:recipe
- id: rhh-mechanism
  input: How does the Remove HTTP Headers module actually strip the configured headers from responses
    on a Drupal 11 site — what mechanism runs?
  criteria: An HTTP stack middleware (RemoveHttpHeadersMiddleware, tagged http_middleware with priority
    1000 so it runs last) calls $response->headers->remove() for each configured header on the main request.
  bundle: remove_http_headers
  rubric_ref: rubric/remove_http_headers_rhh_mechanism@1.0
  tags:
  - mode:recipe
- id: rhh-settings-route
  input: What is the admin path and route name of the Remove HTTP Headers settings form on a Drupal site?
  criteria: Route remove_http_headers.remove_http_headers_settings at /admin/config/system/remove-http-headers
    (Admin > Configuration > System).
  bundle: remove_http_headers
  rubric_ref: rubric/remove_http_headers_rhh_settings_route@1.0
  tags:
  - mode:recipe
- id: rhh-permission
  input: Which permission gates access to the Remove HTTP Headers settings form?
  criteria: 'The ''remove_http_headers settings access'' permission (restrict access: TRUE) gates the
    settings form.'
  bundle: remove_http_headers
  rubric_ref: rubric/remove_http_headers_rhh_permission@1.0
  tags:
  - mode:recipe
- id: rhh-set-via-config
  input: I want to add a custom header name to the Remove HTTP Headers removal list without using the
    UI. What are two ways to do it via configuration?
  criteria: Edit the headers_to_remove sequence in remove_http_headers.settings.yml and drush config:import,
    or set it with drush config:set remove_http_headers.settings; the UI textarea is one header per line.
  bundle: remove_http_headers
  rubric_ref: rubric/remove_http_headers_rhh_set_via_config@1.0
  tags:
  - mode:recipe
