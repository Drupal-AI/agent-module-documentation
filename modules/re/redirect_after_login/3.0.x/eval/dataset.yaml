metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: redirect_after_login
  version: 3.0.x
  note: Redirect After Login is a core-only module with one settings form (per-role destination map),
    one config object, one permission, and an event. Cases are `recipe` (response-graded) since they probe
    documented facts an agent would otherwise read source to answer; no site mutation.
questions:
- id: ral-per-role-destination
  input: On a Drupal 11 site with Redirect After Login, how do I send users of the 'editor' role to /admin/content
    right after they log in? Name the config object and key.
  criteria: Set the editor entry of the login_redirection map on redirect_after_login.settings to /admin/content
    (via the settings form at /admin/config/people/redirect or drush cset redirect_after_login.settings
    login_redirection.editor /admin/content).
  bundle: redirect_after_login
  rubric_ref: rubric/redirect_after_login_ral_per_role_destination@1.0
  tags:
  - mode:recipe
- id: ral-settings-route
  input: Where is the Redirect After Login configuration form and what is its route/path?
  criteria: Route redirect_after_login.admin_settings at /admin/config/people/redirect (Admin > Configuration
    > People, menu link 'Set Login Destination').
  bundle: redirect_after_login
  rubric_ref: rubric/redirect_after_login_ral_settings_route@1.0
  tags:
  - mode:recipe
- id: ral-multi-role-priority
  input: If a user has multiple roles, which role's configured destination does Redirect After Login use
    after login?
  criteria: It uses the last role in the user's getRoles() list — login_redirection[array_reverse($roles)[0]]
    — falling back to / if that role has no URL set.
  bundle: redirect_after_login
  rubric_ref: rubric/redirect_after_login_ral_multi_role_priority@1.0
  tags:
  - mode:recipe
- id: ral-valid-url-format
  input: What destination values are accepted by the Redirect After Login settings form for a role? Can
    I use an external URL?
  criteria: 'Only internal paths that start with #, ?, or / (or the literal <front>, stored as /), and
    the path must exist. External URLs are rejected.'
  bundle: redirect_after_login
  rubric_ref: rubric/redirect_after_login_ral_valid_url_format@1.0
  tags:
  - mode:recipe
- id: ral-exclude-urls
  input: How do I stop Redirect After Login from redirecting when login happens on certain pages?
  criteria: Add paths (one per line, * wildcard supported) to the exclude_urls setting; login on a matching
    path skips redirection. Password-reset routes are always skipped.
  bundle: redirect_after_login
  rubric_ref: rubric/redirect_after_login_ral_exclude_urls@1.0
  tags:
  - mode:recipe
- id: ral-alter-in-code
  input: In a custom Drupal module I want to change or cancel the post-login redirect target that Redirect
    After Login computes. How?
  criteria: Subscribe to RedirectAfterLoginEvent; call setUrl() to change the target or setRedirectAllowed(FALSE)
    to cancel (read via getUrl()/isRedirectAllowed()).
  bundle: redirect_after_login
  rubric_ref: rubric/redirect_after_login_ral_alter_in_code@1.0
  tags:
  - mode:recipe
- id: ral-permission
  input: Which permission controls access to the Redirect After Login settings form?
  criteria: 'The ''administer redirect_after_login settings'' permission (restrict access: true) gates
    the settings form; it is the only permission the module defines.'
  bundle: redirect_after_login
  rubric_ref: rubric/redirect_after_login_ral_permission@1.0
  tags:
  - mode:recipe
- id: ral-vs-login-destination
  input: How does Redirect After Login differ from the Login Destination module, and when should I pick
    it?
  criteria: Redirect After Login only maps a destination per role from one form (no conditional rules/contexts);
    Login Destination is more configurable. Pick Redirect After Login when per-role destinations are all
    you need.
  bundle: redirect_after_login
  rubric_ref: rubric/redirect_after_login_ral_vs_login_destination@1.0
  tags:
  - mode:recipe
