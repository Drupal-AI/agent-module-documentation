rubrics:
- id: realname_realname_config_key
  version: '1.0'
  applicable_bundles:
  - realname
  checks:
  - kind: must_contain_any
    values:
    - realname.settings
  scoring:
    combine: all_pass
- id: realname_realname_configure_route
  version: '1.0'
  applicable_bundles:
  - realname
  checks:
  - kind: must_contain_any
    values:
    - /admin/config/people/realname
    - admin/config/people/realname
  scoring:
    combine: all_pass
- id: realname_realname_pattern_alter_hook
  version: '1.0'
  applicable_bundles:
  - realname
  checks:
  - kind: must_contain_any
    values:
    - hook_realname_pattern_alter
    - realname_pattern_alter
  scoring:
    combine: all_pass
- id: realname_realname_recursion_token
  version: '1.0'
  applicable_bundles:
  - realname
  checks:
  - kind: must_contain_any
    values:
    - '[user:name]'
    - user:name
  scoring:
    combine: all_pass
- id: realname_realname_current_pattern_introspect
  version: '1.0'
  applicable_bundles:
  - realname
  checks:
  - kind: must_contain_any
    values:
    - '[user:mail]'
  scoring:
    combine: all_pass
- id: realname_realname_uid_pattern_introspect
  version: '1.0'
  applicable_bundles:
  - realname
  checks:
  - kind: must_contain_any
    values:
    - '[user:account-name] (#[user:uid])'
  scoring:
    combine: all_pass
- id: realname_realname_mail_pattern_build
  version: '1.0'
  applicable_bundles:
  - realname
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
- id: realname_realname_account_name_build
  version: '1.0'
  applicable_bundles:
  - realname
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
