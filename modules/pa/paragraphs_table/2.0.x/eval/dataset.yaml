metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: paragraphs_table
  version: 2.0.x
  note: 'Paragraphs table provides plugins for entity_reference_revisions (Paragraphs) fields: formatter
    paragraphs_table_formatter (settings incl. mode = ''''|datatables|bootstrapTable|googleCharts, vertical,
    caption, number_column, ajax...), JSON formatter paragraphs_table_json_formatter (recursion_level),
    and widget paragraphs_table_widget (vertical, paste_clipboard, show_all, features). No configure route;
    you apply them per field on the entity_view_display / entity_form_display. Permission: administer
    paragraphs_item fields. Medium cases create a namespaced Article paragraphs field (pt_evm/field_pt_evm)
    with a known formatter mode / widget vertical setting and read it back; hard cases switch the view
    display formatter and form display widget to the module''s plugins on a namespaced fixture (pt_evh/field_pt_evh).
    All fixtures are namespaced and removed by cleanup. Requires the Paragraphs module (enabled).'
questions:
- id: paragraphs_table-plugin-ids
  input: What field formatter and field widget does the paragraphs_table module provide, and what field
    type do they apply to?
  criteria: It provides the formatter paragraphs_table_formatter (and a JSON formatter paragraphs_table_json_formatter)
    plus the widget paragraphs_table_widget, all for the entity_reference_revisions field type (Paragraphs
    reference fields).
  bundle: paragraphs_table
  rubric_ref: rubric/paragraphs_table_paragraphs_table_plugin_ids@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: paragraphs_table-modes
  input: The paragraphs_table formatter has a 'mode' setting to enhance the rendered table with a JavaScript
    library. What are the available modes/libraries?
  criteria: The formatter's 'mode' setting can be empty (plain table), 'datatables' (Datatables), 'bootstrapTable'
    (Bootstrap Table), or 'googleCharts' (Google Charts).
  bundle: paragraphs_table
  rubric_ref: rubric/paragraphs_table_paragraphs_table_modes@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: paragraphs_table-widget-settings
  input: What editing conveniences does the paragraphs_table widget add, and what permission does the
    module define?
  criteria: The paragraphs_table_widget adds settings like vertical (vertical editing table), paste_clipboard
    (paste from a spreadsheet), show_all, a reference-search helper, and feature toggles (e.g. duplicate).
    The module defines the permission 'administer paragraphs_item fields'.
  bundle: paragraphs_table
  rubric_ref: rubric/paragraphs_table_paragraphs_table_widget_settings@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: paragraphs_table-view-mode-configured
  input: On this site the Article content type has a Paragraphs field 'field_pt_evm' displayed with the
    Paragraphs table formatter. Inspect the live default view display and tell me which table 'mode' (library)
    it is configured to use.
  criteria: 'It uses mode ''bootstrapTable'' (Bootstrap Table): in core.entity_view_display.node.article.default
    the field_pt_evm component is type paragraphs_table_formatter with settings.mode = bootstrapTable.'
  bundle: paragraphs_table
  rubric_ref: rubric/paragraphs_table_paragraphs_table_view_mode_configured@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/paragraphs_table-view-mode-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/paragraphs_table-medium-cleanup.sh
- id: paragraphs_table-widget-vertical-configured
  input: The Article type on this site has a Paragraphs field 'field_pt_evm' edited with the Paragraphs
    table widget. Inspect the live default form display and state whether that widget is configured to
    show the table vertically.
  criteria: Yes — in core.entity_form_display.node.article.default the field_pt_evm component is type
    paragraphs_table_widget with settings.vertical = true (vertical editing table).
  bundle: paragraphs_table
  rubric_ref: rubric/paragraphs_table_paragraphs_table_widget_vertical_configured@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/paragraphs_table-widget-vertical-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/paragraphs_table-medium-cleanup.sh
- id: paragraphs_table-set-formatter
  input: The Article content type has a Paragraphs reference field 'field_pt_evh'. Using the paragraphs_table
    module, configure the default view display so that this field is rendered with the Paragraphs table
    formatter. Apply the change to the live site.
  criteria: In core.entity_view_display.node.article.default set the field_pt_evh component's formatter
    type to paragraphs_table_formatter (e.g. via Manage display, or setComponent(...['type' => 'paragraphs_table_formatter'])
    on the entity_view_display).
  bundle: paragraphs_table
  rubric_ref: rubric/paragraphs_table_paragraphs_table_set_formatter@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/paragraphs_table-formatter-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/paragraphs_table-hard-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/paragraphs_table-formatter-verify.sh
    unused_text_checks:
      must_contain_any: []
      must_not_contain: []
- id: paragraphs_table-set-widget
  input: I want editors to fill in the 'field_pt_evh' paragraphs field on Article as a table/grid instead
    of stacked forms. Using the Paragraphs table module, make the Article edit form use its table widget
    for that field, and apply it to the site.
  criteria: In core.entity_form_display.node.article.default set the field_pt_evh component's widget type
    to paragraphs_table_widget (via Manage form display, or setComponent(...['type' => 'paragraphs_table_widget'])
    on the entity_form_display).
  bundle: paragraphs_table
  rubric_ref: rubric/paragraphs_table_paragraphs_table_set_widget@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-layman
    reset: agent-module-documentation/evaluation/verify/paragraphs_table-widget-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/paragraphs_table-hard-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/paragraphs_table-widget-verify.sh
    unused_text_checks:
      must_contain_any: []
      must_not_contain: []
