metadata:
  module: paragraphs_browser
  version: 1.4.x
  note: Converted from the legacy 'cases' shape, which had no gradable checks. The checks were written
    from the expected points and need review.
questions:
- id: purpose
  input: What does the Drupal paragraphs_browser module provide?
  criteria: A modal browser form widget for Paragraphs entity_reference_revisions fields; Editors pick
    a paragraph type from user-defined, filterable groups; Each paragraph type can show a preview image
    and description; Requires the paragraphs module.
  bundle: paragraphs_browser
  rubric_ref: rubric/paragraphs_browser_purpose@1.0
  tags:
  - mode:recipe
- id: config-entity
  input: Which config entity does paragraphs_browser define and what does it store?
  criteria: Config entity id paragraphs_browser_type (a Browser Type); Stores ordered groups (label +
    weight) keyed by group machine name; Stores map of paragraph-type-id to group machine name; Config
    name pattern paragraphs_browser.paragraphs_browser_type.{id}; Ships a default 'content' browser type.
  bundle: paragraphs_browser
  rubric_ref: rubric/paragraphs_browser_config_entity@1.0
  tags:
  - mode:recipe
- id: widgets
  input: What field widgets does paragraphs_browser add and to which field type?
  criteria: paragraphs_browser (Paragraphs Browser (stable)); entity_reference_paragraphs_browser (Paragraphs
    Browser Legacy); Both apply to entity_reference_revisions fields; A widget setting chooses which Browser
    Type to use, plus modal width/height.
  bundle: paragraphs_browser
  rubric_ref: rubric/paragraphs_browser_widgets@1.0
  tags:
  - mode:recipe
- id: setup
  input: How do you set up a Paragraphs Browser so editors see grouped paragraph types?
  criteria: Add a Browser at Structure > Paragraph Types > Manage Browsers; Add Groups to the browser;
    Assign paragraph types to groups via the Configure Groups tab on each paragraph type; On the field's
    Manage Form Display set the widget to a Paragraphs Browser widget and pick the browser.
  bundle: paragraphs_browser
  rubric_ref: rubric/paragraphs_browser_setup@1.0
  tags:
  - mode:recipe
- id: permission
  input: What permission controls administering Paragraphs Browser browsers and groups?
  criteria: All admin routes require 'administer paragraphs types' (from the paragraphs module); The module
    ships no permissions.yml; The entity's declared 'administer paragraphs browser' permission is never
    actually defined.
  bundle: paragraphs_browser
  rubric_ref: rubric/paragraphs_browser_permission@1.0
  tags:
  - mode:recipe
- id: preview-fields
  input: How are a paragraph type's browser preview image and description sourced in 1.4.x?
  criteria: The card description is the paragraph type's own native description (getDescription()); The
    preview image is a third-party setting image_path on the paragraphs_type entity under provider 'paragraphs_browser';
    The image field is added via a fieldset on the paragraph type edit form (hook_form_alter); Falls back
    to the Paragraphs icon when image_path is unset; Update hook paragraphs_browser_update_8001 migrates
    old third-party descriptions into the native description.
  bundle: paragraphs_browser
  rubric_ref: rubric/paragraphs_browser_preview_fields@1.0
  tags:
  - mode:recipe
- id: core-requirement
  input: Which Drupal core versions does paragraphs_browser 1.4.x support?
  criteria: core_version_requirement is ^10.2 || ^11; Drupal 9 support was dropped in this branch; composer
    requires drupal/core ^10.2 || ^11.
  bundle: paragraphs_browser
  rubric_ref: rubric/paragraphs_browser_core_requirement@1.0
  tags:
  - mode:recipe
