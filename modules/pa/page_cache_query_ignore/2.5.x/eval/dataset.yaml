metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: page_cache_query_ignore
  version: 2.5.x
  note: 'Page Cache Query Ignore replaces core''s http_middleware.page_cache service with a PageCacheIgnore
    subclass that strips (or keeps only) configured query parameters before computing the anonymous page-cache
    key. Its entire persistent state is the config object page_cache_query_ignore.settings with three
    keys: query_parameters (sequence of names), ignore_action (''exclude'' | ''include''), ignore_redirects
    (bool). Config UI route is page_cache_query_ignore.admin at /admin/config/development/performance/page_cache_query_ignore
    (permission administer site configuration). Runtime extension points: hook_page_cache_query_ignore_parameters_alter()
    and the events PageCacheQueryIgnoreEvents::PARAMETERS and ::QUERY. Medium/hard cases are grounded
    in that real config object; setup/reset write known values via the config factory and verify reads
    them back.'
questions:
- id: page_cache_query_ignore-config-keys
  input: On a Drupal 11 site with the page_cache_query_ignore module, I want the anonymous page cache
    to treat ?gclid=... links the same as the plain URL. Which config object and key hold the list of
    query parameters, and what is the difference between the module's 'exclude' and 'include' actions?
  criteria: 'The list lives in the config object page_cache_query_ignore.settings under the key query_parameters
    (a sequence of parameter names). The ignore_action key chooses behaviour: ''exclude'' strips the listed
    parameters from the cache key (keeps everything else), while ''include'' keeps ONLY the listed parameters
    and drops all others. Adding ''gclid'' with action exclude makes ?gclid=... share the plain URL''s
    cache entry.'
  bundle: page_cache_query_ignore
  rubric_ref: rubric/page_cache_query_ignore_page_cache_query_ignore_config_keys@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: page_cache_query_ignore-where-configured
  input: Where in the Drupal admin UI (which route/path) do I configure page_cache_query_ignore, and what
    permission gates that form?
  criteria: The settings form is the route page_cache_query_ignore.admin at /admin/config/development/performance/page_cache_query_ignore,
    shown under Configuration > Development > Performance. It is gated by core's 'administer site configuration'
    permission (the module defines no permission of its own).
  bundle: page_cache_query_ignore
  rubric_ref: rubric/page_cache_query_ignore_page_cache_query_ignore_where_configured@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: page_cache_query_ignore-extend-runtime
  input: A custom module needs to add query parameters to page_cache_query_ignore's ignore list dynamically
    at runtime instead of via the settings form. Which hook or events let it do that?
  criteria: Implement hook_page_cache_query_ignore_parameters_alter(array &$parameters) (in MODULE.page_cache_query_ignore.inc),
    or subscribe to PageCacheQueryIgnoreEvents::PARAMETERS ('page_cache_query_ignore.parameters') to mutate
    the parameter list, and PageCacheQueryIgnoreEvents::QUERY ('page_cache_query_ignore.query') to normalize
    the parsed query (e.g. values inside bracket arrays).
  bundle: page_cache_query_ignore
  rubric_ref: rubric/page_cache_query_ignore_page_cache_query_ignore_extend_runtime@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: page_cache_query_ignore-known-list
  input: On this Drupal site, page_cache_query_ignore is already configured. Inspect the live configuration
    and list the query parameter names it is currently set to ignore for the page cache.
  criteria: The config object page_cache_query_ignore.settings has query_parameters = [pcqi_known_a, pcqi_known_b]
    with ignore_action 'exclude'. Read it with e.g. `drush cget page_cache_query_ignore.settings query_parameters`.
  bundle: page_cache_query_ignore
  rubric_ref: rubric/page_cache_query_ignore_page_cache_query_ignore_known_list@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/page_cache_query_ignore-list-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/page_cache_query_ignore-list-cleanup.sh
- id: page_cache_query_ignore-known-action
  input: On this Drupal site, is page_cache_query_ignore currently configured to EXCLUDE the listed query
    parameters from the cache key, or to INCLUDE only the listed ones? Inspect the live configuration
    to answer.
  criteria: It is set to 'include' (ignore_action = include in page_cache_query_ignore.settings), i.e.
    only the single listed parameter pcqi_only is kept in the cache key and everything else is dropped;
    ignore_redirects is also on.
  bundle: page_cache_query_ignore
  rubric_ref: rubric/page_cache_query_ignore_page_cache_query_ignore_known_action@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/page_cache_query_ignore-action-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/page_cache_query_ignore-action-cleanup.sh
- id: page_cache_query_ignore-exclude-tracking
  input: On this Drupal site, configure page_cache_query_ignore so the anonymous page cache ignores the
    tracking parameters 'gclid' and 'utm_source' (they should be stripped from the cache key, other parameters
    kept). Apply the change to the live site.
  criteria: In page_cache_query_ignore.settings set ignore_action to 'exclude' and add both 'gclid' and
    'utm_source' to query_parameters (e.g. via the settings form or `drush cset ... query_parameters.0
    gclid` / config factory).
  bundle: page_cache_query_ignore
  rubric_ref: rubric/page_cache_query_ignore_page_cache_query_ignore_exclude_tracking@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/page_cache_query_ignore-exclude-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/page_cache_query_ignore-exclude-reset.sh
    verify: agent-module-documentation/evaluation/verify/page_cache_query_ignore-exclude-verify.sh
- id: page_cache_query_ignore-include-only
  input: On this Drupal site, configure page_cache_query_ignore in allowlist mode so that ONLY the 'page'
    query parameter is kept in the anonymous page-cache key and every other query parameter is ignored.
    Apply the change to the live site.
  criteria: In page_cache_query_ignore.settings set ignore_action to 'include' and set query_parameters
    to contain 'page' (include mode keeps only the listed parameters, dropping all others).
  bundle: page_cache_query_ignore
  rubric_ref: rubric/page_cache_query_ignore_page_cache_query_ignore_include_only@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/page_cache_query_ignore-include-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/page_cache_query_ignore-include-reset.sh
    verify: agent-module-documentation/evaluation/verify/page_cache_query_ignore-include-verify.sh
