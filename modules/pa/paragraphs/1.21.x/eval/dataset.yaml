metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: paragraphs
  version: 1.21.x
  note: 'Tiered suite. easy (recipe): probe a paragraphs-specific, load-bearing fact graded on response
    content, no site mutation. medium (introspection): a setup script installs a known Paragraphs config
    to the live site, the agent inspects it via drush, graded on response content, a cleanup script restores
    baseline. hard (execution): a reset script clears state, the agent builds the config live, and a verify
    script checks real site state (exit 0 = pass).'
questions:
- id: paragraphs-field-to-add
  input: On a Drupal 11 site with the Paragraphs module, I want to let editors add paragraph components
    to a content type. Which field type do I add to the node, what target entity type does it reference,
    and which widget do I pick on the form display?
  criteria: Add an Entity Reference Revisions field whose target type is Paragraph, then choose the Paragraphs
    (stable) widget on the host's form display.
  bundle: paragraphs
  rubric_ref: rubric/paragraphs_paragraphs_field_to_add@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: paragraphs-type-is-bundle
  input: In Paragraphs, what is the relationship between a 'Paragraphs type' and a 'paragraph'? Name the
    entity type of each and the class of the type entity.
  criteria: A Paragraphs type (config entity paragraphs_type, class Drupal\paragraphs\Entity\ParagraphsType)
    is the bundle for paragraph content entities (Drupal\paragraphs\Entity\Paragraph).
  bundle: paragraphs
  rubric_ref: rubric/paragraphs_paragraphs_type_is_bundle@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: paragraphs-create-in-code
  input: In PHP on a Drupal 11 site, create a paragraph of type 'text' with a field value and attach it
    to a node's paragraphs field, then persist it. Show the code.
  criteria: Paragraph::create(['type' => 'text', ...])->save(), then $node->field_content->appendItem($paragraph)
    and $node->save() so the paragraph revision is pinned to the host revision.
  bundle: paragraphs
  rubric_ref: rubric/paragraphs_paragraphs_create_in_code@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: paragraphs-two-widgets
  input: Paragraphs ships two field widgets. Give the machine name of the modern default/recommended widget
    and the machine name of the legacy/classic one.
  criteria: The default is the stable 'paragraphs' widget (ParagraphsWidget); the legacy/classic widget
    is 'entity_reference_paragraphs' (InlineParagraphsWidget).
  bundle: paragraphs
  rubric_ref: rubric/paragraphs_paragraphs_two_widgets@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: paragraphs-per-type-permissions
  input: The main Paragraphs module has no per-paragraph-type create/edit/delete permissions. Which bundled
    submodule do I enable to get per-type CRUD access control?
  criteria: Enable the paragraphs_type_permissions submodule for per-type create/edit/delete permissions.
  bundle: paragraphs
  rubric_ref: rubric/paragraphs_paragraphs_per_type_permissions@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: paragraphs-library-reuse
  input: I want editors to author one paragraph once and reuse the same paragraph across many pages in
    Paragraphs. Which bundled submodule provides that?
  criteria: The paragraphs_library submodule provides the reusable Paragraphs Library.
  bundle: paragraphs
  rubric_ref: rubric/paragraphs_paragraphs_library_reuse@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: paragraphs-unpublished-permission
  input: In Paragraphs, which permission lets a role see unpublished paragraphs, and which config flag
    in paragraphs.settings must be enabled for it to take effect?
  criteria: The 'view unpublished paragraphs' permission, effective only when the paragraphs.settings
    'show_unpublished' boolean is TRUE.
  bundle: paragraphs
  rubric_ref: rubric/paragraphs_paragraphs_unpublished_permission@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: paragraphs-restrict-allowed-types
  input: On an Entity Reference Revisions field for paragraphs, which reference-setting key restricts
    which paragraph types an editor may add, and which key sets the paragraph type pre-added when the
    form opens?
  criteria: target_bundles limits the allowed paragraph types (ordered via target_bundles_drag_drop);
    default_paragraph_type sets the type auto-added on new host entities.
  bundle: paragraphs
  rubric_ref: rubric/paragraphs_paragraphs_restrict_allowed_types@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: paragraphs-build-sections
  input: On this Drupal site (drush available), set up Paragraphs so editors can add rich body sections
    to Articles. Create a paragraph type with machine name `eval_quote` that has a formatted-text field
    `field_quote_text`, then add a paragraphs reference field `field_eval_sections` to the Article content
    type that references paragraphs (unlimited cardinality). Apply everything to the live site so it really
    exists; don't just describe it. One-line summary.
  criteria: A paragraphs_type eval_quote (with a formatted-text field_quote_text) exists AND node.article
    has an unlimited-cardinality field_eval_sections of type entity_reference_revisions targeting paragraph.
    Verified against live site state.
  bundle: paragraphs
  rubric_ref: rubric/paragraphs_paragraphs_build_sections@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/paragraphs-reset.sh
    verify: agent-module-documentation/evaluation/verify/paragraphs-quote-sections.sh
- id: paragraphs-introspect-intro-pt-fields
  input: This Drupal site (drush available) already has a paragraph type with machine name `eval_intro_pt`.
    Inspect the running site and tell me which fields it has. Give the field machine name(s).
  criteria: 'The eval_intro_pt paragraph type has one added field: field_intro_body (a formatted long-text
    field).'
  bundle: paragraphs
  rubric_ref: rubric/paragraphs_paragraphs_introspect_intro_pt_fields@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    persona: drupal-expert
    setup: agent-module-documentation/evaluation/verify/paragraphs-intro-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/paragraphs-intro-cleanup.sh
- id: paragraphs-introspect-article-ref-cardinality
  input: On this Drupal site (drush available), which field on the Article content type references paragraphs,
    and what is its cardinality? Give the field machine name and the cardinality.
  criteria: node.article's field_intro_sections (type entity_reference_revisions, target paragraph) has
    a cardinality of 3.
  bundle: paragraphs
  rubric_ref: rubric/paragraphs_paragraphs_introspect_article_ref_cardinality@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    persona: drupal-expert
    setup: agent-module-documentation/evaluation/verify/paragraphs-intro-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/paragraphs-intro-cleanup.sh
- id: paragraphs-introspect-ref-handler
  input: On this Drupal site (drush available), inspect the Article field `field_intro_sections` that
    references paragraphs. What entity-reference target type and selection handler does it use?
  criteria: field_intro_sections targets the paragraph entity type and uses the default:paragraph selection
    handler.
  bundle: paragraphs
  rubric_ref: rubric/paragraphs_paragraphs_introspect_ref_handler@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    persona: drupal-expert
    setup: agent-module-documentation/evaluation/verify/paragraphs-intro-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/paragraphs-intro-cleanup.sh
- id: paragraphs-build-cta-type
  input: On this Drupal site (drush available), create a Paragraphs type with machine name `eval_cta`
    for a call-to-action component. Give it a link field `field_cta_link` and a plain-text field `field_cta_label`.
    Apply everything to the live site so it really exists; don't just describe it. One-line summary.
  criteria: A paragraphs_type eval_cta exists carrying a link-type field (field_cta_link) and a text-type
    field (field_cta_label). Verified against live site state.
  bundle: paragraphs
  rubric_ref: rubric/paragraphs_paragraphs_build_cta_type@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/paragraphs-cta-reset.sh
    verify: agent-module-documentation/evaluation/verify/paragraphs-cta-verify.sh
- id: paragraphs-add-hero-to-page
  input: On this Drupal site (drush available), add a paragraphs reference field with machine name `field_eval_hero`
    to the Basic page (machine name `page`) content type. It must be an entity reference revisions field
    targeting paragraphs. Apply everything to the live site so it really exists; don't just describe it.
    One-line summary.
  criteria: node.page has a field_eval_hero of type entity_reference_revisions targeting paragraph. Verified
    against live site state.
  bundle: paragraphs
  rubric_ref: rubric/paragraphs_paragraphs_add_hero_to_page@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/paragraphs-hero-reset.sh
    verify: agent-module-documentation/evaluation/verify/paragraphs-hero-verify.sh
