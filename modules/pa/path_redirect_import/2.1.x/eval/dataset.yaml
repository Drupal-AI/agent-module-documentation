metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: path_redirect_import
  version: 2.1.x
  note: 'Path Redirect Import bulk-loads redirect entities from a CSV via the Migrate API, plus delete/export
    and two Drush commands. Cases are `recipe` (response-graded): they probe documented facts (CSV column
    format, routes, dependency, drush commands, default status code) an agent would otherwise read source
    to answer; no site mutation.'
questions:
- id: pri-csv-columns
  input: I want to bulk-import URL redirects into Drupal from a CSV using Path Redirect Import. What must
    the CSV header row be — which columns, in what order?
  criteria: The header row must be exactly source,destination,language,status_code — one row per redirect
    (old source path, destination, langcode, HTTP status).
  bundle: path_redirect_import
  rubric_ref: rubric/path_redirect_import_pri_csv_columns@1.0
  tags:
  - mode:recipe
- id: pri-status-code-default
  input: In a Path Redirect Import CSV, the status_code column sets the HTTP code per redirect row. What
    happens if a row leaves status_code empty?
  criteria: The migration defaults an empty status_code to 301 (permanent redirect); otherwise the per-row
    value (e.g. 302) is used.
  bundle: path_redirect_import
  rubric_ref: rubric/path_redirect_import_pri_status_code_default@1.0
  tags:
  - mode:recipe
- id: pri-dependency-redirect
  input: Which contrib modules must be installed for Path Redirect Import to work, and what entity type
    does it create when importing?
  criteria: It depends on redirect, migrate_source_csv, and migrate_tools; importing creates redirect
    entities (destination plugin entity:redirect).
  bundle: path_redirect_import
  rubric_ref: rubric/path_redirect_import_pri_dependency_redirect@1.0
  tags:
  - mode:recipe
- id: pri-import-form-route
  input: Where in the Drupal admin UI do I upload a CSV to bulk-import redirects with Path Redirect Import,
    and what permission gates it?
  criteria: The Migrate tab on the URL redirects list at /admin/config/search/redirect/migrate (route
    entity.redirect.migrate), gated by the 'administer redirects' permission from the redirect module.
  bundle: path_redirect_import
  rubric_ref: rubric/path_redirect_import_pri_import_form_route@1.0
  tags:
  - mode:recipe
- id: pri-drush-import
  input: How do I import a redirects CSV from the command line with Path Redirect Import? Give the drush
    command and its alias.
  criteria: drush path_redirect_import:import /path/to/file.csv (alias prii), passing the CSV path as
    the argument.
  bundle: path_redirect_import
  rubric_ref: rubric/path_redirect_import_pri_drush_import@1.0
  tags:
  - mode:recipe
- id: pri-drush-export
  input: Path Redirect Import can also export existing redirects. Which drush command exports all redirects
    to CSV, and what is its alias?
  criteria: drush path_redirect_import:export (alias prie) batch-exports all redirect entities to a source,destination,language,status_code
    CSV.
  bundle: path_redirect_import
  rubric_ref: rubric/path_redirect_import_pri_drush_export@1.0
  tags:
  - mode:recipe
- id: pri-bulk-delete
  input: Using Path Redirect Import's Migrate form, how can I bulk-DELETE the redirects listed in a CSV
    instead of importing them?
  criteria: Upload the CSV and tick the 'Delete redirects defined in the spreadsheet' checkbox; matching
    redirects (by hash) are sent to the multiple-delete confirm form.
  bundle: path_redirect_import
  rubric_ref: rubric/path_redirect_import_pri_bulk_delete@1.0
  tags:
  - mode:recipe
- id: pri-reimport-update
  input: If I run a Path Redirect Import CSV import twice with the same source paths, do I get duplicate
    redirects? Why or why not?
  criteria: 'No duplicates: import runs through the Migrate API with update enabled, keyed on source+language,
    so re-importing updates existing redirect rows rather than creating new ones.'
  bundle: path_redirect_import
  rubric_ref: rubric/path_redirect_import_pri_reimport_update@1.0
  tags:
  - mode:recipe
