metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: paragraphs_edit
  version: 3.0.x
  note: Paragraphs Edit exposes per-paragraph edit/clone/delete routes+forms, contextual links, revision-aware
    saving, and two lineage services. It defines no config, no settings, and no permissions of its own
    (access = core entity access). Cases are `recipe` (response-graded) probing documented facts an agent
    would otherwise read source to answer; no site mutation.
questions:
- id: paragraphs-edit-single-paragraph-route
  input: On a Drupal 11 site with Paragraphs Edit, I want to edit ONE paragraph directly without opening
    the whole host node's edit form. What route/path and form does it use?
  criteria: Use the paragraphs_edit.edit_form route, path /paragraphs_edit/{root_parent_type}/{root_parent}/paragraphs/{paragraph}/edit,
    which renders ParagraphEditForm (paragraph form op entity_edit) showing just that paragraph's fields.
  bundle: paragraphs_edit
  rubric_ref: rubric/paragraphs_edit_paragraphs_edit_single_paragraph_route@1.0
  tags:
  - mode:recipe
- id: paragraphs-edit-contextual-links
  input: Which module adds Edit / Clone / Delete contextual links directly on rendered paragraphs, and
    what core module does that rely on?
  criteria: Paragraphs Edit attaches a `paragraph` contextual-links group (Edit paragraph, Clone paragraph,
    Delete paragraph) to rendered paragraphs, relying on core's Contextual (contextual) module; links
    are suppressed on admin/QuickEdit routes.
  bundle: paragraphs_edit
  rubric_ref: rubric/paragraphs_edit_paragraphs_edit_contextual_links@1.0
  tags:
  - mode:recipe
- id: paragraphs-edit-revision-aware
  input: When I edit an individual paragraph with Paragraphs Edit on a node type that creates new revisions
    by default, what happens to revisions? Which service handles it?
  criteria: 'It is revision-aware: ParagraphLineageRevisioner (paragraphs_edit.lineage.revisioner) checks
    shouldCreateNewRevision() and, if true, saves the paragraph plus every ancestor as new revisions,
    updating each parent field item''s target_revision_id.'
  bundle: paragraphs_edit
  rubric_ref: rubric/paragraphs_edit_paragraphs_edit_revision_aware@1.0
  tags:
  - mode:recipe
- id: paragraphs-edit-clone-destination
  input: With Paragraphs Edit, can I clone a paragraph to a different parent entity/field, and which route/form
    does that? What entity access is required?
  criteria: Yes — paragraphs_edit.clone_form (ParagraphCloneForm, op entity_clone) duplicates the paragraph
    and lets you choose destination Type/Bundle/Parent/Field; route access requires paragraph.update,
    and submit validates update access on the destination entity and edit access on the destination field.
  bundle: paragraphs_edit
  rubric_ref: rubric/paragraphs_edit_paragraphs_edit_clone_destination@1.0
  tags:
  - mode:recipe
- id: paragraphs-edit-access-permissions
  input: What permission does Paragraphs Edit define to gate editing or deleting a paragraph, and how
    is access actually enforced on its routes?
  criteria: It defines no permissions of its own; access is core entity access — edit and delete routes
    require _entity_access root_parent.update (update access to the host entity), clone requires paragraph.update.
  bundle: paragraphs_edit
  rubric_ref: rubric/paragraphs_edit_paragraphs_edit_access_permissions@1.0
  tags:
  - mode:recipe
- id: paragraphs-edit-depends-on-paragraphs
  input: What are the module dependencies of Paragraphs Edit that I must enable for it to work?
  criteria: It depends on paragraphs:paragraphs and drupal:contextual (info.yml); Paragraphs in turn provides
    entity_reference_revisions.
  bundle: paragraphs_edit
  rubric_ref: rubric/paragraphs_edit_paragraphs_edit_depends_on_paragraphs@1.0
  tags:
  - mode:recipe
- id: paragraphs-edit-lineage-root-parent
  input: In custom Drupal code, how do I find the top-level host entity of a deeply nested paragraph using
    Paragraphs Edit? Name the service and method.
  criteria: Use the paragraphs_edit.lineage.inspector service (ParagraphLineageInspector) and call getRootParent($paragraph),
    which walks getParentEntity() up until a non-paragraph host entity is reached.
  bundle: paragraphs_edit
  rubric_ref: rubric/paragraphs_edit_paragraphs_edit_lineage_root_parent@1.0
  tags:
  - mode:recipe
