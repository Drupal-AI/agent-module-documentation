metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: panels
  version: 4.9.x
  note: Panels provides the panels_variant display variant, three plugin types (PanelsStorage, PanelsPattern,
    DisplayBuilder), a display/storage service API and the panels_ipe submodule. Cases are `recipe` (response-graded)
    probing documented facts an agent would otherwise read source to answer; no site mutation.
questions:
- id: panels-display-variant
  input: On a Drupal 11 site, which display variant plugin does the Panels module provide for laying content
    into a layout's regions, and what is its plugin id?
  criteria: Panels provides PanelsDisplayVariant with plugin id `panels_variant` (admin label "Panels"),
    extending ctools' BlockDisplayVariant.
  bundle: panels
  rubric_ref: rubric/panels_panels_display_variant@1.0
  tags:
  - mode:recipe
- id: panels-ctools-dependency
  input: What are the module dependencies of Panels according to its info.yml?
  criteria: Panels depends on ctools (ctools:ctools) and core Layout Discovery (drupal:layout_discovery).
  bundle: panels
  rubric_ref: rubric/panels_panels_ctools_dependency@1.0
  tags:
  - mode:recipe
- id: panels-storage-plugin-type
  input: I want to store Panels displays somewhere other than Page Manager. Which plugin type do I implement,
    what interface/base do I use, and which service manages it?
  criteria: Implement a PanelsStorage plugin (namespace Plugin/PanelsStorage, @PanelsStorage annotation)
    implementing PanelsStorageInterface (or extending PanelsStorageBase) with load()/save()/access();
    managed by the panels.storage_manager service. The bundled page_manager plugin is PageManagerPanelsStorage.
  bundle: panels
  rubric_ref: rubric/panels_panels_storage_plugin_type@1.0
  tags:
  - mode:recipe
- id: panels-layout-regions-blocks
  input: 'Explain the model of a Panels display: what three things make it up and where do the layouts
    come from?'
  criteria: 'A Panels display = a Layout plugin (from core Layout Discovery, e.g. layout_onecol/layout_twocol)
    which defines regions, plus blocks (panes) assigned into those regions. Config keys: layout, layout_settings,
    builder, storage_type/storage_id.'
  bundle: panels
  rubric_ref: rubric/panels_panels_layout_regions_blocks@1.0
  tags:
  - mode:recipe
- id: panels-ipe-submodule
  input: Which Panels submodule provides an in-place (front-end) editor for Panels displays, and what
    permission gates access to it?
  criteria: The panels_ipe submodule (Panels IPE) provides the JavaScript in-place editor; access is gated
    by the 'access panels in-place editing' permission.
  bundle: panels
  rubric_ref: rubric/panels_panels_ipe_submodule@1.0
  tags:
  - mode:recipe
- id: panels-no-ui-page-manager
  input: Does the Panels module ship its own page-building UI, and what do I pair it with to build pages?
  criteria: Panels provides no external UI of its own; you pair it with Page Manager (adding a panels_variant
    to a page variant) or enable the panels_ipe submodule for in-place editing.
  bundle: panels
  rubric_ref: rubric/panels_panels_no_ui_page_manager@1.0
  tags:
  - mode:recipe
- id: panels-build-alter-hook
  input: In a custom module I want to alter the fully-built render array of a Panels display. Which hook
    do I implement?
  criteria: Implement hook_panels_build_alter(array &$build, PanelsDisplayVariant $panels_display).
  bundle: panels
  rubric_ref: rubric/panels_panels_build_alter_hook@1.0
  tags:
  - mode:recipe
- id: panels-display-builder-type
  input: How does Panels decide how a display is rendered, and how does Panels IPE change that? Name the
    plugin type and the default vs IPE builder.
  criteria: Rendering goes through a DisplayBuilder plugin (manager plugin.manager.panels.display_builder).
    Default is StandardDisplayBuilder (id `standard`); panels_ipe supplies InPlaceEditorDisplayBuilder
    (id `ipe`). A display picks its builder via the `builder` config key.
  bundle: panels
  rubric_ref: rubric/panels_panels_display_builder_type@1.0
  tags:
  - mode:recipe
