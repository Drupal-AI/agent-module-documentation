metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: panels_ipe
  version: 4.9.x
  note: 'Panels IPE is the in-place editor submodule of Panels: a DisplayBuilder (id ipe), an IPEAccess
    plugin type, AJAX routes gated by a permission + storage access, and three alter/presave hooks. Cases
    are `recipe` (response-graded); no site mutation.'
questions:
- id: panels-ipe-what
  input: What does the Panels IPE submodule provide, and how does it change how a Panels display renders?
  criteria: 'Panels IPE is the in-place (front-end) editor: a Backbone/jQuery UI app for editing layouts/blocks
    on the rendered page. It swaps in InPlaceEditorDisplayBuilder (DisplayBuilder id `ipe`) so the display
    renders with the editor attached.'
  bundle: panels_ipe
  rubric_ref: rubric/panels_ipe_panels_ipe_what@1.0
  tags:
  - mode:recipe
- id: panels-ipe-permission
  input: Which permission gates access to the Panels in-place editor?
  criteria: The 'access panels in-place editing' permission (defined by panels_ipe) gates the editor;
    its AJAX routes also require a _panels_storage_access op.
  bundle: panels_ipe
  rubric_ref: rubric/panels_ipe_panels_ipe_permission@1.0
  tags:
  - mode:recipe
- id: panels-ipe-dependencies
  input: What does the panels_ipe module depend on according to its info.yml?
  criteria: panels_ipe depends on panels, core block_content, and jquery_ui_droppable.
  bundle: panels_ipe
  rubric_ref: rubric/panels_ipe_panels_ipe_dependencies@1.0
  tags:
  - mode:recipe
- id: panels-ipe-blocks-alter
  input: In a custom module, which hook do I implement to change which block plugins appear in the Panels
    IPE block picker?
  criteria: Implement hook_panels_ipe_blocks_alter(array &$blocks, PanelsDisplayVariant $panels_display).
  bundle: panels_ipe
  rubric_ref: rubric/panels_ipe_panels_ipe_blocks_alter@1.0
  tags:
  - mode:recipe
- id: panels-ipe-access-plugin
  input: I want to add custom access rules to the Panels in-place editor beyond the base permission. Which
    plugin type do I implement and which manager handles it?
  criteria: Implement an IPEAccess plugin (namespace Plugin/IPEAccess, @IPEAccess annotation, IPEAccessInterface
    / IPEAccessBase); managed by the plugin.manager.ipe_access service.
  bundle: panels_ipe
  rubric_ref: rubric/panels_ipe_panels_ipe_access_plugin@1.0
  tags:
  - mode:recipe
- id: panels-ipe-presave-hook
  input: Which Panels IPE hook lets me act on a Panels display just before the in-place editor saves it,
    and what extra argument does it give me?
  criteria: hook_panels_ipe_panels_display_presave(PanelsDisplayVariant $panels_display, array $layout_model)
    — $layout_model is the decoded LayoutModel from the JS app; e.g. used to setStorage() to a custom
    storage.
  bundle: panels_ipe
  rubric_ref: rubric/panels_ipe_panels_ipe_presave_hook@1.0
  tags:
  - mode:recipe
