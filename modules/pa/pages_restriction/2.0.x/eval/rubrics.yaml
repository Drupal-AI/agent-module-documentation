rubrics:
- id: pages_restriction_pages_restriction_format
  version: '1.0'
  applicable_bundles:
  - pages_restriction
  checks:
  - kind: must_contain_any
    values:
    - pages_restriction.settings
    - restricted
    - '|'
    - target
  scoring:
    combine: all_pass
- id: pages_restriction_pages_restriction_configure_route
  version: '1.0'
  applicable_bundles:
  - pages_restriction
  checks:
  - kind: must_contain_any
    values:
    - /admin/config/development/pages-restriction/settings
    - pages-restriction/settings
    - administer site configuration
    - pages_restriction.settings
  scoring:
    combine: all_pass
- id: pages_restriction_pages_restriction_bypass
  version: '1.0'
  applicable_bundles:
  - pages_restriction
  checks:
  - kind: must_contain_any
    values:
    - bypass_role
    - bypass
    - session
    - setBypass
  scoring:
    combine: all_pass
- id: pages_restriction_pages_restriction_known_map
  version: '1.0'
  applicable_bundles:
  - pages_restriction
  checks:
  - kind: must_contain_any
    values:
    - pr-entry-target
  scoring:
    combine: all_pass
- id: pages_restriction_pages_restriction_bypass_role_read
  version: '1.0'
  applicable_bundles:
  - pages_restriction
  checks:
  - kind: must_contain_any
    values:
    - administrator
  scoring:
    combine: all_pass
- id: pages_restriction_pages_restriction_add_rule
  version: '1.0'
  applicable_bundles:
  - pages_restriction
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
- id: pages_restriction_pages_restriction_keep_params
  version: '1.0'
  applicable_bundles:
  - pages_restriction
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
