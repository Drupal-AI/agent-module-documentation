metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: pages_restriction
  version: 2.0.x
  note: 'Pages Restriction Access stores everything in ONE config object, pages_restriction.settings,
    edited at /admin/config/development/pages-restriction/settings (route pages_restriction.settings,
    permission ''administer site configuration''). Keys: pages_restriction (textarea, one ''restricted-path|target-path''
    mapping per line), keep_parameters (bool 1/0, appends query params to the redirect target), bypass_role
    (array of role ids that skip restrictions). A kernel REQUEST subscriber redirects a visitor from a
    restricted path (matched against the current path alias) to its target unless they have a bypass role
    or a session bypass (pages_restriction.session_service::setBypass). No config schema, no own permissions,
    no Drush. medium cases read back a known mapping/bypass role from the live config; hard cases write
    a restriction mapping or toggle keep_parameters, verified against pages_restriction.settings. Shipped
    install defaults: keep_parameters:1, bypass_role:[] (no pages_restriction key until first save).'
questions:
- id: pages_restriction-format
  input: In the Drupal pages_restriction module, what is the format for defining which page is restricted
    and where a blocked visitor gets sent, and in which config object is it stored?
  criteria: You enter one mapping per line in the 'Pages Restriction' textarea as restricted-path|target-path
    (e.g. contact/thank-you|contact/send-your-message). It is saved under the config object pages_restriction.settings,
    key 'pages_restriction'.
  bundle: pages_restriction
  rubric_ref: rubric/pages_restriction_pages_restriction_format@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: pages_restriction-configure-route
  input: Where is the admin settings page for the pages_restriction module, and what permission is required
    to reach it?
  criteria: The settings form is at /admin/config/development/pages-restriction/settings (route pages_restriction.settings),
    gated by the core 'administer site configuration' permission.
  bundle: pages_restriction
  rubric_ref: rubric/pages_restriction_pages_restriction_configure_route@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: pages_restriction-bypass
  input: How can certain users be allowed to reach a restricted page in the pages_restriction module —
    both permanently for a role and one-time for a specific user session?
  criteria: Give a role the bypass via the 'bypass_role' setting (logged-in users in that role skip all
    restrictions). For a one-time allow, call pages_restriction.session_service->setBypass($path), which
    stores the path in the pages_restriction_bypass session array so the subscriber lets the user through
    on the next request.
  bundle: pages_restriction
  rubric_ref: rubric/pages_restriction_pages_restriction_bypass@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: pages_restriction-known-map
  input: This site has a page restriction configured. Inspect the live pages_restriction configuration
    and state which target page a visitor to the restricted path 'pr-secret-page' gets redirected to.
  criteria: 'pr-secret-page redirects to pr-entry-target: the mapping ''pr-secret-page|pr-entry-target''
    is stored in pages_restriction.settings -> pages_restriction.'
  bundle: pages_restriction
  rubric_ref: rubric/pages_restriction_pages_restriction_known_map@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/pages_restriction-known-map-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/pages_restriction-known-map-cleanup.sh
- id: pages_restriction-bypass-role-read
  input: Inspect the live pages_restriction configuration on this site and state which user role is currently
    allowed to bypass all page restrictions.
  criteria: 'The ''administrator'' role bypasses restrictions: pages_restriction.settings -> bypass_role
    contains administrator.'
  bundle: pages_restriction
  rubric_ref: rubric/pages_restriction_pages_restriction_bypass_role_read@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/pages_restriction-bypass-role-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/pages_restriction-bypass-role-cleanup.sh
- id: pages_restriction-add-rule
  input: Using the pages_restriction module, configure this site so that visitors to the path 'pr-locked'
    are redirected to 'pr-redirect'. Apply the change to the live configuration.
  criteria: pages_restriction.settings -> pages_restriction contains a line 'pr-locked|pr-redirect' (restricted
    path pr-locked mapped to target pr-redirect).
  bundle: pages_restriction
  rubric_ref: rubric/pages_restriction_pages_restriction_add_rule@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/pages_restriction-add-rule-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/pages_restriction-add-rule-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/pages_restriction-add-rule-verify.sh
- id: pages_restriction-keep-params
  input: In the pages_restriction module settings, turn ON the option that preserves the original URL
    query parameters when a restricted page redirects to its target. Apply the change to the live site.
  criteria: pages_restriction.settings -> keep_parameters is set to 1 (truthy), so the subscriber appends
    the request's query parameters to the redirect target.
  bundle: pages_restriction
  rubric_ref: rubric/pages_restriction_pages_restriction_keep_params@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: site-builder
    reset: agent-module-documentation/evaluation/verify/pages_restriction-keep-params-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/pages_restriction-keep-params-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/pages_restriction-keep-params-verify.sh
