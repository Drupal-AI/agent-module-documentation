questions:
- id: pathauto-blog-pattern-layman
  input: On my website, blog posts currently have ugly web addresses like `example.com/node/42`. I want
    every blog article's address to read like `example.com/blog/the-post-title` instead — built automatically
    from the post's title — for all articles from now on. Please set this up on the site so it just works,
    and tell me in one line what you did.
  criteria: 'Same end state as the expert variant: a node pathauto pattern blog/[node:title] applied,
    and a new Article gets a /blog/<title> alias. The agent must map the plain-English request onto Pathauto
    without being told the module name.'
  bundle: pathauto
  rubric_ref: rubric/pathauto_pathauto_blog_pattern_layman@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: layman
    reset: agent-module-documentation/evaluation/verify/pathauto-reset.sh
    verify: agent-module-documentation/evaluation/verify/pathauto-blog-pattern.sh
- id: pathauto-blog-pattern-expert
  input: On this Drupal site (DDEV, drush available), add a Pathauto pattern for the Article content type
    with the token pattern `blog/[node:title]`, and apply it via drush/config so new article nodes get
    that URL alias. Give a one-line summary of what you changed.
  criteria: A pathauto_pattern (type canonical_entities:node, pattern blog/[node:title]) exists AND a
    new Article node gets a /blog/<title> alias. Verified against live site state.
  bundle: pathauto
  rubric_ref: rubric/pathauto_pathauto_blog_pattern_expert@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/pathauto-reset.sh
    verify: agent-module-documentation/evaluation/verify/pathauto-blog-pattern.sh
- id: pathauto-user-pattern
  input: On this Drupal site (drush available), configure Pathauto so User accounts automatically get
    URL aliases of the form `users/[user:account-name]`. Apply it to the running site with drush/config
    — do not just describe it. State in one line what you changed.
  criteria: A pathauto_pattern (type canonical_entities:user, pattern users/[user:account-name]) exists
    AND a new user gets a /users/<name> alias. Verified against live site state.
  bundle: pathauto
  rubric_ref: rubric/pathauto_pathauto_user_pattern@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/pathauto-reset.sh
    verify: agent-module-documentation/evaluation/verify/pathauto-user-pattern.sh
- id: pathauto-separator-underscore
  input: On this Drupal site, what is the exact drush command to change the Pathauto word separator from
    a hyphen to an underscore? Answer with the command only.
  criteria: drush config:set pathauto.settings separator _ -y
  bundle: pathauto
  rubric_ref: rubric/pathauto_pathauto_separator_underscore@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: pathauto-max-length
  input: On this Drupal site, give the exact drush command to set Pathauto's maximum generated alias length
    to 100. Answer with the command only.
  criteria: drush config:set pathauto.settings max_length 100 -y
  bundle: pathauto
  rubric_ref: rubric/pathauto_pathauto_max_length@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: pathauto-transliterate
  input: In Pathauto, which setting makes it convert accented characters (like `é` to `e`) into plain
    ASCII when building an alias? Name the exact setting key.
  criteria: The `transliterate` setting in pathauto.settings (on by default).
  bundle: pathauto
  rubric_ref: rubric/pathauto_pathauto_transliterate@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: pathauto-alias-alter-hook
  input: Which Drupal hook do I implement to modify a generated URL alias string just before Pathauto
    saves it? Give the exact hook function name.
  criteria: hook_pathauto_alias_alter(&$alias, array &$context).
  bundle: pathauto
  rubric_ref: rubric/pathauto_pathauto_alias_alter_hook@1.0
  tags:
  - mode:recipe
  - difficulty:easy
