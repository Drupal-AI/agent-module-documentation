metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: paragraphs_entity_embed
  version: 4.0.x
  note: 'Paragraphs Entity Embed adds inline Paragraph embedding to CKEditor 5. Enabling on a text format
    = the ''Display embedded paragraphs'' filter (id paragraphs_entity_embed, TYPE_TRANSFORM_REVERSIBLE)
    + the Paragraphs CKEditor 5 button (plugin paragraphs_entity_embed_paragraphsEmbed / DrupalParagraph).
    Each embed is stored as an embedded_paragraphs content entity (base fields label + paragraph=entity_reference_revisions
    to a paragraph; tables embedded_paragraphs/_revision) and referenced in markup by a <drupal-paragraph>
    tag with data attributes (data-embed-button, data-paragraph-id, data-paragraph-revision-id, data-entity-label,
    data-align). Ships embed.button ''paragraphs'' (embed type paragraphs_entity_embed) and view mode
    paragraph.embed. Five permissions: view/add/edit/delete/administer paragraphs entity embed. No global
    settings page (configure=null). Deps: ckeditor5, embed, entity_embed, paragraphs. Medium reads back
    which text format has the filter enabled; hard1 enables the filter on a text format (verified via
    live filter config); hard2 creates an embedded_paragraphs entity referencing a paragraph (verified
    as live entity). NOTE: hard2 uses the existing bp_simple paragraph type - creating/deleting a paragraphs_type
    triggers an admin_toolbar menu-rebuild collision on this shared site, so scripts avoid paragraphs_type
    CRUD.'
questions:
- id: paragraphs_entity_embed-enable-how
  input: How do I let editors embed Paragraph entities inside a CKEditor 5 rich-text field using the Paragraphs
    Entity Embed module? What two things must I enable on the text format?
  criteria: On the text format (admin/config/content/formats), enable the 'Display embedded paragraphs'
    filter (id paragraphs_entity_embed) and add the Paragraphs button (CKEditor 5 plugin paragraphs_entity_embed_paragraphsEmbed)
    to the active toolbar.
  bundle: paragraphs_entity_embed
  rubric_ref: rubric/paragraphs_entity_embed_paragraphs_entity_embed_enable_how@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: paragraphs_entity_embed-storage
  input: In the Paragraphs Entity Embed module, what entity type stores an embedded paragraph, and what
    are its main fields? What HTML tag references it in the saved markup?
  criteria: 'Embeds are stored as embedded_paragraphs content entities (base fields: label, and paragraph
    = entity_reference_revisions to a paragraph). In the text they are referenced by a <drupal-paragraph>
    tag carrying data attributes like data-paragraph-id, data-paragraph-revision-id, data-entity-label
    and data-align.'
  bundle: paragraphs_entity_embed
  rubric_ref: rubric/paragraphs_entity_embed_paragraphs_entity_embed_storage@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: paragraphs_entity_embed-permissions
  input: Which permissions does the Paragraphs Entity Embed module define to control who can work with
    embedded paragraphs?
  criteria: It defines view / add / edit / delete paragraphs entity embed (the CRUD operations on embedded_paragraphs
    entities) and administer paragraphs entity embed (restricted).
  bundle: paragraphs_entity_embed
  rubric_ref: rubric/paragraphs_entity_embed_paragraphs_entity_embed_permissions@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: paragraphs_entity_embed-which-format
  input: On this Drupal site, one text format has been configured to allow embedding Paragraph entities
    in CKEditor via the Paragraphs Entity Embed module. Inspect the live text-format configuration and
    give the machine name of the format that has the embed filter enabled.
  criteria: The pee_format text format has the paragraphs_entity_embed ('Display embedded paragraphs')
    filter enabled (status true).
  bundle: paragraphs_entity_embed
  rubric_ref: rubric/paragraphs_entity_embed_paragraphs_entity_embed_which_format@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/paragraphs_entity_embed-format-filter-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/paragraphs_entity_embed-format-filter-cleanup.sh
- id: paragraphs_entity_embed-known-embed
  input: On this Drupal site there is an existing embedded paragraph (an embedded_paragraphs entity created
    by the Paragraphs Entity Embed module). Inspect the live embedded_paragraphs entities and give the
    label of the one that exists.
  criteria: There is an embedded_paragraphs entity with label 'PEE Known Embed' (wrapping a bp_simple
    paragraph).
  bundle: paragraphs_entity_embed
  rubric_ref: rubric/paragraphs_entity_embed_paragraphs_entity_embed_known_embed@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/paragraphs_entity_embed-known-embed-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/paragraphs_entity_embed-known-embed-cleanup.sh
- id: paragraphs_entity_embed-enable-filter
  input: On this Drupal site there is a text format 'pee_exec' that does not yet allow embedded paragraphs.
    Using the Paragraphs Entity Embed module, enable paragraph embedding output on that format by turning
    on its filter, and apply it to the live site.
  criteria: Enable the paragraphs_entity_embed filter on the pee_exec format (e.g. $format->setFilterConfig('paragraphs_entity_embed',
    ['status' => TRUE])->save()). Verify passes when that filter's status is TRUE on pee_exec.
  bundle: paragraphs_entity_embed
  rubric_ref: rubric/paragraphs_entity_embed_paragraphs_entity_embed_enable_filter@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/paragraphs_entity_embed-enable-filter-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/paragraphs_entity_embed-enable-filter-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/paragraphs_entity_embed-enable-filter-verify.sh
- id: paragraphs_entity_embed-create-embed
  input: 'On this Drupal site, using the Paragraphs Entity Embed module, create a reusable embedded paragraph:
    an embedded_paragraphs entity labelled ''PEE Hard Embed'' that wraps a new paragraph of the existing
    ''bp_simple'' type. Save it to the live site.'
  criteria: Create and save a Paragraph of type bp_simple, then create an EmbeddedParagraphs entity with
    label 'PEE Hard Embed' whose paragraph field references it. Verify passes when an embedded_paragraphs
    entity labelled 'PEE Hard Embed' exists and references at least one paragraph.
  bundle: paragraphs_entity_embed
  rubric_ref: rubric/paragraphs_entity_embed_paragraphs_entity_embed_create_embed@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/paragraphs_entity_embed-create-embed-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/paragraphs_entity_embed-create-embed-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/paragraphs_entity_embed-create-embed-verify.sh
