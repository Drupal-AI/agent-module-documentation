rubrics:
- id: paragraphs_entity_embed_paragraphs_entity_embed_enable_how
  version: '1.0'
  applicable_bundles:
  - paragraphs_entity_embed
  checks:
  - kind: must_contain_any
    values:
    - filter
    - Display embedded paragraphs
    - paragraphs_entity_embed
    - button
    - toolbar
  scoring:
    combine: all_pass
- id: paragraphs_entity_embed_paragraphs_entity_embed_storage
  version: '1.0'
  applicable_bundles:
  - paragraphs_entity_embed
  checks:
  - kind: must_contain_any
    values:
    - embedded_paragraphs
    - drupal-paragraph
  scoring:
    combine: all_pass
- id: paragraphs_entity_embed_paragraphs_entity_embed_permissions
  version: '1.0'
  applicable_bundles:
  - paragraphs_entity_embed
  checks:
  - kind: must_contain_any
    values:
    - add paragraphs entity embed
    - edit paragraphs entity embed
    - administer paragraphs entity embed
    - paragraphs entity embed
  scoring:
    combine: all_pass
- id: paragraphs_entity_embed_paragraphs_entity_embed_which_format
  version: '1.0'
