metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: paragraphs_previewer
  version: 1.9.x
  note: 'Paragraphs Previewer has no settings form and no configure route. Its whole surface is: three
    FieldWidget plugins for entity_reference_revisions fields (paragraphs_previewer, entity_reference_paragraphs_previewer,
    and the deprecated misspelled paragraphs_previwer), one simple config object paragraphs_previewer.settings
    with the single key previewer_view_mode (default ''full''), one permission ''view any paragraphs previewer''
    guarding the CSRF-protected route paragraphs_previewer.form_preview, and three asset libraries. Every
    case below is grounded in those real ids. Medium cases install a known live state (a widget choice
    on core.entity_form_display.node.article.default, and a non-default previewer_view_mode) so the answer
    can only be read off the running site. Hard cases require switching a real form-display widget and
    granting the real permission, both verified against live config.'
questions:
- id: paragraphs_previewer-widget-id
  input: On a Drupal 11 site with the contrib module paragraphs_previewer enabled, how do I actually get
    the 'Preview' button to appear on a Paragraphs field? Name the field widget plugin id I should select
    and where I select it.
  criteria: 'There is no settings page. On the host bundle''s Manage form display (e.g. /admin/structure/types/manage/article/form-display)
    change the Paragraphs field''s widget to ''Paragraphs Previewer'', plugin id paragraphs_previewer.
    This writes type: paragraphs_previewer into the component in core.entity_form_display.<entity>.<bundle>.<form_mode>.'
  bundle: paragraphs_previewer
  rubric_ref: rubric/paragraphs_previewer_paragraphs_previewer_widget_id@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: paragraphs_previewer-view-mode-key
  input: Which view mode does paragraphs_previewer use to render the paragraph inside the preview modal,
    and which config key controls it? There is no admin UI for it - how would I change it to 'teaser'?
  criteria: The config object paragraphs_previewer.settings has a single key previewer_view_mode, shipped
    as 'full'. Change it with `drush cset paragraphs_previewer.settings previewer_view_mode teaser -y`
    (or via config API). The controller falls back to 'full' when the value is empty.
  bundle: paragraphs_previewer
  rubric_ref: rubric/paragraphs_previewer_paragraphs_previewer_view_mode_key@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: paragraphs_previewer-permission-route
  input: Editors on my Drupal site see the paragraphs_previewer 'Preview' button but the modal shows an
    access denied page. Which permission does this module define, and what route does it protect?
  criteria: 'The module defines one permission, ''view any paragraphs previewer''. It is the _permission
    requirement of the route paragraphs_previewer.form_preview (path paragraphs-previewer/form/{form_build_id}/{element_parents}),
    which also requires _csrf_token: TRUE. Grant the permission to the editor roles, e.g. `drush role:perm:add
    editor ''view any paragraphs previewer''`.'
  bundle: paragraphs_previewer
  rubric_ref: rubric/paragraphs_previewer_paragraphs_previewer_permission_route@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: paragraphs_previewer-known-widget
  input: This Drupal site's Article content type has two Paragraphs fields, field_pp_known and field_pp_plain.
    Exactly one of them is configured to use the Paragraphs Previewer widget on the default form display.
    Inspect the running site and tell me which field it is and which widget plugin id it uses.
  criteria: 'field_pp_known. In core.entity_form_display.node.article.default its component has type:
    paragraphs_previewer (edit_mode: closed), while field_pp_plain uses the stock type: paragraphs widget.'
  bundle: paragraphs_previewer
  rubric_ref: rubric/paragraphs_previewer_paragraphs_previewer_known_widget@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/paragraphs_previewer-known-widget-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/paragraphs_previewer-known-widget-cleanup.sh
- id: paragraphs_previewer-view-mode
  input: On this Drupal site, when an editor clicks the paragraphs_previewer 'Preview' button, which entity
    view mode is actually used to render the paragraph in the modal? Check the live configuration rather
    than assuming the module default, and say which config key you read.
  criteria: teaser. The site has paragraphs_previewer.settings:previewer_view_mode set to 'teaser' (the
    module default would be 'full'); check with `drush cget paragraphs_previewer.settings previewer_view_mode`.
  bundle: paragraphs_previewer
  rubric_ref: rubric/paragraphs_previewer_paragraphs_previewer_view_mode@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/paragraphs_previewer-view-mode-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/paragraphs_previewer-view-mode-cleanup.sh
- id: paragraphs_previewer-enable-widget
  input: This Drupal site's Article content type has a Paragraphs field field_pp_task that currently uses
    the stock 'Paragraphs' widget on the default form display. Using the paragraphs_previewer module,
    change the default form display so this field's widget gives editors the per-paragraph Preview button.
    Apply the change to the live site.
  criteria: 'In core.entity_form_display.node.article.default the field_pp_task component must have type:
    paragraphs_previewer (set the component type and save the entity_form_display, or pick ''Paragraphs
    Previewer'' on Manage form display).'
  bundle: paragraphs_previewer
  rubric_ref: rubric/paragraphs_previewer_paragraphs_previewer_enable_widget@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/paragraphs_previewer-enable-widget-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/paragraphs_previewer-enable-widget-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/paragraphs_previewer-enable-widget-verify.sh
- id: paragraphs_previewer-grant-permission
  input: My site has a role called pp_reviewer. People in that role click the Preview button on a paragraph
    and just get an 'access denied' page inside the popup. Please give that role whatever it needs so
    the paragraph previews actually load, and apply it to the live site.
  criteria: Grant the paragraphs_previewer permission 'view any paragraphs previewer' to the pp_reviewer
    role (drush role:perm:add pp_reviewer 'view any paragraphs previewer'), because it is the _permission
    requirement of the route paragraphs_previewer.form_preview loaded inside the modal iframe.
  bundle: paragraphs_previewer
  rubric_ref: rubric/paragraphs_previewer_paragraphs_previewer_grant_permission@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: site-owner
    reset: agent-module-documentation/evaluation/verify/paragraphs_previewer-grant-permission-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/paragraphs_previewer-grant-permission-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/paragraphs_previewer-grant-permission-verify.sh
