metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: paragraphs_ee_sets
  version: 10.1.x
  note: 'Bridge submodule of paragraphs_ee that brings the enhanced tile dialog to Paragraphs Sets. Cases
    are `recipe` (response-graded): they probe documented integration facts; no site mutation.'
questions:
- id: paragraphs_ee_sets-purpose
  input: What does the paragraphs_ee_sets submodule do?
  criteria: It brings the Paragraphs Editor Enhancements tile dialog to Paragraphs Sets, showing predefined
    reusable sets as icon tiles in a dedicated 'Paragraphs Sets' group in the enhanced add dialog.
  bundle: paragraphs_ee_sets
  rubric_ref: rubric/paragraphs_ee_sets_paragraphs_ee_sets_purpose@1.0
  tags:
  - mode:recipe
- id: paragraphs_ee_sets-dependencies
  input: Which two modules does paragraphs_ee_sets depend on?
  criteria: It depends on paragraphs_ee and paragraphs_sets (it is a bridge between them).
  bundle: paragraphs_ee_sets
  rubric_ref: rubric/paragraphs_ee_sets_paragraphs_ee_sets_dependencies@1.0
  tags:
  - mode:recipe
- id: paragraphs_ee_sets-activation
  input: Under what widget conditions does paragraphs_ee_sets actually restyle the set buttons?
  criteria: Only when the widget has Paragraphs Sets enabled (paragraphs_sets.use_paragraphs_sets) and
    add mode is 'modal'.
  bundle: paragraphs_ee_sets
  rubric_ref: rubric/paragraphs_ee_sets_paragraphs_ee_sets_activation@1.0
  tags:
  - mode:recipe
- id: paragraphs_ee_sets-group-tab
  input: How are Paragraphs Sets presented relative to individual paragraph types in the enhanced dialog?
  criteria: The set buttons are collected into a separate 'Paragraphs Sets' category tab/group, kept apart
    from individual paragraph types.
  bundle: paragraphs_ee_sets
  rubric_ref: rubric/paragraphs_ee_sets_paragraphs_ee_sets_group_tab@1.0
  tags:
  - mode:recipe
- id: paragraphs_ee_sets-icon
  input: Where does the icon shown on each Paragraphs Set tile come from in paragraphs_ee_sets?
  criteria: From the set's own icon via ParagraphsSet::getIconUrl(); sets without an icon get a default
    placeholder image.
  bundle: paragraphs_ee_sets
  rubric_ref: rubric/paragraphs_ee_sets_paragraphs_ee_sets_icon@1.0
  tags:
  - mode:recipe
- id: paragraphs_ee_sets-order
  input: How does paragraphs_ee_sets make sure its widget alterations run after paragraphs_ee and paragraphs_sets?
  criteria: It sets its install-time module weight to 20 and implements hook_module_implements_alter()
    to move its field_widget_complete_form_alter to the end.
  bundle: paragraphs_ee_sets
  rubric_ref: rubric/paragraphs_ee_sets_paragraphs_ee_sets_order@1.0
  tags:
  - mode:recipe
