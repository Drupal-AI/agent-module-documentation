# Generated from evals.json by evaluation/to_commons.py.
# Edit evals.json and rerun the script; do not edit this file.
metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: paragraphs_ee
  version: 10.1.x
  note: 'Paragraphs Editor Enhancements restyles the Paragraphs add dialog (tiles/list, categories, icons)
    when a Paragraphs widget uses modal add mode. Cases are `recipe` (response-graded): they probe documented
    facts an agent would otherwise read source to answer; no site mutation.'
questions:
- id: paragraphs_ee-enable-dialog
  input: I installed Paragraphs Editor Enhancements but my paragraph field still shows plain add buttons.
    What widget setting must I change so the enhanced tile dialog appears?
  criteria: 'The Paragraphs widget''s Add mode must be set to ''Modal form'' (add_mode: modal) on the
    entity''s Manage form display; the enhancements only apply in modal add mode.'
  bundle: paragraphs_ee
  rubric_ref: rubric/paragraphs_ee_paragraphs_ee_enable_dialog@1.0
  tags:
  - mode:recipe
- id: paragraphs_ee-dependency
  input: Which contrib module does paragraphs_ee declare as its dependency in its info.yml, and what does
    that module in turn require?
  criteria: paragraphs_ee.info.yml depends on paragraphs_features (Paragraphs Features), which itself
    requires the Paragraphs module.
  bundle: paragraphs_ee
  rubric_ref: rubric/paragraphs_ee_paragraphs_ee_dependency@1.0
  tags:
  - mode:recipe
- id: paragraphs_ee-categories-entity
  input: On a Drupal site using Paragraphs Editor Enhancements, how do I create groups (categories) to
    organize paragraph types in the add dialog, and where is that managed?
  criteria: Create Paragraphs category config entities at Admin > Structure > Paragraphs categories (/admin/structure/paragraphs_category,
    route entity.paragraphs_category.collection).
  bundle: paragraphs_ee
  rubric_ref: rubric/paragraphs_ee_paragraphs_ee_categories_entity@1.0
  tags:
  - mode:recipe
- id: paragraphs_ee-assign-type-category
  input: How is a paragraph type assigned to one or more Paragraphs Editor Enhancements categories, and
    where is that selection stored?
  criteria: The paragraph type edit form gains a 'Paragraphs categories' checkboxes element; selections
    are stored as the paragraph type third-party setting paragraphs_ee.paragraphs_categories (a list of
    category IDs).
  bundle: paragraphs_ee
  rubric_ref: rubric/paragraphs_ee_paragraphs_ee_assign_type_category@1.0
  tags:
  - mode:recipe
- id: paragraphs_ee-dialog-style
  input: Which widget third-party setting controls whether Paragraphs Editor Enhancements shows paragraph
    types as tiles or as a plain list, and what is its default?
  criteria: The dialog_style key under the widget's paragraphs_ee third-party settings; values 'tiles'
    or 'list', default 'tiles'.
  bundle: paragraphs_ee
  rubric_ref: rubric/paragraphs_ee_paragraphs_ee_dialog_style@1.0
  tags:
  - mode:recipe
- id: paragraphs_ee-icons
  input: Where do the icon images shown on each tile in the enhanced add dialog come from?
  criteria: From the icon uploaded on each Paragraphs type itself (ParagraphsType::getIconUrl()); types
    without an icon get a default placeholder image.
  bundle: paragraphs_ee
  rubric_ref: rubric/paragraphs_ee_paragraphs_ee_icons@1.0
  tags:
  - mode:recipe
- id: paragraphs_ee-permission
  input: What permission does Paragraphs Editor Enhancements define, and what does it gate?
  criteria: '''administer paragraphs categories'' gates creating/editing/deleting the Paragraphs category
    config entities at /admin/structure/paragraphs_category.'
  bundle: paragraphs_ee
  rubric_ref: rubric/paragraphs_ee_paragraphs_ee_permission@1.0
  tags:
  - mode:recipe
- id: paragraphs_ee-widget-access-hook
  input: In a custom module I want to prevent Paragraphs Editor Enhancements from modifying a particular
    paragraphs widget. Which hook do I implement?
  criteria: Implement hook_paragraphs_ee_widget_access() and return AccessResult::forbidden(); a forbidden
    result makes paragraphs_ee leave the widget unchanged.
  bundle: paragraphs_ee
  rubric_ref: rubric/paragraphs_ee_paragraphs_ee_widget_access_hook@1.0
  tags:
  - mode:recipe
