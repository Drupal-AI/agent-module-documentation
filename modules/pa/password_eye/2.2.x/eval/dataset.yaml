metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: password_eye
  version: 2.2.x
  note: 'Password Eye adds a show/hide eye icon to password fields. Its entire behaviour is driven by
    one config value: password_eye.settings -> password_eye.form_id_password, a comma-separated list of
    form ids (default user_login_form). hook_form_alter() adds class pwd-see and attaches library password_eye/pwd_eye_lib
    only to forms whose id is listed; JS toggles the input type between password and text. Settings form
    at route password_eye.route (/admin/config/system/pssword_eye-settings). No permission of its own,
    no config schema. Cases are grounded in that real config value: introspection reads back which form
    ids are targeted; execution edits the list to add a form / restrict to a different form, verified
    against live config.'
questions:
- id: password_eye-default
  input: After enabling the password_eye module on a Drupal 11 site, which form gets the show-password
    eye icon by default, and does it require any configuration to work out of the box?
  criteria: By default it targets the user login form (form id user_login_form, set at install), so the
    eye icon appears on the login form with no extra configuration.
  bundle: password_eye
  rubric_ref: rubric/password_eye_password_eye_default@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: password_eye-add-form
  input: How do I make password_eye show its eye icon on additional forms (not just the login form)? Which
    config value do I change and in what format?
  criteria: Edit password_eye.settings -> password_eye.form_id_password, a comma-separated list of form
    ids (e.g. user_login_form,user_register_form), via the settings form at /admin/config/system/pssword_eye-settings
    or drush cset. Any form whose id is listed gets the class pwd-see and the pwd_eye_lib library.
  bundle: password_eye
  rubric_ref: rubric/password_eye_password_eye_add_form@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: password_eye-mechanism
  input: Technically, how does password_eye make a password field's value visible when the eye is clicked,
    and which library/CSS classes are involved?
  criteria: hook_form_alter adds class pwd-see and attaches password_eye/pwd_eye_lib; the JS (Drupal.behaviors.pwd)
    inserts a span.shwpd after each :password input and toggles the input's type between 'password' and
    'text' (swapping eye-open/eye-close classes).
  bundle: password_eye
  rubric_ref: rubric/password_eye_password_eye_mechanism@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: password_eye-custom-form
  input: On this Drupal site, password_eye has been configured to show its eye icon on an extra custom
    form. Inspect the live configuration and name the custom form id that was added (besides the default
    login form).
  criteria: The custom form id is pe_custom_form (password_eye.settings:password_eye.form_id_password
    = 'user_login_form,pe_custom_form').
  bundle: password_eye
  rubric_ref: rubric/password_eye_password_eye_custom_form@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/password_eye-custom-form-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/password_eye-custom-form-cleanup.sh
- id: password_eye-solo-form
  input: Inspect this site's password_eye configuration and state exactly which form id(s) currently receive
    the eye icon.
  criteria: Only pe_solo_form receives the eye icon (password_eye.settings:password_eye.form_id_password
    = 'pe_solo_form'); the login form is not included.
  bundle: password_eye
  rubric_ref: rubric/password_eye_password_eye_solo_form@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/password_eye-solo-form-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/password_eye-solo-form-cleanup.sh
- id: password_eye-add
  input: On this Drupal site, configure password_eye so the show-password eye icon also appears on the
    user registration form (form id user_register_form), while keeping it on the login form. Apply the
    change to the live site.
  criteria: password_eye.settings:password_eye.form_id_password becomes 'user_login_form,user_register_form'
    (the list now contains user_register_form).
  bundle: password_eye
  rubric_ref: rubric/password_eye_password_eye_add@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/password_eye-add-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/password_eye-add-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/password_eye-add-verify.sh
- id: password_eye-replace
  input: Configure password_eye on this site so the eye icon appears ONLY on the comment form (form id
    comment_comment_form) and NOT on the login form. Apply the change to the live site.
  criteria: password_eye.settings:password_eye.form_id_password is set to 'comment_comment_form' (contains
    comment_comment_form and no longer contains user_login_form).
  bundle: password_eye
  rubric_ref: rubric/password_eye_password_eye_replace@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/password_eye-replace-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/password_eye-replace-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/password_eye-replace-verify.sh
