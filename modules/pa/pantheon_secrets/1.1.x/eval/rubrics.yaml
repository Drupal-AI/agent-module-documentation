rubrics:
- id: pantheon_secrets_pantheon_secrets_drush_sync
  version: '1.0'
  applicable_bundles:
  - pantheon_secrets
  checks:
  - kind: must_contain_any
    values:
    - pantheon-secrets:sync
    - pantheon_secrets:sync
  scoring:
    combine: all_pass
- id: pantheon_secrets_pantheon_secrets_provider_config
  version: '1.0'
  applicable_bundles:
  - pantheon_secrets
  checks:
  - kind: must_contain_any
    values:
    - secret_name
    - key_provider_settings
    - '"pantheon"'
    - '''pantheon'''
    - 'key_provider: pantheon'
  scoring:
    combine: all_pass
- id: pantheon_secrets_pantheon_secrets_sync_page
  version: '1.0'
  applicable_bundles:
  - pantheon_secrets
  checks:
  - kind: must_contain_any
    values:
    - sync pantheon_secrets keys
    - /admin/config/system/keys/pantheon
    - admin/config/system/keys/pantheon
  scoring:
    combine: all_pass
- id: pantheon_secrets_pantheon_secrets_known_key
  version: '1.0'
  applicable_bundles:
  - pantheon_secrets
  checks:
  - kind: must_contain_any
    values:
    - ps_known_secret
  scoring:
    combine: all_pass
- id: pantheon_secrets_pantheon_secrets_sync_role
  version: '1.0'
  applicable_bundles:
  - pantheon_secrets
  checks:
  - kind: must_contain_any
    values:
    - ps_known_role
  scoring:
    combine: all_pass
- id: pantheon_secrets_pantheon_secrets_create_key
  version: '1.0'
  applicable_bundles:
  - pantheon_secrets
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
- id: pantheon_secrets_pantheon_secrets_sync_access
  version: '1.0'
  applicable_bundles:
  - pantheon_secrets
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
