metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: paragraphs_limits
  version: 1.0.x
  note: Paragraphs Limits adds an EntityReferenceSelection plugin (id paragraphs_limits, extends Paragraphs'
    ParagraphSelection) that you set as a paragraph field's reference method (handler). It adds per-bundle
    Lower limit / Upper limit numbers stored in the field config at settings.handler_settings.target_bundles_drag_drop.<paragraph_type>.{lower_limit,upper_limit}
    (0 = no limit). A ParagraphsLimits validation constraint (added via hook_entity_bundle_field_info_alter
    to fields using the handler) enforces min/max, and a widget alter hides a type's Add option at its
    max. No configure route, no permissions, no Drush. Medium/hard cases are grounded in a real entity_reference_revisions
    paragraph field (field_pl_para on Article, paragraph type pl_text).
questions:
- id: paragraphs_limits-how-to-set
  input: On a Drupal site with paragraphs_limits enabled, how do I limit a Paragraphs field so a given
    paragraph type can be added at most N times? Where do I set that and where is it stored?
  criteria: Edit the paragraph field's settings and set the Reference method (handler) to 'Paragraphs
    with limits' (paragraphs_limits). Each paragraph type then gets Lower limit / Upper limit columns;
    set the Upper limit to N. It is stored in the field config at settings.handler_settings.target_bundles_drag_drop.<type>.upper_limit.
  bundle: paragraphs_limits
  rubric_ref: rubric/paragraphs_limits_paragraphs_limits_how_to_set@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: paragraphs_limits-zero-meaning
  input: In the paragraphs_limits module, what does setting a paragraph type's lower or upper limit to
    0 do?
  criteria: A value of 0 disables that limit (no minimum / no maximum) for that paragraph type; only non-zero
    limits are enforced.
  bundle: paragraphs_limits
  rubric_ref: rubric/paragraphs_limits_paragraphs_limits_zero_meaning@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: paragraphs_limits-enforcement
  input: How does paragraphs_limits actually enforce the configured minimum/maximum paragraph counts?
    Name the two mechanisms.
  criteria: 'Two ways: (1) a ParagraphsLimits validation constraint (added via hook_entity_bundle_field_info_alter
    to fields using the handler) raises a violation on save when a type''s count is below its lower_limit
    or above its upper_limit; (2) a widget-complete form alter removes a type from the ''Add more'' select/buttons
    once its upper_limit is reached.'
  bundle: paragraphs_limits
  rubric_ref: rubric/paragraphs_limits_paragraphs_limits_enforcement@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: paragraphs_limits-known-max
  input: On this Drupal site, the Article content type has a Paragraphs field field_pl_para that uses
    the Paragraphs Limits handler. Inspect the live field configuration and state the maximum number of
    'pl_text' paragraphs allowed.
  criteria: 'The maximum is 5: field.field.node.article.field_pl_para settings.handler_settings.target_bundles_drag_drop.pl_text.upper_limit
    is 5 (lower_limit 1).'
  bundle: paragraphs_limits
  rubric_ref: rubric/paragraphs_limits_paragraphs_limits_known_max@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/paragraphs_limits-known-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/paragraphs_limits-known-cleanup.sh
- id: paragraphs_limits-which-handler
  input: On this Drupal site, which entity-reference selection handler is the Article field field_pl_para
    configured to use? Inspect the live field configuration to answer.
  criteria: It uses the 'paragraphs_limits' handler (field.field.node.article.field_pl_para settings.handler
    = paragraphs_limits).
  bundle: paragraphs_limits
  rubric_ref: rubric/paragraphs_limits_paragraphs_limits_which_handler@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/paragraphs_limits-handler-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/paragraphs_limits-handler-cleanup.sh
- id: paragraphs_limits-set-max
  input: On this Drupal site, the Article field field_pl_max already uses the Paragraphs Limits handler
    but currently allows unlimited 'pl_text' paragraphs. Configure it so at most 2 'pl_text' paragraphs
    can be added. Apply the change to the live site.
  criteria: field.field.node.article.field_pl_max settings.handler_settings.target_bundles_drag_drop.pl_text.upper_limit
    is set to 2 (handler remains paragraphs_limits).
  bundle: paragraphs_limits
  rubric_ref: rubric/paragraphs_limits_paragraphs_limits_set_max@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/paragraphs_limits-setmax-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/paragraphs_limits-setmax-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/paragraphs_limits-setmax-verify.sh
- id: paragraphs_limits-switch-handler
  input: On this Drupal site, the Article field field_pl_switch currently uses the default paragraph selection
    handler (no limits). Switch it to the Paragraphs Limits handler and limit the 'pl_text' paragraph
    type to a maximum of 3. Apply the change to the live site.
  criteria: field.field.node.article.field_pl_switch settings.handler is set to paragraphs_limits and
    target_bundles_drag_drop.pl_text.upper_limit is 3.
  bundle: paragraphs_limits
  rubric_ref: rubric/paragraphs_limits_paragraphs_limits_switch_handler@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/paragraphs_limits-switch-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/paragraphs_limits-switch-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/paragraphs_limits-switch-verify.sh
