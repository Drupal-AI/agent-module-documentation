metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: paragraphs_viewmode
  version: 1.2.x
  note: 'Paragraphs View Modes ships a single Paragraphs behavior plugin, paragraphs_viewmode_behavior,
    with no settings form, no configure route (configure=null), no permissions, no Drush, and no plugin
    type of its own. Its only config is the behavior plugin settings on a paragraphs_type config entity:
    paragraphs.paragraphs_type.<type> -> behavior_plugins.paragraphs_viewmode_behavior with keys enabled,
    override_mode, override_available (map), override_default. The per-paragraph pick is a behavior setting
    named view_mode on the paragraph entity, applied at render via hook_entity_view_mode_alter(). Medium/hard
    cases are grounded in that real config on a paragraphs_type.'
questions:
- id: paragraphs_viewmode-how-enable
  input: In Drupal, the paragraphs_viewmode module lets an editor choose a paragraph's view mode per instance.
    It has no admin settings page. How do you turn its feature on for a given paragraph type, and what
    is the machine name of the plugin involved?
  criteria: You enable the Paragraphs behavior plugin paragraphs_viewmode_behavior on the paragraph type's
    edit form (Behaviors section). It is a paragraphs behavior plugin, not a field/formatter, and there
    is no configure route.
  bundle: paragraphs_viewmode
  rubric_ref: rubric/paragraphs_viewmode_paragraphs_viewmode_how_enable@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: paragraphs_viewmode-config-keys
  input: For the paragraphs_viewmode behavior plugin, which configuration keys does it store on the paragraph
    type, and what does each control?
  criteria: It stores override_mode (which rendered view mode triggers the swap), override_available (the
    map of view modes an editor may switch to), and override_default (the default choice, which must also
    be in override_available). They live under behavior_plugins.paragraphs_viewmode_behavior on the paragraphs.paragraphs_type.<type>
    config entity.
  bundle: paragraphs_viewmode
  rubric_ref: rubric/paragraphs_viewmode_paragraphs_viewmode_config_keys@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: paragraphs_viewmode-hook
  input: How does the paragraphs_viewmode module actually change the view mode a paragraph is rendered
    with at display time? Name the Drupal hook it implements.
  criteria: 'It implements hook_entity_view_mode_alter(): for a paragraph entity it calls the enabled
    behavior plugin''s entityViewModeAlter(), which replaces the active view mode with the per-paragraph
    ''view_mode'' behavior setting the editor chose.'
  bundle: paragraphs_viewmode
  rubric_ref: rubric/paragraphs_viewmode_paragraphs_viewmode_hook@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: paragraphs_viewmode-known-type
  input: On this Drupal site, a paragraph type named pvm_known has the paragraphs_viewmode behavior enabled.
    Inspect the live configuration and state its default view mode (the override_default value).
  criteria: 'override_default is ''teaser'': in paragraphs.paragraphs_type.pvm_known the behavior_plugins.paragraphs_viewmode_behavior
    mapping has enabled: true and override_default: teaser.'
  bundle: paragraphs_viewmode
  rubric_ref: rubric/paragraphs_viewmode_paragraphs_viewmode_known_type@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/paragraphs_viewmode-known-type-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/paragraphs_viewmode-known-type-cleanup.sh
- id: paragraphs_viewmode-which-enabled
  input: A paragraph type pvm_known exists on this site. Does it have the paragraphs_viewmode behavior
