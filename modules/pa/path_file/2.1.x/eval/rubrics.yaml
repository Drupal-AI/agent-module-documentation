rubrics:
- id: path_file_path_file_change_extensions
  version: '1.0'
  applicable_bundles:
  - path_file
  checks:
  - kind: must_contain_any
    values:
    - allowed_extensions
    - path_file.settings
    - /admin/structure/path_file_entity/settings
    - settings form
  scoring:
    combine: all_pass
- id: path_file_path_file_download_url
  version: '1.0'
  applicable_bundles:
  - path_file
  checks:
  - kind: must_contain_any
    values:
    - /path-file/
    - BinaryFileResponse
    - canonical
    - path alias
  scoring:
    combine: all_pass
- id: path_file_path_file_default_view_permission
  version: '1.0'
  applicable_bundles:
  - path_file
  checks:
  - kind: must_contain_any
    values:
    - view published path file entity entities
  scoring:
    combine: all_pass
- id: path_file_path_file_known_allowed_extensions
  version: '1.0'
  applicable_bundles:
  - path_file
  checks:
  - kind: must_contain_any
    values:
    - pf_eval_marker
    - md
    - svg
  scoring:
    combine: all_pass
- id: path_file_path_file_known_alias
  version: '1.0'
  applicable_bundles:
  - path_file
  checks:
  - kind: must_contain_any
    values:
    - /pf-eval-doc
  scoring:
    combine: all_pass
- id: path_file_path_file_add_extension
  version: '1.0'
  applicable_bundles:
  - path_file
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
- id: path_file_path_file_create_download
  version: '1.0'
  applicable_bundles:
  - path_file
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
