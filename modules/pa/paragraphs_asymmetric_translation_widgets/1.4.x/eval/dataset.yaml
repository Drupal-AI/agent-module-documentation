    cleanup: agent-module-documentation/evaluation/verify/paragraphs_asymmetric-introspect-cleanup.sh
- id: pasym-set-widget-expert
  input: On this Drupal site (drush available), the Article content type has a paragraphs reference field
    `field_asym_para` whose form-display widget is the stock stable `paragraphs` widget. Change the Article
    default entity form display so that `field_asym_para` uses the Paragraphs Asymmetric Translation Widgets
    legacy asymmetric widget (`paragraphs_classic_asymmetric`). Apply it to the live site so it really
    takes effect; don't just describe it. One-line summary.
  criteria: node.article's default form display component for field_asym_para has widget type `paragraphs_classic_asymmetric`.
    Verified against live site state.
  bundle: paragraphs_asymmetric_translation_widgets
  rubric_ref: rubric/paragraphs_asymmetric_translation_widgets_pasym_set_widget_expert@1.0
