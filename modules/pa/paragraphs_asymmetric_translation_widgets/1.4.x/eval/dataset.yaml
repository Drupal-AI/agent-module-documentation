metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: paragraphs_asymmetric_translation_widgets
  version: 1.4.x
  note: 'Tiered suite. easy (recipe): probe module-specific, load-bearing facts graded on response text,
    no site mutation. medium (introspection): a setup script installs a known asymmetric-widget configuration
    to the live site, the agent inspects the entity_form_display via drush and answers, graded on response
    text; a cleanup script restores baseline. hard (execution): a reset script creates a paragraphs field
    on Article with a non-asymmetric widget, the agent switches the form-display widget to this module''s
    asymmetric widget, and a verify script checks live state (exit 0 = pass). The one selectable widget
    id this module registers is ''paragraphs_classic_asymmetric''; the modern ''paragraphs'' widget is
    made asymmetric by a class swap (hook_field_widget_info_alter), not a new id.'
questions:
- id: pasym-legacy-widget-id
  input: On a Drupal 11 site, the Paragraphs Asymmetric Translation Widgets module adds one new, selectable
    field widget for entity_reference_revisions fields so the legacy inline Paragraphs form supports asymmetric
    translations. What is the machine name (plugin id) of that widget?
  criteria: The widget id is `paragraphs_classic_asymmetric` (label "Paragraphs Legacy Asymmetric"), extending
    the classic InlineParagraphsWidget.
  bundle: paragraphs_asymmetric_translation_widgets
  rubric_ref: rubric/paragraphs_asymmetric_translation_widgets_pasym_legacy_widget_id@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: pasym-modern-widget-classswap
  input: How does Paragraphs Asymmetric Translation Widgets make the MODERN stable `paragraphs` field
    widget support asymmetric translations? Does it register a new widget id for the modern form, and
    which hook does it use?
  criteria: It does NOT add a new id for the modern form; it implements hook_field_widget_info_alter()
    to swap the class of the existing `paragraphs` widget to ParagraphsAsymmetricWidget.
  bundle: paragraphs_asymmetric_translation_widgets
  rubric_ref: rubric/paragraphs_asymmetric_translation_widgets_pasym_modern_widget_classswap@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: pasym-translation-duplication
  input: Which Drupal hook does the Paragraphs Asymmetric Translation Widgets module implement to give
    each new translation its own independent set of paragraphs, and what does it do in that hook?
  criteria: It implements hook_entity_translation_create(), recursively duplicating the source language's
    translatable entity_reference_revisions -> paragraph items so each translation starts with its own
    paragraph revisions.
  bundle: paragraphs_asymmetric_translation_widgets
  rubric_ref: rubric/paragraphs_asymmetric_translation_widgets_pasym_translation_duplication@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: pasym-introspect-widget-id
  input: On this Drupal site (drush available), the Article content type has a paragraphs reference field
    `field_asym_para`. Inspect the Article default entity form display and tell me which field widget
    (plugin id) is configured for that field.
  criteria: The node.article default form display uses the `paragraphs_classic_asymmetric` widget for
    field_asym_para.
  bundle: paragraphs_asymmetric_translation_widgets
  rubric_ref: rubric/paragraphs_asymmetric_translation_widgets_pasym_introspect_widget_id@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    persona: drupal-expert
    setup: agent-module-documentation/evaluation/verify/paragraphs_asymmetric-introspect-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/paragraphs_asymmetric-introspect-cleanup.sh
- id: pasym-introspect-edit-mode
  input: On this Drupal site (drush available), inspect the Article default form display component for
    the paragraphs field `field_asym_para`. What is the value of its widget `edit_mode` setting?
  criteria: 'The widget''s edit_mode setting is `closed` (the field_asym_para component uses the paragraphs_classic_asymmetric
    widget with edit_mode: closed).'
  bundle: paragraphs_asymmetric_translation_widgets
  rubric_ref: rubric/paragraphs_asymmetric_translation_widgets_pasym_introspect_edit_mode@1.0
  tags:
