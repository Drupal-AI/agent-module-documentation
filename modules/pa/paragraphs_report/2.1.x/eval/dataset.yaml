metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: paragraphs_report
  version: 2.1.x
  note: Paragraphs Report inventories which paragraph types are used on which nodes. Settings persist
    in paragraphs_report.settings (content_types checkbox map, hide_paras, import_rows_per_batch default
    10, watch_content bool). Report DATA lives in the key-value collection paragraph_report.report_data
    (key 'data'), not config. Drush 'paragraphs_report:update' (alias pru). Report page /admin/reports/paragraphs-report
    (route paragraphs_report.report, the configure route); settings tab /admin/reports/paragraphs-report/settings.
    Medium cases seed known settings values and read them back; hard cases require setting content_types/watch_content/import_rows_per_batch,
    verified against live config. Baselines restored to install defaults (content_types {}, import_rows_per_batch
    10, watch_content false).
questions:
- id: paragraphs-report-drush
  input: On a Drupal 11 site with the Paragraphs Report module, which Drush command rebuilds the paragraphs
    usage report, and what is its alias?
  criteria: 'drush paragraphs_report:update (alias: drush pru). It scans the configured content types
    and stores usage in the key-value report data.'
  bundle: paragraphs_report
  rubric_ref: rubric/paragraphs_report_paragraphs_report_drush@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: paragraphs-report-where
  input: Where is the Paragraphs Report in the Drupal admin, and which configuration object / key controls
    which content types are scanned?
  criteria: Report is at /admin/reports/paragraphs-report (route paragraphs_report.report); the content
    types to scan are in paragraphs_report.settings under the content_types key (settings tab at /admin/reports/paragraphs-report/settings).
  bundle: paragraphs_report
  rubric_ref: rubric/paragraphs_report_paragraphs_report_where@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: paragraphs-report-watch
  input: In Paragraphs Report, what does the 'Watch for content changes' option do, and which config key
    represents it?
  criteria: When enabled (config key watch_content = true), node insert/update/delete automatically update
    the report data for the selected content types, so you do not have to rerun the report manually.
  bundle: paragraphs_report
  rubric_ref: rubric/paragraphs_report_paragraphs_report_watch@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: paragraphs-report-known-batch
  input: On this Drupal site the Paragraphs Report batch size has been changed from its default. Inspect
    the live configuration and state how many nodes it processes per batch.
  criteria: paragraphs_report.settings.import_rows_per_batch is 37 (default is 10).
  bundle: paragraphs_report
  rubric_ref: rubric/paragraphs_report_paragraphs_report_known_batch@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/paragraphs_report-known-batch-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/paragraphs_report-known-batch-cleanup.sh
- id: paragraphs-report-known-types
  input: The Paragraphs Report on this site is configured to scan one content type. Inspect the live configuration
    and give the machine name of the content type it reports on.
  criteria: paragraphs_report.settings.content_types contains blog_post (selected).
  bundle: paragraphs_report
  rubric_ref: rubric/paragraphs_report_paragraphs_report_known_types@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/paragraphs_report-known-types-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/paragraphs_report-known-types-cleanup.sh
- id: paragraphs-report-configure-scan
  input: Configure the Paragraphs Report module to report on the 'article' content type and to automatically
    keep the report up to date whenever content changes. Apply the change to the live site.
  criteria: In paragraphs_report.settings, include 'article' in content_types (as article => article)
    and set watch_content to TRUE.
  bundle: paragraphs_report
  rubric_ref: rubric/paragraphs_report_paragraphs_report_configure_scan@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/paragraphs_report-configure-scan-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/paragraphs_report-configure-scan-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/paragraphs_report-configure-scan-verify.sh
- id: paragraphs-report-set-batch
  input: The Paragraphs Report keeps timing out because our pages have lots of components. In the report
    settings, change the number of nodes processed per batch to 50. Apply the change to the live site.
  criteria: Set paragraphs_report.settings.import_rows_per_batch to 50.
  bundle: paragraphs_report
  rubric_ref: rubric/paragraphs_report_paragraphs_report_set_batch@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: site-owner-layman
    reset: agent-module-documentation/evaluation/verify/paragraphs_report-set-batch-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/paragraphs_report-set-batch-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/paragraphs_report-set-batch-verify.sh
