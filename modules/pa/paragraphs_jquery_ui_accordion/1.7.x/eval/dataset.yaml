metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: paragraphs_jquery_ui_accordion
  version: 1.7.x
  note: 'Paragraphs jQuery UI Accordion provides one field formatter, paragraphs_jquery_ui_accordion_formatter,
    for multi-value entity_reference_revisions fields targeting the paragraph entity type. Settings: bundle,
    title, content, view_mode, active, simple_id, autoscroll, autoscroll_offset, autoscroll_offset_toolbar
    (schema field.formatter.settings.paragraphs_jquery_ui_accordion_formatter). No settings page, no permissions.
    It uses core''s bundled jQuery UI accordion via jquery_ui_accordion (no extra libs). Medium/hard cases
    are grounded in a real entity view display: introspection reads the formatter type and its ''bundle''
    setting; execution switches a paragraph field''s formatter to the accordion formatter and flips ''active''
    to open the first panel, verified against the live entity_view_display. Fields are namespaced field_pjqa_*.'
questions:
- id: paragraphs_jquery_ui_accordion-how-to-display
  input: In Drupal, how do I display a multi-value Paragraphs field as a jQuery UI accordion using the
    paragraphs_jquery_ui_accordion module? What field type does it apply to and where do I enable it?
  criteria: On the entity's Manage display, choose the 'Paragraphs jQuery UI Accordion' formatter (paragraphs_jquery_ui_accordion_formatter)
    for a multi-value entity_reference_revisions field that targets paragraphs.
  bundle: paragraphs_jquery_ui_accordion
  rubric_ref: rubric/paragraphs_jquery_ui_accordion_paragraphs_jquery_ui_accordion_how_to_display@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: paragraphs_jquery_ui_accordion-title-content-settings
  input: Which formatter settings of paragraphs_jquery_ui_accordion decide which paragraph bundle is used
    and which fields become the accordion header vs the collapsible body?
  criteria: The 'bundle' setting selects the paragraph bundle; 'title' selects the field used as the accordion
    header; 'content' selects the field rendered as the collapsible body (with 'view_mode' controlling
    how the body is rendered).
  bundle: paragraphs_jquery_ui_accordion
  rubric_ref: rubric/paragraphs_jquery_ui_accordion_paragraphs_jquery_ui_accordion_title_content_settings@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: paragraphs_jquery_ui_accordion-libraries
  input: Does paragraphs_jquery_ui_accordion require downloading an external jQuery UI library, or does
    it rely on something already in Drupal?
  criteria: No external download is needed — it attaches its own 'accordion' library which depends on
    Drupal core's bundled jQuery UI Accordion via the jquery_ui_accordion module.
  bundle: paragraphs_jquery_ui_accordion
  rubric_ref: rubric/paragraphs_jquery_ui_accordion_paragraphs_jquery_ui_accordion_libraries@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: paragraphs_jquery_ui_accordion-which-field
  input: On this Drupal site, one paragraph field on the Article content type's default display is rendered
    as a jQuery UI accordion. Inspect the live view display and give the machine name of that field.
  criteria: field_pjqa_ref — in core.entity_view_display.node.article.default its component type is paragraphs_jquery_ui_accordion_formatter.
  bundle: paragraphs_jquery_ui_accordion
  rubric_ref: rubric/paragraphs_jquery_ui_accordion_paragraphs_jquery_ui_accordion_which_field@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/paragraphs_jquery_ui_accordion-which-field-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/paragraphs_jquery_ui_accordion-which-field-cleanup.sh
- id: paragraphs_jquery_ui_accordion-bundle-setting
  input: On this Drupal site, the Article field field_pjqa_faq is displayed with the Paragraphs jQuery
    UI Accordion formatter. Which paragraph bundle is that formatter configured to read? Inspect the live
    view display.
  criteria: pjqa_faq_item — the accordion formatter's 'bundle' setting on field_pjqa_faq in core.entity_view_display.node.article.default
    is pjqa_faq_item.
  bundle: paragraphs_jquery_ui_accordion
  rubric_ref: rubric/paragraphs_jquery_ui_accordion_paragraphs_jquery_ui_accordion_bundle_setting@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/paragraphs_jquery_ui_accordion-bundle-setting-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/paragraphs_jquery_ui_accordion-bundle-setting-cleanup.sh
- id: paragraphs_jquery_ui_accordion-apply-formatter
  input: On this Drupal site, the Article content type has a multi-value paragraph reference field field_pjqa_task
    currently shown with the default paragraph formatter. Change its default view display so the field
    is rendered as a jQuery UI accordion using the paragraphs_jquery_ui_accordion module. Apply the change
    to the live site.
  criteria: In core.entity_view_display.node.article.default the field_pjqa_task component type is set
    to paragraphs_jquery_ui_accordion_formatter (e.g. via the entity_display.repository view display setComponent
    + save).
  bundle: paragraphs_jquery_ui_accordion
  rubric_ref: rubric/paragraphs_jquery_ui_accordion_paragraphs_jquery_ui_accordion_apply_formatter@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/paragraphs_jquery_ui_accordion-apply-formatter-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/paragraphs_jquery_ui_accordion-apply-formatter-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/paragraphs_jquery_ui_accordion-apply-formatter-verify.sh
- id: paragraphs_jquery_ui_accordion-open-first
  input: On this Drupal site, the Article field field_pjqa_open is already rendered as a Paragraphs jQuery
    UI Accordion, but all panels start collapsed. Configure the formatter so the first accordion panel
    is open by default. Apply the change to the live view display.
  criteria: The accordion formatter's 'active' setting on field_pjqa_open is set to 1 in core.entity_view_display.node.article.default
    (open first panel by default).
  bundle: paragraphs_jquery_ui_accordion
  rubric_ref: rubric/paragraphs_jquery_ui_accordion_paragraphs_jquery_ui_accordion_open_first@1.0
  tags:
  - mode:execution
  - difficulty:hard
