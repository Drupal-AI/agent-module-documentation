metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: pager_serializer
  version: 1.3.x
  note: Pager Serializer provides a Views REST-export style plugin (id pager_serializer, extends core
    rest Serializer) that outputs serialized rows plus a pager object (current_page, total_items, total_pages,
    items_per_page). Requires core rest. All labels/flags come from config object pager_serializer.settings
    (form route pager_serializer.settings at /admin/config/pager_serializer; reset route pager_serializer.settings.reset),
    which ships config/install defaults (rows/pager, all *_enabled true, standard *_label names). Each
    row can be altered via hook_pager_serializer_row_alter. Core permission administer site configuration;
    no own permission/Drush/new plugin type. Medium/hard scripts set and read these real config keys and
    restore the shipped defaults.
questions:
- id: pager_serializer-what-fields
  input: What does the pager_serializer module add to a Drupal Views REST export response compared with
    the standard Serializer?
  criteria: It wraps the serialized rows (under a 'rows' key) alongside a 'pager' object containing current_page,
    total_items, total_pages and items_per_page, which the standard Serializer omits.
  bundle: pager_serializer
  rubric_ref: rubric/pager_serializer_pager_serializer_what_fields@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: pager_serializer-how-to-enable
  input: How do I actually use pager_serializer on a Views REST export display so my API returns pagination
    data?
  criteria: On the View's REST export display, set the Format/style to 'Pager serializer' (the pager_serializer
    Views style) instead of the default Serializer, add a pager, and choose the accepted formats. Requires
    the core rest module.
  bundle: pager_serializer
  rubric_ref: rubric/pager_serializer_pager_serializer_how_to_enable@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: pager_serializer-row-hook
  input: Which hook does pager_serializer provide to add or change a field on each serialized row of a
    REST export?
  criteria: hook_pager_serializer_row_alter(&$row, \Drupal\views\ResultRow $result, \Drupal\views\ViewExecutable
    $view) — mutate $row (passed by reference), typically gated on $view->id().
  bundle: pager_serializer
  rubric_ref: rubric/pager_serializer_pager_serializer_row_hook@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: pager_serializer-current-labels
  input: 'On this Drupal site, inspect the pager_serializer configuration: what property name will the
    total number of items be returned under in the API output, and is the current-page field currently
    included?'
  criteria: total_items_label is 'count' (so totals appear under 'count'), and current_page_enabled is
    false so the current page field is not included.
  bundle: pager_serializer
  rubric_ref: rubric/pager_serializer_pager_serializer_current_labels@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/pager_serializer-labels-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/pager_serializer-labels-cleanup.sh
- id: pager_serializer-output-shape
  input: On this site, will pager_serializer nest the pagination fields inside their own object, or merge
    them onto the top-level response? Inspect the live configuration to answer.
  criteria: pager_object_enabled is false, so the pager fields are flattened onto the top-level response
    object rather than nested under a 'pager' key.
  bundle: pager_serializer
  rubric_ref: rubric/pager_serializer_pager_serializer_output_shape@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/pager_serializer-flatten-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/pager_serializer-flatten-cleanup.sh
- id: pager_serializer-rename-labels
  input: Configure pager_serializer on this site so the pagination object is returned under the property
    name 'meta' and the current page is returned under 'page'. Apply the change to the live site.
  criteria: 'Set pager_serializer.settings: pager_label=''meta'' and current_page_label=''page'' (e.g.
    drush cset pager_serializer.settings pager_label meta; drush cset pager_serializer.settings current_page_label
    page).'
  bundle: pager_serializer
  rubric_ref: rubric/pager_serializer_pager_serializer_rename_labels@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/pager_serializer-rename-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/pager_serializer-rename-reset.sh
    verify: agent-module-documentation/evaluation/verify/pager_serializer-rename-verify.sh
- id: pager_serializer-trim-pager
  input: Configure pager_serializer on this site so the REST export output no longer includes the total
    number of pages, and so the items-per-page value is returned under the property name 'per_page'. Apply
    the change to the live site.
  criteria: 'Set pager_serializer.settings: total_pages_enabled=false and items_per_page_label=''per_page''.'
  bundle: pager_serializer
  rubric_ref: rubric/pager_serializer_pager_serializer_trim_pager@1.0
