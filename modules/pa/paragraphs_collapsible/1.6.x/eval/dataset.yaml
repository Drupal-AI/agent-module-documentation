metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: paragraphs_collapsible
  version: 1.6.x
  note: 'Paragraphs Collapsible is a zero-config, front-end-only enhancement of the Paragraphs module.
    It has NO settings form, configure route, permissions, Drush, config, or plugins. Its one PHP hook
    (paragraphs_collapsible_library_info_alter) makes its asset library a dependency of Paragraphs'' drupal.paragraphs.admin
    library; its JS only enhances the CLASSIC paragraphs widget entity_reference_paragraphs (wrapper .field--widget-entity-reference-paragraphs),
    not the modern ''paragraphs'' widget. Because the module itself stores nothing, the medium/hard cases
    are grounded in the real config that decides whether the feature applies: the paragraphs reference
    field''s FORM WIDGET on entity_form_display. Medium cases read back which widget a seeded paragraphs
    field uses (and which of two fields the module will make collapsible); hard cases switch a paragraphs
    field''s form widget to the classic entity_reference_paragraphs widget and build a new paragraphs
    field using that widget, verified against the live node.article.default form display.'
questions:
- id: paragraphs_collapsible-enable
  input: How do I turn on the collapsible expand/collapse feature for the Paragraphs edit widget using
    the paragraphs_collapsible module? Is there a settings page to configure?
  criteria: There is no configuration and no settings page - just enable the paragraphs_collapsible module
    (e.g. drush en paragraphs_collapsible -y). On enable it attaches its JS/CSS to the Paragraphs admin
    widget automatically.
  bundle: paragraphs_collapsible
  rubric_ref: rubric/paragraphs_collapsible_paragraphs_collapsible_enable@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: paragraphs_collapsible-which-widget
  input: Which Paragraphs field widget does the paragraphs_collapsible module actually enhance with collapse/expand
    controls, and how does it attach its assets?
  criteria: It enhances the classic Paragraphs table widget (entity_reference_paragraphs, wrapper .field--widget-entity-reference-paragraphs),
    not the modern 'paragraphs' widget. It attaches by adding its library as a dependency of Paragraphs'
    drupal.paragraphs.admin library via hook_library_info_alter().
  bundle: paragraphs_collapsible
  rubric_ref: rubric/paragraphs_collapsible_paragraphs_collapsible_which_widget@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: paragraphs_collapsible-ui-controls
  input: What controls does the paragraphs_collapsible module add to the paragraphs editing widget, and
    which rows get them?
  criteria: It adds an overarching Expand all / Collapse all button on the field label and a per-row [+]/[-]
    toggle button (with aria-expanded/aria-label) on each paragraph row that has a title (.paragraph-type-title).
    Rows with errors or newly AJAX-added content start expanded.
  bundle: paragraphs_collapsible
  rubric_ref: rubric/paragraphs_collapsible_paragraphs_collapsible_ui_controls@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: paragraphs_collapsible-inspect-widget
  input: On this site, the Article content type has a Paragraphs reference field named field_pgc_body.
    paragraphs_collapsible only enhances one particular widget. Inspect the live default form display
    and tell me which form widget field_pgc_body uses.
  criteria: In core.entity_form_display.node.article.default the field_pgc_body component uses the classic
    'entity_reference_paragraphs' widget - which is exactly the widget paragraphs_collapsible enhances.
  bundle: paragraphs_collapsible
  rubric_ref: rubric/paragraphs_collapsible_paragraphs_collapsible_inspect_widget@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/paragraphs_collapsible-classic-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/paragraphs_collapsible-classic-cleanup.sh
- id: paragraphs_collapsible-which-field-enhanced
  input: This site's Article content type has two Paragraphs fields, field_pgc_classic and field_pgc_modern,
    using different form widgets. Inspect the live form display and tell me which of the two the paragraphs_collapsible
    module will make collapsible.
  criteria: field_pgc_classic - it uses the classic entity_reference_paragraphs widget which paragraphs_collapsible
    enhances, whereas field_pgc_modern uses the modern 'paragraphs' widget that the module does not touch.
  bundle: paragraphs_collapsible
  rubric_ref: rubric/paragraphs_collapsible_paragraphs_collapsible_which_field_enhanced@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/paragraphs_collapsible-which-widget-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/paragraphs_collapsible-which-widget-cleanup.sh
- id: paragraphs_collapsible-switch-to-classic
  input: On this Drupal site, the Article content type has a Paragraphs field field_pgc_task that currently
    uses the modern 'paragraphs' form widget, so the paragraphs_collapsible collapse controls do not appear.
    Reconfigure the field's default form widget so that paragraphs_collapsible will enhance it, and apply
    the change to the live site.
  criteria: Change the field_pgc_task component on core.entity_form_display.node.article.default to the
    classic 'entity_reference_paragraphs' widget (via Manage form display or setComponent()->save()),
    which is the widget paragraphs_collapsible enhances.
  bundle: paragraphs_collapsible
  rubric_ref: rubric/paragraphs_collapsible_paragraphs_collapsible_switch_to_classic@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/paragraphs_collapsible-enable-classic-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/paragraphs_collapsible-enable-classic-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/paragraphs_collapsible-enable-classic-verify.sh
- id: paragraphs_collapsible-build-classic-field
  input: On this Drupal site, add a new multi-value Paragraphs reference field named field_pgc_build to
    the Article content type, and configure its default form widget so the paragraphs_collapsible collapsible
    controls will apply to it. Apply everything to the live site.
  criteria: Create an entity_reference_revisions field field_pgc_build (target_type paragraph) on node.article
    and set its default form-display widget to the classic 'entity_reference_paragraphs' widget, so paragraphs_collapsible
    will enhance it.
  bundle: paragraphs_collapsible
  rubric_ref: rubric/paragraphs_collapsible_paragraphs_collapsible_build_classic_field@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/paragraphs_collapsible-build-field-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/paragraphs_collapsible-build-field-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/paragraphs_collapsible-build-field-verify.sh
