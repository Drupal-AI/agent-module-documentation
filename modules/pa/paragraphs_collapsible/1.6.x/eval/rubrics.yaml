rubrics:
- id: paragraphs_collapsible_paragraphs_collapsible_enable
  version: '1.0'
  applicable_bundles:
  - paragraphs_collapsible
  checks:
  - kind: must_contain_any
    values:
    - no config
    - no configuration
    - just enable
    - enabling
    - drush en
  scoring:
    combine: all_pass
- id: paragraphs_collapsible_paragraphs_collapsible_which_widget
  version: '1.0'
  applicable_bundles:
  - paragraphs_collapsible
  checks:
  - kind: must_contain_any
    values:
    - entity_reference_paragraphs
    - field--widget-entity-reference-paragraphs
    - drupal.paragraphs.admin
    - library_info_alter
    - classic
  scoring:
    combine: all_pass
- id: paragraphs_collapsible_paragraphs_collapsible_ui_controls
  version: '1.0'
  applicable_bundles:
  - paragraphs_collapsible
  checks:
  - kind: must_contain_any
    values:
    - Collapse all
    - Expand all
    - toggle
    - '[+]'
    - '[-]'
    - collapse
  scoring:
    combine: all_pass
- id: paragraphs_collapsible_paragraphs_collapsible_inspect_widget
  version: '1.0'
  applicable_bundles:
  - paragraphs_collapsible
  checks:
  - kind: must_contain_any
    values:
    - entity_reference_paragraphs
  scoring:
    combine: all_pass
- id: paragraphs_collapsible_paragraphs_collapsible_which_field_enhanced
  version: '1.0'
  applicable_bundles:
  - paragraphs_collapsible
  checks:
  - kind: must_contain_any
    values:
    - field_pgc_classic
  scoring:
    combine: all_pass
- id: paragraphs_collapsible_paragraphs_collapsible_switch_to_classic
  version: '1.0'
  applicable_bundles:
  - paragraphs_collapsible
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
- id: paragraphs_collapsible_paragraphs_collapsible_build_classic_field
  version: '1.0'
  applicable_bundles:
  - paragraphs_collapsible
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
