rubrics:
- id: paragraph_blocks_pb_block_plugin
  version: '1.0'
  applicable_bundles:
  - paragraph_blocks
  checks:
  - kind: must_contain_any
    values:
    - paragraph_field
    - Paragraphs
  scoring:
    combine: all_pass
- id: paragraph_blocks_pb_admin_title
  version: '1.0'
  applicable_bundles:
  - paragraph_blocks
  checks:
  - kind: must_contain_any
    values:
    - admin_title
    - admin title
  scoring:
    combine: all_pass
- id: paragraph_blocks_pb_settings_keys
  version: '1.0'
  applicable_bundles:
  - paragraph_blocks
  checks:
  - kind: must_contain_any
    values:
    - paragraph_blocks.settings
    - max_cardinality
    - /admin/config/content/paragraph_blocks
  scoring:
    combine: all_pass
- id: paragraph_blocks_pb_known_cardinality
  version: '1.0'
  applicable_bundles:
  - paragraph_blocks
  checks:
  - kind: must_contain_any
    values:
    - '7'
  scoring:
    combine: all_pass
- id: paragraph_blocks_pb_suppress_label
  version: '1.0'
  applicable_bundles:
  - paragraph_blocks
  checks:
  - kind: must_contain_any
    values:
    - 'true'
    - 'on'
    - enabled
    - suppress
  scoring:
    combine: all_pass
- id: paragraph_blocks_pb_set_cardinality
  version: '1.0'
  applicable_bundles:
  - paragraph_blocks
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
- id: paragraph_blocks_pb_enable_suppress_label
  version: '1.0'
  applicable_bundles:
  - paragraph_blocks
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
