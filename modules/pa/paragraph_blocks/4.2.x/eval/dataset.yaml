metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: paragraph_blocks
  version: 4.2.x
  note: 'Easy cases cover the derived block plugin (paragraph_field), the admin_title field, and the module
    settings. Medium/hard cases are grounded in the paragraph_blocks.settings config object (schema: paragraph_blocks.schema.yml;
    install defaults max_cardinality=10, individual_block_ui=false, suppress_label=false, library_items_only=false)
    — only local config is read/written, and reset/cleanup restore those shipped defaults explicitly.'
questions:
- id: pb-block-plugin
  input: With the paragraph_blocks module enabled, what Layout Builder block does it give me for placing
    an individual paragraph value, and under which block category do those blocks appear?
  criteria: It derives a block plugin with base id 'paragraph_field' (derivative ids like paragraph_field:node:field_paragraphs:0:page)
    shown under the 'Paragraphs' block category. Each derivative renders one delta of a paragraph reference
    field.
  bundle: paragraph_blocks
  rubric_ref: rubric/paragraph_blocks_pb_block_plugin@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: pb-admin-title
  input: How does paragraph_blocks let editors tell apart the different paragraph blocks when placing
    them in Layout Builder? What field does it add to paragraphs?
  criteria: It adds an 'admin_title' base field to paragraph entities; that admin title identifies each
    paragraph in the placement UI and becomes the block label. A paragraph type can define a default_admin_title
    (token-aware).
  bundle: paragraph_blocks
  rubric_ref: rubric/paragraph_blocks_pb_admin_title@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: pb-settings-keys
  input: Where do you configure paragraph_blocks globally, and what does the 'max_cardinality' setting
    control for unlimited paragraph fields?
  criteria: At /admin/config/content/paragraph_blocks (config object paragraph_blocks.settings). max_cardinality
    limits how many delta blocks are offered for placement for unlimited-cardinality paragraph fields
    (default 10).
  bundle: paragraph_blocks
  rubric_ref: rubric/paragraph_blocks_pb_settings_keys@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: pb-known-cardinality
  input: On this Drupal site, inspect the paragraph_blocks configuration and tell me the current max_cardinality
    value (the cap on how many paragraph delta blocks unlimited fields offer).
  criteria: '7: paragraph_blocks.settings:max_cardinality is 7.'
  bundle: paragraph_blocks
  rubric_ref: rubric/paragraph_blocks_pb_known_cardinality@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/pb-known-cardinality-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/pb-known-cardinality-cleanup.sh
- id: pb-suppress-label
  input: On this Drupal site, inspect the paragraph_blocks configuration and tell me whether the block
    label field is suppressed on paragraph block placement (the suppress_label setting) — is it on or
    off?
  criteria: 'It is on: paragraph_blocks.settings:suppress_label is true.'
  bundle: paragraph_blocks
  rubric_ref: rubric/paragraph_blocks_pb_suppress_label@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/pb-suppress-label-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/pb-suppress-label-cleanup.sh
- id: pb-set-cardinality
  input: On this Drupal site, configure paragraph_blocks so that unlimited paragraph fields offer up to
    20 paragraph delta blocks for placement (max_cardinality = 20). Apply the change to the live configuration.
  criteria: paragraph_blocks.settings:max_cardinality is set to 20.
  bundle: paragraph_blocks
  rubric_ref: rubric/paragraph_blocks_pb_set_cardinality@1.0
  tags:
  - mode:execution
