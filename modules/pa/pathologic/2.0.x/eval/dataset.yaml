metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: pathologic
  version: 2.0.x
  note: Pathologic is a single text-format filter plugin (filter_pathologic) with a global config object
    and per-format overrides. Cases are `recipe` (response-graded) probing documented facts an agent would
    otherwise read source to answer; no site mutation.
questions:
- id: pathologic-enable-filter
  input: On a Drupal 11 site I want Pathologic to correct URLs in content of a text format. Which filter
    do I enable, and where in the filter processing order should it go?
  criteria: Enable the 'Correct URLs with Pathologic' filter (plugin id filter_pathologic) on the text
    format and place it last in the filter processing order.
  bundle: pathologic
  rubric_ref: rubric/pathologic_pathologic_enable_filter@1.0
  tags:
  - mode:recipe
- id: pathologic-protocol-style
  input: Which Pathologic setting chooses between full absolute URLs, protocol-relative URLs, and root-relative
    paths, and what are its three values?
  criteria: 'The protocol_style setting: ''full'' (http://example.com/foo/bar), ''proto-rel'' (//example.com/foo/bar),
    and ''path'' (/foo/bar relative to server root). Default is full.'
  bundle: pathologic
  rubric_ref: rubric/pathologic_pathologic_protocol_style@1.0
  tags:
  - mode:recipe
- id: pathologic-proto-rel-vs-full
  input: My Drupal site is served over both HTTP and HTTPS and Pathologic's full absolute URLs cause mixed-protocol
    problems. Which protocol_style value avoids that while still producing host-qualified URLs?
  criteria: Set protocol_style to 'proto-rel' to emit protocol-relative URLs like //example.com/foo/bar,
    avoiding HTTP/HTTPS mixing.
  bundle: pathologic
  rubric_ref: rubric/pathologic_pathologic_proto_rel_vs_full@1.0
  tags:
  - mode:recipe
- id: pathologic-local-paths
  input: Content on my Drupal site was authored on a staging server at http://dev.example.org/staging/
    and now has links written against that base. Which Pathologic setting do I use so those links get
    corrected, and how do I fill it in?
  criteria: 'Use the local_paths setting (''All base paths for this site''): list every base path/URL
    the site has lived at, one per line (e.g. http://dev.example.org/staging/), so Pathologic recognizes
    and corrects those links.'
  bundle: pathologic
  rubric_ref: rubric/pathologic_pathologic_local_paths@1.0
  tags:
  - mode:recipe
- id: pathologic-config-object
  input: What is the config object and admin route for Pathologic's global settings on Drupal, and which
    permission gates the form?
  criteria: Global settings live in the pathologic.settings config object, edited at /admin/config/content/pathologic
    (route pathologic.config_form), gated by the 'administer filters' permission.
  bundle: pathologic
  rubric_ref: rubric/pathologic_pathologic_config_object@1.0
  tags:
  - mode:recipe
- id: pathologic-per-format-settings
  input: I want one text format to use different Pathologic settings than the site-wide ones. Which per-filter
    setting controls whether global or local settings apply?
  criteria: 'The filter''s settings_source setting: ''global'' uses the site-wide pathologic.settings;
    ''local'' uses custom per-format settings stored under local_settings.'
  bundle: pathologic
  rubric_ref: rubric/pathologic_pathologic_per_format_settings@1.0
  tags:
  - mode:recipe
- id: pathologic-alter-hook
  input: In a custom Drupal module I want to stop Pathologic from rewriting certain URLs (pass them through
    unchanged). Which hook do I implement and what do I set?
  criteria: Implement hook_pathologic_alter(&$url_params, $parts, $settings) and set $url_params['options']['use_original']
    = TRUE to return the original unaltered URL.
  bundle: pathologic
  rubric_ref: rubric/pathologic_pathologic_alter_hook@1.0
  tags:
  - mode:recipe
- id: pathologic-filter-order
  input: Why does Pathologic recommend being the last filter in a text format's processing order, and
    what plugin weight does it ship with?
  criteria: Pathologic rewrites finished markup (href/src/etc.), so it should run last after other filters;
    it ships with plugin weight 50 to encourage this.
  bundle: pathologic
  rubric_ref: rubric/pathologic_pathologic_filter_order@1.0
  tags:
  - mode:recipe
