metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: page_specific_class
  version: 2.0.x
  note: 'Page Specific Class adds CSS classes to the <body> tag per page via a single hook_preprocess_html().
    Its entire state is one config value: page_specific_class.settings.url_with_class, a multi-line string
    of ''/<path>|<class(es)>'' rules (supports /<front>, /*, and ''/prefix*'' wildcards). Config UI at
    route page_specific_class.settings (/admin/config/page-class/settings, permission ''administer site
    configuration''). No plugins/permissions-of-its-own/Drush. All medium/hard cases are grounded in that
    real config value: introspection reads a known url_with_class mapping; execution writes a mapping
    and a verify parses url_with_class from live config. Baseline: url_with_class empty.'
questions:
- id: psc-how-to-add
  input: Using the Drupal page_specific_class module, how do I add the CSS class 'special' to the body
    tag on the page /node/1? What config value and format does it use?
  criteria: Add a line '/node/1|special' to page_specific_class.settings.url_with_class (via the settings
    form at /admin/config/page-class/settings, or drush cset). Each line is '/<path>|<class(es)>'; the
    path must start with '/' and path/class are separated by '|'.
  bundle: page_specific_class
  rubric_ref: rubric/page_specific_class_psc_how_to_add@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: psc-special-targets
  input: In page_specific_class, how do I add a body class to the front page only, to every page, and
    to all pages under a path prefix like /products?
  criteria: 'Front page: ''/<front>|home-class''. Every page: ''/*|all-class''. Wildcard prefix: ''/products*|products-class''
    (matches any path starting with /products). One rule per line.'
  bundle: page_specific_class
  rubric_ref: rubric/page_specific_class_psc_special_targets@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: psc-where-stored
  input: Which config object and key does page_specific_class store its path-to-class mappings in, and
    by what mechanism does it actually add the class to the page?
  criteria: It stores mappings in page_specific_class.settings under the key url_with_class (a multi-line
    string). hook_preprocess_html() reads it and appends matching class(es) to the body via $variables['attributes']['class'].
  bundle: page_specific_class
  rubric_ref: rubric/page_specific_class_psc_where_stored@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: psc-known-mapping
  input: On this Drupal site, page_specific_class is configured so that a particular page gets a body
    class. Inspect the live configuration and report which CSS class is added to the body on the page
    /node/1.
  criteria: page_specific_class.settings.url_with_class contains the line '/node/1|psc-known-class', so
    the body class added on /node/1 is psc-known-class.
  bundle: page_specific_class
  rubric_ref: rubric/page_specific_class_psc_known_mapping@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/page_specific_class-known-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/page_specific_class-known-cleanup.sh
- id: psc-wildcard-mapping
  input: On this Drupal site, page_specific_class has a wildcard rule configured. Inspect the live configuration
    and report which body class is applied to pages under /pscarticles.
  criteria: page_specific_class.settings.url_with_class contains '/pscarticles*|psc-wild', so any path
    starting with /pscarticles gets the body class psc-wild.
  bundle: page_specific_class
  rubric_ref: rubric/page_specific_class_psc_wildcard_mapping@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/page_specific_class-wildcard-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/page_specific_class-wildcard-cleanup.sh
- id: psc-add-page-class
  input: On this Drupal site, use the page_specific_class module to add the CSS class 'psc-eval-class'
    to the body tag on the page at path /psc-eval-page. Apply the change to the live site configuration.
  criteria: page_specific_class.settings.url_with_class contains a line '/psc-eval-page|psc-eval-class'
    (added via the settings form or drush cset).
  bundle: page_specific_class
  rubric_ref: rubric/page_specific_class_psc_add_page_class@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/page_specific_class-page-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/page_specific_class-page-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/page_specific_class-page-verify.sh
- id: psc-add-front-class
  input: On my Drupal site I want the home page's <body> tag to have the class 'psc-home' so I can style
    the front page differently. Set this up on the live site using the page classes tool.
  criteria: page_specific_class.settings.url_with_class contains a line '/<front>|psc-home' (the /<front>
    token targets the front page).
  bundle: page_specific_class
  rubric_ref: rubric/page_specific_class_psc_add_front_class@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: layman
    reset: agent-module-documentation/evaluation/verify/page_specific_class-front-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/page_specific_class-front-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/page_specific_class-front-verify.sh
