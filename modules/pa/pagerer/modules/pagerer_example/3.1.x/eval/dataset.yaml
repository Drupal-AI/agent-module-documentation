metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: pagerer_example
  version: 3.1.x
  note: 'pagerer_example is a trivial demo submodule of Pagerer: one publicly accessible route pagerer_example.page
    at /pagerer/example (controller PagererExampleController::examplePage) that renders two sample Pagerer-styled
    pagers over the watchdog and key_value tables. No config, permissions, services or plugins. Because
    there is nothing to build or configure, the tiers are 3 easy + 1 medium (introspect the live route)
    + 1 hard (uninstall then re-enable the module, verified against live module state and route registration).
    Fixtures: none created; the hard case only toggles the module (directory left intact, so no orphaned
    module).'
questions:
- id: pagerer_example-path
  input: After enabling the pagerer_example submodule, at what URL is its demo page, and does a visitor
    need any special permission to view it?
  criteria: 'The demo page is at /pagerer/example (route pagerer_example.page). Its access requirement
    is _access: ''TRUE'', so it is publicly accessible - no special permission needed.'
  bundle: pagerer_example
  rubric_ref: rubric/pagerer_example_pagerer_example_path@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: pagerer_example-what
  input: What does the pagerer_example module's page actually demonstrate about Pagerer?
  criteria: It renders two independent Pagerer-styled pagers (pager elements 0 and 1) over paged queries
    of the core watchdog and key_value tables, showing multiple pagers working on one page; the page title
    also displays the running Pagerer version.
  bundle: pagerer_example
  rubric_ref: rubric/pagerer_example_pagerer_example_what@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: pagerer_example-controller
  input: In the pagerer_example submodule, which controller and route serve the demo page, and which Pagerer
    service does the controller depend on?
  criteria: Route pagerer_example.page maps to Drupal\pagerer_example\Controller\PagererExampleController::examplePage;
    the controller injects the pagerer.style.manager plugin manager (plus database and extension.list.module).
  bundle: pagerer_example
  rubric_ref: rubric/pagerer_example_pagerer_example_controller@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: pagerer_example-route-live
  input: Inspect the running Drupal site and report the path of the route named pagerer_example.page (the
    Pagerer example page).
  criteria: The route pagerer_example.page has path /pagerer/example (discoverable via the route provider,
    e.g. \Drupal::service('router.route_provider')->getRouteByName('pagerer_example.page')->getPath()).
  bundle: pagerer_example
  rubric_ref: rubric/pagerer_example_pagerer_example_route_live@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/pagerer_example-route-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/pagerer_example-route-cleanup.sh
- id: pagerer_example-enable
  input: On this Drupal site the Pagerer example submodule (pagerer_example) is currently not installed.
    Install/enable it so its demo page at /pagerer/example becomes available. Apply the change to the
    live site.
  criteria: The pagerer_example module is enabled (e.g. drush en pagerer_example -y) and its route pagerer_example.page
    (/pagerer/example) is registered.
  bundle: pagerer_example
  rubric_ref: rubric/pagerer_example_pagerer_example_enable@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/pagerer_example-enable-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/pagerer_example-enable-cleanup.sh
