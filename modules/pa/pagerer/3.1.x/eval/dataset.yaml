# Generated from evals.json by evaluation/to_commons.py.
# Edit evals.json and rerun the script; do not edit this file.
metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: pagerer
  version: 3.1.x
  note: 'Pagerer provides configurable pager styles. State is all config: pagerer_preset config entities
    (pagerer.preset.<id>, key ''panes'' = {left,center,right} each {style,config}), the pagerer.settings
    config object (core_override_preset default ''core''; url_querystring with core_override/querystring_key
    ''pg''/index_base 0/encode_method), and style plugins (standard, basic, progressive, adaptive base
    + multipane composite) discovered by pagerer.style.manager. Evals are grounded in that: recipe covers
    styles/override/URL; introspection reads back a known preset and a known url_querystring setting;
    execution builds a preset with a progressive center pane and configures one-based URL paging, both
    verified against live config. Fixtures use namespaced pagerer_preset ids pgr_* and the pagerer.settings
    url_querystring block is restored to shipped defaults on cleanup/reset.'
questions:
- id: pagerer-builtin-styles
  input: What pager styles does the Pagerer module ship out of the box, and what plugin type are they?
    Which one is a composite that combines the others?
  criteria: 'Built-in @PagererStyle plugins (pagerer.style.manager): standard, basic, progressive, adaptive
    (style_type base) and multipane (style_type composite), which combines base styles across left/center/right
    panes.'
  bundle: pagerer
  rubric_ref: rubric/pagerer_pagerer_builtin_styles@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: pagerer-core-override
  input: With Pagerer installed, how do I make one of my Pagerer presets replace Drupal's default core
    pager everywhere on the site? Which config setting controls that and what is its default?
  criteria: Set pagerer.settings:core_override_preset to the preset id (e.g. drush cset pagerer.settings
    core_override_preset my_pager). Its default is 'core', which means no override (the standard core
    pager). Set it back to 'core' to restore the default.
  bundle: pagerer
  rubric_ref: rubric/pagerer_pagerer_core_override@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: pagerer-one-based-url-recipe
  input: Historically Drupal pager URLs use ?page=0 (zero-based). With Pagerer, how can I make paginated
    URLs start at page 1 and use a custom query key like 'pg' instead of 'page'?
  criteria: 'Use the URL settings (route pagerer.url_settings) / pagerer.settings:url_querystring: enable
    core_override, set querystring_key to ''pg'' and index_base to 1 (one-based). That turns ?page=0 into
    ?pg=1.'
  bundle: pagerer
  rubric_ref: rubric/pagerer_pagerer_one_based_url_recipe@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: pagerer-known-preset
  input: This Drupal site has a Pagerer preset configured. Inspect the live pagerer_preset config entities
    and give the machine id of the preset whose CENTER pane uses the 'adaptive' pager style.
  criteria: 'The preset is pgr_known: pagerer.preset.pgr_known has panes.center.style = ''adaptive'' (left
    and right are ''none'').'
  bundle: pagerer
  rubric_ref: rubric/pagerer_pagerer_known_preset@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/pagerer-known-preset-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/pagerer-known-preset-cleanup.sh
- id: pagerer-known-url-setting
  input: On this site Pagerer's URL querystring override has been configured. Inspect pagerer.settings
    on the running site and report the custom query key it uses and whether page numbering is zero-based
    or one-based.
  criteria: pagerer.settings:url_querystring has core_override = TRUE, querystring_key = 'pgr_q' and index_base
    = 1 (one-based paging), so pager URLs read like ?pgr_q=1.
  bundle: pagerer
  rubric_ref: rubric/pagerer_pagerer_known_url_setting@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/pagerer-url-querystring-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/pagerer-url-querystring-cleanup.sh
- id: pagerer-build-preset
  input: On this Drupal site, create a Pagerer preset with machine id 'pgr_task' whose CENTER pane uses
    the 'progressive' pager style (left and right panes can be empty). Apply the change to the live site.
  criteria: A pagerer_preset config entity 'pgr_task' exists (pagerer.preset.pgr_task) with panes.center.style
    = 'progressive' (e.g. create the entity and set panes, or add it via /admin/config/user-interface/pagerer).
  bundle: pagerer
  rubric_ref: rubric/pagerer_pagerer_build_preset@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/pagerer-build-preset-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/pagerer-build-preset-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/pagerer-build-preset-verify.sh
- id: pagerer-one-based-url
  input: On my site I want the page numbers in paginated URLs to start at 1 instead of 0. Using Pagerer,
    turn on its URL querystring override and make paging one-based. Apply the change to the live site.
  criteria: pagerer.settings:url_querystring has core_override = TRUE and index_base = 1 (one-based),
    e.g. drush cset pagerer.settings url_querystring.core_override 1 and url_querystring.index_base 1,
    or via the URL settings tab.
  bundle: pagerer
  rubric_ref: rubric/pagerer_pagerer_one_based_url@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: site-owner
    reset: agent-module-documentation/evaluation/verify/pagerer-one-based-url-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/pagerer-one-based-url-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/pagerer-one-based-url-verify.sh
