rubrics:
- id: paragraph_view_mode_paragraph_view_mode_where_enabled
  version: '1.0'
  applicable_bundles:
  - paragraph_view_mode
  checks:
  - kind: must_contain_any
    values:
    - paragraphs_type
    - paragraph type
    - Manage form display
    - form display
    - paragraph_view_mode field
    - storage_manager
  scoring:
    combine: all_pass
