metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: spamaway
  version: 2.0.x
  note: SpamAway ships one Webform handler plugin (spamaway_anti_spam_forms) that rejects submissions
    failing an IP-frequency check and/or a similarity check. It has no global settings page (configure=null);
    all tuning is per-webform handler settings stored in the webform config entity at webform.webform.<id>
    -> handlers.<handler_id>.settings. Bypass via permission 'spamaway bypass spam detection' or $settings['spamaway_bypass_anti_spam']=TRUE.
    Medium cases create a webform with the handler configured to known values and the agent reads them
    back from the webform config; hard cases have the agent attach the handler to a webform, or change
    handler settings, verified against the live webform config entity. All test webforms are namespaced
    spamaway_eval_*.
questions:
- id: spamaway-add-to-webform
  input: How do I add SpamAway spam protection to a single Drupal webform, and what is the machine name
    of the plugin it provides?
  criteria: Open the webform's Settings -> Emails / Handlers, Add handler, choose 'SpamAway - Anti spam
    handler' (plugin id spamaway_anti_spam_forms), configure and save. There is no global settings page.
  bundle: spamaway
  rubric_ref: rubric/spamaway_spamaway_add_to_webform@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: spamaway-bypass
  input: In the SpamAway module for Drupal, how can trusted users or a whole environment skip the spam
    checks?
  criteria: Grant the 'spamaway bypass spam detection' permission to trusted roles, or set $settings['spamaway_bypass_anti_spam']
    = TRUE; in settings.php to disable checking globally.
  bundle: spamaway
  rubric_ref: rubric/spamaway_spamaway_bypass@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: spamaway-detection-signals
  input: What signals does the SpamAway webform handler use to decide a submission is spam, and name a
    couple of the settings that tune them?
  criteria: 'Two checks: an IP-frequency check (spamaway_ip_check_enabled, spamaway_anti_spam_ip_period,
    spamaway_anti_spam_allowed_ip_count) and a similarity check on named fields (spamaway_anti_spam_field_names,
    spamaway_anti_spam_threshold_percentage, spamaway_anti_spam_allowed_count).'
  bundle: spamaway
  rubric_ref: rubric/spamaway_spamaway_detection_signals@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: spamaway-known-ip-count
  input: On this site a webform named 'spamaway_eval_m1' has the SpamAway handler attached. Inspect its
    live configuration and report the value configured for the allowed IP count (spamaway_anti_spam_allowed_ip_count).
  criteria: spamaway_anti_spam_allowed_ip_count is 9 in webform.webform.spamaway_eval_m1 -> handlers.<id>.settings.
  bundle: spamaway
  rubric_ref: rubric/spamaway_spamaway_known_ip_count@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/spamaway-known-ip-count-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/spamaway-known-ip-count-cleanup.sh
- id: spamaway-known-fields
  input: The webform 'spamaway_eval_m2' on this site uses the SpamAway handler. Inspect its live configuration
    and report which field name(s) SpamAway compares for similarity (spamaway_anti_spam_field_names).
  criteria: spamaway_anti_spam_field_names is 'email' in the handler settings on webform spamaway_eval_m2.
  bundle: spamaway
  rubric_ref: rubric/spamaway_spamaway_known_fields@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/spamaway-known-fields-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/spamaway-known-fields-cleanup.sh
- id: spamaway-attach-handler
  input: The webform 'spamaway_eval_h1' on this site has no spam protection. Attach the SpamAway anti-spam
    handler to it and apply the change to the live site.
  criteria: Add a handler of plugin id spamaway_anti_spam_forms to webform.webform.spamaway_eval_h1 (via
    Emails/Handlers UI or $webform->addWebformHandler(...)).
  bundle: spamaway
  rubric_ref: rubric/spamaway_spamaway_attach_handler@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/spamaway-attach-handler-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/spamaway-attach-handler-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/spamaway-attach-handler-verify.sh
- id: spamaway-tune-handler
  input: On webform 'spamaway_eval_h2', the SpamAway handler is already attached. Reconfigure it so the
    IP check is DISABLED and the allowed count of similar submissions (spamaway_anti_spam_allowed_count)
    is 3. Apply the change to the live site.
  criteria: In the handler settings on webform spamaway_eval_h2, set spamaway_ip_check_enabled to false
    and spamaway_anti_spam_allowed_count to 3.
  bundle: spamaway
  rubric_ref: rubric/spamaway_spamaway_tune_handler@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/spamaway-tune-handler-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/spamaway-tune-handler-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/spamaway-tune-handler-verify.sh
