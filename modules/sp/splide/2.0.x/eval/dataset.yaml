metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: splide
  version: 2.0.x
  note: 'Splide is a Blazy-based vanilla-JS slider. Sliders are ''splide'' optionset config entities (splide.optionset.<id>)
    holding options.settings (type, perPage, autoplay, skin, group, breakpoints). Field formatters (splide_image,
    splide_media, splide_paragraphs_*, ...), a Views style (splide), and a filter (splide_filter) render
    content through an optionset. Skins are @SplideSkin plugins (manager splide.skin_manager). Module
    settings: splide.settings (module_css, splide_css, sitewide). The optionset admin UI lives in the
    splide_ui submodule. Medium/hard cases are grounded in real splide optionset config entities.'
questions:
- id: splide-what-is-optionset
  input: In the Splide module, what is a 'optionset' and what config entity/prefix stores it? Name a couple
    of the Splide.js options it holds.
  criteria: An optionset is a reusable slider preset stored as a 'splide' config entity (splide.optionset.<id>).
    It holds Splide.js options under options.settings (e.g. type slide/loop/fade, perPage, perMove, gap,
    autoplay, arrows, pagination) plus a skin, group, and responsive breakpoints.
  bundle: splide
  rubric_ref: rubric/splide_splide_what_is_optionset@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: splide-render-a-slider
  input: What are the ways to render content as a Splide slider (name the field formatters, the Views
    style, and the text filter)? What module is required?
  criteria: Field formatters (splide_image, splide_media, splide_file, splide_text, splide_entityreference,
    splide_paragraphs_media, splide_paragraphs_vanilla), the 'splide' Views style, or the splide_filter
    text-format shortcode. Each selects an optionset. Splide requires the Blazy module and the Splide
    JS library in /libraries.
  bundle: splide
  rubric_ref: rubric/splide_splide_render_a_slider@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: splide-skins
  input: How are Splide 'skins' provided, and how would a developer add a custom one?
  criteria: Skins are @SplideSkin plugins (in src/Plugin/splide, managed by splide.skin_manager, base
    SplideSkinPluginBase). Add a plugin class with the @SplideSkin annotation implementing setSkins()
    that returns skin definitions (name + CSS). Each skin becomes selectable in an optionset's Skin dropdown.
  bundle: splide
  rubric_ref: rubric/splide_splide_skins@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: splide-known-perpage
  input: On this Drupal site there is a Splide optionset named spl_known. Inspect the live configuration
    and state how many slides per page (perPage) it shows.
  criteria: 'spl_known shows 4 slides per page: splide.optionset.spl_known options.settings.perPage is
    4 (its type is loop).'
  bundle: splide
  rubric_ref: rubric/splide_splide_known_perpage@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/splide-known-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/splide-known-cleanup.sh
- id: splide-known-skin
  input: On this Drupal site, which skin is the Splide optionset spl_known configured to use? Inspect
    the live configuration to answer.
  criteria: 'It uses the ''seagreen'' skin: splide.optionset.spl_known skin = seagreen.'
  bundle: splide
  rubric_ref: rubric/splide_splide_known_skin@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/splide-skin-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/splide-skin-cleanup.sh
- id: splide-create-optionset
  input: 'On this Drupal site, create a Splide optionset with machine id spl_task configured as an infinite
    loop (type: loop) that shows 3 slides per page. Apply the change to the live site.'
  criteria: A splide config entity splide.optionset.spl_task exists with options.settings.type = 'loop'
    and options.settings.perPage = 3.
  bundle: splide
  rubric_ref: rubric/splide_splide_create_optionset@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/splide-create-optionset-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/splide-create-optionset-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/splide-create-optionset-verify.sh
- id: splide-enable-autoplay
  input: On this Drupal site there is a Splide optionset spl_edit with autoplay turned off. Turn on autoplay
    for that slider optionset. Apply the change to the live site.
  criteria: splide.optionset.spl_edit options.settings.autoplay is truthy (autoplay enabled).
  bundle: splide
  rubric_ref: rubric/splide_splide_enable_autoplay@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: site-owner
    reset: agent-module-documentation/evaluation/verify/splide-autoplay-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/splide-autoplay-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/splide-autoplay-verify.sh
