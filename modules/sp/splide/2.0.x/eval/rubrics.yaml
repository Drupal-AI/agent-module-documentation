rubrics:
- id: splide_splide_what_is_optionset
  version: '1.0'
  applicable_bundles:
  - splide
  checks:
  - kind: must_contain_any
    values:
    - optionset
    - splide.optionset
    - perPage
    - config entity
  scoring:
    combine: all_pass
- id: splide_splide_render_a_slider
  version: '1.0'
  applicable_bundles:
  - splide
  checks:
  - kind: must_contain_any
    values:
    - splide_image
    - formatter
    - Views
    - splide_filter
  scoring:
    combine: all_pass
- id: splide_splide_skins
  version: '1.0'
  applicable_bundles:
  - splide
  checks:
  - kind: must_contain_any
    values:
    - SplideSkin
    - skin
    - Plugin/splide
  scoring:
    combine: all_pass
- id: splide_splide_known_perpage
  version: '1.0'
  applicable_bundles:
  - splide
  checks:
  - kind: must_contain_any
    values:
    - '4'
  scoring:
    combine: all_pass
- id: splide_splide_known_skin
  version: '1.0'
  applicable_bundles:
  - splide
  checks:
  - kind: must_contain_any
    values:
    - seagreen
  scoring:
    combine: all_pass
- id: splide_splide_create_optionset
  version: '1.0'
  applicable_bundles:
  - splide
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
- id: splide_splide_enable_autoplay
  version: '1.0'
  applicable_bundles:
  - splide
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
