  criteria: 'Yes: splide.settings sitewide is 1 (Splide assets loaded site-wide).'
  bundle: splide_ui
  rubric_ref: rubric/splide_ui_splide_ui_sitewide_setting@1.0
  tags:
  - mode:introspection
  - difficulty:medium
