metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: splide_ui
  version: 2.0.x
  note: 'Splide UI is the admin interface for the parent Splide module''s optionsets. configure route
    entity.splide.collection at /admin/config/media/splide (list/add/edit/duplicate/delete), plus the
    splide.settings form at /admin/config/media/splide/ui. It declares the ''administer splide'' permission
    (restrict access: true) that gates all its routes. No config schema or plugins of its own. Medium/hard
    cases are grounded in the ''administer splide'' permission and the splide.settings config (sitewide).'
questions:
- id: splide_ui-permission
  input: What permission does Splide UI add, and what does it control? Where is the Splide optionset management
    screen?
  criteria: 'Splide UI declares the ''administer splide'' permission, which gates all its routes: the
    optionset collection at /admin/config/media/splide (add/edit/duplicate/delete) and the Splide UI settings
    form at /admin/config/media/splide/ui.'
  bundle: splide_ui
  rubric_ref: rubric/splide_ui_splide_ui_permission@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: splide_ui-what-it-adds
  input: The core Splide module defines the optionset config entity but ships no UI. What does the Splide
    UI submodule provide, and what is its configure route?
  criteria: Splide UI provides the forms to create/edit/duplicate/delete optionsets (collection route
    entity.splide.collection at /admin/config/media/splide) plus the Splide settings form (route splide.settings
    at /admin/config/media/splide/ui).
  bundle: splide_ui
  rubric_ref: rubric/splide_ui_splide_ui_what_it_adds@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: splide_ui-settings-object
  input: Which config object does the Splide UI settings form write, and what does it control?
  criteria: 'It writes the splide.settings config object: module_css (load the module''s CSS), splide_css
    (load the Splide library''s CSS), and sitewide (load Splide assets site-wide).'
  bundle: splide_ui
  rubric_ref: rubric/splide_ui_splide_ui_settings_object@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: splide_ui-which-role
  input: On this Drupal site, which role has been granted the permission to administer Splide (manage
    its optionsets)? Inspect the live configuration to answer.
  criteria: The role spl_ui_role has the 'administer splide' permission (user.role.spl_ui_role).
  bundle: splide_ui
  rubric_ref: rubric/splide_ui_splide_ui_which_role@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/splide_ui-perm-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/splide_ui-perm-cleanup.sh
- id: splide_ui-sitewide-setting
  input: On this Drupal site, is Splide currently configured to load its assets site-wide? Inspect the
