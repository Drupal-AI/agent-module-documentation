rubrics:
- id: spamspan_spamspan_how_to_enable
  version: '1.0'
  applicable_bundles:
  - spamspan
  checks:
  - kind: must_contain_any
    values:
    - text format
    - Text formats
    - filter
    - /admin/config/content/formats
    - filter.admin_overview
  scoring:
    combine: all_pass
- id: spamspan_spamspan_filter_plugin_id
  version: '1.0'
  applicable_bundles:
  - spamspan
  checks:
  - kind: must_contain_any
    values:
    - filter_spamspan
    - TYPE_TRANSFORM_IRREVERSIBLE
    - irreversible
  scoring:
    combine: all_pass
- id: spamspan_spamspan_nojs_fallback
  version: '1.0'
  applicable_bundles:
  - spamspan
  checks:
  - kind: must_contain_any
    values:
    - '[at]'
    - spamspan_at
    - at replacement
    - mailto
  scoring:
    combine: all_pass
- id: spamspan_spamspan_contact_form_mode
  version: '1.0'
  applicable_bundles:
  - spamspan
  checks:
  - kind: must_contain_any
    values:
    - spamspan_use_form
    - use a form
    - '[url|'
    - '[mycontactform'
    - spamspan_form_default_url
  scoring:
    combine: all_pass
- id: spamspan_spamspan_email_field_formatter
  version: '1.0'
  applicable_bundles:
  - spamspan
  checks:
  - kind: must_contain_any
    values:
    - email_spamspan
    - Email SpamSpan
  scoring:
    combine: all_pass
- id: spamspan_spamspan_service_and_twig
  version: '1.0'
  applicable_bundles:
  - spamspan
  checks:
  - kind: must_contain_any
    values:
    - spamspan
    - \Drupal::service('spamspan')
    - '|spamspan'
  scoring:
    combine: all_pass
- id: spamspan_spamspan_dependencies_permissions
  version: '1.0'
  applicable_bundles:
  - spamspan
  checks:
  - kind: must_contain_any
    values:
    - filter
    - administer filters
  scoring:
    combine: all_pass
