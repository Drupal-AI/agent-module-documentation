metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: spamspan
  version: 3.2.x
  note: 'SpamSpan is a core-Filter-dependent email obfuscation module. Cases are `recipe` (response-graded)
    and probe SpamSpan-specific facts: it is configured as a text-format filter (no dedicated settings
    page; configure route is core filter.admin_overview), the filter plugin id and its no-JS fallback
    markup, the 8 filter settings incl. the contact-form mode, the email_spamspan field formatter for
    Email fields, and the spamspan service / Twig filter for code. No site mutation.'
questions:
- id: spamspan-how-to-enable
  input: On a Drupal 11 site with the SpamSpan module enabled, how do I actually turn on email-address
    obfuscation for content? There is no SpamSpan settings page in the admin menu — where do I configure
    it?
  criteria: SpamSpan has no dedicated settings page; its configure route is core's filter.admin_overview.
    Edit a text format at Admin > Configuration > Content authoring > Text formats and editors (/admin/config/content/formats),
    enable the 'SpamSpan email address encoding filter', order it after HTML-generating filters, set its
    options under Filter settings, and save.
  bundle: spamspan
  rubric_ref: rubric/spamspan_spamspan_how_to_enable@1.0
  tags:
  - mode:recipe
- id: spamspan-filter-plugin-id
  input: In SpamSpan 3.2.x, what is the machine id of the text-format filter plugin, and what filter type
    is it (does it change text irreversibly)?
  criteria: The filter plugin id is filter_spamspan (Drupal\spamspan\Plugin\Filter\FilterSpamspan), type
    TYPE_TRANSFORM_IRREVERSIBLE.
  bundle: spamspan
  rubric_ref: rubric/spamspan_spamspan_filter_plugin_id@1.0
  tags:
  - mode:recipe
- id: spamspan-nojs-fallback
  input: With SpamSpan, what does a visitor see for an email address when JavaScript is disabled, and
    how is the address made clickable when JavaScript is on? Which setting changes the '@' replacement
    text?
  criteria: 'Without JavaScript the address degrades to a readable form like ''me [at] example.com'' (the
    ''@'' text is the spamspan_at setting, default '' [at] ''); with JavaScript the spamspan/obfuscate
    library reassembles the <span class="spamspan"> markup into a real mailto: link.'
  bundle: spamspan
  rubric_ref: rubric/spamspan_spamspan_nojs_fallback@1.0
  tags:
  - mode:recipe
- id: spamspan-contact-form-mode
  input: 'I want SpamSpan to link email addresses to a contact form instead of exposing a mailto: address
    at all. Which filter setting enables that, and how do I override the form URL and link text for a
    single address written in the content?'
  criteria: Enable spamspan_use_form ('Use a form instead of a link'); it uses spamspan_form_pattern with
    spamspan_form_default_url / spamspan_form_default_displaytext. Per-address overrides use the bracket
    syntax user@example.com[mycontactform|Contact me using this form].
  bundle: spamspan
  rubric_ref: rubric/spamspan_spamspan_contact_form_mode@1.0
  tags:
  - mode:recipe
- id: spamspan-email-field-formatter
  input: I have a core Email field on a content type and want its value shown as an obfuscated (spam-safe)
    link. Which display formatter do I choose in Manage display with SpamSpan installed?
  criteria: Choose the 'Email SpamSpan' formatter (id email_spamspan) on the Email field in Manage display;
    it obfuscates the value via the spamspan service and supports the same options as the filter.
  bundle: spamspan
  rubric_ref: rubric/spamspan_spamspan_email_field_formatter@1.0
  tags:
  - mode:recipe
- id: spamspan-service-and-twig
  input: In custom Drupal code or a Twig template, how do I obfuscate an arbitrary string containing email
    addresses with SpamSpan? Name the service and the Twig filter.
  criteria: 'Call the ''spamspan'' service: \Drupal::service(''spamspan'')->spamspan($text, $settings)
    which returns obfuscated HTML (attach the spamspan/obfuscate library yourself). In Twig use the filter
    {{ text|spamspan }}, which also attaches the library automatically.'
  bundle: spamspan
  rubric_ref: rubric/spamspan_spamspan_service_and_twig@1.0
  tags:
  - mode:recipe
- id: spamspan-dependencies-permissions
  input: What modules does SpamSpan 3.2.x depend on, and does it define its own permission to configure
    it, or does it reuse a core permission?
  criteria: It depends only on core's Filter module (drupal:filter) and defines no permissions of its
    own; configuring/testing it is gated by core's 'administer filters' permission.
  bundle: spamspan
  rubric_ref: rubric/spamspan_spamspan_dependencies_permissions@1.0
  tags:
  - mode:recipe
