rubrics:
- id: spambot_spambot_service_and_thresholds
  version: '1.0'
  applicable_bundles:
  - spambot
  checks:
  - kind: must_contain_any
    values:
    - stopforumspam
    - Stop Forum Spam
    - spambot_criteria_email
    - spambot_criteria_ip
  scoring:
    combine: all_pass
- id: spambot_spambot_bypass_permission
  version: '1.0'
  applicable_bundles:
  - spambot
  checks:
  - kind: must_contain_any
    values:
    - protected from spambot scans
  scoring:
    combine: all_pass
- id: spambot_spambot_config_location
  version: '1.0'
  applicable_bundles:
  - spambot
  checks:
  - kind: must_contain_any
    values:
    - spambot.settings
    - spambot.settings_form
    - /admin/config/system/spambot
  scoring:
    combine: all_pass
- id: spambot_spambot_current_ip_threshold
  version: '1.0'
  applicable_bundles:
  - spambot
  checks:
  - kind: must_contain_any
    values:
    - '13'
  scoring:
    combine: all_pass
- id: spambot_spambot_current_email_whitelist
  version: '1.0'
  applicable_bundles:
  - spambot
  checks:
  - kind: must_contain_any
    values:
    - spambot_flagged@example.com
  scoring:
    combine: all_pass
- id: spambot_spambot_set_username_threshold
  version: '1.0'
  applicable_bundles:
  - spambot
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
- id: spambot_spambot_whitelist_an_ip
  version: '1.0'
  applicable_bundles:
  - spambot
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
