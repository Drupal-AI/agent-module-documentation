metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: spambot
  version: 1.4.x
  note: Spambot checks user-registration (and Webform) email/username/IP against the Stop Forum Spam (www.stopforumspam.com)
    blacklist. All configuration lives in the single config object spambot.settings (form route spambot.settings_form
    at /admin/config/system/spambot). Thresholds spambot_criteria_email (default 1), spambot_criteria_username
    (default 0/off), spambot_criteria_ip (default 20); a criterion of 0 disables that check. Whitelists
    are spambot_whitelist_{email,username,ip}_list arrays. Cron scanning is gated by spambot_cron_user_limit
    with spambot_spam_account_action (0 none/1 block/2 delete). The permission 'protected from spambot
    scans' bypasses all checks. Reporting spammers needs spambot_sfs_api_key. Medium/hard cases are grounded
    in real spambot.settings keys, read/written via drush cget/cset.
questions:
- id: spambot-service-and-thresholds
  input: In the Drupal spambot module, which external blacklist service does it check new registrations
    against, and which configuration keys set the per-criterion thresholds for email and IP address?
  criteria: It queries Stop Forum Spam (www.stopforumspam.com). Thresholds are spambot_criteria_email
    and spambot_criteria_ip (and spambot_criteria_username) in spambot.settings; a value of 0 disables
    that check.
  bundle: spambot
  rubric_ref: rubric/spambot_spambot_service_and_thresholds@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: spambot-bypass-permission
  input: Which Drupal permission does the spambot module provide, and what does granting it to a role
    do?
  criteria: 'The single permission is ''protected from spambot scans''. A user/role holding it bypasses
    all spambot checks: the registration validator is not attached and cron scans take no block/delete
    action against those accounts.'
  bundle: spambot
  rubric_ref: rubric/spambot_spambot_bypass_permission@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: spambot-config-location
  input: There is no obvious settings link for spambot. What is the name of the configuration object that
    stores all spambot settings, and what is the admin form route/path?
  criteria: All settings live in the spambot.settings config object; the admin form is route spambot.settings_form
    at /admin/config/system/spambot (requires 'administer site configuration').
  bundle: spambot
  rubric_ref: rubric/spambot_spambot_config_location@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: spambot-current-ip-threshold
  input: On this Drupal site, spambot is configured with a specific threshold for how many times an IP
    address must have been reported to Stop Forum Spam before a registration is blocked. Inspect the live
    configuration and state that IP-address threshold number.
  criteria: spambot.settings:spambot_criteria_ip is 13 on this site (drush cget spambot.settings spambot_criteria_ip).
  bundle: spambot
  rubric_ref: rubric/spambot_spambot_current_ip_threshold@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/spambot-ip-threshold-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/spambot-ip-threshold-cleanup.sh
- id: spambot-current-email-whitelist
  input: This site has one email address on spambot's email whitelist (so it is exempt from spam checks).
    Inspect the live spambot configuration and give that whitelisted email address.
  criteria: spambot.settings:spambot_whitelist_email_list contains spambot_flagged@example.com.
  bundle: spambot
  rubric_ref: rubric/spambot_spambot_current_email_whitelist@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/spambot-whitelist-email-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/spambot-whitelist-email-cleanup.sh
- id: spambot-set-username-threshold
  input: On this Drupal site, configure spambot so that a user registration is blocked when the chosen
    username has been reported to Stop Forum Spam at least 5 times. Apply the change to the live site.
  criteria: Set spambot.settings:spambot_criteria_username to 5 (drush cset spambot.settings spambot_criteria_username
    5 -y).
  bundle: spambot
  rubric_ref: rubric/spambot_spambot_set_username_threshold@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/spambot-username-criteria-reset.sh
    verify: agent-module-documentation/evaluation/verify/spambot-username-criteria-verify.sh
- id: spambot-whitelist-an-ip
  input: Add the IP address 198.51.100.7 to spambot's IP whitelist on this site so that spambot never
    checks or blocks that address. Apply the change to the live configuration.
  criteria: Add 198.51.100.7 to the spambot.settings:spambot_whitelist_ip_list array and save (e.g. drush
    cset spambot.settings spambot_whitelist_ip_list.0 198.51.100.7 -y, or set the full array in php:eval).
  bundle: spambot
  rubric_ref: rubric/spambot_spambot_whitelist_an_ip@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/spambot-whitelist-ip-reset.sh
    verify: agent-module-documentation/evaluation/verify/spambot-whitelist-ip-verify.sh
