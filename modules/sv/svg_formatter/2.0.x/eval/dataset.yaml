  criteria: 'In core.entity_view_display.node.article.default the field_svgf_task component must have
    type: svg_formatter with settings.inline: true, settings.sanitize: true, settings.apply_dimensions:
    true, settings.width: 48 and settings.height: 48.'
  bundle: svg_formatter
  rubric_ref: rubric/svg_formatter_svg_formatter_inline_display@1.0
