metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: svg_image
  version: 3.2.x
  note: SVG Image overrides the core Image widget/formatters via alter hooks; it has no settings page
    (configure is null) and no plugin types, so all cases are `recipe` (response-graded), not `execution`
    (live-state).
questions:
- id: svgimage-allow-uploads
  input: On a Drupal 11 site with the SVG Image module enabled, I have an existing core Image field that
    currently rejects .svg uploads. What is the single configuration change I make to let editors upload
    SVGs into that field? Be specific about where.
  criteria: Add `svg` to the field's Allowed file extensions on the field settings form (Manage fields
    -> settings), e.g. `png gif jpg jpeg svg`. No separate field or media type is needed; the overridden
    widget then permits the upload.
  bundle: svg_image
  rubric_ref: rubric/svg_image_svgimage_allow_uploads@1.0
  tags:
  - mode:recipe
- id: svgimage-inline-vs-img
  input: Using SVG Image's `image` formatter on a Drupal Manage display, which formatter setting controls
    whether an SVG renders as an `<img>` tag versus inline `<svg>` markup, and what value gives inline
    output?
  criteria: The `svg_render_as_image` setting (default TRUE = render as `<img>`). Set it to FALSE to output
    inline, sanitized `<svg>` markup.
  bundle: svg_image
  rubric_ref: rubric/svg_image_svgimage_inline_vs_img@1.0
  tags:
  - mode:recipe
- id: svgimage-sanitizer-dependency
  input: How does the SVG Image module protect a Drupal site from XSS in uploaded SVG files, and which
    PHP library does it rely on for that? Name the library.
  criteria: Inline SVG output is passed through the `enshrined/svg-sanitize` library (Sanitizer::sanitize()),
    stripping scripts/unsafe nodes before the markup is printed.
  bundle: svg_image
  rubric_ref: rubric/svg_image_svgimage_sanitizer_dependency@1.0
  tags:
  - mode:recipe
- id: svgimage-overridden-classes
  input: SVG Image does not register new field plugins. Which core Image plugin IDs does it override,
    and via which alter hooks? Name the hooks.
  criteria: It swaps the class behind the `image_image` widget (via hook_field_widget_info_alter) and
    the `image` and `image_url` formatters (via hook_field_formatter_info_alter), keeping the original
    plugin IDs/labels.
  bundle: svg_image
  rubric_ref: rubric/svg_image_svgimage_overridden_classes@1.0
  tags:
  - mode:recipe
- id: svgimage-dimensions-helper
  input: In a Drupal theme I need best-effort width/height for an uploaded SVG File entity. Which procedural
    helper does the SVG Image module provide, and what does it fall back to when the SVG has no dimensions?
  criteria: svg_image_get_image_file_dimensions(File $file) reads the SVG's width/height attributes and
    falls back to 64x64, returning ['width' => int, 'height' => int].
  bundle: svg_image
  rubric_ref: rubric/svg_image_svgimage_dimensions_helper@1.0
  tags:
  - mode:recipe
- id: svgimage-image-style-fallback
  input: Image styles can't resize an SVG on the server. What does the SVG Image module do so an SVG still
    renders when a raster-only image style is applied, and what CSS class does it add?
  criteria: svg_image_preprocess_image_style() forces access and adds a `no-image-style` class so the
    SVG still renders instead of being hidden by the image style. The image_url formatter also returns
    the raw SVG URL when a style is set.
  bundle: svg_image
  rubric_ref: rubric/svg_image_svgimage_image_style_fallback@1.0
  tags:
  - mode:recipe
- id: svgimage-uninstall-cleanup
  input: What does the SVG Image module clean up when it is uninstalled from a Drupal site?
  criteria: hook_uninstall removes the `svg` extension it added to every image field, drops the `svg_render_as_image`
    / `svg_attributes` display settings, and restores the core `image` module dependency.
  bundle: svg_image
  rubric_ref: rubric/svg_image_svgimage_uninstall_cleanup@1.0
  tags:
  - mode:recipe
