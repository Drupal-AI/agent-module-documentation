rubrics:
- id: svg_image_svgimage_allow_uploads
  version: '1.0'
  applicable_bundles:
  - svg_image
  checks:
  - kind: must_contain_any
    values:
    - allowed file extensions
    - allowed extensions
    - add svg
    - svg extension
  scoring:
    combine: all_pass
- id: svg_image_svgimage_inline_vs_img
  version: '1.0'
  applicable_bundles:
  - svg_image
  checks:
  - kind: must_contain_any
    values:
    - svg_render_as_image
  scoring:
    combine: all_pass
- id: svg_image_svgimage_sanitizer_dependency
  version: '1.0'
  applicable_bundles:
  - svg_image
  checks:
  - kind: must_contain_any
    values:
    - enshrined/svg-sanitize
    - enshrined\svgSanitize
    - svg-sanitize
    - Sanitizer
  scoring:
    combine: all_pass
- id: svg_image_svgimage_overridden_classes
  version: '1.0'
  applicable_bundles:
  - svg_image
  checks:
  - kind: must_contain_any
    values:
    - hook_field_widget_info_alter
    - hook_field_formatter_info_alter
    - field_widget_info_alter
    - field_formatter_info_alter
  scoring:
    combine: all_pass
- id: svg_image_svgimage_dimensions_helper
  version: '1.0'
  applicable_bundles:
  - svg_image
  checks:
  - kind: must_contain_any
    values:
    - svg_image_get_image_file_dimensions
  scoring:
    combine: all_pass
- id: svg_image_svgimage_image_style_fallback
  version: '1.0'
  applicable_bundles:
  - svg_image
  checks:
  - kind: must_contain_any
    values:
    - no-image-style
    - svg_image_preprocess_image_style
  scoring:
    combine: all_pass
- id: svg_image_svgimage_uninstall_cleanup
  version: '1.0'
  applicable_bundles:
  - svg_image
  checks:
  - kind: must_contain_any
    values:
    - removes
    - svg
    - restores
    - hook_uninstall
  scoring:
    combine: all_pass
