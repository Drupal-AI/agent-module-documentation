metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: csv_serialization
  version: 4.0.x
  note: 'csv_serialization is a passive API module: it registers a `csv` serialization format/encoder
    with no admin UI or config of its own. All cases are `recipe` (response-graded), not `execution` (live-state).'
questions:
- id: csvserial-serialize-format
  input: In PHP on a Drupal 11 site, I have `$data` (an array of associative rows) and want to turn it
    into a CSV string. Which core service do I call and what format string do I pass? Show the one-line
    call.
  criteria: 'Use the core `serializer` service: \Drupal::service(''serializer'')->serialize($data, ''csv'',
    $context) — the module registers `csv` as a serialization format.'
  bundle: csv_serialization
  rubric_ref: rubric/csv_serialization_csvserial_serialize_format@1.0
  tags:
  - mode:recipe
- id: csvserial-encoder-class
  input: What is the encoder class this module provides for CSV, and what serialization format string
    does it support? Name the class and the format.
  criteria: The Drupal\csv_serialization\Encoder\CsvEncoder class (service csv_serialization.encoder.csv,
    tagged as an `encoder`) supporting the `csv` format.
  bundle: csv_serialization
  rubric_ref: rubric/csv_serialization_csvserial_encoder_class@1.0
  tags:
  - mode:recipe
- id: csvserial-views-data-export
  input: I want a Views display that lets users download the results as a downloadable .csv file. Which
    Views display type / mechanism uses this module to emit CSV, and how is the format selected over REST?
  criteria: A Views "Data export" (Rest export) display outputs CSV via this module; a REST resource returns
    CSV with ?_format=csv (text/csv).
  bundle: csv_serialization
  rubric_ref: rubric/csv_serialization_csvserial_views_data_export@1.0
  tags:
  - mode:recipe
- id: csvserial-league-csv-dependency
  input: This module fails because an external library is missing. Which Composer library does csv_serialization
    depend on to build and parse CSV, and how do I install it?
  criteria: It requires the league/csv library (^9.16), pulled in via Composer (drupal/csv_serialization
    requires league/csv).
  bundle: csv_serialization
  rubric_ref: rubric/csv_serialization_csvserial_league_csv_dependency@1.0
  tags:
  - mode:recipe
- id: csvserial-delimiter-enclosure
  input: In custom PHP I want to serialize an array to CSV but with a semicolon (;) field separator and
    a single-quote enclosure instead of the defaults. How do I pass those options to the serializer?
  criteria: Pass a $context['csv_settings'] array with 'delimiter' => ';' and 'enclosure' => "'" to serialize().
  bundle: csv_serialization
  rubric_ref: rubric/csv_serialization_csvserial_delimiter_enclosure@1.0
  tags:
  - mode:recipe
- id: csvserial-utf8-bom
  input: My CSV export opens in Excel with garbled accented characters. Which csv_settings keys make the
    module prepend a UTF-8 BOM so Excel reads it correctly?
  criteria: Set encoding to 'utf8' and utf8_bom to a truthy value in csv_settings so a UTF-8 BOM is prepended.
  bundle: csv_serialization
  rubric_ref: rubric/csv_serialization_csvserial_utf8_bom@1.0
  tags:
  - mode:recipe
- id: csvserial-multivalue-flatten
  input: When I export multi-value fields to CSV with this module, how are the multiple values combined
    inside a single cell, and is that separator configurable?
  criteria: Multi-value/nested cells are flattened with a hard-coded `|` separator (e.g. a|b|c); it is
    not configurable. Decoding explodes `|` cells back into arrays.
  bundle: csv_serialization
  rubric_ref: rubric/csv_serialization_csvserial_multivalue_flatten@1.0
  tags:
  - mode:recipe
- id: csvserial-strip-tags-header
  input: For a CSV export I want clean plain-text cells (no HTML) and I want to turn OFF the header row
    for a headless consumer. Which csv_settings keys control tag stripping and the header row, and what
    are their defaults?
  criteria: strip_tags (default TRUE) strips HTML from each value; output_header (default TRUE) toggles
    the header row — set output_header to FALSE to omit it.
  bundle: csv_serialization
  rubric_ref: rubric/csv_serialization_csvserial_strip_tags_header@1.0
  tags:
  - mode:recipe
