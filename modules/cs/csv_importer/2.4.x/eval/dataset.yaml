metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: csv_importer
  version: 2.4.x
  note: CSV Importer bulk-creates/updates any content entity from an uploaded CSV via one deriver-generated
    'importer:<entity_type>' plugin, batched. No config UI, no config entities, no Drush. Cases are `recipe`
    (response-graded) probing documented facts an agent would otherwise read source to answer; no site
    mutation.
questions:
- id: csv-importer-route-permission
  input: On Drupal 11 with the csv_importer module, what is the admin path to import a CSV and which permission
    gates it?
  criteria: The import form is at /admin/content/csv-importer (Content > Import CSV), and every csv_importer
    route requires the single 'access csv importer' permission (restricted).
  bundle: csv_importer
  rubric_ref: rubric/csv_importer_csv_importer_route_permission@1.0
  tags:
  - mode:recipe
- id: csv-importer-no-config
  input: Where is the settings/configuration form for csv_importer, and what config entities does it provide?
  criteria: It has none — csv_importer declares no `configure` route, ships no config/ directory, and
    provides no config entities or config schema. The only UI is the import form itself.
  bundle: csv_importer
  rubric_ref: rubric/csv_importer_csv_importer_no_config@1.0
  tags:
  - mode:recipe
- id: csv-importer-multivalue-syntax
  input: In a csv_importer CSV, how do I put several values into one multi-value field from a single cell?
  criteria: Wrap the cell as values(a+b+c) or multiple(a+b+c); the value is split on '+' into an array
    (matched by ImporterInterface::REGEX_MULTIPLE) to populate a multi-value field.
  bundle: csv_importer
  rubric_ref: rubric/csv_importer_csv_importer_multivalue_syntax@1.0
  tags:
  - mode:recipe
- id: csv-importer-file-attach
  input: How does csv_importer let me attach an image/file to an entity from the CSV, and what kinds of
    paths are accepted?
  criteria: Put a stream-wrapper URI (public://…, private://…) or an http(s) URL in the cell; the file
    is downloaded via file.repository and replaced by its file ID (or {target_id} array for multiple).
    Bare local filesystem paths are rejected.
  bundle: csv_importer
  rubric_ref: rubric/csv_importer_csv_importer_file_attach@1.0
  tags:
  - mode:recipe
- id: csv-importer-update-existing
  input: Can csv_importer update existing entities instead of always creating new ones? How?
  criteria: Yes. If a row includes the entity id key column (e.g. nid/uid/tid) matching an existing entity,
    that entity is loaded and updated; otherwise a new entity is created. A langcode column targets a
    translation.
  bundle: csv_importer
  rubric_ref: rubric/csv_importer_csv_importer_update_existing@1.0
  tags:
  - mode:recipe
- id: csv-importer-plugin-type
  input: How does csv_importer support arbitrary content entity types internally — is there a plugin per
    entity type?
  criteria: There is one 'importer' plugin (ImporterBase) whose ImporterDeriver creates a derivative for
    every content entity type, yielding plugin IDs like importer:node, importer:user, importer:taxonomy_term.
    The form calls createInstance('importer:' . $entity_type).
  bundle: csv_importer
  rubric_ref: rubric/csv_importer_csv_importer_plugin_type@1.0
  tags:
  - mode:recipe
- id: csv-importer-pre-import-hook
  input: Which hook lets me modify CSV data in csv_importer before entities are created, and when does
    it fire?
  criteria: Implement hook_csv_importer_pre_import(array &$data); it is invoked in ImporterBase::data()
    after the CSV is parsed/normalized but before any entity is written, with $data['content'] passed
    by reference.
  bundle: csv_importer
  rubric_ref: rubric/csv_importer_csv_importer_pre_import_hook@1.0
  tags:
  - mode:recipe
- id: csv-importer-history-revert
  input: Does csv_importer keep a record of imports, and can I undo one?
  criteria: Yes. Each import is logged to the csv_importer_history table and listed at /admin/content/csv-importer/history;
    the revert action deletes the entities that import created and marks the record reverted (status 1).
  bundle: csv_importer
  rubric_ref: rubric/csv_importer_csv_importer_history_revert@1.0
  tags:
  - mode:recipe
- id: csv-importer-required-fields
  input: What happens in csv_importer 2.4.x if a CSV row is missing a field that the target bundle marks
    required?
  criteria: 'That row is attempted, fails to save, and is skipped and reported (''Row N was skipped because
    required fields are empty: …''); the batch continues with the other rows, so a partial import can
    succeed. (Unlike 2.3.x, there is no header pre-validation that aborts the whole import.)'
  bundle: csv_importer
  rubric_ref: rubric/csv_importer_csv_importer_required_fields@1.0
  tags:
  - mode:recipe
- id: csv-importer-parser-service
  input: Which service parses a CSV in csv_importer and what method reads a managed file into rows?
  criteria: The csv_importer.parser service (Drupal\csv_importer\Parser); getCsvById(int $fid, string
    $delimiter=',') returns the rows, getCsvFieldsById() the header row, getCsvEntity() the File entity.
  bundle: csv_importer
  rubric_ref: rubric/csv_importer_csv_importer_parser_service@1.0
  tags:
  - mode:recipe
