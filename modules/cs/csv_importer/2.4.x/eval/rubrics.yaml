rubrics:
- id: csv_importer_csv_importer_route_permission
  version: '1.0'
  applicable_bundles:
  - csv_importer
  checks:
  - kind: must_contain_any
    values:
    - /admin/content/csv-importer
    - access csv importer
  scoring:
    combine: all_pass
- id: csv_importer_csv_importer_no_config
  version: '1.0'
  applicable_bundles:
  - csv_importer
  checks:
  - kind: must_contain_any
    values:
    - no config
    - no settings
    - no configuration
    - does not
  scoring:
    combine: all_pass
- id: csv_importer_csv_importer_multivalue_syntax
  version: '1.0'
  applicable_bundles:
  - csv_importer
  checks:
  - kind: must_contain_any
    values:
    - values(
    - multiple(
    - REGEX_MULTIPLE
  scoring:
    combine: all_pass
- id: csv_importer_csv_importer_file_attach
  version: '1.0'
  applicable_bundles:
  - csv_importer
  checks:
  - kind: must_contain_any
    values:
    - public://
    - private://
    - http
    - stream
    - file_get_contents
  scoring:
    combine: all_pass
- id: csv_importer_csv_importer_update_existing
  version: '1.0'
  applicable_bundles:
  - csv_importer
  checks:
  - kind: must_contain_any
    values:
    - id
    - nid
    - load
    - update
  scoring:
    combine: all_pass
- id: csv_importer_csv_importer_plugin_type
  version: '1.0'
  applicable_bundles:
  - csv_importer
  checks:
  - kind: must_contain_any
    values:
    - deriver
    - 'importer:'
    - ImporterDeriver
    - derivative
  scoring:
    combine: all_pass
- id: csv_importer_csv_importer_pre_import_hook
  version: '1.0'
  applicable_bundles:
  - csv_importer
  checks:
  - kind: must_contain_any
    values:
    - hook_csv_importer_pre_import
    - csv_importer_pre_import
  scoring:
    combine: all_pass
- id: csv_importer_csv_importer_history_revert
  version: '1.0'
  applicable_bundles:
  - csv_importer
  checks:
  - kind: must_contain_any
    values:
    - csv_importer_history
    - history
    - revert
  scoring:
    combine: all_pass
- id: csv_importer_csv_importer_required_fields
  version: '1.0'
  applicable_bundles:
  - csv_importer
  checks:
  - kind: must_contain_any
    values:
    - skipped
    - skip
    - row
    - continues
  scoring:
    combine: all_pass
- id: csv_importer_csv_importer_parser_service
  version: '1.0'
  applicable_bundles:
  - csv_importer
  checks:
  - kind: must_contain_any
    values:
    - csv_importer.parser
    - getCsvById
  scoring:
    combine: all_pass
