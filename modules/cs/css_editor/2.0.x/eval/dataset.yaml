metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: css_editor
  version: 2.0.x
  note: 'CSS Editor has no route and configure: null - it alters core''s system_theme_settings form, so
    its UI is /admin/appearance/settings/<theme>. Persistent state is one config object per theme, css_editor.theme.<theme>,
    with keys enabled/css/plaintext_enabled/autopreview_enabled plus a `path` key the module writes itself,
    and the generated stylesheet public://css_editor/<theme>.css produced by the css_editor.css_generator
    service (Drupal\css_editor\CssEditorService). Delivery is guarded by _css_editor_get_stylesheet($theme),
    which returns FALSE unless enabled is TRUE AND the file exists. All medium/hard cases use the core
    Stark theme as an isolated sandbox (installed by setup/reset, uninstalled by cleanup) and never touch
    the site''s default or admin theme. Note that hook_cache_flush() regenerates every enabled theme''s
    stylesheet, so the hard ''turn it off'' case is verified through the module''s own serving predicate
    rather than through file presence alone.'
questions:
- id: css_editor-where-stored
  input: On a Drupal 11 site with the contrib css_editor module, where do I enter custom CSS for a theme
    (there is no module settings page), and in which config object is it stored?
  criteria: In the theme's own settings page, /admin/appearance/settings/<theme>, under the 'Custom CSS'
    details element added by css_editor_form_system_theme_settings_alter(). It is stored in the config
    object css_editor.theme.<theme> with keys enabled, css, plaintext_enabled, autopreview_enabled (plus
    path, written by the module).
  bundle: css_editor
  rubric_ref: rubric/css_editor_css_editor_where_stored@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: css_editor-generated-file
  input: How does css_editor actually get the CSS onto the page? Where is the generated stylesheet written,
    which service writes it, and how is it attached so it overrides the theme's own CSS?
  criteria: The css_editor.css_generator service (Drupal\css_editor\CssEditorService::generateCssFile)
    writes public://css_editor/<theme>.css and stores that URI in css_editor.theme.<theme>:path. css_editor_library_info_alter()
    then appends that file to the active theme's own `css_editor` library with weight 9999, and css_editor_page_attachments()
    attaches '<theme>/css_editor', so it loads after all other CSS.
  bundle: css_editor
  rubric_ref: rubric/css_editor_css_editor_generated_file@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: css_editor-not-applied
  input: I pasted CSS into the css_editor box for my theme and saved, but the rules are not applied on
    the site. Which two conditions does the module check before it will attach the stylesheet, and what
    regenerates the file?
  criteria: _css_editor_get_stylesheet($theme) only returns the file when css_editor.theme.<theme>:enabled
    is TRUE AND the file at :path actually exists; otherwise nothing is attached. The file is written
    by css_editor.css_generator::generateCssFile() on form save, and css_editor_cache_flush() calls regenerateAllCssFiles()
    on every cache clear (drush cr). Also remember the CSS only loads while that theme is the active theme.
  bundle: css_editor
  rubric_ref: rubric/css_editor_css_editor_not_applied@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: css_editor-known-theme
  input: This Drupal site has custom CSS configured through the css_editor module for exactly one theme.
    Inspect the running site and tell me which theme it is and what CSS selector the custom CSS defines.
  criteria: 'The Stark theme: css_editor.theme.stark has enabled: true and css ''.ce-probe-banner { background-color:
    #bada55; border: 2px dashed #123456; }'', generated to public://css_editor/stark.css. List candidates
    with \Drupal::configFactory()->listAll(''css_editor.theme.'').'
  bundle: css_editor
  rubric_ref: rubric/css_editor_css_editor_known_theme@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/css_editor-known-theme-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/css_editor-known-theme-cleanup.sh
- id: css_editor-disabled-css
  input: On this Drupal site the Stark theme has custom CSS saved in css_editor, but the rule is never
    served to visitors. Inspect the live configuration and file system and explain exactly why - name
    the config key and the file that decide it.
  criteria: 'css_editor.theme.stark has css ''.ce-offline-note { color: #ff0066; }'' but enabled: false,
    and no generated stylesheet exists at its path (public://css_editor/stark.css). _css_editor_get_stylesheet(''stark'')
    therefore returns FALSE, so neither css_editor_library_info_alter() nor css_editor_page_attachments()
    adds anything.'
  bundle: css_editor
  rubric_ref: rubric/css_editor_css_editor_disabled_css@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/css_editor-disabled-css-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/css_editor-disabled-css-cleanup.sh
- id: css_editor-enable-stark
  input: 'The core Stark theme is installed on this Drupal site. Using the css_editor module, give Stark
    the custom CSS rule `.ce-task-banner { background-color: #bada55; }` and make sure it would really
    be served - i.e. the module''s generated stylesheet for Stark must exist on disk and contain that
    rule. Apply it to the live site. Do not change the site''s default theme.'
  criteria: 'Set css_editor.theme.stark enabled: TRUE and css: ''.ce-task-banner { background-color: #bada55;
    }'', then generate the file - \Drupal::service(''css_editor.css_generator'')->generateCssFile(''stark'')
    (or a cache rebuild, which calls regenerateAllCssFiles()). Verified: enabled TRUE, the rule present
    in config, path set, and public://css_editor/stark.css containing ce-task-banner.'
  bundle: css_editor
  rubric_ref: rubric/css_editor_css_editor_enable_stark@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/css_editor-enable-stark-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/css_editor-enable-stark-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/css_editor-enable-stark-verify.sh
- id: css_editor-disable-stark
  input: Someone added custom CSS to our Stark theme through the CSS editor and it is breaking the layout.
    Please stop that custom CSS from being loaded on the site, but do not throw the CSS away - we want
    the text kept so we can switch it back on later. Apply the change to the live site.
  criteria: 'Set css_editor.theme.stark:enabled to FALSE (untick ''Enable or disable custom CSS'' on /admin/appearance/settings/stark)
    while leaving the css value intact. Verified through the module''s own serving predicate: _css_editor_get_stylesheet(''stark'')
    must return FALSE and the .ce-rollback-marker rule must still be present in config.'
  bundle: css_editor
  rubric_ref: rubric/css_editor_css_editor_disable_stark@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: site-owner
    reset: agent-module-documentation/evaluation/verify/css_editor-disable-stark-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/css_editor-disable-stark-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/css_editor-disable-stark-verify.sh
