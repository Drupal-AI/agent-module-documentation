rubrics:
- id: css_editor_css_editor_where_stored
  version: '1.0'
  applicable_bundles:
  - css_editor
  checks:
  - kind: must_contain_any
    values:
    - css_editor.theme
    - appearance/settings
    - theme settings
  scoring:
    combine: all_pass
- id: css_editor_css_editor_generated_file
  version: '1.0'
  applicable_bundles:
  - css_editor
  checks:
  - kind: must_contain_any
    values:
    - public://css_editor
    - css_editor.css_generator
    - CssEditorService
  scoring:
    combine: all_pass
- id: css_editor_css_editor_not_applied
  version: '1.0'
  applicable_bundles:
  - css_editor
  checks:
  - kind: must_contain_any
    values:
    - enabled
    - file_exists
    - _css_editor_get_stylesheet
  scoring:
    combine: all_pass
- id: css_editor_css_editor_known_theme
  version: '1.0'
  applicable_bundles:
  - css_editor
  checks:
  - kind: must_contain_any
    values:
    - stark
  scoring:
    combine: all_pass
- id: css_editor_css_editor_disabled_css
  version: '1.0'
  applicable_bundles:
  - css_editor
  checks:
  - kind: must_contain_any
    values:
    - enabled
    - 'false'
  scoring:
    combine: all_pass
- id: css_editor_css_editor_enable_stark
  version: '1.0'
  applicable_bundles:
  - css_editor
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
- id: css_editor_css_editor_disable_stark
  version: '1.0'
  applicable_bundles:
  - css_editor
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
