rubrics:
- id: csp_log_csp_log_report_endpoint_path
  version: '1.0'
  applicable_bundles:
  - csp_log
  checks:
  - kind: must_contain_any
    values:
    - /log-report-uri/
    - csp_log.reporturi
  - kind: must_not_contain
    values:
    - /admin/config/csp_log/settings
  scoring:
    combine: all_pass
- id: csp_log_csp_log_no_settings_form
  version: '1.0'
  applicable_bundles:
  - csp_log
  checks:
  - kind: must_contain_any
    values:
    - no such route
    - does not exist
    - no settings form
    - dangling
    - not defined
  scoring:
    combine: all_pass
- id: csp_log_csp_log_csp_plugin
  version: '1.0'
  applicable_bundles:
  - csp_log
  checks:
  - kind: must_contain_any
    values:
    - Dedicated CSP log
    - csp_log
  scoring:
    combine: all_pass
- id: csp_log_csp_log_view_reports_permission
  version: '1.0'
  applicable_bundles:
  - csp_log
  checks:
  - kind: must_contain_any
    values:
    - /admin/reports/csp
    - access csp_log reports
  scoring:
    combine: all_pass
- id: csp_log_csp_log_cron_cleanup
  version: '1.0'
  applicable_bundles:
  - csp_log
  checks:
  - kind: must_contain_any
    values:
    - cleanup
    - Log lifetime
    - hook_cron
    - removeLogs
  scoring:
    combine: all_pass
- id: csp_log_csp_log_service_methods
  version: '1.0'
  applicable_bundles:
  - csp_log
  checks:
  - kind: must_contain_any
    values:
    - csp_log
    - insertLog
    - fetchLogs
    - aggregateLogs
    - removeLogs
  scoring:
    combine: all_pass
- id: csp_log_csp_log_endpoint_status_codes
  version: '1.0'
  applicable_bundles:
  - csp_log
  checks:
  - kind: must_contain_any
    values:
    - '202'
    - '400'
  scoring:
    combine: all_pass
- id: csp_log_csp_log_dedicated_table
  version: '1.0'
  applicable_bundles:
  - csp_log
  checks:
  - kind: must_contain_any
    values:
    - csp_log
    - dedicated
    - table
  - kind: must_not_contain
    values:
    - watchdog table
    - dblog table stores
  scoring:
    combine: all_pass
