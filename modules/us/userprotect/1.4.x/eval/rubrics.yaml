rubrics:
- id: userprotect_userprotect_config_entity
  version: '1.0'
  applicable_bundles:
  - userprotect
  checks:
  - kind: must_contain_any
    values:
    - userprotect_rule
  scoring:
    combine: all_pass
- id: userprotect_userprotect_protectable_properties
  version: '1.0'
  applicable_bundles:
  - userprotect
  checks:
  - kind: must_contain_any
    values:
    - user_name
    - user_mail
    - user_pass
    - user_status
    - user_roles
    - user_edit
    - user_delete
  scoring:
    combine: all_pass
- id: userprotect_userprotect_per_user_vs_role
  version: '1.0'
  applicable_bundles:
  - userprotect
  checks:
  - kind: must_contain_any
    values:
    - user_role
    - protectedEntityTypeId
  scoring:
    combine: all_pass
- id: userprotect_userprotect_plugin_type
  version: '1.0'
  applicable_bundles:
  - userprotect
  checks:
  - kind: must_contain_any
    values:
    - user_protection
    - Plugin/UserProtection
    - UserProtectionBase
  scoring:
    combine: all_pass
- id: userprotect_userprotect_bypass
  version: '1.0'
  applicable_bundles:
  - userprotect
  checks:
  - kind: must_contain_any
    values:
    - userprotect.bypass_all
  scoring:
    combine: all_pass
- id: userprotect_userprotect_self_edit
  version: '1.0'
  applicable_bundles:
  - userprotect
  checks:
  - kind: must_contain_any
    values:
    - userprotect.mail.edit
    - userprotect.pass.edit
  scoring:
    combine: all_pass
- id: userprotect_userprotect_configure_route
  version: '1.0'
  applicable_bundles:
  - userprotect
  checks:
  - kind: must_contain_any
    values:
    - userprotect.rule_list
    - admin/config/people/userprotect
  scoring:
    combine: all_pass
