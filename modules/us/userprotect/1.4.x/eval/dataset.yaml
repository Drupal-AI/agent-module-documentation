metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: userprotect
  version: 1.4.x
  note: User Protect exposes a userprotect_rule config entity, a user_protection plugin type with seven
    shipped protections, static + dynamic bypass permissions, and access enforced via user entity/field
    access hooks. Cases are `recipe` (response-graded) probing documented facts an agent would otherwise
    read source to answer; no site mutation.
questions:
- id: userprotect-config-entity
  input: On a Drupal 11 site, which User Protect config entity type stores a protection rule, and which
    two property values decide whether the rule targets a single user or a whole role?
  criteria: The userprotect_rule config entity; protectedEntityTypeId ('user' vs 'user_role') plus protectedEntityId
    (the user ID or role machine name) decide the target.
  bundle: userprotect
  rubric_ref: rubric/userprotect_userprotect_config_entity@1.0
  tags:
  - mode:recipe
- id: userprotect-protectable-properties
  input: Which editing operations/fields can a User Protect protection rule lock on a user account? Give
    the protection plugin IDs.
  criteria: Username (user_name), email (user_mail), password (user_pass), status (user_status), roles
    (user_roles), edit operation (user_edit), and cancel/delete operation (user_delete).
  bundle: userprotect
  rubric_ref: rubric/userprotect_userprotect_protectable_properties@1.0
  tags:
  - mode:recipe
- id: userprotect-per-user-vs-role
  input: I want to protect every user in the 'administrator' role, not just one account, with User Protect.
    How do I express that on a protection rule versus protecting a single user?
  criteria: Set protectedEntityTypeId to 'user_role' and protectedEntityId to the role machine name for
    a per-role rule; use 'user' with a user ID for a per-user rule.
  bundle: userprotect
  rubric_ref: rubric/userprotect_userprotect_per_user_vs_role@1.0
  tags:
  - mode:recipe
- id: userprotect-plugin-type
  input: How do I add a custom protection to User Protect? Name the plugin type, the plugin namespace,
    and the base class I extend.
  criteria: 'Implement the user_protection plugin type: a class in Plugin/UserProtection using the UserProtection
    attribute, extending UserProtectionBase (implements UserProtectionInterface).'
  bundle: userprotect
  rubric_ref: rubric/userprotect_userprotect_plugin_type@1.0
  tags:
  - mode:recipe
- id: userprotect-bypass
  input: Which permission lets a role ignore ALL User Protect protection rules, and how can a role bypass
    just one specific rule?
  criteria: userprotect.bypass_all ignores all rules; each saved rule also generates a per-rule permission
    userprotect.{rule}.bypass to bypass only that rule. User 1 always bypasses.
  bundle: userprotect
  rubric_ref: rubric/userprotect_userprotect_bypass@1.0
  tags:
  - mode:recipe
- id: userprotect-self-edit
  input: Protection rules never apply to a user editing their own account in User Protect. Which permissions
    then govern whether users can change their own email and password?
  criteria: Self-editing is governed by userprotect.mail.edit (own email), userprotect.pass.edit (own
    password), and userprotect.account.edit (own account), not by protection rules.
  bundle: userprotect
  rubric_ref: rubric/userprotect_userprotect_self_edit@1.0
  tags:
  - mode:recipe
- id: userprotect-configure-route
  input: Where do I manage User Protect protection rules in the admin UI, and what is the route name?
  criteria: Admin > Configuration > People > User protect at /admin/config/people/userprotect; route userprotect.rule_list
    (the module's configure route), gated by userprotect.administer.
  bundle: userprotect
  rubric_ref: rubric/userprotect_userprotect_configure_route@1.0
  tags:
  - mode:recipe
