metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: user_redirect
  version: 2.0.x
  note: 'User Redirect redirects users after login/logout to a per-role internal/external URL. All state
    lives in the schema-less config object user_redirect.settings (login.<role>.redirect_url + weight,
    logout.<role>.redirect_url + weight, ignore[], ignore_for{login,logout}); there is no config/install
    file so the object does not exist until the settings form is saved. Baseline on this site = config
    absent. Medium cases write known keys and read them back; hard cases delete the config (verify FAILS
    on the empty baseline) and require the agent to set the right key. Roles present on this site: anonymous,
    authenticated, content_editor, administrator.'
questions:
- id: user_redirect-where-configured
  input: On a Drupal 11 site I enabled the user_redirect module. Where do I configure where users go after
    login/logout, and where is that stored in config?
  criteria: Configure it on the settings form at /admin/people/users/redirect/form/settings (route user_redirect.settings,
    permission 'administer user redirect settings'). Values are stored in the user_redirect.settings config
    object under login.<role_id>.redirect_url/weight and logout.<role_id>.redirect_url/weight, plus ignore[]
    and ignore_for.
  bundle: user_redirect
  rubric_ref: rubric/user_redirect_user_redirect_where_configured@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: user_redirect-internal-vs-external
  input: How does the user_redirect module actually perform the redirect for an internal path versus an
    external URL after login, and how does it choose when a user has several roles?
  criteria: For an internal path it sets the request's 'destination' query parameter (core then redirects
    there); for an external URL (UrlHelper::isExternal) it sends a TrustedRedirectResponse immediately.
    When the user has several roles it reverses the roles and applies the first role that has a non-empty
    redirect_url (last role in the account's list wins).
  bundle: user_redirect
  rubric_ref: rubric/user_redirect_user_redirect_internal_vs_external@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: user_redirect-ignore-default
  input: The user_redirect module has an 'Ignore paths' setting. What path does it ignore by default and
    why does that matter?
  criteria: The default ignore list contains /user/reset/* so that one-time login / password-reset links
    are not hijacked by the redirect. The ignore check runs only when ignore_for.login (or .logout) is
    enabled, matching the current path's alias against the patterns.
  bundle: user_redirect
  rubric_ref: rubric/user_redirect_user_redirect_ignore_default@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: user_redirect-known-login
  input: This Drupal site already has the user_redirect module configured. Inspect the live configuration
    and tell me where a user with the 'administrator' role will be redirected after they log in.
  criteria: The administrator role's login redirect is /admin/content (user_redirect.settings login.administrator.redirect_url
    = /admin/content).
  bundle: user_redirect
  rubric_ref: rubric/user_redirect_user_redirect_known_login@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/user_redirect-known-login-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/user_redirect-known-login-cleanup.sh
- id: user_redirect-ignore-paths
  input: On this site, user_redirect is configured to skip the redirect on certain paths for login. Inspect
    the live configuration and list the ignore path patterns that are in effect.
  criteria: The ignore list is /user/reset/* and /promo/*, applied for login (user_redirect.settings ignore
    = [/user/reset/*, /promo/*], ignore_for.login enabled).
  bundle: user_redirect
  rubric_ref: rubric/user_redirect_user_redirect_ignore_paths@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/user_redirect-ignore-paths-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/user_redirect-ignore-paths-cleanup.sh
- id: user_redirect-login-admin
  input: On this Drupal site, use the user_redirect module to configure that users with the 'administrator'
    role are redirected to /admin/content immediately after they log in. Apply the change to the live
    site.
  criteria: Set user_redirect.settings login.administrator.redirect_url to /admin/content (via the settings
    form at /admin/people/users/redirect/form/settings or drush config).
  bundle: user_redirect
  rubric_ref: rubric/user_redirect_user_redirect_login_admin@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/user_redirect-login-admin-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/user_redirect-login-admin-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/user_redirect-login-admin-verify.sh
- id: user_redirect-logout-auth
  input: On my Drupal site I want every logged-in (authenticated) user to be sent to the home page when
    they log out. Set this up using the user_redirect module.
  criteria: Set user_redirect.settings logout.authenticated.redirect_url to / (the front page) for the
    authenticated role.
  bundle: user_redirect
  rubric_ref: rubric/user_redirect_user_redirect_logout_auth@1.0
  tags:
