metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: user_registrationpassword
  version: 2.0.x
  note: User Registration Password lets visitors set a password on the registration form when email verification
    is required, and takes over the activation email. It has no dedicated settings page; it alters core's
    Account settings form (route entity.user.admin_form, /admin/config/people/accounts). All persistent
    state is the config object user_registrationpassword.settings (registration in {none=NO_VERIFICATION,
    default=VERIFICATION_DEFAULT, with-pass=VERIFICATION_PASS; default with-pass}, registration_ftll_expire
    bool, registration_ftll_timeout int seconds default 86400, registration_redirect path, notify.register_confirmation_with_pass)
    plus user_registrationpassword.mail. It adds token [user:registrationpassword-url], confirm route
    user_registrationpassword.confirm, and a REST resource at /user/registerpass. Medium cases seed known
    values into user_registrationpassword.settings; hard cases mutate it, verified against live config.
    Scripts touch only this module's config (never core user.settings).
questions:
- id: user_registrationpassword-mode-key
  input: In the Drupal user_registrationpassword module, which config object and key select the registration/verification
    behaviour, and what are its three allowed values?
  criteria: The config object user_registrationpassword.settings, key 'registration', accepts 'none' (NO_VERIFICATION),
    'default' (VERIFICATION_DEFAULT), or 'with-pass' (VERIFICATION_PASS, the shipped default).
  bundle: user_registrationpassword
  rubric_ref: rubric/user_registrationpassword_user_registrationpassword_mode_key@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: user_registrationpassword-where-configured
  input: There is no separate settings page for user_registrationpassword. Where do I configure it in
