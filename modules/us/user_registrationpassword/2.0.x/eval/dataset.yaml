  criteria: 'It alters core''s Account settings form: route entity.user.admin_form at /admin/config/people/accounts.'
  bundle: user_registrationpassword
  rubric_ref: rubric/user_registrationpassword_user_registrationpassword_where_configured@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: user_registrationpassword-token
  input: Which token does user_registrationpassword add so the activation/confirmation link can be placed
