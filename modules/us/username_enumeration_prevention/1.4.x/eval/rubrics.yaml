rubrics:
- id: username_enumeration_prevention_uep_vectors_closed
  version: '1.0'
  applicable_bundles:
  - username_enumeration_prevention
  checks:
  - kind: must_contain_any
    values:
    - password
    - forgot
    - reset
  scoring:
    combine: all_pass
- id: username_enumeration_prevention_uep_user_route_404
  version: '1.0'
  applicable_bundles:
  - username_enumeration_prevention
  checks:
  - kind: must_contain_any
    values:
    - '404'
    - NotFoundHttpException
    - not found
  scoring:
    combine: all_pass
- id: username_enumeration_prevention_uep_generic_reset_message
  version: '1.0'
  applicable_bundles:
  - username_enumeration_prevention
  checks:
  - kind: must_contain_any
    values:
    - user_pass
    - username_enumeration_prevention_pass_validate
    - clearErrors
    - clears
  scoring:
    combine: all_pass
- id: username_enumeration_prevention_uep_no_configuration
  version: '1.0'
  applicable_bundles:
  - username_enumeration_prevention
  checks:
  - kind: must_contain_any
    values:
    - no configuration
    - no settings
    - enable
    - nothing
  scoring:
    combine: all_pass
- id: username_enumeration_prevention_uep_permission_that_defeats
  version: '1.0'
  applicable_bundles:
  - username_enumeration_prevention
  checks:
  - kind: must_contain_any
    values:
    - access user profiles
  scoring:
    combine: all_pass
- id: username_enumeration_prevention_uep_dependencies
  version: '1.0'
  applicable_bundles:
  - username_enumeration_prevention
  checks:
  - kind: must_contain_any
    values:
    - user
  scoring:
    combine: all_pass
- id: username_enumeration_prevention_uep_route_discovery
  version: '1.0'
  applicable_bundles:
  - username_enumeration_prevention
  checks:
  - kind: must_contain_any
    values:
    - link template
    - getLinkTemplates
    - entity:user
    - '{user}'
  scoring:
    combine: all_pass
