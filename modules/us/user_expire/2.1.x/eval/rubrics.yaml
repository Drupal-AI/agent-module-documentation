rubrics:
- id: user_expire_user_expire_per_user_how
  version: '1.0'
  applicable_bundles:
  - user_expire
  checks:
  - kind: must_contain_any
    values:
    - set user expiration
    - user edit form
    - user_expire
    - expiration date
  scoring:
    combine: all_pass
- id: user_expire_user_expire_role_inactivity
  version: '1.0'
  applicable_bundles:
  - user_expire
  checks:
  - kind: must_contain_any
    values:
    - user_expire_roles
    - inactivity
    - '0'
  scoring:
    combine: all_pass
- id: user_expire_user_expire_report
  version: '1.0'
  applicable_bundles:
  - user_expire
  checks:
  - kind: must_contain_any
    values:
    - /admin/reports/expiring-users
    - view expiring users report
    - Expiring users
  scoring:
    combine: all_pass
- id: user_expire_user_expire_live_role
  version: '1.0'
  applicable_bundles:
  - user_expire
  checks:
  - kind: must_contain_any
    values:
    - content_editor
  scoring:
    combine: all_pass
- id: user_expire_user_expire_live_warnings
  version: '1.0'
  applicable_bundles:
  - user_expire
  checks:
  - kind: must_contain_any
    values:
    - 'false'
    - disabled
    - 'off'
    - not sending
    - 'no'
  scoring:
    combine: all_pass
- id: user_expire_user_expire_role_rule
  version: '1.0'
  applicable_bundles:
  - user_expire
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
- id: user_expire_user_expire_warning_timing
  version: '1.0'
  applicable_bundles:
  - user_expire
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
