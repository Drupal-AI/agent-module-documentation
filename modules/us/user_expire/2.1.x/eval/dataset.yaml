metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: user_expire
  version: 2.1.x
  note: User Expire blocks accounts either per-user on a set date (stored in the user_expire DB table)
    or per-role after N seconds of inactivity (config user_expire.settings:user_expire_roles). Warning
    emails are governed by send_expiration_warnings, offset (secs before expiry), and frequency (secs
    between sends). Blocking runs on hook_cron. Live-state cases are config-based (role rules + warning
    settings) because saving user entities on this shared site currently fatals in an unrelated module
    (salesforce_example); the per-user table workflow is documented and covered by recipe cases. Configure
    route user_expire.admin; permissions set user expiration / view expiring users report / administer
    user expire settings.
questions:
- id: user_expire-per-user-how
  input: Using the user_expire module, how do I make a single Drupal user account automatically get blocked
    on a specific date, and what permission is needed to set that?
  criteria: With the 'set user expiration' permission, edit that user's account; a 'User expiration' section
    lets you tick a box and choose an expiration date. The date is stored (as a Unix timestamp) in the
    user_expire database table keyed by uid, and hook_cron blocks the account once the date passes.
  bundle: user_expire
  rubric_ref: rubric/user_expire_user_expire_per_user_how@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: user_expire-role-inactivity
  input: In the user_expire module, which configuration controls blocking accounts after a period of inactivity
    per role, and what does a value of 0 mean?
  criteria: The user_expire.settings:user_expire_roles map holds, per role machine name, the number of
    seconds of inactivity before accounts with that role are blocked. A value of 0 (or an absent role)
    means that role never expires. Inactivity is measured from last access (or account creation if never
    logged in).
  bundle: user_expire
  rubric_ref: rubric/user_expire_user_expire_role_inactivity@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: user_expire-report
  input: Where can an administrator see which user accounts are about to expire on a site running the
    user_expire module, and what permission gates that page?
  criteria: The Expiring users report at /admin/reports/expiring-users (route expiring_users.admin), gated
    by the 'view expiring users report' permission, lists accounts that have a pending expiration date.
  bundle: user_expire
  rubric_ref: rubric/user_expire_user_expire_report@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: user_expire-live-role
  input: On this Drupal site, user_expire has been configured to expire one role's accounts after a period
    of inactivity. Inspect the live configuration and state which role machine name has an inactivity
    expiration set.
  criteria: The content_editor role has an inactivity expiration of 7776000 seconds (90 days) in user_expire.settings:user_expire_roles.
    Check with `drush config:get user_expire.settings user_expire_roles`.
  bundle: user_expire
  rubric_ref: rubric/user_expire_user_expire_live_role@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/user_expire-live-role-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/user_expire-live-role-cleanup.sh
- id: user_expire-live-warnings
  input: Is this site's user_expire module currently sending account-expiration warning emails to users?
    Inspect the live configuration and state the value of the relevant setting.
  criteria: 'No: user_expire.settings:send_expiration_warnings is false on the live site, so no expiration
    warning emails are sent (drush config:get user_expire.settings send_expiration_warnings).'
  bundle: user_expire
  rubric_ref: rubric/user_expire_user_expire_live_warnings@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/user_expire-live-warnings-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/user_expire-live-warnings-cleanup.sh
- id: user_expire-role-rule
  input: On this Drupal site, configure the user_expire module so that authenticated users are automatically
    blocked after 90 days of inactivity. Apply the change to the live site.
  criteria: Set user_expire.settings:user_expire_roles['authenticated'] to 7776000 (90 days in seconds)
    — via the per-role field on /admin/config/people/user-expire or by editing the config. Verified when
    the authenticated key equals 7776000.
  bundle: user_expire
  rubric_ref: rubric/user_expire_user_expire_role_rule@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/user_expire-role-rule-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/user_expire-role-rule-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/user_expire-role-rule-verify.sh
- id: user_expire-warning-timing
  input: On this Drupal site, configure user_expire's expiration-warning emails to begin 14 days before
    an account expires and to be re-sent no more often than once per day. Apply the change to the live
    site.
  criteria: Set user_expire.settings:offset = 1209600 (14 days) and frequency = 86400 (1 day), both in
    seconds. Verified when offset is 1209600 and frequency is 86400.
  bundle: user_expire
  rubric_ref: rubric/user_expire_user_expire_warning_timing@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/user_expire-warning-timing-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/user_expire-warning-timing-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/user_expire-warning-timing-verify.sh
