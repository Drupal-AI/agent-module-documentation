rubrics:
- id: user_current_paths_user_current_paths_what_paths
  version: '1.0'
  applicable_bundles:
  - user_current_paths
  checks:
  - kind: must_contain_any
    values:
    - /user/current
    - /user/edit
    - /user/current/
    - user/{uid}
  scoring:
    combine: all_pass
- id: user_current_paths_user_current_paths_resolution_and_404
  version: '1.0'
  applicable_bundles:
  - user_current_paths
  checks:
