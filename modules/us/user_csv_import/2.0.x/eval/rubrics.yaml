rubrics:
- id: user_csv_import_user_csv_import_where
  version: '1.0'
  applicable_bundles:
  - user_csv_import
  checks:
  - kind: must_contain_any
    values:
    - /admin/people/import
    - administer users
    - Import users from CSV
    - People
  scoring:
    combine: all_pass
- id: user_csv_import_user_csv_import_csv_structure
  version: '1.0'
  applicable_bundles:
  - user_csv_import
  checks:
  - kind: must_contain_any
    values:
    - name
    - mail
    - machine name
    - header
    - first row
  scoring:
    combine: all_pass
- id: user_csv_import_user_csv_import_password
  version: '1.0'
  applicable_bundles:
  - user_csv_import
  checks:
  - kind: must_contain_any
    values:
    - default password
    - pass
    - Save configuration
    - user_csv_import.importconfig
  scoring:
    combine: all_pass
- id: user_csv_import_user_csv_import_known_password
  version: '1.0'
  applicable_bundles:
  - user_csv_import
  checks:
  - kind: must_contain_any
    values:
    - UcsvKnownPw123
  scoring:
    combine: all_pass
- id: user_csv_import_user_csv_import_known_email
  version: '1.0'
  applicable_bundles:
  - user_csv_import
  checks:
  - kind: must_contain_any
    values:
    - register_admin_created
  scoring:
    combine: all_pass
- id: user_csv_import_user_csv_import_save_config
  version: '1.0'
  applicable_bundles:
  - user_csv_import
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
- id: user_csv_import_user_csv_import_welcome_email
  version: '1.0'
  applicable_bundles:
  - user_csv_import
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
