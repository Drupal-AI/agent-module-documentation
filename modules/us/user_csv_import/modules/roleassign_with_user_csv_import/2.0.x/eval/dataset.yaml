metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: roleassign_with_user_csv_import
  version: 2.0.x
  note: 'roleassign_with_user_csv_import is a glue submodule of user_csv_import. Its only behaviour is
    hook_form_alter on the user_csv_import_form: it intersects the form''s Roles checkbox #options with
    the assignable roles configured in RoleAssign (roleassign.settings -> roleassign_roles). It has no
    config, permissions, schema, services or Drush of its own. All medium/hard cases are therefore grounded
    in the roleassign.settings.roleassign_roles config object (a simple config write) that drives the
    integration; the import form''s rendered role list is derived from it. The site''s existing roles
    are anonymous, authenticated, content_editor, administrator.'
questions:
- id: roleassign_with_user_csv_import-what
  input: What does the roleassign_with_user_csv_import module do, and which two modules does it connect?
  criteria: It is a glue module between User CSV Import and RoleAssign. It alters the user_csv_import_form
    so its Roles checkboxes only show the roles the current user may assign per RoleAssign (intersecting
    the form options with roleassign.settings roleassign_roles), so the form's visuals match what RoleAssign
    will actually allow.
  bundle: roleassign_with_user_csv_import
  rubric_ref: rubric/roleassign_with_user_csv_import_roleassign_with_user_csv_import_what@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: roleassign_with_user_csv_import-config-source
  input: Which configuration decides the roles shown on the User CSV Import form when roleassign_with_user_csv_import
    is enabled, and does this submodule add its own settings?
  criteria: 'It reads RoleAssign''s own configuration: roleassign.settings -> roleassign_roles (the list
    of assignable roles). The submodule has no settings of its own; if roleassign_roles is empty it does
    not filter the form.'
  bundle: roleassign_with_user_csv_import
  rubric_ref: rubric/roleassign_with_user_csv_import_roleassign_with_user_csv_import_config_source@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: roleassign_with_user_csv_import-known
  input: On this site, RoleAssign restricts which roles a delegated admin may assign, and this drives
    the User CSV Import form. Inspect the live configuration and state which role(s) the import form will
    offer.
  criteria: roleassign.settings roleassign_roles = [content_editor], so the User CSV Import form's Roles
    checkboxes are filtered to just content_editor (plus the always-mandatory Authenticated). Read with
    `drush cget roleassign.settings roleassign_roles`.
  bundle: roleassign_with_user_csv_import
  rubric_ref: rubric/roleassign_with_user_csv_import_roleassign_with_user_csv_import_known@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/roleassign_with_user_csv_import-known-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/roleassign_with_user_csv_import-known-cleanup.sh
- id: roleassign_with_user_csv_import-two
  input: This site has RoleAssign configured with a set of assignable roles that the CSV import form respects.
    Inspect the live configuration and list every role that the import form will show as selectable.
  criteria: roleassign.settings roleassign_roles = [content_editor, administrator]; the import form will
    offer content_editor and administrator (the submodule intersects the form's role options with this
    list).
  bundle: roleassign_with_user_csv_import
  rubric_ref: rubric/roleassign_with_user_csv_import_roleassign_with_user_csv_import_two@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/roleassign_with_user_csv_import-two-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/roleassign_with_user_csv_import-two-cleanup.sh
- id: roleassign_with_user_csv_import-single
  input: Configure this site so that, via RoleAssign, the ONLY role a delegated admin may assign (and
    therefore the only non-mandatory role the User CSV Import form offers) is content_editor. Apply the
    change to the live site.
  criteria: Set roleassign.settings roleassign_roles so content_editor is the only assignable role (e.g.
    via RoleAssign's settings form at /admin/config/people/roleassign, or the config API).
  bundle: roleassign_with_user_csv_import
  rubric_ref: rubric/roleassign_with_user_csv_import_roleassign_with_user_csv_import_single@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/roleassign_with_user_csv_import-single-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/roleassign_with_user_csv_import-single-reset.sh
    verify: agent-module-documentation/evaluation/verify/roleassign_with_user_csv_import-single-verify.sh
- id: roleassign_with_user_csv_import-pair
  input: Configure RoleAssign on this site so that delegated admins may assign both the content_editor
    and administrator roles - which is exactly what the User CSV Import form will then offer. Apply the
    change to the live site.
  criteria: Set roleassign.settings roleassign_roles to include both content_editor and administrator.
  bundle: roleassign_with_user_csv_import
  rubric_ref: rubric/roleassign_with_user_csv_import_roleassign_with_user_csv_import_pair@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/roleassign_with_user_csv_import-pair-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/roleassign_with_user_csv_import-pair-reset.sh
    verify: agent-module-documentation/evaluation/verify/roleassign_with_user_csv_import-pair-verify.sh
