metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: dropsolid_purge
  version: 1.1.x
  note: Dropsolid Purge is a plugin for the contrib purge framework that invalidates Varnish. It has no
    configure route/form; config is the dropsolid_purge.config array (site_name, site_environment, site_group,
    loadbalancers[{ip,protocol,port}]) normally set in settings.php, and the purger (plugin id dropsolid_purge,
    types tag/everything) is enabled via Purge (drush p:purger-add dropsolid_purge, stored in purge.plugins.purgers).
    It emits X-Dropsolid-Site and X-Dropsolid-Purge-Tags headers. ALL eval cases are grounded in LOCAL
    config only (dropsolid_purge.config as a plain config object, and purge.plugins) - NO live Varnish/HTTP
    calls are made. Reset scripts only remove dropsolid_purge's own purger entries and its own config
    object, leaving other purgers untouched.
questions:
- id: dropsolid_purge-config-object
  input: I installed the dropsolid_purge module on Drupal but there is no settings page. Where do I configure
    the Varnish load balancers, and what is the name of the configuration array/object it reads?
  criteria: There is no admin form. You set $config['dropsolid_purge.config'] in settings.php (the dropsolid_purge.config
    object) with site_name, site_environment, site_group and a loadbalancers list of {ip, protocol, port}.
  bundle: dropsolid_purge
  rubric_ref: rubric/dropsolid_purge_dropsolid_purge_config_object@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: dropsolid_purge-purger-types
  input: In the dropsolid_purge module, what is the Purge purger plugin id, and which invalidation types
    does it support?
  criteria: The purger plugin id is dropsolid_purge ('Dropsolid Varnish Purge'); it supports the 'tag'
    and 'everything' invalidation types. You add it with drush p:purger-add dropsolid_purge.
  bundle: dropsolid_purge
  rubric_ref: rubric/dropsolid_purge_dropsolid_purge_purger_types@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: dropsolid_purge-site-header
  input: How does dropsolid_purge make sure that purging one Drupal site behind a shared Varnish does
    not clear the cache of another site? Name the response header involved.
  criteria: It emits an X-Dropsolid-Site header (a per-site identifier hashed from site name/path/environment/group)
    that Varnish bans against, so a BAN only matches this site's objects; cache tags are sent hashed in
    X-Dropsolid-Purge-Tags.
  bundle: dropsolid_purge
  rubric_ref: rubric/dropsolid_purge_dropsolid_purge_site_header@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: dropsolid_purge-known-sitename
  input: On this Drupal site, dropsolid_purge is configured. Inspect the live dropsolid_purge configuration
    and state the configured site_name.
  criteria: dropsolid_purge.config has site_name 'DocSite'.
  bundle: dropsolid_purge
  rubric_ref: rubric/dropsolid_purge_dropsolid_purge_known_sitename@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/dropsolid_purge-known-sitename-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/dropsolid_purge-known-sitename-cleanup.sh
- id: dropsolid_purge-known-loadbalancer
  input: The dropsolid_purge module is configured on this site with a Varnish load balancer. Inspect the
    live dropsolid_purge configuration and state the IP address of the configured load balancer.
  criteria: dropsolid_purge.config -> loadbalancers.varnish.ip is 203.0.113.9 (protocol http, port 6081).
  bundle: dropsolid_purge
  rubric_ref: rubric/dropsolid_purge_dropsolid_purge_known_loadbalancer@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/dropsolid_purge-known-loadbalancer-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/dropsolid_purge-known-loadbalancer-cleanup.sh
- id: dropsolid_purge-add-purger
  input: On this Drupal site the dropsolid_purge module is enabled but its purger has not been added to
    Purge yet. Add the Dropsolid Varnish Purge purger to Purge so it is configured to run. Apply the change
    to the live site.
  criteria: purge.plugins -> purgers contains an entry with plugin_id 'dropsolid_purge' (e.g. added with
    `drush p:purger-add dropsolid_purge`).
  bundle: dropsolid_purge
  rubric_ref: rubric/dropsolid_purge_dropsolid_purge_add_purger@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/dropsolid_purge-add-purger-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/dropsolid_purge-add-purger-reset.sh
    verify: agent-module-documentation/evaluation/verify/dropsolid_purge-add-purger-verify.sh
- id: dropsolid_purge-configure-lb
  input: 'Configure the dropsolid_purge module''s settings on this site: set site_name to ''AcmeProd''
    and add a single Varnish load balancer named ''varnish'' at IP 198.51.100.20 on port 8080 using the
    http protocol. Write it to the dropsolid_purge configuration on the live site.'
  criteria: dropsolid_purge.config has site_name 'AcmeProd' and loadbalancers.varnish.ip '198.51.100.20'
    with port '8080' (protocol http).
  bundle: dropsolid_purge
  rubric_ref: rubric/dropsolid_purge_dropsolid_purge_configure_lb@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/dropsolid_purge-configure-lb-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/dropsolid_purge-configure-lb-reset.sh
    verify: agent-module-documentation/evaluation/verify/dropsolid_purge-configure-lb-verify.sh
