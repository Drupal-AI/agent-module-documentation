rubrics:
- id: drupal_cms_helper_dch_what_is_site_export
  version: '1.0'
  applicable_bundles:
  - drupal_cms_helper
  checks:
  - kind: must_contain_any
    values:
    - recipe
    - site:export
  scoring:
    combine: all_pass
- id: drupal_cms_helper_dch_config_actions
  version: '1.0'
  applicable_bundles:
  - drupal_cms_helper
  checks:
  - kind: must_contain_any
    values:
    - setDefaultImage
    - themeDevelopmentMode
  scoring:
    combine: all_pass
- id: drupal_cms_helper_dch_generic_config_export
  version: '1.0'
  applicable_bundles:
  - drupal_cms_helper
  checks:
  - kind: must_contain_any
    values:
    - uuid
    - _core
  scoring:
    combine: all_pass
- id: drupal_cms_helper_dch_default_image_introspect
  version: '1.0'
  applicable_bundles:
  - drupal_cms_helper
  checks:
  - kind: must_contain_any
    values:
    - aaaaaaaa-1111-2222-3333-444444444444
  scoring:
    combine: all_pass
- id: drupal_cms_helper_dch_theme_dev_mode_introspect
  version: '1.0'
  applicable_bundles:
  - drupal_cms_helper
  checks:
  - kind: must_contain_any
    values:
    - enabled
    - 'true'
    - twig_debug
  scoring:
    combine: all_pass
- id: drupal_cms_helper_dch_generic_export_build
  version: '1.0'
  applicable_bundles:
  - drupal_cms_helper
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
- id: drupal_cms_helper_dch_default_image_build
  version: '1.0'
  applicable_bundles:
  - drupal_cms_helper
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
- id: drupal_cms_helper_dch_theme_dev_mode_build
  version: '1.0'
  applicable_bundles:
  - drupal_cms_helper
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
