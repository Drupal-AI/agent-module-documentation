metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: dropdown_language
  version: 4.1.x
  note: 'Dropdown Language Switcher provides one derived block plugin plus one global settings config
    object (dropdown_language.setting). Cases are `recipe` (response-graded): they probe documented facts
    an agent would otherwise read source to answer; no site mutation.'
questions:
- id: dropdown_language-what-it-provides
  input: What does the Dropdown Language Switcher module add to a Drupal site, and how does its output
    differ from core's language switcher block?
  criteria: It provides a language switcher block that renders the switch links as a single core Dropbutton
    dropdown, instead of core's plain unordered list of links.
  bundle: dropdown_language
  rubric_ref: rubric/dropdown_language_dropdown_language_what_it_provides@1.0
  tags:
  - mode:recipe
- id: dropdown_language-settings-route
  input: Where is the global settings form for Dropdown Language Switcher and what permission gates it?
  criteria: Route dropdown_language.setting at /admin/config/regional/dropdown-language-switcher (Configuration
    > Regional and language > Dropdown Language Switcher), gated by the 'administer site configuration'
    permission.
  bundle: dropdown_language
  rubric_ref: rubric/dropdown_language_dropdown_language_settings_route@1.0
  tags:
  - mode:recipe
- id: dropdown_language-label-modes
  input: Which config key on dropdown_language.setting controls how languages are labelled in the dropdown,
    and what are the possible values?
  criteria: 'The display_language_id key: 0 = Language Name, 1 = Language ID (uppercased code), 2 = Native
    Name, 3 = Custom Labels.'
  bundle: dropdown_language
  rubric_ref: rubric/dropdown_language_dropdown_language_label_modes@1.0
  tags:
  - mode:recipe
- id: dropdown_language-custom-labels-storage
  input: When Custom Labels mode is selected in Dropdown Language Switcher, where are the per-language
    label texts entered and stored?
  criteria: Custom labels are entered per placed block instance (textfield per language) and stored in
    that block's own configuration under the `labels` key, not in the global dropdown_language.setting
    object.
  bundle: dropdown_language
  rubric_ref: rubric/dropdown_language_dropdown_language_custom_labels_storage@1.0
  tags:
  - mode:recipe
- id: dropdown_language-dependencies
  input: What modules does Dropdown Language Switcher depend on, and does it need any external libraries,
    Drush commands, or custom permissions?
  criteria: It depends only on core `language` and `block`. No external libraries, no Drush commands,
    and no custom permissions (the settings form uses core's 'administer site configuration').
  bundle: dropdown_language
  rubric_ref: rubric/dropdown_language_dropdown_language_dependencies@1.0
  tags:
  - mode:recipe
- id: dropdown_language-visibility
  input: Under what conditions does the Dropdown Language block render nothing, and which setting can
    force it to stay visible?
  criteria: It is only allowed on multilingual sites (2+ languages), returns nothing on 403/404 pages,
    and normally hides when fewer than two links are available; the always_show_block setting forces it
    to keep rendering.
  bundle: dropdown_language
  rubric_ref: rubric/dropdown_language_dropdown_language_visibility@1.0
  tags:
  - mode:recipe
- id: dropdown_language-per-language-type
  input: Why does Dropdown Language Switcher show multiple 'Dropdown Language' block entries in Block
    layout on some sites?
  criteria: The block plugin is derived per configurable language type (Interface, Content, URL, ...)
    via a deriver, so there is one block entry per language negotiation type; with a single configurable
    type it is just 'Dropdown Language'.
  bundle: dropdown_language
  rubric_ref: rubric/dropdown_language_dropdown_language_per_language_type@1.0
  tags:
  - mode:recipe
- id: dropdown_language-seo-filter
  input: What does the filter_untranslated setting do in Dropdown Language Switcher, and why is it described
    as an SEO enhancement?
  criteria: When enabled (1), on entity routes it removes dropdown links to translations that do not exist
    or that the user's role cannot view, so no links to non-existent pages are emitted, improving SEO.
  bundle: dropdown_language
  rubric_ref: rubric/dropdown_language_dropdown_language_seo_filter@1.0
  tags:
  - mode:recipe
