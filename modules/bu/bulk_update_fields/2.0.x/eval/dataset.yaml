metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: bulk_update_fields
  version: 2.0.x
  note: 'Bulk Update Fields registers a core Action plugin (bulk_update_fields_action_base) that mass-updates
    field values across selected entities through a multi-step confirm form (/admin/bulk_update_fields)
    and a batch; the actual update is UI/batch driven and has no headless API. Its one persistent, scriptable
    configuration is bulk_update_fields.settings:exclude — a sequence of field machine names removed from
    the bulk-update field picker; the exclude form (/admin/bulk_update_fields/exclude) is the module''s
    configure route. Permissions: ''administer bulk_update_fields'' plus a mis-spelled ''exlude bulk_update_fields''
    whose route requires ''exclude bulk_update_fields''. Medium/hard cases are grounded in the exclude
    config (read it back / write it), verified by reading bulk_update_fields.settings via drush.'
questions:
- id: bulk_update_fields-how-to-run
  input: Using the bulk_update_fields module on a Drupal site, how do I set the same value on a field
    across many nodes at once? Describe the entry point and the action.
  criteria: 'Go to /admin/content, select the nodes, choose the ''Bulk Update … Fields'' action (plugin
    bulk_update_fields_action_base) and Apply. You are taken to a multi-step form (/admin/bulk_update_fields):
    pick the field(s), enter the new value, confirm, then a batch writes the values.'
  bundle: bulk_update_fields
  rubric_ref: rubric/bulk_update_fields_bulk_update_fields_how_to_run@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: bulk_update_fields-exclude-config
  input: In the bulk_update_fields module, where is the list of fields that are excluded from bulk updates
    stored (config object and key), and what page edits it?
  criteria: It is stored in the bulk_update_fields.settings config object under the 'exclude' key (a sequence
    of field machine names). It is edited on the exclude form at /admin/bulk_update_fields/exclude (the
    module's configure route, bulk_update_fields.bulk_update_exclude_form).
  bundle: bulk_update_fields
  rubric_ref: rubric/bulk_update_fields_bulk_update_fields_exclude_config@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: bulk_update_fields-permission
  input: Which permission does the bulk_update_fields module require to reach its bulk-update form and
    run the action?
  criteria: 'The ''administer bulk_update_fields'' permission (restrict access: TRUE) gates the update
    form/action at /admin/bulk_update_fields. (Note: the exclude form''s route requires ''exclude bulk_update_fields'',
    but the defined permission key is mis-spelled ''exlude bulk_update_fields''.)'
  bundle: bulk_update_fields
  rubric_ref: rubric/bulk_update_fields_bulk_update_fields_permission@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: bulk_update_fields-exclude-known
  input: On this Drupal site the bulk_update_fields exclude list has been configured. Inspect the live
    bulk_update_fields.settings configuration and name a custom field (machine name) that is currently
    excluded from bulk updates.
  criteria: field_buf_probe_a is in bulk_update_fields.settings:exclude (alongside body). Read it with
    `drush cget bulk_update_fields.settings exclude`.
  bundle: bulk_update_fields
  rubric_ref: rubric/bulk_update_fields_bulk_update_fields_exclude_known@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/bulk_update_fields-exclude-known-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/bulk_update_fields-exclude-known-cleanup.sh
- id: bulk_update_fields-exclude-single
  input: Inspect this site's bulk_update_fields configuration and state exactly which field is currently
    excluded from the bulk-update field picker.
  criteria: 'Only field_buf_probe_only is excluded: bulk_update_fields.settings:exclude == [''field_buf_probe_only''].
    Discoverable via `drush cget bulk_update_fields.settings exclude`.'
  bundle: bulk_update_fields
  rubric_ref: rubric/bulk_update_fields_bulk_update_fields_exclude_single@1.0
  tags:
  - mode:introspection
