rubrics:
- id: button_link_button_link_formatter_id
  version: '1.0'
  applicable_bundles:
  - button_link
  checks:
  - kind: must_contain_any
    values:
    - button_link
    - Link as Button
    - Manage display
    - link
  scoring:
    combine: all_pass
- id: button_link_button_link_btn_types
  version: '1.0'
  applicable_bundles:
  - button_link
  checks:
  - kind: must_contain_any
    values:
    - btn_type
    - btn-primary
    - btn-danger
    - btn-success
  scoring:
    combine: all_pass
- id: button_link_button_link_icon
  version: '1.0'
  applicable_bundles:
  - button_link
  checks:
  - kind: must_contain_any
    values:
    - icon_class
    - fa fa-
    - link-formatter-button-link.html.twig
    - link_formatter_button_link
  scoring:
    combine: all_pass
- id: button_link_button_link_known_btntype
  version: '1.0'
  applicable_bundles:
  - button_link
  checks:
  - kind: must_contain_any
    values:
    - btn-success
  scoring:
    combine: all_pass
- id: button_link_button_link_known_icon
  version: '1.0'
  applicable_bundles:
  - button_link
  checks:
  - kind: must_contain_any
    values:
    - fa fa-anchor
  scoring:
    combine: all_pass
- id: button_link_button_link_apply_formatter
  version: '1.0'
  applicable_bundles:
  - button_link
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
- id: button_link_button_link_large_with_icon
  version: '1.0'
  applicable_bundles:
  - button_link
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
