metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: oembed_providers
  version: 2.2.x
  note: 'oEmbed Providers extends core Media with two config entities (custom provider + provider bucket),
    a ProviderRepository decorator, a media source override, one permission, and an alter hook. Cases
    are `recipe` (response-graded): they probe documented facts an agent would otherwise read source to
    answer; no site mutation.'
questions:
- id: oembed-providers-add-custom-provider
  input: On a Drupal 11 site with core Media, I need to embed content from a provider that core does not
    list (it isn't in oembed.com/providers.json). How do I add a custom oEmbed provider so core Media
    will use it? Name the module and the config entity.
  criteria: Install the oEmbed Providers module and add a custom provider (the oembed_provider config
    entity) at /admin/config/media/oembed-providers/custom-providers, giving a provider name, provider
    URL and endpoint(s). It is merged into Media's provider list.
  bundle: oembed_providers
  rubric_ref: rubric/oembed_providers_oembed_providers_add_custom_provider@1.0
  tags:
  - mode:recipe
- id: oembed-providers-config-entities
  input: Which two config entity types does the oEmbed Providers module define, and what are their config
    prefixes?
  criteria: oembed_provider (config prefix 'provider', i.e. oembed_providers.provider.*) and oembed_provider_bucket
    (config prefix 'bucket', i.e. oembed_providers.bucket.*).
  bundle: oembed_providers
  rubric_ref: rubric/oembed_providers_oembed_providers_config_entities@1.0
  tags:
  - mode:recipe
- id: oembed-providers-bucket-media-source
  input: I want a Media type that only accepts a specific set of oEmbed providers. Using oEmbed Providers,
    how do I restrict the allowed providers, and what is the resulting media source machine name for a
    bucket whose machine name is 'remote_image'?
  criteria: Create a provider bucket selecting the allowed providers; it is exposed as a media source
    named oembed:{bucket_id} (here oembed:remote_image). Assign that source to the Media type to restrict
    its providers.
  bundle: oembed_providers
  rubric_ref: rubric/oembed_providers_oembed_providers_bucket_media_source@1.0
  tags:
  - mode:recipe
- id: oembed-providers-override-video
  input: With oEmbed Providers, how can I override core Media's default 'Remote video' (oembed:video)
    media source so it uses my own chosen providers?
  criteria: Create a provider bucket with the machine name 'video' — it produces the oembed:video source
    and overrides core's default Remote video source.
  bundle: oembed_providers
  rubric_ref: rubric/oembed_providers_oembed_providers_override_video@1.0
  tags:
  - mode:recipe
- id: oembed-providers-repository-decorator
  input: How does the oEmbed Providers module get its custom providers into the list that core Media actually
    uses? Name the mechanism/service.
  criteria: It decorates the core media.oembed.provider_repository service with ProviderRepositoryDecorator,
    whose getAll() merges custom providers into the fetched provider list.
  bundle: oembed_providers
  rubric_ref: rubric/oembed_providers_oembed_providers_repository_decorator@1.0
  tags:
  - mode:recipe
- id: oembed-providers-external-fetch
  input: I want a Drupal site to use ONLY my locally defined oEmbed providers and not fetch the remote
    oembed.com providers list. Which setting controls this and in which config object?
  criteria: Set external_fetch to false on the oembed_providers.settings config object (via the settings
    form or drush cset); then only locally-defined custom providers are used.
  bundle: oembed_providers
  rubric_ref: rubric/oembed_providers_oembed_providers_external_fetch@1.0
  tags:
  - mode:recipe
- id: oembed-providers-permission
  input: Which permission gates managing custom oEmbed providers, provider buckets, and the settings form
    in the oEmbed Providers module?
  criteria: The single 'administer oembed providers' permission gates all of it (settings form plus both
    config entities).
  bundle: oembed_providers
  rubric_ref: rubric/oembed_providers_oembed_providers_permission@1.0
  tags:
  - mode:recipe
- id: oembed-providers-alter-hook
  input: In a custom Drupal module I want to add or modify oEmbed providers programmatically, in the list
    oEmbed Providers builds. Which hook do I implement?
  criteria: Implement hook_oembed_providers_alter(array &$providers) — it fires in ProviderRepositoryDecorator::getAll()
    before Provider objects are built.
  bundle: oembed_providers
  rubric_ref: rubric/oembed_providers_oembed_providers_alter_hook@1.0
  tags:
  - mode:recipe
