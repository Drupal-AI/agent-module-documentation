rubrics:
- id: oembed_lazyload_oembed_lazyload_formatter
  version: '1.0'
  applicable_bundles:
  - oembed_lazyload
  checks:
  - kind: must_contain_any
    values:
    - lazyload_oembed
    - Lazy load oEmbed
    - Manage display
    - formatter
  scoring:
    combine: all_pass
- id: oembed_lazyload_oembed_lazyload_strategy
  version: '1.0'
  applicable_bundles:
  - oembed_lazyload
  checks:
  - kind: must_contain_any
    values:
    - intersection_observer
    - onclick
    - viewport
    - play button
  scoring:
    combine: all_pass
- id: oembed_lazyload_oembed_lazyload_enhancer_plugin
  version: '1.0'
  applicable_bundles:
  - oembed_lazyload
  checks:
  - kind: must_contain_any
    values:
    - ProviderEnhancer
    - getEnhancerForProvider
    - fallback
    - providers
  scoring:
    combine: all_pass
- id: oembed_lazyload_oembed_lazyload_known_formatter
  version: '1.0'
  applicable_bundles:
  - oembed_lazyload
  checks:
  - kind: must_contain_any
    values:
    - lazyload_oembed
    - onclick
  scoring:
    combine: all_pass
- id: oembed_lazyload_oembed_lazyload_which_lazy
  version: '1.0'
  applicable_bundles:
  - oembed_lazyload
  checks:
  - kind: must_contain_any
    values:
    - field_oel_lazy
  scoring:
    combine: all_pass
- id: oembed_lazyload_oembed_lazyload_set_formatter
  version: '1.0'
  applicable_bundles:
  - oembed_lazyload
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
- id: oembed_lazyload_oembed_lazyload_set_strategy
  version: '1.0'
  applicable_bundles:
  - oembed_lazyload
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
