metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: oembed_lazyload
  version: 2.0.x
  note: 'Lazy-loads embedded oEmbed media until it enters the viewport or the user clicks play, showing
    a thumbnail placeholder until then. Core is the lazyload_oembed field formatter (field types link/string/string_long)
    with settings max_width, max_height, strategy (intersection_observer default | onclick), intersection_observer_margin.
    Also defines a ProviderEnhancer plugin type (manager service oembed_lazyload). No global settings
    page (configure=null); the only persistent state is the formatter type+settings on a bundle''s entity_view_display.
    Medium/hard cases are grounded in that real config: introspection reads which formatter/strategy a
    field uses; execution switches a field''s view-display formatter to lazyload_oembed or changes its
    strategy, verified against the live entity_view_display. Fixtures create/remove namespaced field_oel_*
    string fields on node.article.'
questions:
- id: oembed_lazyload-formatter
  input: How do I make an embedded YouTube/oEmbed video on a Drupal 11 page load lazily using the oembed_lazyload
    module, and what is the formatter called?
  criteria: Use the 'lazyload_oembed' field formatter ('Lazy load oEmbed video') on the link/string field
    holding the oEmbed URL, chosen on the entity's Manage display. It renders a placeholder and defers
    the provider iframe.
  bundle: oembed_lazyload
  rubric_ref: rubric/oembed_lazyload_oembed_lazyload_formatter@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: oembed_lazyload-strategy
  input: The oembed_lazyload formatter offers two ways to decide when to actually load the embed. What
    are the two strategies and which is the default?
  criteria: The 'strategy' setting is either intersection_observer (load when it enters the viewport;
    default, with an optional intersection_observer_margin) or onclick (load when the user clicks a play
    button). It also has max_width/max_height settings.
  bundle: oembed_lazyload
  rubric_ref: rubric/oembed_lazyload_oembed_lazyload_strategy@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: oembed_lazyload-enhancer-plugin
  input: I want to customise how a specific provider (say Vimeo) is lazy-loaded by oembed_lazyload. What
    plugin type do I implement and how does the module pick the right one per provider?
  criteria: Implement a ProviderEnhancer plugin (manager service oembed_lazyload, dir Plugin/oembed_lazyload/ProviderEnhancer,
    @ProviderEnhancer annotation with a providers list), extending ProviderEnhancerBase. The formatter
    calls getEnhancerForProvider($providerName); the 'fallback' enhancer handles providers without a dedicated
    one.
  bundle: oembed_lazyload
  rubric_ref: rubric/oembed_lazyload_oembed_lazyload_enhancer_plugin@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: oembed_lazyload-known-formatter
  input: On this Drupal site the Article content type has a field displayed with the oembed_lazyload formatter.
    Inspect the live default view display for Article and tell me the machine name of the formatter used
    by field_oel_known and which lazy-load strategy it is configured with.
  criteria: field_oel_known uses the lazyload_oembed formatter with settings.strategy = onclick in core.entity_view_display.node.article.default.
  bundle: oembed_lazyload
  rubric_ref: rubric/oembed_lazyload_oembed_lazyload_known_formatter@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/oembed_lazyload-known-formatter-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/oembed_lazyload-known-formatter-cleanup.sh
- id: oembed_lazyload-which-lazy
  input: The Article content type on this site has two text fields, field_oel_lazy and field_oel_plain.
    Inspect the live default view display and tell me which one is displayed with the oembed_lazyload
    lazy-loading formatter.
  criteria: field_oel_lazy uses the lazyload_oembed formatter, whereas field_oel_plain uses the core string
    formatter.
  bundle: oembed_lazyload
  rubric_ref: rubric/oembed_lazyload_oembed_lazyload_which_lazy@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/oembed_lazyload-which-lazy-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/oembed_lazyload-which-lazy-cleanup.sh
- id: oembed_lazyload-set-formatter
  input: On this Drupal site, the Article content type has a text field field_oel_task that currently
    uses the plain text formatter. Using the oembed_lazyload module, change its default view-display formatter
    to the 'Lazy load oEmbed video' (lazyload_oembed) formatter, and apply the change to the live site.
  criteria: Set the field_oel_task component in core.entity_view_display.node.article.default to type
    lazyload_oembed, e.g. $vd->setComponent('field_oel_task', ['type'=>'lazyload_oembed','label'=>'hidden','region'=>'content','settings'=>['strategy'=>'intersection_observer','intersection_observer_margin'=>'','max_width'=>0,'max_height'=>0]])->save();
  bundle: oembed_lazyload
  rubric_ref: rubric/oembed_lazyload_oembed_lazyload_set_formatter@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/oembed_lazyload-set-formatter-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/oembed_lazyload-set-formatter-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/oembed_lazyload-set-formatter-verify.sh
- id: oembed_lazyload-set-strategy
  input: On this Drupal site, the Article field field_oel_strat is already displayed with the lazyload_oembed
    formatter using the intersection-observer strategy. Change it so the embed only loads when the visitor
    clicks the play button (the onclick strategy), and apply the change to the live site.
  criteria: Set the field_oel_strat lazyload_oembed formatter's settings.strategy to 'onclick' in core.entity_view_display.node.article.default
    and save (keep type lazyload_oembed).
  bundle: oembed_lazyload
  rubric_ref: rubric/oembed_lazyload_oembed_lazyload_set_strategy@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/oembed_lazyload-set-strategy-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/oembed_lazyload-set-strategy-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/oembed_lazyload-set-strategy-verify.sh
