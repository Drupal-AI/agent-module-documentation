rubrics:
- id: oembed_lazyload_youtube_oembed_lazyload_youtube_what
  version: '1.0'
  applicable_bundles:
  - oembed_lazyload_youtube
  checks:
  - kind: must_contain_any
    values:
    - ProviderEnhancer
    - third-party settings
    - third_party_settings
    - Manage display
    - lazyload_oembed
    - YouTube settings
  scoring:
    combine: all_pass
- id: oembed_lazyload_youtube_oembed_lazyload_youtube_options
  version: '1.0'
  applicable_bundles:
  - oembed_lazyload_youtube
  checks:
  - kind: must_contain_any
    values:
    - autoplay
    - modestbranding
    - enablejsapi
    - rel
    - origin
  scoring:
    combine: all_pass
- id: oembed_lazyload_youtube_oembed_lazyload_youtube_enhancer_id
  version: '1.0'
  applicable_bundles:
  - oembed_lazyload_youtube
  checks:
  - kind: must_contain_any
    values:
    - youtube
    - YouTube
    - ProviderEnhancer
    - ProviderEnhancerBase
  scoring:
    combine: all_pass
- id: oembed_lazyload_youtube_oembed_lazyload_youtube_known_option
  version: '1.0'
  applicable_bundles:
  - oembed_lazyload_youtube
  checks:
  - kind: must_contain_any
    values:
    - autoplay
  scoring:
    combine: all_pass
- id: oembed_lazyload_youtube_oembed_lazyload_youtube_branding
  version: '1.0'
  applicable_bundles:
  - oembed_lazyload_youtube
  checks:
  - kind: must_contain_any
    values:
    - modestbranding
  scoring:
    combine: all_pass
- id: oembed_lazyload_youtube_oembed_lazyload_youtube_enable_autoplay
  version: '1.0'
  applicable_bundles:
  - oembed_lazyload_youtube
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
- id: oembed_lazyload_youtube_oembed_lazyload_youtube_enable_rel
  version: '1.0'
  applicable_bundles:
  - oembed_lazyload_youtube
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
