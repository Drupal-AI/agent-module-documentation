metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: oembed_lazyload_youtube
  version: 2.0.x
  note: 'Submodule of oEmbed lazy load. Registers a youtube ProviderEnhancer (@ProviderEnhancer id: youtube,
    providers: {YouTube}) and adds YouTube player options as third-party settings on the lazyload_oembed
    field formatter via hook_field_formatter_third_party_settings_form(). The boolean options autoplay,
    modestbranding, enablejsapi, origin, hideinfo (deprecated), rel are stored under a formatter component''s
    third_party_settings.oembed_lazyload_youtube.* in a bundle''s entity_view_display (schema field.formatter.third_party.oembed_lazyload_youtube).
    No permission, route, service or config entity of its own. Medium/hard cases are grounded in that
    real config: introspection reads which YouTube option is enabled on a field; execution toggles a YouTube
    option on a field''s lazyload_oembed formatter, verified against the live entity_view_display. Fixtures
    create/remove namespaced field_oly_* fields on node.article.'
questions:
- id: oembed_lazyload_youtube-what
  input: What does the oembed_lazyload_youtube submodule add on top of oEmbed lazy load, and where do
    I configure YouTube player options like autoplay?
  criteria: It adds a youtube ProviderEnhancer and exposes YouTube player options as third-party settings
    on the lazyload_oembed formatter (a 'YouTube settings' section on Manage display). Options are stored
    under the formatter component's third_party_settings.oembed_lazyload_youtube.*.
  bundle: oembed_lazyload_youtube
  rubric_ref: rubric/oembed_lazyload_youtube_oembed_lazyload_youtube_what@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: oembed_lazyload_youtube-options
  input: Which YouTube player options does the oembed_lazyload_youtube module let me toggle on the lazy-load
    oEmbed formatter?
  criteria: 'Boolean options: autoplay, modestbranding (hide the YouTube logo), enablejsapi (control via
    the IFrame API), origin (restrict IFrame API to the oEmbed iframe host, only with enablejsapi), hideinfo
    (deprecated), and rel (only related videos from the same channel).'
  bundle: oembed_lazyload_youtube
  rubric_ref: rubric/oembed_lazyload_youtube_oembed_lazyload_youtube_options@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: oembed_lazyload_youtube-enhancer-id
  input: How does oembed_lazyload_youtube plug into the oEmbed lazy load provider-enhancer system, and
    what provider does its enhancer handle?
  criteria: It registers a ProviderEnhancer plugin with id 'youtube' matching the 'YouTube' provider (extends
    ProviderEnhancerBase); it parses the video id, adds a JS library, and rewrites the iframe URL with
    player params based on the formatter's third-party settings.
  bundle: oembed_lazyload_youtube
  rubric_ref: rubric/oembed_lazyload_youtube_oembed_lazyload_youtube_enhancer_id@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: oembed_lazyload_youtube-known-option
  input: On this Drupal site, the Article field field_oly_known is displayed with the lazy-load oEmbed
    formatter and has a YouTube player option turned on. Inspect the live default view display and tell
    me which oembed_lazyload_youtube option is enabled.
  criteria: 'autoplay is enabled: field_oly_known''s lazyload_oembed formatter has third_party_settings.oembed_lazyload_youtube.autoplay
    = true.'
  bundle: oembed_lazyload_youtube
  rubric_ref: rubric/oembed_lazyload_youtube_oembed_lazyload_youtube_known_option@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/oembed_lazyload_youtube-known-option-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/oembed_lazyload_youtube-known-option-cleanup.sh
- id: oembed_lazyload_youtube-branding
  input: On this Drupal site, the Article field field_oly_mb uses the lazy-load oEmbed formatter with
    a YouTube branding option configured. Inspect the live view display and tell me which oembed_lazyload_youtube
    option is enabled (the one that hides the YouTube logo).
  criteria: 'modestbranding is enabled: field_oly_mb''s lazyload_oembed formatter has third_party_settings.oembed_lazyload_youtube.modestbranding
    = true (hides the YouTube logo).'
  bundle: oembed_lazyload_youtube
  rubric_ref: rubric/oembed_lazyload_youtube_oembed_lazyload_youtube_branding@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/oembed_lazyload_youtube-branding-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/oembed_lazyload_youtube-branding-cleanup.sh
- id: oembed_lazyload_youtube-enable-autoplay
  input: On this Drupal site, the Article field field_oly_task is displayed with the lazy-load oEmbed
    formatter but its YouTube autoplay option is off. Using oembed_lazyload_youtube, enable autoplay for
    this field's YouTube embeds, and apply the change to the live site.
  criteria: Set the field_oly_task lazyload_oembed formatter's third_party_settings.oembed_lazyload_youtube.autoplay
    to TRUE in core.entity_view_display.node.article.default and save (e.g. load the display, edit the
    component's third_party_settings, setComponent + save).
  bundle: oembed_lazyload_youtube
  rubric_ref: rubric/oembed_lazyload_youtube_oembed_lazyload_youtube_enable_autoplay@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/oembed_lazyload_youtube-enable-autoplay-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/oembed_lazyload_youtube-enable-autoplay-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/oembed_lazyload_youtube-enable-autoplay-verify.sh
- id: oembed_lazyload_youtube-enable-rel
  input: On this Drupal site, the Article field field_oly_rel uses the lazy-load oEmbed formatter. Configure
    its YouTube embeds so that related videos are limited to the same channel (enable the oembed_lazyload_youtube
    'rel' option), and apply the change to the live site.
  criteria: Set the field_oly_rel lazyload_oembed formatter's third_party_settings.oembed_lazyload_youtube.rel
    to TRUE in core.entity_view_display.node.article.default and save.
  bundle: oembed_lazyload_youtube
  rubric_ref: rubric/oembed_lazyload_youtube_oembed_lazyload_youtube_enable_rel@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/oembed_lazyload_youtube-enable-rel-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/oembed_lazyload_youtube-enable-rel-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/oembed_lazyload_youtube-enable-rel-verify.sh
