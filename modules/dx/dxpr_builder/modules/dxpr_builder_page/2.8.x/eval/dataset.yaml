metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: dxpr_builder_page
  version: 2.8.x
  note: 'dxpr_builder_page is a config-only submodule of dxpr_builder. It installs the node type drag_and_drop_page
    whose body view-display component uses the dxpr_builder_text formatter, plus three DXPR theme-helper
    fields (field_dth_page_layout, field_dth_main_content_width, field_dth_hide_regions). No settings,
    permissions, schema, or Drush; its only PHP is a ModuleUninstallValidator that blocks uninstall while
    drag_and_drop_page nodes exist. Cases are grounded in that shipped config and content type: introspection
    reads the body formatter on node.drag_and_drop_page.default; execution creates a drag_and_drop_page
    node, verified live.'
questions:
- id: dxpr_builder_page-what
  input: What does the Drupal dxpr_builder_page submodule add when enabled?
  criteria: It installs a ready-made content type 'Drag and drop Page' (machine name drag_and_drop_page)
    whose body field is displayed/edited with the DXPR Builder (dxpr_builder_text) formatter, plus three
    DXPR theme-helper layout fields. It is config-only (no settings of its own).
  bundle: dxpr_builder_page
  rubric_ref: rubric/dxpr_builder_page_dxpr_builder_page_what@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: dxpr_builder_page-fields
  input: Besides the body, which extra fields does the dxpr_builder_page content type provide and what
    are they for?
  criteria: 'Three DXPR theme-helper fields: field_dth_page_layout (page layout), field_dth_main_content_width
    (main content width), and field_dth_hide_regions (which theme regions to hide on the page).'
  bundle: dxpr_builder_page
  rubric_ref: rubric/dxpr_builder_page_dxpr_builder_page_fields@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: dxpr_builder_page-uninstall
  input: Why might Drupal refuse to uninstall the dxpr_builder_page module, and how do I resolve it?
  criteria: Its DXPRBuilderPageUninstallValidator blocks uninstall while any drag_and_drop_page nodes
    still exist (to protect content). Delete all drag_and_drop_page nodes first, then uninstall.
  bundle: dxpr_builder_page
  rubric_ref: rubric/dxpr_builder_page_dxpr_builder_page_uninstall@1.0
  tags:
  - mode:recipe
  - difficulty:easy
