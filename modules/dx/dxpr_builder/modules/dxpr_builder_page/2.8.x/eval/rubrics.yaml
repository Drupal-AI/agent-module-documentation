rubrics:
- id: dxpr_builder_page_dxpr_builder_page_what
  version: '1.0'
  applicable_bundles:
  - dxpr_builder_page
  checks:
  - kind: must_contain_any
    values:
    - drag_and_drop_page
    - content type
    - Drag and drop Page
  scoring:
    combine: all_pass
- id: dxpr_builder_page_dxpr_builder_page_fields
  version: '1.0'
  applicable_bundles:
  - dxpr_builder_page
  checks:
  - kind: must_contain_any
    values:
    - field_dth_page_layout
    - field_dth_main_content_width
    - field_dth_hide_regions
    - layout
  scoring:
    combine: all_pass
- id: dxpr_builder_page_dxpr_builder_page_uninstall
  version: '1.0'
  applicable_bundles:
  - dxpr_builder_page
  checks:
  - kind: must_contain_any
    values:
    - uninstall
    - nodes
    - content
    - validator
  scoring:
    combine: all_pass
- id: dxpr_builder_page_dxpr_builder_page_body_formatter
  version: '1.0'
  applicable_bundles:
  - dxpr_builder_page
  checks:
  - kind: must_contain_any
    values:
    - dxpr_builder_text
  scoring:
    combine: all_pass
- id: dxpr_builder_page_dxpr_builder_page_create_node
  version: '1.0'
  applicable_bundles:
  - dxpr_builder_page
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
