rubrics:
- id: dxpr_builder_block_dxpr_builder_block_what
  version: '1.0'
  applicable_bundles:
  - dxpr_builder_block
  checks:
  - kind: must_contain_any
    values:
    - drag_and_drop_block
    - block type
    - custom block
  scoring:
    combine: all_pass
- id: dxpr_builder_block_dxpr_builder_block_formatter
  version: '1.0'
  applicable_bundles:
  - dxpr_builder_block
  checks:
  - kind: must_contain_any
    values:
    - dxpr_builder_text
    - block_content
  scoring:
    combine: all_pass
- id: dxpr_builder_block_dxpr_builder_block_vs_page
  version: '1.0'
  applicable_bundles:
  - dxpr_builder_block
  checks:
  - kind: must_contain_any
    values:
    - block
    - reusable
    - component
  scoring:
    combine: all_pass
- id: dxpr_builder_block_dxpr_builder_block_body_formatter
  version: '1.0'
  applicable_bundles:
  - dxpr_builder_block
  checks:
  - kind: must_contain_any
    values:
    - dxpr_builder_text
  scoring:
    combine: all_pass
- id: dxpr_builder_block_dxpr_builder_block_enable_formatter
  version: '1.0'
  applicable_bundles:
  - dxpr_builder_block
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
