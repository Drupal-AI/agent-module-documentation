metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: dxpr_builder_block
  version: 2.8.x
  note: 'dxpr_builder_block is a config-only submodule of dxpr_builder. It installs the block_content
    type drag_and_drop_block whose body view-display component uses the dxpr_builder_text formatter. No
    code, settings, permissions, schema, or Drush. Cases are grounded in the shipped block-type config:
    introspection reads the body formatter on block_content.drag_and_drop_block.default; execution (hard)
    sets that view-display component''s formatter to dxpr_builder_text (verified live). NOTE: on this
    minimal base site the shared block_content.body field storage is text_long while the shipped drag_and_drop_block
    body FieldConfig is text_with_summary, so creating a drag_and_drop_block *entity* throws ''Property
    summary is unknown''; the hard case therefore targets the display config, which is unaffected by that
    data-layer mismatch.'
questions:
- id: dxpr_builder_block-what
  input: What does the Drupal dxpr_builder_block submodule add when enabled?
  criteria: It installs a custom block-content type 'Drag and Drop Block' (machine name drag_and_drop_block)
    whose body field is edited/displayed with the DXPR Builder (dxpr_builder_text) formatter, for building
    reusable visually-designed blocks. It is config-only.
  bundle: dxpr_builder_block
  rubric_ref: rubric/dxpr_builder_block_dxpr_builder_block_what@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: dxpr_builder_block-formatter
  input: Which field formatter makes the body of the dxpr_builder_block 'Drag and Drop Block' type editable
    with the DXPR visual editor, and on which entity type is the block type defined?
  criteria: The body field's view display uses the dxpr_builder_text formatter. The block type is a block_content
    bundle (drag_and_drop_block).
  bundle: dxpr_builder_block
  rubric_ref: rubric/dxpr_builder_block_dxpr_builder_block_formatter@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: dxpr_builder_block-vs-page
  input: How does dxpr_builder_block differ from dxpr_builder_page, and what would I use it for?
  criteria: dxpr_builder_block provides a reusable custom block type (drag_and_drop_block on the block_content
    entity) for designing reusable components (heroes, CTAs) placed via Block layout, whereas dxpr_builder_page
    provides a full page content type (drag_and_drop_page on nodes). Both use the dxpr_builder_text formatter
    for their body.
  bundle: dxpr_builder_block
  rubric_ref: rubric/dxpr_builder_block_dxpr_builder_block_vs_page@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: dxpr_builder_block-body-formatter
  input: On this Drupal site, inspect the default view display of the drag_and_drop_block custom block
    type and state which formatter its body field uses.
  criteria: The body component in core.entity_view_display.block_content.drag_and_drop_block.default uses
    the dxpr_builder_text formatter (DXPR Builder).
  bundle: dxpr_builder_block
  rubric_ref: rubric/dxpr_builder_block_dxpr_builder_block_body_formatter@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/dxpr_builder_block-body-formatter-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/dxpr_builder_block-body-formatter-cleanup.sh
- id: dxpr_builder_block-enable-formatter
  input: On this Drupal site, configure the default view display of the drag_and_drop_block custom block
    type so its body field is rendered/edited with DXPR Builder (rather than the plain text formatter).
    Apply the change to the live site.
  criteria: In core.entity_view_display.block_content.drag_and_drop_block.default the body component has
    type 'dxpr_builder_text' (e.g. $vd->setComponent('body', ['type'=>'dxpr_builder_text',...])->save();).
  bundle: dxpr_builder_block
  rubric_ref: rubric/dxpr_builder_block_dxpr_builder_block_enable_formatter@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/dxpr_builder_block-enable-formatter-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/dxpr_builder_block-enable-formatter-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/dxpr_builder_block-enable-formatter-verify.sh
