metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: dxpr_builder_media
  version: 2.8.x
  note: 'dxpr_builder_media is a hidden submodule of dxpr_builder that provides an Entity Browser media
    picker for the DXPR editor. It ships config: entity_browser.browser.dxpr_builder_media_modal, views.view.dxpr_builder_media,
    and image.style.dxpr_builder_media_thumbnail, plus small theming glue (hook_preprocess_views_view
    attaches Gin/Claro CSS; hook_library_info_alter adds Backbone). No settings/permissions/schema/Drush
    of its own. It is activated by pointing the parent''s config at it: dxpr_builder.settings:media_browser
    = ''dxpr_builder_media_modal'' (options come from available entity browsers + Media Library; ''''
    = basic upload). Cases are grounded in that real usage: introspection reads which media browser DXPR
    is set to; execution sets DXPR to use the dxpr_builder_media browser, verified live. Baseline media_browser
    is '''' and is restored by cleanup.'
questions:
- id: dxpr_builder_media-what
  input: What does the Drupal dxpr_builder_media submodule provide, and what does it install?
  criteria: It provides an Entity Browser-based media/image picker (a modal) for selecting media inside
    the DXPR Builder editor. It installs an entity browser (entity_browser.browser.dxpr_builder_media_modal),
    a View (views.view.dxpr_builder_media) listing media in a grid, and an image style (image.style.dxpr_builder_media_thumbnail).
    It is a hidden module.
  bundle: dxpr_builder_media
  rubric_ref: rubric/dxpr_builder_media_dxpr_builder_media_what@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: dxpr_builder_media-activate
  input: After enabling dxpr_builder_media, how do I make DXPR Builder actually use it as the media browser,
    and where is that stored?
  criteria: In DXPR Builder settings (admin/dxpr_studio/dxpr_builder/settings, Media section) choose the
    DXPR entity browser. That writes dxpr_builder.settings:media_browser = 'dxpr_builder_media_modal'
    (an empty value means basic file upload; 'media_library' uses core Media Library).
  bundle: dxpr_builder_media
  rubric_ref: rubric/dxpr_builder_media_dxpr_builder_media_activate@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: dxpr_builder_media-deps
  input: Which modules does dxpr_builder_media depend on, and is it visible on the normal Extend page?
  criteria: 'It depends on entity_browser, entity_browser_entity_form, inline_entity_form, media, media_library
    and views. It is marked hidden: true so it does not appear on the normal Extend list (enable it with
    drush en dxpr_builder_media).'
  bundle: dxpr_builder_media
  rubric_ref: rubric/dxpr_builder_media_dxpr_builder_media_deps@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: dxpr_builder_media-known-browser
  input: On this Drupal site, DXPR Builder is currently configured to use a specific media browser. Inspect
    the live DXPR Builder settings and state which media browser is selected.
  criteria: dxpr_builder.settings:media_browser is set to 'dxpr_builder_media_modal' (the DXPR Builder
    Media entity browser).
  bundle: dxpr_builder_media
  rubric_ref: rubric/dxpr_builder_media_dxpr_builder_media_known_browser@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/dxpr_builder_media-known-browser-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/dxpr_builder_media-known-browser-cleanup.sh
- id: dxpr_builder_media-use-browser
  input: On this Drupal site, configure DXPR Builder to use the DXPR Builder Media modal browser (provided
    by dxpr_builder_media) as its media browser. Apply the change to the live site.
  criteria: dxpr_builder.settings:media_browser === 'dxpr_builder_media_modal' (e.g. \Drupal::configFactory()->getEditable('dxpr_builder.settings')->set('media_browser','dxpr_builder_media_modal')->save();).
  bundle: dxpr_builder_media
  rubric_ref: rubric/dxpr_builder_media_dxpr_builder_media_use_browser@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/dxpr_builder_media-use-browser-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/dxpr_builder_media-use-browser-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/dxpr_builder_media-use-browser-verify.sh
