rubrics:
- id: dxpr_builder_media_dxpr_builder_media_what
  version: '1.0'
  applicable_bundles:
  - dxpr_builder_media
  checks:
  - kind: must_contain_any
    values:
    - media browser
    - entity browser
    - dxpr_builder_media_modal
  scoring:
    combine: all_pass
- id: dxpr_builder_media_dxpr_builder_media_activate
  version: '1.0'
  applicable_bundles:
  - dxpr_builder_media
  checks:
  - kind: must_contain_any
    values:
    - media_browser
    - dxpr_builder.settings
    - settings
  scoring:
    combine: all_pass
- id: dxpr_builder_media_dxpr_builder_media_deps
  version: '1.0'
  applicable_bundles:
  - dxpr_builder_media
  checks:
  - kind: must_contain_any
    values:
    - entity_browser
    - media_library
    - hidden
    - inline_entity_form
  scoring:
    combine: all_pass
- id: dxpr_builder_media_dxpr_builder_media_known_browser
  version: '1.0'
  applicable_bundles:
  - dxpr_builder_media
  checks:
  - kind: must_contain_any
    values:
    - dxpr_builder_media_modal
  scoring:
    combine: all_pass
- id: dxpr_builder_media_dxpr_builder_media_use_browser
  version: '1.0'
  applicable_bundles:
  - dxpr_builder_media
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
