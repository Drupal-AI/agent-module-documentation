metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: dxpr_theme_helper
  version: 3.1.x
  note: 'DXPR Theme Helper is a companion module for DXPR Theme. Reliable, theme-independent surfaces
    on THIS site (where the DXPR theme is NOT installed): (1) two Block plugins - full_screen_search (''DXPR
    Theme Full Screen Search''; config keys search_provider [core|search_api], search_url, search_parameter;
    schema block.settings.full_screen_search) and dxpr_theme_helper_user_register (user registration form,
    anonymous-only). (2) The dxt:* Drush suite (dxt:config:get/set/list/export/import/reset, dxt:palette:get/set,
    dxt:page:get/set, dxt:subtheme:create, dxt:setup-ai) plus AI generators dxt:generate:palette / dxt:generate:fonts
    (services dxpr_theme_helper.ai_palette_generator/ai_font_generator needing optional drupal/ai). NOTE:
    dxt:config:* / dxt:palette:* require a DXPR theme installed to target (else ''No DXPR theme found'');
    dxt:config:list works from the bundled data/settings-schema.json without one. (3) Five optional node
    fields field_dth_* (page_layout fullwidth/boxed, main_content_width, hide_regions, body_background,
    page_title_backgrou) shipped as field.storage only, not attached to any bundle. Medium/hard cases
    place blocks (system config only; olivero theme) - deliberately NOT attaching/detaching the shipped
    field_dth_* storages, because removing the last instance of one deletes its shipped storage.'
questions:
- id: dxpr_theme_helper-dxt-config
  input: The dxpr_theme_helper module adds Drush commands for reading and writing DXPR Theme settings
    from the CLI. Which command changes a setting's value, and which command lists the available settings
    sections? Give the command names (dxt namespace).
  criteria: Use `drush dxt:config:set <key> <value>` (alias dxt-cs) to change a setting (it validates
    against the schema and rebuilds CSS), and `drush dxt:config:list` (alias dxt-cl) to list settings
    — e.g. `--sections-only` for section names or `--section=<name> --detail` to introspect valid values.
  bundle: dxpr_theme_helper
  rubric_ref: rubric/dxpr_theme_helper_dxpr_theme_helper_dxt_config@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: dxpr_theme_helper-search-block
  input: dxpr_theme_helper provides a full-screen search block. What is the block plugin id, and which
    two search providers can it use (the search_provider setting)?
  criteria: The block plugin id is full_screen_search ('DXPR Theme Full Screen Search'). Its search_provider
    setting chooses between 'core' (Core Search) and 'search_api' (Search API Block, which requires the
    search_api_block module). It also has search_url and search_parameter settings.
  bundle: dxpr_theme_helper
  rubric_ref: rubric/dxpr_theme_helper_dxpr_theme_helper_search_block@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: dxpr_theme_helper-ai-palette
  input: dxpr_theme_helper can generate a DXPR Theme color palette from a text prompt like 'Modern tech
    startup'. Which Drush command does this, and what other Drupal module must be installed and configured
    for it to work?
  criteria: Run `drush dxt:generate:palette "<prompt>"` (alias dxt-gp, optionally --apply). It uses the
    AiPaletteGenerator service, which calls the optional drupal/ai module's chat provider — so the AI
    (drupal/ai) module must be installed and configured with a chat provider/default model, otherwise
    it returns an error.
  bundle: dxpr_theme_helper
  rubric_ref: rubric/dxpr_theme_helper_dxpr_theme_helper_ai_palette@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: dxpr_theme_helper-fss-known
  input: On this Drupal site a DXPR Theme Full Screen Search block with id 'dth_fss_known' is placed in
    the olivero theme. Inspect its live configuration and state the search results URL path (search_url)
    it is configured with.
  criteria: 'block.block.dth_fss_known (plugin full_screen_search) has settings.search_url = ''/dth-known-search''
    (with search_provider search_api). Read with: drush cget block.block.dth_fss_known settings'
  bundle: dxpr_theme_helper
  rubric_ref: rubric/dxpr_theme_helper_dxpr_theme_helper_fss_known@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/dxpr_theme_helper-fss-known-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/dxpr_theme_helper-fss-known-cleanup.sh
- id: dxpr_theme_helper-fss-provider
  input: A DXPR full-screen search block 'dth_fss_prov' is placed on this site. Inspect its live configuration
    and state which search provider it uses and the query parameter name it passes.
  criteria: 'block.block.dth_fss_prov uses search_provider = ''core'' (Core Search) with search_parameter
