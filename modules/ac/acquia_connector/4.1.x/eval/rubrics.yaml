rubrics:
- id: acquia_connector_acquia_connector_subscription_service
  version: '1.0'
  applicable_bundles:
  - acquia_connector
  checks:
  - kind: must_contain_any
    values:
    - acquia_connector.subscription
    - isActive
  scoring:
    combine: all_pass
- id: acquia_connector_acquia_connector_credentials_source
  version: '1.0'
  applicable_bundles:
  - acquia_connector
  checks:
  - kind: must_contain_any
    values:
    - GET_SETTINGS
    - environment
    - settings.php
    - state
    - event subscriber
    - FromAcquiaCloud
  scoring:
    combine: all_pass
- id: acquia_connector_acquia_connector_settings_route
  version: '1.0'
  applicable_bundles:
  - acquia_connector
  checks:
  - kind: must_contain_any
    values:
    - acquia_connector.settings
    - /admin/config/services/acquia-connector
  scoring:
    combine: all_pass
- id: acquia_connector_acquia_connector_telemetry_conditions
  version: '1.0'
  applicable_bundles:
  - acquia_connector
  checks:
  - kind: must_contain_any
    values:
    - production
    - AH_SITE_ENVIRONMENT
    - 24 hours
    - '86400'
    - hashed
    - hash
  scoring:
    combine: all_pass
- id: acquia_connector_acquia_connector_status_endpoint
  version: '1.0'
  applicable_bundles:
  - acquia_connector
  checks:
  - kind: must_contain_any
    values:
    - /system/acquia-connector-status
    - nonce
    - sha1
  scoring:
    combine: all_pass
- id: acquia_connector_acquia_connector_toolbar_permission
  version: '1.0'
  applicable_bundles:
  - acquia_connector
  checks:
  - kind: must_contain_any
    values:
    - view acquia connector toolbar
    - administer site configuration
  scoring:
    combine: all_pass
- id: acquia_connector_acquia_connector_drush
  version: '1.0'
  applicable_bundles:
  - acquia_connector
  checks:
  - kind: must_contain_any
    values:
    - refresh
    - sql:sanitize
    - sql sanitize
    - RefreshSubscription
    - SqlSanitize
  scoring:
    combine: all_pass
