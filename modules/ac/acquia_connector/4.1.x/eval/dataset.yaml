metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: acquia_connector
  version: 4.1.x
  note: 'Acquia Connector connects a Drupal site to an Acquia Cloud subscription, exposes a status endpoint,
    and sends anonymized telemetry. Cases are `recipe` (response-graded): they probe documented facts
    (the Subscription service, credential resolution, telemetry guardrails, the settings route, status
    endpoint) an agent would otherwise read source to answer. No site mutation.'
questions:
- id: acquia-connector-subscription-service
  input: On a Drupal 11 site with Acquia Connector, which service tells me programmatically whether the
    site has an active Acquia subscription, and which method do I call?
  criteria: Use the acquia_connector.subscription service (Drupal\acquia_connector\Subscription); call
    isActive() (or getSubscription() for the raw data).
  bundle: acquia_connector
  rubric_ref: rubric/acquia_connector_acquia_connector_subscription_service@1.0
  tags:
  - mode:recipe
- id: acquia-connector-credentials-source
  input: Where does Acquia Connector get the subscription credentials (identifier, secret key, application
    UUID)? They are not in the settings config object.
  criteria: They are resolved at runtime by event subscribers on AcquiaConnectorEvents::GET_SETTINGS,
    reading from Acquia hosting env vars (FromAcquiaCloud), settings.php (FromCoreSettings), or Drupal
    state (FromCoreState), producing a Settings object.
  bundle: acquia_connector
  rubric_ref: rubric/acquia_connector_acquia_connector_credentials_source@1.0
  tags:
  - mode:recipe
- id: acquia-connector-settings-route
  input: What is the config route name and admin path for the Acquia Connector settings/setup UI on a
    Drupal site?
  criteria: Route acquia_connector.settings at /admin/config/services/acquia-connector, gated by 'administer
    site configuration'.
  bundle: acquia_connector
  rubric_ref: rubric/acquia_connector_acquia_connector_settings_route@1.0
  tags:
  - mode:recipe
- id: acquia-connector-telemetry-conditions
  input: Under what conditions does Acquia Connector actually send its anonymized telemetry data, and
    what identifies the site in that data?
  criteria: Only from a detected Acquia production environment (AH_SITE_ENVIRONMENT prod/*live), at most
    once per 24 hours per event, and only when the payload changed; the site is identified by a hashed
    site UUID (no PII).
  bundle: acquia_connector
  rubric_ref: rubric/acquia_connector_acquia_connector_telemetry_conditions@1.0
  tags:
  - mode:recipe
- id: acquia-connector-status-endpoint
  input: Acquia Connector exposes a JSON endpoint used by Acquia uptime monitoring. What is its path and
    how is access validated?
  criteria: StatusController serves JSON at /system/acquia-connector-status; access requires a nonce and
    a key equal to sha1("{application_uuid}:{nonce}").
  bundle: acquia_connector
  rubric_ref: rubric/acquia_connector_acquia_connector_status_endpoint@1.0
  tags:
  - mode:recipe
- id: acquia-connector-toolbar-permission
  input: Which permission does Acquia Connector define, and which core permission gates connecting/configuring
    the subscription?
  criteria: It defines 'view acquia connector toolbar' (shows the toolbar item); the setup/settings routes
    are gated by the core 'administer site configuration' permission.
  bundle: acquia_connector
  rubric_ref: rubric/acquia_connector_acquia_connector_toolbar_permission@1.0
  tags:
  - mode:recipe
- id: acquia-connector-drush
  input: What Drush integration does Acquia Connector provide on a Drupal site?
  criteria: It registers Drush commands to refresh the subscription (RefreshSubscription) and to sanitize
    Acquia state on sql:sanitize (SqlSanitizeCommands).
  bundle: acquia_connector
  rubric_ref: rubric/acquia_connector_acquia_connector_drush@1.0
  tags:
  - mode:recipe
