metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: acquiadam_asset_import
  version: 1.1.x
  note: 'Submodule of acquia_dam that bulk-creates media entities for DAM (Widen) assets in configured
    categories/asset groups. All configuration is the acquiadam_asset_import.settings config object: ''categories''
    (map Widen category UUID => [local media type ids]) and ''asset_groups'' (map asset group UUID =>
    [media type ids]); install default both {}. Config form /admin/config/acquia-dam/bulk-import (parent
    permission ''administer acquia_dam'' + DAM-authenticated check). Three Drush commands drive a queue-based
    import (acquia-dam:import-assets / :queue-import-assets / :process-import-queue, opts --batch-size/--limit)
    into the acquia_dam_asset_import queue processed by the AssetImporter worker. Enumerating/creating
    assets needs a live DAM connection, so EVERY case here is grounded in local config only: medium reads
    a configured category->media-type mapping / counts configured categories; hard writes a category and
    an asset-group mapping and verifies via drush cget. The submodule is left ENABLED for the campaign
    so its settings config object exists.'
questions:
- id: acquiadam_asset_import-what
  input: What does the Acquia DAM Bulk Asset Import submodule do, and how do you tell it which DAM assets
    to import and as what media type?
  criteria: It bulk-creates Drupal media entities for DAM (Widen) assets. On its config form you map Widen
    category UUIDs and asset-group UUIDs to one or more local DAM media types; those maps are stored in
    acquiadam_asset_import.settings under 'categories' and 'asset_groups'. Import runs as a queue-based
    job.
  bundle: acquiadam_asset_import
  rubric_ref: rubric/acquiadam_asset_import_acquiadam_asset_import_what@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: acquiadam_asset_import-drush
  input: Which Drush commands does the Acquia DAM bulk import submodule provide to queue and run an import,
    and what options control batching and how many items are processed?
  criteria: acquia-dam:queue-import-assets (ad:qia) enqueues; acquia-dam:process-import-queue (ad:piq)
    processes with --batch-size (default 10) and --limit (default 0 = unlimited); acquia-dam:import-assets
    (ad:ia) does both in one command.
  bundle: acquiadam_asset_import
  rubric_ref: rubric/acquiadam_asset_import_acquiadam_asset_import_drush@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: acquiadam_asset_import-config-location
  input: On a Drupal site with the Acquia DAM bulk import submodule, where is the mapping of Widen categories
    to media types stored, and at what admin path is it configured?
  criteria: Stored in the acquiadam_asset_import.settings config object (keys 'categories' and 'asset_groups'),
    configured at /admin/config/acquia-dam/bulk-import (route acquiadam_asset_import.configuration), which
    needs the 'administer acquia_dam' permission and a DAM-authenticated site.
  bundle: acquiadam_asset_import
  rubric_ref: rubric/acquiadam_asset_import_acquiadam_asset_import_config_location@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: acquiadam_asset_import-category-map
  input: On this site, the Acquia DAM bulk import has a Widen category configured for import. Inspect
    the live configuration and tell me which local media type that category's assets will be imported
    as.
  criteria: The configured category (cat-uuid-eval-001) is mapped to the Image media type acquia_dam_image_asset
    in acquiadam_asset_import.settings:categories.
  bundle: acquiadam_asset_import
  rubric_ref: rubric/acquiadam_asset_import_acquiadam_asset_import_category_map@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
