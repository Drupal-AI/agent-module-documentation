- id: acquiadam_asset_import-map-category
  input: Configure Acquia DAM bulk import so that assets in the Widen category with UUID 'cat-uuid-task-777'
    are imported as the Image media type (acquia_dam_image_asset). Apply the change to the live configuration.
  criteria: 'Set acquiadam_asset_import.settings categories so that ''cat-uuid-task-777'' maps to [''acquia_dam_image_asset'']
