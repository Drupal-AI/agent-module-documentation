rubrics:
- id: acquia_dam_acquia_dam_media_types
  version: '1.0'
  applicable_bundles:
  - acquia_dam
  checks:
  - kind: must_contain_any
    values:
    - media type
    - media source
    - acquia_dam_asset
    - acquia_dam_image_asset
  scoring:
    combine: all_pass
- id: acquia_dam_acquia_dam_connection
  version: '1.0'
  applicable_bundles:
  - acquia_dam
  checks:
  - kind: must_contain_any
    values:
    - acquia_dam.settings
    - domain
    - key
    - OAuth
    - client
  scoring:
    combine: all_pass
- id: acquia_dam_acquia_dam_permissions
  version: '1.0'
  applicable_bundles:
  - acquia_dam
  checks:
  - kind: must_contain_any
    values:
    - authorize with acquia dam
    - administer acquia_dam
  scoring:
    combine: all_pass
- id: acquia_dam_acquia_dam_domain
  version: '1.0'
  applicable_bundles:
  - acquia_dam
  checks:
  - kind: must_contain_any
    values:
    - eval-demo.widencollective.com
  scoring:
    combine: all_pass
- id: acquia_dam_acquia_dam_image_download
  version: '1.0'
  applicable_bundles:
  - acquia_dam
  checks:
  - kind: must_contain_any
    values:
    - 'true'
    - locally
    - download
  scoring:
    combine: all_pass
- id: acquia_dam_acquia_dam_enable_image_download
  version: '1.0'
  applicable_bundles:
  - acquia_dam
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
- id: acquia_dam_acquia_dam_image_styles
  version: '1.0'
  applicable_bundles:
  - acquia_dam
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
