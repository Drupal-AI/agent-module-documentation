rubrics:
- id: acl_acl_create_function
  version: '1.0'
  applicable_bundles:
  - acl
  checks:
  - kind: must_contain_any
    values:
    - acl_create_acl
  scoring:
    combine: all_pass
- id: acl_acl_grant_user_node
  version: '1.0'
  applicable_bundles:
  - acl
  checks:
  - kind: must_contain_any
    values:
    - acl_add_user
    - acl_node_add_acl
  scoring:
    combine: all_pass
- id: acl_acl_tables_realm
  version: '1.0'
  applicable_bundles:
  - acl
  checks:
  - kind: must_contain_any
    values:
    - acl_node
    - acl_user
    - realm
    - '''acl'''
    - acl_id
  scoring:
    combine: all_pass
- id: acl_acl_list_member
  version: '1.0'
  applicable_bundles:
  - acl
  checks:
  - kind: must_contain_any
    values:
    - admin
  scoring:
    combine: all_pass
- id: acl_acl_empty_list
  version: '1.0'
  applicable_bundles:
  - acl
  checks:
  - kind: must_contain_any
    values:
    - 'no'
    - none
    - '0'
    - zero
    - empty
    - not
  scoring:
    combine: all_pass
- id: acl_acl_create_and_add_user
  version: '1.0'
  applicable_bundles:
  - acl
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
- id: acl_acl_grant_node_view
  version: '1.0'
  applicable_bundles:
  - acl
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
