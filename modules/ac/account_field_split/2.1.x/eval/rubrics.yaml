rubrics:
- id: account_field_split_account_field_split_split_fields
  version: '1.0'
  applicable_bundles:
  - account_field_split
  checks:
  - kind: must_contain_any
    values:
    - mail
    - e-mail
    - email
    - username
    - current password
    - roles
    - notify
  scoring:
    combine: all_pass
- id: account_field_split_account_field_split_where_to_configure
  version: '1.0'
  applicable_bundles:
  - account_field_split
  checks:
  - kind: must_contain_any
    values:
    - form display
    - form-display
    - Manage form display
    - core.entity_form_display.user.user.default
    - admin/config/people/accounts/form-display
  scoring:
    combine: all_pass
- id: account_field_split_account_field_split_how_it_works
  version: '1.0'
  applicable_bundles:
  - account_field_split
  checks:
  - kind: must_contain_any
    values:
    - hook_entity_extra_field_info
    - extra field
    - extra_field
    - hook_form_alter
    - pseudo
    - hook_entity_extra_field_info_alter
  scoring:
    combine: all_pass
- id: account_field_split_account_field_split_field_order
  version: '1.0'
  applicable_bundles:
  - account_field_split
  checks:
  - kind: must_contain_any
    values:
    - e-mail
    - email
    - mail
  scoring:
    combine: all_pass
- id: account_field_split_account_field_split_hidden_field
  version: '1.0'
  applicable_bundles:
  - account_field_split
  checks:
  - kind: must_contain_any
    values:
    - roles
    - role
  scoring:
    combine: all_pass
- id: account_field_split_account_field_split_mail_first
  version: '1.0'
  applicable_bundles:
  - account_field_split
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
- id: account_field_split_account_field_split_hide_current_pass
  version: '1.0'
  applicable_bundles:
  - account_field_split
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
