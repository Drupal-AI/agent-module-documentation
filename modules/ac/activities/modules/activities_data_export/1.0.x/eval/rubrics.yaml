rubrics:
- id: activities_data_export_activities_data_export_log_path
  version: '1.0'
  applicable_bundles:
  - activities_data_export
  checks:
  - kind: must_contain_any
    values:
    - admin/config/system/activity
    - Activities Log
    - export
    - CSV
  scoring:
    combine: all_pass
- id: activities_data_export_activities_data_export_view
  version: '1.0'
  applicable_bundles:
  - activities_data_export
  checks:
  - kind: must_contain_any
    values:
    - activity_log
    - user_activities
  scoring:
    combine: all_pass
- id: activities_data_export_activities_data_export_deps
  version: '1.0'
  applicable_bundles:
  - activities_data_export
  checks:
  - kind: must_contain_any
    values:
    - views_data_export
    - xls_serialization
  scoring:
    combine: all_pass
- id: activities_data_export_activities_data_export_live_status
  version: '1.0'
  applicable_bundles:
  - activities_data_export
  checks:
  - kind: must_contain_any
    values:
    - 'false'
    - disabled
    - not enabled
    - 'no'
  scoring:
    combine: all_pass
- id: activities_data_export_activities_data_export_live_label
  version: '1.0'
  applicable_bundles:
  - activities_data_export
  checks:
  - kind: must_contain_any
    values:
    - ADE Audit Log
  scoring:
    combine: all_pass
- id: activities_data_export_activities_data_export_enable_view
  version: '1.0'
  applicable_bundles:
  - activities_data_export
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
- id: activities_data_export_activities_data_export_page_path
  version: '1.0'
  applicable_bundles:
  - activities_data_export
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
