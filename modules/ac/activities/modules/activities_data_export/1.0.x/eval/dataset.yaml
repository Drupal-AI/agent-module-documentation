metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: activities_data_export
  version: 1.0.x
  note: 'Activity Data Export is the Activities submodule that installs the views.view.activity_log View
    over the parent''s user_activities base table. It has three displays: default, page (path admin/config/system/activity,
    ''Activities Log''), and export (data_export, path admin/config/system/activity/export, CSV via views_data_export
    / XLS via xls_serialization). No config schema, services, permissions, or Drush of its own. Live-state
    cases read/write the raw views.view.activity_log config object (status, label, display page path)
    via the config API, which avoids Views handler/plugin discovery (a broken unrelated module can fatal
    during full Views handler instantiation on this shared site).'
questions:
- id: activities_data_export-log-path
  input: After enabling the activities_data_export submodule, at what admin path can I see the activity
    log, and how do I export it?
  criteria: The Activities Log page is at /admin/config/system/activity (the activity_log View's page
    display). An 'Export all activity log data' action link / the export display at /admin/config/system/activity/export
    downloads the log as CSV (or XLS via xls_serialization).
  bundle: activities_data_export
  rubric_ref: rubric/activities_data_export_activities_data_export_log_path@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: activities_data_export-view
  input: Which Drupal View does the activities_data_export submodule provide, and what entity/base table
    does it list?
  criteria: It installs the views.view.activity_log View over the user_activities base table (the parent
    Activities module's log entity). Uninstalling the submodule deletes that View.
  bundle: activities_data_export
  rubric_ref: rubric/activities_data_export_activities_data_export_view@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: activities_data_export-deps
  input: What extra modules power the CSV/XLS export in the activities_data_export submodule?
  criteria: The export uses views_data_export (which supplies the data_export View display for CSV) and
    xls_serialization (for the XLS format), plus rest for the serialization stack; it also depends on
    the activities module.
  bundle: activities_data_export
  rubric_ref: rubric/activities_data_export_activities_data_export_deps@1.0
  tags:
  - mode:recipe
  - difficulty:easy
