metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: acquia_search_defaults
  version: 3.1.x
  note: Submodule of acquia_search. Ships only optional config (a default Search API Solr index + a search
    View); no code, settings, permissions or Drush. Cases are `recipe` (response-graded), probing documented
    facts; no site mutation.
questions:
- id: acquia-search-defaults-purpose
  input: What does the Acquia Search Defaults submodule give you, and what does enabling it require?
  criteria: It installs a ready-made Search API Solr index (acquia_search_index) on the acquia_search_server
    plus a search View (views.view.acquia_search), so a connected site has working node search out of
    the box. It ships only optional config — no code, settings, permissions or Drush.
  bundle: acquia_search_defaults
  rubric_ref: rubric/acquia_search_defaults_acquia_search_defaults_purpose@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: acquia-search-defaults-config-names
  input: Which config entities does Acquia Search Defaults create, and what server does the index attach
    to?
  criteria: A Search API index 'acquia_search_index' attached to the 'acquia_search_server', and a View
    'views.view.acquia_search'.
  bundle: acquia_search_defaults
  rubric_ref: rubric/acquia_search_defaults_acquia_search_defaults_config_names@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: acquia-search-defaults-optional-gotcha
  input: Why might enabling Acquia Search Defaults not actually create its index? What does it depend
    on?
  criteria: Its config lives in config/optional, so the index is imported only if its dependencies already
    exist — the acquia_search_server and the node Body field (field.storage.node.body). If those are missing
    at enable time, Drupal silently skips creating the index.
  bundle: acquia_search_defaults
  rubric_ref: rubric/acquia_search_defaults_acquia_search_defaults_optional_gotcha@1.0
  tags:
  - mode:recipe
  - difficulty:easy
