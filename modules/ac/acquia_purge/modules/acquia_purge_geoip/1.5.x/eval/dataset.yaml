questions:
- id: acquia-purge-geoip-purpose
  input: What does the Acquia Purge GeoIP submodule do on an Acquia Cloud site?
  criteria: It adds X-Geo-Country to Drupal's Vary response header so cached pages vary by the visitor's
    country.
  bundle: acquia_purge_geoip
  rubric_ref: rubric/acquia_purge_geoip_acquia_purge_geoip_purpose@1.0
  tags:
  - mode:recipe
- id: acquia-purge-geoip-header
  input: Which exact HTTP response header value does Acquia Purge GeoIP set to enable per-country cache
    variation?
  criteria: 'It sets ''Vary: X-Geo-Country'' on responses.'
  bundle: acquia_purge_geoip
  rubric_ref: rubric/acquia_purge_geoip_acquia_purge_geoip_header@1.0
  tags:
  - mode:recipe
- id: acquia-purge-geoip-enable
  input: How do I turn on per-country cache variation via Acquia Purge GeoIP, and is there anything to
    configure?
  criteria: Enable it with drush en acquia_purge_geoip; there is no configuration, UI or permissions.
  bundle: acquia_purge_geoip
  rubric_ref: rubric/acquia_purge_geoip_acquia_purge_geoip_enable@1.0
  tags:
  - mode:recipe
- id: acquia-purge-geoip-mechanism
  input: Technically, how does Acquia Purge GeoIP add the Vary header — what Drupal mechanism does it
    use?
  criteria: A response event subscriber (SetVaryHeader) on the kernel RESPONSE event sets the Vary header.
  bundle: acquia_purge_geoip
  rubric_ref: rubric/acquia_purge_geoip_acquia_purge_geoip_mechanism@1.0
  tags:
  - mode:recipe
- id: acquia-purge-geoip-tradeoff
  input: When should I avoid enabling Acquia Purge GeoIP?
  criteria: Avoid it unless content actually differs by country, because varying the cache per country
    multiplies cached variants and lowers the cache hit rate.
  bundle: acquia_purge_geoip
  rubric_ref: rubric/acquia_purge_geoip_acquia_purge_geoip_tradeoff@1.0
  tags:
  - mode:recipe
