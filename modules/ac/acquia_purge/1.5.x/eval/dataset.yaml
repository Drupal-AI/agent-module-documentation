metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: acquia_purge
  version: 1.5.x
  note: Acquia Purge is a Purge purger plugin for Acquia Cloud with no config UI; setup is via Drush and
    settings.php. Cases are `recipe` (response-graded), probing documented facts an agent would otherwise
    read source to answer; no site mutation.
questions:
- id: acquia-purge-what-it-is
  input: On a Drupal 11 site hosted on Acquia Cloud, what is the Acquia Purge module and which module
    does it require to function?
  criteria: Acquia Purge is a Purge 'purger' plugin that invalidates Acquia Cloud's Varnish load balancers
    (and optionally the Acquia Platform CDN). It depends on the purge module (and purge_queuer_coretags).
  bundle: acquia_purge
  rubric_ref: rubric/acquia_purge_acquia_purge_what_it_is@1.0
  tags:
  - mode:recipe
- id: acquia-purge-register-purger
  input: How do I register the Acquia Cloud purger with Purge on a Drupal site? Give the Drush command
    and the purger plugin id.
  criteria: drush p:purger-add --if-not-exists acquia_purge (plugin id 'acquia_purge', label 'Acquia Cloud');
    add 'acquia_platform_cdn' too for the Platform CDN.
  bundle: acquia_purge
  rubric_ref: rubric/acquia_purge_acquia_purge_register_purger@1.0
  tags:
  - mode:recipe
- id: acquia-purge-no-ui
  input: Where is the settings/configuration form for Acquia Purge in the Drupal admin UI?
  criteria: There is no admin UI or config form by design; setup is done with Drush and tuning is via
    settings.php so changes stay traceable.
  bundle: acquia_purge
  rubric_ref: rubric/acquia_purge_acquia_purge_no_ui@1.0
  tags:
  - mode:recipe
- id: acquia-purge-token
  input: How can I set a custom X-Acquia-Purge header token on Acquia Purge to help offset DDOS-style
    attacks?
  criteria: Set $settings['acquia_purge_token'] = 'secret' in settings.php; it overrides the default token
    (the Acquia site name) but requires matching balancer config from Acquia Support.
  bundle: acquia_purge
  rubric_ref: rubric/acquia_purge_acquia_purge_token@1.0
  tags:
  - mode:recipe
- id: acquia-purge-invalidation-types
  input: Which invalidation types does the Acquia Cloud purger (plugin id acquia_purge) support?
  criteria: url, wildcardurl, tag and everything (the acquia_platform_cdn purger supports url, tag and
    everything).
  bundle: acquia_purge
  rubric_ref: rubric/acquia_purge_acquia_purge_invalidation_types@1.0
  tags:
  - mode:recipe
- id: acquia-purge-platforminfo-service
  input: In PHP, which Acquia Purge service tells me whether the current site is running on Acquia Cloud
    and gives the load-balancer IP addresses?
  criteria: 'The acquia_purge.platforminfo service (PlatformInfo/PlatformInfoInterface): isThisAcquiaCloud()
    and getBalancerAddresses().'
  bundle: acquia_purge
  rubric_ref: rubric/acquia_purge_acquia_purge_platforminfo_service@1.0
  tags:
  - mode:recipe
- id: acquia-purge-verify-diagnostics
  input: After setting up Acquia Purge, how do I verify the purge setup is working from the command line?
  criteria: Run drush p:diagnostics; the Acquia Cloud, Platform CDN and Recommendations checks should
    report OK.
  bundle: acquia_purge
  rubric_ref: rubric/acquia_purge_acquia_purge_verify_diagnostics@1.0
  tags:
  - mode:recipe
- id: acquia-purge-geoip-submodule
  input: Which Acquia Purge submodule makes cached pages vary by visitor country, and which header does
    it add?
  criteria: The acquia_purge_geoip submodule adds X-Geo-Country to Drupal's Vary response header.
  bundle: acquia_purge
  rubric_ref: rubric/acquia_purge_acquia_purge_geoip_submodule@1.0
  tags:
  - mode:recipe
