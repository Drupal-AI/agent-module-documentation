rubrics:
- id: access_unpublished_au_share_draft_flow
  version: '1.0'
  applicable_bundles:
  - access_unpublished
  checks:
  - kind: must_contain_any
    values:
    - Generate token
    - auHash
    - Temporary unpublished access
  scoring:
    combine: all_pass
- id: access_unpublished_au_access_token_entity
  version: '1.0'
  applicable_bundles:
  - access_unpublished
  checks:
  - kind: must_contain_any
    values:
    - access_token
    - content entity
  scoring:
    combine: all_pass
- id: access_unpublished_au_hash_param_access_check
  version: '1.0'
  applicable_bundles:
  - access_unpublished
  checks:
  - kind: must_contain_any
    values:
    - auHash
    - hash_key
    - hook_entity_access
    - access_unpublished_entity_access
  scoring:
    combine: all_pass
- id: access_unpublished_au_token_lifetime
  version: '1.0'
  applicable_bundles:
  - access_unpublished
  checks:
  - kind: must_contain_any
    values:
    - duration
    - '172800'
  scoring:
    combine: all_pass
- id: access_unpublished_au_anonymous_permission
  version: '1.0'
  applicable_bundles:
  - access_unpublished
  checks:
  - kind: must_contain_any
    values:
    - access_unpublished node article
    - access_unpublished node
  scoring:
    combine: all_pass
- id: access_unpublished_au_token_admin
  version: '1.0'
  applicable_bundles:
  - access_unpublished
  checks:
  - kind: must_contain_any
    values:
    - /admin/content/access_token
    - access tokens overview
  scoring:
    combine: all_pass
- id: access_unpublished_au_create_token_in_code
  version: '1.0'
  applicable_bundles:
  - access_unpublished
  checks:
  - kind: must_contain_any
    values:
    - access_token
    - access_unpublished.access_token_manager
    - getAccessTokenUrl
  scoring:
    combine: all_pass
