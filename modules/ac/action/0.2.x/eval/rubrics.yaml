rubrics:
- id: action_action_shipped_plugins
  version: '1.0'
  applicable_bundles:
  - action
  checks:
  - kind: must_contain_any
    values:
    - node_unpublish_by_keyword_action
    - node_assign_owner_action
    - comment_unpublish_by_keyword_action
  scoring:
    combine: all_pass
- id: action_action_ui_route_permission
  version: '1.0'
  applicable_bundles:
  - action
  checks:
  - kind: must_contain_any
    values:
    - /admin/config/system/actions
    - administer actions
    - entity.action.collection
  scoring:
    combine: all_pass
- id: action_action_config_entity_shape
  version: '1.0'
  applicable_bundles:
  - action
  checks:
  - kind: must_contain_any
    values:
    - action.action
    - plugin
    - configuration
  scoring:
    combine: all_pass
- id: action_action_write_configurable_plugin
  version: '1.0'
  applicable_bundles:
  - action
  checks:
  - kind: must_contain_any
    values:
    - ConfigurableActionBase
    - PluginFormInterface
    - '#[Action'
  scoring:
    combine: all_pass
- id: action_action_introspect_keywords
  version: '1.0'
  applicable_bundles:
  - action
  checks:
  - kind: must_contain_any
    values:
    - forbidden
    - spamword
  scoring:
    combine: all_pass
- id: action_action_introspect_plugin
  version: '1.0'
  applicable_bundles:
  - action
  checks:
  - kind: must_contain_any
    values:
    - node_assign_owner_action
  scoring:
    combine: all_pass
- id: action_action_introspect_type
  version: '1.0'
  applicable_bundles:
  - action
  checks:
  - kind: must_contain_any
    values:
    - comment
  scoring:
    combine: all_pass
- id: action_action_create_unpublish_keyword
  version: '1.0'
  applicable_bundles:
  - action
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
- id: action_action_create_assign_owner
  version: '1.0'
  applicable_bundles:
  - action
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
- id: action_action_create_comment_keyword
  version: '1.0'
  applicable_bundles:
  - action
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
