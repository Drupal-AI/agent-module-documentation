metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: plupload_test
  version: 2.2.x
  note: 'plupload_test is a demo/support submodule of plupload. Its only surface is one form (\Drupal\plupload_test\PluploadTestForm,
    form id _plupload_test_form) at route plupload.test => /plupload-test (requirement _access: ''TRUE'',
    ''do not enable in production''). The form uses a #type ''plupload'' element restricted to ''zip'',
    validates status===''done'', and moves finished temp files into <default_scheme>://plupload-test.
    It has no config/permissions/services/plugins of its own. Medium cases read back the shared plupload.settings
    temporary_uri that the demo stages chunks in, and confirm the demo route is registered. Hard cases:
    (1) enable the demo module so /plupload-test is live; (2) create the public://plupload-test destination
    directory the demo writes finished uploads into, verified on disk.'
questions:
- id: plupload_test-route
  input: The Drupal 'plupload_test' submodule ships a working example. At what URL path can I open its
    demo upload form, and what file extension does that form accept?
  criteria: 'Visit /plupload-test (route plupload.test). The demo form restricts the plupload element
    to the ''zip'' extension via #upload_validators.'
  bundle: plupload_test
  rubric_ref: rubric/plupload_test_plupload_test_route@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: plupload_test-class
  input: Which form class and form id does the plupload_test module provide as its example, and what upload
    pattern does its submit handler demonstrate?
  criteria: Class \Drupal\plupload_test\PluploadTestForm, form id _plupload_test_form. Its submitForm()
    prepares a destination directory (<default_scheme>://plupload-test) and moves each finished plupload
    temp file (tmppath/name) there without creating File entities.
  bundle: plupload_test
  rubric_ref: rubric/plupload_test_plupload_test_class@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: plupload_test-production
  input: Is it safe to leave the plupload_test module enabled on a production Drupal site? Why or why
    not?
  criteria: 'No — it is a demo/test fixture. Its route plupload.test uses requirement _access: ''TRUE''
    (open to everyone) and its own routing file comments ''Do not enable in production''. Keep it disabled
    on production.'
  bundle: plupload_test
  rubric_ref: rubric/plupload_test_plupload_test_production@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: plupload_test-stage-uri
  input: On this site, where does the plupload_test demo form (/plupload-test) stage its in-progress upload
    chunks before they are moved? Inspect the live configuration and give the exact URI.
  criteria: It stages chunks at the plupload temporary_uri, currently 'private://plupload_test_pt' (drush
    cget plupload.settings temporary_uri). The demo relies on the parent module's plupload.settings.
  bundle: plupload_test
  rubric_ref: rubric/plupload_test_plupload_test_stage_uri@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/plupload_test-tmpuri-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/plupload_test-tmpuri-cleanup.sh
- id: plupload_test-route-live
  input: On this Drupal site, is the plupload_test demo module currently providing its example form route,
