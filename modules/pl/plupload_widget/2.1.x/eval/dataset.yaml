metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: plupload_widget
  version: 2.1.x
  note: 'Plupload file widget provides two field widgets built on the plupload module: ''plupload_file_widget''
    for core file fields (no settings) and ''plupload_image_widget'' for core image fields (one setting
    preview_image_style, schema field.widget.settings.plupload_image_widget). It renders a #type=>plupload
    element with #autoupload+#autosubmit, chunked uploads with chunk_size/max_file_size derived from PHP
    upload_max_filesize/post_max_size, runtimes html5,flash,silverlight,html4. No field type, settings
    form, permission, drush, or config route. Depends on drupal/plupload. Medium cases install known state
    (a file field using the widget; an image widget''s preview_image_style). Hard cases build real state
    verified against the live entity_form_display: set a file field''s widget to plupload_file_widget,
    and set an image field''s widget to plupload_image_widget with a preview style. Fixtures namespaced
    field_plw_*.'
questions:
- id: plupload_widget-which-widget
  input: Using the plupload_widget (Plupload file widget) module on Drupal 11, which field widget do I
    select on Manage form display for a core File field, and which one for a core Image field?
  criteria: Use the 'plupload_file_widget' widget for a core File field and the 'plupload_image_widget'
    widget for a core Image field, selected on the field's Manage form display.
  bundle: plupload_widget
  rubric_ref: rubric/plupload_widget_plupload_widget_which_widget@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: plupload_widget-what-it-does
  input: What does the plupload_widget module's widget do differently from the standard file upload widget,
    and what does it depend on?
  criteria: 'It renders a Plupload (#type => plupload) element with #autoupload and #autosubmit so files
    upload on selection and the form auto-submits; uploads are chunked (chunk_size/max_file_size computed
    from PHP upload_max_filesize/post_max_size), enabling large-file uploads with progress. It depends
    on the drupal/plupload module.'
  bundle: plupload_widget
  rubric_ref: rubric/plupload_widget_plupload_widget_what_it_does@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: plupload_widget-image-setting
  input: The plupload_widget image widget has a configurable setting. What is it and what does it control?
  criteria: The plupload_image_widget has a single setting, preview_image_style (config schema field.widget.settings.plupload_image_widget),
    which sets the image style used for the uploaded-image preview. The plupload_file_widget has no settings.
  bundle: plupload_widget
  rubric_ref: rubric/plupload_widget_plupload_widget_image_setting@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: plupload_widget-known-file
  input: On this Drupal site, one File field on the Article content type uses the Plupload upload widget
    on its default form display. Inspect the live configuration and give the machine name of that field.
  criteria: 'field_plw_known: in core.entity_form_display.node.article.default its component uses widget
    type ''plupload_file_widget''.'
  bundle: plupload_widget
  rubric_ref: rubric/plupload_widget_plupload_widget_known_file@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/plupload_widget-known-file-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/plupload_widget-known-file-cleanup.sh
- id: plupload_widget-known-style
  input: On this Drupal site, the Article content type has an Image field (field_plw_img) using the Plupload
    image widget with a configured preview image style. Inspect the live form-display configuration and
    give the image style machine name it uses for the preview.
  criteria: The field_plw_img component's plupload_image_widget has settings.preview_image_style = 'large'
    (readable via `drush cget core.entity_form_display.node.article.default content.field_plw_img`).
  bundle: plupload_widget
  rubric_ref: rubric/plupload_widget_plupload_widget_known_style@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/plupload_widget-known-style-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/plupload_widget-known-style-cleanup.sh
- id: plupload_widget-set-file
  input: On this Drupal site the Article content type has a File field field_plw_task whose form display
    uses the standard core file widget. Using the plupload_widget module, switch that field's widget to
    the Plupload file widget so it supports chunked uploads. Apply the change to the live site.
  criteria: In core.entity_form_display.node.article.default the field_plw_task component's widget type
    is 'plupload_file_widget' (set via Manage form display or the entity_form_display config).
  bundle: plupload_widget
  rubric_ref: rubric/plupload_widget_plupload_widget_set_file@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/plupload_widget-set-file-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/plupload_widget-set-file-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/plupload_widget-set-file-verify.sh
    unused_text_checks:
      must_contain_any: []
      must_not_contain: []
- id: plupload_widget-set-image
  input: On this Drupal site the Article content type has an Image field field_plw_disp using the standard
    core image widget. Using the plupload_widget module, change its form-display widget to the Plupload
    image widget and set the preview image style to 'thumbnail'. Apply the change to the live site.
  criteria: In core.entity_form_display.node.article.default the field_plw_disp component has widget type
    'plupload_image_widget' and settings.preview_image_style 'thumbnail'.
  bundle: plupload_widget
  rubric_ref: rubric/plupload_widget_plupload_widget_set_image@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/plupload_widget-set-image-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/plupload_widget-set-image-cleanup.sh
