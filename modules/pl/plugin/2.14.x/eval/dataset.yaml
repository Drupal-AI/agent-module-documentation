metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: plugin
  version: 2.14.x
  note: 'Plugin is a developer/API module. It defines ONE plugin type of its own, plugin_selector (manager
    plugin.manager.plugin.plugin_selector; selectors plugin_radios, plugin_select_list), and provides:
    a plugin-type registry (plugin.plugin_type_manager, discovery via MODULE.plugin_type.yml, admin UI
    /admin/structure/plugin route plugin.plugin_type.list, perm plugin.overview.view, ParamConverters),
    a ''plugin'' (plugin collection) field type derived per registered plugin type as plugin:<plugin_type_id>
    (e.g. plugin:condition, plugin:action, plugin:block) with a derived Plugin selector widget (plugin_selector:plugin_radios
    / plugin_selector:plugin_select_list) and plugin_label / plugin_block_built formatters, hook_plugin_selector_alter(),
    and a Drush ''plugin-types'' cache-clear callback (no standalone drush command). Easy cases probe
    that API surface as text. Medium/hard cases are grounded in real config the agent can create on the
    live site: a plugin:<type> field on Article and the Plugin selector widget on its form display (verified
    against field storage / form-display config). No live external calls involved.'
questions:
- id: plugin-register-type
  input: Using the contrib Plugin module (drupal/plugin) on Drupal 11, how does a module make its own
    plugin manager show up as a discoverable 'plugin type' in the plugin registry, and which service lists
    all registered plugin types?
  criteria: Add a MODULE.plugin_type.yml file listing the plugin type id with its label and plugin_manager_service_id.
    The plugin.plugin_type_manager service (PluginTypeManagerInterface) then exposes them via getPluginTypes()/getPluginType($id),
    and they appear at /admin/structure/plugin (route plugin.plugin_type.list, perm plugin.overview.view).
  bundle: plugin
  rubric_ref: rubric/plugin_plugin_register_type@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: plugin-field-type
  input: The drupal/plugin module lets an entity field store a chosen plugin and its configuration. What
    is the field type called, how are the concrete field-type ids named per plugin type, and which widget
    lets an editor pick the plugin?
  criteria: The field type base id is 'plugin' (a plugin collection), derived per plugin type as plugin:<plugin_type_id>
    (e.g. plugin:condition, plugin:block). Editors pick a plugin with the derived Plugin selector widget
    (plugin_selector:plugin_radios or plugin_selector:plugin_select_list); formatters are plugin_label
    and plugin_block_built.
  bundle: plugin
  rubric_ref: rubric/plugin_plugin_field_type@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: plugin-selector-plugin-type
  input: In the drupal/plugin module, which plugin type does the module define itself (as opposed to the
    core types it merely registers), what are the two shipped selector plugins, and how do you alter the
    available ones?
  criteria: It defines the plugin_selector plugin type (manager plugin.manager.plugin.plugin_selector).
    Shipped selectors are plugin_radios and plugin_select_list. Alter them with hook_plugin_selector_alter(array
    &$definitions).
  bundle: plugin
  rubric_ref: rubric/plugin_plugin_selector_plugin_type@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: plugin-known-field-type
  input: On this Drupal site the Article content type has a field named field_plugin_known created with
    the drupal/plugin 'plugin collection' field type. Inspect the live field configuration and state which
    plugin type that field references (i.e. its exact field-type id).
  criteria: field_plugin_known has field-type id plugin:condition (a plugin-collection field keyed to
    the core Condition plugin type), visible in field.storage.node.field_plugin_known.type or via drush
    field:info.
  bundle: plugin
  rubric_ref: rubric/plugin_plugin_known_field_type@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/plugin-known-field-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/plugin-known-field-cleanup.sh
- id: plugin-field-widget
  input: The Article content type on this site has a plugin-collection field field_plugin_widget. Inspect
    the live default form display and report which edit widget is configured for that field.
  criteria: field_plugin_widget uses the Plugin selector widget plugin_selector:plugin_select_list on
    core.entity_form_display.node.article.default (component type).
  bundle: plugin
  rubric_ref: rubric/plugin_plugin_field_widget@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/plugin-field-widget-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/plugin-field-widget-cleanup.sh
- id: plugin-add-field
  input: On this Drupal site, add a field named field_plugin_task to the Article content type using the
    drupal/plugin 'plugin collection' field type (any plugin type is fine, e.g. plugin:condition or plugin:action).
    Create the field storage and the field on Article on the live site.
  criteria: A field storage node.field_plugin_task exists whose type is plugin:<plugin_type_id> (e.g.
    plugin:condition), with a matching field on the article bundle.
  bundle: plugin
  rubric_ref: rubric/plugin_plugin_add_field@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/plugin-add-field-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/plugin-add-field-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/plugin-add-field-verify.sh
- id: plugin-set-selector-widget
  input: On this Drupal site the Article content type already has a plugin-collection field field_plugin_wtask,
    but it is not shown on the edit form. Configure the default form display so field_plugin_wtask uses
    the drupal/plugin 'Plugin selector' widget, and save it to the live site.
  criteria: In core.entity_form_display.node.article.default the field_plugin_wtask component has a widget
    type starting with plugin_selector (e.g. plugin_selector:plugin_select_list or plugin_selector:plugin_radios).
  bundle: plugin
  rubric_ref: rubric/plugin_plugin_set_selector_widget@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/plugin-set-widget-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/plugin-set-widget-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/plugin-set-widget-verify.sh
