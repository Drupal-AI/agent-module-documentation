rubrics:
- id: plugin_plugin_register_type
  version: '1.0'
  applicable_bundles:
  - plugin
  checks:
  - kind: must_contain_any
    values:
    - plugin_type.yml
    - plugin.plugin_type_manager
    - PluginTypeManager
  scoring:
    combine: all_pass
- id: plugin_plugin_field_type
  version: '1.0'
  applicable_bundles:
  - plugin
  checks:
  - kind: must_contain_any
    values:
    - 'plugin:'
    - plugin collection
    - plugin_selector
    - plugin_reference
  scoring:
    combine: all_pass
- id: plugin_plugin_selector_plugin_type
  version: '1.0'
  applicable_bundles:
  - plugin
  checks:
  - kind: must_contain_any
    values:
    - plugin_selector
    - plugin_radios
    - plugin_select_list
    - hook_plugin_selector_alter
  scoring:
    combine: all_pass
- id: plugin_plugin_known_field_type
  version: '1.0'
  applicable_bundles:
  - plugin
  checks:
  - kind: must_contain_any
    values:
    - plugin:condition
  scoring:
    combine: all_pass
- id: plugin_plugin_field_widget
  version: '1.0'
  applicable_bundles:
  - plugin
  checks:
  - kind: must_contain_any
    values:
    - plugin_selector:plugin_select_list
    - plugin_selector
    - Plugin selector
  scoring:
    combine: all_pass
- id: plugin_plugin_add_field
  version: '1.0'
  applicable_bundles:
  - plugin
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
- id: plugin_plugin_set_selector_widget
  version: '1.0'
  applicable_bundles:
  - plugin
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
