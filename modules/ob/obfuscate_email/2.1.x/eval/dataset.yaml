metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: obfuscate_email
  version: 2.1.x
  note: 'Obfuscate Email hides emails via ROT13 (with @->/at/, .->/dot/) plus a shared vanilla-JS reveal
    (library obfuscate_email/default). Two entry points: a text-format filter plugin obfuscate_email (TYPE_TRANSFORM_REVERSIBLE,
    settings click + click_label; config filter.format.<id>.filters.obfuscate_email) and a field template
    field__email / field--email.html.twig for fields named field_email (with a rot13 Twig filter). No
    configure route, no permissions, no Drush. Medium cases create text format oe_test_format with the
    filter enabled (click_label OE_CLICK_SENTINEL) and inspect it. Hard cases enable the filter on an
    existing format (hard-1) and build a new click-to-reveal format (hard-2), verified against filter.format
    config.'
questions:
- id: obfuscate_email-how
  input: How does the obfuscate_email module hide an email address from spam bots, and how does the real
    address get shown to a normal visitor?
  criteria: 'The address is scrambled server-side with str_rot13() after replacing ''.'' with /dot/ and
    ''@'' with /at/, and stored in a data-mail-to attribute (the visible text is blanked to @email and
    the href set to #). A vanilla-JS behaviour (Drupal.behaviors.obfuscateEmailField, library obfuscate_email/default,
    attached to every page) reverses the ROT13 and the /at//dot/ substitutions in the browser and restores
    the mailto: link. There is no non-JavaScript fallback.'
  bundle: obfuscate_email
  rubric_ref: rubric/obfuscate_email_obfuscate_email_how@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: obfuscate_email-filter
  input: I want email addresses typed into CKEditor body text to be obfuscated on output. Which obfuscate_email
    feature do I use, where do I turn it on, and what options does it have?
  criteria: 'Enable the ''Obfuscate Email'' filter (id obfuscate_email, a TYPE_TRANSFORM_REVERSIBLE filter)
    on the relevant text format at Configuration » Content authoring » Text formats and editors. It rewrites
    mailto: anchors in the processed text. Options: ''click'' (require a click to reveal) and ''click_label''
    (the reveal link text). Stored under filter.format.<id> -> filters.obfuscate_email.'
  bundle: obfuscate_email
  rubric_ref: rubric/obfuscate_email_obfuscate_email_filter@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: obfuscate_email-template
  input: Besides the text filter, obfuscate_email ships a field template. Which theme hook / template
    file is it, and which field does it automatically obfuscate?
  criteria: hook_theme() registers the field__email theme hook using templates/field--email.html.twig
    (base hook 'field'), so it renders — and obfuscates — any field whose machine name is field_email.
    It uses the module's rot13 Twig filter and the same /at//dot/ scheme, emitting data-mail-to markup
    that the shared JS reassembles.
  bundle: obfuscate_email
  rubric_ref: rubric/obfuscate_email_obfuscate_email_template@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: obfuscate_email-known-label
  input: This site has a text format named oe_test_format with the Obfuscate Email filter enabled and
    configured to require a click. Inspect the live configuration and report the exact 'Text to show on
    link' (click_label) value.
  criteria: The click_label is 'OE_CLICK_SENTINEL' (filter.format.oe_test_format -> filters.obfuscate_email.settings.click_label).
  bundle: obfuscate_email
  rubric_ref: rubric/obfuscate_email_obfuscate_email_known_label@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/obfuscate_email-known-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/obfuscate_email-known-cleanup.sh
- id: obfuscate_email-which-format
  input: On this site, which text format currently has the obfuscate_email filter enabled? Inspect the
    live filter format configuration to answer.
  criteria: The oe_test_format text format has filters.obfuscate_email.status = true.
  bundle: obfuscate_email
  rubric_ref: rubric/obfuscate_email_obfuscate_email_which_format@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/obfuscate_email-known-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/obfuscate_email-known-cleanup.sh
- id: obfuscate_email-enable-on-format
  input: This site has a text format named oe_task_format that does not yet obfuscate emails. Enable the
    obfuscate_email filter on that text format and apply the change to the live site.
  criteria: 'In filter.format.oe_task_format the obfuscate_email filter has status: true (e.g. via FilterFormat::load(''oe_task_format'')->setFilterConfig(''obfuscate_email'',
    [''status'' => TRUE])->save()).'
  bundle: obfuscate_email
  rubric_ref: rubric/obfuscate_email_obfuscate_email_enable_on_format@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/obfuscate_email-enable-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/obfuscate_email-enable-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/obfuscate_email-enable-verify.sh
- id: obfuscate_email-build-click-format
  input: Create a new text format called 'oe_secure' (machine name oe_secure) that hides email addresses
    and forces visitors to click a link reading 'Reveal' before the address is shown. Save it on the live
    site.
  criteria: 'A FilterFormat ''oe_secure'' exists with filters.obfuscate_email enabled (status true) and
    settings click: true, click_label: ''Reveal''.'
  bundle: obfuscate_email
  rubric_ref: rubric/obfuscate_email_obfuscate_email_build_click_format@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: layman
    reset: agent-module-documentation/evaluation/verify/obfuscate_email-secure-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/obfuscate_email-secure-reset.sh
    verify: agent-module-documentation/evaluation/verify/obfuscate_email-secure-verify.sh
