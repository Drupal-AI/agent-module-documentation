metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: owlcarousel
  version: 3.1.x
  note: 'Owl Carousel integrates the OwlCarousel2 JS slider via two integrations sharing one option set
    (OwlCarouselGlobal): a field formatter owlcarousel_field_formatter for image fields, and a Views style
    plugin ''owlcarousel''. Options: items, margin, nav, dots, autoplay(+HoverPause), loop, rtl, itemsMobile/dimensionMobile,
    itemsDesktop/dimensionDesktop; formatter adds image_style/image_link. No settings page, no configure
    route, no config schema, no permissions. Requires the third-party owlcarousel2 JS library in /libraries
    (Drush owlcarousel:download / oc:dl installs it). Medium/hard cases are grounded in the field formatter''s
    real display config (Views style config is fragile on this shared site''s Views stack): introspection
    reads items/margin configured on an image field; execution switches an image field to owlcarousel_field_formatter
    with a given items count / loop, verified against the live entity_view_display.'
questions:
- id: owlcarousel-integrations
  input: What are the two ways to render content as a carousel with the owlcarousel module, and what are
    their machine ids?
  criteria: A field formatter for image fields (id owlcarousel_field_formatter, 'OwlCarousel Carousel')
    chosen on Manage display, and a Views style plugin (id owlcarousel, 'OwlCarousel') chosen as a view's
    Format.
  bundle: owlcarousel
  rubric_ref: rubric/owlcarousel_owlcarousel_integrations@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: owlcarousel-library
  input: owlcarousel says the carousel isn't working because the library is missing. How do I install
    the OwlCarousel2 library, and is there a Drush command for it?
  criteria: 'The owlcarousel2 JS library must live at /libraries/owlcarousel2/dist/owl.carousel.js. Run
    drush owlcarousel:download (alias oc:dl) to fetch and install it (legacy: drush owlcarousel-plugin),
    or download OwlCarousel2 2.3.4 manually into /libraries/owlcarousel2.'
  bundle: owlcarousel
  rubric_ref: rubric/owlcarousel_owlcarousel_library@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: owlcarousel-options
  input: Which options can I set on an Owl Carousel to control how many slides show, looping, arrows,
    dots, and autoplay?
  criteria: The shared options include items, margin, nav (arrows), dots (pagination), autoplay + autoplayHoverPause,
    loop, rtl, and mobile/desktop responsive item counts (itemsMobile/dimensionMobile, itemsDesktop/dimensionDesktop).
    The field formatter also has image_style and image_link.
  bundle: owlcarousel
  rubric_ref: rubric/owlcarousel_owlcarousel_options@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: owlcarousel-read-items
  input: On this site the Article content type has an image field (field_owl_img) displayed as an Owl
    Carousel. Inspect the live default display and state how many items per slide the carousel is configured
    to show.
  criteria: field_owl_img uses the owlcarousel_field_formatter with settings.items = 4 (margin 20, loop
    and nav on) in core.entity_view_display.node.article.default.
  bundle: owlcarousel
  rubric_ref: rubric/owlcarousel_owlcarousel_read_items@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/owlcarousel-read-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/owlcarousel-read-cleanup.sh
- id: owlcarousel-read-margin
  input: The Article image field field_owl_img is shown as an Owl Carousel. Inspect the live display configuration
    and state the margin (pixel gap) set between carousel items.
  criteria: field_owl_img's owlcarousel_field_formatter settings.margin = 20 in core.entity_view_display.node.article.default.
  bundle: owlcarousel
  rubric_ref: rubric/owlcarousel_owlcarousel_read_margin@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/owlcarousel-read-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/owlcarousel-read-cleanup.sh
- id: owlcarousel-set-items
  input: On this site the Article content type has an image field field_owl_pic shown with the plain core
    image formatter. Using owlcarousel, display it as an Owl Carousel showing 5 items per slide. Apply
    the change to the live site.
  criteria: In core.entity_view_display.node.article.default the field_owl_pic component uses type owlcarousel_field_formatter
    with settings.items = 5.
  bundle: owlcarousel
  rubric_ref: rubric/owlcarousel_owlcarousel_set_items@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/owlcarousel-set-items-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/owlcarousel-set-items-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/owlcarousel-set-items-verify.sh
- id: owlcarousel-set-loop
  input: The Article content type has an image field field_owl_slide displayed with the plain core image
    formatter. Using owlcarousel, display it as an Owl Carousel that loops infinitely. Apply the change
    to the live site.
  criteria: In core.entity_view_display.node.article.default the field_owl_slide component uses type owlcarousel_field_formatter
    with settings.loop truthy.
  bundle: owlcarousel
  rubric_ref: rubric/owlcarousel_owlcarousel_set_loop@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/owlcarousel-set-loop-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/owlcarousel-set-loop-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/owlcarousel-set-loop-verify.sh
