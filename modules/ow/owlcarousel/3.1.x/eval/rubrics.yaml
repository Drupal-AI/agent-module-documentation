rubrics:
- id: owlcarousel_owlcarousel_integrations
  version: '1.0'
  applicable_bundles:
  - owlcarousel
  checks:
  - kind: must_contain_any
    values:
    - owlcarousel_field_formatter
    - field formatter
    - views style
    - views
  scoring:
    combine: all_pass
- id: owlcarousel_owlcarousel_library
  version: '1.0'
  applicable_bundles:
  - owlcarousel
  checks:
  - kind: must_contain_any
    values:
    - owlcarousel:download
    - oc:dl
    - libraries/owlcarousel2
    - owlcarousel-plugin
  scoring:
    combine: all_pass
- id: owlcarousel_owlcarousel_options
  version: '1.0'
  applicable_bundles:
  - owlcarousel
  checks:
  - kind: must_contain_any
    values:
    - items
    - loop
    - nav
    - dots
    - autoplay
  scoring:
    combine: all_pass
- id: owlcarousel_owlcarousel_read_items
  version: '1.0'
  applicable_bundles:
  - owlcarousel
  checks:
  - kind: must_contain_any
    values:
    - '4'
  scoring:
    combine: all_pass
- id: owlcarousel_owlcarousel_read_margin
  version: '1.0'
  applicable_bundles:
  - owlcarousel
  checks:
  - kind: must_contain_any
    values:
    - '20'
  scoring:
    combine: all_pass
- id: owlcarousel_owlcarousel_set_items
  version: '1.0'
  applicable_bundles:
  - owlcarousel
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
- id: owlcarousel_owlcarousel_set_loop
  version: '1.0'
  applicable_bundles:
  - owlcarousel
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
