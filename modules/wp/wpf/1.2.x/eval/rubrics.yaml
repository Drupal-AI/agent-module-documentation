rubrics:
- id: wpf_wpf_what_it_does
  version: '1.0'
  applicable_bundles:
  - wpf
  checks:
  - kind: must_contain_any
    values:
    - fallback
    - webp
    - jpg
    - jpeg
    - responsive
    - on demand
    - requested
  scoring:
    combine: all_pass
- id: wpf_wpf_quality_key
  version: '1.0'
  applicable_bundles:
  - wpf
  checks:
  - kind: must_contain_any
    values:
    - wpf.settings
    - quality
    - '75'
    - admin/config/media/wpf
  scoring:
    combine: all_pass
- id: wpf_wpf_disable_style_howto
  version: '1.0'
  applicable_bundles:
  - wpf
  checks:
  - kind: must_contain_any
    values:
    - styles.disabled
    - styles
    - disabled
    - Disable fallback image for styles
  scoring:
    combine: all_pass
- id: wpf_wpf_quality_value
  version: '1.0'
  applicable_bundles:
  - wpf
  checks:
  - kind: must_contain_any
    values:
    - '40'
  scoring:
    combine: all_pass
- id: wpf_wpf_disabled_style
  version: '1.0'
  applicable_bundles:
  - wpf
  checks:
  - kind: must_contain_any
    values:
    - thumbnail
  scoring:
    combine: all_pass
- id: wpf_wpf_set_quality
  version: '1.0'
  applicable_bundles:
  - wpf
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
- id: wpf_wpf_disable_large
  version: '1.0'
  applicable_bundles:
  - wpf
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
