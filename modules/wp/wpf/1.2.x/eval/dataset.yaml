- id: wpf-set-quality
  input: On this Drupal site, configure the Webp fallback image module to generate its fallback JPEGs
    at quality 60. Apply the change to the live wpf.settings configuration.
  criteria: Set wpf.settings -> quality to 60 (via the Quality field on /admin/config/media/wpf, or drush
    cset wpf.settings quality 60).
  bundle: wpf
  rubric_ref: rubric/wpf_wpf_set_quality@1.0
