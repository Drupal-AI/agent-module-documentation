metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: wpf
  version: 1.2.x
  note: Webp fallback image (wpf) generates on-demand .jpg copies of WebP image-style derivatives and
    swaps them into the Responsive Image fallback <img>. Its config object is wpf.settings with quality
    (int JPEG quality, default 75) and styles.disabled (array of image-style ids to skip). Config form
    at /admin/config/media/wpf (route wpf.settings_form). The fallback swap is in hook_preprocess_responsive_image
    via ImageFactory::getJpg (service wpf.image_factory); the JPEG is generated lazily when its URL is
    requested because RouteSubscriber overrides the core image.style_public/image.style_private controller
    (ImageStyleDownloadController::deliver -> ImageFactory::createImageCopy using GD imagecreatefromwebp/imagejpeg
    or ImageMagick). Requires file + responsive_image + GD. No Drush, no plugins. Medium/hard cases are
    grounded in the real wpf.settings config (quality and styles.disabled), using core image styles that
    exist on this site (thumbnail, large).
questions:
- id: wpf-what-it-does
  input: What problem does the Drupal 'Webp fallback image' (wpf) module solve, and when is the fallback
    JPEG actually created?
  criteria: It provides a JPEG fallback for WebP image-style derivatives so browsers that cannot show
    WebP still get an image, using the Responsive Image module's fallback <img>. The .jpg is generated
    lazily/on demand, only when a browser requests that fallback URL (the module overrides the image-style
    download controller), so unused JPEGs are never created.
  bundle: wpf
  rubric_ref: rubric/wpf_wpf_what_it_does@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: wpf-quality-key
  input: In the Webp fallback image (wpf) module, which configuration object and key control the quality
    of the generated fallback JPEGs, what is the default, and where is the settings form?
  criteria: The key is wpf.settings -> quality (default 75). The settings form is at /admin/config/media/wpf
    (route wpf.settings_form).
  bundle: wpf
  rubric_ref: rubric/wpf_wpf_quality_key@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: wpf-disable-style-howto
  input: Using the Webp fallback image (wpf) module, how do I stop it from generating a JPEG fallback
    for one particular image style? Which config key holds that list?
  criteria: On the settings form (/admin/config/media/wpf) expand 'Image styles' and tick the style under
    'Disable fallback image for styles'. It is stored in wpf.settings -> styles.disabled (an array of
    image-style ids); ImageFactory skips fallback generation for styles listed there.
  bundle: wpf
  rubric_ref: rubric/wpf_wpf_disable_style_howto@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: wpf-quality-value
  input: On this Drupal site, inspect the live Webp fallback image configuration and report the JPEG quality
    value it is currently set to use for generated fallback images.
  criteria: wpf.settings -> quality is 40.
  bundle: wpf
  rubric_ref: rubric/wpf_wpf_quality_value@1.0
  tags:
  - mode:introspection
  - difficulty:medium
