rubrics:
- id: db_maintenance_db_maintenance_what_query
  version: '1.0'
  applicable_bundles:
  - db_maintenance
  checks:
  - kind: must_contain_any
    values:
    - OPTIMIZE TABLE
    - OPTIMIZE
    - VACUUM
  scoring:
    combine: all_pass
- id: db_maintenance_db_maintenance_config_object
  version: '1.0'
  applicable_bundles:
  - db_maintenance
  checks:
  - kind: must_contain_any
    values:
    - db_maintenance.settings
    - cron_frequency
    - all_tables
  scoring:
    combine: all_pass
- id: db_maintenance_db_maintenance_admin_and_permission
  version: '1.0'
  applicable_bundles:
  - db_maintenance
  checks:
  - kind: must_contain_any
    values:
    - administer db maintenance
    - /admin/config/system/db_maintenance
    - db_maintenance.admin_settings
    - /db_maintenance
  scoring:
    combine: all_pass
- id: db_maintenance_db_maintenance_known_frequency
  version: '1.0'
  applicable_bundles:
  - db_maintenance
  checks:
  - kind: must_contain_any
    values:
    - '604800'
  scoring:
    combine: all_pass
- id: db_maintenance_db_maintenance_known_window
  version: '1.0'
  applicable_bundles:
  - db_maintenance
  checks:
  - kind: must_contain_any
    values:
    - 03:15
  scoring:
    combine: all_pass
- id: db_maintenance_db_maintenance_optimize_all_every_cron
  version: '1.0'
  applicable_bundles:
  - db_maintenance
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
- id: db_maintenance_db_maintenance_nightly_window
  version: '1.0'
  applicable_bundles:
  - db_maintenance
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
