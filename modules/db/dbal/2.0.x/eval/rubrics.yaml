rubrics:
- id: dbal_dbal_get_connection
  version: '1.0'
  applicable_bundles:
  - dbal
  checks:
  - kind: must_contain_any
    values:
    - dbal_connection
    - Doctrine\DBAL\Connection
    - dbal_connection_factory
  scoring:
    combine: all_pass
- id: dbal_dbal_source_of_settings
  version: '1.0'
  applicable_bundles:
  - dbal
  checks:
  - kind: must_contain_any
    values:
    - getAllConnectionInfo
    - $databases
    - settings.php
    - Database connection settings
  scoring:
    combine: all_pass
- id: dbal_dbal_nondefault_target
  version: '1.0'
  applicable_bundles:
  - dbal
  checks:
  - kind: must_contain_any
    values:
    - get
    - target
    - dbal_connection_factory
  scoring:
    combine: all_pass
- id: dbal_dbal_known_value
  version: '1.0'
  applicable_bundles:
  - dbal
  checks:
  - kind: must_contain_any
    values:
    - dbal-secret-42
  scoring:
    combine: all_pass
- id: dbal_dbal_row_count
  version: '1.0'
  applicable_bundles:
  - dbal
  checks:
  - kind: must_contain_any
    values:
    - '3'
  scoring:
    combine: all_pass
- id: dbal_dbal_create_table
  version: '1.0'
  applicable_bundles:
  - dbal
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
- id: dbal_dbal_insert_row
  version: '1.0'
  applicable_bundles:
  - dbal
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
