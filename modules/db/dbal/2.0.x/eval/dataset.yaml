metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: dbal
  version: 2.0.x
  note: 'DBAL Connection is a low-level developer bridge: it exposes a Doctrine\DBAL\Connection built
    from Drupal''s $databases settings. Services: dbal_connection_factory (ConnectionFactory, ->get($target)),
    dbal_connection (the default Doctrine\DBAL\Connection), and the alias Doctrine\DBAL\Connection ->
    @dbal_connection. No config, UI, permissions, plugins, Drush, or schema. Medium/hard cases exercise
    the agent actually USING the DBAL connection against the live database: setup/reset scripts create
    or drop plain raw SQL tables (namespaced dbal_*) via drush sql:query, the agent reads or writes them
    through \Drupal::service(''dbal_connection''), and verify checks the raw table state. Raw SQL tables
    are used deliberately (no Drupal entities/config), which also avoids an unrelated pre-existing site
    issue with commerce_giftcard entity updates.'
questions:
- id: dbal-get-connection
  input: I have the drupal/dbal module installed. How do I get a Doctrine DBAL connection (Doctrine\DBAL\Connection)
    to the Drupal database in my code?
  criteria: Use the 'dbal_connection' service (\Drupal::service('dbal_connection')) or autowire the Doctrine\DBAL\Connection
    type; for a specific database target call \Drupal::service('dbal_connection_factory')->get($target).
  bundle: dbal
  rubric_ref: rubric/dbal_dbal_get_connection@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: dbal-source-of-settings
  input: Where does the drupal/dbal module get the database credentials for the Doctrine DBAL connection,
    and does it need its own configuration?
  criteria: It has no config of its own; ConnectionFactory reads Drupal's Database::getAllConnectionInfo()
    (the $databases in settings.php) and maps it to Doctrine DriverManager options (driver becomes pdo_<driver>).
  bundle: dbal
  rubric_ref: rubric/dbal_dbal_source_of_settings@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: dbal-nondefault-target
  input: Using drupal/dbal, how do I get a Doctrine DBAL connection to a non-default Drupal database target
    (for example a replica)?
  criteria: 'Call the factory: \Drupal::service(''dbal_connection_factory'')->get(''replica'') - pass
    the Drupal target name as named in $databases; it falls back to ''default'' if the target is unknown,
    and caches per target.'
  bundle: dbal
  rubric_ref: rubric/dbal_dbal_nondefault_target@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: dbal-known-value
  input: On this Drupal site there is a database table named 'dbal_probe' with a column 'label'. Using
    the drupal/dbal Doctrine DBAL connection, read the value in the 'label' column of the row where id
    = 1 and report it.
  criteria: Querying via the dbal_connection service (SELECT label FROM dbal_probe WHERE id = 1) returns
    'dbal-secret-42'.
  bundle: dbal
  rubric_ref: rubric/dbal_dbal_known_value@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/dbal-known-value-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/dbal-known-value-cleanup.sh
- id: dbal-row-count
  input: Using the drupal/dbal Doctrine DBAL connection, how many rows are in the database table named
    'dbal_probe_rows' on this site?
  criteria: SELECT COUNT(*) FROM dbal_probe_rows via the dbal_connection service returns 3.
  bundle: dbal
  rubric_ref: rubric/dbal_dbal_row_count@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/dbal-row-count-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/dbal-row-count-cleanup.sh
- id: dbal-create-table
  input: Using the drupal/dbal Doctrine DBAL connection (not Drupal's Database API), create a database
    table named 'dbal_task' with an integer 'id' column and a 'note' column, and insert one row with id
    = 1. Execute it against the live database.
  criteria: Table dbal_task exists and has a row with id=1 (e.g. \Drupal::service('dbal_connection')->executeStatement('CREATE
    TABLE dbal_task (id INT, note VARCHAR(64))') then an INSERT with id=1).
  bundle: dbal
  rubric_ref: rubric/dbal_dbal_create_table@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/dbal-create-table-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/dbal-create-table-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/dbal-create-table-verify.sh
- id: dbal-insert-row
  input: There is an empty database table 'dbal_task2' (columns id INT, note VARCHAR) on this site. Using
    the drupal/dbal Doctrine DBAL connection, insert a row whose 'note' value is exactly 'dbal-done'.
    Execute it against the live database.
  criteria: Table dbal_task2 contains a row with note='dbal-done' (e.g. \Drupal::service('dbal_connection')->executeStatement("INSERT
    INTO dbal_task2 (id, note) VALUES (1, 'dbal-done')")).
  bundle: dbal
  rubric_ref: rubric/dbal_dbal_insert_row@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/dbal-insert-row-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/dbal-insert-row-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/dbal-insert-row-verify.sh
