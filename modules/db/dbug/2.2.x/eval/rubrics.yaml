rubrics:
- id: dbug_dbug_entry_point
  version: '1.0'
  applicable_bundles:
  - dbug
  checks:
  - kind: must_contain_any
    values:
    - Dbug::debug
    - \Drupal\dbug\Dbug
    - debug(
  scoring:
    combine: all_pass
- id: dbug_dbug_library
  version: '1.0'
  applicable_bundles:
  - dbug
  checks:
  - kind: must_contain_any
    values:
    - dbug/dbug
    - '#attached'
    - library
  scoring:
    combine: all_pass
- id: dbug_dbug_forcetype
  version: '1.0'
  applicable_bundles:
  - dbug
  checks:
  - kind: must_contain_any
    values:
    - forceType
    - xml
    - second argument
  scoring:
    combine: all_pass
- id: dbug_dbug_dump_known_config
  version: '1.0'
  applicable_bundles:
  - dbug
  checks:
  - kind: must_contain_any
    values:
    - green
  scoring:
    combine: all_pass
- id: dbug_dbug_dump_boolean
  version: '1.0'
  applicable_bundles:
  - dbug
  checks:
  - kind: must_contain_any
    values:
    - 'TRUE'
  scoring:
    combine: all_pass
- id: dbug_dbug_render_array_dump
  version: '1.0'
  applicable_bundles:
  - dbug
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
- id: dbug_dbug_object_dump
  version: '1.0'
  applicable_bundles:
  - dbug
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
