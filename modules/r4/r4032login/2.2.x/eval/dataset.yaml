metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: r4032login
  version: 2.2.x
  note: 'r4032login is config-only: a kernel 403 exception subscriber plus a settings config object and
    one alter event. Cases are `recipe` (response-graded) probing documented facts an agent would otherwise
    read source to answer; no site mutation.'
questions:
- id: r4032login-redirect-anonymous-on-403
  input: On a Drupal 11 site I want anonymous users who hit a 403 Access Denied page to be sent to the
    login form instead. Which module does this out of the box, and what setting controls where they are
    sent?
  criteria: The r4032login module redirects anonymous users on 403 to the login page; the user_login_path
    setting (default /user/login) in r4032login.settings controls the target.
  bundle: r4032login
  rubric_ref: rubric/r4032login_r4032login_redirect_anonymous_on_403@1.0
  tags:
  - mode:recipe
- id: r4032login-return-after-login
  input: With r4032login, how do I make a user return to the page they originally tried to access after
    they log in? Give the config key and its default.
  criteria: The redirect_to_destination key (default true) on r4032login.settings appends the requested
    path as a destination query parameter so the user returns there after login.
  bundle: r4032login
  rubric_ref: rubric/r4032login_r4032login_return_after_login@1.0
  tags:
  - mode:recipe
- id: r4032login-settings-object
  input: Which config object holds r4032login's settings, and which key sets the HTTP status code used
    for the redirect (and its default)?
  criteria: All settings live in the r4032login.settings config object; default_redirect_code sets the
    status code, defaulting to 307 (options 307/302/301).
  bundle: r4032login
  rubric_ref: rubric/r4032login_r4032login_settings_object@1.0
  tags:
  - mode:recipe
- id: r4032login-authenticated-404
  input: In r4032login, how do I make already-authenticated users who lack access get a 404 Not Found
    instead of a 403? Which setting?
  criteria: Enable throw_authenticated_404 (default false) on r4032login.settings; the subscriber then
    throws a CacheableNotFoundHttpException instead of redirecting authenticated users.
  bundle: r4032login
  rubric_ref: rubric/r4032login_r4032login_authenticated_404@1.0
  tags:
  - mode:recipe
- id: r4032login-403-subscriber
  input: How does r4032login intercept the 403 in Drupal 11 — what class and mechanism performs the redirect?
  criteria: A kernel exception event subscriber, R4032LoginSubscriber (extends HttpExceptionSubscriberBase),
    whose on403() method handles the 403 exception and sets a redirect response.
  bundle: r4032login
  rubric_ref: rubric/r4032login_r4032login_403_subscriber@1.0
  tags:
  - mode:recipe
- id: r4032login-skip-paths
  input: With r4032login I want to keep certain paths on the normal access-denied page instead of redirecting
    to login. Which settings control this?
  criteria: match_noredirect_pages lists path patterns (one per line, * wildcard) to skip the redirect
    for; match_noredirect_negate (0/1) inverts it so only listed pages redirect.
  bundle: r4032login
  rubric_ref: rubric/r4032login_r4032login_skip_paths@1.0
  tags:
  - mode:recipe
- id: r4032login-alter-event
  input: In a custom Drupal module I want to change the URL r4032login redirects to at request time. What
    extension point do I use?
  criteria: Subscribe to the RedirectEvent (event name r4032login.redirect); use setUrl()/setOptions()
    to change the target URL or options before the redirect response is built.
  bundle: r4032login
  rubric_ref: rubric/r4032login_r4032login_alter_event@1.0
  tags:
  - mode:recipe
- id: r4032login-vs-core-access
  input: When should I use r4032login instead of relying on Drupal core's default access handling for
    a members-only section?
  criteria: Core returns a bare 403 Access Denied page; use r4032login when you want anonymous visitors
    sent to the login form (and optionally returned to the page after login) for a friendlier experience,
    while core access control still decides who is denied.
  bundle: r4032login
  rubric_ref: rubric/r4032login_r4032login_vs_core_access@1.0
  tags:
  - mode:recipe
