rubrics:
- id: gcontent_moderation_gcontent_moderation_how
  version: '1.0'
  applicable_bundles:
  - gcontent_moderation
  checks:
  - kind: must_contain_any
    values:
    - state_transition_validation
    - decorat
    - GroupStateTransitionValidation
    - group permission
  scoring:
    combine: all_pass
- id: gcontent_moderation_gcontent_moderation_permission_pattern
  version: '1.0'
  applicable_bundles:
  - gcontent_moderation
  checks:
  - kind: must_contain_any
    values:
    - 'use '
    - transition
    - view latest version
  scoring:
    combine: all_pass
- id: gcontent_moderation_gcontent_moderation_view
  version: '1.0'
  applicable_bundles:
  - gcontent_moderation
  checks:
  - kind: must_contain_any
    values:
    - moderated_group_content
    - group/%group/moderated
    - group/
    - no settings
  scoring:
    combine: all_pass
- id: gcontent_moderation_gcontent_moderation_known_transition_perm
  version: '1.0'
  applicable_bundles:
  - gcontent_moderation
  checks:
  - kind: must_contain_any
    values:
    - use gcmod_editorial transition publish
  scoring:
    combine: all_pass
- id: gcontent_moderation_gcontent_moderation_known_view_pager
  version: '1.0'
  applicable_bundles:
  - gcontent_moderation
  checks:
  - kind: must_contain_any
    values:
    - '33'
  scoring:
    combine: all_pass
- id: gcontent_moderation_gcontent_moderation_create_workflow_perm
  version: '1.0'
  applicable_bundles:
  - gcontent_moderation
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
- id: gcontent_moderation_gcontent_moderation_set_view_pager
  version: '1.0'
  applicable_bundles:
  - gcontent_moderation
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
