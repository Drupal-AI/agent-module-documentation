metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: gcontent_moderation
  version: 3.0.x
  note: 'Group Content Moderation integrates core content_moderation with the group module by decorating
    two core services in a ServiceProvider: content_moderation.state_transition_validation (-> GroupStateTransitionValidation)
    and access_check.latest_revision (-> LatestRevisionCheck). It has NO settings form (configure=null).
    It provides GROUP permissions (gcontent_moderation.group.permissions.yml): a static ''view latest
    version'' plus dynamic ''use <workflow_id> transition <transition_id>'' generated by GroupContentModerationPermissions::groupPermissions()
    for every content_moderation workflow/transition. It ships an optional view moderated_group_content
    (page path group/%group/moderated) and a Views filter group_content_respect_unpublished. Medium/hard
    cases are grounded in real state: the dynamically generated group permissions for a content_moderation
    workflow created in setup, and the moderated_group_content view config. Scripts create/delete a namespaced
    workflow (gcmod_*) and restore the view''s shipped pager value.'
questions:
- id: gcontent_moderation-how
  input: How does the gcontent_moderation module make core Content Moderation workflow transitions respect
    a user's Group membership instead of only their global permissions?
  criteria: It decorates core's content_moderation.state_transition_validation service (with GroupStateTransitionValidation)
    via a ServiceProvider, so valid transitions are filtered by the member's group permissions of the
    form 'use <workflow> transition <id>' in the current group's context.
  bundle: gcontent_moderation
  rubric_ref: rubric/gcontent_moderation_gcontent_moderation_how@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: gcontent_moderation-permission-pattern
  input: In gcontent_moderation, what is the naming pattern of the group permission that lets a group
    member perform a particular content-moderation transition, and what static group permission lets them
    see pending revisions?
  criteria: Dynamic per-transition group permissions are named 'use <workflow_id> transition <transition_id>'
    (e.g. 'use editorial transition publish'), generated for every content_moderation workflow. The static
    permission 'view latest version' lets members view pending/latest revisions.
  bundle: gcontent_moderation
  rubric_ref: rubric/gcontent_moderation_gcontent_moderation_permission_pattern@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: gcontent_moderation-view
  input: What view/page does gcontent_moderation provide for reviewing a group's moderated content, at
    what path, and does the module have an admin settings form?
  criteria: It ships the optional 'Moderated group content' view (moderated_group_content) with a page
    at group/%group/moderated, gated by the 'view latest version' group permission. The module has no
    settings form (configure=null).
  bundle: gcontent_moderation
  rubric_ref: rubric/gcontent_moderation_gcontent_moderation_view@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: gcontent_moderation-known-transition-perm
  input: This Drupal site has a Content Moderation workflow with machine name 'gcmod_editorial'. Given
    how gcontent_moderation generates group permissions, inspect the live workflow's transitions and give
    the exact group permission id that would let a group member run its 'publish' transition.
  criteria: 'The group permission id is ''use gcmod_editorial transition publish'' (pattern: use <workflow_id>
    transition <transition_id>). Inspect the gcmod_editorial workflow''s transitions to confirm the ''publish''
    transition exists.'
  bundle: gcontent_moderation
  rubric_ref: rubric/gcontent_moderation_gcontent_moderation_known_transition_perm@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/gcontent_moderation-known-transition-perm-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/gcontent_moderation-known-transition-perm-cleanup.sh
- id: gcontent_moderation-known-view-pager
  input: On this site, inspect the 'Moderated group content' (moderated_group_content) view provided by
    gcontent_moderation and tell me how many items per page its pager is currently configured to show.
  criteria: The moderated_group_content view's default-display pager items_per_page is 33. Read via drush
    cget views.view.moderated_group_content or entity storage.
  bundle: gcontent_moderation
  rubric_ref: rubric/gcontent_moderation_gcontent_moderation_known_view_pager@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/gcontent_moderation-known-view-pager-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/gcontent_moderation-known-view-pager-cleanup.sh
- id: gcontent_moderation-create-workflow-perm
  input: On this Drupal site (gcontent_moderation is enabled), set up a Content Moderation workflow with
    machine name exactly 'gcmod_task' that includes a transition named 'publish' leading to a published
    state, so that gcontent_moderation exposes the group permission to use that transition. Apply the
    change to the live site.
  criteria: A content_moderation workflow 'gcmod_task' with a 'publish' transition exists, so GroupContentModerationPermissions::groupPermissions()
    contains the key 'use gcmod_task transition publish'.
  bundle: gcontent_moderation
  rubric_ref: rubric/gcontent_moderation_gcontent_moderation_create_workflow_perm@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/gcontent_moderation-create-workflow-perm-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/gcontent_moderation-create-workflow-perm-reset.sh
    verify: agent-module-documentation/evaluation/verify/gcontent_moderation-create-workflow-perm-verify.sh
- id: gcontent_moderation-set-view-pager
  input: On this Drupal site, configure the 'Moderated group content' (moderated_group_content) view provided
    by gcontent_moderation so that its pager shows 25 items per page. Apply the change to the live site.
  criteria: In views.view.moderated_group_content the default display pager options items_per_page is
    25 (edit the view's pager and save).
  bundle: gcontent_moderation
  rubric_ref: rubric/gcontent_moderation_gcontent_moderation_set_view_pager@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/gcontent_moderation-set-view-pager-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/gcontent_moderation-set-view-pager-reset.sh
    verify: agent-module-documentation/evaluation/verify/gcontent_moderation-set-view-pager-verify.sh
