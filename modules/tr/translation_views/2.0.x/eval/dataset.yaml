metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: translation_views
  version: 2.0.x
  note: 'translation_views adds Views fields/filters describing each row''s translation into a chosen
    target language, via hook_views_data_alter() which registers virtual tables {entity}_translation and
    {entity}_translation_target (joined by translation_views_language_join) for translatable + content_translation-enabled
    entity types. Signature handler: translation_views_target_language (field + exposed filter, identifier
    translation_target_language). Other plugin ids: translation_views_status, translation_views_translation_count,
    translation_views_operations, translation_views_source_equals_row, translation_moderation_state. Runtime
    placeholder tokens ***TRANSLATION_VIEWS_TARGET_LANG*** / ***TRANSLATION_VIEWS_TARGET_LIMIT_LANG***
    are swapped by hook_views_query_substitutions(). Demo view content_translations at /translate/content.
    configure=null, no permissions/Drush/config. NOTE: this site currently has content translation disabled
    for all entity types, so these handlers are not registered in Views data and a saved view referencing
    them can''t be built through the Views UI without first enabling content translation; the eval setup/reset/verify
    scripts therefore write and read the view CONFIG directly (raw config), grounded in the module''s
    real plugin ids and config shape (matching the shipped content_translations view). An agent can complete
    the execution cases by editing the view config (or by enabling content translation for the node type
    and using the Views UI).'
questions:
- id: translation_views-target-language
  input: In the Drupal translation_views module, which Views filter lets a user pick the language they
    want to review translations into, and what is its exposed filter identifier?
  criteria: The 'Target language' filter, plugin id translation_views_target_language (on the {entity}_translation
    table), exposed with the identifier translation_target_language. Its value drives which language the
    *_target fields report on.
  bundle: translation_views
  rubric_ref: rubric/translation_views_translation_views_target_language@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: translation_views-fields
  input: Name several Views fields/filters that translation_views provides for a translatable entity,
    and say what prerequisite an entity type needs before these appear.
  criteria: It provides translation_views_status, translation_views_target_language, translation_views_operations,
    translation_views_translation_count, translation_views_source_equals_row and a moderation-state field,
    plus outdated/changed handlers. They only appear for entity types that are translatable AND have content_translation
    enabled.
  bundle: translation_views
  rubric_ref: rubric/translation_views_translation_views_fields@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: translation_views-demo-view
  input: Does translation_views ship a ready-made view, and if so what is it and at what path? Also, how
    does it inject the chosen target language into the query at runtime?
  criteria: It ships the demo view content_translations ('Content translation jobs') at /translate/content
    (config/optional). At runtime hook_views_query_substitutions() replaces the placeholder ***TRANSLATION_VIEWS_TARGET_LANG***
    (and *_LIMIT_LANG*) with the selected langcode.
  bundle: translation_views
  rubric_ref: rubric/translation_views_translation_views_demo_view@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: translation_views-known-filter
  input: On this Drupal site there is a view with machine name 'tv_demo'. Inspect its configuration and
    tell me which translation_views filter (its plugin id) it uses to select the translation target language.
  criteria: tv_demo uses the filter with plugin_id translation_views_target_language (exposed identifier
    translation_target_language) on the node_translation table.
  bundle: translation_views
  rubric_ref: rubric/translation_views_translation_views_known_filter@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/translation_views-known-filter-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/translation_views-known-filter-cleanup.sh
- id: translation_views-known-status
  input: The view 'tv_probe' on this site includes a translation_views field. Inspect its configuration
    and give the plugin id of the translation_views field that reports whether each row is translated
    into the target language.
  criteria: tv_probe includes a field with plugin_id translation_views_status (the translation-status
    field on node_translation).
  bundle: translation_views
  rubric_ref: rubric/translation_views_translation_views_known_status@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/translation_views-known-status-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/translation_views-known-status-cleanup.sh
- id: translation_views-add-filter
  input: On this site the view 'tv_task' is a plain node listing. Using translation_views, add the target-language
    exposed filter (plugin translation_views_target_language) to its default display so editors can choose
    which language to review, and save it to the live site.
  criteria: Add a filter to tv_task's default display with plugin_id translation_views_target_language
    (table node_translation, field translation_target_language, exposed). You may need to enable content
    translation for the node type first, or edit the view config directly.
  bundle: translation_views
  rubric_ref: rubric/translation_views_translation_views_add_filter@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/translation_views-add-filter-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/translation_views-add-filter-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/translation_views-add-filter-verify.sh
- id: translation_views-add-status
  input: The view 'tv_task2' on this site lists nodes. Using translation_views, add a field that shows
    whether each row is translated into the target language (the translation status field, plugin translation_views_status)
    to its default display, and save the change.
  criteria: Add a field to tv_task2's default display with plugin_id translation_views_status (table node_translation,
    field translation_status). May require enabling content translation for the node type, or editing
    the view config directly.
  bundle: translation_views
  rubric_ref: rubric/translation_views_translation_views_add_status@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/translation_views-add-status-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/translation_views-add-status-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/translation_views-add-status-verify.sh
