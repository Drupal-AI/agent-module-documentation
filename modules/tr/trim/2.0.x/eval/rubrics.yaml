rubrics:
- id: trim_trim_when_it_acts
  version: '1.0'
  applicable_bundles:
  - trim
  checks:
  - kind: must_contain_any
    values:
    - before validation
    - prior to validation
    - validate
    - validation callback
    - '#validate'
  scoring:
    combine: all_pass
- id: trim_trim_which_forms
  version: '1.0'
  applicable_bundles:
  - trim
  checks:
  - kind: must_contain_any
    values:
    - content entity
    - ContentEntityType
    - config
    - Form API
    - REST
  scoring:
    combine: all_pass
- id: trim_trim_module_weight
  version: '1.0'
  applicable_bundles:
  - trim
  checks:
  - kind: must_contain_any
    values:
    - weight
    - '1001'
    - module_set_weight
  scoring:
    combine: all_pass
- id: trim_trim_weight_known
  version: '1.0'
  applicable_bundles:
  - trim
  checks:
  - kind: must_contain_any
    values:
    - '1234'
  scoring:
    combine: all_pass
- id: trim_trim_weight_misconfigured
  version: '1.0'
  applicable_bundles:
  - trim
  checks:
  - kind: must_contain_any
    values:
    - '-5'
  scoring:
    combine: all_pass
- id: trim_trim_weight_restore
  version: '1.0'
  applicable_bundles:
  - trim
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
- id: trim_trim_weight_default
  version: '1.0'
  applicable_bundles:
  - trim
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
