metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: gin_lb_plus
  version: 3.0.x
  part_of: gin_lb
  note: 'Gin Layout Builder Plus is an opinionated UI add-on to gin_lb. It has NO config, NO settings
    form, NO configure route, NO permissions, NO Drush, NO plugins and NO *.api.php. It requires gin_lb,
    field_group and section_library. Its core is a kernel VIEW subscriber (LayoutBuilderBrowserEventSubscriber,
    weight 45) that rebuilds layout_builder.choose_section and layout_builder.choose_block into field_group
    horizontal_tabs with per-item icons (theme hook gin_lb_plus_icon), and adds a ''Library'' tab that
    lists every section_library_template entity via SectionLibraryTemplate::loadMultiple() as off-canvas
    import links. gin_lb_plus_form_alter() adds an ''Add to library'' button (route section_library.add_template_to_library)
    to a node''s ..._layout_builder_form and applies the gin_lb #gin_lb_form/glb-form treatment to the
    section_library add forms. gin_lb_plus_page_attachments() attaches library gin_lb_plus/core on valid
    Layout Builder routes via gin_lb.context_validator. Because the module stores no config of its own,
    the medium/hard cases are grounded in the section_library_template entities its Library tab surfaces:
    introspection reads back a template created by setup; execution creates the template the ''Add to
    library'' button would produce, verified against live entity state.'
questions:
- id: gin_lb_plus-picker-ui
  input: What does the gin_lb_plus (Gin Layout Builder Plus) module change about Layout Builder's 'Add
    block' and 'Add section' pickers, and which extra tab does it add when adding a section?
  criteria: Its LayoutBuilderBrowserEventSubscriber (kernel VIEW, weight 45) rebuilds layout_builder.choose_block
    and layout_builder.choose_section into field_group horizontal_tabs with a per-block/per-section icon
    (theme hook gin_lb_plus_icon). On the section picker it adds a 'Library' tab that lists Section Library
    templates (section_library_template entities) as off-canvas import links.
  bundle: gin_lb_plus
  rubric_ref: rubric/gin_lb_plus_gin_lb_plus_picker_ui@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: gin_lb_plus-add-to-library
  input: gin_lb_plus adds a button to a node's Layout Builder form. What is that button for, and which
    Section Library route does it link to?
  criteria: In gin_lb_plus_form_alter(), on a node's node_<bundle>_layout_builder_form it adds $form['actions']['add_to_library']
    - an off-canvas AJAX 'Add to library' link to route section_library.add_template_to_library (storage
    type 'overrides', delta 1), so the current layout can be saved as a reusable Section Library template.
  bundle: gin_lb_plus
  rubric_ref: rubric/gin_lb_plus_gin_lb_plus_add_to_library@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: gin_lb_plus-requirements
  input: Which contributed modules must be installed for gin_lb_plus (Gin Layout Builder Plus) to work?
  criteria: gin_lb_plus.info.yml declares dependencies on field_group (used for the horizontal-tabs picker
    UI), gin_lb (its parent - it reuses gin_lb.context_validator), and section_library (which backs the
    'Library' tab and the 'Add to library' button). Layout Builder Browser is an optional-but-recommended
    companion.
  bundle: gin_lb_plus
  rubric_ref: rubric/gin_lb_plus_gin_lb_plus_requirements@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: gin_lb_plus-library-tmpl
  input: gin_lb_plus adds a 'Library' tab to Layout Builder's 'Add section' screen that lists reusable
    Section Library templates. Inspect this live Drupal site and give the label of the Section Library
    template that would appear there.
  criteria: There is one section_library_template entity, labeled glb_plus_known_tmpl. gin_lb_plus's LayoutBuilderBrowserEventSubscriber
    lists these via SectionLibraryTemplate::loadMultiple(); you can read it with `drush php:eval` querying
    the section_library_template storage (or drush entity queries).
  bundle: gin_lb_plus
  rubric_ref: rubric/gin_lb_plus_gin_lb_plus_library_tmpl@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/gin_lb_plus-library-tmpl-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/gin_lb_plus-library-tmpl-cleanup.sh
- id: gin_lb_plus-lib-entity
  input: On this site, which entity type does gin_lb_plus read to populate the 'Library' tab of the Layout
    Builder section picker, and what is the label of the single library item currently stored?
  criteria: It reads the section_library_template content entity (SectionLibraryTemplate::loadMultiple()).
    Exactly one exists, labeled glb_plus_probe_tmpl.
  bundle: gin_lb_plus
  rubric_ref: rubric/gin_lb_plus_gin_lb_plus_lib_entity@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/gin_lb_plus-lib-entity-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/gin_lb_plus-lib-entity-cleanup.sh
- id: gin_lb_plus-add-template-expert
  input: gin_lb_plus surfaces Section Library templates in its Layout Builder 'Library' tab and its 'Add
    to library' button creates them. On this site, create a section_library_template entity with the label
    'glb_plus_exec' (type 'section') so it would appear in that Library tab. Apply the change to the live
    site.
  criteria: Create a section_library_template entity, e.g. `drush php:eval 'Drupal\section_library\Entity\SectionLibraryTemplate::create(["label"
    => "glb_plus_exec", "type" => "section"])->save();'`. gin_lb_plus lists such entities in its Library
    tab via SectionLibraryTemplate::loadMultiple().
  bundle: gin_lb_plus
  rubric_ref: rubric/gin_lb_plus_gin_lb_plus_add_template_expert@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/gin_lb_plus-add-template-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/gin_lb_plus-add-template-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/gin_lb_plus-add-template-verify.sh
- id: gin_lb_plus-add-template-layman
  input: In my Drupal site's Layout Builder, gin_lb_plus lets me save layouts to a reusable 'Library'.
    I want a library entry named 'glb_plus_exec' to exist so it shows up when I go to add a section. Make
    that library entry exist on the site.
  criteria: The 'Library' entries are section_library_template entities. Create one labeled 'glb_plus_exec'
    (type 'section'), e.g. via `drush php:eval 'Drupal\section_library\Entity\SectionLibraryTemplate::create(["label"
    => "glb_plus_exec", "type" => "section"])->save();'`, so gin_lb_plus's Library tab (SectionLibraryTemplate::loadMultiple())
    would show it.
  bundle: gin_lb_plus
  rubric_ref: rubric/gin_lb_plus_gin_lb_plus_add_template_layman@1.0
  tags:
  - mode:execution
  - difficulty:hard
