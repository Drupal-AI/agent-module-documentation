metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: gin_toolbar
  version: 3.0.x
  note: Gin Toolbar is a passive companion module for the Gin admin theme with no config UI, permissions,
    plugins, or services. It works purely through theme overrides and library attachments, so all cases
    are `recipe` (response-graded), not `execution` (live-state).
questions:
- id: gintoolbar-purpose
  input: On a Drupal 11 site, what does the gin_toolbar module do and why would I need it alongside the
    Gin theme? Answer in one or two sentences.
  criteria: Gin Toolbar renders Gin's styled admin toolbar/navigation on front-end (non-admin) pages so
    logged-in users get the Gin-themed toolbar site-wide, because admin themes cannot control the toolbar
    on front-end pages.
  bundle: gin_toolbar
  rubric_ref: rubric/gin_toolbar_gintoolbar_purpose@1.0
  tags:
  - mode:recipe
- id: gintoolbar-gin-dependency
  input: I want to install gin_toolbar via Composer on Drupal 11. What is the package name, and does it
    require any other project to actually work?
  criteria: composer require drupal/gin_toolbar; it requires the Gin theme (drupal/gin) — the toolbar
    only activates when Gin or a Gin subtheme is the active admin or default theme.
  bundle: gin_toolbar
  rubric_ref: rubric/gin_toolbar_gintoolbar_gin_dependency@1.0
  tags:
  - mode:recipe
- id: gintoolbar-activation-condition
  input: I enabled gin_toolbar but the styled toolbar is not appearing. Under what condition does gin_toolbar
    actually activate on a Drupal site?
  criteria: It only activates when Gin (or a Gin subtheme) is set as the active admin or default theme,
    and the user has the access toolbar / access navigation permission. It is inert otherwise (e.g. for
    anonymous visitors or non-Gin admin themes).
  bundle: gin_toolbar
  rubric_ref: rubric/gin_toolbar_gintoolbar_activation_condition@1.0
  tags:
  - mode:recipe
- id: gintoolbar-subtheme
  input: I built a subtheme of Gin as my admin theme. Will gin_toolbar still give me the site-wide Gin
    toolbar, or does it only work with Gin itself?
  criteria: Yes — a Gin subtheme gets the same site-wide toolbar treatment as Gin itself; gin_toolbar
    activates when Gin or a Gin subtheme is the active admin/default theme.
  bundle: gin_toolbar
  rubric_ref: rubric/gin_toolbar_gintoolbar_subtheme@1.0
  tags:
  - mode:recipe
- id: gintoolbar-no-config
  input: Where do I configure gin_toolbar's appearance settings, like accent color, dark mode, or the
    toolbar variant? Point me to the settings page.
  criteria: Gin Toolbar has no configuration of its own; all appearance options (accent color, focus color,
    dark mode, high-contrast, toolbar variant) come from the Gin theme's settings and are carried into
    the front-end toolbar.
  bundle: gin_toolbar
  rubric_ref: rubric/gin_toolbar_gintoolbar_no_config@1.0
  tags:
  - mode:recipe
- id: gintoolbar-toolbar-variant
  input: Does gin_toolbar support the classic vertical Gin toolbar and the horizontal toolbar variant
    on the front end, and where is that choice made?
  criteria: Yes — based on Gin's classic_toolbar setting, gin_toolbar attaches the matching front-end
    library (classic vertical, horizontal, navigation, or the new toolbar), so the choice is made in the
    Gin theme settings.
  bundle: gin_toolbar
  rubric_ref: rubric/gin_toolbar_gintoolbar_toolbar_variant@1.0
  tags:
  - mode:recipe
- id: gintoolbar-navigation-module
  input: My Drupal 11 site uses core's Navigation module for the left sidebar. Does gin_toolbar work with
    that, and what does it do differently?
  criteria: 'Yes — gin_toolbar integrates with core''s Navigation module: it attaches the core_navigation
    library, skips its own navigation template override when Navigation is enabled, and styles the left
    sidebar menu with Gin.'
  bundle: gin_toolbar
  rubric_ref: rubric/gin_toolbar_gintoolbar_navigation_module@1.0
  tags:
  - mode:recipe
