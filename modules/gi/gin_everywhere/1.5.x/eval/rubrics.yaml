rubrics:
- id: gin_everywhere_gin_everywhere_what
  version: '1.0'
  applicable_bundles:
  - gin_everywhere
  checks:
  - kind: must_contain_any
    values:
    - gin_content_form_routes_alter
    - content entit
    - Gin
  scoring:
    combine: all_pass
- id: gin_everywhere_gin_everywhere_config
  version: '1.0'
  applicable_bundles:
  - gin_everywhere
  checks:
  - kind: must_contain_any
    values:
    - no configuration
    - no config
    - nothing to configure
    - enabling
  scoring:
    combine: all_pass
- id: gin_everywhere_gin_everywhere_coverage
  version: '1.0'
  applicable_bundles:
  - gin_everywhere
  checks:
  - kind: must_contain_any
    values:
    - media
    - taxonomy
    - term
    - user
    - content entit
    - block
  scoring:
    combine: all_pass
- id: gin_everywhere_gin_everywhere_covers_media
  version: '1.0'
  applicable_bundles:
  - gin_everywhere
  checks:
  - kind: must_contain_any
    values:
    - entity.media.canonical
  scoring:
    combine: all_pass
- id: gin_everywhere_gin_everywhere_covers_term
  version: '1.0'
  applicable_bundles:
  - gin_everywhere
  checks:
  - kind: must_contain_any
    values:
    - entity.taxonomy_term.edit_form
  scoring:
    combine: all_pass
- id: gin_everywhere_gin_everywhere_enable_media
  version: '1.0'
  applicable_bundles:
  - gin_everywhere
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
- id: gin_everywhere_gin_everywhere_enable_blockcontent
  version: '1.0'
  applicable_bundles:
  - gin_everywhere
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
