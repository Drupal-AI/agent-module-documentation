metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: gin_everywhere
  version: 1.5.x
  note: 'Gin Everywhere extends the Gin admin theme''s content-form layout to every content entity. It
    has NO configuration: the module is two hooks on the autowired service Drupal\gin_everywhere\Hook\GinEverywhereHooks.
    hook_gin_content_form_routes_alter (ginContentFormRoutesAlter) appends, for every content-group entity
    type, routes like entity.<type>.edit_form/.add_form/.create_form/.revision/.content_translation_add
    plus <type>.add, and fixed extras (block_content.add_page/add_form, entity.block_content.canonical,
    entity.media.canonical, entity.menu.add_link_form, entity.menu_link_content.canonical). hook_form_alter
    builds Gin''s advanced/meta groups only when the active theme is gin. Requires the Gin theme (hook_requirements).
    Because there is no config, medium cases inspect the running site by invoking the service and reading
    the routes it adds; hard cases toggle the module (reset uninstalls -> verify FAILS; agent re-enables
    -> verify PASSES; cleanup restores the enabled baseline).'
questions:
- id: gin-everywhere-what
  input: What does the Gin Everywhere Drupal module do, and through which Gin hook does it achieve it?
    Which theme must be present for it to work?
  criteria: It extends Gin's node-style content-form layout (sticky action bar + advanced meta sidebar)
    to every content entity's forms, by implementing hook_gin_content_form_routes_alter() to add those
    entities' form routes (plus a form_alter that builds the meta/advanced groups). It requires the Gin
    admin theme.
  bundle: gin_everywhere
  rubric_ref: rubric/gin_everywhere_gin_everywhere_what@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: gin-everywhere-config
  input: How do I configure Gin Everywhere after installing it? Where are its settings?
  criteria: There is nothing to configure. Gin Everywhere has no settings form or configuration; simply
    enabling the module (with the Gin theme present) is the entire setup.
  bundle: gin_everywhere
  rubric_ref: rubric/gin_everywhere_gin_everywhere_config@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: gin-everywhere-coverage
  input: Besides node forms, name some of the entity forms Gin Everywhere brings Gin's layout to, and
    mention how it decides which routes to cover.
  criteria: It covers create/edit/revision/translation forms for every content-group entity type (media,
    taxonomy terms, users, block content, custom entities) plus extras like entity.media.canonical and
    menu link forms. It derives the routes dynamically from all entity types whose group is 'content'.
  bundle: gin_everywhere
  rubric_ref: rubric/gin_everywhere_gin_everywhere_coverage@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: gin-everywhere-covers-media
  input: On this running Drupal site, determine (from Gin Everywhere's actual behaviour, not documentation
    guesses) whether it applies Gin's content-form layout to the media canonical page route. State the
    exact route name it adds for that.
  criteria: Yes. Invoking the GinEverywhereHooks service's ginContentFormRoutesAlter() shows entity.media.canonical
    among the routes it adds.
  bundle: gin_everywhere
  rubric_ref: rubric/gin_everywhere_gin_everywhere_covers_media@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/gin_everywhere-covers-media-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/gin_everywhere-covers-media-cleanup.sh
- id: gin-everywhere-covers-term
  input: On this live site, which edit-form route does Gin Everywhere add for the taxonomy_term entity
    so that Gin's layout is applied to editing a term? Verify it against the module's running behaviour.
  criteria: entity.taxonomy_term.edit_form. Because taxonomy_term is a content-group entity type, ginContentFormRoutesAlter()
    adds entity.taxonomy_term.edit_form (and .add_form, .revision, etc.).
  bundle: gin_everywhere
  rubric_ref: rubric/gin_everywhere_gin_everywhere_covers_term@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/gin_everywhere-covers-term-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/gin_everywhere-covers-term-cleanup.sh
- id: gin-everywhere-enable-media
  input: On this site, ensure Gin's content-form layout is applied to media (and every other content entity)
    by enabling the Gin Everywhere module. After enabling it, its route-alter should add entity.media.canonical
    to Gin's covered routes. Apply the change to the live site.
  criteria: The gin_everywhere module is enabled, and GinEverywhereHooks::ginContentFormRoutesAlter()
    returns a route list containing entity.media.canonical.
  bundle: gin_everywhere
  rubric_ref: rubric/gin_everywhere_gin_everywhere_enable_media@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/gin_everywhere-enable-media-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/gin_everywhere-enable-media-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/gin_everywhere-enable-media-verify.sh
- id: gin-everywhere-enable-blockcontent
  input: Custom block (block content) add forms on this site should use Gin's form layout. Make that happen
    using the Gin Everywhere module and apply it to the live site. Once enabled, Gin Everywhere adds block_content.add_form
    to Gin's covered content-form routes.
  criteria: The gin_everywhere module is enabled, and GinEverywhereHooks::ginContentFormRoutesAlter()
    returns a route list containing block_content.add_form.
  bundle: gin_everywhere
  rubric_ref: rubric/gin_everywhere_gin_everywhere_enable_blockcontent@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: site-builder
    reset: agent-module-documentation/evaluation/verify/gin_everywhere-enable-blockcontent-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/gin_everywhere-enable-blockcontent-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/gin_everywhere-enable-blockcontent-verify.sh
