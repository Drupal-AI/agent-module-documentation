rubrics:
- id: gin_type_tray_gin_type_tray_what
  version: '1.0'
  applicable_bundles:
  - gin_type_tray
  checks:
  - kind: must_contain_any
    values:
    - Type Tray
    - type_tray
    - Gin
  scoring:
    combine: all_pass
- id: gin_type_tray_gin_type_tray_mechanism
  version: '1.0'
  applicable_bundles:
  - gin_type_tray
  checks:
  - kind: must_contain_any
    values:
    - node.add_page
    - route subscriber
    - GinTypeTrayController
    - theme_registry_alter
  scoring:
    combine: all_pass
- id: gin_type_tray_gin_type_tray_config
  version: '1.0'
  applicable_bundles:
  - gin_type_tray
  checks:
  - kind: must_contain_any
    values:
    - no configuration
    - no settings
    - type_tray
    - third-party
  scoring:
    combine: all_pass
- id: gin_type_tray_gin_type_tray_live_controller
  version: '1.0'
  applicable_bundles:
  - gin_type_tray
  checks:
  - kind: must_contain_any
    values:
    - GinTypeTrayController
  scoring:
    combine: all_pass
- id: gin_type_tray_gin_type_tray_tray_type
  version: '1.0'
  applicable_bundles:
  - gin_type_tray
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
