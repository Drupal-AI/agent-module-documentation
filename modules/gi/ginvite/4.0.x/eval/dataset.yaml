metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: ginvite
  version: 4.0.x
  note: 'Group invite (ginvite) extends the Group module with a group_invitation relation plugin (GroupRelationType,
    entity_type user, admin_permission ''administer group invitations''). You install it on a group type,
    which creates a group_relationship_type config entity (config prefix group.relationship_type, id ''<group_type>-group_invitation'')
    whose plugin_config holds the invitation settings (invitation_subject/body, expiry, autoaccept_invitees,
    unblock_invitees, invitation_bypass_form, remove_invitation, etc.). Invitations are group_relationship
    entities of plugin group_invitation with locked fields invitee_mail (email) and invitation_status
    (int: 0 pending,1 accepted,2 rejected,3 expired). Accept/decline at /ginvite/{group_relationship}/accept|decline;
    bulk at /group/{group}/invite-members. Group permissions: invite users to group, bulk invite users
    to group, view group invitations, delete own/any invitation, administer group invitations. Medium/hard
    cases are grounded in the group_content config (the group.relationship_type config entity for the
    installed group_invitation relation).'
questions:
- id: ginvite-relation-plugin
  input: The ginvite module adds group invitations to Drupal's Group module. What kind of Group plugin
    does it provide (and its plugin id), and how is invitation state tracked on each invitation?
  criteria: It provides a Group relation plugin with id group_invitation (a GroupRelationType on the user
    entity). Each invitation is a group_relationship entity carrying invitee_mail and an invitation_status
    integer (0 pending, 1 accepted, 2 rejected, 3 expired).
  bundle: ginvite
  rubric_ref: rubric/ginvite_ginvite_relation_plugin@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: ginvite-statuses
  input: In the ginvite module, what are the possible values of an invitation's status and what does each
    mean?
  criteria: The invitation_status integer is 0 = pending, 1 = accepted, 2 = rejected, 3 = expired (constants
    INVITATION_PENDING/ACCEPTED/REJECTED/EXPIRED on the GroupInvitation relation plugin).
  bundle: ginvite
  rubric_ref: rubric/ginvite_ginvite_statuses@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: ginvite-permissions-routes
  input: With ginvite, which group permission lets a role invite users, and at what path do invitees accept
    an invitation?
  criteria: The group permission 'invite users to group' (and 'bulk invite users to group' for the bulk
    form at /group/{group}/invite-members). Invitees accept at /ginvite/{group_relationship}/accept (and
    decline at /ginvite/{group_relationship}/decline).
  bundle: ginvite
  rubric_ref: rubric/ginvite_ginvite_permissions_routes@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: ginvite-known-installed
  input: On this Drupal site, a group type gi_known has invitations enabled. Inspect the live Group configuration
    and give the machine id of the group_relationship_type (group content type) config entity that installs
    the group_invitation relation on gi_known.
  criteria: The config entity id is gi_known-group_invitation (config name group.relationship_type.gi_known-group_invitation,
    content_plugin group_invitation, group_type gi_known).
  bundle: ginvite
  rubric_ref: rubric/ginvite_ginvite_known_installed@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/ginvite-known-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/ginvite-known-cleanup.sh
- id: ginvite-known-expire
  input: Inspect the group_invitation relation configuration on group type gi_known on this site. After
    how many days do open invitations expire (the invitation_expire plugin setting)?
  criteria: 'Invitations expire after 14 days: the group.relationship_type.gi_known-group_invitation config
    entity has plugin_config.invitation_expire = 14.'
  bundle: ginvite
  rubric_ref: rubric/ginvite_ginvite_known_expire@1.0
  tags:
  - mode:introspection
  - difficulty:medium
