metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: gin_toolbar_custom_menu
  version: 1.0.x
  note: 'Gin Toolbar Custom Menu replaces the Gin admin toolbar''s ''admin'' menu with a chosen menu on
    a per-role basis. All state is in the config object gin_toolbar_custom_menu.settings (FullyValidatable):
    keep_admin_menu (int) and a ''settings'' sequence of rules {menu, role[], excluded_role[], icons[],
    admin_menu, actions[]}. Configure route /admin/config/system/gin-toolbar-custom-menu (permission ''configure
    gin toolbar custom menu''); assigned roles also need core ''access toolbar''. There is no config/install
    default so the object is absent until saved. Medium/hard cases are grounded in that real config: introspection
    reads a configured rule''s menu and keep_admin_menu; execution creates a rule and enables keep_admin_menu,
    verified against the live config object.'
questions:
- id: gin_toolbar_custom_menu-purpose-route
  input: What does the gin_toolbar_custom_menu module do, and at which admin path do you configure it?
  criteria: It lets you replace the Gin admin toolbar's menu with a chosen menu per user role; configure
    it at /admin/config/system/gin-toolbar-custom-menu.
  bundle: gin_toolbar_custom_menu
  rubric_ref: rubric/gin_toolbar_custom_menu_gin_toolbar_custom_menu_purpose_route@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: gin_toolbar_custom_menu-permission
  input: Which permission controls access to the Gin Toolbar Custom Menu settings form, and what extra
    core permission must a targeted role have for the custom toolbar menu to actually appear?
  criteria: The module permission 'configure gin toolbar custom menu' gates the settings form; assigned
    roles must also have the core 'access toolbar' ('Use toolbar') permission or the toolbar/menu won't
    show.
  bundle: gin_toolbar_custom_menu
  rubric_ref: rubric/gin_toolbar_custom_menu_gin_toolbar_custom_menu_permission@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: gin_toolbar_custom_menu-rule-shape
  input: In gin_toolbar_custom_menu, each configured rule maps something to something. What are the key
    parts of a rule (which menu, which roles), and what config object stores them?
  criteria: Each rule in gin_toolbar_custom_menu.settings 'settings' has a menu (machine name), a list
    of assigned roles, optional excluded_role, per-item icons and an admin_menu visibility option; a matching
    role gets the toolbar admin menu replaced by that menu.
  bundle: gin_toolbar_custom_menu
  rubric_ref: rubric/gin_toolbar_custom_menu_gin_toolbar_custom_menu_rule_shape@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: gin_toolbar_custom_menu-which-menu
  input: On this Drupal site, Gin Toolbar Custom Menu is configured with a rule for the authenticated
    role. Which menu will replace the toolbar's admin menu for that role? Inspect the live configuration.
  criteria: The 'main' menu - gin_toolbar_custom_menu.settings settings[0].menu is 'main' with role including
    'authenticated'.
  bundle: gin_toolbar_custom_menu
  rubric_ref: rubric/gin_toolbar_custom_menu_gin_toolbar_custom_menu_which_menu@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/gin_toolbar_custom_menu-which-menu-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/gin_toolbar_custom_menu-which-menu-cleanup.sh
- id: gin_toolbar_custom_menu-keep-admin
  input: On this Drupal site, does Gin Toolbar Custom Menu keep the original administration menu alongside
    the custom menu? Inspect the live configuration and state the keep_admin_menu value.
  criteria: Yes - gin_toolbar_custom_menu.settings keep_admin_menu is 1 (the original administration menu
    is kept).
  bundle: gin_toolbar_custom_menu
  rubric_ref: rubric/gin_toolbar_custom_menu_gin_toolbar_custom_menu_keep_admin@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/gin_toolbar_custom_menu-keep-admin-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/gin_toolbar_custom_menu-keep-admin-cleanup.sh
- id: gin_toolbar_custom_menu-create-rule
  input: On this Drupal site, configure Gin Toolbar Custom Menu so that users with the 'authenticated'
    role see the 'main' menu in the Gin admin toolbar instead of the default admin menu. Apply the change
    to the live configuration.
  criteria: gin_toolbar_custom_menu.settings 'settings' contains a rule with menu 'main' and role including
    'authenticated' (e.g. configFactory getEditable('gin_toolbar_custom_menu.settings')->set('settings',
    [['menu'=>'main','role'=>['authenticated'], ...]])->save()).
  bundle: gin_toolbar_custom_menu
  rubric_ref: rubric/gin_toolbar_custom_menu_gin_toolbar_custom_menu_create_rule@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/gin_toolbar_custom_menu-create-rule-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/gin_toolbar_custom_menu-create-rule-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/gin_toolbar_custom_menu-create-rule-verify.sh
- id: gin_toolbar_custom_menu-enable-keep-admin
  input: On this Drupal site, Gin Toolbar Custom Menu currently hides the original administration menu.
    Change its configuration so the original administration menu is also kept alongside the custom menu.
    Apply the change to the live configuration.
  criteria: gin_toolbar_custom_menu.settings keep_admin_menu is set to 1 (e.g. configFactory getEditable(...)->set('keep_admin_menu',
    1)->save()).
  bundle: gin_toolbar_custom_menu
  rubric_ref: rubric/gin_toolbar_custom_menu_gin_toolbar_custom_menu_enable_keep_admin@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/gin_toolbar_custom_menu-enable-keep-admin-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/gin_toolbar_custom_menu-enable-keep-admin-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/gin_toolbar_custom_menu-enable-keep-admin-verify.sh
