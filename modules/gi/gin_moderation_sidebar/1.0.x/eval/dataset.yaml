metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: gin_moderation_sidebar
  version: 1.0.x
  note: Gin Moderation Sidebar is a CSS-only bridge between Moderation Sidebar and the Gin admin theme.
    It has no plugins, permissions, services, or Drush commands. Its entire persistent state is a single
    config value, tab_style ('default' | 'contrast'), in gin_moderation_sidebar.settings (shipped default
    'default'), editable at route gin_moderation_sidebar.settings_form (/admin/config/user-interface/gin-moderation-sidebar).
    At runtime, when Gin is active, it adds a body class gms--tab-style-<style> and attaches the gin_moderation_sidebar/main
    library. All medium/hard cases are grounded in that single real config value; scripts restore the
    shipped default 'default' rather than stashing baseline in State.
questions:
- id: gin_moderation_sidebar-tab-style-values
  input: In the Drupal module gin_moderation_sidebar, which configuration key controls the Moderation
    Sidebar tab appearance, and what are its two possible values?
  criteria: The key is tab_style in gin_moderation_sidebar.settings; its two options are 'default' and
    'contrast' (High contrast). Shipped default is 'default'.
  bundle: gin_moderation_sidebar
  rubric_ref: rubric/gin_moderation_sidebar_gin_moderation_sidebar_tab_style_values@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: gin_moderation_sidebar-body-class
  input: How does gin_moderation_sidebar apply its styling to a page, and what CSS body class does it
    add when Gin is active?
  criteria: When Gin is active it adds a body class gms--tab-style-<style> (e.g. gms--tab-style-contrast)
    in hook_preprocess_html(), and attaches the gin_moderation_sidebar/main library (css/gin_moderation_sidebar.css)
    in hook_preprocess_page().
  bundle: gin_moderation_sidebar
  rubric_ref: rubric/gin_moderation_sidebar_gin_moderation_sidebar_body_class@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: gin_moderation_sidebar-dependencies
  input: What other Drupal modules must be installed for gin_moderation_sidebar to do anything, and what
    does it actually provide?
  criteria: It depends on moderation_sidebar and gin_toolbar. It only provides CSS/body-class styling
    so the Moderation Sidebar tab fits the Gin admin theme; no plugins, permissions, or Drush.
  bundle: gin_moderation_sidebar
  rubric_ref: rubric/gin_moderation_sidebar_gin_moderation_sidebar_dependencies@1.0
  tags:
  - mode:recipe
  - difficulty:easy
