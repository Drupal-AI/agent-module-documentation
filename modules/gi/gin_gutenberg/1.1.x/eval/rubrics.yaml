rubrics:
- id: gin_gutenberg_gin_gutenberg_what_and_dep
  version: '1.0'
  applicable_bundles:
  - gin_gutenberg
  checks:
  - kind: must_contain_any
    values:
    - gutenberg
    - Gin
  scoring:
    combine: all_pass
- id: gin_gutenberg_gin_gutenberg_how_activate
  version: '1.0'
  applicable_bundles:
  - gin_gutenberg
  checks:
  - kind: must_contain_any
    values:
    - enable_full
    - gutenberg.settings
    - use gutenberg
    - admin theme
    - Gutenberg experience
  scoring:
    combine: all_pass
- id: gin_gutenberg_gin_gutenberg_what_it_adds
  version: '1.0'
  applicable_bundles:
  - gin_gutenberg
  checks:
  - kind: must_contain_any
    values:
    - gutenberg--enabled
    - page__node__edit__gutenberg
    - page__node__add__gutenberg
    - gin_gutenberg/gin_gutenberg
  scoring:
    combine: all_pass
- id: gin_gutenberg_gin_gutenberg_which_type_enabled
  version: '1.0'
  applicable_bundles:
  - gin_gutenberg
  checks:
  - kind: must_contain_any
    values:
    - article
  scoring:
    combine: all_pass
- id: gin_gutenberg_gin_gutenberg_on_vs_off
  version: '1.0'
  applicable_bundles:
  - gin_gutenberg
  checks:
  - kind: must_contain_any
    values:
    - page
    - Basic page
  scoring:
    combine: all_pass
- id: gin_gutenberg_gin_gutenberg_enable_article
  version: '1.0'
  applicable_bundles:
  - gin_gutenberg
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
- id: gin_gutenberg_gin_gutenberg_enable_page
  version: '1.0'
  applicable_bundles:
  - gin_gutenberg
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
