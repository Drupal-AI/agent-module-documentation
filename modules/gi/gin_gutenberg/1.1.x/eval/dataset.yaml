metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: gin_gutenberg
  version: 1.1.x
  note: Gin Gutenberg is a presentation-only glue module (no config object, no permissions, no Drush,
    no plugins, configure=null). It depends on the gutenberg module and activates via hooks when (a) Gutenberg
    full editing is on for a node type -- gutenberg.settings:<type>_enable_full == TRUE, read by _gin_gutenberg_is_gutenberg_enabled()
    -- and (b) a Gin/Claro theme is active with the 'use gutenberg' permission (_gin_gutenberg_gin_is_active()).
    It adds the gutenberg--enabled html class, attaches library gin_gutenberg/gin_gutenberg, and registers/suggests
    templates page__node__edit__gutenberg and page__node__add__gutenberg, and moves status/moderation_state
    into Gutenberg's meta sidebar. Since the module has no config of its own, medium/hard cases are grounded
    in the gutenberg.settings:<type>_enable_full flag that drives the integration's activation; setup/reset/cleanup
    only touch the article_enable_full / page_enable_full keys and clear them to restore baseline.
questions:
- id: gin-gutenberg-what-and-dep
  input: What does the Drupal gin_gutenberg module do, and what module does it require to work?
  criteria: It is a presentation/theming integration that makes the Gutenberg block editor render correctly
    inside the Gin (or Claro) admin theme on node add/edit forms. It requires (depends on) the gutenberg
    module. It has no configuration of its own.
  bundle: gin_gutenberg
  rubric_ref: rubric/gin_gutenberg_gin_gutenberg_what_and_dep@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: gin-gutenberg-how-activate
  input: There is no settings page for gin_gutenberg. How do I get the Gin-styled Gutenberg editor to
    actually appear for a content type on my Drupal site?
  criteria: gin_gutenberg has no config; it activates via hooks. Enable the gutenberg + gin_gutenberg
    modules, set the admin theme to Gin (or Claro), turn on the Gutenberg experience for the content type
    (which sets gutenberg.settings:<type>_enable_full = TRUE), and grant the role the 'use gutenberg'
    permission. Then its hooks fire on that type's node forms.
  bundle: gin_gutenberg
  rubric_ref: rubric/gin_gutenberg_gin_gutenberg_how_activate@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: gin-gutenberg-what-it-adds
  input: On a Gutenberg-enabled node form, what does gin_gutenberg add at the theme layer? Name the CSS/library,
    the html class, and the page templates it provides.
  criteria: It adds the gutenberg--enabled class to the <html> element, attaches the gin_gutenberg/gin_gutenberg
    library (dist/gin_gutenberg.css + .js), and registers/suggests the page templates page__node__edit__gutenberg
    and page__node__add__gutenberg. It also moves the Published/status and moderation_state controls into
    Gutenberg's meta sidebar.
  bundle: gin_gutenberg
  rubric_ref: rubric/gin_gutenberg_gin_gutenberg_what_it_adds@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: gin-gutenberg-which-type-enabled
  input: gin_gutenberg only styles the editor for content types that have the Gutenberg full-editing experience
    turned on. On this site, inspect the Gutenberg configuration and state which content type has full
    Gutenberg editing enabled (the type gin_gutenberg would activate on).
  criteria: gutenberg.settings:article_enable_full is TRUE, so the Article content type has full Gutenberg
    editing enabled and gin_gutenberg activates on its node forms.
  bundle: gin_gutenberg
  rubric_ref: rubric/gin_gutenberg_gin_gutenberg_which_type_enabled@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/gin_gutenberg-which-type-enabled-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/gin_gutenberg-which-type-enabled-cleanup.sh
- id: gin-gutenberg-on-vs-off
  input: On this site, of the two content types Article and Basic page, exactly one has the Gutenberg
    full-editing experience enabled. Inspect the live Gutenberg configuration and state which content
    type it is (i.e. where gin_gutenberg's styling applies).
  criteria: gutenberg.settings:page_enable_full is TRUE while article_enable_full is not, so the Basic
    page (page) type has full Gutenberg editing enabled.
  bundle: gin_gutenberg
  rubric_ref: rubric/gin_gutenberg_gin_gutenberg_on_vs_off@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/gin_gutenberg-on-vs-off-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/gin_gutenberg-on-vs-off-cleanup.sh
- id: gin-gutenberg-enable-article
  input: So that gin_gutenberg styles the editor for Articles, turn on the full Gutenberg editing experience
    for the Article content type on this site and apply the change live.
  criteria: Set gutenberg.settings:article_enable_full to TRUE (via the Article content type's edit form
    'Enable Gutenberg experience' option or by saving the config), then save. This is the flag gin_gutenberg
    reads to activate.
  bundle: gin_gutenberg
  rubric_ref: rubric/gin_gutenberg_gin_gutenberg_enable_article@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/gin_gutenberg-enable-article-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/gin_gutenberg-enable-article-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/gin_gutenberg-enable-article-verify.sh
    difficulty_note: verify passes when gutenberg.settings:article_enable_full === TRUE.
- id: gin-gutenberg-enable-page
  input: I want the fancy block editor (Gutenberg, styled by Gin Gutenberg) to show up when editing Basic
    pages on my site. Set that up on the live site.
  criteria: Enable the Gutenberg experience for the Basic page (page) content type, i.e. set gutenberg.settings:page_enable_full
    to TRUE and save. gin_gutenberg then activates on page node forms.
  bundle: gin_gutenberg
  rubric_ref: rubric/gin_gutenberg_gin_gutenberg_enable_page@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-layman
    reset: agent-module-documentation/evaluation/verify/gin_gutenberg-enable-page-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/gin_gutenberg-enable-page-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/gin_gutenberg-enable-page-verify.sh
    difficulty_note: verify passes when gutenberg.settings:page_enable_full === TRUE.
