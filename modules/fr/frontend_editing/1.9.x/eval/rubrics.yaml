rubrics:
- id: frontend_editing_frontend_editing_enable_bundle_where
  version: '1.0'
  applicable_bundles:
  - frontend_editing
  checks:
  - kind: must_contain_any
    values:
    - entity_types
    - frontend_editing.settings
    - Entity types and bundles
    - entity-bundle-restrictions
    - /admin/config/frontend-editing
  scoring:
    combine: all_pass
- id: frontend_editing_frontend_editing_paragraph_permissions
  version: '1.0'
  applicable_bundles:
  - frontend_editing
  checks:
  - kind: must_contain_any
    values:
    - move paragraphs
    - add paragraphs
    - delete paragraphs
    - access frontend editing
    - administer frontend editing
  scoring:
    combine: all_pass
- id: frontend_editing_frontend_editing_dependency_and_ui
  version: '1.0'
  applicable_bundles:
  - frontend_editing
  checks:
  - kind: must_contain_any
    values:
    - paragraphs_edit
    - sidebar
    - in place
    - in-place
    - on the page
  scoring:
    combine: all_pass
- id: frontend_editing_frontend_editing_sidebar_width
  version: '1.0'
  applicable_bundles:
  - frontend_editing
  checks:
  - kind: must_contain_any
    values:
    - '42'
  scoring:
    combine: all_pass
- id: frontend_editing_frontend_editing_node_bundles
  version: '1.0'
  applicable_bundles:
  - frontend_editing
  checks:
  - kind: must_contain_any
    values:
    - article
  scoring:
    combine: all_pass
- id: frontend_editing_frontend_editing_enable_node
  version: '1.0'
  applicable_bundles:
  - frontend_editing
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
- id: frontend_editing_frontend_editing_ui_settings
  version: '1.0'
  applicable_bundles:
  - frontend_editing
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
