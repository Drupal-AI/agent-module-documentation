metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: frontend_editing
  version: 1.9.x
  note: 'Frontend Editing enables on-page editing of configured entity bundles (slide-in sidebar form)
    plus inline add/move/delete/duplicate for Paragraphs (hard dependency on paragraphs_edit). All configuration
    is the single config object frontend_editing.settings, whose central key entity_types is a map entity_type_id
    => [bundles] of what is editable; the rest are UI keys (sidebar_width default 30, full_width 70, automatic_preview
    false, primary_color #a9a9a9, ui_toggle true, etc). Config UI at /admin/config/frontend-editing (three
    forms; permission ''administer frontend editing''). Five permissions and two alter hooks + three access
    events. On this live site entity_types has only the ''paragraph'' entry populated (no node bundles),
    and all scalar settings sit at shipped defaults, so medium/hard cases add/remove the node key or flip
    scalar keys and restore precisely, never touching the existing paragraph list.'
questions:
- id: frontend_editing-enable-bundle-where
  input: I installed the Frontend Editing module on Drupal 11 but nothing is editable on my pages yet.
    How do I turn on frontend editing for a specific content type (bundle), and in which config object
    / key is that stored?
  criteria: 'Frontend editing is opt-in per entity-type/bundle. On the ''Entity types and bundles'' form
    (/admin/config/frontend-editing/entity-bundle-restrictions) tick the bundles, or set it directly:
    frontend_editing.settings key entity_types is a map entity_type_id => [bundles], e.g. entity_types.node:
    [article].'
  bundle: frontend_editing
  rubric_ref: rubric/frontend_editing_frontend_editing_enable_bundle_where@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: frontend_editing-paragraph-permissions
  input: Which permissions does the Frontend Editing module define, and specifically which permission
    lets an editor reorder Paragraphs up and down on the page?
  criteria: 'Five permissions: access frontend editing, administer frontend editing, move paragraphs,
    add paragraphs, delete paragraphs. ''move paragraphs'' gates the up/down reorder action links (frontend_editing.paragraph_up
    / paragraph_down).'
  bundle: frontend_editing
  rubric_ref: rubric/frontend_editing_frontend_editing_paragraph_permissions@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: frontend_editing-dependency-and-ui
  input: What does the Frontend Editing module give a content editor beyond the normal node edit form,
    and which contrib module does it depend on to manage Paragraphs?
  criteria: 'It lets editors edit content in place: the entity form opens in a slide-in sidebar over the
    rendered page, and Paragraphs get inline add/move/delete/duplicate controls, with optional live preview
    and AJAX in-place refresh. It depends on drupal/paragraphs_edit (^3.0) for the paragraph lineage/access
    operations.'
  bundle: frontend_editing
  rubric_ref: rubric/frontend_editing_frontend_editing_dependency_and_ui@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: frontend_editing-sidebar-width
  input: On this Drupal site, inspect the live Frontend Editing configuration and tell me the current
    sidebar width setting for the editing side panel.
  criteria: sidebar_width is 42 in frontend_editing.settings (drush cget frontend_editing.settings sidebar_width).
  bundle: frontend_editing
  rubric_ref: rubric/frontend_editing_frontend_editing_sidebar_width@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/frontend_editing-sidebar-width-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/frontend_editing-sidebar-width-cleanup.sh
- id: frontend_editing-node-bundles
  input: On this site, which node (content type) bundles are currently enabled for Frontend Editing? Inspect
    the live configuration to answer.
  criteria: The node bundles enabled for frontend editing are 'article' and 'page' - frontend_editing.settings
    entity_types.node is [article, page].
  bundle: frontend_editing
  rubric_ref: rubric/frontend_editing_frontend_editing_node_bundles@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/frontend_editing-node-bundles-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/frontend_editing-node-bundles-cleanup.sh
- id: frontend_editing-enable-node
  input: On this Drupal site, enable Frontend Editing for the Article content type so editors can edit
    Article nodes in place. Apply the change to the live site configuration.
  criteria: 'Add ''article'' to frontend_editing.settings entity_types.node (via the Entity types and
    bundles form or config): e.g. $e=$config->get(''entity_types''); $e[''node'']=[''article'']; $config->set(''entity_types'',$e)->save();'
  bundle: frontend_editing
  rubric_ref: rubric/frontend_editing_frontend_editing_enable_node@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/frontend_editing-enable-node-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/frontend_editing-enable-node-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/frontend_editing-enable-node-verify.sh
- id: frontend_editing-ui-settings
  input: On this site, configure Frontend Editing so the editing side panel is 40 percent wide and automatic
    preview is turned on. Apply the changes to the live configuration.
  criteria: Set frontend_editing.settings sidebar_width=40 and automatic_preview=true (via the main settings
    form /admin/config/frontend-editing or drush config), and save.
  bundle: frontend_editing
  rubric_ref: rubric/frontend_editing_frontend_editing_ui_settings@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/frontend_editing-ui-settings-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/frontend_editing-ui-settings-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/frontend_editing-ui-settings-verify.sh
