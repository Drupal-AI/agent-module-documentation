metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: friendlycaptcha
  version: 1.1.x
  note: Friendly Captcha is a CAPTCHA add-on (depends on captcha:captcha) that registers a proof-of-work
    challenge via hook_captcha(), with a settings config object, four API endpoints, and a local self-hosted
    verify service. Cases are `recipe` (response-graded) probing documented facts an agent would otherwise
    read source to answer; no site mutation.
questions:
- id: friendlycaptcha-proof-of-work
  input: How does the Friendly Captcha Drupal module challenge visitors — do they have to solve a puzzle,
    and how does verification work?
  criteria: The visitor's browser silently solves a cryptographic proof-of-work (no interactive puzzle
    to click/read); the friendly-challenge widget posts a solution token that is verified server-side
    on submit.
  bundle: friendlycaptcha
  rubric_ref: rubric/friendlycaptcha_friendlycaptcha_proof_of_work@1.0
  tags:
  - mode:recipe
- id: friendlycaptcha-depends-on-captcha
  input: Is the Drupal friendlycaptcha module standalone, or does it plug into another module? How does
    it register its challenge?
  criteria: 'It is not standalone: it depends on the CAPTCHA module (captcha:captcha) and registers a
    ''friendlycaptcha'' challenge type via hook_captcha().'
  bundle: friendlycaptcha
  rubric_ref: rubric/friendlycaptcha_friendlycaptcha_depends_on_captcha@1.0
  tags:
  - mode:recipe
- id: friendlycaptcha-keys-config
  input: Which config object and keys hold the Friendly Captcha site key and API key on a Drupal site,
    and where is the settings form?
  criteria: The friendlycaptcha.settings config object holds site_key and api_key (plus api_endpoint,
    enable_validation_logging); the form is at /admin/config/people/captcha/friendlycaptcha (route friendlycaptcha.admin_settings_form).
  bundle: friendlycaptcha
  rubric_ref: rubric/friendlycaptcha_friendlycaptcha_keys_config@1.0
  tags:
  - mode:recipe
- id: friendlycaptcha-endpoints
  input: What API endpoint options does the Friendly Captcha Drupal module offer, and which one requires
    no external account or keys?
  criteria: api_endpoint can be global (default), eu, eu_fallback, or local; the 'local' endpoint self-hosts
    puzzles/verification on the Drupal site and needs no account or keys (eu/eu_fallback need a Business/Enterprise
    plan).
  bundle: friendlycaptcha
  rubric_ref: rubric/friendlycaptcha_friendlycaptcha_endpoints@1.0
  tags:
  - mode:recipe
- id: friendlycaptcha-local-verify-service
  input: For self-hosted Friendly Captcha verification on Drupal, which service verifies the proof-of-work
    solution server-side, and what does it check?
  criteria: 'The friendlycaptcha.siteverify service (Drupal\friendlycaptcha\SiteVerify) verifies the solution
    locally: HMAC signature, replay protection, timeout, and proof-of-work difficulty.'
  bundle: friendlycaptcha
  rubric_ref: rubric/friendlycaptcha_friendlycaptcha_local_verify_service@1.0
  tags:
  - mode:recipe
- id: friendlycaptcha-permission
  input: Which permission gates the Friendly Captcha settings form in Drupal? Does the module define its
    own permission?
  criteria: It uses CAPTCHA's 'administer CAPTCHA settings' permission; friendlycaptcha defines no permission
    of its own (the old 'administer friendlycaptcha' was removed).
  bundle: friendlycaptcha
  rubric_ref: rubric/friendlycaptcha_friendlycaptcha_permission@1.0
  tags:
  - mode:recipe
- id: friendlycaptcha-privacy
  input: Why is Friendly Captcha considered a privacy/GDPR-friendly alternative to Google reCAPTCHA on
    Drupal?
  criteria: It runs no user tracking and shows no interactive puzzle; with the local endpoint all puzzle/verification
    traffic (with IP anonymization) stays on your own server, so no data leaves the site.
  bundle: friendlycaptcha
  rubric_ref: rubric/friendlycaptcha_friendlycaptcha_privacy@1.0
  tags:
  - mode:recipe
- id: friendlycaptcha-frontend-library
  input: The Friendly Captcha widget is missing on my Drupal forms. Which JavaScript library must be installed
    and where?
  criteria: The friendly-challenge widget must be installed at /libraries/friendly-challenge/widget.min.js
    (via download, composer require npm-asset/friendly-challenge, or NPM); it is not required through
    the module's Composer file.
  bundle: friendlycaptcha
  rubric_ref: rubric/friendlycaptcha_friendlycaptcha_frontend_library@1.0
  tags:
  - mode:recipe
