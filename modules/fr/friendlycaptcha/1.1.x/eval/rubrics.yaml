rubrics:
- id: friendlycaptcha_friendlycaptcha_proof_of_work
  version: '1.0'
  applicable_bundles:
  - friendlycaptcha
  checks:
  - kind: must_contain_any
    values:
    - proof-of-work
    - proof of work
    - no puzzle
    - background
  scoring:
    combine: all_pass
- id: friendlycaptcha_friendlycaptcha_depends_on_captcha
  version: '1.0'
  applicable_bundles:
  - friendlycaptcha
  checks:
  - kind: must_contain_any
    values:
    - captcha
    - hook_captcha
  scoring:
    combine: all_pass
- id: friendlycaptcha_friendlycaptcha_keys_config
  version: '1.0'
  applicable_bundles:
  - friendlycaptcha
  checks:
  - kind: must_contain_any
    values:
    - friendlycaptcha.settings
    - site_key
    - api_key
  scoring:
    combine: all_pass
- id: friendlycaptcha_friendlycaptcha_endpoints
  version: '1.0'
  applicable_bundles:
  - friendlycaptcha
  checks:
  - kind: must_contain_any
    values:
    - local
    - global
  scoring:
    combine: all_pass
- id: friendlycaptcha_friendlycaptcha_local_verify_service
  version: '1.0'
  applicable_bundles:
  - friendlycaptcha
  checks:
  - kind: must_contain_any
    values:
    - friendlycaptcha.siteverify
    - SiteVerify
  scoring:
    combine: all_pass
- id: friendlycaptcha_friendlycaptcha_permission
  version: '1.0'
  applicable_bundles:
  - friendlycaptcha
  checks:
  - kind: must_contain_any
    values:
    - administer CAPTCHA settings
  scoring:
    combine: all_pass
- id: friendlycaptcha_friendlycaptcha_privacy
  version: '1.0'
  applicable_bundles:
  - friendlycaptcha
  checks:
  - kind: must_contain_any
    values:
    - privacy
    - GDPR
    - no tracking
    - no user tracking
  scoring:
    combine: all_pass
- id: friendlycaptcha_friendlycaptcha_frontend_library
  version: '1.0'
  applicable_bundles:
  - friendlycaptcha
  checks:
  - kind: must_contain_any
    values:
    - friendly-challenge
    - /libraries/friendly-challenge
  scoring:
    combine: all_pass
