metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: bootstrap_datepicker
  version: 2.0.x
  note: 'Bootstrap Datepicker provides one field widget plugin, bootstrap_date_widget (label ''Bootstrap
    Datepicker''), for core datetime fields (extends DateTimeWidgetBase), plus a bootstrap_datepicker
    render element. No admin UI (configure=null), no permissions, no Drush, no config schema, no config
    entities of its own. Configuration is per-field widget settings on the entity_form_display: core.entity_form_display.<entity>.<bundle>.<mode>
    -> content.<field>.type = bootstrap_date_widget and content.<field>.settings.<key>. Option keys mirror
    the JS plugin (format, language, week_start, start_view, autoclose, today_btn, clear_btn, start_date/end_date,
    days_of_week_disabled, etc). The actual popup needs the JS/CSS library at /libraries/bootstrap-datepicker
    (declared in bootstrap_datepicker.libraries.yml); that library is NOT installed on this site, but
    widget config still saves and is verifiable. All medium/hard cases create core datetime fields (field_bsd_*)
    on Article and read/write the bootstrap_date_widget selection + settings on the default form display,
    verified against live entity_form_display config (config-only; no JS execution required).'
questions:
- id: bsd-widget-id
  input: In the Drupal bootstrap_datepicker module, what is the machine name of the field widget it provides,
    and which field type can it be used on?
  criteria: The widget plugin id is bootstrap_date_widget (label 'Bootstrap Datepicker'); it applies to
    core 'datetime' fields and extends DateTimeWidgetBase. Select it on the field's Manage form display.
  bundle: bootstrap_datepicker
  rubric_ref: rubric/bootstrap_datepicker_bsd_widget_id@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: bsd-settings-keys
  input: Name several of the widget settings you can configure for the bootstrap_datepicker (Bootstrap
    Datepicker) widget in Drupal.
  criteria: 'Settings mirror the JS plugin options: format (e.g. dd/mm/yyyy), language, week_start, start_view,
    min_view_mode/max_view_mode, autoclose, clear_btn, today_btn, today_highlight, calendar_weeks, orientation,
    start_date/end_date (or timedeltas), days_of_week_disabled/highlighted, dates_disabled, rtl, z_index_offset,
    and more. They are stored under the form display component''s settings.'
  bundle: bootstrap_datepicker
  rubric_ref: rubric/bootstrap_datepicker_bsd_settings_keys@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: bsd-library
  input: What external JavaScript library does the Drupal bootstrap_datepicker module require for the
    calendar popup to appear, and where must it be installed?
  criteria: It requires the uxsolutions/bootstrap-datepicker jQuery library installed at /libraries/bootstrap-datepicker
    (referenced by bootstrap_datepicker.libraries.yml, library id bootstrap_datepicker/datepicker). Without
    it the field still saves but the datepicker popup does not render.
  bundle: bootstrap_datepicker
  rubric_ref: rubric/bootstrap_datepicker_bsd_library@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: bsd-known-field
  input: On this Drupal site, the Article content type has two Date/time fields, field_bsd_on and field_bsd_off.
    Exactly one of them uses the Bootstrap Datepicker widget on the default form display. Inspect the
    live form-display configuration and state which field uses the bootstrap_datepicker widget.
  criteria: 'field_bsd_on uses the Bootstrap Datepicker widget: in core.entity_form_display.node.article.default
    its component type is bootstrap_date_widget, whereas field_bsd_off uses the core datetime_default
    widget.'
  bundle: bootstrap_datepicker
  rubric_ref: rubric/bootstrap_datepicker_bsd_known_field@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/bootstrap_datepicker-known-field-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/bootstrap_datepicker-known-field-cleanup.sh
- id: bsd-format
  input: On this Drupal site, the Article content type has a Date/time field field_bsd_fmt whose Bootstrap
    Datepicker widget has a specific display date format configured. Inspect the live default form display
    and report the configured 'format' setting value.
  criteria: 'The configured format is dd/mm/yyyy: in core.entity_form_display.node.article.default the
    field_bsd_fmt component (type bootstrap_date_widget) has settings.format = ''dd/mm/yyyy''.'
  bundle: bootstrap_datepicker
  rubric_ref: rubric/bootstrap_datepicker_bsd_format@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/bootstrap_datepicker-format-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/bootstrap_datepicker-format-cleanup.sh
- id: bsd-set-widget
  input: On this Drupal site, the Article content type has a Date/time field field_bsd_task currently
    using the default 'Date and time' widget on the default form display. Using the bootstrap_datepicker
    module, change that field's form-display widget to the Bootstrap Datepicker widget. Apply the change
    to the live site.
  criteria: In core.entity_form_display.node.article.default the field_bsd_task component has type = bootstrap_date_widget
    (e.g. set the component's widget type and save, or pick 'Bootstrap Datepicker' on Manage form display).
  bundle: bootstrap_datepicker
  rubric_ref: rubric/bootstrap_datepicker_bsd_set_widget@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/bootstrap_datepicker-set-widget-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/bootstrap_datepicker-set-widget-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/bootstrap_datepicker-set-widget-verify.sh
- id: bsd-set-autoclose
  input: On this Drupal site, the Article content type has a Date/time field field_bsd_auto on the default
    form display. Configure it to use the Bootstrap Datepicker widget with the 'autoclose' option enabled
    (so the calendar closes when a date is picked). Apply the change to the live default form display.
  criteria: In core.entity_form_display.node.article.default the field_bsd_auto component has type = bootstrap_date_widget
    and settings.autoclose is truthy (TRUE/1).
  bundle: bootstrap_datepicker
  rubric_ref: rubric/bootstrap_datepicker_bsd_set_autoclose@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/bootstrap_datepicker-set-autoclose-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/bootstrap_datepicker-set-autoclose-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/bootstrap_datepicker-set-autoclose-verify.sh
