metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: book
  version: 3.0.x
  note: Book organizes nodes into hierarchical outlines. All settings live in one config object book.settings;
    it provides 8 permissions, a book_navigation block, a Book condition, a book_node_selection reference
    handler, book-aware breadcrumbs/tokens/Views, and the book.manager service. Cases are `recipe` (response-graded)
    probing documented facts an agent would otherwise read source to answer; no site mutation.
questions:
- id: book-allowed-types
  input: On a Drupal 11 site with the Book module, how do I let the 'page' content type be added to book
    outlines? Which config object and key control this?
  criteria: Set allowed_types on the book.settings config object (each entry is content_type + child_type);
    e.g. allowed_types.0.content_type=page, allowed_types.0.child_type=page. Edit at /admin/structure/book/settings
    (route book.settings) or via drush config:set.
  bundle: book
  rubric_ref: rubric/book_book_allowed_types@1.0
  tags:
  - mode:recipe
- id: book-settings-route
  input: What is the Book module's settings route and path, and which permission gates it?
  criteria: Route book.settings at /admin/structure/book/settings, gated by the 'administer book settings'
    permission.
  bundle: book
  rubric_ref: rubric/book_book_settings_route@1.0
  tags:
  - mode:recipe
- id: book-sort
  input: In the Book module, how do I make sibling book pages sort automatically by title instead of by
    manual weight?
  criteria: Set book.settings.book_sort to 'title' (default is 'weight').
  bundle: book
  rubric_ref: rubric/book_book_sort@1.0
  tags:
  - mode:recipe
- id: book-nav-block-mode
  input: I placed the Book navigation block but it lists every book on the site. Which block setting limits
    it to just the current book's pages, and what values does it accept?
  criteria: Set the block_mode setting on the book_navigation block; values are 'all pages', 'book pages',
    'primary book page', 'child book pages'. Use 'book pages' (or a scoped mode) instead of 'all pages'.
  bundle: book
  rubric_ref: rubric/book_book_nav_block_mode@1.0
  tags:
  - mode:recipe
- id: book-print-permission
  input: Which Book permission lets a user view the printer-friendly single-document version of a book,
    and what is the export path?
  criteria: The 'access printer-friendly version' permission gates the printer-friendly export at /book/export/html/{node}
    (route book.export).
  bundle: book
  rubric_ref: rubric/book_book_print_permission@1.0
  tags:
  - mode:recipe
- id: book-manager-tree
  input: In custom code on a Drupal Book site, which service and method do I call to get the full nested
    tree of a book given its book id?
  criteria: 'Use the book.manager service (Drupal\book\BookManagerInterface) and call bookTreeAllData($bid).
    Related: loadBookLink($nid), getAllBooks(), getTableOfContents().'
  bundle: book
  rubric_ref: rubric/book_book_manager_tree@1.0
  tags:
  - mode:recipe
- id: book-reference-handler
  input: I want an entity-reference field that only lets editors pick nodes that are part of a book. Which
    selection handler does the Book module add?
  criteria: Choose the 'Book node selection' handler (plugin default:book_node_selection); it adds the
    'books' query tag to the node selection query.
  bundle: book
  rubric_ref: rubric/book_book_reference_handler@1.0
  tags:
  - mode:recipe
- id: book-uninstall
  input: Why does Drupal refuse to uninstall the Book module even though the module is enabled with no
    obvious dependents?
  criteria: Book registers an uninstall validator (BookUninstallValidator) that blocks uninstall while
    any book outline still exists; you must remove all books first.
  bundle: book
  rubric_ref: rubric/book_book_uninstall@1.0
  tags:
  - mode:recipe
- id: book-olivero-submodule
  input: Which Book submodule provides navigation styling and template overrides for the Olivero front-end
    theme?
  criteria: The book_olivero submodule provides styling and templates (book-navigation, book-tree, navigation.css)
    for the Olivero theme; it depends on book.
  bundle: book
  rubric_ref: rubric/book_book_olivero_submodule@1.0
  tags:
  - mode:recipe
