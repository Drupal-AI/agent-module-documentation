rubrics:
- id: bootstrap_paragraphs_bootstrap_paragraphs_style_fields
  version: '1.0'
  applicable_bundles:
  - bootstrap_paragraphs
  checks:
  - kind: must_contain_any
    values:
    - paragraph--width--
    - bp_width
    - bp_background
    - bp_margin
    - bp_padding
  scoring:
    combine: all_pass
- id: bootstrap_paragraphs_bootstrap_paragraphs_background_class
  version: '1.0'
  applicable_bundles:
  - bootstrap_paragraphs
  checks:
  - kind: must_contain_any
    values:
    - bg-primary
    - bs.background_color
    - hook_preprocess_paragraph
    - preprocess
  scoring:
    combine: all_pass
- id: bootstrap_paragraphs_bootstrap_paragraphs_child_only_bundles
  version: '1.0'
  applicable_bundles:
  - bootstrap_paragraphs
  checks:
  - kind: must_contain_any
    values:
    - bp_accordion_section
    - bp_tab_section
    - Accordion Section
    - Tab Section
  scoring:
    combine: all_pass
- id: bootstrap_paragraphs_bootstrap_paragraphs_allowed_bundles
  version: '1.0'
  applicable_bundles:
  - bootstrap_paragraphs
  checks:
  - kind: must_contain_any
    values:
    - bp_columns_three_uneven
  scoring:
    combine: all_pass
- id: bootstrap_paragraphs_bootstrap_paragraphs_styled_section
  version: '1.0'
  applicable_bundles:
  - bootstrap_paragraphs
  checks:
  - kind: must_contain_any
    values:
    - rgba-teal-strong
  scoring:
    combine: all_pass
- id: bootstrap_paragraphs_bootstrap_paragraphs_slide_interval
  version: '1.0'
  applicable_bundles:
  - bootstrap_paragraphs
  checks:
  - kind: must_contain_any
    values:
    - '6000'
    - 6 Seconds
    - 6 seconds
  scoring:
    combine: all_pass
- id: bootstrap_paragraphs_bootstrap_paragraphs_sections_field
  version: '1.0'
  applicable_bundles:
  - bootstrap_paragraphs
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
- id: bootstrap_paragraphs_bootstrap_paragraphs_styled_simple
  version: '1.0'
  applicable_bundles:
  - bootstrap_paragraphs
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
- id: bootstrap_paragraphs_bootstrap_paragraphs_uneven_columns
  version: '1.0'
  applicable_bundles:
  - bootstrap_paragraphs
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
