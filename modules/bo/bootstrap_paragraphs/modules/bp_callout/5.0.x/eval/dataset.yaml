metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: bp_callout
  version: 5.0.x
  note: 'bp_callout is a submodule of bootstrap_paragraphs 5.0.x. It is config-plus-Twig only: no PHP
    classes, services, plugins, permissions, Drush commands or config schema, and configure=null. Installing
    it imports paragraphs.paragraphs_type.bp_callout plus five field instances on that bundle: bp_callout_style
    (list_string, 9 values whose stored value IS the CSS class, callout-style--primary .. callout-style--white),
    bp_callout_content (entity_reference_revisions -> paragraph, cardinality -1, 13 allowed nested bundles),
    and the shared bp_header / bp_width / bp_background fields whose storages belong to the parent module.
    bp_callout.module only implements hook_theme() (paragraph__bp_callout) and hook_help(). Every case
    below is grounded in that real config: the easy cases ask about the actual allowed values, the real
    field type and the real nesting settings; the medium cases read back a live Callout paragraph and
    a live paragraphs field''s target_bundles; the hard cases require creating a real paragraphs field
    that accepts bp_callout, and building a real bp_callout paragraph with specific field values on a
    node.'
questions:
- id: bp_callout-style-values
  input: On a Drupal 11 site using the bp_callout submodule of Bootstrap Paragraphs, an editor wants a
    red 'danger' styled callout. What is the machine value stored in the Callout Style field for that,
    and what does the module do with that stored value?
  criteria: 'The Callout Style field is bp_callout_style, a list_string with nine allowed values (callout-style--primary,
    --secondary, --success, --danger, --warning, --info, --dark, --light, --white). Danger is ''callout-style--danger''.
    The stored value IS the CSS class: paragraph--bp-callout.html.twig matches it against a whitelist
    and merges it into the wrapper div''s class attribute.'
  bundle: bp_callout
  rubric_ref: rubric/bp_callout_bp_callout_style_values@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: bp_callout-nesting
  input: I installed bp_callout on Drupal 11. Can a Callout paragraph contain other Bootstrap Paragraphs
    bundles inside it? Name the field that does this, its field type, and its cardinality.
  criteria: Yes. The field is bp_callout_content, type entity_reference_revisions targeting paragraph,
    cardinality -1 (unlimited). Its handler_settings.target_bundles allow 13 bundles (bp_simple, bp_image,
    bp_blank, bp_accordion, bp_carousel, bp_column_wrapper, bp_columns, bp_columns_three_uneven, bp_columns_two_uneven,
    bp_block, bp_modal, bp_tabs, bp_view); bp_accordion_section and bp_tab_section are explicitly disabled.
  bundle: bp_callout
  rubric_ref: rubric/bp_callout_bp_callout_nesting@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: bp_callout-no-settings-form
  input: Where is the admin settings page for the bp_callout module on a Drupal 11 site, and how do I
    actually make the Callout paragraph type available to editors on a content type?
  criteria: 'There is none - bp_callout declares no configure route (configure: null) and ships no settings
    form. The bundle paragraphs.paragraphs_type.bp_callout is imported at install. To use it you add or
    edit an entity_reference_revisions (Paragraphs) field on a content type and tick the Callout bundle,
    i.e. add bp_callout to that field''s settings.handler_settings.target_bundles.'
  bundle: bp_callout
  rubric_ref: rubric/bp_callout_bp_callout_no_settings_form@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: bp_callout-known-style
  input: This Drupal site has an article node titled 'BP Callout Known Notice' that contains a Bootstrap
    Paragraphs Callout paragraph. Inspect the running site and tell me the exact value stored in that
    Callout paragraph's Callout Style field.
  criteria: callout-style--info. The node's field_bpcallout_known references a paragraph of bundle bp_callout
    whose bp_callout_style value is 'callout-style--info' (bp_header is 'Known Callout', bp_width is 'paragraph--width--medium').
  bundle: bp_callout
  rubric_ref: rubric/bp_callout_bp_callout_known_style@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/bp_callout-known-style-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/bp_callout-known-style-cleanup.sh
- id: bp_callout-allowed-bundles
  input: On this Drupal site the Article content type has a Paragraphs field called field_bpcallout_probe.
    Inspect the live configuration and list exactly which paragraph bundles that field is allowed to reference.
  criteria: 'Exactly two: bp_callout and bp_simple. field.field.node.article.field_bpcallout_probe has
    settings.handler ''default:paragraph'' and settings.handler_settings.target_bundles = {bp_callout:
    bp_callout, bp_simple: bp_simple}.'
  bundle: bp_callout
  rubric_ref: rubric/bp_callout_bp_callout_allowed_bundles@1.0
  tags:
  - mode:introspection
  - difficulty:medium
