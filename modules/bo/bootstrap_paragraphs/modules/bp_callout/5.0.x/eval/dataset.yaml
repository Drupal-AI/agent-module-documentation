    setup: agent-module-documentation/evaluation/verify/bp_callout-allowed-bundles-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/bp_callout-allowed-bundles-cleanup.sh
- id: bp_callout-attach-field
  input: On this Drupal site, add a Paragraphs field named field_bpcallout_task to the Article content
    type so editors can place Bootstrap Paragraphs Callout paragraphs on articles. It must be an entity_reference_revisions
    field targeting paragraphs, allow unlimited values, and be restricted so the bp_callout bundle is
    among the bundles it accepts. Apply the change to the live site.
  criteria: 'node.article gains field_bpcallout_task: a FieldStorageConfig of type entity_reference_revisions
    with settings.target_type = paragraph and cardinality -1, plus a FieldConfig whose settings.handler
    is ''default:paragraph'' and whose settings.handler_settings.target_bundles contains bp_callout.'
  bundle: bp_callout
  rubric_ref: rubric/bp_callout_bp_callout_attach_field@1.0
