rubrics:
- id: bp_webform_bp_webform_widget_formatter
  version: '1.0'
  applicable_bundles:
  - bp_webform
  checks:
  - kind: must_contain_any
    values:
    - webform_entity_reference_select
    - webform_entity_reference_entity_view
  scoring:
    combine: all_pass
- id: bp_webform_bp_webform_bundle_fields
  version: '1.0'
  applicable_bundles:
  - bp_webform
  checks:
  - kind: must_contain_any
    values:
    - bp_background
    - bp_width
  scoring:
    combine: all_pass
- id: bp_webform_bp_webform_expose_bundle
  version: '1.0'
  applicable_bundles:
  - bp_webform
  checks:
  - kind: must_contain_any
    values:
    - entity_reference_revisions
    - target_bundles
    - Paragraphs field
  scoring:
    combine: all_pass
- id: bp_webform_bp_webform_known_webform
  version: '1.0'
  applicable_bundles:
  - bp_webform
  checks:
  - kind: must_contain_any
    values:
    - bpwf_eval_contact
  scoring:
    combine: all_pass
- id: bp_webform_bp_webform_known_status
  version: '1.0'
  applicable_bundles:
  - bp_webform
  checks:
  - kind: must_contain_any
    values:
    - closed
  scoring:
    combine: all_pass
- id: bp_webform_bp_webform_attach_field
  version: '1.0'
  applicable_bundles:
  - bp_webform
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
- id: bp_webform_bp_webform_build_paragraph
  version: '1.0'
  applicable_bundles:
  - bp_webform
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
