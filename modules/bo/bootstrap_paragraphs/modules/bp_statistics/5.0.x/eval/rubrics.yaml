rubrics:
- id: bp_statistics_bp_statistics_stat_fields
  version: '1.0'
  applicable_bundles:
  - bp_statistics
  checks:
  - kind: must_contain_any
    values:
    - bp_statistic_header
    - bp_statistic_item
    - bp_statistic_description
  scoring:
    combine: all_pass
- id: bp_statistics_bp_statistics_column_count
  version: '1.0'
  applicable_bundles:
  - bp_statistics
  checks:
  - kind: must_contain_any
    values:
    - loop.length
    - __3col
    - 3col
    - paragraph--type--bp-statistics__
  scoring:
    combine: all_pass
- id: bp_statistics_bp_statistics_nesting_field
  version: '1.0'
  applicable_bundles:
  - bp_statistics
  checks:
  - kind: must_contain_any
    values:
    - entity_reference_revisions
    - entity_reference_paragraphs
  scoring:
    combine: all_pass
- id: bp_statistics_bp_statistics_known_stat
  version: '1.0'
  applicable_bundles:
  - bp_statistics
  checks:
  - kind: must_contain_any
    values:
    - '99.98'
  scoring:
    combine: all_pass
- id: bp_statistics_bp_statistics_known_background
  version: '1.0'
  applicable_bundles:
  - bp_statistics
  checks:
  - kind: must_contain_any
    values:
    - paragraph--color--info
  scoring:
    combine: all_pass
- id: bp_statistics_bp_statistics_attach_field
  version: '1.0'
  applicable_bundles:
  - bp_statistics
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
- id: bp_statistics_bp_statistics_build_stats
  version: '1.0'
  applicable_bundles:
  - bp_statistics
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
