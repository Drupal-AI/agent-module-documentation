    value (the bp_statistic_item) belonging to the stat whose header is 'Uptime'.
  criteria: 99.98%. The node's field_bpstat_a references a bp_statistics paragraph whose bp_statistic
    field holds three bp_stat children; the one with bp_statistic_header 'Uptime' has bp_statistic_item
    '99.98%'.
  bundle: bp_statistics
  rubric_ref: rubric/bp_statistics_bp_statistics_known_stat@1.0
  tags:
  - mode:introspection
  - difficulty:medium
