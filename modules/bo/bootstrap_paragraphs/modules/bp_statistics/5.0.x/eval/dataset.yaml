metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: bp_statistics
  version: 5.0.x
  note: 'bp_statistics is a config-only submodule of bootstrap_paragraphs and the only one that installs
    TWO paragraph types: an outer bp_statistics container and an inner bp_stat item. The outer bundle
    carries the shared bootstrap_paragraphs styling fields bp_header/bp_width/bp_background plus bp_statistic
    — an entity_reference_revisions storage with cardinality 4 whose handler_settings.target_bundles allows
    only bp_stat, edited with the entity_reference_paragraphs widget (edit_mode closed, add_mode dropdown,
    default_paragraph_type bp_stat). The inner bp_stat bundle has three plain string fields: bp_statistic_header,
    bp_statistic_item, bp_statistic_description. Layout is decided in twig: field--paragraph--bp-statistic.html.twig
    wraps each item in paragraph--type--bp-statistics__{{ loop.length }}col, so three stats render as
    __3col and four as __4col. There is no configure route, settings form, permission, Drush command or
    plugin; PHP is only hook_theme() + hook_help(). Config ships in config/optional so it survives uninstall.
    Medium and hard cases are grounded in that real nested structure on live content.'
questions:
- id: bp_statistics-stat-fields
  input: On a Drupal 11 site with the Bootstrap Paragraphs Statistics (bp_statistics) module installed,
    an individual statistic is its own paragraph bundle. What are the machine names of the three fields
    on that inner bundle, and what field type are they?
  criteria: The inner bundle is bp_stat, and its three fields are bp_statistic_header, bp_statistic_item
    and bp_statistic_description — all plain core `string` fields with max_length 255, cardinality 1,
    rendered with the string formatter.
  bundle: bp_statistics
  rubric_ref: rubric/bp_statistics_bp_statistics_stat_fields@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: bp_statistics-column-count
  input: The Bootstrap Paragraphs Statistics module renders its statistics in columns, but there is no
    column-count setting anywhere in the admin UI. How does it decide how many columns to use, and what
    CSS class does it emit for a row containing three statistics?
  criteria: 'The field template field--paragraph--bp-statistic.html.twig wraps each item in a div whose
    class is built from the twig loop counter: paragraph--type--bp-statistics__{{ loop.length }}col. loop.length
    is the number of stats in the field, so three statistics produce paragraph--type--bp-statistics__3col
    and four produce __4col. The shipped CSS turns those into 33.33% / 25% floated columns above 768px.'
  bundle: bp_statistics
  rubric_ref: rubric/bp_statistics_bp_statistics_column_count@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: bp_statistics-nesting-field
  input: In the Drupal module bp_statistics, how does the outer Statistics paragraph hold its individual
    stats? Name the field type used for that relationship, the widget used to edit them inline, and the
    maximum number of stats one Statistics paragraph can hold.
  criteria: The outer bp_statistics bundle has a field bp_statistic of type entity_reference_revisions
    (storage field.storage.paragraph.bp_statistic) with cardinality 4, whose handler_settings.target_bundles
    allows only bp_stat. It is edited inline with the entity_reference_paragraphs widget (title 'Stat',
    edit_mode closed, add_mode dropdown, default_paragraph_type bp_stat). Raise the storage cardinality
    to allow more than four.
  bundle: bp_statistics
  rubric_ref: rubric/bp_statistics_bp_statistics_nesting_field@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: bp_statistics-known-stat
