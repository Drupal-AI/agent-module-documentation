metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: bp_card
  version: 5.0.x
  note: 'bp_card is a submodule of bootstrap_paragraphs 5.0.x. It is config, one Twig template and one
    .install file: no services, plugins, permissions, Drush commands or config schema, and configure=null.
    It imports paragraphs.paragraphs_type.bp_card plus nine field instances. Seven have their own storages:
    bp_card_title (string), bp_card_text (string_long), bp_card_image (image, alt required, uploads to
    card/[date:custom:Y]-[date:custom:m]), bp_card_link (link), bp_card_style (list_string with exactly
    two values card--large-top and card--small-left), bp_card_button_style (list_string, eight ''btn btn-*''
    values) and bp_link_entire_card (boolean). bp_margin and bp_padding reuse parent storages and sit
    in a collapsed field_group ''Styles'' details group. This bundle has NO bp_width, bp_background or
    bp_header. The Twig template branches on bp_card_style and adds Bootstrap''s stretched-link class
    when the rendered bp_link_entire_card output equals ''On''. Cases below are grounded in that config:
    easy cases ask about the real two layout values, the real stretched-link mechanism and the real absence
    of a settings form; medium cases read back a live Card paragraph''s style/button values and compare
    two cards'' bp_link_entire_card flags; hard cases require building a real paragraphs field that accepts
    bp_card and a real Card paragraph with exact field values.'
questions:
- id: bp_card-layout-values
  input: On a Drupal 11 site using the bp_card submodule of Bootstrap Paragraphs, what layout options
    does the Card Style field offer, and what happens to the rendered output if an editor leaves Card
    Style empty?
  criteria: 'bp_card_style is a list_string with exactly two allowed values: card--large-top (''Card with
    Large Top Image'') and card--small-left (''Card with Small Left Image''). The whole of paragraph--bp-card.html.twig
    sits inside two {% if card_style == ''...'' %} branches, so if Card Style is empty the paragraph renders
    nothing at all.'
  bundle: bp_card
  rubric_ref: rubric/bp_card_bp_card_layout_values@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: bp_card-stretched-link
  input: The bp_card Bootstrap Paragraphs bundle has a 'Link Entire Card' checkbox. Which field is that,
    and what does the template actually do when it is ticked?
  criteria: The field is bp_link_entire_card, a boolean shown with the boolean_checkbox widget. When ticked,
    paragraph--bp-card.html.twig adds Bootstrap's stretched-link class to the card-footer anchor so the
    whole card becomes the click target. It does this by comparing the rendered formatter output to the
    literal string 'On', so changing the boolean formatter's on-label breaks it.
  bundle: bp_card
  rubric_ref: rubric/bp_card_bp_card_stretched_link@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: bp_card-button-styles
  input: How do I make the link on a Bootstrap Paragraphs Card render as a green 'success' button, and
    where do those button classes come from? Is there an admin settings page for the bp_card module?
  criteria: 'Set the Card Button Style field (bp_card_button_style) to ''btn btn-success''. It is a list_string
    whose eight allowed values are literal Bootstrap class strings: btn btn-primary, btn btn-secondary,
    btn btn-success, btn btn-info, btn btn-light, btn btn-dark, btn btn-danger, btn btn-warning. The template
    prints that stored value straight into the anchor''s class attribute. There is no settings page: bp_card
    declares configure: null and ships no settings form.'
  bundle: bp_card
  rubric_ref: rubric/bp_card_bp_card_button_styles@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: bp_card-known-card
  input: This Drupal site has an article node titled 'BP Card Known Promo' containing a Bootstrap Paragraphs
    Card. Inspect the running site and tell me the exact values stored in that Card's Card Style and Card
    Button Style fields.
  criteria: bp_card_style is 'card--small-left' and bp_card_button_style is 'btn btn-warning'. The node's
    field_bpcard_known references a bp_card paragraph titled 'Known Promo Card' which also has bp_link_entire_card
    = 1 and bp_margin = 'mt-5 mb-5'.
  bundle: bp_card
  rubric_ref: rubric/bp_card_bp_card_known_card@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/bp_card-known-card-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/bp_card-known-card-cleanup.sh
- id: bp_card-stretched-link-live
  input: This Drupal site has two article nodes, 'BP Card Clickable' and 'BP Card Plain', each holding
    one Bootstrap Paragraphs Card. On exactly one of them the whole card is a click target. Inspect the
    live site and tell me which node that is and which field value proves it.
  criteria: '''BP Card Clickable'' - its bp_card paragraph (titled ''Clickable Card'') has bp_link_entire_card
    = 1, which makes the template add the stretched-link class. The card on ''BP Card Plain'' has bp_link_entire_card
    = 0.'
  bundle: bp_card
  rubric_ref: rubric/bp_card_bp_card_stretched_link_live@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/bp_card-stretched-link-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/bp_card-stretched-link-cleanup.sh
- id: bp_card-attach-deck
  input: On this Drupal site, add a Paragraphs field named field_bpcard_deck to the Article content type
    so editors can build a deck of Bootstrap Paragraphs Cards. It must be an entity_reference_revisions
    field targeting paragraphs, allow an unlimited number of values, and accept the bp_card bundle. Apply
    the change to the live site.
  criteria: 'node.article gains field_bpcard_deck: a FieldStorageConfig of type entity_reference_revisions
    with settings.target_type = paragraph and cardinality -1, plus a FieldConfig whose settings.handler
    is ''default:paragraph'' and whose settings.handler_settings.target_bundles contains bp_card.'
  bundle: bp_card
  rubric_ref: rubric/bp_card_bp_card_attach_deck@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/bp_card-attach-deck-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/bp_card-attach-deck-reset.sh
    verify: agent-module-documentation/evaluation/verify/bp_card-attach-deck-verify.sh
- id: bp_card-build-card
  input: This site already has an Article field called field_bpcard_build that accepts Bootstrap Paragraphs
    Cards. Create a published article titled exactly 'BP Card Build Target' with one Card in that field.
    The card's title must read exactly 'Annual Report', it should use the layout with the large image
    across the top, its link should be styled as a green success button, and clicking anywhere on the
    card should follow that link. Save it on the live site.
  criteria: An article titled 'BP Card Build Target' whose field_bpcard_build references a bp_card paragraph
    with bp_card_title = 'Annual Report', bp_card_style = 'card--large-top', bp_card_button_style = 'btn
    btn-success' and bp_link_entire_card = TRUE.
  bundle: bp_card
  rubric_ref: rubric/bp_card_bp_card_build_card@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: site-owner
    reset: agent-module-documentation/evaluation/verify/bp_card-build-card-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/bp_card-build-card-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/bp_card-build-card-verify.sh
