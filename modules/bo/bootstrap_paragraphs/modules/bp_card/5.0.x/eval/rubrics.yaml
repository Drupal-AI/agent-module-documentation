rubrics:
- id: bp_card_bp_card_layout_values
  version: '1.0'
  applicable_bundles:
  - bp_card
  checks:
  - kind: must_contain_any
    values:
    - card--large-top
    - card--small-left
  scoring:
    combine: all_pass
- id: bp_card_bp_card_stretched_link
  version: '1.0'
  applicable_bundles:
  - bp_card
  checks:
  - kind: must_contain_any
    values:
    - bp_link_entire_card
    - stretched-link
  scoring:
    combine: all_pass
- id: bp_card_bp_card_button_styles
  version: '1.0'
  applicable_bundles:
  - bp_card
  checks:
  - kind: must_contain_any
    values:
    - btn btn-success
    - bp_card_button_style
  scoring:
    combine: all_pass
- id: bp_card_bp_card_known_card
  version: '1.0'
  applicable_bundles:
  - bp_card
  checks:
  - kind: must_contain_any
    values:
    - card--small-left
    - btn btn-warning
  scoring:
    combine: all_pass
- id: bp_card_bp_card_stretched_link_live
  version: '1.0'
  applicable_bundles:
  - bp_card
  checks:
  - kind: must_contain_any
    values:
    - BP Card Clickable
  scoring:
    combine: all_pass
- id: bp_card_bp_card_attach_deck
  version: '1.0'
  applicable_bundles:
  - bp_card
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
- id: bp_card_bp_card_build_card
  version: '1.0'
  applicable_bundles:
  - bp_card
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
