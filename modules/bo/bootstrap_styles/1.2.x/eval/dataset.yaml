metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: bootstrap_styles
  version: 1.2.x
  note: 'Bootstrap Styles is a Layout Builder styling foundation: two plugin types (Style + StylesGroup)
    with two managers, a StylesGroupManager form/render service, one config object of option classes,
    and a settings route. It ships no UI on Layout Builder itself — bootstrap_layout_builder consumes
    it. Cases are `recipe` (response-graded): they probe documented facts an agent would otherwise read
    source to answer; no site mutation.'
questions:
- id: bootstrap-styles-plugin-types
  input: In Bootstrap Styles for Drupal, what are the two plugin types it defines and which plugin manager
    service instantiates each?
  criteria: Style plugins (@Style, manager plugin.manager.bootstrap_styles / StyleManager) and StylesGroup
    plugins (@StylesGroup, manager plugin.manager.bootstrap_styles_group / StylesGroupManager).
  bundle: bootstrap_styles
  rubric_ref: rubric/bootstrap_styles_bootstrap_styles_plugin_types@1.0
  tags:
  - mode:recipe
- id: bootstrap-styles-add-style-plugin
  input: I want to add a custom style control to Bootstrap Styles. What annotation and base class do I
    use, in which plugin namespace, and how do I bind it to a group?
  criteria: Create a plugin under Plugin/BootstrapStyles/Style extending StylePluginBase with an @Style
    annotation; set group_id to the StylesGroup it belongs to.
  bundle: bootstrap_styles
  rubric_ref: rubric/bootstrap_styles_bootstrap_styles_add_style_plugin@1.0
  tags:
  - mode:recipe
- id: bootstrap-styles-groups
  input: Which built-in style groups does Bootstrap Styles provide for Layout Builder (e.g. for backgrounds,
    spacing, borders, shadow, typography, animations)?
  criteria: 'Built-in StylesGroup plugins: background, spacing, border, shadow, typography, animation.'
  bundle: bootstrap_styles
  rubric_ref: rubric/bootstrap_styles_bootstrap_styles_groups@1.0
  tags:
  - mode:recipe
- id: bootstrap-styles-apply-to-layout-builder
  input: Programmatically, how does Bootstrap Styles expose its style controls on a Layout Builder section/block
    form and then render the chosen CSS classes onto the element? Name the service and the methods.
  criteria: 'Via the StylesGroupManager service (plugin.manager.bootstrap_styles_group): buildStylesFormElements()
    adds the controls, submitStylesFormElements() collects values, buildStyles() attaches the CSS classes
    to the element build.'
  bundle: bootstrap_styles
  rubric_ref: rubric/bootstrap_styles_bootstrap_styles_apply_to_layout_builder@1.0
  tags:
  - mode:recipe
- id: bootstrap-styles-settings-route
  input: Where do I configure Bootstrap Styles option classes and settings, and which permission gates
    it? Give the route name and path.
  criteria: Route bootstrap_styles.settings at /admin/config/bootstrap-styles/settings, gated by the 'configure
    bootstrap styles' permission; edits the bootstrap_styles.settings config object.
  bundle: bootstrap_styles
  rubric_ref: rubric/bootstrap_styles_bootstrap_styles_settings_route@1.0
  tags:
  - mode:recipe
- id: bootstrap-styles-option-class-format
  input: In Bootstrap Styles, how are the selectable style options (e.g. background colors, padding) defined
    in configuration? What is the line format and where is it stored?
  criteria: As one `key|label` per line (key = CSS class without the dot, e.g. bs-bg-success|Green) in
    the bootstrap_styles.settings config object; parsed by getStyleOptions().
  bundle: bootstrap_styles
  rubric_ref: rubric/bootstrap_styles_bootstrap_styles_option_class_format@1.0
  tags:
  - mode:recipe
- id: bootstrap-styles-alter-hook
  input: How can another module alter or remove Bootstrap Styles' Style/StylesGroup plugin definitions?
  criteria: Both managers call alterInfo('bootstrap_styles_info'), so implement hook_bootstrap_styles_info_alter(&$definitions)
    to add/remove/modify plugin definitions.
  bundle: bootstrap_styles
  rubric_ref: rubric/bootstrap_styles_bootstrap_styles_alter_hook@1.0
  tags:
  - mode:recipe
- id: bootstrap-styles-relationship-blb
  input: Does Bootstrap Styles add the styling UI to Layout Builder by itself, and which popular module
    builds on it to provide the section/block styling experience?
  criteria: No — Bootstrap Styles is a foundation providing the style plugins/engine; bootstrap_layout_builder
    consumes StylesGroupManager to expose the styling on Layout Builder sections and blocks.
  bundle: bootstrap_styles
  rubric_ref: rubric/bootstrap_styles_bootstrap_styles_relationship_blb@1.0
  tags:
  - mode:recipe
