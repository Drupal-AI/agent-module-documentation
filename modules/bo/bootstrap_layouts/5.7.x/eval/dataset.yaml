metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: bootstrap_layouts
  version: 5.7.x
  note: Bootstrap Layouts registers core Layout plugins (rows/columns) via YAML, adds a shared config
    form for wrappers/classes/attributes, defines two plugin types (handler + update), and ships no admin
    UI or config. Cases are `recipe` (response-graded) probing documented facts an agent would otherwise
    read source to answer; no site mutation.
questions:
- id: bl-layouts-registered
  input: On a Drupal 11 site, which layout system does Bootstrap Layouts plug into, and roughly what layouts
    does it add? Name the category they appear under and a couple of the layout ids.
  criteria: It registers core Layout Discovery plugins under the 'Bootstrap' category (bs_1col, bs_2col,
    bs_3col, bs_4col plus _stacked and _bricked variants, 11 total), so they show up in Layout Builder,
    Display Suite, and Panels.
  bundle: bootstrap_layouts
  rubric_ref: rubric/bootstrap_layouts_bl_layouts_registered@1.0
  tags:
  - mode:recipe
- id: bl-use-in-layout-builder
  input: How do I use a Bootstrap Layouts grid in Layout Builder or Display Suite on Drupal 11, and does
    the module have an admin settings page to configure first?
  criteria: There is no admin UI or config route; the module just needs to be installed. You pick a Bootstrap
    layout when adding a Layout Builder section or a Display Suite layout; settings are stored per display.
  bundle: bootstrap_layouts
  rubric_ref: rubric/bootstrap_layouts_bl_use_in_layout_builder@1.0
  tags:
  - mode:recipe
- id: bl-column-classes
  input: In a Bootstrap Layouts region, how do I set the column width and breakpoint (e.g. make a region
    span 8 of 12 columns on medium screens)? Where do the class options come from?
  criteria: Pick a class like col-md-8 from the region's Classes multi-select (options col-{xs,sm,md,lg}-{1..12}
    plus hidden/visible/background/text/utility groups), generated by BootstrapLayoutsManager::getClassOptions().
  bundle: bootstrap_layouts
  rubric_ref: rubric/bootstrap_layouts_bl_column_classes@1.0
  tags:
  - mode:recipe
- id: bl-dependency
  input: What is the single Drupal core module Bootstrap Layouts depends on, and what theme requirement
    does it have to actually render correctly?
  criteria: It depends on core layout_discovery (Layout Discovery). It needs a Bootstrap-based theme (or
    one providing .row/.col-* grid classes) to style the output.
  bundle: bootstrap_layouts
  rubric_ref: rubric/bootstrap_layouts_bl_dependency@1.0
  tags:
  - mode:recipe
- id: bl-custom-layout
  input: How do I define my own Bootstrap grid layout in a custom module so it reuses Bootstrap Layouts'
    region config form? Which class and which YAML file?
  criteria: Add an entry to your module's {module}.layouts.yml with class '\Drupal\bootstrap_layouts\Plugin\Layout\BootstrapLayoutsBase',
    category 'Bootstrap', a template and regions; no PHP needed.
  bundle: bootstrap_layouts
  rubric_ref: rubric/bootstrap_layouts_bl_custom_layout@1.0
  tags:
  - mode:recipe
- id: bl-class-options-hook
  input: I want to add my own theme's utility classes to the list of classes selectable in Bootstrap Layouts
    regions. Which hook do I implement?
  criteria: Implement hook_bootstrap_layouts_class_options_alter(&$classes, &$groups) to add a group and/or
    classes to the selectable options.
  bundle: bootstrap_layouts
  rubric_ref: rubric/bootstrap_layouts_bl_class_options_hook@1.0
  tags:
  - mode:recipe
- id: bl-plugin-types
  input: Bootstrap Layouts defines its own plugin type for loading/saving layout instances in different
    consumers (Display Suite, Panels). What is the annotation/handler plugin type and which two handlers
    ship with it?
  criteria: 'The BootstrapLayoutsHandler plugin type (manager plugin.manager.bootstrap_layouts). Built-in
    handlers: ''ds'' (Display Suite) and ''page_manager'' (Panels/Page Manager).'
  bundle: bootstrap_layouts
  rubric_ref: rubric/bootstrap_layouts_bl_plugin_types@1.0
  tags:
  - mode:recipe
- id: bl-region-wrapper-attributes
  input: In a Bootstrap Layouts layout, how do I change a region's wrapper HTML element and add a custom
    attribute like an id? What auto-added classes mark each region?
  criteria: Choose the Wrapper element (div, span, section, article, header, footer, aside, figure) and
    enter attributes as key|value pairs (e.g. id|hero). With 'Add region specific classes' on, each region
    gets bs-region and bs-region--{name}.
  bundle: bootstrap_layouts
  rubric_ref: rubric/bootstrap_layouts_bl_region_wrapper_attributes@1.0
  tags:
  - mode:recipe
