rubrics:
- id: bootstrap_layouts_bl_layouts_registered
  version: '1.0'
  applicable_bundles:
  - bootstrap_layouts
  checks:
  - kind: must_contain_any
    values:
    - Bootstrap
    - bs_2col
    - bs_3col
    - bs_1col
    - layout_discovery
  scoring:
    combine: all_pass
- id: bootstrap_layouts_bl_use_in_layout_builder
  version: '1.0'
  applicable_bundles:
  - bootstrap_layouts
  checks:
  - kind: must_contain_any
    values:
    - no admin
    - no configuration
    - just be installed
    - section
    - no settings
  scoring:
    combine: all_pass
- id: bootstrap_layouts_bl_column_classes
  version: '1.0'
  applicable_bundles:
  - bootstrap_layouts
  checks:
  - kind: must_contain_any
    values:
    - col-md-8
    - col-
    - getClassOptions
    - Classes
  scoring:
    combine: all_pass
- id: bootstrap_layouts_bl_dependency
  version: '1.0'
  applicable_bundles:
  - bootstrap_layouts
  checks:
  - kind: must_contain_any
    values:
    - layout_discovery
    - Layout Discovery
  scoring:
    combine: all_pass
- id: bootstrap_layouts_bl_custom_layout
  version: '1.0'
  applicable_bundles:
  - bootstrap_layouts
  checks:
  - kind: must_contain_any
    values:
    - BootstrapLayoutsBase
    - layouts.yml
    - Plugin/Layout/BootstrapLayoutsBase
  scoring:
    combine: all_pass
- id: bootstrap_layouts_bl_class_options_hook
  version: '1.0'
  applicable_bundles:
  - bootstrap_layouts
  checks:
  - kind: must_contain_any
    values:
    - hook_bootstrap_layouts_class_options_alter
    - bootstrap_layouts_class_options_alter
  scoring:
    combine: all_pass
- id: bootstrap_layouts_bl_plugin_types
  version: '1.0'
  applicable_bundles:
  - bootstrap_layouts
  checks:
  - kind: must_contain_any
    values:
    - BootstrapLayoutsHandler
    - bootstrap_layouts_handler
    - page_manager
  scoring:
    combine: all_pass
- id: bootstrap_layouts_bl_region_wrapper_attributes
  version: '1.0'
  applicable_bundles:
  - bootstrap_layouts
  checks:
  - kind: must_contain_any
    values:
    - wrapper
    - bs-region
    - attributes
  scoring:
    combine: all_pass
