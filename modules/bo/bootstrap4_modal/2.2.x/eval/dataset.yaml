metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: bootstrap4_modal
  version: 2.2.x
  note: 'Bootstrap 4 Modal registers a Drupal AJAX dialog type ''bootstrap4_modal'' (response format drupal_bootstrap4_modal
    via Bootstrap4ModalRenderer). Declarative use via .use-ajax links with data-dialog-type=bootstrap4_modal
    and data-dialog-options; programmatic use via OpenBootstrap4ModalDialogCommand / OpenBootstrap4ModalDialogByUrlCommand
    / CloseBootstrap4ModalDialogCommand (JS: openBootstrap4Dialog / openBootstrap4DialogByUrl / closeBootstrap4Dialog).
    Modal target #drupal-bootstrap4-modal. It has no config form/permissions/Drush/schema of its own.
    Its one persistent config surface is the Entity Browser display plugin id ''bootstrap4_modal'' (adds
    a modal_size setting), stored on entity_browser.browser.<name> config entities -- medium/hard cases
    are grounded in namespaced b4m_* entity browsers using that display.'
questions:
- id: bootstrap4_modal-dialog-type
  input: Using the Bootstrap 4 Modal module, I want a normal link to open its target page in a Bootstrap
    4 modal via Drupal's AJAX system. What classes/attributes do I put on the <a> tag?
  criteria: Add class="use-ajax" and data-dialog-type="bootstrap4_modal" (optionally data-dialog-options='{...}')
    to the link. The module's main content renderer (format drupal_bootstrap4_modal) opens the response
    in a Bootstrap 4 modal. Its libraries are auto-attached.
  bundle: bootstrap4_modal
  rubric_ref: rubric/bootstrap4_modal_bootstrap4_modal_dialog_type@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: bootstrap4_modal-php-commands
  input: In a Drupal controller/AJAX callback, which command class from the Bootstrap 4 Modal module do
    I add to an AjaxResponse to open rendered content in a Bootstrap 4 modal, and which one closes it?
  criteria: 'Add new OpenBootstrap4ModalDialogCommand($title, $content, $dialog_options) to open (or OpenBootstrap4ModalDialogByUrlCommand
    for a URL), and new CloseBootstrap4ModalDialogCommand() to close (defaults to selector #drupal-bootstrap4-modal).
    They live in Drupal\bootstrap4_modal\Ajax and extend core''s dialog commands.'
  bundle: bootstrap4_modal
  rubric_ref: rubric/bootstrap4_modal_bootstrap4_modal_php_commands@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: bootstrap4_modal-options
  input: With the Bootstrap 4 Modal module, how do I make a modal appear centered and large, and how do
    I hide its header? Name the dialog options.
  criteria: 'Pass dialog options (data-dialog-options or the command''s $dialog_options): dialogClasses:"modal-dialog-centered
    modal-lg" for centered+large, and dialogShowHeader:false to hide the header. Other options include
    buttonClass, buttonPrimaryClass, backdrop, keyboard, focus, autoOpen.'
  bundle: bootstrap4_modal
  rubric_ref: rubric/bootstrap4_modal_bootstrap4_modal_options@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: bootstrap4_modal-inspect-display
  input: This site has an Entity Browser with machine name 'b4m_known'. Inspect its live configuration
    and state which display plugin it uses to present the browser.
  criteria: 'entity_browser.browser.b4m_known uses display: bootstrap4_modal (the Bootstrap 4 Modal display
    plugin), so the entity browser opens in a Bootstrap 4 modal.'
  bundle: bootstrap4_modal
  rubric_ref: rubric/bootstrap4_modal_bootstrap4_modal_inspect_display@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/bootstrap4_modal-display-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/bootstrap4_modal-display-cleanup.sh
- id: bootstrap4_modal-inspect-size
  input: The Entity Browser 'b4m_size' opens in a Bootstrap 4 modal. Inspect the live configuration and
    tell me the modal size that has been configured for it.
  criteria: Its display_configuration.modal_size is 'modal-sm' (a small Bootstrap modal), in entity_browser.browser.b4m_size
    (display bootstrap4_modal).
  bundle: bootstrap4_modal
  rubric_ref: rubric/bootstrap4_modal_bootstrap4_modal_inspect_size@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/bootstrap4_modal-size-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/bootstrap4_modal-size-cleanup.sh
- id: bootstrap4_modal-build-browser
  input: On this Drupal site (Entity Browser and Bootstrap 4 Modal are installed), create an Entity Browser
    with machine name 'b4m_build' that presents itself using the Bootstrap 4 Modal display. Apply the
    change to the live site.
  criteria: 'An entity_browser.browser.b4m_build config entity exists with display: bootstrap4_modal.
    E.g. EntityBrowser::create([''name''=>''b4m_build'',''display''=>''bootstrap4_modal'', ...])->save().'
  bundle: bootstrap4_modal
  rubric_ref: rubric/bootstrap4_modal_bootstrap4_modal_build_browser@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/bootstrap4_modal-build-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/bootstrap4_modal-build-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/bootstrap4_modal-build-verify.sh
- id: bootstrap4_modal-build-large
  input: On this Drupal site, create an Entity Browser with machine name 'b4m_large' that uses the Bootstrap
    4 Modal display and is configured to open as a LARGE Bootstrap modal (modal-lg). Apply the change
    to the live site.
  criteria: 'An entity_browser.browser.b4m_large config entity exists with display: bootstrap4_modal and
    display_configuration.modal_size: modal-lg.'
  bundle: bootstrap4_modal
  rubric_ref: rubric/bootstrap4_modal_bootstrap4_modal_build_large@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/bootstrap4_modal-large-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/bootstrap4_modal-large-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/bootstrap4_modal-large-verify.sh
