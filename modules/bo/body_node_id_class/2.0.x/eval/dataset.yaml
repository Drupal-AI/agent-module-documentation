- id: body_node_id_class-build-landing
  input: On this Drupal site a content type 'bnic_land' exists but has no published nodes. body_node_id_class
    is enabled. Create a published node of type bnic_land so that its page carries the body classes page-node-<nid>
    and page-node-type-bnic_land.
  criteria: Create and save a published Node of type bnic_land (e.g. Node::create(['type'=>'bnic_land','title'=>'...','status'=>1])->save()).
    body_node_id_class then adds page-node-<nid> and page-node-type-bnic_land to the <body> of that node's
    page.
  bundle: body_node_id_class
  rubric_ref: rubric/body_node_id_class_body_node_id_class_build_landing@1.0
