- id: body_node_id_class-ensure-enabled
  input: On this Drupal site the node pages are no longer getting a unique CSS class on the <body> tag
    identifying the node, and I need that back so my theme CSS can target individual nodes. There is a
    published article titled 'BNIC Home Node'. Make node pages carry a page-node-<nid> body class again.
  criteria: The body class is provided by the body_node_id_class module, which has been uninstalled. Re-enable
    it (drush en body_node_id_class -y). Once enabled, hook_preprocess_html adds page-node-<nid> (and
    page-node-type-<bundle>) to node pages such as the 'BNIC Home Node' article.
  bundle: body_node_id_class
  rubric_ref: rubric/body_node_id_class_body_node_id_class_ensure_enabled@1.0
