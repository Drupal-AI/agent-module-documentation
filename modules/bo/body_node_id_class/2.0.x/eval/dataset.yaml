metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: body_node_id_class
  version: 2.0.x
  note: 'body_node_id_class is a single-hook theming helper: hook_preprocess_html() adds page-node-<nid>
    and page-node-type-<bundle> CSS classes to the <body> tag on node pages (only page-node-<nid> when
    the route param is a bare id, not an upcast Node). It has no config, settings form, configure route,
    permissions, services, plugins, Drush, or config schema. Evals are grounded in that behavior. Introspection
    cases create a namespaced content type and ask which page-node-type-* class its pages will carry (the
    agent must find the content type on the live site). Execution cases verify the module''s real hook
    output by pushing a node onto the route and invoking hook_preprocess_html (a full HTTP render is avoided
    because unrelated modules can fatally error in the CLI on this shared site). Nodes are unpublished
    rather than deleted in resets because this shared site has an orphaned node field storage (field_ltgt_url)
    with a missing table that breaks node deletion.'
questions:
- id: body_node_id_class-what-classes
  input: On a Drupal site with the body_node_id_class module enabled, I want to give one specific node
    page bespoke CSS. What CSS class does the module add to the <body> tag that identifies an individual
    node, and what does the value look like?
  criteria: It adds page-node-<nid> to the <body> tag (e.g. page-node-42), so you can target that one
    node with .page-node-42 { ... } in your theme CSS. On a node whose route param is a full Node object
    it also adds page-node-type-<bundle>.
  bundle: body_node_id_class
  rubric_ref: rubric/body_node_id_class_body_node_id_class_what_classes@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: body_node_id_class-which-hook
  input: How does the Drupal contrib module body_node_id_class add its body classes, and on which pages
    do they appear? Name the hook it implements.
  criteria: It implements hook_preprocess_html() (body_node_id_class_preprocess_html) and appends classes
    to $variables['attributes']['class'] only when the current route has a 'node' parameter — i.e. on
    canonical node pages. It does nothing on non-node routes.
  bundle: body_node_id_class
  rubric_ref: rubric/body_node_id_class_body_node_id_class_which_hook@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: body_node_id_class-two-classes
  input: The body_node_id_class module forward-ports the Drupal 7 unique node body class. On a node page
    it can add two classes to the <body> tag. What are the two class patterns and what does each represent?
  criteria: page-node-<nid> (the node ID) and page-node-type-<bundle> (the content type machine name),
    e.g. page-node-42 and page-node-type-article. If the route 'node' parameter is only a bare id (not
    an upcast Node object) it adds just page-node-<nid>.
  bundle: body_node_id_class
  rubric_ref: rubric/body_node_id_class_body_node_id_class_two_classes@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: body_node_id_class-known-type
  input: A content type whose machine name starts with 'bnic_' has just been added to this Drupal site.
    With body_node_id_class enabled, give the exact page-node-type-* CSS class that nodes of that content
    type will carry on the <body> tag. Inspect the live site to find the content type's machine name.
  criteria: The added content type is bnic_metrics, so body_node_id_class will add the class page-node-type-bnic_metrics
    to the <body> tag of its node pages (alongside page-node-<nid>).
  bundle: body_node_id_class
  rubric_ref: rubric/body_node_id_class_body_node_id_class_known_type@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/body_node_id_class-known-type-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/body_node_id_class-known-type-cleanup.sh
- id: body_node_id_class-special-type
  input: This Drupal site has a newly added content type whose machine name begins with 'bnic_'. body_node_id_class
    is enabled. Inspect the site and state the content-type body class (page-node-type-*) its node pages
    will receive.
  criteria: The content type is bnic_faq, so its node pages get the <body> class page-node-type-bnic_faq.
  bundle: body_node_id_class
  rubric_ref: rubric/body_node_id_class_body_node_id_class_special_type@1.0
  tags:
