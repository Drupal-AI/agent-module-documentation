rubrics:
- id: bootstrap_layout_builder_blb_dependencies
  version: '1.0'
  applicable_bundles:
  - bootstrap_layout_builder
  checks:
  - kind: must_contain_any
    values:
    - bootstrap_styles
    - layout_builder
  scoring:
    combine: all_pass
- id: bootstrap_layout_builder_blb_layouts_added
  version: '1.0'
  applicable_bundles:
  - bootstrap_layout_builder
  checks:
  - kind: must_contain_any
    values:
    - blb_layout
    - BootstrapLayoutDeriver
    - number_of_columns
    - 1 to 12
    - 1 - 12
  scoring:
    combine: all_pass
- id: bootstrap_layout_builder_blb_add_column_layout
  version: '1.0'
