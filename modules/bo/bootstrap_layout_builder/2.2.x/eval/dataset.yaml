metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: bootstrap_layout_builder
  version: 2.2.x
  note: 'BLB adds Bootstrap grid rows/columns to core Layout Builder via one Layout plugin whose derivatives
    come from blb_layout config entities, plus blb_breakpoint and blb_layout_option config entities and
    a settings form. Cases are `recipe` (response-graded): they probe documented facts an agent would
    otherwise read source for; no site mutation.'
questions:
- id: blb-dependencies
  input: On a Drupal 11 site, what does Bootstrap Layout Builder require to work, and which module provides
    its section styling engine?
  criteria: It requires core Layout Builder (it adds section layouts to it) and depends on drupal/bootstrap_styles,
    which supplies the Style tab (background color/image/video, spacing) via StylesGroupManager.
  bundle: bootstrap_layout_builder
  rubric_ref: rubric/bootstrap_layout_builder_blb_dependencies@1.0
  tags:
  - mode:recipe
- id: blb-layouts-added
  input: What layouts does Bootstrap Layout Builder add to Layout Builder, and where do they come from?
  criteria: It registers one core Layout plugin `bootstrap_layout_builder` whose derivatives are generated
    by BootstrapLayoutDeriver from `blb_layout` config entities (one per column count, 1 to 12 columns),
    each a Bootstrap row with that many column regions in the 'Bootstrap' category.
  bundle: bootstrap_layout_builder
  rubric_ref: rubric/bootstrap_layout_builder_blb_layouts_added@1.0
  tags:
  - mode:recipe
- id: blb-add-column-layout
  input: I want to add a brand-new column layout (say a 6-column Bootstrap row) to Layout Builder via
    Bootstrap Layout Builder. What do I create?
  criteria: 'Create a `blb_layout` config entity (id, label, number_of_columns: 6). The deriver automatically
    turns it into a Layout Builder layout derivative after a cache clear; no custom plugin class is needed.'
  bundle: bootstrap_layout_builder
  rubric_ref: rubric/bootstrap_layout_builder_blb_add_column_layout@1.0
  tags:
  - mode:recipe
- id: blb-breakpoints-classes
  input: How does Bootstrap Layout Builder make a section responsive per breakpoint, and what config controls
    the Bootstrap class prefix for each breakpoint?
  criteria: Each `blb_breakpoint` config entity (default mobile/tablet/desktop) has a `base_class` (col,
    col-md, col-lg). The section's Layout tab picks a column structure per breakpoint, and column classes
    are built from the breakpoint's base_class + the chosen structure width (e.g. col-lg-6).
  bundle: bootstrap_layout_builder
  rubric_ref: rubric/bootstrap_layout_builder_blb_breakpoints_classes@1.0
  tags:
  - mode:recipe
- id: blb-layout-option-structure
  input: In Bootstrap Layout Builder, which config entity defines a specific column split like a 25%/75%
    two-column row, and what field holds the split?
  criteria: A `blb_layout_option` config entity holds it; its `structure` field is space-separated column
    widths summing to 12 (e.g. `3 9` for 25/75, `6 6` for two equal columns), tied to a layout via `layout_id`.
  bundle: bootstrap_layout_builder
  rubric_ref: rubric/bootstrap_layout_builder_blb_layout_option_structure@1.0
  tags:
  - mode:recipe
- id: blb-container-type
  input: When configuring a Bootstrap Layout Builder section, what container-type options are available
    and what CSS class values do they map to?
  criteria: 'The Layout tab offers three container types: Boxed (`container`), Full (`container-fluid`),
    and Edge to Edge (`w-100`), stored in the section''s `container` setting (default `container`).'
  bundle: bootstrap_layout_builder
  rubric_ref: rubric/bootstrap_layout_builder_blb_container_type@1.0
  tags:
  - mode:recipe
- id: blb-settings-config
  input: Which config object holds Bootstrap Layout Builder's global settings, and what keys toggle live
    preview and hide the advanced per-section settings?
  criteria: 'The `bootstrap_layout_builder.settings` config object: `live_preview` (default true) toggles
    AJAX live preview, `hide_section_settings` (default false) hides the advanced Settings tab, and `one_col_layout_class`
    (default col-12) sets the single-column class.'
  bundle: bootstrap_layout_builder
  rubric_ref: rubric/bootstrap_layout_builder_blb_settings_config@1.0
  tags:
  - mode:recipe
- id: blb-permission
  input: What single permission gates access to Bootstrap Layout Builder's configuration (settings, breakpoints,
    layouts, layout options)?
  criteria: 'The `configure bootstrap layout builder` permission (restrict access: true) gates the settings/styles/layout-options
    forms and the breakpoint/layout/layout_option config-entity collections.'
  bundle: bootstrap_layout_builder
  rubric_ref: rubric/bootstrap_layout_builder_blb_permission@1.0
  tags:
  - mode:recipe
