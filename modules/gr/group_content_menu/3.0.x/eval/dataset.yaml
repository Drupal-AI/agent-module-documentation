metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: group_content_menu
  version: 3.0.x
  note: 'Group Content Menu gives each Group its own menu(s), stored as content entities. The bundle is
    the config entity group_content_menu_type (config prefix group_content_menu.group_content_menu_type.*,
    keys id/label/uuid), managed at /admin/structure/group_content_menu_types (configure route entity.group_content_menu_type.collection).
    Because the site has no group types configured, medium/hard cases are grounded in the group_content_menu_type
    config entity, which is standalone and safe to create/read/delete via the entity API. Introspection
    reads a known menu type; execution creates a menu type or relabels one, verified against live config.
    All fixtures are namespaced gcm_* config entities and removed on cleanup. (Global permission: administer
    group content menu types; group permissions: access group content menu overview / manage group_content_menu
    / manage group_content_menu menu items.)'
questions:
- id: group_content_menu-what
  input: What problem does the Drupal group_content_menu module solve, and how does its data model differ
    from the older Group Menu module?
  criteria: It gives each Group its own menu(s). Unlike Group Menu (which stores menus as config), group_content_menu
    stores menus as CONTENT entities (group_content_menu, bundle group_content_menu_type), so menus scale
    with group count without config bloat or config-ignore juggling.
  bundle: group_content_menu
  rubric_ref: rubric/group_content_menu_group_content_menu_what@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: group_content_menu-configure
  input: With group_content_menu, where do I define the menu types, and what is the configure route /
    admin path?
  criteria: Define menu types at /admin/structure/group_content_menu_types (configure route entity.group_content_menu_type.collection).
    Each is a group_content_menu_type config entity; then enable the group_content_menu relation on a
    group type.
  bundle: group_content_menu
  rubric_ref: rubric/group_content_menu_group_content_menu_configure@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: group_content_menu-permissions
  input: Which permission lets a site admin manage group content menu TYPES in group_content_menu, and
    what group-level permissions control managing a group's menus and menu items?
  criteria: 'The global permission is ''administer group content menu types''. Group-level: ''access group
    content menu overview'', ''manage group_content_menu'' (manage menus), and ''manage group_content_menu
    menu items'' (manage links within menus).'
  bundle: group_content_menu
  rubric_ref: rubric/group_content_menu_group_content_menu_permissions@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: group_content_menu-known-type-label
  input: On this site a group content menu type has been defined with group_content_menu. Inspect the
    live configuration and give the human-readable label of the menu type whose machine id is 'gcm_probe'.
  criteria: The label of group_content_menu_type 'gcm_probe' is 'GCM Probe Menu Type'. Read config group_content_menu.group_content_menu_type.gcm_probe
    or load the entity.
  bundle: group_content_menu
  rubric_ref: rubric/group_content_menu_group_content_menu_known_type_label@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/group_content_menu-known-type-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/group_content_menu-known-type-cleanup.sh
- id: group_content_menu-known-type-id
  input: On this site, group_content_menu has a menu type whose label is 'GCM Secondary Nav'. Inspect
    the live group content menu type configuration and report that type's machine id.
  criteria: The machine id is gcm_secondary (config group_content_menu.group_content_menu_type.gcm_secondary,
    label 'GCM Secondary Nav').
  bundle: group_content_menu
  rubric_ref: rubric/group_content_menu_group_content_menu_known_type_id@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/group_content_menu-known-id-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/group_content_menu-known-id-cleanup.sh
- id: group_content_menu-create-type
  input: On this Drupal site (group_content_menu is enabled), create a group content menu type with machine
    id 'gcm_task' and label 'Task Menu'. Apply it to the live site.
  criteria: Create a group_content_menu_type config entity with id 'gcm_task' and label 'Task Menu' (GroupContentMenuType::create(['id'=>'gcm_task','label'=>'Task
    Menu'])->save(), or via /admin/structure/group_content_menu_types/add). Verify loads it and checks
    the label.
  bundle: group_content_menu
  rubric_ref: rubric/group_content_menu_group_content_menu_create_type@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/group_content_menu-create-type-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/group_content_menu-create-type-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/group_content_menu-create-type-verify.sh
- id: group_content_menu-relabel-type
  input: On this Drupal site there is a group content menu type with machine id 'gcm_relabel' currently
    labelled 'Old Label'. Change its label to 'New Label' and apply the change to the live site.
  criteria: Load group_content_menu_type 'gcm_relabel', set its label to 'New Label' and save (e.g. GroupContentMenuType::load('gcm_relabel')->set('label','New
    Label')->save()). Verify checks the live label equals 'New Label'.
  bundle: group_content_menu
  rubric_ref: rubric/group_content_menu_group_content_menu_relabel_type@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/group_content_menu-relabel-type-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/group_content_menu-relabel-type-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/group_content_menu-relabel-type-verify.sh
