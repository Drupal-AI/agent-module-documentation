rubrics:
- id: grequest_grequest_code_approve
  version: '1.0'
  applicable_bundles:
  - grequest
  checks:
  - kind: must_contain_any
    values:
    - grequest.membership_request_manager
    - MembershipRequestManager
    - ->create(
    - ->approve(
  scoring:
    combine: all_pass
- id: grequest_grequest_permissions
  version: '1.0'
  applicable_bundles:
  - grequest
  checks:
  - kind: must_contain_any
    values:
    - request group membership
    - administer membership requests
  scoring:
    combine: all_pass
- id: grequest_grequest_states
  version: '1.0'
  applicable_bundles:
  - grequest
  checks:
  - kind: must_contain_any
    values:
    - grequest_status
    - pending
    - approved
    - rejected
    - state_machine
  scoring:
    combine: all_pass
- id: grequest_grequest_which_type
  version: '1.0'
  applicable_bundles:
  - grequest
  checks:
  - kind: must_contain_any
    values:
    - grequest_mtype
  scoring:
    combine: all_pass
- id: grequest_grequest_who_pending
  version: '1.0'
  applicable_bundles:
  - grequest
  checks:
  - kind: must_contain_any
    values:
    - grequest_pending_user
  scoring:
    combine: all_pass
- id: grequest_grequest_install_relation
  version: '1.0'
  applicable_bundles:
  - grequest
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
- id: grequest_grequest_approve_request
  version: '1.0'
  applicable_bundles:
  - grequest
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
