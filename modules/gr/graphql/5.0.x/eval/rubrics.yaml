rubrics:
- id: graphql_graphql_config_entity_easy
  version: '1.0'
  applicable_bundles:
  - graphql
  checks:
  - kind: must_contain_any
    values:
    - graphql_server
  scoring:
    combine: all_pass
- id: graphql_graphql_plugin_types_easy
  version: '1.0'
  applicable_bundles:
  - graphql
  checks:
  - kind: must_contain_any
    values:
    - DataProducer
    - data producer
  scoring:
    combine: all_pass
- id: graphql_graphql_endpoint_route_easy
  version: '1.0'
  applicable_bundles:
  - graphql
  checks:
  - kind: must_contain_any
    values:
    - graphql.query
    - RouteProvider
  scoring:
    combine: all_pass
- id: graphql_graphql_known_server_schema_medium
  version: '1.0'
  applicable_bundles:
  - graphql
  checks:
  - kind: must_contain_any
    values:
    - /graphql/eval-probe
  scoring:
    combine: all_pass
- id: graphql_graphql_known_server_guardrails_medium
  version: '1.0'
  applicable_bundles:
  - graphql
  checks:
  - kind: must_contain_any
    values:
    - query depth
    - query_depth
    - depth of 7
    - depth is 7
  scoring:
    combine: all_pass
- id: graphql_graphql_create_server_hard
  version: '1.0'
  applicable_bundles:
  - graphql
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
