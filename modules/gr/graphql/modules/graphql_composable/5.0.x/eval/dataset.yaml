metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: graphql_composable
  version: 5.0.x
  part_of: graphql
  note: 'graphql_composable is the example/reference submodule of the GraphQL project (ships under examples/).
    It carries recipe-only evals: it defines no config entity or endpoint of its own, so there is nothing
    to introspect or build against live state that isn''t really the parent module''s. These cases probe
    the concrete facts of the worked example (the Schema plugin id, the SchemaExtension it plugs into,
    the query/mutation it adds) that an unfamiliar agent would otherwise have to read the submodule source
    to answer. Live introspection/execution tiers live in the PARENT module''s eval suite.'
questions:
- id: graphql_composable-schema-id-easy
  input: In the Drupal graphql_composable example submodule, which Schema plugin id should I set as the
    `schema` on a graphql_server config entity to run the bundled example schema, and which core class
    does that Schema plugin extend?
  criteria: 'Set schema: composable_example (the ComposableSchemaExample plugin), which extends the core
    Drupal\graphql\Plugin\GraphQL\Schema\ComposableSchema.'
  bundle: graphql_composable
  rubric_ref: rubric/graphql_composable_graphql_composable_schema_id_easy@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: graphql_composable-extension-easy
  input: The graphql_composable example uses the composable pattern. What is the id of the SchemaExtension
    plugin it ships, and which schema does that extension target (its `schema` property)?
  criteria: 'The SchemaExtension plugin id is composable_extension (ComposableSchemaExampleExtension),
    and it targets schema: composable_example. Enable it under the server''s schema_configuration.composable.extensions.'
  bundle: graphql_composable
  rubric_ref: rubric/graphql_composable_graphql_composable_extension_easy@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: graphql_composable-fields-easy
  input: What GraphQL query field and what mutation field does the graphql_composable example extension
    add to the schema (with their argument shapes)?
  criteria: 'It adds a Query field article(id: Int!): Article and a Mutation field createArticle(data:
    ArticleInput): ArticleResponse (backed by the create_article DataProducer).'
  bundle: graphql_composable
  rubric_ref: rubric/graphql_composable_graphql_composable_fields_easy@1.0
  tags:
  - mode:recipe
  - difficulty:easy
