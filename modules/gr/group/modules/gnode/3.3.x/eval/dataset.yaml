metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: gnode
  version: 3.3.x
  part_of: group
  note: gnode is a Group submodule providing the group_node GroupRelationType plugin (with a per-node-type
    deriver) to relate nodes to groups. Cases are `recipe` (response-graded); no site mutation.
questions:
- id: gnode-purpose
  input: On a Drupal 11 site with the Group module, which submodule and plugin do I use to add core nodes
    to a group?
  criteria: The gnode (Group Node) submodule provides the group_node GroupRelationType plugin, which relates
    nodes to groups.
  bundle: gnode
  rubric_ref: rubric/gnode_gnode_purpose@1.0
  tags:
  - mode:recipe
- id: gnode-deriver-per-type
  input: In Group v3 with gnode enabled, why do I see plugins like `group_node:article` and `group_node:page`
    rather than a single `group_node`? What creates them?
  criteria: GroupNodeDeriver derives one group_node:{node_type} plugin per node type, so you install/relate
    content per bundle.
  bundle: gnode
  rubric_ref: rubric/gnode_gnode_deriver_per_type@1.0
  tags:
  - mode:recipe
- id: gnode-relate-in-code
  input: In PHP on a Drupal 11 Group site, how do I relate an existing article node to a group using gnode?
  criteria: $group->addRelationship($node, 'group_node:article'); (the plugin id is derived per node type).
  bundle: gnode
  rubric_ref: rubric/gnode_gnode_relate_in_code@1.0
  tags:
  - mode:recipe
- id: gnode-permission
  input: Which per-group permission does gnode add for viewing the overview of all of a group's nodes
    regardless of node type?
  criteria: The `access group_node overview` per-group permission (granted via group_role), which also
    gates the group's Nodes operation link.
  bundle: gnode
  rubric_ref: rubric/gnode_gnode_permission@1.0
  tags:
  - mode:recipe
- id: gnode-cardinality-access
  input: With gnode's group_node plugin, how many groups can a single node belong to, and how is node
    access affected once a node is grouped?
  criteria: 'Entity cardinality is 1 (a node belongs to at most one group); the plugin sets entity_access:
    TRUE so node access is routed through the group''s per-group permissions.'
  bundle: gnode
  rubric_ref: rubric/gnode_gnode_cardinality_access@1.0
  tags:
  - mode:recipe
- id: gnode-install-location
  input: gnode has no settings form of its own. Where do I actually enable node content for a group type
    on a Drupal 11 Group site?
  criteria: Install the group_node:{type} plugin on the group type via the parent Group content page /admin/group/types/manage/{group_type}/content
    (route entity.group_type.content_plugins).
  bundle: gnode
  rubric_ref: rubric/gnode_gnode_install_location@1.0
  tags:
  - mode:recipe
