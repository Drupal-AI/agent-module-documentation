metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: group_support_revisions
  version: 3.3.x
  part_of: group
  note: group_support_revisions is a Group submodule that adds per-group revision permissions by decorating
    the default relation permission provider. Cases are `recipe` (response-graded); no site mutation.
questions:
- id: gsr-purpose
  input: On a Drupal 11 Group site, which submodule makes revision access over grouped entities depend
    on the group, and does it have a settings form?
  criteria: group_support_revisions; it has no config/UI/settings — enabling it is the whole setup. It
    adds per-group revision permissions.
  bundle: group_support_revisions
  rubric_ref: rubric/group_support_revisions_gsr_purpose@1.0
  tags:
  - mode:recipe
- id: gsr-mechanism
  input: How does group_support_revisions add its revision permissions to every grouped entity type without
    editing each relation plugin?
  criteria: It registers a decorator (SupportRevisionsPermissionProvider) that decorates the group.relation_handler.permission_provider
    service, so revision permissions are added across the whole permission-provider chain.
  bundle: group_support_revisions
  rubric_ref: rubric/group_support_revisions_gsr_mechanism@1.0
  tags:
  - mode:recipe
- id: gsr-which-entities
  input: For which grouped entity types does group_support_revisions actually expose revision permissions
    on a Drupal 11 site?
  criteria: Only relation plugins whose target entity type implements RevisionableInterface (and that
    already define entity permissions); non-revisionable types get none.
  bundle: group_support_revisions
  rubric_ref: rubric/group_support_revisions_gsr_which_entities@1.0
  tags:
  - mode:recipe
- id: gsr-permissions-added
  input: Which four per-group revision operations does group_support_revisions add for a revisionable
    grouped entity?
  criteria: view all revisions, view specific revisions, revert revision, and delete revision (named like
    `{view all|view|revert|delete} {plugin_id} entity revisions`).
  bundle: group_support_revisions
  rubric_ref: rubric/group_support_revisions_gsr_permissions_added@1.0
  tags:
  - mode:recipe
- id: gsr-with-gnode
  input: If I enable both gnode and group_support_revisions on a Drupal 11 Group site, what do I gain
    for group nodes?
  criteria: Per-group revision permissions (view all/view/revert/delete revisions) are automatically added
    for the revisionable group_node relations, letting group roles control node revision access.
  bundle: group_support_revisions
  rubric_ref: rubric/group_support_revisions_gsr_with_gnode@1.0
  tags:
  - mode:recipe
