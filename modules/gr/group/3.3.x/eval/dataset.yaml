metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: group
  version: 3.3.x
  note: 'Group exposes two content entities (group, group_relationship), three config entities (group_type,
    group_role, group_relationship_type), the GroupRelationType plugin type, and per-group permissions
    via flexible_permissions. Cases are `recipe` (response-graded): they probe documented facts an agent
    would otherwise read source to answer; no site mutation.'
questions:
- id: group-entity-vs-group-type
  input: 'On a Drupal 11 site using the Group module, which of these is a content entity you create at
    runtime and which is a config entity (bundle): `group` vs `group_type`? What about `group_role`?'
  criteria: '`group` is a content entity (an actual group instance); `group_type` is its config-entity
    bundle; `group_role` is also a config entity (a role scoped to a group type). `group_relationship`
    is a content entity, `group_relationship_type` is config.'
  bundle: group
  rubric_ref: rubric/group_group_entity_vs_group_type@1.0
  tags:
  - mode:recipe
- id: group-relation-plugin-type
  input: In Group v3 on Drupal 11, I want to make a custom entity type relatable to groups. Which plugin
    type do I implement, which attribute/namespace, and which base class?
  criteria: 'Implement a GroupRelationType plugin: class in the Plugin\Group\Relation namespace, annotated
    with the #[GroupRelationType] attribute, extending GroupRelationBase. The manager is group_relation_type.manager.'
  bundle: group
  rubric_ref: rubric/group_group_relation_plugin_type@1.0
  tags:
  - mode:recipe
- id: group-gcontent-rename
  input: I'm upgrading a module from Group v2 to v3. What did the GroupContent entity, GroupContentType,
    and the GroupContentEnabler plugin type get renamed to?
  criteria: GroupContent -> GroupRelationship (group_relationship), GroupContentType -> GroupRelationshipType
    (group_relationship_type), and the GroupContentEnabler plugin type -> GroupRelationType.
  bundle: group
  rubric_ref: rubric/group_group_gcontent_rename@1.0
  tags:
  - mode:recipe
- id: group-add-member-and-content
  input: In PHP on a Drupal 11 site, how do I add a user as a member of a group, and how do I relate an
    arbitrary entity to a group? Show the group entity methods.
  criteria: $group->addMember($user) adds a member; $group->addRelationship($entity, $plugin_id) relates
    any entity. Both create group_relationship records.
  bundle: group
  rubric_ref: rubric/group_group_add_member_and_content@1.0
  tags:
  - mode:recipe
- id: group-load-memberships
  input: 'On a Drupal 11 Group v3 site, how should I load all memberships of a user in code? Note: the
    old membership loader service is deprecated.'
  criteria: 'Use the static methods on Drupal\group\Entity\GroupMembership: loadByUser($account), loadByGroup($group),
    loadSingle($group, $account). The group.membership_loader service (GroupMembershipLoaderInterface)
    is deprecated since 3.2.0.'
  bundle: group
  rubric_ref: rubric/group_group_load_memberships@1.0
  tags:
  - mode:recipe
- id: group-permission-scopes
  input: How does Group grant per-group permissions on Drupal 11, and what are the three group role scopes?
    Which module actually calculates the permissions?
  criteria: Per-group permissions are granted by group_role config entities with scope outsider, insider
    or individual (outsider/insider synchronize with a global role). Calculation is delegated to the flexible_permissions
    module via group_permission.calculator/checker.
  bundle: group
  rubric_ref: rubric/group_group_permission_scopes@1.0
  tags:
  - mode:recipe
- id: group-has-permission
  input: On a Drupal 11 Group site, how do I check whether a user has a particular permission inside a
    specific group (not sitewide)? Give the entity method and the underlying service.
  criteria: $group->hasPermission($permission, $account); it delegates to the group_permission.checker
    service (GroupPermissionCheckerInterface::hasPermissionInGroup).
  bundle: group
  rubric_ref: rubric/group_group_has_permission@1.0
  tags:
  - mode:recipe
- id: group-submodules
  input: Which Group submodule lets me relate core nodes to groups, and which submodule makes revision
    access over grouped entities depend on the group?
  criteria: gnode (Group Node) relates nodes to groups via the group_node relation plugin; group_support_revisions
    makes per-group revision access possible by decorating the permission providers.
  bundle: group
  rubric_ref: rubric/group_group_submodules@1.0
  tags:
  - mode:recipe
