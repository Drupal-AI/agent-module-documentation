rubrics:
- id: groupmedia_vbo_groupmedia_vbo_actions
  version: '1.0'
  applicable_bundles:
  - groupmedia_vbo
  checks:
  - kind: must_contain_any
    values:
    - vbo_assign_media_to_group
    - vbo_remove_media_from_group
  scoring:
    combine: all_pass
- id: groupmedia_vbo_groupmedia_vbo_vs_core
  version: '1.0'
  applicable_bundles:
  - groupmedia_vbo
  checks:
  - kind: must_contain_any
    values:
    - run time
    - run-time
    - choose
    - pick the group
    - views_bulk_operations
    - many groups
  scoring:
    combine: all_pass
- id: groupmedia_vbo_groupmedia_vbo_wiring
  version: '1.0'
  applicable_bundles:
  - groupmedia_vbo
  checks:
  - kind: must_contain_any
    values:
    - Views bulk operations
    - VBO
    - media-based View
    - media view
    - bulk operations field
  scoring:
    combine: all_pass
- id: groupmedia_vbo_groupmedia_vbo_registered_assign
  version: '1.0'
  applicable_bundles:
  - groupmedia_vbo
  checks:
  - kind: must_contain_any
    values:
    - vbo_assign_media_to_group
  scoring:
    combine: all_pass
- id: groupmedia_vbo_groupmedia_vbo_registered_remove
  version: '1.0'
  applicable_bundles:
  - groupmedia_vbo
  checks:
  - kind: must_contain_any
    values:
    - vbo_remove_media_from_group
  scoring:
    combine: all_pass
- id: groupmedia_vbo_groupmedia_vbo_enable
  version: '1.0'
  applicable_bundles:
  - groupmedia_vbo
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
- id: groupmedia_vbo_groupmedia_vbo_enable_remove
  version: '1.0'
  applicable_bundles:
  - groupmedia_vbo
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
