metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: groupmedia_vbo
  version: 4.0.x
  note: 'Submodule of Group Media. Adds two VBO action plugins of type media - vbo_assign_media_to_group
    and vbo_remove_media_from_group (provider groupmedia_vbo) - that extend ViewsBulkOperationsActionBase
    and delegate to the parent groupmedia.attach_group service, letting an operator choose the target
    group at run time. No config, permissions, routes, or services of its own; its only observable state
    is the registered action plugins, present only while the submodule is enabled. Requires groupmedia
    + views_bulk_operations. Introspection cases read the action plugin registry on the live site; the
    execution case enables the submodule and verifies its VBO action is registered. Baseline: submodule
    left enabled.'
questions:
- id: groupmedia_vbo-actions
  input: The groupmedia_vbo submodule provides bulk operations for Group Media. Which Views Bulk Operations
    action plugins does it add, and what entity type do they operate on?
  criteria: 'It adds two VBO actions of type media: vbo_assign_media_to_group (VBO: Assign media to a
    Group) and vbo_remove_media_from_group (VBO: Remove media from a Group).'
  bundle: groupmedia_vbo
  rubric_ref: rubric/groupmedia_vbo_groupmedia_vbo_actions@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: groupmedia_vbo-vs-core
  input: Group Media already ships assign_media_to_group and remove_media_from_group core actions. Why
    would I use the groupmedia_vbo submodule instead, and what module does it require?
  criteria: The core actions store a single fixed group_id per action, so each targets one group. The
    VBO actions let the operator choose the target group at run time from the View, which scales to many
    groups. It requires views_bulk_operations (and groupmedia).
  bundle: groupmedia_vbo
  rubric_ref: rubric/groupmedia_vbo_groupmedia_vbo_vs_core@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: groupmedia_vbo-wiring
  input: How do I actually make the groupmedia_vbo 'Assign media to a Group' bulk action usable by editors
    on a media listing?
  criteria: 'Add a Views Bulk Operations field to a media-based View, enable the VBO: Assign media to
    a Group action in that field''s settings, then select media rows on the View, choose the action, and
    pick the target group at execution time.'
  bundle: groupmedia_vbo
  rubric_ref: rubric/groupmedia_vbo_groupmedia_vbo_wiring@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: groupmedia_vbo-registered-assign
  input: On this Drupal site, inspect the action plugin registry and give the plugin id of the Views Bulk
    Operations action provided by the groupmedia_vbo module for assigning media to a group.
  criteria: vbo_assign_media_to_group (provider groupmedia_vbo, type media) in the plugin.manager.action
    registry.
  bundle: groupmedia_vbo
  rubric_ref: rubric/groupmedia_vbo_groupmedia_vbo_registered_assign@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/groupmedia_vbo-registered-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/groupmedia_vbo-registered-cleanup.sh
- id: groupmedia_vbo-registered-remove
  input: On this Drupal site, inspect the available actions and name the groupmedia_vbo Views Bulk Operations
    action that REMOVES media from a group, and state which entity type it applies to.
  criteria: vbo_remove_media_from_group (provider groupmedia_vbo), an action of type media.
  bundle: groupmedia_vbo
  rubric_ref: rubric/groupmedia_vbo_groupmedia_vbo_registered_remove@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/groupmedia_vbo-registered-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/groupmedia_vbo-registered-cleanup.sh
- id: groupmedia_vbo-enable
  input: On this Drupal site we want editors to bulk-assign media to groups and choose the target group
    at run time from a media View. Enable the appropriate Group Media submodule that provides the Views
    Bulk Operations actions, and apply the change to the live site.
  criteria: Enable the groupmedia_vbo module (drush en groupmedia_vbo -y). This registers the vbo_assign_media_to_group
    and vbo_remove_media_from_group VBO action plugins in plugin.manager.action.
  bundle: groupmedia_vbo
  rubric_ref: rubric/groupmedia_vbo_groupmedia_vbo_enable@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/groupmedia_vbo-enable-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/groupmedia_vbo-enable-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/groupmedia_vbo-enable-verify.sh
- id: groupmedia_vbo-enable-remove
  input: On this Drupal site we need editors to be able to bulk-REMOVE media from a group (choosing the
    group when they run the operation) from a media listing. Turn on the Group Media submodule that provides
    the Views Bulk Operations action for removing media from a group, and apply the change to the live
    site.
  criteria: Enable the groupmedia_vbo module (drush en groupmedia_vbo -y). This registers the vbo_remove_media_from_group
    VBO action plugin (type media) in plugin.manager.action.
  bundle: groupmedia_vbo
  rubric_ref: rubric/groupmedia_vbo_groupmedia_vbo_enable_remove@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: layman
    reset: agent-module-documentation/evaluation/verify/groupmedia_vbo-enable-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/groupmedia_vbo-enable-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/groupmedia_vbo-enable-remove-verify.sh
