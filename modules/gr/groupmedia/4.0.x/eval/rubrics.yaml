rubrics:
- id: groupmedia_groupmedia_enable_as_group_content
  version: '1.0'
  applicable_bundles:
  - groupmedia
  checks:
  - kind: must_contain_any
    values:
    - Set available content
    - group_media
    - group_media:image
    - tracking_enabled
    - group_relationship_type
    - relation
  scoring:
    combine: all_pass
- id: groupmedia_groupmedia_media_finder_plugin
  version: '1.0'
  applicable_bundles:
  - groupmedia
  checks:
  - kind: must_contain_any
    values:
    - media_finder
    - MediaFinder
    - plugin.manager.groupmedia.finder
    - MediaFinderBase
  scoring:
    combine: all_pass
- id: groupmedia_groupmedia_attach_service
  version: '1.0'
  applicable_bundles:
  - groupmedia
  checks:
  - kind: must_contain_any
    values:
    - groupmedia.attach_group
    - AttachMediaToGroup
    - assignMediaToGroups
    - assign_media_to_group
    - remove_media_from_group
  scoring:
    combine: all_pass
- id: groupmedia_groupmedia_installed_bundle
  version: '1.0'
  applicable_bundles:
  - groupmedia
  checks:
  - kind: must_contain_any
    values:
    - image
    - group_media:image
  scoring:
    combine: all_pass
- id: groupmedia_groupmedia_which_tracks
  version: '1.0'
  applicable_bundles:
  - groupmedia
  checks:
  - kind: must_contain_any
    values:
    - remote_video
  scoring:
    combine: all_pass
- id: groupmedia_groupmedia_enable_image
  version: '1.0'
  applicable_bundles:
  - groupmedia
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
- id: groupmedia_groupmedia_enable_document
  version: '1.0'
  applicable_bundles:
  - groupmedia
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
