rubrics:
- id: graphql_compose_gc_enable_bundle_config
  version: '1.0'
  applicable_bundles:
  - graphql_compose
  checks:
  - kind: must_contain_any
    values:
    - entity_config
    - graphql_compose.settings
  scoring:
    combine: all_pass
- id: graphql_compose_gc_plugin_types
  version: '1.0'
  applicable_bundles:
  - graphql_compose
  checks:
  - kind: must_contain_any
    values:
    - EntityType
    - FieldType
    - SchemaType
  scoring:
    combine: all_pass
- id: graphql_compose_gc_global_settings
  version: '1.0'
  applicable_bundles:
  - graphql_compose
  checks:
  - kind: must_contain_any
    values:
    - exclude_unpublished
    - expose_entity_ids
    - simple_queries
    - simple_unions
  scoring:
    combine: all_pass
- id: graphql_compose_gc_known_enabled_bundle
  version: '1.0'
  applicable_bundles:
  - graphql_compose
  checks:
  - kind: must_contain_any
    values:
    - article
  scoring:
    combine: all_pass
- id: graphql_compose_gc_known_setting
  version: '1.0'
  applicable_bundles:
  - graphql_compose
  checks:
  - kind: must_contain_any
    values:
    - expose_entity_ids
    - 'true'
    - enabled
  scoring:
    combine: all_pass
- id: graphql_compose_gc_expose_article
  version: '1.0'
  applicable_bundles:
  - graphql_compose
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
- id: graphql_compose_gc_expose_ids
  version: '1.0'
  applicable_bundles:
  - graphql_compose
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
