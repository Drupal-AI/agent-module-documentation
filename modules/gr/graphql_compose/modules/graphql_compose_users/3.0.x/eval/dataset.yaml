metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: graphql_compose_users
  version: 3.0.x
  note: 'Submodule of graphql_compose. Adds the User entity type, an author field on nodes, a viewer query,
    and role/status types. User has a single bundle ''user''. Medium/hard cases are grounded in entity_config.user.user.enabled
    on graphql_compose.settings.graphql_compose_server (baseline: absent). Evals avoid live GraphQL queries
    and ''drush cr''.'
questions:
- id: gcusers-what
  input: What does graphql_compose_users add to a GraphQL Compose schema?
  criteria: It adds the Drupal User entity type to the schema, an 'author' field on nodes (node uid mapped
    to entity_owner), a 'viewer' query for the current user, and UserRoles/UserStatus types.
  bundle: graphql_compose_users
  rubric_ref: rubric/graphql_compose_users_gcusers_what@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: gcusers-author-field
  input: How does graphql_compose_users expose the author of a node, and via which mechanism?
  criteria: Via hook_graphql_compose_entity_base_fields_alter() it adds an 'author' field to nodes that
    maps the node's uid to an entity_owner field (name_sdl 'author'), resolving to a User.
  bundle: graphql_compose_users
  rubric_ref: rubric/graphql_compose_users_gcusers_author_field@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: gcusers-enable-key
  input: In graphql_compose_users, which config key enables the User type in the schema (the user entity
    has a single 'user' bundle)?
  criteria: entity_config.user.user.enabled = true in graphql_compose.settings.graphql_compose_server.
  bundle: graphql_compose_users
  rubric_ref: rubric/graphql_compose_users_gcusers_enable_key@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: gcusers-known
  input: Inspect the GraphQL Compose configuration on this site and state whether the User entity type
    is currently exposed in the schema.
  criteria: Yes - entity_config.user.user.enabled = true in graphql_compose.settings.graphql_compose_server.
  bundle: graphql_compose_users
  rubric_ref: rubric/graphql_compose_users_gcusers_known@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/graphql_compose_users-known-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/graphql_compose_users-known-cleanup.sh
- id: gcusers-enable
  input: Using graphql_compose_users, expose the Drupal User entity type in the GraphQL schema on the
    default GraphQL Compose server. Apply the change to the live configuration.
  criteria: graphql_compose.settings.graphql_compose_server has entity_config.user.user.enabled = true.
  bundle: graphql_compose_users
  rubric_ref: rubric/graphql_compose_users_gcusers_enable@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/graphql_compose_users-enable-reset.sh
    verify: agent-module-documentation/evaluation/verify/graphql_compose_users-enable-verify.sh
    unused_text_checks:
      must_contain_any: []
      must_not_contain: []
