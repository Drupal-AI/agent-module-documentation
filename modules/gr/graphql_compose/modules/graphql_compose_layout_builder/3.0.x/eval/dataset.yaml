  module: graphql_compose_layout_builder
  version: 3.0.x
  note: 'Experimental submodule of graphql_compose. Exposes core Layout Builder data (sections/components/field
    blocks) to the schema. Depends on graphql_compose_blocks and graphql_compose_layouts. It has no per-bundle
    config key of its own, so medium/hard cases are grounded in the real, restorable schema-provider registration
