questions:
- id: gclb-what
  input: What does graphql_compose_layout_builder expose to the GraphQL schema, and what is its stability
    status?
  criteria: It (experimentally) exposes core Layout Builder data - a field's sections, each section's
    layout, and its placed components/blocks - so a decoupled client can reconstruct the page layout.
    It is flagged experimental and may change.
  bundle: graphql_compose_layout_builder
  rubric_ref: rubric/graphql_compose_layout_builder_gclb_what@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: gclb-deps
  input: Which GraphQL Compose submodules does graphql_compose_layout_builder depend on, and why?
  criteria: It depends on graphql_compose_blocks (to resolve block components in sections) and graphql_compose_layouts
    (for layout definitions/regions), plus core layout_builder.
  bundle: graphql_compose_layout_builder
  rubric_ref: rubric/graphql_compose_layout_builder_gclb_deps@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: gclb-types
  input: Name some GraphQL types or data producers graphql_compose_layout_builder provides for resolving
    a layout.
  criteria: SchemaTypes LayoutBuilderSection, LayoutBuilderComponent, LayoutBuilderInterface, BlockField,
    BlockFieldUnion; producers such as LayoutBuilderSections, LayoutBuilderSectionComponents and LayoutBuilderComponentRegion/Weight/Configuration.
