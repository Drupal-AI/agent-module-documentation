rubrics:
- id: graphql_compose_layouts_gclayouts_what
  version: '1.0'
  applicable_bundles:
  - graphql_compose_layouts
  checks:
  - kind: must_contain_any
    values:
    - layout
    - hidden
    - layout_discovery
  scoring:
    combine: all_pass
- id: graphql_compose_layouts_gclayouts_role
  version: '1.0'
  applicable_bundles:
  - graphql_compose_layouts
  checks:
  - kind: must_contain_any
    values:
    - layout_builder
    - layout_paragraphs
    - graphql_compose_layout_builder
    - graphql_compose_layout_paragraphs
  scoring:
    combine: all_pass
- id: graphql_compose_layouts_gclayouts_producers
  version: '1.0'
  applicable_bundles:
  - graphql_compose_layouts
  checks:
  - kind: must_contain_any
    values:
    - LayoutDefinitionLoad
    - LayoutDefinitionProperty
    - Layout
    - LayoutSectionItem
  scoring:
    combine: all_pass
- id: graphql_compose_layouts_gclayouts_provider_known
  version: '1.0'
  applicable_bundles:
  - graphql_compose_layouts
  checks:
  - kind: must_contain_any
    values:
    - graphql_compose_layouts
  scoring:
    combine: all_pass
- id: graphql_compose_layouts_gclayouts_register_provider
  version: '1.0'
  applicable_bundles:
  - graphql_compose_layouts
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
