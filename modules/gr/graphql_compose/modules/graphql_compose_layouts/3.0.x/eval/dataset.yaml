metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: graphql_compose_layouts
  version: 3.0.x
  note: 'Hidden helper submodule of graphql_compose. Exposes Drupal layout (Layout Discovery) definitions
    (Layout type, LayoutSectionItem field, LayoutDefinitionLoad/Property producers) as the shared foundation
    for the Layout Builder and Layout Paragraphs submodules. It has no per-bundle config key, so medium/hard
    cases are grounded in the real, restorable schema-provider registration on the server (schema_configuration.graphql_compose.providers.graphql_compose_layouts;
    baseline: absent). Evals avoid live GraphQL queries and ''drush cr''.'
questions:
- id: gclayouts-what
  input: What does the graphql_compose_layouts submodule expose, and what kind of module is it (visible
    or hidden)?
  criteria: It is a hidden helper submodule that exposes Drupal layout (Layout Discovery) definitions
    - a layout plugin's id, label and regions - to the schema, via a Layout SchemaType and layout-definition
    data producers.
  bundle: graphql_compose_layouts
  rubric_ref: rubric/graphql_compose_layouts_gclayouts_what@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: gclayouts-role
  input: Which other GraphQL Compose submodules depend on graphql_compose_layouts and why?
  criteria: graphql_compose_layout_builder and graphql_compose_layout_paragraphs depend on it; it provides
    the shared Layout definition types/producers those submodules attach their concrete section/component
    data to.
  bundle: graphql_compose_layouts
  rubric_ref: rubric/graphql_compose_layouts_gclayouts_role@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: gclayouts-producers
  input: Name the data producers or schema type graphql_compose_layouts provides for layout definitions.
  criteria: SchemaType Layout, FieldType LayoutSectionItem, and DataProducers LayoutDefinitionLoad and
    LayoutDefinitionProperty (wired by LayoutSchemaExtension).
  bundle: graphql_compose_layouts
  rubric_ref: rubric/graphql_compose_layouts_gclayouts_producers@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: gclayouts-provider-known
  input: Inspect the GraphQL Compose server configuration (graphql.graphql_servers.graphql_compose_server)
    and state whether graphql_compose_layouts is currently registered in the schema providers list.
  criteria: Yes - schema_configuration.graphql_compose.providers contains graphql_compose_layouts.
  bundle: graphql_compose_layouts
  rubric_ref: rubric/graphql_compose_layouts_gclayouts_provider_known@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/graphql_compose_layouts-known-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/graphql_compose_layouts-known-cleanup.sh
- id: gclayouts-register-provider
  input: Register graphql_compose_layouts as a GraphQL Compose schema provider on the default server by
    adding it to schema_configuration.graphql_compose.providers on graphql.graphql_servers.graphql_compose_server.
    Apply the change to the live configuration.
  criteria: graphql.graphql_servers.graphql_compose_server schema_configuration.graphql_compose.providers
    includes graphql_compose_layouts.
  bundle: graphql_compose_layouts
  rubric_ref: rubric/graphql_compose_layouts_gclayouts_register_provider@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/graphql_compose_layouts-register-reset.sh
    verify: agent-module-documentation/evaluation/verify/graphql_compose_layouts-register-verify.sh
    unused_text_checks:
      must_contain_any: []
      must_not_contain: []
