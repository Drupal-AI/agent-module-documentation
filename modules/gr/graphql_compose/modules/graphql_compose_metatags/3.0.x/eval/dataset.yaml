metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: graphql_compose_metatags
  version: 3.0.x
  note: 'Submodule of graphql_compose. Exposes the metatag module''s computed meta tags on entities as
    a MetaTagUnion (+ MetaTagInterface). It auto-adds the metatag base field to enabled entity types via
    hooks rather than a distinctive config key, so medium/hard cases are grounded in the real, restorable
    schema-provider registration on the server (schema_configuration.graphql_compose.providers.graphql_compose_metatags;
    baseline: absent). Evals avoid live GraphQL queries and ''drush cr''.'
questions:
- id: gcmetatags-what
  input: What does graphql_compose_metatags expose, and as what GraphQL type are an entity's computed
    meta tags returned?
  criteria: It exposes the Metatag module's computed meta tags on entities as a MetaTagUnion (with a MetaTagInterface),
    resolving each tag to MetaTagValue/MetaTagLink/MetaTagProperty/MetaTagScript so a client can render
    the correct <head> tags.
  bundle: graphql_compose_metatags
  rubric_ref: rubric/graphql_compose_metatags_gcmetatags_what@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: gcmetatags-how-added
  input: How does graphql_compose_metatags make the metatag field appear on an entity type in the schema
    (rather than requiring you to enable it as a normal field)?
  criteria: It uses hook_graphql_compose_entity_base_fields_alter() to enable the entity's computed metatag
    base field on types that have one, and hook_graphql_compose_entity_interfaces_alter() to add MetaTagInterface;
    the metatag field is hidden from the field UI because it is a base field.
  bundle: graphql_compose_metatags
  rubric_ref: rubric/graphql_compose_metatags_gcmetatags_how_added@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: gcmetatags-union-hook
  input: Which hook in graphql_compose_metatags lets you resolve a custom metatag shape within the MetaTagUnion?
  criteria: hook_graphql_compose_metatags_union_alter($value, ?string &$type) - set $type to your custom
    GraphQL type for matching tags.
  bundle: graphql_compose_metatags
  rubric_ref: rubric/graphql_compose_metatags_gcmetatags_union_hook@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: gcmetatags-provider-known
  input: Inspect the GraphQL Compose server configuration (graphql.graphql_servers.graphql_compose_server)
    and state whether graphql_compose_metatags is currently registered in the schema providers list.
  criteria: Yes - schema_configuration.graphql_compose.providers contains graphql_compose_metatags.
  bundle: graphql_compose_metatags
  rubric_ref: rubric/graphql_compose_metatags_gcmetatags_provider_known@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/graphql_compose_metatags-known-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/graphql_compose_metatags-known-cleanup.sh
- id: gcmetatags-register-provider
  input: Register graphql_compose_metatags as a GraphQL Compose schema provider on the default server
    by adding it to schema_configuration.graphql_compose.providers on graphql.graphql_servers.graphql_compose_server.
    Apply the change to the live configuration.
  criteria: graphql.graphql_servers.graphql_compose_server schema_configuration.graphql_compose.providers
    includes graphql_compose_metatags.
  bundle: graphql_compose_metatags
  rubric_ref: rubric/graphql_compose_metatags_gcmetatags_register_provider@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/graphql_compose_metatags-register-reset.sh
    verify: agent-module-documentation/evaluation/verify/graphql_compose_metatags-register-verify.sh
    unused_text_checks:
      must_contain_any: []
      must_not_contain: []
