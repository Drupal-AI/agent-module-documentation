metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: graphql_compose_routes
  version: 3.0.x
  note: 'Submodule of graphql_compose. Adds a route(path:) query to load content by URL (entity/redirect/external).
    Distinctive per-bundle config key: entity_config.<type>.<bundle>.routes_enabled (only for types with
    a canonical link template). Medium/hard cases are grounded in entity_config.node.article.routes_enabled
    (baseline: absent). Evals avoid live GraphQL queries and ''drush cr''.'
questions:
- id: gcroutes-what
  input: What does graphql_compose_routes let a GraphQL client do, and what can a resolved route return?
  criteria: It adds a route(path:) query to load content by URL; a resolved route can be an internal entity
    (RouteInternal), an external link (RouteExternal), or a redirect (RouteRedirect) - returned via a
    RouteUnion, and it can also return breadcrumbs.
  bundle: graphql_compose_routes
  rubric_ref: rubric/graphql_compose_routes_gcroutes_what@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: gcroutes-enable-key
  input: In graphql_compose_routes, which config key makes a bundle (e.g. node article) loadable through
    the route() query, and what must the entity type have for the option to appear?
  criteria: entity_config.<type>.<bundle>.routes_enabled = true (e.g. entity_config.node.article.routes_enabled);
    the checkbox only appears for entity types that have a canonical link template.
  bundle: graphql_compose_routes
  rubric_ref: rubric/graphql_compose_routes_gcroutes_enable_key@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: gcroutes-hooks
  input: Which hook in graphql_compose_routes lets you rewrite an incoming URL path before it is resolved?
  criteria: hook_graphql_compose_routes_incoming_alter(&$path, FieldContext $context) - modify $path (e.g.
    fix prefixes) before resolution. (There is also hook_graphql_compose_routes_union_alter for the RouteUnion.)
  bundle: graphql_compose_routes
  rubric_ref: rubric/graphql_compose_routes_gcroutes_hooks@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: gcroutes-known
  input: On this site, one node bundle can be loaded by URL via GraphQL Compose routes. Inspect the config
    and name that node bundle.
  criteria: 'node.article: entity_config.node.article.routes_enabled = true.'
  bundle: graphql_compose_routes
  rubric_ref: rubric/graphql_compose_routes_gcroutes_known@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/graphql_compose_routes-known-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/graphql_compose_routes-known-cleanup.sh
- id: gcroutes-enable-article
  input: Using graphql_compose_routes, make the Article node type loadable by URL through the route()
    query on the default GraphQL Compose server. Apply the change to the live configuration.
  criteria: graphql_compose.settings.graphql_compose_server has entity_config.node.article.routes_enabled
    = true.
  bundle: graphql_compose_routes
  rubric_ref: rubric/graphql_compose_routes_gcroutes_enable_article@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/graphql_compose_routes-enable-reset.sh
    verify: agent-module-documentation/evaluation/verify/graphql_compose_routes-enable-verify.sh
    unused_text_checks:
      must_contain_any: []
      must_not_contain: []
