metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: graphql_compose_edges
  version: 3.0.x
  note: 'Submodule of graphql_compose. Adds Relay-style connection (edge) queries with cursor pagination.
    Distinctive per-bundle config key: entity_config.<type>.<bundle>.edges_enabled; global settings.edge_max_limit.
    Medium/hard cases are grounded in entity_config.node.article.edges_enabled on graphql_compose.settings.graphql_compose_server
    (baseline: absent). Evals avoid live GraphQL queries and ''drush cr''.'
questions:
- id: gcedges-what
  input: What does graphql_compose_edges add to a GraphQL Compose schema, and what pagination style does
    it use?
  criteria: It adds Relay-style Connection queries (edges/nodes with cursors and pageInfo) so clients
    can load many entities of a bundle at once with cursor-based pagination.
  bundle: graphql_compose_edges
  rubric_ref: rubric/graphql_compose_edges_gcedges_what@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: gcedges-enable-key
  input: In graphql_compose_edges, which config key turns on the connection (edge) query for a specific
    bundle such as node article?
  criteria: entity_config.<type>.<bundle>.edges_enabled = true, e.g. entity_config.node.article.edges_enabled,
    in graphql_compose.settings.graphql_compose_server.
  bundle: graphql_compose_edges
  rubric_ref: rubric/graphql_compose_edges_gcedges_enable_key@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: gcedges-max-limit
  input: How do you cap the maximum number of items a single graphql_compose_edges connection query can
    return?
  criteria: Set settings.edge_max_limit (an integer) in graphql_compose.settings.graphql_compose_server;
    it defaults to EntityConnection::MAX_LIMIT.
  bundle: graphql_compose_edges
  rubric_ref: rubric/graphql_compose_edges_gcedges_max_limit@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: gcedges-known-bundle
  input: On this site, one node bundle has the GraphQL Compose edge/connection query enabled. Inspect
    the config and name that node bundle.
  criteria: 'node.article: entity_config.node.article.edges_enabled = true.'
  bundle: graphql_compose_edges
  rubric_ref: rubric/graphql_compose_edges_gcedges_known_bundle@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/graphql_compose_edges-known-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/graphql_compose_edges-known-cleanup.sh
- id: gcedges-enable-article
  input: Using graphql_compose_edges, enable the cursor-paginated connection (edge) query for the Article
    node type on the default GraphQL Compose server. Apply the change to the live configuration.
  criteria: graphql_compose.settings.graphql_compose_server has entity_config.node.article.edges_enabled
    = true.
  bundle: graphql_compose_edges
  rubric_ref: rubric/graphql_compose_edges_gcedges_enable_article@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/graphql_compose_edges-enable-reset.sh
    verify: agent-module-documentation/evaluation/verify/graphql_compose_edges-enable-verify.sh
    unused_text_checks:
      must_contain_any: []
      must_not_contain: []
