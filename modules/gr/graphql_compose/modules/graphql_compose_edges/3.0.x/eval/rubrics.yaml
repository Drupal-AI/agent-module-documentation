rubrics:
- id: graphql_compose_edges_gcedges_what
  version: '1.0'
  applicable_bundles:
  - graphql_compose_edges
  checks:
  - kind: must_contain_any
    values:
    - connection
    - cursor
    - edges
    - Relay
  scoring:
    combine: all_pass
- id: graphql_compose_edges_gcedges_enable_key
  version: '1.0'
  applicable_bundles:
  - graphql_compose_edges
  checks:
  - kind: must_contain_any
    values:
    - edges_enabled
  scoring:
    combine: all_pass
- id: graphql_compose_edges_gcedges_max_limit
  version: '1.0'
  applicable_bundles:
  - graphql_compose_edges
  checks:
  - kind: must_contain_any
    values:
    - edge_max_limit
  scoring:
    combine: all_pass
- id: graphql_compose_edges_gcedges_known_bundle
  version: '1.0'
  applicable_bundles:
  - graphql_compose_edges
  checks:
  - kind: must_contain_any
    values:
    - article
  scoring:
    combine: all_pass
- id: graphql_compose_edges_gcedges_enable_article
  version: '1.0'
  applicable_bundles:
  - graphql_compose_edges
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
