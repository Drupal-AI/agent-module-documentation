metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: graphql_compose_blocks
  version: 3.0.x
  note: 'Submodule of graphql_compose. Exposes blocks (Block Content entities + rendered block plugins)
    to the GraphQL Compose schema. You enable a block content bundle via entity_config.block_content.<bundle>.enabled
    in graphql_compose.settings.graphql_compose_server. Medium/hard cases are grounded in that real config
    on the block_content.basic bundle (baseline: absent). Evals avoid live GraphQL queries and ''drush
    cr'' per campaign guidance.'
questions:
- id: gcblocks-what
  input: What does the graphql_compose_blocks submodule add to a Drupal GraphQL Compose schema, and what
    module does it require besides graphql_compose?
  criteria: 'It adds Drupal blocks to the schema: a BlockContent EntityType plugin (so custom block content
    bundles can be exposed), a BlockField field type, and BlockInterface/BlockContent/BlockPlugin/BlockUnion
    schema types with resolvers. It requires the core block_content module.'
  bundle: graphql_compose_blocks
  rubric_ref: rubric/graphql_compose_blocks_gcblocks_what@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: gcblocks-enable-key
  input: Using graphql_compose_blocks, which config key exposes a custom block content bundle (say 'basic')
    in the GraphQL schema?
  criteria: Set entity_config.block_content.basic.enabled = true in graphql_compose.settings.graphql_compose_server
    (same mechanism as any entity type).
  bundle: graphql_compose_blocks
  rubric_ref: rubric/graphql_compose_blocks_gcblocks_enable_key@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: gcblocks-union-hook
  input: In graphql_compose_blocks, how would you make a custom block plugin class resolve to the right
    type inside the BlockUnion GraphQL type?
  criteria: Implement hook_graphql_compose_blocks_union_alter($value, ?string &$type) and set $type to
    the desired GraphQL type name when $value matches your block class.
  bundle: graphql_compose_blocks
  rubric_ref: rubric/graphql_compose_blocks_gcblocks_union_hook@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: gcblocks-known-bundle
  input: On this site a custom block content bundle has been exposed in GraphQL Compose. Inspect the graphql_compose.settings.graphql_compose_server
    config and name the block_content bundle that is enabled.
  criteria: 'block_content.basic is enabled: entity_config.block_content.basic.enabled = true.'
  bundle: graphql_compose_blocks
  rubric_ref: rubric/graphql_compose_blocks_gcblocks_known_bundle@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/graphql_compose_blocks-known-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/graphql_compose_blocks-known-cleanup.sh
- id: gcblocks-enable-basic
  input: Using graphql_compose_blocks, expose the 'basic' block content bundle in the GraphQL schema on
    the default GraphQL Compose server. Apply the change to the live configuration.
  criteria: graphql_compose.settings.graphql_compose_server has entity_config.block_content.basic.enabled
    = true.
  bundle: graphql_compose_blocks
  rubric_ref: rubric/graphql_compose_blocks_gcblocks_enable_basic@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/graphql_compose_blocks-enable-reset.sh
    verify: agent-module-documentation/evaluation/verify/graphql_compose_blocks-enable-verify.sh
    unused_text_checks:
      must_contain_any: []
      must_not_contain: []
