rubrics:
- id: graphql_compose_blocks_gcblocks_what
  version: '1.0'
  applicable_bundles:
  - graphql_compose_blocks
  checks:
  - kind: must_contain_any
    values:
    - block_content
    - block content
    - BlockUnion
    - block
  scoring:
    combine: all_pass
- id: graphql_compose_blocks_gcblocks_enable_key
  version: '1.0'
  applicable_bundles:
  - graphql_compose_blocks
  checks:
  - kind: must_contain_any
    values:
    - entity_config.block_content
    - block_content.basic
    - entity_config
  scoring:
    combine: all_pass
- id: graphql_compose_blocks_gcblocks_union_hook
  version: '1.0'
  applicable_bundles:
  - graphql_compose_blocks
  checks:
  - kind: must_contain_any
    values:
    - hook_graphql_compose_blocks_union_alter
    - union_alter
    - BlockUnion
  scoring:
    combine: all_pass
- id: graphql_compose_blocks_gcblocks_known_bundle
  version: '1.0'
  applicable_bundles:
  - graphql_compose_blocks
  checks:
  - kind: must_contain_any
    values:
    - basic
  scoring:
    combine: all_pass
- id: graphql_compose_blocks_gcblocks_enable_basic
  version: '1.0'
  applicable_bundles:
  - graphql_compose_blocks
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
