metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: graphql_compose_layout_paragraphs
  version: 3.0.x
  note: 'Submodule of graphql_compose. Exposes Layout Paragraphs layout/position data (how paragraphs
    are arranged into layouts and regions) to the schema. Depends on graphql_compose_layouts. It has no
    per-bundle config key of its own, so medium/hard cases are grounded in the real, restorable schema-provider
    registration on the server (schema_configuration.graphql_compose.providers.graphql_compose_layout_paragraphs;
    baseline: absent). Evals avoid live GraphQL queries and ''drush cr''.'
questions:
- id: gclp-what
  input: What does graphql_compose_layout_paragraphs add to the GraphQL Compose schema?
  criteria: It exposes Layout Paragraphs layout information - which layout each layout-paragraph uses
    and where child paragraphs sit within its regions - so a decoupled front end can render nested paragraph
    layouts.
  bundle: graphql_compose_layout_paragraphs
  rubric_ref: rubric/graphql_compose_layout_paragraphs_gclp_what@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: gclp-dep
  input: Which GraphQL Compose helper submodule does graphql_compose_layout_paragraphs depend on, and
    why?
  criteria: It depends on graphql_compose_layouts for the shared layout definitions/regions (plus core/contrib
    layout_paragraphs).
  bundle: graphql_compose_layout_paragraphs
  rubric_ref: rubric/graphql_compose_layout_paragraphs_gclp_dep@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: gclp-types
  input: Name the GraphQL types or data producer graphql_compose_layout_paragraphs provides.
  criteria: SchemaTypes LayoutParagraphs, LayoutParagraphsInterface and LayoutParagraphsPosition, plus
    the LayoutParagraphs DataProducer (wired by LayoutParagraphsSchemaExtension).
  bundle: graphql_compose_layout_paragraphs
  rubric_ref: rubric/graphql_compose_layout_paragraphs_gclp_types@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: gclp-provider-known
  input: Inspect the GraphQL Compose server configuration (graphql.graphql_servers.graphql_compose_server)
    and state whether graphql_compose_layout_paragraphs is currently registered in the schema providers
    list.
  criteria: Yes - schema_configuration.graphql_compose.providers contains graphql_compose_layout_paragraphs.
  bundle: graphql_compose_layout_paragraphs
  rubric_ref: rubric/graphql_compose_layout_paragraphs_gclp_provider_known@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/graphql_compose_layout_paragraphs-known-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/graphql_compose_layout_paragraphs-known-cleanup.sh
- id: gclp-register-provider
  input: Register graphql_compose_layout_paragraphs as a GraphQL Compose schema provider on the default
    server by adding it to schema_configuration.graphql_compose.providers on graphql.graphql_servers.graphql_compose_server.
    Apply the change to the live configuration.
  criteria: graphql.graphql_servers.graphql_compose_server schema_configuration.graphql_compose.providers
    includes graphql_compose_layout_paragraphs.
  bundle: graphql_compose_layout_paragraphs
  rubric_ref: rubric/graphql_compose_layout_paragraphs_gclp_register_provider@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/graphql_compose_layout_paragraphs-register-reset.sh
    verify: agent-module-documentation/evaluation/verify/graphql_compose_layout_paragraphs-register-verify.sh
    unused_text_checks:
      must_contain_any: []
      must_not_contain: []
