metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: graphql_compose_comments
  version: 3.0.x
  note: 'Submodule of graphql_compose. Exposes comments to the schema (read as connections, optional CreateComment
    mutation). Depends on graphql_compose_edges. The distinctive config key is entity_config.comment.<bundle>.comments_mutation_enabled
    on graphql_compose.settings.graphql_compose_server. Medium/hard cases are grounded in that key on
    the comment.comment bundle (baseline: absent). Evals avoid live GraphQL queries and ''drush cr''.'
questions:
- id: gccomments-what
  input: What does graphql_compose_comments add, and which other GraphQL Compose submodule does it depend
    on and why?
  criteria: It exposes Drupal comments to the schema (comment threads as cursor-paginated connections,
    plus an optional CreateComment mutation). It depends on graphql_compose_edges because comment threads
    are returned as Relay-style connections.
  bundle: graphql_compose_comments
  rubric_ref: rubric/graphql_compose_comments_gccomments_what@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: gccomments-mutation-key
  input: In graphql_compose_comments, which config key enables the GraphQL mutation that lets users post
    a comment for a comment bundle?
  criteria: entity_config.comment.<bundle>.comments_mutation_enabled = true (e.g. entity_config.comment.comment.comments_mutation_enabled)
    in graphql_compose.settings.graphql_compose_server; it enables the CreateComment mutation (still subject
    to Drupal comment permissions).
  bundle: graphql_compose_comments
  rubric_ref: rubric/graphql_compose_comments_gccomments_mutation_key@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: gccomments-schema-types
  input: Name a couple of the GraphQL types or data producers graphql_compose_comments provides for resolving
    comments.
  criteria: SchemaTypes CommentAuthorType and CommentAvailable; DataProducers such as CommentEdge and
    CreateComment (plus CommentsTypeBundleSplit / CommentsArrayKey / CommentsArrayWrap).
  bundle: graphql_compose_comments
  rubric_ref: rubric/graphql_compose_comments_gccomments_schema_types@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: gccomments-known-mutation
  input: On this site the comment posting mutation has been enabled for a comment bundle in GraphQL Compose.
    Inspect the config and state which comment bundle has comment mutation enabled.
  criteria: 'The ''comment'' comment bundle: entity_config.comment.comment.comments_mutation_enabled =
    true.'
  bundle: graphql_compose_comments
  rubric_ref: rubric/graphql_compose_comments_gccomments_known_mutation@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/graphql_compose_comments-known-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/graphql_compose_comments-known-cleanup.sh
- id: gccomments-enable-mutation
  input: Using graphql_compose_comments, enable the comment posting mutation for the 'comment' comment
    bundle on the default GraphQL Compose server. Apply the change to the live configuration.
  criteria: graphql_compose.settings.graphql_compose_server has entity_config.comment.comment.comments_mutation_enabled
    = true.
  bundle: graphql_compose_comments
  rubric_ref: rubric/graphql_compose_comments_gccomments_enable_mutation@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/graphql_compose_comments-enable-reset.sh
    verify: agent-module-documentation/evaluation/verify/graphql_compose_comments-enable-verify.sh
    unused_text_checks:
      must_contain_any: []
      must_not_contain: []
