rubrics:
- id: graphql_compose_comments_gccomments_what
  version: '1.0'
  applicable_bundles:
  - graphql_compose_comments
  checks:
  - kind: must_contain_any
    values:
    - graphql_compose_edges
    - edges
    - connection
  scoring:
    combine: all_pass
- id: graphql_compose_comments_gccomments_mutation_key
  version: '1.0'
  applicable_bundles:
  - graphql_compose_comments
  checks:
  - kind: must_contain_any
    values:
    - comments_mutation_enabled
  scoring:
    combine: all_pass
- id: graphql_compose_comments_gccomments_schema_types
  version: '1.0'
  applicable_bundles:
  - graphql_compose_comments
  checks:
  - kind: must_contain_any
    values:
    - CreateComment
    - CommentAuthorType
    - CommentAvailable
    - CommentEdge
  scoring:
    combine: all_pass
- id: graphql_compose_comments_gccomments_known_mutation
  version: '1.0'
  applicable_bundles:
  - graphql_compose_comments
  checks:
  - kind: must_contain_any
    values:
    - comment
  scoring:
    combine: all_pass
- id: graphql_compose_comments_gccomments_enable_mutation
  version: '1.0'
  applicable_bundles:
  - graphql_compose_comments
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
