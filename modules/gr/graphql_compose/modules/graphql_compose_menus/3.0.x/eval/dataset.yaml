metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: graphql_compose_menus
  version: 3.0.x
  note: 'Submodule of graphql_compose. Exposes Drupal menus (query a menu by name -> nested link tree).
    Depends on graphql_compose_routes. Distinctive per-menu config key: entity_config.menu.<menu>.menu_route_enabled.
    Medium/hard cases are grounded in entity_config.menu.main.menu_route_enabled (baseline: absent). Evals
    avoid live GraphQL queries and ''drush cr''.'
questions:
- id: gcmenus-what
  input: What does graphql_compose_menus add to a GraphQL Compose schema, and which GraphQL Compose submodule
    does it depend on?
  criteria: It adds Drupal menus to the schema (query a menu by name and get its nested MenuItem tree
    with titles, urls, attributes and children). It depends on graphql_compose_routes because menu-link
    URLs resolve through routes.
  bundle: graphql_compose_menus
  rubric_ref: rubric/graphql_compose_menus_gcmenus_what@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: gcmenus-route-key
  input: In graphql_compose_menus, which per-menu config key makes each menu item also resolve its target
    content entity (with a load-cost warning for large menus)?
  criteria: entity_config.menu.<menu>.menu_route_enabled = true in graphql_compose.settings.graphql_compose_server;
    it resolves each item's route.entity but loads all entities in the menu, so use only on small menus.
  bundle: graphql_compose_menus
  rubric_ref: rubric/graphql_compose_menus_gcmenus_route_key@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: gcmenus-types
  input: Name some of the GraphQL types graphql_compose_menus provides for menus.
  criteria: SchemaTypes MenuItem, MenuItemAttributes and MenuAvailable (plus the Menu and MenuLinkContent
    entity types).
  bundle: graphql_compose_menus
  rubric_ref: rubric/graphql_compose_menus_gcmenus_types@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: gcmenus-known
  input: On this site, one menu has route resolution enabled in GraphQL Compose. Inspect the config and
    name the menu that has menu_route_enabled turned on.
  criteria: 'The ''main'' menu: entity_config.menu.main.menu_route_enabled = true.'
  bundle: graphql_compose_menus
  rubric_ref: rubric/graphql_compose_menus_gcmenus_known@1.0
  tags:
  - mode:introspection
  - difficulty:medium
