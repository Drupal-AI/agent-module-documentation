rubrics:
- id: graphql_compose_menus_gcmenus_what
  version: '1.0'
  applicable_bundles:
  - graphql_compose_menus
  checks:
  - kind: must_contain_any
    values:
    - menu
    - graphql_compose_routes
    - MenuItem
  scoring:
    combine: all_pass
- id: graphql_compose_menus_gcmenus_route_key
  version: '1.0'
  applicable_bundles:
  - graphql_compose_menus
  checks:
  - kind: must_contain_any
    values:
    - menu_route_enabled
  scoring:
    combine: all_pass
- id: graphql_compose_menus_gcmenus_types
  version: '1.0'
  applicable_bundles:
  - graphql_compose_menus
  checks:
  - kind: must_contain_any
    values:
    - MenuItem
    - MenuItemAttributes
    - MenuAvailable
  scoring:
    combine: all_pass
- id: graphql_compose_menus_gcmenus_known
  version: '1.0'
  applicable_bundles:
  - graphql_compose_menus
  checks:
  - kind: must_contain_any
    values:
    - main
  scoring:
    combine: all_pass
- id: graphql_compose_menus_gcmenus_enable_route
  version: '1.0'
  applicable_bundles:
  - graphql_compose_menus
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
