metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: graphql_compose_eck
  version: 3.0.x
  note: 'Submodule of graphql_compose. Exposes ECK entities via a single ''eck'' EntityType plugin whose
    EckEntityTypeDeriver derives one GraphQL type per ECK entity type. It has no distinctive per-bundle
    config key of its own and this site defines no ECK entity types, so medium/hard cases are grounded
    in the real, restorable schema-provider registration on the server (graphql.graphql_servers.graphql_compose_server
    -> schema_configuration.graphql_compose.providers.graphql_compose_eck; baseline: absent). Evals avoid
    live GraphQL queries and ''drush cr''.'
questions:
- id: gceck-what
  input: What does the graphql_compose_eck submodule do, and which module does it require?
  criteria: It makes ECK (Entity Construction Kit) entities available in the GraphQL Compose schema -
    one GraphQL type per ECK entity type. It requires the eck module.
  bundle: graphql_compose_eck
  rubric_ref: rubric/graphql_compose_eck_gceck_what@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: gceck-deriver
  input: How does graphql_compose_eck create a GraphQL type for each ECK entity type rather than hard-coding
    them?
  criteria: It registers a single EntityType plugin (id 'eck') with a deriver (EckEntityTypeDeriver) that
    enumerates the site's ECK entity types and derives a GraphQL Compose entity type for each.
  bundle: graphql_compose_eck
  rubric_ref: rubric/graphql_compose_eck_gceck_deriver@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: gceck-enable-bundle
  input: Once graphql_compose_eck is enabled, how do you actually expose a specific ECK bundle in the
    GraphQL schema?
  criteria: 'Enable it like any entity type: entity_config.<eck_entity_type>.<bundle>.enabled = true in
    graphql_compose.settings.graphql_compose_server (optionally query_load_enabled for a single query).'
  bundle: graphql_compose_eck
  rubric_ref: rubric/graphql_compose_eck_gceck_enable_bundle@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: gceck-provider-known
  input: Inspect the GraphQL Compose server configuration (graphql.graphql_servers.graphql_compose_server)
    and state whether graphql_compose_eck is currently registered in the schema providers list.
  criteria: Yes - schema_configuration.graphql_compose.providers contains graphql_compose_eck.
  bundle: graphql_compose_eck
  rubric_ref: rubric/graphql_compose_eck_gceck_provider_known@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/graphql_compose_eck-known-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/graphql_compose_eck-known-cleanup.sh
- id: gceck-register-provider
  input: Register graphql_compose_eck as a GraphQL Compose schema provider on the default server by adding
