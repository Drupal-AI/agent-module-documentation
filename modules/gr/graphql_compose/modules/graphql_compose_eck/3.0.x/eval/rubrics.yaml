rubrics:
- id: graphql_compose_eck_gceck_what
  version: '1.0'
  applicable_bundles:
  - graphql_compose_eck
  checks:
  - kind: must_contain_any
    values:
    - eck
    - Entity Construction Kit
  scoring:
    combine: all_pass
- id: graphql_compose_eck_gceck_deriver
  version: '1.0'
  applicable_bundles:
  - graphql_compose_eck
  checks:
  - kind: must_contain_any
    values:
    - deriver
    - EckEntityTypeDeriver
    - derive
  scoring:
    combine: all_pass
- id: graphql_compose_eck_gceck_enable_bundle
  version: '1.0'
  applicable_bundles:
  - graphql_compose_eck
  checks:
  - kind: must_contain_any
    values:
    - entity_config
    - enabled
  scoring:
    combine: all_pass
- id: graphql_compose_eck_gceck_provider_known
  version: '1.0'
  applicable_bundles:
  - graphql_compose_eck
  checks:
  - kind: must_contain_any
    values:
    - graphql_compose_eck
  scoring:
    combine: all_pass
- id: graphql_compose_eck_gceck_register_provider
  version: '1.0'
  applicable_bundles:
  - graphql_compose_eck
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
