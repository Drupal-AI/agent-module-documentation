rubrics:
- id: eu_cookie_compliance_gtm_eucc_gtm_where_stored
  version: '1.0'
  applicable_bundles:
  - eu_cookie_compliance_gtm
  checks:
  - kind: must_contain_any
    values:
    - gtm_data
    - third party setting
    - third_party_setting
    - cookie category
    - JSON
  scoring:
    combine: all_pass
- id: eu_cookie_compliance_gtm_eucc_gtm_tokens
  version: '1.0'
  applicable_bundles:
  - eu_cookie_compliance_gtm
  checks:
  - kind: must_contain_any
    values:
    - '@status'
    - '@functional_status'
    - dataLayer
    - 1 or 0
    - consent
  scoring:
    combine: all_pass
- id: eu_cookie_compliance_gtm_eucc_gtm_deps
  version: '1.0'
  applicable_bundles:
  - eu_cookie_compliance_gtm
  checks:
  - kind: must_contain_any
    values:
    - eu_cookie_compliance
    - google_tag
    - dataLayer
  scoring:
    combine: all_pass
- id: eu_cookie_compliance_gtm_eucc_gtm_known_cat
  version: '1.0'
  applicable_bundles:
  - eu_cookie_compliance_gtm
  checks:
  - kind: must_contain_any
    values:
    - eucc_analytics
  scoring:
    combine: all_pass
- id: eu_cookie_compliance_gtm_eucc_gtm_known_ref
  version: '1.0'
  applicable_bundles:
  - eu_cookie_compliance_gtm
  checks:
  - kind: must_contain_any
    values:
    - '@functional_status'
    - functional
  scoring:
    combine: all_pass
- id: eu_cookie_compliance_gtm_eucc_gtm_add_data
  version: '1.0'
  applicable_bundles:
  - eu_cookie_compliance_gtm
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
- id: eu_cookie_compliance_gtm_eucc_gtm_clear_data
  version: '1.0'
  applicable_bundles:
  - eu_cookie_compliance_gtm
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
