# Generated from evals.json by evaluation/to_commons.py.
# Edit evals.json and rerun the script; do not edit this file.
metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: storybook
  version: 1.0.x
  note: 'Storybook bridges Drupal Twig to a Storybook front-end. Actually browsing components requires
    the EXTERNAL Storybook (npm/Node) application plus CORS -- an out-of-Drupal dependency that cannot
    be exercised on this site. So all medium/hard cases are grounded in LOCAL, verifiable state that needs
    no external server: the ''render storybook stories'' permission (storybook.permissions.yml), the render
    route storybook.render_story -> /storybook/stories/render/{hash}, and the Drush story compiler (storybook:generate-all-stories
    / storybook:generate-stories) which turns a *.stories.twig into a sibling *.stories.json. No configure
    route, no config schema, no plugin types. NOTE on generate-stories: template_path is relative to the
    Drupal root (docroot, e.g. web/), and the command writes the JSON with file_put_contents relative
    to the CWD, so it must be run FROM the docroot; the compiled setup/verify scripts run it via (cd web
    && drush ...). Introspection reads which role may render / a compiled story title; execution grants
    the anonymous render permission and compiles a Twig story to JSON, both verified from live state (role
    permission / the generated .stories.json).'
questions:
- id: storybook-twig-tags
  input: How do I write a Storybook story for a Drupal component using the storybook module, and what
    should the file be named?
  criteria: Write the story in a *.stories.twig file using the {% stories ... %} tag (a story group with
    a title) and {% story ... %} tags (each variant, with a name and args). The args become Twig variables
    for rendering the component.
  bundle: storybook
  rubric_ref: rubric/storybook_storybook_twig_tags@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: storybook-compile-command
  input: The Storybook application can't read Twig stories directly. Which Drush command does the storybook
    module provide to compile *.stories.twig files into the *.stories.json that Storybook understands?
  criteria: drush storybook:generate-all-stories (scans modules/profiles/themes) or drush storybook:generate-stories
    <path> for a single template. Options include --force, --omit-server-url, and Drush's --uri.
  bundle: storybook
  rubric_ref: rubric/storybook_storybook_compile_command@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: storybook-render-permission
  input: Storybook renders each Drupal story by calling an endpoint on the site. What is that render route,
    and which permission must be granted (typically to anonymous in local dev) for Storybook to fetch
    renders?
  criteria: The render route is storybook.render_story at /storybook/stories/render/{hash}. It is gated
    by the 'render storybook stories' permission; grant it to the anonymous role in local/dev (keep it
    disabled in production).
  bundle: storybook
  rubric_ref: rubric/storybook_storybook_render_permission@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: storybook-which-role
  input: On this site, one custom role has been granted access to the Storybook render endpoint. Inspect
    the live configuration and state which role can render Storybook stories.
  criteria: The 'storybook_viewer' role has the 'render storybook stories' permission (user.role.storybook_viewer
    includes that permission).
  bundle: storybook
  rubric_ref: rubric/storybook_storybook_which_role@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/storybook-viewerrole-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/storybook-viewerrole-cleanup.sh
- id: storybook-compiled-title
  input: This site has a Twig story that has already been compiled to JSON by the storybook module, under
    web/modules/custom/storybook_ev_data/. Inspect the compiled *.stories.json file and report the Storybook
    story group title it declares.
  criteria: The compiled widget.stories.json has title 'Components/StorybookEval/Widget' (with a Primary
    story and args.label 'Click me').
  bundle: storybook
  rubric_ref: rubric/storybook_storybook_compiled_title@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/storybook-compiled-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/storybook-compiled-cleanup.sh
- id: storybook-grant-anon
  input: This is a local development site running the storybook module. Configure Drupal so the external
    Storybook application (which is anonymous) can fetch rendered stories from the Storybook render endpoint.
    Apply the change to the live site.
  criteria: The anonymous role is granted the 'render storybook stories' permission (e.g. drush role:perm:add
    anonymous 'render storybook stories', or via /admin/people/permissions), so /storybook/stories/render/{hash}
    is reachable by Storybook.
  bundle: storybook
  rubric_ref: rubric/storybook_storybook_grant_anon@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/storybook-anon-perm-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/storybook-anon-perm-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/storybook-anon-perm-verify.sh
- id: storybook-compile-story
  input: This site has a Twig story file at web/modules/custom/storybook_ev_task/card.stories.twig but
    no compiled JSON yet. Using the storybook module, compile that Twig story into the *.stories.json
    file the Storybook application reads. Apply the change to the live site.
  criteria: web/modules/custom/storybook_ev_task/card.stories.json is generated (title 'Components/StorybookEval/Card')
    by running the compiler from the Drupal docroot, e.g. (cd web && drush storybook:generate-stories
    modules/custom/storybook_ev_task/card.stories.twig), or drush storybook:generate-all-stories.
  bundle: storybook
  rubric_ref: rubric/storybook_storybook_compile_story@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/storybook-generate-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/storybook-generate-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/storybook-generate-verify.sh
