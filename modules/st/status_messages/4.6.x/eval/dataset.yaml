metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: status_messages
  version: 4.6.x
  note: 'Status Messages renders Drupal status messages as an auto-fading top-right popup. Its only configuration
    is status_message_time (milliseconds) in the status_messages.status_messages config object, set via
    the form at /admin/config/user-interface/status-messages (route status_messages.status_messages, permission
    ''administer status messages configuration''); the select offers 5000/10000/15000/20000/3600000 (Never).
    The module ships no config/install default and no schema, so status_message_time is unset until saved
    — the reset/cleanup baseline is therefore ''config object removed''. Medium/hard cases are grounded
    in that one real config value: introspection reads the current time, execution sets it and verifies
    against live config.'
questions:
- id: status_messages-what
  input: What does the Drupal 'Status Messages' module change about how Drupal's status/warning/error
    messages are displayed?
  criteria: It shows the core status messages as a floating popup (toast) in the top-right corner with
    a close button, and fades them out automatically after a configurable time.
  bundle: status_messages
  rubric_ref: rubric/status_messages_status_messages_what@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: status_messages-setting
  input: In the Status Messages module, which config setting controls how long a message stays before
    fading, what unit is it in, and where is it configured?
  criteria: status_message_time, in milliseconds, stored in the status_messages.status_messages config
    object and set at /admin/config/user-interface/status-messages. Options are 5000/10000/15000/20000
    and 3600000 (Never).
  bundle: status_messages
  rubric_ref: rubric/status_messages_status_messages_setting@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: status_messages-never
  input: In Status Messages, what value would I choose so that popup messages effectively never auto-close,
    and which permission controls access to the settings form?
  criteria: Choose 'Never', which stores status_message_time = 3600000 (one hour, i.e. no auto-close in
    a normal page view). The settings form is gated by the 'administer status messages configuration'
    permission.
  bundle: status_messages
  rubric_ref: rubric/status_messages_status_messages_never@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: status_messages-known-time
  input: On this Drupal site, how long (in seconds) will Status Messages keep a popup on screen before
    it fades out? Inspect the live configuration and answer.
  criteria: 15 seconds — status_messages.status_messages:status_message_time is 15000 ms (15 seconds).
  bundle: status_messages
  rubric_ref: rubric/status_messages_status_messages_known_time@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/status_messages-known-time-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/status_messages-known-time-cleanup.sh
- id: status_messages-set-time
  input: Configure the Status Messages module on this site so that popup messages fade out after 10 seconds.
    Apply the change to the live site.
  criteria: Set status_messages.status_messages:status_message_time to 10000 (10 seconds in milliseconds)
    and save. Verified against live config.
  bundle: status_messages
  rubric_ref: rubric/status_messages_status_messages_set_time@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/status_messages-set-time-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/status_messages-set-time-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/status_messages-set-time-verify.sh
- id: status_messages-set-time-layman
  input: Our confirmation popups disappear too fast. Using the Status Messages module, make them stay
    on screen for 10 seconds before disappearing, and save the setting.
  criteria: Set status_message_time to 10000 ms (10 seconds) in status_messages.status_messages and save.
    Verified against live config.
  bundle: status_messages
  rubric_ref: rubric/status_messages_status_messages_set_time_layman@1.0
