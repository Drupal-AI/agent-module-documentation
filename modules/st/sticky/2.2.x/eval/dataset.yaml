metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: sticky
  version: 2.2.x
  note: 'Sticky is a thin Drupal wrapper around the garand/sticky jQuery plugin. A single admin form (/admin/config/system/sticky,
    route sticky.sticky_settings_form, permission ''administer sticky'') stores ten keys in the sticky.settings
    config object: selector (default .menu--main), top_spacing (0), bottom_spacing (0), class_name (is-sticky),
    wrapper_class_name (sticky-wrapper), center (false), get_width_from (''''), width_from_wrapper (true),
    responsive_width (false), z_index (auto). sticky_page_attachments() pushes StickyManager::getJsSettings()
    into drupalSettings.sticky and attaches the sticky/sticky library, which needs the external file /libraries/sticky/jquery.sticky.js.
    No config/install defaults and no config schema ship, so the baseline sticky.settings config is ABSENT
    until saved. All cases are grounded in the sticky.settings config object (read/written with drush);
    setup/reset write known values and cleanup deletes sticky.settings to restore the absent baseline.'
questions:
- id: sticky-where-configured
  input: How do I configure the Drupal 'sticky' module, and in which config object are its settings stored?
  criteria: Configure it at Configuration > System > Sticky (/admin/config/system/sticky, route sticky.sticky_settings_form,
    permission 'administer sticky'). All settings are stored in the sticky.settings config object.
  bundle: sticky
  rubric_ref: rubric/sticky_sticky_where_configured@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: sticky-selector-key
  input: Which sticky module setting decides which element on the page becomes sticky, and what is its
    default value?
  criteria: The 'selector' setting (DOM Selector) is a CSS selector that chooses the element to make sticky;
    its default is .menu--main. It is global (one selector site-wide).
  bundle: sticky
  rubric_ref: rubric/sticky_sticky_selector_key@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: sticky-external-library
  input: The sticky module doesn't seem to do anything after enabling it. What external dependency does
    it need, and where must it be placed?
  criteria: It wraps the third-party garand/sticky (stickyjs.com) jQuery plugin, which you must download
    and place at /libraries/sticky/ so that /libraries/sticky/jquery.sticky.js loads. The target element
    for the selector must also exist in the markup.
  bundle: sticky
  rubric_ref: rubric/sticky_sticky_external_library@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: sticky-known-selector
  input: On this Drupal site the sticky module is configured to make one element stay visible on scroll.
    Inspect the live configuration and state the CSS/DOM selector of the element that is set to be sticky.
  criteria: The sticky.settings 'selector' is .header-wrapper (drush cget sticky.settings selector).
  bundle: sticky
  rubric_ref: rubric/sticky_sticky_known_selector@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/sticky-known-selector-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/sticky-known-selector-cleanup.sh
- id: sticky-known-spacing
  input: The sticky module on this site is configured with a gap between the top of the page and the sticky
    element. Inspect the live configuration and state the top spacing value (in pixels) that is set.
  criteria: sticky.settings top_spacing is 42 (pixels).
  bundle: sticky
  rubric_ref: rubric/sticky_sticky_known_spacing@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/sticky-known-spacing-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/sticky-known-spacing-cleanup.sh
- id: sticky-make-footer
  input: On this Drupal site, use the sticky module to make the element matching the CSS selector '#footer'
    the sticky element (so the footer stays visible on scroll). Apply the change to the live site configuration.
  criteria: sticky.settings 'selector' is set to '#footer' (e.g. drush cset sticky.settings selector '#footer',
    or via the Sticky settings form).
  bundle: sticky
  rubric_ref: rubric/sticky_sticky_make_footer@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/sticky-footer-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/sticky-footer-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/sticky-footer-verify.sh
- id: sticky-header-with-gap
  input: I want my site header (the element with the CSS class 'site-header', i.e. selector '.site-header')
    to stick to the top when scrolling, but leave a 30 pixel gap above it so it doesn't cover my admin
    toolbar. Using the sticky module, set this up on the live site.
  criteria: sticky.settings has selector = '.site-header' and top_spacing = 30 (stored as an integer).
  bundle: sticky
  rubric_ref: rubric/sticky_sticky_header_with_gap@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: site-owner
    reset: agent-module-documentation/evaluation/verify/sticky-header-gap-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/sticky-header-gap-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/sticky-header-gap-verify.sh
