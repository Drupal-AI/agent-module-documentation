metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: starrating
  version: 4.1.x
  note: 'Starrating adds a ''starrating'' field type (tiny int) + select widget + three formatters: starrating
    (icons via theme starrating_formatter and per-icon CSS libraries), starrating_value (raw number),
    starrating_value_rating (rate/max e.g. 8/10). Per-field setting max_value (1-10, default 10). Icon
    formatter settings: icon_type (17 sets incl. star, heart, fire...), icon_color (1-8), fill_blank.
    No admin config page, no routes/permissions/services/Drush; author-set rating, not end-user voting.
    Medium reads back a live field''s max_value + icon_type; hard cases create a starrating field (max
    5) and switch a field''s formatter to the 8/10 text formatter, both verified against live field/display
    config. Fixtures namespaced field_srt_*. NOTE: deleting a FieldConfig on this site does not auto-remove
    its view-display component, so cleanup/reset scripts removeComponent explicitly.'
questions:
- id: starrating-field-and-formatters
  input: What does the Drupal starrating module provide, and which three display formatters does it offer
    for its field (including the one that shows something like 8/10)?
  criteria: 'It provides a ''starrating'' field type (tiny integer) with a select widget and three formatters:
    starrating (renders icons like stars), starrating_value (the raw number), and starrating_value_rating
    (the value over the max, e.g. 8/10). It is an author-set rating, not end-user voting.'
  bundle: starrating
  rubric_ref: rubric/starrating_starrating_field_and_formatters@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: starrating-max-value
  input: How do you make a starrating field use a scale of 1-5 instead of the default, in Drupal?
  criteria: Set the field's max_value setting (the 'Maximum rating value' select, 1-10, default 10) to
    5 on the field instance's settings (field.field.<entity>.<bundle>.<field>.settings.max_value). The
    widget then offers 0-5.
  bundle: starrating
  rubric_ref: rubric/starrating_starrating_max_value@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: starrating-icon-type
  input: In the starrating module, how do you display the rating with heart icons instead of stars, and
    which formatter setting controls that?
  criteria: 'Use the ''starrating'' (icon) formatter and set its icon_type setting to ''heart'' (17 icon
    sets are available: star, heart, fire, thumbsup, etc.). icon_color (1-8) and fill_blank are the other
    formatter settings.'
  bundle: starrating
  rubric_ref: rubric/starrating_starrating_icon_type@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: starrating-known-field-max
  input: On this Drupal site, the Article content type has a Star rating field named field_srt_known.
    What is its maximum rating value (the top of its scale)? Inspect the live field configuration.
  criteria: 7 - field.field.node.article.field_srt_known settings.max_value is 7.
  bundle: starrating
  rubric_ref: rubric/starrating_starrating_known_field_max@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/starrating-known-field-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/starrating-known-field-cleanup.sh
- id: starrating-known-field-icon
  input: On this Drupal site, the Article default display renders the field_srt_known Star rating field
    using the icon formatter. Which icon set (icon_type) is it configured to use? Inspect the live display
    configuration.
  criteria: fire - in core.entity_view_display.node.article.default the field_srt_known component (formatter
    starrating) has settings.icon_type = fire.
  bundle: starrating
  rubric_ref: rubric/starrating_starrating_known_field_icon@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/starrating-known-field-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/starrating-known-field-cleanup.sh
- id: starrating-add-field
  input: On this Drupal site, add a Star rating field named field_srt_task to the Article content type
    using the starrating module, configured with a maximum rating value of 5. Apply the change to the
    live site.
  criteria: Create a FieldStorageConfig (node, field_srt_task, type starrating) and a FieldConfig on node.article
    with settings.max_value = 5, e.g. via Field UI or the entity API.
  bundle: starrating
  rubric_ref: rubric/starrating_starrating_add_field@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/starrating-add-field-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/starrating-add-field-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/starrating-add-field-verify.sh
- id: starrating-switch-formatter
  input: On this Drupal site, the Article content type has a Star rating field field_srt_fmt that currently
    displays as icons. Change the Article default display so this field is shown as a numeric rating like
    8/10 (the starrating text-rating formatter) instead of icons. Apply the change to the live site.
  criteria: Set the field_srt_fmt component in core.entity_view_display.node.article.default to formatter
    type starrating_value_rating (the 'Star rating (e.g. 8/10)' formatter).
  bundle: starrating
  rubric_ref: rubric/starrating_starrating_switch_formatter@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/starrating-fmt-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/starrating-fmt-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/starrating-fmt-verify.sh
