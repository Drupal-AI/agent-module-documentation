rubrics:
- id: stringoverrides_stringoverrides_where_configured
  version: '1.0'
  applicable_bundles:
  - stringoverrides
  checks:
  - kind: must_contain_any
    values:
    - /admin/config/regional/stringoverrides
    - regional/stringoverrides
    - administer string overrides
  scoring:
    combine: all_pass
- id: stringoverrides_stringoverrides_mechanism
  version: '1.0'
  applicable_bundles:
  - stringoverrides
  checks:
  - kind: must_contain_any
    values:
    - string_translator
    - StaticTranslation
    - translator
  scoring:
    combine: all_pass
- id: stringoverrides_stringoverrides_storage
  version: '1.0'
  applicable_bundles:
  - stringoverrides
  checks:
  - kind: must_contain_any
    values:
    - stringoverrides.string_override
    - contexts
    - translations
  scoring:
    combine: all_pass
- id: stringoverrides_stringoverrides_known_override
  version: '1.0'
  applicable_bundles:
  - stringoverrides
  checks:
  - kind: must_contain_any
    values:
    - Sign in
  scoring:
    combine: all_pass
- id: stringoverrides_stringoverrides_context_override
  version: '1.0'
  applicable_bundles:
  - stringoverrides
  checks:
  - kind: must_contain_any
    values:
    - Mai
    - Long month name
  scoring:
    combine: all_pass
- id: stringoverrides_stringoverrides_add_override
  version: '1.0'
  applicable_bundles:
  - stringoverrides
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
- id: stringoverrides_stringoverrides_add_context
  version: '1.0'
  applicable_bundles:
  - stringoverrides
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
