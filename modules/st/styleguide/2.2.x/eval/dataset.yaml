metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: styleguide
  version: 2.2.x
  note: 'Style guide renders a preview of common theme elements per active theme. Main page /admin/appearance/styleguide
    (route styleguide.page, permission ''view style guides''). Dynamic per-theme routes styleguide.<theme>
    generated by StyleguideRoutes (route_callbacks) for each enabled non-hidden theme; a theme negotiator
    (theme.negotiator.styleguide) renders each in its theme. It defines a Styleguide plugin type: manager
    plugin.manager.styleguide, subdir Plugin/Styleguide, interface StyleguideInterface::items(), base
    StyleguidePluginBase, generic @Plugin annotation, alter hook styleguide_info; ships plugins default_styleguide,
    comment_styleguide, filter_styleguide, image_styleguide, layout_styleguide, search_styleguide, views_styleguide.
    hook_styleguide_alter(&$items) alters items. No config of its own, no Drush. Medium/hard cases are
    grounded in real live state: introspection reads the registered plugins / enabled-theme routes; execution
    grants the real permission to a role and enables a theme''s style guide, verified against live state.
    The stark theme route only appears after a router/cache rebuild.'
questions:
- id: styleguide-where-permission
  input: With the Drupal styleguide module enabled, at what path do I view the theme style guide, and
    what permission is required to see it?
  criteria: View it at /admin/appearance/styleguide (route styleguide.page), which shows the guide for
    the current default theme. The 'view style guides' permission is required.
  bundle: styleguide
  rubric_ref: rubric/styleguide_styleguide_where_permission@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: styleguide-plugin-type
  input: How do I add my own elements to the styleguide module's preview page from a custom module? What
    plugin type / interface do I implement?
  criteria: Create a plugin under src/Plugin/Styleguide implementing Drupal\styleguide\StyleguideInterface
    (extend StyleguidePluginBase) with a generic @Plugin annotation (id + label) and an items() method
    returning your elements (keyed arrays with title/content). The plugin.manager.styleguide manager discovers
    it.
  bundle: styleguide
  rubric_ref: rubric/styleguide_styleguide_plugin_type@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: styleguide-per-theme
  input: The styleguide module can show the guide for a specific theme, not just the default one. How
    are those per-theme pages provided, and how does the page render in the selected theme?
  criteria: For each enabled non-hidden theme a dynamic route styleguide.<theme> at /admin/appearance/styleguide/<theme>
    is generated by StyleguideRoutes (route_callbacks), shown as tabs. A theme negotiator (theme.negotiator.styleguide
    / StyleguideThemeNegotiator) sets the active theme to the one in the route so the guide renders in
    that theme.
  bundle: styleguide
  rubric_ref: rubric/styleguide_styleguide_per_theme@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: styleguide-plugins-list
  input: On this Drupal site, which Styleguide plugins are registered (the plugins that supply the style
    guide's preview elements)? Give at least the plugin id that provides the default/common HTML elements.
  criteria: The registered Styleguide plugins (from plugin.manager.styleguide) are default_styleguide,
    comment_styleguide, filter_styleguide, image_styleguide, layout_styleguide, search_styleguide and
    views_styleguide. The default/common elements come from default_styleguide.
  bundle: styleguide
  rubric_ref: rubric/styleguide_styleguide_plugins_list@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/styleguide-plugins-list-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/styleguide-plugins-list-cleanup.sh
- id: styleguide-theme-available
  input: A non-default theme has recently been enabled on this site. Besides the default theme, for which
    theme can you now view a Style guide, and what is the exact path to that theme's style guide page?
  criteria: The core 'stark' theme was enabled, so its style guide is available at /admin/appearance/styleguide/stark
    (route styleguide.stark).
  bundle: styleguide
  rubric_ref: rubric/styleguide_styleguide_theme_available@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/styleguide-theme-available-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/styleguide-theme-available-cleanup.sh
- id: styleguide-grant-perm
  input: On this Drupal site there is a role with machine name styleguide_viewer that currently cannot
    view the theme style guides. Using the styleguide module's permission, grant that role the ability
    to view style guides, and apply it to the live site.
  criteria: The styleguide_viewer role is granted the 'view style guides' permission (e.g. via the permissions
    form or Role::load('styleguide_viewer')->grantPermission('view style guides')->save()), so hasPermission('view
    style guides') is TRUE.
  bundle: styleguide
  rubric_ref: rubric/styleguide_styleguide_grant_perm@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/styleguide-grant-perm-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/styleguide-grant-perm-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/styleguide-grant-perm-verify.sh
- id: styleguide-enable-theme
  input: On this Drupal site, make the styleguide module's Style guide available for the core 'stark'
    theme, so that its guide is reachable at /admin/appearance/styleguide/stark. Apply the change to the
    live site (remember its dynamic route must actually exist).
  criteria: The 'stark' theme is installed (e.g. drush theme:enable stark) and, after a router/cache rebuild
    (drush cr), the dynamic route styleguide.stark exists so /admin/appearance/styleguide/stark renders
    the guide in the stark theme.
  bundle: styleguide
  rubric_ref: rubric/styleguide_styleguide_enable_theme@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/styleguide-enable-theme-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/styleguide-enable-theme-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/styleguide-enable-theme-verify.sh
