rubrics:
- id: storage_storage_what_and_where
  version: '1.0'
  applicable_bundles:
  - storage
  checks:
  - kind: must_contain_any
    values:
    - /admin/structure/storage_types
    - storage_type
    - storage types
    - /admin/content/storage
  scoring:
    combine: all_pass
- id: storage_storage_name_pattern
  version: '1.0'
  applicable_bundles:
  - storage
  checks:
  - kind: must_contain_any
    values:
    - name_pattern
    - name pattern
    - token
    - '[storage:'
  scoring:
    combine: all_pass
- id: storage_storage_canonical
  version: '1.0'
  applicable_bundles:
  - storage
  checks:
  - kind: must_contain_any
    values:
    - has_canonical
    - canonical
    - redirect
  scoring:
    combine: all_pass
- id: storage_storage_name_pattern_introspect
  version: '1.0'
  applicable_bundles:
  - storage
  checks:
  - kind: must_contain_any
    values:
    - '[storage:string-representation]'
    - string-representation
  scoring:
    combine: all_pass
- id: storage_storage_canonical_introspect
  version: '1.0'
  applicable_bundles:
  - storage
  checks:
  - kind: must_contain_any
    values:
    - storage_canon
  scoring:
    combine: all_pass
- id: storage_storage_create_type
  version: '1.0'
  applicable_bundles:
  - storage
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
- id: storage_storage_create_entity
  version: '1.0'
  applicable_bundles:
  - storage
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
