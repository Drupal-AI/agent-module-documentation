metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: storage
  version: 1.4.x
  note: 'Storage Entities defines a bundleable content entity type ''storage'' with config-entity bundles
    ''storage_type'' (config prefix storage.storage_type.<id>). storage_type config_export keys: id, label,
    description, help, new_revision, revision_expose, revision_log, name_pattern, status, has_canonical.
    Storage types are managed at /admin/structure/storage_types, entities at /admin/content/storage (a
    provided view) and created at /storage/add. By default there is no canonical URL unless has_canonical
    is TRUE. name_pattern auto-generates the entity name from tokens (e.g. [storage:string-representation]).
    Per-bundle permissions are generated by StoragePermissions. The optional rh_storage submodule adds
    Rabbit Hole behaviour. medium cases create namespaced storage types (storage_known/storage_canon)
    and read the config back; hard cases create a storage type (storage_task) and a storage entity of
    a type (storage_item); cleanup deletes entities then types so the baseline (no storage types) is restored.'
questions:
- id: storage-what-and-where
  input: What is the Drupal 'storage' (Storage Entities) module for, and where do I create the bundles
    (storage types) and manage the stored data?
  criteria: It provides a bundleable content entity type 'storage' for fielded data that has no front-end
    URL (an alternative to a content type hidden with Rabbit Hole). Create bundles (storage types) at
    /admin/structure/storage_types and manage entities at /admin/content/storage (add at /storage/add).
  bundle: storage
  rubric_ref: rubric/storage_storage_what_and_where@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: storage-name-pattern
  input: In the storage (Storage Entities) module, how can I have each storage entity's name generated
    automatically instead of typed in by hand? Which storage-type setting does this?
  criteria: Set the storage type's name_pattern to a token pattern (e.g. [storage:string-representation]);
    it is applied on every save so you can hide the name field in Manage form display.
  bundle: storage
  rubric_ref: rubric/storage_storage_name_pattern@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: storage-canonical
  input: By default, can you visit a storage entity at its own URL in the Drupal storage module, and which
    storage-type setting changes that?
  criteria: By default storage entities have no canonical URL - visiting /storage/{id} redirects to the
    edit form. Enabling the storage type's has_canonical flag gives items a real canonical view URL (with
    appropriate view permissions).
  bundle: storage
  rubric_ref: rubric/storage_storage_canonical@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: storage-name-pattern-introspect
  input: On this Drupal site there is a Storage type called 'storage_known'. Inspect its live configuration
    and state the name pattern it uses to auto-generate storage entity names.
  criteria: storage_known's name_pattern is [storage:string-representation]. Read it with `drush config:get
    storage.storage_type.storage_known name_pattern`.
  bundle: storage
  rubric_ref: rubric/storage_storage_name_pattern_introspect@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/storage-namepattern-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/storage-namepattern-cleanup.sh
- id: storage-canonical-introspect
  input: On this Drupal site, one Storage type is configured so its entities can be viewed directly at
    their own URL (/storage/{id}). Inspect the storage type configuration and name that storage type.
  criteria: The storage type is 'storage_canon', which has has_canonical set to true (storage.storage_type.storage_canon:has_canonical
    = true).
  bundle: storage
  rubric_ref: rubric/storage_storage_canonical_introspect@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/storage-canonical-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/storage-canonical-cleanup.sh
- id: storage-create-type
  input: On this Drupal site, use the Storage Entities module to create a new storage type (bundle) with
    the machine name 'storage_task'. Apply the change to the live site.
  criteria: Create a storage_type config entity with id 'storage_task' (e.g. \Drupal\storage\Entity\StorageType::create(['id'=>'storage_task','label'=>'Storage
    Task'])->save(), or via /admin/structure/storage_types/add).
  bundle: storage
  rubric_ref: rubric/storage_storage_create_type@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/storage-create-type-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/storage-create-type-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/storage-create-type-verify.sh
- id: storage-create-entity
  input: On this Drupal site there is a storage type with machine name 'storage_item'. Create a new Storage
    entity of that type whose name contains the word 'Eval'. Apply the change to the live site.
  criteria: Create and save a 'storage' entity of bundle storage_item with a name containing 'Eval', e.g.
    \Drupal::entityTypeManager()->getStorage('storage')->create(['type'=>'storage_item','name'=>'Eval
    Item'])->save().
  bundle: storage
  rubric_ref: rubric/storage_storage_create_entity@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/storage-create-entity-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/storage-create-entity-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/storage-create-entity-verify.sh
