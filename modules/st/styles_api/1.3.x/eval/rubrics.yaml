rubrics:
- id: styles_api_styles_api_define_style
  version: '1.0'
  applicable_bundles:
  - styles_api
  checks:
  - kind: must_contain_any
    values:
    - '@Style'
    - Plugin/Style
    - StyleBase
    - plugin.manager.styles_api
  scoring:
    combine: all_pass
- id: styles_api_styles_api_yaml_and_template
  version: '1.0'
  applicable_bundles:
  - styles_api
  checks:
  - kind: must_contain_any
    values:
    - themes.yml
    - YAML
    - yaml
    - hook_theme
    - template
  scoring:
    combine: all_pass
- id: styles_api_styles_api_list_styles
  version: '1.0'
  applicable_bundles:
  - styles_api
  checks:
  - kind: must_contain_any
    values:
    - plugin.manager.styles_api
    - getDefinitions
    - getStyleOptions
    - stylePluginManager
  scoring:
    combine: all_pass
- id: styles_api_styles_api_probe_id
  version: '1.0'
  applicable_bundles:
  - styles_api
  checks:
  - kind: must_contain_any
    values:
    - sap_probe_style
  scoring:
    combine: all_pass
- id: styles_api_styles_api_probe_provider
  version: '1.0'
  applicable_bundles:
  - styles_api
  checks:
  - kind: must_contain_any
    values:
    - styles_api_probe
  scoring:
    combine: all_pass
- id: styles_api_styles_api_register_annotation
  version: '1.0'
  applicable_bundles:
  - styles_api
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
- id: styles_api_styles_api_register_yaml
  version: '1.0'
  applicable_bundles:
  - styles_api
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
