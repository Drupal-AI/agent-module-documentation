metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: structure_sync
  version: 2.0.x
  note: 'Structure Sync exports three content-entity types (taxonomy terms, custom blocks, menu links)
    into a single config object and imports them back, filling the gap left by core CMI. Cases are `recipe`
    (response-graded): they probe documented facts an agent would otherwise read source to answer; no
    site mutation.'
questions:
- id: structure-sync-what-it-syncs
  input: On a Drupal 11 site, which three kinds of content does the Structure Sync module export to configuration
    so they can be deployed between environments?
  criteria: Taxonomy terms, custom (content) blocks, and menu links — content entities that core config
    management does not move.
  bundle: structure_sync
  rubric_ref: rubric/structure_sync_structure_sync_what_it_syncs@1.0
  tags:
  - mode:recipe
- id: structure-sync-why-not-cmi
  input: Why can't I just use Drupal's core configuration export/import (drush config:export) to deploy
    my taxonomy terms and menu links between environments, and what module fills that gap?
  criteria: Terms, custom blocks, and menu links are content entities, not configuration, so core CMI
    does not export them. Structure Sync serializes them into config so they can be deployed.
  bundle: structure_sync
  rubric_ref: rubric/structure_sync_structure_sync_why_not_cmi@1.0
  tags:
  - mode:recipe
- id: structure-sync-config-object
  input: Which config object does Structure Sync write the exported taxonomy terms, blocks, and menu links
    into so they travel with drush config:export?
  criteria: The structure_sync.data config object (defined in config/schema/structure_sync.schema.yml),
    which exports/deploys like any other config.
  bundle: structure_sync
  rubric_ref: rubric/structure_sync_structure_sync_config_object@1.0
  tags:
  - mode:recipe
- id: structure-sync-export-then-import-flow
  input: Describe the deployment flow for moving taxonomy terms from staging to production using Structure
    Sync.
  criteria: Export terms into structure_sync.data on staging, deploy/commit that config, then run a Structure
    Sync import on production to recreate the terms as entities.
  bundle: structure_sync
  rubric_ref: rubric/structure_sync_structure_sync_export_then_import_flow@1.0
  tags:
  - mode:recipe
- id: structure-sync-drush-commands
  input: What Drush commands does Structure Sync provide to export and import all its structure types
    at once on a Drupal site?
  criteria: export:all (ea / export-all) and import:all (ia / import-all); per-type commands also exist,
    e.g. export-taxonomies (et), import-menus (im), export-blocks (eb).
  bundle: structure_sync
  rubric_ref: rubric/structure_sync_structure_sync_drush_commands@1.0
  tags:
  - mode:recipe
- id: structure-sync-import-styles
  input: Structure Sync imports offer three styles. Name them and explain what each does to existing entities.
  criteria: safe = only add missing entities (no update/delete); full = safe plus update existing (matched
    by UUID); force = delete all of that type then recreate from config.
  bundle: structure_sync
  rubric_ref: rubric/structure_sync_structure_sync_import_styles@1.0
  tags:
  - mode:recipe
- id: structure-sync-admin-route
  input: Where in the Drupal admin UI do I manage Structure Sync, and which permission gates it?
  criteria: Admin → Structure → Structure Sync (/admin/structure/structure-sync); all screens are gated
    by the core 'administer site configuration' permission — the module defines no permissions of its
    own.
  bundle: structure_sync
  rubric_ref: rubric/structure_sync_structure_sync_admin_route@1.0
  tags:
  - mode:recipe
- id: structure-sync-idempotent-uuid
  input: If I run a Structure Sync import twice, will it create duplicate taxonomy terms? How does it
    match entities?
  criteria: No — entities are matched by UUID, so imports are idempotent; re-running an import does not
    duplicate entities.
  bundle: structure_sync
  rubric_ref: rubric/structure_sync_structure_sync_idempotent_uuid@1.0
  tags:
  - mode:recipe
