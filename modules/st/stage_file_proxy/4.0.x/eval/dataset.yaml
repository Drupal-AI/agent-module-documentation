metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: stage_file_proxy
  version: 4.0.x
  note: Stage File Proxy exposes a config settings object, a request subscriber that fetches missing files
    on demand, a download-manager service, an excluded-paths event, and one Drush command. Cases are `recipe`
    (response-graded) since they probe documented facts an agent would otherwise read source to answer;
    no site mutation.
questions:
- id: sfp-origin-setting
  input: On a Drupal 11 dev site using Stage File Proxy, which config setting names the production server
    files are fetched from, and where is the recommended place to set it? Give the config key.
  criteria: Set the `origin` key (no trailing slash) on stage_file_proxy.settings, ideally in settings.php/settings.local.php,
    e.g. $config['stage_file_proxy.settings']['origin'] = 'https://example.com'; (module is dev-only).
  bundle: stage_file_proxy
  rubric_ref: rubric/stage_file_proxy_sfp_origin_setting@1.0
  tags:
  - mode:recipe
- id: sfp-hotlink-vs-copy
  input: How do I make Stage File Proxy serve a 301 redirect to the production file instead of downloading
    and storing a local copy? Which setting and value?
  criteria: Set hotlink = true on stage_file_proxy.settings; it serves a 301 to the origin file rather
    than saving a local copy (default false = download and cache locally).
  bundle: stage_file_proxy
  rubric_ref: rubric/stage_file_proxy_sfp_hotlink_vs_copy@1.0
  tags:
  - mode:recipe
- id: sfp-on-demand-fetch
  input: How does Stage File Proxy get a file that is missing from the local dev files directory when
    a page requests it?
  criteria: A KernelEvents::REQUEST subscriber (StageFileProxySubscriber::checkFileOrigin, priority 240)
    intercepts requests under the public files path and, if the file is missing, downloads it from the
    origin via the download_manager service (or 301-redirects in hotlink mode).
  bundle: stage_file_proxy
  rubric_ref: rubric/stage_file_proxy_sfp_on_demand_fetch@1.0
  tags:
  - mode:recipe
- id: sfp-image-style-original
  input: For image-style (/styles/) URLs, how do I make Stage File Proxy fetch the original image from
    production and let Drupal regenerate the derivative locally? Which setting?
  criteria: 'Enable use_imagecache_root (default true): for /styles/ URLs it fetches the original file
    from the origin and lets the image module regenerate derivatives, speeding up later style requests.'
  bundle: stage_file_proxy
  rubric_ref: rubric/stage_file_proxy_sfp_image_style_original@1.0
  tags:
  - mode:recipe
- id: sfp-drush-warm
  input: Which Drush command bulk-downloads all managed files from the origin to pre-warm a Stage File
    Proxy dev site, and how do I download just one file by id?
  criteria: drush stage_file_proxy:dl (alias sfdl) downloads all missing managed files from the origin;
    use drush sfdl --fid=123 for a single file id.
  bundle: stage_file_proxy
  rubric_ref: rubric/stage_file_proxy_sfp_drush_warm@1.0
  tags:
  - mode:recipe
- id: sfp-dev-only
  input: Is Stage File Proxy meant to be enabled on production, and how should I keep its settings out
    of the production environment?
  criteria: No — it is for non-production (dev/staging) sites only; do not enable on production. Prefer
    setting config in settings.php/settings.local.php, and if using config sync keep it out of prod with
    Config Split.
  bundle: stage_file_proxy
  rubric_ref: rubric/stage_file_proxy_sfp_dev_only@1.0
  tags:
  - mode:recipe
- id: sfp-multisite-origin-dir
  input: My production files live at a different path than my local site (multisite). Which Stage File
    Proxy setting points at the remote files directory, and what does it default to?
  criteria: Set origin_dir to the remote public files path (e.g. sites/default/files); if empty it defaults
    to the local public files path.
  bundle: stage_file_proxy
  rubric_ref: rubric/stage_file_proxy_sfp_multisite_origin_dir@1.0
  tags:
  - mode:recipe
- id: sfp-exclude-paths-event
  input: In custom code, how do I tell Stage File Proxy to never proxy certain request paths? Which event
    do I subscribe to?
  criteria: Subscribe to the stage_file_proxy.alter_excluded_paths event and call $event->addExcludedPath('...')
    on the AlterExcludedPathsEvent; any request path containing an excluded string is skipped.
  bundle: stage_file_proxy
  rubric_ref: rubric/stage_file_proxy_sfp_exclude_paths_event@1.0
  tags:
  - mode:recipe
