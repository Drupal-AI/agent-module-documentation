rubrics:
- id: stage_file_proxy_sfp_origin_setting
  version: '1.0'
  applicable_bundles:
  - stage_file_proxy
  checks:
  - kind: must_contain_any
    values:
    - origin
    - stage_file_proxy.settings
  scoring:
    combine: all_pass
- id: stage_file_proxy_sfp_hotlink_vs_copy
  version: '1.0'
  applicable_bundles:
  - stage_file_proxy
  checks:
  - kind: must_contain_any
    values:
    - hotlink
  scoring:
    combine: all_pass
- id: stage_file_proxy_sfp_on_demand_fetch
  version: '1.0'
  applicable_bundles:
  - stage_file_proxy
  checks:
  - kind: must_contain_any
    values:
    - subscriber
    - KernelEvents::REQUEST
    - on demand
    - on-demand
    - DownloadManager
    - fetch
  scoring:
    combine: all_pass
- id: stage_file_proxy_sfp_image_style_original
  version: '1.0'
