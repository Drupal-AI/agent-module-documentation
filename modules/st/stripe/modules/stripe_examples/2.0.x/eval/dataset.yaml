metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: stripe_examples
  version: 2.0.x
  note: Demo submodule of stripe. Provides SimpleCheckoutForm (form id stripe_examples_simple_checkout)
    at /stripe_examples/form/simple_checkout, a block SimpleCheckoutBlock (plugin id stripe_example_checkout)
    that renders it, and StripeExamplesEventSubscriber which subscribes to StripeEvents::PAYMENT and calls
    setTotal(2500,...) for the example form. Depends on stripe. Medium/hard place/inspect the example
    checkout block (stripe_ex_probe / stripe_ex_task).
questions:
- id: sx-form-route
  input: After enabling the Stripe examples module, at what path can I see the example checkout form,
    and what is its form id?
  criteria: The SimpleCheckoutForm (form id stripe_examples_simple_checkout) is at /stripe_examples/form/simple_checkout.
  bundle: stripe_examples
  rubric_ref: rubric/stripe_examples_sx_form_route@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: sx-block
  input: Which block does the Stripe examples module provide to embed its checkout form on a page, and
    what is the block plugin id?
  criteria: The SimpleCheckoutBlock, block plugin id stripe_example_checkout, renders the example checkout
    form so you can place it in any region.
  bundle: stripe_examples
  rubric_ref: rubric/stripe_examples_sx_block@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: sx-amount
  input: How does the Stripe examples module demonstrate setting the payment amount, and what amount does
    it set?
  criteria: StripeExamplesEventSubscriber subscribes to StripeEvents::PAYMENT and, for the stripe_examples_simple_checkout
    form, calls $event->setTotal(2500, ...) - showing server-side control of the amount.
  bundle: stripe_examples
  rubric_ref: rubric/stripe_examples_sx_amount@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: sx-known-block
  input: On this site a block from the Stripe examples module has been placed. Inspect the block configuration
    and report its block plugin id.
  criteria: The placed block (stripe_ex_probe) uses plugin id stripe_example_checkout (read block.block.stripe_ex_probe).
  bundle: stripe_examples
  rubric_ref: rubric/stripe_examples_sx_known_block@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/stripe_examples-known-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/stripe_examples-known-cleanup.sh
- id: sx-place-block
  input: Place the Stripe examples checkout block on this site with the machine id 'stripe_ex_task' in
    the content region of the default theme, and enable it. Apply it to the live site.
  criteria: Create a Block config entity id stripe_ex_task with plugin 'stripe_example_checkout' in region
