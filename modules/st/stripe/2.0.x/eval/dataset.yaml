metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: stripe
  version: 2.0.x
  note: 'Stripe is a low-level integration. Config object stripe.settings holds environment (test|live)
    and apikey.<env>.public|secret|webhook. Admin form route stripe.settings at /admin/config/system/stripe
    (permission ''administer stripe''). Webhook POST /stripe/webhook dispatches StripeEvents::WEBHOOK
    (''stripe.webhook''); StripeEvents::PAYMENT (''stripe.payment'') adjusts the amount before confirmation.
    Form elements: stripe (card) and stripe_paymentrequest. Requires stripe/stripe-php. Medium/hard cases
    read and write the real stripe.settings config keys via drush; baseline defaults are environment=test
    with empty keys, restored by cleanup.'
questions:
- id: stripe-keys-config
  input: In the Drupal Stripe module, where are the Stripe API keys stored and how do you switch between
    test and live keys? Name the config object and the keys.
  criteria: Keys live in the stripe.settings config object under apikey.test.public/secret/webhook and
    apikey.live.public/secret/webhook; the 'environment' key (test|live) selects which set is active.
    Set them on /admin/config/system/stripe or via drush config:set, and prefer providing secrets from
    settings.php.
  bundle: stripe
  rubric_ref: rubric/stripe_stripe_keys_config@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: stripe-webhook-endpoint
  input: Using the Drupal Stripe module, what URL do incoming Stripe webhooks hit, and how does my custom
    module react to a webhook event (e.g. payment_intent.succeeded)?
  criteria: Stripe posts to /stripe/webhook; the controller verifies the signature (using apikey.<env>.webhook)
    and dispatches the StripeEvents::WEBHOOK ('stripe.webhook') event carrying the Stripe Event. Subscribe
    to it with an event_subscriber service and inspect $event->getEvent()->type.
  bundle: stripe
  rubric_ref: rubric/stripe_stripe_webhook_endpoint@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: stripe-payment-element
  input: With the Drupal Stripe module, which Form API element type do I add to collect a card payment,
    and how can I change the charge amount server-side before the payment is confirmed?
  criteria: Add a '#type' => 'stripe' element (or 'stripe_paymentrequest' for Apple/Google Pay). To change
    the amount, subscribe to StripeEvents::PAYMENT ('stripe.payment') and call $event->setTotal($amount,
    $label) on the StripePaymentEvent before confirmation.
  bundle: stripe
  rubric_ref: rubric/stripe_stripe_payment_element@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: stripe-current-environment
  input: On this Drupal site, which Stripe environment is currently active (test or live) according to
    the Stripe module configuration, and what is the configured live publishable key?
  criteria: 'environment is ''live'' and apikey.live.public is pk_live_MEDIUM_marker_001 (read stripe.settings:
    environment and apikey.live.public).'
  bundle: stripe
  rubric_ref: rubric/stripe_stripe_current_environment@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/stripe-env-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/stripe-env-cleanup.sh
- id: stripe-current-test-key
  input: This site's Stripe module has a test-mode publishable key configured. Inspect the live configuration
    and report the test publishable key value.
  criteria: The test publishable key is pk_test_KNOWN_key_42 (stripe.settings apikey.test.public).
  bundle: stripe
  rubric_ref: rubric/stripe_stripe_current_test_key@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/stripe-key-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/stripe-key-cleanup.sh
- id: stripe-go-live
  input: Configure the Drupal Stripe module on this site to run in LIVE mode with the live publishable
    key set to pk_live_GOLIVE_777. Apply the change to the live site configuration.
  criteria: Set stripe.settings environment=live and apikey.live.public=pk_live_GOLIVE_777 (drush config:set
    stripe.settings ... or via the settings form). verify checks both values.
  bundle: stripe
  rubric_ref: rubric/stripe_stripe_go_live@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/stripe-golive-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/stripe-golive-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/stripe-golive-verify.sh
- id: stripe-set-webhook-secret
  input: Set the Stripe module's TEST webhook signing secret to whsec_TASK_secret on this site so incoming
    webhooks are validated by signature. Apply it to the live configuration.
  criteria: Set stripe.settings apikey.test.webhook = whsec_TASK_secret (drush config:set stripe.settings
    apikey.test.webhook whsec_TASK_secret). verify reads it back.
  bundle: stripe
  rubric_ref: rubric/stripe_stripe_set_webhook_secret@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/stripe-webhook-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/stripe-webhook-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/stripe-webhook-verify.sh
