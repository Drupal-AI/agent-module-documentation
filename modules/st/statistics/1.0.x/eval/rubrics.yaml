rubrics:
- id: statistics_statistics_node_counter
  version: '1.0'
  applicable_bundles:
  - statistics
  checks:
  - kind: must_contain_any
    values:
    - node_counter
    - totalcount
    - daycount
  scoring:
    combine: all_pass
- id: statistics_statistics_enable_setting
  version: '1.0'
  applicable_bundles:
  - statistics
  checks:
  - kind: must_contain_any
    values:
    - count_content_views
    - statistics.settings
  scoring:
    combine: all_pass
- id: statistics_statistics_read_count_api
  version: '1.0'
  applicable_bundles:
  - statistics
  checks:
  - kind: must_contain_any
    values:
    - statistics.storage.node
    - fetchView
    - StatisticsStorageInterface
  scoring:
    combine: all_pass
- id: statistics_statistics_counting_enabled
  version: '1.0'
  applicable_bundles:
  - statistics
  checks:
  - kind: must_contain_any
    values:
    - 'on'
    - enabled
    - count_content_views
  scoring:
    combine: all_pass
- id: statistics_statistics_node_viewcount
  version: '1.0'
  applicable_bundles:
  - statistics
  checks:
  - kind: must_contain_any
    values:
    - '42'
  scoring:
    combine: all_pass
- id: statistics_statistics_enable_counting
  version: '1.0'
  applicable_bundles:
  - statistics
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
- id: statistics_statistics_record_view
  version: '1.0'
  applicable_bundles:
  - statistics
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
