rubrics:
- id: straw_straw_two_step
  version: '1.0'
  applicable_bundles:
  - straw
  checks:
  - kind: must_contain_any
    values:
    - Straw selection
    - Autocomplete (Straw style)
    - super_term_reference_autocomplete_widget
    - reference method
  scoring:
    combine: all_pass
- id: straw_straw_delimiter
  version: '1.0'
  applicable_bundles:
  - straw
  checks:
  - kind: must_contain_any
    values:
    - '>>'
    - hierarchy
    - parents
    - parent
  scoring:
    combine: all_pass
- id: straw_straw_field_type
  version: '1.0'
  applicable_bundles:
  - straw
  checks:
  - kind: must_contain_any
    values:
    - taxonomy
    - term reference
    - entity reference
    - entity_reference
  scoring:
    combine: all_pass
- id: straw_straw_known_widget
  version: '1.0'
  applicable_bundles:
  - straw
  checks:
  - kind: must_contain_any
    values:
    - super_term_reference_autocomplete_widget
  scoring:
    combine: all_pass
- id: straw_straw_configure_field
  version: '1.0'
  applicable_bundles:
  - straw
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
- id: straw_straw_known_handler
  version: '1.0'
  applicable_bundles:
  - straw
  checks:
  - kind: must_contain_any
    values:
    - straw
  scoring:
    combine: all_pass
- id: straw_straw_fix_handler
  version: '1.0'
  applicable_bundles:
  - straw
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
