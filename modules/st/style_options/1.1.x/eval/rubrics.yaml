rubrics:
- id: style_options_style_options_shipped_plugins
  version: '1.0'
  applicable_bundles:
  - style_options
  checks:
  - kind: must_contain_any
    values:
    - css_class
    - background_color
    - background_image
  scoring:
    combine: all_pass
- id: style_options_style_options_yml_convention
  version: '1.0'
  applicable_bundles:
  - style_options
  checks:
  - kind: must_contain_any
    values:
    - style_options.yml
    - options
    - contexts
  scoring:
    combine: all_pass
- id: style_options_style_options_plugin_type
  version: '1.0'
  applicable_bundles:
  - style_options
  checks:
  - kind: must_contain_any
    values:
    - StyleOption
    - style_option
    - plugin.manager.style_options
    - Plugin/StyleOption
  scoring:
    combine: all_pass
- id: style_options_style_options_which_type_enabled
  version: '1.0'
  applicable_bundles:
  - style_options
  checks:
  - kind: must_contain_any
    values:
    - so_known
  scoring:
    combine: all_pass
- id: style_options_style_options_onoff
  version: '1.0'
  applicable_bundles:
  - style_options
  checks:
  - kind: must_contain_any
    values:
    - so_on
  scoring:
    combine: all_pass
- id: style_options_style_options_enable_behavior
  version: '1.0'
  applicable_bundles:
  - style_options
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
- id: style_options_style_options_new_type
  version: '1.0'
  applicable_bundles:
  - style_options
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
