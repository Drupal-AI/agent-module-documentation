metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: style_options
  version: 1.1.x
  note: 'Style Options is an API to declare reusable style controls (plugin type style_option: css_class,
    background_color, background_image, property) in [ext].style_options.yml files and expose them on
    Layout Builder layouts and Paragraph types. Layouts must extend StyleOptionLayoutPlugin; Paragraphs
    use the ''style_options'' Paragraphs behavior plugin, enabled per type -> paragraphs.paragraphs_type.<type>.behavior_plugins.style_options.enabled:
    true. No admin settings page (only the Option Plugin migrate form). Medium/hard cases are grounded
    in the real paragraphs behavior config (namespaced paragraph types so_*).'
questions:
- id: style_options-shipped-plugins
  input: What style-option plugins does the style_options module ship out of the box?
  criteria: 'It ships four style_option plugins: css_class (attach CSS classes), background_color (a Spectrum
    color picker), background_image (background image), and a generic ''property''.'
  bundle: style_options
  rubric_ref: rubric/style_options_style_options_shipped_plugins@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: style_options-yml-convention
  input: How do you define which style options exist and where they appear in the style_options module?
    What is the config file naming convention?
  criteria: Create a file named [module_or_theme_name].style_options.yml at the root of a module/theme.
    It has an 'options' section (each entry picks a plugin and its config) and a 'contexts' section that
    maps options onto 'layout' plugins and 'paragraphs' types (with _defaults, per-plugin overrides, and
    _disable).
  bundle: style_options
  rubric_ref: rubric/style_options_style_options_yml_convention@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: style_options-plugin-type
  input: In style_options, what is the plugin type for a style control, and how would I add a custom one?
  criteria: The plugin type is style_option (manager plugin.manager.style_options, dir src/Plugin/StyleOption,
    annotation @StyleOption). Add a class under src/Plugin/StyleOption with an @StyleOption(id=...) annotation
    extending StyleOptionPluginBase, then reference its id from a [ext].style_options.yml option's 'plugin'
    key.
  bundle: style_options
  rubric_ref: rubric/style_options_style_options_plugin_type@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: style_options-which-type-enabled
  input: On this Drupal site, which paragraph type has the Style Options behavior enabled? Inspect the
    live paragraph type configuration to answer.
  criteria: 'The paragraph type so_known has the Style Options behavior enabled: paragraphs.paragraphs_type.so_known
    behavior_plugins.style_options.enabled is true.'
  bundle: style_options
  rubric_ref: rubric/style_options_style_options_which_type_enabled@1.0
  tags:
  - mode:introspection
  - difficulty:medium
