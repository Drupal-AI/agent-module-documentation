metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: string_field_formatter
  version: 2.0.x
  note: 'String Field Formatter provides one @FieldFormatter plugin, plain_string_formatter (class PlainStringFormatter
    extends core StringFormatter), for the string and string_long field types. It adds two settings on
    top of the core string formatter: wrap_tag (select of HTML tags; default _none = no wrapper) and wrap_class
    (space/comma separated CSS classes). Settings live in the entity_view_display config entity component
    (schema field.formatter.settings.plain_string_formatter). No config form/permissions/Drush/services
    of its own. Medium/hard cases are grounded in real formatter settings on namespaced field_sff_* string
    fields on the Article view display.'
questions:
- id: string_field_formatter-formatter-id
  input: I want to render a plain-text (string) field wrapped in an <h2> tag on display without writing
    a Twig template. Which module/formatter does this, what is the formatter's machine id, and which field
    types can use it?
  criteria: Use String Field Formatter's 'Plain string formatter' (id plain_string_formatter), available
    on string and string_long fields. It can wrap the value in a chosen HTML tag such as h2.
  bundle: string_field_formatter
  rubric_ref: rubric/string_field_formatter_string_field_formatter_formatter_id@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: string_field_formatter-settings
  input: What two extra display settings does the String Field Formatter's plain_string_formatter add
    compared with the core string formatter, and what is the default of the wrapper-tag setting?
  criteria: It adds wrap_tag (Wrapper tag; a select of HTML tags, default _none meaning no wrapper) and
    wrap_class (space/comma-separated CSS classes for the wrapper). With _none the output matches the
    core string formatter.
  bundle: string_field_formatter
  rubric_ref: rubric/string_field_formatter_string_field_formatter_settings@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: string_field_formatter-storage
  input: When I set a string field to use the Plain string formatter with a wrapper tag and classes, where
    is that configuration stored in Drupal?
  criteria: In the field's component of the bundle's entity_view_display config entity (core.entity_view_display.<entity>.<bundle>.<view_mode>),
    under content.<field>.settings.wrap_tag / wrap_class, with type plain_string_formatter. You set it
    on the bundle's Manage display page.
  bundle: string_field_formatter
  rubric_ref: rubric/string_field_formatter_string_field_formatter_storage@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: string_field_formatter-read-tag
  input: On this site the Article content type has a string field 'field_sff_known' displayed with the
    String Field Formatter. Inspect the live default view display and state which HTML wrapper tag it
    wraps the value in.
  criteria: 'It wraps the value in an <h2>: core.entity_view_display.node.article.default content.field_sff_known
    has type plain_string_formatter with settings.wrap_tag: h2.'
  bundle: string_field_formatter
  rubric_ref: rubric/string_field_formatter_string_field_formatter_read_tag@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/string_field_formatter-tag-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/string_field_formatter-tag-cleanup.sh
- id: string_field_formatter-read-class
  input: The Article field 'field_sff_cls' uses the Plain string formatter on the default display. Inspect
    the live configuration and tell me the CSS classes configured for its wrapper element.
  criteria: The wrapper classes are 'highlight badge' (settings.wrap_class), with wrap_tag span, in core.entity_view_display.node.article.default
    content.field_sff_cls.
  bundle: string_field_formatter
  rubric_ref: rubric/string_field_formatter_string_field_formatter_read_class@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/string_field_formatter-class-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/string_field_formatter-class-cleanup.sh
- id: string_field_formatter-apply
  input: On this Drupal site the Article content type has a string field 'field_sff_task' that currently
    uses the default string formatter on the default view display. Using the String Field Formatter module,
    change its display so the field is rendered with the Plain string formatter and wrapped in an HTML
    tag (not 'none'). Apply the change to the live site.
  criteria: In core.entity_view_display.node.article.default the field_sff_task component has type plain_string_formatter
    with settings.wrap_tag set to a real tag (e.g. h3), not _none.
  bundle: string_field_formatter
  rubric_ref: rubric/string_field_formatter_string_field_formatter_apply@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/string_field_formatter-apply-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/string_field_formatter-apply-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/string_field_formatter-apply-verify.sh
- id: string_field_formatter-h1
  input: I already display the Article field 'field_sff_head' with the Plain string formatter but it has
    no wrapper tag. Make it output as a top-level <h1> heading, and save it to the live site.
  criteria: 'In core.entity_view_display.node.article.default the field_sff_head component has type plain_string_formatter
    with settings.wrap_tag: h1.'
  bundle: string_field_formatter
  rubric_ref: rubric/string_field_formatter_string_field_formatter_h1@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: site-owner
    reset: agent-module-documentation/evaluation/verify/string_field_formatter-h1-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/string_field_formatter-h1-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/string_field_formatter-h1-verify.sh
