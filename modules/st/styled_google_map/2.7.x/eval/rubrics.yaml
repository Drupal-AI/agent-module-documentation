rubrics:
- id: styled_google_map_styled_google_map_apikey_where
  version: '1.0'
  applicable_bundles:
  - styled_google_map
  checks:
  - kind: must_contain_any
    values:
    - styled_google_map.settings
    - /admin/config/services/styled_google_map
    - styled_google_map_google_apikey
    - API Key
    - Maps for Work
    - API for Work
  scoring:
    combine: all_pass
- id: styled_google_map_styled_google_map_formatter_id
  version: '1.0'
  applicable_bundles:
  - styled_google_map
  checks:
  - kind: must_contain_any
    values:
    - styled_google_map_default
    - geofield
  scoring:
    combine: all_pass
- id: styled_google_map_styled_google_map_alter_hook
  version: '1.0'
  applicable_bundles:
  - styled_google_map
  checks:
  - kind: must_contain_any
    values:
    - hook_styled_google_map_views_style_alter
    - styled_google_map_views_style_alter
    - map_settings
  scoring:
    combine: all_pass
- id: styled_google_map_styled_google_map_known_apikey
  version: '1.0'
  applicable_bundles:
  - styled_google_map
  checks:
  - kind: must_contain_any
    values:
    - AIzaSyEVAL-known-key-001
  scoring:
    combine: all_pass
- id: styled_google_map_styled_google_map_known_field
  version: '1.0'
  applicable_bundles:
  - styled_google_map
  checks:
  - kind: must_contain_any
    values:
    - field_sgm_known
  scoring:
    combine: all_pass
- id: styled_google_map_styled_google_map_show_formatter
  version: '1.0'
  applicable_bundles:
  - styled_google_map
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
- id: styled_google_map_styled_google_map_set_apikey
  version: '1.0'
  applicable_bundles:
  - styled_google_map
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
