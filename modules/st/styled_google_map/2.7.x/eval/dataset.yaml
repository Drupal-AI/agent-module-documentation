metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: styled_google_map
  version: 2.7.x
  note: 'Styled Google Map renders a geofield as a Google Map via a field formatter (id styled_google_map_default,
    field type geofield) and a Views style (id styled_google_map). Rendering the actual map needs a Google
    Maps API key (external), so all medium/hard cases are grounded in LOCAL Drupal config that is verifiable
    without any Google service: the global config object styled_google_map.settings (keys styled_google_map_google_auth_method
    1=API Key/2=Work, styled_google_map_google_apikey, styled_google_map_google_client_id) and the entity_view_display
    formatter assignment. Introspection reads back a stored key / a formatter assignment; execution builds
    a formatter assignment and sets the API key, verified against live config.'
questions:
- id: styled_google_map-apikey-where
  input: On a Drupal 11 site using the styled_google_map module, where do I set the Google Maps API key,
    and what config object and admin route hold it? Also name the two authentication methods it supports.
  criteria: Set it on the settings form at /admin/config/services/styled_google_map (route styled_google_map.settings),
    stored in config object styled_google_map.settings under styled_google_map_google_apikey. The auth
    method key styled_google_map_google_auth_method is 1 = API Key or 2 = Google Maps API for Work (which
    uses styled_google_map_google_client_id).
  bundle: styled_google_map
  rubric_ref: rubric/styled_google_map_styled_google_map_apikey_where@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: styled_google_map-formatter-id
  input: I have a geofield on my Article content type and I want to display it as a Styled Google Map.
    What is the field formatter's machine id and which field type does it apply to?
  criteria: Use the styled_google_map_default field formatter on Manage display; it applies only to fields
    of type geofield. For many markers from a View instead, use the Views style whose id is styled_google_map.
  bundle: styled_google_map
  rubric_ref: rubric/styled_google_map_styled_google_map_formatter_id@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: styled_google_map-alter-hook
  input: Which hook does styled_google_map provide to let me change the markers and map settings of a
    Views-based map in PHP before it renders, and what data does it receive?
  criteria: Implement hook_styled_google_map_views_style_alter(array &$variables). It receives $variables['map_settings']
    (mutable — settings plus a 'locations' array of every marker) and $variables['context'] ('view' and
    'options', read-only, for conditions).
  bundle: styled_google_map
  rubric_ref: rubric/styled_google_map_styled_google_map_alter_hook@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: styled_google_map-known-apikey
  input: This Drupal site already has a Google Maps API key configured for the styled_google_map module.
    Inspect the live configuration and tell me the exact API key value and which authentication method
    (API Key or Maps for Work) is selected.
  criteria: In config object styled_google_map.settings, styled_google_map_google_apikey is 'AIzaSyEVAL-known-key-001'
    and styled_google_map_google_auth_method is 1 (API Key).
  bundle: styled_google_map
  rubric_ref: rubric/styled_google_map_styled_google_map_known_apikey@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/styled_google_map-apikey-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/styled_google_map-apikey-cleanup.sh
- id: styled_google_map-known-field
  input: The Article content type on this site shows a location field as a Styled Google Map on its default
    display. Inspect the live view display and give the machine name of that geofield.
  criteria: 'It is field_sgm_known: in core.entity_view_display.node.article.default the field_sgm_known
    component uses formatter type styled_google_map_default (width 777px).'
  bundle: styled_google_map
  rubric_ref: rubric/styled_google_map_styled_google_map_known_field@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/styled_google_map-field-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/styled_google_map-field-cleanup.sh
- id: styled_google_map-show-formatter
  input: The Article content type has a geofield named field_sgm_map that is currently not displayed.
    Using the styled_google_map module, configure the default view display for Article so this field renders
    as a Styled Google Map. Apply the change to the live site.
  criteria: In core.entity_view_display.node.article.default set the field_sgm_map component formatter
    type to styled_google_map_default (e.g. $display->setComponent('field_sgm_map', ['type' => 'styled_google_map_default',
    ...])->save(), or pick 'Styled Google Map' on Manage display).
  bundle: styled_google_map
  rubric_ref: rubric/styled_google_map_styled_google_map_show_formatter@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/styled_google_map-formatter-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/styled_google_map-formatter-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/styled_google_map-formatter-verify.sh
- id: styled_google_map-set-apikey
  input: Configure the styled_google_map module to use the Google Maps API Key authentication method with
    the API key 'AIzaSyEVAL-set-me-999'. Apply the change to the live site's configuration.
  criteria: In config object styled_google_map.settings set styled_google_map_google_apikey to 'AIzaSyEVAL-set-me-999'
    and styled_google_map_google_auth_method to 1 (API Key), e.g. drush config:set styled_google_map.settings
    styled_google_map_google_apikey 'AIzaSyEVAL-set-me-999'.
  bundle: styled_google_map
  rubric_ref: rubric/styled_google_map_styled_google_map_set_apikey@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/styled_google_map-setkey-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/styled_google_map-setkey-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/styled_google_map-setkey-verify.sh
