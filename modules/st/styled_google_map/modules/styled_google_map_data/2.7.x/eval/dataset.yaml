metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: styled_google_map_data
  version: 2.7.x
  note: Example submodule that, on install, seeds the styled_google_map_demo real_estate entity type with
    Sacramento CSV data and three property-type terms (Condo, Multi-Family, Residential), and ships a
    'styled_google_map' View with pages /heatmap, /cluster-map, /cluster-map-spiderified, /map-controls.
    It cannot itself be enabled on this site because its exported View config depends on the svg_image
    module (not installed). Its medium/hard cases are therefore grounded in the exact live state its install
    produces on the (enabled) styled_google_map_demo real_estate entity type / real_estate vocabulary
    — verifiable with drush php:eval, no Google Maps API involved. Easy cases cover the module's paths
    and behavior from the docs.
questions:
- id: styled_google_map_data-example-pages
  input: The styled_google_map_data submodule ships a demo View with several example map pages. What are
    the URL paths of those example maps?
  criteria: The bundled 'styled_google_map' View exposes example pages at /heatmap, /cluster-map, /cluster-map-spiderified
    and /map-controls (plus a single-item display).
  bundle: styled_google_map_data
  rubric_ref: rubric/styled_google_map_data_styled_google_map_data_example_pages@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: styled_google_map_data-what-it-imports
  input: What does the styled_google_map_data module create on install, and which property-type taxonomy
    terms does it add?
  criteria: On install it creates three real_estate taxonomy terms (Condo, Multi-Family, Residential)
    with pin icons and batch-imports Sacramento property rows from csv/demo.csv into real_estate entities.
  bundle: styled_google_map_data
  rubric_ref: rubric/styled_google_map_data_styled_google_map_data_what_it_imports@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: styled_google_map_data-svg-dependency
  input: Why might enabling the styled_google_map_data module fail with an unmet-dependency error, and
    which module must be present first?
  criteria: Its exported View config (views.view.styled_google_map) depends on the svg_image module, so
    svg_image must be installed before styled_google_map_data can be enabled.
  bundle: styled_google_map_data
  rubric_ref: rubric/styled_google_map_data_styled_google_map_data_svg_dependency@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: styled_google_map_data-known-property
  input: This site has a real_estate demo property that mirrors a row the styled_google_map_data module
    imports. Inspect the live site and tell me the sale price of the real_estate entity named 'SGMD 3526
    HIGH ST'.
  criteria: The real_estate entity named 'SGMD 3526 HIGH ST' has price 59222.
  bundle: styled_google_map_data
  rubric_ref: rubric/styled_google_map_data_styled_google_map_data_known_property@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/styled_google_map_data-property-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/styled_google_map_data-property-cleanup.sh
- id: styled_google_map_data-known-types
  input: The styled_google_map_data module's property-type taxonomy terms have been loaded into the real_estate
    vocabulary on this site. Inspect the live vocabulary and list the property-type term names it contains.
  criteria: The real_estate vocabulary contains the property-type terms Condo, Multi-Family and Residential.
  bundle: styled_google_map_data
  rubric_ref: rubric/styled_google_map_data_styled_google_map_data_known_types@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/styled_google_map_data-types-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/styled_google_map_data-types-cleanup.sh
- id: styled_google_map_data-create-types
  input: 'Reproduce what the styled_google_map_data module does on install: create the three property-type
    taxonomy terms Condo, Multi-Family and Residential in the real_estate vocabulary, and save them to
    the live site.'
  criteria: Create three terms in vocabulary real_estate named Condo, Multi-Family and Residential, e.g.
    Term::create(['vid' => 'real_estate', 'name' => $name])->save() for each.
  bundle: styled_google_map_data
  rubric_ref: rubric/styled_google_map_data_styled_google_map_data_create_types@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/styled_google_map_data-build-types-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/styled_google_map_data-build-types-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/styled_google_map_data-build-types-verify.sh
- id: styled_google_map_data-import-property
  input: 'Import one property row the way styled_google_map_data does: create a published real_estate
    entity named ''SGMD Sacramento Home'' with price 59222 and a location point, and save it to the live
    site.'
  criteria: Create a real_estate entity name 'SGMD Sacramento Home', price 59222, status 1, with a geofield
    location, e.g. RealEstate::create(['name' => 'SGMD Sacramento Home', 'price' => 59222, 'status' =>
    1, 'location' => 'POINT (-121.43 38.63)'])->save();
  bundle: styled_google_map_data
  rubric_ref: rubric/styled_google_map_data_styled_google_map_data_import_property@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/styled_google_map_data-build-property-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/styled_google_map_data-build-property-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/styled_google_map_data-build-property-verify.sh
