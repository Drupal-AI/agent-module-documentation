rubrics:
- id: styled_google_map_data_styled_google_map_data_example_pages
  version: '1.0'
  applicable_bundles:
  - styled_google_map_data
  checks:
  - kind: must_contain_any
    values:
    - /heatmap
    - heatmap
    - /cluster-map
    - cluster-map
    - cluster-map-spiderified
    - /map-controls
    - map-controls
  scoring:
    combine: all_pass
- id: styled_google_map_data_styled_google_map_data_what_it_imports
  version: '1.0'
  applicable_bundles:
  - styled_google_map_data
  checks:
  - kind: must_contain_any
    values:
    - Condo
    - Multi-Family
    - Residential
    - real_estate
    - csv
  scoring:
    combine: all_pass
