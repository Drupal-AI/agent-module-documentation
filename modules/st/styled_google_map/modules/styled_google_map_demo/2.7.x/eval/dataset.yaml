metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: styled_google_map_demo
  version: 2.7.x
  note: Hidden demo submodule of styled_google_map. Its only substantive artifacts are a real_estate content
    entity type (base field 'location' is a geofield) and a real_estate taxonomy vocabulary (terms carry
    image field_icon). It has no configuration and no external dependencies, so all cases are grounded
    in live entity/taxonomy state verifiable with drush php:eval alone (no Google Maps API involved).
    Introspection reads back a known real_estate entity / term; execution creates a real_estate entity
    / term and verifies it exists.
questions:
- id: styled_google_map_demo-entity-type
  input: The styled_google_map_demo module ships a demo content entity type to show off the Styled Google
    Map features. What is the entity type's machine id, and what field type is its location field?
  criteria: It defines the content entity type real_estate (base table real_estate), whose 'location'
    base field is a geofield; the parent module renders that geofield as a styled map.
  bundle: styled_google_map_demo
  rubric_ref: rubric/styled_google_map_demo_styled_google_map_demo_entity_type@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: styled_google_map_demo-vocabulary
  input: In the styled_google_map_demo module, what taxonomy vocabulary is created, and what image field
    is added to its terms to act as a per-category map pin?
  criteria: It creates the real_estate taxonomy vocabulary; each term has an image field field_icon, used
    as the marker/pin for that property category on the map.
  bundle: styled_google_map_demo
  rubric_ref: rubric/styled_google_map_demo_styled_google_map_demo_vocabulary@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: styled_google_map_demo-permissions
  input: Which permissions does the styled_google_map_demo module define for managing its demo entities?
  criteria: 'It defines: administer real estate entities, add real estate entities, edit real estate entities,
    delete real estate entities, view published real estate entities, view unpublished real estate entities.'
  bundle: styled_google_map_demo
  rubric_ref: rubric/styled_google_map_demo_styled_google_map_demo_permissions@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: styled_google_map_demo-known-entity
  input: This site has one real_estate demo entity created for testing. Inspect the live site and tell
    me its name and its price value.
  criteria: There is a real_estate entity named 'SGM Demo Villa 42' with price 123456 (query the real_estate
    entity storage).
  bundle: styled_google_map_demo
  rubric_ref: rubric/styled_google_map_demo_styled_google_map_demo_known_entity@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/styled_google_map_demo-entity-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/styled_google_map_demo-entity-cleanup.sh
- id: styled_google_map_demo-known-term
  input: The real_estate taxonomy vocabulary on this site has a term added for testing. Inspect the live
    vocabulary and give me the name of that term.
  criteria: The real_estate vocabulary contains a term named 'SGM Demo Type Alpha'.
  bundle: styled_google_map_demo
  rubric_ref: rubric/styled_google_map_demo_styled_google_map_demo_known_term@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/styled_google_map_demo-term-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/styled_google_map_demo-term-cleanup.sh
- id: styled_google_map_demo-create-entity
  input: Using the styled_google_map_demo module's real_estate entity type, create a published real_estate
    entity named 'SGM Task Estate' with a location point, and save it to the live site.
  criteria: Create and save a real_estate entity with name 'SGM Task Estate' (status 1), e.g. RealEstate::create(['name'
    => 'SGM Task Estate', 'status' => 1, 'location' => 'POINT (-121.43 38.63)'])->save();
  bundle: styled_google_map_demo
  rubric_ref: rubric/styled_google_map_demo_styled_google_map_demo_create_entity@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/styled_google_map_demo-build-entity-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/styled_google_map_demo-build-entity-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/styled_google_map_demo-build-entity-verify.sh
- id: styled_google_map_demo-create-term
  input: In the real_estate taxonomy vocabulary provided by styled_google_map_demo, create a term named
    'SGM Task Type' and save it to the live site.
  criteria: Create and save a taxonomy term in vocabulary real_estate named 'SGM Task Type', e.g. Term::create(['vid'
    => 'real_estate', 'name' => 'SGM Task Type'])->save();
  bundle: styled_google_map_demo
  rubric_ref: rubric/styled_google_map_demo_styled_google_map_demo_create_term@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/styled_google_map_demo-build-term-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/styled_google_map_demo-build-term-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/styled_google_map_demo-build-term-verify.sh
