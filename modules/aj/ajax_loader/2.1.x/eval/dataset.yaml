metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: ajax_loader
  version: 2.1.x
  note: 'Ajax Loader replaces Drupal''s core AJAX throbber with a configurable animated spinner. Everything
    lives in the ajax_loader.settings config object (keys: throbber, throbber_position, hide_ajax_message,
    always_fullscreen, show_admin_paths) and a Throbber plugin type with 12 built-ins. Easy cases are
    response-graded recipe facts; medium cases save a known config to the live site and ask the agent
    to read it back (cleanup restores baseline); hard cases clear the config and require the agent to
    configure the throbber, verified against live config.'
questions:
- id: ajax_loader-throbber-options
  input: On a Drupal 11 site with the Ajax Loader module, which config key selects the active animated
    throbber, and what are some of the built-in throbber plugin IDs I can set it to?
  criteria: Set the 'throbber' key on ajax_loader.settings to a Throbber plugin ID. Built-ins include
    throbber_pulse, throbber_wave, throbber_circle, throbber_fading_circle, throbber_chasing_dots, throbber_double_bounce,
    throbber_three_bounce, throbber_rotating_plane, throbber_cube_grid, throbber_folding_cube, throbber_wandering_cubes
    and throbber_swing (12 total).
  bundle: ajax_loader
  rubric_ref: rubric/ajax_loader_ajax_loader_throbber_options@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: ajax_loader-config-keys
  input: For the Ajax Loader module, list the keys stored in the ajax_loader.settings config object and
    their default values, including which key controls where in the DOM the throbber is inserted.
  criteria: 'ajax_loader.settings holds: throbber (plugin ID, default null), hide_ajax_message (bool,
    false), always_fullscreen (bool, false), show_admin_paths (bool, false), and throbber_position (CSS
    selector for the insertion point, default ''body'').'
  bundle: ajax_loader
  rubric_ref: rubric/ajax_loader_ajax_loader_config_keys@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: ajax_loader-settings-route
  input: Where is the Ajax Loader settings form (admin path and route name) and which permission gates
    it?
  criteria: The form is at /admin/config/user-interface/ajax-loader (route ajax_loader.settings, under
    Admin → Configuration → User interface), gated by the 'administer ajax loader' permission.
  bundle: ajax_loader
  rubric_ref: rubric/ajax_loader_ajax_loader_settings_route@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: ajax_loader-active-throbber
  input: On this live Drupal site, which Ajax Loader throbber is currently active and which CSS selector
    / DOM position is it configured to be inserted at? Inspect the running configuration.
  criteria: 'The active throbber is throbber_folding_cube (Folding cube) and throbber_position is set
    to #main-content, per ajax_loader.settings (hide_ajax_message is also enabled).'
  bundle: ajax_loader
  rubric_ref: rubric/ajax_loader_ajax_loader_active_throbber@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/ajax_loader-active-throbber-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/ajax_loader-active-throbber-cleanup.sh
- id: ajax_loader-overlay-state
  input: On this live Drupal site, is the Ajax Loader throbber configured to display as a full-screen
    overlay, and does it also show on admin pages? Which throbber is set? Check the current configuration.
  criteria: Yes — always_fullscreen is TRUE (full-screen overlay) and show_admin_paths is TRUE (also shown
    on admin pages); the active throbber is throbber_wave, per ajax_loader.settings.
  bundle: ajax_loader
  rubric_ref: rubric/ajax_loader_ajax_loader_overlay_state@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/ajax_loader-overlay-state-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/ajax_loader-overlay-state-cleanup.sh
- id: ajax_loader-pulse-body
  input: On this Drupal 11 site, configure the Ajax Loader module to use the Pulse throbber (plugin ID
    throbber_pulse), inserted at the default 'body' selector. Persist it to the ajax_loader.settings config
    and clear caches so it takes effect.
  criteria: ajax_loader.settings has throbber=throbber_pulse and throbber_position=body (e.g. via `drush
    cset ajax_loader.settings throbber throbber_pulse -y` then `drush cr`).
  bundle: ajax_loader
  rubric_ref: rubric/ajax_loader_ajax_loader_pulse_body@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/ajax_loader-pulse-body-reset.sh
    verify: agent-module-documentation/evaluation/verify/ajax_loader-pulse-body-verify.sh
- id: ajax_loader-fullscreen-fold
  input: On this Drupal 11 site, configure Ajax Loader to use the Folding cube throbber (throbber_folding_cube)
    shown as a full-screen overlay (always_fullscreen) with the core AJAX loading message hidden (hide_ajax_message).
    Save it to ajax_loader.settings and clear caches.
  criteria: ajax_loader.settings has throbber=throbber_folding_cube, always_fullscreen=true and hide_ajax_message=true,
    then caches cleared.
  bundle: ajax_loader
  rubric_ref: rubric/ajax_loader_ajax_loader_fullscreen_fold@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/ajax_loader-fullscreen-fold-reset.sh
    verify: agent-module-documentation/evaluation/verify/ajax_loader-fullscreen-fold-verify.sh
