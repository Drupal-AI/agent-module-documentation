rubrics:
- id: ajax_loader_ajax_loader_throbber_options
  version: '1.0'
  applicable_bundles:
  - ajax_loader
  checks:
  - kind: must_contain_any
    values:
    - throbber_pulse
    - throbber_wave
    - throbber_folding_cube
    - throbber_circle
  scoring:
    combine: all_pass
- id: ajax_loader_ajax_loader_config_keys
  version: '1.0'
  applicable_bundles:
  - ajax_loader
  checks:
  - kind: must_contain_any
    values:
    - throbber_position
    - always_fullscreen
    - hide_ajax_message
    - show_admin_paths
  scoring:
    combine: all_pass
- id: ajax_loader_ajax_loader_settings_route
  version: '1.0'
  applicable_bundles:
  - ajax_loader
  checks:
  - kind: must_contain_any
    values:
    - /admin/config/user-interface/ajax-loader
    - ajax_loader.settings
    - administer ajax loader
  scoring:
    combine: all_pass
- id: ajax_loader_ajax_loader_active_throbber
  version: '1.0'
  applicable_bundles:
  - ajax_loader
  checks:
  - kind: must_contain_any
    values:
    - throbber_folding_cube
  scoring:
    combine: all_pass
- id: ajax_loader_ajax_loader_overlay_state
  version: '1.0'
  applicable_bundles:
  - ajax_loader
  checks:
  - kind: must_contain_any
    values:
    - throbber_wave
  scoring:
    combine: all_pass
- id: ajax_loader_ajax_loader_pulse_body
  version: '1.0'
  applicable_bundles:
  - ajax_loader
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
- id: ajax_loader_ajax_loader_fullscreen_fold
  version: '1.0'
  applicable_bundles:
  - ajax_loader
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
