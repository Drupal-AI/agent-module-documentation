    verify: agent-module-documentation/evaluation/verify/ajax_comments-set-autoclose-verify.sh
- id: ajax-comments-disable-scroll
  input: On this Drupal site, AJAX Comments currently scrolls the page to the affected comment after each
    AJAX action. Turn that scrolling behavior off. Apply the change to the live site.
  criteria: In ajax_comments.settings set enable_scroll to false.
  bundle: ajax_comments
