metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: ajax_comments
  version: 1.0.x
  note: AJAX Comments has a global config object ajax_comments.settings (booleans notify [default true],
    enable_scroll [default true], reply_autoclose [default false]) at route ajax_comments.settings (admin/config/content/ajax_comments),
    plus a per-comment-field third-party setting third_party_settings.ajax_comments.enable_ajax_comments
    (default '1') on the comment field's display component. Medium cases change ONE global setting from
    its default and ask the agent to identify which one differs (discoverable, grades on the setting name);
    hard cases set a known baseline and verify exact boolean values via drush cget. Cleanup restores shipped
    defaults (notify=true, enable_scroll=true, reply_autoclose=false).
questions:
- id: ajax-comments-settings
  input: On a Drupal site with the AJAX Comments module, what is the config object for its global settings,
    at what admin path is the settings form, and what are the three options it offers?
  criteria: 'Config object ajax_comments.settings at admin/config/content/ajax_comments (route ajax_comments.settings).
    Options: notify (message after posting), enable_scroll (scroll to the comment), reply_autoclose (auto-close
    other open reply forms).'
  bundle: ajax_comments
  rubric_ref: rubric/ajax_comments_ajax_comments_settings@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: ajax-comments-per-field
  input: With AJAX Comments installed, how do I turn AJAX behavior on or off for a specific comment field,
    and is it on by default?
  criteria: It is enabled by default (the third-party setting enable_ajax_comments defaults to '1'). Toggle
    it on the comment field's display settings; it is stored as third_party_settings.ajax_comments.enable_ajax_comments
    on the comment field's formatter component in the entity_view_display.
  bundle: ajax_comments
  rubric_ref: rubric/ajax_comments_ajax_comments_per_field@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: ajax-comments-dependency
  input: What core module does AJAX Comments depend on, and does it define its own permissions for who
    can post/edit comments via AJAX?
  criteria: It depends on the core Comment module. It defines no permissions of its own; access to the
    AJAX add/reply/edit/delete endpoints is governed by core comment entity access (post comments, edit
    own comments, administer comments, etc.).
  bundle: ajax_comments
  rubric_ref: rubric/ajax_comments_ajax_comments_dependency@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: ajax-comments-which-changed
  input: On this Drupal site, exactly one of AJAX Comments' three global settings has been changed from
    its shipped default. Inspect the live configuration and tell me which setting differs and its current
    value.
  criteria: 'reply_autoclose has been set to true (its shipped default is false); notify and enable_scroll
    are still true. Read with: drush cget ajax_comments.settings.'
  bundle: ajax_comments
  rubric_ref: rubric/ajax_comments_ajax_comments_which_changed@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/ajax_comments-which-changed-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/ajax_comments-which-changed-cleanup.sh
- id: ajax-comments-notify-off
  input: On this Drupal site, AJAX Comments has been configured to NOT do one thing it does by default.
    Inspect the live ajax_comments configuration and name the setting that has been turned off.
  criteria: 'notify has been set to false (default true), so no status message is shown after posting
    a comment via AJAX. Read with: drush cget ajax_comments.settings notify.'
  bundle: ajax_comments
  rubric_ref: rubric/ajax_comments_ajax_comments_notify_off@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/ajax_comments-notify-off-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/ajax_comments-notify-off-cleanup.sh
- id: ajax-comments-set-autoclose
  input: On this Drupal site, configure AJAX Comments so that opening a reply form automatically closes
    any other open reply form, and so that NO notification message is shown after a comment is posted.
    Apply the change to the live site.
  criteria: In ajax_comments.settings set reply_autoclose to true and notify to false (via the settings
    form or configFactory getEditable set save).
  bundle: ajax_comments
  rubric_ref: rubric/ajax_comments_ajax_comments_set_autoclose@1.0
