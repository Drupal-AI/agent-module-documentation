rubrics:
- id: ajax_comments_ajax_comments_settings
  version: '1.0'
  applicable_bundles:
  - ajax_comments
  checks:
  - kind: must_contain_any
    values:
    - ajax_comments.settings
    - notify
    - enable_scroll
    - reply_autoclose
    - admin/config/content/ajax_comments
  scoring:
    combine: all_pass
- id: ajax_comments_ajax_comments_per_field
  version: '1.0'
  applicable_bundles:
  - ajax_comments
  checks:
  - kind: must_contain_any
    values:
    - enable_ajax_comments
    - third_party_settings
    - display settings
    - Manage display
  scoring:
    combine: all_pass
- id: ajax_comments_ajax_comments_dependency
  version: '1.0'
  applicable_bundles:
  - ajax_comments
  checks:
  - kind: must_contain_any
    values:
    - comment
  scoring:
    combine: all_pass
- id: ajax_comments_ajax_comments_which_changed
  version: '1.0'
  applicable_bundles:
  - ajax_comments
  checks:
  - kind: must_contain_any
    values:
    - reply_autoclose
  scoring:
    combine: all_pass
- id: ajax_comments_ajax_comments_notify_off
  version: '1.0'
  applicable_bundles:
  - ajax_comments
  checks:
  - kind: must_contain_any
    values:
    - notify
  scoring:
    combine: all_pass
- id: ajax_comments_ajax_comments_set_autoclose
  version: '1.0'
  applicable_bundles:
  - ajax_comments
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
- id: ajax_comments_ajax_comments_disable_scroll
  version: '1.0'
  applicable_bundles:
  - ajax_comments
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
