rubrics:
- id: smtp_smtp_enable_config_keys
  version: '1.0'
  applicable_bundles:
  - smtp
  checks:
  - kind: must_contain_any
    values:
    - smtp_on
    - smtp_host
    - smtp_port
    - smtp_username
    - smtp_password
  scoring:
    combine: all_pass
- id: smtp_smtp_admin_route
  version: '1.0'
  applicable_bundles:
  - smtp
  checks:
  - kind: must_contain_any
    values:
    - /admin/config/system/smtp
    - admin/config/system/smtp
    - smtp.config
  scoring:
    combine: all_pass
- id: smtp_smtp_mail_plugin
  version: '1.0'
  applicable_bundles:
  - smtp
