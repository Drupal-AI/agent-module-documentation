# Generated from evals.json by evaluation/to_commons.py.
# Edit evals.json and rerun the script; do not edit this file.
metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: smtp
  version: 1.4.x
  note: SMTP is configured entirely through the smtp.settings config object and a single settings form;
    there is no plugin type to implement and no drush command set, so all cases are `recipe` (response-graded),
    not `execution` (live-state).
questions:
- id: smtp-enable-config-keys
  input: On a Drupal 11 site with the SMTP Authentication Support module installed, I want to route all
    outgoing mail through smtp.example.com on port 587 with a username and password. Which config keys
    in the smtp.settings config object do I set to turn SMTP on and point it at that server, and how do
    I authenticate? Name the keys.
  criteria: 'In smtp.settings set smtp_on: true (master switch), smtp_host: ''smtp.example.com'', smtp_port:
    ''587'', and authenticate with smtp_username / smtp_password.'
  bundle: smtp
  rubric_ref: rubric/smtp_smtp_enable_config_keys@1.0
  tags:
  - mode:recipe
- id: smtp-admin-route
  input: Where in the Drupal admin UI do I configure the SMTP Authentication Support module? Give the
    admin path.
  criteria: Admin -> Configuration -> System -> SMTP Authentication Support at /admin/config/system/smtp
    (route smtp.config).
  bundle: smtp
  rubric_ref: rubric/smtp_smtp_admin_route@1.0
  tags:
  - mode:recipe
- id: smtp-mail-plugin
  input: How does the SMTP module actually deliver Drupal's mail through an SMTP server? What kind of
    Drupal plugin does it provide and what underlying library does it use?
  criteria: It provides a core Mail plugin, Drupal\smtp\Plugin\Mail\SMTPMailSystem, that wraps the bundled
    phpmailer/phpmailer library; when smtp_on is true it becomes the active mail backend.
  bundle: smtp
  rubric_ref: rubric/smtp_smtp_mail_plugin@1.0
  tags:
  - mode:recipe
- id: smtp-protocol-encryption
  input: I need to encrypt the SMTP transport with TLS on a Drupal site using the SMTP module. Which smtp.settings
    config key selects the encryption method, and what are its accepted values?
  criteria: smtp_protocol selects the encryption; accepted values are standard, ssl, or tls (set it to
    tls). smtp_autotls can additionally upgrade the connection opportunistically.
  bundle: smtp
  rubric_ref: rubric/smtp_smtp_protocol_encryption@1.0
  tags:
  - mode:recipe
- id: smtp-test-email
  input: After configuring the SMTP module I want to verify mail actually goes out before trusting it.
    What built-in feature does the module offer, and which config key holds the destination for it?
  criteria: The settings form has a send-a-test-email button that sends to the address in smtp_test_address;
    connectivity is checked by the ConnectionTester service.
  bundle: smtp
  rubric_ref: rubric/smtp_smtp_test_email@1.0
  tags:
  - mode:recipe
- id: smtp-permission
  input: Which Drupal permission does the SMTP Authentication Support module define to let a role reach
    and change its settings?
  criteria: The single permission 'administer smtp module'.
  bundle: smtp
  rubric_ref: rubric/smtp_smtp_permission@1.0
  tags:
  - mode:recipe
- id: smtp-reroute-staging
  input: On a Drupal staging site I want every outgoing email redirected to a single QA inbox so real
    users are never mailed. Which smtp.settings config key does the SMTP module provide for this?
  criteria: 'smtp_reroute_address: when set, the SMTP plugin forces every message''s recipient to that
    address (staging safety).'
  bundle: smtp
  rubric_ref: rubric/smtp_smtp_reroute_staging@1.0
  tags:
  - mode:recipe
- id: smtp-selective-mailsystem
  input: I only want SMTP used for some of my Drupal site's mail, not every message. How do I do that
    with the SMTP module rather than enabling it globally?
  criteria: Install drupal/mailsystem and assign the SMTP mail plugin to specific modules/keys there,
    instead of turning smtp_on on globally.
  bundle: smtp
  rubric_ref: rubric/smtp_smtp_selective_mailsystem@1.0
  tags:
  - mode:recipe
