metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: smart_title
  version: 1.0.x
  note: 'Smart Title exposes an entity''s label as a configurable extra field ''smart_title'' on Manage
    display. Two layers of real state: (1) eligible bundles = ''entity_type:bundle'' strings in smart_title.settings.smart_title;
    (2) per view display, third_party_settings.smart_title.enabled + third_party_settings.smart_title.settings
    (smart_title__tag, smart_title__classes[], smart_title__link) + a ''smart_title'' component, all on
    core.entity_view_display.<entity>.<bundle>.<mode>. No configure route on the base module (the smart_title_ui
    submodule adds it). All medium/hard cases are grounded in that config: introspection reads back the
    enabled display / tag / eligible bundles; execution enables Smart Title on node.article.default and
    sets its tag/link, verified against the live entity_view_display.'
questions:
- id: smart_title-where-stored
  input: In the Drupal smart_title module, once Smart Title is turned on for a view mode, where and how
    is that recorded in configuration?
  criteria: 'It is stored on the view mode''s entity_view_display config entity (core.entity_view_display.<entity>.<bundle>.<mode>)
    as third_party_settings.smart_title.enabled: true, plus a ''smart_title'' component placed in a region
    and format settings under third_party_settings.smart_title.settings.'
  bundle: smart_title
  rubric_ref: rubric/smart_title_smart_title_where_stored@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: smart_title-eligible-bundles-key
  input: Before Smart Title appears on a content type's Manage display form, the bundle has to be made
    eligible. Which configuration object and key list the eligible bundles, and in what format are the
    entries?
  criteria: The config object smart_title.settings has a key 'smart_title' holding a flat list of '<entity_type>:<bundle>'
    strings, e.g. 'node:article'. The Smart Title UI submodule manages this list.
  bundle: smart_title
  rubric_ref: rubric/smart_title_smart_title_eligible_bundles_key@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: smart_title-format-settings
  input: What aspects of the rendered title can Smart Title configure per view mode, and which setting
    keys hold them?
  criteria: 'It configures the wrapper HTML tag (smart_title__tag: h1..h6/div/span), CSS classes (smart_title__classes,
    an array), and whether the title links to the entity (smart_title__link, boolean) — stored under third_party_settings.smart_title.settings.'
  bundle: smart_title
  rubric_ref: rubric/smart_title_smart_title_format_settings@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: smart_title-known-display
  input: On this Drupal site, Smart Title is enabled on the Article content type's default view display.
    Inspect the live display configuration and state which HTML tag Smart Title wraps the title in.
  criteria: In core.entity_view_display.node.article.default, third_party_settings.smart_title.settings.smart_title__tag
    is 'h1' (and smart_title__link is false).
  bundle: smart_title
  rubric_ref: rubric/smart_title_smart_title_known_display@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/smart_title-known-display-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/smart_title-known-display-cleanup.sh
- id: smart_title-eligible-bundles
  input: On this site, which content-entity bundles have been made eligible for Smart Title? Inspect the
    live configuration and list them.
  criteria: smart_title.settings.smart_title lists node:article and node:page as the eligible bundles.
  bundle: smart_title
  rubric_ref: rubric/smart_title_smart_title_eligible_bundles@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/smart_title-eligible-bundles-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/smart_title-eligible-bundles-cleanup.sh
- id: smart_title-enable-display
  input: On this Drupal site, the Article content type is already eligible for Smart Title (node:article
    is in smart_title.settings). Enable Smart Title on Article's default view display and place the title
    element as a visible component, applying the change to the live site.
  criteria: On core.entity_view_display.node.article.default set third_party_settings.smart_title.enabled
    = TRUE and add a 'smart_title' component (region/weight) — e.g. $vd->setThirdPartySetting('smart_title','enabled',TRUE)->setComponent('smart_title',['region'=>'content','weight'=>-5])->save().
  bundle: smart_title
  rubric_ref: rubric/smart_title_smart_title_enable_display@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/smart_title-enable-display-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/smart_title-enable-display-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/smart_title-enable-display-verify.sh
- id: smart_title-set-tag
  input: On this site Smart Title is enabled on Article's default view display but currently wraps the
    title in an h2 that links to the node. Reconfigure Smart Title so the title is wrapped in an h1 and
    is NOT linked to the entity. Apply the change live.
  criteria: In core.entity_view_display.node.article.default set third_party_settings.smart_title.settings.smart_title__tag
    = 'h1' and smart_title__link = FALSE and save.
  bundle: smart_title
  rubric_ref: rubric/smart_title_smart_title_set_tag@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/smart_title-set-tag-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/smart_title-set-tag-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/smart_title-set-tag-verify.sh
