metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: smart_title_ui
  version: 1.0.x
  note: 'Smart Title UI is a trivial admin submodule: one settings form at /admin/config/content/smart-title
    (route smart_title_ui.settings, permission ''administer smart title'') that writes the eligible bundle
    list into the parent module''s smart_title.settings.smart_title (''entity_type:bundle'' strings).
    It stores no config of its own. The medium case reuses the parent''s eligible-bundle config; the hard
    case writes node:article into smart_title.settings as the form would, verified against live config.'
questions:
- id: smart_title_ui-route-path
  input: What is the route name and admin path of the Smart Title settings page provided by smart_title_ui?
  criteria: Route smart_title_ui.settings at path /admin/config/content/smart-title (title 'Smart Title
    Settings').
  bundle: smart_title_ui
  rubric_ref: rubric/smart_title_ui_smart_title_ui_route_path@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: smart_title_ui-permission
  input: Which permission gates the Smart Title UI settings form?
  criteria: The 'administer smart title' permission ('Manage Smart Title configuration').
  bundle: smart_title_ui
  rubric_ref: rubric/smart_title_ui_smart_title_ui_permission@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: smart_title_ui-what-it-writes
  input: When you submit the Smart Title UI settings form, what configuration does it change?
  criteria: It writes the checked bundles as '<entity_type>:<bundle>' strings into smart_title.settings.smart_title
    (the parent module's config), unsets Smart Title third-party settings on displays of any unchecked
    bundle, and invalidates the entity_field_info cache. It stores no config of its own.
  bundle: smart_title_ui
  rubric_ref: rubric/smart_title_ui_smart_title_ui_what_it_writes@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: smart_title_ui-eligible-bundles
  input: On this Drupal site, which bundles has the Smart Title UI made eligible for Smart Title? Inspect
    the live configuration and list them.
  criteria: smart_title.settings.smart_title (managed by the Smart Title UI form) lists node:article and
    node:page.
  bundle: smart_title_ui
  rubric_ref: rubric/smart_title_ui_smart_title_ui_eligible_bundles@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/smart_title-eligible-bundles-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/smart_title-eligible-bundles-cleanup.sh
- id: smart_title_ui-enable-bundle
  input: On this Drupal site, use Smart Title (via its UI submodule's settings) to make the Article content
    type eligible for Smart Title. Apply the change to the live site.
  criteria: Add 'node:article' to smart_title.settings.smart_title (what submitting the /admin/config/content/smart-title
    form with Article checked does).
  bundle: smart_title_ui
  rubric_ref: rubric/smart_title_ui_smart_title_ui_enable_bundle@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/smart_title_ui-enable-bundle-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/smart_title_ui-enable-bundle-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/smart_title_ui-enable-bundle-verify.sh
