rubrics:
- id: smart_title_ui_smart_title_ui_route_path
  version: '1.0'
  applicable_bundles:
  - smart_title_ui
  checks:
  - kind: must_contain_any
    values:
    - smart_title_ui.settings
    - /admin/config/content/smart-title
    - admin/config/content/smart-title
  scoring:
    combine: all_pass
- id: smart_title_ui_smart_title_ui_permission
  version: '1.0'
  applicable_bundles:
  - smart_title_ui
  checks:
  - kind: must_contain_any
    values:
    - administer smart title
  scoring:
    combine: all_pass
- id: smart_title_ui_smart_title_ui_what_it_writes
  version: '1.0'
  applicable_bundles:
  - smart_title_ui
  checks:
  - kind: must_contain_any
    values:
    - smart_title.settings
    - entity_type:bundle
    - node:article
  scoring:
    combine: all_pass
- id: smart_title_ui_smart_title_ui_eligible_bundles
  version: '1.0'
  applicable_bundles:
  - smart_title_ui
  checks:
  - kind: must_contain_any
    values:
    - node:article
    - node:page
  scoring:
    combine: all_pass
- id: smart_title_ui_smart_title_ui_enable_bundle
  version: '1.0'
  applicable_bundles:
  - smart_title_ui
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
