rubrics:
- id: smart_sql_idmap_smart_sql_idmap_optin
  version: '1.0'
  applicable_bundles:
  - smart_sql_idmap
  checks:
  - kind: must_contain_any
    values:
    - smart_sql
    - idMap
  scoring:
    combine: all_pass
- id: smart_sql_idmap_smart_sql_idmap_why
  version: '1.0'
  applicable_bundles:
  - smart_sql_idmap
  checks:
  - kind: must_contain_any
    values:
    - truncat
    - '63'
    - collision
    - collide
    - same table
    - long
  scoring:
    combine: all_pass
- id: smart_sql_idmap_smart_sql_idmap_plugin_type
  version: '1.0'
