metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: smart_sql_idmap
  version: 1.2.x
  note: 'smart_sql_idmap ships exactly one migrate id_map plugin (id ''smart_sql'', class SmartSql extends
    core Sql), opted into per migration with idMap: {plugin: smart_sql}. It has no config object, no schema,
    no services, no permissions, no admin UI. This site''s migration PLUGIN MANAGER discovery is broken
    by pathauto, so medium/hard cases are grounded in the id_map plugin definition and in migrate_plus.migration.*
    CONFIG ENTITIES (created/read/deleted via entity storage), NOT in live migration executions. The id_map
    manager (plugin.manager.migrate.id_map) does list smart_sql, and migrate_plus migration config entities
    carry the idMap key that the plugin id is read from.'
questions:
- id: smart_sql_idmap-optin
  input: I have a Drupal migration whose plugin ID is very long. How do I make it use the Smart SQL ID
    Map module's id map instead of core's default? Show exactly what to add to the migration definition.
  criteria: 'Add an idMap key to the migration definition: idMap:\n  plugin: smart_sql . Works the same
    in a code migration YAML and in a migrate_plus.migration config entity; source/process/destination
    are unchanged.'
  bundle: smart_sql_idmap
  rubric_ref: rubric/smart_sql_idmap_smart_sql_idmap_optin@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: smart_sql_idmap-why
  input: What core Drupal migrate problem does the smart_sql_idmap module work around, and why does it
    matter for migrations with long plugin IDs?
  criteria: 'Core derives map/message table names and truncates them to MySQL''s 63-character identifier
    limit, so two long-id migrations can collapse to the same table name and corrupt id lookups (issue
    #2845340). smart_sql computes shorter, md5-suffixed, collision-free table names; it also fixes getRowByDestination()/rollback
    (#3227549, #3227660).'
  bundle: smart_sql_idmap
  rubric_ref: rubric/smart_sql_idmap_smart_sql_idmap_why@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: smart_sql_idmap-plugin-type
  input: In the smart_sql_idmap module, what kind of migrate plugin is provided and what is its plugin
    ID and class?
  criteria: It provides a migrate id_map plugin with id 'smart_sql' (annotation @PluginID("smart_sql")),
    class Drupal\smart_sql_idmap\Plugin\migrate\id_map\SmartSql, which extends core's id_map\Sql plugin.
  bundle: smart_sql_idmap
  rubric_ref: rubric/smart_sql_idmap_smart_sql_idmap_plugin_type@1.0
  tags:
  - mode:recipe
  - difficulty:easy
