metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: smart_ip_abstract_web_service
  version: 5.0.x
  note: Smart IP data-source submodule. 'Abstract' is the vendor brand (abstractapi.com), NOT an abstract
    PHP base class. It registers the Smart IP source id 'abstract_web_service' via an event subscriber
    (SmartIpEventSubscriber extends the parent's SmartIpEventSubscriberBase; sourceId()/configName()).
    It becomes active only when smart_ip.settings:data_source == 'abstract_web_service'. Its own settings
    live in smart_ip_abstract_web_service.settings (version:int=1, api_key:string required). Lookups call
    AbstractWebService::V1_URL (https://ipgeolocation.abstractapi.com/v1/) per request and need a paid/registered
    API key, so medium/hard tiers are grounded in the source-selection + api_key CONFIG (smart_ip.settings
    + smart_ip_abstract_web_service.settings), never live geolocation calls.
questions:
- id: smart_ip_abstract_web_service-activate-recipe
  input: On a Drupal 11 site with the smart_ip_abstract_web_service submodule enabled, which Smart IP
    config key and value make the Abstract IP Geolocation web service the active geolocation data source?
  criteria: Set smart_ip.settings:data_source to 'abstract_web_service' (the source id this submodule
    contributes). e.g. drush config:set smart_ip.settings data_source abstract_web_service -y.
  bundle: smart_ip_abstract_web_service
  rubric_ref: rubric/smart_ip_abstract_web_service_smart_ip_abstract_web_service_activate_recipe@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: smart_ip_abstract_web_service-settings-recipe
  input: What settings does the smart_ip_abstract_web_service submodule store, in which config object,
    and what web-service endpoint does it call?
  criteria: It stores version (integer, only 1) and api_key (required) in the config object smart_ip_abstract_web_service.settings.
    Lookups hit AbstractWebService::V1_URL = https://ipgeolocation.abstractapi.com/v1/. Form validation
    blocks selecting the source without an API key.
  bundle: smart_ip_abstract_web_service
  rubric_ref: rubric/smart_ip_abstract_web_service_smart_ip_abstract_web_service_settings_recipe@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: smart_ip_abstract_web_service-source-contract-recipe
  input: How does the smart_ip_abstract_web_service submodule plug into Smart IP as a data source — what
    class does it extend and what identifies the source?
  criteria: It provides an event subscriber SmartIpEventSubscriber that extends the parent Drupal\smart_ip\SmartIpEventSubscriberBase
    (which implements SmartIpDataSourceInterface). sourceId() returns 'abstract_web_service' and configName()
    returns 'smart_ip_abstract_web_service.settings'; processQuery(), formSettings(), validateFormSettings(),
    submitFormSettings() etc. implement the source contract.
  bundle: smart_ip_abstract_web_service
  rubric_ref: rubric/smart_ip_abstract_web_service_smart_ip_abstract_web_service_source_contract_recipe@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: smart_ip_abstract_web_service-apikey-introspect
  input: This Drupal site has the Abstract IP Geolocation Smart IP data source configured. Inspect the
    live configuration and report the API key currently stored for it.
  criteria: The key is abstract_test_key_9f3a, stored at smart_ip_abstract_web_service.settings:api_key
    (read it with drush config:get smart_ip_abstract_web_service.settings api_key).
  bundle: smart_ip_abstract_web_service
  rubric_ref: rubric/smart_ip_abstract_web_service_smart_ip_abstract_web_service_apikey_introspect@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/smart_ip_abstract_web_service-apikey-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/smart_ip_abstract_web_service-apikey-cleanup.sh
- id: smart_ip_abstract_web_service-activate-execute
  input: On this Drupal site, configure Smart IP to use the Abstract IP Geolocation web service (the smart_ip_abstract_web_service
    submodule) as its active geolocation data source, and apply the change to the live site.
  criteria: Set smart_ip.settings:data_source to 'abstract_web_service' (e.g. drush config:set smart_ip.settings
    data_source abstract_web_service -y). In production you would also store an Abstract api_key; the
    verify checks only the source selection.
  bundle: smart_ip_abstract_web_service
  rubric_ref: rubric/smart_ip_abstract_web_service_smart_ip_abstract_web_service_activate_execute@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/smart_ip_abstract_web_service-activate-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/smart_ip_abstract_web_service-activate-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/smart_ip_abstract_web_service-activate-verify.sh
