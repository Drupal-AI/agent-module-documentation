- id: smart_ip_ipinfodb_web_service-activate-execute
  input: On this Drupal site, configure Smart IP to use the IPInfoDB web service (the smart_ip_ipinfodb_web_service
    submodule) as its active geolocation data source, and apply the change to the live site.
