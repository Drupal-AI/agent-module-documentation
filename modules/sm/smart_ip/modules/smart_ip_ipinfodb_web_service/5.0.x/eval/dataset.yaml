metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: smart_ip_ipinfodb_web_service
  version: 5.0.x
  note: Smart IP data-source submodule using the IPInfoDB.com web service. Registers the Smart IP source
    id 'ipinfodb_web_service' via an event subscriber (SmartIpEventSubscriber extends the parent's SmartIpEventSubscriberBase;
    sourceId()/configName()). Active only when smart_ip.settings:data_source == 'ipinfodb_web_service'.
    Own settings live in smart_ip_ipinfodb_web_service.settings (version:int 2|3, default 3; api_key:string
    required). Lookups call IpinfodbWebService::V2_URL (http://api.ipinfodb.com/v2/ip_query.php) or V3_URL
    (http://api.ipinfodb.com/v3/ip-city) and need a registered API key, so medium/hard tiers are grounded
    in the source-selection + version CONFIG (smart_ip.settings + smart_ip_ipinfodb_web_service.settings),
    never live geolocation calls.
questions:
- id: smart_ip_ipinfodb_web_service-activate-recipe
  input: On a Drupal 11 site with the smart_ip_ipinfodb_web_service submodule enabled, which Smart IP
    config key and value make the IPInfoDB web service the active geolocation data source?
  criteria: Set smart_ip.settings:data_source to 'ipinfodb_web_service' (the source id this submodule
    contributes). e.g. drush config:set smart_ip.settings data_source ipinfodb_web_service -y.
  bundle: smart_ip_ipinfodb_web_service
  rubric_ref: rubric/smart_ip_ipinfodb_web_service_smart_ip_ipinfodb_web_service_activate_recipe@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: smart_ip_ipinfodb_web_service-settings-recipe
  input: What settings does the smart_ip_ipinfodb_web_service submodule store, in which config object,
    and what do the IPInfoDB API versions differ by?
  criteria: It stores version (integer 2 or 3, default 3) and api_key (required) in the config object
    smart_ip_ipinfodb_web_service.settings. Version 2 (V2_URL .../v2/ip_query.php) returns a region code;
    version 3 (V3_URL .../v3/ip-city) removed the region code.
  bundle: smart_ip_ipinfodb_web_service
  rubric_ref: rubric/smart_ip_ipinfodb_web_service_smart_ip_ipinfodb_web_service_settings_recipe@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: smart_ip_ipinfodb_web_service-source-contract-recipe
  input: How does the smart_ip_ipinfodb_web_service submodule plug into Smart IP as a data source — what
    class does it extend and what identifies the source?
  criteria: It provides an event subscriber SmartIpEventSubscriber that extends the parent Drupal\smart_ip\SmartIpEventSubscriberBase
    (implements SmartIpDataSourceInterface). sourceId() returns 'ipinfodb_web_service' and configName()
    returns 'smart_ip_ipinfodb_web_service.settings'; processQuery() maps the IPInfoDB response onto the
    Smart IP location.
  bundle: smart_ip_ipinfodb_web_service
  rubric_ref: rubric/smart_ip_ipinfodb_web_service_smart_ip_ipinfodb_web_service_source_contract_recipe@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: smart_ip_ipinfodb_web_service-version-introspect
  input: This Drupal site has the IPInfoDB Smart IP data source configured with a specific API version.
    Inspect the live configuration and report which IPInfoDB API version it is set to.
  criteria: It is set to version 2 (non-default; the shipped default is 3), stored at smart_ip_ipinfodb_web_service.settings:version
    (read it with drush config:get smart_ip_ipinfodb_web_service.settings version).
  bundle: smart_ip_ipinfodb_web_service
  rubric_ref: rubric/smart_ip_ipinfodb_web_service_smart_ip_ipinfodb_web_service_version_introspect@1.0
  tags:
  - mode:introspection
