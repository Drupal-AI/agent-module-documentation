metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: device_geolocation
  version: 5.0.x
  note: 'Smart IP data source that reads the visitor''s location from their device/browser (W3C Geolocation
    API) and reverse-geocodes with Google Maps. sourceId()=''device_geolocation''; configName()=''device_geolocation.settings''
    with keys use_ajax_check(bool, default false), frequency_check(float seconds, default null; admin
    form is in hours ×3600), google_map_api_key, google_map_region, google_map_language. No server processQuery();
    JS POSTs coordinates to /device_geolocation/client_side_location. Ships the ''visitor_geolocation''
    block. Cases are grounded in real config the agent can set without any external service: activating
    the source (smart_ip.settings:data_source), the frequency_check / google_map_api_key settings, and
    the use_ajax_check flag. Shipped defaults used by reset/cleanup: smart_ip.settings:data_source=null,
    device_geolocation.settings:frequency_check=null, google_map_api_key=null, use_ajax_check=false.'
questions:
- id: device_geolocation-how-source
  input: How is the Device Geolocation submodule of Smart IP different from the IP-based data sources
    - where does the visitor's location come from, and what value activates it as the Smart IP data source?
  criteria: Device Geolocation gets the location from the visitor's own device/browser via the W3C/HTML5
    Geolocation API (reverse-geocoded with Google Maps), not from their IP. Activate it by setting smart_ip.settings:data_source
    to device_geolocation (its sourceId()).
  bundle: device_geolocation
  rubric_ref: rubric/device_geolocation_device_geolocation_how_source@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: device_geolocation-frequency-key
  input: In the Device Geolocation module, which config key controls how often the visitor is re-prompted
    for their location, what unit is it stored in, and how do I disable re-prompting?
  criteria: device_geolocation.settings:frequency_check controls the re-prompt interval; it is stored
    in seconds (the admin form takes hours and multiplies by 3600), and setting it to null disables re-prompting
    (its default).
  bundle: device_geolocation
  rubric_ref: rubric/device_geolocation_device_geolocation_frequency_key@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: device_geolocation-block
  input: Does the Device Geolocation module provide a way to display the visitor's detected location on
    the page, and what config key holds the Google Maps API key it needs?
  criteria: Yes - it ships the 'visitor_geolocation' block (admin label "Visitor's geolocation") that
    renders smart_ip.smart_ip_location data. The Google Maps API key is stored in device_geolocation.settings:google_map_api_key.
  bundle: device_geolocation
  rubric_ref: rubric/device_geolocation_device_geolocation_block@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: device_geolocation-which-frequency
  input: On this live site Device Geolocation is configured to re-prompt visitors for their location on
    a schedule. Inspect the running configuration and state the frequency_check value (in seconds) it
    is set to.
  criteria: device_geolocation.settings:frequency_check is 10800 seconds (3 hours). Read with `drush cget
    device_geolocation.settings frequency_check`.
  bundle: device_geolocation
  rubric_ref: rubric/device_geolocation_device_geolocation_which_frequency@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/device_geolocation-frequency-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/device_geolocation-frequency-cleanup.sh
- id: device_geolocation-which-apikey
  input: This site's Device Geolocation module has a Google Maps API key configured. Inspect the live
    configuration and give the API key value that is stored.
  criteria: device_geolocation.settings:google_map_api_key is AIzaSyDEVICEGEOtestkey. Read with `drush
    cget device_geolocation.settings google_map_api_key`.
  bundle: device_geolocation
  rubric_ref: rubric/device_geolocation_device_geolocation_which_apikey@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/device_geolocation-apikey-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/device_geolocation-apikey-cleanup.sh
- id: device_geolocation-activate
  input: On this Drupal site the Device Geolocation submodule is enabled but Smart IP has no data source
    selected. Configure Smart IP to use Device Geolocation (client-side/W3C) as its geolocation data source,
    and apply the change to the live site.
  criteria: Set smart_ip.settings:data_source to device_geolocation, e.g. `drush cset smart_ip.settings
    data_source device_geolocation -y`.
  bundle: device_geolocation
  rubric_ref: rubric/device_geolocation_device_geolocation_activate@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/device_geolocation-activate-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/device_geolocation-activate-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/device_geolocation-activate-verify.sh
- id: device_geolocation-enable-ajax
  input: On this Drupal site the pages are cached, so Device Geolocation should check the visitor's location
    via an AJAX call rather than only on page load. Turn on AJAX geolocation checking in the Device Geolocation
    configuration and apply the change to the live site.
  criteria: Set device_geolocation.settings:use_ajax_check to true (boolean), e.g. via the config factory
    setting TRUE or `drush cset device_geolocation.settings use_ajax_check 1 -y`.
  bundle: device_geolocation
  rubric_ref: rubric/device_geolocation_device_geolocation_enable_ajax@1.0
