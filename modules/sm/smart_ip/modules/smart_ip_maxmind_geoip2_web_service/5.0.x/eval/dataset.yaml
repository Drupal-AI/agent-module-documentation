- id: smart_ip_maxmind_geoip2_web_service-source-id
  input: I enabled the Smart IP MaxMind GeoIP2 Precision web service submodule. What value do I set for
    smart_ip.settings:data_source to activate it, and what credentials does it need?
  criteria: Set smart_ip.settings:data_source to maxmind_geoip2_web_service (its sourceId()). It needs
    a MaxMind user_id and license_key, stored in smart_ip_maxmind_geoip2_web_service.settings.
  bundle: smart_ip_maxmind_geoip2_web_service
