  input: How does the MaxMind GeoIP2 Precision web service Smart IP source differ operationally from the
    MaxMind binary database source - does it need a local database or cron download?
  criteria: The web service source makes a per-lookup HTTPS API call to MaxMind (billable) and needs no
    local .mmdb file and no cron download, unlike the binary-database source which reads a local file
