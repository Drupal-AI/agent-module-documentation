  module: smart_ip_maxmind_geoip2_web_service
  version: 5.0.x
  note: 'Smart IP data source that geolocates by calling MaxMind''s hosted GeoIP2 Precision web service.
    sourceId()=''maxmind_geoip2_web_service''; configName()=''smart_ip_maxmind_geoip2_web_service.settings''
    with keys service_type(country|city|insights, default city), user_id, license_key. Live lookups need
    real MaxMind credentials + outbound HTTPS, so medium/hard cases are grounded in config the agent can
    set without a working account: the service_type endpoint and selecting this source as smart_ip.settings:data_source.
    Shipped defaults used by reset/cleanup: service_type=city, smart_ip.settings:data_source=null.'
