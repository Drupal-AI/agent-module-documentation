  input: The Smart IP MaxMind GeoIP2 Precision web service source can call different MaxMind Precision
    endpoints. Which config key selects the endpoint, what are the possible values, and what is the default?
  criteria: 'smart_ip_maxmind_geoip2_web_service.settings:service_type selects the endpoint: country,
    city, or insights. It defaults to city.'
  bundle: smart_ip_maxmind_geoip2_web_service
  rubric_ref: rubric/smart_ip_maxmind_geoip2_web_service_smart_ip_maxmind_geoip2_web_service_endpoints@1.0
