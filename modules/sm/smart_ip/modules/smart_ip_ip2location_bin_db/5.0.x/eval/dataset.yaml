  criteria: smart_ip_ip2location_bin_db.settings:edition is DB3 (read with `drush cget smart_ip_ip2location_bin_db.settings
    edition`).
  bundle: smart_ip_ip2location_bin_db
  rubric_ref: rubric/smart_ip_ip2location_bin_db_smart_ip_ip2location_bin_db_which_edition@1.0
  tags:
