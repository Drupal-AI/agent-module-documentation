metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: smart_ip_ip2location_bin_db
  version: 5.0.x
  note: 'Smart IP data source that geolocates offline against an IP2Location BIN database (via ip2location/ip2location-php).
    sourceId()=''ip2location_bin_db''; configName()=''smart_ip_ip2location_bin_db.settings'' with keys
    version(lite|licensed, default lite), edition(BIN code, default DB11), token, db_auto_update(default
    false), caching_method(no_cache|memory_cache|shared_memory, default no_cache), bin_file_custom_path.
    The actual IP lookup needs an external BIN file that is NOT present on this site, so medium/hard cases
    are grounded ONLY in config the agent can set without the binary DB: the product edition and the reader
    caching_method. Shipped defaults used by reset/cleanup: edition=DB11, caching_method=no_cache.'
questions:
- id: smart_ip_ip2location_bin_db-source-id
  input: I enabled the Smart IP IP2Location binary database submodule. What value do I set for smart_ip.settings:data_source
    to actually make Smart IP use it, and where does this submodule store its own settings?
  criteria: Set smart_ip.settings:data_source to ip2location_bin_db (the source's sourceId()). Its own
    settings live in the smart_ip_ip2location_bin_db.settings config object.
  bundle: smart_ip_ip2location_bin_db
  rubric_ref: rubric/smart_ip_ip2location_bin_db_smart_ip_ip2location_bin_db_source_id@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: smart_ip_ip2location_bin_db-edition-key
  input: For the Smart IP IP2Location binary database source, which config key selects the IP2Location
    product edition (BIN code), what is its default value, and which key chooses between the free LITE
    and the licensed database?
  criteria: smart_ip_ip2location_bin_db.settings:edition is the BIN product code (default DB11, e.g. DB1..DB24),
    and version chooses lite (free IP2Location LITE, the default) vs licensed.
  bundle: smart_ip_ip2location_bin_db
  rubric_ref: rubric/smart_ip_ip2location_bin_db_smart_ip_ip2location_bin_db_edition_key@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: smart_ip_ip2location_bin_db-library
  input: What external PHP library does the Smart IP IP2Location binary database source rely on to read
    the BIN file, and is the lookup done offline or via an API call?
  criteria: It uses the ip2location/ip2location-php library (already required by the smart_ip project's
    composer.json) and performs the lookup fully offline against the local BIN file - no per-request API
    call.
  bundle: smart_ip_ip2location_bin_db
  rubric_ref: rubric/smart_ip_ip2location_bin_db_smart_ip_ip2location_bin_db_library@1.0
  tags:
  - mode:recipe
  - difficulty:easy
