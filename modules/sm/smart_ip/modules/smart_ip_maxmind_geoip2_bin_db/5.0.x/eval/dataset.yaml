metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: smart_ip_maxmind_geoip2_bin_db
  version: 5.0.x
  note: 'Smart IP data source that geolocates offline against a MaxMind GeoIP2/GeoLite2 .mmdb file (via
    geoip2/geoip2). sourceId()=''maxmind_geoip2_bin_db''; configName()=''smart_ip_maxmind_geoip2_bin_db.settings''
    with keys version(lite|licensed, default lite), edition(city|country, default city), user_account,
    license_key, db_auto_update(default true), bin_file_custom_path. The IP lookup needs an external .mmdb
    file that is NOT present on this site, so medium/hard cases are grounded ONLY in config the agent
    can set without the binary DB: the edition (city vs country) and the db_auto_update flag. Shipped
    defaults used by reset/cleanup: edition=city, db_auto_update=true.'
questions:
- id: smart_ip_maxmind_geoip2_bin_db-source-id
  input: I enabled the Smart IP MaxMind GeoIP2 binary database submodule. What value do I set for smart_ip.settings:data_source
    to make Smart IP use it, and where does this submodule keep its own settings?
  criteria: Set smart_ip.settings:data_source to maxmind_geoip2_bin_db (its sourceId()). Its own settings
    live in the smart_ip_maxmind_geoip2_bin_db.settings config object.
  bundle: smart_ip_maxmind_geoip2_bin_db
  rubric_ref: rubric/smart_ip_maxmind_geoip2_bin_db_smart_ip_maxmind_geoip2_bin_db_source_id@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: smart_ip_maxmind_geoip2_bin_db-edition-options
  input: For the Smart IP MaxMind GeoIP2 binary database source, which config key chooses city-level vs
    country-level resolution, what values does it accept, and what is the default?
  criteria: smart_ip_maxmind_geoip2_bin_db.settings:edition accepts city or country and defaults to city;
    version (lite|licensed) picks the free GeoLite2 vs the commercial GeoIP2 database.
  bundle: smart_ip_maxmind_geoip2_bin_db
  rubric_ref: rubric/smart_ip_maxmind_geoip2_bin_db_smart_ip_maxmind_geoip2_bin_db_edition_options@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: smart_ip_maxmind_geoip2_bin_db-autoupdate-default
  input: Does the Smart IP MaxMind GeoIP2 binary database source refresh its .mmdb database automatically
    on cron by default, and which config key controls that? What library reads the database?
  criteria: Yes - db_auto_update defaults to true, so it refreshes the .mmdb on cron (download uses the
    MaxMind user_account + license_key). The reader is the geoip2/geoip2 PHP library; lookups are offline.
  bundle: smart_ip_maxmind_geoip2_bin_db
  rubric_ref: rubric/smart_ip_maxmind_geoip2_bin_db_smart_ip_maxmind_geoip2_bin_db_autoupdate_default@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: smart_ip_maxmind_geoip2_bin_db-which-edition
  input: On this live site the Smart IP MaxMind GeoIP2 binary database source has been switched away from
    its default resolution. Inspect the running configuration and state which edition (city or country)
    it is currently set to.
  criteria: smart_ip_maxmind_geoip2_bin_db.settings:edition is country (read with `drush cget smart_ip_maxmind_geoip2_bin_db.settings
    edition`).
  bundle: smart_ip_maxmind_geoip2_bin_db
  rubric_ref: rubric/smart_ip_maxmind_geoip2_bin_db_smart_ip_maxmind_geoip2_bin_db_which_edition@1.0
  tags:
  - mode:introspection
  - difficulty:medium
