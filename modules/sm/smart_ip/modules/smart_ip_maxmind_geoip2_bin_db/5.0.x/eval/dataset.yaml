    setup: agent-module-documentation/evaluation/verify/smart_ip_maxmind_geoip2_bin_db-edition-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/smart_ip_maxmind_geoip2_bin_db-edition-cleanup.sh
- id: smart_ip_maxmind_geoip2_bin_db-disable-autoupdate
  input: On this Drupal site, configure the Smart IP MaxMind GeoIP2 binary database source so it does
