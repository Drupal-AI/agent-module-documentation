rubrics:
- id: smart_ip_smart_ip_select_source_key
  version: '1.0'
  applicable_bundles:
  - smart_ip
  checks:
  - kind: must_contain_any
    values:
    - data_source
    - smart_ip.settings
  scoring:
    combine: all_pass
- id: smart_ip_smart_ip_query_api
  version: '1.0'
  applicable_bundles:
  - smart_ip
  checks:
  - kind: must_contain_any
    values:
    - SmartIp::query
    - smart_ip.smart_ip_location
    - SmartIpLocation
  scoring:
    combine: all_pass
- id: smart_ip_smart_ip_country_block
  version: '1.0'
  applicable_bundles:
  - smart_ip
  checks:
  - kind: must_contain_any
    values:
    - user_country
    - UserCountry
    - User country
    - condition
  scoring:
    combine: all_pass
- id: smart_ip_smart_ip_which_source
  version: '1.0'
  applicable_bundles:
  - smart_ip
  checks:
  - kind: must_contain_any
    values:
    - maxmind_geoip2_bin_db
  scoring:
    combine: all_pass
- id: smart_ip_smart_ip_which_excluded_ip
  version: '1.0'
  applicable_bundles:
  - smart_ip
  checks:
  - kind: must_contain_any
    values:
    - 203.0.113.42
  scoring:
    combine: all_pass
- id: smart_ip_smart_ip_select_source
  version: '1.0'
  applicable_bundles:
  - smart_ip
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
- id: smart_ip_smart_ip_exclude_ip
  version: '1.0'
  applicable_bundles:
  - smart_ip
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
