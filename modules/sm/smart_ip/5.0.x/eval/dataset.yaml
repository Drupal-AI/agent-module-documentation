metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: smart_ip
  version: 5.0.x
  note: 'Smart IP is an IP-geolocation FRAMEWORK: it ships no lookup database and does not geolocate until
    a data-source submodule is enabled and selected as smart_ip.settings:data_source. All config lives
    in the smart_ip.settings config object (data_source, roles_to_geolocate, excluded_ips, allowed_pages,
    eu_visitor_dont_save, roles_in_debug_mode(+_ip), save_user_location_creation, timezone_format). The
    query entry point is the static \Drupal\smart_ip\SmartIp::query($ip); results are held by the smart_ip.smart_ip_location
    service (SmartIpLocation). Country-based block visibility is the UserCountry condition plugin (id
    user_country). Medium/hard cases are grounded in the real smart_ip.settings keys the agent can set
    without an external GeoIP database: data_source selection and the excluded_ips list. Shipped defaults:
    data_source=null, excluded_ips=null.'
questions:
- id: smart_ip-select-source-key
  input: On a Drupal 11 site the Smart IP (smart_ip) module is enabled but nothing is being geolocated.
    Which configuration object and key decide which geolocation data source Smart IP actually uses, and
    why does geolocation not happen until it is set?
  criteria: Smart IP is only a framework; the active provider is chosen by smart_ip.settings:data_source,
    which must be set to an enabled data-source submodule's sourceId() (e.g. maxmind_geoip2_bin_db, ip2location_bin_db,
    maxmind_geoip2_web_service, ipinfodb_web_service, abstract_web_service, device_geolocation). While
    it is null nothing geolocates. Set it e.g. `drush cset smart_ip.settings data_source maxmind_geoip2_bin_db
    -y`.
  bundle: smart_ip
  rubric_ref: rubric/smart_ip_smart_ip_select_source_key@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: smart_ip-query-api
  input: In custom code on a Drupal site with Smart IP, what is the entry point to look up a visitor's
    geographical location from their IP address, and what does it return? Also name the service that holds
    the current visitor's location.
  criteria: 'Call the static \Drupal\smart_ip\SmartIp::query() (optionally with an IP, e.g. SmartIp::query(''8.8.8.8'')).
    It returns an array with keys country, countryCode, region, regionCode, city, zip, latitude, longitude,
    timeZone, isEuCountry, ipAddress, source. The current visitor''s location is also available from the
    smart_ip.smart_ip_location service (SmartIpLocation: get()/getData()/set()/save()).'
  bundle: smart_ip
  rubric_ref: rubric/smart_ip_smart_ip_query_api@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: smart_ip-country-block
  input: With the Smart IP module, how can I show or hide a block depending on the visitor's detected
    country, without writing custom code?
  criteria: Smart IP provides a Condition plugin UserCountry (condition id user_country, class Drupal\smart_ip\Plugin\Condition\UserCountry).
    In a block's Visibility settings choose 'User country' and pick the countries; the block then shows/hides
    based on the geolocated country.
  bundle: smart_ip
  rubric_ref: rubric/smart_ip_smart_ip_country_block@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: smart_ip-which-source
  input: On this live Drupal site, which geolocation data source is Smart IP currently configured to use?
    Inspect the running configuration and give the exact data_source value.
  criteria: smart_ip.settings:data_source is set to maxmind_geoip2_bin_db (read with `drush cget smart_ip.settings
    data_source`).
  bundle: smart_ip
  rubric_ref: rubric/smart_ip_smart_ip_which_source@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/smart_ip-data-source-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/smart_ip-data-source-cleanup.sh
- id: smart_ip-which-excluded-ip
  input: This site's Smart IP configuration excludes a specific IP address from geolocation (SmartIp::query()
    returns an empty result for it). Inspect the live configuration and state which IP address is excluded.
  criteria: smart_ip.settings:excluded_ips contains 203.0.113.42 (read with `drush cget smart_ip.settings
    excluded_ips`).
  bundle: smart_ip
  rubric_ref: rubric/smart_ip_smart_ip_which_excluded_ip@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/smart_ip-excluded-ips-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/smart_ip-excluded-ips-cleanup.sh
- id: smart_ip-select-source
  input: On this Drupal site the Smart IP module and its MaxMind GeoIP2 binary database submodule are
    enabled, but no data source is selected yet. Configure Smart IP so it uses the MaxMind GeoIP2 binary
    database as its geolocation data source, and apply the change to the live site.
  criteria: Set smart_ip.settings:data_source to maxmind_geoip2_bin_db (the source's sourceId()), e.g.
    `drush cset smart_ip.settings data_source maxmind_geoip2_bin_db -y`.
  bundle: smart_ip
  rubric_ref: rubric/smart_ip_smart_ip_select_source@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/smart_ip-select-source-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/smart_ip-select-source-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/smart_ip-select-source-verify.sh
- id: smart_ip-exclude-ip
  input: On this Drupal site, use Smart IP to exclude the IP address 198.51.100.7 from geolocation so
    that SmartIp::query() returns an empty result for it. Apply the change to the live configuration.
  criteria: Add 198.51.100.7 to smart_ip.settings:excluded_ips (newline-separated list), e.g. `drush cset
    smart_ip.settings excluded_ips 198.51.100.7 -y`. SmartIp::query('198.51.100.7') then returns [].
  bundle: smart_ip
  rubric_ref: rubric/smart_ip_smart_ip_exclude_ip@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/smart_ip-exclude-ip-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/smart_ip-exclude-ip-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/smart_ip-exclude-ip-verify.sh
