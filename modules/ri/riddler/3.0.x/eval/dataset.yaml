metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: riddler
  version: 3.0.x
  note: Captcha Riddler adds a 'Riddler' challenge type to the CAPTCHA module via hook_captcha(). Riddles
    are `riddle` config entities (config name riddler.riddle.<id>) with question, solution (comma-separated
    allowed answers), hint, status. Managed at /admin/config/people/captcha/riddler-riddle; attached to
    forms via CAPTCHA points. Answer matching honours captcha.settings:default_validation (case sensitivity).
    >1 enabled riddle disables page cache on protected forms. No configure route of its own, no permissions
    file (uses CAPTCHA's 'administer CAPTCHA settings'), no plugins, no Drush. Medium cases create riddle
    entities to read back; hard cases require the agent to create/enable a riddle entity, verified against
    live config. All fixtures use ri_* ids and never touch the module's shipped example riddle.
questions:
- id: riddler-what-and-where
  input: What is the Drupal 'riddler' (Captcha Riddler) module, what other module does it need, and where
    do I manage the riddle questions?
  criteria: Riddler adds a 'Riddler' question-and-answer CAPTCHA challenge type; it depends on the CAPTCHA
    module. Riddles are `riddle` config entities managed at /admin/config/people/captcha/riddler-riddle,
    then attached to forms via CAPTCHA points.
  bundle: riddler
  rubric_ref: rubric/riddler_riddler_what_and_where@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: riddler-multiple-answers
  input: In the riddler module, how do I allow more than one correct answer to a single riddle, and what
    controls whether answers are case sensitive?
  criteria: Put multiple accepted answers in the riddle's solution as a comma-separated list (e.g. '4,four').
    Case sensitivity follows CAPTCHA's global setting captcha.settings:default_validation (case sensitive
    vs insensitive).
  bundle: riddler
  rubric_ref: rubric/riddler_riddler_multiple_answers@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: riddler-caching-caveat
  input: With the riddler CAPTCHA module, is there any performance/caching consideration when I enable
    several riddles at once?
  criteria: 'Yes: page caching is only compatible with exactly ONE enabled riddle. With two or more enabled
    riddles Riddler sets max-age 0 and triggers the page cache kill switch on protected forms so a fresh
    random riddle is shown each request.'
  bundle: riddler
  rubric_ref: rubric/riddler_riddler_caching_caveat@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: riddler-read-solution
  input: This Drupal site has a riddler riddle with the machine name ri_known. Inspect the live configuration
    and tell me the accepted answer(s) for that riddle.
  criteria: The riddle config entity riddler.riddle.ri_known has solution 'blue,Blue', so the accepted
    answers are 'blue' and 'Blue'. Read via `drush cget riddler.riddle.ri_known` or by loading the riddle
    entity.
  bundle: riddler
  rubric_ref: rubric/riddler_riddler_read_solution@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/riddler-known-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/riddler-known-cleanup.sh
- id: riddler-which-enabled
  input: This site has two riddler riddles, ri_active and ri_paused. Inspect the live configuration and
    tell me which one is enabled (and would actually be presented to users).
  criteria: ri_active is enabled (status true) and ri_paused is disabled (status false); only ri_active
    would be shown. Check the status of each riddle config entity.
  bundle: riddler
  rubric_ref: rubric/riddler_riddler_which_enabled@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/riddler-onoff-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/riddler-onoff-cleanup.sh
- id: riddler-create-riddle
  input: On this Drupal site, use the riddler module to create a new, enabled riddle with the machine
    name ri_task. Its question should be a simple maths question ('What is 2+2?') and it must accept BOTH
    '4' and 'four' as correct answers. Apply the change to the live site.
  criteria: Create a `riddle` config entity id ri_task with a question, status TRUE, and a comma-separated
    solution accepting both answers, e.g. solution '4,four' (config riddler.riddle.ri_task).
  bundle: riddler
  rubric_ref: rubric/riddler_riddler_create_riddle@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/riddler-create-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/riddler-create-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/riddler-create-verify.sh
- id: riddler-enable-riddle
  input: This site has a riddler riddle called ri_toggle that is currently disabled, so it is never shown
    to users. Enable it so it becomes active. Apply the change to the live site.
  criteria: Set the ri_toggle riddle's status to TRUE (enable it), e.g. edit riddler.riddle.ri_toggle
    or tick 'Enabled' on its edit form.
  bundle: riddler
  rubric_ref: rubric/riddler_riddler_enable_riddle@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: site-owner
    reset: agent-module-documentation/evaluation/verify/riddler-enable-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/riddler-enable-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/riddler-enable-verify.sh
