metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: canvas
  version: 1.8.x
  note: 'Drupal Canvas is a visual experience/page builder: components composed into a stored ''component
    tree'', props wired to Drupal data via shape-matched prop sources; React SPA over an internal (@internal)
    HTTP API. Cases are `recipe` (response-graded) probing documented facts an agent would otherwise read
    source to answer; no site mutation.'
questions:
- id: canvas-what-is-it
  input: What is the Drupal 'canvas' module (machine name canvas) and what core Drupal workflow does it
    invert?
  criteria: 'Drupal Canvas is a visual, in-browser experience/page builder. Content creators compose reusable
    components (SDCs, blocks, JS code components) into a stored ''component tree'' and wire component
    props to Drupal data. It inverts Drupal''s data-first model: you build the layout first, then selectively
    wire data into it (via prop sources).'
  bundle: canvas
  rubric_ref: rubric/canvas_canvas_what_is_it@1.0
  tags:
  - mode:recipe
- id: canvas-configure-route
  input: What is the configure route for the Drupal canvas module and what path does it resolve to?
  criteria: The configure route is entity.component.collection, which resolves to /admin/appearance/component
    (the Components collection, a local task under Appearance; requires 'administer themes').
  bundle: canvas
  rubric_ref: rubric/canvas_canvas_configure_route@1.0
  tags:
  - mode:recipe
- id: canvas-public-api
  input: I want to build an integration against Canvas's PHP or HTTP API in the 1.x release. Is there
    a stable public API?
  criteria: No. Canvas 1.x provides no stable public PHP or HTTP API — all classes, interfaces and HTTP
    endpoints are @internal and may change without notice. Public APIs are targeted for the 1.1.0 release.
    Do not build integrations against its controllers/services yet.
  bundle: canvas
  rubric_ref: rubric/canvas_canvas_public_api@1.0
  tags:
  - mode:recipe
- id: canvas-component-source-plugin
  input: In Canvas, how do I add support for a new kind of component beyond the built-in SDC, block, and
    code components? Name the plugin type and where built-in ones live.
  criteria: Implement a Component Source plugin (canvas.component_source), managed by ComponentSourceManager
    using the ComponentSource attribute, in src/Plugin/Canvas/ComponentSource/. Built-ins are SingleDirectoryComponent
    (SDC), BlockComponent, JsComponent (code components), and Fallback.
  bundle: canvas
  rubric_ref: rubric/canvas_canvas_component_source_plugin@1.0
  tags:
  - mode:recipe
- id: canvas-shape-matching-hook
  input: A component prop expects a URI (JSON schema type:string, format:uri) and I want Canvas to store
    it with the core link field/widget instead of the uri field. Which hook do I implement?
  criteria: Implement hook_canvas_storable_prop_shape_alter(CandidateStorablePropShape $storable_prop_shape).
    Branch on $storable_prop_shape->shape->schema and set ->fieldTypeProp (e.g. StructuredDataPropExpression::fromString('link.url')),
    ->fieldWidget = 'link_default', and ->fieldInstanceSettings. This is part of Canvas 'shape matching'.
  bundle: canvas
  rubric_ref: rubric/canvas_canvas_shape_matching_hook@1.0
  tags:
  - mode:recipe
- id: canvas-code-components-permission
  input: Which Canvas permission controls creating/editing JavaScript code components, and why is it special?
  criteria: 'The ''administer code components'' permission. It is marked restrict access: true because
    code components allow executing JavaScript, so it should only be granted to trusted users (distinct
    from the general ''administer components'' permission).'
  bundle: canvas
  rubric_ref: rubric/canvas_canvas_code_components_permission@1.0
  tags:
  - mode:recipe
- id: canvas-config-entities
  input: Name several of the config entity types Canvas provides for building and templating, and the
    content entity type it adds for standalone pages.
  criteria: Config entities include component, js_component (code components), pattern, folder, content_template
    (entity display templates), page_region (page template regions), asset_library, and brand_kit. The
    standalone page content entity is canvas_page (managed at /admin/content/pages).
  bundle: canvas
  rubric_ref: rubric/canvas_canvas_config_entities@1.0
  tags:
  - mode:recipe
- id: canvas-importmap-hook
  input: How do I add a JavaScript import-map entry that Canvas code components can import from? Which
    hook?
  criteria: Implement hook_canvas_importmap_alter(array &$import_maps). Add entries under $import_maps['imports']
    (specifier => URL) or $import_maps['scopes']; cache-busting query strings are appended to global imports
    after the hook runs. Backed by GlobalImports::getImportMap().
  bundle: canvas
  rubric_ref: rubric/canvas_canvas_importmap_hook@1.0
  tags:
  - mode:recipe
- id: canvas-submodules
  input: Which optional (non dev/test) submodules ship with Canvas and what do they add?
  criteria: canvas_ai (AI assistance via drupal/ai + ai_agents), canvas_oauth (OAuth2 auth for Canvas's
    external HTTP API), canvas_personalization (audience personalization of layouts), and canvas_vite
    (Vite HMR for code-component development). The many canvas_dev_*/test modules are not intended for
    production.
  bundle: canvas
  rubric_ref: rubric/canvas_canvas_submodules@1.0
  tags:
  - mode:recipe
- id: canvas-drush
  input: Does the Canvas module provide any Drush commands?
  criteria: No. Canvas provides no Drush commands (there is no drush.services.yml or src/Drush). It is
    administered through the Canvas React UI and config, plus standard config import/export for its config
    entities.
  bundle: canvas
  rubric_ref: rubric/canvas_canvas_drush@1.0
  tags:
  - mode:recipe
