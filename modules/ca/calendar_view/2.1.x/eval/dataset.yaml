metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: calendar_view
  version: 2.1.x
  note: 'Calendar View ships two Views style plugins -- `calendar_month` (Calendar by month) and `calendar_week`
    (Calendar by week) -- that render a View''s results as an HTML-table calendar; a display must place
    a supported Date field and select it via the style option `calendar_fields`. Cases span three tiers:
    easy/recipe (response-graded facts from 2.1.x/agent/: the style plugin id, how to build a calendar
    view, the date-field setting), medium/introspection (a setup script installs a KNOWN calendar View
    bound to a specific date field, the agent inspects the running site via drush, a cleanup script deletes
    it), and hard/execution (a reset script deletes the target View, the agent BUILDS a View whose display
    uses the calendar style bound to a date field, a verify script checks the display''s style plugin
    + calendar_fields on live state). Style plugin ids confirmed from source and the live plugin.manager.views.style.'
questions:
- id: calendar_view-style-plugin-id
  input: On a Drupal 11 site with the Calendar View module, which Views style plugin do I choose to render
    a View's results as a monthly calendar, and what is its plugin id? Is there a weekly variant?
  criteria: Choose the 'Calendar by month' Views style, plugin id `calendar_month`. There is also a weekly
    variant, 'Calendar by week' (`calendar_week`). Both are set as the display's Format in the Views UI.
  bundle: calendar_view
  rubric_ref: rubric/calendar_view_calendar_view_style_plugin_id@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: calendar_view-build-recipe
  input: Using the Calendar View module, what are the steps to turn an ordinary View of content into a
    monthly calendar? Mention what must be present in the View for the calendar to render.
  criteria: Set the display Format to 'Calendar by month' (calendar_month), add at least one supported
    Date field to the View's fields, then open the style settings and tick that field under 'Date fields'
    (calendar_fields). Without a selected date field the display renders 'Missing calendar field.'
  bundle: calendar_view
  rubric_ref: rubric/calendar_view_calendar_view_build_recipe@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: calendar_view-date-field-setting
  input: In the Calendar View style settings, which option binds the calendar to a date field, and which
    date field types are supported?
  criteria: The `calendar_fields` style option selects which of the View's date fields drive the calendar.
    Supported field types are date, created, changed, datetime, daterange, smartdate, and timestamp (CalendarViewBase::DATE_FIELD_TYPES).
  bundle: calendar_view
  rubric_ref: rubric/calendar_view_calendar_view_date_field_setting@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: calendar_view-introspect-datefield
  input: This Drupal site has a View with machine name `cv_eval_events` whose display uses a Calendar
    View style (drush available). Inspect the running site and tell me which date field the calendar is
    bound to.
  criteria: 'The cv_eval_events View uses the calendar_month style with calendar_fields set to the `changed`
    field (Content: Changed/Updated date), so the calendar is bound to the node `changed` date field.'
  bundle: calendar_view
  rubric_ref: rubric/calendar_view_calendar_view_introspect_datefield@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    persona: drupal-expert
    setup: agent-module-documentation/evaluation/verify/calendar_view-introspect-datefield-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/calendar_view-introspect-datefield-cleanup.sh
- id: calendar_view-introspect-style
  input: On this Drupal site there is a View with machine name `cv_eval_agenda` (drush available). Inspect
    the running site and tell me which Calendar View style plugin its display uses (month or week) and
    give the plugin id.
  criteria: The cv_eval_agenda View display uses the 'Calendar by week' style, plugin id `calendar_week`
    (bound to the created date field).
  bundle: calendar_view
  rubric_ref: rubric/calendar_view_calendar_view_introspect_style@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    persona: drupal-expert
    setup: agent-module-documentation/evaluation/verify/calendar_view-introspect-style-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/calendar_view-introspect-style-cleanup.sh
- id: calendar_view-build-month
  input: On this Drupal site (drush available), using the Calendar View module, build a View with the
    machine name `cv_hard_month` that displays content on a monthly calendar. Use the 'Calendar by month'
    style and bind it to a date field (for example the node Authored on / created date) via the style's
    date-field setting. Create it on the live site; don't just describe it. One-line summary.
  criteria: A View `cv_hard_month` exists whose display uses style plugin calendar_month with a non-empty
    calendar_fields referencing a date field. Verified against live site state.
  bundle: calendar_view
  rubric_ref: rubric/calendar_view_calendar_view_build_month@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/calendar_view-build-month-reset.sh
    verify: agent-module-documentation/evaluation/verify/calendar_view-build-month-verify.sh
- id: calendar_view-build-week
  input: On this Drupal site (drush available), using the Calendar View module, build a View with the
    machine name `cv_hard_week` that shows content as a weekly calendar. Use the 'Calendar by week' style
    and bind it to a supported date field via the style's date-field setting. Apply it to the live site;
    don't just describe it. One-line summary.
  criteria: A View `cv_hard_week` exists whose display uses style plugin calendar_week with a non-empty
    calendar_fields referencing a date field. Verified against live site state.
  bundle: calendar_view
  rubric_ref: rubric/calendar_view_calendar_view_build_week@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/calendar_view-build-week-reset.sh
    verify: agent-module-documentation/evaluation/verify/calendar_view-build-week-verify.sh
