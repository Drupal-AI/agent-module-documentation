metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: calendar_view_multiday
  version: 2.1.x
  part_of: calendar_view
  note: 'Light-doc submodule of calendar_view. Recipe-only eval suite (no medium/hard): the submodule
    is zero-configuration -- it only attaches an asset library and adds CSS classes/data attributes via
    preprocess hooks, so there is no live config to introspect or build. All cases are response-graded
    facts grounded in the submodule source.'
questions:
- id: calendar_view_multiday-purpose
  input: On a Drupal 11 site, what does the Calendar View - Multiday (calendar_view_multiday) submodule
    do, and does it require any configuration to work?
  criteria: 'It improves how events that span multiple days are rendered on a Calendar View, drawing them
    as one continuous bar across day cells. It is zero-configuration: enabling the module (it depends
    on calendar_view) is the entire setup -- there is no settings form or config entity.'
  bundle: calendar_view_multiday
  rubric_ref: rubric/calendar_view_multiday_calendar_view_multiday_purpose@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: calendar_view_multiday-markup
  input: Which CSS classes and/or data attributes does the calendar_view_multiday submodule add to rendered
    results in a calendar day cell so multi-day events can be styled?
  criteria: Via preprocess hooks it adds is-multi, is-multi--first, is-multi--middle, and is-multi--last
    classes plus data-calendar-view-instance and data-calendar-view-instances attributes to each result
    in a day cell, and attaches the calendar_view_multiday/multiday library.
  bundle: calendar_view_multiday
  rubric_ref: rubric/calendar_view_multiday_calendar_view_multiday_markup@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: calendar_view_multiday-dependency
  input: What module does calendar_view_multiday depend on, and does it define any config, permissions,
    or Drush commands of its own?
  criteria: It depends on calendar_view (it is a submodule of that project). It defines no config schema/entity,
    no permissions, and no Drush commands -- it only attaches an asset library and adds markup via preprocess
    hooks.
  bundle: calendar_view_multiday
  rubric_ref: rubric/calendar_view_multiday_calendar_view_multiday_dependency@1.0
  tags:
  - mode:recipe
  - difficulty:easy
