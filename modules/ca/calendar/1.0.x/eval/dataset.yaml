metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: calendar
  version: 1.0.x
  note: 'Calendar is a Views integration (style/row/pager/area/argument plugins) plus a template-based
    view builder, with almost no admin config. Cases are `recipe` (response-graded): they probe documented
    facts an agent would otherwise dig out of source; no site mutation. Beta release.'
questions:
- id: calendar-style-plugin
  input: On a Drupal 11 site I have a view of nodes with a date field and I want to display the results
    as a monthly calendar. Which Views style plugin do I use and how do I switch it between month, week,
    day, and year?
  criteria: Use the 'Calendar' Views style plugin (id `calendar`); its `calendar_type` option selects
    month/week/day/year for that display.
  bundle: calendar
  rubric_ref: rubric/calendar_calendar_style_plugin@1.0
  tags:
  - mode:recipe
- id: calendar-row-legend-colors
  input: In a Calendar view, which Views row plugin renders each result as a placed calendar item, and
    how do I color-code items by content type?
  criteria: The `calendar_row` ('Calendar entities') row plugin; set its legend colors (colors.legend
    = type) with per-content-type hex colors (or by a taxonomy field/term).
  bundle: calendar
  rubric_ref: rubric/calendar_calendar_row_legend_colors@1.0
  tags:
  - mode:recipe
- id: calendar-pager-and-argument
  input: How do users page forward and back between months in a Calendar view, and what drives which period
    is shown?
  criteria: The Calendar Pager plugin (id `calendar`) provides previous/next; the shown period is driven
    by a date contextual filter (argument) such as date_year_month, read from the URL.
  bundle: calendar
  rubric_ref: rubric/calendar_calendar_pager_and_argument@1.0
  tags:
  - mode:recipe
- id: calendar-current-date-default
  input: I want a Calendar view to open on today's date when no period is in the URL. Which plugin/submodule
    provides that default, and how is it set?
  criteria: The calendar_datetime submodule's `date` argument-default plugin ('Calendar Current date');
    set it as the contextual filter's 'Provide default value' so the calendar opens on today.
  bundle: calendar
  rubric_ref: rubric/calendar_calendar_current_date_default@1.0
  tags:
  - mode:recipe
- id: calendar-add-from-template
  input: What is the quickest way to generate a full calendar view (Month/Week/Day/Year displays) for
    a date field on a Drupal site, and which module provides it?
  criteria: Use the 'Add from template' link on the Views listing page, provided by the required views_templates
    module; it builds a view with Master + Month/Week/Day/Year page displays from calendar_base_field
    / calendar_config_field.
  bundle: calendar
  rubric_ref: rubric/calendar_calendar_add_from_template@1.0
  tags:
  - mode:recipe
- id: calendar-dependencies
  input: Which Drupal core modules must be present for the Calendar module to work?
  criteria: Core `views` and `datetime` (plus the contrib `views_templates` module and the bundled `calendar_datetime`
    submodule) per calendar.info.yml.
  bundle: calendar
  rubric_ref: rubric/calendar_calendar_dependencies@1.0
  tags:
  - mode:recipe
- id: calendar-week-granularity
  input: The core date contextual filters give me year/month/day, but I need an ISO week granularity for
    a Calendar week view. Where does that come from?
  criteria: Calendar adds an ISO `year_week` granularity argument via hook_views_data_alter()/hook_field_views_data_alter()
    (argument ids date_year_week / datetime_year_week).
  bundle: calendar
  rubric_ref: rubric/calendar_calendar_week_granularity@1.0
  tags:
  - mode:recipe
- id: calendar-theme-month
  input: I want to override the HTML of the month grid in a Calendar view. Which theme hook / Twig template
    do I override?
  criteria: Override the `calendar_month` theme hook / `calendar-month.html.twig` template (copy into
    your theme, rebuild cache); related hooks include calendar_week, calendar_day, calendar_year, calendar_item,
    calendar_pager.
  bundle: calendar
  rubric_ref: rubric/calendar_calendar_theme_month@1.0
  tags:
  - mode:recipe
