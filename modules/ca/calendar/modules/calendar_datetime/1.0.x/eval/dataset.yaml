metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: calendar_datetime
  version: 1.0.x
  note: 'calendar_datetime is a one-plugin helper submodule of Calendar: a Views argument-default plugin
    (''Calendar Current date'', id `date`) that defaults a date contextual filter to today. Cases are
    `recipe` (response-graded): they probe documented facts an agent would otherwise read source (src/Plugin/views/argument_default/Date.php)
    to answer; no site mutation. Beta release.'
questions:
- id: calendar-datetime-current-date-plugin
  input: On a Drupal 11 Calendar view I want the calendar to open on today's date when no period is in
    the URL. Which Views argument-default plugin (id and title) does the calendar_datetime submodule provide
    for that?
  criteria: The `date` argument-default plugin titled 'Calendar Current date' (Drupal\calendar_datetime\Plugin\views\argument_default\Date)
    supplies the current date when the contextual filter has no URL value.
  bundle: calendar_datetime
  rubric_ref: rubric/calendar_datetime_calendar_datetime_current_date_plugin@1.0
  tags:
  - mode:recipe
- id: calendar-datetime-wire-in-views
  input: How do I actually set 'Calendar Current date' as the default for a date contextual filter in
    the Views UI so the calendar starts on today?
  criteria: On the date contextual filter, under 'When the filter value is NOT in the URL' choose 'Provide
    default value' and set Type to 'Calendar Current date'.
  bundle: calendar_datetime
  rubric_ref: rubric/calendar_datetime_calendar_datetime_wire_in_views@1.0
  tags:
  - mode:recipe
- id: calendar-datetime-arg-format
  input: The calendar_datetime current-date default is used on arguments of different granularity (year,
    month, day, week). How does it decide what date format the default value uses?
  criteria: If the argument is a Views Date argument exposing getArgFormat(), it formats the current time
    with that format (matching the argument's period granularity); otherwise it falls back to 'Y-m-d'.
  bundle: calendar_datetime
  rubric_ref: rubric/calendar_datetime_calendar_datetime_arg_format@1.0
  tags:
  - mode:recipe
- id: calendar-datetime-request-time
  input: Where does the calendar_datetime 'Calendar Current date' default get its notion of 'now', and
    is the result cached?
  criteria: It reads the request time from the core datetime.time service (getRequestTime()) formatted
    via date.formatter; it implements CacheableDependencyInterface with empty cache contexts and getCacheMaxAge()
    = 0, so the default is not cached.
  bundle: calendar_datetime
  rubric_ref: rubric/calendar_datetime_calendar_datetime_request_time@1.0
  tags:
  - mode:recipe
- id: calendar-datetime-consumed-by-calendar
  input: Why does a fresh Calendar view built from the Calendar module's template already open on the
    current month? What does the calendar_datetime submodule contribute?
  criteria: Calendar's template-generated views select calendar_datetime's 'Calendar Current date' argument-default
    on their date contextual filter, so with no URL date the view defaults to the current period.
  bundle: calendar_datetime
  rubric_ref: rubric/calendar_datetime_calendar_datetime_consumed_by_calendar@1.0
  tags:
  - mode:recipe
- id: calendar-datetime-scope
  input: Does the calendar_datetime submodule add any admin settings form, permissions, config, or Drush
    commands, and what does it require?
  criteria: No — it provides only the 'Calendar Current date' Views argument-default plugin, with no admin
    UI, permissions, config, or Drush commands; it requires core Views (and works with core datetime date
    fields).
  bundle: calendar_datetime
  rubric_ref: rubric/calendar_datetime_calendar_datetime_scope@1.0
  tags:
  - mode:recipe
