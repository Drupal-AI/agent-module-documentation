metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: cacheflush_cron
  version: 2.0.x
  note: cacheflush_cron adds a boolean `cron` base field to the cacheflush entity + a Cron checkbox. When
    a preset with cron=1 is saved, hook_ENTITY_TYPE_insert/update creates an Ultimate Cron CronJob id
    'cacheflush_preset_<preset_id>' (callback cacheflush_cron_clear_preset -> cacheflush.api::clearById).
    cron=0 deactivates the job; deleting the preset deletes the job. Depends on cacheflush_ui + ultimate_cron.
    Medium inspects the CronJob created for a cron-enabled preset; hard creates a cron-enabled preset
    and verifies the cacheflush_preset_<id> job exists.
questions:
- id: cacheflush_cron-what
  input: What does cacheflush_cron let you do, and which module does it require?
  criteria: It lets a CacheFlush preset run automatically on a schedule by wiring cron-enabled presets
    to Ultimate Cron jobs. It requires the ultimate_cron module (and depends on cacheflush_ui). Enable
    Cron on a preset and its caches get cleared on each scheduled cron run.
  bundle: cacheflush_cron
  rubric_ref: rubric/cacheflush_cron_cacheflush_cron_what@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: cacheflush_cron-job-id
  input: When you enable cron on a CacheFlush preset, what Ultimate Cron job gets created for it (its
    id pattern), and what does that job do?
  criteria: An Ultimate Cron CronJob with id cacheflush_preset_<preset_id> is created (callback cacheflush_cron_clear_preset),
    which loads that preset and calls cacheflush.api::clearById() each time it fires.
  bundle: cacheflush_cron
  rubric_ref: rubric/cacheflush_cron_cacheflush_cron_job_id@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: cacheflush_cron-lifecycle
  input: In cacheflush_cron, what happens to the Ultimate Cron job when you disable cron on a preset,
    and when you delete the preset?
  criteria: Disabling cron sets the job inactive (setStatus(FALSE)) rather than deleting it; deleting
    the preset deletes the cacheflush_preset_<id> job (hook_ENTITY_TYPE_delete).
  bundle: cacheflush_cron
  rubric_ref: rubric/cacheflush_cron_cacheflush_cron_lifecycle@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: cacheflush_cron-known
  input: On this site a CacheFlush preset named cfc_known has cron enabled. Inspect the running site (Ultimate
    Cron jobs) and give the id of the cron job created for it.
  criteria: The Ultimate Cron job is named cacheflush_preset_<id> where <id> is the cfc_known preset's
    entity id (e.g. cacheflush_preset_17). Found via the Ultimate Cron job list or CronJob::load('cacheflush_preset_'.$id).
  bundle: cacheflush_cron
  rubric_ref: rubric/cacheflush_cron_cacheflush_cron_known@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/cacheflush_cron-known-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/cacheflush_cron-known-cleanup.sh
- id: cacheflush_cron-schedule
  input: Using cacheflush_cron, create a published CacheFlush preset named 'cfc_task' that is scheduled
    to run via cron (cron enabled), so that an Ultimate Cron job is created for it. Apply it to the live
    site.
  criteria: A `cacheflush` preset 'cfc_task' saved with its `cron` field set to 1, which causes an Ultimate
    Cron CronJob 'cacheflush_preset_<id>' to be created (checkable via CronJob::load).
  bundle: cacheflush_cron
  rubric_ref: rubric/cacheflush_cron_cacheflush_cron_schedule@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/cacheflush_cron-schedule-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/cacheflush_cron-schedule-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/cacheflush_cron-schedule-verify.sh
