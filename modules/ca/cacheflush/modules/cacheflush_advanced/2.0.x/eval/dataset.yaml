metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: cacheflush_advanced
  version: 2.0.x
  note: 'cacheflush_advanced adds a ''Custom (advanced)'' vertical tab (hook_cacheflush_ui_tabs id vertical_tabs_advance)
    to the CacheFlush preset form for targeted clears: delete a specific cache id from a bin (stored as
    CacheflushApi::clearBinCache([bin,''delete'',cid]) under data[''advanced'']) and invalidate cache
    tags (stored as CacheflushApi::clearCacheTags([tags]) under data[''cache_tags'']). Depends on cacheflush_ui;
    no permissions/config/Drush. Medium inspects a preset that clears a known tag; hard builds a preset
    that invalidates the node_list cache tag, verified via SQL on the cacheflush data blob.'
questions:
- id: cacheflush_advanced-what
  input: What does the cacheflush_advanced submodule add to CacheFlush presets?
  criteria: It adds a 'Custom (advanced)' tab to the preset form that lets a preset delete specific cache
    ids from a chosen bin and invalidate specific cache tags (comma-separated), rather than clearing whole
    bins.
  bundle: cacheflush_advanced
  rubric_ref: rubric/cacheflush_advanced_cacheflush_advanced_what@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: cacheflush_advanced-cid-storage
  input: How does cacheflush_advanced store a 'delete this cache id from this bin' instruction in a CacheFlush
    preset?
  criteria: Each advanced row is stored in the preset data (data['advanced']['functions']) as a call to
    CacheflushApi::clearBinCache with params [<bin_service_id>, 'delete', <cid>], i.e. delete that specific
    cache id from that bin.
  bundle: cacheflush_advanced
  rubric_ref: rubric/cacheflush_advanced_cacheflush_advanced_cid_storage@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: cacheflush_advanced-tags-storage
  input: How does cacheflush_advanced let a preset invalidate cache tags, and how is that stored?
  criteria: The 'Cache tags' field (comma-separated) is stored in data['cache_tags']['functions'] as a
    call to CacheflushApi::clearCacheTags(<tags>), which runs Cache::invalidateTags(explode(',', $tags))
    when the preset is cleared.
  bundle: cacheflush_advanced
  rubric_ref: rubric/cacheflush_advanced_cacheflush_advanced_tags_storage@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: cacheflush_advanced-known
  input: On this site there is a CacheFlush preset named cfa_known configured with an advanced cache-tag
    invalidation. Inspect the preset and state which cache tag it invalidates.
  criteria: The preset cfa_known's data has a cache_tags function calling CacheflushApi::clearCacheTags('node_list')
    — it invalidates the node_list cache tag. Read via `drush sqlq "SELECT data FROM cacheflush WHERE
    title='cfa_known'"`.
  bundle: cacheflush_advanced
  rubric_ref: rubric/cacheflush_advanced_cacheflush_advanced_known@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/cacheflush_advanced-known-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/cacheflush_advanced-known-cleanup.sh
- id: cacheflush_advanced-build-tag
