rubrics:
- id: cacheflush_advanced_cacheflush_advanced_what
  version: '1.0'
  applicable_bundles:
  - cacheflush_advanced
  checks:
  - kind: must_contain_any
    values:
    - cache id
    - cid
    - cache tag
    - Custom (advanced)
    - clearCacheTags
  scoring:
    combine: all_pass
- id: cacheflush_advanced_cacheflush_advanced_cid_storage
  version: '1.0'
  applicable_bundles:
  - cacheflush_advanced
  checks:
  - kind: must_contain_any
    values:
    - clearBinCache
    - delete
    - cid
    - advanced
  scoring:
    combine: all_pass
- id: cacheflush_advanced_cacheflush_advanced_tags_storage
  version: '1.0'
  applicable_bundles:
  - cacheflush_advanced
  checks:
  - kind: must_contain_any
    values:
    - clearCacheTags
    - cache_tags
    - invalidateTags
    - cache tags
  scoring:
    combine: all_pass
- id: cacheflush_advanced_cacheflush_advanced_known
  version: '1.0'
  applicable_bundles:
  - cacheflush_advanced
  checks:
  - kind: must_contain_any
    values:
    - node_list
  scoring:
    combine: all_pass
- id: cacheflush_advanced_cacheflush_advanced_build_tag
  version: '1.0'
  applicable_bundles:
  - cacheflush_advanced
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
