rubrics:
- id: cacheflush_entity_cacheflush_entity_type_id
  version: '1.0'
  applicable_bundles:
  - cacheflush_entity
  checks:
  - kind: must_contain_any
    values:
    - cacheflush
    - base_table
    - title
    - status
    - data
  scoring:
    combine: all_pass
- id: cacheflush_entity_cacheflush_entity_helpers
  version: '1.0'
  applicable_bundles:
  - cacheflush_entity
  checks:
  - kind: must_contain_any
    values:
    - cacheflush_create
    - cacheflush_load
    - cacheflush_load_multiple
    - cacheflush_load_multiple_by_properties
    - cacheflush_delete
  scoring:
    combine: all_pass
- id: cacheflush_entity_cacheflush_entity_data_field
  version: '1.0'
  applicable_bundles:
  - cacheflush_entity
  checks:
  - kind: must_contain_any
    values:
    - data
    - getData
    - setData
    - serialize
    - map
  scoring:
    combine: all_pass
- id: cacheflush_entity_cacheflush_entity_known
  version: '1.0'
  applicable_bundles:
  - cacheflush_entity
  checks:
  - kind: must_contain_any
    values:
    - cfe_known
  scoring:
    combine: all_pass
- id: cacheflush_entity_cacheflush_entity_create
  version: '1.0'
  applicable_bundles:
  - cacheflush_entity
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
