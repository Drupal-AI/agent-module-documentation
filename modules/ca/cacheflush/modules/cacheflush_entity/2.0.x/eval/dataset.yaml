metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: cacheflush_entity
  version: 2.0.x
  note: cacheflush_entity defines the `cacheflush` content entity (base_table `cacheflush`, keys id/title/uuid;
    fields title/uid/status/data/created/changed) that stores CacheFlush presets, plus procedural helpers
    cacheflush_create/load/load_multiple/load_multiple_by_properties/delete/delete_multiple. No UI/routes/permissions
    of its own. Medium inspects an existing entity; hard creates one via the API, verified against the
    cacheflush table.
questions:
- id: cacheflush_entity-type-id
  input: What entity type and database table does cacheflush_entity provide for storing CacheFlush presets,
    and what are its key fields?
  criteria: It defines the `cacheflush` content entity stored in the base table `cacheflush`, with fields
    id, uuid, title (label), uid (author), status (enabled flag), data (the serialized preset function
    map), created and changed.
  bundle: cacheflush_entity
  rubric_ref: rubric/cacheflush_entity_cacheflush_entity_type_id@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: cacheflush_entity-helpers
  input: Which procedural helper functions does cacheflush_entity provide to create and load CacheFlush
    preset entities programmatically?
  criteria: cacheflush_create(), cacheflush_load(), cacheflush_load_multiple(), cacheflush_load_multiple_by_properties(),
    cacheflush_delete(), cacheflush_delete_multiple() — thin wrappers over the 'cacheflush' entity storage.
  bundle: cacheflush_entity
  rubric_ref: rubric/cacheflush_entity_cacheflush_entity_helpers@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: cacheflush_entity-data-field
  input: In the cacheflush entity, how is a preset's set of cache-clear operations stored, and how do
    you read/write it in code?
  criteria: The operations are stored in the `data` map field. $entity->setData($array) serialises the
    function map into it, and $entity->getData() returns it back. Each entry is an option id → ['functions'
    => [ ['#name'=>callable,'#params'=>[...]] ]].
  bundle: cacheflush_entity
  rubric_ref: rubric/cacheflush_entity_cacheflush_entity_data_field@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: cacheflush_entity-known
  input: This Drupal site has a CacheFlush preset entity. Using the cacheflush entity storage, inspect
    the running site and give the title of the cacheflush entity that exists.
  criteria: A `cacheflush` entity titled 'cfe_known' exists (status 1). Found via cacheflush_load_multiple(),
    \Drupal::entityQuery('cacheflush'), or `drush sqlq "SELECT title FROM cacheflush"`.
  bundle: cacheflush_entity
  rubric_ref: rubric/cacheflush_entity_cacheflush_entity_known@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/cacheflush_entity-known-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/cacheflush_entity-known-cleanup.sh
- id: cacheflush_entity-create
  input: Using the cacheflush entity API, create and save an enabled (published) cacheflush preset entity
    titled exactly 'cfe_task' on this site.
  criteria: A `cacheflush` entity titled 'cfe_task' with status=1 is saved, e.g. via cacheflush_create(['title'=>'cfe_task','status'=>1])->save()
    or the 'cacheflush' entity storage create()->save().
  bundle: cacheflush_entity
  rubric_ref: rubric/cacheflush_entity_cacheflush_entity_create@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/cacheflush_entity-create-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/cacheflush_entity-create-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/cacheflush_entity-create-verify.sh
