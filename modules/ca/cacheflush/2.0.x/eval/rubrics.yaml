rubrics:
- id: cacheflush_cacheflush_clear_all_route
  version: '1.0'
  applicable_bundles:
  - cacheflush
  checks:
  - kind: must_contain_any
    values:
    - /admin/cacheflush/clear/all
    - cacheflush clear cache
    - drupal_flush_all_caches
    - clearAll
  scoring:
    combine: all_pass
- id: cacheflush_cacheflush_what_is_preset
  version: '1.0'
  applicable_bundles:
  - cacheflush
  checks:
  - kind: must_contain_any
    values:
    - cacheflush
    - preset
    - clearById
    - clearPresetCache
    - entity
  scoring:
    combine: all_pass
- id: cacheflush_cacheflush_service_and_options
  version: '1.0'
  applicable_bundles:
  - cacheflush
  checks:
  - kind: must_contain_any
    values:
    - cacheflush.api
    - CacheflushApi
    - hook_cacheflush_tabs_options
    - clearBinCache
  scoring:
    combine: all_pass
- id: cacheflush_cacheflush_known_preset
  version: '1.0'
  applicable_bundles:
  - cacheflush
  checks:
  - kind: must_contain_any
    values:
    - cf_known
  scoring:
    combine: all_pass
- id: cacheflush_cacheflush_which_enabled
  version: '1.0'
  applicable_bundles:
  - cacheflush
  checks:
  - kind: must_contain_any
    values:
    - cf_on
  scoring:
    combine: all_pass
- id: cacheflush_cacheflush_build_render_preset
  version: '1.0'
  applicable_bundles:
  - cacheflush
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
- id: cacheflush_cacheflush_build_twig_preset
  version: '1.0'
  applicable_bundles:
  - cacheflush
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
