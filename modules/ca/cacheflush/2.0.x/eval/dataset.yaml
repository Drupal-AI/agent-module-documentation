metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: cacheflush
  version: 2.0.x
  note: 'CacheFlush builds cache-clearing PRESETS (the `cacheflush` content entity, base table `cacheflush`,
    provided by cacheflush_entity). Service/controller cacheflush.api (CacheflushApi) does clearAll (drupal_flush_all_caches),
    clearById/clearPresetCache (run a preset''s stored #name/#params functions), clearBinCache, clearStorageCache(''twig''),
    clearModuleCache, clearCacheTags. Ready routes /admin/cacheflush/clear/all and /admin/cacheflush/clear/{cacheflush},
    permission ''cacheflush clear cache''. Option catalog = cache bins + hook_cacheflush_tabs_options
    (base adds static/asset/kernel/twig/plugin/module/router). A preset row has title/status/data(serialized).
    Medium cases inspect real preset rows; hard cases build a published preset whose serialized data clears
    a specific target (render bin / twig storage), verified via SQL on the cacheflush table (no rendering).'
questions:
- id: cacheflush-clear-all-route
  input: With the cacheflush module, what is the ready-made way to flush ALL Drupal caches, and which
    permission controls it?
  criteria: Visit /admin/cacheflush/clear/all (route cacheflush.presets.clearall, controller CacheflushApi::clearAll
    which calls drupal_flush_all_caches()). It is gated by the 'cacheflush clear cache' permission.
  bundle: cacheflush
  rubric_ref: rubric/cacheflush_cacheflush_clear_all_route@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: cacheflush-what-is-preset
  input: In the cacheflush module, what is a 'preset' and how does clearing one work?
  criteria: 'A preset is a `cacheflush` content entity whose `data` field stores the selected cache-clear
    options as callable #name/#params function definitions. Clearing it (CacheflushApi::clearById/clearPresetCache)
    runs those functions in order; a disabled preset (status 0) is refused with a 403.'
  bundle: cacheflush
  rubric_ref: rubric/cacheflush_cacheflush_what_is_preset@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: cacheflush-service-and-options
  input: Which service does cacheflush expose for clearing caches programmatically, and how can another
    module add its own clearable option to cacheflush presets?
  criteria: 'The service is cacheflush.api (Drupal\cacheflush\Controller\CacheflushApi) with methods like
    clearBinCache(), clearStorageCache(), clearModuleCache(), clearCacheTags(). Other modules add clearable
    options by implementing hook_cacheflush_tabs_options() (returning option ids with category + #name/#params
    functions).'
  bundle: cacheflush
  rubric_ref: rubric/cacheflush_cacheflush_service_and_options@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: cacheflush-known-preset
  input: This Drupal site has a cacheflush preset configured. Inspect the cacheflush entities/table and
    give the title of the preset that exists.
  criteria: A published `cacheflush` preset titled 'cf_known' exists (it clears the render cache). Found
    via e.g. `drush sqlq "SELECT title, status FROM cacheflush"`.
  bundle: cacheflush
  rubric_ref: rubric/cacheflush_cacheflush_known_preset@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/cacheflush-known-preset-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/cacheflush-known-preset-cleanup.sh
- id: cacheflush-which-enabled
  input: This site has two cacheflush presets, cf_on and cf_off. Exactly one is enabled (published). Inspect
    the live cacheflush entities and state which preset is enabled.
  criteria: cf_on is enabled (status = 1); cf_off has status = 0. A disabled preset cannot be cleared
    (403). Read via `drush sqlq "SELECT title, status FROM cacheflush"`.
  bundle: cacheflush
  rubric_ref: rubric/cacheflush_cacheflush_which_enabled@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/cacheflush-enabled-preset-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/cacheflush-enabled-preset-cleanup.sh
- id: cacheflush-build-render-preset
  input: Using the cacheflush module, create a published cache-flush preset named exactly 'cf_task' that
    clears the render cache (the render cache bin) when run. Apply it to the live site.
  criteria: A `cacheflush` entity titled 'cf_task' with status=1 whose data selects the render bin (its
    functions call CacheflushApi::clearBinCache with 'cache.render'), e.g. created via the /admin/structure/cacheflush/add
    form (Core cache tables → render) or the entity API.
  bundle: cacheflush
  rubric_ref: rubric/cacheflush_cacheflush_build_render_preset@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/cacheflush-build-render-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/cacheflush-build-render-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/cacheflush-build-render-verify.sh
- id: cacheflush-build-twig-preset
  input: Create a published cacheflush preset named 'cf_task_twig' that wipes the Twig PHP storage cache
    (the module's 'twig' option) when executed, and save it on this site.
  criteria: A `cacheflush` entity titled 'cf_task_twig' with status=1 whose data includes the 'twig' option
    (CacheflushApi::clearStorageCache('twig')), created via the preset form ('Other core cache options'
    → Twig) or the entity API.
  bundle: cacheflush
