metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: cacheexclude
  version: 3.0.x
  note: 'Cache Exclude keeps specific paths and content types out of Drupal''s anonymous page cache via
    the core page_cache_kill_switch, driven by one settings form and one config object. Cases are `recipe`
    (response-graded): they probe documented facts an agent would otherwise read source to answer; no
    site mutation.'
questions:
- id: cacheexclude-config-route
  input: On a Drupal 11 site, where do I configure which pages this module keeps out of the cache? Give
    the admin path and the route name.
  criteria: The settings form is at /admin/config/system/cacheexclude (route cacheexclude.settings), under
    Configuration > System > 'Cache exclusions'.
  bundle: cacheexclude
  rubric_ref: rubric/cacheexclude_cacheexclude_config_route@1.0
  tags:
  - mode:recipe
- id: cacheexclude-config-keys
  input: Which config object and keys store the cache exclusion rules for this module?
  criteria: The cacheexclude.settings config object, with keys cacheexclude_list (multi-line string of
    paths) and cacheexclude_node_types (sequence of node bundle machine names).
  bundle: cacheexclude
  rubric_ref: rubric/cacheexclude_cacheexclude_config_keys@1.0
  tags:
  - mode:recipe
- id: cacheexclude-mechanism
  input: How does this module actually prevent a matching page from being cached for anonymous users?
  criteria: A KernelEvents::REQUEST event subscriber (CacheexcludeSubscriber) matches the request and
    triggers the core page cache kill switch (page_cache_kill_switch), so that response is not stored
    in the anonymous page cache.
  bundle: cacheexclude
  rubric_ref: rubric/cacheexclude_cacheexclude_mechanism@1.0
  tags:
  - mode:recipe
- id: cacheexclude-path-syntax
  input: How do I exclude every page under blog/ and the front page? What syntax does the paths field
    accept?
  criteria: Enter one Drupal path per line in cacheexclude_list; '*' is a wildcard (blog/* excludes everything
    under blog/) and <front> matches the front page. Both the internal path and its URL alias are matched.
  bundle: cacheexclude
  rubric_ref: rubric/cacheexclude_cacheexclude_path_syntax@1.0
  tags:
  - mode:recipe
- id: cacheexclude-node-type
  input: Can I exclude an entire content type from caching with this module, and how?
  criteria: Yes. Tick the content types on the settings form (stored in cacheexclude_node_types); the
    subscriber compares the routed node's bundle and fires the kill switch when it matches.
  bundle: cacheexclude
  rubric_ref: rubric/cacheexclude_cacheexclude_node_type@1.0
  tags:
  - mode:recipe
- id: cacheexclude-permission
  input: What permission is needed to change this module's settings? Does it define its own permission?
  criteria: It defines no permission of its own; the form is gated by the core 'administer site configuration'
    permission.
  bundle: cacheexclude
  rubric_ref: rubric/cacheexclude_cacheexclude_permission@1.0
  tags:
  - mode:recipe
- id: cacheexclude-dependency
  input: What are this module's dependencies and Drupal core compatibility?
  criteria: It depends only on core path_alias and declares core_version_requirement ^11.3 || ^12.
  bundle: cacheexclude
  rubric_ref: rubric/cacheexclude_cacheexclude_dependency@1.0
  tags:
  - mode:recipe
- id: cacheexclude-d7-migration
  input: I'm upgrading from Drupal 7 where I used cacheexclude. Does the module carry my old settings
    over?
  criteria: Yes. It ships the cacheexclude_settings migration (source plugin id cacheexclude reading the
    D7 cacheexclude_list and cacheexclude_node_types variables, process plugins cacheexclude_paths/cacheexclude_nodes)
    writing to the cacheexclude.settings config object.
  bundle: cacheexclude
  rubric_ref: rubric/cacheexclude_cacheexclude_d7_migration@1.0
  tags:
  - mode:recipe
