rubrics:
- id: canvas_full_html_canvas_full_html_config_key
  version: '1.0'
  applicable_bundles:
  - canvas_full_html
  checks:
  - kind: must_contain_any
    values:
    - canvas_full_html.settings
    - enabled
    - /admin/config/content/canvas-full-html
    - canvas-full-html
  scoring:
    combine: all_pass
- id: canvas_full_html_canvas_full_html_what_it_swaps
  version: '1.0'
  applicable_bundles:
  - canvas_full_html
  checks:
  - kind: must_contain_any
    values:
    - canvas_full_html
    - canvas_html_block
    - canvas_html_inline
    - canvas_storable_prop_shape_alter
    - text/html
  scoring:
    combine: all_pass
- id: canvas_full_html_canvas_full_html_edit_toolbar
  version: '1.0'
  applicable_bundles:
  - canvas_full_html
  checks:
  - kind: must_contain_any
    values:
    - /admin/config/content/formats/manage/canvas_full_html
    - canvas_full_html
    - text format
    - CKEditor
  scoring:
    combine: all_pass
- id: canvas_full_html_canvas_full_html_current_enabled
  version: '1.0'
  applicable_bundles:
  - canvas_full_html
  checks:
  - kind: must_contain_any
    values:
    - canvas_full_html.settings
    - enabled
    - 'false'
    - 'off'
    - disabled
  scoring:
    combine: all_pass
- id: canvas_full_html_canvas_full_html_toolbar_items
  version: '1.0'
  applicable_bundles:
  - canvas_full_html
  checks:
  - kind: must_contain_any
    values:
    - sourceEditing
    - source editing
    - 'yes'
  scoring:
    combine: all_pass
- id: canvas_full_html_canvas_full_html_disable_integration
  version: '1.0'
  applicable_bundles:
  - canvas_full_html
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
- id: canvas_full_html_canvas_full_html_add_code_button
  version: '1.0'
  applicable_bundles:
  - canvas_full_html
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
