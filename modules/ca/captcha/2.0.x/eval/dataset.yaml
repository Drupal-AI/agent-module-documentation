metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: captcha
  version: 2.0.x
  note: CAPTCHA is configuration-heavy (a settings object plus per-form CAPTCHA point config entities)
    but has no drush commands and no plugin type. The easy `recipe` cases (response-graded) probe config-entity
    shape, settings keys, challenge-type strings, routes, and permission machine names. The hard `execution`
    cases build real config against the live site (a captcha_point config entity per form plus the captcha.settings
    default_challenge) and are graded by reset->build->verify live-state checks.
questions:
- id: captcha-point-config-entity
  input: On a Drupal 11 site with the captcha module, I want to attach a challenge to my form with form
    ID `comment_comment_form` as exportable config. What config entity / YAML file do I create and which
    keys does it need?
  criteria: 'Create a `captcha_point` config entity, exported as `captcha.captcha_point.comment_comment_form.yml`,
    with `formId: comment_comment_form` and a `captchaType` (e.g. `default`, `captcha/Math`, or `image_captcha/Image`).'
  bundle: captcha
  rubric_ref: rubric/captcha_captcha_point_config_entity@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: captcha-default-challenge-setting
  input: In the captcha module on Drupal 11, which config object and key set the default challenge type
    used when a CAPTCHA point is set to "default", and what is its default value? Give the drush command
    to read it.
  criteria: The `captcha.settings` config object, key `default_challenge`, defaulting to `captcha/Math`.
    Read with `drush config:get captcha.settings`.
  bundle: captcha
  rubric_ref: rubric/captcha_captcha_default_challenge_setting@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: captcha-image-submodule
  input: I want a distorted-text image challenge instead of the math question in the captcha module. Which
    submodule provides it and what challenge type string do I use in a CAPTCHA point's captchaType?
  criteria: Enable the bundled `image_captcha` submodule; use the challenge type string `image_captcha/Image`
    as the `captchaType`.
  bundle: captcha
  rubric_ref: rubric/captcha_captcha_image_submodule@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: captcha-admin-route
  input: Where is the CAPTCHA global settings form in the Drupal admin, and what is its route machine
    name?
  criteria: Admin -> Config -> People -> CAPTCHA at `/admin/config/people/captcha`, route `captcha_settings`.
  bundle: captcha
  rubric_ref: rubric/captcha_captcha_admin_route@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: captcha-permissions
  input: In the captcha module, what are the machine names of the two permissions - one to administer
    the module and one that exempts a user from being challenged?
  criteria: '`administer CAPTCHA settings` (full admin access) and `skip CAPTCHA` (never shown a challenge).'
  bundle: captcha
  rubric_ref: rubric/captcha_captcha_permissions@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: captcha-render-element
  input: In PHP on a Drupal 11 site, add a CAPTCHA challenge directly to my own form's render array without
    creating a CAPTCHA point. Show the element.
  criteria: Add `$form['captcha'] = ['#type' => 'captcha', '#captcha_type' => 'default'];` (or e.g. `image_captcha/Image`).
  bundle: captcha
  rubric_ref: rubric/captcha_captcha_render_element@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: captcha-hook-challenge-type
  input: I want to add a custom challenge type to the captcha module (it has no plugin type). Which hook
    do I implement, and what are the two main `$op` values it must handle?
  criteria: Implement `hook_captcha($op, $captcha_type, $captcha_sid)`, handling `$op` = `'list'` (return
    your type names) and `'generate'` (return `solution` and `form` with a `captcha_response` element).
  bundle: captcha
  rubric_ref: rubric/captcha_captcha_hook_challenge_type@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: captcha-persistence-setting
  input: In the captcha module settings, which key controls how often a user must re-solve a CAPTCHA,
    and what does a value of 0 versus the default mean?
  criteria: The `persistence` key in `captcha.settings`; 0 = always show, default 1 = skip once solved
    per form instance (2 = per form type, 3 = once solved anywhere).
  bundle: captcha
  rubric_ref: rubric/captcha_captcha_persistence_setting@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: captcha-login-math-challenge
  input: On this Drupal site, protect the user login form from bots by putting a math question challenge
    on it. Anyone visiting the login page should have to answer a simple arithmetic problem before they
    can submit. Make it live now.
  criteria: 'Create/enable a `captcha_point` config entity for form ID `user_login_form` with `captchaType:
    captcha/Math` (status enabled), e.g. `captcha.captcha_point.user_login_form.yml`, then clear caches
    so it applies to the live login form.'
  bundle: captcha
  rubric_ref: rubric/captcha_captcha_login_math_challenge@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/captcha-login-math-reset.sh
    verify: agent-module-documentation/evaluation/verify/captcha-login-math-verify.sh
- id: captcha-register-math-default
  input: On this Drupal site, make the math-question challenge the site-wide default that any form set
    to the default challenge will use, and separately switch on a challenge for the new-account registration
    form so people signing up have to pass it. Apply both to the running site.
  criteria: 'Set `default_challenge: captcha/Math` in `captcha.settings`, and create/enable a `captcha_point`
    config entity for form ID `user_register_form` (e.g. `captcha.captcha_point.user_register_form.yml`,
    status enabled), then clear caches.'
  bundle: captcha
  rubric_ref: rubric/captcha_captcha_register_math_default@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/captcha-register-default-reset.sh
    verify: agent-module-documentation/evaluation/verify/captcha-register-default-verify.sh
