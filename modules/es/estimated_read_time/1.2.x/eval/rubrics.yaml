rubrics:
- id: estimated_read_time_estimated_read_time_field_type
  version: '1.0'
  applicable_bundles:
  - estimated_read_time
  checks:
  - kind: must_contain_any
    values:
    - estimated_read_time
    - '230'
    - words_per_minute
    - minutes
  scoring:
    combine: all_pass
- id: estimated_read_time_estimated_read_time_formatter
  version: '1.0'
  applicable_bundles:
  - estimated_read_time
  checks:
  - kind: must_contain_any
    values:
    - tokenized_string
    - '@minutes'
    - estimated_read_time_text
    - '@seconds'
  scoring:
    combine: all_pass
- id: estimated_read_time_estimated_read_time_known_wpm
  version: '1.0'
  applicable_bundles:
  - estimated_read_time
  checks:
  - kind: must_contain_any
    values:
    - '300'
  scoring:
    combine: all_pass
- id: estimated_read_time_estimated_read_time_known_format
  version: '1.0'
  applicable_bundles:
  - estimated_read_time
  checks:
  - kind: must_contain_any
    values:
    - '@minutes minute read time'
  scoring:
    combine: all_pass
- id: estimated_read_time_estimated_read_time_add_field
  version: '1.0'
  applicable_bundles:
  - estimated_read_time
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
- id: estimated_read_time_estimated_read_time_auto_compute
  version: '1.0'
  applicable_bundles:
  - estimated_read_time
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
