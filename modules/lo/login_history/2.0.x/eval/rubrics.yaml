rubrics:
- id: login_history_login_history_where_stored
  version: '1.0'
  applicable_bundles:
  - login_history
  checks:
  - kind: must_contain_any
    values:
    - login_history
    - hook_user_login
    - user_login
  scoring:
    combine: all_pass
- id: login_history_login_history_retention
  version: '1.0'
  applicable_bundles:
  - login_history
  checks:
  - kind: must_contain_any
    values:
    - keep_user
    - login_history.settings
    - '50'
  scoring:
    combine: all_pass
- id: login_history_login_history_reports_perms
  version: '1.0'
  applicable_bundles:
  - login_history
  checks:
  - kind: must_contain_any
    values:
    - /admin/reports/login-history
    - view all login histories
    - view own login history
    - /user/
  scoring:
    combine: all_pass
- id: login_history_login_history_keep_user_current
  version: '1.0'
  applicable_bundles:
  - login_history
  checks:
  - kind: must_contain_any
    values:
    - '13'
  scoring:
    combine: all_pass
- id: login_history_login_history_last_ip
  version: '1.0'
  applicable_bundles:
  - login_history
  checks:
  - kind: must_contain_any
    values:
    - 198.51.100.42
  scoring:
    combine: all_pass
- id: login_history_login_history_set_keep_user
  version: '1.0'
  applicable_bundles:
  - login_history
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
- id: login_history_login_history_place_block
  version: '1.0'
  applicable_bundles:
  - login_history
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
