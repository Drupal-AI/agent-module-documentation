metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: login_history
  version: 2.0.x
  note: Login History records one row per successful login into a dedicated login_history base table (uid,
    login timestamp, hostname/IP, user_agent, one_time flag) via hook_user_login(). Retention is bounded
    by the single config value login_history.settings:keep_user (default 50; 0 = keep all), pruned at
    login time and on cron. Data is surfaced via a Views base table (login_history joined to users_field_data),
    two report routes (/admin/reports/login-history for perm 'view all login histories'; /user/{user}/login-history
    for 'view own login history'), and the last_login_block block plugin. Introspection cases read live
    config (keep_user) and the live login_history table; execution cases set the retention config and
    place the last_login_block, both verified against live state.
questions:
- id: login_history-where-stored
  input: On a Drupal site with the login_history module, where is each user login recorded, and which
    hook writes that record? Name the storage and the hook.
  criteria: Each successful login is inserted as a row into the module's own login_history database table
    by hook_user_login() (login_history_user_login), capturing uid, login timestamp, hostname (IP), user_agent,
    and a one_time flag.
  bundle: login_history
  rubric_ref: rubric/login_history_login_history_where_stored@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: login_history-retention
  input: How do I limit how many login records login_history keeps per user, and what is the default?
    What config key controls it?
  criteria: The config object login_history.settings has a single key keep_user (default 50). It caps
    rows per user; 0 keeps all. Pruning to the limit happens at login time and on cron (hook_cron). Set
    it at /admin/config/people/login-history or with drush cset login_history.settings keep_user <n>.
  bundle: login_history
  rubric_ref: rubric/login_history_login_history_retention@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: login_history-reports-perms
  input: Which pages does login_history provide to view login history, and which permissions gate them?
  criteria: Site-wide report at /admin/reports/login-history (permission 'view all login histories', route
    login_history.report, backed by the login_history View), and a per-user report at /user/{user}/login-history
    (permission 'view own login history', route login_history.user_report). A 'Last login' block (last_login_block)
    is also provided.
  bundle: login_history
  rubric_ref: rubric/login_history_login_history_reports_perms@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: login_history-keep-user-current
  input: On this Drupal site, login_history has been configured with a specific per-user retention limit.
    Inspect the live configuration and state the current value of keep_user.
  criteria: keep_user is 13 in login_history.settings (drush cget login_history.settings keep_user).
  bundle: login_history
  rubric_ref: rubric/login_history_login_history_keep_user_current@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/login_history-keepuser-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/login_history-keepuser-cleanup.sh
- id: login_history-last-ip
  input: This site's login_history table has a recorded login for user 1. Inspect the live login_history
    table and report the IP address (hostname) stored for that user's most recent recorded login.
  criteria: The hostname is 198.51.100.42 (SELECT hostname FROM login_history WHERE uid=1 ORDER BY login
    DESC LIMIT 1).
  bundle: login_history
  rubric_ref: rubric/login_history_login_history_last_ip@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/login_history-lastrow-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/login_history-lastrow-cleanup.sh
- id: login_history-set-keep-user
  input: On this Drupal site, configure login_history to keep at most 10 login records per user, and apply
    the change to the live site.
  criteria: login_history.settings:keep_user is set to 10 (drush cset login_history.settings keep_user
    10 -y, or via /admin/config/people/login-history).
  bundle: login_history
  rubric_ref: rubric/login_history_login_history_set_keep_user@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/login_history-keepuser-set-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/login_history-keepuser-set-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/login_history-keepuser-set-verify.sh
- id: login_history-place-block
  input: Place login_history's 'Last login' block into a region of the site's default theme, so authenticated
    users see when they last logged in. Apply the change to the live site.
  criteria: An enabled block config entity using plugin last_login_block is created in the default theme
    (e.g. Block::create(['id'=>'...','theme'=><default>,'region'=>'content','plugin'=>'last_login_block',
    ...])->save(), or via /admin/structure/block).
  bundle: login_history
  rubric_ref: rubric/login_history_login_history_place_block@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/login_history-block-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/login_history-block-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/login_history-block-verify.sh
