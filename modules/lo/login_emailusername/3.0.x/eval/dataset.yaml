metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: login_emailusername
  version: 3.0.x
  note: 'login_emailusername has no config, no permissions, no plugins — it alters the login form and
    overrides two REST controllers. Cases are `recipe` (response-graded): they probe documented facts
    (what it does, how email resolves to a username, that the username field is kept, the REST endpoints)
    an agent would otherwise read source for. No site mutation.'
questions:
- id: login-emailusername-either-identifier
  input: On a Drupal 11 site I want users to be able to log in with EITHER their username OR their email
    address from the same login box. Which contrib module provides this, and does it need configuration?
  criteria: The login_emailusername module accepts either a username or an email in the standard login
    form's name field. It has no configuration — just enable it (drush en login_emailusername -y).
  bundle: login_emailusername
  rubric_ref: rubric/login_emailusername_login_emailusername_either_identifier@1.0
  tags:
  - mode:recipe
- id: login-emailusername-keeps-username
  input: Does login_emailusername replace or remove the username field like email_registration does, or
    does it keep usernames?
  criteria: It keeps the username field and usernames intact; it just also accepts an email in the same
    input box. Unlike email_registration it does not replace the username field.
  bundle: login_emailusername
  rubric_ref: rubric/login_emailusername_login_emailusername_keeps_username@1.0
  tags:
  - mode:recipe
- id: login-emailusername-resolution
  input: How does login_emailusername turn an email typed into the login form into the account that gets
    authenticated? Which functions does it call?
  criteria: Its validate handler tries user_load_by_name() first; if no username matches it falls back
    to user_load_by_mail(), then rewrites the form's name value to that account's username (getAccountName())
    so core authenticates normally.
  bundle: login_emailusername
  rubric_ref: rubric/login_emailusername_login_emailusername_resolution@1.0
  tags:
  - mode:recipe
- id: login-emailusername-form-alter
  input: Which Drupal form does login_emailusername alter, and what does it change about the name field?
  criteria: It implements hook_form_FORM_ID_alter() on user_login_form, relabels the name field to 'Username
    or email address', updates its description, and adds an element-validate handler.
  bundle: login_emailusername
  rubric_ref: rubric/login_emailusername_login_emailusername_form_alter@1.0
  tags:
  - mode:recipe
- id: login-emailusername-rest-login
  input: Can a decoupled/JSON client authenticate with an email address using login_emailusername, and
    how is that implemented?
  criteria: Yes. A RouteSubscriber overrides the user.login.http route's controller with a subclass of
    core's UserAuthenticationController that resolves an email to the username before flood control and
    account lookup.
  bundle: login_emailusername
  rubric_ref: rubric/login_emailusername_login_emailusername_rest_login@1.0
  tags:
  - mode:recipe
- id: login-emailusername-password-reset
  input: On the REST password-reset endpoint, can login_emailusername accept either a username or an email?
    Which route does it override?
  criteria: Yes. It overrides the user.pass.http route with resetPassword(), which accepts a name or mail
    credential and looks the account up by either before sending the core password-reset email.
  bundle: login_emailusername
  rubric_ref: rubric/login_emailusername_login_emailusername_password_reset@1.0
  tags:
  - mode:recipe
- id: login-emailusername-no-config
  input: What configuration and permissions does login_emailusername add on a Drupal site?
  criteria: None. It defines no settings form, no config object, and no permissions; enabling the module
    is all that is needed. Its only dependency is core user.
  bundle: login_emailusername
  rubric_ref: rubric/login_emailusername_login_emailusername_no_config@1.0
  tags:
  - mode:recipe
- id: login-emailusername-dependencies
  input: What are login_emailusername's module dependencies and core version requirement?
  criteria: It depends only on core user (drupal:user) and requires core ^10.3 || ^11.0.
  bundle: login_emailusername
  rubric_ref: rubric/login_emailusername_login_emailusername_dependencies@1.0
  tags:
  - mode:recipe
