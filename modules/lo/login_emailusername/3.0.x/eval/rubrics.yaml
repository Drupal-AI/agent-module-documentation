rubrics:
- id: login_emailusername_login_emailusername_either_identifier
  version: '1.0'
  applicable_bundles:
  - login_emailusername
  checks:
  - kind: must_contain_any
    values:
    - login_emailusername
    - Login with Email or Username
  scoring:
    combine: all_pass
- id: login_emailusername_login_emailusername_keeps_username
  version: '1.0'
  applicable_bundles:
  - login_emailusername
  checks:
  - kind: must_contain_any
    values:
    - keeps
    - does not replace
    - username field
    - still
  scoring:
    combine: all_pass
- id: login_emailusername_login_emailusername_resolution
  version: '1.0'
  applicable_bundles:
  - login_emailusername
  checks:
  - kind: must_contain_any
    values:
    - user_load_by_name
    - user_load_by_mail
    - getAccountName
  scoring:
    combine: all_pass
- id: login_emailusername_login_emailusername_form_alter
  version: '1.0'
  applicable_bundles:
  - login_emailusername
  checks:
  - kind: must_contain_any
    values:
    - user_login_form
    - hook_form_FORM_ID_alter
    - Username or email address
  scoring:
    combine: all_pass
- id: login_emailusername_login_emailusername_rest_login
  version: '1.0'
  applicable_bundles:
  - login_emailusername
  checks:
  - kind: must_contain_any
    values:
    - user.login.http
    - RouteSubscriber
    - UserAuthenticationController
  scoring:
    combine: all_pass
- id: login_emailusername_login_emailusername_password_reset
  version: '1.0'
  applicable_bundles:
  - login_emailusername
  checks:
  - kind: must_contain_any
    values:
    - user.pass.http
    - resetPassword
    - mail
  scoring:
    combine: all_pass
- id: login_emailusername_login_emailusername_no_config
  version: '1.0'
  applicable_bundles:
  - login_emailusername
  checks:
  - kind: must_contain_any
    values:
    - no configuration
    - no settings
    - no permissions
  scoring:
    combine: all_pass
- id: login_emailusername_login_emailusername_dependencies
  version: '1.0'
  applicable_bundles:
  - login_emailusername
  checks:
