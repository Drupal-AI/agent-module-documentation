metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: login_switch
  version: 3.1.x
  note: Login Switch alters core user.login/user.register/user.pass routes via a RouteSubscriber and stores
    everything in one config object login_switch.settings with per-route keys <key>_disabled, <key>_route,
    <key>_noindex for key in {login,register,password}. disabled+non-empty route => path moved; disabled+empty
    route => _access:'false' (denied); noindex => X-Robots-Tag:noindex header. Configure route login_switch.settings
    at /admin/config/people/login-switch gated by core 'administer site configuration'. No plugins, no
    Drush, no own permissions. All eval cases are grounded in that real config object; medium reads it
    back, hard writes it.
questions:
- id: login_switch-noindex-header
  input: The Login Switch (login_switch) Drupal module can keep the login/registration/password pages
    out of search engines. Which HTTP response header (and value) does it add to those pages when the
    relevant noindex option is enabled?
  criteria: 'It adds the response header ''X-Robots-Tag: noindex'' on the user.login / user.register /
    user.pass routes whose <key>_noindex config flag is true (via the AddNoIndexHeader response subscriber).'
  bundle: login_switch
  rubric_ref: rubric/login_switch_login_switch_noindex_header@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: login_switch-move-login-keys
  input: Using the login_switch module, I want to move Drupal's login form from /user/login to a custom
    path. Which config object and which keys do I set, and what makes the change take effect?
  criteria: 'In config object login_switch.settings set login_disabled: true and login_route: ''your-path''
    (no leading slash). Then rebuild the router / clear caches (drush cr). The LoginSwitchRouteSubscriber
    calls setPath(''/your-path'') on the user.login route.'
  bundle: login_switch
  rubric_ref: rubric/login_switch_login_switch_move_login_keys@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: login_switch-disable-empty
  input: In login_switch, what happens to a user route (e.g. registration) if I tick the 'disable' checkbox
    but leave the replacement path empty?
  criteria: With <key>_disabled true and <key>_route empty, the route subscriber sets the route requirement
    _access to 'false', so the route becomes fully access-denied (not moved). A non-empty route instead
    moves the path.
  bundle: login_switch
  rubric_ref: rubric/login_switch_login_switch_disable_empty@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: login_switch-live-login-path
  input: On this Drupal site the login route has been moved to a custom path using login_switch. Inspect
    the live login_switch.settings configuration and tell me the custom path the login form now lives
    at.
  criteria: 'login_route is ''ls-secret-login'' (with login_disabled true), so the login form is served
    at /ls-secret-login. Read via: drush cget login_switch.settings.'
  bundle: login_switch
  rubric_ref: rubric/login_switch_login_switch_live_login_path@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/login_switch-login-path-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/login_switch-login-path-cleanup.sh
- id: login_switch-live-which-noindex
  input: This site uses login_switch. Exactly one of the three auth routes (login, registration, or password
    reset) is configured to be served with a noindex header. Inspect the live configuration and state
    which one.
  criteria: 'The password (reset) route: password_noindex is true while login_noindex and register_noindex
    are false in login_switch.settings, so only user.pass gets X-Robots-Tag: noindex.'
  bundle: login_switch
  rubric_ref: rubric/login_switch_login_switch_live_which_noindex@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/login_switch-noindex-which-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/login_switch-noindex-which-cleanup.sh
- id: login_switch-move-login
  input: On this Drupal site, use the login_switch module to move the login form to the path 'ls-hidden-login'
    and make the login page send a noindex header. Apply the change to the live site.
  criteria: In login_switch.settings set login_disabled true, login_route 'ls-hidden-login', login_noindex
    true (drush cset then drush cr, or the settings form at /admin/config/people/login-switch).
  bundle: login_switch
  rubric_ref: rubric/login_switch_login_switch_move_login@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/login_switch-move-login-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/login_switch-move-login-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/login_switch-move-login-verify.sh
- id: login_switch-disable-register
  input: On this Drupal site, use the login_switch module to completely disable the default user registration
    route (it should become access-denied, not moved to another path). Apply the change to the live site.
  criteria: In login_switch.settings set register_disabled true and leave register_route empty, so the
    route subscriber sets _access 'false' on user.register. Then drush cr.
  bundle: login_switch
  rubric_ref: rubric/login_switch_login_switch_disable_register@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/login_switch-disable-register-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/login_switch-disable-register-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/login_switch-disable-register-verify.sh
