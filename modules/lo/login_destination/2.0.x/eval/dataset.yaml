metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: login_destination
  version: 2.0.x
  note: Login Destination exposes a login_destination config entity ('rule') with trigger + role/page/language
    conditions + destination, ordered by weight, plus a small settings config object. Cases are `recipe`
    (response-graded), probing documented facts an agent would otherwise read source to answer; no site
    mutation.
questions:
- id: login-destination-config-entity
  input: On a Drupal 11 site, which configuration entity type does the Login Destination module use to
    store a redirect rule, and where in the admin UI do I create one?
  criteria: The `login_destination` config entity (a 'rule'). Create/manage rules at Admin > Configuration
    > People > Login destinations (/admin/config/people/login-destination), route login_destination.list.
  bundle: login_destination
  rubric_ref: rubric/login_destination_login_destination_config_entity@1.0
  tags:
  - mode:recipe
- id: login-destination-triggers
  input: What are the four trigger events a Login Destination rule can redirect on?
  criteria: Registration, Login, One-time login link, and Logout (machine names registration, login, one-time-login,
    logout).
  bundle: login_destination
  rubric_ref: rubric/login_destination_login_destination_triggers@1.0
  tags:
  - mode:recipe
- id: login-destination-conditions
  input: I want a Login Destination rule that only redirects users who logged in with the 'editor' role
    from the /user login page. Which rule conditions do I set, and what happens if I leave roles empty?
  criteria: 'Set the roles condition to ''editor'' and the pages condition to the /user path (pages_type:
    only the listed pages). If no roles are selected the rule applies to all users; only one selected
    role needs to match.'
  bundle: login_destination
  rubric_ref: rubric/login_destination_login_destination_conditions@1.0
  tags:
  - mode:recipe
- id: login-destination-priority
  input: If two enabled Login Destination rules both match a login, which one decides the redirect and
    how do I control that?
  criteria: Rules are sorted by weight and the first matching enabled rule wins; order rules by weight
    to set priority.
  bundle: login_destination
  rubric_ref: rubric/login_destination_login_destination_priority@1.0
  tags:
  - mode:recipe
- id: login-destination-token
  input: Can I use a token like [user:name] in a Login Destination rule's destination path, and what values
    besides a plain internal path are accepted?
  criteria: Yes — user and global tokens are replaced at redirect time. The destination can also be a
    node (autocomplete), an external URL, <front>, or <current> (the page the user came from).
  bundle: login_destination
  rubric_ref: rubric/login_destination_login_destination_token@1.0
  tags:
  - mode:recipe
- id: login-destination-immediate-redirect
  input: I want Login Destination to redirect a user right after they click a one-time login link, before
    they reach the password-change form. Which setting and config object controls this?
  criteria: Enable immediate_redirect (default false) on the login_destination.settings config object
    ('Redirect immediately after using one-time login link').
  bundle: login_destination
  rubric_ref: rubric/login_destination_login_destination_immediate_redirect@1.0
  tags:
  - mode:recipe
- id: login-destination-preserve-destination
  input: Which Login Destination setting makes Drupal's own ?destination= query parameter take priority
    over the module's own rules?
  criteria: The preserve_destination key (default false) on login_destination.settings ('Preserve the
    destination parameter'); note the login block redirect stops working when it is enabled.
  bundle: login_destination
  rubric_ref: rubric/login_destination_login_destination_preserve_destination@1.0
  tags:
  - mode:recipe
- id: login-destination-permission
  input: What permission gates managing Login Destination rules and settings?
  criteria: '''administer login destination settings'' — the single permission gating all login destination
    admin routes and the config entity''s admin_permission.'
  bundle: login_destination
  rubric_ref: rubric/login_destination_login_destination_permission@1.0
  tags:
  - mode:recipe
