rubrics:
- id: log_stdout_log_stdout_stream_target
  version: '1.0'
  applicable_bundles:
  - log_stdout
  checks:
  - kind: must_contain_any
    values:
    - php://stdout
    - stdout
    - php://stderr
    - stderr
  scoring:
    combine: all_pass
- id: log_stdout_log_stdout_config_keys
  version: '1.0'
  applicable_bundles:
  - log_stdout
  checks:
  - kind: must_contain_any
    values:
    - log_stdout.settings
    - severity_level
    - use_stderr
    - format
  scoring:
    combine: all_pass
- id: log_stdout_log_stdout_severity_meaning
  version: '1.0'
  applicable_bundles:
  - log_stdout
  checks:
  - kind: must_contain_any
    values:
    - '7'
    - debug
    - Debug
    - everything
    - all
  scoring:
    combine: all_pass
- id: log_stdout_log_stdout_known_severity
  version: '1.0'
  applicable_bundles:
  - log_stdout
  checks:
  - kind: must_contain_any
    values:
    - '7'
    - debug
    - Debug
  scoring:
    combine: all_pass
- id: log_stdout_log_stdout_known_format
  version: '1.0'
  applicable_bundles:
  - log_stdout
  checks:
  - kind: must_contain_any
    values:
    - LOGSTDOUT-TEST
  scoring:
    combine: all_pass
- id: log_stdout_log_stdout_enable_debug
  version: '1.0'
  applicable_bundles:
  - log_stdout
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
- id: log_stdout_log_stdout_enable_stderr
  version: '1.0'
  applicable_bundles:
  - log_stdout
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
