metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: login_security
  version: 2.0.x
  note: 'Login Security exposes a single config settings object driving login-form validation. Cases are
    `recipe` (response-graded): they probe documented config keys and behaviors an agent would otherwise
    read source to answer; no site mutation.'
questions:
- id: login_security-user-block-count
  input: On a Drupal 11 site I want to block a user account after 5 failed login attempts. Which Login
    Security config key do I set, on which config object, and what does a value of 0 mean?
  criteria: Set user_wrong_count to 5 on login_security.settings; a value of 0 disables per-account blocking.
    The blocked account must be manually unblocked at /admin/people.
  bundle: login_security
  rubric_ref: rubric/login_security_login_security_user_block_count@1.0
  tags:
  - mode:recipe
- id: login_security-soft-vs-hard-host
  input: In Login Security, what is the difference between the soft host limit and the hard host limit,
    and which config key controls each?
  criteria: host_wrong_count (soft) stops that IP from submitting the login form but still allows anonymous
    browsing; host_wrong_count_hard (hard) bans the IP outright via the Ban/AdvBan module.
  bundle: login_security
  rubric_ref: rubric/login_security_login_security_soft_vs_hard_host@1.0
  tags:
  - mode:recipe
- id: login_security-ip-ban-dependency
  input: I enabled a hard host block in Login Security but IP banning does not seem to work. Which other
    module must be installed for the IP ban functionality?
  criteria: The core Ban module (or the contrib AdvBan module) must be enabled; hard IP bans are delegated
    to it via the login_security.ban service, and hook_requirements warns if neither is present.
  bundle: login_security
  rubric_ref: rubric/login_security_login_security_ip_ban_dependency@1.0
  tags:
  - mode:recipe
- id: login_security-track-time
  input: Which Login Security setting defines the time window over which failed login attempts are counted,
    what unit is it in, and what is its default?
  criteria: track_time sets the sliding window in minutes (default 60); attempts older than the window
    expire and stop counting, and are purged on cron.
  bundle: login_security
  rubric_ref: rubric/login_security_login_security_track_time@1.0
  tags:
  - mode:recipe
- id: login_security-attack-notification
  input: I want Login Security to email administrators when a site-wide brute-force attack is detected.
    Which threshold key triggers detection and which key holds the notification recipients?
  criteria: activity_threshold (total failed attempts before an ongoing attack is logged) triggers detection;
    login_activity_notification_emails holds the comma-separated recipient list.
  bundle: login_security
  rubric_ref: rubric/login_security_login_security_attack_notification@1.0
  tags:
  - mode:recipe
- id: login_security-core-flood
  input: Does Login Security replace or disable Drupal core's built-in login flood control, and what does
    the disable_core_login_error setting actually do?
  criteria: It runs alongside core flood control (reads core's flood_control_triggered flag), not instead
    of it; disable_core_login_error only hides login error messages to prevent username enumeration, it
    does not turn off core flood protection.
  bundle: login_security
  rubric_ref: rubric/login_security_login_security_core_flood@1.0
  tags:
  - mode:recipe
- id: login_security-configure-route
  input: What is the Login Security settings form route and admin path on a Drupal site, and which permission
    gates it?
  criteria: Route login_security.settings at /admin/config/people/login_security, gated by the core 'administer
    site configuration' permission.
  bundle: login_security
  rubric_ref: rubric/login_security_login_security_configure_route@1.0
  tags:
  - mode:recipe
