metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: slick_entityreference
  version: 3.0.x
  note: Slick Entity Reference adds a Field UI display formatter (slick_entityreference_vanilla) that
    renders a multi-value entity_reference / entity_reference_revisions field as a Slick carousel, plus
    slick_dynamicentityreference_vanilla for dynamic_entity_reference. No settings form, permissions,
    services, or Drush; all config is per-field on the entity_view_display, and carousel behaviour comes
    from a Slick optionset. EASY=recipe (response-graded documented facts). MEDIUM=introspection (setup
    points a live field's display at the formatter/optionset; agent reads the entity_view_display back;
    cleanup restores). HARD=execution (reset creates the field + non-slick baseline; agent configures
    the display to use the formatter; verify checks the component formatter id).
questions:
- id: ser-formatter-id
  input: On a Drupal 11 site I have a multi-value entity reference field and I want to display the referenced
    entities as a Slick carousel. Which module provides this and what is the field formatter's plugin
    id?
  criteria: Use the Slick Entity Reference module; set the field's display format to the 'Slick Entity
    Reference Vanilla' formatter (plugin id slick_entityreference_vanilla) in Field UI Manage display.
  bundle: slick_entityreference
  rubric_ref: rubric/slick_entityreference_ser_formatter_id@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: ser-field-types
  input: Which field types can the Slick Entity Reference formatters be applied to, and what condition
    must the field meet to offer the formatter?
  criteria: slick_entityreference_vanilla applies to entity_reference and entity_reference_revisions fields;
    slick_dynamicentityreference_vanilla applies to dynamic_entity_reference. The field must be multi-value
    (isApplicable() requires the storage to be multiple) or the formatter is hidden.
  bundle: slick_entityreference
  rubric_ref: rubric/slick_entityreference_ser_field_types@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: ser-optionset-source
  input: When rendering an entity reference field as a Slick carousel with slick_entityreference_vanilla,
    where do arrows/dots/autoplay/responsive settings come from and which formatter setting selects it?
  criteria: They come from a Slick optionset (a 'slick' config entity, default id 'default', managed by
    the Slick module at /admin/config/media/slick), chosen via the formatter's 'optionset' setting. Slick
    Entity Reference has no settings form of its own.
  bundle: slick_entityreference
  rubric_ref: rubric/slick_entityreference_ser_optionset_source@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: ser-which-formatter
  input: On this live site, the node Article 'default' view display shows the field_ser_med entity reference
    field as a carousel. Which display formatter (plugin id) is that field configured to use?
  criteria: field_ser_med uses the slick_entityreference_vanilla formatter (inspect core.entity_view_display.node.article.default,
    component field_ser_med, type). It uses the 'default' Slick optionset.
  bundle: slick_entityreference
  rubric_ref: rubric/slick_entityreference_ser_which_formatter@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/slick_entityreference-display-formatter-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/slick_entityreference-display-formatter-cleanup.sh
- id: ser-which-optionset
  input: On this live site the node Article 'default' view display renders the field_ser_os entity reference
    field with the Slick Entity Reference Vanilla formatter. Which Slick optionset id does that carousel
    use?
  criteria: The formatter's 'optionset' setting on component field_ser_os is eval_er_carousel (read core.entity_view_display.node.article.default
    content.field_ser_os.settings.optionset).
  bundle: slick_entityreference
  rubric_ref: rubric/slick_entityreference_ser_which_optionset@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/slick_entityreference-display-optionset-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/slick_entityreference-display-optionset-cleanup.sh
- id: ser-configure-formatter
  input: On this Drupal 11 site the node Article 'default' view display has a multi-value entity_reference
    field field_ser_hard currently rendered with the plain 'entity_reference_label' formatter. Reconfigure
    that field's display so it renders the referenced entities as a Slick carousel using the Slick Entity
    Reference module's formatter. Save the display.
  criteria: The node.article default view display's field_ser_hard component has type slick_entityreference_vanilla
    (e.g. via entity_display.repository getViewDisplay('node','article','default')->setComponent('field_ser_hard',
    ['type'=>'slick_entityreference_vanilla','settings'=>['optionset'=>'default','view_mode'=>'default']])->save(),
    or the equivalent in Manage display).
  bundle: slick_entityreference
  rubric_ref: rubric/slick_entityreference_ser_configure_formatter@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/slick_entityreference-configure-formatter-reset.sh
    verify: agent-module-documentation/evaluation/verify/slick_entityreference-configure-formatter-verify.sh
    unused_text_checks:
      must_contain_any: []
      must_not_contain: []
- id: ser-configure-optionset
  input: On this Drupal 11 site the node Article 'default' view display has a multi-value entity_reference
    field field_ser_hard2 currently using the plain 'entity_reference_label' formatter. There is a Slick
    optionset with id 'eval_hard_set'. Reconfigure the field's display to render it as a Slick carousel
    with the Slick Entity Reference Vanilla formatter, and make the carousel use the eval_hard_set optionset.
    Save the display.
  criteria: The node.article default display's field_ser_hard2 component has type slick_entityreference_vanilla
    and settings.optionset === 'eval_hard_set'.
  bundle: slick_entityreference
  rubric_ref: rubric/slick_entityreference_ser_configure_optionset@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/slick_entityreference-configure-optionset-reset.sh
    verify: agent-module-documentation/evaluation/verify/slick_entityreference-configure-optionset-verify.sh
    unused_text_checks:
      must_contain_any: []
      must_not_contain: []
