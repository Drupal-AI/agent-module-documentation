metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: slick_paragraphs
  version: 3.0.x
  note: Slick Paragraphs provides two Field UI formatters that render a multi-value Paragraphs (entity_reference_revisions)
    field as a Slick carousel. It has no settings form, permissions, services, or Drush. Cases are `recipe`
    (response-graded), probing documented facts an agent would otherwise read source to answer; no site
    mutation.
questions:
- id: slickpara-render-paragraphs-carousel
  input: On a Drupal 11 site I have a node with a multi-value Paragraphs field of 'Slide' items and I
    want to display them as a Slick carousel. Which module and mechanism do I use, and where do I configure
    it?
  criteria: Use the Slick Paragraphs module's field formatter on the Paragraphs field in Field UI > Manage
    display (a Slick Paragraphs Vanilla or Media formatter), not a settings form or Views.
  bundle: slick_paragraphs
  rubric_ref: rubric/slick_paragraphs_slickpara_render_paragraphs_carousel@1.0
  tags:
  - mode:recipe
- id: slickpara-two-formatters
  input: What are the two field formatter ids Slick Paragraphs provides, and how do they differ?
  criteria: slick_paragraphs_vanilla renders each paragraph as-is via its view mode (top-level or child,
    needs Blazy); slick_paragraphs_media renders rich slides with image/overlay and only applies to child
    (second-level) paragraph fields.
  bundle: slick_paragraphs
  rubric_ref: rubric/slick_paragraphs_slickpara_two_formatters@1.0
  tags:
  - mode:recipe
- id: slickpara-field-type
  input: Which field type must a field be for the Slick Paragraphs formatters to appear, and what applicability
    conditions gate them?
  criteria: The field must be entity_reference_revisions; isApplicable() requires the field to be multi-value
    with target_type = paragraph (the Media formatter additionally requires the host entity type to be
    paragraph, i.e. child fields only).
  bundle: slick_paragraphs
  rubric_ref: rubric/slick_paragraphs_slickpara_field_type@1.0
  tags:
  - mode:recipe
- id: slickpara-dependencies
  input: Which Drupal modules does Slick Paragraphs 3.x depend on?
  criteria: It depends on slick (>= 3.x) and paragraphs; the Vanilla formatter also requires Blazy (which
    comes with Slick).
  bundle: slick_paragraphs
  rubric_ref: rubric/slick_paragraphs_slickpara_dependencies@1.0
  tags:
  - mode:recipe
- id: slickpara-optionset-location
  input: Where do I create the Slick optionset that a Slick Paragraphs formatter uses to control the carousel
    (arrows, dots, skin, responsive)?
  criteria: Optionsets are created in the Slick module at /admin/config/media/slick, then selected in
    the Slick Paragraphs formatter settings; Slick Paragraphs has no config UI of its own.
  bundle: slick_paragraphs
  rubric_ref: rubric/slick_paragraphs_slickpara_optionset_location@1.0
  tags:
  - mode:recipe
- id: slickpara-slide-field-mapping
  input: With the Slick Paragraphs Media formatter, which paragraph fields can serve as the slide stage
    (main image) versus overlays?
  criteria: getPluginScopes() offers the paragraph's image and entity_reference fields as the slide stage/images,
    and the same fields plus media entity_reference fields as overlays.
  bundle: slick_paragraphs
  rubric_ref: rubric/slick_paragraphs_slickpara_slide_field_mapping@1.0
  tags:
  - mode:recipe
- id: slickpara-no-views
  input: Can I use the Slick Paragraphs formatter inside Views UI to render paragraph rows as a carousel?
  criteria: No. The formatters only work from Field UI Manage display, not Views UI (Views UI does not
    respect isApplicable()).
  bundle: slick_paragraphs
  rubric_ref: rubric/slick_paragraphs_slickpara_no_views@1.0
  tags:
  - mode:recipe
