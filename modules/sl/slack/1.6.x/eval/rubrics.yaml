rubrics:
- id: slack_slack_send_from_code
  version: '1.0'
  applicable_bundles:
  - slack
  checks:
  - kind: must_contain_any
    values:
    - slack.slack_service
    - deliverMessage
    - sendMessage
    - queueMessage
  scoring:
    combine: all_pass
- id: slack_slack_webhook_config
  version: '1.0'
  applicable_bundles:
  - slack
  checks:
  - kind: must_contain_any
    values:
    - slack_webhook_url
    - slack.settings
    - /admin/config/services/slack
    - webhook
  scoring:
    combine: all_pass
- id: slack_slack_rules_action
  version: '1.0'
  applicable_bundles:
  - slack
  checks:
  - kind: must_contain_any
    values:
    - rules_slack_send_message
    - Send message to Slack
    - Rules
  scoring:
    combine: all_pass
- id: slack_slack_which_channel
  version: '1.0'
  applicable_bundles:
  - slack
  checks:
  - kind: must_contain_any
    values:
    - '#ops-intro'
  scoring:
    combine: all_pass
- id: slack_slack_which_webhook
  version: '1.0'
  applicable_bundles:
  - slack
  checks:
  - kind: must_contain_any
    values:
    - hooks.slack.com
  scoring:
    combine: all_pass
- id: slack_slack_configure_webhook
  version: '1.0'
  applicable_bundles:
  - slack
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
- id: slack_slack_configure_webhook_layman
  version: '1.0'
  applicable_bundles:
  - slack
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
