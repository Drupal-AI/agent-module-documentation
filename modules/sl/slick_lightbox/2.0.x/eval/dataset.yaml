metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: slick_lightbox
  version: 2.0.x
  note: 'Slick Lightbox has no formatter and no configure route (configure=null). It works by (a) registering
    a ''slick_lightbox'' value in Blazy''s Media switcher (used on Blazy/Slick formatters, stored as settings.media_switch=''slick_lightbox''
    on a view-display component) and (b) a single shipped Slick optionset config entity slick.optionset.slick_lightbox
    (id slick_lightbox). Medium cases read known values written into that optionset (lazyLoad, skin).
    Hard cases: wire settings.media_switch=slick_lightbox onto a namespaced image field (field_sl_image)
    via a Blazy formatter, and change the optionset slidesToShow. All scripts use a namespaced field (field_sl_image)
    and restore shipped optionset defaults explicitly (slidesToShow=1, lazyLoad=ondemand, skin='''').
    No drush cr is used (config reads are live) to avoid an unrelated shared-site group-module cache-rebuild
    fault.'
questions:
- id: slick_lightbox-how-to-enable
  input: I installed slick_lightbox but there is no field formatter called 'Slick Lightbox' and no settings
    page. How do I actually make an image field open in the Slick Lightbox?
  criteria: There is no formatter of its own (configure=null). On a Blazy/Slick field formatter (Manage
    display), set the Media switcher to 'Image to Slick Lightbox'; that stores settings.media_switch='slick_lightbox'
    on the view-display component. It also works via the Blazy Filter's Media switcher.
  bundle: slick_lightbox
  rubric_ref: rubric/slick_lightbox_slick_lightbox_how_to_enable@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: slick_lightbox-optionset
  input: Which configuration entity controls the slider behaviour of slick_lightbox, and what is its id?
    Where can it be edited in the UI?
  criteria: The Slick optionset config entity slick.optionset.slick_lightbox (id slick_lightbox). It can
    be edited at /admin/config/media/slick/list/slick_lightbox/edit once the slick_ui sub-module is enabled.
  bundle: slick_lightbox
  rubric_ref: rubric/slick_lightbox_slick_lightbox_optionset@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: slick_lightbox-requirements
  input: What does slick_lightbox need in order to work — both the Drupal module dependency and the front-end
    JS library, and where must that library live?
  criteria: It depends on the slick module (>= 3.x, which brings Blazy). The third-party slick-lightbox
    JS/CSS library (github.com/mreq/slick-lightbox) must be installed at /libraries/slick-lightbox/dist/slick-lightbox.min.js
    (and .css); hook_requirements() reports if it is missing.
  bundle: slick_lightbox
  rubric_ref: rubric/slick_lightbox_slick_lightbox_requirements@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: slick_lightbox-optionset-lazyload
  input: On this site, the slick_lightbox Slick optionset has had its lazy-load mode changed. Inspect
    the live configuration of the slick_lightbox optionset and state the current lazyLoad value.
  criteria: lazyLoad is 'progressive' in slick.optionset.slick_lightbox under options.settings.lazyLoad
    (shipped default is 'ondemand').
  bundle: slick_lightbox
  rubric_ref: rubric/slick_lightbox_slick_lightbox_optionset_lazyload@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/slick_lightbox-optionset-lazyload-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/slick_lightbox-optionset-lazyload-cleanup.sh
- id: slick_lightbox-optionset-skin
  input: The slick_lightbox optionset on this site has a skin configured. Inspect the live slick_lightbox
    optionset and report the value of its skin setting.
  criteria: The skin is 'boxy' (slick.optionset.slick_lightbox -> skin). The shipped default skin is an
    empty string.
  bundle: slick_lightbox
  rubric_ref: rubric/slick_lightbox_slick_lightbox_optionset_skin@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/slick_lightbox-optionset-skin-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/slick_lightbox-optionset-skin-cleanup.sh
- id: slick_lightbox-enable-media-switch
  input: On this Drupal site, the Article content type has an image field named field_sl_image. Using
    slick_lightbox, configure the default view display so that this image field opens in the Slick Lightbox
    (i.e. use a Blazy formatter with the 'Image to Slick Lightbox' Media switcher). Apply the change to
    the live site.
  criteria: In core.entity_view_display.node.article.default the field_sl_image component uses a Blazy
    formatter (type 'blazy') with settings.media_switch = 'slick_lightbox'.
  bundle: slick_lightbox
  rubric_ref: rubric/slick_lightbox_slick_lightbox_enable_media_switch@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/slick_lightbox-enable-media-switch-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/slick_lightbox-enable-media-switch-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/slick_lightbox-enable-media-switch-verify.sh
- id: slick_lightbox-optionset-slides
  input: Change the slick_lightbox Slick optionset so its lightbox slider shows 2 slides at a time (slidesToShow
    = 2), and save the change to the live site.
  criteria: slick.optionset.slick_lightbox options.settings.slidesToShow is set to 2 (from the shipped
    default of 1).
  bundle: slick_lightbox
  rubric_ref: rubric/slick_lightbox_slick_lightbox_optionset_slides@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/slick_lightbox-optionset-slides-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/slick_lightbox-optionset-slides-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/slick_lightbox-optionset-slides-verify.sh
