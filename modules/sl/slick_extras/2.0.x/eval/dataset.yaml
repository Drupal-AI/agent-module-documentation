metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: slick_extras
  version: 2.0.x
  note: Slick Extras is an add-on/scaffolding for the Slick carousel module. Its only substantive runtime
    contribution is a SlickSkin plugin adding six extra CSS skins; the rest is example (slick_example)
    and development (slick_devel) sub-modules. Cases are `recipe` (response-graded), probing documented
    facts an agent would otherwise read source for; no site mutation.
questions:
- id: slick_extras-depends-on-slick
  input: On a Drupal 11 site, which module must be installed for Slick Extras to work, and what does Slick
    Extras add on top of it?
  criteria: Slick Extras depends on the Slick module (slick:slick >= 3.x) and adds extra, less-common
    CSS skins (via a SlickSkin plugin) plus example/development sub-modules.
  bundle: slick_extras
  rubric_ref: rubric/slick_extras_slick_extras_depends_on_slick@1.0
  tags:
  - mode:recipe
- id: slick_extras-skin-plugin
  input: How does Slick Extras register its extra carousel skins on a Drupal site? Name the plugin type
    and the class.
  criteria: It implements Slick's SlickSkin plugin type with class SlickExtrasSkin (plugin id slick_extras_skin)
    extending SlickSkinPluginBase, overriding setSkins().
  bundle: slick_extras
  rubric_ref: rubric/slick_extras_slick_extras_skin_plugin@1.0
  tags:
  - mode:recipe
- id: slick_extras-skin-list
  input: Name some of the extra skins Slick Extras adds to the Slick optionset Skin dropdown.
  criteria: 'Six skins: d3-back (X 3d back), boxed (X Boxed), boxed-carousel (X Box carousel), boxed-split
    (X Box split), rounded (X Rounded), and vtabs (X VTabs, a thumbnail skin).'
  bundle: slick_extras
  rubric_ref: rubric/slick_extras_slick_extras_skin_list@1.0
  tags:
  - mode:recipe
- id: slick_extras-skins-not-showing
  input: I enabled Slick Extras but its skins don't appear in the Slick optionset Skin dropdown. What
    should I do?
  criteria: Skins are cached; clear the cache (e.g. drush cr) and they will appear in the Skin dropdown.
  bundle: slick_extras
  rubric_ref: rubric/slick_extras_slick_extras_skins_not_showing@1.0
  tags:
  - mode:recipe
- id: slick_extras-add-custom-skin
  input: I want to register my own Slick skin the way Slick Extras does. What's the pattern?
  criteria: Create src/Plugin/slick/YourSkin.php with a @SlickSkin annotation, extend SlickSkinPluginBase,
    override setSkins() to return skin definitions with a css theme file, ship the CSS, and clear cache.
  bundle: slick_extras
  rubric_ref: rubric/slick_extras_slick_extras_add_custom_skin@1.0
  tags:
  - mode:recipe
- id: slick_extras-example-submodule
  input: Which Slick Extras sub-module provides sample optionsets (prefixed X), image styles, and a demo
    View, and what extra module does it need?
  criteria: The Slick Example (slick_example) sub-module ships sample X-prefixed optionsets, Slick image
    styles, and the slick_x View; it depends on Slick Views (slick_views).
  bundle: slick_extras
  rubric_ref: rubric/slick_extras_slick_extras_example_submodule@1.0
  tags:
  - mode:recipe
- id: slick_extras-production-use
  input: Is Slick Extras intended for direct use in production, or is it example/scaffolding code?
  criteria: 'It is example/scaffolding: the maintainers recommend cloning what you need and uninstalling
    it in production (though it is safe to leave enabled). The base module offers extra skins; the example/devel
    sub-modules are for learning.'
  bundle: slick_extras
  rubric_ref: rubric/slick_extras_slick_extras_production_use@1.0
  tags:
  - mode:recipe
- id: slick_extras-devel-submodule
  input: What does the Slick Development (slick_devel) sub-module of Slick Extras provide?
  criteria: slick_devel provides a settings form (route slick_devel.settings) and a debug JS loader used
    while developing the Slick library.
  bundle: slick_extras
  rubric_ref: rubric/slick_extras_slick_extras_devel_submodule@1.0
  tags:
  - mode:recipe
