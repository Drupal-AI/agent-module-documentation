rubrics:
- id: key_value_field_key_value_field_types_and_widgets
  version: '1.0'
  applicable_bundles:
  - key_value_field
  checks:
  - kind: must_contain_any
    values:
    - key_value_long
    - key_value_textfield
    - key_value_textarea
  scoring:
    combine: all_pass
- id: key_value_field_key_value_field_properties
  version: '1.0'
  applicable_bundles:
  - key_value_field
  checks:
  - kind: must_contain_any
    values:
    - description
    - key_max_length
  scoring:
    combine: all_pass
- id: key_value_field_key_value_field_value_only
  version: '1.0'
  applicable_bundles:
  - key_value_field
  checks:
  - kind: must_contain_any
    values:
    - value_only
  scoring:
    combine: all_pass
- id: key_value_field_key_value_field_known_length
  version: '1.0'
  applicable_bundles:
  - key_value_field
  checks:
  - kind: must_contain_any
    values:
    - '42'
  scoring:
    combine: all_pass
- id: key_value_field_key_value_field_formatter_state
  version: '1.0'
  applicable_bundles:
  - key_value_field
  checks:
  - kind: must_contain_any
    values:
    - value_only
  scoring:
    combine: all_pass
- id: key_value_field_key_value_field_create_field
  version: '1.0'
  applicable_bundles:
  - key_value_field
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
- id: key_value_field_key_value_field_hide_key
  version: '1.0'
  applicable_bundles:
  - key_value_field
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
