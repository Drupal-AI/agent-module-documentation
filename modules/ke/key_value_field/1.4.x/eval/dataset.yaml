metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: key_value_field
  version: 1.4.x
  note: Key/Value Field provides two field types (key_value = plain, extends StringItem; key_value_long
    = formatted, extends TextLongItem), two widgets (key_value_textfield, key_value_textarea), and one
    formatter (key_value with a value_only boolean). Each item stores key/value/description properties;
    storage setting key_max_length (default 255) sizes the indexed key column. No configure route, no
    permission, no Drush. Medium cases seed a real key_value field with a known key_max_length (42) and
    a real formatter value_only=TRUE and have the agent read the live field.storage / view-display config;
    hard cases have the agent create a key_value field and flip the formatter's value_only setting, verified
    against the live config entities.
questions:
- id: key_value_field-types-and-widgets
  input: The Drupal contrib module key_value_field provides field types for storing a key/value pair.
    What are the machine names of the two field types it defines, and what default widget does each use?
  criteria: key_value (Key / Value plain, plain-text value, default widget key_value_textfield) and key_value_long
    (Key / Value long, formatted value with a text format, default widget key_value_textarea). Both default
    to the key_value formatter.
  bundle: key_value_field
  rubric_ref: rubric/key_value_field_key_value_field_types_and_widgets@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: key_value_field-properties
  input: What sub-values does a single key_value_field item store, and which storage setting controls
    the length of the key column?
  criteria: 'Each item stores three properties: key, value, and an optional description (plus format on
    key_value_long). The key column length is set by the key_max_length storage setting (default 255),
    and the key column is indexed.'
  bundle: key_value_field
  rubric_ref: rubric/key_value_field_key_value_field_properties@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: key_value_field-value-only
  input: Using key_value_field, how do I display only the value of a Key/Value field and hide the key
    when the field is rendered?
  criteria: 'On Manage display, use the ''Key Value'' (key_value) formatter and tick its ''Value only''
    option (setting value_only = TRUE). With it off the formatter renders ''key : value''.'
  bundle: key_value_field
  rubric_ref: rubric/key_value_field_key_value_field_value_only@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: key_value_field-known-length
  input: On this Drupal site, the Article content type has a Key/Value field named field_kvf_known. Inspect
    the live field storage configuration and tell me the maximum length configured for its key.
  criteria: 'key_max_length is 42: field.storage.node.field_kvf_known settings.key_max_length = 42. Discoverable
    via drush cget field.storage.node.field_kvf_known.'
  bundle: key_value_field
  rubric_ref: rubric/key_value_field_key_value_field_known_length@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/key_value_field-known-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/key_value_field-known-cleanup.sh
- id: key_value_field-formatter-state
  input: On this site the Article content type has a Key/Value field field_kvf_fmt. Inspect the live display
    configuration and tell me whether its output shows the key or only the value, and which formatter
    setting determines that.
  criteria: 'It shows only the value: the key_value formatter on core.entity_view_display.node.article.default
    has settings.value_only = true, so the key is hidden.'
  bundle: key_value_field
  rubric_ref: rubric/key_value_field_key_value_field_formatter_state@1.0
  tags:
  - mode:introspection
  - difficulty:medium
