rubrics:
- id: key_auth_key_auth_default_settings
  version: '1.0'
  applicable_bundles:
  - key_auth
  checks:
  - kind: must_contain_any
    values:
    - api-key
    - /admin/config/services/key-auth
    - admin/config/services/key-auth
  scoring:
    combine: all_pass
- id: key_auth_key_auth_client_request
  version: '1.0'
  applicable_bundles:
  - key_auth
  checks:
  - kind: must_contain_any
    values:
    - api-key
    - provider_id
    - use key authentication
  scoring:
    combine: all_pass
- id: key_auth_key_auth_key_storage
  version: '1.0'
  applicable_bundles:
  - key_auth
  checks:
  - kind: must_contain_any
    values:
    - api_key
    - generateKey
    - auto_generate_keys
  scoring:
    combine: all_pass
- id: key_auth_key_auth_param_detection
  version: '1.0'
  applicable_bundles:
  - key_auth
  checks:
  - kind: must_contain_any
    values:
    - x-ka-token
    - header only
    - '"header"'
    - '[''header'']'
  scoring:
    combine: all_pass
- id: key_auth_key_auth_length_autogen
  version: '1.0'
  applicable_bundles:
  - key_auth
  checks:
  - kind: must_contain_any
    values:
    - key_length is 16
    - 'key_length: 16'
    - length of 16
    - 16 characters
    - auto_generate_keys is false
    - auto_generate_keys is disabled
    - will not automatically
  scoring:
    combine: all_pass
- id: key_auth_key_auth_generate_key
  version: '1.0'
  applicable_bundles:
  - key_auth
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
- id: key_auth_key_auth_config_build
  version: '1.0'
  applicable_bundles:
  - key_auth
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
