metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: key
  version: 1.22.x
  note: Key is a config/API module for managing site-wide secrets. Cases are `recipe` (response-graded)
    — they probe key-specific facts (the Key config entity, the three plugin types, built-in providers,
    the drush key:save command, and reading values via key.repository). No site mutation.
questions:
- id: key-read-value-in-code
  input: In PHP on a Drupal 11 site, load the key with ID `my_api_key` and get its resolved secret string
    value. Which service do I use and what calls do I make? Show the code.
  criteria: 'Use the key.repository service (KeyRepositoryInterface): $repo = \Drupal::service(''key.repository'');
    $repo->getKey(''my_api_key'')->getKeyValue().'
  bundle: key
  rubric_ref: rubric/key_key_read_value_in_code@1.0
  tags:
  - mode:recipe
- id: key-plugin-types
  input: The Key module lets me assemble a key from three pluggable parts. Name the three plugin types
    Key defines.
  criteria: The three plugin types are KeyType (what the key is used for), KeyProvider (where the value
    lives), and KeyInput (how the value is entered).
  bundle: key
  rubric_ref: rubric/key_key_plugin_types@1.0
  tags:
  - mode:recipe
- id: key-custom-provider-namespace
  input: I want to define a custom key provider that fetches secrets from an external vault in my Drupal
    11 module. Which annotation do I use and in which src/Plugin/ subdirectory does the class go?
  criteria: Use the @KeyProvider annotation and place the class in src/Plugin/KeyProvider/, extending
    KeyProviderBase (implement getKeyValue()).
  bundle: key
  rubric_ref: rubric/key_key_custom_provider_namespace@1.0
  tags:
  - mode:recipe
- id: key-env-provider
  input: I want a Key entity to read its value from an environment variable instead of storing it in configuration.
    Which built-in key provider do I choose, and what is the main provider setting?
  criteria: Use the env (Environment) key provider, with the env_variable setting naming the environment
    variable to read (optionally base64_encoded / strip_line_breaks).
  bundle: key
  rubric_ref: rubric/key_key_env_provider@1.0
  tags:
  - mode:recipe
- id: key-drush-save-env
  input: Give the drush command to create an env-backed authentication key with ID `openai_api_key` that
    reads the OPENAI_API_KEY environment variable. Show the full command including provider settings.
  criteria: drush key:save openai_api_key --label='OpenAI API Key' --key-type=authentication --key-provider=env
    --key-provider-settings='{"env_variable":"OPENAI_API_KEY","base64_encoded":false,"strip_line_breaks":true}'
    --key-input=none -y
  bundle: key
  rubric_ref: rubric/key_key_drush_save_env@1.0
  tags:
  - mode:recipe
- id: key-secrets-not-in-config
  input: Why is the Key module the recommended place to keep a Stripe API key rather than putting the
    value directly in a module's exported configuration?
  criteria: 'Keys separate the secret from config: the Key entity is referenced by ID while the real value
    lives in an env var / file / state (not exported config), so secrets stay out of version control.
    The config provider stores in exported config and should be avoided for real secrets; a Key Configuration
    Override can inject the value at runtime.'
  bundle: key
  rubric_ref: rubric/key_key_secrets_not_in_config@1.0
  tags:
  - mode:recipe
- id: key-config-entity-route
  input: Keys in the Key module are config entities. Where are they managed in the admin UI, and what
    is the collection route name?
  criteria: Keys are config entities managed at Admin → Configuration → System → Keys (/admin/config/system/keys),
    route entity.key.collection.
  bundle: key
  rubric_ref: rubric/key_key_config_entity_route@1.0
  tags:
  - mode:recipe
- id: key-file-provider
  input: I want a key's value to be read from a file stored outside the web root on a Drupal 11 site.
    Which built-in key provider do I use and what setting points to the file?
  criteria: Use the file (File) key provider, with the file_location setting pointing to the file outside
    the web root (optionally base64_encoded / strip_line_breaks).
  bundle: key
  rubric_ref: rubric/key_key_file_provider@1.0
  tags:
  - mode:recipe
