rubrics:
- id: key_key_read_value_in_code
  version: '1.0'
  applicable_bundles:
  - key
  checks:
  - kind: must_contain_any
    values:
    - key.repository
    - getKey
    - getKeyValue
  scoring:
    combine: all_pass
- id: key_key_plugin_types
  version: '1.0'
  applicable_bundles:
  - key
  checks:
  - kind: must_contain_any
    values:
    - KeyType
    - KeyProvider
    - KeyInput
  scoring:
    combine: all_pass
- id: key_key_custom_provider_namespace
  version: '1.0'
  applicable_bundles:
  - key
  checks:
  - kind: must_contain_any
    values:
    - '@KeyProvider'
    - Plugin/KeyProvider
    - KeyProviderBase
  scoring:
    combine: all_pass
- id: key_key_env_provider
  version: '1.0'
  applicable_bundles:
  - key
  checks:
  - kind: must_contain_any
    values:
    - env
    - env_variable
  scoring:
    combine: all_pass
- id: key_key_drush_save_env
  version: '1.0'
  applicable_bundles:
  - key
  checks:
  - kind: must_contain_any
    values:
    - key:save
    - --key-provider-settings
    - env_variable
  scoring:
    combine: all_pass
- id: key_key_secrets_not_in_config
  version: '1.0'
  applicable_bundles:
  - key
  checks:
  - kind: must_contain_any
    values:
    - reference
    - env
    - exported
    - config override
    - environment variable
  scoring:
    combine: all_pass
- id: key_key_config_entity_route
  version: '1.0'
  applicable_bundles:
  - key
  checks:
  - kind: must_contain_any
    values:
    - entity.key.collection
    - /admin/config/system/keys
  scoring:
    combine: all_pass
- id: key_key_file_provider
  version: '1.0'
  applicable_bundles:
  - key
  checks:
  - kind: must_contain_any
    values:
    - file
    - file_location
  scoring:
    combine: all_pass
