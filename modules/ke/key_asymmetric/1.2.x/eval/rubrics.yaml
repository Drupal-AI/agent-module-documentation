rubrics:
- id: key_asymmetric_key_asymmetric_key_types
  version: '1.0'
  applicable_bundles:
  - key_asymmetric
  checks:
  - kind: must_contain_any
    values:
    - asymmetric_private
    - asymmetric_public
  scoring:
    combine: all_pass
- id: key_asymmetric_key_asymmetric_validation
  version: '1.0'
  applicable_bundles:
  - key_asymmetric
  checks:
  - kind: must_contain_any
    values:
    - phpseclib
    - metadata
    - key type settings
    - key_type_settings
    - getKeyProperties
    - format
  scoring:
    combine: all_pass
- id: key_asymmetric_key_asymmetric_pair_link
  version: '1.0'
  applicable_bundles:
  - key_asymmetric
  checks:
  - kind: must_contain_any
    values:
    - private_key
    - key pair
    - reference
    - asymmetric_private
  scoring:
    combine: all_pass
- id: key_asymmetric_key_asymmetric_inspect_priv_type
  version: '1.0'
  applicable_bundles:
  - key_asymmetric
  checks:
  - kind: must_contain_any
    values:
    - asymmetric_private
  scoring:
    combine: all_pass
- id: key_asymmetric_key_asymmetric_inspect_pair
  version: '1.0'
  applicable_bundles:
  - key_asymmetric
  checks:
  - kind: must_contain_any
    values:
    - ka_probe_priv2
  scoring:
    combine: all_pass
- id: key_asymmetric_key_asymmetric_build_private
  version: '1.0'
  applicable_bundles:
  - key_asymmetric
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
- id: key_asymmetric_key_asymmetric_build_public_pair
  version: '1.0'
  applicable_bundles:
  - key_asymmetric
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
