metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: keycloak
  version: 2.2.x
  note: Keycloak provides an OpenIDConnectClient plugin (id 'keycloak') for the openid_connect module.
    A configured client is an openid_connect.client.<id> config entity with plugin=keycloak and a settings
    map validated by schema openid_connect.client.plugin.keycloak (client_id, client_secret, keycloak_base,
    keycloak_realm, keycloak_sso, keycloak_sign_out, check_session, keycloak_i18n, keycloak_groups with
    rules, kc_idp_hint, ...). Endpoints are DERIVED from keycloak_base + keycloak_realm as {base}/realms/{realm}/protocol/openid-connect/*.
    This site has NO live Keycloak server, so every medium/hard case is grounded purely in local config/plugin
    state (creating and reading openid_connect_client entities), never an actual auth flow. Fixtures are
    namespaced kc_* and cleaned up.
questions:
- id: keycloak-plugin-id
  input: The Drupal 'Keycloak OpenID Connect' module integrates with the OpenID Connect module. What kind
    of plugin does it provide (and its id), and where do you add/configure a Keycloak login on the site?
  criteria: It provides an OpenID Connect client plugin with id 'keycloak' (an OpenIDConnectClient for
    the openid_connect module). You add a client at Configuration > People > OpenID Connect (/admin/config/people/openid-connect,
    route openid_connect.admin_settings) and choose the Keycloak plugin; it is stored as an openid_connect.client.<id>
    config entity.
  bundle: keycloak
  rubric_ref: rubric/keycloak_keycloak_plugin_id@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: keycloak-derived-endpoints
  input: With the Keycloak module, which two settings do I actually enter instead of the individual OIDC
    endpoints, and how does the module build the authorization/token/userinfo URLs from them?
  criteria: You enter keycloak_base (server base URL) and keycloak_realm (realm name). The plugin derives
    endpoints as {keycloak_base}/realms/{keycloak_realm}/protocol/openid-connect/{auth,token,userinfo,logout}
    (and a login-status-iframe for session checks).
  bundle: keycloak
  rubric_ref: rubric/keycloak_keycloak_derived_endpoints@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: keycloak-role-mapping
  input: Can the Keycloak module assign Drupal roles based on the user's Keycloak groups? Which client
    setting controls that and what does a mapping rule contain?
  criteria: Yes. The keycloak_groups setting (enabled, claim_name, split_groups, rules) drives automatic
    role assignment. Each rule maps a Keycloak group/claim value to a Drupal role with fields role, action
    (add/remove), operation, pattern, case_sensitive, weight, enabled.
  bundle: keycloak
  rubric_ref: rubric/keycloak_keycloak_role_mapping@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: keycloak-known-realm
  input: This Drupal site has a Keycloak OpenID Connect client configured. Inspect the live configuration
    and state the Keycloak base URL and realm that client points at.
  criteria: The openid_connect.client.kc_realm client (plugin keycloak) has settings.keycloak_base = https://id.example.com
    and settings.keycloak_realm = acme.
  bundle: keycloak
  rubric_ref: rubric/keycloak_keycloak_known_realm@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/keycloak-realm-known-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/keycloak-realm-known-cleanup.sh
- id: keycloak-known-groups
  input: A Keycloak client on this site is set up to map Keycloak groups to Drupal roles. Inspect the
    live configuration and state the token claim name it reads and which Drupal role its rule grants.
  criteria: The openid_connect.client.kc_groups client has keycloak_groups.enabled true, claim_name 'groups',
    and a rule granting the Drupal role 'editor' (action add, pattern /editors).
  bundle: keycloak
  rubric_ref: rubric/keycloak_keycloak_known_groups@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/keycloak-groups-known-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/keycloak-groups-known-cleanup.sh
- id: keycloak-create-client
  input: On this Drupal site, create a Keycloak OpenID Connect client named kc_task that points at the
    Keycloak server https://sso.example.org, realm 'drupal'. Use the keycloak plugin. Apply the change
    to the live site (no live server needs to be reachable — just the configuration).
  criteria: An openid_connect_client config entity kc_task exists with plugin 'keycloak' and settings.keycloak_base=https://sso.example.org,
    settings.keycloak_realm=drupal (create the openid_connect_client entity).
  bundle: keycloak
  rubric_ref: rubric/keycloak_keycloak_create_client@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/keycloak-create-client-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/keycloak-create-client-reset.sh
    verify: agent-module-documentation/evaluation/verify/keycloak-create-client-verify.sh
    unused_text_checks:
      must_contain_any: []
      must_not_contain: []
- id: keycloak-enable-sso
  input: This site already has a Keycloak OpenID Connect client named kc_sso. Configure it so that the
    Drupal login form is replaced by a redirect to Keycloak (single sign-on) and so that logging out of
    Drupal also ends the Keycloak session (single sign-out). Apply the change to the live site.
  criteria: In openid_connect.client.kc_sso settings, keycloak_sso is TRUE (replace Drupal login with
    SSO) and keycloak_sign_out is TRUE (Drupal-initiated single sign-out).
  bundle: keycloak
  rubric_ref: rubric/keycloak_keycloak_enable_sso@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/keycloak-enable-sso-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/keycloak-enable-sso-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/keycloak-enable-sso-verify.sh
    unused_text_checks:
      must_contain_any: []
      must_not_contain: []
