metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: onlyone
  version: 2.0.x
  note: 'Only One restricts selected content types to a single node per language. The restricted-types
    list is onlyone.settings.onlyone_node_types (a sequence of node-type machine names); enforcement is
    an OnlyOne validation constraint added to the node entity type. Two settings live in onlyone.settings:
    onlyone_new_menu_entry (bool) and onlyone_redirect (bool, default true = redirect a would-be second-add
    to the existing node''s edit form; false = to its canonical page). Admin forms at /admin/config/content/onlyone
    and /admin/config/content/onlyone/settings, permission ''administer onlyone''. The bundled onlyone.drush.inc
    is legacy Drush 8/9 and does NOT run under the site''s Drush 13, so all cases are grounded in onlyone.settings
    config, not drush commands. Medium cases write known config and ask the agent to read it back; hard
    cases require the agent to restrict a (namespaced) content type and to toggle the new-menu-entry setting,
    verified against live onlyone.settings. Content-type fixtures are namespaced onlyone_eval / onlyone_task.'
questions:
- id: onlyone-what
  input: What does the Drupal 'Allow a content type only once (Only One)' (onlyone) module restrict, and
    what happens when an editor tries to add a second node of a restricted content type?
  criteria: It restricts chosen content types to a single node per language. Adding a second node of that
    type is blocked by the OnlyOne validation constraint, and the editor is redirected to edit (or view)
    the existing node.
  bundle: onlyone
  rubric_ref: rubric/onlyone_onlyone_what@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: onlyone-config-key
  input: On a Drupal site using the onlyone module, which configuration object and key store the list
    of content types that are restricted to one node?
  criteria: The list is onlyone.settings.onlyone_node_types, a sequence of content-type machine names.
    Configured on /admin/config/content/onlyone.
  bundle: onlyone
  rubric_ref: rubric/onlyone_onlyone_config_key@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: onlyone-settings
  input: The onlyone module's settings page exposes two options. What are the two onlyone.settings keys
    and what does each control?
  criteria: onlyone_new_menu_entry (move restricted types into a separate 'Add content (Only One)' menu
    entry) and onlyone_redirect (redirect a blocked add to the existing node's edit form when true, or
    its canonical page when false).
  bundle: onlyone
  rubric_ref: rubric/onlyone_onlyone_settings@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: onlyone-configured-types
  input: On this Drupal site, inspect the live Only One configuration and report which content type(s)
    are currently restricted to a single node per language.
  criteria: onlyone.settings.onlyone_node_types contains 'onlyone_eval'.
  bundle: onlyone
  rubric_ref: rubric/onlyone_onlyone_configured_types@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/onlyone-configured-types-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/onlyone-configured-types-cleanup.sh
- id: onlyone-redirect-value
  input: 'On this Drupal site, inspect the live Only One settings: when an editor tries to add a second
    node of a restricted content type, are they sent to the existing node''s edit form or to its canonical
    page? State the value of the relevant setting.'
  criteria: onlyone.settings.onlyone_redirect is false, so editors are redirected to the existing node's
    canonical page rather than its edit form.
  bundle: onlyone
  rubric_ref: rubric/onlyone_onlyone_redirect_value@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/onlyone-redirect-value-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/onlyone-redirect-value-cleanup.sh
- id: onlyone-restrict-type
  input: On this Drupal site there is a content type with machine name 'onlyone_task'. Using the Only
    One module, configure it so that only one 'onlyone_task' node can exist per language. Apply the change
    to the live site.
  criteria: onlyone.settings.onlyone_node_types includes 'onlyone_task' (add it to the sequence and save,
    or tick it on /admin/config/content/onlyone).
  bundle: onlyone
  rubric_ref: rubric/onlyone_onlyone_restrict_type@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/onlyone-restrict-type-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/onlyone-restrict-type-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/onlyone-restrict-type-verify.sh
- id: onlyone-enable-menu-entry
  input: On my Drupal site, using the Only One module, I want the content types that are limited to one
    item to appear under their own 'Add content (Only One)' action instead of the normal Add content list.
    Turn that option on. Apply the change to the live site.
  criteria: onlyone.settings.onlyone_new_menu_entry is true (enable 'Show configured content types in
    a new menu entry' on /admin/config/content/onlyone/settings, or set the config value and rebuild routes).
  bundle: onlyone
  rubric_ref: rubric/onlyone_onlyone_enable_menu_entry@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: layman
    reset: agent-module-documentation/evaluation/verify/onlyone-enable-menu-entry-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/onlyone-enable-menu-entry-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/onlyone-enable-menu-entry-verify.sh
