rubrics:
- id: onlyone_onlyone_what
  version: '1.0'
  applicable_bundles:
  - onlyone
  checks:
  - kind: must_contain_any
    values:
    - one node
    - only one
    - per language
    - single node
    - edit
  scoring:
    combine: all_pass
- id: onlyone_onlyone_config_key
  version: '1.0'
  applicable_bundles:
  - onlyone
  checks:
  - kind: must_contain_any
    values:
    - onlyone.settings
    - onlyone_node_types
  scoring:
    combine: all_pass
- id: onlyone_onlyone_settings
  version: '1.0'
  applicable_bundles:
  - onlyone
  checks:
  - kind: must_contain_any
    values:
    - onlyone_new_menu_entry
    - onlyone_redirect
    - new menu entry
    - redirect
  scoring:
    combine: all_pass
- id: onlyone_onlyone_configured_types
  version: '1.0'
  applicable_bundles:
  - onlyone
  checks:
  - kind: must_contain_any
    values:
    - onlyone_eval
  scoring:
    combine: all_pass
- id: onlyone_onlyone_redirect_value
  version: '1.0'
  applicable_bundles:
  - onlyone
  checks:
  - kind: must_contain_any
    values:
    - 'false'
    - canonical
    - disabled
    - view
  scoring:
    combine: all_pass
- id: onlyone_onlyone_restrict_type
  version: '1.0'
  applicable_bundles:
  - onlyone
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
- id: onlyone_onlyone_enable_menu_entry
  version: '1.0'
  applicable_bundles:
  - onlyone
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
