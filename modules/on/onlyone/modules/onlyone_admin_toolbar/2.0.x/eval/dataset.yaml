metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: onlyone_admin_toolbar
  version: 2.0.x
  note: 'onlyone_admin_toolbar is a bundled glue submodule of onlyone. It has NO configuration, no configure
    route, no permissions, no drush, no plugin types. It reacts to the parent module''s onlyone.settings:
    hook_menu_links_discovered_alter appends '' (Edit)'' to the Admin Toolbar Tools ''Add content'' links
    for restricted content types that already have a node, and (when onlyone_new_menu_entry is on) moves
    them under the onlyone.add_page parent. It provides the onlyone.admin_toolbar service (rebuildMenu)
    and an event subscriber on onlyone.content_types_updated. It requires admin_toolbar_tools and onlyone.
    Because the submodule holds no state of its own, medium/hard cases are grounded in (a) its installation
    state on the live site and (b) the onlyone.settings.onlyone_node_types config it consumes. Baseline
    is DISABLED; setup/reset enable it and cleanups uninstall it again (admin_toolbar_tools, pulled in
    as a dependency, is left as-is). Content-type fixtures are namespaced onlyone_atb_eval / onlyone_atb_task.'
questions:
- id: onlyone-atb-what
  input: What does the onlyone_admin_toolbar submodule do to the Admin Toolbar 'Add content' menu for
    content types that are configured as Only One?
  criteria: For each Only One content type that already has a node, it appends ' (Edit)' to that type's
    link in the Admin Toolbar Tools 'Add content' menu (and moves it under 'Add content (Only One)' when
    that option is enabled), so editors jump straight to editing the existing node.
  bundle: onlyone_admin_toolbar
  rubric_ref: rubric/onlyone_admin_toolbar_onlyone_atb_what@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: onlyone-atb-requires
  input: Which modules does the onlyone_admin_toolbar submodule depend on?
  criteria: It depends on admin_toolbar_tools (Admin Toolbar Extra Tools) and onlyone (its parent module).
  bundle: onlyone_admin_toolbar
  rubric_ref: rubric/onlyone_admin_toolbar_onlyone_atb_requires@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: onlyone-atb-no-config
  input: Does the onlyone_admin_toolbar submodule have its own configuration/settings page? If not, what
    configuration drives its behavior?
  criteria: No, it has no configuration of its own. Its behavior is driven entirely by the parent module's
    onlyone.settings (onlyone_node_types and onlyone_new_menu_entry).
  bundle: onlyone_admin_toolbar
  rubric_ref: rubric/onlyone_admin_toolbar_onlyone_atb_no_config@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: onlyone-atb-is-enabled
  input: On this Drupal site, is the onlyone_admin_toolbar submodule installed, and what service does
    it provide for rebuilding the toolbar menu?
  criteria: Yes, onlyone_admin_toolbar is installed; it provides the onlyone.admin_toolbar service (OnlyOneAdminToolbar::rebuildMenu).
  bundle: onlyone_admin_toolbar
  rubric_ref: rubric/onlyone_admin_toolbar_onlyone_atb_is_enabled@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/onlyone_admin_toolbar-is-enabled-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/onlyone_admin_toolbar-is-enabled-cleanup.sh
- id: onlyone-atb-configured-types
  input: On this Drupal site the onlyone_admin_toolbar submodule is active. Inspect the live Only One
    configuration and report which content type its Admin Toolbar integration will annotate (i.e. which
    type is restricted to one node).
  criteria: onlyone.settings.onlyone_node_types contains 'onlyone_atb_eval', so the toolbar integration
    acts on that content type.
  bundle: onlyone_admin_toolbar
  rubric_ref: rubric/onlyone_admin_toolbar_onlyone_atb_configured_types@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/onlyone_admin_toolbar-configured-types-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/onlyone_admin_toolbar-configured-types-cleanup.sh
- id: onlyone-atb-enable
  input: On this Drupal site the Only One module is installed and the site uses Admin Toolbar. Install
    the bundled onlyone_admin_toolbar submodule so the Admin Toolbar 'Add content' menu reflects the Only
    One restrictions. Apply the change to the live site.
  criteria: The onlyone_admin_toolbar module is installed (drush en onlyone_admin_toolbar -y), which also
    enables its admin_toolbar_tools dependency.
  bundle: onlyone_admin_toolbar
  rubric_ref: rubric/onlyone_admin_toolbar_onlyone_atb_enable@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/onlyone_admin_toolbar-enable-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/onlyone_admin_toolbar-enable-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/onlyone_admin_toolbar-enable-verify.sh
- id: onlyone-atb-toolbar-type
  input: On this Drupal site the onlyone_admin_toolbar submodule is installed. There is a content type
    'onlyone_atb_task'. Configure Only One so that this content type is restricted to one node per language,
    so the Admin Toolbar integration will annotate it. Apply the change to the live site.
  criteria: With onlyone_admin_toolbar installed, onlyone.settings.onlyone_node_types includes 'onlyone_atb_task'.
  bundle: onlyone_admin_toolbar
  rubric_ref: rubric/onlyone_admin_toolbar_onlyone_atb_toolbar_type@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/onlyone_admin_toolbar-toolbar-type-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/onlyone_admin_toolbar-toolbar-type-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/onlyone_admin_toolbar-toolbar-type-verify.sh
