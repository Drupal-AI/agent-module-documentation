metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: http_client_manager_example
  version: 11.0.x
  note: 'Example submodule for HTTP Client Manager. Declares service APIs example_services / example_services_yaml
    (base_uri http://jsonplaceholder.typicode.com) with commands FindPosts/FindPost/CreatePost/FindComments,
    plus shipped http_config_request entities all_posts, find_post (postId 1), create_post (token params),
    an injectable client service example_api.http_client and a typed wrapper (api: posts). Medium introspects
    the shipped find_post config entity (its postId is set to a known value by setup and restored to ''1''
    by cleanup); hard has the agent create a FindComments config request verified against live config.
    Test entities namespaced hcme_eval_*.'
questions:
- id: http_client_manager_example-api-base
  input: In the HTTP Client Manager example submodule, what is the service API id it defines and which
    remote base URI does it target?
  criteria: It defines example_services (and example_services_yaml), both with base_uri http://jsonplaceholder.typicode.com.
  bundle: http_client_manager_example
  rubric_ref: rubric/http_client_manager_example_http_client_manager_example_api_base@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: http_client_manager_example-commands
  input: Which operations/commands does the HTTP Client Manager example API expose for posts?
  criteria: FindPosts (GET posts), FindPost (GET posts/{postId}), CreatePost (POST posts), FindComments
    (GET comments).
  bundle: http_client_manager_example
  rubric_ref: rubric/http_client_manager_example_http_client_manager_example_commands@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: http_client_manager_example-config-requests
  input: What ready-made HTTP Config Requests and demo pages does the HTTP Client Manager example submodule
    ship?
  criteria: Config requests all_posts (FindPosts), find_post (FindPost, postId 1) and create_post (CreatePost
    with tokens); demo routes /find-posts/{postId}, /create-post and their -advanced variants.
  bundle: http_client_manager_example
  rubric_ref: rubric/http_client_manager_example_http_client_manager_example_config_requests@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: http_client_manager_example-known-postid
  input: On this site, inspect the shipped 'find_post' HTTP Config Request from the example submodule
    and report the postId parameter it is currently set to.
  criteria: postId is currently 9 (config http_client_manager.http_config_request.find_post).
  bundle: http_client_manager_example
  rubric_ref: rubric/http_client_manager_example_http_client_manager_example_known_postid@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/http_client_manager_example-known-postid-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/http_client_manager_example-known-postid-cleanup.sh
- id: http_client_manager_example-build-findcomments
  input: Using the example_services API, create an HTTP Config Request with id 'hcme_eval_build' that
    runs the FindComments command with the parameter postId set to 2. Apply the change to the live site.
  criteria: 'Create an http_config_request id=hcme_eval_build, service_api=example_services, command_name=FindComments,
    parameters={postId: 2}.'
  bundle: http_client_manager_example
  rubric_ref: rubric/http_client_manager_example_http_client_manager_example_build_findcomments@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/http_client_manager_example-build-findcomments-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/http_client_manager_example-build-findcomments-reset.sh
    verify: agent-module-documentation/evaluation/verify/http_client_manager_example-build-findcomments-verify.sh
