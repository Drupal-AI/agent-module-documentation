rubrics:
- id: http_client_manager_example_http_client_manager_example_api_base
  version: '1.0'
  applicable_bundles:
  - http_client_manager_example
  checks:
  - kind: must_contain_any
    values:
    - example_services
    - jsonplaceholder
  scoring:
    combine: all_pass
- id: http_client_manager_example_http_client_manager_example_commands
  version: '1.0'
  applicable_bundles:
  - http_client_manager_example
  checks:
  - kind: must_contain_any
    values:
    - FindPost
    - FindPosts
    - CreatePost
    - FindComments
  scoring:
    combine: all_pass
- id: http_client_manager_example_http_client_manager_example_config_requests
  version: '1.0'
  applicable_bundles:
  - http_client_manager_example
  checks:
  - kind: must_contain_any
    values:
    - find_post
    - all_posts
    - create_post
    - find-posts
  scoring:
    combine: all_pass
- id: http_client_manager_example_http_client_manager_example_known_postid
  version: '1.0'
  applicable_bundles:
  - http_client_manager_example
  checks:
  - kind: must_contain_any
    values:
    - '9'
  scoring:
    combine: all_pass
- id: http_client_manager_example_http_client_manager_example_build_findcomments
  version: '1.0'
  applicable_bundles:
  - http_client_manager_example
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
