rubrics:
- id: http_client_manager_http_client_manager_call_from_code
  version: '1.0'
  applicable_bundles:
  - http_client_manager
  checks:
  - kind: must_contain_any
    values:
    - http_client_manager.factory
    - ->call(
    - ->get(
    - HttpClient
  scoring:
    combine: all_pass
- id: http_client_manager_http_client_manager_define_api
  version: '1.0'
  applicable_bundles:
  - http_client_manager
  checks:
  - kind: must_contain_any
    values:
    - http_services_api.yml
    - api_path
    - base_uri
    - Guzzle
  scoring:
    combine: all_pass
- id: http_client_manager_http_client_manager_config_request
