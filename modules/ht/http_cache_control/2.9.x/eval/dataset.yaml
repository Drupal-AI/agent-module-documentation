    cleanup: agent-module-documentation/evaluation/verify/http_cache_control-smaxage-value-cleanup.sh
- id: http_cache_control-current-cdn
  input: Which targeted Cache-Control header is this site currently configured to emit, and with what
    visibility and max-age? Inspect the live configuration.
  criteria: 'One targeted item in cache.targeted.items with target CDN, so it emits CDN-Cache-Control:
    public, max-age=3600 (visibility public, max_age 3600).'
  bundle: http_cache_control
  rubric_ref: rubric/http_cache_control_http_cache_control_current_cdn@1.0
