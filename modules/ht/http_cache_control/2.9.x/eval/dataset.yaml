metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: http_cache_control
  version: 2.9.x
  note: 'HTTP Cache Control adds Cache-Control / Surrogate-Control / targeted CDN cache headers on top
    of Drupal core''s page-cache max-age. It has no admin page of its own: it alters the core Performance
    form (route system.performance_settings, /admin/config/development/performance) and stores everything
    in one config object, http_cache_control.settings, which a KernelEvents::RESPONSE subscriber reads.
    All tiers are grounded in that config object. Note on execution grading: the module only writes headers
    onto responses Drupal already deems cacheable (anonymous page-cache hits), so functional header emission
    is environment-dependent; therefore hard-tier verify scripts assert the live config values that the
    CacheControlEventSubscriber consumes (legitimate live state) rather than curl''d headers. The module
    defines no permissions, services (beyond the subscriber), plugins or Drush commands, so there is no
    plugin/hook/drush tier to cover.'
questions:
- id: http_cache_control-config-location
  input: On a Drupal 11 site, where do I configure the HTTP Cache Control module? It has no menu link
    of its own. Give the admin path, the route, and the config object that stores the settings.
  criteria: The module has no configure route; it alters Drupal core's Performance form at /admin/config/development/performance
    (route system.performance_settings). All values are stored in the http_cache_control.settings config
    object.
  bundle: http_cache_control
  rubric_ref: rubric/http_cache_control_http_cache_control_config_location@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: http_cache_control-smaxage-key
  input: Which config key and Cache-Control directive does this module use to give reverse proxies / CDNs
    a longer cache lifetime than browsers?
  criteria: 'cache.http.s_maxage (an integer number of seconds) in http_cache_control.settings, emitted
    as the Cache-Control: s-maxage=N directive, which shared caches use while browsers use the separate
    core max-age.'
  bundle: http_cache_control
  rubric_ref: rubric/http_cache_control_http_cache_control_smaxage_key@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: http_cache_control-mechanism
  input: How does this module actually add the extra Cache-Control directives to responses, and which
    stale-revalidation directives can it emit?
  criteria: A response event subscriber (CacheControlEventSubscriber on KernelEvents::RESPONSE, priority
    -10) reads http_cache_control.settings and, for cacheable responses, adds directives including stale-while-revalidate=N
    (cache.http.stale_while_revalidate) and stale-if-error=N (cache.http.stale_if_error), plus must-revalidate,
    no-cache, no-store and Surrogate-Control.
  bundle: http_cache_control
  rubric_ref: rubric/http_cache_control_http_cache_control_mechanism@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: http_cache_control-targeted-header
  input: Can this module emit a CDN-only cache header that doesn't affect browsers, like CDN-Cache-Control
    or Akamai-Cache-Control? Where is that stored?
  criteria: Yes. The 'Targeted Cache-Control' section stores a list under cache.targeted.items; each item's
    target prefix produces a {target}-Cache-Control header (CDN-Cache-Control, Akamai-Cache-Control, Cloudflare-CDN-Cache-Control
    or a custom prefix) with its own directives (visibility, max-age, no-cache, must-revalidate, no-store,
    no-transform, proxy-revalidate).
  bundle: http_cache_control
  rubric_ref: rubric/http_cache_control_http_cache_control_targeted_header@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: http_cache_control-current-smaxage
  input: This site already has HTTP Cache Control configured. What shared-cache max age (s-maxage), in
    seconds, is currently set for normal (200) responses? Inspect the live configuration to answer.
  criteria: cache.http.s_maxage is 86400 seconds (one day). Readable with `drush config:get http_cache_control.settings
    cache.http.s_maxage`.
  bundle: http_cache_control
  rubric_ref: rubric/http_cache_control_http_cache_control_current_smaxage@1.0
  tags:
  - mode:introspection
  - difficulty:medium
