metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: htmlmail
  version: 4.0.x
  note: Installed release is 4.0.0-beta2 (beta). Sending real themed mail is hard to assert as live state,
    so all cases are `recipe` (response-graded), probing the mail plugin/mailsystem wiring, config keys,
    template resolution, per-user plaintext, permission, and admin route.
questions:
- id: htmlmail-what-and-dep
  input: What does the HTML Mail (htmlmail) Drupal module do, and which contrib module does it require?
  criteria: It replaces Drupal's mail system with an HTML mailer so system emails can be themed with Twig
    like the rest of the site. It requires the Mail System (mailsystem) module.
  bundle: htmlmail
  rubric_ref: rubric/htmlmail_htmlmail_what_and_dep@1.0
  tags:
  - mode:recipe
- id: htmlmail-mail-plugin-id
  input: What is the machine id of the mail plugin HTML Mail provides, and where does installing the module
    register it?
  criteria: It provides the @Mail plugin with id `htmlmail` (class HtmlMailSystem). hook_install() registers
    it in the `system.mail` config `interface` and sets mailsystem.settings defaults.sender/formatter
    to `htmlmail`.
  bundle: htmlmail
  rubric_ref: rubric/htmlmail_htmlmail_mail_plugin_id@1.0
  tags:
  - mode:recipe
- id: htmlmail-template-resolution
  input: In HTML Mail, if a message is sent with module `user` and key `password_reset`, which Twig template
    files are tried, in order?
  criteria: 1) htmlmail--user--password_reset.html.twig, 2) htmlmail--user.html.twig, 3) htmlmail.html.twig
    — each looked up first in the selected Email theme's templates dir, then in the module.
  bundle: htmlmail
  rubric_ref: rubric/htmlmail_htmlmail_template_resolution@1.0
  tags:
  - mode:recipe
- id: htmlmail-config-keys
  input: Which Drupal config object holds HTML Mail's settings, and which keys select the email theme
    and the post-theming text format filter?
  criteria: Config object `htmlmail.settings`; key `theme` chooses the Email theme holding override templates
    and `postfilter` chooses a text format applied to the body after theming ('0' = unfiltered).
  bundle: htmlmail
  rubric_ref: rubric/htmlmail_htmlmail_config_keys@1.0
  tags:
  - mode:recipe
- id: htmlmail-plaintext-preference
  input: How can an individual user choose to receive only plaintext emails from HTML Mail, and which
    permission enables that choice?
  criteria: A 'Plaintext-only emails' checkbox is added to the user's account form (stored in user.data
    under key htmlmail_plaintext); it is shown to users with the `choose htmlmail_plaintext` permission
    (or `administer users`).
  bundle: htmlmail
  rubric_ref: rubric/htmlmail_htmlmail_plaintext_preference@1.0
  tags:
  - mode:recipe
- id: htmlmail-admin-route
  input: Where is HTML Mail configured in the Drupal admin UI, what is the route name, and which permission
    is required?
  criteria: Settings form at /admin/config/system/htmlmail (route htmlmail.settings), gated by the `administer
    site configuration` permission; a Send-test form is at /admin/config/system/htmlmail/test (route htmlmail.test).
  bundle: htmlmail
  rubric_ref: rubric/htmlmail_htmlmail_admin_route@1.0
  tags:
  - mode:recipe
- id: htmlmail-preprocess-hook
  input: How can another module add or change variables available in HTML Mail's email templates?
  criteria: Implement MODULENAME_preprocess_htmlmail(&$variables) (a hook_preprocess_HOOK) to inject or
    modify template variables.
  bundle: htmlmail
  rubric_ref: rubric/htmlmail_htmlmail_preprocess_hook@1.0
  tags:
  - mode:recipe
