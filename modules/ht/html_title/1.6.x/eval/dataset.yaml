metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: html_title
  version: 1.6.x
  note: HTML Title renders a limited, admin-controlled allowlist of inline HTML tags inside node titles
    (and via an html_title field formatter / node_html_title Views handler). Its only settings config
    is html_title.settings:allow_html_tags (space-separated tag string, shipped default '<br> <sub> <sup>'),
    edited at /admin/config/user-interface/html_title (permission 'administer html title settings'). The
    filtering is done by the html_title.filter service (Drupal\html_title\HtmlTitleFilter::decodeToText/decodeToMarkup),
    which decodes entities then Xss::filter()s against that allowlist. Medium cases read back live config
    (a known allowlist value; a field whose view display uses the html_title formatter); hard cases mutate
    live config (add the <em> tag to the allowlist; switch a field's view-display formatter to html_title).
questions:
- id: html_title-config-key
  input: On a Drupal 11 site I enabled the html_title module. Which configuration object and key store
    the list of HTML tags allowed in node titles, what is the shipped default value, and at what admin
    path do I edit it?
  criteria: The config is html_title.settings, key allow_html_tags, a space-separated tag string whose
    shipped default is '<br> <sub> <sup>'. Edit it at /admin/config/user-interface/html_title (route html_title.settings,
    permission 'administer html title settings').
  bundle: html_title
  rubric_ref: rubric/html_title_html_title_config_key@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: html_title-service-xss
  input: How does the html_title module render markup inside a node title safely, and which service would
    I call to filter a title string myself? Name the service id and a method.
  criteria: 'It decodes the stored title (Html::decodeEntities) then runs Xss::filter() limited to the
    configured allowlist, stripping everything else. Call the html_title.filter service (Drupal\html_title\HtmlTitleFilter):
    decodeToText() for a filtered string or decodeToMarkup() for safe Markup.'
  bundle: html_title
  rubric_ref: rubric/html_title_html_title_service_xss@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: html_title-formatter-and-views
  input: Besides node titles, how can html_title render a plain-text (string) field's value as HTML in
    a view display, and how does it affect the node Title column in a Views listing?
  criteria: It ships an 'html_title' field formatter (label 'HTML-title text') for string fields — select
    it on the field's Manage display. It also swaps the Views node-title field handler to node_html_title
    via hook_views_data_alter, so any view showing the node Title field renders the decoded markup automatically.
  bundle: html_title
  rubric_ref: rubric/html_title_html_title_formatter_and_views@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: html_title-known-allowlist
  input: On this Drupal site, which HTML tags are currently allowed inside node titles by the html_title
    module? Inspect the live configuration and list them.
  criteria: html_title.settings:allow_html_tags is '<em> <strong> <cite>', so em, strong and cite are
    the currently-allowed tags.
  bundle: html_title
  rubric_ref: rubric/html_title_html_title_known_allowlist@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/html_title-known-allowlist-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/html_title-known-allowlist-cleanup.sh
- id: html_title-known-formatter
  input: The Article content type on this site has a plain string field field_hty_known. Inspect the live
    default view display for Article and state which field formatter renders that field.
  criteria: In core.entity_view_display.node.article.default the field_hty_known component uses the html_title
    formatter ('HTML-title text').
  bundle: html_title
  rubric_ref: rubric/html_title_html_title_known_formatter@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/html_title-known-formatter-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/html_title-known-formatter-cleanup.sh
- id: html_title-allow-em
  input: On this Drupal site, editors need to italicise words inside node titles using <em>, but the html_title
    allowlist currently does not permit it. Update the html_title configuration so that the <em> tag is
    allowed in node titles, and apply the change to the live site.
  criteria: Add <em> to html_title.settings:allow_html_tags (e.g. set it to '<br> <em>' via the settings
    form or `drush config:set html_title.settings allow_html_tags '<em> <sub> <sup>'`). The verify checks
    the live allowlist now contains <em>.
  bundle: html_title
  rubric_ref: rubric/html_title_html_title_allow_em@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/html_title-allow-em-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/html_title-allow-em-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/html_title-allow-em-verify.sh
- id: html_title-set-formatter
  input: On this Drupal site the Article content type has a plain string field field_hty_task that currently
    renders as plain text. Using the html_title module, configure the Article default view display so
    this field's value is rendered as HTML markup, and apply the change to the live site.
  criteria: In core.entity_view_display.node.article.default set the field_hty_task component's formatter
    type to html_title (the 'HTML-title text' formatter) and save. The verify checks the component type
    is html_title.
  bundle: html_title
  rubric_ref: rubric/html_title_html_title_set_formatter@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/html_title-set-formatter-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/html_title-set-formatter-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/html_title-set-formatter-verify.sh
