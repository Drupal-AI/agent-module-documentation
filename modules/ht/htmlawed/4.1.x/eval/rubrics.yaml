rubrics:
- id: htmlawed_htmlawed_plugin_and_defaults
  version: '1.0'
  applicable_bundles:
  - htmlawed
  checks:
  - kind: must_contain_any
    values:
    - filter_htmlawed
    - elements
    - safe
  scoring:
    combine: all_pass
- id: htmlawed_htmlawed_where_configured
  version: '1.0'
  applicable_bundles:
  - htmlawed
  checks:
  - kind: must_contain_any
    values:
    - text format
    - text formats
    - admin/config/content/formats
    - filter.format
    - administer filters
  scoring:
    combine: all_pass
- id: htmlawed_htmlawed_teaser_and_php
  version: '1.0'
  applicable_bundles:
  - htmlawed
  checks:
  - kind: must_contain_any
    values:
    - comment
    - save_php
  scoring:
    combine: all_pass
- id: htmlawed_htmlawed_read_denied_attrs
  version: '1.0'
  applicable_bundles:
  - htmlawed
  checks:
  - kind: must_contain_any
    values:
    - data-hlx
    - deny_attribute
  scoring:
    combine: all_pass
- id: htmlawed_htmlawed_which_format_active
  version: '1.0'
  applicable_bundles:
  - htmlawed
  checks:
  - kind: must_contain_any
    values:
    - htmlawed_on
  scoring:
    combine: all_pass
- id: htmlawed_htmlawed_enable_restricted
  version: '1.0'
  applicable_bundles:
  - htmlawed
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
- id: htmlawed_htmlawed_restrict_schemes
  version: '1.0'
  applicable_bundles:
  - htmlawed
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
