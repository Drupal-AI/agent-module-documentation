metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: htmlawed
  version: 4.1.x
  note: 'htmLawed exposes one filter plugin, filter_htmlawed (TYPE_HTML_RESTRICTOR), configured per text
    format at admin/config/content/formats; no configure route (configure=null), no permissions/Drush/plugin
    types of its own. Settings live at filter.format.<format>.filters.filter_htmlawed.settings with four
    string keys: config (htmLawed $config array body, e.g. "''safe'' => 1, ''elements'' => ''a, em, strong'',
    ''deny_attribute'' => ''id, style''"), spec, help, helplong. The config string is turned into a PHP
    array with eval(). Medium cases install a known filter config on a namespaced text format and read
    it back; hard cases enable/configure the filter on a namespaced format and verify the stored config
    string.'
questions:
- id: htmlawed-plugin-and-defaults
  input: In the Drupal contrib module htmlawed, what is the machine id of the filter plugin it provides,
    and what HTML tags does its default configuration allow out of the box?
  criteria: The filter plugin id is filter_htmlawed (a TYPE_HTML_RESTRICTOR filter). Its default Config.
    is "'safe' => 1, 'elements' => 'a, em, strong, cite, code, ol, ul, li, dl, dt, dd, br, p', 'deny_attribute'
    => 'id, style'", i.e. it allows a, em, strong, cite, code, ol, ul, li, dl, dt, dd, br, p and denies
    id/style with safe=1.
  bundle: htmlawed
  rubric_ref: rubric/htmlawed_htmlawed_plugin_and_defaults@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: htmlawed-where-configured
  input: The htmlawed module has no settings page of its own. On a Drupal 11 site, where and how do I
    turn the htmLawed filter on, and where are its settings stored?
  criteria: There is no configure route (configure=null). You enable/configure the htmLawed filter per
    text format at Configuration -> Content authoring -> Text formats and editors (admin/config/content/formats),
    which needs the 'administer filters' permission. Settings are stored on the format at filter.format.<format>.filters.filter_htmlawed.settings
    (config, spec, help, helplong).
  bundle: htmlawed
  rubric_ref: rubric/htmlawed_htmlawed_where_configured@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: htmlawed-teaser-and-php
  input: With the htmlawed filter, how do I keep Drupal's teaser-break comment marker (<!--break-->) from
    being stripped, and how do I stop it mangling <?php ... ?> blocks in content? Name the Config. parameters.
  criteria: Add 'comment' => 2 to the Config. to preserve HTML comments such as <!--break-->, and add
    'save_php' => 1 to protect <?php ... ?> blocks from alteration (save_php is a module pseudo-parameter,
    not a native htmLawed one).
  bundle: htmlawed
  rubric_ref: rubric/htmlawed_htmlawed_teaser_and_php@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: htmlawed-read-denied-attrs
  input: This site has a text format with machine name 'htmlawed_med1' that uses the htmLawed filter.
    Inspect the live filter configuration and state which HTML attributes that format's htmLawed filter
    denies.
  criteria: In filter.format.htmlawed_med1 the filter_htmlawed settings.config includes deny_attribute
    => 'id, style, data-hlx', so it denies id, style and data-hlx (the distinctive one is data-hlx).
  bundle: htmlawed
  rubric_ref: rubric/htmlawed_htmlawed_read_denied_attrs@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/htmlawed-read-denied-attrs-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/htmlawed-read-denied-attrs-cleanup.sh
- id: htmlawed-which-format-active
  input: This site has two text formats, 'htmlawed_on' and 'htmlawed_off'. Exactly one of them has the
    htmLawed filter (filter_htmlawed) enabled. Inspect the live configuration and state which format has
    htmLawed active.
  criteria: 'htmlawed_on has filter_htmlawed status: true, while on htmlawed_off the filter is present
    but status: false (disabled).'
  bundle: htmlawed
  rubric_ref: rubric/htmlawed_htmlawed_which_format_active@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/htmlawed-which-format-active-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/htmlawed-which-format-active-cleanup.sh
- id: htmlawed-enable-restricted
  input: This site has a text format with machine name 'htmlawed_task' where the htmLawed filter (filter_htmlawed)
    is currently disabled. Using the htmlawed module, enable that filter on this format and configure
    it so that it only allows the a, p and strong HTML tags. Apply the change to the live site.
  criteria: On filter.format.htmlawed_task set filters.filter_htmlawed.status to true and settings.config
    to an elements list containing a, p and strong (e.g. "'safe' => 1, 'elements' => 'a, p, strong'"),
    then save.
  bundle: htmlawed
  rubric_ref: rubric/htmlawed_htmlawed_enable_restricted@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/htmlawed-enable-restricted-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/htmlawed-enable-restricted-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/htmlawed-enable-restricted-verify.sh
    difficulty_note: verify requires status true AND the config elements to include a, p and strong.
- id: htmlawed-restrict-schemes
  input: On this site the text format 'htmlawed_schemes' already uses the htmLawed filter (filter_htmlawed
    is enabled) but places no restriction on link URL protocols. Configure the htmLawed filter's Config.
    so that link and image URLs are limited to the http, https and mailto schemes, and apply the change
    to the live format.
  criteria: 'Add a schemes rule to filters.filter_htmlawed.settings.config on filter.format.htmlawed_schemes,
    e.g. "''safe'' => 1, ''schemes'' => ''href: http, https, mailto; src: http, https''" (the config string
    must contain ''schemes'' and ''mailto''), then save.'
  bundle: htmlawed
  rubric_ref: rubric/htmlawed_htmlawed_restrict_schemes@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/htmlawed-restrict-schemes-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/htmlawed-restrict-schemes-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/htmlawed-restrict-schemes-verify.sh
    difficulty_note: verify requires the config string to contain both 'schemes' and 'mailto'.
