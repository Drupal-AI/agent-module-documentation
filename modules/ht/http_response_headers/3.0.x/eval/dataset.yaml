metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: http_response_headers
  version: 3.0.x
  note: 'HTTP Response Headers stores each header as a `response_header` config entity (http_response_headers.response_header.<id>)
    with fields name (actual HTTP header), value, status, visibility (core condition plugins). The AddHTTPHeaders
    subscriber (KernelEvents::RESPONSE priority -100) applies enabled entities; an EMPTY value removes
    that header. Managed at /admin/config/system/response-headers. Ships 10 optional default headers incl.
    x_frame_options=SAMEORIGIN. Medium cases read back a known custom entity''s value/status. Hard cases
    create custom entities keyed by name+value (X-Frame-Options: DENY; X-Robots-Tag: noindex); resets
    delete only those specific attempts, never the shipped defaults, so verify fails on empty state and
    the shared site is left clean.'
questions:
- id: http_response_headers-add-header
  input: 'On a Drupal site with http_response_headers enabled, where do I go to add a custom HTTP response
    header (like X-Frame-Options: DENY), and what config entity type stores it?'
  criteria: Go to Configuration > System > HTTP Response Headers (/admin/config/system/response-headers,
    route entity.response_header.collection) and add a header. Each header is a `response_header` config
    entity (http_response_headers.response_header.<id>) with a name (the HTTP header), value, status and
    optional visibility conditions.
  bundle: http_response_headers
  rubric_ref: rubric/http_response_headers_http_response_headers_add_header@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: http_response_headers-remove-header
  input: Using the http_response_headers module, how do I make Drupal stop sending a header such as X-Powered-By?
  criteria: Create/enable a response_header entity whose name is X-Powered-By and whose value is empty.
    The AddHTTPHeaders response subscriber removes any header whose configured value is empty (this is
    how the shipped x_powered_by and x_generator defaults strip those headers).
  bundle: http_response_headers
  rubric_ref: rubric/http_response_headers_http_response_headers_remove_header@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: http_response_headers-entity-fields
  input: What fields does a response_header config entity in the http_response_headers module have, and
    when in the request lifecycle are the headers applied?
  criteria: 'Fields: id, label, description, name (the actual HTTP header), value, status (enabled), and
    visibility (core condition plugins evaluated with AND). The AddHTTPHeaders event subscriber applies
    enabled entities on KernelEvents::RESPONSE at priority -100 (empty value removes the header).'
  bundle: http_response_headers
  rubric_ref: rubric/http_response_headers_http_response_headers_entity_fields@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: http_response_headers-known-value
  input: This site has an http_response_headers configuration whose HTTP header name is 'X-Custom-Test'.
    Inspect the live configuration and tell me what value that header is set to.
  criteria: The response_header entity hrh_med_value sets X-Custom-Test to 'medium-value' (name=X-Custom-Test,
    value=medium-value, status=true).
  bundle: http_response_headers
  rubric_ref: rubric/http_response_headers_http_response_headers_known_value@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/http_response_headers-known-value-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/http_response_headers-known-value-cleanup.sh
- id: http_response_headers-disabled-status
  input: There is an http_response_headers configuration on this site for the header 'X-Disabled-Test'.
    Inspect it and state whether that header is currently being sent (enabled) or not.
  criteria: It is disabled — the response_header entity hrh_med_disabled (name X-Disabled-Test) has status=false,
    so the header is not sent.
  bundle: http_response_headers
  rubric_ref: rubric/http_response_headers_http_response_headers_disabled_status@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/http_response_headers-disabled-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/http_response_headers-disabled-cleanup.sh
- id: http_response_headers-frame-deny
  input: I want to stop other websites from being able to embed my site inside a frame or iframe at all.
    Use the HTTP Response Headers module to send X-Frame-Options with the value DENY, and apply it to
    the site.
  criteria: 'Create (or reconfigure) an enabled response_header config entity with name ''X-Frame-Options''
    and value ''DENY'' so the site responds with X-Frame-Options: DENY.'
  bundle: http_response_headers
  rubric_ref: rubric/http_response_headers_http_response_headers_frame_deny@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-layman
    reset: agent-module-documentation/evaluation/verify/http_response_headers-frame-deny-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/http_response_headers-frame-deny-reset.sh
    verify: agent-module-documentation/evaluation/verify/http_response_headers-frame-deny-verify.sh
    unused_text_checks:
      must_contain_any: []
      must_not_contain: []
- id: http_response_headers-robots-noindex
  input: 'Using the http_response_headers module, configure the site to send the response header ''X-Robots-Tag:
    noindex'' and apply it to the live site.'
  criteria: 'Create an enabled response_header config entity with name ''X-Robots-Tag'' and value ''noindex''
    (http_response_headers.response_header.<id>), so the site sends X-Robots-Tag: noindex.'
  bundle: http_response_headers
  rubric_ref: rubric/http_response_headers_http_response_headers_robots_noindex@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/http_response_headers-robots-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/http_response_headers-robots-reset.sh
    verify: agent-module-documentation/evaluation/verify/http_response_headers-robots-verify.sh
    unused_text_checks:
      must_contain_any: []
      must_not_contain: []
