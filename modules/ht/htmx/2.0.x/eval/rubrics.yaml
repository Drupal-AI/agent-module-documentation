rubrics:
- id: htmx_htmx_twig_function
  version: '1.0'
  applicable_bundles:
  - htmx
  checks:
  - kind: must_contain_any
    values:
    - create_htmx
    - HtmxAttributeBuilder
  scoring:
    combine: all_pass
- id: htmx_htmx_response_headers
  version: '1.0'
  applicable_bundles:
  - htmx
  checks:
  - kind: must_contain_any
    values:
    - Drupal\Core\Htmx\Htmx
    - core
    - http_header
    - HX-Trigger
  scoring:
    combine: all_pass
- id: htmx_htmx_blocks_admin
  version: '1.0'
  applicable_bundles:
  - htmx
  checks:
  - kind: must_contain_any
    values:
    - htmx_block
    - /admin/structure/htmx-block
    - administer htmx_block
    - htmx_loader
  scoring:
    combine: all_pass
- id: htmx_htmx_inspect_block_plugin
  version: '1.0'
  applicable_bundles:
  - htmx
  checks:
  - kind: must_contain_any
    values:
    - system_powered_by_block
  scoring:
    combine: all_pass
- id: htmx_htmx_inspect_branding
  version: '1.0'
  applicable_bundles:
  - htmx
  checks:
  - kind: must_contain_any
    values:
    - system_branding_block
  scoring:
    combine: all_pass
- id: htmx_htmx_build_block
  version: '1.0'
  applicable_bundles:
  - htmx
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
- id: htmx_htmx_build_branding
  version: '1.0'
  applicable_bundles:
  - htmx
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
