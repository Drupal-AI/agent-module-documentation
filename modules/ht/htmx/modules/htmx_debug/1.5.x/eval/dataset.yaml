metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: htmx_debug
  version: 1.5.x
  note: HTMX Debugging is a trivial developer submodule of htmx with no config, permissions, or services.
    Enabling it (a) swaps core's minified htmx.min.js for the unminified htmx.js via htmx_debug_library_info_alter(),
    (b) attaches the htmx_debug/debug library and (c) adds data-hx-ext="debug" to <html> via htmx_debug_preprocess_html()
    so all HTMX events log to the console; all three skip HX-Request responses. It depends on htmx. Its
    only live state is module enablement, so the medium (introspection) and hard (execution) cases are
    grounded in whether htmx_debug is enabled. Baseline on this site is DISABLED.
questions:
- id: htmx_debug-purpose
  input: What does the htmx_debug submodule do to help debug HTMX on a Drupal site, and how do I turn
    it on?
  criteria: Enable it (drush en htmx_debug). It replaces core's minified htmx.min.js with the unminified
    htmx.js and turns on the HTMX 'debug' extension (adds data-hx-ext="debug" to <html> and attaches js/htmx/debug.js)
    so every HTMX event is logged to the browser console.
  bundle: htmx_debug
  rubric_ref: rubric/htmx_debug_htmx_debug_purpose@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: htmx_debug-dependency
  input: Which module does htmx_debug depend on, and should it be enabled in production?
  criteria: It depends on the htmx module. It is a development-only tool (unminified library + verbose
    console logging) and should be uninstalled in production.
  bundle: htmx_debug
  rubric_ref: rubric/htmx_debug_htmx_debug_dependency@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: htmx_debug-hx-request
  input: Does htmx_debug add its debug library and unminified script to the responses of actual HTMX (partial)
    requests? Explain.
  criteria: No. htmx_debug_page_attachments_alter() and htmx_debug_preprocess_html() return early when
    the request has an HX-Request header, so the debug extension and data-hx-ext attribute are only added
    to full page loads, not to HTMX partial responses.
  bundle: htmx_debug
  rubric_ref: rubric/htmx_debug_htmx_debug_hx_request@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: htmx_debug-is-enabled
  input: On this Drupal site, is the HTMX Debugging (htmx_debug) module currently installed/enabled? Inspect
    the live site and answer.
  criteria: Yes, htmx_debug is enabled/installed (it appears in the enabled module list, e.g. drush pm:list
    shows htmx_debug as Enabled).
  bundle: htmx_debug
  rubric_ref: rubric/htmx_debug_htmx_debug_is_enabled@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/htmx_debug-enabled-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/htmx_debug-enabled-cleanup.sh
- id: htmx_debug-enable
  input: I want to debug HTMX on this Drupal site with the unminified library and console event logging.
    Enable the appropriate submodule of htmx to do this, and apply it to the live site.
  criteria: The htmx_debug module is installed/enabled (e.g. drush en htmx_debug -y), so \Drupal::moduleHandler()->moduleExists('htmx_debug')
    is TRUE.
  bundle: htmx_debug
  rubric_ref: rubric/htmx_debug_htmx_debug_enable@1.0
