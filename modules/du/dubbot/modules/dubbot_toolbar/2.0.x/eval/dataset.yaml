metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: dubbot_toolbar
  version: 2.0.x
  note: 'DubBot Toolbar is a trivial glue submodule of DubBot. It has no config, no permissions, no schema
    of its own; it implements one hook_toolbar() (via Drupal\dubbot_toolbar\ToolbarHandler) that renders
    a toolbar_item built from the parent''s dubbot.link_generator, reusing dubbot''s permissions. It depends
    on core toolbar and dubbot. Its only observable state is whether it is enabled. Medium/hard cases
    are therefore grounded in the module''s enabled state (drush pm:list / moduleHandler). Baseline: the
    submodule is OFF by default; cleanup/reset uninstall it.'
questions:
- id: dubbot_toolbar-what-it-does
  input: What does the Drupal dubbot_toolbar submodule add, and which core hook does it implement to do
    it?
  criteria: It adds an admin-toolbar item linking to the current page's DubBot report, implemented via
    hook_toolbar() (bridged through Drupal\dubbot_toolbar\ToolbarHandler, which uses the dubbot.link_generator
    service to build the link).
  bundle: dubbot_toolbar
  rubric_ref: rubric/dubbot_toolbar_dubbot_toolbar_what_it_does@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: dubbot_toolbar-dependencies
  input: What modules must be enabled for the Drupal dubbot_toolbar submodule to work, and does it have
    its own settings or permissions?
  criteria: It depends on core 'toolbar' and on the parent 'dubbot' module. It has no configuration, settings
    form, or permissions of its own — it reuses DubBot's dubbot.settings and the access dubbot report
    / per-pane view dubbot * tab permissions.
  bundle: dubbot_toolbar
  rubric_ref: rubric/dubbot_toolbar_dubbot_toolbar_dependencies@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: dubbot_toolbar-visibility
  input: Under what conditions does the dubbot_toolbar item NOT show up for a page?
  criteria: The toolbar item is hidden on 403/404 pages, on pages that anonymous users cannot view (because
    DubBot can only crawl publicly reachable pages), and when no report link is available for the current
    route. It is cached per user.permissions and url.
  bundle: dubbot_toolbar
  rubric_ref: rubric/dubbot_toolbar_dubbot_toolbar_visibility@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: dubbot_toolbar-is-enabled
  input: On this Drupal site, is the DubBot toolbar integration active, and which module provides it?
    Inspect the live site to answer.
  criteria: The dubbot_toolbar submodule is enabled (check `drush pm:list --status=enabled` or moduleHandler).
    It provides the DubBot admin-toolbar item.
  bundle: dubbot_toolbar
  rubric_ref: rubric/dubbot_toolbar_dubbot_toolbar_is_enabled@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/dubbot_toolbar-enabled-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/dubbot_toolbar-enabled-cleanup.sh
- id: dubbot_toolbar-enable-it
  input: On this Drupal site the main DubBot module is installed but the admin toolbar shows no DubBot
    report shortcut. Enable the feature that adds a DubBot item to the Drupal admin toolbar. Apply the
    change to the live site.
  criteria: Install/enable the dubbot_toolbar submodule (e.g. `drush en dubbot_toolbar -y`). It provides
    the hook_toolbar() integration that adds the DubBot toolbar item.
  bundle: dubbot_toolbar
  rubric_ref: rubric/dubbot_toolbar_dubbot_toolbar_enable_it@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/dubbot_toolbar-enable-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/dubbot_toolbar-enable-reset.sh
    verify: agent-module-documentation/evaluation/verify/dubbot_toolbar-enable-verify.sh
