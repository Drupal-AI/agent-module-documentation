rubrics:
- id: dubbot_toolbar_dubbot_toolbar_what_it_does
  version: '1.0'
  applicable_bundles:
  - dubbot_toolbar
  checks:
  - kind: must_contain_any
    values:
    - hook_toolbar
    - toolbar item
    - toolbar_item
  scoring:
    combine: all_pass
- id: dubbot_toolbar_dubbot_toolbar_dependencies
  version: '1.0'
  applicable_bundles:
  - dubbot_toolbar
  checks:
  - kind: must_contain_any
    values:
    - toolbar
    - dubbot
  scoring:
    combine: all_pass
- id: dubbot_toolbar_dubbot_toolbar_visibility
  version: '1.0'
  applicable_bundles:
  - dubbot_toolbar
  checks:
  - kind: must_contain_any
    values:
    - '403'
    - '404'
    - anonymous
    - not accessible
    - no report
  scoring:
    combine: all_pass
- id: dubbot_toolbar_dubbot_toolbar_is_enabled
  version: '1.0'
  applicable_bundles:
  - dubbot_toolbar
  checks:
  - kind: must_contain_any
    values:
    - dubbot_toolbar
  scoring:
    combine: all_pass
- id: dubbot_toolbar_dubbot_toolbar_enable_it
  version: '1.0'
  applicable_bundles:
  - dubbot_toolbar
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
