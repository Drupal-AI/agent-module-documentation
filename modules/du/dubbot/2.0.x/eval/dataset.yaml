metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: dubbot
  version: 2.0.x
  note: 'DubBot integrates the external DubBot SaaS. Its persistent state is the config object dubbot.settings
    (embed_key, api_url default https://api.dubbot.com, dialog_renderer in {0=Modal, off_canvas=Side,
    off_canvas_top=Top}, preview_selector default #page), plus block placements of the dubbot_report Block
    plugin (setting link_color, default #1b9ae4) and role permissions. Permissions: administer dubbot
    configuration, access dubbot report, and per-pane view dubbot {practices,governance,accessibility,spellcheck,seo,links}
    tab. Services: dubbot.client, dubbot.link_generator, dubbot.domain_negotiator; the only hook is hook_dubbot_domains_alter().
    Medium cases read dubbot.settings back from the live site; hard cases build a real block and real
    role permissions, verified against live config entities. Live report data requires a valid DubBot
    embed key/account and is NOT asserted by any script.'
questions:
- id: dubbot-enable-integration
  input: I installed the DubBot Drupal module. What do I need to enter to make it actually talk to the
    DubBot service, on which settings route/path, and in which config object is that value stored?
  criteria: You enter your DubBot embed key (generated in your DubBot account) on the settings form at
    /admin/config/content/dubbot/settings (route dubbot.settings, permission 'administer dubbot configuration').
    It is stored as embed_key in the dubbot.settings config object, alongside api_url, dialog_renderer
    and preview_selector. Saving validates the key against DubBot's API.
  bundle: dubbot
  rubric_ref: rubric/dubbot_dubbot_enable_integration@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: dubbot-tab-permissions
  input: In the DubBot Drupal module, how do I let a role see only the accessibility report pane and not
    the SEO or spelling panes? Which permissions control the individual report tabs?
  criteria: 'Each report pane has its own permission: view dubbot accessibility tab, view dubbot spellcheck
    tab, view dubbot seo tab, view dubbot links tab, view dubbot practices tab, view dubbot governance
    tab. Grant the role ''access dubbot report'' plus ''view dubbot accessibility tab'' only; granting
    at least one tab permission hides the panes whose permission is not granted.'
  bundle: dubbot
  rubric_ref: rubric/dubbot_dubbot_tab_permissions@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: dubbot-domains-hook
  input: DubBot is only fetching reports for my primary domain. Which hook or service controls the list
    of domains DubBot requests reports for, and how would a custom module add another domain?
  criteria: The dubbot.domain_negotiator service (DomainNegotiator::domains()) builds the list, starting
    from the current scheme+host and then running the dubbot_domains alter. A custom module implements
    hook_dubbot_domains_alter(array &$domains) to append (or remove) domains. DubBot itself uses this
    hook to add per-language domains on domain-based language negotiation.
  bundle: dubbot
  rubric_ref: rubric/dubbot_dubbot_domains_hook@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: dubbot-known-position
  input: On this Drupal site, how are DubBot's in-page reports configured to open — as a modal, a side
    tray, or a top panel? Inspect the live configuration to answer.
  criteria: dubbot.settings has dialog_renderer = off_canvas_top, i.e. reports open in a panel at the
    top of the screen. Read it with `drush cget dubbot.settings dialog_renderer`.
  bundle: dubbot
  rubric_ref: rubric/dubbot_dubbot_known_position@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/dubbot-report-position-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/dubbot-report-position-cleanup.sh
- id: dubbot-known-api-url
  input: On this Drupal site, which DubBot API base URL is the module configured to call? Inspect the
    live configuration to answer.
  criteria: dubbot.settings has api_url = https://api.dubbot-probe.example.com (overriding the default
    https://api.dubbot.com). Read it with `drush cget dubbot.settings api_url`.
  bundle: dubbot
  rubric_ref: rubric/dubbot_dubbot_known_api_url@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/dubbot-api-url-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/dubbot-api-url-cleanup.sh
- id: dubbot-place-report-block
  input: 'On this Drupal site (default theme olivero), place a DubBot Report block in the content region
    with block id ''dubbot_report_task'' and set its link color to #ff0000. Apply the change to the live
    site.'
  criteria: Create a block config entity with id dubbot_report_task, plugin 'dubbot_report', theme olivero,
    region content, and settings.link_color '#ff0000' (e.g. Block::create([...])->save() or via Block
    layout > Place block > DubBot Report).
  bundle: dubbot
  rubric_ref: rubric/dubbot_dubbot_place_report_block@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/dubbot-report-block-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/dubbot-report-block-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/dubbot-report-block-verify.sh
- id: dubbot-grant-reviewer
  input: On this Drupal site there is a role 'dubbot_reviewer'. Using the DubBot module's permissions,
    allow that role to open DubBot reports and to view the Accessibility report pane (but you need not
    grant any other panes). Apply the change to the live site.
  criteria: Grant the dubbot_reviewer role the permissions 'access dubbot report' and 'view dubbot accessibility
    tab' (e.g. drush role:perm:add dubbot_reviewer '...'). Both must be present.
  bundle: dubbot
  rubric_ref: rubric/dubbot_dubbot_grant_reviewer@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/dubbot-reviewer-role-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/dubbot-reviewer-role-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/dubbot-reviewer-role-verify.sh
