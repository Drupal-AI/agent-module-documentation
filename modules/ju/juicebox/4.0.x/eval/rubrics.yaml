rubrics:
- id: juicebox_juicebox_plugin_ids
  version: '1.0'
  applicable_bundles:
  - juicebox
  checks:
  - kind: must_contain_any
    values:
    - juicebox_formatter
  scoring:
    combine: all_pass
- id: juicebox_juicebox_field_types
  version: '1.0'
  applicable_bundles:
  - juicebox
  checks:
  - kind: must_contain_any
    values:
    - image
  scoring:
    combine: all_pass
- id: juicebox_juicebox_formatter_settings
  version: '1.0'
  applicable_bundles:
  - juicebox
  checks:
  - kind: must_contain_any
    values:
    - image_style
  scoring:
    combine: all_pass
- id: juicebox_juicebox_article_formatter_introspect
  version: '1.0'
  applicable_bundles:
  - juicebox
  checks:
  - kind: must_contain_any
    values:
    - juicebox_formatter
  scoring:
    combine: all_pass
- id: juicebox_juicebox_article_settings_introspect
  version: '1.0'
  applicable_bundles:
  - juicebox
  checks:
  - kind: must_contain_any
    values:
    - juicebox_medium
  scoring:
    combine: all_pass
- id: juicebox_juicebox_gallery_formatter_expert
  version: '1.0'
  applicable_bundles:
  - juicebox
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
- id: juicebox_juicebox_gallery_formatter_layman
  version: '1.0'
  applicable_bundles:
  - juicebox
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
