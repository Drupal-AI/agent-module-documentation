metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: juicebox
  version: 4.0.x
  note: 'Installed release is 4.0.0-alpha2 (alpha). Hard cases carry persona variants (-layman / -expert)
    sharing one reset + verify. Verification is config-level only: a rendered gallery additionally needs
    the external Juicebox JS library under /libraries/juicebox/, which is out of scope for these checks.
    The bundled tests/modules/juicebox_mimic_article demo module is not covered.'
questions:
- id: juicebox-plugin-ids
  input: In the Juicebox module, what is the machine id of the field formatter plugin, and the machine
    id of the Views style plugin? Give both ids.
  criteria: Field formatter id `juicebox_formatter`; Views style id `juicebox`.
  bundle: juicebox
  rubric_ref: rubric/juicebox_juicebox_plugin_ids@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: juicebox-field-types
  input: Which Drupal field types can the Juicebox field formatter (juicebox_formatter) be applied to?
    List them.
  criteria: image, file, and entity_reference (entity_reference only when the referenced media bundle's
    source is image).
  bundle: juicebox
  rubric_ref: rubric/juicebox_juicebox_field_types@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: juicebox-formatter-settings
  input: In the Juicebox field formatter settings, which two setting keys choose the image style for the
    main image and for the thumbnails? Name the exact keys.
  criteria: '`image_style` (main image) and `thumb_style` (thumbnails); bundled styles include juicebox_medium
    and juicebox_square_thumb.'
  bundle: juicebox
  rubric_ref: rubric/juicebox_juicebox_formatter_settings@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: juicebox-article-formatter-introspect
  input: This Drupal site already has an image field on the Article content type configured to display
    as a Juicebox gallery on the default view display. Inspect the running site (drush available) and
    tell me which field formatter that field uses.
  criteria: The field_jb_probe field on node.article default display uses the `juicebox_formatter` formatter.
  bundle: juicebox
  rubric_ref: rubric/juicebox_juicebox_article_formatter_introspect@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    persona: drupal-expert
    setup: agent-module-documentation/evaluation/verify/juicebox-image-formatter-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/juicebox-image-formatter-cleanup.sh
- id: juicebox-article-settings-introspect
  input: On this Drupal site, an Article image field is displayed with the Juicebox formatter on the default
    view display. Inspect the running site and report the formatter's image_style, thumb_style, and caption_source
    settings.
  criteria: image_style=juicebox_medium, thumb_style=juicebox_square_thumb, caption_source=alt (title_source=title).
  bundle: juicebox
  rubric_ref: rubric/juicebox_juicebox_article_settings_introspect@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    persona: drupal-expert
    setup: agent-module-documentation/evaluation/verify/juicebox-image-formatter-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/juicebox-image-formatter-cleanup.sh
- id: juicebox-gallery-formatter-expert
  input: On this Drupal site (DDEV, drush available), the Article content type has an image field `field_jb_gallery`.
    Configure its formatter on the Article default view display (core.entity_view_display.node.article.default)
    to use the Juicebox gallery formatter (`juicebox_formatter`) with image_style `juicebox_medium` and
    thumb_style `juicebox_square_thumb`. Apply it via drush/config against the running site. Give a one-line
    summary of what you changed.
  criteria: 'node.article.default display: field_jb_gallery component type=juicebox_formatter with settings
    image_style=juicebox_medium, thumb_style=juicebox_square_thumb. Verified against live entity_view_display
    state (config-level; a rendered gallery would also need the Juicebox JS library).'
  bundle: juicebox
  rubric_ref: rubric/juicebox_juicebox_gallery_formatter_expert@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/juicebox-gallery-formatter-reset.sh
    verify: agent-module-documentation/evaluation/verify/juicebox-gallery-formatter-verify.sh
- id: juicebox-gallery-formatter-layman
  input: On my website, each article has a set of photos in a field called "Gallery". Right now they just
    stack up as plain images. I want them shown as a proper responsive photo gallery you can swipe and
    open fullscreen, using the Juicebox gallery display. Use the medium-size image style for the big picture
    and the square thumbnails for the little previews. Please set this up on the site so it works, and
    tell me in one line what you did.
  criteria: 'Same end state as the expert variant: node.article.default display renders field_jb_gallery
    with the juicebox_formatter formatter, image_style=juicebox_medium, thumb_style=juicebox_square_thumb.
    The agent must map the plain-English request onto the Juicebox formatter.'
  bundle: juicebox
  rubric_ref: rubric/juicebox_juicebox_gallery_formatter_layman@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: layman
    reset: agent-module-documentation/evaluation/verify/juicebox-gallery-formatter-reset.sh
    verify: agent-module-documentation/evaluation/verify/juicebox-gallery-formatter-verify.sh
