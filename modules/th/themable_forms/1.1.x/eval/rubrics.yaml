rubrics:
- id: themable_forms_themable_forms_suggestions
  version: '1.0'
  applicable_bundles:
  - themable_forms
  checks:
  - kind: must_contain_any
    values:
    - form_element__form_id__
    - form-element--form-id--
    - form_element__type__
    - form_element__
  scoring:
    combine: all_pass
- id: themable_forms_themable_forms_form_id_attach
  version: '1.0'
  applicable_bundles:
  - themable_forms
  checks:
  - kind: must_contain_any
    values:
    - hook_form_alter
    - '#form_id'
    - form_alter
  scoring:
    combine: all_pass
- id: themable_forms_themable_forms_label_hook
  version: '1.0'
  applicable_bundles:
  - themable_forms
  checks:
  - kind: must_contain_any
    values:
    - form_element_label
    - form-element-label
    - theme_suggestions_form_element_label
  scoring:
    combine: all_pass
- id: themable_forms_themable_forms_known_form_id
  version: '1.0'
  applicable_bundles:
  - themable_forms
  checks:
  - kind: must_contain_any
    values:
    - node_themf_known_form
  scoring:
    combine: all_pass
- id: themable_forms_themable_forms_known_suggestion
  version: '1.0'
  applicable_bundles:
  - themable_forms
  checks:
  - kind: must_contain_any
    values:
    - form_element__form_id__node_themf_disc_form
    - node_themf_disc_form
  scoring:
    combine: all_pass
- id: themable_forms_themable_forms_attach_newtype
  version: '1.0'
  applicable_bundles:
  - themable_forms
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
- id: themable_forms_themable_forms_suggestion_newtype
  version: '1.0'
  applicable_bundles:
  - themable_forms
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
