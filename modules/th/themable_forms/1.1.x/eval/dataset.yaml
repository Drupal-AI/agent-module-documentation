metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: themable_forms
  version: 1.1.x
  note: 'themable_forms is four hooks, no config: hook_form_alter recursively attaches #form_id (e.g.
    node_article_form) to every element; hook_theme_suggestions_form_element adds form_element__type__<type>,
    form_element__form_id__<form_id>, form_element__<form_id>__<type>; hook_theme_suggestions_form_element_label
    adds the form_element_label equivalents; hook_preprocess_form_element copies #form_id/#form_element_type
    onto the label. Everything is observable via drush php:eval by building a node form (entity.form_builder)
    and reading #form_id, or by calling themable_forms_theme_suggestions_form_element($vars) directly.
    Medium/hard cases create a namespaced content type (themf_*) and read the module''s effect back off
    the live form. No dblog, no theme files (default theme is core olivero, not written to).'
questions:
- id: themable-forms-suggestions
  input: What Twig theme suggestions does the themable_forms module add for form elements, and give an
    example template file name I would create to theme every element on a specific form.
  criteria: For the form_element theme hook it adds form_element__type__<type>, form_element__form_id__<form_id>,
    and form_element__<form_id>__<type>. To theme every element on the article node form you add templates/form-element--form-id--node-article-form.html.twig
    (double underscores in the suggestion become -- and underscores become - in the file name).
  bundle: themable_forms
  rubric_ref: rubric/themable_forms_themable_forms_suggestions@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: themable-forms-form-id-attach
  input: How does themable_forms make the form id available on every form element (so the per-form theme
    suggestions work)? Which hook does that and what property does it set?
  criteria: 'themable_forms_form_alter() implements hook_form_alter() and recursively walks the form render
    array, setting $element[''#form_id''] on every child element to the form''s id (e.g. node_article_form).
    The theme-suggestion hooks then read #form_id to build the form_id-based suggestions.'
  bundle: themable_forms
  rubric_ref: rubric/themable_forms_themable_forms_form_id_attach@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: themable-forms-label-hook
  input: Does themable_forms also let me theme form element labels per form, and which theme hook / suggestions
    does it use for that?
  criteria: 'Yes. hook_theme_suggestions_form_element_label() adds suggestions for the form_element_label
    theme hook: form_element_label__type__<type>, form_element_label__form-id__<form_id>, and form_element_label__<form_id>__<type>.
    hook_preprocess_form_element() copies #form_id and #form_element_type onto the label so those suggestions
    have data.'
  bundle: themable_forms
  rubric_ref: rubric/themable_forms_themable_forms_label_hook@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: themable-forms-known-form-id
  input: 'This site has a content type with machine name themf_known. Inspect the live site and state
    the exact #form_id value that themable_forms attaches to the form elements of the themf_known node
    add/edit form.'
  criteria: 'themable_forms attaches #form_id = ''node_themf_known_form'' to every element of that form
    (the form id of the add/edit form for the themf_known content type).'
  bundle: themable_forms
  rubric_ref: rubric/themable_forms_themable_forms_known_form_id@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/themable_forms-known-form-id-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/themable_forms-known-form-id-cleanup.sh
- id: themable-forms-known-suggestion
  input: This site has a test content type whose machine name contains 'themf_disc'. Inspect the live
    site and give the exact form_element theme suggestion (the form-id based one) that themable_forms
    generates for a form element on that content type's add form.
  criteria: 'The suggestion is form_element__form_id__node_themf_disc_form (from themable_forms_theme_suggestions_form_element
    for elements whose #form_id is node_themf_disc_form).'
  bundle: themable_forms
  rubric_ref: rubric/themable_forms_themable_forms_known_suggestion@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/themable_forms-known-suggestion-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/themable_forms-known-suggestion-cleanup.sh
- id: themable-forms-attach-newtype
  input: On this site themable_forms is enabled. Create a content type with machine name themf_task (label
    'THEMF Task'). themable_forms must then attach the form id to the elements of its node add/edit form
