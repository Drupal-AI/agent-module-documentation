rubrics:
- id: theme_switcher_theme_switcher_config_entity
  version: '1.0'
  applicable_bundles:
  - theme_switcher
  checks:
  - kind: must_contain_any
    values:
    - theme_switcher_rule
    - theme_switcher.rule.
  scoring:
    combine: all_pass
- id: theme_switcher_theme_switcher_conditions
  version: '1.0'
  applicable_bundles:
  - theme_switcher
  checks:
  - kind: must_contain_any
    values:
    - condition
    - Condition
    - visibility
    - conjunction
  scoring:
    combine: all_pass
- id: theme_switcher_theme_switcher_order_and_admin
  version: '1.0'
  applicable_bundles:
  - theme_switcher
  checks:
  - kind: must_contain_any
    values:
    - weight
    - first
    - admin route
    - admin_theme
  scoring:
    combine: all_pass
- id: theme_switcher_theme_switcher_known_rule
  version: '1.0'
  applicable_bundles:
  - theme_switcher
  checks:
  - kind: must_contain_any
    values:
    - claro
  scoring:
    combine: all_pass
- id: theme_switcher_theme_switcher_rule_order
  version: '1.0'
  applicable_bundles:
  - theme_switcher
  checks:
  - kind: must_contain_any
    values:
    - olivero
  scoring:
    combine: all_pass
- id: theme_switcher_theme_switcher_create_rule
  version: '1.0'
  applicable_bundles:
  - theme_switcher
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
- id: theme_switcher_theme_switcher_admin_theme
  version: '1.0'
  applicable_bundles:
  - theme_switcher
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
