metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: theme_compiler
  version: 2.0.x
  note: 'Theme Compiler compiles theme-provided assets via a `compiler` plugin (e.g. scss) and serves
    them from dynamically generated routes. Config is a THEME.theme_compiler.yml file (keyed compiler-id
    -> target-path -> {files, options, data}); there is no admin UI, no configure route, no permissions,
    no Drush, no plugins of its own. Routes are named theme_compiler.<sha384-of-uri> -> theme_compiler.controller:serve,
    built by the route callback theme_compiler.route_helper:routes. Compiled bytes live under public://theme-compiler-assets/.
    Recompile triggers: theme install/uninstall, THEME.settings config save/delete (CompileSubscriber
    on ConfigEvents), OnDemandCompileEvent. easy = recipe facts. medium = introspect live wiring (the
    Compiler service class; the compile subscriber''s subscribed config events). hard = the agent adds
    a valid THEME.theme_compiler.yml to a custom theme so a theme_compiler.* route becomes registered
    (grounded in route/registration, NOT live SCSS compilation which needs node-sass). Baseline site has
    ZERO theme_compiler.* routes.'
questions:
- id: theme-compiler-where-declared
  input: Using the Drupal 'theme_compiler' module, how does a theme declare that an SCSS file should be
    compiled and served as CSS? Name the file it uses and the structure of that file (what the keys mean).
  criteria: The theme ships THEME.theme_compiler.yml, keyed by compiler plugin id (e.g. scss), then by
    a theme-relative target path, whose value has a required `files` list (theme-relative sources) plus
    optional `options` and `data`. The module discovers it and builds a route to serve the compiled result.
  bundle: theme_compiler
  rubric_ref: rubric/theme_compiler_theme_compiler_where_declared@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: theme-compiler-triggers
  input: In the Drupal 'theme_compiler' module, what events cause the theme's assets to be (re)compiled?
  criteria: Recompilation happens on theme install/uninstall (hook_themes_installed/uninstalled), when
    a relevant THEME.settings config is saved or deleted (CompileSubscriber on ConfigEvents::SAVE/DELETE),
    and on demand when an OnDemandCompileEvent is dispatched.
  bundle: theme_compiler
  rubric_ref: rubric/theme_compiler_theme_compiler_triggers@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: theme-compiler-storage
  input: Where does the Drupal 'theme_compiler' module store the compiled asset files, and how are they
    served to the browser?
  criteria: Compiled bytes are written into the sandbox public://theme-compiler-assets/<theme>/<path>.
    Each declared target gets a dynamic route (theme_compiler.<hash>) mapped to theme_compiler.controller:serve,
    which returns the file (200/204) or a cacheable 404 if it is not yet generated.
  bundle: theme_compiler
  rubric_ref: rubric/theme_compiler_theme_compiler_storage@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: theme-compiler-service-class
  input: 'On this running Drupal site, inspect the service container: what PHP class backs the theme_compiler.compiler
    service?'
  criteria: theme_compiler.compiler is an instance of Drupal\theme_compiler\Compiler. Discoverable via
    drush php:eval 'echo get_class(\Drupal::service("theme_compiler.compiler"));'.
  bundle: theme_compiler
  rubric_ref: rubric/theme_compiler_theme_compiler_service_class@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/theme_compiler-service-class-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/theme_compiler-service-class-cleanup.sh
- id: theme-compiler-subscribed-events
  input: On this running Drupal site, inspect theme_compiler's event subscriber (service theme_compiler.compile_subscriber).
    Which configuration events does it subscribe to in order to trigger recompilation?
  criteria: CompileSubscriber::getSubscribedEvents() subscribes to ConfigEvents::SAVE ('config.save')
    and ConfigEvents::DELETE ('config.delete') -> onConfigChange, plus OnDemandCompileEvent -> compile.
    Discoverable by calling ::getSubscribedEvents() on the subscriber class.
  bundle: theme_compiler
  rubric_ref: rubric/theme_compiler_theme_compiler_subscribed_events@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/theme_compiler-subscribed-events-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/theme_compiler-subscribed-events-cleanup.sh
- id: theme-compiler-register-route
  input: On this Drupal site, make theme_compiler register a compiled-asset route. Create a small custom
    theme named 'tc_probe' (base theme stark) under web/themes/custom/tc_probe with a real source file
    (e.g. css/src.txt) and a tc_probe.theme_compiler.yml that declares a target using the 'scss' compiler
    and that source file (path resolvable). Install the theme and rebuild so a route named theme_compiler.<hash>
    is registered by the module. Apply this to the live site. (You do NOT need the SCSS to actually compile;
    only the route registration is checked.)
  criteria: A custom theme tc_probe with a valid tc_probe.theme_compiler.yml (files resolvable) is installed;
    the router now contains at least one route whose name starts with 'theme_compiler.' (built by theme_compiler.route_helper:routes).
  bundle: theme_compiler
  rubric_ref: rubric/theme_compiler_theme_compiler_register_route@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/theme_compiler-register-route-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/theme_compiler-register-route-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/theme_compiler-register-route-verify.sh
