rubrics:
- id: theme_compiler_theme_compiler_where_declared
  version: '1.0'
  applicable_bundles:
  - theme_compiler
  checks:
  - kind: must_contain_any
    values:
    - theme_compiler.yml
    - files
  scoring:
    combine: all_pass
- id: theme_compiler_theme_compiler_triggers
  version: '1.0'
  applicable_bundles:
  - theme_compiler
  checks:
  - kind: must_contain_any
    values:
    - themes_installed
    - OnDemandCompileEvent
    - settings
    - ConfigEvents
  scoring:
    combine: all_pass
- id: theme_compiler_theme_compiler_storage
  version: '1.0'
  applicable_bundles:
  - theme_compiler
  checks:
  - kind: must_contain_any
    values:
    - theme-compiler-assets
    - public://
    - serve
  scoring:
    combine: all_pass
- id: theme_compiler_theme_compiler_service_class
  version: '1.0'
  applicable_bundles:
  - theme_compiler
  checks:
  - kind: must_contain_any
    values:
    - Drupal\theme_compiler\Compiler
    - theme_compiler\Compiler
  scoring:
    combine: all_pass
- id: theme_compiler_theme_compiler_subscribed_events
  version: '1.0'
  applicable_bundles:
  - theme_compiler
  checks:
  - kind: must_contain_any
    values:
    - config.save
    - config.delete
    - ConfigEvents
  scoring:
    combine: all_pass
- id: theme_compiler_theme_compiler_register_route
  version: '1.0'
  applicable_bundles:
  - theme_compiler
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
