metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: theme_permission
  version: 2.0.x
  note: 'theme_permission replaces core''s single ''administer themes'' permission with per-theme dynamic
    permissions generated by ThemePerm::dynamicPermissions() for every installed theme: ''administer themes
    <theme>'', ''uninstall themes <theme>'', plus one ''Edit Administration theme''. A RouteSubscriber
    overrides system.themes_page with AccessController::themesPage (lists only manageable themes) and
    adds _custom_access (AccessController::access, keyed on the theme query arg) to theme install/uninstall/set-default/settings/block
    routes. No config form (configure=system.themes_page); permissions are assigned at /admin/people/permissions.
    On this site the installed themes are olivero and claro, so the machine names include ''administer
    themes olivero'' and ''administer themes claro''. Medium/hard cases use a namespaced role (tp_viewer/tp_task)
    and read/write those permission strings on the live role config.'
questions:
- id: theme_permission-what-perms
  input: What permissions does the Drupal theme_permission module add, and how are they named for each
    theme?
  criteria: For every installed theme it generates 'administer themes <theme>' and 'uninstall themes <theme>'
    (e.g. 'administer themes olivero'), plus a single 'Edit Administration theme' permission. They are
    produced dynamically by ThemePerm::dynamicPermissions().
  bundle: theme_permission
  rubric_ref: rubric/theme_permission_theme_permission_what_perms@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: theme_permission-goal
  input: I want to let a role manage only one specific theme on the Appearance page, without giving them
    core's all-powerful 'administer themes' permission. How does the theme_permission module make that
    possible?
  criteria: It provides per-theme permissions ('administer themes <theme>'). Grant the role only 'administer
    themes <thattheme>'; a route subscriber overrides the Appearance page and adds custom access so the
    user can only see/manage themes they hold the matching permission for.
  bundle: theme_permission
  rubric_ref: rubric/theme_permission_theme_permission_goal@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: theme_permission-where-assign
  input: Where do you assign the theme_permission per-theme permissions, and does the module have its
    own configuration page?
  criteria: There is no dedicated config form; its configure route is core's system.themes_page (/admin/appearance).
    You assign the generated permissions on the normal permissions page at /admin/people/permissions.
  bundle: theme_permission
  rubric_ref: rubric/theme_permission_theme_permission_where_assign@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: theme_permission-which-theme
  input: On this Drupal site there is a role named tp_viewer that, via the theme_permission module, is
    allowed to administer exactly one theme. Inspect the live role configuration and state which theme
    it may administer.
  criteria: Role tp_viewer holds the permission 'administer themes olivero' (inspect user.role.tp_viewer
    permissions, or Role::load('tp_viewer')->getPermissions()).
  bundle: theme_permission
  rubric_ref: rubric/theme_permission_theme_permission_which_theme@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/theme_permission-role-perm-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/theme_permission-role-perm-cleanup.sh
- id: theme_permission-grant-theme
  input: On this Drupal site there is a role tp_task. Using the theme_permission module, grant that role
    permission to administer the Claro theme (and only Claro). Apply the change to the live site.
  criteria: Grant the theme_permission dynamic permission 'administer themes claro' to role tp_task (e.g.
    drush role:perm:add tp_task 'administer themes claro', or Role::load('tp_task')->grantPermission('administer
    themes claro')->save()). Verified against the live role.
  bundle: theme_permission
  rubric_ref: rubric/theme_permission_theme_permission_grant_theme@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/theme_permission-grant-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/theme_permission-grant-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/theme_permission-grant-verify.sh
- id: theme_permission-which-uninstall
  input: On this Drupal site there is a role named tp_uviewer that, via the theme_permission module, is
    allowed to uninstall exactly one theme. Inspect the live role configuration and state which theme
    it may uninstall.
  criteria: Role tp_uviewer holds the permission 'uninstall themes claro' (inspect user.role.tp_uviewer
    permissions, or Role::load('tp_uviewer')->getPermissions()).
  bundle: theme_permission
  rubric_ref: rubric/theme_permission_theme_permission_which_uninstall@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/theme_permission-uninstall-perm-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/theme_permission-uninstall-perm-cleanup.sh
- id: theme_permission-grant-uninstall
  input: On this Drupal site there is a role tp_utask. Using the theme_permission module, grant that role
    permission to uninstall the Olivero theme. Apply the change to the live site.
  criteria: Grant the theme_permission dynamic permission 'uninstall themes olivero' to role tp_utask
    (e.g. Role::load('tp_utask')->grantPermission('uninstall themes olivero')->save()). Verified against
    the live role.
  bundle: theme_permission
  rubric_ref: rubric/theme_permission_theme_permission_grant_uninstall@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
