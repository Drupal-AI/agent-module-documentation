metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: twig_tweak
  version: 3.4.x
  note: Twig Tweak is a passive Twig extension (no config UI, no permissions, no schema); it just registers
    ~20 Twig functions and ~18 filters. All cases are `recipe` (response-graded) probing the exact function/filter
    names and what each renders.
questions:
- id: twigtweak-embed-view
  input: In a Drupal 11 Twig template, embed the 'who_s_new' view's 'block_1' display directly from the
    template using Twig Tweak. Show the exact Twig code.
  criteria: '{{ drupal_view(''who_s_new'', ''block_1'') }} — the drupal_view() function (alias of views_embed_view)
    embeds a view display; extra args map to contextual filters.'
  bundle: twig_tweak
  rubric_ref: rubric/twig_tweak_twigtweak_embed_view@1.0
  tags:
  - mode:recipe
- id: twigtweak-render-field
  input: Using Twig Tweak, render only the `field_image` field of node 1 in the 'teaser' view mode from
    a Twig template. Which function and argument order?
  criteria: '{{ drupal_field(''field_image'', ''node'', 1, ''teaser'') }} — drupal_field(field_name, entity_type,
    id, view_mode) renders a single field of an entity.'
  bundle: twig_tweak
  rubric_ref: rubric/twig_tweak_twigtweak_render_field@1.0
  tags:
  - mode:recipe
- id: twigtweak-render-entity
  input: In a Twig template on a Drupal site, render node 123 in its 'teaser' view mode using Twig Tweak.
    Give the function call.
  criteria: '{{ drupal_entity(''node'', 123, ''teaser'') }} — drupal_entity(entity_type, selector, view_mode)
    renders an entity by ID or UUID.'
  bundle: twig_tweak
  rubric_ref: rubric/twig_tweak_twigtweak_render_entity@1.0
  tags:
  - mode:recipe
- id: twigtweak-image-style-filter
  input: In Twig on a Drupal 11 site, I have an image file URI 'public://images/ocean.jpg' and want the
    URL of its 'thumbnail' image-style derivative. Which Twig Tweak filter do I use?
  criteria: '{{ ''public://images/ocean.jpg''|image_style(''thumbnail'') }} — the image_style filter turns
    an image URI into an image-style derivative URL.'
  bundle: twig_tweak
  rubric_ref: rubric/twig_tweak_twigtweak_image_style_filter@1.0
  tags:
  - mode:recipe
- id: twigtweak-token-replace-filter
  input: In a Twig template I have the string '<h1>[site:name]</h1>' and want Drupal to replace the tokens
    in it. Which Twig Tweak filter does this?
  criteria: 'The token_replace filter: {{ ''<h1>[site:name]</h1>''|token_replace }} (also usable as {%
    apply token_replace %}…{% endapply %}).'
  bundle: twig_tweak
  rubric_ref: rubric/twig_tweak_twigtweak_token_replace_filter@1.0
  tags:
  - mode:recipe
- id: twigtweak-render-block
  input: Render the 'system_branding_block' block plugin inline in a Twig template using Twig Tweak, passing
    a config override for its label. Show the code.
  criteria: '{{ drupal_block(''system_branding_block'', {label: ''Branding''}) }} — drupal_block(id, config,
    wrapper) renders a block plugin with optional config overrides.'
  bundle: twig_tweak
  rubric_ref: rubric/twig_tweak_twigtweak_render_block@1.0
  tags:
  - mode:recipe
- id: twigtweak-enable-php-filter
  input: Twig Tweak's `php` filter for evaluating PHP inside a template isn't working on my Drupal site.
    How do I enable it, and where?
  criteria: The php filter is disabled by default; enable it in settings.php with $settings['twig_tweak_enable_php_filter']
    = TRUE; (discouraged).
  bundle: twig_tweak
  rubric_ref: rubric/twig_tweak_twigtweak_enable_php_filter@1.0
  tags:
  - mode:recipe
- id: twigtweak-add-custom-function
  input: I want to register my own custom Twig function so it's available in templates via Twig Tweak.
    Which hook do I implement in my .module file?
  criteria: Implement hook_twig_tweak_functions_alter(array &$functions) and append a new \Twig\TwigFunction
    to the array (filters use hook_twig_tweak_filters_alter, tests use hook_twig_tweak_tests_alter).
  bundle: twig_tweak
  rubric_ref: rubric/twig_tweak_twigtweak_add_custom_function@1.0
  tags:
  - mode:recipe
