rubrics:
- id: twig_tools_twig_tools_what_filters
  version: '1.0'
  applicable_bundles:
  - twig_tools
  checks:
  - kind: must_contain_any
    values:
    - filter
    - sanitize
    - convert
    - color
    - class
  scoring:
    combine: all_pass
- id: twig_tools_twig_tools_color_filter
  version: '1.0'
  applicable_bundles:
  - twig_tools
  checks:
  - kind: must_contain_any
    values:
    - hex_to_css_rgb
    - rgb(
    - rgb(51, 102, 204)
  scoring:
    combine: all_pass
- id: twig_tools_twig_tools_scrub_class
  version: '1.0'
  applicable_bundles:
  - twig_tools
  checks:
  - kind: must_contain_any
    values:
    - clean
    - valid
    - empty
    - duplicate
    - unique
    - Html::getClass
  scoring:
    combine: all_pass
- id: twig_tools_twig_tools_filter_registered
  version: '1.0'
  applicable_bundles:
  - twig_tools
  checks:
  - kind: must_contain_any
    values:
    - hex_to_css_rgb
  scoring:
    combine: all_pass
- id: twig_tools_twig_tools_sanitize_filter
  version: '1.0'
  applicable_bundles:
  - twig_tools
  checks:
  - kind: must_contain_any
    values:
    - scrub_class_array
  scoring:
    combine: all_pass
- id: twig_tools_twig_tools_install
  version: '1.0'
  applicable_bundles:
  - twig_tools
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
- id: twig_tools_twig_tools_render_color
  version: '1.0'
  applicable_bundles:
  - twig_tools
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
