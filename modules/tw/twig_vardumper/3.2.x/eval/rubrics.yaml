rubrics:
- id: twig_vardumper_twig_vardumper_functions_added
  version: '1.0'
  applicable_bundles:
  - twig_vardumper
  checks:
  - kind: must_contain_any
    values:
    - vardumper
  - kind: must_not_contain
    values:
    - admin/config
  scoring:
    combine: all_pass
- id: twig_vardumper_twig_vardumper_needs_debug
  version: '1.0'
  applicable_bundles:
  - twig_vardumper
  checks:
  - kind: must_contain_any
    values:
    - debug
    - twig debug
    - Twig debug
  scoring:
    combine: all_pass
- id: twig_vardumper_twig_vardumper_dependency
  version: '1.0'
  applicable_bundles:
  - twig_vardumper
  checks:
  - kind: must_contain_any
    values:
    - symfony/var-dumper
    - var-dumper
    - VarDumper
  scoring:
    combine: all_pass
- id: twig_vardumper_twig_vardumper_functions_live
  version: '1.0'
  applicable_bundles:
  - twig_vardumper
  checks:
  - kind: must_contain_any
    values:
    - vardumper
  scoring:
    combine: all_pass
- id: twig_vardumper_twig_vardumper_extension_class
  version: '1.0'
  applicable_bundles:
  - twig_vardumper
  checks:
  - kind: must_contain_any
    values:
    - Drupal\twig_vardumper\TwigExtension
    - twig_vardumper\TwigExtension
  scoring:
    combine: all_pass
- id: twig_vardumper_twig_vardumper_dump_scalar
  version: '1.0'
  applicable_bundles:
  - twig_vardumper
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
- id: twig_vardumper_twig_vardumper_vardumper_array
  version: '1.0'
  applicable_bundles:
  - twig_vardumper
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
