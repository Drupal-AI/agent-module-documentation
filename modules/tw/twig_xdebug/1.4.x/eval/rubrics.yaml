rubrics:
- id: twig_xdebug_twig_xdebug_how_to_breakpoint
  version: '1.0'
  applicable_bundles:
  - twig_xdebug
  checks:
  - kind: must_contain_any
    values:
    - breakpoint()
    - '{{ breakpoint'
    - xdebug_break
  scoring:
    combine: all_pass
- id: twig_xdebug_twig_xdebug_library_dep
  version: '1.0'
  applicable_bundles:
  - twig_xdebug
  checks:
  - kind: must_contain_any
    values:
    - ajgl/breakpoint-twig-extension
    - BreakpointExtension
    - twig.extension
  scoring:
    combine: all_pass
- id: twig_xdebug_twig_xdebug_inspect_argument
  version: '1.0'
  applicable_bundles:
  - twig_xdebug
  checks:
  - kind: must_contain_any
    values:
    - breakpoint(
    - $arguments
    - $context
  scoring:
    combine: all_pass
- id: twig_xdebug_twig_xdebug_inspect_var
  version: '1.0'
  applicable_bundles:
  - twig_xdebug
  checks:
  - kind: must_contain_any
    values:
    - items
  scoring:
    combine: all_pass
- id: twig_xdebug_twig_xdebug_inspect_expr
  version: '1.0'
  applicable_bundles:
  - twig_xdebug
  checks:
  - kind: must_contain_any
    values:
    - node.field_body
    - node.field_body.value
  scoring:
    combine: all_pass
- id: twig_xdebug_twig_xdebug_breakpoint_node
  version: '1.0'
  applicable_bundles:
  - twig_xdebug
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
- id: twig_xdebug_twig_xdebug_breakpoint_plain
  version: '1.0'
  applicable_bundles:
  - twig_xdebug
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
