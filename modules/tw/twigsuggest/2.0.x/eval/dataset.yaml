metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: twigsuggest
  version: 2.0.x
  note: 'Twig Template Suggester adds the theme/template suggestions core omits via hook_theme_suggestions_HOOK[_alter]()
    (block-per-region, page/html-per-node-type, user-per-role, field-per-view-mode, form/container/menu/taxonomy
    templates, etc.), plus a global preprocess that adds a base_path variable. No admin UI, no configure
    route, no permissions, no config schema, no Drush. Its only knob is twigsuggest.settings:alternate_ds_suggestions
    (a boolean, normally set in settings.php) gating an optional Display Suite layout-suggestion fix;
    no config/install ships so the object is absent until set. Installs at weight 100 (in core.extension).
    Service twigsuggest.helper_functions::getCurrentNode() backs the node-type suggestions. Since the
    suggestions are automatic and only render inside a themed request (fragile on this shared site), medium/hard
    cases are grounded in reliably-inspectable live state: the alternate_ds_suggestions config flag and
    the module''s install weight; execution toggles the flag, verified against live config.'
questions:
- id: twigsuggest-what
  input: What does the twigsuggest module add, and how would I use it to give the Article content type
    its own page template?
  criteria: It adds the theme/template suggestions core omits. For pages per node type it adds page__node__<type>,
    so create page--node--article.html.twig in your theme's templates directory (and rebuild caches).
  bundle: twigsuggest
  rubric_ref: rubric/twigsuggest_twigsuggest_what@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: twigsuggest-block-region
  input: Using twigsuggest, what template file would I create to theme all blocks in a specific region,
    and to theme one block in that region?
  criteria: twigsuggest adds block__<region> and block__<region>__<block_id> (plus block__bundle__<bundle>
    for content blocks). So block--<region>.html.twig themes all blocks in a region and block--<region>--<block-id>.html.twig
    themes one.
  bundle: twigsuggest
  rubric_ref: rubric/twigsuggest_twigsuggest_block_region@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: twigsuggest-base-path
  input: twigsuggest exposes an extra variable to every template. What is it and what is it for?
  criteria: Its global twigsuggest_preprocess() adds a base_path variable to every template, so you can
    build root-relative asset URLs like {{ base_path ~ directory }}/images/icon.svg.
  bundle: twigsuggest
  rubric_ref: rubric/twigsuggest_twigsuggest_base_path@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: twigsuggest-read-ds
  input: On this site twigsuggest is configured. Inspect the live twigsuggest settings and state whether
    the optional Display Suite alternate layout suggestions are enabled.
  criteria: twigsuggest.settings:alternate_ds_suggestions is true, so the Display Suite layout-suggestion
    rewrite in twigsuggest_theme_suggestions_layout_alter() is active.
  bundle: twigsuggest
  rubric_ref: rubric/twigsuggest_twigsuggest_read_ds@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/twigsuggest-ds-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/twigsuggest-ds-cleanup.sh
- id: twigsuggest-read-weight
  input: twigsuggest installs itself with a specific module weight so its template suggestions win over
    other modules'. Inspect the live site and state twigsuggest's module weight.
  criteria: twigsuggest's install weight is 100 (core.extension module.twigsuggest = 100), set by twigsuggest_install()
    so its hook_theme_suggestions_* run late.
  bundle: twigsuggest
  rubric_ref: rubric/twigsuggest_twigsuggest_read_weight@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/twigsuggest-weight-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/twigsuggest-weight-cleanup.sh
- id: twigsuggest-enable-ds
  input: Enable twigsuggest's optional Display Suite alternate layout suggestions (the alternate_ds_suggestions
    flag) on this site. Apply the change to the live configuration.
  criteria: twigsuggest.settings:alternate_ds_suggestions is set TRUE (e.g. drush cset twigsuggest.settings
    alternate_ds_suggestions 1, or the settings.php override).
  bundle: twigsuggest
  rubric_ref: rubric/twigsuggest_twigsuggest_enable_ds@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/twigsuggest-enable-ds-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/twigsuggest-enable-ds-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/twigsuggest-enable-ds-verify.sh
- id: twigsuggest-disable-ds
  input: twigsuggest's alternate Display Suite layout suggestions are currently enabled on this site.
    Turn them off. Apply the change to the live configuration.
  criteria: twigsuggest.settings:alternate_ds_suggestions is set FALSE (or unset), disabling the layout-suggestion
    rewrite.
  bundle: twigsuggest
  rubric_ref: rubric/twigsuggest_twigsuggest_disable_ds@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/twigsuggest-disable-ds-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/twigsuggest-disable-ds-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/twigsuggest-disable-ds-verify.sh
