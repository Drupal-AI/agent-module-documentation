metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: twig_remove_html_comments
  version: 1.0.x
  note: 'twig_remove_html_comments is a stateless, config-free module: one Twig extension service (twig_remove_html_comments.remove_html_comments,
    tagged twig.extension) exposing two filters - remove_html_comments (returns render array [''#markup''=>...])
    and remove_html_comments_as_string (returns string). Both apply preg_replace(''/<!--(.|\s)*?-->\s*|\r|\n/'','''',$s),
    so they strip HTML comments (incl. multi-line) AND every \r/\n newline. Because it has no DB/config
    state, medium introspection is grounded in what is discoverable on the LIVE site (the registered service
    id + filter names) and in running the actual filter over a known sample string placed in Drupal State;
    hard execution has the agent run the module''s filter over an input string in State and write the
    cleaned result to an output State key, verified live (comment removed, kept text present, newlines
    stripped). State keys are namespaced with the module name.'
questions:
- id: twig_remove_html_comments-filter-names
  input: Which Twig filters does the twig_remove_html_comments module add, and how do I use one to print
    a node body field with its HTML comments removed?
  criteria: 'Two filters: remove_html_comments (returns a render array [''#markup''=>...]) and remove_html_comments_as_string
    (returns a string). Usage: {{ content.body|render|remove_html_comments }} — pipe through |render first
    so the filter receives a string.'
  bundle: twig_remove_html_comments
  rubric_ref: rubric/twig_remove_html_comments_twig_remove_html_comments_filter_names@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: twig_remove_html_comments-string-vs-array
  input: In twig_remove_html_comments, what is the difference between the remove_html_comments and remove_html_comments_as_string
    filters — what does each return?
  criteria: remove_html_comments returns a render array ['#markup' => <cleaned>] (convenient to print
    directly); remove_html_comments_as_string returns the cleaned value as a plain PHP string (handy to
    reuse in another expression). NULL input yields '' (or ['#markup' => '']).
  bundle: twig_remove_html_comments
  rubric_ref: rubric/twig_remove_html_comments_twig_remove_html_comments_string_vs_array@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: twig_remove_html_comments-side-effect
  input: Besides HTML comments, does the twig_remove_html_comments filter strip anything else from the
    string? Explain based on the regular expression it uses.
  criteria: Yes. The filter runs preg_replace('/<!--(.|\s)*?-->\s*|\r|\n/', '', $string), which removes
    HTML comments (including multi-line) plus whitespace right after a comment, and ALSO removes every
    carriage-return (\r) and newline (\n) in the string, collapsing the output onto one line.
  bundle: twig_remove_html_comments
  rubric_ref: rubric/twig_remove_html_comments_twig_remove_html_comments_side_effect@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: twig_remove_html_comments-discover-service
  input: On this running Drupal site, inspect the service that twig_remove_html_comments registers as
    a Twig extension. What is its service id and which Twig filter names does it expose?
  criteria: Service id twig_remove_html_comments.remove_html_comments (class RemoveHtmlComments, tagged
    twig.extension). Calling getFilters() on it returns the filters remove_html_comments and remove_html_comments_as_string.
    Discoverable via `drush php:eval` on \Drupal::service('twig_remove_html_comments.remove_html_comments').
  bundle: twig_remove_html_comments
  rubric_ref: rubric/twig_remove_html_comments_twig_remove_html_comments_discover_service@1.0
  tags:
  - mode:introspection
  - difficulty:medium
