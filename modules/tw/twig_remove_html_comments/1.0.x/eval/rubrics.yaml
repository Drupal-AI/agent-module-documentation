rubrics:
- id: twig_remove_html_comments_twig_remove_html_comments_filter_names
  version: '1.0'
  applicable_bundles:
  - twig_remove_html_comments
  checks:
  - kind: must_contain_any
    values:
    - remove_html_comments
    - remove_html_comments_as_string
  scoring:
    combine: all_pass
- id: twig_remove_html_comments_twig_remove_html_comments_string_vs_array
  version: '1.0'
  applicable_bundles:
  - twig_remove_html_comments
  checks:
  - kind: must_contain_any
    values:
    - remove_html_comments_as_string
    - '#markup'
    - string
    - render array
  scoring:
    combine: all_pass
- id: twig_remove_html_comments_twig_remove_html_comments_side_effect
  version: '1.0'
  applicable_bundles:
  - twig_remove_html_comments
  checks:
  - kind: must_contain_any
    values:
    - newline
    - new line
    - line break
    - \r
    - \n
    - carriage
  scoring:
    combine: all_pass
- id: twig_remove_html_comments_twig_remove_html_comments_discover_service
  version: '1.0'
  applicable_bundles:
  - twig_remove_html_comments
  checks:
  - kind: must_contain_any
    values:
    - twig_remove_html_comments.remove_html_comments
    - remove_html_comments_as_string
  scoring:
    combine: all_pass
- id: twig_remove_html_comments_twig_remove_html_comments_apply_to_sample
  version: '1.0'
  applicable_bundles:
  - twig_remove_html_comments
  checks:
  - kind: must_contain_any
    values:
    - '<h2>Report</h2><p>Total sales: 42</p>'
    - 'Total sales: 42'
  - kind: must_not_contain
    values:
    - 'internal: draft'
  scoring:
    combine: all_pass
- id: twig_remove_html_comments_twig_remove_html_comments_clean_string
  version: '1.0'
  applicable_bundles:
  - twig_remove_html_comments
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
- id: twig_remove_html_comments_twig_remove_html_comments_strip_newlines
  version: '1.0'
  applicable_bundles:
  - twig_remove_html_comments
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
