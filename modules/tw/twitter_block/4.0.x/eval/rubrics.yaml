rubrics:
- id: twitter_block_tb_plugin_id
  version: '1.0'
  applicable_bundles:
  - twitter_block
  checks:
  - kind: must_contain_any
    values:
    - twitter_block
  scoring:
    combine: all_pass
- id: twitter_block_tb_no_settings_page
  version: '1.0'
  applicable_bundles:
  - twitter_block
  checks:
  - kind: must_contain_any
    values:
    - Block layout
    - /admin/structure/block
    - administer blocks
    - no settings page
  - kind: must_not_contain
    values:
    - /admin/config/twitter_block
  scoring:
    combine: all_pass
- id: twitter_block_tb_settings_keys
  version: '1.0'
  applicable_bundles:
  - twitter_block
  checks:
  - kind: must_contain_any
    values:
    - username
    - theme
    - tweet_limit
    - chrome
    - link_color
  scoring:
    combine: all_pass
- id: twitter_block_tb_widget_types
  version: '1.0'
  applicable_bundles:
  - twitter_block
  checks:
  - kind: must_contain_any
    values:
    - select
    - checkboxes
    - checkbox
  scoring:
    combine: all_pass
- id: twitter_block_tb_theme_options
  version: '1.0'
  applicable_bundles:
  - twitter_block
  checks:
  - kind: must_contain_any
    values:
    - dark
  scoring:
    combine: all_pass
- id: twitter_block_tb_intro_username
  version: '1.0'
  applicable_bundles:
  - twitter_block
  checks:
  - kind: must_contain_any
    values:
    - drupalorg
  scoring:
    combine: all_pass
- id: twitter_block_tb_intro_theme
  version: '1.0'
  applicable_bundles:
  - twitter_block
  checks:
  - kind: must_contain_any
    values:
    - dark
  scoring:
    combine: all_pass
- id: twitter_block_tb_intro_tweet_limit
  version: '1.0'
  applicable_bundles:
  - twitter_block
  checks:
  - kind: must_contain_any
    values:
    - '7'
    - seven
  scoring:
    combine: all_pass
- id: twitter_block_tb_place_dark_timeline
  version: '1.0'
  applicable_bundles:
  - twitter_block
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
- id: twitter_block_tb_place_chrome_timeline
  version: '1.0'
  applicable_bundles:
  - twitter_block
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
