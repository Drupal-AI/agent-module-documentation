# Generated from evals.json by evaluation/to_commons.py.
# Edit evals.json and rerun the script; do not edit this file.
metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: twitter_block
  version: 4.0.x
  note: 'Twitter Block ships a single core Block plugin (id twitter_block) that embeds a Twitter/X timeline;
    there is no settings page, so all config lives per block instance in the `block` config entity under
    `settings`. Cases are tiered: easy=recipe (response-graded facts about the plugin id, its settings
    keys, and widget types), medium=introspection (a setup script places a known twitter_block instance,
    the agent inspects live via drush, cleanup removes it), hard=execution (the agent places a twitter_block
    block with specific settings, verified against the live block config entity).'
questions:
- id: tb-plugin-id
  input: On a Drupal 11 site with Twitter Block enabled, what is the machine id of the block plugin it
    provides, and under which block category does it appear when placing a block?
  criteria: The module provides one core Block plugin with id `twitter_block` (admin label "Twitter block");
    it appears under the "Twitter" category on the Place block dialog.
  bundle: twitter_block
  rubric_ref: rubric/twitter_block_tb_plugin_id@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: tb-no-settings-page
  input: Where do I configure Twitter Block? Is there a dedicated admin settings page, and what permission
    is needed?
  criteria: There is no dedicated settings page (configure route is null); you place and configure each
    instance on Structure > Block layout (/admin/structure/block), gated by core's `administer blocks`
    permission.
  bundle: twitter_block
  rubric_ref: rubric/twitter_block_tb_no_settings_page@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: tb-settings-keys
  input: List the main configurable settings of a Twitter Block block instance and which is required.
  criteria: Per-instance settings include username (required), theme, link_color, border_color, chrome,
    related, tweet_limit, dnt, width, height, language, and polite. `username` is the only required field.
  bundle: twitter_block
  rubric_ref: rubric/twitter_block_tb_settings_keys@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: tb-widget-types
  input: In the Twitter Block configuration form, what form widget types (#type) are used for the theme,
    tweet limit, chrome, and disable-tracking (dnt) settings?
  criteria: theme and tweet_limit are `select` elements, chrome is a `checkboxes` element (noheader/nofooter/noborders/noscrollbar/transparent),
    and dnt is a single `checkbox`.
  bundle: twitter_block
  rubric_ref: rubric/twitter_block_tb_widget_types@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: tb-theme-options
  input: What theme options does a Twitter Block timeline support, and what config value selects the dark
    theme?
  criteria: 'The `theme` select has two options: Default (empty string '''') and Dark; set the `theme`
    setting to `dark` for the dark widget theme.'
  bundle: twitter_block
  rubric_ref: rubric/twitter_block_tb_theme_options@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: tb-intro-username
  input: 'A Twitter Block block instance with machine id `eval_twtr_intro` is already placed on this Drupal
    site (drush available). Inspect the running site and tell me: which Twitter/X username does its timeline
    display?'
  criteria: The block `eval_twtr_intro` has settings.username = drupalorg.
  bundle: twitter_block
  rubric_ref: rubric/twitter_block_tb_intro_username@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    persona: drupal-expert
    setup: agent-module-documentation/evaluation/verify/twitter_block-configured-timeline-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/twitter_block-configured-timeline-cleanup.sh
- id: tb-intro-theme
  input: 'A Twitter Block block instance with machine id `eval_twtr_intro` is already placed on this Drupal
    site (drush available). Inspect the running site and tell me: which widget theme is its timeline configured
    to use?'
  criteria: The block `eval_twtr_intro` has settings.theme = dark.
  bundle: twitter_block
  rubric_ref: rubric/twitter_block_tb_intro_theme@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    persona: drupal-expert
    setup: agent-module-documentation/evaluation/verify/twitter_block-configured-timeline-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/twitter_block-configured-timeline-cleanup.sh
- id: tb-intro-tweet-limit
  input: 'A Twitter Block block instance with machine id `eval_twtr_intro` is already placed on this Drupal
    site (drush available). Inspect the running site and tell me: how many tweets is its timeline limited
    to (the configured tweet limit)?'
  criteria: The block `eval_twtr_intro` has settings.tweet_limit = 7.
  bundle: twitter_block
  rubric_ref: rubric/twitter_block_tb_intro_tweet_limit@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    persona: drupal-expert
    setup: agent-module-documentation/evaluation/verify/twitter_block-configured-timeline-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/twitter_block-configured-timeline-cleanup.sh
- id: tb-place-dark-timeline
  input: On this Drupal site (drush available), place a Twitter Block block that embeds the timeline of
    the `@drupal` account, using the dark widget theme and limited to 5 tweets. Apply it to the live site
    so the block instance really exists (any region/theme is fine); don't just describe it. One-line summary.
  criteria: A block config entity using the twitter_block plugin exists with settings username=drupal,
    theme=dark, tweet_limit=5. Verified against live site state.
  bundle: twitter_block
  rubric_ref: rubric/twitter_block_tb_place_dark_timeline@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/twitter_block-place-dark-timeline-reset.sh
    verify: agent-module-documentation/evaluation/verify/twitter_block-place-dark-timeline-verify.sh
- id: tb-place-chrome-timeline
  input: On this Drupal site (drush available), place a Twitter Block block that embeds the `@wikipedia`
    timeline using the default (light) widget theme, with the widget header and footer hidden (the noheader
    and nofooter chrome options enabled). Apply it to the live site so the block instance really exists;
    don't just describe it. One-line summary.
  criteria: A block config entity using the twitter_block plugin exists with settings username=wikipedia,
    default theme, and chrome noheader+nofooter enabled. Verified against live site state.
  bundle: twitter_block
  rubric_ref: rubric/twitter_block_tb_place_chrome_timeline@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/twitter_block-place-chrome-timeline-reset.sh
    verify: agent-module-documentation/evaluation/verify/twitter_block-place-chrome-timeline-verify.sh
