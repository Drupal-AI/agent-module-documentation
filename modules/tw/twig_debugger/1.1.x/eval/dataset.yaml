metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: twig_debugger
  version: 1.1.x
  note: Twig Debugger is a single-checkbox module. Its settings form (route twig_debugger.settings at
    /admin/config/development/twig-debugger, permission 'administer twig debugger configuration') stores
    one flag, twig_debugger.settings:enabled. Saving with the box on also writes sites/default/services.yml
    (twig.config debug:true, auto_reload:true, cache:false) and clears caches; off deletes that file.
    The config object does NOT exist until the form is first saved. To keep the SHARED site stable, every
    medium/hard case here is grounded ONLY in the module's persistent Drupal config flag (twig_debugger.settings:enabled)
    and never touches services.yml. Scripts use the config factory directly, matching the module's own
    ConfigFormBase behaviour for the flag.
questions:
- id: twig_debugger-how-enable
  input: I installed the Drupal contrib module twig_debugger. Where in the admin UI do I turn Twig debugging
    on, and what permission gates that page?
  criteria: Go to Configuration > Development > Twig Debugger (/admin/config/development/twig-debugger,
    route twig_debugger.settings), tick 'Enable Twig Debugging' and save. The page requires the 'administer
    twig debugger configuration' permission.
  bundle: twig_debugger
  rubric_ref: rubric/twig_debugger_twig_debugger_how_enable@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: twig_debugger-what-it-writes
  input: When I enable twig_debugger, which file does it change and what does it set in it to make Drupal
    show template debug comments?
  criteria: 'Saving with the box on writes sites/default/services.yml (copied from default.services.yml
    if absent) and sets the twig.config block to debug: true, auto_reload: true, cache: false, then flushes
    caches. Disabling deletes sites/default/services.yml.'
  bundle: twig_debugger
  rubric_ref: rubric/twig_debugger_twig_debugger_what_it_writes@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: twig_debugger-config-key
  input: In the twig_debugger module, what is the config object and key that records whether Twig debugging
    is turned on, and what does an unset value mean?
  criteria: The flag is twig_debugger.settings:enabled (1 = on). The config object does not exist until
    the settings form is first saved, so a missing/NULL value means it has never been enabled (off).
  bundle: twig_debugger
  rubric_ref: rubric/twig_debugger_twig_debugger_config_key@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: twig_debugger-is-enabled
  input: On this Drupal site, has Twig debugging been turned on through the twig_debugger module? Inspect
    the live configuration and state the value of the module's enabled flag.
  criteria: Yes - twig_debugger.settings:enabled is 1 (Twig debugging is enabled) in the live config.
  bundle: twig_debugger
  rubric_ref: rubric/twig_debugger_twig_debugger_is_enabled@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/twig_debugger-enabled-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/twig_debugger-enabled-cleanup.sh
- id: twig_debugger-is-disabled
  input: A colleague thinks Twig debugging is on for this site via the twig_debugger module. Check the
    module's live configuration and report whether its enabled flag is on or off.
  criteria: It is off - twig_debugger.settings:enabled is 0 in the live config, so Twig debugging is disabled.
  bundle: twig_debugger
  rubric_ref: rubric/twig_debugger_twig_debugger_is_disabled@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/twig_debugger-disabled-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/twig_debugger-disabled-cleanup.sh
- id: twig_debugger-enable-flag
  input: 'On this Drupal site, use the twig_debugger module to turn Twig debugging on: set the module''s
    enabled configuration flag to on and apply it to the live site.'
  criteria: twig_debugger.settings:enabled is set to 1 in the live config (e.g. via the settings form
    or \Drupal::configFactory()->getEditable('twig_debugger.settings')->set('enabled', 1)->save()).
  bundle: twig_debugger
  rubric_ref: rubric/twig_debugger_twig_debugger_enable_flag@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/twig_debugger-enable-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/twig_debugger-enable-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/twig_debugger-enable-verify.sh
- id: twig_debugger-disable-flag
  input: Twig debugging is currently enabled on this site via twig_debugger. Turn it off by setting the
    module's enabled configuration flag to off, and apply the change to the live site.
  criteria: twig_debugger.settings:enabled is set to 0 (or the config removed) in the live config so Twig
    debugging is off.
  bundle: twig_debugger
  rubric_ref: rubric/twig_debugger_twig_debugger_disable_flag@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/twig_debugger-disable-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/twig_debugger-disable-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/twig_debugger-disable-verify.sh
