metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: super_login
  version: 2.1.x
  note: 'Super Login alters the core login/registration/password-reset forms via hook_form_alter, driven
    entirely by the config object super_login.settings whose values are nested under a super_login.* key
    (read as super_login.settings -> super_login.<key>). Configure route super_login.settings (/admin/config/people/super_login/settings),
    core ''administer site configuration'' permission, no own permission/Drush/plugins. Login Type: 0
    username-or-email, 1 username-only, 2 email-only (implemented by super_login_user_login_validate swapping
    an email for the account''s username). Cases are grounded in these real keys; medium/hard scripts
    set and read login_type, capslock, autofocus and restore shipped defaults explicitly.'
questions:
- id: super_login-login-by-email
  input: Using the Super Login module, how do I let people sign in to my Drupal site with their email
    address only? Name the setting and the value.
  criteria: Set Login Type (config super_login.settings -> super_login.login_type) to 2 for email-only.
    0 = username or email, 1 = username only, 2 = email only. A validate handler looks up the account
    by email and substitutes the real username before core authenticates.
  bundle: super_login
  rubric_ref: rubric/super_login_super_login_login_by_email@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: super_login-config-object
  input: Where does the Super Login module store its settings, and what is the peculiarity of the key
    path when reading a single value like the login type with drush?
  criteria: Settings live in the config object super_login.settings, but every value is nested under a
    super_login key, so a value is read as super_login.settings -> super_login.<key>, e.g. drush cget
    super_login.settings super_login.login_type.
  bundle: super_login
  rubric_ref: rubric/super_login_super_login_config_object@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: super_login-added-elements
  input: What does the Super Login module add to or change on the core user login form?
  criteria: It relabels the username field, adds a Forgot password? link and a Create new account link,
    an optional Caps Lock warning, field placeholders, optional autofocus, widens the inputs, can move
    status messages outside the form, and removes the login/register/reset tabs.
  bundle: super_login
  rubric_ref: rubric/super_login_super_login_added_elements@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: super_login-current-login-type
  input: On this Drupal site, which login identifiers does Super Login currently accept (username, email,
    or both)? Inspect the live configuration to answer.
  criteria: 'It is email-only: super_login.settings -> super_login.login_type is 2 (0 would be username-or-email,
    1 username-only).'
  bundle: super_login
  rubric_ref: rubric/super_login_super_login_current_login_type@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/super_login-login-type-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/super_login-login-type-cleanup.sh
- id: super_login-capslock-state
  input: On this site, is the Super Login caps-lock warning currently enabled, and is the username field
    set to autofocus? Inspect the live configuration.
  criteria: The caps-lock warning is disabled (super_login.capslock = false) and username autofocus is
    enabled (super_login.autofocus = true).
  bundle: super_login
  rubric_ref: rubric/super_login_super_login_capslock_state@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/super_login-capslock-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/super_login-capslock-cleanup.sh
- id: super_login-make-email-only
  input: Configure Super Login on this site so that users can log in with their email address only, and
    turn off the Caps Lock warning. Apply the change to the live site.
  criteria: Set super_login.settings -> super_login.login_type to 2 (email only) and super_login.capslock
    to false (e.g. drush cset super_login.settings super_login.login_type 2; drush cset super_login.settings
    super_login.capslock 0).
  bundle: super_login
  rubric_ref: rubric/super_login_super_login_make_email_only@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/super_login-email-only-reset.sh
    verify: agent-module-documentation/evaluation/verify/super_login-email-only-verify.sh
- id: super_login-username-only-relabel
  input: 'On this Drupal site I want the login box to accept only the account username (not the email),
    and I want the wording above the login form to read exactly: Staff sign in. Make it so on the live
    site using the Super Login module.'
  criteria: Set super_login.settings -> super_login.login_type to 1 (username only) and super_login.login_title
    to 'Staff sign in'.
  bundle: super_login
  rubric_ref: rubric/super_login_super_login_username_only_relabel@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: site-owner
    reset: agent-module-documentation/evaluation/verify/super_login-username-only-reset.sh
    verify: agent-module-documentation/evaluation/verify/super_login-username-only-verify.sh
