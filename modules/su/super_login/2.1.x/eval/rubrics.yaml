rubrics:
- id: super_login_super_login_login_by_email
  version: '1.0'
  applicable_bundles:
  - super_login
  checks:
  - kind: must_contain_any
    values:
    - login_type
    - Login Type
  scoring:
    combine: all_pass
- id: super_login_super_login_config_object
  version: '1.0'
  applicable_bundles:
  - super_login
  checks:
  - kind: must_contain_any
    values:
    - super_login.settings
    - super_login.super_login
    - nested
  scoring:
    combine: all_pass
- id: super_login_super_login_added_elements
  version: '1.0'
  applicable_bundles:
  - super_login
  checks:
  - kind: must_contain_any
    values:
    - forgot password
    - caps lock
    - capslock
    - create new account
    - placeholder
    - autofocus
  scoring:
    combine: all_pass
- id: super_login_super_login_current_login_type
  version: '1.0'
  applicable_bundles:
  - super_login
  checks:
  - kind: must_contain_any
    values:
    - email
    - login_type
  scoring:
    combine: all_pass
- id: super_login_super_login_capslock_state
  version: '1.0'
  applicable_bundles:
  - super_login
  checks:
  - kind: must_contain_any
    values:
    - capslock
    - caps lock
    - autofocus
  scoring:
    combine: all_pass
- id: super_login_super_login_make_email_only
  version: '1.0'
  applicable_bundles:
  - super_login
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
- id: super_login_super_login_username_only_relabel
  version: '1.0'
  applicable_bundles:
  - super_login
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
