metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: subrequests
  version: 3.0.x
  note: 'Subrequests has no configure route, no config schema, and no Drush commands. Its only configurable,
    drush-readable surface is a single permission, ''issue subrequests'', gating the /subrequests route
    (subrequests.routing.yml, subrequests.permissions.yml). All medium/hard cases are therefore grounded
    in real Role entities and that real permission machine name: introspection creates namespaced roles
    (subreq_role_partner / subreq_role_on / subreq_role_off) and reads back which has the permission via
    Role::hasPermission(); execution grants or revokes ''issue subrequests'' on a namespaced role (subreq_client_role
    / subreq_legacy_role), verified live the same way. HTTP-execution of the front controller itself was
    avoided for the hard tier because the live site currently 500s on every HTTP request due to an unrelated
    container/DI conflict between other agents'' modules (gin_lb_plus vs storybook) -- drush''s CLI bootstrap
    is unaffected, so role/permission-based verification stays reliable.'
questions:
- id: subrequests-token-syntax
  input: In a Drupal subrequests blueprint (the subrequests contrib module), how do I reference part of
    an earlier subrequest's JSON response body inside a later subrequest's uri or body? Give the exact
    replacement token syntax, e.g. pulling the `id` field out of the response to a subrequest with requestId
    `req-1`.
  criteria: Use a token of the form `{{<requestId>.body@<jsonpath-expression>}}`, e.g. `{{req-1.body@$.id}}`.
    The JsonPathReplacer service finds tokens matching `\{\{([^\{\}]+\.[^\{\}]+)@([^\{\}]+)\}\}` in the
    uri/body, runs the JSONPath expression against the referenced requestId's JSON response body, and
    substitutes the result; if the JSONPath resolves to multiple values, the subrequest is cloned once
    per value. The dependant subrequest must also list that requestId in its waitFor.
  bundle: subrequests
  rubric_ref: rubric/subrequests_subrequests_token_syntax@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: subrequests-blueprint-keys
  input: What properties can a subrequest object inside a Drupal subrequests blueprint JSON array contain,
    and which two of them are practically required for the subrequest to work at all?
  criteria: Each subrequest object may contain requestId, uri, action, headers, body, and waitFor. uri
    and action are the practically required ones -- action selects the HTTP method (view=GET, create=POST,
    update=PATCH, replace=PUT, delete=DELETE, exists=HEAD, discover=OPTIONS) and uri is the path to dispatch
    the sub-request to.
  bundle: subrequests
  rubric_ref: rubric/subrequests_subrequests_blueprint_keys@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: subrequests-permission-and-endpoint
  input: Which Drupal permission gates use of the subrequests front controller, what path is the endpoint
    mounted at, and what HTTP status code does a successful bundled response use?
  criteria: The 'issue subrequests' permission (subrequests.permissions.yml) gates the route defined in
    subrequests.routing.yml, mounted at /subrequests (GET or POST). A successful response always uses
    HTTP 207 Multi-Status -- multipart/related by default, or a single JSON object keyed by requestId
    when requested with ?_format=json.
  bundle: subrequests
  rubric_ref: rubric/subrequests_subrequests_permission_and_endpoint@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: subrequests-known-role
  input: This Drupal site has a custom role that was granted the 'issue subrequests' permission so an
    API integration partner can batch requests through the subrequests front controller. Inspect the live
    roles/permissions and give the machine name of that role.
  criteria: The role is subreq_role_partner -- it has been granted the 'issue subrequests' permission
    (Role::hasPermission('issue subrequests') is TRUE for that role).
  bundle: subrequests
  rubric_ref: rubric/subrequests_subrequests_known_role@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/subrequests-known-role-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/subrequests-known-role-cleanup.sh
- id: subrequests-granted-vs-denied
  input: This site has two custom roles, subreq_role_on and subreq_role_off. Exactly one of them has been
    granted the 'issue subrequests' permission and can call the subrequests front controller; the other
    cannot. Inspect the live role permissions and state which role has access.
  criteria: subreq_role_on has the 'issue subrequests' permission granted; subreq_role_off does not (it
    only has 'access content'), so only subreq_role_on can call the /subrequests front controller.
  bundle: subrequests
  rubric_ref: rubric/subrequests_subrequests_granted_vs_denied@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/subrequests-granted-vs-denied-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/subrequests-granted-vs-denied-cleanup.sh
- id: subrequests-grant-access
  input: On this Drupal site, the role subreq_client_role exists (it already has 'access content') but
    is not able to use the subrequests front controller. Grant this role whatever permission is needed
    so it can call the /subrequests endpoint, using the subrequests module. Apply the change to the live
    site.
  criteria: Grant subreq_client_role the 'issue subrequests' permission, e.g. `drush role:perm:add subreq_client_role
    'issue subrequests'` or via user_role_grant_permissions('subreq_client_role', ['issue subrequests']),
    or by ticking it on /admin/people/permissions.
  bundle: subrequests
  rubric_ref: rubric/subrequests_subrequests_grant_access@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/subrequests-grant-access-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/subrequests-grant-access-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/subrequests-grant-access-verify.sh
- id: subrequests-revoke-access
  input: On this Drupal site, the role subreq_legacy_role currently has both 'access content' and 'issue
    subrequests' granted. This role no longer needs bulk API access. Revoke only its ability to use the
    subrequests front controller, while leaving its other permissions (such as 'access content') intact.
    Apply the change to the live site.
  criteria: Revoke just the 'issue subrequests' permission from subreq_legacy_role, e.g. `drush role:perm:remove
    subreq_legacy_role 'issue subrequests'` or via user_role_revoke_permissions('subreq_legacy_role',
    ['issue subrequests']), without deleting the role or removing its other permissions like 'access content'.
  bundle: subrequests
  rubric_ref: rubric/subrequests_subrequests_revoke_access@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/subrequests-revoke-access-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/subrequests-revoke-access-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/subrequests-revoke-access-verify.sh
