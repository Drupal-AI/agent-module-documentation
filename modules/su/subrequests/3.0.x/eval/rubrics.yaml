rubrics:
- id: subrequests_subrequests_token_syntax
  version: '1.0'
  applicable_bundles:
  - subrequests
  checks:
  - kind: must_contain_any
    values:
    - '{{req-1.body@$.id}}'
    - '{{req-1.body@'
    - body@$.
    - requestId.body@
  scoring:
    combine: all_pass
- id: subrequests_subrequests_blueprint_keys
  version: '1.0'
  applicable_bundles:
  - subrequests
  checks:
  - kind: must_contain_any
    values:
    - uri
    - action
  scoring:
    combine: all_pass
- id: subrequests_subrequests_permission_and_endpoint
  version: '1.0'
  applicable_bundles:
  - subrequests
  checks:
  - kind: must_contain_any
    values:
    - issue subrequests
  scoring:
    combine: all_pass
- id: subrequests_subrequests_known_role
  version: '1.0'
  applicable_bundles:
  - subrequests
  checks:
  - kind: must_contain_any
    values:
    - subreq_role_partner
  scoring:
    combine: all_pass
- id: subrequests_subrequests_granted_vs_denied
  version: '1.0'
  applicable_bundles:
  - subrequests
  checks:
  - kind: must_contain_any
    values:
    - subreq_role_on
  scoring:
    combine: all_pass
- id: subrequests_subrequests_grant_access
  version: '1.0'
  applicable_bundles:
  - subrequests
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
- id: subrequests_subrequests_revoke_access
  version: '1.0'
  applicable_bundles:
  - subrequests
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
