metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: perimeter
  version: 3.0.x
  note: 'Perimeter is a tiny module: one KernelEvents::EXCEPTION subscriber that bans the client IP (via
    core Ban''s ban.ip_manager) when a 404 request path matches a regex in perimeter.settings:not_found_exception_patterns,
    gated by a whitelist and an optional flood threshold/window. It has no drush commands and no plugin
    type. The easy `recipe` cases (response-graded) probe the detection mechanism, the core-Ban integration,
    and the config keys/route/permissions. The medium `introspection` cases put a known value on the live
    site (a custom pattern, a non-default flood threshold, or a banned test IP) and ask the agent to read
    it back. The hard `execution` cases reset to a baseline, have the agent configure perimeter (add an
    xmlrpc.php ban pattern, set a flood threshold) or reproduce perimeter''s effect (get a test IP into
    the ban list), then verify live state. All banned IPs are RFC 5737 TEST-NET-3 (203.0.113.x) and are
    cleaned up.'
questions:
- id: perimeter-detection-mechanism
  input: How does the Drupal perimeter module decide to ban a visitor's IP? Which kernel event does it
    listen to, what kind of request triggers the check, and what does it compare the request against?
  criteria: It registers an event subscriber on KernelEvents::EXCEPTION. When a request throws a NotFoundHttpException
    (a 404), it matches the request path against the regex list perimeter.settings:not_found_exception_patterns;
    on a match it bans the client IP.
  bundle: perimeter
  rubric_ref: rubric/perimeter_perimeter_detection_mechanism@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: perimeter-ban-integration
  input: In the perimeter module, how is the actual IP ban stored, and where do I go to review or remove
    a banned IP? Name the service and the module it belongs to.
  criteria: Perimeter depends on Drupal core's Ban module and calls its ban.ip_manager service (banIp),
    which writes the IP to the ban_ip table. Manage/unban them on the core Ban page at /admin/config/people/ban
    (route ban.admin_page).
  bundle: perimeter
  rubric_ref: rubric/perimeter_perimeter_ban_integration@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: perimeter-config-keys
  input: In the perimeter module on Drupal 11, which config object holds its settings, what are its four
    keys, and what does a flood_threshold of 0 mean? Where is the settings form?
  criteria: Config object perimeter.settings with keys not_found_exception_patterns, whitelisted_ips,
    flood_threshold, and flood_window. flood_threshold 0 (the default) bans on the first matching request.
    The settings form is route perimeter.settings at /admin/config/system/perimeter.
  bundle: perimeter
  rubric_ref: rubric/perimeter_perimeter_config_keys@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: perimeter-custom-pattern
  input: This live Drupal 11 site runs the perimeter module. Besides the module's built-in patterns, has
    a custom URL ban pattern been added to perimeter.settings? If so, report the exact pattern.
  criteria: Yes. In addition to the 12 built-in patterns, not_found_exception_patterns contains a custom
    entry /\/eval-trap-9f3a\// (matches any path containing eval-trap-9f3a).
  bundle: perimeter
  rubric_ref: rubric/perimeter_perimeter_custom_pattern@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/perimeter-custom-pattern-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/perimeter-custom-pattern-cleanup.sh
- id: perimeter-flood-threshold
  input: On this live Drupal 11 site, how many suspicious (matching) requests does perimeter currently
    tolerate before it bans an IP, and over what time window? Give the config keys and their current values.
  criteria: perimeter.settings:flood_threshold is currently 5 (an IP is banned on the request after 5
    matching attempts) and flood_window is 600 seconds. (Install defaults are 0 / 3600.)
  bundle: perimeter
  rubric_ref: rubric/perimeter_perimeter_flood_threshold@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/perimeter-flood-threshold-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/perimeter-flood-threshold-cleanup.sh
- id: perimeter-banned-ip
  input: Perimeter bans offending IPs through Drupal core's Ban module. On this live site right now, which
    IP address(es) are in the ban list? List them.
  criteria: 'One IP is banned: 203.0.113.45 (found via ban.ip_manager->findAll() or SELECT ip FROM ban_ip).'
  bundle: perimeter
  rubric_ref: rubric/perimeter_perimeter_banned_ip@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/perimeter-banned-ip-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/perimeter-banned-ip-cleanup.sh
- id: perimeter-add-pattern
  input: On this Drupal site, configure Perimeter so that any 404 request whose path contains xmlrpc.php
    gets the visitor's IP banned. Add the ban rule to the live perimeter configuration now.
  criteria: Append a regex such as /\/xmlrpc\.php/ (or /.*xmlrpc\.php.*/) to perimeter.settings:not_found_exception_patterns
    and save, so a 404 to /xmlrpc.php matches and bans the IP. Verified by preg_match of the stored patterns
    against /xmlrpc.php.
  bundle: perimeter
  rubric_ref: rubric/perimeter_perimeter_add_pattern@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
