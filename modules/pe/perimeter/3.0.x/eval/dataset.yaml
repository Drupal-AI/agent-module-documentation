    cleanup: agent-module-documentation/evaluation/verify/perimeter-add-pattern-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/perimeter-add-pattern-verify.sh
- id: perimeter-flood-threshold-set
  input: On this Drupal site, change Perimeter so a suspicious visitor is given 3 attempts at banned URLs
    before their IP is banned (keep a positive flood window). Apply it to the running site.
  criteria: Set perimeter.settings:flood_threshold to 3 (with flood_window >= 1, e.g. the default 3600)
    and save; caches cleared. Verified by reading flood_threshold === 3 from live config.
  bundle: perimeter
  rubric_ref: rubric/perimeter_perimeter_flood_threshold_set@1.0
  tags:
  - mode:execution
  - difficulty:hard
