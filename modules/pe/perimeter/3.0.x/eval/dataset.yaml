    cleanup: agent-module-documentation/evaluation/verify/perimeter-flood-config-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/perimeter-flood-config-verify.sh
- id: perimeter-ban-ip
  input: 'A bot at IP 203.0.113.99 has been hammering /wp-login.php on this site. Perimeter would ban
    it via core Ban - reproduce that end state now: get 203.0.113.99 into the site''s ban list the same
    way Perimeter does.'
  criteria: 'Add 203.0.113.99 to the core Ban list the way perimeter does: \Drupal::service(''ban.ip_manager'')->banIp(''203.0.113.99'')
    (or drush sql:query insert into ban_ip). Verified by ban.ip_manager->isBanned(''203.0.113.99'') ===
    true.'
  bundle: perimeter
  rubric_ref: rubric/perimeter_perimeter_ban_ip@1.0
