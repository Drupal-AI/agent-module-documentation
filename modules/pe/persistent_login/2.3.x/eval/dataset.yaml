metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: persistent_login
  version: 2.3.x
  note: 'Persistent Login stores all settings in persistent_login.settings (lifetime in days with 0 =
    never expires, extend_lifetime, max_tokens with 0 = unlimited, login_form.field_label, cookie_prefix),
    edited at /admin/config/system/persistent_login (permission administer site configuration). It owns
    a database table ''persistent_login'' (uid, series, instance, created, refreshed, expires) whose series/instance
    are hashed with Crypt::hashBase64. Services: persistent_login.token_manager (createNewTokenForUser,
    validateToken, updateToken, deleteToken, getTokensForUser, clearUsersTokens, cleanupExpiredTokens),
    persistent_login.token_handler (a global authentication_provider at priority 1, above cookie auth,
    plus a KernelEvents::RESPONSE subscriber) and persistent_login.cookie_helper. hook_requirements()
    errors unless services.yml sets session.storage.options.cookie_lifetime to 0. No permissions, no plugin
    types, no Drush commands. Medium/hard cases read and write that real config and real rows in the persistent_login
    table.'
questions:
- id: persistent_login-config-keys
  input: On a Drupal site with the persistent_login module, which configuration object and key control
    how long a 'Remember me' login stays valid, and what value means it never expires? Which key changes
    the text of the checkbox?
  criteria: 'persistent_login.settings:lifetime, expressed in days; 0 means no expiration. login_form.field_label
    holds the checkbox text (default ''Remember me''). Other keys: extend_lifetime (renew from last use),
    max_tokens (0 = unlimited) and cookie_prefix. The form is at /admin/config/system/persistent_login.'
  bundle: persistent_login
  rubric_ref: rubric/persistent_login_persistent_login_config_keys@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: persistent_login-session-requirement
  input: The status report on my Drupal site complains about 'Session cookie lifetime' after installing
    persistent_login. What exactly does the module require me to change, and in which file?
  criteria: 'persistent_login_requirements() raises an error unless the PHP session cookie ends with the
    browser session. Set it in services.yml: parameters: session.storage.options: cookie_lifetime: 0 -
    then rebuild the cache. The module deliberately handles long-lived logins itself instead of lengthening
    the PHP session.'
  bundle: persistent_login
  rubric_ref: rubric/persistent_login_persistent_login_session_requirement@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: persistent_login-token-scheme
  input: How does the Drupal persistent_login module store remembered logins, and what is the name of
    the service you would call to issue or clear tokens for a user from code?
  criteria: Tokens live in the module's own 'persistent_login' database table with uid, series, instance,
    created, refreshed and expires; series and instance are hashed with Crypt::hashBase64 and the single-use
    instance is rotated on every use (series/instance theft-detection scheme). The service is persistent_login.token_manager
    (TokenManager) with createNewTokenForUser(), getTokensForUser(), clearUsersTokens(), cleanupExpiredTokens();
    persistent_login.token_handler adds setNewSessionToken()/clearSessionToken().
  bundle: persistent_login
  rubric_ref: rubric/persistent_login_persistent_login_token_scheme@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: persistent_login-known-settings
  input: This Drupal site has persistent_login configured. Inspect the live configuration and tell me
    how many days a remembered login lasts, how many remembered logins one user may have, and the exact
    wording of the checkbox on the login form.
  criteria: 'persistent_login.settings has lifetime 14 (days), extend_lifetime true, max_tokens 3 and
    login_form.field_label ''Keep me signed in on this device''. Read it with: drush cget persistent_login.settings'
  bundle: persistent_login
  rubric_ref: rubric/persistent_login_persistent_login_known_settings@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/persistent_login-known-settings-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/persistent_login-known-settings-cleanup.sh
- id: persistent_login-active-tokens
  input: Exactly one account on this Drupal site currently has active 'Remember me' (persistent login)
    tokens. Inspect the running site and tell me the username of that account and how many tokens it holds.
  criteria: The account is pl_known_user and it has 2 active tokens. The rows live in the module's persistent_login
    table keyed by uid; find them with a query on that table, or with \Drupal::service('persistent_login.token_manager')->getTokensForUser($user)
    (the per-user list is also at /user/{uid}/persistent-logins).
  bundle: persistent_login
  rubric_ref: rubric/persistent_login_persistent_login_active_tokens@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/persistent_login-active-tokens-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/persistent_login-active-tokens-cleanup.sh
- id: persistent_login-configure
  input: On this Drupal site people can tick a box on the login form to stay logged in. Change it so that
    (a) the box says exactly 'Stay signed in', (b) a remembered login stays valid for 90 days counted
    from the last time it was used rather than from when they logged in, and (c) one person can only have
    five remembered devices at a time. Apply the changes to the live site.
  criteria: 'In persistent_login.settings set lifetime: 90, extend_lifetime: true, max_tokens: 5 and login_form.field_label:
    ''Stay signed in'' -- e.g. drush cset persistent_login.settings lifetime 90 -y; drush cset persistent_login.settings
    extend_lifetime 1 -y; drush cset persistent_login.settings max_tokens 5 -y; drush cset persistent_login.settings
    login_form.field_label ''Stay signed in'' -y (or via /admin/config/system/persistent_login).'
  bundle: persistent_login
  rubric_ref: rubric/persistent_login_persistent_login_configure@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: site-owner
    reset: agent-module-documentation/evaluation/verify/persistent_login-configure-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/persistent_login-configure-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/persistent_login-configure-verify.sh
- id: persistent_login-issue-token
  input: This Drupal site has persistent_login enabled and a user account named pl_task_user that currently
    has no remembered logins. Without going through the login form, use the module's own API to issue
    exactly one persistent login token for that account on the live site.
  criteria: 'Call the token manager once: drush php:eval ''$u = user_load_by_name("pl_task_user"); \Drupal::service("persistent_login.token_manager")->createNewTokenForUser($u->id());''
    which inserts exactly one row in the persistent_login table. The verify script counts both getTokensForUser()
    and the table rows and requires exactly 1.'
  bundle: persistent_login
  rubric_ref: rubric/persistent_login_persistent_login_issue_token@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/persistent_login-issue-token-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/persistent_login-issue-token-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/persistent_login-issue-token-verify.sh
