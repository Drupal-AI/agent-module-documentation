metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: permissions_by_entity
  version: 3.1.x
  note: 'permissions_by_entity is the submodule of permissions_by_term. It has NO configuration, permissions,
    schema, routes, Drush commands or plugins of its own (configure: null) — it reuses permissions_by_term.settings
    and the permissions_by_term_user / permissions_by_term_role tables. Its service permissions_by_entity.access_checker
    (Service\AccessChecker extends permissions_by_term''s AccessCheck) exposes isAccessControlled() and
    isAccessAllowed(); nodes are deliberately excluded so the parent module keeps them. Enforcement: hook_entity_access()
    for ''view'' on saved non-node fieldable entities, plus a KernelEvents::REQUEST subscriber at priority
    28 (before DynamicPageCacheSubscriber) that throws AccessDeniedHttpException. The hard prerequisite
    exploited by the medium and hard cases is real code in isAccessControlled(): permissions_by_term.settings:target_bundles
    must be NON-EMPTY and intersect the taxonomy field''s handler_settings.target_bundles, otherwise nothing
    is ever controlled — unlike the parent module, where an empty list means ''all vocabularies''.'
questions:
- id: permissions_by_entity-service-api
  input: On a Drupal site with permissions_by_entity enabled, which service and which two methods decide
    whether a media item (or any non-node entity) is restricted by taxonomy term permissions, and how
    would I call them from drush php:eval?
  criteria: \Drupal::service('permissions_by_entity.access_checker') — an instance of Drupal\permissions_by_entity\Service\AccessChecker
    (which extends permissions_by_term's AccessCheck). isAccessControlled(FieldableEntityInterface $entity,
    bool $clearCache = TRUE) says whether the entity is under term control; isAccessAllowed(FieldableEntityInterface
    $entity, $uid = FALSE) says whether that uid may view it. Both walk the entity's fields and recurse
    into referenced fieldable entities, guarded by permissions_by_entity.checked_entity_cache.
  bundle: permissions_by_entity
  rubric_ref: rubric/permissions_by_entity_permissions_by_entity_service_api@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: permissions_by_entity-target-bundles-requirement
  input: I enabled the Drupal submodule permissions_by_entity and granted a role a taxonomy term, but
    my media entities referencing that term are still visible to everyone. Which configuration value of
    the parent Permissions by Term module is the usual cause, and what exactly does the code require of
    it?
  criteria: permissions_by_term.settings:target_bundles. AccessChecker::isAccessControlled() requires
    it to be non-empty AND to intersect the taxonomy reference field's own handler_settings.target_bundles
    — an empty list means 'nothing is controlled' here, even though the parent module treats an empty
    list as 'all vocabularies'. A term-reference field with no restricted target bundles never intersects
    either. Set it at /admin/permissions-by-term/settings or with configFactory()->getEditable('permissions_by_term.settings')->set('target_bundles',
    ['tags'])->save().
  bundle: permissions_by_entity
  rubric_ref: rubric/permissions_by_entity_permissions_by_entity_target_bundles_requirement@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: permissions_by_entity-enforcement
  input: How does the Drupal permissions_by_entity submodule actually block access to a restricted entity,
    and why does it not handle nodes?
  criteria: 'Two places: hook_entity_access() returns AccessResult::forbidden(''Access revoked by permissions_by_entity
    module.'') for the ''view'' operation on saved, fieldable, non-node entities that are controlled and
    not allowed (cached per uid/entity with the tag permissions_by_entity:access_result_cache:<type>:<id>);
    and PermissionsByEntityKernelEventSubscriber on KernelEvents::REQUEST at priority 28 — deliberately
    before DynamicPageCacheSubscriber — throws AccessDeniedHttpException for the routed entity. Nodes
    are skipped because AccessChecker::isAccessControlled() returns FALSE for the node entity type, leaving
    them to permissions_by_term''s node access records.'
  bundle: permissions_by_entity
  rubric_ref: rubric/permissions_by_entity_permissions_by_entity_enforcement@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: permissions_by_entity-target-bundles
  input: permissions_by_entity only restricts an entity when the taxonomy field it references points at
    a vocabulary that Permissions by Term is scoped to. Inspect this running Drupal site and tell me which
    vocabulary is currently in that scope.
  criteria: pbe_intro_vocab — permissions_by_term.settings:target_bundles is ['pbe_intro_vocab'] on this
    site. Read it with `drush config:get permissions_by_term.settings target_bundles`.
  bundle: permissions_by_entity
  rubric_ref: rubric/permissions_by_entity_permissions_by_entity_target_bundles@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/permissions_by_entity-target-bundles-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/permissions_by_entity-target-bundles-cleanup.sh
- id: permissions_by_entity-known-grant
  input: On this Drupal site, a non-node entity that references the taxonomy term 'PBE Grant Term' would
    be restricted by permissions_by_entity. Inspect the live site and tell me which custom role is currently
    allowed to view such an entity.
  criteria: pbe_grant_role — its grant is a row in the parent module's permissions_by_term_role table
    for the tid of 'PBE Grant Term' (the administrator role also appears, because addTermPermissionsByRoleIds()
    auto-grants every role with 'bypass node access'). permissions_by_term.settings:target_bundles is
    ['pbe_grant_vocab'], which is what makes the submodule consider such entities controlled at all.
  bundle: permissions_by_entity
  rubric_ref: rubric/permissions_by_entity_permissions_by_entity_known_grant@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/permissions_by_entity-known-grant-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/permissions_by_entity-known-grant-cleanup.sh
- id: permissions_by_entity-enable-control
  input: 'This Drupal site uses Permissions by Term for nodes, but the same taxonomy-term restrictions
    must now also apply to non-node entities (media, paragraphs, block content) that reference terms of
    the vocabulary pbe_task_vocab. Make that work on the live site: the responsible submodule must be
    installed and Permissions by Term must be scoped so that this vocabulary is actually covered.'
  criteria: '`drush en permissions_by_entity -y`, then set permissions_by_term.settings:target_bundles
    to [''pbe_task_vocab''] (at /admin/permissions-by-term/settings or via configFactory()). Both are
    required: AccessChecker::isAccessControlled() bails out when target_bundles is empty, so leaving it
    at the default means the submodule restricts nothing.'
  bundle: permissions_by_entity
  rubric_ref: rubric/permissions_by_entity_permissions_by_entity_enable_control@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/permissions_by_entity-enable-control-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/permissions_by_entity-enable-control-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/permissions_by_entity-enable-control-verify.sh
- id: permissions_by_entity-grant-entity-role
  input: On my Drupal site there is a category called 'PBE Entity Term' (in the vocabulary 'PBE Entity
    Vocab') and a user group called pbe_ent_role. Media items and other non-page items filed under that
    category should only be viewable by that group. Nothing outside that vocabulary should be affected.
    Please set this up on the live site.
  criteria: 'Two changes: (1) grant the role on the term — a row (tid of ''PBE Entity Term'', rid ''pbe_ent_role'')
    in permissions_by_term_role, written from the term edit form''s Permissions fieldset or with permissions_by_term.access_storage::addTermPermissionsByRoleIds([''pbe_ent_role''],
    $tid, ''en''); (2) set permissions_by_term.settings:target_bundles to include ''pbe_ent_vocab'', without
    which permissions_by_entity never treats such entities as access controlled.'
  bundle: permissions_by_entity
  rubric_ref: rubric/permissions_by_entity_permissions_by_entity_grant_entity_role@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: site-owner-layman
    reset: agent-module-documentation/evaluation/verify/permissions_by_entity-grant-entity-role-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/permissions_by_entity-grant-entity-role-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/permissions_by_entity-grant-entity-role-verify.sh
