metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: permissionspolicy
  version: 1.2.x
  note: 'Permissions Policy sends a Permissions-Policy header built by ResponseSubscriber from config
    permissionspolicy.settings. Structure: enforce.enable (bool) + enforce.features.<feature> => {base:
    ''self''|''none''|''any''|'''', sources: [...]}. self->(self), none->(), any->*. Baseline (config/install)
    is enforce.enable=true, features={} (no header). Medium cases set a known feature base and read it
    back; hard cases require setting geolocation to ''none'' and camera to ''self''. Verify reads config
    enforce.features.<feature>.base directly (no cache rebuild needed). Reset/cleanup restore features={}.'
questions:
- id: permissionspolicy-which-header
  input: What HTTP response header does the Drupal permissionspolicy module add, and which config object
    and admin page control it?
  criteria: It sends the Permissions-Policy header. It is configured at /admin/config/system/permissionspolicy
    (permission 'administer permissions policy configuration') and stored in the config object permissionspolicy.settings
    under the `enforce` policy.
  bundle: permissionspolicy
  rubric_ref: rubric/permissionspolicy_permissionspolicy_which_header@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: permissionspolicy-feature-structure
  input: In the permissionspolicy module, how is a single browser feature like geolocation configured,
    and what does setting its base to 'self' versus 'none' produce in the header?
  criteria: 'Under permissionspolicy.settings, enforce.features.<feature> holds {base: ''self''|''none''|''any''|'''',
    sources: [...]}. base ''self'' emits feature=(self) (your origin only), ''none'' emits feature=()
    (nobody), ''any'' emits feature=* (everyone). Extra origins go in `sources`.'
  bundle: permissionspolicy
  rubric_ref: rubric/permissionspolicy_permissionspolicy_feature_structure@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: permissionspolicy-base-keywords
  input: What are the allowed 'base' keyword values for a feature in the permissionspolicy module and
    what origin does each represent?
  criteria: 'self = your own origin only (renders (self)); none = no origin, feature disabled (renders
    ()); any = every origin (renders *); empty '''' = no base keyword, rely on the listed sources. Constants:
    ORIGIN_SELF=''self'', ORIGIN_NONE=''none'', ORIGIN_ANY=''*''.'
  bundle: permissionspolicy
  rubric_ref: rubric/permissionspolicy_permissionspolicy_base_keywords@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: permissionspolicy-geolocation-configured
  input: This site has the Permissions Policy module configured with one feature. Inspect the live permissionspolicy
    configuration and tell me how the geolocation feature is set (i.e. which origins are allowed to use
    geolocation).
  criteria: geolocation is set to base 'none' — enforce.features.geolocation.base === 'none' — meaning
    no origin may use geolocation (header fragment geolocation=()).
  bundle: permissionspolicy
  rubric_ref: rubric/permissionspolicy_permissionspolicy_geolocation_configured@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/permissionspolicy-geolocation-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/permissionspolicy-baseline.sh
- id: permissionspolicy-camera-configured
  input: Inspect this site's Permissions Policy configuration and report the base value configured for
    the camera feature.
  criteria: camera is configured with base 'self' — enforce.features.camera.base === 'self' — restricting
    camera access to the site's own origin (header fragment camera=(self)).
  bundle: permissionspolicy
  rubric_ref: rubric/permissionspolicy_permissionspolicy_camera_configured@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/permissionspolicy-camera-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/permissionspolicy-baseline.sh
- id: permissionspolicy-disable-geolocation
  input: I don't want any page on my site (or anything embedded in it) to be able to ask visitors for
    their location. Use the Permissions Policy module to switch geolocation off for everyone, and apply
    it to the site.
  criteria: Set enforce.features.geolocation.base to 'none' in permissionspolicy.settings (with enforce.enable
    true), so the emitted header contains geolocation=().
  bundle: permissionspolicy
  rubric_ref: rubric/permissionspolicy_permissionspolicy_disable_geolocation@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-layman
    reset: agent-module-documentation/evaluation/verify/permissionspolicy-baseline.sh
    cleanup: agent-module-documentation/evaluation/verify/permissionspolicy-baseline.sh
    verify: agent-module-documentation/evaluation/verify/permissionspolicy-geolocation-verify.sh
    unused_text_checks:
      must_contain_any: []
      must_not_contain: []
- id: permissionspolicy-camera-self
  input: Using the permissionspolicy module, restrict the browser 'camera' feature so only the site's
    own origin may use it (base self), and apply the change to the live configuration.
  criteria: Set enforce.features.camera.base to 'self' in permissionspolicy.settings (enforce.enable true),
    producing the header fragment camera=(self).
  bundle: permissionspolicy
  rubric_ref: rubric/permissionspolicy_permissionspolicy_camera_self@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/permissionspolicy-baseline.sh
    cleanup: agent-module-documentation/evaluation/verify/permissionspolicy-baseline.sh
    verify: agent-module-documentation/evaluation/verify/permissionspolicy-camera-verify.sh
    unused_text_checks:
      must_contain_any: []
      must_not_contain: []
