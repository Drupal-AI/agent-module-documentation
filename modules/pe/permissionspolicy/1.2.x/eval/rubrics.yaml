rubrics:
- id: permissionspolicy_permissionspolicy_which_header
  version: '1.0'
  applicable_bundles:
  - permissionspolicy
  checks:
  - kind: must_contain_any
    values:
    - Permissions-Policy
    - permissionspolicy.settings
    - /admin/config/system/permissionspolicy
  scoring:
    combine: all_pass
- id: permissionspolicy_permissionspolicy_feature_structure
  version: '1.0'
  applicable_bundles:
  - permissionspolicy
  checks:
  - kind: must_contain_any
    values:
    - base
    - self
    - none
    - features
  scoring:
    combine: all_pass
- id: permissionspolicy_permissionspolicy_base_keywords
  version: '1.0'
  applicable_bundles:
  - permissionspolicy
  checks:
  - kind: must_contain_any
    values:
    - self
    - none
    - any
  scoring:
    combine: all_pass
- id: permissionspolicy_permissionspolicy_geolocation_configured
  version: '1.0'
  applicable_bundles:
  - permissionspolicy
  checks:
  - kind: must_contain_any
    values:
    - none
  scoring:
    combine: all_pass
- id: permissionspolicy_permissionspolicy_camera_configured
  version: '1.0'
  applicable_bundles:
  - permissionspolicy
  checks:
  - kind: must_contain_any
    values:
    - self
  scoring:
    combine: all_pass
- id: permissionspolicy_permissionspolicy_disable_geolocation
  version: '1.0'
  applicable_bundles:
  - permissionspolicy
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
- id: permissionspolicy_permissionspolicy_camera_self
  version: '1.0'
  applicable_bundles:
  - permissionspolicy
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
