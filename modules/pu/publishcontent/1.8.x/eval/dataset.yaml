metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: publishcontent
  version: 1.8.x
  note: All cases are `recipe` (response-graded), probing load-bearing permissions, config keys, the toggle
    route, the access service, events, and the access hooks — grounded in the module source.
questions:
- id: publishcontent-purpose
  input: What problem does the Publish Content module solve on a Drupal 11 site, and which entity type
    does it apply to?
  criteria: It gives granular per-content-type and per-role publish/unpublish permissions so editors can
    toggle a node's published status without the broad 'administer nodes' permission. It applies to nodes
    only.
  bundle: publishcontent
  rubric_ref: rubric/publishcontent_publishcontent_purpose@1.0
  tags:
  - mode:recipe
- id: publishcontent-config-route
  input: What is the settings route name and admin path for Publish Content, and which permission is required
    to reach it?
  criteria: Route publishcontent.settings at /admin/config/workflow/publishcontent, gated by the `access
    publish content settings` permission.
  bundle: publishcontent
  rubric_ref: rubric/publishcontent_publishcontent_config_route@1.0
  tags:
  - mode:recipe
- id: publishcontent-revision-drush
  input: I want Publish Content to create a new node revision every time someone toggles publish status.
    Which config key in publishcontent.settings do I set, and give a drush command.
  criteria: 'Set create_revision to true: drush config:set publishcontent.settings create_revision 1 -y
    (config object publishcontent.settings).'
  bundle: publishcontent
  rubric_ref: rubric/publishcontent_publishcontent_revision_drush@1.0
  tags:
  - mode:recipe
- id: publishcontent-own-permission
  input: On this site I want authors to unpublish only their own articles. Which Publish Content permission
    grants that for the 'article' content type?
  criteria: Grant the per-type permission `unpublish own node type article` (checks node owner == current
    user).
  bundle: publishcontent
  rubric_ref: rubric/publishcontent_publishcontent_own_permission@1.0
  tags:
  - mode:recipe
- id: publishcontent-global-perms
  input: Name Publish Content's global permission that lets a reviewer publish any content of any type,
    and the one that only lets them publish content they can already edit.
  criteria: '`publish any content` publishes any node of any type; `publish editable content` only publishes
    nodes the user already has update/edit access to.'
  bundle: publishcontent
  rubric_ref: rubric/publishcontent_publishcontent_global_perms@1.0
  tags:
  - mode:recipe
- id: publishcontent-toggle-route
  input: Which route/path toggles a node's published status in Publish Content, and what request protection
    does it require?
  criteria: Route entity.node.publish at /node/{node}/toggleStatus (translation variant entity.node.publish_translation
    at /node/{node}/toggleStatus/{langcode}); it requires a valid CSRF token plus the _publish_access_check
    and hasUiLocalTask access checks.
  bundle: publishcontent
  rubric_ref: rubric/publishcontent_publishcontent_toggle_route@1.0
  tags:
  - mode:recipe
- id: publishcontent-access-service
  input: In custom code, how do I check whether the current user is allowed to publish/unpublish a given
    node using Publish Content? Name the service and method.
  criteria: 'Call the publishcontent.access service: \Drupal::service(''publishcontent.access'')->access($account,
    $node) returns an AccessResult; check ->isAllowed().'
  bundle: publishcontent
  rubric_ref: rubric/publishcontent_publishcontent_access_service@1.0
  tags:
  - mode:recipe
- id: publishcontent-hooks
  input: Which hooks does Publish Content invite so a module can deny publishing access to a node programmatically?
  criteria: hook_publishcontent_publish_access() and hook_publishcontent_unpublish_access(), each receiving
    the NodeInterface and AccountInterface and returning an AccessResult (forbidden to block, neutral
    to abstain).
  bundle: publishcontent
  rubric_ref: rubric/publishcontent_publishcontent_hooks@1.0
  tags:
  - mode:recipe
- id: publishcontent-events
  input: I want custom code to react whenever Publish Content publishes or unpublishes a node. Which events
    are dispatched?
  criteria: The toggle controller dispatches Drupal\publishcontent\Event\PublishContentPublishEvent and
    PublishContentUnpublishEvent (each exposes public $node and $langcode); subscribe keyed on the class
    name.
  bundle: publishcontent
  rubric_ref: rubric/publishcontent_publishcontent_events@1.0
  tags:
  - mode:recipe
- id: publishcontent-ui-options
  input: Publish Content offers two UI ways to toggle status. Which two config keys enable the local task
    tab and the node-form checkbox, and what are their defaults?
  criteria: ui_localtask (default true) shows the Publish/Unpublish local task tab; ui_checkbox (default
    false) shows a publish checkbox on the node edit form.
  bundle: publishcontent
  rubric_ref: rubric/publishcontent_publishcontent_ui_options@1.0
  tags:
  - mode:recipe
- id: publishcontent-views-field
  input: How can I add a one-click publish/unpublish toggle link to a Views listing of nodes with Publish
    Content?
  criteria: With Views enabled the module adds a node field 'Publish/Unpublish' (handler id publishcontent_node);
    add it to a node-based View to render a per-row toggle link that respects publishcontent.access.
  bundle: publishcontent
  rubric_ref: rubric/publishcontent_publishcontent_views_field@1.0
  tags:
  - mode:recipe
- id: publishcontent-dependencies
  input: What are Publish Content's module dependencies, and does it require any contrib modules?
  criteria: It depends only on Drupal core's node module; no contrib modules are required.
  bundle: publishcontent
  rubric_ref: rubric/publishcontent_publishcontent_dependencies@1.0
  tags:
  - mode:recipe
