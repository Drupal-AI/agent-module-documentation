rubrics:
- id: publishcontent_publishcontent_purpose
  version: '1.0'
  applicable_bundles:
  - publishcontent
  checks:
  - kind: must_contain_any
    values:
    - without
    - administer nodes
    - granular
    - per content type
    - node
  scoring:
    combine: all_pass
- id: publishcontent_publishcontent_config_route
  version: '1.0'
  applicable_bundles:
  - publishcontent
  checks:
  - kind: must_contain_any
    values:
    - publishcontent.settings
    - /admin/config/workflow/publishcontent
    - access publish content settings
  scoring:
    combine: all_pass
- id: publishcontent_publishcontent_revision_drush
  version: '1.0'
  applicable_bundles:
  - publishcontent
  checks:
  - kind: must_contain_any
    values:
    - create_revision
    - config:set publishcontent.settings create_revision
  scoring:
    combine: all_pass
- id: publishcontent_publishcontent_own_permission
  version: '1.0'
  applicable_bundles:
  - publishcontent
  checks:
  - kind: must_contain_any
    values:
    - unpublish own node type article
    - unpublish own node type
  scoring:
    combine: all_pass
- id: publishcontent_publishcontent_global_perms
  version: '1.0'
  applicable_bundles:
  - publishcontent
  checks:
  - kind: must_contain_any
    values:
    - publish any content
    - publish editable content
  scoring:
    combine: all_pass
- id: publishcontent_publishcontent_toggle_route
  version: '1.0'
  applicable_bundles:
  - publishcontent
  checks:
  - kind: must_contain_any
    values:
    - entity.node.publish
    - /node/{node}/toggleStatus
    - _csrf_token
    - CSRF
  scoring:
    combine: all_pass
- id: publishcontent_publishcontent_access_service
  version: '1.0'
  applicable_bundles:
  - publishcontent
  checks:
  - kind: must_contain_any
    values:
    - publishcontent.access
    - ->access(
    - PublishContentAccess
  scoring:
    combine: all_pass
- id: publishcontent_publishcontent_hooks
  version: '1.0'
  applicable_bundles:
  - publishcontent
  checks:
  - kind: must_contain_any
    values:
    - hook_publishcontent_publish_access
    - hook_publishcontent_unpublish_access
  scoring:
    combine: all_pass
- id: publishcontent_publishcontent_events
  version: '1.0'
  applicable_bundles:
  - publishcontent
  checks:
  - kind: must_contain_any
    values:
    - PublishContentPublishEvent
    - PublishContentUnpublishEvent
  scoring:
    combine: all_pass
- id: publishcontent_publishcontent_ui_options
  version: '1.0'
  applicable_bundles:
  - publishcontent
  checks:
  - kind: must_contain_any
    values:
    - ui_localtask
    - ui_checkbox
  scoring:
    combine: all_pass
- id: publishcontent_publishcontent_views_field
  version: '1.0'
  applicable_bundles:
  - publishcontent
  checks:
  - kind: must_contain_any
    values:
    - publishcontent_node
    - Publish/Unpublish
    - views field
    - Publish Link
  scoring:
    combine: all_pass
- id: publishcontent_publishcontent_dependencies
  version: '1.0'
  applicable_bundles:
  - publishcontent
  checks:
  - kind: must_contain_any
    values:
    - node
    - core
    - 'no'
    - only
  scoring:
    combine: all_pass
