metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: purge_queues
  version: 2.1.x
  note: 'Purge Queues adds three @PurgeQueue plugins to the Purge module: database_alt (table purge_queue_alt,
    extra type/expression columns), database_unique (dedups via a pre-SELECT findItem on type+expression),
    database_unique_upsert (table purge_queue_upsert, primary key = sha256(type:expression), dedups via
    SQL UPSERT). No admin UI of its own (configure=null), no permissions, no config schema, no Drush.
    The active queue is chosen through Purge''s own selection at admin/config/development/performance/purge
    and stored in config purge.plugins:queue; read/write it via \Drupal::service(''purge.queue'')->getPluginsEnabled()/setPluginsEnabled([...])
    (default ''database''). Medium/hard cases are grounded in that live selection: introspection reads
    which queue is active; execution switches the active queue to one of this module''s plugins, verified
    against the live purge.queue service. Scripts restore the shipped default (database) as baseline.'
questions:
- id: purge_queues-what-and-why
  input: The purge_queues module is installed alongside Purge. What problem does it solve and which queue
    plugins does it add?
  criteria: purge_queues adds extra Purge queue backends that stop the queue filling with duplicate invalidation
    items. It provides database_alt ('Database (extended)', adds type/expression columns), database_unique
    ('Database unique', rejects duplicate type+expression items), and database_unique_upsert ('Database
    unique (upsert)', dedups via an UPSERT keyed on a hash of type:expression for better performance).
  bundle: purge_queues
  rubric_ref: rubric/purge_queues_purge_queues_what_and_why@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: purge_queues-how-to-activate
  input: With purge_queues installed, how do I actually make my Purge site use the deduplicating 'Database
    unique' queue, and where is that choice stored?
  criteria: purge_queues has no settings page of its own; you select the queue through Purge at Configuration
    > Development > Performance > Purge (admin/config/development/performance/purge), choosing 'Database
    unique' or 'Database unique (upsert)'. The choice is stored in Purge config purge.plugins:queue; programmatically
    use \Drupal::service('purge.queue')->setPluginsEnabled(['database_unique']).
  bundle: purge_queues
  rubric_ref: rubric/purge_queues_purge_queues_how_to_activate@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: purge_queues-upsert-mechanism
  input: How does the purge_queues 'database_unique_upsert' queue avoid duplicate items, and what is different
    about its database table compared with the standard database queue?
  criteria: database_unique_upsert uses a SHA-256 hash of the invalidation's type:expression as the row
    primary key (table purge_queue_upsert) and inserts with an SQL UPSERT, so re-queuing the same invalidation
    just overwrites the existing row instead of adding a duplicate. Because the primary key is a string
    hash (not an int), it overrides claimItem/selectPage etc.
  bundle: purge_queues
  rubric_ref: rubric/purge_queues_purge_queues_upsert_mechanism@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: purge_queues-inspect-active-unique
  input: On this Drupal site, inspect the running Purge configuration and tell me which purge queue plugin
    is currently active.
  criteria: 'The active queue is database_unique: purge.plugins:queue is ''database_unique'' (readable
    via \Drupal::service(''purge.queue'')->getPluginsEnabled()).'
  bundle: purge_queues
  rubric_ref: rubric/purge_queues_purge_queues_inspect_active_unique@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/purge_queues-active-unique-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/purge_queues-active-unique-cleanup.sh
- id: purge_queues-inspect-active-upsert
  input: Inspect this site's live Purge setup and state which queue engine is selected. Is it one of the
    purge_queues deduplicating queues?
  criteria: 'The selected queue is database_unique_upsert (the upsert-based deduplicating queue from purge_queues):
    purge.plugins:queue is ''database_unique_upsert''.'
  bundle: purge_queues
  rubric_ref: rubric/purge_queues_purge_queues_inspect_active_upsert@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/purge_queues-active-upsert-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/purge_queues-active-upsert-cleanup.sh
- id: purge_queues-switch-to-unique
