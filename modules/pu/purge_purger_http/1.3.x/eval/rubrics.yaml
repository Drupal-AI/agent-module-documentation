rubrics:
- id: purge_purger_http_purge_purger_http_plugin_ids
  version: '1.0'
  applicable_bundles:
  - purge_purger_http
  checks:
  - kind: must_contain_any
    values:
    - http
    - httpbundled
  scoring:
    combine: all_pass
- id: purge_purger_http_purge_purger_http_settings_defaults
  version: '1.0'
  applicable_bundles:
  - purge_purger_http
  checks:
  - kind: must_contain_any
    values:
    - BAN
    - tag
    - purge_purger_http.settings
  scoring:
    combine: all_pass
- id: purge_purger_http_purge_purger_http_tokens
  version: '1.0'
  applicable_bundles:
  - purge_purger_http
  checks:
  - kind: must_contain_any
    values:
    - token
    - invalidation
    - invalidations
    - '[invalidation:expression]'
  scoring:
    combine: all_pass
- id: purge_purger_http_purge_purger_http_known_method
  version: '1.0'
  applicable_bundles:
  - purge_purger_http
  checks:
  - kind: must_contain_any
    values:
    - PURGE
  scoring:
    combine: all_pass
- id: purge_purger_http_purge_purger_http_known_host
  version: '1.0'
  applicable_bundles:
  - purge_purger_http
  checks:
  - kind: must_contain_any
    values:
    - cache.pphknown.test
  scoring:
    combine: all_pass
- id: purge_purger_http_purge_purger_http_build_purger
  version: '1.0'
  applicable_bundles:
  - purge_purger_http
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
- id: purge_purger_http_purge_purger_http_build_purger_layman
  version: '1.0'
  applicable_bundles:
  - purge_purger_http
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
