metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: purge_purger_http
  version: 1.3.x
  note: Generic HTTP Purger provides two Purge purger plugins - http (HttpPurger, one request per invalidation)
    and httpbundled (HttpBundledPurger, one request per batch) - both multi_instance. Each instance's
    config is a httppurgersettings config entity named purge_purger_http.settings.<id> with fields name,
    invalidationtype (default tag), hostname, port, path, request_method (default BAN), scheme, verify,
    headers, body, body_content_type, timeout, connect_timeout, cooldown_time, max_requests, runtime_measurement,
    http_errors. path/headers/body are token-aware (invalidation group for http, invalidations for httpbundled).
    A httpconfiguration diagnostic check validates enabled purgers. No configure route (edit via Purge
    purgers UI), no permissions, no Drush. Medium/hard cases are grounded in real httppurgersettings config
    entities.
questions:
- id: purge_purger_http-plugin-ids
  input: The purge_purger_http module adds HTTP-based Purge purgers. What are the ids of the two purger
    plugins it provides and how do they differ in how many HTTP requests they send?
  criteria: http (HttpPurger) sends one HTTP request per invalidation instruction; httpbundled (HttpBundledPurger)
    sends a single request for a whole batch of invalidations. Both are multi-instance.
  bundle: purge_purger_http
  rubric_ref: rubric/purge_purger_http_purge_purger_http_plugin_ids@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: purge_purger_http-settings-defaults
  input: For a purge_purger_http HTTP purger, what is the default HTTP request method and the default
    invalidation type, and what is the config object name that stores one instance's settings?
  criteria: Default request_method is BAN and default invalidationtype is tag. Each instance is stored
    in the httppurgersettings config entity purge_purger_http.settings.<instance_id>.
  bundle: purge_purger_http
  rubric_ref: rubric/purge_purger_http_purge_purger_http_settings_defaults@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: purge_purger_http-tokens
  input: In purge_purger_http, how do you make the request path, a header value, or the body vary per
    cache-tag/URL being purged? Which token group does the single-item http purger expose versus the bundled
    one?
  criteria: path, header values and body are run through Purge's token service, so you embed tokens (e.g.
    [invalidation:expression]). The http purger exposes the 'invalidation' token group (one item), while
    httpbundled exposes the 'invalidations' group (the whole batch).
  bundle: purge_purger_http
  rubric_ref: rubric/purge_purger_http_purge_purger_http_tokens@1.0
  tags:
  - mode:recipe
  - difficulty:easy
