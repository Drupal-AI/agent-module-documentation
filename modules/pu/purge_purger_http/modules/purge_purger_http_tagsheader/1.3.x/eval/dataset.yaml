metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: purge_purger_http_tagsheader
  version: 1.3.x
  note: Trivial submodule of purge_purger_http. Provides one Purge TagsHeader plugin PurgeCacheTagsHeader
    (@PurgeTagsHeader id=purge_tagsheader, header_name=Purge-Cache-Tags), extending TagsHeaderBase with
    an empty body. Purge core's tagsheaders registry attaches the header to cacheable responses. Depends
    only on purge. No config, form, route, permission, schema or Drush - enabling the module is the entire
    setup. Introspection reads the live tagsheader plugin definition (header name / plugin id) via plugin.manager.purge.tagsheader;
    execution enables the module so the Purge-Cache-Tags header plugin is registered, verified against
    live module + plugin state.
questions:
- id: purge_purger_http_tagsheader-header-name
  input: What response header does the purge_purger_http_tagsheader submodule make Drupal emit, and what
    is it for?
  criteria: It emits the Purge-Cache-Tags response header listing each response's Drupal cache tags, so
    a tag-aware reverse proxy or CDN can invalidate cached objects by cache tag.
  bundle: purge_purger_http_tagsheader
  rubric_ref: rubric/purge_purger_http_tagsheader_purge_purger_http_tagsheader_header_name@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: purge_purger_http_tagsheader-plugin
  input: Which Purge plugin type and plugin id does purge_purger_http_tagsheader provide, and does it
    have any configuration?
  criteria: It provides a Purge TagsHeader plugin (@PurgeTagsHeader) with id purge_tagsheader (class PurgeCacheTagsHeader
    extends TagsHeaderBase). It has no configuration - enabling the module is the whole setup.
  bundle: purge_purger_http_tagsheader
  rubric_ref: rubric/purge_purger_http_tagsheader_purge_purger_http_tagsheader_plugin@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: purge_purger_http_tagsheader-when-needed
  input: When do you need the purge_purger_http_tagsheader module, and how does it fit with the Generic
    HTTP Purger?
  criteria: You only need it for custom setups under your own control, where a reverse proxy/CDN reads
    the Purge-Cache-Tags header to remember which tags a cached object depends on; the parent Generic
    HTTP Purger then sends the requests (e.g. a BAN) that invalidate those tags.
  bundle: purge_purger_http_tagsheader
  rubric_ref: rubric/purge_purger_http_tagsheader_purge_purger_http_tagsheader_when_needed@1.0
  tags:
  - mode:recipe
  - difficulty:easy
