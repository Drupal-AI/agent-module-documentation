metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: purge_file
  version: 1.3.x
  note: Purge File auto-invalidates file entity URLs/paths through the Purge module on file insert/update/delete.
    It defines a settings config object, a Purge processor and queuer, and one alter hook. Cases are `recipe`
    (response-graded) — they probe documented facts an agent would otherwise read source to answer; no
    site mutation.
questions:
- id: purge-file-prerequisites
  input: On a Drupal 11 site, what must already be enabled/configured before Purge File can actually purge
    anything?
  criteria: The Purge module must be enabled, plus at least one purger that supports a URL-oriented invalidation
    type (url, wildcardurl, path, or wildcardpath) and at least one purge processor.
  bundle: purge_file
  rubric_ref: rubric/purge_file_purge_file_prerequisites@1.0
  tags:
  - mode:recipe
- id: purge-file-config-route
  input: What is the settings route name and admin path for Purge File, and which permission gates it?
  criteria: Route purge_file.settings at /admin/config/development/performance/purge-file, gated by the
    core 'administer site configuration' permission (the module defines no permissions of its own).
  bundle: purge_file
  rubric_ref: rubric/purge_file_purge_file_config_route@1.0
  tags:
  - mode:recipe
- id: purge-file-workflow-key
  input: Which config key on purge_file.settings decides whether invalidations run immediately or go through
    the Purge queue, and what are its values?
  criteria: 'The ''workflow'' key on purge_file.settings: ''immediate'' uses the module''s immediate processor
    (purge_file_immediate_processor); ''queue'' adds invalidations via the purge_file_queuer for later
    processing (e.g. cron).'
  bundle: purge_file
  rubric_ref: rubric/purge_file_purge_file_workflow_key@1.0
  tags:
  - mode:recipe
- id: purge-file-invalidation-type
  input: How do I make Purge File append a wildcard so all query-string variants of a file URL are purged?
  criteria: Set invalidation_type to wildcardurl (or wildcardpath) on purge_file.settings; when that type
    is enabled by a purger the module appends '*' to each purge URL. (The old boolean 'wildcard' key was
    replaced by invalidation_type in update 10002.)
  bundle: purge_file
  rubric_ref: rubric/purge_file_purge_file_invalidation_type@1.0
  tags:
  - mode:recipe
- id: purge-file-update-triggers
  input: When a file entity is updated, under what condition does Purge File actually purge, and does
    it purge the old URL?
  criteria: On update it purges only if the file's URI or size changed; if the new file URL differs from
    the original's URL it also purges the original file's URL. Temporary-stream (temporary://) files are
    skipped.
  bundle: purge_file
  rubric_ref: rubric/purge_file_purge_file_update_triggers@1.0
  tags:
  - mode:recipe
- id: purge-file-base-urls-hook
  input: In a custom module I want to add an extra CDN domain to the URLs Purge File invalidates for each
    file. Which hook do I implement?
  criteria: Implement hook_purge_file_base_urls_alter(array &$base_urls, FileInterface $file) and append
    your domain to $base_urls (affects the url/wildcardurl invalidation types).
  bundle: purge_file
  rubric_ref: rubric/purge_file_purge_file_base_urls_hook@1.0
  tags:
  - mode:recipe
- id: purge-file-base-urls-config
  input: My site's public front URL differs from the back-office URL. How do I tell Purge File which host(s)
    to purge?
  criteria: Set the 'base_urls' key on purge_file.settings to a comma-separated list of base URLs. If
    left empty the module uses the current request's scheme+host+base path. Used only for url/wildcardurl
    types.
  bundle: purge_file
  rubric_ref: rubric/purge_file_purge_file_base_urls_config@1.0
  tags:
  - mode:recipe
