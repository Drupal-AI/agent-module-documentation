rubrics:
- id: purge_file_purge_file_prerequisites
  version: '1.0'
  applicable_bundles:
  - purge_file
  checks:
  - kind: must_contain_any
    values:
    - purge
    - purger
    - processor
  scoring:
    combine: all_pass
- id: purge_file_purge_file_config_route
  version: '1.0'
  applicable_bundles:
  - purge_file
  checks:
  - kind: must_contain_any
    values:
    - purge_file.settings
    - /admin/config/development/performance/purge-file
  scoring:
    combine: all_pass
- id: purge_file_purge_file_workflow_key
  version: '1.0'
  applicable_bundles:
  - purge_file
  checks:
  - kind: must_contain_any
    values:
    - workflow
  scoring:
    combine: all_pass
- id: purge_file_purge_file_invalidation_type
  version: '1.0'
  applicable_bundles:
  - purge_file
  checks:
  - kind: must_contain_any
    values:
    - invalidation_type
    - wildcardurl
    - wildcardpath
  scoring:
    combine: all_pass
- id: purge_file_purge_file_update_triggers
  version: '1.0'
  applicable_bundles:
  - purge_file
  checks:
  - kind: must_contain_any
    values:
    - uri
    - size
  scoring:
    combine: all_pass
- id: purge_file_purge_file_base_urls_hook
  version: '1.0'
  applicable_bundles:
  - purge_file
  checks:
  - kind: must_contain_any
    values:
    - hook_purge_file_base_urls_alter
    - purge_file_base_urls_alter
  scoring:
    combine: all_pass
- id: purge_file_purge_file_base_urls_config
  version: '1.0'
  applicable_bundles:
  - purge_file
  checks:
  - kind: must_contain_any
    values:
    - base_urls
  scoring:
    combine: all_pass
