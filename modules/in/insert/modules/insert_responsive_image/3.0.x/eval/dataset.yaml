metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: insert_responsive_image
  version: 3.0.x
  note: 'insert_responsive_image is an experimental style-provider submodule of Insert with NO config,
    route, permissions, or per-widget setting of its own. hook_insert_styles (image type) adds one insert
    style per ResponsiveImageStyle entity, named responsive_image__<style-id> (label ''Responsive: <id>'').
    hook_insert_variables (run after the parent''s via hook_module_implements_alter) calls core template_preprocess_responsive_image()
    to build srcset/sizes and resolves the fallback image style URL. To use it you create a Responsive
    Image style then enable responsive_image__<id> in an image field widget''s Insert settings (parent''s
    content.<field>.third_party_settings.insert.styles). Medium/hard cases create a namespaced Responsive
    Image style (insert_ri_demo) and an image field on Article (two-save so image_image sticks past lightning_media_image)
    and check the responsive insert style key in the parent''s third_party_settings.insert.styles.'
questions:
- id: insert_responsive_image-styles-added
  input: The Drupal insert_responsive_image submodule lets editors insert responsive images. What insert
    'styles' does it add and how are they named, and does it have any settings of its own?
  criteria: 'It implements hook_insert_styles for the image insert type and adds one insert style per
    Responsive Image style, named responsive_image__<style-id> (label ''Responsive: <id>''). It has no
    config object, route, permissions, or per-widget setting of its own; the responsive styles simply
    become selectable in the parent Insert module''s per-widget styles list.'
  bundle: insert_responsive_image
  rubric_ref: rubric/insert_responsive_image_insert_responsive_image_styles_added@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: insert_responsive_image-how-to-use
  input: How do I actually make a responsive image insertable on a Drupal image field using insert_responsive_image,
    and where does the enabled choice end up stored?
  criteria: 'Create/enable a Responsive Image style, then on the image field''s Manage form display open
    the Insert settings and tick the Responsive: <id> (responsive_image__<id>) style. The choice is stored
    by the parent Insert module in content.<field>.third_party_settings.insert.styles on the entity_form_display
    component.'
  bundle: insert_responsive_image
  rubric_ref: rubric/insert_responsive_image_insert_responsive_image_how_to_use@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: insert_responsive_image-markup
  input: When inserting a responsive image with insert_responsive_image, which core function builds the
    responsive markup and which two HTML attributes does it add to the inserted <img>?
  criteria: Its hook_insert_variables calls core template_preprocess_responsive_image() to generate the
    srcset and sizes attributes (using the Responsive Image style's mappings), resolves the URL from the
    style's fallback image style, and merges those attributes into the inserted <img>.
  bundle: insert_responsive_image
  rubric_ref: rubric/insert_responsive_image_insert_responsive_image_markup@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: insert_responsive_image-known-field
  input: On this Drupal site, the Article content type has an image field whose Insert settings enable
    a responsive-image insert style. Inspect the live default form display for Article and give the field
    machine name and the exact responsive insert style key that is enabled.
  criteria: The field is field_insert_ri (image_image widget); its component's third_party_settings.insert.styles
    contains responsive_image__insert_ri_demo (the responsive insert style for the Responsive Image style
    'insert_ri_demo'), which is also its default insert style.
  bundle: insert_responsive_image
  rubric_ref: rubric/insert_responsive_image_insert_responsive_image_known_field@1.0
  tags:
  - mode:introspection
  - difficulty:medium
