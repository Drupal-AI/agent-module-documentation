rubrics:
- id: insert_colorbox_insert_colorbox_config_object
  version: '1.0'
  applicable_bundles:
  - insert_colorbox
  checks:
  - kind: must_contain_any
    values:
    - insert_colorbox.config
    - style
    - gallery
    - Insert settings
  scoring:
    combine: all_pass
- id: insert_colorbox_insert_colorbox_gallery_modes
  version: '1.0'
  applicable_bundles:
  - insert_colorbox
  checks:
  - kind: must_contain_any
    values:
    - post
    - page
    - field_post
    - field_page
    - no gallery
  scoring:
    combine: all_pass
- id: insert_colorbox_insert_colorbox_styles_added
  version: '1.0'
  applicable_bundles:
  - insert_colorbox
  checks:
  - kind: must_contain_any
    values:
    - colorbox__
    - hook_insert_styles
    - image style
    - insert style
  scoring:
    combine: all_pass
- id: insert_colorbox_insert_colorbox_known_config
  version: '1.0'
  applicable_bundles:
  - insert_colorbox
  checks:
  - kind: must_contain_any
    values:
    - page
    - thumbnail
  scoring:
    combine: all_pass
- id: insert_colorbox_insert_colorbox_set_gallery
  version: '1.0'
  applicable_bundles:
  - insert_colorbox
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
- id: insert_colorbox_insert_colorbox_known_style
  version: '1.0'
  applicable_bundles:
  - insert_colorbox
  checks:
  - kind: must_contain_any
    values:
    - field_page
    - medium
  scoring:
    combine: all_pass
- id: insert_colorbox_insert_colorbox_set_style
  version: '1.0'
  applicable_bundles:
  - insert_colorbox
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
