metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: insert_colorbox
  version: 3.0.x
  note: 'insert_colorbox is a submodule of Insert. It adds colorbox__<image-style> insert styles (hook_insert_styles,
    image type) and renders them via hook_insert_render + the insert_colorbox_image theme hook. Its persistent
    state is the config object insert_colorbox.config (shipped defaults style: image, gallery: ''0''),
    whose two fields (style, gallery) are injected into the shared Insert settings form (route insert.config,
    /admin/config/content/insert, permission ''administer filters'') via hook_insert_config_form. style
    = image style shown inside the colorbox (an image style name, ''image'' for original, or ''0'' to
    reuse the widget ''Link image to'' setting). gallery = post | page | field_post | field_page | 0 (no
    gallery). Depends on colorbox + insert. Medium/hard cases are grounded in the real insert_colorbox.config
    object read/written via drush; scripts restore shipped defaults explicitly.'
questions:
- id: insert_colorbox-config-object
  input: The Drupal insert_colorbox submodule has no dedicated settings page. Which config object stores
    its two settings, what are those two keys, and where in the admin UI do you edit them?
  criteria: Settings live in the config object insert_colorbox.config with keys 'style' (image style shown
    inside the colorbox) and 'gallery' (gallery grouping mode). They are edited on the shared Insert settings
    form at /admin/config/content/insert (an Insert Colorbox fieldset injected via hook_insert_config_form).
  bundle: insert_colorbox
  rubric_ref: rubric/insert_colorbox_insert_colorbox_config_object@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: insert_colorbox-gallery-modes
  input: What are the valid values of the insert_colorbox 'gallery' setting, and what does each do for
    images inserted into body text?
  criteria: 'gallery accepts: post (one Colorbox gallery per node/post), page (one gallery for the whole
    page), field_post (per field within a post), field_page (per field on the page), or 0 (no gallery,
    each image opens alone).'
  bundle: insert_colorbox
  rubric_ref: rubric/insert_colorbox_insert_colorbox_gallery_modes@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: insert_colorbox-styles-added
  input: How does insert_colorbox make its lightbox option show up as an insert 'style' in a Drupal image
    field's Insert settings, and how are those style names named?
  criteria: insert_colorbox implements hook_insert_styles for the image insert type and adds one insert
    style per image style named colorbox__<image-style> (label 'Colorbox <style>'). Selecting one in a
    field widget's Insert styles makes that Colorbox option available when inserting.
  bundle: insert_colorbox
  rubric_ref: rubric/insert_colorbox_insert_colorbox_styles_added@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: insert_colorbox-known-config
  input: On this Drupal site, insert_colorbox has been configured with a non-default gallery grouping
    and colorbox image style. Inspect the live configuration and report the current values of the gallery
    mode and the image style shown inside the colorbox.
  criteria: insert_colorbox.config currently has gallery = page (one Colorbox gallery for the whole page)
    and style = thumbnail (the thumbnail image style is shown inside the colorbox).
  bundle: insert_colorbox
  rubric_ref: rubric/insert_colorbox_insert_colorbox_known_config@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/insert_colorbox-known-config-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/insert_colorbox-known-config-cleanup.sh
- id: insert_colorbox-set-gallery
  input: On this Drupal site, configure insert_colorbox so that images inserted via Colorbox are grouped
    into one gallery per post (node). Apply the change to the live site.
  criteria: Set insert_colorbox.config gallery = post (e.g. drush cset insert_colorbox.config gallery
    post -y, or choose 'Per post gallery' in the Insert Colorbox fieldset on the Insert settings form).
  bundle: insert_colorbox
  rubric_ref: rubric/insert_colorbox_insert_colorbox_set_gallery@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/insert_colorbox-set-gallery-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/insert_colorbox-set-gallery-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/insert_colorbox-set-gallery-verify.sh
- id: insert_colorbox-known-style
  input: On this Drupal site, insert_colorbox has a non-default gallery grouping and colorbox image style.
    Inspect the live configuration and report the current gallery mode and the image style shown inside
    the colorbox.
  criteria: insert_colorbox.config currently has gallery = field_page (one gallery per field on the whole
    page) and style = medium (the medium image style is shown inside the colorbox). Read with drush cget
    insert_colorbox.config.
  bundle: insert_colorbox
  rubric_ref: rubric/insert_colorbox_insert_colorbox_known_style@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/insert_colorbox-known-style-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/insert_colorbox-known-style-cleanup.sh
- id: insert_colorbox-set-style
  input: On this Drupal site, configure insert_colorbox so that the image shown inside the Colorbox lightbox
    is rendered with the 'large' image style. Apply the change to the live site.
  criteria: Set insert_colorbox.config style = large (e.g. drush cset insert_colorbox.config style large
    -y, or choose the 'large' image style in the Insert Colorbox fieldset on the Insert settings form).
  bundle: insert_colorbox
  rubric_ref: rubric/insert_colorbox_insert_colorbox_set_style@1.0
