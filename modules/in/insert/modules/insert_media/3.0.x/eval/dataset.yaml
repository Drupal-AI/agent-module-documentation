metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: insert_media
  version: 3.0.x
  note: insert_media is an experimental submodule of Insert. It registers a new Insert type 'media' for
    the core media_library_widget (hook_insert_widgets -> ['media' => ['media_library_widget']]). Its
    only persistent state is a per-widget third_party_settings.insert_media on an entity_form_display
    component, with keys view_modes (map of enabled media view modes; empty => disabled) and default (default
    view mode, shipped default 'full'). The insert 'styles' are the media entity view modes (hook_insert_styles
    for type media). No config object, route, or permissions. Medium/hard cases are grounded in a real
    media entity_reference field on Article using media_library_widget with third_party_settings.insert_media.
questions:
- id: insert_media-what-widget
  input: The Drupal insert_media submodule lets editors insert media-library items into a text area. Which
    field widget must a field use for insert_media to attach to it, and what does the insert 'style' correspond
    to for media?
  criteria: insert_media registers only the core media_library_widget as an Insert source (hook_insert_widgets
    => ['media' => ['media_library_widget']]). The selectable insert 'styles' for media are the media
    entity's view modes, so you pick which view modes are insertable and a default view mode.
  bundle: insert_media
  rubric_ref: rubric/insert_media_insert_media_what_widget@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: insert_media-where-stored
  input: insert_media has no settings page. On a Drupal site, how do I turn it on for a media reference
    field and where is that choice stored, including the default view mode key?
  criteria: 'There is no configure route. On the field''s Manage form display set the widget to Media
    library, open the Insert Media details, tick view modes and a default. It is stored as third_party_settings.insert_media
    on the form-display component: content.<field>.third_party_settings.insert_media with keys view_modes
    (map) and default (default view mode, shipped default ''full'').'
  bundle: insert_media
  rubric_ref: rubric/insert_media_insert_media_where_stored@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: insert_media-default-view-mode
  input: For the Drupal insert_media submodule, what is the shipped default view mode used when inserting
    media, and what happens if no view modes are selected in a field's Insert Media settings?
  criteria: The shipped default view mode is 'full' (INSERT_MEDIA_DEFAULT_SETTINGS default). If view_modes
    is empty, Insert Media is disabled for that field and no insert button/functionality is offered.
  bundle: insert_media
  rubric_ref: rubric/insert_media_insert_media_default_view_mode@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: insert_media-known-field
  input: On this Drupal site, the Article content type has a media reference field whose Media library
    widget has insert_media enabled. Inspect the live default form display for Article and give the field's
    machine name and its default insert view mode.
  criteria: 'The field is field_insert_media: in core.entity_form_display.node.article.default its media_library_widget
    component has third_party_settings.insert_media with view_modes {full, thumbnail} and default = full.'
  bundle: insert_media
  rubric_ref: rubric/insert_media_insert_media_known_field@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/insert_media-known-field-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/insert_media-known-field-cleanup.sh
- id: insert_media-enable
  input: On this Drupal site, the Article content type has a media reference field field_insert_mtask
    using the Media library (media_library_widget) widget. Using the insert_media submodule, configure
    the default form display so this field lets editors insert the referenced media in the 'full' view
    mode. Apply the change to the live site.
  criteria: In core.entity_form_display.node.article.default the field_insert_mtask media_library_widget
    component gets third_party_settings.insert_media.view_modes containing 'full' (e.g. set the component's
    third_party_settings.insert_media.view_modes = ['full' => 'full'] and save, or tick the 'full' view
    mode under Insert Media on the widget in Manage form display).
  bundle: insert_media
  rubric_ref: rubric/insert_media_insert_media_enable@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/insert_media-enable-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/insert_media-enable-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/insert_media-enable-verify.sh
- id: insert_media-known-default
  input: On this Drupal site, the Article content type has a media reference field field_insert_media2
    whose Media library widget has insert_media enabled. Inspect the live default form display for Article
    and report the default media view mode that insert_media will use when inserting from that field.
  criteria: For field_insert_media2 the media_library_widget component's third_party_settings.insert_media
    has default = thumbnail (and view_modes = {thumbnail}). Read core.entity_form_display.node.article.default
    content.field_insert_media2.
  bundle: insert_media
  rubric_ref: rubric/insert_media_insert_media_known_default@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/insert_media-known-default-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/insert_media-known-default-cleanup.sh
- id: insert_media-enable-thumbnail
  input: On this Drupal site, the Article content type has a media reference field field_insert_mtask2
    using the Media library (media_library_widget) widget. Using the insert_media submodule, configure
    the default form display so this field lets editors insert the referenced media in the 'thumbnail'
    view mode. Apply the change to the live site.
  criteria: In core.entity_form_display.node.article.default the field_insert_mtask2 media_library_widget
    component gets third_party_settings.insert_media.view_modes containing 'thumbnail' (set view_modes
    = ['thumbnail' => 'thumbnail'] and save, or tick the 'thumbnail' view mode under Insert Media on the
    widget in Manage form display).
  bundle: insert_media
  rubric_ref: rubric/insert_media_insert_media_enable_thumbnail@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/insert_media-enable-thumb-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/insert_media-enable-thumb-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/insert_media-enable-thumb-verify.sh
