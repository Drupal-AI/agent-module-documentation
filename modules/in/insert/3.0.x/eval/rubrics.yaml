rubrics:
- id: insert_insert_what_and_where
  version: '1.0'
  applicable_bundles:
  - insert
  checks:
  - kind: must_contain_any
    values:
    - form display
    - form-display
    - Manage form display
    - third_party_settings
    - third party setting
    - entity_form_display
  scoring:
    combine: all_pass
- id: insert_insert_source_widgets
  version: '1.0'
  applicable_bundles:
  - insert
  checks:
  - kind: must_contain_any
    values:
    - image_image
    - file_generic
    - insert.config
  scoring:
    combine: all_pass
- id: insert_insert_styles_setting
  version: '1.0'
  applicable_bundles:
  - insert
  checks:
  - kind: must_contain_any
    values:
    - styles
    - insert__auto
    - third_party_settings
  scoring:
    combine: all_pass
- id: insert_insert_known_field
  version: '1.0'
  applicable_bundles:
  - insert
  checks:
  - kind: must_contain_any
    values:
    - field_insert_known
  scoring:
    combine: all_pass
- id: insert_insert_enabled_vs_not
  version: '1.0'
  applicable_bundles:
  - insert
  checks:
  - kind: must_contain_any
    values:
    - field_insert_on
  scoring:
    combine: all_pass
- id: insert_insert_enable_file
  version: '1.0'
  applicable_bundles:
  - insert
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
- id: insert_insert_enable_image
  version: '1.0'
  applicable_bundles:
  - insert
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
