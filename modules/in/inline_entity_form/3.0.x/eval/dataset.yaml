metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: inline_entity_form
  version: 3.0.x
  note: IEF has no admin config page, no permissions, and no Drush commands; it is configured per field
    on Manage form display and consumed in code via a render element/handler. All cases are `recipe` (response-graded),
    not `execution` (live-state).
questions:
- id: ief-widget-machine-names
  input: On a Drupal 11 site I have an entity_reference field on a parent bundle and I want editors to
    manage the referenced entities inline. Inline Entity Form ships two field widgets. Give the exact
    machine names of both widgets and say in one line which is for a single referenced entity vs. multiple.
  criteria: Simple widget `inline_entity_form_simple` (single referenced entity, embedded directly) and
    Complex widget `inline_entity_form_complex` (multiple entities in a drag-sortable table with Add new
    / Add existing).
  bundle: inline_entity_form
  rubric_ref: rubric/inline_entity_form_ief_widget_machine_names@1.0
  tags:
  - mode:recipe
- id: ief-attach-to-form-display
  input: Where and how do I turn on Inline Entity Form for an entity_reference field? There is no settings
    page for the module — tell me which admin tab/config I use and that IEF widgets support entity_reference
    and entity_reference_revisions fields.
  criteria: There is no module settings page; you enable it per field on the parent bundle's Manage form
    display tab (/admin/.../form-display) by choosing the Simple or Complex IEF widget. Widgets support
    entity_reference and entity_reference_revisions field types.
  bundle: inline_entity_form
  rubric_ref: rubric/inline_entity_form_ief_attach_to_form_display@1.0
  tags:
  - mode:recipe
- id: ief-render-element
  input: 'In a custom Drupal 11 form I want to embed a single entity''s create/edit form inline using
    Inline Entity Form''s render element. What is the render element #type and the PHP class (namespace)
    that provides it? Show a minimal render-array snippet.'
  criteria: 'Use `#type => ''inline_entity_form''`, provided by Drupal\inline_entity_form\Element\InlineEntityForm,
    with keys like #entity_type, #bundle, #default_value, #form_mode, #save_entity.'
  bundle: inline_entity_form
  rubric_ref: rubric/inline_entity_form_ief_render_element@1.0
  tags:
  - mode:recipe
- id: ief-access-built-entity
  input: I added an `inline_entity_form` element at $form['article'] to a custom form. In my submit callback,
    how do I get the entity that IEF built? Note the gotcha about $form_state->getValue().
  criteria: 'Read it from the element: $form[''article''][''#entity'']. It is NOT available via $form_state->getValue(''article'')
    (core limitation).'
  bundle: inline_entity_form
  rubric_ref: rubric/inline_entity_form_ief_access_built_entity@1.0
  tags:
  - mode:recipe
- id: ief-inline-form-handler
  input: How does Inline Entity Form know how to build the embedded form for an arbitrary entity type?
    Name the entity handler key IEF registers, the default handler class (and the node-specific one),
    and the interface. How would I get the handler in code for the `node` entity type?
  criteria: IEF registers an `inline_form` entity handler on every entity type (EntityInlineForm by default,
    NodeInlineForm for nodes), interface Drupal\inline_entity_form\InlineFormInterface. Get it via \Drupal::entityTypeManager()->getHandler('node',
    'inline_form').
  bundle: inline_entity_form
  rubric_ref: rubric/inline_entity_form_ief_inline_form_handler@1.0
  tags:
  - mode:recipe
- id: ief-allow-new-existing
  input: 'I want a create-only Inline Entity Form workflow: editors can add brand-new referenced entities
    but must NOT be able to attach existing ones. Which two widget settings control this, and how do I
    set them?'
  criteria: Set allow_new = TRUE (allow creating new entities) and allow_existing = FALSE (disable the
    autocomplete 'Add existing' form). These are widget settings stored in the form display config.
  bundle: inline_entity_form
  rubric_ref: rubric/inline_entity_form_ief_allow_new_existing@1.0
  tags:
  - mode:recipe
- id: ief-table-fields-hook
  input: In the Complex widget's referenced-entities table I need to add a custom column. Which Inline
    Entity Form alter hook adds/removes/reweights columns, and what shape does each field entry take (type/label/weight)?
    Show a short implementation.
  criteria: Implement hook_inline_entity_form_table_fields_alter(&$fields, $context); each field is an
    array with type ('label'|'field'|'callback'), label, and weight. $context provides parent_entity_type,
    parent_bundle, field_name, entity_type, allowed_bundles.
  bundle: inline_entity_form
  rubric_ref: rubric/inline_entity_form_ief_table_fields_hook@1.0
  tags:
  - mode:recipe
- id: ief-table-template
  input: I want to override the markup of Inline Entity Form's referenced-entities table in my theme.
    Which theme hook / Twig template do I copy, and which variable does the template receive?
  criteria: Copy the inline_entity_form_entity_table theme hook's template templates/inline-entity-form-entity-table.html.twig
    into your theme; it receives the assembled {{ table }} render array. To change columns rather than
    markup, use hook_inline_entity_form_table_fields_alter() instead.
  bundle: inline_entity_form
  rubric_ref: rubric/inline_entity_form_ief_table_template@1.0
  tags:
  - mode:recipe
