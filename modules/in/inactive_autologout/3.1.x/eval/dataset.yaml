metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: inactive_autologout
  version: 3.1.x
  note: 'Inactive Autologout is driven entirely by the inactive_autologout.settings config object: enable
    (0/1), timeout (seconds string, min 120, sent to JS as *1000 ms), role_based_timeout (0/1), modal_title,
    modal_text (@count is the countdown placeholder), plus dynamic <role_id> and <role_id>_timeout keys.
    Settings form route inactive_autologout.admin_settings_form at /admin/config/people/autologoutsettings,
    permission ''administer inactiveautologout''. hook_page_attachments attaches the user_autologout library
    only when enable=1 and the user is authenticated. Routes /autologout (user_logout + redirect), /autologout_active
    and /autologout_gettimestamp (AJAX activity tracking). Shipped defaults: timeout ''120'', enable 0,
    role_based_timeout 0, modal_title ''Session Expiring''. Medium cases read back the live enable/timeout
    and modal title; hard cases enable it with a 600s timeout and customise the warning modal title, verified
    against live config.'
questions:
- id: ial-what-it-does
  input: How do I turn on automatic logout of idle users with the inactive_autologout Drupal module, and
    what is the minimum allowed timeout?
  criteria: 'Enable the feature on the settings form at /admin/config/people/autologoutsettings (config
    inactive_autologout.settings: enable=1) and set the default idle Timeout in seconds. The timeout must
    be 120 seconds or greater (form-validated).'
  bundle: inactive_autologout
  rubric_ref: rubric/inactive_autologout_ial_what_it_does@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: ial-modal-placeholder
  input: In inactive_autologout, the warning modal shows a countdown before logging the user out. Which
    config keys hold the modal's title and text, and what placeholder inserts the live countdown number?
  criteria: modal_title and modal_text (both in inactive_autologout.settings). Use @count in modal_text
    as the placeholder for the live countdown number (HTML is allowed).
  bundle: inactive_autologout
  rubric_ref: rubric/inactive_autologout_ial_modal_placeholder@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: ial-role-based
  input: Can inactive_autologout give different idle timeouts to different roles? How is that configured?
  criteria: Yes. Turn on role_based_timeout, then enable the specific role (a <role_id> flag) and set
    its <role_id>_timeout in seconds. At runtime the module uses the first enabled role's timeout for
    the user instead of the default timeout.
  bundle: inactive_autologout
  rubric_ref: rubric/inactive_autologout_ial_role_based@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: ial-current-state
  input: On this Drupal site, is inactive_autologout currently enabled, and what is the default inactivity
    timeout in seconds? Inspect the live configuration to answer.
  criteria: It is enabled (enable=1) with a default timeout of 300 seconds, per inactive_autologout.settings.
  bundle: inactive_autologout
  rubric_ref: rubric/inactive_autologout_ial_current_state@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/inactive_autologout-enabled-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/inactive_autologout-enabled-cleanup.sh
- id: ial-modal-title
  input: On this Drupal site, what title text is configured for the inactive_autologout session-expiry
    warning modal? Inspect the live configuration to answer.
  criteria: The modal title is 'Idle timeout warning ABC' (inactive_autologout.settings:modal_title).
  bundle: inactive_autologout
  rubric_ref: rubric/inactive_autologout_ial_modal_title@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/inactive_autologout-modal-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/inactive_autologout-modal-cleanup.sh
- id: ial-enable-with-timeout
  input: On this Drupal site, use inactive_autologout to enable automatic logout of idle users and set
    the default inactivity timeout to 600 seconds. Apply the change to the live site.
  criteria: inactive_autologout.settings:enable = 1 and timeout = 600 (via the settings form at /admin/config/people/autologoutsettings
    or drush cset).
  bundle: inactive_autologout
  rubric_ref: rubric/inactive_autologout_ial_enable_with_timeout@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/inactive_autologout-enable-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/inactive_autologout-enable-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/inactive_autologout-enable-verify.sh
- id: ial-customise-modal
  input: On this Drupal site, change the inactive_autologout warning modal's title to exactly 'Your session
    is about to expire', keeping the @count countdown placeholder in the modal text. Apply the change
    to the live site.
  criteria: inactive_autologout.settings:modal_title = 'Your session is about to expire' and modal_text
    still contains @count.
  bundle: inactive_autologout
  rubric_ref: rubric/inactive_autologout_ial_customise_modal@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/inactive_autologout-modal-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/inactive_autologout-modal-cleanup-hard.sh
    verify: agent-module-documentation/evaluation/verify/inactive_autologout-modal-verify.sh
