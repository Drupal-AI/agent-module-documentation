rubrics:
- id: inactive_autologout_ial_what_it_does
  version: '1.0'
  applicable_bundles:
  - inactive_autologout
  checks:
  - kind: must_contain_any
    values:
    - enable
    - timeout
    - '120'
    - autologoutsettings
  scoring:
    combine: all_pass
- id: inactive_autologout_ial_modal_placeholder
  version: '1.0'
  applicable_bundles:
  - inactive_autologout
  checks:
  - kind: must_contain_any
    values:
    - modal_title
    - modal_text
    - '@count'
  scoring:
    combine: all_pass
- id: inactive_autologout_ial_role_based
  version: '1.0'
  applicable_bundles:
  - inactive_autologout
  checks:
  - kind: must_contain_any
    values:
    - role_based_timeout
    - role
    - per-role
    - role based
  scoring:
    combine: all_pass
- id: inactive_autologout_ial_current_state
  version: '1.0'
  applicable_bundles:
  - inactive_autologout
  checks:
  - kind: must_contain_any
    values:
    - '300'
  scoring:
    combine: all_pass
- id: inactive_autologout_ial_modal_title
  version: '1.0'
  applicable_bundles:
  - inactive_autologout
  checks:
  - kind: must_contain_any
    values:
    - Idle timeout warning ABC
  scoring:
    combine: all_pass
- id: inactive_autologout_ial_enable_with_timeout
  version: '1.0'
  applicable_bundles:
  - inactive_autologout
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
- id: inactive_autologout_ial_customise_modal
  version: '1.0'
  applicable_bundles:
  - inactive_autologout
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
