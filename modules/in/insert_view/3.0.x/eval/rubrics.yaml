rubrics:
- id: insert_view_insert_view_tag_syntax
  version: '1.0'
  applicable_bundles:
  - insert_view
  checks:
  - kind: must_contain_any
    values:
    - '[view:'
    - view:my_view=block_1
  scoring:
    combine: all_pass
- id: insert_view_insert_view_enable_where
  version: '1.0'
  applicable_bundles:
  - insert_view
  checks:
  - kind: must_contain_any
    values:
    - text format
    - filter.format
    - Text formats
  scoring:
    combine: all_pass
- id: insert_view_insert_view_security
  version: '1.0'
  applicable_bundles:
  - insert_view
  checks:
  - kind: must_contain_any
    values:
    - access
    - trusted
    - every view
    - default display
  scoring:
    combine: all_pass
- id: insert_view_insert_view_known_format
  version: '1.0'
  applicable_bundles:
  - insert_view
  checks:
  - kind: must_contain_any
    values:
    - iv_probe
  scoring:
    combine: all_pass
- id: insert_view_insert_view_known_tag
  version: '1.0'
  applicable_bundles:
  - insert_view
  checks:
  - kind: must_contain_any
    values:
    - archive
  scoring:
    combine: all_pass
- id: insert_view_insert_view_enable_on_format
  version: '1.0'
  applicable_bundles:
  - insert_view
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
- id: insert_view_insert_view_embed_node
  version: '1.0'
  applicable_bundles:
  - insert_view
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
