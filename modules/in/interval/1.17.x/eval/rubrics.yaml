rubrics:
- id: interval_interval_field_and_formatters
  version: '1.0'
  applicable_bundles:
  - interval
  checks:
  - kind: must_contain_any
    values:
    - interval_default
    - interval_php
    - interval_raw
  scoring:
    combine: all_pass
- id: interval_interval_custom_period
  version: '1.0'
  applicable_bundles:
  - interval
  checks:
  - kind: must_contain_any
    values:
    - intervals.yml
    - multiplier
    - plugin.manager.interval.intervals
  scoring:
    combine: all_pass
- id: interval_interval_week_multiplier
  version: '1.0'
  applicable_bundles:
  - interval
  checks:
  - kind: must_contain_any
    values:
    - multiplier
    - '7'
    - buildPHPString
    - modify
  scoring:
    combine: all_pass
- id: interval_interval_which_field
  version: '1.0'
  applicable_bundles:
  - interval
  checks:
  - kind: must_contain_any
    values:
    - field_interval_dur
  scoring:
    combine: all_pass
- id: interval_interval_allowed_periods
  version: '1.0'
  applicable_bundles:
  - interval
  checks:
  - kind: must_contain_any
    values:
    - day
    - week
    - month
  scoring:
    combine: all_pass
- id: interval_interval_add_field
  version: '1.0'
  applicable_bundles:
  - interval
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
- id: interval_interval_restrict_periods
  version: '1.0'
  applicable_bundles:
  - interval
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
