metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: inline_responsive_images
  version: 4.0.x
  note: 'Inline Styled Images has no admin settings page and no configure route (configure=null). All
    configuration lives on a text format: enabling one of two filters (filter_imagestyle ''Display image
    styles'' / filter_responsive_image_style ''Display responsive images'') and selecting the allowed
    styles under filters.<id>.settings.image_styles. The CKEditor 5 plugins then write data-image-style
    / data-responsive-image-style onto <img>, and the reversible filter swaps that for a themed image_style
    / responsive_image at render time. Medium cases create a text format with a filter pre-configured
    and ask the agent to read back the enabled styles; hard cases give a format with the filter disabled
    and require the agent to enable it and select a style, verified against the live filter.format config.
    Uses existing image styles (thumbnail, large) and responsive image styles (narrow, wide) present on
    the site.'
questions:
- id: iri-enable-filter
  input: On a Drupal 11 site with the inline_responsive_images (Inline Styled Images) module, there is
    no module settings page. How do I make image styles selectable in the CKEditor 5 image dialog, and
    which text-format filter do I turn on to do it?
  criteria: There is no configure route. On the text format (Configuration > Content authoring > Text
    formats and editors) enable the 'Display image styles' filter (filter_imagestyle) or 'Display responsive
    images' filter (filter_responsive_image_style) and tick the styles to expose. The CKEditor 5 plugin
    then adds a style dropdown to the image toolbar.
  bundle: inline_responsive_images
  rubric_ref: rubric/inline_responsive_images_iri_enable_filter@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: iri-attribute
  input: When an editor picks an image style for an inline image with inline_responsive_images, what HTML
    attribute is written onto the <img> tag, and what happens to it when the content is rendered?
  criteria: The CKEditor 5 plugin stores the chosen style id in a data-image-style attribute (or data-responsive-image-style
    for responsive styles). The reversible filter reads that attribute plus the file's data-entity-uuid
    at render time and replaces the tag with a themed image_style / responsive_image derivative.
  bundle: inline_responsive_images
  rubric_ref: rubric/inline_responsive_images_iri_attribute@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: iri-where-stored
  input: Does the inline_responsive_images module have a central admin configuration page, or is it configured
    per text format? Where is the list of allowed image styles stored in configuration?
  criteria: 'It has no configuration page (configure=null). It is configured per text format; the allowed
    styles are stored under filter.format.<format>.filters.<filter_id>.settings.image_styles as a map
    of style_id: style_id.'
  bundle: inline_responsive_images
  rubric_ref: rubric/inline_responsive_images_iri_where_stored@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: iri-enabled-styles
  input: On this Drupal site there is a text format named 'iri_eval' that uses the inline_responsive_images
    'Display image styles' filter. Inspect the live text-format configuration and list which image styles
    are enabled for that filter.
  criteria: The iri_eval format has filter_imagestyle enabled with settings.image_styles = {thumbnail,
    large}. Read filter.format.iri_eval.filters.filter_imagestyle.settings.image_styles.
  bundle: inline_responsive_images
  rubric_ref: rubric/inline_responsive_images_iri_enabled_styles@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/inline_responsive_images-enabled-styles-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/inline_responsive_images-enabled-styles-cleanup.sh
- id: iri-responsive-styles
  input: A text format named 'iri_reval' on this site uses the inline_responsive_images 'Display responsive
    images' filter. Inspect the live configuration and state which responsive image styles are made available
    to editors by that filter.
  criteria: The iri_reval format has filter_responsive_image_style enabled with settings.image_styles
    = {narrow, wide}. Read filter.format.iri_reval.filters.filter_responsive_image_style.settings.image_styles.
  bundle: inline_responsive_images
  rubric_ref: rubric/inline_responsive_images_iri_responsive_styles@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/inline_responsive_images-responsive-styles-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/inline_responsive_images-responsive-styles-cleanup.sh
- id: iri-enable-imagestyle
  input: On this Drupal site there is a text format 'iri_task' where the inline_responsive_images 'Display
    image styles' filter (filter_imagestyle) is present but disabled. Enable that filter on the iri_task
    format and configure it to offer the 'thumbnail' image style to editors. Apply the change to the live
    site.
  criteria: 'In filter.format.iri_task, filter_imagestyle has status: true and settings.image_styles includes
    at least one style (e.g. thumbnail: thumbnail). Set the filter config and save the format.'
  bundle: inline_responsive_images
  rubric_ref: rubric/inline_responsive_images_iri_enable_imagestyle@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/inline_responsive_images-enable-imagestyle-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/inline_responsive_images-enable-imagestyle-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/inline_responsive_images-enable-imagestyle-verify.sh
- id: iri-enable-responsive
  input: On this Drupal site there is a text format 'iri_rtask' where the inline_responsive_images 'Display
    responsive images' filter (filter_responsive_image_style) is present but disabled. Enable that filter
    on the iri_rtask format and configure it to offer the 'wide' responsive image style to editors. Apply
    the change to the live site.
  criteria: 'In filter.format.iri_rtask, filter_responsive_image_style has status: true and settings.image_styles
    includes at least one responsive style (e.g. wide: wide). Set the filter config and save the format.'
  bundle: inline_responsive_images
  rubric_ref: rubric/inline_responsive_images_iri_enable_responsive@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/inline_responsive_images-enable-responsive-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/inline_responsive_images-enable-responsive-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/inline_responsive_images-enable-responsive-verify.sh
