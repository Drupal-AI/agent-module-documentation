rubrics:
- id: inline_responsive_images_iri_enable_filter
  version: '1.0'
  applicable_bundles:
  - inline_responsive_images
  checks:
  - kind: must_contain_any
    values:
    - Display image styles
    - filter_imagestyle
    - Display responsive images
    - filter_responsive_image_style
    - text format
  scoring:
    combine: all_pass
- id: inline_responsive_images_iri_attribute
  version: '1.0'
  applicable_bundles:
  - inline_responsive_images
  checks:
  - kind: must_contain_any
    values:
    - data-image-style
    - data-responsive-image-style
  scoring:
    combine: all_pass
- id: inline_responsive_images_iri_where_stored
  version: '1.0'
  applicable_bundles:
  - inline_responsive_images
  checks:
  - kind: must_contain_any
    values:
    - per text format
    - text format
    - filter
    - image_styles
    - no configuration page
    - no settings page
    - configure route
  scoring:
    combine: all_pass
- id: inline_responsive_images_iri_enabled_styles
  version: '1.0'
  applicable_bundles:
  - inline_responsive_images
  checks:
  - kind: must_contain_any
    values:
    - thumbnail
    - large
  scoring:
    combine: all_pass
- id: inline_responsive_images_iri_responsive_styles
  version: '1.0'
  applicable_bundles:
  - inline_responsive_images
  checks:
  - kind: must_contain_any
    values:
    - narrow
    - wide
  scoring:
    combine: all_pass
- id: inline_responsive_images_iri_enable_imagestyle
  version: '1.0'
  applicable_bundles:
  - inline_responsive_images
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
- id: inline_responsive_images_iri_enable_responsive
  version: '1.0'
  applicable_bundles:
  - inline_responsive_images
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
