rubrics:
- id: inline_block_title_automatic_inline_block_title_automatic_what_forms
  version: '1.0'
  applicable_bundles:
  - inline_block_title_automatic
  checks:
  - kind: must_contain_any
    values:
    - layout_builder_add_block
    - layout_builder_update_block
    - label_display
    - value
  scoring:
    combine: all_pass
- id: inline_block_title_automatic_inline_block_title_automatic_which_blocks
  version: '1.0'
  applicable_bundles:
  - inline_block_title_automatic
  checks:
  - kind: must_contain_any
    values:
    - block_content
    - inline block
    - provider
    - BlockContent
  scoring:
    combine: all_pass
- id: inline_block_title_automatic_inline_block_title_automatic_config
  version: '1.0'
  applicable_bundles:
  - inline_block_title_automatic
  checks:
  - kind: must_contain_any
    values:
    - no config
    - no configuration
    - zero
    - Inline block
    - enable
  scoring:
    combine: all_pass
- id: inline_block_title_automatic_inline_block_title_automatic_title_hidden
  version: '1.0'
  applicable_bundles:
  - inline_block_title_automatic
  checks:
  - kind: must_contain_any
    values:
    - value
    - hidden
    - not editable
    - active
  scoring:
    combine: all_pass
- id: inline_block_title_automatic_inline_block_title_automatic_title_display_off
  version: '1.0'
  applicable_bundles:
  - inline_block_title_automatic
  checks:
  - kind: must_contain_any
    values:
    - Inline block
    - not display
    - 'false'
    - 'FALSE'
  scoring:
    combine: all_pass
- id: inline_block_title_automatic_inline_block_title_automatic_enable_hide_title
  version: '1.0'
  applicable_bundles:
  - inline_block_title_automatic
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
- id: inline_block_title_automatic_inline_block_title_automatic_enable_title_off
  version: '1.0'
  applicable_bundles:
  - inline_block_title_automatic
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
