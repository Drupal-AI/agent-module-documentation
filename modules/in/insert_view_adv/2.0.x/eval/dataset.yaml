metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: insert_view_adv
  version: 2.0.x
  note: 'Advanced Insert View is a text-format filter (plugin id insert_view_adv) that embeds views from
    rich text via [view:name=display=args] tokens or <drupal-view> tags, rendered through render placeholders;
    it also ships a CKEditor 5 button. It has no admin config route (configure=null) — enabling and settings
    live per text format in filter.format.<format> under filters.insert_view_adv (status + settings allowed_views/render_as_empty/hide_argument_input).
    Medium/hard cases are grounded in that real config: introspection finds which format has the filter
    enabled; execution enables the filter on a format, verified by filters.insert_view_adv.status ===
    TRUE. Rendering an actual embedded view needs a real view + request context, so cases target the filter
    configuration, not rendered output.'
questions:
- id: insert_view_adv-token-syntax
  input: Using the Advanced Insert View (insert_view_adv) module, what token syntax do I type in a body
    field to embed a view called 'articles' using its 'page_1' display and pass the argument 5?
  criteria: '[view:articles=page_1=5] — the syntax is [view:name=display=args]; omit the display to use
    the default, and separate multiple arguments with slashes. A <drupal-view> tag is the equivalent produced
    by the CKEditor plugin.'
  bundle: insert_view_adv
  rubric_ref: rubric/insert_view_adv_insert_view_adv_token_syntax@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: insert_view_adv-filter-settings
  input: The Advanced Insert View filter has no admin settings page. Where is it enabled and configured,
    and what are its three filter settings?
  criteria: It is enabled per text format (Configuration > Text formats and editors; config filter.format.<format>.filters.insert_view_adv).
    Its settings are allowed_views (whitelist of view=display; empty allows all), render_as_empty, and
    hide_argument_input.
  bundle: insert_view_adv
  rubric_ref: rubric/insert_view_adv_insert_view_adv_filter_settings@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: insert_view_adv-security
  input: Why should the Advanced Insert View filter only be granted to trusted text formats, and what
    must be true of every view that can be embedded?
  criteria: The filter can render any view, so it should be limited to trusted formats/roles. Every embeddable
    view and display (including the default display) must have correct Views access permissions, because
    build() only renders a view after $view->access($display_id) passes.
  bundle: insert_view_adv
  rubric_ref: rubric/insert_view_adv_insert_view_adv_security@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: insert_view_adv-known-format
  input: On this Drupal site, which text format has the Advanced Insert View (insert_view_adv) filter
    enabled? Inspect the live filter format configuration and give the format's machine name.
  criteria: iva_eval — its filter.format.iva_eval config has filters.insert_view_adv.status = true.
  bundle: insert_view_adv
  rubric_ref: rubric/insert_view_adv_insert_view_adv_known_format@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/insert_view_adv-known-format-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/insert_view_adv-known-format-cleanup.sh
- id: insert_view_adv-enable-filter
  input: On this Drupal site there is a text format with machine name 'iva_eval_hard'. Enable the Advanced
    Insert View (insert_view_adv) filter on that format and save it, so editors using that format can
    embed views.
  criteria: 'In filter.format.iva_eval_hard set filters.insert_view_adv.status = true (with id/provider
    insert_view_adv and its settings) and save. Verified: filters.insert_view_adv.status === TRUE on the
    live format.'
  bundle: insert_view_adv
  rubric_ref: rubric/insert_view_adv_insert_view_adv_enable_filter@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/insert_view_adv-enable-filter-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/insert_view_adv-enable-filter-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/insert_view_adv-enable-filter-verify.sh
- id: insert_view_adv-enable-filter-layman
  input: We have a text format called 'iva_eval_hard'. I want editors to be able to drop a view into the
    body using that format. Turn on the feature that lets them embed views, and save the format.
  criteria: 'Enable the Advanced Insert View filter (insert_view_adv) on the iva_eval_hard text format
    and save. Verified: filters.insert_view_adv.status === TRUE.'
  bundle: insert_view_adv
  rubric_ref: rubric/insert_view_adv_insert_view_adv_enable_filter_layman@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: site-builder
    reset: agent-module-documentation/evaluation/verify/insert_view_adv-enable-filter-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/insert_view_adv-enable-filter-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/insert_view_adv-enable-filter-verify.sh
