rubrics:
- id: scroll_top_button_scroll_top_button_config_object
  version: '1.0'
  applicable_bundles:
  - scroll_top_button
  checks:
  - kind: must_contain_any
    values:
    - scroll_top_button.settings
    - enabled
  scoring:
    combine: all_pass
- id: scroll_top_button_scroll_top_button_keys
  version: '1.0'
  applicable_bundles:
  - scroll_top_button
  checks:
  - kind: must_contain_any
    values:
    - show_on_admin
    - scroll_distance
  scoring:
    combine: all_pass
- id: scroll_top_button_scroll_top_button_route_permission
  version: '1.0'
  applicable_bundles:
  - scroll_top_button
  checks:
  - kind: must_contain_any
    values:
    - administer site configuration
    - /admin/config/user-interface/scroll_top_button
  scoring:
    combine: all_pass
- id: scroll_top_button_scroll_top_button_known_style
  version: '1.0'
  applicable_bundles:
  - scroll_top_button
  checks:
  - kind: must_contain_any
    values:
    - tab
  scoring:
    combine: all_pass
- id: scroll_top_button_scroll_top_button_known_distance
  version: '1.0'
  applicable_bundles:
  - scroll_top_button
  checks:
  - kind: must_contain_any
    values:
    - '250'
  scoring:
    combine: all_pass
- id: scroll_top_button_scroll_top_button_enable
  version: '1.0'
  applicable_bundles:
  - scroll_top_button
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
- id: scroll_top_button_scroll_top_button_style_speed
  version: '1.0'
  applicable_bundles:
  - scroll_top_button
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
