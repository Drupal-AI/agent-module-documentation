metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: scroll_top_button
  version: 2.1.x
  note: Scroll To Top Button is a config-only front-end module. Its entire state is the config object
    scroll_top_button.settings (keys enabled [string 'on'/'off'], show_on_admin, button_text, button_style
    [image|link|pill|tab], button_animation [fade|slide|none], button_animation_speed, scroll_distance,
    scroll_speed). The settings form route scroll_top_button.settings is gated by core 'administer site
    configuration'; the module ships no permissions, block, plugin or PHP API. Medium/hard cases are grounded
    in that real config object on the live site; setup/cleanup/reset restore the shipped config/install
    defaults explicitly (State is unreliable on this site).
questions:
- id: scroll_top_button-config-object
  input: On a Drupal 11 site with the scroll_top_button module, which configuration object holds its settings
    and which key turns the button on? Note anything unusual about that key's value type.
  criteria: All settings live in scroll_top_button.settings. The 'enabled' key turns the button on, and
    it is a STRING 'on'/'off' (a radios element), not a boolean — the runtime check is == 'on'.
  bundle: scroll_top_button
  rubric_ref: rubric/scroll_top_button_scroll_top_button_config_object@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: scroll_top_button-keys
  input: Using the scroll_top_button module, which config keys control (a) whether the button also appears
    on admin pages and (b) how far down the page a visitor must scroll before it appears?
  criteria: show_on_admin (boolean, default FALSE) controls whether the button shows on admin routes;
    scroll_distance (integer pixels, default 100) is how far the user must scroll before the button appears.
  bundle: scroll_top_button
  rubric_ref: rubric/scroll_top_button_scroll_top_button_keys@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: scroll_top_button-route-permission
  input: What is the settings form route path for the scroll_top_button module, and which permission is
    required to reach it?
  criteria: The form is at /admin/config/user-interface/scroll_top_button (route scroll_top_button.settings)
    and requires the core 'administer site configuration' permission; the module defines no permission
    of its own.
  bundle: scroll_top_button
  rubric_ref: rubric/scroll_top_button_scroll_top_button_route_permission@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: scroll_top_button-known-style
  input: On this Drupal site the scroll_top_button module is configured. Inspect the live configuration
    and state which button style is selected.
  criteria: scroll_top_button.settings has button_style 'tab' (and enabled 'on').
  bundle: scroll_top_button
  rubric_ref: rubric/scroll_top_button_scroll_top_button_known_style@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/scroll_top_button-known-style-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/scroll_top_button-known-style-cleanup.sh
- id: scroll_top_button-known-distance
  input: The scroll_top_button module is configured on this site. Inspect the live configuration and state
    the scroll distance (in pixels) a visitor must scroll before the button appears.
  criteria: scroll_top_button.settings has scroll_distance 250 (and button_text 'Back to top').
  bundle: scroll_top_button
  rubric_ref: rubric/scroll_top_button_scroll_top_button_known_distance@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/scroll_top_button-known-distance-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/scroll_top_button-known-distance-cleanup.sh
- id: scroll_top_button-enable
  input: On my Drupal site I installed the scroll_top_button module but the back-to-top button is not
    showing. Turn it on and make the button read 'To top'. Apply the change to the live site.
  criteria: In scroll_top_button.settings, enabled is the string 'on' and button_text is 'To top'.
  bundle: scroll_top_button
  rubric_ref: rubric/scroll_top_button_scroll_top_button_enable@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: site-owner
    reset: agent-module-documentation/evaluation/verify/scroll_top_button-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/scroll_top_button-reset.sh
    verify: agent-module-documentation/evaluation/verify/scroll_top_button-enable-verify.sh
- id: scroll_top_button-style-speed
  input: Configure the scroll_top_button module on this site to use the 'pill' button style and a scroll-to-top
    animation speed of 500 milliseconds. Apply the change to the live site.
  criteria: In scroll_top_button.settings, button_style is 'pill' and scroll_speed is 500.
  bundle: scroll_top_button
  rubric_ref: rubric/scroll_top_button_scroll_top_button_style_speed@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/scroll_top_button-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/scroll_top_button-reset.sh
    verify: agent-module-documentation/evaluation/verify/scroll_top_button-style-speed-verify.sh
