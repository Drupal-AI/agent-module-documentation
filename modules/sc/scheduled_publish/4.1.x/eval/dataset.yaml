metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: scheduled_publish
  version: 4.1.x
  note: Scheduled Publish schedules future content-moderation transitions. It adds a field type scheduled_publish
    (default widget scheduled_publish, default formatter scheduled_publish_generic_formatter) whose items
    store value (datetime_iso8601) + moderation_state; add it to a bundle under Content Moderation, usually
    multi-value. A cron service scheduled_publish.update (ScheduledPublishCron::doUpdate) runs on hook_cron
    to apply due transitions; Drush command scheduled_publish:doUpdate (alias schp) runs it manually.
    Admin listing /admin/content/scheduled-publish (+ add/edit/delete), permission 'access scheduled publish
    pages' (listing needs view any unpublished content). No global settings form. Depends on content_moderation,
    workflows, datetime. Medium/hard cases are grounded in real scheduled_publish fields on the Article
    content type (namespaced field_sp*).
questions:
- id: scheduled_publish-field-type
  input: How do I let editors schedule a future content-moderation state change (e.g. auto-publish next
    Friday) with the Scheduled Publish module? What field type do I add, and what does each entry store?
  criteria: Add a field of type 'Scheduled publish' (field type id scheduled_publish) to a moderated bundle.
    Each entry stores a date/time (value, datetime_iso8601) and a target moderation_state; make it multi-value
    to queue several transitions.
  bundle: scheduled_publish
  rubric_ref: rubric/scheduled_publish_scheduled_publish_field_type@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: scheduled_publish-drush
  input: With the Scheduled Publish module, which Drush command runs the due scheduled moderation transitions
    immediately, and what normally triggers them?
  criteria: Run drush scheduled_publish:doUpdate (alias schp) to apply due transitions now. Normally they
    run automatically on Drupal cron via the scheduled_publish.update service (ScheduledPublishCron::doUpdate).
  bundle: scheduled_publish
  rubric_ref: rubric/scheduled_publish_scheduled_publish_drush@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: scheduled_publish-requirements
  input: What must be true of a content type for a Scheduled Publish field to work, which permission controls
    the scheduled-publish admin pages, and where is the listing of pending scheduled changes?
  criteria: The bundle must be under Content Moderation (in a workflow) so target moderation states exist.
    The 'access scheduled publish pages' permission gates the add/edit/delete forms; pending scheduled
    changes are listed at /admin/content/scheduled-publish (which also needs 'view any unpublished content').
  bundle: scheduled_publish
  rubric_ref: rubric/scheduled_publish_scheduled_publish_requirements@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: scheduled_publish-find-field
  input: On this Drupal site, the Article content type has a field provided by the Scheduled Publish module.
    Inspect the live field configuration and give the machine name of the scheduled_publish field on Article.
  criteria: 'The field is field_spx: field.storage.node.field_spx has type scheduled_publish and it is
    attached to the article bundle.'
  bundle: scheduled_publish
  rubric_ref: rubric/scheduled_publish_scheduled_publish_find_field@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
