- id: scheduled_publish-cardinality
  input: The Article content type has a Scheduled Publish field named field_spc. Inspect the live field
    storage and tell me how many values (scheduled transitions) it allows.
  criteria: 'It allows unlimited values: field.storage.node.field_spc has cardinality -1 (unlimited),
    so editors can queue any number of scheduled transitions.'
  bundle: scheduled_publish
  rubric_ref: rubric/scheduled_publish_scheduled_publish_cardinality@1.0
  tags:
  - mode:introspection
