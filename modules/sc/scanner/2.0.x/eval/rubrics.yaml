rubrics:
- id: scanner_scanner_body_replace
  version: '1.0'
  applicable_bundles:
  - scanner
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
- id: scanner_scanner_email_replace
  version: '1.0'
  applicable_bundles:
  - scanner
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
- id: scanner_scanner_wholeword_replace
  version: '1.0'
  applicable_bundles:
  - scanner
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
- id: scanner_scanner_introspect_fields
  version: '1.0'
  applicable_bundles:
  - scanner
  checks:
  - kind: must_contain_any
    values:
    - body
  scoring:
    combine: all_pass
- id: scanner_scanner_introspect_word_boundaries
  version: '1.0'
  applicable_bundles:
  - scanner
  checks:
  - kind: must_contain_any
    values:
    - icu
  scoring:
    combine: all_pass
- id: scanner_scanner_introspect_regex_default
  version: '1.0'
  applicable_bundles:
  - scanner
  checks:
  - kind: must_contain_any
    values:
    - 'yes'
  scoring:
    combine: all_pass
- id: scanner_scanner_config_object
  version: '1.0'
  applicable_bundles:
  - scanner
  checks:
  - kind: must_contain_any
    values:
    - fields_of_selected_content_type
  scoring:
    combine: all_pass
- id: scanner_scanner_service_id
  version: '1.0'
  applicable_bundles:
  - scanner
  checks:
  - kind: must_contain_any
    values:
    - plugin.manager.scanner
  scoring:
    combine: all_pass
- id: scanner_scanner_replace_permission
  version: '1.0'
  applicable_bundles:
  - scanner
  checks:
  - kind: must_contain_any
    values:
    - perform search and replace
  scoring:
    combine: all_pass
- id: scanner_scanner_new_entity_plugin
  version: '1.0'
  applicable_bundles:
  - scanner
  checks:
  - kind: must_contain_any
    values:
    - '@Scanner'
    - Plugin/Scanner
    - ScannerPluginBase
  scoring:
    combine: all_pass
