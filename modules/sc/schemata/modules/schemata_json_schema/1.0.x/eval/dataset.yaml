metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: schemata_json_schema
  version: 1.0.x
  note: Submodule of schemata. Provides the JSON Schema serializer and one plugin type (TypeMapper). No
