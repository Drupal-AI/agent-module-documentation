questions:
- id: sjs-plugin-type
  input: In the schemata_json_schema module, which plugin type do I implement to control how a specific
    Drupal Typed Data type is rendered in the generated JSON Schema, and in which namespace/directory
    does the plugin class live?
  criteria: 'A TypeMapper plugin: class in Plugin/schemata_json_schema/type_mapper/ annotated with @TypeMapper(id
    = "..."), implementing TypeMapperInterface (usually by extending TypeMapperBase).'
  bundle: schemata_json_schema
  rubric_ref: rubric/schemata_json_schema_sjs_plugin_type@1.0
  tags:
  - mode:recipe
- id: sjs-email-mapping
  input: How does schemata_json_schema's shipped email TypeMapper represent an email field in JSON Schema?
  criteria: 'type: string with format: email.'
  bundle: schemata_json_schema
  rubric_ref: rubric/schemata_json_schema_sjs_email_mapping@1.0
  tags:
  - mode:recipe
- id: sjs-fallback
  input: In schemata_json_schema, what happens when a Drupal Typed Data type has no dedicated TypeMapper
    plugin?
  criteria: The manager implements FallbackPluginManagerInterface and routes to the 'fallback' TypeMapper,
    which uses the property's raw data type as the JSON Schema type.
  bundle: schemata_json_schema
  rubric_ref: rubric/schemata_json_schema_sjs_fallback@1.0
  tags:
  - mode:recipe
- id: sjs-hal-jsonapi-conditional
  input: I want Schemata to describe the HAL+JSON and JSON:API representations of my entities as JSON
    Schema. Which modules must be enabled for those described-formats to be available?
  criteria: Enable the hal module for _describes=hal_json and the jsonapi module for _describes=api_json;
    those normalizers/encoders are registered conditionally in SchemataJsonSchemaServiceProvider.
  bundle: schemata_json_schema
  rubric_ref: rubric/schemata_json_schema_sjs_hal_jsonapi_conditional@1.0
  tags:
  - mode:recipe
- id: sjs-alter-hook
  input: Which alter hook lets a module modify the TypeMapper plugin definitions in schemata_json_schema?
  criteria: hook_json_schema_type_mapper_alter() (alter id 'json_schema_type_mapper').
  bundle: schemata_json_schema
  rubric_ref: rubric/schemata_json_schema_sjs_alter_hook@1.0
  tags:
  - mode:recipe
