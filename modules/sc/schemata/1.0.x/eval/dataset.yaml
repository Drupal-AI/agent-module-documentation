metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: schemata
  version: 1.0.x
  note: Schemata has no config UI and no Drush commands; it is accessed via dynamic routes, one permission,
    and the schemata.schema_factory service. All cases are recipe (response-graded).
questions:
- id: schemata-http-route-pattern
  input: On a Drupal site with the Schemata module enabled, what is the URL pattern to fetch the machine-readable
    schema for the 'article' node bundle as JSON Schema describing the HAL+JSON representation? Give the
    exact path and query string.
  criteria: /schemata/node/article?_format=schema_json&_describes=hal_json — _format selects the schema
    type, _describes selects the entity representation being described.
  bundle: schemata
  rubric_ref: rubric/schemata_schemata_http_route_pattern@1.0
  tags:
  - mode:recipe
- id: schemata-factory-service
  input: In PHP on a Drupal 11 site, build a Schemata schema object for the 'user' entity type programmatically.
    Which service do I call and how?
  criteria: \Drupal::service('schemata.schema_factory')->create('user') returns a Drupal\schemata\Schema\SchemaInterface
    (NULL for non-content entities).
  bundle: schemata
  rubric_ref: rubric/schemata_schemata_factory_service@1.0
  tags:
  - mode:recipe
- id: schemata-permission
  input: Which permission must a role have to read the schema data models exposed by the Schemata module?
  criteria: The 'access schemata data models' permission gates every /schemata/* route.
  bundle: schemata
  rubric_ref: rubric/schemata_schemata_permission@1.0
  tags:
  - mode:recipe
- id: schemata-content-only
  input: Can the Schemata module generate a schema for a Drupal config entity type such as a view or a
    role? Explain briefly.
  criteria: No — only content entities (implementing ContentEntityInterface) are supported; config entities
    are not, and the factory returns NULL for them.
  bundle: schemata
  rubric_ref: rubric/schemata_schemata_content_only@1.0
  tags:
  - mode:recipe
- id: schemata-provider-needed
  input: I enabled the Schemata module but requesting /schemata/node/article?_format=schema_json returns
    nothing usable. What else do I need to enable to actually get JSON Schema output?
  criteria: Enable a schema provider submodule such as schemata_json_schema; Schemata itself only builds
    abstract schema objects and needs a serializer/provider to emit a concrete format.
  bundle: schemata
  rubric_ref: rubric/schemata_schemata_provider_needed@1.0
  tags:
  - mode:recipe
- id: schemata-describes-jsonapi
  input: Which query parameter value for _describes targets the JSON:API representation of an entity in
    a Schemata request, and what module must be enabled for it to work?
  criteria: _describes=api_json targets the JSON:API representation; the jsonapi module must be enabled.
  bundle: schemata
  rubric_ref: rubric/schemata_schemata_describes_jsonapi@1.0
  tags:
  - mode:recipe
