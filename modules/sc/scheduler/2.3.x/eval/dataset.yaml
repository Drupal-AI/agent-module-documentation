metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: scheduler
  version: 2.3.x
  note: 'Scheduler adds config, base fields, a service, plugins, hooks and permissions. Cases span three
    difficulty tiers: `easy`/recipe (response-graded facts from 2.3.x/agent/), `medium`/introspection
    (a setup script installs a KNOWN config to the live site, the agent inspects the running site via
    drush to answer, a cleanup script restores baseline), and `hard`/execution (a reset script clears
    state, the agent mutates the live site, a verify script checks live state — reset -> model -> verify).'
questions:
- id: scheduler-schedule-article
  input: On this Drupal site (drush available), enable content scheduling for Articles and schedule a
    post. Turn on Scheduler's publish-on and unpublish-on dates for the Article content type, then create
    an unpublished Article titled `Eval Scheduled Post` that is set to automatically publish 2 days from
    now. Apply it to the live site; don't just describe it. One-line summary.
  criteria: Scheduler's publish_enable and unpublish_enable third-party settings are TRUE on node.type.article,
    AND an unpublished Article titled `Eval Scheduled Post` exists with a publish_on timestamp ~2 days
    in the future. Verified against live site state.
  bundle: scheduler
  rubric_ref: rubric/scheduler_scheduler_schedule_article@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/scheduler-reset.sh
    verify: agent-module-documentation/evaluation/verify/scheduler-article-schedule.sh
- id: scheduler-page-unpublish
  input: On this Drupal site (drush available), enable Scheduler for the Basic page (machine name `page`)
    content type, then create a PUBLISHED Basic page titled `Eval Unpublish Page` that is scheduled to
    automatically unpublish 3 days from now. Apply it to the live site; don't just describe it. One-line
    summary.
  criteria: Scheduler's unpublish_enable third-party setting is TRUE on node.type.page, AND a PUBLISHED
    page titled `Eval Unpublish Page` exists with an unpublish_on timestamp ~3 days in the future. Verified
    against live site state.
  bundle: scheduler
  rubric_ref: rubric/scheduler_scheduler_page_unpublish@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/scheduler-page-unpublish-reset.sh
    verify: agent-module-documentation/evaluation/verify/scheduler-page-unpublish-verify.sh
- id: scheduler-article-required
  input: On this Drupal site (drush available), configure the Article content type so that whenever Scheduler's
    publish-on date field is shown, entering a scheduled publish date is REQUIRED (mandatory) rather than
    optional. Apply the change to the live site config; don't just describe it. One-line summary.
  criteria: Scheduler's publish_required third-party setting is TRUE on node.type.article. Verified against
    live site state.
  bundle: scheduler
  rubric_ref: rubric/scheduler_scheduler_article_required@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/scheduler-article-required-reset.sh
    verify: agent-module-documentation/evaluation/verify/scheduler-article-required-verify.sh
- id: scheduler-introspect-enabled-ops
  input: Inspect this running Drupal site (drush available). Is content scheduling enabled for the Article
    content type, and if so for which operations — publish, unpublish, or both? Answer from the site's
    actual configuration.
  criteria: 'Scheduling is enabled on the Article type for BOTH operations: publish_enable and unpublish_enable
    are TRUE on node.type.article (found via the scheduler third-party settings on the bundle).'
  bundle: scheduler
  rubric_ref: rubric/scheduler_scheduler_introspect_enabled_ops@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    persona: drupal-expert
    setup: agent-module-documentation/evaluation/verify/scheduler-introspect-enabled-ops-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/scheduler-introspect-enabled-ops-cleanup.sh
- id: scheduler-introspect-scheduled-node
  input: There is an Article on this Drupal site that has been scheduled for future publication (drush
    available). Inspect the running site and tell me the title of that scheduled Article.
  criteria: The scheduled Article is titled `Eval Scheduled Announcement` — an unpublished node with a
    publish_on timestamp ~5 days in the future (found by querying nodes with a future publish_on).
  bundle: scheduler
  rubric_ref: rubric/scheduler_scheduler_introspect_scheduled_node@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    persona: drupal-expert
    setup: agent-module-documentation/evaluation/verify/scheduler-introspect-scheduled-node-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/scheduler-introspect-scheduled-node-cleanup.sh
- id: scheduler-introspect-past-date
  input: Inspect this running Drupal site (drush available). For the Article content type, what is Scheduler's
    `publish_past_date` behaviour setting configured to (error, publish, or schedule)? Answer from the
    site's actual configuration.
  criteria: publish_past_date is set to `schedule` on node.type.article (a publish date in the past is
    re-scheduled to the next cron run rather than erroring); read from the scheduler third-party settings.
  bundle: scheduler
  rubric_ref: rubric/scheduler_scheduler_introspect_past_date@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    persona: drupal-expert
    setup: agent-module-documentation/evaluation/verify/scheduler-introspect-past-date-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/scheduler-introspect-past-date-cleanup.sh
- id: scheduler-date-fields
  input: On a Drupal 11 site using the Scheduler module, which two date/time fields does Scheduler add
    to the add/edit form of an enabled entity bundle so content can be published and later unpublished
    automatically? Name the machine names of the fields.
  criteria: Scheduler adds the publish_on and unpublish_on base fields to each enabled entity type/bundle.
  bundle: scheduler
  rubric_ref: rubric/scheduler_scheduler_date_fields@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: scheduler-enable-per-content-type
  input: I want to turn on Scheduler for the Article content type only. How is that setting stored in
    Drupal config, and which key enables the publish date field for that bundle?
  criteria: It is stored as a third-party setting under the `scheduler` namespace on the bundle config
    entity (e.g. node.type.article.third_party.scheduler), with publish_enable / unpublish_enable turning
    each field on for that bundle.
  bundle: scheduler
  rubric_ref: rubric/scheduler_scheduler_enable_per_content_type@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: scheduler-cron-publishing
  input: How does Scheduler actually publish content once the scheduled time has passed, and how can I
    run only Scheduler's processing more frequently than full site cron on a Drupal 11 site? Give the
    Drush command and/or the URL.
  criteria: 'Scheduler processes due entities on every Drupal cron run; to run only its work more often
    use the lightweight cron: `drush scheduler:cron` or the guarded URL /scheduler/cron/{cron_key}.'
  bundle: scheduler
  rubric_ref: rubric/scheduler_scheduler_cron_publishing@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: scheduler-manager-service
  input: In custom PHP on a Drupal 11 Scheduler site, which service should I load to call Scheduler's
    publish/unpublish engine and read its settings? Give the service id.
  criteria: The scheduler.manager service (\Drupal\scheduler\SchedulerManager), e.g. \Drupal::service('scheduler.manager').
  bundle: scheduler
  rubric_ref: rubric/scheduler_scheduler_manager_service@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: scheduler-new-entity-type-plugin
  input: I have a custom entity type and want Scheduler to be able to publish/unpublish it. What kind
    of plugin do I write, and which annotation and base class does it use?
  criteria: Write a SchedulerPlugin (@SchedulerPlugin annotation) in the Plugin/Scheduler namespace, extending
    \Drupal\scheduler\SchedulerPluginBase, declaring entityType and dependency; then run drush scheduler:entity-update.
  bundle: scheduler
  rubric_ref: rubric/scheduler_scheduler_new_entity_type_plugin@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: scheduler-block-publishing-hook
  input: On a Drupal 11 Scheduler site, I want to prevent a scheduled node from being published by cron
    until an approval field is set. Which Scheduler hook do I implement, and what should it return to
    block publication?
  criteria: Implement hook_scheduler_publishing_allowed() (or the node-specific hook_scheduler_node_publishing_allowed)
    and return FALSE to block publication; Scheduler retries each cron run until it is allowed.
  bundle: scheduler
  rubric_ref: rubric/scheduler_scheduler_block_publishing_hook@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: scheduler-node-permission
  input: Which permission lets an editor set the publish and unpublish dates on the node add/edit form
    in Scheduler? Give the exact permission name for nodes.
  criteria: The dynamic permission `schedule publishing of nodes` (nodes use the legacy keys; other entity
    types use their entity type id, e.g. `schedule publishing of media`).
  bundle: scheduler
  rubric_ref: rubric/scheduler_scheduler_node_permission@1.0
  tags:
  - mode:recipe
  - difficulty:easy
