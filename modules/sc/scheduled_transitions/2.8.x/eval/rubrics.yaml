rubrics:
- id: scheduled_transitions_scheduled_transitions_drush_queue
  version: '1.0'
  applicable_bundles:
  - scheduled_transitions
  checks:
  - kind: must_contain_any
    values:
    - scheduled-transitions:queue-jobs
    - sctr-jobs
  scoring:
    combine: all_pass
- id: scheduled_transitions_scheduled_transitions_enable_bundle
  version: '1.0'
  applicable_bundles:
  - scheduled_transitions
  checks:
  - kind: must_contain_any
    values:
    - /admin/config/workflow/scheduled-transitions
    - settings
    - bundles
    - content moderation
    - moderated
  scoring:
    combine: all_pass
- id: scheduled_transitions_scheduled_transitions_requirements
  version: '1.0'
  applicable_bundles:
  - scheduled_transitions
  checks:
  - kind: must_contain_any
    values:
    - content_moderation
    - dynamic_entity_reference
  scoring:
    combine: all_pass
- id: scheduled_transitions_scheduled_transitions_retain_duration
  version: '1.0'
  applicable_bundles:
  - scheduled_transitions
  checks:
  - kind: must_contain_any
    values:
    - '604800'
  scoring:
    combine: all_pass
- id: scheduled_transitions_scheduled_transitions_message_marker
  version: '1.0'
  applicable_bundles:
  - scheduled_transitions
  checks:
  - kind: must_contain_any
    values:
    - SCHTRMARK
  scoring:
    combine: all_pass
- id: scheduled_transitions_scheduled_transitions_schedule
  version: '1.0'
  applicable_bundles:
  - scheduled_transitions
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
- id: scheduled_transitions_scheduled_transitions_run
  version: '1.0'
  applicable_bundles:
  - scheduled_transitions
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
