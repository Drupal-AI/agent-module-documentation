metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: social_auth
  version: 4.1.x
  note: 'Social Auth is a BASE framework (on social_api) for OAuth2 social login; it is not a provider
    itself. Fully exercising a real login requires a provider implementer module (social_auth_*) AND an
    OAuth app registered with the external provider (client_id/secret) -- an external dependency that
    cannot be tested on this site. Therefore all medium/hard cases are grounded in LOCAL, verifiable state:
    the site-behavior config object social_auth.settings (post_login default /user; user_allowed register|login;
    redirect_user_form bool; disable_admin_login bool default TRUE; disabled_roles array; auth), the disabled_roles
    policy against a namespaced role, and the shipped ''Social Auth Login'' block plugin (social_auth_login).
    Configure route social_auth.integrations -> /admin/config/social-api/social-auth (permission administer
    social api authentication, from social_api). Per-provider client creds live in each provider''s own
    <network>.settings, written by SocialAuthSettingsForm at /admin/config/social-api/social-auth/{network}.
    Introspection reads social_auth.settings values / disabled role; execution sets the login policy config
    and places the login block, both verified from live state. Site defaults are restored by cleanup/reset
    (post_login=/user, user_allowed=register).'
questions:
- id: socialauth-what-is-it
  input: I installed the Drupal social_auth module but I don't see any 'Sign in with Google' option. What
    is social_auth, and what else do I need for an actual provider like Google to work?
  criteria: social_auth is a base framework built on social_api; it provides the shared login/registration
    flow but no provider itself. You also need a provider implementer module (e.g. drupal/social_auth_google,
    a Social API Network plugin) and an OAuth app registered with that provider supplying client_id/client_secret.
  bundle: social_auth
  rubric_ref: rubric/social_auth_socialauth_what_is_it@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: socialauth-settings-keys
  input: Which config object and settings does social_auth use to control login behavior, e.g. blocking
    social login for the admin user or only allowing login (no new registrations)?
  criteria: 'The social_auth.settings config object holds: user_allowed (register|login), disable_admin_login
    (bool, default TRUE, blocks user 1), disabled_roles (roles blocked from social login), post_login
    (redirect path after login), and redirect_user_form.'
  bundle: social_auth
  rubric_ref: rubric/social_auth_socialauth_settings_keys@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: socialauth-login-ui
  input: How does social_auth expose the provider login links on a Drupal site, and what are the OAuth
    redirect/callback route paths?
  criteria: It ships a 'Social Auth Login' block (plugin social_auth_login) that renders the login_with
    theme hook with a link per installed provider. The OAuth routes are user/login/{network} (redirect)
    and user/login/{network}/callback.
  bundle: social_auth
  rubric_ref: rubric/social_auth_socialauth_login_ui@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: socialauth-known-postlogin
  input: On this site, social_auth has been configured with a custom post-login redirect and a restricted
    registration policy. Inspect the live social_auth configuration and report the path users are redirected
    to after login, and whether new users can register or login only.
  criteria: post_login is /user/welcome-back and user_allowed is 'login' (login only, no new registrations)
    in social_auth.settings.
  bundle: social_auth
  rubric_ref: rubric/social_auth_socialauth_known_postlogin@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/social_auth-postlogin-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/social_auth-postlogin-cleanup.sh
- id: socialauth-disabled-role
  input: This site has social_auth configured to prevent social login for one particular user role. Inspect
    the live configuration and state which role has social login disabled.
  criteria: The role 'socialauth_blocked' has social login disabled (it is listed in social_auth.settings
    disabled_roles).
  bundle: social_auth
  rubric_ref: rubric/social_auth_socialauth_disabled_role@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/social_auth-disabledrole-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/social_auth-disabledrole-cleanup.sh
- id: socialauth-set-policy
  input: On this site, configure social_auth so that social authentication is login-only (existing users
    may log in, but no new accounts may be created), and so that users are redirected to /dashboard after
    a successful social login. Apply the change to the live site.
  criteria: social_auth.settings user_allowed is set to 'login' and post_login is set to '/dashboard'
    (e.g. via the Social Auth settings on the network settings form, or drush config:set social_auth.settings
    user_allowed login / post_login /dashboard).
  bundle: social_auth
  rubric_ref: rubric/social_auth_socialauth_set_policy@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/social_auth-policy-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/social_auth-policy-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/social_auth-policy-verify.sh
- id: socialauth-place-block
  input: This site has social_auth enabled but the social login buttons are not shown anywhere. Place
    the 'Social Auth Login' block into a visible region of the site's front-end theme so the provider
    login links appear. Apply the change to the live site.
  criteria: An enabled block with plugin social_auth_login is placed in a region of a theme (e.g. Olivero
    content/sidebar). Create it via /admin/structure/block ('Place block' -> Social Auth Login) or Block::create([...'plugin'=>'social_auth_login'...])->save().
  bundle: social_auth
  rubric_ref: rubric/social_auth_socialauth_place_block@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/social_auth-block-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/social_auth-block-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/social_auth-block-verify.sh
