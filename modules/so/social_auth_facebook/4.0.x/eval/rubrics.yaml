rubrics:
- id: social_auth_facebook_social_auth_facebook_config_keys
  version: '1.0'
  applicable_bundles:
  - social_auth_facebook
  checks:
  - kind: must_contain_any
    values:
    - social_auth_facebook.settings
    - client_id
    - client_secret
  scoring:
    combine: all_pass
- id: social_auth_facebook_social_auth_facebook_login_url
  version: '1.0'
  applicable_bundles:
  - social_auth_facebook
  checks:
  - kind: must_contain_any
    values:
    - /user/login/facebook
    - user/login/facebook
    - /user/login/facebook/callback
  scoring:
    combine: all_pass
- id: social_auth_facebook_social_auth_facebook_settings_route
  version: '1.0'
  applicable_bundles:
  - social_auth_facebook
  checks:
  - kind: must_contain_any
    values:
    - /admin/config/social-api/social-auth/facebook
    - admin/config/social-api/social-auth/facebook
    - administer social api authentication
  scoring:
    combine: all_pass
- id: social_auth_facebook_social_auth_facebook_read_graph
  version: '1.0'
  applicable_bundles:
  - social_auth_facebook
  checks:
  - kind: must_contain_any
    values:
    - '18.0'
  scoring:
    combine: all_pass
- id: social_auth_facebook_social_auth_facebook_read_appid
  version: '1.0'
  applicable_bundles:
  - social_auth_facebook
  checks:
  - kind: must_contain_any
    values:
    - fb_probe_appid_9988
  scoring:
    combine: all_pass
- id: social_auth_facebook_social_auth_facebook_set_graph
  version: '1.0'
  applicable_bundles:
  - social_auth_facebook
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
- id: social_auth_facebook_social_auth_facebook_set_appid
  version: '1.0'
  applicable_bundles:
  - social_auth_facebook
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
