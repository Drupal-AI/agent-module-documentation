metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: social_auth_facebook
  version: 4.0.x
  note: 'Social Auth Facebook is a Social Auth network implementation for Facebook OAuth2 login. Its real
    login flow needs an external Facebook/Meta app, so all cases here are grounded in LOCAL config only.
    Config object social_auth_facebook.settings (keys: client_id [App ID], client_secret [App secret],
    graph_version [without leading v, e.g. 17.0], scopes, endpoints) has NO config/install, so it is absent
    until saved; baseline = object deleted. Settings form route social_auth_facebook.settings_form ->
    /admin/config/social-api/social-auth/facebook, permission ''administer social api authentication''
    (from social_auth). Adds /user/login/facebook (+ /callback). Network plugin id social_auth_facebook
    (short_name facebook), auth manager FacebookAuthManager. Rules events social_auth_facebook.user_login/user_created
    exist when rules is enabled. Medium cases write a distinctive value into social_auth_facebook.settings
    and read it back; hard cases build local config (graph_version, client_id) verified against live config.
    reset/cleanup delete the config object to restore baseline.'
questions:
- id: social_auth_facebook-config-keys
  input: Which Drupal config object stores the Facebook credentials for the social_auth_facebook module,
    and which two keys hold the Facebook App ID and App secret?
  criteria: 'Credentials live in the social_auth_facebook.settings config object; the App ID is stored
    in client_id and the App secret in client_secret (other keys: graph_version, scopes, endpoints).'
  bundle: social_auth_facebook
  rubric_ref: rubric/social_auth_facebook_social_auth_facebook_config_keys@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: social_auth_facebook-login-url
  input: After enabling social_auth_facebook, what login URL does it add for users to authenticate with
    Facebook, and what is the OAuth callback/redirect URL you must register in the Facebook app?
  criteria: It adds the login route /user/login/facebook and the OAuth callback /user/login/facebook/callback
    (the latter is the Valid OAuth Redirect URI to register in the Meta app).
  bundle: social_auth_facebook
  rubric_ref: rubric/social_auth_facebook_social_auth_facebook_login_url@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: social_auth_facebook-settings-route
  input: At what admin path is the Social Auth Facebook settings form, and which permission is required
    to access it?
  criteria: The settings form is at /admin/config/social-api/social-auth/facebook (route social_auth_facebook.settings_form),
    protected by the 'administer social api authentication' permission provided by Social Auth.
  bundle: social_auth_facebook
  rubric_ref: rubric/social_auth_facebook_social_auth_facebook_settings_route@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: social_auth_facebook-read-graph
  input: On this Drupal site, inspect the Social Auth Facebook configuration and state which Facebook
    Graph API version is currently configured.
  criteria: social_auth_facebook.settings graph_version is 18.0. Read via `drush cget social_auth_facebook.settings
    graph_version`.
  bundle: social_auth_facebook
  rubric_ref: rubric/social_auth_facebook_social_auth_facebook_read_graph@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/social_auth_facebook-graph-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/social_auth_facebook-graph-cleanup.sh
- id: social_auth_facebook-read-appid
  input: On this Drupal site, inspect the Social Auth Facebook configuration and give the Facebook App
    ID (client_id) that is currently set.
  criteria: social_auth_facebook.settings client_id is fb_probe_appid_9988. Read via `drush cget social_auth_facebook.settings
    client_id`.
  bundle: social_auth_facebook
  rubric_ref: rubric/social_auth_facebook_social_auth_facebook_read_appid@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/social_auth_facebook-appid-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/social_auth_facebook-appid-cleanup.sh
- id: social_auth_facebook-set-graph
  input: On this Drupal site, configure the Social Auth Facebook module to use Facebook Graph API version
    17.0. Apply the change to the live site's configuration.
  criteria: 'Set social_auth_facebook.settings graph_version to ''17.0'' (stored without a leading ''v''),
    e.g. `drush cset social_auth_facebook.settings graph_version 17.0 -y` or via the settings form. Verified:
    graph_version === ''17.0''.'
  bundle: social_auth_facebook
  rubric_ref: rubric/social_auth_facebook_social_auth_facebook_set_graph@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/social_auth_facebook-set-graph-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/social_auth_facebook-set-graph-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/social_auth_facebook-set-graph-verify.sh
    unused_text_checks:
      must_not_contain: []
- id: social_auth_facebook-set-appid
  input: On this Drupal site, set the Social Auth Facebook module's Facebook App ID (client_id) to 'fb_app_probe_123456'.
    Apply the change to the live site's configuration.
  criteria: 'Set social_auth_facebook.settings client_id to ''fb_app_probe_123456'', e.g. `drush cset
    social_auth_facebook.settings client_id fb_app_probe_123456 -y` or via the settings form''s App ID
    field. Verified: client_id === ''fb_app_probe_123456''.'
  bundle: social_auth_facebook
  rubric_ref: rubric/social_auth_facebook_social_auth_facebook_set_appid@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/social_auth_facebook-set-appid-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/social_auth_facebook-set-appid-cleanup.sh
