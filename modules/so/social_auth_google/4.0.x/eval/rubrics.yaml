rubrics:
- id: social_auth_google_social_auth_google_config_where
  version: '1.0'
  applicable_bundles:
  - social_auth_google
  checks:
  - kind: must_contain_any
    values:
    - social_auth_google.settings
    - admin/config/social-api/social-auth/google
    - client_id
    - client_secret
  scoring:
    combine: all_pass
- id: social_auth_google_social_auth_google_framework
  version: '1.0'
  applicable_bundles:
  - social_auth_google
  checks:
  - kind: must_contain_any
    values:
    - social_auth
    - social_auth_google
    - Social Auth
    - Network
  scoring:
    combine: all_pass
- id: social_auth_google_social_auth_google_scopes_domain
  version: '1.0'
  applicable_bundles:
  - social_auth_google
  checks:
  - kind: must_contain_any
    values:
    - openid
    - email
    - profile
    - restricted_domain
    - Workspace
    - domain
  scoring:
    combine: all_pass
- id: social_auth_google_social_auth_google_known_creds
  version: '1.0'
  applicable_bundles:
  - social_auth_google
  checks:
  - kind: must_contain_any
    values:
    - eval-123.apps.googleusercontent.com
    - example.com
  scoring:
    combine: all_pass
- id: social_auth_google_social_auth_google_known_scopes
  version: '1.0'
  applicable_bundles:
  - social_auth_google
  checks:
  - kind: must_contain_any
    values:
    - youtube.readonly
    - https://www.googleapis.com/auth/youtube.readonly
  scoring:
    combine: all_pass
- id: social_auth_google_social_auth_google_set_creds
  version: '1.0'
  applicable_bundles:
  - social_auth_google
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
- id: social_auth_google_social_auth_google_restrict_domain
  version: '1.0'
  applicable_bundles:
  - social_auth_google
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
