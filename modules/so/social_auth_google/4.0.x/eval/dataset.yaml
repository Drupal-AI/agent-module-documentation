metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: social_auth_google
  version: 4.0.x
  note: 'Social Auth Google is a Google OAuth2 provider for the Social Auth framework. Its settings live
    in config object social_auth_google.settings (client_id, client_secret, scopes, endpoints, restricted_domain);
    Network plugin id social_auth_google; service social_auth_google.manager. Actually logging in requires
    real Google OAuth credentials + Google''s servers (external), so all medium/hard cases are grounded
    in the LOCAL config object only, verifiable via drush php:eval: introspection reads back the stored
    client_id/restricted_domain and the configured scopes; execution sets the client id/secret and the
    restricted domain. Baseline: all keys empty; cleanup restores empty strings.'
questions:
- id: social_auth_google-config-where
  input: Where do I enter the Google OAuth Client ID and Client Secret for the social_auth_google module?
    Name the config object and the admin path.
  criteria: On the settings form at /admin/config/social-api/social-auth/google (route social_auth_google.settings_form),
    stored in config object social_auth_google.settings under client_id and client_secret.
  bundle: social_auth_google
  rubric_ref: rubric/social_auth_google_social_auth_google_config_where@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: social_auth_google-framework
  input: What framework/module does social_auth_google build on, and what is the id of the Network plugin
    it provides?
  criteria: It depends on the Social Auth (social_auth) framework and provides a Network plugin with id
    social_auth_google (social network 'Google'); base social_auth handles the login routes and account
    creation.
  bundle: social_auth_google
  rubric_ref: rubric/social_auth_google_social_auth_google_framework@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: social_auth_google-scopes-domain
  input: Which OAuth scopes does social_auth_google always request, and what does its restricted_domain
    setting do?
  criteria: The scopes openid, email and profile are always requested (extra scopes are comma-separated).
    restricted_domain limits sign-in to a single Google Workspace domain (empty = any Google account).
  bundle: social_auth_google
  rubric_ref: rubric/social_auth_google_social_auth_google_scopes_domain@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: social_auth_google-known-creds
  input: On this site, inspect the social_auth_google configuration and tell me the configured Google
    OAuth Client ID and the restricted domain (if any).
  criteria: config social_auth_google.settings has client_id = 'eval-123.apps.googleusercontent.com' and
    restricted_domain = 'example.com'.
  bundle: social_auth_google
  rubric_ref: rubric/social_auth_google_social_auth_google_known_creds@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/social_auth_google-creds-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/social_auth_google-creds-cleanup.sh
- id: social_auth_google-known-scopes
  input: Inspect the social_auth_google configuration on this site and tell me which additional OAuth
    scope has been configured (beyond the default openid/email/profile).
  criteria: The scopes key in social_auth_google.settings is set to https://www.googleapis.com/auth/youtube.readonly
    (requested in addition to the always-on openid/email/profile).
  bundle: social_auth_google
  rubric_ref: rubric/social_auth_google_social_auth_google_known_scopes@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/social_auth_google-scopes-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/social_auth_google-scopes-cleanup.sh
- id: social_auth_google-set-creds
  input: Configure the social_auth_google module with the Google OAuth Client ID 'eval-set.apps.googleusercontent.com'
    and Client Secret 'eval-secret-xyz'. Apply the change to the live site's configuration.
  criteria: In config social_auth_google.settings set client_id = 'eval-set.apps.googleusercontent.com'
    and client_secret = 'eval-secret-xyz' and save (e.g. drush config:set social_auth_google.settings
    client_id ... / client_secret ...).
  bundle: social_auth_google
  rubric_ref: rubric/social_auth_google_social_auth_google_set_creds@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/social_auth_google-setcreds-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/social_auth_google-setcreds-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/social_auth_google-setcreds-verify.sh
- id: social_auth_google-restrict-domain
  input: Restrict Google sign-in on this site so only accounts from the Google Workspace domain 'acme.example'
    can log in via social_auth_google. Apply the change to the live site.
  criteria: In config social_auth_google.settings set restricted_domain = 'acme.example' and save. verify
    checks restricted_domain === 'acme.example'.
  bundle: social_auth_google
  rubric_ref: rubric/social_auth_google_social_auth_google_restrict_domain@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/social_auth_google-restrict-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/social_auth_google-restrict-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/social_auth_google-restrict-verify.sh
