rubrics:
- id: sortableviews_sortableviews_styles
  version: '1.0'
  applicable_bundles:
  - sortableviews
  checks:
  - kind: must_contain_any
    values:
    - sortable_default
    - sortable_table
    - sortable_html_list
    - weight_field
  scoring:
    combine: all_pass
- id: sortableviews_sortableviews_handlers
  version: '1.0'
  applicable_bundles:
  - sortableviews
  checks:
  - kind: must_contain_any
    values:
    - sortable_views_handle
    - save_sortable_changes
    - Drag and drop handle
    - Save Sortableviews changes
  scoring:
    combine: all_pass
- id: sortableviews_sortableviews_storage
  version: '1.0'
  applicable_bundles:
  - sortableviews
  checks:
  - kind: must_contain_any
    values:
    - integer field
    - Field API
    - weight_field
    - entity
  scoring:
    combine: all_pass
- id: sortableviews_sortableviews_demo_style
  version: '1.0'
  applicable_bundles:
  - sortableviews
  checks:
  - kind: must_contain_any
    values:
    - sortable_table
  scoring:
    combine: all_pass
- id: sortableviews_sortableviews_demo_weight_field
  version: '1.0'
  applicable_bundles:
  - sortableviews
  checks:
  - kind: must_contain_any
    values:
    - field_sv_weight
  scoring:
    combine: all_pass
- id: sortableviews_sortableviews_make_sortable
  version: '1.0'
  applicable_bundles:
  - sortableviews
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
- id: sortableviews_sortableviews_handle_area
  version: '1.0'
  applicable_bundles:
  - sortableviews
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
