metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: social_api
  version: 4.0.x
  note: 'Social API is a framework: it defines the Network plugin type (src/Plugin/Network, manager plugin.network.manager,
    annotation Drupal\social_api\Annotation\Network with keys id/socialNetwork/type/className/handlers,
    alter hook social_api_network_info), the base classes NetworkBase / OAuth2Manager / SettingsBase /
    SocialApiDataHandler / UserAuthenticator / Entity\SocialApi (AES-256-CBC token encryption keyed on
    Settings::getHashSalt()) and SocialApiImplementerInstaller. It ships no config object and no config
    schema; its only site-visible state is 5 permissions and the route social_api.admin_config (/admin/config/social-api).
    Medium/hard cases therefore exercise the two real surfaces: registered Network plugin definitions
    (a throwaway module is written by the setup/agent) and the permission/role wiring for the admin route.'
questions:
- id: social_api-plugin-type
  input: I am writing a Drupal module that integrates a social network and I want to build it on the social_api
    module. What plugin type does social_api define, in which directory of my module must the plugin class
    live, which base class do I extend and which service manages these plugins?
  criteria: social_api defines the `Network` plugin type. Classes go in my_module/src/Plugin/Network/,
    extend Drupal\social_api\Plugin\NetworkBase (which implements NetworkInterface), and are managed by
    the plugin.network.manager service (Drupal\social_api\Plugin\NetworkManager). You implement the abstract
    initSdk() and callers use getSdk(), which caches the SDK instance.
  bundle: social_api
  rubric_ref: rubric/social_api_social_api_plugin_type@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: social_api-annotation-keys
  input: Show the annotation keys of a social_api @Network plugin and explain what the `handlers` key
    is used for by NetworkBase.
  criteria: '@Network takes id, socialNetwork (the human network name), type (social_auth / social_post
    / social_widgets), className (the fully qualified SDK/provider class) and handlers. NetworkBase::init()
    reads handlers.settings.class and handlers.settings.config_id, loads that config and calls <class>::factory($config)
    to build a Drupal\social_api\Settings\SettingsInterface object into $this->settings; a missing class
    or one not implementing SettingsInterface throws SocialApiException.'
  bundle: social_api
  rubric_ref: rubric/social_api_social_api_annotation_keys@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: social_api-token-encryption
  input: The social_api module stores OAuth access tokens for social accounts. How does its SocialApi
    entity base class protect those tokens, which key does it use, and what breaks if that key changes?
  criteria: Drupal\social_api\Entity\SocialApi encrypts the serialized token with openssl_encrypt() using
    AES-256-CBC and a fresh random IV, and stores base64("<encrypted>::<iv>"). The key is the site hash
    salt from settings.php (Settings::getHashSalt(), base64-decoded). create() and setToken() encrypt,
    getToken() decrypts. Changing hash_salt makes every previously stored token undecryptable. ext-openssl
    is a Composer requirement.
  bundle: social_api
  rubric_ref: rubric/social_api_social_api_token_encryption@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: social_api-admin-role
  input: This Drupal site has social_api installed and two custom roles that each hold exactly one Social
    API permission. Inspect the running site and say which role is allowed to open the Social API admin
    page at /admin/config/social-api.
  criteria: social_api_eval_admin - it holds 'administer social api configuration', which is the _permission
    requirement of the social_api.admin_config route. social_api_eval_poster only holds 'administer social
    api autoposting' and cannot open that page.
  bundle: social_api
  rubric_ref: rubric/social_api_social_api_admin_role@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/social_api-admin-role-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/social_api-admin-role-cleanup.sh
- id: social_api-registered-network
  input: 'Inspect this running Drupal site: which social_api Network plugins are currently registered,
    and what integration type does each declare?'
  criteria: 'One Network plugin is registered: eval_probe_network (label ''Eval Probe'', type social_auth),
    provided by the social_api_eval_probe module. Discoverable with \Drupal::service(''plugin.network.manager'')->getDefinitions().'
  bundle: social_api
  rubric_ref: rubric/social_api_social_api_registered_network@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/social_api-registered-network-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/social_api-registered-network-cleanup.sh
- id: social_api-network-plugin
  input: On this Drupal site, create a module at web/modules/custom/social_api_eval_net that registers
    a social_api Network plugin with id `social_api_eval_net`, integration type `social_auth` and the
    human network name 'Eval Net'. The plugin class must extend social_api's NetworkBase and implement
    its abstract SDK initialisation method (returning a plain stdClass is fine). Enable the module so
    the plugin is discoverable on the live site.
  criteria: \Drupal::service('plugin.network.manager')->hasDefinition('social_api_eval_net') is TRUE,
    the definition's type is social_auth, and its class is a subclass of Drupal\social_api\Plugin\NetworkBase
    (the plugin lives in src/Plugin/Network/ with an @Network annotation and an initSdk() implementation).
  bundle: social_api
  rubric_ref: rubric/social_api_social_api_network_plugin@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/social_api-network-plugin-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/social_api-network-plugin-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/social_api-network-plugin-verify.sh
- id: social_api-manager-role
  input: On this Drupal site I need a role called social_api_manager (machine name exactly that) whose
    only job is to let someone open the Social API settings page at /admin/config/social-api. Give it
    just the one permission needed for that page and no other Social API permissions. Create the role
    on the live site.
  criteria: user.role.social_api_manager exists with the permission 'administer social api configuration'
    (the _permission requirement of the social_api.admin_config route) and none of the other four 'administer
    social api …' permissions.
  bundle: social_api
  rubric_ref: rubric/social_api_social_api_manager_role@1.0
