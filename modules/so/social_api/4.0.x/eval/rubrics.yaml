rubrics:
- id: social_api_social_api_plugin_type
  version: '1.0'
  applicable_bundles:
  - social_api
  checks:
  - kind: must_contain_any
    values:
    - Plugin/Network
    - NetworkBase
    - plugin.network.manager
  scoring:
    combine: all_pass
- id: social_api_social_api_annotation_keys
  version: '1.0'
  applicable_bundles:
  - social_api
  checks:
  - kind: must_contain_any
    values:
    - socialNetwork
    - className
    - handlers
  scoring:
    combine: all_pass
- id: social_api_social_api_token_encryption
  version: '1.0'
  applicable_bundles:
  - social_api
  checks:
  - kind: must_contain_any
    values:
    - aes-256-cbc
    - hash salt
    - getHashSalt
  scoring:
    combine: all_pass
- id: social_api_social_api_admin_role
  version: '1.0'
  applicable_bundles:
  - social_api
  checks:
  - kind: must_contain_any
    values:
    - social_api_eval_admin
  scoring:
    combine: all_pass
- id: social_api_social_api_registered_network
  version: '1.0'
  applicable_bundles:
  - social_api
  checks:
  - kind: must_contain_any
    values:
    - eval_probe_network
  scoring:
    combine: all_pass
- id: social_api_social_api_network_plugin
  version: '1.0'
  applicable_bundles:
  - social_api
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
- id: social_api_social_api_manager_role
  version: '1.0'
  applicable_bundles:
  - social_api
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
