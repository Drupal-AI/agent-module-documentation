metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: social_media
  version: 2.0.x
  note: Social media share renders configurable share/follow links for the current page as a block (social_sharing_block)
    or a field. All behavior lives in one config object, social_media.settings, under a top-level 'social_media'
    mapping keyed by network (facebook_share, facebook_msg, linkedin, twitter, pinterest, whatsapp, email,
    print); each network is an 'item' with enable/text/api_url/api_event/weight/default_img/attributes.
    Token replacement fills [current-page:url]/[current-page:title]. The module has NO permissions, NO
    plugin manager/types, and NO drush commands of its own; it extends via three Symfony events (add_more_social_media,
    pre_execute, pre_render). Tiers are therefore config-centric. Easy = recipe (answer from docs/source).
    Medium = introspection (read a known value planted in live social_media.settings). Hard = execution
    (write social_media.settings, verified live). Script paths are relative to /var/www/html.
questions:
- id: social_media-config-object
  input: In the Drupal 'Social media share' (social_media) module, what is the name of the single config
    object that stores all the share-link settings, and under which top-level key are the individual networks
    nested inside it?
  criteria: The config object is social_media.settings; the per-network items are nested under its top-level
    'social_media' mapping (e.g. social_media.settings:social_media.twitter).
  bundle: social_media
  rubric_ref: rubric/social_media_social_media_config_object@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: social_media-token-placeholder
  input: In the social_media module, each network's api_url is run through Token replacement so the link
    shares whatever page it renders on. Which token placeholder gives the URL of the current page? The
    module depends on which module to provide it?
  criteria: '[current-page:url] resolves to the current page URL (and [current-page:title] to its title).
    Provided by the Token module, which social_media depends on.'
  bundle: social_media
  rubric_ref: rubric/social_media_social_media_token_placeholder@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: social_media-add-network-event
  input: The social_media module is extended with Symfony events rather than alter hooks. Which event
    name do I subscribe to in order to register a brand-new social network so it shows up in the settings,
    and what event class is dispatched?
  criteria: Subscribe to the 'social_media.add_more_social_media' event; the dispatched object is Drupal\social_media\Event\SocialMediaEvent
    (use getElement()/setElement() to add a key => Label).
  bundle: social_media
  rubric_ref: rubric/social_media_social_media_add_network_event@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: social_media-whatsapp-known-introspect
  input: This Drupal site has the social_media (Social media share) module with one extra share network
    turned on beyond the defaults, and it was given a custom link label. Inspect the running site (drush
    available) and tell me which network is enabled and the exact label text it will display.
  criteria: The WhatsApp network is enabled in social_media.settings with text = 'Share on WhatsApp' (read
    from live config).
  bundle: social_media
  rubric_ref: rubric/social_media_social_media_whatsapp_known_introspect@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    persona: drupal-expert
    setup: agent-module-documentation/evaluation/verify/social_media-whatsapp-known-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/social_media-whatsapp-known-cleanup.sh
- id: social_media-email-forward-introspect
  input: On this Drupal site the social_media module's Email share item has been switched into its 'forward
    this page' mode. Inspect the running site (drush available) and tell me the two integer setting keys
    on the email item that are turned on to enable the in-site forward form and to open it in an AJAX
    modal dialog.
  criteria: On social_media.settings:social_media.email both enable_forward=1 (use the in-site /social-media-forward
    form) and show_forward=1 (open it in an AJAX modal) are set.
  bundle: social_media
  rubric_ref: rubric/social_media_social_media_email_forward_introspect@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    persona: drupal-expert
    setup: agent-module-documentation/evaluation/verify/social_media-email-forward-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/social_media-email-forward-cleanup.sh
- id: social_media-enable-whatsapp
  input: On this Drupal site (DDEV, drush available), configure the social_media (Social media share)
    module so the WhatsApp share network is enabled and its share link points at the WhatsApp share endpoint
    carrying the current page URL (use the wa.me sharer with the [current-page:url] token). Apply the
    change to the live site via drush/config -- do not just describe it. Give a one-line summary of what
    you changed.
  criteria: social_media.settings social_media.whatsapp has enable=1 and api_url containing wa.me and
    [current-page:url]. Verified against live config.
  bundle: social_media
  rubric_ref: rubric/social_media_social_media_enable_whatsapp@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/social_media-enable-whatsapp-reset.sh
    verify: agent-module-documentation/evaluation/verify/social_media-enable-whatsapp-verify.sh
- id: social_media-print-button
  input: 'On this Drupal site (drush available), configure the social_media module''s Print network so
    visitors get a working ''Print this page'' button: it must be enabled, trigger the browser print dialog
    via window.print(), and be wired as a JavaScript action (api_event = onclick) rather than a normal
    link. Apply it to the running site via drush/config. State in one line what you changed.'
  criteria: social_media.settings social_media.print has enable=1, api_url=window.print(), api_event=onclick.
    Verified against live config.
  bundle: social_media
  rubric_ref: rubric/social_media_social_media_print_button@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/social_media-print-button-reset.sh
    verify: agent-module-documentation/evaluation/verify/social_media-print-button-verify.sh
