rubrics:
- id: jsonapi_image_styles_jis_field_name
  version: '1.0'
  applicable_bundles:
  - jsonapi_image_styles
  checks:
  - kind: must_contain_any
    values:
    - image_style_uri
    - file
  scoring:
    combine: all_pass
- id: jsonapi_image_styles_jis_config_key
  version: '1.0'
  applicable_bundles:
  - jsonapi_image_styles
  checks:
  - kind: must_contain_any
    values:
    - jsonapi_image_styles.settings
    - image_styles
  scoring:
    combine: all_pass
- id: jsonapi_image_styles_jis_access_route
  version: '1.0'
  applicable_bundles:
  - jsonapi_image_styles
  checks:
  - kind: must_contain_any
    values:
    - Administer image styles
    - administer image styles
    - /admin/config/services/jsonapi/image_styles
  scoring:
    combine: all_pass
- id: jsonapi_image_styles_jis_exposed_styles
  version: '1.0'
  applicable_bundles:
  - jsonapi_image_styles
  checks:
  - kind: must_contain_any
    values:
    - thumbnail
    - large
  scoring:
    combine: all_pass
- id: jsonapi_image_styles_jis_is_medium_exposed
  version: '1.0'
  applicable_bundles:
  - jsonapi_image_styles
  checks:
  - kind: must_contain_any
    values:
    - wide
    - not
  scoring:
    combine: all_pass
- id: jsonapi_image_styles_jis_expose_thumbnail
  version: '1.0'
  applicable_bundles:
  - jsonapi_image_styles
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
- id: jsonapi_image_styles_jis_expose_two
  version: '1.0'
  applicable_bundles:
  - jsonapi_image_styles
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
