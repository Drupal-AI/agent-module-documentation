rubrics:
- id: jsonapi_search_api_facets_jsonapi_search_api_facets_where_facets_appear
  version: '1.0'
  applicable_bundles:
  - jsonapi_search_api_facets
  checks:
  - kind: must_contain_any
    values:
    - meta.facets
    - meta
    - filter
    - filter[
  scoring:
    combine: all_pass
- id: jsonapi_search_api_facets_jsonapi_search_api_facets_plugins
  version: '1.0'
  applicable_bundles:
  - jsonapi_search_api_facets
  checks:
  - kind: must_contain_any
    values:
    - 'jsonapi_search_api_facets:'
    - jsonapi_search_api
    - json_api
    - facet source
    - widget
  scoring:
    combine: all_pass
- id: jsonapi_search_api_facets_jsonapi_search_api_facets_auto_widget
  version: '1.0'
  applicable_bundles:
  - jsonapi_search_api_facets
  checks:
  - kind: must_contain_any
    values:
    - jsonapi_search_api
    - json_api
    - presave
    - widget
  scoring:
    combine: all_pass
- id: jsonapi_search_api_facets_jsonapi_search_api_facets_known_facet
  version: '1.0'
  applicable_bundles:
  - jsonapi_search_api_facets
  checks:
  - kind: must_contain_any
    values:
    - jsonapi_search_api
  scoring:
    combine: all_pass
- id: jsonapi_search_api_facets_jsonapi_search_api_facets_add_facet
  version: '1.0'
  applicable_bundles:
  - jsonapi_search_api_facets
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
