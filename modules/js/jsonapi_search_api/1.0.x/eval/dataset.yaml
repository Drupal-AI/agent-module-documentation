metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: jsonapi_search_api
  version: 1.0.x
  note: 'JSON:API Search API has NO config of its own (configure=null), no settings form, no permissions,
    no Drush, no plugin types. It exposes every ENABLED Search API index as a JSON:API resource at /%jsonapi%/index/<id>
    via a dynamic route generator (Routing\Routes::routes()), served by Resource\IndexResource. Query
    params map to Search API: filter[fulltext] -> keywords, filter[...] -> conditions (operators =,<>,>,>=,<,<=,IN,NOT
    IN,BETWEEN,NOT BETWEEN,IS NULL,IS NOT NULL; NOT STARTS_WITH/CONTAINS/ENDS_WITH), sort -> sorts, page[offset]/page[limit]
    -> range. meta is extensible via event jsonapi_search_api.add_search_meta. Medium/hard are grounded
    in the module''s real behaviour (route-per-enabled-index) without a live external server: cases build
    a DB-backed (search_api_db) server + index. verify calls the module''s own Routes::routes() generator
    (no router rebuild needed) and checks jsonapi_search_api.index_<id> - which only exists when the index
    is enabled.'
questions:
- id: jsonapi_search_api-endpoint-path
  input: With the jsonapi_search_api module, at what URL is a Search API index exposed over JSON:API,
    and which indexes get a route?
  criteria: Each enabled Search API index is exposed at /%jsonapi%/index/<index_id> (default /jsonapi/index/<id>),
    via a route jsonapi_search_api.index_<id> generated by Routing\Routes::routes(). Only enabled indexes
    get a route.
  bundle: jsonapi_search_api
  rubric_ref: rubric/jsonapi_search_api_jsonapi_search_api_endpoint_path@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: jsonapi_search_api-query-params
  input: How do I run a fulltext search and paginate when querying a jsonapi_search_api index endpoint?
    Which query parameters are used?
  criteria: Use filter[fulltext]=<terms> to set the search keywords, page[offset] and page[limit] for
    pagination, sort for sorting, and filter[...] for conditions. E.g. GET /jsonapi/index/content?filter[fulltext]=climate&page[limit]=10&sort=-created.
  bundle: jsonapi_search_api
  rubric_ref: rubric/jsonapi_search_api_jsonapi_search_api_query_params@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: jsonapi_search_api-meta-event
  input: How can another module add extra data (for example facets) to the meta section of a jsonapi_search_api
    search response?
  criteria: Subscribe to the event jsonapi_search_api.add_search_meta (Events::ADD_SEARCH_META) and use
    AddSearchMetaEvent::setMeta($key, $value). The IndexResource dispatches it before responding; this
    is how the facets submodule adds meta.facets.
  bundle: jsonapi_search_api
  rubric_ref: rubric/jsonapi_search_api_jsonapi_search_api_meta_event@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: jsonapi_search_api-known-index
  input: This Drupal site has an enabled Search API index named jsa_known. Given the jsonapi_search_api
    module, at what JSON:API URL path is that index's search resource exposed?
  criteria: It is exposed at /jsonapi/index/jsa_known (route jsonapi_search_api.index_jsa_known), because
    jsonapi_search_api creates a route for every enabled index.
  bundle: jsonapi_search_api
  rubric_ref: rubric/jsonapi_search_api_jsonapi_search_api_known_index@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/jsonapi_search_api-known-index-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/jsonapi_search_api-known-index-cleanup.sh
- id: jsonapi_search_api-expose-index
  input: On this Drupal site there is a Search API index jsa_task (attached to server jsa_task_srv) that
    is currently disabled, so jsonapi_search_api does not expose it. Make jsonapi_search_api expose index
    jsa_task as a JSON:API resource, and apply the change to the live site.
  criteria: Enable the index (set status TRUE and save; it already has server jsa_task_srv). jsonapi_search_api
    only routes enabled indexes, so once enabled Routing\Routes::routes() produces route jsonapi_search_api.index_jsa_task
    at /jsonapi/index/jsa_task.
  bundle: jsonapi_search_api
  rubric_ref: rubric/jsonapi_search_api_jsonapi_search_api_expose_index@1.0
