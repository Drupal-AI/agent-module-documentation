rubrics:
- id: jsonapi_include_jsonapi_include_default_behavior
  version: '1.0'
  applicable_bundles:
  - jsonapi_include
  checks:
  - kind: must_contain_any
    values:
    - use_include_query
    - jsonapi_include=1
  scoring:
    combine: all_pass
- id: jsonapi_include_jsonapi_include_what_it_does
  version: '1.0'
  applicable_bundles:
  - jsonapi_include
  checks:
  - kind: must_contain_any
    values:
    - flatten
    - merge
    - inline
    - included
    - relationships
  scoring:
    combine: all_pass
- id: jsonapi_include_jsonapi_include_customize_service
  version: '1.0'
  applicable_bundles:
  - jsonapi_include
  checks:
  - kind: must_contain_any
    values:
    - jsonapi_include.parse
    - JsonapiParse
  scoring:
    combine: all_pass
- id: jsonapi_include_jsonapi_include_current_mode
  version: '1.0'
  applicable_bundles:
  - jsonapi_include
  checks:
  - kind: must_contain_any
    values:
    - opt-in
    - opt in
    - jsonapi_include=1
    - use_include_query
  scoring:
    combine: all_pass
- id: jsonapi_include_jsonapi_include_required_query_arg
  version: '1.0'
  applicable_bundles:
  - jsonapi_include
  checks:
  - kind: must_contain_any
    values:
    - jsonapi_include=1
  scoring:
    combine: all_pass
- id: jsonapi_include_jsonapi_include_enable_optin
  version: '1.0'
  applicable_bundles:
  - jsonapi_include
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
- id: jsonapi_include_jsonapi_include_flatten_all
  version: '1.0'
  applicable_bundles:
  - jsonapi_include
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
