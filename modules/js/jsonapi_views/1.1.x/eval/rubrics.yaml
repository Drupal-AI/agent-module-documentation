rubrics:
- id: jsonapi_views_jav_url_pattern
  version: '1.0'
  applicable_bundles:
  - jsonapi_views
  checks:
  - kind: must_contain_any
    values:
    - /jsonapi/views/
    - jsonapi/views
  scoring:
    combine: all_pass
- id: jsonapi_views_jav_query_params
  version: '1.0'
  applicable_bundles:
  - jsonapi_views
  checks:
  - kind: must_contain_any
    values:
    - views-filter
    - views-sort
    - views-argument
  scoring:
    combine: all_pass
- id: jsonapi_views_jav_disable_exposure
  version: '1.0'
  applicable_bundles:
  - jsonapi_views
  checks:
  - kind: must_contain_any
    values:
    - display_extender
    - Expose via JSON:API
    - enabled
    - jsonapi_views
  scoring:
    combine: all_pass
- id: jsonapi_views_jav_exposed
  version: '1.0'
  applicable_bundles:
  - jsonapi_views
  checks:
  - kind: must_contain_any
    values:
    - not exposed
    - 'false'
    - disabled
    - not be exposed
    - is not exposed
  scoring:
    combine: all_pass
- id: jsonapi_views_jav_url
  version: '1.0'
  applicable_bundles:
  - jsonapi_views
  checks:
  - kind: must_contain_any
    values:
    - /jsonapi/views/jav_display/page_1
  scoring:
    combine: all_pass
- id: jsonapi_views_jav_disable
  version: '1.0'
  applicable_bundles:
  - jsonapi_views
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
- id: jsonapi_views_jav_enable
  version: '1.0'
  applicable_bundles:
  - jsonapi_views
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
