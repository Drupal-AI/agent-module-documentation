metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: jsonapi_views
  version: 1.1.x
  note: 'JSON:API Views exposes each Views display as a JSON:API resource at /jsonapi/views/{viewId}/{displayId}
    (dynamic routes in Routing\Routes, backed by jsonapi_resources ViewsResource). Query params: ?views-filter[<id>]=,
    ?views-sort[sort_by]=/[sort_order]=, ?views-argument[]= (repeatable), ?page=. Exposure is controlled
    by a Views display extender id `jsonapi_views` (option `enabled`, default TRUE) stored at display_options.display_extenders.jsonapi_views.enabled
    in the view config; a not-exposed/denied resource returns 403. No configure route, no permission,
    no Drush. Medium/hard cases are grounded in real view config (the extender enabled flag and the display
    machine names).'
questions:
- id: jav-url-pattern
  input: With the jsonapi_views module installed, what is the URL pattern to fetch a Views display over
    JSON:API?
  criteria: It is /{jsonapi_base_path}/views/{viewId}/{displayId}, i.e. typically /jsonapi/views/{viewId}/{displayId}
    (one resource per view display).
  bundle: jsonapi_views
  rubric_ref: rubric/jsonapi_views_jav_url_pattern@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: jav-query-params
  input: How do you pass exposed filters, sorts, contextual arguments and pagination to a jsonapi_views
    resource via query parameters?
  criteria: 'Filters: ?views-filter[<id>]=<value>; sorts: ?views-sort[sort_by]=<id>&views-sort[sort_order]=DESC;
    contextual args: ?views-argument[]=<value> (repeatable); pagination: ?page=<n>.'
  bundle: jsonapi_views
  rubric_ref: rubric/jsonapi_views_jav_query_params@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: jav-disable-exposure
  input: By default jsonapi_views exposes all view displays. How do you stop a particular view display
    from being exposed via JSON:API?
  criteria: 'Use the `jsonapi_views` Views display extender: uncheck ''Expose via JSON:API'' on the display
    (set display_options.display_extenders.jsonapi_views.enabled = false in the view config). A non-exposed
    resource returns 403.'
  bundle: jsonapi_views
  rubric_ref: rubric/jsonapi_views_jav_disable_exposure@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: jav-exposed
  input: On this site there is a view with machine name jav_known. Inspect its configuration and state
    whether its default display is exposed via JSON:API by the jsonapi_views module.
  criteria: 'It is NOT exposed: the default display''s display_extenders.jsonapi_views.enabled is false
    in views.view.jav_known, so the JSON:API resource returns 403.'
  bundle: jsonapi_views
  rubric_ref: rubric/jsonapi_views_jav_exposed@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/jsonapi_views-exposed-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/jsonapi_views-exposed-cleanup.sh
- id: jav-url
  input: This site has a view with machine name jav_display that has a page display. Inspect the view
    and give the jsonapi_views JSON:API URL for that page display.
  criteria: The page display's id is page_1, so the JSON:API Views URL is /jsonapi/views/jav_display/page_1.
  bundle: jsonapi_views
  rubric_ref: rubric/jsonapi_views_jav_url@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/jsonapi_views-url-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/jsonapi_views-url-cleanup.sh
- id: jav-disable
  input: On this site the view jav_task is currently exposed via JSON:API. Using the jsonapi_views display
    extender, turn OFF JSON:API exposure for its default display and apply the change to the live view
    configuration.
  criteria: Set display_options.display_extenders.jsonapi_views.enabled = false on the default display
    of views.view.jav_task and save (e.g. load the view, $d = &$view->getDisplay('default'); $d['display_options']['display_extenders']['jsonapi_views']['enabled']
    = FALSE; $view->save()).
  bundle: jsonapi_views
  rubric_ref: rubric/jsonapi_views_jav_disable@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/jsonapi_views-disable-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/jsonapi_views-disable-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/jsonapi_views-disable-verify.sh
- id: jav-enable
  input: On this site the view jav_task2 has JSON:API exposure turned off on its default display. Using
    jsonapi_views, make that display exposed via JSON:API again and apply the change to the live view
    configuration.
  criteria: Set the jsonapi_views extender enabled to true (or remove the extender, since default is TRUE)
    on the default display of views.view.jav_task2 and save.
  bundle: jsonapi_views
  rubric_ref: rubric/jsonapi_views_jav_enable@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/jsonapi_views-enable-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/jsonapi_views-enable-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/jsonapi_views-enable-verify.sh
