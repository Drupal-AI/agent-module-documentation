metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: json_field
  version: 1.7.x
  note: 'JSON Field ships three field types (json, json_native, json_native_binary), one widget (json_textarea),
    two formatters (json with an attach_library setting, and pretty), a valid_json constraint, two render
    elements (json_text, json_pretty), the services json_field.views / json_field.requirements / serializer.normalizer.json_item.native,
    and Views data that adds a <field>_json_value column handled by the json_data Views field plugin.
    It has NO settings form and NO configure route, so every medium/hard case is grounded in real field
    + display configuration: field.storage.node.<field> (type, settings.size) and core.entity_form_display
    / core.entity_view_display components.'
questions:
- id: json_field-field-types
  input: The Drupal contrib module json_field provides more than one JSON field type. Name the machine
    ids of the field types it registers and explain what database column each one uses on MySQL and on
    PostgreSQL.
  criteria: 'Three field types: `json` (JSON (text)) stores in a varchar/text column sized by the `size`
    storage setting; `json_native` (JSON (raw)) uses a native json column on MySQL and PostgreSQL (LONGTEXT
    on MariaDB, text on SQLite); `json_native_binary` (JSONB/JSON (raw)) uses jsonb on PostgreSQL and
    a json column on MySQL. All three live in the `json_data` field-type category and default to the json_textarea
    widget and json formatter.'
  bundle: json_field
  rubric_ref: rubric/json_field_json_field_field_types@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: json_field-size-setting
  input: On a Drupal 11 site using the json_field module, I created a field of type 'JSON (text)'. Which
    storage setting controls how big the database column is, what values can it take, and what is the
    default?
  criteria: 'The `size` storage setting on the `json` field type (JsonItem::defaultStorageSettings()).
    Allowed values are 255 (varchar 255), 65535 (text ''normal'', 16 KB), 16777216 (text ''medium'', 4
    MB) and 4294967296 (text ''big'', 1 GB, the default). A Length constraint is derived from it: max
    = size for 255, otherwise floor(size / 4) because of utf8mb4. json_native and json_native_binary have
    no storage settings.'
  bundle: json_field
  rubric_ref: rubric/json_field_json_field_size_setting@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: json_field-validation
  input: With the json_field module installed on Drupal 11, what stops an editor from saving broken JSON
    into a JSON field? Name the validation constraint plugin id and say when it does and does not run.
  criteria: The `valid_json` constraint (Drupal\json_field\Plugin\Validation\Constraint\ValidJsonConstraint)
    is declared on all three field types. Its validator skips empty values and otherwise decodes the string
    with the `serializer` service, adding the violation 'The supplied text is not valid JSON data (@error).'
    on failure. It runs wherever entity validation runs (entity forms, $entity->validate(), REST/JSON:API
    writes) but is bypassed by a bare $entity->save() in PHP.
  bundle: json_field
  rubric_ref: rubric/json_field_json_field_validation@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: json_field-known-size
  input: This Drupal site has a json_field field called field_jf_known on the Article content type. Inspect
    the running site and report the field type machine name and the exact value of its `size` storage
    setting.
  criteria: 'field_jf_known is of type `json` (JSON (text)) and its storage setting is size: 65535 - i.e.
    a `text` column of size ''normal'' (16 KB). Readable with `drush cget field.storage.node.field_jf_known`.'
  bundle: json_field
  rubric_ref: rubric/json_field_json_field_known_size@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/json_field-known-size-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/json_field-known-size-cleanup.sh
- id: json_field-formatter-pretty
  input: The Article content type on this Drupal site has two json_field fields, field_jf_plain and field_jf_fancy.
    One of them is rendered with json_field's 'Pretty' formatter on the default view display. Inspect
    the live configuration and say which field that is, and which formatter the other one uses.
  criteria: field_jf_fancy uses the `pretty` formatter; field_jf_plain uses the `json` (Plain text) formatter
    with attach_library set to false. Both are in core.entity_view_display.node.article.default under
    content.<field>.type.
  bundle: json_field
  rubric_ref: rubric/json_field_json_field_formatter_pretty@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/json_field-formatter-pretty-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/json_field-formatter-pretty-cleanup.sh
- id: json_field-native-field
  input: On this Drupal site, add a field named field_jf_task to the Article content type using json_field's
    'JSON (raw)' field type (the one that stores data in a native JSON database column, not the text-column
    variant). Give it the label 'Task Payload' and place it on the Article default form display using
    json_field's plain textarea widget. Apply the change to the live site.
  criteria: field.storage.node.field_jf_task has type json_native, field.field.node.article.field_jf_task
    exists, and core.entity_form_display.node.article.default has content.field_jf_task with type json_textarea.
  bundle: json_field
  rubric_ref: rubric/json_field_json_field_native_field@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/json_field-native-field-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/json_field-native-field-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/json_field-native-field-verify.sh
- id: json_field-pretty-display
  input: On this Drupal site the Article content type has a JSON field called field_jf_out. Right now
    it prints the raw JSON text in a code block. I want it rendered as a readable nested list instead,
    using json_field's own display option - no extra JavaScript library involved. Change the Article's
    default display so it does that, and save the change on the live site.
  criteria: In core.entity_view_display.node.article.default the field_jf_out component uses formatter
    type `pretty` (json_field's PrettyFormatter, which renders nested <ul>/<dl> markup via the json_pretty
    render element and attaches only the json_field/json_field.pretty CSS).
  bundle: json_field
  rubric_ref: rubric/json_field_json_field_pretty_display@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: site-owner-layman
    reset: agent-module-documentation/evaluation/verify/json_field-pretty-display-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/json_field-pretty-display-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/json_field-pretty-display-verify.sh
