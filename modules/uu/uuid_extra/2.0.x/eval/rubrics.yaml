rubrics:
- id: uuid_extra_uuid_extra_how_to_show
  version: '1.0'
  applicable_bundles:
  - uuid_extra
  checks:
  - kind: must_contain_any
    values:
    - Manage form display
    - Manage display
    - display configurable
    - setDisplayConfigurable
    - uuid widget
    - uuid formatter
  scoring:
    combine: all_pass
- id: uuid_extra_uuid_extra_plugins
  version: '1.0'
  applicable_bundles:
  - uuid_extra
  checks:
  - kind: must_contain_any
    values:
    - disabled
    - read-only
    - cannot
    - UuidFieldWidget
    - textfield
  scoring:
    combine: all_pass
- id: uuid_extra_uuid_extra_mechanism
  version: '1.0'
  applicable_bundles:
  - uuid_extra
  checks:
  - kind: must_contain_any
    values:
    - hook_entity_base_field_info_alter
    - setDisplayConfigurable
    - entity_base_field_info_alter
  scoring:
    combine: all_pass
- id: uuid_extra_uuid_extra_which_bundle_form
