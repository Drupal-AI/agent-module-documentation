metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: layout_builder_component_attributes
  version: 2.3.x
  note: Module adds HTML attributes to Layout Builder components via a contextual 'Manage attributes'
    form, a global settings config object, two permissions, and a preprocess/event-subscriber render path.
    Cases are `recipe` (response-graded); they probe documented facts an agent would otherwise read source
    to answer. No site mutation.
questions:
- id: lbca-purpose-and-groups
  input: On a Drupal 11 site using Layout Builder, I want editors to add HTML attributes (id, class, style,
    data-*) to individual blocks placed in a layout. Which module does this, and what three parts of a
    block can attributes target?
  criteria: 'The Layout Builder Component Attributes module. Attributes target three groups: the block
    wrapper (outer) element, the block title element, and the block content (inner) element.'
  bundle: layout_builder_component_attributes
  rubric_ref: rubric/layout_builder_component_attributes_lbca_purpose_and_groups@1.0
  tags:
  - mode:recipe
- id: lbca-dependency
  input: What module dependency does Layout Builder Component Attributes require to work on a Drupal site?
  criteria: It depends only on core Layout Builder (drupal:layout_builder).
  bundle: layout_builder_component_attributes
  rubric_ref: rubric/layout_builder_component_attributes_lbca_dependency@1.0
  tags:
  - mode:recipe
- id: lbca-global-settings
  input: How do I control which attribute types (id/class/style/data) editors are allowed to set on Layout
    Builder components? Give the config object and the three keys.
  criteria: The layout_builder_component_attributes.settings config object, via the three group keys allowed_block_attributes,
    allowed_block_title_attributes, and allowed_block_content_attributes (each with id/class/style/data
    booleans, default true). Edit at /admin/config/content/layout-builder-component-attributes.
  bundle: layout_builder_component_attributes
  rubric_ref: rubric/layout_builder_component_attributes_lbca_global_settings@1.0
  tags:
  - mode:recipe
- id: lbca-permissions
  input: What are the two permissions Layout Builder Component Attributes defines, and which one lets
    editors add attributes to components versus manage the global settings?
  criteria: '''manage layout builder component attributes'' lets editors add attributes to components
    (the per-component Manage attributes form); ''administer layout builder component attributes'' gates
    the global settings form.'
  bundle: layout_builder_component_attributes
  rubric_ref: rubric/layout_builder_component_attributes_lbca_permissions@1.0
  tags:
  - mode:recipe
- id: lbca-add-attributes-flow
  input: As an editor, how do I actually add an id or class to a specific block on an entity's Layout
    Builder layout page?
  criteria: On the layout page, use the component's 'Manage attributes' contextual link (an off-canvas
    form, shown after 'Configure'), enter id/class/style/data-* in the relevant group (Block / Block title
    / Block content), and click Update.
  bundle: layout_builder_component_attributes
  rubric_ref: rubric/layout_builder_component_attributes_lbca_add_attributes_flow@1.0
  tags:
  - mode:recipe
- id: lbca-render-variables
  input: How do the stored component attributes end up on the rendered block markup in Drupal? Which Twig
    attribute variables get the wrapper, title, and content attributes?
  criteria: 'An event subscriber puts them on the build as #component_attributes; layout_builder_component_attributes_preprocess_block()
    merges each group into the block Twig variables: attributes (wrapper), title_attributes (title), and
    content_attributes (content).'
  bundle: layout_builder_component_attributes
  rubric_ref: rubric/layout_builder_component_attributes_lbca_render_variables@1.0
  tags:
  - mode:recipe
- id: lbca-content-attributes-theme
  input: I added attributes to the block content (inner) element in Layout Builder Component Attributes
    but they aren't showing up. Why, and what does the theme need?
  criteria: Content-group attributes only render if the active theme's block.html.twig outputs content_attributes
    on the inner element. Many core themes don't print it, so those attributes are dropped; wrapper and
    title attributes still render.
  bundle: layout_builder_component_attributes
  rubric_ref: rubric/layout_builder_component_attributes_lbca_content_attributes_theme@1.0
  tags:
  - mode:recipe
- id: lbca-data-attribute-syntax
  input: In the Layout Builder Component Attributes 'Manage attributes' form, how do I enter data-* attributes,
    and what naming rule is enforced?
  criteria: One data-* attribute per line in the textarea, using name|value with the value optional (e.g.
    data-test|example-value or data-flag). Each name must begin with 'data-'; a line without a value renders
    as a boolean attribute.
  bundle: layout_builder_component_attributes
  rubric_ref: rubric/layout_builder_component_attributes_lbca_data_attribute_syntax@1.0
  tags:
  - mode:recipe
