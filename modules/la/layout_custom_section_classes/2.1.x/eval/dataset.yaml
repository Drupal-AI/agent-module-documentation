metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: layout_custom_section_classes
  version: 2.1.x
  note: 'Layout Custom Section Classes adds ID/class/class-list/style/data-* attribute fields to Layout
    Builder sections and their regions via hook_form_layout_builder_configure_section_alter, applied at
    render by hook_preprocess_layout. It defines no plugin TYPES. A single global config object ''layout_custom_section_classes.settings''
    (configure route layout_custom_section_classes.settings at /admin/config/content/layout-builder-section-attributes)
    controls which attribute types are offered via allowed_section_attributes.{id,class,class_list,style,data}
    and allowed_section_region_attributes.{...} (booleans), a predefined class_list (sequence of ''class''
    or ''class|Friendly name'' strings), and relax_css_validation (bool). It defines 3 permissions. Per-section
    values live on the layout plugin config (custom_id, custom_classes, custom_class_choose, custom_styles,
    custom_data_attributes, regions.<id>.region_*). Medium/hard cases are grounded in the real settings
    config: introspection reads back the predefined class list / whether data-* is allowed; execution
    adds a predefined class and disables inline styles, verified against the live config. All cleanups
    restore the shipped defaults explicitly (all attributes true, class_list empty, relax off).'
questions:
- id: layout_custom_section_classes-what-attributes
  input: Using the layout_custom_section_classes module, what kinds of HTML attributes can an editor add
    to a Layout Builder section, and where is the settings page that controls which of them are available?
  criteria: Editors can add an ID, CSS class(es), a predefined class list, inline styles, and data-* attributes
    to a section (and to each region). Which are offered is controlled by the settings form at /admin/config/content/layout-builder-section-attributes
    (config layout_custom_section_classes.settings) via allowed_section_attributes.{id,class,class_list,style,data}.
  bundle: layout_custom_section_classes
  rubric_ref: rubric/layout_custom_section_classes_layout_custom_section_classes_what_attributes@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: layout_custom_section_classes-template-requirement
  input: I set custom classes on a Layout Builder section with layout_custom_section_classes but they
    don't appear in the markup. What does the layout's Twig template need for section (and region) classes
    to render?
  criteria: The chosen layout template must print {{ attributes }} for the section (e.g. {{ attributes.addClass(classes)
    }}) and {{ region_attributes.REGION }} for each region. hook_preprocess_layout pushes the values onto
    those variables; a template that hard-codes its wrapper without them drops the classes.
  bundle: layout_custom_section_classes
  rubric_ref: rubric/layout_custom_section_classes_layout_custom_section_classes_template_requirement@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: layout_custom_section_classes-class-list
  input: With layout_custom_section_classes, how can I give editors a fixed list of CSS classes to choose
    from (instead of free-typing), and how do I show a friendly label for each class?
  criteria: On the settings form fill 'CSS classes to choose from' (config key class_list), one class
    per line. Use 'class-name|Friendly name' to show a friendly label; the part before | is the actual
    class. Editors then see a 'Choose classes' checkbox list (custom_class_choose) on the section form.
  bundle: layout_custom_section_classes
  rubric_ref: rubric/layout_custom_section_classes_layout_custom_section_classes_class_list@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: layout_custom_section_classes-known-classlist
  input: On this Drupal site, layout_custom_section_classes has a predefined list of CSS classes configured
    for Layout Builder sections. Inspect the live module settings and tell me the CSS class names in that
    predefined list.
  criteria: In layout_custom_section_classes.settings the class_list is [bg-eval-dark|Dark background,
    py-eval-3], i.e. the classes bg-eval-dark and py-eval-3.
  bundle: layout_custom_section_classes
  rubric_ref: rubric/layout_custom_section_classes_layout_custom_section_classes_known_classlist@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/layout_custom_section_classes-known-classlist-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/layout_custom_section_classes-known-classlist-cleanup.sh
- id: layout_custom_section_classes-data-disabled
  input: On this Drupal site, inspect the layout_custom_section_classes settings and tell me whether editors
    are currently allowed to add data-* attributes to Layout Builder sections.
  criteria: No — in layout_custom_section_classes.settings, allowed_section_attributes.data is false,
    so the data-* attribute field is not offered for sections (other section attributes remain enabled).
  bundle: layout_custom_section_classes
  rubric_ref: rubric/layout_custom_section_classes_layout_custom_section_classes_data_disabled@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/layout_custom_section_classes-data-disabled-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/layout_custom_section_classes-data-disabled-cleanup.sh
- id: layout_custom_section_classes-add-class
  input: On this Drupal site the layout_custom_section_classes predefined class list is currently empty.
    Using the module's settings, add a predefined CSS class named 'lcsc-task-class' so editors can pick
    it for Layout Builder sections. Apply the change to the live site.
  criteria: In layout_custom_section_classes.settings the class_list sequence gains an entry 'lcsc-task-class'
    (optionally 'lcsc-task-class|Friendly name').
  bundle: layout_custom_section_classes
  rubric_ref: rubric/layout_custom_section_classes_layout_custom_section_classes_add_class@1.0
