metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: language_access
  version: 2.0.x
  note: 'Language Access has no config UI (configure=null) and no config of its own. Its entire control
    surface is a dynamic permission set ''access language <langcode>'' (one per configured language, built
    by LanguageAccessPermissions::permissions() from the language manager). hook_install grants ''access
    language <default>'' to the anonymous and authenticated roles. Enforcement: a kernel.request subscriber
    throws 403 for the current language when the permission is missing, plus hooks strip the language
    from switch links, hreflang tags, simple_sitemap links, user-form/language_select options, browser
    negotiation, config_pages context, and the content-translation overview. Medium/hard cases add a throwaway
    language (namespaced langcode) and grant/deny ''access language <lang>'' on namespaced roles, verified
    by reading role permissions.'
questions:
- id: la-permission-format
  input: The language_access module for Drupal restricts who can view each site language. What is the
    machine-name format of the permission it provides to control access to a language, and how many such
    permissions exist relative to the site's languages?
  criteria: It provides one dynamic permission per configured language named 'access language <langcode>'
    (e.g. 'access language en', 'access language fr'), generated by LanguageAccessPermissions::permissions()
    from the language manager. There is exactly one such permission for each configured language.
  bundle: language_access
  rubric_ref: rubric/language_access_la_permission_format@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: la-no-settings-form
  input: I enabled language_access on a Drupal 11 site but there is no settings/configure page for it.
    How do I grant a role access to a specific language, and what happens to a user who lacks that permission
    when they open a page in that language?
  criteria: There is no config UI (configure=null). You grant the 'access language <langcode>' permission
    per role on People -> Permissions (/admin/people/permissions). A user lacking the permission for the
    current request's language gets an HTTP 403 (AccessDeniedHttpException), thrown by LanguageAccessSubscriber
    on the kernel.request event.
  bundle: language_access
  rubric_ref: rubric/language_access_la_no_settings_form@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: la-soft-hiding
  input: Apart from returning 403 on a blocked language's pages, what else does language_access do to
    a language the current user cannot access - in the language switcher, hreflang alternate tags, and
    a Simple Sitemap - and does the block apply to Drush/CLI?
  criteria: It removes inaccessible languages from the language switcher (hook_language_switch_links_alter),
    strips their rel=alternate hreflang tags (hook_page_attachments_alter), drops them from simple_sitemap
    links (hook_simple_sitemap_links_alter), and limits user-form / language_select options. The 403 block
    is skipped on CLI (PHP_SAPI === 'cli'), so Drush and cron are unaffected.
  bundle: language_access
  rubric_ref: rubric/language_access_la_soft_hiding@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: la-known-role
  input: This Drupal site uses language_access. A non-default language has been added and exactly one
    custom role has been granted access to it. Inspect the live site and give the machine name of the
    role that was granted access to the Icelandic (is) language.
  criteria: 'The role machine name is langaccess_reviewer: its user.role.langaccess_reviewer config lists
    the permission ''access language is''.'
  bundle: language_access
  rubric_ref: rubric/language_access_la_known_role@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/language_access-known-role-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/language_access-known-role-cleanup.sh
- id: la-which-role-has-access
  input: The Norwegian Bokmal (nb) language has been added to this site and two custom roles exist, langaccess_alpha
    and langaccess_beta. Exactly one of them has been granted the language_access permission to access
    nb. Inspect the live role permissions and state which role can access the nb language.
  criteria: langaccess_beta has the 'access language nb' permission; langaccess_alpha does not. Check
    user.role.langaccess_beta / user.role.langaccess_alpha permissions.
  bundle: language_access
  rubric_ref: rubric/language_access_la_which_role_has_access@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/language_access-which-role-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/language_access-which-role-cleanup.sh
- id: la-grant-role
  input: This site has the Faroese (fo) language enabled and a custom role 'langaccess_task' that currently
    cannot access it. Using the language_access module's permission model, grant the langaccess_task role
    access to the Faroese (fo) language, and apply the change to the live site.
  criteria: Grant the 'access language fo' permission to the langaccess_task role (e.g. Role::load('langaccess_task')->grantPermission('access
    language fo')->save(), or drush role:perm:add langaccess_task 'access language fo', or via /admin/people/permissions).
  bundle: language_access
  rubric_ref: rubric/language_access_la_grant_role@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/language_access-grant-role-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/language_access-grant-role-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/language_access-grant-role-verify.sh
- id: la-grant-anonymous
  input: The Western Frisian (fy) language is enabled on this site but anonymous visitors currently get
    access denied when they open Frisian pages. Make it so anonymous (not-logged-in) visitors are allowed
    to view the Frisian (fy) language, using the language_access module. Apply the change to the live
    site.
  criteria: Grant the 'access language fy' permission to the anonymous role (user.role.anonymous), e.g.
    Role::load('anonymous')->grantPermission('access language fy')->save() or drush role:perm:add anonymous
    'access language fy'.
  bundle: language_access
  rubric_ref: rubric/language_access_la_grant_anonymous@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: site-owner
    reset: agent-module-documentation/evaluation/verify/language_access-grant-anon-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/language_access-grant-anon-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/language_access-grant-anon-verify.sh
