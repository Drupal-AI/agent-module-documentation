metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: layout_section_classes
  version: 1.6.x
  note: 'Layout Section Classes is developer-facing: hook_layout_alter swaps any LayoutDefault layout
    that declares a ''classes:'' key in its *.layouts.yml to Drupal\layout_section_classes\ClassyLayout.
    ClassyLayout renders a select per class group (keys: label, options[required], multiple, required,
    default, description, region_classes, attributes) and stores the chosen value in the section''s layout
    config at additional.classes.<group>, appending it to the section wrapper #attributes[''class''] at
    build. No configure route, permission, service, Drush, or own config schema. IMPORTANT: no core layout
    declares ''classes:'', so the eval scripts rely on a permanently-installed namespaced fixture module
    web/modules/custom/lsc_fixture that ships a classy layout ''lsc_fixture_layout'' (style group with
    options bg-primary/bg-muted); setup/reset ensure it is installed. Medium reads back which style class
    a live Layout Builder section carries; hard1 sets the bg-primary class on an existing classy section;
    hard2 adds a new lsc_fixture_layout section with a class. All are grounded in the entity_view_display
    node.lsc_demo.default Layout Builder section config.'
questions:
- id: layout_section_classes-how
  input: With the Layout Section Classes module, how do I make a Layout Builder layout offer CSS class
    dropdowns on its sections? What do I add to the layout definition and which plugin class takes over?
  criteria: Add a 'classes:' key to the layout's definition in a *.layouts.yml. hook_layout_alter() then
    swaps the layout (if it uses core LayoutDefault) to Drupal\layout_section_classes\ClassyLayout, which
    renders a select per class group on the section configuration form.
  bundle: layout_section_classes
  rubric_ref: rubric/layout_section_classes_layout_section_classes_how@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: layout_section_classes-where-stored
  input: In the Layout Section Classes module, where are the classes a site builder selects for a section
    stored, and how do they end up on the rendered markup?
  criteria: 'The chosen values are stored in the section''s layout configuration under additional.classes.<group>
    (Section::getLayoutSettings()[''additional''][''classes'']). At render, ClassyLayout::build() appends
    them to the section wrapper''s #attributes[''class''] (plus optional region_classes on regions and
    attributes on the section).'
  bundle: layout_section_classes
  rubric_ref: rubric/layout_section_classes_layout_section_classes_where_stored@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: layout_section_classes-group-keys
  input: In a Layout Section Classes 'classes:' definition, what keys can a class group declare, and which
    one is mandatory? How do you allow selecting more than one class?
  criteria: 'A group can declare label, options (mandatory - value=>label; missing options throws), multiple,
    required, default, description, plus region_classes (extra classes onto named regions) and attributes
    (HTML attributes on the section). Set multiple: true to allow selecting several classes (stored as
    an array).'
  bundle: layout_section_classes
  rubric_ref: rubric/layout_section_classes_layout_section_classes_group_keys@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: layout_section_classes-applied-class
