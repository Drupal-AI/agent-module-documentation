  criteria: The section (layout lsc_fixture_layout) on node.lsc_demo.default has additional.classes.style
    = 'bg-muted'.
  bundle: layout_section_classes
  rubric_ref: rubric/layout_section_classes_layout_section_classes_applied_class@1.0
  tags:
  - mode:introspection
  - difficulty:medium
