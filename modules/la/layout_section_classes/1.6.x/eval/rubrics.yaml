rubrics:
- id: layout_section_classes_layout_section_classes_how
  version: '1.0'
  applicable_bundles:
  - layout_section_classes
  checks:
  - kind: must_contain_any
    values:
    - classes
    - layouts.yml
    - ClassyLayout
  scoring:
    combine: all_pass
- id: layout_section_classes_layout_section_classes_where_stored
  version: '1.0'
  applicable_bundles:
  - layout_section_classes
  checks:
  - kind: must_contain_any
    values:
    - additional
    - additional.classes
    - '#attributes'
    - attributes['class']
    - layout settings
    - section
  scoring:
    combine: all_pass
- id: layout_section_classes_layout_section_classes_group_keys
  version: '1.0'
  applicable_bundles:
  - layout_section_classes
  checks:
  - kind: must_contain_any
    values:
    - options
    - multiple
    - region_classes
    - attributes
    - required
    - default
  scoring:
    combine: all_pass
- id: layout_section_classes_layout_section_classes_applied_class
  version: '1.0'
  applicable_bundles:
  - layout_section_classes
  checks:
  - kind: must_contain_any
    values:
    - bg-muted
  scoring:
    combine: all_pass
- id: layout_section_classes_layout_section_classes_section_layout
  version: '1.0'
  applicable_bundles:
  - layout_section_classes
  checks:
  - kind: must_contain_any
    values:
    - lsc_fixture_layout
  scoring:
    combine: all_pass
- id: layout_section_classes_layout_section_classes_set_class
  version: '1.0'
  applicable_bundles:
  - layout_section_classes
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
- id: layout_section_classes_layout_section_classes_add_section
  version: '1.0'
  applicable_bundles:
  - layout_section_classes
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
