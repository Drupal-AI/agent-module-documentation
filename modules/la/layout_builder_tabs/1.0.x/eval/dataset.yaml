metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: layout_builder_tabs
  version: 1.0.x
  note: 'Layout Builder Tabs registers exactly one layout plugin, ''tabs'' (label Tabs, category Extra
    Layouts), via layout_builder_tabs.layouts.yml and core layout_discovery. Class TabsLayout extends
    LayoutDefault; single region ''tabs''; when the Olivero theme is active it attaches olivero/tabs.
    A SortByWeight Twig extension adds a ''sortbyweight'' filter used by templates/tabs.html.twig to order
    tabs by block #weight. No configure route, no settings, no permissions, no Drush. The only persistent
    state is a Layout Builder section with layout_id ''tabs'' stored in an entity_view_display''s third_party_settings.layout_builder.sections.
    Medium/hard cases are grounded in that: introspection reads back the layout id of a Tabs section on
    a display; execution adds a Tabs section to a Layout-Builder-enabled display, verified via the live
    entity_view_display (getSections()->getLayoutId()). A dedicated lbt_demo content type isolates the
    fixtures from other agents.'
questions:
- id: lbt-layout-id
  input: I want to render a set of Layout Builder blocks as tabs using the layout_builder_tabs module.
    What is the machine name (plugin id) of the layout/section it provides, and under which category does
    it appear in the Add section UI?
  criteria: The layout plugin id is 'tabs' (label 'Tabs'), defined in layout_builder_tabs.layouts.yml
    and listed under the 'Extra Layouts' category when you Add a section in Layout Builder. Each block
    in the section becomes a tab.
  bundle: layout_builder_tabs
  rubric_ref: rubric/layout_builder_tabs_lbt_layout_id@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: lbt-sortbyweight
  input: In the layout_builder_tabs module, how does the Tabs template decide the order of the tabs, and
    what Twig filter does it use to do it?
  criteria: 'The tabs.html.twig template pipes the region''s blocks through the custom Twig filter |sortbyweight
    (registered by the SortByWeight Twig extension service), which uasort()s the render array by each
    block''s #weight. So tabs appear in block weight order.'
  bundle: layout_builder_tabs
  rubric_ref: rubric/layout_builder_tabs_lbt_sortbyweight@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: lbt-olivero-config
  input: Does layout_builder_tabs have an admin settings/config form? And how does it style its tabs when
    the site uses the Olivero theme?
  criteria: There is no configure route or settings form (configure=null). TabsLayout::build() checks
    the active theme and, when it is 'olivero', attaches the olivero/tabs library so the tabs inherit
    Olivero's styling; otherwise only the layout_builder_tabs/tabs library is attached.
  bundle: layout_builder_tabs
  rubric_ref: rubric/layout_builder_tabs_lbt_olivero_config@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: lbt-known-section
