  criteria: The node.lbt_demo default view display has a Layout Builder section with layout_id 'tabs'
    (the Tabs layout, single region 'tabs').
  bundle: layout_builder_tabs
  rubric_ref: rubric/layout_builder_tabs_lbt_known_section@1.0
