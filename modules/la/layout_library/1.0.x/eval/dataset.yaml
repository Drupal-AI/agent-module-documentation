metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: layout_library
  version: 1.0.x
  note: Layout Library (beta) adds a `layout` config entity, a `layout_selection` reference field auto-created
    via a view-display third-party setting, a section-storage plugin, and a filtered entity-reference
    selection plugin. No permissions.yml, no routing.yml, no Drush. Cases are `recipe` (response-graded)
    probing documented facts an agent would otherwise read source to answer; no site mutation.
questions:
- id: layout-library-manage-ui
  input: On a Drupal 11 site with Layout Library installed, where do I go to create and manage the reusable
    layouts, and what is the route name of that admin page?
  criteria: Admin -> Structure -> Layout library at /admin/structure/layouts, route entity.layout.collection
    (the module's configure route).
  bundle: layout_library
  rubric_ref: rubric/layout_library_layout_library_manage_ui@1.0
  tags:
  - mode:recipe
- id: layout-library-enable-on-bundle
  input: I have Layout Builder enabled on my article view display. How do I let content editors choose
    from stored library layouts on articles?
  criteria: On the bundle's Manage display for the Layout-Builder-enabled view mode, tick 'Allow content
    editors to use stored layouts' (the layout_library.enable third-party setting on the entity view display).
  bundle: layout_library
  rubric_ref: rubric/layout_library_layout_library_enable_on_bundle@1.0
  tags:
  - mode:recipe
- id: layout-library-selection-field
  input: When I enable the Layout Library option on a bundle, what field gets added to that bundle and
    what is its type/target?
  criteria: A locked entity_reference field named layout_selection (label 'Layout', target_type 'layout',
    selection handler 'layout_library') is auto-created and added to the default form display.
  bundle: layout_library
  rubric_ref: rubric/layout_library_layout_library_selection_field@1.0
  tags:
  - mode:recipe
- id: layout-library-config-entity
  input: What configuration entity type does the Layout Library module provide, and what does its stored
    config record contain?
  criteria: A `layout` config entity (config prefix layout, files layout_library.layout.{id}.yml) exporting
    id, label, targetEntityType, targetBundle, and layout (a sequence of layout_builder.section items).
  bundle: layout_library
  rubric_ref: rubric/layout_library_layout_library_config_entity@1.0
  tags:
  - mode:recipe
- id: layout-library-permission
  input: Which permission controls who can create and manage the layouts in the Layout Library, and does
    the module define it in a permissions.yml file?
  criteria: The 'configure any layout' permission (the layout config entity's admin_permission); the module
    ships no layout_library.permissions.yml.
  bundle: layout_library
  rubric_ref: rubric/layout_library_layout_library_permission@1.0
  tags:
  - mode:recipe
- id: layout-library-options-filtered
  input: How does Layout Library make sure an editor only sees layouts that are valid for the content
    item they are editing?
  criteria: The layout_library EntityReferenceSelection plugin filters the layout options by the edited
    entity's entity type and bundle (matching the layout's targetEntityType/targetBundle).
  bundle: layout_library
  rubric_ref: rubric/layout_library_layout_library_options_filtered@1.0
  tags:
  - mode:recipe
- id: layout-library-prepare-copy
  input: When an author selects a stored library layout for a node, how do that layout's sections end
    up on the node's Layout Builder override?
  criteria: The PrepareLayout event subscriber (on LayoutBuilderEvents::PREPARE_LAYOUT) copies the selected
    library layout's sections onto the entity when the override has not yet been customized.
  bundle: layout_library
  rubric_ref: rubric/layout_library_layout_library_prepare_copy@1.0
  tags:
  - mode:recipe
- id: layout-library-dependency-stability
  input: What core module does Layout Library depend on, and what is its release stability?
  criteria: It depends on core layout_builder and is a beta release (8.x-1.0-beta7 / 1.0.x).
  bundle: layout_library
  rubric_ref: rubric/layout_library_layout_library_dependency_stability@1.0
  tags:
  - mode:recipe
