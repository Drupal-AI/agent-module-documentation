rubrics:
- id: languagefield_languagefield_field_type_id
  version: '1.0'
  applicable_bundles:
  - languagefield
  checks:
  - kind: must_contain_any
    values:
    - language_field
    - languagefield_select
  scoring:
    combine: all_pass
- id: languagefield_languagefield_language_range
  version: '1.0'
  applicable_bundles:
  - languagefield
  checks:
  - kind: must_contain_any
    values:
    - '12'
    - '11'
  scoring:
    combine: all_pass
- id: languagefield_languagefield_custom_language_admin
  version: '1.0'
  applicable_bundles:
  - languagefield
  checks:
  - kind: must_contain_any
    values:
    - custom_language
    - custom language
    - /admin/config/regional/custom_language
    - administer languagefield
  scoring:
    combine: all_pass
- id: languagefield_languagefield_known_widget
  version: '1.0'
  applicable_bundles:
  - languagefield
  checks:
  - kind: must_contain_any
    values:
    - languagefield_autocomplete
  scoring:
    combine: all_pass
- id: languagefield_languagefield_known_custom_language
  version: '1.0'
  applicable_bundles:
  - languagefield
  checks:
  - kind: must_contain_any
    values:
    - lf_klingon
    - tlhIngan Hol
  scoring:
    combine: all_pass
- id: languagefield_languagefield_add_field
  version: '1.0'
  applicable_bundles:
  - languagefield
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
- id: languagefield_languagefield_create_custom_language
  version: '1.0'
  applicable_bundles:
  - languagefield
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
