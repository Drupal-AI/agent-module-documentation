metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: languageicons
  version: 2.0.x
  note: 'Language Icons adds a flag icon to each language-switch link via hook_language_switch_links_alter
    + the languageicons_link_content theme hook. It is config-only: all state lives in the languageicons.settings
    config object (placement: before|after|replace; size: WxH default 16x12; path: glob with * = langcode,
    default modules/contrib/languageicons/flags/*.png; show_node/show_block both true). Configure route
    languageicons.settings -> /admin/config/regional/language/icons (permission: core ''administer languages'').
    No own permissions, no Drush, no plugin types. Medium/hard cases are grounded in that real config
    object: introspection reads back placement/size; execution changes placement to ''replace'' (flag
    only) or sets a custom icon size, verified from live config.'
questions:
- id: languageicons-settings-location
  input: I installed the Drupal languageicons module. Where is its settings page and which config object
    stores its options?
  criteria: Settings are at /admin/config/regional/language/icons (route languageicons.settings, permission
    'administer languages'). Options are stored in the languageicons.settings config object (placement,
    size, path, show_node, show_block).
  bundle: languageicons
  rubric_ref: rubric/languageicons_languageicons_settings_location@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: languageicons-flag-only
  input: Using the languageicons module, how do I show ONLY the flag on each language switcher link and
    hide the language name text?
  criteria: Set the 'placement' setting to 'replace' (Icon placement -> Replace link). The languageicons-link-content
    template then renders only the icon, no text. Other options are 'before' and 'after'.
  bundle: languageicons
  rubric_ref: rubric/languageicons_languageicons_flag_only@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: languageicons-custom-set
  input: How does the languageicons module know which image file to show for each language, and how would
    I point it at my own custom flag set?
  criteria: The 'path' setting is a glob where '*' is replaced by the language code (default modules/contrib/languageicons/flags/*.png).
    Change 'path' to your own directory pattern (e.g. sites/default/files/flags/*.png) and set 'size'
    (WxH) to match.
  bundle: languageicons
  rubric_ref: rubric/languageicons_languageicons_custom_set@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: languageicons-known-placement
  input: On this Drupal site, the languageicons module has a non-default icon placement configured. Inspect
    the live configuration and state where the flag icon is placed relative to the language link text.
  criteria: 'The placement is ''after'' (icon shown after the link text): languageicons.settings placement:
    after.'
  bundle: languageicons
  rubric_ref: rubric/languageicons_languageicons_known_placement@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/languageicons-placement-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/languageicons-placement-cleanup.sh
- id: languageicons-known-size
  input: The languageicons module on this site has been set to render icons at a non-default size. Inspect
    the live configuration and report the configured icon size (width x height).
  criteria: 'The size setting is 24x18: languageicons.settings size: 24x18.'
  bundle: languageicons
  rubric_ref: rubric/languageicons_languageicons_known_size@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/languageicons-size-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/languageicons-size-cleanup.sh
- id: languageicons-set-replace
  input: On this Drupal site, configure the languageicons module so the language switcher shows only the
    flag icon and no language name text. Apply the change to the live site.
  criteria: languageicons.settings placement is set to 'replace' (e.g. drush config:set languageicons.settings
    placement replace -y, or Icon placement -> Replace link on the settings form).
  bundle: languageicons
  rubric_ref: rubric/languageicons_languageicons_set_replace@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/languageicons-replace-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/languageicons-replace-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/languageicons-replace-verify.sh
- id: languageicons-set-size
  input: Configure the languageicons module on this site so language flag icons render at 32 pixels wide
    by 24 pixels tall. Apply the change to the live site.
  criteria: languageicons.settings size is set to '32x24' (e.g. drush config:set languageicons.settings
    size 32x24 -y, or set Image size to 32x24 on the settings form).
  bundle: languageicons
  rubric_ref: rubric/languageicons_languageicons_set_size@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/languageicons-bigsize-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/languageicons-bigsize-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/languageicons-bigsize-verify.sh
