metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: layout_builder_sections_config
  version: 1.0.x
  note: 'Layout Builder Sections Config adds fields to Layout Builder''s Configure-section form (show
    admin title with wrapper/position/colour, plus section id and CSS classes). The wrapper/position/colour
    DROPDOWN OPTIONS are the module''s only global config: layout_builder_sections_config.settings with
    three newline-separated ''key|Label'' string keys title_wrappers, title_positions, title_colors (config
    route layout_builder_sections_config.settings at /admin/config/content/layout-builder-sections-config,
    permission ''administer site configuration''). Per-section values are stored INSIDE each layout section''s
    own configuration (key layout_builder_sections_config), not in a global object, and require building
    a Layout Builder layout to exercise. To stay safe on the shared site, medium/hard cases are grounded
    ONLY in the global option-list config (layout_builder_sections_config.settings); the baseline script
    restores the shipped option lists.'
questions:
- id: layout_builder_sections_config-where-options
  input: In the Drupal module layout_builder_sections_config, where do I configure the list of title wrapper
    / position / colour options that editors can pick for a Layout Builder section title? Name the config
    object and route.
  criteria: At /admin/config/content/layout-builder-sections-config (route layout_builder_sections_config.settings)
    which edits the config object layout_builder_sections_config.settings, whose keys title_wrappers,
    title_positions and title_colors are newline-separated key|Label lists.
  bundle: layout_builder_sections_config
  rubric_ref: rubric/layout_builder_sections_config_layout_builder_sections_config_where_options@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: layout_builder_sections_config-section-fields
  input: What extra fields does layout_builder_sections_config add to Layout Builder's 'Configure section'
    form?
  criteria: 'It adds: Show section title to end users (show_admin_title checkbox), Title wrapper, Title
    position, Title color, an HTML ID (section_id), and a Classes textarea (section_classes, one class
    per line).'
  bundle: layout_builder_sections_config
  rubric_ref: rubric/layout_builder_sections_config_layout_builder_sections_config_section_fields@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: layout_builder_sections_config-option-format
  input: In layout_builder_sections_config, what is the format of each entry in the title_colors / title_wrappers
    / title_positions settings, and where are the per-section choices (like the chosen colour or the section's
    CSS classes) actually stored?
  criteria: Each option is one 'key|Label' pair per line (the key becomes the CSS class/value, the Label
    is shown to editors). The per-section choices are stored inside that section's own layout configuration
    under the layout_builder_sections_config key, not in a global config object.
  bundle: layout_builder_sections_config
  rubric_ref: rubric/layout_builder_sections_config_layout_builder_sections_config_option_format@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: layout_builder_sections_config-known-color
  input: On this Drupal site, a custom section-title colour option has been added via layout_builder_sections_config.
    Inspect the live configuration and give the label (and CSS class) of the custom colour that has been
    added beyond the defaults.
  criteria: 'A custom colour ''Brand'' with class section-brand-title has been added: layout_builder_sections_config.settings:title_colors
    includes the line ''section-brand-title|Brand''.'
  bundle: layout_builder_sections_config
  rubric_ref: rubric/layout_builder_sections_config_layout_builder_sections_config_known_color@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/layout_builder_sections_config-known-color-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/layout_builder_sections_config-known-color-cleanup.sh
- id: layout_builder_sections_config-known-position
  input: On this site an extra section-title position option has been configured in layout_builder_sections_config.
    Inspect the live configuration and name the custom position label (and its CSS class) that has been
    added.
  criteria: 'A custom position ''Justify'' with class section-justify-title has been added: layout_builder_sections_config.settings:title_positions
    includes ''section-justify-title|Justify''.'
  bundle: layout_builder_sections_config
  rubric_ref: rubric/layout_builder_sections_config_layout_builder_sections_config_known_position@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/layout_builder_sections_config-known-position-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/layout_builder_sections_config-known-position-cleanup.sh
- id: layout_builder_sections_config-add-color
  input: On this Drupal site, using layout_builder_sections_config, add a new section-title colour option
    so editors can choose 'Red', emitting the CSS class section-red-title. Apply the change to the live
    site configuration.
  criteria: layout_builder_sections_config.settings:title_colors gains a line 'section-red-title|Red'
    (appended to the existing key|Label list).
  bundle: layout_builder_sections_config
  rubric_ref: rubric/layout_builder_sections_config_layout_builder_sections_config_add_color@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/layout_builder_sections_config-add-color-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/layout_builder_sections_config-add-color-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/layout_builder_sections_config-add-color-verify.sh
- id: layout_builder_sections_config-add-wrapper
  input: On this Drupal site, using layout_builder_sections_config, add a section-title wrapper option
    so editors can wrap a section title in a <div> (labelled 'Div'). Apply the change to the live site
    configuration.
  criteria: layout_builder_sections_config.settings:title_wrappers gains a line 'div|Div' (a key|Label
    entry whose key is div).
  bundle: layout_builder_sections_config
  rubric_ref: rubric/layout_builder_sections_config_layout_builder_sections_config_add_wrapper@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/layout_builder_sections_config-add-wrapper-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/layout_builder_sections_config-add-wrapper-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/layout_builder_sections_config-add-wrapper-verify.sh
