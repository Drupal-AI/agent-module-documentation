metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: layout_builder_st
  version: 2.0.x
  note: 'Layout Builder Symmetric Translations translates the content of Layout Builder per-entity overrides.
    It has no config form/route/permission. Its concrete, verifiable behaviour: when a bundle gets Layout
    Builder overrides enabled, the module''s overridden entity_view_display class auto-adds a locked,
    translatable field ''layout_builder__translation'' (field type ''layout_translation'') to that bundle.
    Medium/hard cases are grounded in that: introspection reads the auto-added field on a bundle with
    overrides enabled; execution enables overrides on a bundle (node.article / node.page) and verifies
    the translation field was auto-created on the live site. Fixtures touch only Layout Builder''s own
    fields (layout_builder__layout, layout_builder__translation) on core bundles and are fully torn down.'
questions:
- id: layout_builder_st-what
  input: What does the Drupal layout_builder_st (Layout Builder Symmetric Translations) module let you
    do that core Layout Builder does not, and what does 'symmetric' mean here?
  criteria: It lets editors translate the CONTENT of Layout Builder per-entity overrides (inline block
    text and translatable component/block labels). 'Symmetric' means every language shares the same layout
    structure (same sections/components); only translatable strings differ per language.
  bundle: layout_builder_st
  rubric_ref: rubric/layout_builder_st_layout_builder_st_what@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: layout_builder_st-field
  input: When layout_builder_st is installed and a content type has Layout Builder overrides enabled,
    what field does the module add to that bundle to store translated layout data, and what is that field's
    type?
  criteria: It adds a locked, translatable field named layout_builder__translation of field type layout_translation
    to the bundle (created automatically by the module's overridden entity_view_display class / install
    hook).
  bundle: layout_builder_st
  rubric_ref: rubric/layout_builder_st_layout_builder_st_field@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: layout_builder_st-incompatible
  input: Is layout_builder_st compatible with Layout Builder Asymmetric Translations (layout_builder_at)?
    And does layout_builder_st have its own admin settings page?
  criteria: No — layout_builder_st is mutually exclusive with layout_builder_at; enabling both raises
    a requirements error, so uninstall one. It has no settings form and no configure route; you enable
    Layout Builder overrides + content translation and translate a layout via the UI.
  bundle: layout_builder_st
  rubric_ref: rubric/layout_builder_st_layout_builder_st_incompatible@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: layout_builder_st-known-field-name
  input: On this site the Article content type has Layout Builder overrides enabled and layout_builder_st
    is installed. Inspect the live field configuration for node.article and give the machine name of the
    field layout_builder_st added to store translation data.
  criteria: 'The field is layout_builder__translation (a FieldConfig on node.article, added by layout_builder_st).
    Check with: drush php:eval reading FieldConfig::loadByName(''node'',''article'',''layout_builder__translation'').'
  bundle: layout_builder_st
  rubric_ref: rubric/layout_builder_st_layout_builder_st_known_field_name@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/layout_builder_st-article-lb-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/layout_builder_st-article-lb-cleanup.sh
- id: layout_builder_st-known-field-type
  input: On this site, node.article has a field named layout_builder__translation added by layout_builder_st.
    Inspect the live field storage and report its field type and whether it is translatable.
  criteria: The field storage layout_builder__translation is of type 'layout_translation' and is translatable
    (and locked). Inspect FieldStorageConfig::loadByName('node','layout_builder__translation').
  bundle: layout_builder_st
  rubric_ref: rubric/layout_builder_st_layout_builder_st_known_field_type@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/layout_builder_st-article-lb-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/layout_builder_st-article-lb-cleanup.sh
- id: layout_builder_st-enable-article
  input: On this Drupal site (layout_builder_st is installed), enable Layout Builder overrides on the
    Article content type's default view display so that its per-entity layouts can be translated. Apply
    the change to the live site.
  criteria: Enable Layout Builder with per-entity overrides on the node.article default view display (e.g.
    $display->enableLayoutBuilder()->setOverridable(TRUE)->save(), or via Manage display -> Layout options).
    layout_builder_st then auto-creates the layout_builder__translation FieldConfig on node.article, which
    verify checks.
  bundle: layout_builder_st
  rubric_ref: rubric/layout_builder_st_layout_builder_st_enable_article@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/layout_builder_st-enable-article-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/layout_builder_st-enable-article-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/layout_builder_st-enable-article-verify.sh
- id: layout_builder_st-enable-page
  input: I want my Basic page content to have layouts I can customize per page and later translate. On
    this Drupal site, turn on the customizable per-page layout feature for the Basic page content type.
  criteria: Enable Layout Builder with per-entity overrides on the node.page default view display. With
    layout_builder_st installed this auto-creates the layout_builder__translation FieldConfig on node.page,
    which verify checks.
  bundle: layout_builder_st
  rubric_ref: rubric/layout_builder_st_layout_builder_st_enable_page@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-layman
    reset: agent-module-documentation/evaluation/verify/layout_builder_st-enable-page-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/layout_builder_st-enable-page-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/layout_builder_st-enable-page-verify.sh
