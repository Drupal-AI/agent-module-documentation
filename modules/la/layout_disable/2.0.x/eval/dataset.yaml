metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: layout_disable
  version: 2.0.x
  note: 'Layout Disable hides layout plugins from every layout picker. Code-grounded facts: disabled layouts
    are stored in config object layout_disable.settings under key disabled_layouts (associative list keyed
    by layout plugin id); hook_layout_alter() removes them via array_diff_key from the core layout plugin
    manager (plugin.manager.core.layout); form route ''layout_disable'' at /admin/config/user-interface/layout-disable,
    permission ''access layout_disable''; layout_onecol and layout_builder_blank are core-required and
    cannot be disabled; a cache clear of the layout plugin manager is required for changes to show (the
    form does it). Medium cases install known state (a specific layout disabled) discoverable via config
    or the running plugin manager. Hard cases build real state verified against BOTH the config and the
    layout plugin manager: disable a layout, and re-enable an already-disabled layout.'
questions:
- id: layout_disable-how
  input: Using the Layout Disable module on Drupal 11, how do you make a layout unavailable, and where/how
    is that stored so it disappears from Layout Builder's layout picker?
  criteria: Tick the layout on the Disable layouts form; the selected layout plugin ids are saved to config
    layout_disable.settings under disabled_layouts (keyed by layout id). layout_disable_layout_alter()
    (hook_layout_alter) then removes those ids from the layout definitions with array_diff_key, so they
    no longer appear in any layout picker.
  bundle: layout_disable
  rubric_ref: rubric/layout_disable_layout_disable_how@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: layout_disable-route-perm
  input: In the Layout Disable module, at which admin path is the disable-layouts form and which permission
    controls access to it?
  criteria: The form is at /admin/config/user-interface/layout-disable (route 'layout_disable') and requires
    the 'access layout_disable' permission.
  bundle: layout_disable
  rubric_ref: rubric/layout_disable_layout_disable_route_perm@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: layout_disable-required
  input: Which layouts can NOT be disabled with the Layout Disable module, and why?
  criteria: layout_onecol and layout_builder_blank are core-required and are excluded from the form, so
    they cannot be disabled.
  bundle: layout_disable
  rubric_ref: rubric/layout_disable_layout_disable_required@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: layout_disable-known
  input: On this Drupal site, exactly one layout has been disabled with the Layout Disable module. Inspect
    the live configuration and give the machine name (plugin id) of the disabled layout.
  criteria: 'layout_twocol_bricks is disabled: it is listed in layout_disable.settings:disabled_layouts
    (readable via `drush cget layout_disable.settings disabled_layouts`) and is absent from the core layout
    plugin manager''s definitions.'
  bundle: layout_disable
  rubric_ref: rubric/layout_disable_layout_disable_known@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/layout_disable-known-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/layout_disable-known-cleanup.sh
- id: layout_disable-known-effect
  input: On this Drupal site, one of the three-column section layouts is no longer available in the layout
    picker because it was disabled with the Layout Disable module. Inspect the running layout plugin list
    (or the module's configuration) and name the disabled layout's plugin id.
  criteria: 'layout_threecol_25_50_25 has been disabled: it appears in layout_disable.settings:disabled_layouts
    and the layout plugin manager (plugin.manager.core.layout) no longer has a definition for it.'
  bundle: layout_disable
  rubric_ref: rubric/layout_disable_layout_disable_known_effect@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/layout_disable-count-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/layout_disable-count-cleanup.sh
- id: layout_disable-disable
  input: On this Drupal site, use the Layout Disable module to disable the four-column section layout
    (layout_fourcol_section) so it no longer appears in any layout picker. Apply the change to the live
    site.
  criteria: layout_fourcol_section is added to layout_disable.settings:disabled_layouts (via the form
    or config) and, after the layout plugin cache is cleared, the core layout plugin manager no longer
    has a definition for it.
  bundle: layout_disable
  rubric_ref: rubric/layout_disable_layout_disable_disable@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/layout_disable-disable-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/layout_disable-disable-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/layout_disable-disable-verify.sh
    unused_text_checks:
      must_contain_any: []
      must_not_contain: []
- id: layout_disable-enable
  input: On this Drupal site, the two-column layout (layout_twocol) has been disabled with the Layout
    Disable module and editors can no longer choose it. Re-enable it so it is available again. Apply the
    change to the live site.
  criteria: layout_twocol is removed from layout_disable.settings:disabled_layouts (uncheck it on the
    form, or clear the key) and, after clearing the layout plugin cache, the layout plugin manager has
    a definition for layout_twocol again.
  bundle: layout_disable
  rubric_ref: rubric/layout_disable_layout_disable_enable@1.0
  tags:
  - mode:execution
  - difficulty:hard
