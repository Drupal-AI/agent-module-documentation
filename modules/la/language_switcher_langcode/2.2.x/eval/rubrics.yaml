rubrics:
- id: language_switcher_langcode_language_switcher_langcode_what_it_shows
  version: '1.0'
  applicable_bundles:
  - language_switcher_langcode
  checks:
  - kind: must_contain_any
    values:
    - langcode
    - language code
    - uppercase
    - strtoupper
    - title
  scoring:
    combine: all_pass
- id: language_switcher_langcode_language_switcher_langcode_hook_name
  version: '1.0'
  applicable_bundles:
  - language_switcher_langcode
  checks:
  - kind: must_contain_any
    values:
    - hook_language_switch_links_alter
    - language_switch_links_alter
  scoring:
    combine: all_pass
- id: language_switcher_langcode_language_switcher_langcode_requirements
  version: '1.0'
  applicable_bundles:
  - language_switcher_langcode
  checks:
  - kind: must_contain_any
    values:
    - Language switcher
    - block
    - two languages
    - more than one language
    - multiple languages
    - second language
  scoring:
    combine: all_pass
- id: language_switcher_langcode_language_switcher_langcode_tokens_ptbr
  version: '1.0'
  applicable_bundles:
  - language_switcher_langcode
  checks:
  - kind: must_contain_any
    values:
    - PT-BR
  scoring:
    combine: all_pass
- id: language_switcher_langcode_language_switcher_langcode_tokens_esmx
  version: '1.0'
  applicable_bundles:
  - language_switcher_langcode
  checks:
  - kind: must_contain_any
    values:
    - ES-MX
  scoring:
    combine: all_pass
- id: language_switcher_langcode_language_switcher_langcode_add_fr
  version: '1.0'
  applicable_bundles:
  - language_switcher_langcode
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
- id: language_switcher_langcode_language_switcher_langcode_add_nl
  version: '1.0'
  applicable_bundles:
  - language_switcher_langcode
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
