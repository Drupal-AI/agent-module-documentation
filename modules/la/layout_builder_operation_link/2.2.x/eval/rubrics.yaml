rubrics:
- id: layout_builder_operation_link_lbol_link_facts
  version: '1.0'
  applicable_bundles:
  - layout_builder_operation_link
  checks:
  - kind: must_contain_any
    values:
    - layout_builder.overrides
    - overrides.<entity
    - /layout
  scoring:
    combine: all_pass
- id: layout_builder_operation_link_lbol_visibility_conditions
  version: '1.0'
  applicable_bundles:
  - layout_builder_operation_link
  checks:
  - kind: must_contain_any
    values:
    - overrides
    - allow_custom
    - no config
    - no configuration
    - no settings
  scoring:
    combine: all_pass
- id: layout_builder_operation_link_lbol_dependency_hook
  version: '1.0'
  applicable_bundles:
  - layout_builder_operation_link
  checks:
  - kind: must_contain_any
    values:
    - layout_builder
    - hook_entity_operation
  scoring:
    combine: all_pass
- id: layout_builder_operation_link_lbol_inspect_enabled_bundle
  version: '1.0'
  applicable_bundles:
  - layout_builder_operation_link
  checks:
  - kind: must_contain_any
    values:
    - blog_post
  scoring:
    combine: all_pass
- id: layout_builder_operation_link_lbol_inspect_overrides_flag
  version: '1.0'
  applicable_bundles:
  - layout_builder_operation_link
  checks:
  - kind: must_contain_any
    values:
    - allow_custom
    - overrides
    - enabled
  scoring:
    combine: all_pass
- id: layout_builder_operation_link_lbol_enable_article_link
  version: '1.0'
  applicable_bundles:
  - layout_builder_operation_link
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
- id: layout_builder_operation_link_lbol_enable_page_link
  version: '1.0'
  applicable_bundles:
  - layout_builder_operation_link
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
