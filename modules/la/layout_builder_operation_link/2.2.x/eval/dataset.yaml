metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: layout_builder_operation_link
  version: 2.2.x
  note: 'This module has a deliberately tiny surface: three hook implementations, no config UI, no settings,
    no permissions, no schema, no plugins, no Drush. Its only observable behavior is that it adds one
    `layout` entity-operation link to entities whose bundle has Layout Builder overrides enabled. The
    tiers therefore ground medium/hard in the two things it actually touches: (1) Layout Builder override
    config on a view display, and (2) the operation-link the module''s hook produces. `easy` (recipe)
    checks documented facts (link title/weight/route, visibility conditions, dependency, ''no config'').
    `medium` (introspection) installs a known LB-override config live and asks the agent to read back
    which bundle is enabled. `hard` (execution) has the agent enable overrides on a bundle and verifies
    live that the module''s hook then emits the Layout link (functional check, not just config flags).
    Buildable surface is thin, so both hard cases exercise the same real behavior on different content
    types (article, page).'
questions:
- id: lbol-link-facts
  input: The Layout Builder Operation Link Drupal module adds one operation link to entities. What is
    the link's title (label), its weight, and which route does it link to?
  criteria: It adds a single operation with key `layout`, title "Layout", weight 50, linking to route
    layout_builder.overrides.<entity_type>.view (e.g. /node/123/layout). Added via hook_entity_operation().
  bundle: layout_builder_operation_link
  rubric_ref: rubric/layout_builder_operation_link_lbol_link_facts@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: lbol-visibility-conditions
  input: When does the Layout Builder Operation Link module actually show its 'Layout' operation link
    on an entity, and does the module itself have any settings form or configuration to control this?
  criteria: The link shows only when the entity's bundle has Layout Builder enabled with per-entity overrides
    AND the current user has access to that entity's layout override route (permission to configure the
    layout). The module has no configuration/settings form of its own (configure route is null); the only
    setup is enabling Layout Builder overrides on a bundle.
  bundle: layout_builder_operation_link
  rubric_ref: rubric/layout_builder_operation_link_lbol_visibility_conditions@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: lbol-dependency-hook
  input: Which Drupal core module does Layout Builder Operation Link depend on, and which hook does it
    implement to add the link across many entity types (nodes, taxonomy terms, users, media)?
  criteria: It depends on core's layout_builder module and implements hook_entity_operation(), which is
    why the Layout link can appear for any entity type that renders an operations dropbutton (nodes, taxonomy
    terms, users, media, ...).
  bundle: layout_builder_operation_link
  rubric_ref: rubric/layout_builder_operation_link_lbol_dependency_hook@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: lbol-inspect-enabled-bundle
  input: On this Drupal site (drush available), exactly one content type has Layout Builder per-entity
    overrides enabled on its default view display, so its nodes will show the 'Layout' operations link.
    Inspect the live site and tell me which content type (machine name) it is.
  criteria: 'The blog_post content type: node.blog_post.default entity_view_display has third_party_settings.layout_builder.enabled
    = true and allow_custom = true, so Blog post nodes get the Layout operation link.'
  bundle: layout_builder_operation_link
  rubric_ref: rubric/layout_builder_operation_link_lbol_inspect_enabled_bundle@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    persona: drupal-expert
    setup: agent-module-documentation/evaluation/verify/layout_builder_operation_link-overrides-blogpost-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/layout_builder_operation_link-overrides-blogpost-cleanup.sh
- id: lbol-inspect-overrides-flag
  input: 'On this Drupal site (drush available), inspect the Blog post (blog_post) content type''s default
