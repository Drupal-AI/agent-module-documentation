rubrics:
- id: layout_builder_admin_theme_layout_builder_admin_theme_toggle
  version: '1.0'
  applicable_bundles:
  - layout_builder_admin_theme
  checks:
  - kind: must_contain_any
    values:
    - lbat_enable_admin_theme
    - /admin/config/content/lbat
    - layout_builder_admin_theme.config
  scoring:
    combine: all_pass
- id: layout_builder_admin_theme_layout_builder_admin_theme_which_routes
  version: '1.0'
  applicable_bundles:
  - layout_builder_admin_theme
  checks:
  - kind: must_contain_any
    values:
    - layout_builder
    - RevertOverridesForm
    - DiscardLayoutChangesForm
    - .layout_builder
  scoring:
    combine: all_pass
- id: layout_builder_admin_theme_layout_builder_admin_theme_which_theme
  version: '1.0'
  applicable_bundles:
  - layout_builder_admin_theme
  checks:
  - kind: must_contain_any
    values:
    - admin theme
    - system.theme
    - admin
  scoring:
    combine: all_pass
- id: layout_builder_admin_theme_layout_builder_admin_theme_current_flag
  version: '1.0'
  applicable_bundles:
  - layout_builder_admin_theme
  checks:
  - kind: must_contain_any
    values:
    - 'false'
    - 'off'
    - disabled
    - not enabled
    - not forced
  scoring:
    combine: all_pass
- id: layout_builder_admin_theme_layout_builder_admin_theme_which_theme_live
  version: '1.0'
  applicable_bundles:
  - layout_builder_admin_theme
  checks:
  - kind: must_contain_any
    values:
    - claro
  scoring:
    combine: all_pass
- id: layout_builder_admin_theme_layout_builder_admin_theme_enable
  version: '1.0'
  applicable_bundles:
  - layout_builder_admin_theme
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
- id: layout_builder_admin_theme_layout_builder_admin_theme_disable
  version: '1.0'
  applicable_bundles:
  - layout_builder_admin_theme
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
