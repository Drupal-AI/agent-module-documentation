metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: lazy
  version: 4.0.x
  note: Lazy-load exposes a text-format filter, image field formatters, a single lazy.settings config
    object, a `lazy` service, and four alter hooks. Cases are `recipe` (response-graded) probing documented
    facts an agent would otherwise read source to answer; no site mutation.
questions:
- id: lazy-inline-filter
  input: On a Drupal 11 site I want images and iframes pasted into a rich-text Body field (Full HTML format)
    to lazy-load. Which Lazy-load filter do I enable and where?
  criteria: Enable the 'Lazy-load images and iframes' filter (id lazy_filter) on the text format at Admin
    > Config > Content authoring > Text formats and editors; its image/iframe checkboxes pick which tags.
  bundle: lazy
  rubric_ref: rubric/lazy_lazy_inline_filter@1.0
  tags:
  - mode:recipe
- id: lazy-native-vs-library
  input: How do I make the Lazy module use the browser's native loading="lazy" attribute instead of loading
    the lazysizes JavaScript library? Which setting controls this?
  criteria: 'Enable the preferNative setting on lazy.settings: when true the module adds loading="lazy"
    and no lazysizes JS runs; when false (default) lazysizes is used for all browsers.'
  bundle: lazy
  rubric_ref: rubric/lazy_lazy_native_vs_library@1.0
  tags:
  - mode:recipe
- id: lazy-skip-class
  input: I want one specific image to NOT be lazy-loaded by the Lazy module. What is the mechanism and
    the default class name?
  criteria: Add the skipClass (default 'no-lazy') to the element (or its parent); Lazy skips any element
    whose classes contain the skipClass.
  bundle: lazy
  rubric_ref: rubric/lazy_lazy_skip_class@1.0
  tags:
  - mode:recipe
- id: lazy-field-formatter
  input: How do I enable lazy-loading for an image field in a particular view mode on a Drupal site using
    the Lazy module?
  criteria: In Manage display choose the 'Image (Lazy-load)' (lazy_image) or 'Responsive image (Lazy-load)'
    formatter, or check the 'Enable lazy-loading' box Lazy adds to the image/responsive_image/colorbox/media_thumbnail
    formatters via third-party settings.
  bundle: lazy
  rubric_ref: rubric/lazy_lazy_field_formatter@1.0
  tags:
  - mode:recipe
- id: lazy-config-route
  input: What is the settings route and path for the Lazy-load module's configuration form, and which
    permission gates it?
  criteria: Route lazy.config_form at /admin/config/content/lazy, gated by the core 'administer filters'
    permission.
  bundle: lazy
  rubric_ref: rubric/lazy_lazy_config_route@1.0
  tags:
  - mode:recipe
- id: lazy-restrict-paths
  input: In the Lazy module, how do I stop lazy-loading from running on the RSS feed path, and how would
    I instead limit it to only certain pages? Which config key holds this?
  criteria: The visibility key on lazy.settings uses the request_path condition (default excludes /rss.xml).
    negate=0 means everywhere except listed pages; negate=1 limits lazy-loading to only the listed pages.
  bundle: lazy
  rubric_ref: rubric/lazy_lazy_restrict_paths@1.0
  tags:
  - mode:recipe
- id: lazy-add-formatter-hook
  input: My custom module provides an image-based field formatter and I want Lazy-load to offer its lazy-loading
    option on it. Which hook do I implement?
  criteria: Implement hook_lazy_field_formatters_alter(array &$formatters) and append your formatter id
    to $formatters.
  bundle: lazy
  rubric_ref: rubric/lazy_lazy_add_formatter_hook@1.0
  tags:
  - mode:recipe
- id: lazy-service-check
  input: In PHP on a Drupal site, which service and method tell me whether Lazy-loading is allowed for
    the current request path?
  criteria: Use the 'lazy' service (\Drupal::service('lazy'), Drupal\lazy\Lazy); call isPathAllowed()
    (or isEnabled()) which returns false on AMP pages, admin routes when disable_admin, and paths excluded
    by the visibility condition.
  bundle: lazy
  rubric_ref: rubric/lazy_lazy_service_check@1.0
  tags:
  - mode:recipe
