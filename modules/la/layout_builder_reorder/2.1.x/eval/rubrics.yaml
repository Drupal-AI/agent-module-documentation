rubrics:
- id: layout_builder_reorder_layout_builder_reorder_what
  version: '1.0'
  applicable_bundles:
  - layout_builder_reorder
  checks:
  - kind: must_contain_any
    values:
    - reorder
    - Move up
    - Move down
    - section
  scoring:
    combine: all_pass
- id: layout_builder_reorder_layout_builder_reorder_mechanism
  version: '1.0'
  applicable_bundles:
  - layout_builder_reorder
  checks:
  - kind: must_contain_any
    values:
    - pre_render
    - element_info_alter
    - layout_builder_reorder.move_section
    - move/section
  scoring:
    combine: all_pass
- id: layout_builder_reorder_layout_builder_reorder_config
  version: '1.0'
  applicable_bundles:
  - layout_builder_reorder
  checks:
  - kind: must_contain_any
    values:
    - no config
    - no configuration
    - none
    - just enable
    - nothing
  scoring:
    combine: all_pass
- id: layout_builder_reorder_layout_builder_reorder_order_probe
  version: '1.0'
  applicable_bundles:
  - layout_builder_reorder
  checks:
  - kind: must_contain_any
    values:
    - layout_onecol
  scoring:
    combine: all_pass
- id: layout_builder_reorder_layout_builder_reorder_count_probe
  version: '1.0'
  applicable_bundles:
  - layout_builder_reorder
  checks:
  - kind: must_contain_any
    values:
    - '2'
    - two
  scoring:
    combine: all_pass
- id: layout_builder_reorder_layout_builder_reorder_reorder
  version: '1.0'
  applicable_bundles:
  - layout_builder_reorder
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
- id: layout_builder_reorder_layout_builder_reorder_move_last
  version: '1.0'
  applicable_bundles:
  - layout_builder_reorder
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
