metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: layout_paragraphs
  version: 2.1.x
  note: 'Layout Paragraphs provides a paragraphs field widget + formatters, a Paragraphs Behavior plugin
    that turns a paragraph type into a Layout Discovery section, a tempstore-backed builder, and an event-based
    extension API. Cases are `recipe` (response-graded): they probe documented facts an agent would otherwise
    read source to answer; no site mutation.'
questions:
- id: lp-widget-formatter-ids
  input: On a Drupal 11 site I want editors to arrange paragraphs with drag-and-drop layouts on a paragraph
    reference field, and render the result on the front end. Which field widget plugin id do I select
    on Manage form display, and which formatter plugin id renders paragraphs wrapped in their layouts?
  criteria: Use the 'layout_paragraphs' field widget (multiple_values, for entity_reference_revisions
    fields) on Manage form display, and the 'layout_paragraphs' field formatter on Manage display. An
    experimental 'layout_paragraphs_builder' formatter adds front-end editing.
  bundle: layout_paragraphs
  rubric_ref: rubric/layout_paragraphs_lp_widget_formatter_ids@1.0
  tags:
  - mode:recipe
- id: lp-section-behavior
  input: How do I make a paragraph type act as a layout 'section' in Layout Paragraphs, and where do I
    choose which core layouts it may use?
  criteria: Enable the paragraph type's 'layout_paragraphs' Paragraphs Behavior plugin; its settings form
    has an 'available_layouts' checkbox list of Layout Discovery layout plugin ids the section can use.
  bundle: layout_paragraphs
  rubric_ref: rubric/layout_paragraphs_lp_section_behavior@1.0
  tags:
  - mode:recipe
- id: lp-layout-discovery-dependency
  input: Which Drupal modules must be installed for Layout Paragraphs to work, and where do the actual
    layouts (one column, two column, etc.) come from?
  criteria: It depends on the paragraphs module and core's layout_discovery module; layouts come from
    core Layout Discovery (LayoutPluginManager), not from Layout Paragraphs itself.
  bundle: layout_paragraphs
  rubric_ref: rubric/layout_paragraphs_lp_layout_discovery_dependency@1.0
  tags:
  - mode:recipe
- id: lp-restrict-components-event
  input: In a custom module I want to limit which paragraph types appear in the 'Choose a component' dialog
    for a particular region of a Layout Paragraphs layout. Which event do I subscribe to, and which method
    sets the allowed types?
  criteria: Subscribe to LayoutParagraphsAllowedTypesEvent (event name 'layout_paragraphs_allowed_types');
    read getTypes()/getRegion()/getParentUuid()/getLayout() and call setTypes() with the filtered array.
  bundle: layout_paragraphs
  rubric_ref: rubric/layout_paragraphs_lp_restrict_components_event@1.0
  tags:
  - mode:recipe
- id: lp-component-defaults-event
  input: I want to preset the paragraph type or default field values used when a new component is created
    in the Layout Paragraphs builder. Which event handles that?
  criteria: LayoutParagraphsComponentDefaultsEvent (name 'layout_paragraphs_component_defaults'); use
    setParagraphTypeId() and setDefaultValues() to alter the new component.
  bundle: layout_paragraphs
  rubric_ref: rubric/layout_paragraphs_lp_component_defaults_event@1.0
  tags:
  - mode:recipe
- id: lp-widget-settings
  input: In the Layout Paragraphs field widget settings, which two options control how deeply sections
    can nest and whether every top-level component must be inside a layout? Give the config keys and defaults.
  criteria: nesting_depth (default 0) sets maximum section nesting; require_layouts (default 0) forces
    all root components to live inside a layout section. Both are on field.widget.settings.layout_paragraphs.
  bundle: layout_paragraphs
  rubric_ref: rubric/layout_paragraphs_lp_widget_settings@1.0
  tags:
  - mode:recipe
- id: lp-configure-route
  input: What is the route name and path of the Layout Paragraphs module settings (labels) form, and what
    permission does it require?
  criteria: Route layout_paragraphs.label_settings at /admin/config/content/layout_paragraphs/labels,
    requiring the 'administer site configuration' permission; it edits the layout_paragraphs.settings
    config object.
  bundle: layout_paragraphs
  rubric_ref: rubric/layout_paragraphs_lp_configure_route@1.0
  tags:
  - mode:recipe
- id: lp-tempstore-object
  input: When editing a Layout Paragraphs layout in the drag-and-drop builder, which PHP object represents
    the whole layout and which service holds the in-progress (unsaved) edits?
  criteria: The LayoutParagraphsLayout domain object represents the layout; the layout_paragraphs.tempstore_repository
    service (LayoutParagraphsLayoutTempstoreRepository, backed by the private tempstore) holds in-progress
    edits.
  bundle: layout_paragraphs
  rubric_ref: rubric/layout_paragraphs_lp_tempstore_object@1.0
  tags:
  - mode:recipe
