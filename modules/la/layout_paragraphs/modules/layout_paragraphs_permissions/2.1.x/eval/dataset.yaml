metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: layout_paragraphs_permissions
  version: 2.1.x
  note: Submodule of layout_paragraphs. Adds three permissions and overrides the builder access check
    to enforce them. Cases are `recipe` (response-graded); no site mutation.
questions:
- id: lpp-permission-names
  input: Which permissions does the Layout Paragraphs Permissions submodule provide, and what does each
    gate?
  criteria: '''reorder layout paragraphs components'' (drag/move/navigation), ''duplicate layout paragraphs
    components'' (duplicate action), and ''edit layout paragraphs plugin config'' (the layout plugin configuration
    form when editing a section).'
  bundle: layout_paragraphs_permissions
  rubric_ref: rubric/layout_paragraphs_permissions_lpp_permission_names@1.0
  tags:
  - mode:recipe
- id: lpp-reorder-permission
  input: I want only certain roles to be able to drag-and-drop / reorder components in the Layout Paragraphs
    builder. Which permission do I grant?
  criteria: Grant the 'reorder layout paragraphs components' permission (provided by the layout_paragraphs_permissions
    submodule).
  bundle: layout_paragraphs_permissions
  rubric_ref: rubric/layout_paragraphs_permissions_lpp_reorder_permission@1.0
  tags:
  - mode:recipe
- id: lpp-enforcement
  input: How does the Layout Paragraphs Permissions submodule enforce its permissions on the builder?
  criteria: It overrides the parent module's layout_paragraphs.builder_access service with LayoutParagraphsPermissionsBuilderAccess,
    the access check for the _layout_paragraphs_builder_access requirement on the builder's AJAX routes.
  bundle: layout_paragraphs_permissions
  rubric_ref: rubric/layout_paragraphs_permissions_lpp_enforcement@1.0
  tags:
  - mode:recipe
- id: lpp-default-behavior
  input: On a Layout Paragraphs site without the permissions submodule, who can reorder or duplicate components?
  criteria: Without the submodule, any user who can edit the Layout Paragraphs field can perform all builder
    actions; the submodule adds granular permissions to restrict specific operations.
  bundle: layout_paragraphs_permissions
  rubric_ref: rubric/layout_paragraphs_permissions_lpp_default_behavior@1.0
  tags:
  - mode:recipe
- id: lpp-no-config
  input: Where do I configure Layout Paragraphs Permissions — is there a settings form?
  criteria: There is no settings form; grant the permissions at People -> Permissions (/admin/people/permissions).
  bundle: layout_paragraphs_permissions
  rubric_ref: rubric/layout_paragraphs_permissions_lpp_no_config@1.0
  tags:
  - mode:recipe
- id: lpp-plugin-config-permission
  input: Which permission controls whether a user can access the layout plugin configuration form when
    creating or editing a Layout Paragraphs section?
  criteria: The 'edit layout paragraphs plugin config' permission.
  bundle: layout_paragraphs_permissions
  rubric_ref: rubric/layout_paragraphs_permissions_lpp_plugin_config_permission@1.0
  tags:
  - mode:recipe
