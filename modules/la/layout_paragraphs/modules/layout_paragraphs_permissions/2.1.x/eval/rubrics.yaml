rubrics:
- id: layout_paragraphs_permissions_lpp_permission_names
  version: '1.0'
  applicable_bundles:
  - layout_paragraphs_permissions
  checks:
  - kind: must_contain_any
    values:
    - reorder layout paragraphs components
    - duplicate layout paragraphs components
    - edit layout paragraphs plugin config
  scoring:
    combine: all_pass
- id: layout_paragraphs_permissions_lpp_reorder_permission
  version: '1.0'
  applicable_bundles:
  - layout_paragraphs_permissions
  checks:
  - kind: must_contain_any
    values:
    - reorder layout paragraphs components
  scoring:
    combine: all_pass
- id: layout_paragraphs_permissions_lpp_enforcement
