metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: layout_paragraphs_library
  version: 2.1.x
  note: Submodule of layout_paragraphs. Bridges the builder with paragraphs_library via native form-alter/AJAX
    hooks; no config or permissions of its own. Cases are `recipe` (response-graded); no site mutation.
questions:
- id: lpl-purpose
  input: What does the Layout Paragraphs Library submodule add, and which modules must be enabled for
    it?
  criteria: It integrates Layout Paragraphs with Paragraphs Library, adding 'Promote to library' / 'Unlink
    from library' to the component form. It depends on layout_paragraphs and the paragraphs_library submodule
    of Paragraphs.
  bundle: layout_paragraphs_library
  rubric_ref: rubric/layout_paragraphs_library_lpl_purpose@1.0
  tags:
  - mode:recipe
- id: lpl-enable-conversion
  input: In Layout Paragraphs, why might the 'Promote to library' button not appear on a component, and
    which paragraph type setting controls it?
  criteria: The button only shows when the paragraph type's 'allow_library_conversion' (Allow adding to
    library) third-party setting is enabled and the type is not a Layout Paragraphs section; sections
    are excluded and have the option hidden.
  bundle: layout_paragraphs_library
  rubric_ref: rubric/layout_paragraphs_library_lpl_enable_conversion@1.0
  tags:
  - mode:recipe
- id: lpl-from-library-type
  input: When a Layout Paragraphs component is promoted to the library, what paragraph type replaces it
    in the layout and which field references the library item?
  criteria: It is replaced by a 'from_library' paragraph whose field_reusable_paragraph references the
    created LibraryItem; an 'Unlink from library' action reverses this.
  bundle: layout_paragraphs_library
  rubric_ref: rubric/layout_paragraphs_library_lpl_from_library_type@1.0
  tags:
  - mode:recipe
- id: lpl-sections-excluded
  input: Can a paragraph type that is configured as a Layout Paragraphs layout section be promoted to
    the Paragraphs Library?
  criteria: No. Section paragraph types (those with the layout_paragraphs behavior enabled) cannot become
    library items; the submodule hides the allow_library_conversion option on them.
  bundle: layout_paragraphs_library
  rubric_ref: rubric/layout_paragraphs_library_lpl_sections_excluded@1.0
  tags:
  - mode:recipe
- id: lpl-no-config
  input: Does Layout Paragraphs Library provide its own settings form, permissions, or services?
  criteria: No — it is implemented entirely with native form-alter/submit/AJAX hooks in layout_paragraphs_library.module
    and has no config, permissions, or services of its own.
  bundle: layout_paragraphs_library
  rubric_ref: rubric/layout_paragraphs_library_lpl_no_config@1.0
  tags:
  - mode:recipe
- id: lpl-library-item-create
  input: Programmatically, what happens under the hood when a Layout Paragraphs component is promoted
    to the library?
  criteria: A LibraryItem is created via LibraryItem::createFromParagraph($paragraph) and saved, then
    the component is replaced with a from_library paragraph referencing it and the layout tempstore is
    updated.
  bundle: layout_paragraphs_library
  rubric_ref: rubric/layout_paragraphs_library_lpl_library_item_create@1.0
  tags:
  - mode:recipe
