metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: layout_builder_save_and_edit
  version: 1.1.x
  note: Layout Builder Save And Edit is a single hook_form_alter with no config, routes, permissions,
    or plugins. Cases are `recipe` (response-graded) — they probe documented facts an agent would otherwise
    read the .module source to answer; no site mutation.
questions:
- id: lbsae-what-it-does
  input: On a Drupal 11 site with core Layout Builder, what does the layout_builder_save_and_edit module
    add and how does it differ from the stock save button?
  criteria: It adds a second action button 'Save and edit layout' to Layout Builder forms that saves the
    layout and redirects back to the same layout-editing page, instead of the stock 'Save layout' which
    saves and exits Layout Builder.
  bundle: layout_builder_save_and_edit
  rubric_ref: rubric/layout_builder_save_and_edit_lbsae_what_it_does@1.0
  tags:
  - mode:recipe
- id: lbsae-config
  input: How do I configure layout_builder_save_and_edit and what settings does it expose?
  criteria: There is nothing to configure. The module has no configuration UI, no routes, no permissions,
    and no settings — it is a single hook_form_alter that applies site-wide as soon as you enable it with
    drush en.
  bundle: layout_builder_save_and_edit
  rubric_ref: rubric/layout_builder_save_and_edit_lbsae_config@1.0
  tags:
  - mode:recipe
- id: lbsae-forms
  input: Which forms does layout_builder_save_and_edit add its button to?
  criteria: The Layout Builder defaults form (DefaultsEntityForm), the Layout Builder overrides form (OverridesEntityForm),
    and content entity add/edit forms (ContentEntityFormInterface) that have a layout_builder__layout
    override field — but not delete forms.
  bundle: layout_builder_save_and_edit
  rubric_ref: rubric/layout_builder_save_and_edit_lbsae_forms@1.0
  tags:
  - mode:recipe
- id: lbsae-permission
  input: What permission controls whether the Save and edit layout button appears on a content entity
    edit form, and does this module define it?
  criteria: The core Layout Builder dynamic permission 'configure editable {bundle} {entity_type} layout
    overrides' (e.g. 'configure editable article node layout overrides'). This module does not define
    any permissions of its own.
  bundle: layout_builder_save_and_edit
  rubric_ref: rubric/layout_builder_save_and_edit_lbsae_permission@1.0
  tags:
  - mode:recipe
- id: lbsae-redirect
  input: After clicking Save and edit layout on a node edit form, where does layout_builder_save_and_edit
    send the user, and how does it stop a destination parameter from overriding that?
  criteria: It redirects to the entity's Layout Builder overrides view route (layout_builder.overrides.{entity_type}.view)
    and removes any 'destination' query parameter before calling setRedirectUrl so the redirect is not
    overridden.
  bundle: layout_builder_save_and_edit
  rubric_ref: rubric/layout_builder_save_and_edit_lbsae_redirect@1.0
  tags:
  - mode:recipe
- id: lbsae-dependency
  input: What does layout_builder_save_and_edit depend on to work?
  criteria: It depends on core Layout Builder (drupal:layout_builder); it requires Drupal core ^10 ||
    ^11 and has no other dependencies or external libraries.
  bundle: layout_builder_save_and_edit
  rubric_ref: rubric/layout_builder_save_and_edit_lbsae_dependency@1.0
  tags:
  - mode:recipe
