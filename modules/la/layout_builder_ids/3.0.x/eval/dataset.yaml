- id: layout-builder-ids-disable-section-field
  input: I don't want editors adding custom IDs to whole sections in Layout Builder anymore (giving individual
    blocks IDs is fine). Turn off just the section ID capability from the Layout Builder Ids module on
    the live site.
  criteria: Set layout_builder_ids.settings:section_id to 0 (drush cset layout_builder_ids.settings section_id
    0, or uncheck 'Section ID field' on the settings form). block_id stays 1.
  bundle: layout_builder_ids
