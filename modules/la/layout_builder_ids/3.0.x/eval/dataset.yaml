metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: layout_builder_ids
  version: 3.0.x
  note: 'Layout Builder Ids adds an optional HTML id to Layout Builder blocks and sections. Its only configuration
    is the config object layout_builder_ids.settings with two integer toggles block_id and section_id
    (both default 1). Settings UI /admin/config/user-interface/layout-builder-ids (route layout_builder_ids.settings,
    core permission ''administer site configuration''). Block ids are stored on the SectionComponent (layout_builder_id
    in its additional data) and rendered as #attributes[''id''] by LayoutBuilderIdsRenderSubscriber; section
    ids in the section layout config. Ids must start with a letter, allow only letters/numbers/hyphens/underscores,
    and be unique per page. Medium/hard cases are grounded in the real layout_builder_ids.settings config
    object (a shared-site constraint means role/permission and full Layout-Builder-UI flows are avoided;
    the two toggles fully represent the module''s persistent config). Baseline: block_id = 1, section_id
    = 1.'
questions:
- id: layout-builder-ids-config-keys
  input: How do I turn the Layout Builder Ids block/section ID fields on or off site-wide? Name the config
    object, its keys, and the settings page.
  criteria: The config object layout_builder_ids.settings has two integer toggles, block_id and section_id
    (both default 1). Edit them at /admin/config/user-interface/layout-builder-ids (route layout_builder_ids.settings,
    permission 'administer site configuration'), or via drush cset. block_id controls the 'Block ID' field
    (and the render subscriber that outputs the id); section_id controls the 'Section ID' field.
  bundle: layout_builder_ids
  rubric_ref: rubric/layout_builder_ids_layout_builder_ids_config_keys@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: layout-builder-ids-validation
  input: What are the rules for a valid Layout Builder block/section ID entered via the Layout Builder
    Ids module?
  criteria: An id must start with a letter, may contain only letters, numbers, hyphens and underscores
    (no periods), and must be unique among all blocks and sections on the page. These are enforced by
    LayoutBuilderIdsService::validateId() and the CheckIds() uniqueness helpers.
  bundle: layout_builder_ids
  rubric_ref: rubric/layout_builder_ids_layout_builder_ids_validation@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: layout-builder-ids-storage-render
  input: When an editor gives a Layout Builder block a custom ID with the layout_builder_ids module, where
    is that value stored and how does it end up as the block's HTML id?
  criteria: The value is stored on the SectionComponent as layout_builder_id (in the component's 'additional'
    data, inside the entity/view-mode's layout). At render time LayoutBuilderIdsRenderSubscriber (on SECTION_COMPONENT_BUILD_RENDER_ARRAY)
    sets $build['#attributes']['id'] to it, so it becomes the block's DOM id. Section ids are stored in
    the section's layout configuration instead.
  bundle: layout_builder_ids
  rubric_ref: rubric/layout_builder_ids_layout_builder_ids_storage_render@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: layout-builder-ids-block-toggle-state
  input: On this site, is the Layout Builder Ids 'Block ID' field currently enabled or disabled? Inspect
    the live configuration and give the value of the relevant setting.
  criteria: 'Disabled: layout_builder_ids.settings:block_id is 0 on this site, so no Block ID field is
    shown (and block ids are not rendered). section_id remains 1.'
  bundle: layout_builder_ids
  rubric_ref: rubric/layout_builder_ids_layout_builder_ids_block_toggle_state@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/layout_builder_ids-block-toggle-state-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/layout_builder_ids-block-toggle-state-cleanup.sh
- id: layout-builder-ids-section-toggle-state
  input: On this site, what is the current value of the Layout Builder Ids section_id setting, and what
    does it mean for editors configuring a section?
  criteria: layout_builder_ids.settings:section_id is 0 on this site, so the 'Section ID' field does not
    appear on the Configure section form. block_id remains 1.
  bundle: layout_builder_ids
  rubric_ref: rubric/layout_builder_ids_layout_builder_ids_section_toggle_state@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/layout_builder_ids-section-toggle-state-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/layout_builder_ids-section-toggle-state-cleanup.sh
- id: layout-builder-ids-disable-block-field
  input: Using layout_builder_ids, disable the 'Block ID' field site-wide (editors should no longer be
    able to set an HTML id on individual Layout Builder blocks), while leaving the Section ID field alone.
    Apply the change to the live configuration.
  criteria: Set layout_builder_ids.settings:block_id to 0 (drush cset layout_builder_ids.settings block_id
    0, or uncheck 'Block ID field' on the settings form). section_id stays 1.
  bundle: layout_builder_ids
  rubric_ref: rubric/layout_builder_ids_layout_builder_ids_disable_block_field@1.0
  tags:
