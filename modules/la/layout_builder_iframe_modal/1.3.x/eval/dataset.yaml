metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: layout_builder_iframe_modal
  version: 1.3.x
  note: 'This module has no plugins, entities, or Drush commands. Its only introspectable/buildable state
    is one simple-config object, layout_builder_iframe_modal.settings, with two sequence keys: layout_builder_iframe_routes
    (the 10 built-in Layout Builder routes that open in the admin-themed iframe modal, all enabled by
    default) and custom_routes (extra opt-in dialog routes, empty by default). All medium/hard cases are
    therefore grounded in these two route lists — the same values the settings form at /admin/config/content/layout_builder_iframe_modal
    writes. Easy cases are response-graded facts (config object + keys, settings route/path, permission,
    dependency).'
questions:
- id: lbim-config-object-and-keys
  input: On a Drupal 11 site with the Layout Builder iFrame Modal (layout_builder_iframe_modal) module
    enabled, which single config object stores its settings, and what are the two keys inside it that
    control which routes open in the iframe modal?
  criteria: 'All behavior is driven by the simple-config object layout_builder_iframe_modal.settings,
    which has two sequence keys: layout_builder_iframe_routes (the built-in Layout Builder routes to iframe)
    and custom_routes (extra opt-in dialog routes).'
  bundle: layout_builder_iframe_modal
  rubric_ref: rubric/layout_builder_iframe_modal_lbim_config_object_and_keys@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: lbim-settings-route-and-path
  input: The Layout Builder iFrame Modal module adds an admin settings form to choose which Layout Builder
    routes render in the iframe modal. What is its route name and URL path?
  criteria: The settings form is route layout_builder_iframe_modal.settings at /admin/config/content/layout_builder_iframe_modal
    (under Configuration > Content authoring).
  bundle: layout_builder_iframe_modal
  rubric_ref: rubric/layout_builder_iframe_modal_lbim_settings_route_and_path@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: lbim-permission-and-dependency
  input: I want to install drupal/layout_builder_iframe_modal on a Drupal 11 site and control who can
    change its route settings. Which Drupal module does it depend on, and which permission gates its settings
    form?
  criteria: It depends on the core layout_builder module. Its settings form is gated by the permission
    'configure layout builder iframe modal'.
  bundle: layout_builder_iframe_modal
  rubric_ref: rubric/layout_builder_iframe_modal_lbim_permission_and_dependency@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: lbim-introspect-custom-routes
  input: On this live Drupal 11 site, Layout Builder iFrame Modal has been configured with an extra custom
    route opted into the iframe modal. Inspect the site and tell me which custom route(s) are currently
    set in its custom_routes list.
  criteria: Reading layout_builder_iframe_modal.settings (drush config:get layout_builder_iframe_modal.settings
    custom_routes) shows custom_routes contains 'my_module.special_dialog'.
  bundle: layout_builder_iframe_modal
  rubric_ref: rubric/layout_builder_iframe_modal_lbim_introspect_custom_routes@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/layout_builder_iframe_modal-custom-route-known-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/layout_builder_iframe_modal-custom-route-known-cleanup.sh
- id: lbim-introspect-add-block-disabled
  input: 'A site owner says the Layout Builder ''Add block'' form still opens in the old off-canvas tray
    instead of the iframe modal on this site, even though the module is enabled. Inspect the live configuration:
    is the layout_builder.add_block route currently enabled in the module''s iframe route list, and which
    config key controls it?'
  criteria: The key layout_builder_iframe_routes in layout_builder_iframe_modal.settings controls it.
    It currently lists the other 9 built-in routes but NOT layout_builder.add_block, so Add block is not
    set to open in the iframe modal.
  bundle: layout_builder_iframe_modal
  rubric_ref: rubric/layout_builder_iframe_modal_lbim_introspect_add_block_disabled@1.0
  tags:
  - mode:introspection
  - difficulty:medium
