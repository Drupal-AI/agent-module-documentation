metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: layout_builder_blocks
  version: 1.1.x
  note: Layout Builder Blocks adds a Bootstrap Styles 'Style' tab to Layout Builder add/update-block forms,
    stores the chosen styles on each SectionComponent under bootstrap_styles.block_style, and re-applies
    them to the block render array via a SECTION_COMPONENT_BUILD_RENDER_ARRAY subscriber. Its admin config
    object is layout_builder_blocks.styles (block_restrictions + plugins.<group>.<style>.enabled). Cases
    are grounded in that real source; there is no config schema, no permissions, and no Drush of its own.
questions:
- id: lbb-what-it-adds
  input: What does the Layout Builder Blocks module add to the Drupal Layout Builder block add/edit form,
    and what does it let editors do?
  criteria: It reorganizes the Layout Builder add/update-block form into two tabs (Content and Style)
    and adds a Style tab powered by Bootstrap Styles so editors can apply background/text color, padding,
    margin, border, shadow and animation to an individual block without writing CSS.
  bundle: layout_builder_blocks
  rubric_ref: rubric/layout_builder_blocks_lbb_what_it_adds@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: lbb-restrict-config-key
  input: In the Layout Builder Blocks module, which config object and which key control the optional list
    of blocks the Style tab is limited to? Name the config object and the key.
  criteria: The config object layout_builder_blocks.styles, key block_restrictions (a list of block plugin
    IDs; empty = every block gets the Style tab).
  bundle: layout_builder_blocks
  rubric_ref: rubric/layout_builder_blocks_lbb_restrict_config_key@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: lbb-config-permission
  input: Which permission gates the Layout Builder Blocks styles admin form (route layout_builder_blocks.styles)?
  criteria: The 'configure bootstrap layout builder' permission (provided by the Bootstrap Styles module,
    which Layout Builder Blocks depends on).
  bundle: layout_builder_blocks
  rubric_ref: rubric/layout_builder_blocks_lbb_config_permission@1.0
  tags:
  - mode:recipe
  - difficulty:easy
