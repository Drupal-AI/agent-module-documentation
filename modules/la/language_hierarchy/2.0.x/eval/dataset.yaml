metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: language_hierarchy
  version: 2.0.x
  note: 'Language Hierarchy configures parent/child fallback between languages. A language''s parent is
    stored as a third-party setting on its configurable_language config entity: third_party_settings.language_hierarchy.fallback_langcode.
    hook_language_fallback_candidates_alter walks that chain to build fallback candidates (check via \Drupal::languageManager()->getFallbackCandidates([''langcode''=>...]));
    the module also maintains a language_hierarchy_priority DB table rebuilt on any language insert/update/delete
    and config import, and applies fallback to config translation (config factory override), interface
    strings (locale.storage decorator), and path aliases. No settings form, no permission of its own;
    configured through the core language forms. Provides a Views sort (language_hierarchy_sort) and filter
    (language_hierarchy_content_language_fallback_limited). Eval cases use custom langcodes lhp/lhm/lhc
    (namespaced with ''lh'') created and deleted by the scripts; medium reads a real configured fallback
    back, hard sets a fallback and builds a multi-level chain verified through the live language manager.'
questions:
- id: language_hierarchy-where-stored
  input: Using the language_hierarchy module, how do I make one language fall back to another (its parent),
    and where is that relationship stored?
  criteria: 'Set the child language''s parent via the ''Translation fallback language'' select on the
    language edit form (or the parent/child tree on the languages overview). It is stored as a third-party
    setting on the configurable_language entity: third_party_settings.language_hierarchy.fallback_langcode.'
  bundle: language_hierarchy
  rubric_ref: rubric/language_hierarchy_language_hierarchy_where_stored@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: language_hierarchy-check-chain
  input: With language_hierarchy configured, how does Drupal decide the fallback order for a language,
    and how can I inspect the resolved fallback chain for a given langcode?
  criteria: The module implements hook_language_fallback_candidates_alter() to walk the fallback_langcode
    chain; you can inspect the result with \Drupal::languageManager()->getFallbackCandidates(['langcode'
    => '<lc>']), which returns the ordered candidate list (e.g. de-at, de, en, und).
  bundle: language_hierarchy
  rubric_ref: rubric/language_hierarchy_language_hierarchy_check_chain@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: language_hierarchy-surfaces
  input: Besides content translation, what else does the language_hierarchy fallback apply to, and what
    internal table does it maintain to order fallbacks?
  criteria: Fallback applies to configuration translation (config factory override), interface/locale
    string translation (locale.storage decorator, when locale is on) and path aliases. It maintains the
    language_hierarchy_priority table (langcode -> priority), rebuilt on any language change or config
    import.
  bundle: language_hierarchy
  rubric_ref: rubric/language_hierarchy_language_hierarchy_surfaces@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: language_hierarchy-known-fallback
  input: This site has a language with langcode 'lhc' whose fallback is configured via language_hierarchy.
    Inspect the live configuration and state which language 'lhc' falls back to.
  criteria: 'lhc falls back to lhp: configurable_language.lhc has third_party_settings.language_hierarchy.fallback_langcode
    = ''lhp''.'
  bundle: language_hierarchy
  rubric_ref: rubric/language_hierarchy_language_hierarchy_known_fallback@1.0
  tags:
  - mode:introspection
  - difficulty:medium
