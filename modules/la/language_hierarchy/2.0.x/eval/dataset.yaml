- id: language_hierarchy-known-chain
  input: On this site a multi-level language fallback chain is configured with language_hierarchy starting
    from langcode 'lhc'. Inspect the running site and list the languages 'lhc' will fall back through,
    in order.
  criteria: 'lhc falls back through lhm then lhp: the resolved fallback candidates for lhc are lhc, lhm,
