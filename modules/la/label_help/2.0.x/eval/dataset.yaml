metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: label_help
  version: 2.0.x
  note: 'Label Help has no settings page (configure=null). Its per-field help text is stored as a third-party
    setting on the field_config entity: third_party_settings.label_help.label_help_description (e.g. field.field.node.article.<field>).
    Code can also set a #label_help form element property. Medium cases seed that third-party setting
    on a real field and require the agent to read it back from live config; hard cases require setting
    the label help text on a given field, verified against the live field_config third-party setting (reset
    clears it so verify fails on empty). All grounded in real hooks/keys from label_help.module.'
questions:
- id: label-help-how-and-where
  input: Label Help has no admin settings page. How do I add help text under a specific field's label,
    and where is that text stored in configuration?
  criteria: 'Edit the field and fill in the ''Label help message'' textarea Label Help adds to the field
    settings form. It is stored as a third-party setting on the field_config entity: third_party_settings.label_help.label_help_description.'
  bundle: label_help
  rubric_ref: rubric/label_help_label_help_how_and_where@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: label-help-code-property
  input: In custom code (for a form that is not backed by a field config), which Form API property do
    I set on a form element to make Label Help render help text under its label?
  criteria: 'Set the #label_help property on the form element, e.g. $form[''email''][''#label_help'']
    = t(''...''); label_help_process_form checks it before falling back to the field''s stored setting.'
  bundle: label_help
  rubric_ref: rubric/label_help_label_help_code_property@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: label-help-debug
  input: Label Help puts its text in different places depending on the widget. Which setting can I enable
    to see which placement/use-case it chose for a field, and where is that setting configured?
  criteria: Set $settings['label_help_debug'] = TRUE; in settings.php. It annotates each rendered help
    message with its widget use-case number and placement. There is also label_help_debug_dump to dump
    element arrays.
  bundle: label_help
  rubric_ref: rubric/label_help_label_help_debug@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: label-help-known-value
  input: On this site, one field on the Article content type has Label Help text configured. Inspect the
    live field configuration and report the field's machine name and the exact help text it shows below
    the label.
  criteria: The field is field_lh_known and its label_help text is 'Known helper text for this field.'
    (stored in field.field.node.article.field_lh_known -> third_party_settings.label_help.label_help_description).
  bundle: label_help
  rubric_ref: rubric/label_help_label_help_known_value@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/label-help-known-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/label-help-known-cleanup.sh
- id: label-help-which-field
  input: The Article content type on this site has two fields, field_lh_on and field_lh_off. Exactly one
    of them has Label Help text configured. Inspect the live configuration and state which field has the
    label help text.
  criteria: field_lh_on has the label help (its field_config carries third_party_settings.label_help.label_help_description),
    whereas field_lh_off does not.
  bundle: label_help
  rubric_ref: rubric/label_help_label_help_which_field@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/label-help-which-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/label-help-which-cleanup.sh
- id: label-help-set-expert
  input: On this site the Article content type has a field field_lh_task with no label help. Using Label
    Help, configure it so the text 'Enter the internal reference code.' appears below that field's label
    on the edit form. Apply the change to the live site.
  criteria: field.field.node.article.field_lh_task now has third_party_settings.label_help.label_help_description
    set to a non-empty string (e.g. 'Enter the internal reference code.'), set via the field's 'Label
    help message' textarea or FieldConfig::setThirdPartySetting('label_help','label_help_description',
    ...).
  bundle: label_help
  rubric_ref: rubric/label_help_label_help_set_expert@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/label-help-set-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/label-help-set-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/label-help-set-verify.sh
- id: label-help-set-layman
  input: On my Articles there is a field called field_lh_task. I want my editors to see a little hint
    right under that field's label telling them to keep it short. Please make that hint show up.
  criteria: The field_lh_task field on Article gets Label Help text (a non-empty third_party_settings.label_help.label_help_description
    on field.field.node.article.field_lh_task), so the hint renders under its label.
  bundle: label_help
  rubric_ref: rubric/label_help_label_help_set_layman@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: layman
    reset: agent-module-documentation/evaluation/verify/label-help-set-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/label-help-set-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/label-help-set-verify.sh
