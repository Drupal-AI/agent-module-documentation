metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: label_help_test
  version: 2.0.x
  note: Hidden test/demo submodule of label_help. Installing it imports (config/install) the node type
    test_label_help_core_fields plus ~24 field_lh_* fields, each carrying third_party_settings.label_help.label_help_description.
    Baseline on this site is UNINSTALLED. Medium cases enable it and read the fixture back from the live
    site; hard cases require installing the fixture (reset uninstalls, verify checks the module is installed
    and the content type exists). All grounded in real shipped config (machine name test_label_help_core_fields,
    field_lh_boolean's help text).
questions:
- id: lht-content-type
  input: The label_help_test submodule installs a demonstration content type. What is that content type's
    machine name?
  criteria: It installs the node type test_label_help_core_fields ('TEST Label Help Core Fields').
  bundle: label_help_test
  rubric_ref: rubric/label_help_test_lht_content_type@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: lht-purpose
  input: What is the purpose of the label_help_test module, and is it meant for production sites?
  criteria: 'It is a hidden Testing-package fixture for the Label Help module: it installs a content type
    with one field of nearly every core type (each with Label Help text) to demonstrate/test placement
    across widgets. Not for production.'
  bundle: label_help_test
  rubric_ref: rubric/label_help_test_lht_purpose@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: lht-field-naming
  input: What naming prefix do the fields that label_help_test creates use, and roughly what do they cover?
  criteria: All fields are named field_lh_* (e.g. field_lh_boolean, field_lh_string, field_lh_datetime,
    field_lh_image, field_lh_user_ref) and cover nearly every core field type so Label Help placement
    can be exercised on each widget.
  bundle: label_help_test
  rubric_ref: rubric/label_help_test_lht_field_naming@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: lht-live-content-type
  input: The label_help_test module is installed on this site. Inspect the running site and give the machine
    name of the content type it provides.
  criteria: The content type is test_label_help_core_fields (loadable as a node type on the live site).
  bundle: label_help_test
  rubric_ref: rubric/label_help_test_lht_live_content_type@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/lht-enable-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/lht-enable-cleanup.sh
- id: lht-field-help-value
  input: With label_help_test installed on this site, inspect the live field configuration for the field_lh_boolean
    field on its content type and report the Label Help text stored on it.
  criteria: field.field.node.test_label_help_core_fields.field_lh_boolean has third_party_settings.label_help.label_help_description
    = 'Label Help message for Boolean field.'
  bundle: label_help_test
  rubric_ref: rubric/label_help_test_lht_field_help_value@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/lht-enable-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/lht-enable-cleanup.sh
- id: lht-install-expert
  input: Install the label_help_test fixture on this site so the test_label_help_core_fields content type
    and its field_lh_* example fields exist.
  criteria: label_help_test is installed (drush en label_help_test) and the node type test_label_help_core_fields
    exists on the site.
  bundle: label_help_test
  rubric_ref: rubric/label_help_test_lht_install_expert@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/lht-install-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/lht-install-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/lht-install-verify.sh
- id: lht-install-layman
  input: I want the Label Help example content type, with all its sample fields already filled in with
    helper text, set up on my site so I can see how it looks.
  criteria: Enabling the label_help_test module installs the test_label_help_core_fields content type
    and its field_lh_* fields (each pre-filled with Label Help text).
  bundle: label_help_test
  rubric_ref: rubric/label_help_test_lht_install_layman@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: layman
    reset: agent-module-documentation/evaluation/verify/lht-install-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/lht-install-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/lht-install-verify.sh
