rubrics:
- id: language_switcher_extended_language_switcher_extended_mode_values
  version: '1.0'
  applicable_bundles:
  - language_switcher_extended
  checks:
  - kind: must_contain_any
    values:
    - mode
    - process_untranslated
    - always_link_to_front
  scoring:
    combine: all_pass
- id: language_switcher_extended_language_switcher_extended_untranslated_handler
  version: '1.0'
  applicable_bundles:
  - language_switcher_extended
  checks:
  - kind: must_contain_any
    values:
    - untranslated_handler
    - hide_link
  scoring:
    combine: all_pass
- id: language_switcher_extended_language_switcher_extended_config_route_permission
  version: '1.0'
  applicable_bundles:
  - language_switcher_extended
  checks:
  - kind: must_contain_any
    values:
    - language_switcher_extended.settings
    - /admin/config/regional/language/language-switcher-extended
    - administer language_switcher_extended
  scoring:
    combine: all_pass
- id: language_switcher_extended_language_switcher_extended_inspect_untranslated_handler
  version: '1.0'
  applicable_bundles:
  - language_switcher_extended
  checks:
  - kind: must_contain_any
    values:
    - link_to_front
    - front
    - front page
  scoring:
    combine: all_pass
- id: language_switcher_extended_language_switcher_extended_inspect_mode
  version: '1.0'
  applicable_bundles:
  - language_switcher_extended
  checks:
  - kind: must_contain_any
    values:
    - always_link_to_front
    - front page
    - frontpage
  scoring:
    combine: all_pass
- id: language_switcher_extended_language_switcher_extended_inspect_single_link
  version: '1.0'
  applicable_bundles:
  - language_switcher_extended
  checks:
  - kind: must_contain_any
    values:
    - hide_single_link
    - hide_single_link_block
  scoring:
    combine: all_pass
- id: language_switcher_extended_language_switcher_extended_configure_hide_untranslated
  version: '1.0'
  applicable_bundles:
  - language_switcher_extended
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
- id: language_switcher_extended_language_switcher_extended_configure_always_front
  version: '1.0'
  applicable_bundles:
  - language_switcher_extended
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
- id: language_switcher_extended_language_switcher_extended_configure_no_link
  version: '1.0'
  applicable_bundles:
  - language_switcher_extended
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
