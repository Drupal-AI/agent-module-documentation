metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: language_neutral_aliases
  version: 3.2.x
  note: 'Language Neutral URL Aliases forces every path_alias to be saved language-neutral (langcode =
    und / LANGCODE_NOT_SPECIFIED). Real mechanism: a decorator on path_alias.repository (service language_neutral_aliases.repository_decorator,
    priority 9) forces lookups to und; hook_entity_type_alter swaps path_alias storage to NeutralPathAliasStorage
    (create()/save() force langcode=und) and list builder to NeutralPathAliasListBuilder; hook_module_implements_alter
    runs last and unsets path''s entity_translation_create. No config/UI/permissions/Drush. Behaviour
    is directly observable on the live site: any alias created ends up with langcode ''und'' even if another
    langcode is requested. Medium introspection reads back the stored langcode of a known alias; hard
    execution creates an alias and verifies it is stored language-neutral. Fixtures use /lna-* source
    paths.'
questions:
- id: lna-what-it-does
  input: What does the language_neutral_aliases module change about how Drupal stores URL aliases, and
    what langcode do aliases end up with?
  criteria: It decouples URL aliases from the language system so every path alias is saved language-neutral
    (langcode = und / LANGCODE_NOT_SPECIFIED), making the same alias apply in all languages.
  bundle: language_neutral_aliases
  rubric_ref: rubric/language_neutral_aliases_lna_what_it_does@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: lna-mechanism
  input: Technically, how does language_neutral_aliases force aliases to be language neutral? Name the
    two core mechanisms (there is no settings form).
  criteria: It decorates the path_alias.repository service to force lookups to LANGCODE_NOT_SPECIFIED,
    and via hook_entity_type_alter swaps the path_alias storage class to NeutralPathAliasStorage (create()/save()
    force langcode=und) plus a neutral list builder; it also unsets path's entity_translation_create hook.
  bundle: language_neutral_aliases
  rubric_ref: rubric/language_neutral_aliases_lna_mechanism@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: lna-legacy-aliases
  input: After installing language_neutral_aliases on an existing multilingual site, what happens to URL
    aliases that were already language-specific, and how do you convert them permanently?
  criteria: Existing non-neutral aliases become hidden (they don't resolve, don't show on node edit, aren't
    listed) but are not deleted, so uninstalling restores them. To convert permanently, bulk-update them,
    e.g. UPDATE path_alias SET langcode = 'und' WHERE langcode <> 'und';.
  bundle: language_neutral_aliases
  rubric_ref: rubric/language_neutral_aliases_lna_legacy_aliases@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: lna-known-alias-langcode
  input: This Drupal site has a URL alias whose source (system) path is /lna-src-a. Inspect the live path_alias
    entity for that source and report the langcode it is stored with.
  criteria: The alias for /lna-src-a is stored with langcode 'und' (LANGCODE_NOT_SPECIFIED), because language_neutral_aliases
    forces all aliases language-neutral.
  bundle: language_neutral_aliases
  rubric_ref: rubric/language_neutral_aliases_lna_known_alias_langcode@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/language_neutral_aliases-known-alias-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/language_neutral_aliases-known-alias-cleanup.sh
- id: lna-explicit-langcode-neutralized
  input: On this site an alias was created for the source path /lna-src-b while explicitly requesting
    the English (en) language. Inspect the live path_alias entity for /lna-src-b and report which langcode
    it was actually saved with.
  criteria: It was saved with langcode 'und', not 'en' — NeutralPathAliasStorage::save() overrides any
    requested langcode to LANGCODE_NOT_SPECIFIED.
  bundle: language_neutral_aliases
  rubric_ref: rubric/language_neutral_aliases_lna_explicit_langcode_neutralized@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/language_neutral_aliases-explicit-langcode-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/language_neutral_aliases-explicit-langcode-cleanup.sh
- id: lna-create-neutral-alias
  input: On this Drupal site (which runs language_neutral_aliases), create a URL alias mapping the system
    path /lna-task-source to the alias /lna-task-alias. Save it to the live site. It must end up language-neutral
    as this module requires.
  criteria: A path_alias entity exists with path=/lna-task-source, alias=/lna-task-alias and langcode=und
    (creating it through the normal path_alias storage neutralizes the langcode automatically).
  bundle: language_neutral_aliases
  rubric_ref: rubric/language_neutral_aliases_lna_create_neutral_alias@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/language_neutral_aliases-create-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/language_neutral_aliases-create-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/language_neutral_aliases-create-verify.sh
- id: lna-fix-legacy-alias
  input: On this site the URL alias for the system path /lna-fix-source is currently stored with a non-neutral
    langcode (en), left over from before language_neutral_aliases was in effect. Make that alias language-neutral
    (langcode und) as the module intends, and apply the change to the live site.
  criteria: The path_alias for /lna-fix-source now has langcode=und (e.g. load it and re-save it — NeutralPathAliasStorage::save()
    forces und — or set its langcode to und directly).
  bundle: language_neutral_aliases
  rubric_ref: rubric/language_neutral_aliases_lna_fix_legacy_alias@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/language_neutral_aliases-fix-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/language_neutral_aliases-fix-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/language_neutral_aliases-fix-verify.sh
