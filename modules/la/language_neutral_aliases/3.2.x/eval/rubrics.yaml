rubrics:
- id: language_neutral_aliases_lna_what_it_does
  version: '1.0'
  applicable_bundles:
  - language_neutral_aliases
  checks:
  - kind: must_contain_any
    values:
    - language neutral
    - language-neutral
    - und
    - LANGCODE_NOT_SPECIFIED
    - language independent
    - regardless of language
  scoring:
    combine: all_pass
- id: language_neutral_aliases_lna_mechanism
  version: '1.0'
  applicable_bundles:
  - language_neutral_aliases
  checks:
  - kind: must_contain_any
    values:
    - decorat
    - path_alias.repository
    - NeutralPathAliasStorage
    - storage class
    - PathAliasStorage
    - entity_type_alter
  scoring:
    combine: all_pass
- id: language_neutral_aliases_lna_legacy_aliases
  version: '1.0'
  applicable_bundles:
  - language_neutral_aliases
  checks:
  - kind: must_contain_any
    values:
    - hidden
    - uninstall
    - UPDATE path_alias
    - langcode = 'und'
    - und
  scoring:
    combine: all_pass
- id: language_neutral_aliases_lna_known_alias_langcode
  version: '1.0'
  applicable_bundles:
  - language_neutral_aliases
  checks:
  - kind: must_contain_any
    values:
    - und
  scoring:
    combine: all_pass
- id: language_neutral_aliases_lna_explicit_langcode_neutralized
  version: '1.0'
  applicable_bundles:
  - language_neutral_aliases
  checks:
  - kind: must_contain_any
    values:
    - und
  scoring:
    combine: all_pass
- id: language_neutral_aliases_lna_create_neutral_alias
  version: '1.0'
  applicable_bundles:
  - language_neutral_aliases
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
- id: language_neutral_aliases_lna_fix_legacy_alias
  version: '1.0'
  applicable_bundles:
  - language_neutral_aliases
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
