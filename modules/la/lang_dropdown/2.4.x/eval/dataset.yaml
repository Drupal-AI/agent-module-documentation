metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: lang_dropdown
  version: 2.4.x
  note: 'Language Switcher Dropdown renders core''s language switcher as a <select> dropdown. It has no
    settings page; everything is configured on a placed `block` config entity using the language_dropdown_block
    plugin (derived per language type, e.g. language_dropdown_block:language_interface). Grounded in the
    2.4.x docs (data.json, usage.md, agent/). Cases are tiered: easy=recipe (response-graded), medium=introspection
    (setup a known block config entity, agent inspects live via drush, cleanup after), hard=execution
    (agent places a block config entity, verified against live site state).'
questions:
- id: ld-block-plugin
  input: On a Drupal 11 site with the Language Switcher Dropdown (lang_dropdown) module enabled, what
    block do I place to show the language dropdown, and what is its block plugin id? Is there a separate
    settings page?
  criteria: Place the 'Language dropdown switcher' block via core's Block layout (Structure > Block layout;
    the module's configure route is block.admin_display). Its plugin id is language_dropdown_block, derived
    per language type (e.g. language_dropdown_block:language_interface). There is no dedicated settings
    form — you configure it in the block form.
  bundle: lang_dropdown
  rubric_ref: rubric/lang_dropdown_ld_block_plugin@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: ld-output-types
  input: In the lang_dropdown block settings, which key selects how the dropdown is rendered (the output
    type / widget style) and what are its allowed integer values?
  criteria: 'The `widget` setting picks the output type: 0 = Simple HTML select (no JS library), 1 = Marghoob
    Suleman msDropdown, 2 = Chosen, 3 = ddSlick.'
  bundle: lang_dropdown
  rubric_ref: rubric/lang_dropdown_ld_output_types@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: ld-display-format
  input: The lang_dropdown block has a `display` setting for the language label format. What do its integer
    values mean, and what does the `showall` setting do?
  criteria: '`display` chooses the label format: 0 = translated into current language, 1 = language native
    name, 2 = language code, 3 = translated into target language. `showall` (boolean) lists every enabled
    language even when the current page has no translation for it (those redirect to the home page).'
  bundle: lang_dropdown
  rubric_ref: rubric/lang_dropdown_ld_display_format@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: ld-intro-widget
  input: A Language Switcher Dropdown block with machine name `eval_ld_known` is already placed on this
    Drupal site (drush available). Inspect the running site and tell me which output type / widget style
    it is configured to use.
  criteria: The block.block.eval_ld_known config entity has settings.widget = 2, i.e. the Chosen output
    type.
  bundle: lang_dropdown
  rubric_ref: rubric/lang_dropdown_ld_intro_widget@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    persona: drupal-expert
    setup: agent-module-documentation/evaluation/verify/lang_dropdown-known-block-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/lang_dropdown-known-block-cleanup.sh
- id: ld-intro-display
  input: A Language Switcher Dropdown block with machine name `eval_ld_known` is already placed on this
    Drupal site (drush available). Inspect the running site and tell me which language label format (the
    `display` setting) it uses and what its dropdown width is.
  criteria: The block.block.eval_ld_known config entity has settings.display = 2 (Language Code label
    format) and settings.width = 250.
  bundle: lang_dropdown
  rubric_ref: rubric/lang_dropdown_ld_intro_display@1.0
  tags:
