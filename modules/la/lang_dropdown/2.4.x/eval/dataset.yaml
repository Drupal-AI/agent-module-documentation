  criteria: Yes — block.block.eval_ld_known has settings.showall = true, so it lists every enabled language
    regardless of whether the current page has a translation.
  bundle: lang_dropdown
  rubric_ref: rubric/lang_dropdown_ld_intro_showall@1.0
