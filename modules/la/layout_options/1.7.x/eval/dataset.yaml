metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: layout_options
  version: 1.7.x
  note: 'Layout Options provides a LayoutOptions layout plugin (Drupal\layout_options\Plugin\Layout\LayoutOptions,
    extends core LayoutDefault) and LayoutOption option plugins so YAML files ([provider].layout_options.yml,
    sections layout_option_definitions + layout_options) add CSS-class/id controls to layouts. LayoutOption
    plugin type: annotation @LayoutOption, manager plugin.manager.layout_options; built-in ids layout_options_id,
    layout_options_class_select, layout_options_class_radios, layout_options_class_checkboxes, layout_options_class_string.
    The base module has no settings form. A layout must USE the LayoutOptions plugin class for options
    to appear; the layout_options_ui submodule swaps existing layouts'' class to it (via layout_options.settings
    layout_overrides + hook_layout_alter). Medium/hard cases verify the module''s real effect through
    the core layout plugin manager: when an override is active, a core layout''s class becomes LayoutOptions.
    (layout_options_ui must be enabled for the alter hook; it is.) Baseline layout_overrides is empty,
    restored explicitly.'
questions:
- id: layout_options-plugins
  input: In the Layout Options module, what plugin type provides the individual option controls, and what
    are the built-in option plugins for adding CSS classes and an id to a layout?
  criteria: 'Options are LayoutOption plugins (annotation @LayoutOption, manager plugin.manager.layout_options).
    Built-ins: layout_options_id (id attribute), layout_options_class_select, layout_options_class_radios,
    layout_options_class_checkboxes (CSS classes), and layout_options_class_string (free-text classes).'
  bundle: layout_options
  rubric_ref: rubric/layout_options_layout_options_plugins@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: layout_options-yaml
  input: How do you declare layout options in Layout Options without writing PHP? Name the YAML file and
    its two main sections.
  criteria: 'Add a {provider}.layout_options.yml file in a module or theme. It has two sections: layout_option_definitions
    (each option''s title, default, plugin, and layout/regions applicability) and layout_options (rules
    choosing which options show on which layouts: global, per layout id, or per field).'
  bundle: layout_options
  rubric_ref: rubric/layout_options_layout_options_yaml@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: layout_options-layout-class
  input: For a Drupal layout to actually expose Layout Options controls, which layout plugin class must
    it use, and how can you make an existing core layout use it?
  criteria: The layout must use the Drupal\layout_options\Plugin\Layout\LayoutOptions plugin class (it
    extends core LayoutDefault). To retrofit an existing core/contrib layout, use the layout_options_ui
    submodule, whose hook_layout_alter swaps the layout's class to LayoutOptions.
  bundle: layout_options
  rubric_ref: rubric/layout_options_layout_options_layout_class@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: layout_options-onecol-class
  input: On this site, inspect the core 'layout_onecol' layout via the layout plugin manager and tell
    me which layout plugin class it currently uses.
  criteria: layout_onecol currently uses Drupal\layout_options\Plugin\Layout\LayoutOptions (instead of
    the core Drupal\Core\Layout\LayoutDefault), because a Layout Options override is enabled for it, so
    it exposes the Layout Options controls.
  bundle: layout_options
  rubric_ref: rubric/layout_options_layout_options_onecol_class@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/layout_options-override-onecol-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/layout_options-override-onecol-cleanup.sh
- id: layout_options-which-overridden
  input: Exactly one core layout on this site has been switched to the Layout Options plugin. Inspect
    the running layouts and tell me which core layout id now uses the Layout Options class.
  criteria: 'layout_twocol: its definition''s class is now Drupal\layout_options\Plugin\Layout\LayoutOptions
    (the other core layouts still use LayoutDefault).'
  bundle: layout_options
  rubric_ref: rubric/layout_options_layout_options_which_overridden@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/layout_options-override-twocol-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/layout_options-override-twocol-cleanup.sh
- id: layout_options-apply-twocol
  input: Make the core two-column layout (layout_twocol) use the Layout Options plugin so it gains the
    Layout Options styling controls, and apply the change to the live site.
  criteria: Enable the override for layout_twocol (via the layout_options_ui form at /admin/config/system/layout_options/config,
    or set layout_options.settings layout_overrides['layout_discovery__layout_twocol'] = 1) and rebuild
    the layout plugin cache. The core.layout plugin manager then reports layout_twocol's class as Drupal\layout_options\Plugin\Layout\LayoutOptions.
  bundle: layout_options
  rubric_ref: rubric/layout_options_layout_options_apply_twocol@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/layout_options-apply-twocol-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/layout_options-apply-twocol-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/layout_options-apply-twocol-verify.sh
- id: layout_options-apply-onecol
  input: Switch the core one-column layout (layout_onecol) to the Layout Options plugin class on the live
    site so it can expose Layout Options controls.
  criteria: Enable the override for layout_onecol (layout_options.settings layout_overrides['layout_discovery__layout_onecol']
    = 1, or via the layout_options_ui form) and rebuild caches. The core.layout manager then reports layout_onecol's
    class as Drupal\layout_options\Plugin\Layout\LayoutOptions.
  bundle: layout_options
  rubric_ref: rubric/layout_options_layout_options_apply_onecol@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/layout_options-apply-onecol-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/layout_options-apply-onecol-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/layout_options-apply-onecol-verify.sh
