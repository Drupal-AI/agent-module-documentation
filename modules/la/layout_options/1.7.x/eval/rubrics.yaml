rubrics:
- id: layout_options_layout_options_plugins
  version: '1.0'
  applicable_bundles:
  - layout_options
  checks:
  - kind: must_contain_any
    values:
    - LayoutOption
    - layout_options_id
    - layout_options_class_select
    - layout_options_class_checkboxes
  scoring:
    combine: all_pass
- id: layout_options_layout_options_yaml
  version: '1.0'
  applicable_bundles:
  - layout_options
  checks:
  - kind: must_contain_any
    values:
    - layout_options.yml
    - layout_option_definitions
    - layout_options
  scoring:
    combine: all_pass
- id: layout_options_layout_options_layout_class
  version: '1.0'
  applicable_bundles:
  - layout_options
  checks:
  - kind: must_contain_any
    values:
    - LayoutOptions
    - layout_options_ui
    - setClass
  scoring:
    combine: all_pass
- id: layout_options_layout_options_onecol_class
  version: '1.0'
  applicable_bundles:
  - layout_options
  checks:
  - kind: must_contain_any
    values:
    - LayoutOptions
    - Drupal\layout_options\Plugin\Layout\LayoutOptions
  scoring:
    combine: all_pass
- id: layout_options_layout_options_which_overridden
  version: '1.0'
  applicable_bundles:
  - layout_options
  checks:
  - kind: must_contain_any
    values:
    - layout_twocol
  scoring:
    combine: all_pass
- id: layout_options_layout_options_apply_twocol
  version: '1.0'
  applicable_bundles:
  - layout_options
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
- id: layout_options_layout_options_apply_onecol
  version: '1.0'
  applicable_bundles:
  - layout_options
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
