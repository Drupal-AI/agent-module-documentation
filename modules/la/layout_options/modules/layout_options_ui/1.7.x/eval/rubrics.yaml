rubrics:
- id: layout_options_ui_layout_options_ui_config
  version: '1.0'
  applicable_bundles:
  - layout_options_ui
  checks:
  - kind: must_contain_any
    values:
    - layout_options.settings
    - layout_overrides
    - layout_options_ui.settings
    - system/layout_options
  scoring:
    combine: all_pass
- id: layout_options_ui_layout_options_ui_key_format
  version: '1.0'
  applicable_bundles:
  - layout_options_ui
  checks:
  - kind: must_contain_any
    values:
    - layout_discovery__layout_onecol
    - provider
    - __
  scoring:
    combine: all_pass
- id: layout_options_ui_layout_options_ui_mechanism
  version: '1.0'
  applicable_bundles:
  - layout_options_ui
  checks:
  - kind: must_contain_any
    values:
    - hook_layout_alter
    - setClass
    - LayoutOptions
  scoring:
    combine: all_pass
- id: layout_options_ui_layout_options_ui_which_enabled
  version: '1.0'
  applicable_bundles:
  - layout_options_ui
  checks:
  - kind: must_contain_any
    values:
    - layout_onecol
    - layout_discovery__layout_onecol
  scoring:
    combine: all_pass
- id: layout_options_ui_layout_options_ui_read_key
  version: '1.0'
  applicable_bundles:
  - layout_options_ui
  checks:
  - kind: must_contain_any
    values:
    - layout_discovery__layout_twocol
  scoring:
    combine: all_pass
- id: layout_options_ui_layout_options_ui_enable_onecol
  version: '1.0'
  applicable_bundles:
  - layout_options_ui
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
- id: layout_options_ui_layout_options_ui_enable_twocol
  version: '1.0'
  applicable_bundles:
  - layout_options_ui
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
