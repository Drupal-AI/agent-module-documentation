metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: layout_options_ui
  version: 1.7.x
  note: Layout Options UI is a submodule of Layout Options. It adds a settings form (route layout_options_ui.settings
    at /admin/config/system/layout_options/config, permission administer site configuration) that records
    which layouts should be overridden to use the Layout Options plugin. Choices live in the layout_options.settings
    config object under layout_overrides, a map keyed by {provider}__{layout_id} with boolean values (core
    layouts have provider layout_discovery, e.g. layout_discovery__layout_onecol). layout_options_ui_layout_alter()
    (hook_layout_alter) reads that config and setClass()es each enabled layout to Drupal\layout_options\Plugin\Layout\LayoutOptions.
    No plugins/permissions/Drush of its own. Medium/hard cases are grounded in the raw layout_overrides
    config (the cause), distinct from the parent module's cases which verify the resulting layout-plugin
    class (the effect). Baseline layout_overrides is empty, restored explicitly.
questions:
- id: layout_options_ui-config
  input: Where does Layout Options UI store which layouts are overridden to use Layout Options, and what
    is the config route to manage it?
  criteria: It stores them in the layout_options.settings config object under the layout_overrides key.
    The admin form is route layout_options_ui.settings at /admin/config/system/layout_options/config (permission
    administer site configuration).
  bundle: layout_options_ui
  rubric_ref: rubric/layout_options_ui_layout_options_ui_config@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: layout_options_ui-key-format
  input: In Layout Options UI's layout_overrides config, what is the format of each key that identifies
    a layout to override? Give the example for the core one-column layout.
  criteria: Each key is {provider}__{layout_id}. Core layouts are provided by layout_discovery, so the
    core one-column layout's key is layout_discovery__layout_onecol; the value is 1/true to override it.
  bundle: layout_options_ui
  rubric_ref: rubric/layout_options_ui_layout_options_ui_key_format@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: layout_options_ui-mechanism
  input: How does Layout Options UI actually make an existing layout use the Layout Options plugin once
    it is enabled in the config?
  criteria: layout_options_ui_layout_alter() (a hook_layout_alter implementation) reads layout_options.settings
    layout_overrides and, for each enabled {provider}__{layout_id}, calls $definition->setClass('\Drupal\layout_options\Plugin\Layout\LayoutOptions').
    Clearing the layout plugin cache applies it.
  bundle: layout_options_ui
  rubric_ref: rubric/layout_options_ui_layout_options_ui_mechanism@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: layout_options_ui-which-enabled
  input: Inspect this site's layout_options.settings configuration and tell me which layout is currently
    marked to be overridden by Layout Options UI.
  criteria: 'The layout_onecol layout: layout_options.settings layout_overrides contains layout_discovery__layout_onecol
    => 1.'
  bundle: layout_options_ui
  rubric_ref: rubric/layout_options_ui_layout_options_ui_which_enabled@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/layout_options_ui-override-onecol-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/layout_options_ui-override-onecol-cleanup.sh
- id: layout_options_ui-read-key
  input: Read the Layout Options UI override configuration on this site and give me the exact config key
    (including provider prefix) that is currently enabled in layout_overrides.
  criteria: The enabled key is layout_discovery__layout_twocol (set to 1) in layout_options.settings layout_overrides.
  bundle: layout_options_ui
  rubric_ref: rubric/layout_options_ui_layout_options_ui_read_key@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/layout_options_ui-override-twocol-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/layout_options_ui-override-twocol-cleanup.sh
- id: layout_options_ui-enable-onecol
  input: Using Layout Options UI, configure the live site so that the core one-column layout (layout_onecol)
    is marked to be overridden with Layout Options.
  criteria: Set layout_options.settings layout_overrides['layout_discovery__layout_onecol'] = 1 (via the
    form at /admin/config/system/layout_options/config, or the config API). The stored config value for
    that key is then 1.
  bundle: layout_options_ui
  rubric_ref: rubric/layout_options_ui_layout_options_ui_enable_onecol@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/layout_options_ui-set-onecol-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/layout_options_ui-set-onecol-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/layout_options_ui-set-onecol-verify.sh
- id: layout_options_ui-enable-twocol
  input: Configure Layout Options UI on the live site so the core two-column layout (layout_twocol) is
    enabled for a Layout Options override.
  criteria: Set layout_options.settings layout_overrides['layout_discovery__layout_twocol'] = 1 (via the
    settings form or config API). The stored config value for layout_discovery__layout_twocol is then
