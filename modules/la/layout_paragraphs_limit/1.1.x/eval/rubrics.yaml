rubrics:
- id: layout_paragraphs_limit_layout_paragraphs_limit_config_object
  version: '1.0'
  applicable_bundles:
  - layout_paragraphs_limit
  checks:
  - kind: must_contain_any
    values:
    - layout_paragraphs_limit.settings
    - disallowed_types
    - negate
  scoring:
    combine: all_pass
- id: layout_paragraphs_limit_layout_paragraphs_limit_configure_route
  version: '1.0'
  applicable_bundles:
  - layout_paragraphs_limit
  checks:
  - kind: must_contain_any
    values:
    - /admin/config/content/layout_paragraphs/limit
    - layout_paragraphs_limit.settings_form
    - administer site configuration
  scoring:
    combine: all_pass
- id: layout_paragraphs_limit_layout_paragraphs_limit_mechanism
  version: '1.0'
  applicable_bundles:
  - layout_paragraphs_limit
  checks:
  - kind: must_contain_any
    values:
    - LayoutParagraphsAllowedTypesEvent
    - event subscriber
    - numeric_limit
  scoring:
    combine: all_pass
- id: layout_paragraphs_limit_layout_paragraphs_limit_known_exclusion
  version: '1.0'
  applicable_bundles:
  - layout_paragraphs_limit
  checks:
  - kind: must_contain_any
    values:
    - bp_card
  scoring:
    combine: all_pass
- id: layout_paragraphs_limit_layout_paragraphs_limit_known_limit
  version: '1.0'
  applicable_bundles:
  - layout_paragraphs_limit
  checks:
  - kind: must_contain_any
    values:
    - '2'
  scoring:
    combine: all_pass
- id: layout_paragraphs_limit_layout_paragraphs_limit_set_exclude
  version: '1.0'
  applicable_bundles:
  - layout_paragraphs_limit
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
- id: layout_paragraphs_limit_layout_paragraphs_limit_set_limit
  version: '1.0'
  applicable_bundles:
  - layout_paragraphs_limit
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
