- id: layout_paragraphs_limit-set-exclude
  input: Using layout_paragraphs_limit on this Drupal site, configure the 'content' region of the layout_onecol
    layout so that the paragraph type bp_callout is NOT allowed there (exclude it). Apply the change to
    the live site.
  criteria: 'Set layout_paragraphs_limit.settings disallowed_types.layout_onecol.content to {negate: false,
