metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: layout_paragraphs_limit
  version: 1.1.x
  note: 'Layout Paragraphs Limit restricts, per Layout Paragraphs layout+region, which paragraph types
    may be added and how many components a region holds. All rules live in the config object layout_paragraphs_limit.settings
    under disallowed_types.<layout_id>.<region> => {negate: bool, numeric_limit: int, paragraph_types:
    {<ptype>: <ptype>|0}}. negate FALSE = exclude checked types; TRUE = include only checked types; numeric_limit
    0 = unlimited. Enforcement is an event subscriber on LayoutParagraphsAllowedTypesEvent. Config route
    layout_paragraphs_limit.settings_form at /admin/config/content/layout_paragraphs/limit (perm: administer
    site configuration). Layout ids/regions are core layout plugins (layout_onecol/content, layout_twocol/top,first,second,bottom).
    Real paragraph types on this site include bp_card and bp_callout. Medium/hard cases are grounded in
    that config object.'
questions:
- id: layout_paragraphs_limit-config-object
  input: In the Drupal contrib module layout_paragraphs_limit, where are the per-region paragraph-type
    restrictions stored? Name the config object and the key/structure, and explain what the 'negate' flag
    does.
  criteria: Rules live in the config object layout_paragraphs_limit.settings under disallowed_types.<layout_id>.<region>,
    each holding negate (bool), numeric_limit (int) and paragraph_types (checkboxes). negate=false EXCLUDES
    the checked paragraph types from that region; negate=true INCLUDES only the checked types.
  bundle: layout_paragraphs_limit
  rubric_ref: rubric/layout_paragraphs_limit_layout_paragraphs_limit_config_object@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: layout_paragraphs_limit-configure-route
  input: What is the admin path / route of the layout_paragraphs_limit settings form, and which permission
    controls access to it?
  criteria: Route layout_paragraphs_limit.settings_form at /admin/config/content/layout_paragraphs/limit,
    gated by the core permission 'administer site configuration'.
  bundle: layout_paragraphs_limit
  rubric_ref: rubric/layout_paragraphs_limit_layout_paragraphs_limit_configure_route@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: layout_paragraphs_limit-mechanism
  input: How does layout_paragraphs_limit actually enforce its restrictions at edit time in Layout Paragraphs?
    Which event does it react to, and how does the numeric limit work?
  criteria: An event subscriber (LayoutParagraphsLimitAllowedTypesSubscriber) listens to LayoutParagraphsAllowedTypesEvent;
    for the edited layout+region it diffs (exclude) or intersects (include) the allowed paragraph types,
    and when the region already holds numeric_limit or more components it sets the allowed types to []
    so nothing more can be added.
  bundle: layout_paragraphs_limit
  rubric_ref: rubric/layout_paragraphs_limit_layout_paragraphs_limit_mechanism@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: layout_paragraphs_limit-known-exclusion
  input: On this Drupal site, layout_paragraphs_limit has been configured to restrict paragraph types
    in the 'content' region of the layout_onecol layout. Inspect the live configuration and state which
    paragraph type is disallowed there.
  criteria: 'bp_card is excluded: layout_paragraphs_limit.settings -> disallowed_types.layout_onecol.content
    has negate=false and paragraph_types containing bp_card.'
  bundle: layout_paragraphs_limit
  rubric_ref: rubric/layout_paragraphs_limit_layout_paragraphs_limit_known_exclusion@1.0
  tags:
  - mode:introspection
  - difficulty:medium
