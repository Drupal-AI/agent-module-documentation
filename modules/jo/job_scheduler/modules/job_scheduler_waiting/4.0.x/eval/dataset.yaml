metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: job_scheduler_waiting
  version: 4.0.x
  note: 'job_scheduler_waiting runs one named scheduler continuously: each loop iteration equals \Drupal::service(''job_scheduler.manager'')->perform($name)
    (the same due-job dispatch as cron). It ships a supervisord template and a legacy Drush 8 .drush.inc
    command (job-scheduler-waiting-perform / jswp) that modern Drush does not load. Depends on job_scheduler.
    Medium/hard cases are grounded in real job_schedule entities (namespaced ''jsw_'') and the live perform()
    dispatch, which consumes a due non-periodic job whose scheduler has no declared worker.'
questions:
- id: job_scheduler_waiting-what-it-does
  input: What is the purpose of the job_scheduler_waiting module, and what does each iteration of its
    worker loop actually call?
  criteria: It runs one Job Scheduler scheduler continuously (a long-running process) instead of on cron.
    Each loop iteration calls \Drupal::service('job_scheduler.manager')->perform($name), the same due-job
    dispatch cron uses, with set_time_limit(0) and a short sleep between empty passes.
  bundle: job_scheduler_waiting
  rubric_ref: rubric/job_scheduler_waiting_job_scheduler_waiting_what_it_does@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: job_scheduler_waiting-command
  input: How is the job_scheduler_waiting worker intended to be run in production, and what is the name
    of the Drush command it declares? Any caveat on modern Drupal?
  criteria: 'It is meant to run under a process supervisor (supervisord template in misc/), invoking the
    legacy Drush command job-scheduler-waiting-perform (alias jswp) with the scheduler name. Caveat: that
    command lives in a legacy .drush.inc file which modern Drush (10+) does not load, so drive perform()
    from your own supervised process.'
  bundle: job_scheduler_waiting
  rubric_ref: rubric/job_scheduler_waiting_job_scheduler_waiting_command@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: job_scheduler_waiting-dependency
  input: Which module does job_scheduler_waiting depend on, and where does the actual job dispatch logic
    live?
  criteria: It depends on job_scheduler; the dispatch logic is the parent module's job_scheduler.manager
    service perform()/dispatch()/execute() — job_scheduler_waiting just calls perform($name) repeatedly.
  bundle: job_scheduler_waiting
  rubric_ref: rubric/job_scheduler_waiting_job_scheduler_waiting_dependency@1.0
  tags:
  - mode:recipe
  - difficulty:easy
