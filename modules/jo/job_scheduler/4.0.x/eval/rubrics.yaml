rubrics:
- id: job_scheduler_job_scheduler_schedule_a_job
  version: '1.0'
  applicable_bundles:
  - job_scheduler
  checks:
  - kind: must_contain_any
    values:
    - job_scheduler.manager
    - ->set(
    - period
  scoring:
    combine: all_pass
- id: job_scheduler_job_scheduler_declare_scheduler
  version: '1.0'
  applicable_bundles:
  - job_scheduler
  checks:
  - kind: must_contain_any
    values:
    - hook_cron_job_scheduler_info
    - worker callback
    - queue name
  scoring:
    combine: all_pass
- id: job_scheduler_job_scheduler_settings
  version: '1.0'
  applicable_bundles:
  - job_scheduler
  checks:
  - kind: must_contain_any
    values:
    - job_scheduler.settings
    - limit
    - /admin/config/system/job-scheduler
  scoring:
    combine: all_pass
- id: job_scheduler_job_scheduler_known_period
  version: '1.0'
  applicable_bundles:
  - job_scheduler
  checks:
  - kind: must_contain_any
    values:
    - '3600'
  scoring:
    combine: all_pass
- id: job_scheduler_job_scheduler_known_jobid
  version: '1.0'
  applicable_bundles:
  - job_scheduler
  checks:
  - kind: must_contain_any
    values:
    - '7777'
  scoring:
    combine: all_pass
- id: job_scheduler_job_scheduler_create_job
  version: '1.0'
  applicable_bundles:
  - job_scheduler
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
- id: job_scheduler_job_scheduler_remove_job
  version: '1.0'
  applicable_bundles:
  - job_scheduler
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
