metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: ctools
  version: 4.1.x
  note: 'CTools is a developer utility suite with no admin configuration screen (`configure: null`); it
    is consumed entirely through services and plugins. All cases are `recipe` (response-graded) and probe
    load-bearing, ctools-specific facts an agent would otherwise have to read source to answer.'
questions:
- id: ctools-form-wizard-base
  input: On a Drupal 11 site I want to turn several forms into one multi-step flow using CTools. Which
    base class do I subclass, and which method defines the ordered list of steps?
  criteria: Subclass \Drupal\ctools\Wizard\FormWizardBase (implements FormWizardInterface) and implement
    getOperations($cached_values) to return the ordered steps, each ['title' => ..., 'form' => SomeForm::class].
  bundle: ctools
  rubric_ref: rubric/ctools_ctools_form_wizard_base@1.0
  tags:
  - mode:recipe
- id: ctools-wizard-shared-state
  input: In a CTools form wizard, how do the individual step forms read and write the data collected so
    far across steps? Show the call.
  criteria: Step forms read/write shared state via $form_state->getTemporaryValue('wizard'); the WizardFactory
    stores per-step values in a SerializableTempstore and clears it on finish.
  bundle: ctools
  rubric_ref: rubric/ctools_ctools_wizard_shared_state@1.0
  tags:
  - mode:recipe
- id: ctools-relationship-plugin
  input: I want to derive a related context (e.g. a node's author user) from a base context in CTools.
    What plugin type do I use, what namespace/discovery directory holds these plugins, and what base class
    do I extend?
  criteria: 'Use the Relationship plugin type: put the plugin in Plugin/Relationship/, annotate with @Relationship,
    and extend \Drupal\ctools\Plugin\RelationshipBase, implementing getRelationship().'
  bundle: ctools
  rubric_ref: rubric/ctools_ctools_relationship_plugin@1.0
  tags:
  - mode:recipe
- id: ctools-relationship-manager
  input: Which service ID manages CTools Relationship plugins, and how do I list the relationships available
    for a given set of contexts?
  criteria: The plugin.manager.ctools.relationship service (RelationshipManager); call ->getDefinitionsForContexts($contexts)
    to list relationships available for those contexts.
  bundle: ctools
  rubric_ref: rubric/ctools_ctools_relationship_manager@1.0
  tags:
  - mode:recipe
- id: ctools-tempstore-services
  input: I need a per-user, expiring store for serializable objects in CTools, and a way to load one of
    those objects out of the shared tempstore as a route parameter. Name the relevant CTools services,
    and note any caveat.
  criteria: ctools.serializable.tempstore.factory (SerializableTempstoreFactory) is the per-user expiring
    store, though it is deprecated in favor of core's shared tempstore factory; ctools.paramconverter.tempstore
    (TempstoreConverter) loads an object out of the shared tempstore for a route parameter.
  bundle: ctools
  rubric_ref: rubric/ctools_ctools_tempstore_services@1.0
  tags:
  - mode:recipe
- id: ctools-wizard-route-access
  input: 'How do I wire up a CTools wizard route: what route key points at the wizard class, what route
    enhancer is needed, and what access requirement guards it with the tempstore lock check?'
  criteria: 'The route uses _wizard: My\Wizard\Class plus the ctools.wizard_enhancer route enhancer, and
    typically requirements: { _ctools_access: ''TRUE'' } (backed by ctools.access / TempstoreAccess).
    Controllers ctools.wizard.form / ctools.wizard.entity.form render it.'
  bundle: ctools
  rubric_ref: rubric/ctools_ctools_wizard_route_access@1.0
  tags:
  - mode:recipe
- id: ctools-submodules
  input: Which submodule ships with CTools adds a block that renders a single field of an entity? Name
    the submodule and briefly what the other two CTools submodules do.
  criteria: ctools_block adds the entity-field block (render any single field of an entity). ctools_entity_mask
    lets a custom entity type borrow another type's fields/display, and ctools_views exposes a Views display
    as a configurable block with row/offset overrides.
  bundle: ctools
  rubric_ref: rubric/ctools_ctools_submodules@1.0
  tags:
  - mode:recipe
- id: ctools-context-services
  input: In CTools, which services do I use to turn stored context config into Context objects, and to
    resolve a typed-data property path (like node:uid:entity) to a context? Name them.
  criteria: ctools.context_mapper (ContextMapper) turns stored context config into Context objects; ctools.typed_data.resolver
    (TypedDataResolver) resolves a typed-data property path to a context via getContextFromProperty().
  bundle: ctools
  rubric_ref: rubric/ctools_ctools_context_services@1.0
  tags:
  - mode:recipe
