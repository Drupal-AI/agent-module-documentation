metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: health_check_url
  version: 3.3.x
  note: Health Check URL exposes a plain-text health endpoint (default /health) built dynamically from
    config. Its only persistent state is the config object health_check_url.settings with keys type, string,
    endpoint, maintainence_access. The endpoint route is registered via route_callbacks -> RouteService::routes();
    the controller HealthCheckController::healthCheckUrl() returns one of five formats selected by type
    (timestamp, string, stringWithTimestamp, stringWithDateTime, stringWithDateTimestamp). Medium cases
    read back known settings; hard cases set the endpoint/string/type and verify the stored config the
    module uses to build the route and response. Verification is on config (not an HTTP hit) because changing
    the endpoint requires a router rebuild, and this shared site's route rebuild is currently fatal due
    to a pre-existing broken commerce_giftcard state; the config values are exactly what the module reads
    to serve the endpoint.
questions:
- id: health_check_url-default-endpoint
  input: After enabling the Drupal health_check_url module, at what URL path does the health endpoint
    respond by default, and how is that route registered?
  criteria: 'By default the endpoint is /health. The route is registered dynamically: health_check_url.routing.yml
    uses route_callbacks -> RouteService::routes(), which reads the endpoint from health_check_url.settings
    and builds the route.'
  bundle: health_check_url
  rubric_ref: rubric/health_check_url_health_check_url_default_endpoint@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: health_check_url-response-types
  input: What response formats can the health_check_url endpoint return, and which config key selects
    the format?
  criteria: 'The ''type'' key in health_check_url.settings selects one of: timestamp, string, stringWithTimestamp,
    stringWithDateTime, stringWithDateTimestamp. The controller returns it as text/plain.'
  bundle: health_check_url
  rubric_ref: rubric/health_check_url_health_check_url_response_types@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: health_check_url-config-keys
  input: Which config object holds health_check_url's settings and what keys does it contain?
  criteria: health_check_url.settings holds type, string, endpoint, and maintainence_access (module's
    spelling).
  bundle: health_check_url
  rubric_ref: rubric/health_check_url_health_check_url_config_keys@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: health_check_url-known-endpoint
  input: On this Drupal site the health_check_url endpoint has been moved off its default path. Inspect
    the live configuration and give the endpoint path that is currently configured.
  criteria: health_check_url.settings has endpoint = /hcu-status (with string = HealthyHCU, type = string).
  bundle: health_check_url
  rubric_ref: rubric/health_check_url_health_check_url_known_endpoint@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/health_check_url-known-endpoint-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/health_check_url-restore-defaults.sh
- id: health_check_url-known-type
  input: This site's health_check_url is configured to return a non-default response format. Inspect the
    live configuration and state the response 'type' currently set.
  criteria: health_check_url.settings has type = stringWithTimestamp (string = OK-HCU), i.e. the response
