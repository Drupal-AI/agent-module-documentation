metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: heading
  version: 2.0.x
  note: 'Heading provides a ''heading'' field type (HeadingItem: columns text varchar255 + size char2;
    default widget ''heading'', default formatter ''heading''; field settings label + allowed_sizes subset
    of h1-h6) and a separate ''heading_text'' formatter for core string/text fields (single ''size'' setting,
    default h2, wraps value in an html_tag of that size). The ''heading'' formatter renders via the theme
    hook ''heading'' (template heading.html.twig: <{{size}}>{{text}}</{{size}}>). Also registers size/text
    tokens per heading field via hook_token_info_alter. No admin settings page, no permissions, no Drush,
    configure=null; config schema provided. Medium/hard cases create heading and string fields on the
    core Article type and read/write field.field.* settings and core.entity_view_display.node.article.default
    components.'
questions:
- id: heading-field-type
  input: I want editors to add a section title to Article nodes where they can also choose the heading
    level (h1-h6), rendered as a real <h2>/<h3>/etc. The 'heading' contrib module provides this. What
    field type do I add, and what are its two stored parts?
  criteria: 'Add a field of type ''heading'' (the module''s HeadingItem field type). It stores two columns:
    ''text'' (the heading text, varchar 255) and ''size'' (the level, e.g. h2). Its default widget is
    ''heading'' (textfield + size select) and default formatter ''heading'' renders it as <size>text</size>
    via the heading theme hook.'
  bundle: heading
  rubric_ref: rubric/heading_heading_field_type@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: heading-text-formatter
  input: With the heading module, how can I display an EXISTING plain string or text field as a heading
    of a specific level without creating a new field? Name the formatter and its setting (and its default).
  criteria: Use the 'heading_text' field formatter (applies to core string and text fields). Set its single
    'size' setting to the desired level (h1-h6); the default is h2. It wraps the field value in an html_tag
    of that size. Configured on the entity's Manage display.
  bundle: heading
  rubric_ref: rubric/heading_heading_text_formatter@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: heading-allowed-sizes
  input: On a 'heading' field from the heading module, how do I restrict which heading levels an editor
    can choose, and what happens in the widget if only one level is allowed?
  criteria: Use the field's 'allowed_sizes' setting (checkboxes of h1-h6) to limit the choices; default
    is all of h1-h6. If exactly one size is allowed the widget hides the size select and applies that
    single size automatically (a fixed value element).
  bundle: heading
  rubric_ref: rubric/heading_heading_allowed_sizes@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: heading-allowed-sizes-known
  input: On this Drupal site the Article content type has a heading-module 'heading' field named field_hdg_known
    whose allowed heading levels have been restricted. Inspect the live field configuration and list exactly
    which heading sizes are allowed.
  criteria: 'field_hdg_known allows only h2 and h3: field.field.node.article.field_hdg_known -> settings.allowed_sizes
    = [h2, h3]. Read with: drush cget field.field.node.article.field_hdg_known settings.allowed_sizes'
  bundle: heading
  rubric_ref: rubric/heading_heading_allowed_sizes_known@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/heading-allowed-sizes-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/heading-allowed-sizes-cleanup.sh
- id: heading-text-size-known
  input: The Article content type on this site has a string field 'field_hdg_sub' that is displayed using
    the heading module's heading_text formatter. Inspect the live display configuration and state which
    heading size it is configured to output.
  criteria: 'It is configured at size h4: core.entity_view_display.node.article.default -> content.field_hdg_sub
    has type heading_text with settings.size = h4. Read with: drush cget core.entity_view_display.node.article.default
    content.field_hdg_sub'
  bundle: heading
  rubric_ref: rubric/heading_heading_text_size_known@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/heading-text-size-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/heading-text-size-cleanup.sh
- id: heading-create-field
  input: On this site, using the heading module, add a new Heading field named field_hdg_task to the Article
    content type (entity type node, bundle article) so editors get a text + heading-level field. Apply
    the change to the live site.
  criteria: Create a FieldStorageConfig (entity_type node, field_name field_hdg_task, type 'heading')
    and a FieldConfig attaching it to bundle article, then save. verify passes when node.article.field_hdg_task
    exists with field type 'heading'.
  bundle: heading
  rubric_ref: rubric/heading_heading_create_field@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/heading-create-field-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/heading-create-field-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/heading-create-field-verify.sh
- id: heading-format-string
  input: On this site the Article type has a plain string field 'field_hdg_fmt' currently shown with the
    default string formatter. Using the heading module, change its default display so the field renders
    as a heading. Apply the change to the live default view display.
  criteria: Set the field_hdg_fmt component in core.entity_view_display.node.article.default to formatter
    type 'heading_text' (optionally a size setting) and save. verify passes when the component's formatter
    type is heading_text.
  bundle: heading
  rubric_ref: rubric/heading_heading_format_string@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/heading-format-string-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/heading-format-string-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/heading-format-string-verify.sh
