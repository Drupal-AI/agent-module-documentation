rubrics:
- id: heading_heading_field_type
  version: '1.0'
  applicable_bundles:
  - heading
  checks:
  - kind: must_contain_any
    values:
    - heading
    - size
    - text
  scoring:
    combine: all_pass
- id: heading_heading_text_formatter
  version: '1.0'
  applicable_bundles:
  - heading
  checks:
  - kind: must_contain_any
    values:
    - heading_text
    - size
  scoring:
    combine: all_pass
- id: heading_heading_allowed_sizes
  version: '1.0'
  applicable_bundles:
  - heading
  checks:
  - kind: must_contain_any
    values:
    - allowed_sizes
    - allowed sizes
    - single
    - hidden
    - select
  scoring:
    combine: all_pass
- id: heading_heading_allowed_sizes_known
  version: '1.0'
  applicable_bundles:
  - heading
  checks:
  - kind: must_contain_any
    values:
    - h2
    - h3
  scoring:
    combine: all_pass
- id: heading_heading_text_size_known
  version: '1.0'
  applicable_bundles:
  - heading
  checks:
  - kind: must_contain_any
    values:
    - h4
  scoring:
    combine: all_pass
- id: heading_heading_create_field
  version: '1.0'
  applicable_bundles:
  - heading
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
- id: heading_heading_format_string
  version: '1.0'
  applicable_bundles:
  - heading
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
