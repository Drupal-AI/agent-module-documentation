rubrics:
- id: header_and_footer_scripts_hfs_add_analytics
  version: '1.0'
  applicable_bundles:
  - header_and_footer_scripts
  checks:
  - kind: must_contain_any
    values:
    - header_and_footer_scripts
    - /admin/config/development/header-and-footer-scripts
    - header.settings
    - scripts
    - Header Footer Scripts
  scoring:
    combine: all_pass
- id: header_and_footer_scripts_hfs_three_regions
  version: '1.0'
  applicable_bundles:
  - header_and_footer_scripts
  checks:
  - kind: must_contain_any
    values:
    - header
    - body
    - footer
  scoring:
    combine: all_pass
- id: header_and_footer_scripts_hfs_permission
  version: '1.0'
  applicable_bundles:
  - header_and_footer_scripts
  checks:
  - kind: must_contain_any
    values:
    - header_and_footer_scripts_settings
    - Add Scripts all over the site
    - permission
  scoring:
    combine: all_pass
- id: header_and_footer_scripts_hfs_known_header
  version: '1.0'
  applicable_bundles:
  - header_and_footer_scripts
  checks:
  - kind: must_contain_any
    values:
    - HFS_MARKER_ABC123
  scoring:
    combine: all_pass
- id: header_and_footer_scripts_hfs_known_footer
  version: '1.0'
  applicable_bundles:
  - header_and_footer_scripts
  checks:
  - kind: must_contain_any
    values:
    - hfs-footer-marker-xyz
  scoring:
    combine: all_pass
- id: header_and_footer_scripts_hfs_add_footer_script
  version: '1.0'
  applicable_bundles:
  - header_and_footer_scripts
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
- id: header_and_footer_scripts_hfs_add_header_script
  version: '1.0'
  applicable_bundles:
  - header_and_footer_scripts
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
