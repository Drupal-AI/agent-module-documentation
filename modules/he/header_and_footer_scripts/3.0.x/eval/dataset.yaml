  criteria: The header region config header_and_footer_scripts.header.settings has scripts set to a <script>
    that logs HFS_MARKER_ABC123.
  bundle: header_and_footer_scripts
  rubric_ref: rubric/header_and_footer_scripts_hfs_known_header@1.0
  tags:
