metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: header_and_footer_scripts
  version: 3.0.x
  note: 'Header and Footer Scripts stores site-wide CSS/JS in three plain config objects, each with a
    ''styles'' string and a ''scripts'' string: header_and_footer_scripts.header.settings (rendered into
    <head> via hook_page_attachments_alter), .body.settings (after <body> via hook_page_top), .footer.settings
    (near end via hook_page_bottom). Configure route header_and_footer_scripts.admin.header at /admin/config/development/header-and-footer-scripts/{header,body,footer};
    permission header_and_footer_scripts_settings. No config schema. Medium cases read a known marker
    written into a region config; hard cases require writing a specific snippet into a region config,
    verified by reading the live config value. Baseline is ''config objects absent'', restored by deleting
    them.'
questions:
- id: hfs-add-analytics
  input: I want to add a site-wide Google Analytics / GA4 tracking snippet to every page of my Drupal
    11 site without editing theme files. The header_and_footer_scripts module is enabled. Where do I put
    the script and where is it stored?
  criteria: Go to Configuration -> Development -> Header Footer Scripts (/admin/config/development/header-and-footer-scripts/header)
    and paste the <script> into the Scripts textarea of the Header form; it saves to config header_and_footer_scripts.header.settings
    (key 'scripts') and is injected into <head> via hook_page_attachments_alter().
  bundle: header_and_footer_scripts
  rubric_ref: rubric/header_and_footer_scripts_hfs_add_analytics@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: hfs-three-regions
  input: The header_and_footer_scripts module offers three regions to inject scripts/styles. Name the
    three regions and where each one renders in the page markup, and give the config object for each.
  criteria: Header (header_and_footer_scripts.header.settings) -> injected into <head> (hook_page_attachments_alter).
    Body (header_and_footer_scripts.body.settings) -> printed right after the opening <body> tag (hook_page_top),
    the right spot for a Google Tag Manager <noscript>. Footer (header_and_footer_scripts.footer.settings)
    -> printed near the end of the page (hook_page_bottom). Each object has a 'styles' and a 'scripts'
    string.
  bundle: header_and_footer_scripts
  rubric_ref: rubric/header_and_footer_scripts_hfs_three_regions@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: hfs-permission
  input: Which permission controls who can edit the Header and Footer Scripts settings forms in Drupal,
    and what is its human label?
  criteria: The single permission header_and_footer_scripts_settings, labelled 'Add Scripts all over the
    site' (marked restricted). It gates all three region settings forms (header/body/footer).
  bundle: header_and_footer_scripts
  rubric_ref: rubric/header_and_footer_scripts_hfs_permission@1.0
  tags:
  - mode:recipe
  - difficulty:easy
