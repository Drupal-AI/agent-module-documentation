metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: health_check
  version: 3.2.x
  note: Health Check exposes a single fixed route with no config, no plugins, and no permissions. Cases
    are `recipe` (response-graded) since they probe documented facts an agent would otherwise read source
    to answer; no site mutation.
questions:
- id: health-check-endpoint-path
  input: On a Drupal site with the health_check module enabled, what URL path do I give a load balancer
    to check the instance's health, and what is the route name?
  criteria: The path is /health (route name health_check.content). The path is fixed and not configurable.
  bundle: health_check
  rubric_ref: rubric/health_check_health_check_endpoint_path@1.0
  tags:
  - mode:recipe
- id: health-check-200-response
  input: What HTTP status code and response body does the health_check module's endpoint return so a load
    balancer or uptime monitor can tell the instance is healthy?
  criteria: It returns HTTP 200 with a UNIX timestamp (time()) as a text/plain body; a non-200 means the
    instance is unhealthy.
  bundle: health_check
  rubric_ref: rubric/health_check_health_check_200_response@1.0
  tags:
  - mode:recipe
- id: health-check-controller
  input: Which controller and method handle the health_check endpoint, and what does the method return?
  criteria: HealthController::content() returns a plain Symfony Response with body time(), status 200,
    and Content-Type text/plain.
  bundle: health_check
  rubric_ref: rubric/health_check_health_check_controller@1.0
  tags:
  - mode:recipe
- id: health-check-no-cache
  input: Why does polling the health_check /health endpoint always hit the live instance instead of returning
    a cached copy? Which route option controls this?
  criteria: 'The route sets no_cache: TRUE, so the response is never cached and every request re-hits
    the live instance; the returned timestamp changes each time.'
  bundle: health_check
  rubric_ref: rubric/health_check_health_check_no_cache@1.0
  tags:
  - mode:recipe
- id: health-check-maintenance-mode
  input: Does the health_check /health endpoint still respond while the Drupal site is in maintenance
    mode, and which route option makes that possible?
  criteria: 'Yes; the route sets _maintenance_access: TRUE, so /health answers 200 even in maintenance
    mode.'
  bundle: health_check
  rubric_ref: rubric/health_check_health_check_maintenance_mode@1.0
  tags:
  - mode:recipe
- id: health-check-configurable
  input: Can I change the /health path or add custom pluggable subsystem checks using the health_check
    module's own configuration?
  criteria: No. The module has no settings form, no config, and no pluggable checks; the /health path
    is fixed and only returns the timestamp.
  bundle: health_check
  rubric_ref: rubric/health_check_health_check_configurable@1.0
  tags:
  - mode:recipe
- id: health-check-lightweight-bootstrap
  input: What does a 200 from the health_check /health endpoint actually confirm about the Drupal instance,
    and what happens if the instance can't bootstrap?
  criteria: A 200 with a fresh timestamp confirms PHP and Drupal request handling are alive without rendering
    a full page; if the instance cannot bootstrap it returns a 5xx (or fails) and the load balancer can
    drop it.
  bundle: health_check
  rubric_ref: rubric/health_check_health_check_lightweight_bootstrap@1.0
  tags:
  - mode:recipe
