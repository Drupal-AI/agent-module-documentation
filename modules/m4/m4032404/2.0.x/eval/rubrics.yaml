rubrics:
- id: m4032404_m4032404_what_it_does
  version: '1.0'
  applicable_bundles:
  - m4032404
  checks:
  - kind: must_contain_any
    values:
    - '404'
    - '403'
    - access denied
    - not found
  scoring:
    combine: all_pass
- id: m4032404_m4032404_bypass_permission
  version: '1.0'
  applicable_bundles:
  - m4032404
  checks:
  - kind: must_contain_any
    values:
    - access 403 page
  scoring:
    combine: all_pass
- id: m4032404_m4032404_settings_keys
  version: '1.0'
  applicable_bundles:
  - m4032404
  checks:
  - kind: must_contain_any
    values:
    - admin_only
    - pages
    - negate
  scoring:
    combine: all_pass
- id: m4032404_m4032404_read_admin_only
  version: '1.0'
  applicable_bundles:
  - m4032404
  checks:
  - kind: must_contain_any
