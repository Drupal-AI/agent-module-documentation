rubrics:
- id: nagios_nagios_endpoint_path_default
  version: '1.0'
  applicable_bundles:
  - nagios
  checks:
  - kind: must_contain_any
    values:
    - nagios
    - statuspage
    - enabled
  scoring:
    combine: all_pass
- id: nagios_nagios_request_auth
  version: '1.0'
  applicable_bundles:
  - nagios
  checks:
  - kind: must_contain_any
    values:
    - User-Agent
    - user agent
    - nagios.ua
    - unique_id
  scoring:
    combine: all_pass
- id: nagios_nagios_drush_checks
  version: '1.0'
  applicable_bundles:
  - nagios
  checks:
  - kind: must_contain_any
    values:
    - drush nagios
    - nagios-list
    - nagios
  scoring:
    combine: all_pass
- id: nagios_nagios_endpoint_config_intro
  version: '1.0'
  applicable_bundles:
  - nagios
  checks:
  - kind: must_contain_any
    values:
    - nagios_intro_status
  scoring:
    combine: all_pass
- id: nagios_nagios_ua_config_intro
  version: '1.0'
  applicable_bundles:
  - nagios
  checks:
  - kind: must_contain_any
    values:
    - IcingaProbe42
  scoring:
    combine: all_pass
- id: nagios_nagios_enable_endpoint
  version: '1.0'
  applicable_bundles:
  - nagios
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
- id: nagios_nagios_enable_endpoint_layman
  version: '1.0'
  applicable_bundles:
  - nagios
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
