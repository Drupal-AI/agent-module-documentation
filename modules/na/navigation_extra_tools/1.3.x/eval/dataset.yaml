metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: navigation_extra_tools
  version: 1.3.x
  note: Navigation Extra Tools has no config form; its surface is a set of Navigation-menu links (cache/cron/updates),
    two gating permissions, and a hard dependency on core navigation. All cases are `recipe` (response-graded)
    probing documented facts an agent would otherwise read source to answer; no site mutation.
questions:
- id: navtools-purpose-analog
  input: On a Drupal 11 site I use the new core Navigation module and want the cache-clear / run-cron
    / run-updates shortcuts that Admin Toolbar Extra Tools gave the old Toolbar. Which contrib module
    provides that for the Navigation module?
  criteria: Navigation Extra Tools — it adds a Tools submenu to the core Navigation toolbar with flush-cache/run-cron/run-updates
    links, the Navigation-era analog of admin_toolbar_tools.
  bundle: navigation_extra_tools
  rubric_ref: rubric/navigation_extra_tools_navtools_purpose_analog@1.0
  tags:
  - mode:recipe
- id: navtools-core-dependency
  input: Which core module must be enabled for Navigation Extra Tools to work?
  criteria: It depends on core's Navigation module (drupal:navigation); that must be enabled.
  bundle: navigation_extra_tools
  rubric_ref: rubric/navigation_extra_tools_navtools_core_dependency@1.0
  tags:
  - mode:recipe
- id: navtools-links-added
  input: What links does Navigation Extra Tools add to the Navigation menu?
  criteria: 'A Tools submenu with: Flush all caches, a ''Flush individual cache'' group (CSS/JS, plugins,
    static, routing & links, Twig, render, theme registry rebuild, Views), Run cron, and Run updates (core
    system.db_update).'
  bundle: navigation_extra_tools
  rubric_ref: rubric/navigation_extra_tools_navtools_links_added@1.0
  tags:
  - mode:recipe
- id: navtools-flush-all-route
  input: What is the path and route name for the 'Flush all caches' link added by Navigation Extra Tools,
    and what does it call?
  criteria: Path /admin/flush, route navigation_extra_tools.flush, handled by NavigationExtraToolsController::flushAll()
    which calls drupal_flush_all_caches().
  bundle: navigation_extra_tools
  rubric_ref: rubric/navigation_extra_tools_navtools_flush_all_route@1.0
  tags:
  - mode:recipe
- id: navtools-cron-route
  input: How does Navigation Extra Tools let an administrator run cron from the toolbar — what path/route
    and which permission gates it?
  criteria: The Run cron link at /run-cron (route navigation_extra_tools.run.cron) runs cron; it requires
    the 'access navigation extra tools cron' permission.
  bundle: navigation_extra_tools
  rubric_ref: rubric/navigation_extra_tools_navtools_cron_route@1.0
  tags:
  - mode:recipe
- id: navtools-permissions
  input: Which two permissions must I grant so a role can see and use Navigation Extra Tools' cache-flush
    links and its run-cron link?
  criteria: '''access navigation extra tools cache flushing'' gates all cache-flush links; ''access navigation
    extra tools cron'' gates the run-cron link.'
  bundle: navigation_extra_tools
  rubric_ref: rubric/navigation_extra_tools_navtools_permissions@1.0
  tags:
  - mode:recipe
- id: navtools-devel-submenu
  input: If the Devel module is installed alongside Navigation Extra Tools, what extra menu appears and
    where is it configured?
  criteria: A Development submenu is added under Tools; its items mirror the Devel Toolbar settings at
    /admin/config/development/devel/toolbar (config devel.toolbar.settings).
  bundle: navigation_extra_tools
  rubric_ref: rubric/navigation_extra_tools_navtools_devel_submenu@1.0
  tags:
  - mode:recipe
- id: navtools-no-config-form
  input: Does Navigation Extra Tools have its own configuration/settings form?
  criteria: No — the module provides no configuration form of its own (configure is null); its only configurable
    behavior is the optional Devel submenu, controlled by Devel's own toolbar settings.
  bundle: navigation_extra_tools
  rubric_ref: rubric/navigation_extra_tools_navtools_no_config_form@1.0
  tags:
  - mode:recipe
