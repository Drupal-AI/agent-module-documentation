rubrics:
- id: navigation_menu_role_navigation_menu_role_what_and_access
  version: '1.0'
  applicable_bundles:
  - navigation_menu_role
  checks:
  - kind: must_contain_any
    values:
    - role
    - navigation
    - block
    - SystemMenuBlock
    - visibility
  scoring:
    combine: all_pass
- id: navigation_menu_role_navigation_menu_role_settings_keys
  version: '1.0'
  applicable_bundles:
  - navigation_menu_role
  checks:
  - kind: must_contain_any
    values:
    - roles
    - level
    - depth
    - '3'
  scoring:
    combine: all_pass
- id: navigation_menu_role_navigation_menu_role_plugin_ids
  version: '1.0'
  applicable_bundles:
  - navigation_menu_role
  checks:
  - kind: must_contain_any
    values:
    - 'navigation_menu_role:'
    - deriver
    - allow_in_navigation
    - _block_ui_hidden
    - block_alter
  scoring:
    combine: all_pass
- id: navigation_menu_role_navigation_menu_role_known_block
  version: '1.0'
  applicable_bundles:
  - navigation_menu_role
  checks:
  - kind: must_contain_any
    values:
    - content_editor
  scoring:
    combine: all_pass
- id: navigation_menu_role_navigation_menu_role_place_block
  version: '1.0'
  applicable_bundles:
  - navigation_menu_role
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
