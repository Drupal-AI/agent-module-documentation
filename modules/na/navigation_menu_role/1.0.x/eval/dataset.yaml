metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: navigation_menu_role
  version: 1.0.x
  note: 'Navigation Menu Role provides ONE derived core block plugin ''navigation_menu_role'' (extends
    SystemMenuBlock, deriver SystemMenuNavigationBlockDeriver -> one derivative per menu: navigation_menu_role:main,
    :admin, :account, ...). It has no settings form (configure=null), no permissions, no Drush; it defines
    no plugin type. Its only state is block.block.<id> config entities whose settings carry level (int),
    depth (0-3), and roles (array of role ids). blockAccess allows the block when roles is empty (everyone)
    or the user has one of the listed roles. Config schema: block.settings.navigation_menu_role:*. Medium/hard
    cases are grounded in block config: introspection reads which role a placed block is limited to; execution
    places a role-restricted navigation_menu_role block and verifies its plugin + settings.roles. Region/theme
    are irrelevant to the role gating being tested.'
questions:
- id: navigation_menu_role-what-and-access
  input: What does the Drupal navigation_menu_role module provide, and how does it decide whether a user
    can see one of its Navigation menu blocks?
  criteria: It provides a derived block plugin (navigation_menu_role, one per menu) for the core Navigation
    sidebar whose visibility is limited by role. Access is allowed when the block's roles setting is empty
    (everyone) or the current user has at least one of the selected roles (NavigationMenuRoleBlock::blockAccess).
  bundle: navigation_menu_role
  rubric_ref: rubric/navigation_menu_role_navigation_menu_role_what_and_access@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: navigation_menu_role-settings-keys
  input: In a navigation_menu_role block's configuration, which settings control which roles see it and
    how much of the menu is shown? What is the maximum depth?
  criteria: The block settings are roles (array of role ids; empty means visible to everyone), level (starting
    menu level) and depth (number of levels, capped at 3 - NAVIGATION_MAX_DEPTH). They are stored under
    settings in the block.block.<id> config entity (schema block.settings.navigation_menu_role:*).
  bundle: navigation_menu_role
  rubric_ref: rubric/navigation_menu_role_navigation_menu_role_settings_keys@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: navigation_menu_role-plugin-ids
  input: What are the block plugin ids provided by navigation_menu_role, and why do they not appear in
    the normal Block layout UI?
  criteria: There is one derivative per menu, id navigation_menu_role:<menu> (e.g. navigation_menu_role:main,
    :admin, :account), created by the SystemMenuNavigationBlock deriver. hook_block_alter() marks them
    allow_in_navigation and _block_ui_hidden, so they are placed via the Navigation UI and hidden from
    the generic Block layout UI.
  bundle: navigation_menu_role
  rubric_ref: rubric/navigation_menu_role_navigation_menu_role_plugin_ids@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: navigation_menu_role-known-block
  input: This Drupal site has a navigation_menu_role menu block placed with id nmr_known. Inspect the
    live block configuration and state which user role its visibility is restricted to.
  criteria: Block nmr_known uses plugin navigation_menu_role:main and its settings.roles is ['content_editor'],
    so only the content_editor role can see it.
  bundle: navigation_menu_role
  rubric_ref: rubric/navigation_menu_role_navigation_menu_role_known_block@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/navigation_menu_role-known-block-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/navigation_menu_role-known-block-cleanup.sh
- id: navigation_menu_role-place-block
  input: On this Drupal site, use navigation_menu_role to place a Navigation menu block with id nmr_task
    for the main menu that is visible only to the content_editor role. Save it to the live site configuration.
  criteria: A block.block config entity id nmr_task with plugin navigation_menu_role:main and settings.roles
    = ['content_editor'] (level 1, depth 0). Create it with Block::create([...])->save() (theme = system
    default; region e.g. content) or via the Navigation UI.
  bundle: navigation_menu_role
  rubric_ref: rubric/navigation_menu_role_navigation_menu_role_place_block@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/navigation_menu_role-place-block-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/navigation_menu_role-place-block-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/navigation_menu_role-place-block-verify.sh
