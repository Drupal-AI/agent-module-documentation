metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: name
  version: 1.5.x
  note: 'Name Field provides a compound `name` field type (six varchar components: title, given, middle,
    family, generational, credentials) with a `name_default` widget and `name_default` formatter (configure=name.settings).
    Output is driven by `name_format` config entities whose `pattern` uses single-letter tokens (t title,
    g given, m middle, f family, s generational, c credentials, i/j/k separators, plus initials/conditionals/modifiers)
    joined with a `+` conditional operator; the shipped `default` pattern is `((((t+ig)+im)+if)+is)+jc`
    -> e.g. ''Mr. John Peter Smith Jr., PhD''. Formatting is also exposed via services name.formatter->format()
    and name.format_parser->parse(). Admin UI at /admin/config/regional/name (name_format list) and /admin/config/regional/name/settings
    (separators sep1/sep2/sep3, required marker); no custom permissions, no Drush. Medium cases read back
    a KNOWN name_format entity pattern and a KNOWN name field''s enabled components from the live site;
    hard cases create a name_format config entity and add a `name` field to a namespaced content type,
    both verified against live config.'
questions:
- id: name-field-components
  input: In Drupal, the contrib 'Name' (name) module adds a dedicated field type for storing a person's
    name. What is the field type's machine id, which discrete name components does it store, and what
    are its default widget and formatter plugin ids?
  criteria: 'The field type id is `name`. It stores six components: title, given, middle, family, generational
    (suffix) and credentials. Its default widget and default formatter are both `name_default`.'
  bundle: name
  rubric_ref: rubric/name_name_field_components@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: name-pattern-tokens
  input: The Drupal 'Name' module renders names from a 'name format' pattern made of single letters. In
    that pattern syntax, which letters output the given name, the family name, the title and the generational
    suffix, and what does the '+' operator between tokens do?
  criteria: 'Lowercase tokens: g = given name, f = family name, t = title, s = generational suffix (also
    m = middle, c = credentials, i/j/k = the three separators). The `+` is a conditional join: a piece
    like `a+b` is only emitted when its neighbouring components are present, so separators collapse around
    empty components (e.g. no trailing comma when credentials are missing).'
  bundle: name
  rubric_ref: rubric/name_name_pattern_tokens@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: name-format-in-code
  input: Using the Drupal 'Name' module, how do I take an array of name components (title, given, family,
    etc.) and turn it into a formatted string in custom PHP code? Name the service and method.
  criteria: 'Use the `name.formatter` service (NameFormatterInterface): `\Drupal::service(''name.formatter'')->format($components,
    ''default'')` where `$components` is a keyed array (title/given/middle/family/generational/credentials)
    and the second arg is a name_format entity id. For an arbitrary pattern string use `name.format_parser`->parse($components,
    ''f, g'').'
  bundle: name
  rubric_ref: rubric/name_name_format_in_code@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: name-format-pattern
  input: This Drupal site has a Name module 'name format' config entity with the machine id `name_probe`.
    Inspect the live configuration and report the exact pattern string it uses.
  criteria: The name_format entity name_probe has pattern `f, g` (family name, literal comma-space, given
    name) — readable via `drush cget name.name_format.name_probe pattern`.
  bundle: name
  rubric_ref: rubric/name_name_format_pattern@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/name-format-pattern-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/name-format-pattern-cleanup.sh
