rubrics:
- id: name_name_field_components
  version: '1.0'
  applicable_bundles:
  - name
  checks:
  - kind: must_contain_any
    values:
    - name_default
    - title, given, middle, family
    - given, middle, family
  scoring:
    combine: all_pass
- id: name_name_pattern_tokens
  version: '1.0'
  applicable_bundles:
  - name
  checks:
  - kind: must_contain_any
    values:
    - g
    - family name
    - given name
    - conditional
  scoring:
    combine: all_pass
- id: name_name_format_in_code
  version: '1.0'
  applicable_bundles:
  - name
  checks:
  - kind: must_contain_any
    values:
    - name.formatter
    - NameFormatterInterface
    - ->format(
    - name.format_parser
  scoring:
    combine: all_pass
- id: name_name_format_pattern
  version: '1.0'
  applicable_bundles:
  - name
  checks:
  - kind: must_contain_any
    values:
    - f, g
  scoring:
    combine: all_pass
- id: name_name_field_components_live
  version: '1.0'
  applicable_bundles:
  - name
  checks:
  - kind: must_contain_any
    values:
    - given and family
    - given, family
    - given name and family
    - given and family name
  scoring:
    combine: all_pass
- id: name_name_create_format
  version: '1.0'
  applicable_bundles:
  - name
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
- id: name_name_add_field
  version: '1.0'
  applicable_bundles:
  - name
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
