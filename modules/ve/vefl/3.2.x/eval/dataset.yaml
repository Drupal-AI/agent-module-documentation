metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: vefl
  version: 3.2.x
  note: 'VEFL adds a Views exposed form style ''vefl_basic'' (Basic (with layout)) that lays exposed widgets
    into Layout API regions. Config lives in a view''s display_options.exposed_form: type=vefl_basic and
    options.layout = {layout_id (default vefl_onecol, region ''middle''), widget_region: {<widget_id>:
    <region_id>}}. Widget ids = filter identifiers + actions (sort_by, sort_order, items_per_page, offset,
    submit, reset). Ships one layout vefl_onecol. Service vefl.layout. No permissions/drush/plugin-managers.
    Medium/hard cases are grounded in real view config: setup/reset write a views.view.* config object
    (via the config API, which sidesteps an unrelated pre-existing site issue where content-entity field
    mapping for commerce_giftcard blocks full entity saves), the agent inspects or edits the exposed_form
    layout, and verify reads it back.'
questions:
- id: vefl-exposed-style
  input: I want my Views exposed filters arranged into layout regions instead of one row. Which Views
    exposed form style does the vefl module add, and what is its plugin id?
  criteria: VEFL adds the exposed form style 'Basic (with layout)', plugin id vefl_basic (the vefl_bef
    submodule adds 'Better Exposed Filters (with layout)', id vefl_bef). Choose it in the view's Exposed
    form settings, then assign each widget to a layout region.
  bundle: vefl
  rubric_ref: rubric/vefl_vefl_exposed_style@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: vefl-default-layout
  input: Which layout does the vefl module ship out of the box, and what other layouts can I use for a
    Views exposed form with vefl?
  criteria: VEFL ships one layout, vefl_onecol (a single 'middle' region, declared in vefl.layouts.yml).
    Any layout registered via core layout_discovery works too - core layouts, Display Suite, and Panels
    layouts - because the list comes from the core layout plugin manager.
  bundle: vefl
  rubric_ref: rubric/vefl_vefl_default_layout@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: vefl-template-override
  input: With the vefl module, how does a themer override the markup of a view's exposed form, and which
    theme hook does vefl use?
  criteria: VEFL renders through the vefl_views_exposed_form theme hook but uses standard Views suggestions,
    so you override with views-exposed-form.html.twig or views-exposed-form--VIEWNAME(.--DISPLAY).html.twig
    in your theme; widgets are already grouped into layout regions by template_preprocess_vefl_views_exposed_form.
  bundle: vefl
  rubric_ref: rubric/vefl_vefl_template_override@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: vefl-known-region
  input: On this Drupal site there is a view named 'vefl_known' whose exposed form is laid out with vefl.
    Inspect the live view configuration and state which layout region the exposed 'title' filter widget
    is assigned to.
  criteria: In views.view.vefl_known the exposed_form (type vefl_basic) has options.layout.widget_region.title
    = 'middle', so the title widget renders in the 'middle' region of the vefl_onecol layout.
  bundle: vefl
  rubric_ref: rubric/vefl_vefl_known_region@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/vefl-known-region-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/vefl-known-region-cleanup.sh
- id: vefl-known-style
  input: Inspect the view named 'vefl_known2' on this site and state which exposed form style (plugin)
    and which layout its exposed form uses.
  criteria: views.view.vefl_known2 uses exposed_form type vefl_basic ('Basic (with layout)') with options.layout.layout_id
    = vefl_onecol.
  bundle: vefl
  rubric_ref: rubric/vefl_vefl_known_style@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/vefl-known-style-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/vefl-known-style-cleanup.sh
- id: vefl-set-style
  input: The view 'vefl_task' on this site currently uses the plain 'Basic' Views exposed form. Using
    the vefl module, change its exposed form to the layout-aware style using the vefl_onecol layout, and
    apply the change to the live site.
  criteria: views.view.vefl_task display.default.display_options.exposed_form.type = 'vefl_basic' and
    options.layout.layout_id = 'vefl_onecol'.
  bundle: vefl
  rubric_ref: rubric/vefl_vefl_set_style@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/vefl-set-style-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/vefl-set-style-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/vefl-set-style-verify.sh
- id: vefl-assign-region
  input: The view 'vefl_region' already uses vefl's layout exposed form (vefl_basic + vefl_onecol) but
    its exposed 'title' filter is not placed in any region. Assign the 'title' widget to the 'middle'
    region and apply the change to the live site.
  criteria: views.view.vefl_region exposed_form.options.layout.widget_region.title = 'middle'.
  bundle: vefl
  rubric_ref: rubric/vefl_vefl_assign_region@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/vefl-assign-region-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/vefl-assign-region-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/vefl-assign-region-verify.sh
