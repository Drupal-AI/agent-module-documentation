metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: vefl_bef
  version: 3.2.x
  note: 'vefl_bef is a VEFL submodule adding the Views exposed form style ''vefl_bef'' (Better Exposed
    Filters (with layout)); class VeflBef extends BEF''s BetterExposedFilters and uses VeflTrait. It requires
    vefl + better_exposed_filters. Config lives in a view''s display_options.exposed_form: type=vefl_bef,
    options.layout {layout_id (vefl_onecol ships), widget_region: {<widget_id>: <region_id>}} plus the
    BEF options.bef tree. Extra region-assignable items over vefl_basic: ''secondary'' and ''sort_bef_combine''.
    NOTE the site currently cannot enable vefl_bef because full module install / entity save is blocked
    by an unrelated pre-existing commerce_giftcard pending entity update; the eval setup/reset scripts
    therefore write the view via the config API (which works), and verify reads the exposed_form config
    back - the assertions are on config strings, not on a running plugin instance.'
questions:
- id: vefl_bef-style-id
  input: I use Better Exposed Filters and want to arrange its widgets into layout regions. Which Views
    exposed form style does vefl_bef add and what is its plugin id?
  criteria: vefl_bef adds the exposed form style 'Better Exposed Filters (with layout)', plugin id vefl_bef
    (class VeflBef extends BEF's BetterExposedFilters and uses VeflTrait).
  bundle: vefl_bef
  rubric_ref: rubric/vefl_bef_vefl_bef_style_id@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: vefl_bef-requires
  input: What modules must be enabled to use the vefl_bef (Better Exposed Filters Layout) exposed form
    style?
  criteria: vefl_bef depends on both vefl and better_exposed_filters (plus views).
  bundle: vefl_bef
  rubric_ref: rubric/vefl_bef_vefl_bef_requires@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: vefl_bef-extra-widgets
  input: Beyond the normal filters and actions, which two BEF-specific items can vefl_bef assign to a
    layout region, and when do they appear?
  criteria: It adds 'secondary' (Secondary exposed form options, shown when BEF allow_secondary is enabled)
    and 'sort_bef_combine' (Combine sort order with sort by, shown when BEF's combined sort is enabled)
    as region-assignable widgets.
  bundle: vefl_bef
  rubric_ref: rubric/vefl_bef_vefl_bef_extra_widgets@1.0
  tags:
  - mode:recipe
  - difficulty:easy
