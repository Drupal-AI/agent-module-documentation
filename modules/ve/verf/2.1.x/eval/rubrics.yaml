rubrics:
- id: verf_verf_add_filter
  version: '1.0'
  applicable_bundles:
  - verf
  checks:
  - kind: must_contain_any
    values:
    - VERF selector
    - (VERF selector)
  scoring:
    combine: all_pass
- id: verf_verf_config_route
  version: '1.0'
  applicable_bundles:
  - verf
  checks:
  - kind: must_contain_any
    values:
    - 'no'
    - none
    - 'null'
    - Views UI
  scoring:
    combine: all_pass
- id: verf_verf_bundle_restrict
  version: '1.0'
  applicable_bundles:
  - verf
  checks:
  - kind: must_contain_any
    values:
    - verf_target_bundles
    - Target entity bundles to filter by
  scoring:
    combine: all_pass
- id: verf_verf_ignore_access
  version: '1.0'
  applicable_bundles:
  - verf
  checks:
  - kind: must_contain_any
    values:
    - show_unpublished
    - Ignore access control
  scoring:
    combine: all_pass
- id: verf_verf_restricted_label
  version: '1.0'
  applicable_bundles:
  - verf
  checks:
  - kind: must_contain_any
    values:
    - Restricted access
    - view label
  scoring:
    combine: all_pass
- id: verf_verf_alter_hook
  version: '1.0'
  applicable_bundles:
  - verf
  checks:
  - kind: must_contain_any
    values:
    - hook_verf_entites_options_alter
    - verf_entites_options
  scoring:
    combine: all_pass
- id: verf_verf_plugin_class
  version: '1.0'
  applicable_bundles:
  - verf
  checks:
  - kind: must_contain_any
    values:
    - InOperator
    - EntityReference
    - '@ViewsFilter("verf")'
    - ViewsFilter("verf")
  scoring:
    combine: all_pass
