metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: verf
  version: 2.1.x
  note: VERF adds a label-based Views filter for entity reference fields via hook_views_data_alter(),
    backed by the `verf` filter plugin (extends InOperator). No admin form, routes, permissions, or Drush.
    Cases are `recipe` (response-graded), probing documented facts an agent would otherwise read source
    to answer; no site mutation.
questions:
- id: verf-add-filter
  input: I installed the VERF module. In a View, how do I let visitors filter content by an entity reference
    field using the referenced entity's title instead of its ID? Where is the setting?
  criteria: Enable verf, then in the View's Add filter criteria list pick the field entry labeled '{Field
    label} (VERF selector)' and expose it; its value control lists entity labels rather than numeric IDs.
    There is no separate admin config page.
  bundle: verf
  rubric_ref: rubric/verf_verf_add_filter@1.0
  tags:
  - mode:recipe
- id: verf-config-route
  input: What is the admin configuration route/path for the VERF (Views Entity Reference Filter) module?
  criteria: There is no configuration route or admin form (configure is null; no verf.routing.yml, no
    permissions, no Drush). All configuration happens inside the Views UI on the filter handler.
  bundle: verf
  rubric_ref: rubric/verf_verf_config_route@1.0
  tags:
  - mode:recipe
- id: verf-bundle-restrict
  input: Using a VERF exposed filter, how do I limit the selectable options to only certain bundles of
    the target entity type (e.g. only Article and Page nodes)? Which option key stores this?
  criteria: In the filter handler settings check the bundles under 'Target entity bundles to filter by'
    (option key verf_target_bundles); it only appears when the target entity type is bundleable, and limits
    the option list to the chosen bundles.
  bundle: verf
  rubric_ref: rubric/verf_verf_bundle_restrict@1.0
  tags:
  - mode:recipe
- id: verf-ignore-access
  input: A VERF filter is hiding entities the current user cannot view. Which option makes it list those
    entities anyway, and what is its machine name?
  criteria: Enable the 'Ignore access control' checkbox (option key show_unpublished, default FALSE).
    When off, only entities the user can 'view' are listed; when on, all target entities appear.
  bundle: verf
  rubric_ref: rubric/verf_verf_ignore_access@1.0
  tags:
  - mode:recipe
- id: verf-restricted-label
  input: In a VERF filter, what happens to an entity when the user may see its label but not view the
    entity itself?
  criteria: getValueOptions() checks 'view label' access; when the user lacks it the option renders as
    '- Restricted access -' (the row is kept but the entity's identity is hidden). Labels are also switched
    to the current content-language translation and the list is natcasesort()-ed.
  bundle: verf
  rubric_ref: rubric/verf_verf_restricted_label@1.0
  tags:
  - mode:recipe
- id: verf-alter-hook
  input: Which hook does the VERF module invoke so my custom module can add or remove entities from a
    VERF filter's option list?
  criteria: Implement hook_verf_entites_options_alter(array &$entities) — invoked via moduleHandler->alter('verf_entites_options',
    ...). Note the misspelling 'entites'. It fires for all VERF filters (no per-view context), passing
    the loaded referenceable entities.
  bundle: verf
  rubric_ref: rubric/verf_verf_alter_hook@1.0
  tags:
  - mode:recipe
- id: verf-plugin-class
  input: What Views filter plugin backs VERF, what core class does it extend, and what is its plugin id?
  criteria: Drupal\verf\Plugin\views\filter\EntityReference, annotated @ViewsFilter("verf") (plugin id
    'verf'), extends core Views InOperator. hook_views_data_alter() attaches it as '{column}_verf' filters
    on entity_reference fields (configurable and SQL base fields).
  bundle: verf
  rubric_ref: rubric/verf_verf_plugin_class@1.0
  tags:
  - mode:recipe
