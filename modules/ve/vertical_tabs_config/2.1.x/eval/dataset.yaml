metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: vertical_tabs_config
  version: 2.1.x
  note: 'Vertical Tabs Config hides/reorders the vertical tabs on node add/edit forms. Two independent
    stores, both grounded in code: (1) tab ORDER lives in config object ''vertical_tabs_config.order''
    under integer keys vertical_tabs_config_<tab> (shipped defaults meta=1..ds_switch_view_mode=8); (2)
    tab VISIBILITY lives in a CUSTOM DB TABLE ''vertical_tabs_config'' with columns content_type, vertical_tab,
    hidden(0/1), roles(JSON; empty=all roles) - NOT in config. Fixed tab list: meta, options, menu, revision_information,
    path_settings, author, book, ds_switch_view_mode (Metatag excluded from ordering). Both admin forms
    require core ''administer site configuration''. Medium cases install known state (a weight value;
    a hide row) discoverable via drush cget / sqlq. Hard cases build real state verified against the live
    config and DB table.'
questions:
- id: vtc-order-storage
  input: Using the Vertical Tabs Config module on Drupal 11, where is the ORDER (weight) of each node-form
    vertical tab stored, and what is the key naming pattern? Give the config object and an example key.
  criteria: Tab order is stored in the config object vertical_tabs_config.order, one integer weight per
    tab under keys named vertical_tabs_config_<tab>, e.g. vertical_tabs_config_author. Lower weight sorts
    higher. Shipped defaults run meta=1 through ds_switch_view_mode=8.
  bundle: vertical_tabs_config
  rubric_ref: rubric/vertical_tabs_config_vtc_order_storage@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: vtc-visibility-storage
  input: With the Vertical Tabs Config module, where is the per-content-type / per-role VISIBILITY (which
    tabs are hidden) stored? Is it in Drupal config or somewhere else, and which columns record the rule?
  criteria: Visibility is stored in a custom database table named vertical_tabs_config (created by the
    module's hook_schema), NOT in Drupal config. Each row has content_type, vertical_tab, hidden (0/1)
    and roles (a JSON array; empty means the rule applies to all roles). Because it is a DB table it is
    not captured by config export.
  bundle: vertical_tabs_config
  rubric_ref: rubric/vertical_tabs_config_vtc_visibility_storage@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: vtc-routes-perm
  input: In the Vertical Tabs Config module, at what admin path do you configure tab visibility and order,
    and which permission protects those forms?
  criteria: Both forms live under /admin/config/user-interface/vertical_tabs_config (visibility at that
    path, order at .../order) and are protected by the core 'administer site configuration' permission;
    the module defines no permission of its own.
  bundle: vertical_tabs_config
  rubric_ref: rubric/vertical_tabs_config_vtc_routes_perm@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: vtc-known-order
  input: On this Drupal site, the Vertical Tabs Config order for the 'Authoring information' tab has been
    changed from its default. Inspect the live configuration and give the integer weight currently set
    for that tab.
  criteria: vertical_tabs_config.order:vertical_tabs_config_author is 99 (readable via `drush cget vertical_tabs_config.order
    vertical_tabs_config_author`).
  bundle: vertical_tabs_config
  rubric_ref: rubric/vertical_tabs_config_vtc_known_order@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/vertical_tabs_config-order-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/vertical_tabs_config-order-cleanup.sh
- id: vtc-known-hidden
  input: On this Drupal site, Vertical Tabs Config is configured to hide exactly one vertical tab on the
    Article content type's edit form (for all roles). Inspect the live site and give the machine name
    of the tab that is hidden.
  criteria: 'The ''author'' (Authoring information) tab is hidden on article: the vertical_tabs_config
    table has a row content_type=''article'', vertical_tab=''author'', hidden=1, roles=''[]'' (query with
    `drush sqlq "SELECT vertical_tab,hidden FROM vertical_tabs_config WHERE content_type=''article'' AND
    hidden=1;"`).'
  bundle: vertical_tabs_config
  rubric_ref: rubric/vertical_tabs_config_vtc_known_hidden@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/vertical_tabs_config-hidden-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/vertical_tabs_config-hidden-cleanup.sh
