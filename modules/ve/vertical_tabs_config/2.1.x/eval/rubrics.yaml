rubrics:
- id: vertical_tabs_config_vtc_order_storage
  version: '1.0'
  applicable_bundles:
  - vertical_tabs_config
  checks:
  - kind: must_contain_any
    values:
    - vertical_tabs_config.order
    - vertical_tabs_config_
  scoring:
    combine: all_pass
- id: vertical_tabs_config_vtc_visibility_storage
  version: '1.0'
  applicable_bundles:
  - vertical_tabs_config
  checks:
  - kind: must_contain_any
    values:
    - vertical_tabs_config
    - database table
    - db table
    - hidden
  scoring:
    combine: all_pass
- id: vertical_tabs_config_vtc_routes_perm
  version: '1.0'
  applicable_bundles:
  - vertical_tabs_config
  checks:
  - kind: must_contain_any
    values:
    - /admin/config/user-interface/vertical_tabs_config
    - administer site configuration
  scoring:
    combine: all_pass
- id: vertical_tabs_config_vtc_known_order
  version: '1.0'
  applicable_bundles:
  - vertical_tabs_config
  checks:
  - kind: must_contain_any
    values:
    - '99'
  scoring:
    combine: all_pass
- id: vertical_tabs_config_vtc_known_hidden
  version: '1.0'
  applicable_bundles:
  - vertical_tabs_config
  checks:
  - kind: must_contain_any
    values:
    - author
  scoring:
    combine: all_pass
- id: vertical_tabs_config_vtc_set_order
  version: '1.0'
  applicable_bundles:
