metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: cleantalk
  version: 9.7.x
  note: 'CleanTalk is a cloud anti-spam service: real spam verdicts require a valid CleanTalk Access key
    AND outbound network access to the CleanTalk API, which the eval environment does not have. All cases
    are therefore grounded in the module''s Drupal config object (cleantalk.settings) only — the stored
    Access key and the per-form protection toggles — never in a live spam check. Easy = recipe (response-graded
    on the API-key setting, which forms are protected, and the config object). Medium = introspection
    (a known cleantalk.settings baseline is written, the agent reads it back). Hard = execution (agent
    writes cleantalk.settings on the live site; verified by reading config, exit 0 = pass).'
questions:
- id: cleantalk-api-key-setting
  input: On a Drupal site using the CleanTalk (Antispam by CleanTalk) module, which config object and
    which key hold the CleanTalk Access/API key, and is that key required for spam checks to actually
    run?
  criteria: 'The key is stored in the cleantalk.settings config object under cleantalk_authkey (the settings
    form labels it ''Access key''). It is required: without a valid Access key (and outbound network access
    to the CleanTalk API) no live spam verdict happens.'
  bundle: cleantalk
  rubric_ref: rubric/cleantalk_cleantalk_api_key_setting@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: cleantalk-which-forms-protected
  input: In the CleanTalk Drupal module, which config keys turn spam protection on or off for comments,
    user registration, and webforms?
  criteria: 'Boolean per-form toggles in cleantalk.settings: cleantalk_check_comments (comments), cleantalk_check_register
    (user registration), cleantalk_check_webforms (Webform submissions). Related toggles include cleantalk_check_contact_forms,
    cleantalk_check_search_form, cleantalk_check_forum_topics, cleantalk_check_added_content, cleantalk_check_ccf,
    cleantalk_check_external.'
  bundle: cleantalk
  rubric_ref: rubric/cleantalk_cleantalk_which_forms_protected@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: cleantalk-config-route
  input: Where is the CleanTalk module configured in the Drupal admin, and what is the settings-form route
    name?
  criteria: Settings form route cleantalk.settings at /admin/config/cleantalk/cleantalk_settings_form
    (Admin > Config > Antispam by Cleantalk > Settings), gated by the 'change cleantalk settings' permission.
  bundle: cleantalk
  rubric_ref: rubric/cleantalk_cleantalk_config_route@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: cleantalk-read-stored-key
  input: This Drupal site already has the CleanTalk module configured. What CleanTalk Access key is currently
    stored, and is comment spam protection currently turned on?
  criteria: 'cleantalk.settings.cleantalk_authkey is ''known1234evalkey'' and cleantalk_check_comments
    is TRUE (comment protection is on). Read live with: drush config:get cleantalk.settings cleantalk_authkey.'
  bundle: cleantalk
  rubric_ref: rubric/cleantalk_cleantalk_read_stored_key@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/cleantalk-known-config-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/cleantalk-known-config-cleanup.sh
- id: cleantalk-which-forms-on
  input: 'On this Drupal site, look at the current CleanTalk configuration and tell me which of these
    are being spam-checked right now: webforms, forum topics, and the search form.'
  criteria: 'From live cleantalk.settings: forum topics ARE checked (cleantalk_check_forum_topics = TRUE);
    webforms are NOT (cleantalk_check_webforms = FALSE) and the search form is NOT (cleantalk_check_search_form
    = FALSE).'
  bundle: cleantalk
  rubric_ref: rubric/cleantalk_cleantalk_which_forms_on@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/cleantalk-known-config-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/cleantalk-known-config-cleanup.sh
- id: cleantalk-set-key-protect-comments
  input: 'Configure the CleanTalk module on this Drupal 11 site: set the CleanTalk Access key to the dummy
    value DUMMYKEY0001 and make sure spam protection is enabled for both comments and user registration.
    Persist it to the live site. (No network spam check is expected — just get the configuration right.)'
  criteria: cleantalk.settings has cleantalk_authkey = 'DUMMYKEY0001' (any non-empty key), cleantalk_check_comments
    = TRUE, and cleantalk_check_register = TRUE. Verified by reading live config (no CleanTalk API call).
  bundle: cleantalk
  rubric_ref: rubric/cleantalk_cleantalk_set_key_protect_comments@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/cleantalk-key-and-comments-reset.sh
    verify: agent-module-documentation/evaluation/verify/cleantalk-key-and-comments-verify.sh
    note: 'Config-only: verify never contacts the CleanTalk API. The dummy key would fail real validation
      on the settings form; here it is written straight to config (e.g. drush config:set cleantalk.settings
      cleantalk_authkey DUMMYKEY0001).'
- id: cleantalk-forum-not-search
  input: On this Drupal 11 site, set a dummy CleanTalk Access key, then turn CleanTalk spam checking ON
    for forum topic posts and OFF for the search form. Apply it to the live site. (No live spam verdict
    is expected — configuration only.)
  criteria: cleantalk.settings has a non-empty cleantalk_authkey, cleantalk_check_forum_topics = TRUE,
    and cleantalk_check_search_form = FALSE. Verified by reading live config (no CleanTalk API call).
  bundle: cleantalk
  rubric_ref: rubric/cleantalk_cleantalk_forum_not_search@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/cleantalk-forum-not-search-reset.sh
    verify: agent-module-documentation/evaluation/verify/cleantalk-forum-not-search-verify.sh
    note: Config-only verification; the CleanTalk API is never contacted.
