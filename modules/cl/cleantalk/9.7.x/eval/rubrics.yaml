rubrics:
- id: cleantalk_cleantalk_api_key_setting
  version: '1.0'
  applicable_bundles:
  - cleantalk
  checks:
  - kind: must_contain_any
    values:
    - cleantalk_authkey
    - cleantalk.settings
  scoring:
    combine: all_pass
- id: cleantalk_cleantalk_which_forms_protected
  version: '1.0'
  applicable_bundles:
  - cleantalk
  checks:
  - kind: must_contain_any
    values:
    - cleantalk_check_comments
    - cleantalk_check_register
    - cleantalk_check_webforms
  scoring:
    combine: all_pass
- id: cleantalk_cleantalk_config_route
  version: '1.0'
  applicable_bundles:
  - cleantalk
  checks:
  - kind: must_contain_any
    values:
    - cleantalk.settings
    - /admin/config/cleantalk/cleantalk_settings_form
  scoring:
    combine: all_pass
- id: cleantalk_cleantalk_read_stored_key
  version: '1.0'
  applicable_bundles:
  - cleantalk
  checks:
  - kind: must_contain_any
    values:
    - known1234evalkey
  scoring:
    combine: all_pass
- id: cleantalk_cleantalk_which_forms_on
  version: '1.0'
  applicable_bundles:
  - cleantalk
  checks:
  - kind: must_contain_any
    values:
    - forum
    - cleantalk_check_forum_topics
  scoring:
    combine: all_pass
- id: cleantalk_cleantalk_set_key_protect_comments
  version: '1.0'
  applicable_bundles:
  - cleantalk
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
- id: cleantalk_cleantalk_forum_not_search
  version: '1.0'
  applicable_bundles:
  - cleantalk
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
