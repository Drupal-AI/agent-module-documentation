metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: clamav
  version: 2.1.x
  note: ClamAV's runtime behavior needs a live ClamAV daemon and infected test files, which are not present,
    so all cases are `recipe` (response-graded), probing scan modes, config keys, the service/result constants,
    the scannable hook, the Drush command, permission, and admin route.
questions:
- id: clamav-scan-modes
  input: What are the three ways the Drupal ClamAV module can connect to the ClamAV scanner, and which
    config key selects between them?
  criteria: 'The `scan_mode` key in clamav.settings selects the backend: 0 = daemon over TCP/IP (default,
    DaemonTCPIP), 1 = local clamscan executable (Executable), 2 = daemon over a Unix socket (DaemonUnixSocket).'
  bundle: clamav
  rubric_ref: rubric/clamav_clamav_scan_modes@1.0
  tags:
  - mode:recipe
- id: clamav-daemon-defaults
  input: In the Drupal ClamAV module, what are the default hostname and port for the TCP/IP daemon scan
    mode, and which config keys hold them?
  criteria: Defaults are hostname `localhost` and port `3310`, stored in clamav.settings as `mode_daemon_tcpip.hostname`
    and `mode_daemon_tcpip.port`.
  bundle: clamav
  rubric_ref: rubric/clamav_clamav_daemon_defaults@1.0
  tags:
  - mode:recipe
- id: clamav-executable-mode
  input: I want the Drupal ClamAV module to use the local clamscan binary instead of a daemon. Which scan_mode
    value and which config keys do I set?
  criteria: Set scan_mode to 1 (Executable). Configure mode_executable.executable_path (default /usr/bin/clamscan)
    and optionally mode_executable.executable_parameters.
  bundle: clamav
  rubric_ref: rubric/clamav_clamav_executable_mode@1.0
  tags:
  - mode:recipe
- id: clamav-outage-action
  input: If the ClamAV service is unreachable when a user uploads a file to my Drupal site, how do I control
    whether the unscanned file is blocked or allowed?
  criteria: 'The `outage_action` key: 0 blocks unchecked files (default, fail-closed), 1 allows unchecked
    files through (fail-open).'
  bundle: clamav
  rubric_ref: rubric/clamav_clamav_outage_action@1.0
  tags:
  - mode:recipe
- id: clamav-config-object-route
  input: Which Drupal config object stores the ClamAV module's settings, and at what admin path / permission
    is its settings form?
  criteria: Config object clamav.settings; settings form at /admin/config/media/clamav (route clamav.admin_display),
    gated by the `administer clamav` permission.
  bundle: clamav
  rubric_ref: rubric/clamav_clamav_config_object_route@1.0
  tags:
  - mode:recipe
- id: clamav-scannable-hook
  input: In a custom Drupal module, which hook do I implement to stop ClamAV from scanning certain uploaded
    files (for example, images), and what should it return to exempt a file versus stay neutral?
  criteria: Implement hook_clamav_file_is_scannable(FileInterface $file); return Scanner::FILE_IS_NOT_SCANNABLE
    to exempt, Scanner::FILE_IS_SCANNABLE to force scanning, or Scanner::FILE_SCANNABLE_IGNORE to stay
    neutral.
  bundle: clamav
  rubric_ref: rubric/clamav_clamav_scannable_hook@1.0
  tags:
  - mode:recipe
- id: clamav-scan-service
  input: How do I scan a Drupal File entity for viruses from custom code with the ClamAV module, and what
    result constant means the file is infected?
  criteria: 'Call the `clamav` service: \Drupal::service(''clamav'')->scan($file). It returns Scanner::FILE_IS_CLEAN
    (0), Scanner::FILE_IS_INFECTED (1), or Scanner::FILE_IS_UNCHECKED (-1).'
  bundle: clamav
  rubric_ref: rubric/clamav_clamav_scan_service@1.0
  tags:
  - mode:recipe
- id: clamav-scan-existing-files
  input: On a Drupal site that already has many uploaded files, which Drush command from the ClamAV module
    scans all existing managed files, and how do I change its batch size?
  criteria: Run `drush clamav:scan-files` (alias cav-sf) to batch-scan all permanent managed files; use
    --batch-size=N to change the batch size (default 50).
  bundle: clamav
  rubric_ref: rubric/clamav_clamav_scan_existing_files@1.0
  tags:
  - mode:recipe
- id: clamav-scheme-scanning
  input: By default, which files does the Drupal ClamAV module scan with respect to stream-wrapper schemes,
    and how is that decided?
  criteria: By default local schemes (public/private/temporary) are scanned and remote schemes are not;
    Scanner::isSchemeScannable() computes local XOR overridden, where overridden_schemes inverts a scheme's
    default.
  bundle: clamav
  rubric_ref: rubric/clamav_clamav_scheme_scanning@1.0
  tags:
  - mode:recipe
