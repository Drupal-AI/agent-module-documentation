rubrics:
- id: clamav_clamav_scan_modes
  version: '1.0'
  applicable_bundles:
  - clamav
  checks:
  - kind: must_contain_any
    values:
    - scan_mode
    - TCP/IP
    - Unix socket
    - executable
  scoring:
    combine: all_pass
- id: clamav_clamav_daemon_defaults
  version: '1.0'
  applicable_bundles:
  - clamav
  checks:
  - kind: must_contain_any
    values:
    - mode_daemon_tcpip.hostname
    - mode_daemon_tcpip.port
    - '3310'
    - localhost
  scoring:
    combine: all_pass
- id: clamav_clamav_executable_mode
  version: '1.0'
  applicable_bundles:
  - clamav
  checks:
  - kind: must_contain_any
    values:
    - scan_mode
    - mode_executable.executable_path
    - clamscan
    - executable
  scoring:
    combine: all_pass
- id: clamav_clamav_outage_action
  version: '1.0'
  applicable_bundles:
  - clamav
  checks:
  - kind: must_contain_any
    values:
    - outage_action
    - block unchecked
    - allow unchecked
  scoring:
    combine: all_pass
- id: clamav_clamav_config_object_route
  version: '1.0'
  applicable_bundles:
  - clamav
  checks:
  - kind: must_contain_any
    values:
    - clamav.settings
    - /admin/config/media/clamav
    - administer clamav
  scoring:
    combine: all_pass
- id: clamav_clamav_scannable_hook
  version: '1.0'
  applicable_bundles:
  - clamav
  checks:
  - kind: must_contain_any
    values:
    - hook_clamav_file_is_scannable
    - FILE_IS_NOT_SCANNABLE
    - FILE_SCANNABLE_IGNORE
  scoring:
    combine: all_pass
- id: clamav_clamav_scan_service
  version: '1.0'
  applicable_bundles:
  - clamav
  checks:
  - kind: must_contain_any
    values:
    - \Drupal::service('clamav')
    - ->scan(
    - FILE_IS_INFECTED
  scoring:
    combine: all_pass
- id: clamav_clamav_scan_existing_files
  version: '1.0'
  applicable_bundles:
  - clamav
  checks:
  - kind: must_contain_any
    values:
    - clamav:scan-files
    - cav-sf
    - --batch-size
  scoring:
    combine: all_pass
- id: clamav_clamav_scheme_scanning
  version: '1.0'
  applicable_bundles:
  - clamav
  checks:
  - kind: must_contain_any
    values:
    - local
    - remote
    - overridden_schemes
    - isSchemeScannable
  scoring:
    combine: all_pass
