rubrics:
- id: cloudfront_purger_tags_cloudfront_purger_tags_purger_id
  version: '1.0'
  applicable_bundles:
  - cloudfront_purger_tags
  checks:
  - kind: must_contain_any
    values:
    - cloudfront_tags
    - tag
  scoring:
    combine: all_pass
- id: cloudfront_purger_tags_cloudfront_purger_tags_pipeline
  version: '1.0'
  applicable_bundles:
  - cloudfront_purger_tags
  checks:
  - kind: must_contain_any
    values:
    - filter
    - prioritize
    - hash
    - xxHash3
    - xxh3
    - '6'
  scoring:
    combine: all_pass
- id: cloudfront_purger_tags_cloudfront_purger_tags_distribution_config
  version: '1.0'
  applicable_bundles:
  - cloudfront_purger_tags
  checks:
  - kind: must_contain_any
    values:
    - CacheTagConfig
    - HeaderName
    - cache_tag_header_name
    - '50'
  scoring:
    combine: all_pass
- id: cloudfront_purger_tags_cloudfront_purger_tags_known_header_name
  version: '1.0'
  applicable_bundles:
  - cloudfront_purger_tags
  checks:
  - kind: must_contain_any
    values:
    - X-CF-Cache-Tags
  scoring:
    combine: all_pass
- id: cloudfront_purger_tags_cloudfront_purger_tags_add_tags_purger
  version: '1.0'
  applicable_bundles:
  - cloudfront_purger_tags
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
