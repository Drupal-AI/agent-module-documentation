metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: sdc_tags
  version: 3.0.x
  note: sdc_tags (submodule of cl_editorial) defines the component_tag plugin type (YAML discovery of
    MODULE.component_tags.yml, manager plugin.manager.sdc_tags.component_tag, alter hook component_tag_info,
    default class ComponentTagDefault). Tagging rules live in the sdc_tags.settings config object under
    component_tags.<tag_id> = {tag_id, statuses[], allowed[], forbidden[]}; the admin UI is /admin/config/user-interface/sdc/component-tagging
    (+ /auto/{tag}). No configure info.yml key, no permissions of its own, no Drush. Medium cases write
    a known rule to sdc_tags.settings and read it back; hard cases require the agent to write a real tagging
    rule (allow-list vs forbid) verified against that config. All tag keys are namespaced sdct_* and only
    that key is touched.
questions:
- id: sdc_tags-define-tag
  input: Using the sdc_tags module, how do I declare a new component tag called 'hero' so that Single
    Directory Components can be tagged with it? Which file and what shape?
  criteria: 'Add a MODULE.component_tags.yml (or THEME.component_tags.yml) file with a top-level key per
    tag, e.g. `hero:\n  label: ''Hero components''\n  description: ''...''`. The ComponentTagPluginManager
    discovers it as a component_tag plugin; rebuild caches and it appears on the tagging admin page.'
  bundle: sdc_tags
  rubric_ref: rubric/sdc_tags_sdc_tags_define_tag@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: sdc_tags-config-object
  input: Where does sdc_tags store the tagging rules (allowed/forbidden components and statuses) for each
    tag, and what is the config structure?
  criteria: In the sdc_tags.settings config object under component_tags.<tag_id> = {tag_id, statuses[],
    allowed[], forbidden[]}. You can also fetch a tag's resolved rule with sdc_tags_get_tag_filters($tag_name).
  bundle: sdc_tags
  rubric_ref: rubric/sdc_tags_sdc_tags_config_object@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: sdc_tags-plugin-type
  input: What plugin type does sdc_tags define, and which service is its plugin manager?
  criteria: It defines the component_tag plugin type. The manager is the plugin.manager.sdc_tags.component_tag
    service (Drupal\sdc_tags\ComponentTagPluginManager), using YAML discovery of *.component_tags.yml,
    default class ComponentTagDefault, alter hook component_tag_info.
  bundle: sdc_tags
  rubric_ref: rubric/sdc_tags_sdc_tags_plugin_type@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: sdc_tags-configured-tag
  input: On this site, sdc_tags has a tagging rule configured for a tag named 'sdct_known'. Inspect the
    live sdc_tags configuration and name the specific SDC component that this tag explicitly allow-lists.
  criteria: cl_editorial:component-card. In sdc_tags.settings, component_tags.sdct_known.allowed contains
    'cl_editorial:component-card'.
  bundle: sdc_tags
  rubric_ref: rubric/sdc_tags_sdc_tags_configured_tag@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/sdc_tags-configured-tag-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/sdc_tags-configured-tag-cleanup.sh
- id: sdc_tags-tag-statuses
  input: The sdc_tags tag 'sdct_status' on this site restricts which component lifecycle statuses are
    permitted. Inspect the live configuration and state which status(es) it allows.
  criteria: Only 'stable'. In sdc_tags.settings, component_tags.sdct_status.statuses is ['stable'].
  bundle: sdc_tags
  rubric_ref: rubric/sdc_tags_sdc_tags_tag_statuses@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/sdc_tags-tag-statuses-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/sdc_tags-tag-statuses-cleanup.sh
- id: sdc_tags-create-rule
  input: Using the sdc_tags module on this site, configure a tagging rule for the tag 'sdct_task' that
    allow-lists only the cl_editorial:component-card component and permits the 'stable' status. Apply
    the change to the live site.
  criteria: 'Set sdc_tags.settings component_tags.sdct_task to {tag_id: sdct_task, statuses: [''stable''],
    allowed: [''cl_editorial:component-card''], forbidden: []} and save (e.g. via configFactory()->getEditable(''sdc_tags.settings'')->set(''component_tags.sdct_task'',
    [...])->save()).'
  bundle: sdc_tags
  rubric_ref: rubric/sdc_tags_sdc_tags_create_rule@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/sdc_tags-create-rule-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/sdc_tags-create-rule-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/sdc_tags-create-rule-verify.sh
- id: sdc_tags-forbid-rule
  input: Configure the sdc_tags tag 'sdct_forbid' so that it applies to all stable components EXCEPT cl_editorial:component-card
    (i.e. use the forbidden list, keep the allow-list empty, permit the stable status). Apply the change
    to the live site.
  criteria: 'Set sdc_tags.settings component_tags.sdct_forbid to {tag_id: sdct_forbid, statuses: [''stable''],
    allowed: [], forbidden: [''cl_editorial:component-card'']} and save. Empty allowed + a forbidden entry
    means ''all stable components except the forbidden ones''.'
  bundle: sdc_tags
  rubric_ref: rubric/sdc_tags_sdc_tags_forbid_rule@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/sdc_tags-forbid-rule-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/sdc_tags-forbid-rule-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/sdc_tags-forbid-rule-verify.sh
