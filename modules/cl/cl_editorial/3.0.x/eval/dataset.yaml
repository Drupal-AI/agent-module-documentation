metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: cl_editorial
  version: 3.0.x
  note: 'cl_editorial is a developer toolkit for low-code SDC UIs: no configure route, no config entities,
    no permissions, no Drush, no plugin types of its own. Its API surface is the cl_component_selector
    Form API element, the NoThemeComponentManager service (decorates plugin.manager.sdc; getFilteredComponents(allowed,
    forbidden, statuses)), the cl_editorial_component_mappings_form() helper (props+slots), the ComponentFiltersFormTrait,
    and Util::isPropOrSlot(). It bundles a demo SDC ''cl_editorial:component-card'' (metadata name ''Component
    Card'', status stable) and the sdc_tags submodule. Because there is no config, medium cases introspect
    the live SDC/component registry via the module''s own service, and hard cases require the agent to
    actually call NoThemeComponentManager and write the result to a namespaced file that verify checks.'
questions:
- id: cl_editorial-selector-element
  input: I'm building a Drupal form and want to let the user pick a Single Directory Component using the
    cl_editorial module. What Form API element type does cl_editorial provide for that, and roughly what
    value does it submit?
  criteria: Use '#type' => 'cl_component_selector' (the ComponentSelectorElement). It renders a searchable
    radio list of SDC components and submits an array whose 'machine_name' key holds the chosen component's
    plugin id. You can constrain it with '#filters' (allowed, forbidden, statuses).
  bundle: cl_editorial
  rubric_ref: rubric/cl_editorial_cl_editorial_selector_element@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: cl_editorial-notheme-manager
  input: Which cl_editorial service lists Single Directory Components independent of the active theme,
    and what method do I call to get components filtered by allow/forbid lists and lifecycle status?
  criteria: The Drupal\cl_editorial\NoThemeComponentManager service (it decorates plugin.manager.sdc).
    Call getFilteredComponents($allowed, $forbidden, $statuses) which returns [plugin_id => Component]
    for the matching components.
  bundle: cl_editorial
  rubric_ref: rubric/cl_editorial_cl_editorial_notheme_manager@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: cl_editorial-mappings-form
  input: With cl_editorial, how do I generate an editor form for a chosen SDC component's props and slots?
  criteria: Call cl_editorial_component_mappings_form($component_id, $current_input, $form, $form_state,
    $supported_token_types). It builds form fields for the component's props from its JSON schema (via
    the cl_editorial.form_generator / SchemaForms service) and adds a text_format element per slot, plus
    a token tree when the Token module is present.
  bundle: cl_editorial
  rubric_ref: rubric/cl_editorial_cl_editorial_mappings_form@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: cl_editorial-bundled-component
  input: 'Inspect this running Drupal site: cl_editorial ships one demo Single Directory Component. What
    is that component''s SDC plugin id?'
  criteria: cl_editorial:component-card (provider cl_editorial, machine name component-card). It is discoverable
    through the SDC component manager / cl_editorial's NoThemeComponentManager.
  bundle: cl_editorial
  rubric_ref: rubric/cl_editorial_cl_editorial_bundled_component@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/cl_editorial-bundled-component-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/cl_editorial-bundled-component-cleanup.sh
- id: cl_editorial-component-status
  input: Using cl_editorial's theme-independent component manager on this site, what lifecycle status
    (stable, experimental, deprecated, or obsolete) is reported for the bundled cl_editorial:component-card
    component?
  criteria: stable. NoThemeComponentManager::getFilteredComponents([], [], ['stable']) includes cl_editorial:component-card,
    and the component metadata status is 'stable'.
  bundle: cl_editorial
  rubric_ref: rubric/cl_editorial_cl_editorial_component_status@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/cl_editorial-component-status-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/cl_editorial-component-status-cleanup.sh
- id: cl_editorial-list-stable
  input: On this server, use cl_editorial's component manager (the service that lists Single Directory
    Components regardless of the active theme) to collect the SDC plugin ids of every component whose
    lifecycle status is 'stable', and write them one per line to the file /tmp/cl_editorial_stable_ids.txt.
  criteria: Call \Drupal::service(Drupal\cl_editorial\NoThemeComponentManager::class)->getFilteredComponents([],
    [], ['stable']), take array_keys(), and write them to /tmp/cl_editorial_stable_ids.txt. The file must
    include the line cl_editorial:component-card.
  bundle: cl_editorial
  rubric_ref: rubric/cl_editorial_cl_editorial_list_stable@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/cl_editorial-list-stable-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/cl_editorial-list-stable-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/cl_editorial-list-stable-verify.sh
- id: cl_editorial-card-name
  input: The cl_editorial module bundles one demo Single Directory Component. Look that component up through
    cl_editorial's component manager and write its human-readable component name to the file /tmp/cl_editorial_card_name.txt
    on the server.
  criteria: Load cl_editorial:component-card via the component manager (e.g. NoThemeComponentManager::createInstanceAndCatch('cl_editorial:component-card')
    or find()) and write $component->metadata->name — 'Component Card' — to /tmp/cl_editorial_card_name.txt.
  bundle: cl_editorial
  rubric_ref: rubric/cl_editorial_cl_editorial_card_name@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/cl_editorial-card-name-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/cl_editorial-card-name-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/cl_editorial-card-name-verify.sh
