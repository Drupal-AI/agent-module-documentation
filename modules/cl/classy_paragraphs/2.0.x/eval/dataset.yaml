metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: classy_paragraphs
  version: 2.0.x
  note: 'Classy Paragraphs has no custom field type: editors select CSS-class ''styles'' (classy_paragraphs_style
    config entities) via a core entity_reference field whose target_type is classy_paragraphs_style; hook_entity_view_alter
    merges the classes into #attributes[''class'']. Hard cases carry persona variants (-layman / -expert)
    sharing one verify.'
questions:
- id: classy_paragraphs-style-entity-type
  input: In the Classy Paragraphs module, editors pick from reusable named sets of CSS classes called
    'styles'. What is the machine name of the configuration entity type that stores each style? Answer
    with the entity type id only.
  criteria: The config entity type id is `classy_paragraphs_style` (config prefix classy_paragraphs.classy_paragraphs_style.*).
  bundle: classy_paragraphs
  rubric_ref: rubric/classy_paragraphs_classy_paragraphs_style_entity_type@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: classy_paragraphs-field-type
  input: To let editors apply a Classy Paragraphs style to a Paragraph type, what kind of field do you
    add and what must its target entity type be set to? Name the core field type and the target_type value.
  criteria: A core `entity_reference` field whose storage setting target_type is `classy_paragraphs_style`.
    The module adds no custom field type of its own.
  bundle: classy_paragraphs
  rubric_ref: rubric/classy_paragraphs_classy_paragraphs_field_type@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: classy_paragraphs-attributes-class
  input: In Classy Paragraphs, how do the selected CSS classes reach the rendered markup of a paragraph?
    Name the render-array attribute (and the Twig variable) they are merged into.
  criteria: classy_paragraphs_entity_view_alter() merges the style's classes into $build['#attributes']['class'],
    which surfaces as the {{ attributes.class }} / {{ attributes.addClass(classes) }} Twig variable.
  bundle: classy_paragraphs
  rubric_ref: rubric/classy_paragraphs_classy_paragraphs_attributes_class@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: classy_paragraphs-style-introspect
  input: This Drupal site already has a Classy Paragraphs style configured (a classy_paragraphs_style
    config entity). Inspect the running site with drush and tell me the exact CSS classes it contains.
  criteria: The classy_paragraphs_style entity `eval_card` (label 'Eval Card') stores the classes card,
    shadow-lg and rounded (one per line). Read from the live config entity.
  bundle: classy_paragraphs
  rubric_ref: rubric/classy_paragraphs_classy_paragraphs_style_introspect@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    persona: drupal-expert
    setup: agent-module-documentation/evaluation/verify/classy_paragraphs-style-introspect-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/classy_paragraphs-style-introspect-cleanup.sh
- id: classy_paragraphs-field-introspect
  input: This Drupal site has a field on the Article content type that lets editors pick Classy Paragraphs
    styles. Inspect the running site (drush available) and tell me the field's machine name and the target
    entity type its entity-reference storage points to.
  criteria: Field `field_eval_cp_style` on node.article is a core entity_reference field whose target_type
    is classy_paragraphs_style. Read from field.storage.node.field_eval_cp_style on the live site.
  bundle: classy_paragraphs
  rubric_ref: rubric/classy_paragraphs_classy_paragraphs_field_introspect@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    persona: drupal-expert
    setup: agent-module-documentation/evaluation/verify/classy_paragraphs-field-introspect-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/classy_paragraphs-field-introspect-cleanup.sh
- id: classy_paragraphs-create-style-expert
  input: On this Drupal site (DDEV, drush available), create a Classy Paragraphs style config entity labelled
    'Callout' whose CSS classes are `text-center` and `lead` (one class per line). Apply it to the running
    site via drush/config — do not just describe it. Give a one-line summary of what you changed.
  criteria: An enabled classy_paragraphs_style config entity exists whose classes include both text-center
    and lead. Verified against live site state.
  bundle: classy_paragraphs
  rubric_ref: rubric/classy_paragraphs_classy_paragraphs_create_style_expert@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/classy_paragraphs-create-style-reset.sh
    verify: agent-module-documentation/evaluation/verify/classy_paragraphs-create-style-verify.sh
- id: classy_paragraphs-create-style-layman
  input: On my website I use the Classy Paragraphs styling picker. I want a new reusable option called
    'Callout' that, when an editor chooses it, centers the text and makes it stand out as a large intro
    line. Please set that option up on the site so editors can pick it, using the CSS classes text-center
    and lead. Tell me in one line what you did.
  criteria: 'Same end state as the expert variant: a classy_paragraphs_style entity with classes text-center
    and lead. The agent must map the plain-English request onto a classy_paragraphs_style config entity.'
  bundle: classy_paragraphs
  rubric_ref: rubric/classy_paragraphs_classy_paragraphs_create_style_layman@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: layman
    reset: agent-module-documentation/evaluation/verify/classy_paragraphs-create-style-reset.sh
    verify: agent-module-documentation/evaluation/verify/classy_paragraphs-create-style-verify.sh
- id: classy_paragraphs-add-field
  input: 'On this Drupal site (drush available), make it possible to apply Classy Paragraphs styles to
    Article nodes: add an entity-reference field to the Article content type whose target entity type
    is classy_paragraphs_style. Apply it to the running site with drush/config — do not just describe
    it. State in one line what you changed.'
  criteria: The node.article bundle has an entity_reference field whose storage target_type is classy_paragraphs_style.
    Verified against live site state.
  bundle: classy_paragraphs
  rubric_ref: rubric/classy_paragraphs_classy_paragraphs_add_field@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/classy_paragraphs-add-field-reset.sh
    verify: agent-module-documentation/evaluation/verify/classy_paragraphs-add-field-verify.sh
