    verify: agent-module-documentation/evaluation/verify/cloudflare-set-keyauth-verify.sh
- id: cloudflare-set-iprestore
  input: On this Drupal site, turn on the cloudflare module's client IP restoration so Drupal sees visitors'
    real IP addresses, and set the bypass host to origin.example.com. Apply the change to the live site's
    cloudflare.settings.
  criteria: 'cloudflare.settings has client_ip_restore_enabled: true and bypass_host: origin.example.com.'
  bundle: cloudflare
  rubric_ref: rubric/cloudflare_cloudflare_set_iprestore@1.0
  tags:
  - mode:execution
