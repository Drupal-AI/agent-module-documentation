# Generated from evals.json by evaluation/to_commons.py.
# Edit evals.json and rerun the script; do not edit this file.
metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: cloudflare
  version: 2.0.x
  note: 'Cloudflare integrates Drupal with the Cloudflare CDN. Config object cloudflare.settings: auth_using
    (''token'' -> api_token, Authorization: Bearer; or ''key'' -> apikey + email, X-Auth-Key/X-Auth-Email),
    zones, valid_credentials, client_ip_restore_enabled, remote_addr_validate, bypass_host. Config UI
    is a CTools wizard at /admin/config/services/cloudflare (route cloudflare.admin_settings_form, permission
    ''administer cloudflare''). Services: cloudflare.api_client (CloudflareApiClient), cloudflare.state
    (State), http_middleware.cloudflare (CloudFlareMiddleware, restores the visitor IP from CF-Connecting-IP/CF-Visitor).
    Purging is in the cloudflarepurger submodule. Requires ctools. Evals are grounded ONLY in local config
    (no external Cloudflare API calls): reset/cleanup restore the shipped cloudflare.settings defaults
    explicitly (client_ip_restore_enabled false, remote_addr_validate true, bypass_host '''', valid_credentials
    false, zones {}, auth_using token, api_token '''', apikey '''', email '''').'
questions:
- id: cloudflare-auth-methods
  input: What authentication methods does the Drupal cloudflare module support for the Cloudflare API,
    which config keys hold the credentials, and where do I configure them?
  criteria: 'Two methods, selected by auth_using: ''token'' uses api_token (sent as Authorization: Bearer)
    and ''key'' uses apikey + email (sent as X-Auth-Key / X-Auth-Email). Configure them in the wizard
    at /admin/config/services/cloudflare (route cloudflare.admin_settings_form, permission ''administer
    cloudflare''), stored in cloudflare.settings.'
  bundle: cloudflare
  rubric_ref: rubric/cloudflare_cloudflare_auth_methods@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: cloudflare-client-ip
  input: How does the cloudflare module make Drupal see a visitor's real IP address instead of Cloudflare's,
    and which config keys control that behavior?
  criteria: An HTTP middleware (http_middleware.cloudflare / CloudFlareMiddleware) reads Cloudflare's
    CF-Connecting-IP / CF-Visitor headers and rewrites the request client IP when client_ip_restore_enabled
    is true. remote_addr_validate makes it verify the incoming IP is a real Cloudflare edge IP, and bypass_host
    names an origin host allowed to bypass Cloudflare.
  bundle: cloudflare
  rubric_ref: rubric/cloudflare_cloudflare_client_ip@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: cloudflare-purging-location
  input: Does the base cloudflare module clear the Cloudflare CDN cache itself? If not, what do I need
    to enable to purge the Cloudflare cache from Drupal?
  criteria: No; the base module handles API auth and client-IP restoration. Cache purging (by tag, URL,
    or everything) is provided by the cloudflarepurger submodule, which requires the Purge module.
  bundle: cloudflare
  rubric_ref: rubric/cloudflare_cloudflare_purging_location@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: cloudflare-known-auth
  input: On this Drupal site, inspect the live cloudflare configuration and tell me which authentication
    method (token or key) is configured, and the email address it is set to use.
  criteria: 'cloudflare.settings has auth_using: key (API key + email authentication) with email cf-admin@example.com.'
  bundle: cloudflare
  rubric_ref: rubric/cloudflare_cloudflare_known_auth@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/cloudflare-known-auth-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/cloudflare-known-auth-cleanup.sh
- id: cloudflare-known-ipbypass
  input: 'Inspect this site''s live cloudflare configuration: is client IP restoration enabled, and which
    host (if any) is configured to bypass Cloudflare?'
  criteria: client_ip_restore_enabled is true and bypass_host is backend.internal.example in cloudflare.settings.
  bundle: cloudflare
  rubric_ref: rubric/cloudflare_cloudflare_known_ipbypass@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/cloudflare-known-ipbypass-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/cloudflare-known-ipbypass-cleanup.sh
- id: cloudflare-set-keyauth
  input: 'On this Drupal site, configure the cloudflare module to authenticate against the Cloudflare
    API using the legacy API key method: set the authentication method to key, the API key to ABC123KEY,
    and the account email to api-admin@example.com. Apply the change to the live site''s cloudflare.settings.'
  criteria: 'cloudflare.settings has auth_using: key, apikey: ABC123KEY, and email: api-admin@example.com
    (set via the settings wizard or the config factory).'
  bundle: cloudflare
  rubric_ref: rubric/cloudflare_cloudflare_set_keyauth@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/cloudflare-set-keyauth-reset.sh
