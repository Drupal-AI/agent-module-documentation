metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: cloudflarepurger
  version: 2.0.x
  note: 'Cloudflare Purger is a submodule of cloudflare that clears the Cloudflare CDN cache via the Purge
    module. It provides a Purge purger plugin @PurgePurger(id=''cloudflare'', types={tag,url,everything})
    (class CloudFlarePurger, manager plugin.manager.purge.purgers). An event subscriber CloudFlareCacheTagHeaderGenerator
    (service cloudflarepurger.cache_tags.surrogate_key_generator) rewrites Drupal cache tags into a Cloudflare
    Cache-Tag header, hashing them, respecting the byte limit param cloudflarepurger.cache_tag_header_limit
    (255) and the config cloudflarepurger.settings.cache_tag_excludelist (sequence of tag prefixes). Three
    Purge diagnostic checks: cloudflare_creds, cloudflare_api_rate_limit_check, cloudflare_daily_limit_check.
    Settings form /admin/config/services/cloudflare/purger (permission ''administer cloudflare''). Requires
    cloudflare + purge. Evals grounded ONLY in local config/plugin state (no external Cloudflare API):
    config default is cache_tag_excludelist {} (empty); reset/cleanup restore that.'
questions:
- id: cloudflarepurger-purger-plugin
  input: The cloudflarepurger submodule provides a Purge purger. What is the purger plugin's id, and which
    invalidation types does it support?
  criteria: It provides a Purge purger plugin with id 'cloudflare' (class CloudFlarePurger) supporting
    the invalidation types tag, url, and everything.
  bundle: cloudflarepurger
  rubric_ref: rubric/cloudflarepurger_cloudflarepurger_purger_plugin@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: cloudflarepurger-cache-tag-header
  input: How does cloudflarepurger make Drupal's cache tags work with Cloudflare's Cache-Tag header, and
    how can I stop certain cache tags from being included?
  criteria: An event subscriber (CloudFlareCacheTagHeaderGenerator) rewrites Drupal's cache tags into
    a Cloudflare Cache-Tag response header, hashing them and honoring a byte limit (255). Add tag prefixes
    to cloudflarepurger.settings.cache_tag_excludelist to exclude them from the header/purge.
  bundle: cloudflarepurger
  rubric_ref: rubric/cloudflarepurger_cloudflarepurger_cache_tag_header@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: cloudflarepurger-diagnostics
  input: What Purge diagnostic checks does cloudflarepurger add to report Cloudflare purge readiness?
  criteria: 'Three checks: cloudflare_creds (credentials valid), cloudflare_api_rate_limit_check (API
    rate-limit usage), and cloudflare_daily_limit_check (daily tag-purge count). They appear on the Purge
    status page.'
  bundle: cloudflarepurger
  rubric_ref: rubric/cloudflarepurger_cloudflarepurger_diagnostics@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: cloudflarepurger-purger-id
  input: On this Drupal site, inspect the registered Purge purger plugins and give the id of the purger
    that the cloudflarepurger module provides, along with the invalidation types it supports.
  criteria: The cloudflarepurger module provides the Purge purger plugin 'cloudflare' (provider cloudflarepurger),
    supporting types tag, url and everything.
  bundle: cloudflarepurger
  rubric_ref: rubric/cloudflarepurger_cloudflarepurger_purger_id@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/cloudflarepurger-purger-id-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/cloudflarepurger-purger-id-cleanup.sh
- id: cloudflarepurger-known-excludelist
  input: This site has configured cloudflarepurger to keep some cache-tag prefixes out of the Cloudflare
    Cache-Tag header. Inspect the live configuration and list the excluded tag prefixes.
  criteria: cloudflarepurger.settings.cache_tag_excludelist contains the prefixes 'config:' and 'user:'.
  bundle: cloudflarepurger
  rubric_ref: rubric/cloudflarepurger_cloudflarepurger_known_excludelist@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/cloudflarepurger-known-excludelist-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/cloudflarepurger-known-excludelist-cleanup.sh
- id: cloudflarepurger-set-excludelist
  input: On this Drupal site, configure cloudflarepurger so that cache tags starting with 'user:' are
    excluded from the Cloudflare Cache-Tag header (added to the cache tag exclude-list). Apply the change
    to the live cloudflarepurger.settings.
  criteria: cloudflarepurger.settings.cache_tag_excludelist includes the 'user:' prefix (set via the purger
    settings form or the config factory).
  bundle: cloudflarepurger
  rubric_ref: rubric/cloudflarepurger_cloudflarepurger_set_excludelist@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/cloudflarepurger-set-excludelist-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/cloudflarepurger-set-excludelist-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/cloudflarepurger-set-excludelist-verify.sh
- id: cloudflarepurger-enable
  input: On this Drupal site, make the Cloudflare purger available to the Purge module (so Drupal can
    clear the Cloudflare CDN cache by tag, URL or everything) by enabling the appropriate submodule. Apply
    it to the live site.
  criteria: The cloudflarepurger module is enabled (e.g. drush en cloudflarepurger), so the Purge purger
    plugin 'cloudflare' (types tag/url/everything) is registered in plugin.manager.purge.purgers.
  bundle: cloudflarepurger
  rubric_ref: rubric/cloudflarepurger_cloudflarepurger_enable@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/cloudflarepurger-enable-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/cloudflarepurger-enable-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/cloudflarepurger-enable-verify.sh
