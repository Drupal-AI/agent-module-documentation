rubrics:
- id: cloudflarepurger_cloudflarepurger_purger_plugin
  version: '1.0'
  applicable_bundles:
  - cloudflarepurger
  checks:
  - kind: must_contain_any
    values:
    - cloudflare
    - tag
    - url
    - everything
  scoring:
    combine: all_pass
- id: cloudflarepurger_cloudflarepurger_cache_tag_header
  version: '1.0'
  applicable_bundles:
  - cloudflarepurger
  checks:
  - kind: must_contain_any
    values:
    - cache_tag_excludelist
    - Cache-Tag
    - hash
    - surrogate
  scoring:
    combine: all_pass
- id: cloudflarepurger_cloudflarepurger_diagnostics
  version: '1.0'
  applicable_bundles:
  - cloudflarepurger
  checks:
  - kind: must_contain_any
    values:
    - cloudflare_creds
    - cloudflare_api_rate_limit_check
    - cloudflare_daily_limit_check
    - credential
    - rate limit
    - daily
  scoring:
    combine: all_pass
- id: cloudflarepurger_cloudflarepurger_purger_id
  version: '1.0'
  applicable_bundles:
  - cloudflarepurger
  checks:
  - kind: must_contain_any
    values:
    - cloudflare
  scoring:
    combine: all_pass
- id: cloudflarepurger_cloudflarepurger_known_excludelist
  version: '1.0'
  applicable_bundles:
  - cloudflarepurger
  checks:
  - kind: must_contain_any
    values:
    - 'config:'
    - 'user:'
  scoring:
    combine: all_pass
- id: cloudflarepurger_cloudflarepurger_set_excludelist
  version: '1.0'
  applicable_bundles:
  - cloudflarepurger
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
- id: cloudflarepurger_cloudflarepurger_enable
  version: '1.0'
  applicable_bundles:
  - cloudflarepurger
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
