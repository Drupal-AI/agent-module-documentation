metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: clipboardjs
  version: 2.1.x
  note: Clipboard.js integrates the external clipboard.js JS library. It provides four field formatters
    (clipboard_button, clipboard_snippet, clipboard_textfield, clipboard_textarea) for string/email/link/integer/decimal/float/slug/slug_path
    fields, each with settings label (default 'Click to copy'), alert_style (tooltip|alert|none, default
    tooltip) and alert_text (default 'Copied!'); and four theme hooks (clipboardjs_button/snippet/textarea/textfield).
    No config page, permission, or Drush. The external clipboard.js library must be at DRUPAL_ROOT/libraries/clipboard/dist/clipboard.js.
    Medium cases seed a string field with a known clipboard formatter/alert_style and read the display
    config back via drush; hard cases switch a field's formatter to a clipboard one and change the formatter
    label, verified against the live entity_view_display.
questions:
- id: clipboardjs-formatters
  input: Using the Drupal clipboardjs module, how do I add a 'copy to clipboard' button to a text field's
    output, and what are the formatter machine names it provides?
  criteria: 'On the entity bundle''s Manage display page choose one of the Clipboard.js formatters: clipboard_button,
    clipboard_snippet, clipboard_textfield, or clipboard_textarea. They apply to string, email, link,
    integer, decimal, float, slug and slug_path fields.'
  bundle: clipboardjs
  rubric_ref: rubric/clipboardjs_clipboardjs_formatters@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: clipboardjs-settings
  input: What settings does a clipboardjs field formatter expose, and what are the options for the confirmation/alert
    style?
  criteria: Each formatter has label (button/hovertip text, default 'Click to copy'), alert_style (one
    of tooltip, alert, none; default tooltip) and alert_text (confirmation, default 'Copied!').
  bundle: clipboardjs
  rubric_ref: rubric/clipboardjs_clipboardjs_settings@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: clipboardjs-theme-and-lib
  input: How can custom code render a clipboardjs copy control in a render array or form, and what external
    dependency must be installed for clipboardjs to work?
  criteria: 'Use one of the theme hooks (#theme => ''clipboardjs_button'' | ''clipboardjs_snippet'' |
    ''clipboardjs_textarea'' | ''clipboardjs_textfield'') with #value/#label/#alert_style/#alert_text.
    The external clipboard.js library (v2.0.11) must be placed at DRUPAL_ROOT/libraries/clipboard/dist/clipboard.js.'
  bundle: clipboardjs
  rubric_ref: rubric/clipboardjs_clipboardjs_theme_and_lib@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: clipboardjs-which-formatter
  input: On this Drupal site, the Article content type has a field field_cjs_known that shows a copy-to-clipboard
    control. Inspect the live display configuration and tell me which clipboardjs formatter it uses and
    its alert style.
  criteria: 'field_cjs_known uses the clipboard_button formatter with alert_style ''alert'': core.entity_view_display.node.article.default
    content.field_cjs_known.type = clipboard_button, settings.alert_style = alert. Discoverable via drush
    cget core.entity_view_display.node.article.default content.field_cjs_known.'
  bundle: clipboardjs
  rubric_ref: rubric/clipboardjs_clipboardjs_which_formatter@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/clipboardjs-formatter-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/clipboardjs-formatter-cleanup.sh
- id: clipboardjs-alert-none
