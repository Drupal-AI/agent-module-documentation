rubrics:
- id: clipboardjs_clipboardjs_formatters
  version: '1.0'
  applicable_bundles:
  - clipboardjs
  checks:
  - kind: must_contain_any
    values:
    - clipboard_button
    - clipboard_snippet
    - clipboard_textfield
    - clipboard_textarea
    - Manage display
  scoring:
    combine: all_pass
- id: clipboardjs_clipboardjs_settings
  version: '1.0'
  applicable_bundles:
  - clipboardjs
  checks:
  - kind: must_contain_any
    values:
    - alert_style
    - tooltip
    - alert_text
    - label
  scoring:
    combine: all_pass
- id: clipboardjs_clipboardjs_theme_and_lib
  version: '1.0'
  applicable_bundles:
  - clipboardjs
  checks:
  - kind: must_contain_any
    values:
    - clipboardjs_button
    - '#theme'
    - libraries/clipboard
    - clipboard.js
  scoring:
    combine: all_pass
- id: clipboardjs_clipboardjs_which_formatter
  version: '1.0'
  applicable_bundles:
  - clipboardjs
  checks:
  - kind: must_contain_any
    values:
    - clipboard_button
  scoring:
    combine: all_pass
- id: clipboardjs_clipboardjs_alert_none
  version: '1.0'
  applicable_bundles:
  - clipboardjs
  checks:
  - kind: must_contain_any
    values:
    - none
  scoring:
    combine: all_pass
- id: clipboardjs_clipboardjs_apply_formatter
  version: '1.0'
  applicable_bundles:
  - clipboardjs
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
- id: clipboardjs_clipboardjs_change_label
  version: '1.0'
  applicable_bundles:
  - clipboardjs
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
