rubrics:
- id: clientside_validation_cv_engine_submodule
  version: '1.0'
  applicable_bundles:
  - clientside_validation
  checks:
  - kind: must_contain_any
    values:
    - clientside_validation_jquery
  scoring:
    combine: all_pass
- id: clientside_validation_cv_how_attributes_map
  version: '1.0'
  applicable_bundles:
  - clientside_validation
  checks:
  - kind: must_contain_any
    values:
    - data-rule-
    - data-msg-
  scoring:
    combine: all_pass
- id: clientside_validation_cv_plugin_type
  version: '1.0'
  applicable_bundles:
  - clientside_validation
  checks:
  - kind: must_contain_any
    values:
    - CvValidator
    - Plugin/CvValidator
  scoring:
    combine: all_pass
- id: clientside_validation_cv_skip_form
  version: '1.0'
  applicable_bundles:
  - clientside_validation
  checks:
  - kind: must_contain_any
    values:
    - hook_clientside_validation_should_validate
    - clientside_validation_should_validate
  scoring:
    combine: all_pass
- id: clientside_validation_cv_core_validators
  version: '1.0'
  applicable_bundles:
  - clientside_validation
  checks:
  - kind: must_contain_any
    values:
    - required
    - email
    - maxlength
  scoring:
    combine: all_pass
- id: clientside_validation_cv_custom_message
  version: '1.0'
  applicable_bundles:
  - clientside_validation
  checks:
  - kind: must_contain_any
    values:
    - '#required_error'
    - '#pattern_error'
  scoring:
    combine: all_pass
- id: clientside_validation_cv_cancel_buttons
  version: '1.0'
  applicable_bundles:
  - clientside_validation
  checks:
  - kind: must_contain_any
    values:
    - cancel
    - limit_validation_errors
  scoring:
    combine: all_pass
