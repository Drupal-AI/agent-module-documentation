metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: clientside_validation
  version: 4.1.x
  note: Clientside Validation is a form-alter that decorates elements with data-rule-*/data-msg-* attributes
    and defines the CvValidator plugin type; the jQuery submodule supplies the actual engine. Cases are
    `recipe` (response-graded) probing documented facts an agent would otherwise read source to answer;
    no site mutation.
questions:
- id: cv-engine-submodule
  input: I enabled the clientside_validation module but forms are not being validated in the browser before
    submit. What else must I enable for validation to actually run?
  criteria: The base module only writes data-rule-*/data-msg- attributes; enable the clientside_validation_jquery
    submodule, which loads the jQuery Validate engine that enforces them.
  bundle: clientside_validation
  rubric_ref: rubric/clientside_validation_cv_engine_submodule@1.0
  tags:
  - mode:recipe
- id: cv-how-attributes-map
  input: 'On a Drupal form element with #required or a #pattern, how does clientside_validation turn Drupal
    validation into a client-side rule? What HTML attributes end up on the element?'
  criteria: 'A CvValidator plugin''s getRules() output is written by CvValidatorBase::addValidation()
    as data-rule-<name> and data-msg-<name> attributes (translated messages) on the element, matched to
    the element #type or attribute.'
  bundle: clientside_validation
  rubric_ref: rubric/clientside_validation_cv_how_attributes_map@1.0
  tags:
  - mode:recipe
- id: cv-plugin-type
  input: I want to add a brand-new client-side validation rule from my own Drupal module. Which plugin
    type do I implement and where does the class go?
  criteria: Implement a CvValidator annotated plugin in src/Plugin/CvValidator/, extending CvValidatorBase,
    with a supports (types/attributes) definition; discovered by plugin.manager.clientside_validation.validators.
  bundle: clientside_validation
  rubric_ref: rubric/clientside_validation_cv_plugin_type@1.0
  tags:
  - mode:recipe
- id: cv-skip-form
  input: How do I stop clientside_validation from adding client-side validation to one particular form
    or element?
  criteria: Implement hook_clientside_validation_should_validate($element, $form_state, $form_id) and
    return FALSE for the form/element to skip.
  bundle: clientside_validation
  rubric_ref: rubric/clientside_validation_cv_skip_form@1.0
  tags:
  - mode:recipe
- id: cv-core-validators
  input: Which validation rules does the base clientside_validation module ship out of the box (not counting
    the jQuery submodule)?
  criteria: Base module ships required, email, url, url_internal_external, min, max, maxlength, and step
    validators. (pattern and equal_to come from the jQuery submodule.)
  bundle: clientside_validation
  rubric_ref: rubric/clientside_validation_cv_core_validators@1.0
  tags:
  - mode:recipe
- id: cv-custom-message
  input: How do I set a custom client-side error message for a required field or a pattern on a Drupal
    form element rendered by clientside_validation?
  criteria: 'Set the element render key #required_error (or #pattern_error, etc.); the validator uses
    it, otherwise it builds a default from the element #title.'
  bundle: clientside_validation
  rubric_ref: rubric/clientside_validation_cv_custom_message@1.0
  tags:
  - mode:recipe
- id: cv-cancel-buttons
  input: Why do Cancel/Preview style submit buttons skip client-side validation with clientside_validation,
    and how is that implemented?
  criteria: 'Submit buttons whose #limit_validation_errors is empty get the CSS class ''cancel'', which
    jQuery Validate treats as a skip-validation button.'
  bundle: clientside_validation
  rubric_ref: rubric/clientside_validation_cv_cancel_buttons@1.0
  tags:
  - mode:recipe
