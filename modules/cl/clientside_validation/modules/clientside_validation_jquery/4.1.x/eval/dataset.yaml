metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: clientside_validation_jquery
  version: 4.1.x
  note: 'Engine submodule of clientside_validation: loads jQuery Validate and enforces the base module''s
    data-rule attributes. Cases are `recipe` (response-graded) probing documented facts (settings, library
    install, Drush, per-form classes); no site mutation.'
questions:
- id: cvj-role
  input: What does the clientside_validation_jquery submodule add on top of the base clientside_validation
    module?
  criteria: It loads the jQuery Validate plugin (the engine) and enforces the data-rule-*/data-msg- attributes
    the base module writes, plus adds pattern and equal_to validators and CKEditor/Inline Form Errors
    integration.
  bundle: clientside_validation_jquery
  rubric_ref: rubric/clientside_validation_jquery_cvj_role@1.0
  tags:
  - mode:recipe
- id: cvj-library-drush
  input: I don't want to load jQuery Validate from a CDN. How do I download the library locally on a Drupal
    site using drush?
  criteria: Run drush cvjld (clientside_validation_jquery:library-download) to fetch jQuery Validation
    1.21.0 into libraries/jquery-validation; cvjls checks status, cvjlr removes it.
  bundle: clientside_validation_jquery
  rubric_ref: rubric/clientside_validation_jquery_cvj_library_drush@1.0
  tags:
  - mode:recipe
- id: cvj-cdn-setting
  input: Which config object and keys control whether clientside_validation_jquery uses a CDN for jQuery
    Validate and which CDN URL?
  criteria: The clientside_validation_jquery.settings config object; use_cdn (default false) toggles CDN,
    cdn_base_url sets the base URL (default jsDelivr jquery-validation@1.21.0).
  bundle: clientside_validation_jquery
  rubric_ref: rubric/clientside_validation_jquery_cvj_cdn_setting@1.0
  tags:
  - mode:recipe
- id: cvj-ajax-forms
  input: How do I make an AJAX form validate on the client before it submits with clientside_validation_jquery?
  criteria: Add the class cv-validate-before-ajax to the form; the validate_all_ajax_forms setting controls
    validating AJAX forms before submit.
  bundle: clientside_validation_jquery
  rubric_ref: rubric/clientside_validation_jquery_cvj_ajax_forms@1.0
  tags:
  - mode:recipe
- id: cvj-settings-route
  input: Where is the settings form for the jQuery clientside validation engine and what permission gates
    it?
  criteria: Route clientside_validation_jquery.settings_form at /admin/config/user-interface/clientside-validation-jquery-settings,
    gated by 'administer site configuration'.
  bundle: clientside_validation_jquery
  rubric_ref: rubric/clientside_validation_jquery_cvj_settings_route@1.0
  tags:
  - mode:recipe
- id: cvj-extra-validators
  input: Which two validator plugins does clientside_validation_jquery add beyond the base module's set?
  criteria: It adds the pattern (regex) and equal_to (field-matches-field) CvValidator plugins.
  bundle: clientside_validation_jquery
  rubric_ref: rubric/clientside_validation_jquery_cvj_extra_validators@1.0
  tags:
  - mode:recipe
- id: cvj-force-html5
  input: Which clientside_validation_jquery setting makes native HTML5 validation run before the jQuery
    validation layer?
  criteria: The force_html5_validation key (default false) on clientside_validation_jquery.settings forces
    HTML5 validation first.
  bundle: clientside_validation_jquery
  rubric_ref: rubric/clientside_validation_jquery_cvj_force_html5@1.0
  tags:
  - mode:recipe
