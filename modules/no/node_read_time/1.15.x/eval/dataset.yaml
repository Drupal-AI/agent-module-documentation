metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: node_read_time
  version: 1.15.x
  note: 'Node Read Time shows an estimated reading time on nodes. All behaviour is driven by the config
    object node_read_time.settings, nested under a ''reading_time'' mapping: container.<node_type>.is_activated
    (integer 1/0), words_per_minute (int, defaults to 225 when empty), unit_of_time (default|minute|second|below).
    Settings form at /admin/config/reading-time (route system.admin_config_reading_time). Activated types
    get an extra field ''reading_time'' (place it on Manage display); there is also a computed base field
    node_read_time and a Views field ''Node read time''. No permissions, no Drush, no plugin type. Shipped
    baseline: container {}, words_per_minute 225, unit_of_time minute. medium/hard cases read/write node_read_time.settings;
    cleanup restores the baseline.'
questions:
- id: node_read_time-config-route
  input: Using the node_read_time Drupal module, where do I configure which content types show a reading
    time, and how do I actually get the reading time to appear on a node?
  criteria: 'Configure it at /admin/config/reading-time (route system.admin_config_reading_time): tick
    the content types to activate. Then place the ''reading_time'' extra field on that type''s Manage
    display (it is hidden by default), or render {{ content.reading_time }} in a template.'
  bundle: node_read_time
  rubric_ref: rubric/node_read_time_node_read_time_config_route@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: node_read_time-wpm-default
  input: In the node_read_time module, which config key sets the reading speed used to calculate reading
    time, and what value is used if it is not set?
  criteria: reading_time.words_per_minute in node_read_time.settings sets the rate; when empty the calculation
    falls back to 225 words per minute.
  bundle: node_read_time
  rubric_ref: rubric/node_read_time_node_read_time_wpm_default@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: node_read_time-units
  input: What output formats can the node_read_time module use for the reading time (e.g. just minutes
    vs minutes and seconds), and which config key selects it?
  criteria: 'reading_time.unit_of_time selects the format: ''minute'' (whole minutes), ''second'' (minutes
    + seconds), ''below'' (minutes+seconds but ''1 minute'' when under a minute), or ''default'' (bare
    rounded minute number).'
  bundle: node_read_time
  rubric_ref: rubric/node_read_time_node_read_time_units@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: node_read_time-wpm
  input: On this Drupal site the node_read_time module's reading speed has been changed from the default.
    Inspect the live node_read_time.settings configuration and state the current words-per-minute value.
  criteria: reading_time.words_per_minute is 300. Read it with `drush config:get node_read_time.settings
    reading_time`.
  bundle: node_read_time
  rubric_ref: rubric/node_read_time_node_read_time_wpm@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/node_read_time-wpm-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/node_read_time-wpm-cleanup.sh
- id: node_read_time-unit
  input: On this Drupal site, how is the node_read_time reading time currently formatted (whole minutes,
    minutes and seconds, etc.)? Inspect the live configuration to answer.
  criteria: reading_time.unit_of_time is 'second', i.e. minutes and seconds (e.g. '2 minutes, 30 seconds').
    Read it from node_read_time.settings.
  bundle: node_read_time
  rubric_ref: rubric/node_read_time_node_read_time_unit@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/node_read_time-unit-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/node_read_time-unit-cleanup.sh
- id: node_read_time-activate
  input: On this Drupal site, use the node_read_time module to enable reading time for the Article content
    type. Apply the change to the live site.
  criteria: Set node_read_time.settings reading_time.container.article.is_activated to 1 (e.g. via the
    settings form at /admin/config/reading-time or config:set).
  bundle: node_read_time
  rubric_ref: rubric/node_read_time_node_read_time_activate@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/node_read_time-activate-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/node_read_time-activate-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/node_read_time-activate-verify.sh
- id: node_read_time-set-wpm
  input: On this Drupal site, configure the node_read_time module to use a reading speed of 150 words
    per minute. Apply the change to the live site.
  criteria: Set node_read_time.settings reading_time.words_per_minute to 150.
  bundle: node_read_time
  rubric_ref: rubric/node_read_time_node_read_time_set_wpm@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/node_read_time-set-wpm-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/node_read_time-set-wpm-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/node_read_time-set-wpm-verify.sh
