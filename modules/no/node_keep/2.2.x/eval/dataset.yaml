metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: node_keep
  version: 2.2.x
  note: Node Keep adds boolean base fields node_keeper (block deletion) and, with Pathauto enabled, alias_keeper
    (block alias change) to every node, enforced by hook_node_access() for users lacking 'administer node_keep
    per node'. Global config node_keep.settings has one key hide_warning_messages; per-content-type defaults
    are node.type.* third-party settings under node_keep. This site has pathauto enabled so alias_keeper
    exists. Medium/hard cases are grounded in real node base-field values and the node_keep.settings config,
    using namespaced Article nodes (title 'NK ...').
questions:
- id: node_keep-how-protect
  input: Using the Node Keep module on a Drupal site, how do you stop editors from deleting a specific
    node, and which permission lets a user override that protection and still delete it?
  criteria: Tick 'Prevent this node from being deleted' (the node_keeper base field) on the node's edit
    form (Node keep section) or set node_keeper=1 in code. Users with the 'administer node_keep per node'
    permission (or core 'bypass node access') can still delete it; everyone else is blocked by hook_node_access().
  bundle: node_keep
  rubric_ref: rubric/node_keep_node_keep_how_protect@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: node_keep-settings
  input: Node Keep shows a 'limited access permissions' warning message on protected nodes' edit pages.
    Which configuration setting hides that warning, in which config object, and at what admin path is
    its form?
  criteria: Enable node_keep.settings.hide_warning_messages (the 'Hide warning messages' checkbox) at
    /admin/config/content/node-keep (route node_keep.settings, permission 'administer node_keep').
  bundle: node_keep
  rubric_ref: rubric/node_keep_node_keep_settings@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: node_keep-per-type-default
  input: With Node Keep, how do you make every newly created node of a given content type deletion-protected
    by default? Where is that default stored?
  criteria: On the content type's edit form use the 'Node keep defaults' section and tick the node_keeper
    default. It is stored as a third-party setting on node.type.<bundle> under node_keep (node_keeper)
    and applied as the base-field-override default value for that bundle.
  bundle: node_keep
  rubric_ref: rubric/node_keep_node_keep_per_type_default@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: node_keep-which-protected
  input: On this Drupal site one Article node has been marked as deletion-protected with Node Keep. Inspect
    the live site and give the title of the node whose node_keeper field is enabled.
  criteria: The node titled 'NK Protected Probe' has node_keeper = 1 (query nodes where node_keeper =
    1).
  bundle: node_keep
  rubric_ref: rubric/node_keep_node_keep_which_protected@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/node_keep-which-protected-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/node_keep-which-protected-cleanup.sh
- id: node_keep-warning-hidden
  input: On this Drupal site, is Node Keep currently configured to show or to hide the 'limited access
    permissions' warning message on protected nodes? Inspect the live configuration and state the value
    of the relevant setting.
  criteria: node_keep.settings.hide_warning_messages is TRUE, so the warning is hidden (read with `drush
    cget node_keep.settings hide_warning_messages`).
  bundle: node_keep
  rubric_ref: rubric/node_keep_node_keep_warning_hidden@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/node_keep-warning-hidden-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/node_keep-warning-hidden-cleanup.sh
- id: node_keep-protect-node
  input: On this Drupal site there is an Article node titled 'NK Task Node'. Using Node Keep, protect
    it so that users without the 'administer node_keep per node' permission cannot delete it. Apply the
    change to the live site.
  criteria: Set the node_keeper base field to TRUE on the 'NK Task Node' Article node and save it (e.g.
    $node->set('node_keeper', TRUE)->save()).
  bundle: node_keep
  rubric_ref: rubric/node_keep_node_keep_protect_node@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/node_keep-protect-node-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/node_keep-protect-node-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/node_keep-protect-node-verify.sh
- id: node_keep-lock-alias
  input: On this Drupal site (which has Pathauto enabled) there is an Article node titled 'NK Alias Node'.
    Using Node Keep, lock this node's URL alias so unauthorized users cannot change it. Apply the change
    to the live site.
  criteria: Set the alias_keeper base field (added by Node Keep because Pathauto is enabled) to TRUE on
    the 'NK Alias Node' Article node and save it (e.g. $node->set('alias_keeper', TRUE)->save()).
  bundle: node_keep
  rubric_ref: rubric/node_keep_node_keep_lock_alias@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/node_keep-lock-alias-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/node_keep-lock-alias-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/node_keep-lock-alias-verify.sh
