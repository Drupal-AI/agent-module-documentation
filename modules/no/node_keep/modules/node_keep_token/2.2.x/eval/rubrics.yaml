rubrics:
- id: node_keep_token_node_keep_token_token_pattern
  version: '1.0'
  applicable_bundles:
  - node_keep_token
  checks:
  - kind: must_contain_any
    values:
    - node-keep
    - '[node-keep:home:url]'
    - node-keep:home:id
  scoring:
    combine: all_pass
- id: node_keep_token_node_keep_token_field
  version: '1.0'
  applicable_bundles:
  - node_keep_token
  checks:
  - kind: must_contain_any
    values:
    - keeper_machine_name
  scoring:
    combine: all_pass
- id: node_keep_token_node_keep_token_service
  version: '1.0'
  applicable_bundles:
  - node_keep_token
  checks:
  - kind: must_contain_any
    values:
    - node_keep_token.helper
    - getProtectedNodeByMachineName
    - NodeKeepTokenService
  scoring:
    combine: all_pass
- id: node_keep_token_node_keep_token_which_name
  version: '1.0'
  applicable_bundles:
  - node_keep_token
  checks:
  - kind: must_contain_any
    values:
    - nkt_probe
  scoring:
    combine: all_pass
- id: node_keep_token_node_keep_token_name_to_title
  version: '1.0'
  applicable_bundles:
  - node_keep_token
  checks:
  - kind: must_contain_any
    values:
    - NKT Home Page
  scoring:
    combine: all_pass
- id: node_keep_token_node_keep_token_assign_name
  version: '1.0'
  applicable_bundles:
  - node_keep_token
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
- id: node_keep_token_node_keep_token_token_resolves
  version: '1.0'
  applicable_bundles:
  - node_keep_token
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
