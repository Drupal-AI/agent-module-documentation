metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: node_keep_token
  version: 2.2.x
  note: node_keep_token adds a keeper_machine_name string base field to nodes and registers node-keep
    tokens ([node-keep:<machine_name>:alias|id|url|uri]) for every protected (node_keeper=1) node that
    has a machine name, plus the service node_keep_token.helper (NodeKeepTokenService). Depends on node_keep
    + token, both enabled here. Medium/hard cases are grounded in real node field values (keeper_machine_name)
    and the live token replacement, using namespaced Article nodes titled 'NKT ...'.
questions:
- id: node_keep_token-token-pattern
  input: The node_keep_token module exposes protected nodes as tokens. If a protected node has the Node
    Keep machine name 'home', which tokens can I use to output that node's URL path and its node id?
  criteria: 'Use tokens of the node-keep type: [node-keep:home:url] for the URL path and [node-keep:home:id]
    for the node id (also :alias and :uri are available).'
  bundle: node_keep_token
  rubric_ref: rubric/node_keep_token_node_keep_token_token_pattern@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: node_keep_token-field
  input: Which base field does node_keep_token add to nodes to make a protected node token-addressable,
    and what are the rules for its value?
  criteria: The keeper_machine_name string base field. It only appears when the node is protected (node_keeper
    checked), must be unique across protected nodes, and may only contain lowercase letters, numbers and
    underscores ([a-z0-9_]+).
  bundle: node_keep_token
  rubric_ref: rubric/node_keep_token_node_keep_token_field@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: node_keep_token-service
  input: In node_keep_token, which service and method would you call to load a protected node by its Node
    Keep machine name in custom code?
  criteria: Call the node_keep_token.helper service (NodeKeepTokenService) and its getProtectedNodeByMachineName($machine_name)
    method, e.g. \Drupal::service('node_keep_token.helper')->getProtectedNodeByMachineName('home').
  bundle: node_keep_token
  rubric_ref: rubric/node_keep_token_node_keep_token_service@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: node_keep_token-which-name
