  criteria: Its keeper_machine_name is 'nkt_probe' (readable via the keeper_machine_name field on the
    node, or node_keep_token.helper::getProtectedMachineNames()).
  bundle: node_keep_token
  rubric_ref: rubric/node_keep_token_node_keep_token_which_name@1.0
  tags:
