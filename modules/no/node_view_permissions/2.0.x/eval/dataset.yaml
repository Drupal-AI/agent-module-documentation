metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: node_view_permissions
  version: 2.0.x
  note: Node view permissions has no config form, no services, and no submodules — its whole surface is
    a pair of dynamically-declared per-content-type permissions enforced through the node access grant
    system. Cases are `recipe` (response-graded) probing documented facts an agent would otherwise read
    source (the .module + permissions class) to answer; no site mutation.
questions:
- id: nvp-which-permissions
  input: On a Drupal 11 site with the node_view_permissions module, what two permissions does it add for
    each content type, and what are their machine-name patterns (say for a content type with id `article`)?
  criteria: For each type it adds 'view any {type} content' and 'view own {type} content' — e.g. 'view
    any article content' and 'view own article content'.
  bundle: node_view_permissions
  rubric_ref: rubric/node_view_permissions_nvp_which_permissions@1.0
  tags:
  - mode:recipe
- id: nvp-core-gap
  input: Why would I install node_view_permissions instead of relying on Drupal core? What per-content-type
    access does core provide and what does it lack?
  criteria: Core has per-type create/edit own/any/delete own/any but no per-type VIEW permission (only
    the broad 'access content'); this module adds per-type 'view own/any content' to fill that gap.
  bundle: node_view_permissions
  rubric_ref: rubric/node_view_permissions_nvp_core_gap@1.0
  tags:
  - mode:recipe
- id: nvp-own-scope
  input: If I grant a role 'view own article content' with node_view_permissions, which article nodes
    can those users see, and does it work for anonymous users?
  criteria: Only articles owned by the current user (grant scoped to the node's owner id); it requires
    an authenticated account, so anonymous users never match a view_own realm.
  bundle: node_view_permissions
  rubric_ref: rubric/node_view_permissions_nvp_own_scope@1.0
  tags:
  - mode:recipe
- id: nvp-enforcement-mechanism
  input: How does node_view_permissions enforce its view permissions under the hood — which Drupal node
    access hooks does it implement, and does that mean it also filters Views and search?
  criteria: 'It uses the node access grant system: hook_node_access_records() writes per-node grant records
    and hook_node_grants() returns the realms an account qualifies for. Because it''s grant-based (not
    hook_node_access), it also filters Views, listings, and search.'
  bundle: node_view_permissions
  rubric_ref: rubric/node_view_permissions_nvp_enforcement_mechanism@1.0
  tags:
  - mode:recipe
- id: nvp-unpublished
  input: With node_view_permissions, what does a user need in order to view UNPUBLISHED nodes of a given
    content type?
  criteria: Both the per-type permission (view any/own {type} content) AND core's 'view any/own unpublished
    content' permission; the module only adds the unpublished realms when both are held.
  bundle: node_view_permissions
  rubric_ref: rubric/node_view_permissions_nvp_unpublished@1.0
  tags:
  - mode:recipe
- id: nvp-configure
  input: Where do I configure node_view_permissions — is there an admin settings form, and what is the
    configure route?
  criteria: There is no settings form and no configure route; you manage the permissions on the standard
    People → Permissions page (/admin/people/permissions).
  bundle: node_view_permissions
  rubric_ref: rubric/node_view_permissions_nvp_configure@1.0
  tags:
  - mode:recipe
- id: nvp-install-behavior
  input: What does node_view_permissions do on install regarding existing roles and node access, so the
    site keeps behaving as before?
  criteria: On install it flags a node access rebuild and grants 'view any {type} content' to the anonymous
    and authenticated roles for every existing content type, preserving core's default published-content
    visibility.
  bundle: node_view_permissions
  rubric_ref: rubric/node_view_permissions_nvp_install_behavior@1.0
  tags:
  - mode:recipe
- id: nvp-permissions-source
  input: How are node_view_permissions' permissions declared given that a site can have any number of
    content types — static YAML or dynamic, and via what class?
  criteria: Dynamically, via a permission_callbacks entry in node_view_permissions.permissions.yml pointing
    at NodeViewPermissionsPermissions (which extends core NodePermissions and overrides buildPermissions),
    so permissions are generated per content type automatically.
  bundle: node_view_permissions
  rubric_ref: rubric/node_view_permissions_nvp_permissions_source@1.0
  tags:
  - mode:recipe
