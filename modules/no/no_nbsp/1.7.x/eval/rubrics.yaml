rubrics:
- id: no_nbsp_no_nbsp_what_it_does
  version: '1.0'
  applicable_bundles:
  - no_nbsp
  checks:
  - kind: must_contain_any
    values:
    - non-breaking space
    - nbsp
    - U+00A0
    - 00A0
  scoring:
    combine: all_pass
- id: no_nbsp_no_nbsp_two_ways
  version: '1.0'
  applicable_bundles:
  - no_nbsp
  checks:
  - kind: must_contain_any
    values:
    - filter
    - formatter
    - text format
  scoring:
    combine: all_pass
- id: no_nbsp_no_nbsp_preserve_placeholders
  version: '1.0'
  applicable_bundles:
  - no_nbsp
  checks:
  - kind: must_contain_any
    values:
    - preserve_placeholders
    - placeholder
    - empty tag
    - <p>&nbsp;</p>
    - surrounded
  scoring:
    combine: all_pass
- id: no_nbsp_no_nbsp_format_state
  version: '1.0'
  applicable_bundles:
  - no_nbsp
  checks:
  - kind: must_contain_any
    values:
    - preserve_placeholders
    - preserve placeholders
    - placeholder
  scoring:
    combine: all_pass
- id: no_nbsp_no_nbsp_which_filter_id
  version: '1.0'
  applicable_bundles:
  - no_nbsp
  checks:
  - kind: must_contain_any
    values:
    - filter_no_nbsp
  scoring:
    combine: all_pass
- id: no_nbsp_no_nbsp_enable_on_format
  version: '1.0'
  applicable_bundles:
  - no_nbsp
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
- id: no_nbsp_no_nbsp_enable_preserve
  version: '1.0'
  applicable_bundles:
  - no_nbsp
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
