rubrics:
- id: nomarkup_nomarkup_where_stored
  version: '1.0'
  applicable_bundles:
  - nomarkup
  checks:
  - kind: must_contain_any
    values:
    - Manage display
    - third_party_settings
    - third party setting
    - entity_view_display
    - Remove field markup
  scoring:
    combine: all_pass
- id: nomarkup_nomarkup_separator_default
  version: '1.0'
  applicable_bundles:
  - nomarkup
  checks:
  - kind: must_contain_any
    values:
    - separator
    - '|'
  scoring:
    combine: all_pass
- id: nomarkup_nomarkup_views_style
  version: '1.0'
  applicable_bundles:
  - nomarkup
  checks:
  - kind: must_contain_any
    values:
    - nomarkup
    - views style
    - Views style
    - No markup
  scoring:
    combine: all_pass
- id: nomarkup_nomarkup_known_field
  version: '1.0'
  applicable_bundles:
  - nomarkup
  checks:
  - kind: must_contain_any
    values:
    - field_nm_known
  scoring:
    combine: all_pass
- id: nomarkup_nomarkup_known_separator
  version: '1.0'
  applicable_bundles:
  - nomarkup
  checks:
  - kind: must_contain_any
    values:
    - ;
  scoring:
    combine: all_pass
- id: nomarkup_nomarkup_enable_field
  version: '1.0'
  applicable_bundles:
  - nomarkup
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
- id: nomarkup_nomarkup_set_separator
  version: '1.0'
  applicable_bundles:
  - nomarkup
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
