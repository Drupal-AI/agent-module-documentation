metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: nomarkup
  version: 1.0.x
  note: 'No Markup has no field type, widget, settings form (configure=null), permission, Drush or plugin
    manager. Its entire persistent state is a per-formatter third-party setting on a field component inside
    an entity_view_display config entity: core.entity_view_display.<entity>.<bundle>.<mode> -> content.<field>.third_party_settings.nomarkup.{enabled,separator,referenced_entity}.
    enabled swaps the field to the bare field--nomarkup.html.twig template; separator (default ''|'')
    joins multi-value output; referenced_entity only applies to entity_reference_entity_view formatters.
    It also provides a Views style plugin id ''nomarkup''. Medium cases read back which field has nomarkup
    enabled and its configured separator; hard cases enable nomarkup on a field and set a custom separator,
    verified against the live view display. All fields namespaced field_nm_*.'
questions:
- id: nomarkup-where-stored
  input: I enabled the Drupal 'No Markup' module but there is no admin settings page. How do I make a
    specific field render without its wrapper markup, and where is that choice stored?
  criteria: 'There is no configure route (configure=null). On the entity''s Manage display page, open
    the field''s formatter settings (cog) and tick ''Remove field markup''. It is stored as a third-party
    setting on that field''s component: core.entity_view_display.<entity>.<bundle>.<mode> -> content.<field>.third_party_settings.nomarkup.enabled:
    true.'
  bundle: nomarkup
  rubric_ref: rubric/nomarkup_nomarkup_where_stored@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: nomarkup-separator-default
  input: When No Markup renders a multi-value field without markup, how are the multiple values separated,
    and what is the default separator?
  criteria: A configurable 'separator' third-party setting joins the values; the default is '|' (NoMarkupInterface::DEFAULT_SEPARATOR).
    It is only used for multi-value fields.
  bundle: nomarkup
  rubric_ref: rubric/nomarkup_nomarkup_separator_default@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: nomarkup-views-style
  input: Besides stripping field markup, what Views feature does the No Markup module provide, and what
    is its plugin id?
  criteria: It provides a Views style plugin with id 'nomarkup' (label 'No markup', theme views_view_nomarkup)
    that renders a view's rows with no additional wrapping markup.
  bundle: nomarkup
  rubric_ref: rubric/nomarkup_nomarkup_views_style@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: nomarkup-known-field
  input: On this Drupal site, the Article content type has a field configured with No Markup so it renders
    without wrapper markup. Inspect the live default view display for Article and give the machine name
    of that field.
  criteria: 'The field is field_nm_known: in core.entity_view_display.node.article.default its component
    has third_party_settings.nomarkup.enabled: true.'
  bundle: nomarkup
  rubric_ref: rubric/nomarkup_nomarkup_known_field@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/nomarkup-known-field-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/nomarkup-known-field-cleanup.sh
- id: nomarkup-known-separator
  input: On this site the Article field field_nm_multi renders without markup via No Markup and is multi-value.
    Inspect the live view-display configuration and state the multi-value separator No Markup will use
    for it.
  criteria: 'The separator is '';'' - in core.entity_view_display.node.article.default the field_nm_multi
    component has third_party_settings.nomarkup.separator: '';''.'
  bundle: nomarkup
  rubric_ref: rubric/nomarkup_nomarkup_known_separator@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/nomarkup-known-separator-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/nomarkup-known-separator-cleanup.sh
- id: nomarkup-enable-field
  input: On this Drupal site, the Article content type has a field field_nm_task shown on the default
    display. Using the No Markup module, configure the default view display so that this field renders
    without its wrapper markup. Apply the change to the live site.
  criteria: 'In core.entity_view_display.node.article.default the field_nm_task component carries third_party_settings.nomarkup.enabled:
    true (set the component''s third_party_settings and save, or tick ''Remove field markup'' on the field
    in Manage display).'
  bundle: nomarkup
  rubric_ref: rubric/nomarkup_nomarkup_enable_field@1.0
