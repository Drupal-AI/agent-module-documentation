metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: node_title_help_text
  version: 1.4.x
  note: 'Node Title Help Text adds per-content-type help text under the node Title field. No settings
    page (configure=null), no permissions, no Drush, no plugins. Its only persistent state is a third-party
    setting on each node type: node.type.<bundle>.third_party.node_title_help_text.title_help (schema
    node.type.*.third_party.node_title_help_text). The text is applied as the title widget #description
    on node add/edit forms only if the title field has no description already, and also inside Inline
    Entity Form node widgets. Medium/hard cases use namespaced content types (nthht_*) and are grounded
    in that real third-party setting: introspection reads back which type has help / its text; execution
    sets the title_help on a node type, verified from live config.'
questions:
- id: ntht-where-set
  input: I enabled the Drupal node_title_help_text module. Where do I enter the help text that shows under
    the node Title field, and where is that value stored?
  criteria: 'There is no dedicated settings page. Edit the content type (Structure -> Content types ->
    Edit), fill ''Title field help text'' under the Submission form settings tab. It is stored as a third-party
    setting: node.type.<bundle>.third_party_settings.node_title_help_text.title_help.'
  bundle: node_title_help_text
  rubric_ref: rubric/node_title_help_text_ntht_where_set@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: ntht-per-type
  input: With node_title_help_text, can I show different title help text for different content types,
    and does it override help text another module already put on the title field?
  criteria: 'Yes, the help text is stored per content type (per node type), so each type can have its
    own. It is applied as the title widget''s #description only if the title field has no description
    already, so it does not override help another module set.'
  bundle: node_title_help_text
  rubric_ref: rubric/node_title_help_text_ntht_per_type@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: ntht-where-shown
  input: Where does the text configured by node_title_help_text actually appear for a content editor,
    and does it work inside Inline Entity Form?
  criteria: It appears as the description under the Title field on that content type's node add/edit form.
    It also applies inside Inline Entity Form node widgets via hook_inline_entity_form_entity_form_alter().
  bundle: node_title_help_text
  rubric_ref: rubric/node_title_help_text_ntht_where_shown@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: ntht-known-text
  input: On this site there is a content type with machine name 'nthht_known' that has node title help
    text configured. Inspect the live configuration and report the help text that editors see under the
    Title field for that content type.
  criteria: The title help text for nthht_known is 'Enter the official product name, e.g. Widget Pro 3000.'
    (node.type.nthht_known third_party_settings.node_title_help_text.title_help).
  bundle: node_title_help_text
  rubric_ref: rubric/node_title_help_text_ntht_known_text@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/node_title_help_text-known-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/node_title_help_text-known-cleanup.sh
- id: ntht-which-type
  input: This site has two content types, nthht_on and nthht_off. Exactly one of them has node title help
    text configured via node_title_help_text. Inspect the live configuration and state which content type
    has title help text set.
  criteria: nthht_on has title help set (node.type.nthht_on third_party_settings.node_title_help_text.title_help
    = 'Give this landing page a campaign-specific title.'), while nthht_off has no such setting.
  bundle: node_title_help_text
  rubric_ref: rubric/node_title_help_text_ntht_which_type@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/node_title_help_text-which-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/node_title_help_text-which-cleanup.sh
- id: ntht-set-text
  input: 'On this site there is a content type with machine name ''nthht_task''. Using the node_title_help_text
    module, configure it so the Title field on that content type''s add/edit form shows the help text:
    Enter a short, descriptive title of at most 60 characters. Apply the change to the live site.'
  criteria: node.type.nthht_task third_party_settings.node_title_help_text.title_help is set exactly to
    'Enter a short, descriptive title of at most 60 characters.' (e.g. via NodeType::setThirdPartySetting
    or drush config:set, or the content type edit form).
  bundle: node_title_help_text
  rubric_ref: rubric/node_title_help_text_ntht_set_text@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/node_title_help_text-set-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/node_title_help_text-set-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/node_title_help_text-set-verify.sh
- id: ntht-layman-hint
  input: On my website I have a content type called 'nthht_recipe'. When my editors create one, I want
    a little hint to appear under the big title box telling them what to type there. Please make that
    hint show up.
  criteria: node.type.nthht_recipe third_party_settings.node_title_help_text.title_help is set to any
    non-empty guidance text, using the node_title_help_text module (content type edit form 'Title field
    help text', or NodeType::setThirdPartySetting / drush config:set).
  bundle: node_title_help_text
  rubric_ref: rubric/node_title_help_text_ntht_layman_hint@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: site-owner-layman
    reset: agent-module-documentation/evaluation/verify/node_title_help_text-layman-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/node_title_help_text-layman-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/node_title_help_text-layman-verify.sh
