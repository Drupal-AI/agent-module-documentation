metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: noreferrer
  version: 3.0.x
  note: No Referrer adds rel=noreferrer/noopener and referrerpolicy=no-referrer to external links and
    resources. Config object noreferrer.settings has booleans noreferrer/noopener/referrerpolicy (default
    TRUE), publish (FALSE), nullable subscribe_url, and allowed_domains (sequence, default []). Code-generated
    links are handled by hook_link_alter; user-generated content only if the 'noreferrer' text-format
    filter is enabled on a format (filter.format.<id>:filters.noreferrer.status). Settings at /admin/config/content/noreferrer
    (permission 'administer site configuration'; no module-specific permission). Allowlist matching is
    by Allowlist\Validator::isAllowed (exact host or subdomain). Medium cases read back a known allowed_domains
    list and a text format with the filter enabled; hard cases add a domain to allowed_domains and enable
    the noreferrer filter on a text format, verified against live config.
questions:
- id: noreferrer-config-keys
  input: On a Drupal site with the noreferrer module enabled, which configuration object and keys control
    whether rel="noreferrer", rel="noopener" and referrerpolicy="no-referrer" are added, and what are
    their default values?
  criteria: Config object noreferrer.settings with boolean keys noreferrer, noopener and referrerpolicy,
    all defaulting to TRUE (plus publish=false, subscribe_url=null, allowed_domains=[]). Edit at /admin/config/content/noreferrer.
  bundle: noreferrer
  rubric_ref: rubric/noreferrer_noreferrer_config_keys@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: noreferrer-apply-to-ugc
  input: I enabled the noreferrer module but the rel attributes are not being added to links inside my
    nodes' body/rich-text content. What do I have to do so the attributes are applied to user-generated
    content?
  criteria: Code-generated links (menus, link fields) are handled automatically via hook_link_alter, but
    user-generated content is only processed if you enable the module's text-format filter (plugin id
    'noreferrer', title 'Add referrerpolicy=..., rel=noopener and/or rel=noreferrer') on the relevant
    text format. It also fixes faulty/chopped HTML.
  bundle: noreferrer
  rubric_ref: rubric/noreferrer_noreferrer_apply_to_ugc@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: noreferrer-allowlist-service
  input: How does the noreferrer module let me exempt certain trusted external domains from getting rel="noreferrer"/referrerpolicy,
    where is that list stored, and which service checks it?
  criteria: Add hosts to noreferrer.settings:allowed_domains (space-separated in the settings form). The
    Allowlist\Validator::isAllowed($url) service checks whether a URL's host matches an allowed domain
    (exact host or any subdomain); matched links are skipped.
  bundle: noreferrer
  rubric_ref: rubric/noreferrer_noreferrer_allowlist_service@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: noreferrer-known-allowlist
  input: On this Drupal site, which external domains are currently exempt from the noreferrer/referrerpolicy
    attributes? Inspect the live noreferrer configuration and list them.
  criteria: noreferrer.settings:allowed_domains is [example.com, trusted-partner.org], so those two domains
    (and their subdomains) are exempt.
  bundle: noreferrer
  rubric_ref: rubric/noreferrer_noreferrer_known_allowlist@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/noreferrer-allowlist-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/noreferrer-allowlist-cleanup.sh
- id: noreferrer-known-filter-format
  input: On this Drupal site, exactly one text format has the No Referrer filter enabled, so its links
    get the rel/referrerpolicy attributes. Inspect the live filter format configuration and give the machine
    name of that text format.
  criteria: 'The text format nrf_known has the noreferrer filter enabled (filter.format.nrf_known -> filters.noreferrer.status:
    true).'
  bundle: noreferrer
  rubric_ref: rubric/noreferrer_noreferrer_known_filter_format@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/noreferrer-filter-format-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/noreferrer-filter-format-cleanup.sh
- id: noreferrer-add-domain
  input: On this Drupal site we have a trusted analytics partner at trusted-partner.example and we do
    NOT want No Referrer to strip the referrer on links to it. Configure the noreferrer module so that
    trusted-partner.example is exempt (allowlisted), and apply the change to the live site.
  criteria: Add trusted-partner.example to noreferrer.settings:allowed_domains (via the settings form's
    space-separated 'Allowed domains' field, or set the config sequence directly). The verify checks the
    live allowed_domains list contains trusted-partner.example.
  bundle: noreferrer
  rubric_ref: rubric/noreferrer_noreferrer_add_domain@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/noreferrer-add-domain-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/noreferrer-add-domain-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/noreferrer-add-domain-verify.sh
- id: noreferrer-enable-filter
  input: On this Drupal site there is a text format with machine name nrf_task. Using the noreferrer module,
    make it so links and external resources in content using that format receive the No Referrer attributes,
    and apply the change to the live site.
  criteria: 'Enable the ''noreferrer'' filter on the nrf_task text format (Text formats and editors UI,
    or set filter.format.nrf_task -> filters.noreferrer.status: true). The verify checks the noreferrer
    filter is enabled on nrf_task.'
  bundle: noreferrer
  rubric_ref: rubric/noreferrer_noreferrer_enable_filter@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/noreferrer-enable-filter-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/noreferrer-enable-filter-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/noreferrer-enable-filter-verify.sh
