rubrics:
- id: nodeaccess_nodeaccess_what_grants
  version: '1.0'
  applicable_bundles:
  - nodeaccess
  checks:
  - kind: must_contain_any
    values:
    - per node
    - per-node
    - content type
    - view
    - edit
    - delete
  scoring:
    combine: all_pass
- id: nodeaccess_nodeaccess_settings_object
  version: '1.0'
  applicable_bundles:
  - nodeaccess
  checks:
  - kind: must_contain_any
    values:
    - nodeaccess.settings
    - bundles_roles_grants
    - grant_view
    - grant_update
  scoring:
    combine: all_pass
- id: nodeaccess_nodeaccess_realms
  version: '1.0'
  applicable_bundles:
  - nodeaccess
  checks:
  - kind: must_contain_any
    values:
    - nodeaccess_role
    - nodeaccess_user
    - nodeaccess_author
    - nodeaccess
  scoring:
    combine: all_pass
- id: nodeaccess_nodeaccess_which_role_view
  version: '1.0'
  applicable_bundles:
  - nodeaccess
  checks:
  - kind: must_contain_any
    values:
    - anonymous
  scoring:
    combine: all_pass
- id: nodeaccess_nodeaccess_which_type_grants_tab
  version: '1.0'
