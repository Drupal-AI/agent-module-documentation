metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: node_export
  version: 1.5.x
  note: 'Node Export exports nodes to JSON and imports them back. Config node_export.settings has node_export_import
    (replace [default] = new revision of existing node, new = always create, skip = leave existing) and
    node_export_format (JSON only). Drush: node-export-export (ne-export), node-export-import (ne-import).
    Permissions node_export.export_node / import_node / administer. Ships node action bulk_node_export.
    Services NodeExport::export() / NodeImport::import(). Medium/hard cases read/write the real node_export.settings
    and perform a real JSON export of a node to a file.'
questions:
- id: ne-drush
  input: What Drush commands does the node_export module provide for exporting and importing nodes, and
    what are their aliases?
  criteria: node-export-export (alias ne-export) exports nodes (all or a nid list; --save=y writes a file)
    and node-export-import (alias ne-import) imports a JSON file.
  bundle: node_export
  rubric_ref: rubric/node_export_ne_drush@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: ne-format-config
  input: In what format does node_export export content, and which config object/keys store its settings?
  criteria: 'It exports JSON (the only implemented format). Settings live in node_export.settings: node_export_format
    (JSON) and node_export_import (import-conflict behavior).'
  bundle: node_export
  rubric_ref: rubric/node_export_ne_format_config@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: ne-import-behavior
  input: When node_export imports a node that already exists on the destination site, what options are
    there for how to handle it?
  criteria: node_export_import can be replace (save a new revision of the existing node, default), new
    (always create a new node), or skip (leave the existing node untouched).
  bundle: node_export
  rubric_ref: rubric/node_export_ne_import_behavior@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: ne-known-skip
  input: On this Drupal site, inspect the node_export configuration and report what it will do when importing
    a node that already exists.
  criteria: node_export.settings:node_export_import is 'skip', so existing nodes are left untouched on
    import.
  bundle: node_export
  rubric_ref: rubric/node_export_ne_known_skip@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/node_export-import-skip-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/node_export-import-skip-cleanup.sh
- id: ne-known-new
  input: 'Inspect this site''s node_export settings: if I import an export that contains a node whose
    ID already exists here, will it overwrite it, skip it, or create a new node? Answer based on the current
    live configuration.'
  criteria: node_export.settings:node_export_import is 'new', so importing always creates a brand-new
    node rather than replacing or skipping.
  bundle: node_export
  rubric_ref: rubric/node_export_ne_known_new@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/node_export-import-new-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/node_export-import-new-cleanup.sh
- id: ne-set-skip
  input: Configure the node_export module on this site so that, when importing a node that already exists,
    it skips it (leaves the existing node untouched). Apply the change to the live configuration.
  criteria: node_export.settings:node_export_import is set to 'skip' (e.g. drush cset node_export.settings
    node_export_import skip).
  bundle: node_export
  rubric_ref: rubric/node_export_ne_set_skip@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/node_export-set-skip-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/node_export-set-skip-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/node_export-set-skip-verify.sh
- id: ne-export-json
  input: This site has a node titled 'NE Export Probe'. Using the node_export module, export the site's
    node content to JSON and save the exported JSON to the file web/sites/default/files/ne_export_probe.json
    on this site (so the file contains the exported nodes).
  criteria: web/sites/default/files/ne_export_probe.json exists, is valid JSON, and contains the exported
    'NE Export Probe' node (e.g. drush node-export-export all > web/sites/default/files/ne_export_probe.json,
    or NodeExport::export).
  bundle: node_export
  rubric_ref: rubric/node_export_ne_export_json@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/node_export-export-json-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/node_export-export-json-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/node_export-export-json-verify.sh
