rubrics:
- id: node_export_ne_drush
  version: '1.0'
  applicable_bundles:
  - node_export
  checks:
  - kind: must_contain_any
    values:
    - node-export-export
    - node-export-import
    - ne-export
    - ne-import
  scoring:
    combine: all_pass
- id: node_export_ne_format_config
  version: '1.0'
  applicable_bundles:
  - node_export
  checks:
  - kind: must_contain_any
    values:
    - JSON
    - node_export.settings
    - node_export_import
    - node_export_format
  scoring:
    combine: all_pass
- id: node_export_ne_import_behavior
  version: '1.0'
  applicable_bundles:
  - node_export
  checks:
  - kind: must_contain_any
    values:
    - replace
    - new
    - skip
    - revision
  scoring:
    combine: all_pass
- id: node_export_ne_known_skip
  version: '1.0'
  applicable_bundles:
  - node_export
  checks:
  - kind: must_contain_any
    values:
    - skip
  scoring:
    combine: all_pass
- id: node_export_ne_known_new
  version: '1.0'
  applicable_bundles:
  - node_export
  checks:
  - kind: must_contain_any
    values:
    - new
    - create a new
  scoring:
    combine: all_pass
- id: node_export_ne_set_skip
  version: '1.0'
  applicable_bundles:
  - node_export
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
- id: node_export_ne_export_json
  version: '1.0'
  applicable_bundles:
  - node_export
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
