metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: noopener_filter
  version: 2.2.x
  note: 'Noopener Filter has two independent mechanisms grounded in real code: (1) a filter plugin id
    ''filter_noopener'' (TYPE_HTML_RESTRICTOR) enabled per text format, which adds rel="noopener" to <a
    target="_blank"> in WYSIWYG markup; (2) hook_link_alter() gated by the single config flag noopener_filter.settings:filter_links
    (bool, off by default; the config object only exists once saved), which adds noopener to Drupal-generated
    new-tab links. Settings form route noopener_filter.settings at /admin/config/noopener-filter/settings,
    permission ''administer noopener filter''. No config schema, no plugin types, no Drush, no dependencies.
    Medium cases read back a live text format that has the filter on and the live filter_links value;
    hard cases enable the filter on a format and turn on the filter_links flag, verified against live
    config.'
questions:
- id: noopener-what-it-adds
  input: What attribute does the Drupal noopener_filter module add to links, and to which links does it
    add it?
  criteria: It adds rel="noopener" (prepended to any existing rel value) to anchor tags whose target attribute
    is _blank (links that open in a new tab). It only adds noopener, not noreferrer.
  bundle: noopener_filter
  rubric_ref: rubric/noopener_filter_noopener_what_it_adds@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: noopener-how-to-enable
  input: I enabled the noopener_filter module on Drupal 11. How do I actually make it rewrite my WYSIWYG/CKEditor
    links so new-tab links get rel=noopener?
  criteria: It is a text-format filter. Go to Configuration > Content authoring > Text formats and editors,
    configure the relevant format, tick 'Add noopener to all links' (filter plugin id filter_noopener),
    and save. The filter then adds rel=noopener to target=_blank links rendered through that format.
  bundle: noopener_filter
  rubric_ref: rubric/noopener_filter_noopener_how_to_enable@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: noopener-linkflag-key
  input: Besides the text-format filter, noopener_filter can also add rel=noopener to Drupal-generated
    links (menu links, link generator output). What config key turns that behavior on, and where is the
    settings form?
  criteria: The hook_link_alter() behavior is gated by the boolean config key noopener_filter.settings:filter_links
    (off by default). The settings form is at route noopener_filter.settings, /admin/config/noopener-filter/settings,
    guarded by the 'administer noopener filter' permission.
  bundle: noopener_filter
  rubric_ref: rubric/noopener_filter_noopener_linkflag_key@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: noopener-which-format-has-it
  input: On this Drupal site, exactly one text format has the noopener filter enabled. Inspect the live
    filter configuration and give the machine name of that text format.
  criteria: 'The format is noopener_med_fmt: its filter.format.noopener_med_fmt config has filters.filter_noopener.status
    = true.'
  bundle: noopener_filter
  rubric_ref: rubric/noopener_filter_noopener_which_format_has_it@1.0
  tags:
  - mode:introspection
  - difficulty:medium
