metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: node_title_validation
  version: 3.0.x
  note: Node Title Validation attaches a NodeTitleValidate constraint to the node title base field (via
    entity_base_field_info_alter / entity_bundle_field_info_alter) and validates titles per content type
    against rules stored in node_title_validation.settings -> node_title_validation_config.content_types.<bundle>
    with keys exclude (comma-separated blocklist), comma (bool), min/max (char length), min-wc/max-wc
    (word count), unique (per-type uniqueness). Config UI route node_title_validation.admin_form at /admin/config/content/node-title-validation,
    gated by permission 'node title validation admin control'. The global node_title_validation_config.unique
    key is stored but not enforced by the validator. Medium/hard cases are grounded in that real config
    structure on the standard 'article' content type.
questions:
- id: node_title_validation-rule-keys
  input: Using the node_title_validation module on Drupal, which kinds of title rules can I enforce per
    content type? Name the length, word-count, blocklist and uniqueness options it supports.
  criteria: Per content type you can set minimum/maximum character length (min/max), minimum/maximum word
    count (min-wc/max-wc), a blocklist of characters/words (exclude, plus a comma toggle), and a per-type
    unique-title flag. They are stored under node_title_validation.settings -> node_title_validation_config.content_types.<bundle>.
  bundle: node_title_validation
  rubric_ref: rubric/node_title_validation_node_title_validation_rule_keys@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: node_title_validation-mechanism
  input: How does node_title_validation actually enforce its title rules on save in Drupal 11? Is it only
    on the node edit form, or does it apply to programmatic/API saves too?
  criteria: It adds a NodeTitleValidate symfony constraint to the node title base field (via hook_entity_base_field_info_alter/entity_bundle_field_info_alter).
    Because it is an entity constraint, it runs on any save path that validates the entity - the node
    form, $node->validate(), JSON:API/REST, and migrations - not only the UI.
  bundle: node_title_validation
  rubric_ref: rubric/node_title_validation_node_title_validation_mechanism@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: node_title_validation-config-route
  input: Where is node_title_validation configured in the Drupal admin, and which permission controls
    access to that settings form?
  criteria: It is configured at /admin/config/content/node-title-validation (route node_title_validation.admin_form),
    and access is gated by the module's own permission 'node title validation admin control'.
  bundle: node_title_validation
  rubric_ref: rubric/node_title_validation_node_title_validation_config_route@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: node_title_validation-known-min
  input: On this Drupal site, node_title_validation has a minimum title length rule configured for the
    Article content type. Inspect the live configuration and tell me the minimum number of characters
    an Article title must have.
  criteria: 'Article requires a minimum of 12 characters: node_title_validation.settings -> node_title_validation_config.content_types.article.min
    = 12. Read with drush cget node_title_validation.settings.'
  bundle: node_title_validation
  rubric_ref: rubric/node_title_validation_node_title_validation_known_min@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/node_title_validation-known-min-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/node_title_validation-known-min-cleanup.sh
- id: node_title_validation-known-blocked
  input: On this Drupal site, node_title_validation blocks a specific word from Article titles. Inspect
    the live configuration and report which word is on the Article blocklist.
  criteria: 'The Article blocklist (exclude) contains ''ntvbanned'': node_title_validation_config.content_types.article.exclude
    = ''ntvbanned''.'
  bundle: node_title_validation
  rubric_ref: rubric/node_title_validation_node_title_validation_known_blocked@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/node_title_validation-known-blocked-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/node_title_validation-known-blocked-cleanup.sh
- id: node_title_validation-set-min-length
  input: On this Drupal site, use node_title_validation to require that Article node titles are at least
    15 characters long. Apply the change to the live configuration.
  criteria: Set node_title_validation.settings -> node_title_validation_config.content_types.article.min
    to 15 (via the settings form at /admin/config/content/node-title-validation or drush/config).
  bundle: node_title_validation
  rubric_ref: rubric/node_title_validation_node_title_validation_set_min_length@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/node_title_validation-minlen-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/node_title_validation-minlen-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/node_title_validation-minlen-verify.sh
- id: node_title_validation-require-unique
  input: On this Drupal site, make sure two Article pages can't have the exact same title - configure
    node_title_validation so Article titles must be unique. Apply the change.
  criteria: 'Set the per-type unique flag: node_title_validation_config.content_types.article.unique =
    true (tick ''Unique node title for article content type'' on the settings form). The validator enforces
    uniqueness scoped to the Article type.'
  bundle: node_title_validation
  rubric_ref: rubric/node_title_validation_node_title_validation_require_unique@1.0
