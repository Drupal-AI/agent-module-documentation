rubrics:
- id: nodeorder_nodeorder_make_vocab_orderable
  version: '1.0'
  applicable_bundles:
  - nodeorder
  checks:
  - kind: must_contain_any
    values:
    - Orderable
    - orderable
    - vocabulary
    - nodeorder.settings
    - vocabularies
  scoring:
    combine: all_pass
- id: nodeorder_nodeorder_where_stored
  version: '1.0'
  applicable_bundles:
  - nodeorder
  checks:
  - kind: must_contain_any
    values:
    - taxonomy_index
    - weight
  scoring:
    combine: all_pass
- id: nodeorder_nodeorder_permission
  version: '1.0'
  applicable_bundles:
  - nodeorder
  checks:
  - kind: must_contain_any
    values:
    - order nodes within categories
    - administer nodeorder
  scoring:
    combine: all_pass
- id: nodeorder_nodeorder_which_orderable
  version: '1.0'
  applicable_bundles:
  - nodeorder
  checks:
  - kind: must_contain_any
    values:
    - nodeorder_tags
  scoring:
    combine: all_pass
- id: nodeorder_nodeorder_list_limit
  version: '1.0'
  applicable_bundles:
  - nodeorder
  checks:
  - kind: must_contain_any
    values:
    - '27'
  scoring:
    combine: all_pass
- id: nodeorder_nodeorder_make_orderable
  version: '1.0'
  applicable_bundles:
  - nodeorder
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
- id: nodeorder_nodeorder_set_limit
  version: '1.0'
  applicable_bundles:
  - nodeorder
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
