rubrics:
- id: noreqnewpass_nrnp_permission
  version: '1.0'
  applicable_bundles:
  - noreqnewpass
  checks:
  - kind: must_contain_any
    values:
    - administer noreqnewpass
  scoring:
    combine: all_pass
- id: noreqnewpass_nrnp_config_key
  version: '1.0'
  applicable_bundles:
  - noreqnewpass
  checks:
  - kind: must_contain_any
    values:
    - noreqnewpass_disable
    - noreqnewpass.settings_form
  scoring:
    combine: all_pass
- id: noreqnewpass_nrnp_behavior
  version: '1.0'
  applicable_bundles:
  - noreqnewpass
  checks:
  - kind: must_contain_any
    values:
    - user.pass
    - /user/password
    - request_password
  scoring:
    combine: all_pass
- id: noreqnewpass_nrnp_inspect_flag
  version: '1.0'
  applicable_bundles:
  - noreqnewpass
  checks:
  - kind: must_contain_any
    values:
    - noreqnewpass_disable
    - noreqnewpass.settings_form
  scoring:
    combine: all_pass
- id: noreqnewpass_nrnp_inspect_perm_role
  version: '1.0'
  applicable_bundles:
  - noreqnewpass
  checks:
  - kind: must_contain_any
    values:
    - content_editor
  scoring:
    combine: all_pass
- id: noreqnewpass_nrnp_enable_disable_flag
  version: '1.0'
  applicable_bundles:
  - noreqnewpass
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
- id: noreqnewpass_nrnp_grant_permission
  version: '1.0'
  applicable_bundles:
  - noreqnewpass
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
