metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: node_class
  version: 2.1.x
  note: 'Node class adds ONE base field `node_class` (string, ''CSS class(es)'') to every node via hook_entity_base_field_info(),
    shows it in a ''Node Class settings'' group on the node form (hook_form_node_form_alter), and appends
    the stored value to the rendered node''s attributes.class via hook_preprocess_node(). No settings
    form (configure=null), no permission, no config entity/schema. All medium/hard cases are grounded
    in that real base field: introspection reads back the node_class value on a known node; execution
    sets node_class on a node and verifies it on the live entity.'
questions:
- id: node_class-where-stored
  input: On a Drupal 11 site with the node_class module enabled, an editor wants to add a CSS class to
    a single node. Where do they enter it and where is that value stored on the node?
  criteria: node_class adds a base field named node_class ('CSS class(es)') to all nodes. On the node
    add/edit form it appears in a collapsible 'Node Class settings' group in the advanced sidebar. The
    value is stored as ordinary node field content (the node_class base field), per node/revision; there
    is no admin settings page (configure=null).
  bundle: node_class
  rubric_ref: rubric/node_class_node_class_where_stored@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: node_class-how-rendered
  input: How does the node_class module actually get the class an editor typed onto the rendered node's
    HTML? Name the hook and the render variable it modifies.
  criteria: node_class_preprocess_node() reads $entity->get('node_class') and appends the value to $variables['attributes']['class'],
    which the node template prints on the wrapping <article> element (e.g. <article{{ attributes }}>).
    It applies to every view mode.
  bundle: node_class
  rubric_ref: rubric/node_class_node_class_how_rendered@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: node_class-base-field-not-per-bundle
  input: With node_class enabled, do I need to add a field to each content type under Manage fields to
    use it? Explain why or why not.
  criteria: No. node_class is declared as a base field via hook_entity_base_field_info() on the node entity
    type, so the node_class field exists automatically on every content type without any per-bundle 'Manage
    fields' setup.
  bundle: node_class
  rubric_ref: rubric/node_class_node_class_base_field_not_per_bundle@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: node_class-known-value
  input: On this Drupal site there is an Article node whose title is exactly 'node_class introspection
    target'. Using node_class, read the CSS class that has been assigned to that node and report its value.
  criteria: The node's node_class base field holds 'nc-known-42' (readable via $node->get('node_class')->value).
  bundle: node_class
  rubric_ref: rubric/node_class_node_class_known_value@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/node_class-known-value-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/node_class-known-value-cleanup.sh
- id: node_class-which-node-has-class
  input: This site has two Article nodes titled 'node_class candidate A' and 'node_class candidate B'.
    Exactly one of them has a CSS class set via node_class. Inspect the live nodes and state which title
    has a node_class value and what it is.
  criteria: '''node_class candidate B'' has the node_class value ''nc-b-highlight''; ''node_class candidate
    A'' has an empty node_class field.'
  bundle: node_class
  rubric_ref: rubric/node_class_node_class_which_node_has_class@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/node_class-which-node-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/node_class-which-node-cleanup.sh
- id: node_class-set-class
  input: On this site there is an Article node titled 'node_class execution target'. Using the node_class
    module's field, set that node's CSS class to exactly `nc-hero` and save the change to the live site.
  criteria: The node's node_class base field is set to 'nc-hero' ($node->set('node_class','nc-hero')->save()),
    so the rendered node carries the nc-hero class.
  bundle: node_class
  rubric_ref: rubric/node_class_node_class_set_class@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/node_class-set-class-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/node_class-set-class-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/node_class-set-class-verify.sh
- id: node_class-create-node-with-class
  input: Create a new Article node titled 'node_class new post' and, using node_class, give it the CSS
    class `nc-created` in the same step. Save it to the live site.
  criteria: A published Article node 'node_class new post' exists whose node_class base field equals 'nc-created'.
  bundle: node_class
  rubric_ref: rubric/node_class_node_class_create_node_with_class@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/node_class-create-node-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/node_class-create-node-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/node_class-create-node-verify.sh
