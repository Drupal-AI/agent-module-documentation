rubrics:
- id: node_class_node_class_where_stored
  version: '1.0'
  applicable_bundles:
  - node_class
  checks:
  - kind: must_contain_any
    values:
    - node_class
    - CSS class
    - Node Class settings
    - base field
  scoring:
    combine: all_pass
- id: node_class_node_class_how_rendered
  version: '1.0'
  applicable_bundles:
  - node_class
  checks:
  - kind: must_contain_any
    values:
    - preprocess_node
    - hook_preprocess_node
    - attributes
    - attributes.class
    - attributes['class']
  scoring:
    combine: all_pass
- id: node_class_node_class_base_field_not_per_bundle
  version: '1.0'
  applicable_bundles:
  - node_class
  checks:
  - kind: must_contain_any
    values:
    - base field
    - hook_entity_base_field_info
    - every
    - all bundles
    - all content types
  scoring:
    combine: all_pass
- id: node_class_node_class_known_value
  version: '1.0'
  applicable_bundles:
  - node_class
  checks:
  - kind: must_contain_any
    values:
    - nc-known-42
  scoring:
    combine: all_pass
- id: node_class_node_class_which_node_has_class
  version: '1.0'
  applicable_bundles:
  - node_class
  checks:
  - kind: must_contain_any
    values:
    - node_class candidate B
  scoring:
    combine: all_pass
- id: node_class_node_class_set_class
  version: '1.0'
  applicable_bundles:
  - node_class
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
- id: node_class_node_class_create_node_with_class
  version: '1.0'
  applicable_bundles:
  - node_class
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
