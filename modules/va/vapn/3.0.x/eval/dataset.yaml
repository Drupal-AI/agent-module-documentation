metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: vapn
  version: 3.0.x
  note: 'VAPN (View access per node) controls the VIEW operation on nodes only. You enable it per content
    type on its settings form (config vapn.settings, key ''bundles'' = map of bundle->true; configure
    route vapn.settings at /admin/config/people/vapn). For each enabled bundle it attaches a code-defined
    ''vapn'' field (unlimited entity-reference to user_role) shown as a vertical tab on the node form.
    hook_node_access(): a node with roles selected is viewable only by users holding one of those roles;
    no roles selected = VAPN abstains (neutral). Permissions: administer vapn (settings + field edit),
    use vapn (field edit), bypass vapn (always view). Medium/hard cases are grounded in the live vapn.settings
    config (the map of enabled bundles), which is the module''s stable, exportable state: inspect which
    bundles are enabled, and enable VAPN on one or more content types, verified against live config.'
questions:
- id: vapn-how-to-enable
  input: I installed the VAPN (View access per node) module in Drupal. How do I turn on per-node view
    access for a content type, and where is that stored in configuration?
  criteria: 'Go to /admin/config/people/vapn (route vapn.settings, needs ''administer vapn'') and tick
    the content types. It is stored in the vapn.settings config object under ''bundles'' as a map of enabled
    bundle machine name => true (e.g. bundles.article: true). Each enabled bundle then gets a ''View access
    per node'' field on the node form.'
  bundle: vapn
  rubric_ref: rubric/vapn_vapn_how_to_enable@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: vapn-access-rule
  input: With the VAPN module, how is view access to a node decided? What happens if a node has no roles
    selected, and which permission lets someone bypass the restriction?
  criteria: VAPN only affects the 'view' operation. If a node has one or more roles selected, only users
    with at least one of those roles may view it; if no roles are selected VAPN abstains (neutral) and
    leaves access to core/other modules. Users with the 'bypass vapn' permission can always view.
  bundle: vapn
  rubric_ref: rubric/vapn_vapn_access_rule@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: vapn-scope
  input: Does the VAPN module control who can edit or delete a node, or just who can view it? What is
    the machine name of the field it adds to each node?
  criteria: VAPN only controls the 'view' operation (via hook_node_access) — it does not affect create,
    update, or delete. On enabled content types it adds a 'vapn' field, an unlimited entity-reference
    to user_role, listing the roles allowed to view that node.
  bundle: vapn
  rubric_ref: rubric/vapn_vapn_scope@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: vapn-enabled-bundles
  input: On this Drupal site, which content type(s) currently have VAPN (View access per node) enabled?
    Inspect the live VAPN configuration to answer.
  criteria: The 'article' content type. The vapn.settings config object has bundles.article = true (bundles
    is the map of content types VAPN applies to).
  bundle: vapn
  rubric_ref: rubric/vapn_vapn_enabled_bundles@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
