- id: vapn-enable-bundle
  input: On this Drupal site, use the VAPN module to enable per-node view access on the 'article' content
    type. Apply the change to the live configuration so that Article nodes get the 'View access per node'
    field.
  criteria: Set vapn.settings 'bundles' so that bundles.article is true (via the VAPN settings form at
    /admin/config/people/vapn, or by editing the config), then clear cached field definitions so the vapn
    field attaches to Article.
