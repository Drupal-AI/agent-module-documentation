metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: varnish_purge_tags
  version: 2.3.x
  note: Submodule of varnish_purger (project varnish_purge). Provides one Purge @PurgeTagsHeader plugin
    that adds a Cache-Tags response header. Cases are `recipe` (response-graded), probing documented facts;
    no site mutation.
questions:
- id: varnish-tags-what-it-does
  input: What does the Varnish Purger Tags submodule add to responses and why?
  criteria: It adds a Cache-Tags response header (the page's Drupal cache tags) on cacheable responses
    so Varnish can BAN cached pages by cache tag.
  bundle: varnish_purge_tags
  rubric_ref: rubric/varnish_purge_tags_varnish_tags_what_it_does@1.0
  tags:
  - mode:recipe
- id: varnish-tags-plugin-id
  input: Which Purge plugin type and plugin id does varnish_purge_tags provide?
  criteria: A @PurgeTagsHeader plugin with id varnish_tagsheader (class CacheTags), header_name Cache-Tags.
  bundle: varnish_purge_tags
  rubric_ref: rubric/varnish_purge_tags_varnish_tags_plugin_id@1.0
  tags:
  - mode:recipe
- id: varnish-tags-config
  input: How do I configure the Varnish Purger Tags submodule?
  criteria: There is nothing to configure — just enable it (drush en varnish_purge_tags). The header name
    is fixed to Cache-Tags in the plugin.
  bundle: varnish_purge_tags
  rubric_ref: rubric/varnish_purge_tags_varnish_tags_config@1.0
  tags:
  - mode:recipe
- id: varnish-tags-dependency
  input: Which module does varnish_purge_tags depend on?
  criteria: It depends on the main varnish_purger module.
  bundle: varnish_purge_tags
  rubric_ref: rubric/varnish_purge_tags_varnish_tags_dependency@1.0
  tags:
  - mode:recipe
