metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: varnish_focal_point_purge
  version: 2.3.x
  note: Submodule of varnish_purger (project varnish_purge). Purges image-style derivatives from Varnish
    when a focal_point crop entity updates, via URIBAN requests. Cases are `recipe` (response-graded),
    probing documented facts; no site mutation.
questions:
- id: varnish-fp-trigger
  input: When does the Varnish Focal Point Purger submodule purge images, and what does it purge?
  criteria: When a focal_point crop entity is updated, it bans every image-style derivative of the cropped
    file in Varnish via URIBAN requests.
  bundle: varnish_focal_point_purge
  rubric_ref: rubric/varnish_focal_point_purge_varnish_fp_trigger@1.0
  tags:
  - mode:recipe
- id: varnish-fp-config
  input: How is Varnish Focal Point Purger configured?
  criteria: It has no configuration or admin page — just enable it (drush en varnish_focal_point_purge).
    It reuses an existing varnish purger's hostname/port.
  bundle: varnish_focal_point_purge
  rubric_ref: rubric/varnish_focal_point_purge_varnish_fp_config@1.0
  tags:
  - mode:recipe
- id: varnish-fp-vcl
  input: Which HTTP request method must Varnish handle for Varnish Focal Point Purger?
  criteria: URIBAN — the VCL must handle the URIBAN method (ban on host + url, return synthetic 200).
  bundle: varnish_focal_point_purge
  rubric_ref: rubric/varnish_focal_point_purge_varnish_fp_vcl@1.0
  tags:
  - mode:recipe
- id: varnish-fp-vs-image
  input: What is the difference between varnish_focal_point_purge and varnish_image_purge?
  criteria: varnish_focal_point_purge reacts only to focal_point crop-entity updates, while varnish_image_purge
    reacts to updates of general content entities and purges their image-field derivatives.
  bundle: varnish_focal_point_purge
  rubric_ref: rubric/varnish_focal_point_purge_varnish_fp_vs_image@1.0
  tags:
  - mode:recipe
