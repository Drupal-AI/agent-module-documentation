metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: varnish_image_purge
  version: 2.3.x
  note: Submodule of varnish_purger (project varnish_purge). Purges image-style derivatives from Varnish
    on entity update via URIBAN requests. Cases are `recipe` (response-graded), probing documented facts;
    no site mutation.
questions:
- id: varnish-image-what-it-does
  input: What does the Varnish Image Purge submodule do when a content entity is updated?
  criteria: On entity update it bans each image-style derivative of the entity's image fields in Varnish
    by sending URIBAN HTTP requests per derivative URL.
  bundle: varnish_image_purge
  rubric_ref: rubric/varnish_image_purge_varnish_image_what_it_does@1.0
  tags:
  - mode:recipe
- id: varnish-image-config-route
  input: Where is the Varnish Image Purge configuration form and what do you set there?
  criteria: At /admin/config/development/varnish_image_purge (route varnish_image_purge.configuration)
    you tick which entity-type bundles trigger image purging.
  bundle: varnish_image_purge
  rubric_ref: rubric/varnish_image_purge_varnish_image_config_route@1.0
  tags:
  - mode:recipe
- id: varnish-image-default-all
  input: In Varnish Image Purge, what happens if I don't select any entity bundles in the config form?
  criteria: If nothing is selected, all bundles of all content entity types are purged (only image-type
    fields).
  bundle: varnish_image_purge
  rubric_ref: rubric/varnish_image_purge_varnish_image_default_all@1.0
  tags:
  - mode:recipe
- id: varnish-image-vcl
  input: Which Varnish request method must my VCL handle for Varnish Image Purge to work?
  criteria: URIBAN — your VCL must handle the URIBAN method (ban on host + url and return a synthetic
    200), per the module's example snippet.
  bundle: varnish_image_purge
  rubric_ref: rubric/varnish_image_purge_varnish_image_vcl@1.0
  tags:
  - mode:recipe
