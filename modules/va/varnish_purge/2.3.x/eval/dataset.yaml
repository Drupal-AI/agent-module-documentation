metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: varnish_purger
  version: 2.3.x
  note: Drupal.org project 'varnish_purge' but the main module machine name is 'varnish_purger'. It provides
    Purge purger plugins (varnish, varnishbundled, varnish_zeroconfig_purger) for invalidating Varnish
    caches. Cases are `recipe` (response-graded), probing documented facts an agent would otherwise read
    source to answer; no site mutation.
questions:
- id: varnish-purger-machine-name
  input: I want to enable the main Varnish Purge module on Drupal via Drush. The project on drupal.org
    is called varnish_purge — what machine name do I actually pass to `drush en`?
  criteria: The main module machine name is varnish_purger (drush en varnish_purger), even though the
    drupal.org project is named varnish_purge.
  bundle: varnish_purger
  rubric_ref: rubric/varnish_purger_varnish_purger_machine_name@1.0
  tags:
  - mode:recipe
- id: varnish-purger-what-it-is
  input: What does the Varnish Purger module do and which module does it require?
  criteria: It provides Purge 'purger' plugins that send BAN/PURGE HTTP requests to invalidate content
    in Varnish reverse-proxy caches. It requires the purge module (and purge_tokens).
  bundle: varnish_purger
  rubric_ref: rubric/varnish_purger_varnish_purger_what_it_is@1.0
  tags:
  - mode:recipe
- id: varnish-purger-plugins
  input: Which purger plugin ids does Varnish Purger provide, and what is the difference between the first
    two?
  criteria: varnish (one HTTP request per invalidation), varnishbundled (a single HTTP request for a whole
    batch), and varnish_zeroconfig_purger (settings.php-driven, no config form).
  bundle: varnish_purger
  rubric_ref: rubric/varnish_purger_varnish_purger_plugins@1.0
  tags:
  - mode:recipe
- id: varnish-purger-tag-header
  input: How do I make a configurable Varnish purger clear content by Drupal cache tag? What request method
    and header would I set?
  criteria: Set invalidationtype to tag, request_method BAN, and add an outbound header Cache-Tags with
    value [invalidation:expression] (token-replaced).
  bundle: varnish_purger
  rubric_ref: rubric/varnish_purger_varnish_purger_tag_header@1.0
  tags:
  - mode:recipe
- id: varnish-purger-methods
  input: Which HTTP request methods can I choose for a configurable Varnish purger?
  criteria: Only BAN or PURGE are offered in the purger's request method dropdown.
  bundle: varnish_purger
  rubric_ref: rubric/varnish_purger_varnish_purger_methods@1.0
  tags:
  - mode:recipe
- id: varnish-purger-no-config-route
  input: Where is the admin settings page for the varnish_purger module itself?
  criteria: The module has no admin route of its own (configure is null); purgers are added and configured
    through the Purge UI (purge_ui) or Drush (drush p:purger-add).
  bundle: varnish_purger
  rubric_ref: rubric/varnish_purger_varnish_purger_no_config_route@1.0
  tags:
  - mode:recipe
- id: varnish-purger-zeroconfig-ips
  input: The Varnish zero-configuration purger — where does it get the list of Varnish server IP addresses
    from?
  criteria: From Drupal core's $settings['reverse_proxy_addresses'] in settings.php; it is meant to be
    used with the shipped zeroconfig.vcl.
  bundle: varnish_purger
  rubric_ref: rubric/varnish_purger_varnish_purger_zeroconfig_ips@1.0
  tags:
  - mode:recipe
- id: varnish-purger-diagnostic
  input: After adding a Varnish purger, how do I verify it is fully configured, and what does the module's
    diagnostic check flag?
  criteria: Run drush p:diagnostics; the varnishconfiguration ('Varnish') check errors if name/hostname/port/request_method/scheme
    is empty and warns on https-vs-port mismatches (https not on 443, or http on 443).
  bundle: varnish_purger
  rubric_ref: rubric/varnish_purger_varnish_purger_diagnostic@1.0
  tags:
  - mode:recipe
