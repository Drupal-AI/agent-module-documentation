metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: variationcache
  version: 1.0.x
  note: VariationCache is a redirect-aware cache backend wrapper that adds cache-context support; it is
    a backport that was merged into Drupal core 10.2 and now ships mainly as a class_alias compatibility
    shim. Cases are `recipe` (response-graded) probing documented facts an agent would otherwise read
    source to answer; no site mutation.
questions:
- id: vc-service-name
  input: In Drupal I need a cache that varies by cache context (like user.permissions) without building
    context-specific cache IDs myself. Which service does VariationCache expose and how do I get a bin
    wrapper from it?
  criteria: Use the variation_cache_factory service; call ->get($bin) on it to get a VariationCacheInterface
    object that wraps the named cache bin and adds cache-context awareness.
  bundle: variationcache
  rubric_ref: rubric/variationcache_vc_service_name@1.0
  tags:
  - mode:recipe
- id: vc-set-signature
  input: What are the arguments to VariationCacheInterface::set() and what is the difference between the
    two cacheability arguments?
  criteria: set(array $keys, $data, CacheableDependencyInterface $cacheability, CacheableDependencyInterface
    $initial_cacheability). $cacheability is the full/folded cache metadata after bubbling; $initial_cacheability
    is the pre-bubbling metadata known before other systems adjusted it. Keys is an array of cache keys,
    not a single cid.
  bundle: variationcache
  rubric_ref: rubric/variationcache_vc_set_signature@1.0
  tags:
  - mode:recipe
- id: vc-set-logicexception
  input: Under what condition does VariationCache::set() throw a LogicException, and when does it silently
    store nothing?
  criteria: It throws \LogicException when the initial (pre-bubbling) cache contexts are not fully contained
    in the full cacheability's contexts (the full set must be a superset). It silently stores nothing
    when the cacheability's max-age is 0 (uncacheable).
  bundle: variationcache
  rubric_ref: rubric/variationcache_vc_set_logicexception@1.0
  tags:
  - mode:recipe
- id: vc-delete-scope
  input: If I call delete() or invalidate() on a VariationCache item, does it remove every context variation
    of that item or just one?
  criteria: Only the active variation for the current request is affected, to stay consistent with get();
    other context variations of the same keys are not deleted or invalidated.
  bundle: variationcache
  rubric_ref: rubric/variationcache_vc_delete_scope@1.0
  tags:
  - mode:recipe
- id: vc-core-merge
  input: Is the VariationCache contrib module still needed on Drupal 11 / 10.2, and what does the module
    actually do on those core versions?
  criteria: It is deprecated because the code was merged into Drupal core 10.2+. On those versions the
    module only registers class_alias() entries mapping \Drupal\variationcache\Cache\* to the core \Drupal\Core\Cache\*
    classes; you can uninstall it and reference the core classes directly.
  bundle: variationcache
  rubric_ref: rubric/variationcache_vc_core_merge@1.0
  tags:
  - mode:recipe
- id: vc-factory-args
  input: I want to decorate VariationCacheFactory. Which interface do I implement, what single method
    must it provide, and what services does the core factory take?
  criteria: Implement VariationCacheFactoryInterface, which defines get($bin) returning a VariationCacheInterface.
    The bundled factory is constructed from request_stack, cache_factory, and cache_contexts_manager;
    decorate the variation_cache_factory service and wrap those calls.
  bundle: variationcache
  rubric_ref: rubric/variationcache_vc_factory_args@1.0
  tags:
  - mode:recipe
- id: vc-no-ui
  input: Does VariationCache add any admin UI, config form, permissions, or Drush commands I need to configure?
  criteria: No. VariationCache has no UI, no config, no permissions, no routes, and no Drush commands.
    It is purely a developer/API dependency providing the variation_cache_factory service and related
    classes.
  bundle: variationcache
  rubric_ref: rubric/variationcache_vc_no_ui@1.0
  tags:
  - mode:recipe
