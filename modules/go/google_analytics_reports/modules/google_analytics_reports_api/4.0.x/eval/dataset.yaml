metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: google_analytics_reports_api
  version: 4.0.x
  note: Credential + API-access layer for the GA Reports project. Owns config google_analytics_reports_api.settings
    (property = GA4 numeric property id, json = private managed-file id of the service-account key, cache_length
    = query cache seconds, default 259200). Exposes the GoogleAnalyticsReportsApiFeed service (static
    service(), isAuthenticated(), __call proxy to Google's BetaAnalyticsDataClient with per-query caching),
    library google/analytics-data. Permission administer google analytics reports api; route google_analytics_reports_api.settings
    at /admin/config/services/google-analytics-reports-api. Real data needs an external Google service,
    so evals are grounded in local config values only (cache_length, property) via cset/cget - no entity
    saves.
questions:
- id: google_analytics_reports_api-config-keys
  input: Where does the google_analytics_reports_api module store its Google Analytics 4 connection settings,
    and what are the main config keys it saves?
  criteria: 'Config object google_analytics_reports_api.settings (edited at /admin/config/services/google-analytics-reports-api).
    Keys: property (GA4 numeric property id), json (private managed-file id of the service-account credential),
    cache_length (query cache seconds, default 259200).'
  bundle: google_analytics_reports_api
  rubric_ref: rubric/google_analytics_reports_api_google_analytics_reports_api_config_keys@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: google_analytics_reports_api-feed-service
  input: I want to run a Google Analytics 4 report query from custom code using google_analytics_reports_api
    instead of writing my own OAuth. Which service class do I use and how do I check it is connected?
  criteria: Use GoogleAnalyticsReportsApiFeed::service() to get an authenticated feed, check $feed->isAuthenticated(),
    then call Google Analytics Data API methods (it proxies to BetaAnalyticsDataClient via __call and
    caches results for cache_length seconds).
  bundle: google_analytics_reports_api
  rubric_ref: rubric/google_analytics_reports_api_google_analytics_reports_api_feed_service@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: google_analytics_reports_api-permission-cache
  input: Which permission controls the google_analytics_reports_api settings form, and why does the module
    cache query results?
  criteria: The permission 'administer google analytics reports api' gates the settings form. Results
    are cached for cache_length seconds (default 3 days) because Google's Analytics Data API enforces
    a daily query quota.
  bundle: google_analytics_reports_api
  rubric_ref: rubric/google_analytics_reports_api_google_analytics_reports_api_permission_cache@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: google_analytics_reports_api-cache-len
  input: On this Drupal site the Google Analytics Reports API query cache has been configured to a non-default
    duration. Inspect the live configuration and give the cache length in seconds.
  criteria: google_analytics_reports_api.settings:cache_length is 86400 (one day).
  bundle: google_analytics_reports_api
  rubric_ref: rubric/google_analytics_reports_api_google_analytics_reports_api_cache_len@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/google_analytics_reports_api-cache-len-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/google_analytics_reports_api-cache-len-cleanup.sh
- id: google_analytics_reports_api-property
  input: On this Drupal site, which Google Analytics 4 property id is configured for the google_analytics_reports_api
    module? Inspect the live configuration and report it.
  criteria: google_analytics_reports_api.settings:property is 987654321.
  bundle: google_analytics_reports_api
  rubric_ref: rubric/google_analytics_reports_api_google_analytics_reports_api_property@1.0
  tags:
