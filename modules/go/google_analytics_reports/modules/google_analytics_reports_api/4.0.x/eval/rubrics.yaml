  version: '1.0'
  applicable_bundles:
  - google_analytics_reports_api
  checks:
  - kind: must_contain_any
    values:
    - '987654321'
  scoring:
    combine: all_pass
- id: google_analytics_reports_api_google_analytics_reports_api_set_cache
  version: '1.0'
  applicable_bundles:
  - google_analytics_reports_api
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
