rubrics:
- id: google_analytics_reports_api_google_analytics_reports_api_config_keys
  version: '1.0'
  applicable_bundles:
  - google_analytics_reports_api
  checks:
  - kind: must_contain_any
    values:
    - google_analytics_reports_api.settings
    - property
    - cache_length
    - json
    - google-analytics-reports-api
  scoring:
    combine: all_pass
- id: google_analytics_reports_api_google_analytics_reports_api_feed_service
  version: '1.0'
  applicable_bundles:
  - google_analytics_reports_api
  checks:
  - kind: must_contain_any
    values:
    - GoogleAnalyticsReportsApiFeed
    - isAuthenticated
    - service(
    - BetaAnalyticsDataClient
  scoring:
    combine: all_pass
- id: google_analytics_reports_api_google_analytics_reports_api_permission_cache
  version: '1.0'
  applicable_bundles:
  - google_analytics_reports_api
  checks:
  - kind: must_contain_any
    values:
    - administer google analytics reports api
    - quota
    - cache_length
    - cache
  scoring:
    combine: all_pass
- id: google_analytics_reports_api_google_analytics_reports_api_cache_len
  version: '1.0'
  applicable_bundles:
  - google_analytics_reports_api
  checks:
