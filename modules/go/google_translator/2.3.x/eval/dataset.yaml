metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: google_translator
  version: 2.3.x
  note: 'Google Translator embeds Google Translate''s client-side Website Translator as a Drupal block.
    All persistent state is the config object google_translator.settings (keys: google_translator_active_languages_display_mode
    in {SIMPLE,HORIZONTAL,VERTICAL}, google_translator_active_languages array of Google short codes, google_translator_disclaimer_title,
    google_translator_disclaimer). Config form route google_translator.config at /admin/config/regional/google-translator;
    permission ''administer google_translator settings''; block plugin id ''google_translator''. Medium
    cases seed known values into that config for read-back; hard cases mutate config and/or place the
    block, verified against live config/block entities.'
questions:
- id: google_translator-config-object
  input: In the Drupal google_translator module, which configuration object stores the widget settings,
    and what are the three allowed values of the display-mode setting?
  criteria: Settings live in the google_translator.settings config object. The key google_translator_active_languages_display_mode
    accepts SIMPLE, HORIZONTAL, or VERTICAL.
  bundle: google_translator
  rubric_ref: rubric/google_translator_google_translator_config_object@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: google_translator-place-widget
  input: How do I actually show the Google Translator language selector on my Drupal site's pages, and
    what is the block plugin id?
  criteria: It ships a Block plugin with id 'google_translator' (admin label 'Google Translator'). Place
    it via Structure > Block layout into a region (or a block.block.* config entity).
  bundle: google_translator
  rubric_ref: rubric/google_translator_google_translator_place_widget@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: google_translator-permission-and-route
  input: Which permission and which admin route control the Google Translator settings form in Drupal?
  criteria: The permission is 'administer google_translator settings' (core 'administer site configuration'
    also grants access). The form is route google_translator.config at /admin/config/regional/google-translator.
  bundle: google_translator
  rubric_ref: rubric/google_translator_google_translator_permission_and_route@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: google_translator-known-display-mode
  input: On this Drupal site, inspect the live google_translator configuration and tell me which widget
    display mode is currently configured for the Google Translator block.
  criteria: google_translator.settings has google_translator_active_languages_display_mode set to VERTICAL
    (the active languages are fr and de).
  bundle: google_translator
  rubric_ref: rubric/google_translator_google_translator_known_display_mode@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/google_translator-display-mode-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/google_translator-display-mode-cleanup.sh
- id: google_translator-known-disclaimer
  input: Read the live Google Translator configuration on this site and report the exact disclaimer modal
    title that is currently set.
  criteria: google_translator.settings key google_translator_disclaimer_title is 'GT Eval Notice Zephyr'.
  bundle: google_translator
  rubric_ref: rubric/google_translator_google_translator_known_disclaimer@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/google_translator-disclaimer-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/google_translator-disclaimer-cleanup.sh
- id: google_translator-configure-languages
  input: On this Drupal site, configure the Google Translator module so its widget uses the HORIZONTAL
    display mode and offers Japanese (langcode ja) among its active languages. Apply the change to the
    live site.
  criteria: Set google_translator.settings google_translator_active_languages_display_mode to HORIZONTAL
    and include 'ja' in google_translator_active_languages (e.g. via drush cset or the settings form at
    /admin/config/regional/google-translator).
  bundle: google_translator
  rubric_ref: rubric/google_translator_google_translator_configure_languages@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/google_translator-set-languages-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/google_translator-display-mode-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/google_translator-set-languages-verify.sh
- id: google_translator-place-block
  input: I want the little 'Translate this page' language picker from the Google Translator module to
    actually show up on my Drupal site. Please make it appear somewhere on the page.
  criteria: Place the 'google_translator' block into a visible region of the default theme (Structure
    > Block layout, or a block.block.* config entity), leaving it enabled.
  bundle: google_translator
  rubric_ref: rubric/google_translator_google_translator_place_block@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: layman
    reset: agent-module-documentation/evaluation/verify/google_translator-place-block-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/google_translator-place-block-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/google_translator-place-block-verify.sh
