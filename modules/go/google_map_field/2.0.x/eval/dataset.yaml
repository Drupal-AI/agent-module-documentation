metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: google_map_field
  version: 2.0.x
  note: Google Map Field defines the google_map_field field type (map center/zoom/marker/infowindow stored
    per delta), two widgets (google_map_field_default, olmap_field), three formatters (google_map_field_default,
    google_map_field_embed, google_map_field_open_layers) and a global settings form (route gmap.field.settings
    at /admin/config/services/gmap-field-settings) that stores the Google Maps API key in the google_map_field.settings
    config object (keys google_map_field_auth_method, google_map_field_apikey, google_map_field_map_client_id).
    No plugin manager, no Drush, no custom permissions. Medium/hard cases are grounded in that real config
    object and in creating a google_map_field field on Article.
questions:
- id: gmf-plugins
  input: In the Drupal contrib module google_map_field, what is the machine name of the field type it
    provides, and which widgets and formatters does it ship for that field type?
  criteria: 'Field type id: google_map_field. Widgets: google_map_field_default and olmap_field (OpenLayers).
    Formatters: google_map_field_default, google_map_field_embed (Embed place iframe), google_map_field_open_layers.'
  bundle: google_map_field
  rubric_ref: rubric/google_map_field_gmf_plugins@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: gmf-apikey-config
  input: On a Drupal site using google_map_field, where do I set the global Google Maps API key? Give
    the settings route/path and the config object and key that stores it.
  criteria: Route gmap.field.settings at /admin/config/services/gmap-field-settings (permission administer
    site configuration). It writes to the google_map_field.settings config object, key google_map_field_apikey
    (with google_map_field_auth_method choosing API key vs API for Work, and google_map_field_map_client_id
    for Work).
  bundle: google_map_field
  rubric_ref: rubric/google_map_field_gmf_apikey_config@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: gmf-storage-columns
  input: What data does a google_map_field field value store per item in Drupal? Name several of the stored
    columns/properties.
  criteria: Each value stores name, lat, lon, zoom, type, width, height, marker, traffic, marker_icon,
    controls and infowindow. isEmpty() is based on lat being empty.
  bundle: google_map_field
  rubric_ref: rubric/google_map_field_gmf_storage_columns@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: gmf-known-apikey
  input: On this Drupal site, a Google Maps API key has already been configured for the google_map_field
    module. Inspect the live configuration and report the exact API key value that is set.
  criteria: The key is gmf_probe_key_7g2x, stored in google_map_field.settings:google_map_field_apikey
    (drush cget google_map_field.settings google_map_field_apikey).
  bundle: google_map_field
  rubric_ref: rubric/google_map_field_gmf_known_apikey@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/google_map_field-apikey-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/google_map_field-apikey-cleanup.sh
- id: gmf-known-field
  input: The Article content type on this site has a field that uses the google_map_field module's map
    field type. Inspect the live field configuration and give the machine name of that field.
  criteria: field_gmf_known is a node field of type google_map_field on the Article bundle (drush field:info,
    or load FieldStorageConfig node.field_gmf_known and check getType()).
  bundle: google_map_field
  rubric_ref: rubric/google_map_field_gmf_known_field@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/google_map_field-known-field-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/google_map_field-known-field-cleanup.sh
- id: gmf-create-field
  input: On this Drupal site, add a new field named field_gmf_task to the Article content type using the
    google_map_field module's map field type. Create the field storage and the field instance on node/article
    and apply it to the live site.
  criteria: A FieldStorageConfig node.field_gmf_task of type google_map_field plus a FieldConfig on the
    article bundle are created and saved.
  bundle: google_map_field
  rubric_ref: rubric/google_map_field_gmf_create_field@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/google_map_field-create-field-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/google_map_field-create-field-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/google_map_field-create-field-verify.sh
- id: gmf-set-apikey
  input: Configure the google_map_field module on this site to use the Google Maps API key 'AIzaGmfTaskKey123'.
    Persist it in the module's configuration so map fields authenticate with that key.
  criteria: google_map_field.settings:google_map_field_apikey is set to AIzaGmfTaskKey123 (e.g. drush
    cset google_map_field.settings google_map_field_apikey 'AIzaGmfTaskKey123').
  bundle: google_map_field
  rubric_ref: rubric/google_map_field_gmf_set_apikey@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/google_map_field-set-apikey-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/google_map_field-set-apikey-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/google_map_field-set-apikey-verify.sh
