rubrics:
- id: google_map_field_gmf_plugins
  version: '1.0'
  applicable_bundles:
  - google_map_field
  checks:
  - kind: must_contain_any
    values:
    - google_map_field
    - olmap_field
    - google_map_field_embed
    - google_map_field_open_layers
  scoring:
    combine: all_pass
- id: google_map_field_gmf_apikey_config
  version: '1.0'
  applicable_bundles:
  - google_map_field
  checks:
  - kind: must_contain_any
    values:
    - gmap.field.settings
    - /admin/config/services/gmap-field-settings
    - google_map_field.settings
    - google_map_field_apikey
  scoring:
    combine: all_pass
- id: google_map_field_gmf_storage_columns
  version: '1.0'
  applicable_bundles:
  - google_map_field
  checks:
  - kind: must_contain_any
    values:
    - lat
    - lon
    - zoom
    - infowindow
    - marker
  scoring:
    combine: all_pass
- id: google_map_field_gmf_known_apikey
  version: '1.0'
  applicable_bundles:
  - google_map_field
  checks:
  - kind: must_contain_any
    values:
    - gmf_probe_key_7g2x
  scoring:
    combine: all_pass
- id: google_map_field_gmf_known_field
  version: '1.0'
  applicable_bundles:
  - google_map_field
  checks:
  - kind: must_contain_any
    values:
    - field_gmf_known
  scoring:
    combine: all_pass
- id: google_map_field_gmf_create_field
  version: '1.0'
  applicable_bundles:
  - google_map_field
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
- id: google_map_field_gmf_set_apikey
  version: '1.0'
  applicable_bundles:
  - google_map_field
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
