metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: google_api_client
  version: 4.8.x
  note: 'Google API PHP Client is an integration layer over google/apiclient. It has NO live Google credentials
    on this site, so every medium/hard case is grounded in the module''s account entities + config, never
    in real API calls. Two account types: google_api_client (CONTENT entity, base_table google_api_client;
    OAuth accounts with client_id/client_secret/developer_key/services/scopes; access token kept in State)
    and google_api_service_client (CONFIG entity, config prefix google_api_client.google_api_service_client.<id>,
    keys id/label/auth_config/services/scopes; server-to-server service accounts). One permission: administer
    google api settings. Services google_api_client.client / google_api_service_client.client expose setGoogleApiClient()
    + getServiceObjects(). Easy cases quiz the account model, admin route/permission, and the service
    API; medium cases read back a seeded service-account config entity''s services and scopes; hard cases
    build a service-account config entity and an OAuth account content entity, verified against live entity/config
    state (no Google call required to create them).'
questions:
- id: google_api_client-account-types
  input: The Drupal google_api_client module provides two kinds of Google accounts. What is the difference
    between a 'google_api_client' account and a 'google_api_service_client' account, and which one is
    used for server-to-server access without user consent?
  criteria: google_api_client is an OAuth2 (three-legged) account requiring interactive user consent;
    google_api_service_client is a service account (server-to-server) that authenticates from a JSON key
    (auth_config) with no user interaction. The service account (google_api_service_client) is used for
    server-to-server access.
  bundle: google_api_client
  rubric_ref: rubric/google_api_client_google_api_client_account_types@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: google_api_client-admin-location
  input: On a Drupal site with google_api_client enabled, where do I manage Google OAuth accounts and
    what permission is required to administer them?
  criteria: Manage accounts at /admin/config/services/google_api_client (service accounts at /admin/config/services/google_api_service_client;
    settings/Scan Library at /admin/structure/google_api_client_settings). All of it requires the 'administer
    google api settings' permission.
  bundle: google_api_client
  rubric_ref: rubric/google_api_client_google_api_client_admin_location@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: google_api_client-get-service-object
  input: Using the google_api_client module programmatically, how do I obtain a usable Google service
    object (for example Google Calendar) for a configured account so I can make API calls?
  criteria: Get the google_api_client.client service, call setGoogleApiClient($account) to load and authenticate
    the account, then getServiceObjects() returns [service_name => Google\Service\* object] (e.g. a Google\Service\Calendar).
    Real API calls still require valid Google credentials and a completed OAuth flow.
  bundle: google_api_client
  rubric_ref: rubric/google_api_client_google_api_client_get_service_object@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: google_api_client-inspect-services
  input: This site has a google_api_client service account (google_api_service_client config entity) with
    the id 'gapi_probe'. Inspect the live configuration and list which Google services it is configured
    to use.
  criteria: 'Reading config google_api_client.google_api_service_client.gapi_probe: its services are drive
    and calendar.'
  bundle: google_api_client
  rubric_ref: rubric/google_api_client_google_api_client_inspect_services@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/google_api_client-service-account-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/google_api_client-service-account-cleanup.sh
- id: google_api_client-inspect-scope
  input: On this site, the google_api_client service account with id 'gapi_scope' is configured with a
    single OAuth scope. Read the live configuration and tell me exactly which scope it is.
  criteria: 'Config google_api_client.google_api_service_client.gapi_scope has scopes: [https://www.googleapis.com/auth/spreadsheets.readonly].'
  bundle: google_api_client
  rubric_ref: rubric/google_api_client_google_api_client_inspect_scope@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/google_api_client-scope-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/google_api_client-scope-cleanup.sh
- id: google_api_client-build-service-account
  input: On this Drupal site, use the google_api_client module to create a Google service account (a google_api_service_client
    config entity) with the machine name 'gapi_task', a non-empty auth_config (service-account JSON),
    and the 'drive' service enabled. Apply it to the live site.
  criteria: Create a google_api_service_client config entity gapi_task, e.g. GoogleApiServiceClient::create(['id'=>'gapi_task','label'=>'...','auth_config'=>'{...}','services'=>['drive'],'scopes'=>[...]])->save(),
    so config google_api_client.google_api_service_client.gapi_task exists with the drive service and
    a non-empty auth_config.
  bundle: google_api_client
  rubric_ref: rubric/google_api_client_google_api_client_build_service_account@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/google_api_client-build-service-account-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/google_api_client-build-service-account-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/google_api_client-build-service-account-verify.sh
- id: google_api_client-build-oauth-account
  input: On this Drupal site, use the google_api_client module to create an OAuth2 Google API Client account
    (a google_api_client content entity) named 'gapi_oauth' with a client_id and client_secret set. Apply
    it to the live site.
  criteria: Create a google_api_client content entity with name 'gapi_oauth' and a non-empty client_id
    and client_secret, e.g. GoogleApiClient::create(['name'=>'gapi_oauth','client_id'=>'...apps.googleusercontent.com','client_secret'=>'...','services'=>[...]])->save().
    The account then exists in the google_api_client table with those credentials (it need not be authenticated
    with Google).
  bundle: google_api_client
  rubric_ref: rubric/google_api_client_google_api_client_build_oauth_account@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/google_api_client-build-oauth-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/google_api_client-build-oauth-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/google_api_client-build-oauth-verify.sh
