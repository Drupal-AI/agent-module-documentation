rubrics:
- id: google_api_client_google_api_client_account_types
  version: '1.0'
  applicable_bundles:
  - google_api_client
  checks:
  - kind: must_contain_any
    values:
    - service account
    - google_api_service_client
    - service_client
  scoring:
    combine: all_pass
- id: google_api_client_google_api_client_admin_location
  version: '1.0'
  applicable_bundles:
  - google_api_client
  checks:
  - kind: must_contain_any
    values:
    - admin/config/services/google_api_client
    - administer google api settings
  scoring:
    combine: all_pass
- id: google_api_client_google_api_client_get_service_object
  version: '1.0'
  applicable_bundles:
  - google_api_client
  checks:
  - kind: must_contain_any
    values:
    - getServiceObjects
    - google_api_client.client
    - setGoogleApiClient
  scoring:
    combine: all_pass
- id: google_api_client_google_api_client_inspect_services
  version: '1.0'
  applicable_bundles:
  - google_api_client
  checks:
  - kind: must_contain_any
    values:
    - drive
    - calendar
  scoring:
    combine: all_pass
- id: google_api_client_google_api_client_inspect_scope
  version: '1.0'
  applicable_bundles:
  - google_api_client
  checks:
  - kind: must_contain_any
    values:
    - https://www.googleapis.com/auth/spreadsheets.readonly
    - spreadsheets.readonly
  scoring:
    combine: all_pass
- id: google_api_client_google_api_client_build_service_account
  version: '1.0'
  applicable_bundles:
  - google_api_client
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
- id: google_api_client_google_api_client_build_oauth_account
  version: '1.0'
  applicable_bundles:
  - google_api_client
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
