rubrics:
- id: google_cse_google_cse_search_plugin
  version: '1.0'
  applicable_bundles:
  - google_cse
  checks:
  - kind: must_contain_any
    values:
    - google_cse_search
    - /admin/config/search/pages
    - search pages
  scoring:
    combine: all_pass
- id: google_cse_google_cse_cx_key
  version: '1.0'
  applicable_bundles:
  - google_cse
  checks:
  - kind: must_contain_any
    values:
    - cx
    - configuration.cx
    - search.page
  scoring:
    combine: all_pass
- id: google_cse_google_cse_results_display
  version: '1.0'
  applicable_bundles:
  - google_cse
  checks:
  - kind: must_contain_any
    values:
    - here
    - google
  scoring:
    combine: all_pass
- id: google_cse_google_cse_permission
  version: '1.0'
  applicable_bundles:
  - google_cse
  checks:
  - kind: must_contain_any
    values:
    - search Google CSE
    - View Google Programmable Search
  scoring:
    combine: all_pass
- id: google_cse_google_cse_known_cx
  version: '1.0'
  applicable_bundles:
  - google_cse
  checks:
  - kind: must_contain_any
    values:
    - eval-known-778899:sampleengine
  scoring:
    combine: all_pass
- id: google_cse_google_cse_layout
  version: '1.0'
  applicable_bundles:
  - google_cse
  checks:
  - kind: must_contain_any
    values:
    - two-column
  scoring:
    combine: all_pass
- id: google_cse_google_cse_create_page_layman
  version: '1.0'
  applicable_bundles:
  - google_cse
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
- id: google_cse_google_cse_create_page_expert
  version: '1.0'
  applicable_bundles:
  - google_cse
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
