metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: hreflang
  version: 1.16.x
  note: 'Hreflang is a small module: one page-attachments hook, a three-key config object, a config settings
    form, and a config-save cache-clearing subscriber. Cases are `recipe` (response-graded) probing documented
    facts an agent would otherwise read source to answer; no site mutation.'
questions:
- id: hreflang-what-it-adds
  input: On a multilingual Drupal 11 site, what exactly does the Hreflang module add to a page, and how
    does that differ from Drupal core Content Translation?
  criteria: It adds <link rel="alternate" hreflang="…" href="…"> tags to every page for each enabled language,
    whereas core Content Translation adds hreflang tags only to translated entity pages.
  bundle: hreflang
  rubric_ref: rubric/hreflang_hreflang_what_it_adds@1.0
  tags:
  - mode:recipe
- id: hreflang-x-default
  input: I want an additional hreflang="x-default" tag pointing at my site's default language. Which Hreflang
    setting enables it, and what config object holds it?
  criteria: Enable the x_default key (default true) on the hreflang.settings config object; add the setting
    via the form at /admin/config/search/hreflang or drush cset hreflang.settings x_default 1.
  bundle: hreflang
  rubric_ref: rubric/hreflang_hreflang_x_default@1.0
  tags:
  - mode:recipe
- id: hreflang-x-default-fallback
  input: Which Hreflang setting makes the x-default tag point at the configured fallback (selected) language
    instead of the site default language?
  criteria: The x_default_fallback key (default true) on hreflang.settings points the x-default tag at
    the language.negotiation selected_langcode fallback language when one is configured.
  bundle: hreflang
  rubric_ref: rubric/hreflang_hreflang_x_default_fallback@1.0
  tags:
  - mode:recipe
- id: hreflang-defer-content-translation
  input: How do I make Hreflang stop adding per-language tags on content entity pages and let core Content
    Translation handle them instead, and what is the caching trade-off?
  criteria: 'Enable defer_to_content_translation (default false) on hreflang.settings; Hreflang then adds
    only the x-default tag on entity pages. Trade-off: Content Translation omits query args from its tags
    (invalid tag set on query-arg pages) but improves cache efficiency.'
  bundle: hreflang
  rubric_ref: rubric/hreflang_hreflang_defer_content_translation@1.0
  tags:
  - mode:recipe
- id: hreflang-config-route
  input: What is the admin path and route for the Hreflang settings form, and which permission gates it?
  criteria: The form is at /admin/config/search/hreflang (route hreflang.admin_settings, under Search
    and metadata), gated by the 'administer site configuration' permission.
  bundle: hreflang
  rubric_ref: rubric/hreflang_hreflang_config_route@1.0
  tags:
  - mode:recipe
- id: hreflang-alter-tags
  input: In a custom Drupal module I want to modify or remove the hreflang tags Hreflang adds. Hreflang
    has no API of its own — which core hooks do I implement?
  criteria: Implement hook_language_switch_links_alter() (changes the source language-switch links) or
    hook_page_attachments_alter() (edits the generated html_head_link entries); Hreflang provides no module-specific
    hook.
  bundle: hreflang
  rubric_ref: rubric/hreflang_hreflang_alter_tags@1.0
  tags:
  - mode:recipe
- id: hreflang-multilingual-requirement
  input: On a single-language Drupal site, will the Hreflang module output any hreflang tags? And are
    tags added on 404/403 pages?
  criteria: No — hreflang_page_attachments() returns early when the site is not multilingual, and it also
    skips 403/404 (exception) pages, so no hreflang tags are emitted in those cases.
  bundle: hreflang
  rubric_ref: rubric/hreflang_hreflang_multilingual_requirement@1.0
  tags:
  - mode:recipe
- id: hreflang-settings-cache-clear
  input: When I change Hreflang settings, why do the new hreflang tags appear immediately without a manual
    cache clear?
  criteria: The hreflang.config_subscriber (HreflangConfigSubscriber) listens on config save and, when
    any of the three keys change, invalidates the http_response cache tag so page caches are rebuilt with
    the new settings.
  bundle: hreflang
  rubric_ref: rubric/hreflang_hreflang_settings_cache_clear@1.0
  tags:
  - mode:recipe
