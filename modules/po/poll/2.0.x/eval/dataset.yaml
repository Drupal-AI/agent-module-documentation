metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: poll
  version: 2.0.x
  note: 'Poll (formerly Drupal core, now contrib; documented release 2.0.0-alpha5 — ALPHA/pre-stable).
    Defines two content entity types, `poll` (question + per-poll voting settings) and `poll_choice` (an
    answer option referenced by the poll''s unlimited-cardinality `choice` field); votes are rows in the
    `poll_vote` table (not entities), managed by the `poll_vote.storage` service. Ships one block `poll_recent_block`
    ("Most recent poll") and 9 permissions; `poll.settings` is a stub config form. Three tiers: easy/recipe
    (response-graded facts from 2.0.x/agent/), medium/introspection (a setup script creates a KNOWN poll
    entity, the agent inspects the live site via drush to report its question/choices, a cleanup script
    deletes it), hard/execution (a reset script clears matching polls, the agent CREATES a poll entity
    with a specific question + 2+ choices, active, on the live site, and a verify script checks live state
    — reset -> model -> verify).'
questions:
- id: poll-entities
  input: On a Drupal 11 site using the Poll module, which content entity types does the module define,
    and how are a poll's answer options stored and referenced?
  criteria: 'Poll defines two content entity types: `poll` (the question plus voting settings) and `poll_choice`
    (a single answer option). A poll references its options through its unlimited-cardinality `choice`
    entity_reference field (target_type poll_choice).'
  bundle: poll
  rubric_ref: rubric/poll_poll_entities@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: poll-votes-storage
  input: On a Drupal 11 Poll site, where are individual votes stored — are they entities? — and which
    service reads and writes them?
  criteria: Votes are NOT entities; they are rows in the `poll_vote` database table (choice id, uid/hostname,
    timestamp), read and written through the `poll_vote.storage` service (Drupal\poll\PollVoteStorage)
    via methods like getVotes(), getTotalVotes(), saveVote() and cancelVote().
  bundle: poll
  rubric_ref: rubric/poll_poll_votes_storage@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: poll-block-permissions
  input: On a Drupal 11 Poll site, which block does the module provide, and which permission must a user
    have to view a poll and cast a vote?
  criteria: The module ships one block, `poll_recent_block` ("Most recent poll"), which renders the newest
    open poll in a theme region. Viewing polls and voting requires the `access polls` permission ("View
    polls").
  bundle: poll
  rubric_ref: rubric/poll_poll_block_permissions@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: poll-introspect-known
  input: This Drupal site already has a poll configured (drush available). Inspect the running site and
    tell me the poll's exact question and list every answer choice it offers.
  criteria: 'The poll question is "Which JavaScript framework do you prefer? [eval-known]" and it offers
    three choices: React, Vue and Svelte (read from the poll entity''s `choice` field / poll_choice entities).'
  bundle: poll
  rubric_ref: rubric/poll_poll_introspect_known@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    persona: drupal-expert
    setup: agent-module-documentation/evaluation/verify/poll-known-poll-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/poll-known-poll-cleanup.sh
- id: poll-introspect-choice-count
  input: On this Drupal site there is a published, active poll about JavaScript frameworks (drush available).
    Inspect the running site and tell me how many answer choices it has and whether it is currently open
    for voting.
  criteria: The poll has 3 choices (React, Vue, Svelte) and is active/open for voting (its `active` field
    is 1 and `status` is published).
  bundle: poll
  rubric_ref: rubric/poll_poll_introspect_choice_count@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    persona: drupal-expert
    setup: agent-module-documentation/evaluation/verify/poll-known-poll-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/poll-known-poll-cleanup.sh
- id: poll-create-fourday-week
  input: On this Drupal site (drush available), use the Poll module to create a new poll that asks "Should
    we adopt a four-day work week?" with exactly two choices, "Yes" and "No". Make it published and active
    (open for voting). Create it as a real `poll` entity on the live site; don't just describe it. One-line
    summary.
  criteria: A `poll` content entity exists whose question is "Should we adopt a four-day work week?",
    is published and active, and references two poll_choice entities labelled Yes and No. Verified against
    live site state.
  bundle: poll
  rubric_ref: rubric/poll_poll_create_fourday_week@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/poll-fourday-week-reset.sh
    verify: agent-module-documentation/evaluation/verify/poll-fourday-week-verify.sh
- id: poll-create-favorite-language
  input: 'On this Drupal site (drush available), use the Poll module to create a new active, published
    poll asking "What is your favorite programming language?" with three choices: Python, Rust and Go.
    Save it as a real `poll` entity on the live site; don''t just describe it. One-line summary.'
  criteria: 'A `poll` content entity exists whose question is "What is your favorite programming language?",
    is published and active, and references three poll_choice entities: Python, Rust and Go. Verified
    against live site state.'
  bundle: poll
  rubric_ref: rubric/poll_poll_create_favorite_language@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/poll-favorite-language-reset.sh
    verify: agent-module-documentation/evaluation/verify/poll-favorite-language-verify.sh
