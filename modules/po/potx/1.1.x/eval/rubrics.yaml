rubrics:
- id: potx_potx_drush_command
  version: '1.0'
  applicable_bundles:
  - potx
  checks:
  - kind: must_contain_any
    values:
    - potx
    - single
    - multiple
    - core
  scoring:
    combine: all_pass
- id: potx_potx_extract_ui
  version: '1.0'
  applicable_bundles:
  - potx
  checks:
  - kind: must_contain_any
    values:
    - /admin/config/regional/translate/extract
    - translate interface
    - Extract
  scoring:
    combine: all_pass
- id: potx_potx_output_format
  version: '1.0'
  applicable_bundles:
  - potx
  checks:
  - kind: must_contain_any
    values:
    - .pot
    - Gettext
    - msgid
    - template
  scoring:
    combine: all_pass
- id: potx_potx_configured_languages
  version: '1.0'
  applicable_bundles:
  - potx
  checks:
  - kind: must_contain_any
    values:
    - de
    - German
  scoring:
    combine: all_pass
- id: potx_potx_translator_role
  version: '1.0'
  applicable_bundles:
  - potx
  checks:
  - kind: must_contain_any
    values:
    - potx_translator
  scoring:
    combine: all_pass
- id: potx_potx_extract_potx
  version: '1.0'
  applicable_bundles:
  - potx
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
- id: potx_potx_extract_locale
  version: '1.0'
  applicable_bundles:
  - potx
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
