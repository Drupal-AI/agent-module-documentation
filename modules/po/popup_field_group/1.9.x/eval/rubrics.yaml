rubrics:
- id: popup_field_group_popup_field_group_plugin_id
  version: '1.0'
  applicable_bundles:
  - popup_field_group
  checks:
  - kind: must_contain_any
    values:
    - popup
    - Add group
    - field group
    - Manage display
    - Manage form display
  scoring:
    combine: all_pass
- id: popup_field_group_popup_field_group_contexts
  version: '1.0'
  applicable_bundles:
  - popup_field_group
  checks:
  - kind: must_contain_any
    values:
    - both
    - form
    - view
  scoring:
    combine: all_pass
- id: popup_field_group_popup_field_group_settings
  version: '1.0'
  applicable_bundles:
  - popup_field_group
  checks:
  - kind: must_contain_any
    values:
    - modal
    - popup_link
    - position
    - close
    - title
  scoring:
    combine: all_pass
- id: popup_field_group_popup_field_group_known_group
  version: '1.0'
  applicable_bundles:
  - popup_field_group
  checks:
  - kind: must_contain_any
    values:
    - popup
    - Open the gallery
  scoring:
    combine: all_pass
- id: popup_field_group_popup_field_group_modal_setting
  version: '1.0'
  applicable_bundles:
  - popup_field_group
  checks:
  - kind: must_contain_any
    values:
    - non-modal
    - not modal
    - modal is 0
    - 'modal: 0'
    - modal=0
    - '0'
    - 'false'
    - 'no'
  scoring:
    combine: all_pass
- id: popup_field_group_popup_field_group_add_form
  version: '1.0'
  applicable_bundles:
  - popup_field_group
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
- id: popup_field_group_popup_field_group_add_view
  version: '1.0'
  applicable_bundles:
  - popup_field_group
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
