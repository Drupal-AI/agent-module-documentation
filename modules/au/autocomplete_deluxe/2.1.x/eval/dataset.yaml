metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: autocomplete_deluxe
  version: 2.1.x
  note: 'autocomplete_deluxe ships a single field widget (plugin id `autocomplete_deluxe`) for entity_reference
    fields, rendering a jQuery UI chip/tag box. There is no global settings form — configuration lives
    on each field''s entity_form_display component (`field.widget.settings.autocomplete_deluxe`). Recipe
    cases are response-graded. Medium cases install a known field whose form display uses the widget and
    require live introspection. Hard cases build live config: switch a field''s form-display widget to
    autocomplete_deluxe with a specific setting, verified against real entity_form_display state.'
questions:
- id: autocomplete-deluxe-widget-id
  input: On a Drupal 11 site I want to replace core's plain taxonomy autocomplete on a Tags field with
    a nicer jQuery UI tag-box (chips). Which contrib module provides this, what is the exact field-widget
    plugin id I select on Manage form display, and which field type(s) can it be applied to?
  criteria: The Autocomplete Deluxe module. Its widget plugin id is `autocomplete_deluxe` (label "Autocomplete
    Deluxe"), and it applies to entity_reference fields (e.g. taxonomy term reference / Tags fields).
    It declares multiple_values = TRUE so one box holds all values.
  bundle: autocomplete_deluxe
  rubric_ref: rubric/autocomplete_deluxe_autocomplete_deluxe_widget_id@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: autocomplete-deluxe-settings
  input: For the Drupal autocomplete_deluxe field widget, which per-field settings control (a) whether
    matching is prefix or substring, (b) how many suggestions are shown, (c) the minimum characters before
    the list opens, and (d) whether editors may create brand-new referenced terms? Give the setting keys
    and their default values.
  criteria: match_operator (default CONTAINS; STARTS_WITH for prefix), match_limit (default 10; 0 = no
    limit), min_length (default 0), and new_terms (default false, free tagging). Stored under the form-display
    component settings, schema field.widget.settings.autocomplete_deluxe.
  bundle: autocomplete_deluxe
  rubric_ref: rubric/autocomplete_deluxe_autocomplete_deluxe_settings@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: autocomplete-deluxe-no-settings-form
  input: Where do I configure the autocomplete_deluxe widget in Drupal — is there a dedicated admin settings
    page for the module, and does it define any Drush commands or permissions of its own?
  criteria: There is no global admin settings form (configure is null) and no Drush commands or module-specific
    permissions. You configure it per field on Structure > Content types > Manage form display, which
    stores the widget on the field's entity_form_display component. The autocomplete route uses the core
    'access content' permission.
  bundle: autocomplete_deluxe
  rubric_ref: rubric/autocomplete_deluxe_autocomplete_deluxe_no_settings_form@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: autocomplete-deluxe-known-widget
  input: 'A taxonomy-tags reference field has been added to the Article content type on this site and
    its edit-form widget was customized. Inspect the Article node form-display configuration and tell
    me: which field widget is configured for that field, and what are its match operator, minimum length,
    and new-terms settings?'
  criteria: The field node.article.field_ac_intro uses the `autocomplete_deluxe` widget on the default
    form display, with settings match_operator = STARTS_WITH, min_length = 3, and new_terms = true.
  bundle: autocomplete_deluxe
  rubric_ref: rubric/autocomplete_deluxe_autocomplete_deluxe_known_widget@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/autocomplete_deluxe-known-widget-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/autocomplete_deluxe-known-widget-cleanup.sh
- id: autocomplete-deluxe-known-widget-field-type
  input: This site has an Article field (field_ac_intro) whose node-form widget is Autocomplete Deluxe.
    Inspect the live configuration and tell me what underlying FIELD TYPE that field is and what entity
    type it references — i.e. what kind of field the autocomplete_deluxe widget is being used on here.
  criteria: field_ac_intro is an entity_reference field targeting taxonomy_term (a taxonomy term reference),
    multi-value (cardinality -1); the autocomplete_deluxe widget only applies to entity_reference fields.
  bundle: autocomplete_deluxe
  rubric_ref: rubric/autocomplete_deluxe_autocomplete_deluxe_known_widget_field_type@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/autocomplete_deluxe-known-widget-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/autocomplete_deluxe-known-widget-cleanup.sh
- id: autocomplete-deluxe-configure-newterms
  input: On this Drupal site, configure the Article content type's default node edit form so the taxonomy
    term reference field field_eval_ac uses the Autocomplete Deluxe widget (plugin id autocomplete_deluxe)
    instead of its current core widget, and enable free tagging so editors can add brand-new terms (the
    new_terms setting). Apply it live so the entity_form_display reflects the change.
  criteria: The node.article.default entity_form_display component for field_eval_ac has type = autocomplete_deluxe
    with settings.new_terms = true.
  bundle: autocomplete_deluxe
  rubric_ref: rubric/autocomplete_deluxe_autocomplete_deluxe_configure_newterms@1.0
