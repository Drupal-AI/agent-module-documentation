metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: auditfiles
  version: 4.2.x
  note: 'Audit Files provides seven admin reports under /admin/reports/auditfiles that reconcile files
    on disk vs the file_managed and file_usage tables vs content references, with batch fix actions. Its
    settings live in the config object auditfiles.settings (keys: auditfiles_file_system_path, auditfiles_exclude_files/_extensions/_paths,
    auditfiles_include_domains, auditfiles_report_options_items_per_page/_maximum_records/_date_format,
    auditfiles_merge_file_references_show_single_file_names). Configure route auditfiles.configuration
    at /admin/config/system/auditfiles. Two permissions: ''access audit files reports'', ''configure audit
    files reports''. No Drush commands. Fix logic is dispatched as events (src/Event/*, handled by AuditFilesListener)
    and exposed as per-report auditor services (auditfiles.auditor.*). Medium/hard cases read/write the
    real auditfiles.settings config, verified against live config; shipped defaults are restored explicitly
    on cleanup.'
questions:
- id: auditfiles-what-it-does
  input: What does the Drupal Audit Files (auditfiles) module do, and roughly what database tables or
    file locations does it compare?
  criteria: It provides admin reports that compare the physical files in the files directory, the file_managed
    and file_usage database tables, and file references in content, and lets you correct the mismatches
    (delete, add, merge) via batch operations.
  bundle: auditfiles
  rubric_ref: rubric/auditfiles_auditfiles_what_it_does@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: auditfiles-settings-location
  input: Where is the Audit Files module configured in a Drupal site, and what is the name of its settings
    configuration object?
  criteria: Settings are at /admin/config/system/auditfiles (route auditfiles.configuration, permission
    'configure audit files reports'), stored in the config object auditfiles.settings.
  bundle: auditfiles
  rubric_ref: rubric/auditfiles_auditfiles_settings_location@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: auditfiles-report-names
  input: In the Drupal Audit Files module, which report lists files that exist in the files directory
    on the server but are not recorded in the file_managed database table?
  criteria: The 'Not in database' report (route auditfiles.reports.notindatabase, /admin/reports/auditfiles/notindatabase)
    lists files on the server that are not in file_managed; from it you can delete the file or add it
    to file_managed.
  bundle: auditfiles
  rubric_ref: rubric/auditfiles_auditfiles_report_names@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: auditfiles-known-items-per-page
  input: On this Drupal site, the Audit Files reports have been configured with a specific number of items
    per page. Inspect the live configuration and state that value.
  criteria: 'It is 17: auditfiles.settings -> auditfiles_report_options_items_per_page = 17.'
  bundle: auditfiles
