rubrics:
- id: automated_crop_ac_image_effect
  version: '1.0'
  applicable_bundles:
  - automated_crop
  checks:
  - kind: must_contain_any
    values:
    - automated_crop
    - crop_type
    - automatic_crop_provider
  scoring:
    combine: all_pass
- id: automated_crop_ac_plugin_type
  version: '1.0'
  applicable_bundles:
  - automated_crop
  checks:
  - kind: must_contain_any
    values:
    - plugin.manager.automated_crop
    - AbstractAutomatedCrop
    - automated_crop_default
  scoring:
    combine: all_pass
- id: automated_crop_ac_requires_crop
  version: '1.0'
  applicable_bundles:
  - automated_crop
  checks:
  - kind: must_contain_any
    values:
    - crop
    - no settings
    - no configure
    - image style
  scoring:
    combine: all_pass
- id: automated_crop_ac_known_crop_type
  version: '1.0'
  applicable_bundles:
  - automated_crop
  checks:
  - kind: must_contain_any
    values:
    - freeform
  scoring:
    combine: all_pass
- id: automated_crop_ac_known_provider
  version: '1.0'
  applicable_bundles:
  - automated_crop
  checks:
  - kind: must_contain_any
    values:
    - automated_crop_default
  scoring:
    combine: all_pass
- id: automated_crop_ac_add_effect
  version: '1.0'
  applicable_bundles:
  - automated_crop
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
- id: automated_crop_ac_build_style
  version: '1.0'
  applicable_bundles:
  - automated_crop
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
