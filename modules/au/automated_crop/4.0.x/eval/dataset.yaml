metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: automated_crop
  version: 4.0.x
  note: 'Automated Crop is an API + one image effect; it has no settings form, configure route, permission,
    config schema, or Drush. Its config lives on image styles: the image effect plugin id ''automated_crop''
    (AutomatedCropEffect) stores data.crop_type (a crop module crop_type id) and data.automatic_crop_provider
    (an AutomatedCrop plugin id, default automated_crop_default). It defines the AutomatedCrop plugin
    type (manager plugin.manager.automated_crop, dir Plugin/AutomatedCrop, annotation @AutomatedCrop,
    interface AutomatedCropInterface, base AbstractAutomatedCrop, fallback automated_crop_default) and
    integrates with the crop module via AUTOMATIC_CROP / AUTOMATIC_CROP_PROVIDERS event subscribers. Requires
    the crop module (crop types focal_point and freeform exist on this site). Medium/hard cases build/read
    real image.style.* effect config: introspection reads a style''s crop_type/provider; execution adds
    the automated_crop effect to a style and builds a new style with it, verified against the live ImageStyle
    effects.'
questions:
- id: ac-image-effect
  input: How do I use the Drupal automated_crop module to automatically crop images through an image style?
    Name the image effect it provides and the two configuration values that effect needs.
  criteria: Add the 'Automated Crop' image effect (plugin id automated_crop) to an image style. Its config
    is crop_type (a crop module crop type providing the aspect ratio/limits) and automatic_crop_provider
    (which AutomatedCrop plugin computes the crop; default automated_crop_default).
  bundle: automated_crop
  rubric_ref: rubric/automated_crop_ac_image_effect@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: ac-plugin-type
  input: The automated_crop module defines a plugin type for cropping strategies. What is the manager
    service, the base class to extend, and the id of the default/fallback plugin?
  criteria: Manager service plugin.manager.automated_crop; implement an @AutomatedCrop plugin in Plugin/AutomatedCrop
    by extending Drupal\automated_crop\AbstractAutomatedCrop (interface AutomatedCropInterface). The default
    and fallback plugin id is automated_crop_default (a centred crop sized from the aspect ratio).
  bundle: automated_crop
  rubric_ref: rubric/automated_crop_ac_plugin_type@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: ac-requires-crop
  input: Does the automated_crop module have its own admin settings page, and what other contrib module
    does it depend on to store crops?
  criteria: It has no settings/configure page (configure=null); configuration lives on the image style's
    Automated Crop effect and on Crop Type entities. It requires the contrib 'crop' module (plus core
    image/user), and saves crop entities via the crop module's AUTOMATIC_CROP event.
  bundle: automated_crop
  rubric_ref: rubric/automated_crop_ac_requires_crop@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: ac-known-crop-type
  input: On this Drupal site there is an image style named ac_known that uses the automated_crop module's
    Automated Crop effect. Inspect the live image style configuration and report which crop type that
    effect is configured to use.
  criteria: The ac_known image style's automated_crop effect has data.crop_type = freeform.
  bundle: automated_crop
  rubric_ref: rubric/automated_crop_ac_known_crop_type@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/ac-known-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/ac-known-cleanup.sh
- id: ac-known-provider
  input: The image style ac_known on this site has an Automated Crop effect. Inspect its live configuration
    and report which automatic crop provider (AutomatedCrop plugin) it is set to use.
  criteria: The ac_known automated_crop effect has data.automatic_crop_provider = automated_crop_default
    (the default centred-crop provider).
  bundle: automated_crop
  rubric_ref: rubric/automated_crop_ac_known_provider@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/ac-known-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/ac-known-cleanup.sh
- id: ac-add-effect
  input: On this Drupal site there is an image style with machine name ac_task that currently has no effects.
    Using the automated_crop module, add its Automated Crop image effect to this style, configured with
    a valid crop type (e.g. focal_point or freeform). Apply the change to the live image style.
  criteria: The ac_task image style has an effect with id 'automated_crop' whose data.crop_type is a real
    crop type (e.g. $style->addImageEffect(['id'=>'automated_crop','data'=>['crop_type'=>'focal_point','automatic_crop_provider'=>'automated_crop_default']]);
    $style->save()).
  bundle: automated_crop
  rubric_ref: rubric/automated_crop_ac_add_effect@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/ac-add-effect-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/ac-add-effect-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/ac-add-effect-verify.sh
- id: ac-build-style
  input: Create a new image style with machine name ac_build on this Drupal site, and give it an Automated
    Crop effect (from the automated_crop module) that crops using the 'freeform' crop type. Apply it to
    the live site.
  criteria: An image style ac_build exists with an 'automated_crop' effect whose data.crop_type is 'freeform'
    (create the style, add the Automated Crop effect with crop type freeform, and save).
  bundle: automated_crop
  rubric_ref: rubric/automated_crop_ac_build_style@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: site-builder
    reset: agent-module-documentation/evaluation/verify/ac-build-style-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/ac-build-style-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/ac-build-style-verify.sh
