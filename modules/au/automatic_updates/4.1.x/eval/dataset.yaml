metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: automatic_updates
  version: 4.1.x
  note: Automatic Updates builds on core Package Manager to update Drupal core, adds a cron/unattended
    runner, a config object, and pre-update validators plus readiness checks. Cases are `recipe` (response-graded)
    probing documented facts an agent would otherwise read source to answer; no site mutation.
questions:
- id: au-package-manager-dependency
  input: How does the Automatic Updates module actually apply a Drupal core update without breaking the
    live site, and which core module does it depend on to do so?
  criteria: It depends on core's Package Manager module; it stages the Composer change in a temporary
    sandbox copy of the site (via a SandboxManagerBase), then commits it back live, entering maintenance
    mode only briefly.
  bundle: automatic_updates
  rubric_ref: rubric/automatic_updates_au_package_manager_dependency@1.0
  tags:
  - mode:recipe
- id: au-unattended-level
  input: On a Drupal 11 site I want cron to automatically apply only security releases of Drupal core.
    Which config object and key do I set, and to what value?
  criteria: 'Set unattended.level to ''security'' on automatic_updates.settings (options: disable, security,
    patch). unattended.method controls web vs console.'
  bundle: automatic_updates
  rubric_ref: rubric/automatic_updates_au_unattended_level@1.0
  tags:
  - mode:recipe
- id: au-pushbutton-vs-cron
  input: What is the difference between push-button and unattended updates in Automatic Updates, and what
    makes unattended updates run?
  criteria: Push-button = the 'Update now' flow from the Available updates report (UpdateSandboxManager).
    Unattended = CronUpdateRunner, which decorates core's cron service and launches a detached background
    update after cron when unattended.level is not disable.
  bundle: automatic_updates
  rubric_ref: rubric/automatic_updates_au_pushbutton_vs_cron@1.0
  tags:
  - mode:recipe
- id: au-readiness-checks
  input: Where do the 'Update readiness' status checks come from in Automatic Updates, and which service
    runs them?
  criteria: The StatusChecker service (Validation\StatusChecker) runs the Package Manager validators outside
    an update, caches results, and surfaces them on the site Status report / admin messages; failures
    can be emailed during cron.
  bundle: automatic_updates
  rubric_ref: rubric/automatic_updates_au_readiness_checks@1.0
  tags:
  - mode:recipe
- id: au-permission
  input: Which permission gates the Automatic Updates 'Update now' and status pages, and does the module
    define its own permissions?
  criteria: The core 'administer software updates' permission gates all its routes; the module defines
    no permissions of its own (no permissions.yml).
  bundle: automatic_updates
  rubric_ref: rubric/automatic_updates_au_permission@1.0
  tags:
  - mode:recipe
- id: au-slated-for-core
  input: Is the Automatic Updates contrib module a permanent add-on, and how does it relate to updating
    contributed modules and themes?
  criteria: 'It is the Automatic Updates Initiative''s contrib home and is slated to move into Drupal
    core. Contrib module/theme updates were handled by the Automatic Updates Extensions sub-module, now
    lifecycle: obsolete because that functionality moved into the main module.'
  bundle: automatic_updates
  rubric_ref: rubric/automatic_updates_au_slated_for_core@1.0
  tags:
  - mode:recipe
- id: au-custom-validator
  input: I want to add my own rule that blocks a core update unless a condition is met. How do I extend
    Automatic Updates / Package Manager to do this?
  criteria: Register a Package Manager event-subscriber validator (like the module's VersionPolicyValidator,
    StagedProjectsValidator, etc.) subscribing to lifecycle events (PreCreate/PreApply/StatusCheck) and
    add ValidationResults; don't subclass the internal sandbox managers.
  bundle: automatic_updates
  rubric_ref: rubric/automatic_updates_au_custom_validator@1.0
  tags:
  - mode:recipe
