metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: auto_entityqueue
  version: 3.0.x
  note: 'Auto Entityqueue extends the entityqueue module. Via hook_form_alter it adds an ''Auto Entityqueue''
    fieldset (checkboxes auto_add and insert_front) to the entity queue add/edit form, stored inside the
    queue''s entity_settings.handler_settings.auto_entityqueue. Via hook_entity_insert it adds each newly
    created entity (of the queue''s target type + target_bundles) to every subqueue of every enabled queue
    whose auto_add is on (prepending when insert_front, honoring max_size as a rolling window). No configure
    route, permission, Drush, or config schema of its own; state lives on the EntityQueue config entity
    (entity_queue.*). Medium/hard cases are grounded in real queue config: introspection reads whether
    a seeded queue inserts at front and which bundle it targets; execution enables auto_add (and insert_front)
    on a queue, verified against the live entity_queue config.'
questions:
- id: aeq-where-configured
  input: How do I make Drupal automatically add new content to an Entityqueue using the auto_entityqueue
    module, and where is that setting configured?
  criteria: On the Entityqueue's add/edit form, tick 'Automatically add entities to queue' in the Auto
    Entityqueue fieldset. It is stored on the queue config entity at entity_settings.handler_settings.auto_entityqueue.auto_add.
    New entities of the queue's target type/bundles are then added on creation.
  bundle: auto_entityqueue
  rubric_ref: rubric/auto_entityqueue_aeq_where_configured@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: aeq-insert-front
  input: With auto_entityqueue, by default are auto-added entities placed at the front or back of the
    queue, and how do I change that?
  criteria: By default items are appended at the back of the queue; tick 'Insert entities at front of
    queue' (insert_front) to prepend them instead. Stored at entity_settings.handler_settings.auto_entityqueue.insert_front.
  bundle: auto_entityqueue
  rubric_ref: rubric/auto_entityqueue_aeq_insert_front@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: aeq-trigger
  input: When does auto_entityqueue add an entity to a queue, and which queues does it consider?
  criteria: It acts on entity creation via hook_entity_insert (not on updates). It adds the entity to
    every enabled queue whose target type matches, whose target_bundles include the entity's bundle, and
    whose auto_add is on, appending to (or, with insert_front, prepending to) each of that queue's subqueues;
    it honors max_size as a rolling window.
  bundle: auto_entityqueue
  rubric_ref: rubric/auto_entityqueue_aeq_trigger@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: aeq-front-or-back
  input: On this Drupal site there is an entityqueue with machine id 'aeq_known' that auto-adds new content.
    Inspect the live queue configuration and state whether it inserts auto-added entities at the front
    or the back of the queue.
  criteria: 'Front: entity_queue.aeq_known has handler_settings.auto_entityqueue.insert_front = true (auto_add
    is also true).'
  bundle: auto_entityqueue
  rubric_ref: rubric/auto_entityqueue_aeq_front_or_back@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/auto_entityqueue-intro-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/auto_entityqueue-intro-cleanup.sh
- id: aeq-target-bundle
  input: The entityqueue 'aeq_known' on this site auto-adds new content of one content type. Inspect the
    live queue configuration and name the target content type (bundle) it auto-adds.
  criteria: 'article: entity_queue.aeq_known has entity_settings.target_type node with handler_settings.target_bundles
    including ''article''.'
  bundle: auto_entityqueue
  rubric_ref: rubric/auto_entityqueue_aeq_target_bundle@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/auto_entityqueue-intro-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/auto_entityqueue-intro-cleanup.sh
- id: aeq-enable-autoadd
  input: On this Drupal site there is an entityqueue with machine id 'aeq_task'. Using the auto_entityqueue
    module, configure it so new matching entities are automatically added to the queue. Apply the change
    to the live site.
  criteria: entity_queue.aeq_task entity_settings.handler_settings.auto_entityqueue.auto_add = true (e.g.
    load the EntityQueue, set that key in entity_settings, and save).
  bundle: auto_entityqueue
  rubric_ref: rubric/auto_entityqueue_aeq_enable_autoadd@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/auto_entityqueue-configure-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/auto_entityqueue-configure-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/auto_entityqueue-autoadd-verify.sh
- id: aeq-enable-front
  input: On this Drupal site, configure the entityqueue with machine id 'aeq_task' via the auto_entityqueue
    module so that new matching entities are automatically added AND inserted at the front of the queue.
    Apply the change to the live site.
  criteria: entity_queue.aeq_task entity_settings.handler_settings.auto_entityqueue has auto_add = true
    AND insert_front = true.
  bundle: auto_entityqueue
  rubric_ref: rubric/auto_entityqueue_aeq_enable_front@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/auto_entityqueue-configure-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/auto_entityqueue-configure-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/auto_entityqueue-front-verify.sh
