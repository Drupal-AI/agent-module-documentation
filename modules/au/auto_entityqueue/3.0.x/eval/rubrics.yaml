rubrics:
- id: auto_entityqueue_aeq_where_configured
  version: '1.0'
  applicable_bundles:
  - auto_entityqueue
  checks:
  - kind: must_contain_any
    values:
    - auto_add
    - Auto Entityqueue
    - entityqueue
    - auto
  scoring:
    combine: all_pass
- id: auto_entityqueue_aeq_insert_front
  version: '1.0'
  applicable_bundles:
  - auto_entityqueue
  checks:
  - kind: must_contain_any
    values:
    - insert_front
    - front
    - back
  scoring:
    combine: all_pass
- id: auto_entityqueue_aeq_trigger
  version: '1.0'
  applicable_bundles:
  - auto_entityqueue
  checks:
  - kind: must_contain_any
    values:
    - hook_entity_insert
    - insert
    - created
    - creation
  scoring:
    combine: all_pass
- id: auto_entityqueue_aeq_front_or_back
  version: '1.0'
  applicable_bundles:
  - auto_entityqueue
  checks:
  - kind: must_contain_any
    values:
    - front
  scoring:
    combine: all_pass
- id: auto_entityqueue_aeq_target_bundle
  version: '1.0'
  applicable_bundles:
  - auto_entityqueue
  checks:
  - kind: must_contain_any
    values:
    - article
  scoring:
    combine: all_pass
- id: auto_entityqueue_aeq_enable_autoadd
  version: '1.0'
  applicable_bundles:
  - auto_entityqueue
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
- id: auto_entityqueue_aeq_enable_front
  version: '1.0'
  applicable_bundles:
  - auto_entityqueue
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
