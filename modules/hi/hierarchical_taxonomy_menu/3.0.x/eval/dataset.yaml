metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: hierarchical_taxonomy_menu
  version: 3.0.x
  note: 'Hierarchical Taxonomy Menu provides one Block plugin (id hierarchical_taxonomy_menu, category
    Menus) that renders a taxonomy vocabulary''s term hierarchy as a nested, optionally collapsible menu.
    All config is on the block instance (block.block.<id> settings; schema block.settings.hierarchical_taxonomy_menu).
    Required setting: vocabulary. Others: max_depth (0-10 or 100=unlimited), collapsible/stay_open/interactive_parent,
    base_term/dynamic_base_term, image settings, show_count/referencing_field/exclude_empty_terms, dynamic_block_title,
    hide_block, max_age. No global settings page, no permissions; requires core taxonomy. Medium/hard
    cases are grounded in a real block placement in the olivero theme using the site''s ''tags'' vocabulary:
    introspection reads a placed block''s vocabulary and collapsible setting; execution places a block
    for the tags vocabulary and enables collapsible, verified against the live block config. Blocks namespaced
    htm_*.'
questions:
- id: hierarchical_taxonomy_menu-how-to
  input: How do you create a menu from taxonomy terms with the hierarchical_taxonomy_menu module in Drupal?
    What do you place and what is the key setting?
  criteria: Place the 'Hierarchical Taxonomy Menu' block (plugin id hierarchical_taxonomy_menu) via Block
    layout and set its 'vocabulary' setting to the vocabulary you want the menu built from.
  bundle: hierarchical_taxonomy_menu
  rubric_ref: rubric/hierarchical_taxonomy_menu_hierarchical_taxonomy_menu_how_to@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: hierarchical_taxonomy_menu-base-term
  input: In the hierarchical_taxonomy_menu block, which settings let you limit the menu to only part of
    a vocabulary (a subtree) and control how many sublevels are shown?
  criteria: base_term (and dynamic_base_term) limit the menu to the children of a chosen term / the current
    term's subtree; max_depth controls how many sublevels are shown (0-10, or 100 for unlimited).
  bundle: hierarchical_taxonomy_menu
  rubric_ref: rubric/hierarchical_taxonomy_menu_hierarchical_taxonomy_menu_base_term@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: hierarchical_taxonomy_menu-features
  input: Besides plain links, what optional presentation features does the hierarchical_taxonomy_menu
    block support (e.g. collapsing, images, counts)?
  criteria: It can be collapsible (collapsible/stay_open/interactive_parent), show a term image next to
    each item (sized by px or an image_style), and show a count of referencing nodes/commerce products
    per term (show_count/exclude_empty_terms).
  bundle: hierarchical_taxonomy_menu
  rubric_ref: rubric/hierarchical_taxonomy_menu_hierarchical_taxonomy_menu_features@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: hierarchical_taxonomy_menu-vocabulary-introspection
  input: On this Drupal site there is a Hierarchical Taxonomy Menu block placed. Which taxonomy vocabulary
    is that block configured to build its menu from? Inspect the live block configuration.
  criteria: tags - the block htm_med_vocab (plugin hierarchical_taxonomy_menu) has settings.vocabulary
    = 'tags'.
  bundle: hierarchical_taxonomy_menu
  rubric_ref: rubric/hierarchical_taxonomy_menu_hierarchical_taxonomy_menu_vocabulary_introspection@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/hierarchical_taxonomy_menu-vocabulary-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/hierarchical_taxonomy_menu-vocabulary-cleanup.sh
- id: hierarchical_taxonomy_menu-collapsible-introspection
  input: On this Drupal site, is the placed Hierarchical Taxonomy Menu block (htm_med_collapse) collapsed
    by default? Inspect the live block configuration and state the collapsible setting.
  criteria: Yes - block.block.htm_med_collapse settings.collapsible is TRUE (the menu is collapsible by
    default).
  bundle: hierarchical_taxonomy_menu
  rubric_ref: rubric/hierarchical_taxonomy_menu_hierarchical_taxonomy_menu_collapsible_introspection@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/hierarchical_taxonomy_menu-collapsible-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/hierarchical_taxonomy_menu-collapsible-cleanup.sh
- id: hierarchical_taxonomy_menu-place-block
  input: On this Drupal site, place a Hierarchical Taxonomy Menu block that builds its menu from the 'tags'
    taxonomy vocabulary. Apply the placement to the live site (the Olivero theme is the default front-end
    theme).
  criteria: A block config entity using plugin hierarchical_taxonomy_menu with settings.vocabulary = 'tags'
    exists (e.g. Block::create(['plugin'=>'hierarchical_taxonomy_menu','theme'=>'olivero','region'=>...,
    'settings'=>[...'vocabulary'=>'tags']])->save()).
  bundle: hierarchical_taxonomy_menu
  rubric_ref: rubric/hierarchical_taxonomy_menu_hierarchical_taxonomy_menu_place_block@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/hierarchical_taxonomy_menu-place-block-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/hierarchical_taxonomy_menu-place-block-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/hierarchical_taxonomy_menu-place-block-verify.sh
- id: hierarchical_taxonomy_menu-enable-collapsible
  input: On this Drupal site, the Hierarchical Taxonomy Menu block 'htm_task' currently shows its menu
    fully expanded. Change its configuration so the menu is collapsible (collapsed by default). Apply
    the change to the live block.
  criteria: block.block.htm_task settings.collapsible is set to TRUE (e.g. load the Block, set settings.collapsible
    = TRUE and save).
  bundle: hierarchical_taxonomy_menu
  rubric_ref: rubric/hierarchical_taxonomy_menu_hierarchical_taxonomy_menu_enable_collapsible@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
