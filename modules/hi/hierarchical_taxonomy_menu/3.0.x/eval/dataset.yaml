    reset: agent-module-documentation/evaluation/verify/hierarchical_taxonomy_menu-enable-collapsible-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/hierarchical_taxonomy_menu-enable-collapsible-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/hierarchical_taxonomy_menu-enable-collapsible-verify.sh
