rubrics:
- id: hierarchical_taxonomy_menu_hierarchical_taxonomy_menu_how_to
  version: '1.0'
  applicable_bundles:
  - hierarchical_taxonomy_menu
  checks:
  - kind: must_contain_any
    values:
    - block
    - vocabulary
    - Block layout
    - block layout
  scoring:
    combine: all_pass
- id: hierarchical_taxonomy_menu_hierarchical_taxonomy_menu_base_term
  version: '1.0'
  applicable_bundles:
  - hierarchical_taxonomy_menu
  checks:
  - kind: must_contain_any
    values:
    - base_term
    - max_depth
  scoring:
    combine: all_pass
- id: hierarchical_taxonomy_menu_hierarchical_taxonomy_menu_features
  version: '1.0'
  applicable_bundles:
  - hierarchical_taxonomy_menu
  checks:
  - kind: must_contain_any
    values:
    - collapsible
    - image
    - show_count
    - count
  scoring:
    combine: all_pass
- id: hierarchical_taxonomy_menu_hierarchical_taxonomy_menu_vocabulary_introspection
  version: '1.0'
  applicable_bundles:
  - hierarchical_taxonomy_menu
  checks:
  - kind: must_contain_any
    values:
    - tags
  scoring:
    combine: all_pass
- id: hierarchical_taxonomy_menu_hierarchical_taxonomy_menu_collapsible_introspection
  version: '1.0'
  applicable_bundles:
  - hierarchical_taxonomy_menu
  checks:
  - kind: must_contain_any
    values:
    - 'true'
    - collapsible
    - 'yes'
    - enabled
    - '1'
  scoring:
    combine: all_pass
- id: hierarchical_taxonomy_menu_hierarchical_taxonomy_menu_place_block
  version: '1.0'
  applicable_bundles:
  - hierarchical_taxonomy_menu
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
- id: hierarchical_taxonomy_menu_hierarchical_taxonomy_menu_enable_collapsible
  version: '1.0'
  applicable_bundles:
  - hierarchical_taxonomy_menu
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
