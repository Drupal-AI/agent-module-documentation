metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: altcha_obfuscate
  version: 1.2.x
  note: 'ALTCHA Obfuscate (submodule of altcha) provides three field formatters chosen on Manage display
    (entity_view_display): altcha_obfuscated_email (email fields, mailto:), altcha_obfuscated_telephone
    (telephone, tel:), altcha_obfuscated_string (string). The value is AES-256-GCM encrypted (ObfuscationUtility,
    ext-openssl) and rendered inside an ALTCHA obfuscation-plugin widget with a ''Click to reveal'' proof-of-work
    button. Per-formatter setting: reveal_text_override (schema field.formatter.settings.altcha_obfuscated_*).
    Global keys in altcha.settings: obfuscate_reveal_text, obfuscate_max_number, obfuscate_library_override.
    No configure route/permission/drush. Medium/hard cases create namespaced fields (field_aobf_*) on
    node.article and read/set the view-display formatter type + settings, or read the global obfuscate_reveal_text;
    all restore baseline.'
questions:
- id: ao-formatters
  input: Which field formatters does the altcha_obfuscate module provide, and which field types does each
    one work on?
  criteria: altcha_obfuscated_email (email fields, mailto:), altcha_obfuscated_telephone (telephone fields,
    tel:), and altcha_obfuscated_string (string fields). You pick one on the field's Manage display.
  bundle: altcha_obfuscate
  rubric_ref: rubric/altcha_obfuscate_ao_formatters@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: ao-how-it-works
  input: How does altcha_obfuscate hide a field's value from bots, and what does a real visitor do to
    see it?
  criteria: The value is AES-256-GCM encrypted server-side (ObfuscationUtility::encrypt) and rendered
    inside an ALTCHA obfuscation-plugin widget, so the plaintext isn't in the HTML. A visitor clicks 'Click
    to reveal' and the browser solves a proof-of-work to decrypt and show it.
  bundle: altcha_obfuscate
  rubric_ref: rubric/altcha_obfuscate_ao_how_it_works@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: ao-settings
  input: In altcha_obfuscate, what per-formatter setting can you change, and which global ALTCHA settings
    influence the obfuscation (reveal text and complexity)?
  criteria: 'Per-formatter: reveal_text_override (overrides the reveal button text for that field). Global
    (altcha.settings): obfuscate_reveal_text (default reveal text), obfuscate_max_number (obfuscation
    complexity), obfuscate_library_override.'
  bundle: altcha_obfuscate
  rubric_ref: rubric/altcha_obfuscate_ao_settings@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: ao-known-formatter
  input: The Article content type on this site has an email field field_aobf_email whose display is protected
    by altcha_obfuscate. Inspect the live default view display and state which field formatter is applied
    to field_aobf_email.
  criteria: 'field_aobf_email uses the altcha_obfuscated_email formatter: in core.entity_view_display.node.article.default
    its component type is altcha_obfuscated_email.'
  bundle: altcha_obfuscate
  rubric_ref: rubric/altcha_obfuscate_ao_known_formatter@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/altcha_obfuscate-known-formatter-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/altcha_obfuscate-known-formatter-cleanup.sh
- id: ao-reveal-text
  input: The global reveal-button text for ALTCHA obfuscation has been customized on this site. Inspect
    the live altcha.settings configuration and report the configured obfuscate_reveal_text value.
  criteria: altcha.settings obfuscate_reveal_text is 'Show me'.
  bundle: altcha_obfuscate
  rubric_ref: rubric/altcha_obfuscate_ao_reveal_text@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/altcha_obfuscate-reveal-text-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/altcha_obfuscate-reveal-text-cleanup.sh
- id: ao-apply-string
  input: The Article content type has a string field field_aobf_task that currently displays as plain
    text. Using altcha_obfuscate, change its default display so the value is obfuscated (hidden behind
    ALTCHA until revealed), and apply it to the live site.
  criteria: Set the field_aobf_task component's formatter type to altcha_obfuscated_string in core.entity_view_display.node.article.default
    (via Manage display, or $vd->setComponent('field_aobf_task', ['type' => 'altcha_obfuscated_string',
    ...])->save()).
  bundle: altcha_obfuscate
  rubric_ref: rubric/altcha_obfuscate_ao_apply_string@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/altcha_obfuscate-apply-string-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/altcha_obfuscate-apply-string-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/altcha_obfuscate-apply-string-verify.sh
- id: ao-apply-email-reveal
  input: On the Article content type, hide the email field field_aobf_mail from bots using altcha_obfuscate,
    and make its reveal button say 'Show address'. Apply the change to the live default display.
  criteria: Set field_aobf_mail's formatter to altcha_obfuscated_email with settings.reveal_text_override
    = 'Show address' in core.entity_view_display.node.article.default.
  bundle: altcha_obfuscate
  rubric_ref: rubric/altcha_obfuscate_ao_apply_email_reveal@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: site-owner
    reset: agent-module-documentation/evaluation/verify/altcha_obfuscate-apply-email-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/altcha_obfuscate-apply-email-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/altcha_obfuscate-apply-email-verify.sh
