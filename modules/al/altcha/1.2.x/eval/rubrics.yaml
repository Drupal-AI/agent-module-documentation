rubrics:
- id: altcha_altcha_how_it_works
  version: '1.0'
  applicable_bundles:
  - altcha
  checks:
  - kind: must_contain_any
    values:
    - proof-of-work
    - proof of work
    - ALTCHA
    - hook_captcha
    - captcha
  scoring:
    combine: all_pass
- id: altcha_altcha_secret_key
  version: '1.0'
  applicable_bundles:
  - altcha
  checks:
  - kind: must_contain_any
    values:
    - altcha-hmac-key
    - State
    - SecretManager
    - secret_manager
    - install
  scoring:
    combine: all_pass
- id: altcha_altcha_integration_types
  version: '1.0'
  applicable_bundles:
  - altcha
  checks:
  - kind: must_contain_any
    values:
    - self_hosted
    - self-hosted
    - sentinel
    - saas
    - /admin/config/people/captcha/altcha
  scoring:
    combine: all_pass
- id: altcha_altcha_complexity
  version: '1.0'
  applicable_bundles:
  - altcha
  checks:
  - kind: must_contain_any
    values:
    - '50000'
  scoring:
    combine: all_pass
- id: altcha_altcha_floating_mode
  version: '1.0'
  applicable_bundles:
  - altcha
  checks:
  - kind: must_contain_any
    values:
    - bottom
  scoring:
    combine: all_pass
- id: altcha_altcha_place_on_form
  version: '1.0'
  applicable_bundles:
  - altcha
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
- id: altcha_altcha_generate_secret
  version: '1.0'
  applicable_bundles:
  - altcha
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
