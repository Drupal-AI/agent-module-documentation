metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: all_in_one_accessibility
  version: 1.5.x
  note: 'All in One Accessibility embeds a hosted third-party (Skynet Technologies) accessibility widget
    on every page via hook_library_info_build + hook_page_attachments (external script id aioa-adawidget).
    The accessibility FEATURES are remote; everything configurable locally is in the config object all_in_one_accessibility.userid.settings
    (userid = licence token, colorcode, position [default bottom_right], widget_size [regularsize], aioa_icon_type
    [aioa-icon-type-1], aioa_icon_size, statement_link, custom size/position flags, nofreeversion). Settings
    UI /admin/config/development/all-in-one-accessibility/ada_compliance (route all_in_one_accessibility.admin.allinoneaccessiblity,
    permission all_in_one_accessibility_settings). There is NO config/install default, so the object does
    not exist until first saved. Since the widget is an external integration, all medium/hard cases are
    grounded in that local config object (never on the remote widget). Baseline: the config object is
    absent (unsaved); reset/cleanup delete it to restore that baseline.'
questions:
- id: all-in-one-accessibility-settings-location
  input: On a Drupal site with all_in_one_accessibility enabled, where do I configure the widget, which
    permission is required, and what config object stores the settings?
  criteria: Configure at /admin/config/development/all-in-one-accessibility/ada_compliance (route all_in_one_accessibility.admin.allinoneaccessiblity),
    which needs the all_in_one_accessibility_settings permission. Settings are stored in the config object
    all_in_one_accessibility.userid.settings.
  bundle: all_in_one_accessibility
  rubric_ref: rubric/all_in_one_accessibility_all_in_one_accessibility_settings_location@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: all-in-one-accessibility-embedding
  input: How does all_in_one_accessibility actually add the accessibility toolbar to my site — does the
    module implement the features itself?
  criteria: No — it embeds a hosted third-party JavaScript widget from Skynet Technologies (skynettechnologies.com).
    hook_library_info_build() builds a library whose JS is that external script (with the licence token,
    colour and position in the query string, DOM id aioa-adawidget), and hook_page_attachments() attaches
    it to every page. The accessibility features run in the remote widget, not in this module.
  bundle: all_in_one_accessibility
  rubric_ref: rubric/all_in_one_accessibility_all_in_one_accessibility_embedding@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: all-in-one-accessibility-key-fields
  input: In all_in_one_accessibility, which config field holds the licence token, and what field/default
    controls where the accessibility button appears?
  criteria: The licence token is stored in the 'userid' field of all_in_one_accessibility.userid.settings.
    The button corner is the 'position' field (default bottom_right; other values like bottom_left, top_right,
    top_left). colorcode sets the colour and widget_size (default regularsize) the button size.
  bundle: all_in_one_accessibility
  rubric_ref: rubric/all_in_one_accessibility_all_in_one_accessibility_key_fields@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: all-in-one-accessibility-configured-position
  input: On this site, in which corner is the All in One Accessibility widget configured to appear, and
    what licence token is set? Inspect the live configuration.
  criteria: all_in_one_accessibility.userid.settings has position = bottom_left and userid = AIOA-EVAL-TOKEN-123
    on this site.
  bundle: all_in_one_accessibility
  rubric_ref: rubric/all_in_one_accessibility_all_in_one_accessibility_configured_position@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/all_in_one_accessibility-configured-position-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/all_in_one_accessibility-configured-position-cleanup.sh
- id: all-in-one-accessibility-widget-size
  input: What widget/button size is All in One Accessibility currently configured to use on this site?
    Inspect the live configuration and give the value of the relevant field.
  criteria: all_in_one_accessibility.userid.settings:widget_size is 'oversize' on this site (colorcode
    is also set).
  bundle: all_in_one_accessibility
  rubric_ref: rubric/all_in_one_accessibility_all_in_one_accessibility_widget_size@1.0
