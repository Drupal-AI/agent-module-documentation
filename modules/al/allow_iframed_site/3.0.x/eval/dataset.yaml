metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: allow_iframed_site
  version: 3.0.x
  note: 'Allow site to be iframed removes the X-Frame-Options response header on selected paths so those
    pages can be embedded in an <iframe>. A response event subscriber (RemoveXFrameOptionsSubscriber,
    priority -10 on KernelEvents::RESPONSE) evaluates core''s request_path condition and removes the header
    on matching responses. Configuration lives in allow_iframed_site.settings under the request_path key:
    pages (newline path list) and negate (0/1). The settings form is /admin/config/system/allow_iframed_site
    (permission administer site configuration); saving it flushes all caches. If pages is empty and negate
    is 0 the header is kept (no-op). The module ships no config/install and no config schema - the config
    is created on first save. It manages only X-Frame-Options, not CSP frame-ancestors. Medium cases read
    the live request_path config; hard cases set it (allow a path; negate to allow-everywhere-except),
    verified live. Baseline is restored by deleting allow_iframed_site.settings.'
questions:
- id: allow_iframed_site-which-header
  input: What does the Drupal allow_iframed_site module do to let a page be embedded in an iframe? Name
    the specific HTTP response header involved.
  criteria: It removes the X-Frame-Options response header on the paths you select (via a response event
    subscriber), so those pages are no longer blocked from being framed by other origins.
  bundle: allow_iframed_site
  rubric_ref: rubric/allow_iframed_site_allow_iframed_site_which_header@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: allow_iframed_site-where-configured
  input: Using allow_iframed_site, how do I choose which paths are allowed to be iframed, and where is
    that stored?
  criteria: On the settings form at /admin/config/system/allow_iframed_site (permission 'administer site
    configuration') you enter paths using core's Request path condition (a Pages list plus a Negate toggle).
    It is stored in allow_iframed_site.settings under the request_path key (pages + negate).
  bundle: allow_iframed_site
  rubric_ref: rubric/allow_iframed_site_allow_iframed_site_where_configured@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: allow_iframed_site-caveat
  input: What is the security risk of using allow_iframed_site to remove X-Frame-Options, and what does
    the negate option do?
  criteria: 'Removing X-Frame-Options re-exposes those pages to clickjacking (the module warns ''Watch
    out for clickjacking!''), so scope the paths tightly. The Negate option inverts the match: with negate
    on, the header is stripped everywhere EXCEPT the listed pages.'
  bundle: allow_iframed_site
  rubric_ref: rubric/allow_iframed_site_allow_iframed_site_caveat@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: allow_iframed_site-read-pages
  input: On this Drupal site, allow_iframed_site is configured so that certain paths can be embedded in
    an iframe. Inspect the live configuration and list the path(s) that are allowed to be framed.
  criteria: 'The framable paths are /aisframe-demo and /aisframe-demo/*: allow_iframed_site.settings.request_path.pages
    = "/aisframe-demo\n/aisframe-demo/*" with negate off.'
  bundle: allow_iframed_site
  rubric_ref: rubric/allow_iframed_site_allow_iframed_site_read_pages@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/allow_iframed_site-read-pages-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/allow_iframed_site-read-pages-cleanup.sh
- id: allow_iframed_site-read-negate
  input: On this Drupal site, inspect the allow_iframed_site configuration. Is framing allowed only on
    the listed path, or everywhere except it? Explain what the current request_path setting means.
  criteria: 'Negate is on: allow_iframed_site.settings.request_path has negate = true and pages = /np-except,
    so X-Frame-Options is removed (framing allowed) everywhere EXCEPT /np-except.'
  bundle: allow_iframed_site
  rubric_ref: rubric/allow_iframed_site_allow_iframed_site_read_negate@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/allow_iframed_site-read-negate-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/allow_iframed_site-read-negate-cleanup.sh
- id: allow_iframed_site-allow-embed
  input: On this Drupal site, use the allow_iframed_site module to allow the path /embed-ok to be embedded
    in an iframe (remove X-Frame-Options for that path only, without negating). Apply the change to the
    live site.
  criteria: Set allow_iframed_site.settings.request_path.pages to include /embed-ok with negate off (via
    the Request path condition on /admin/config/system/allow_iframed_site, or by saving the request_path
    config). The response subscriber then removes X-Frame-Options on /embed-ok.
  bundle: allow_iframed_site
  rubric_ref: rubric/allow_iframed_site_allow_iframed_site_allow_embed@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/allow_iframed_site-allow-embed-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/allow_iframed_site-allow-embed-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/allow_iframed_site-allow-embed-verify.sh
- id: allow_iframed_site-except-admin
  input: I want my site's pages to be embeddable in iframes everywhere, except I do NOT want the /admin
    area to be framable. Using the 'Allow site to be iframed' module, set that up and make it live.
  criteria: Configure allow_iframed_site.settings.request_path with pages listing /admin and negate =
    true, so X-Frame-Options is removed everywhere except /admin (set via the Pages list + Negate checkbox
    on the settings form, or by saving the request_path config).
  bundle: allow_iframed_site
  rubric_ref: rubric/allow_iframed_site_allow_iframed_site_except_admin@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: site-owner
    reset: agent-module-documentation/evaluation/verify/allow_iframed_site-except-admin-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/allow_iframed_site-except-admin-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/allow_iframed_site-except-admin-verify.sh
