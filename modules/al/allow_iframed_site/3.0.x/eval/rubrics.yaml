rubrics:
- id: allow_iframed_site_allow_iframed_site_which_header
  version: '1.0'
  applicable_bundles:
  - allow_iframed_site
  checks:
  - kind: must_contain_any
    values:
    - X-Frame-Options
  scoring:
    combine: all_pass
- id: allow_iframed_site_allow_iframed_site_where_configured
  version: '1.0'
  applicable_bundles:
  - allow_iframed_site
  checks:
  - kind: must_contain_any
    values:
    - request_path
    - pages
    - /admin/config/system/allow_iframed_site
    - settings form
    - Request path
  scoring:
    combine: all_pass
- id: allow_iframed_site_allow_iframed_site_caveat
  version: '1.0'
  applicable_bundles:
  - allow_iframed_site
  checks:
  - kind: must_contain_any
    values:
    - clickjacking
    - negate
    - except
  scoring:
    combine: all_pass
- id: allow_iframed_site_allow_iframed_site_read_pages
  version: '1.0'
  applicable_bundles:
  - allow_iframed_site
  checks:
  - kind: must_contain_any
    values:
    - /aisframe-demo
  scoring:
    combine: all_pass
- id: allow_iframed_site_allow_iframed_site_read_negate
  version: '1.0'
  applicable_bundles:
  - allow_iframed_site
  checks:
  - kind: must_contain_any
    values:
    - negate
    - except
    - /np-except
  scoring:
    combine: all_pass
- id: allow_iframed_site_allow_iframed_site_allow_embed
  version: '1.0'
  applicable_bundles:
  - allow_iframed_site
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
- id: allow_iframed_site_allow_iframed_site_except_admin
  version: '1.0'
  applicable_bundles:
  - allow_iframed_site
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
