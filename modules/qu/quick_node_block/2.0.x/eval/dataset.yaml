metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: quick_node_block
  version: 2.0.x
  note: 'Quick Node Block provides one block plugin, id quick_node_block (category ''Quick Node Block''),
    that renders a chosen node in a chosen view mode. Config is per placed block: settings.quick_node
    (''Title (nid)'') and settings.quick_display (view mode). No global config page. Local task ''Add
    to Block'' at admin/node/{node}/quick_node_block (permission ''administer blocks''). Medium introspection
    places a block configured with a known node + teaser view mode and the agent reports the view mode;
    hard execution has the agent place a Quick Node Block rendering a fixture node in the ''full'' view
    mode, verified against the live block config. Fixtures create their own namespaced node (qnb_*) and
    block, and remove them in cleanup.'
questions:
- id: quick_node_block-plugin
  input: What does the quick_node_block module add, and what two things do you configure on it when you
    place it in a region?
  criteria: It adds a single block plugin (id quick_node_block, category 'Quick Node Block') that renders
    one node. When placing it you choose a Node (entity autocomplete) and a Display / view mode; these
    are saved as the block settings quick_node ('Title (nid)') and quick_display.
  bundle: quick_node_block
  rubric_ref: rubric/quick_node_block_quick_node_block_plugin@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: quick_node_block-no-config
  input: Does quick_node_block have a central admin settings page? Where does its configuration actually
    live, and how is the rendered node kept up to date and access-controlled?
  criteria: No global settings page (configure is null). All config lives on each placed block (settings.quick_node,
    settings.quick_display). The block renders via the node view builder, defers to the node's 'view'
    access in blockAccess(), and adds a node:<nid> cache tag so it refreshes when the node changes.
  bundle: quick_node_block
  rubric_ref: rubric/quick_node_block_quick_node_block_no_config@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: quick_node_block-add-task
  input: quick_node_block adds a convenience tab on node pages to place that node in a block. What is
    the tab called, its route path, and what permission does it need?
  criteria: The 'Add to Block' local task at admin/node/{node}/quick_node_block (route quick_node_block.quickadd)
    requires the 'administer blocks' permission; it opens the block-add form pre-filled with that node.
  bundle: quick_node_block
  rubric_ref: rubric/quick_node_block_quick_node_block_add_task@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: quick_node_block-known-display
  input: On this site a Quick Node Block has been placed (block id qnb_known_block). Inspect the live
    block configuration and state which node view mode (display) it is set to render.
  criteria: The block block.block.qnb_known_block has settings.quick_display = teaser (and settings.quick_node
    points at the QNB Known node). drush cget block.block.qnb_known_block settings.
  bundle: quick_node_block
  rubric_ref: rubric/quick_node_block_quick_node_block_known_display@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/quick_node_block-known-display-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/quick_node_block-known-display-cleanup.sh
- id: quick_node_block-place-full
  input: This site has an article titled 'QNB Sample'. Using the quick_node_block module, place a Quick
    Node Block (in the default theme) that renders that node using the 'full' view mode. Apply it to the
    live site.
  criteria: A block config entity with plugin quick_node_block exists whose settings.quick_display ===
    'full' and whose settings.quick_node references the QNB Sample node's nid (e.g. 'QNB Sample (N)').
    Placed via Block layout or Block::create([...])->save().
  bundle: quick_node_block
  rubric_ref: rubric/quick_node_block_quick_node_block_place_full@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/quick_node_block-place-full-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/quick_node_block-place-full-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/quick_node_block-place-full-verify.sh
- id: quick_node_block-known-node
  input: On this site a Quick Node Block has been placed (block id qnb_known_node_block). Inspect the
    live block configuration and report the title of the node it is configured to render.
  criteria: The block block.block.qnb_known_node_block has settings.quick_node = 'QNB Featured Item (N)',
    i.e. it renders the node titled 'QNB Featured Item' (drush cget block.block.qnb_known_node_block settings.quick_node).
  bundle: quick_node_block
  rubric_ref: rubric/quick_node_block_quick_node_block_known_node@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/quick_node_block-known-node-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/quick_node_block-known-node-cleanup.sh
- id: quick_node_block-place-teaser
  input: This site has an article titled 'QNB Sample Two'. Using the quick_node_block module, place a
    Quick Node Block (in the default theme) that renders that node using the 'teaser' view mode. Apply
    it to the live site.
  criteria: A block config entity with plugin quick_node_block exists whose settings.quick_display ===
    'teaser' and whose settings.quick_node references the QNB Sample Two node's nid.
  bundle: quick_node_block
  rubric_ref: rubric/quick_node_block_quick_node_block_place_teaser@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/quick_node_block-place-teaser-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/quick_node_block-place-teaser-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/quick_node_block-place-teaser-verify.sh
