metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: quicklink
  version: 3.0.x
  note: Quicklink stores all state in one config object, quicklink.settings (route quicklink.settings
    at admin/config/development/performance/quicklink, permission 'administer site configuration'). No
    plugins, Drush, or permissions. Medium cases write a known value into quicklink.settings and the agent
    reads it back with drush cget; hard cases reset a key to a known baseline and the agent must set it,
    verified with drush cget against quicklink.settings. All scripts touch only quicklink.settings keys.
questions:
- id: quicklink-config-object
  input: On a Drupal 11 site using the Quicklink module, what is the machine name of the configuration
    object that holds all of Quicklink's settings, and at what admin path is its settings form?
  criteria: All settings live in the config object quicklink.settings, edited at admin/config/development/performance/quicklink
    (route quicklink.settings, permission 'administer site configuration').
  bundle: quicklink
  rubric_ref: rubric/quicklink_quicklink_config_object@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: quicklink-anonymous-only
  input: In the Quicklink module, which setting makes the prefetch library load for anonymous users only
    (i.e. not for logged-in users)? Give the config key.
  criteria: The boolean key no_load_when_authenticated in quicklink.settings ('Prefetch for anonymous
    users only'); when TRUE the Quicklink library is not attached for authenticated users.
  bundle: quicklink
  rubric_ref: rubric/quicklink_quicklink_anonymous_only@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: quicklink-exclude
  input: With the Quicklink module, how do I stop certain links from being prefetched - for example ignoring
    admin paths and any URL that contains '/checkout'? Name the relevant settings.
  criteria: Enable ignore_admin_paths (skips /admin and /edit) and add '/checkout' to the newline-separated
    url_patterns_to_ignore list; ignore_selectors can skip links matching a CSS selector. All are keys
    of quicklink.settings.
  bundle: quicklink
  rubric_ref: rubric/quicklink_quicklink_exclude@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: quicklink-known-ignore
  input: This Drupal site has Quicklink installed and configured. Inspect the live configuration and tell
    me the exact URL pattern that has been added to Quicklink's 'URL patterns to ignore' list.
  criteria: 'quicklink.settings.url_patterns_to_ignore is set to ''qlk_secret_path'' (read with: drush
    cget quicklink.settings url_patterns_to_ignore).'
  bundle: quicklink
  rubric_ref: rubric/quicklink_quicklink_known_ignore@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/quicklink-known-ignore-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/quicklink-known-ignore-cleanup.sh
- id: quicklink-known-limit
  input: On this Drupal site, Quicklink's throttle options have been changed from their defaults. Inspect
    the live Quicklink configuration and tell me the configured total request limit.
  criteria: 'quicklink.settings.total_request_limit is 42 (read with: drush cget quicklink.settings total_request_limit).
    The shipped default is 0.'
  bundle: quicklink
  rubric_ref: rubric/quicklink_quicklink_known_limit@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/quicklink-known-limit-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/quicklink-known-limit-cleanup.sh
- id: quicklink-set-anon-ignore
  input: On this Drupal site, configure Quicklink so that the prefetch library loads for anonymous users
    only, and so that it never prefetches any link whose URL contains 'qlk_block_me'. Apply the change
    to the live site.
  criteria: Set quicklink.settings.no_load_when_authenticated to TRUE and add 'qlk_block_me' to url_patterns_to_ignore
    (e.g. via drush php:eval configFactory getEditable set save, or the settings form).
  bundle: quicklink
  rubric_ref: rubric/quicklink_quicklink_set_anon_ignore@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/quicklink-set-anon-ignore-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/quicklink-set-anon-ignore-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/quicklink-set-anon-ignore-verify.sh
- id: quicklink-set-debug-selector
  input: On this Drupal site, turn on Quicklink's debug mode and scope prefetching to only the '.main-content'
    region by overriding Quicklink's parent selector. Apply the change to the live site.
  criteria: Set quicklink.settings.enable_debug_mode to TRUE and selector to '.main-content'.
  bundle: quicklink
  rubric_ref: rubric/quicklink_quicklink_set_debug_selector@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/quicklink-set-debug-selector-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/quicklink-set-debug-selector-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/quicklink-set-debug-selector-verify.sh
