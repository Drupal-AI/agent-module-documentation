metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: queue_ui
  version: 3.2.x
  note: 'Queue UI exposes an admin overview UI, a set of Drush commands, one QueueUI inspection plugin
    type, and a single permission — but no config object. Cases are `recipe` (response-graded): they probe
    documented facts an agent would otherwise read source to answer; no site mutation.'
questions:
- id: queue_ui-overview-route
  input: On a Drupal 11 site I want the admin page that lists every queue and its number of items, where
    I can process or clear a queue. What is the route name and its URL path?
  criteria: The queue_ui.overview_form route at /admin/config/system/queue-ui (Admin → Config → System
    → Queue manager).
  bundle: queue_ui
  rubric_ref: rubric/queue_ui_queue_ui_overview_route@1.0
  tags:
  - mode:recipe
- id: queue_ui-overview-actions
  input: From the Queue UI overview form, what are the three bulk actions I can apply to selected queues?
  criteria: Batch process (run the worker via Batch API), Remove leases (reset lease timestamps), and
    Clear (delete all items after confirmation).
  bundle: queue_ui
  rubric_ref: rubric/queue_ui_queue_ui_overview_actions@1.0
  tags:
  - mode:recipe
- id: queue_ui-drush-process
  input: Which Queue UI Drush command processes a single named queue, and what are its aliases? Also give
    the command to process all queues.
  criteria: drush queue:process [queueName] (aliases qp, queue-process) processes one queue; drush queue:process-all
    (qpa) processes all queues.
  bundle: queue_ui
  rubric_ref: rubric/queue_ui_queue_ui_drush_process@1.0
  tags:
  - mode:recipe
- id: queue_ui-drush-release
  input: Some items in a Drupal queue are stuck with leases from a crashed worker. Which Queue UI Drush
    command resets (releases) the leases, and how do I do it for every queue at once?
  criteria: drush queue:release [queueName] (aliases qr) releases leases on one queue; drush queue:release-all
    (qra) does it for all queues.
  bundle: queue_ui
  rubric_ref: rubric/queue_ui_queue_ui_drush_release@1.0
  tags:
  - mode:recipe
- id: queue_ui-inspect-plugin
  input: I have a custom queue backend and want it to show up under Queue UI's Inspect view. What plugin
    type do I implement, which interface/attribute do I use, and what must match my backend?
  criteria: 'Implement a QueueUI plugin (namespace Plugin/QueueUI) that implements QueueUIInterface /
    extends QueueUIBase, tagged with the #[QueueUI] attribute whose class_name matches your backend''s
    queue class (short or full name). Managed by plugin.manager.queue_ui (QueueUIManager).'
  bundle: queue_ui
  rubric_ref: rubric/queue_ui_queue_ui_inspect_plugin@1.0
  tags:
  - mode:recipe
- id: queue_ui-permission
  input: What is the machine name of the permission Queue UI provides to access the queue manager and
    run/delete queues?
  criteria: The single permission 'admin queue_ui' ("Administer queues") gates the whole Queue UI.
  bundle: queue_ui
  rubric_ref: rubric/queue_ui_queue_ui_permission@1.0
  tags:
  - mode:recipe
- id: queue_ui-config
  input: Does Queue UI have its own configuration settings object, and what is the module's configure
    route?
  criteria: Queue UI provides no config object of its own; its configure route is queue_ui.overview_form
    (the Queue manager overview). The only persisted flag is a State value queue_ui.features.
  bundle: queue_ui
  rubric_ref: rubric/queue_ui_queue_ui_config@1.0
  tags:
  - mode:recipe
