metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: quicktabs_jqueryui
  version: 4.3.x
  note: Submodule of quicktabs; adds one TabRenderer. Cases are `recipe` (response-graded), grounded in
    the 4.3.x docs.
questions:
- id: qtjq-renderer-id
  input: I want a Quick Tabs instance to use the jQuery UI Tabs widget. Which submodule do I enable and
    which renderer id does it add?
  criteria: Enable quicktabs_jqueryui, which registers the ui_tabs TabRenderer; select the 'jquery ui'
    renderer on the quicktabs_instance.
  bundle: quicktabs_jqueryui
  rubric_ref: rubric/quicktabs_jqueryui_qtjq_renderer_id@1.0
  tags:
  - mode:recipe
- id: qtjq-dependency
  input: Which modules must be present for the Quick Tabs jQuery UI renderer to work, and which library
    does it load?
  criteria: It depends on the block module and jquery_ui_tabs (plus the parent quicktabs module); it loads
    the jquery_ui_tabs/tabs library via js/qt_ui_tabs.js.
  bundle: quicktabs_jqueryui
  rubric_ref: rubric/quicktabs_jqueryui_qtjq_dependency@1.0
  tags:
  - mode:recipe
- id: qtjq-no-own-ui
  input: Does the Quick Tabs jQuery UI submodule add its own config, permission, or admin page?
  criteria: No; it adds only the ui_tabs renderer (no config entity, permission, schema options, or Drush
    command). Configure it in the parent Quick Tabs admin at Structure > Quick Tabs (/admin/structure/quicktabs).
  bundle: quicktabs_jqueryui
  rubric_ref: rubric/quicktabs_jqueryui_qtjq_no_own_ui@1.0
  tags:
  - mode:recipe
