metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: quicktabs_accordion
  version: 4.3.x
  note: Submodule of quicktabs; adds one TabRenderer. Cases are `recipe` (response-graded), grounded in
    the 4.3.x docs.
questions:
- id: qta-renderer-id
  input: I want a Quick Tabs instance to display as a jQuery UI accordion. Which submodule do I enable
    and which renderer id does it add?
  criteria: Enable quicktabs_accordion, which registers the accordion_tabs TabRenderer; select the accordion
    renderer on the quicktabs_instance.
  bundle: quicktabs_accordion
  rubric_ref: rubric/quicktabs_accordion_qta_renderer_id@1.0
  tags:
  - mode:recipe
- id: qta-options
  input: What options does the Quick Tabs accordion renderer expose?
  criteria: The accordion_tabs renderer options are `collapsible` (bool, allow all panels closed) and
    `heightStyle` (auto | fill | content).
  bundle: quicktabs_accordion
  rubric_ref: rubric/quicktabs_accordion_qta_options@1.0
  tags:
  - mode:recipe
- id: qta-dependency
  input: Which modules must be present for the Quick Tabs accordion renderer to work?
  criteria: It depends on the block module and jquery_ui_accordion (plus the parent quicktabs module);
    it loads the jquery_ui_accordion/accordion library.
  bundle: quicktabs_accordion
  rubric_ref: rubric/quicktabs_accordion_qta_dependency@1.0
  tags:
  - mode:recipe
- id: qta-no-own-ui
  input: Where do I configure the Quick Tabs accordion — does the submodule add its own admin page?
  criteria: No separate UI; configure it in the parent Quick Tabs admin at Structure > Quick Tabs (/admin/structure/quicktabs)
    by choosing the accordion renderer. The submodule adds no config entity, permission, or Drush command.
  bundle: quicktabs_accordion
  rubric_ref: rubric/quicktabs_accordion_qta_no_own_ui@1.0
  tags:
  - mode:recipe
