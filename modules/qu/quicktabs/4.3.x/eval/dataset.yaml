metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: quicktabs
  version: 4.3.x
  note: 'Quick Tabs is configured through the quicktabs_instance config entity and its admin UI; grounded
    in the 4.3.x docs (data.json, usage.md, agent/). Cases are tiered: easy=recipe (response-graded),
    medium=introspection (setup a known quicktabs_instance, agent inspects live via drush, cleanup after),
    hard=execution (agent builds a quicktabs_instance, verified against live site state).'
questions:
- id: qt-admin-route
  input: On a Drupal 11 site with Quick Tabs enabled, where in the admin UI do I go to create a new tabbed
    block, and what permission gates it?
  criteria: Go to Structure > Quick Tabs (/admin/structure/quicktabs, route quicktabs.admin, the configure
    route) and add an instance; the admin UI and entity forms require the `administer quicktabs` permission.
  bundle: quicktabs
  rubric_ref: rubric/quicktabs_qt_admin_route@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: qt-config-entity
  input: What config entity type does Quick Tabs use to store each tab set, and what is the config name
    pattern?
  criteria: Each tab set is a `quicktabs_instance` config entity, stored as config named quicktabs.quicktabs_instance.{id}
    (schema quicktabs.quicktabs_instance.*).
  bundle: quicktabs
  rubric_ref: rubric/quicktabs_qt_config_entity@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: qt-tab-types
  input: In Quick Tabs, what kinds of content can an individual tab load, and what plugin type controls
    this?
  criteria: A tab's content source is a TabType plugin; built-ins are node_content, block_content, view_content,
    and qtabs_content (another Quick Tabs instance).
  bundle: quicktabs
  rubric_ref: rubric/quicktabs_qt_tab_types@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: qt-renderer-plugin-type
  input: How does Quick Tabs decide whether a tab set renders as classic tabs, jQuery UI tabs, or an accordion?
    Name the plugin type and the built-in ids plus which module provides each.
  criteria: 'The instance''s `renderer` names a TabRenderer plugin: quick_tabs (base module), accordion_tabs
    (quicktabs_accordion submodule), ui_tabs (quicktabs_jqueryui submodule).'
  bundle: quicktabs
  rubric_ref: rubric/quicktabs_qt_renderer_plugin_type@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: qt-add-tabtype
  input: 'I want tabs to be able to load a brand-new kind of content in Quick Tabs. Which plugin do I
    write: attribute, base class, interface methods, and manager service?'
  criteria: 'Create a plugin in Plugin/TabType with the #[TabType(id, name)] attribute, extending Drupal\quicktabs\TabTypeBase
    (TabTypeInterface), implementing optionsForm() and render(); it is discovered by plugin.manager.tab_type.'
  bundle: quicktabs
  rubric_ref: rubric/quicktabs_qt_add_tabtype@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: qt-ajax-and-block
  input: After I save a Quick Tabs instance, how do I actually show it on the site, and how can I make
    each tab load its content over AJAX?
  criteria: Saving derives a block (quicktabs_block:{id}, category QuickTabs) that you place on /admin/structure/block;
    enable the quick_tabs renderer's `ajax` option to load each tab on demand via the quicktabs.ajax_content
    route.
  bundle: quicktabs
  rubric_ref: rubric/quicktabs_qt_ajax_and_block@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: qt-instance-alter
  input: On a Drupal 11 site I need to inject a per-user View argument into a specific Quick Tabs tab
    at render time, and keep caching correct. Which hook do I implement and what must I do about cache
    metadata?
  criteria: 'Implement hook_quicktabs_instance_alter(QuickTabsInstance $qt): modify $qt in place via getConfigurationData()/setConfigurationData(),
    then declare variation with $qt->addCacheContexts([''user'']); it runs once per request on both the
    block and AJAX render paths.'
  bundle: quicktabs
  rubric_ref: rubric/quicktabs_qt_instance_alter@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: qt-remember-tab
  input: Which Quick Tabs instance option re-opens the tab a visitor last clicked on their next visit,
    and what dependency powers it?
  criteria: Enable `remember_last_clicked_tab`; it uses a JS cookie (the required js_cookie module / js-cookie
    library) to reopen the last-clicked tab.
  bundle: quicktabs
  rubric_ref: rubric/quicktabs_qt_remember_tab@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: qt-intro-tab-count
  input: 'A Quick Tabs instance `eval_intro_tabs` already exists on this Drupal site (drush available).
    Inspect the running site and tell me: how many tabs does it have?'
  criteria: The quicktabs_instance `eval_intro_tabs` has 3 tabs configured in its configuration_data.
  bundle: quicktabs
  rubric_ref: rubric/quicktabs_qt_intro_tab_count@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    persona: drupal-expert
    setup: agent-module-documentation/evaluation/verify/quicktabs-intro-tabs-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/quicktabs-intro-tabs-cleanup.sh
- id: qt-intro-renderer
  input: 'A Quick Tabs instance `eval_intro_tabs` already exists on this Drupal site (drush available).
    Inspect the running site and tell me: which renderer does it use?'
  criteria: The quicktabs_instance `eval_intro_tabs` uses the `accordion_tabs` renderer (Quick Tabs Accordion
    submodule).
  bundle: quicktabs
  rubric_ref: rubric/quicktabs_qt_intro_renderer@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
