- id: quicktabs-build-block-tabs
  input: On this Drupal site (drush available), build a Quick Tabs instance with machine name `eval_block_tabs`
    and label `Eval Block Tabs` that uses the accordion renderer (the `accordion_tabs` renderer from the
    Quick Tabs Accordion submodule). Give it TWO tabs, each of the `block_content` tab type, both pointing
    at the core `system_powered_by_block` block plugin. Apply it to the live site so the quicktabs instance
    really exists; don't just describe it. One-line summary.
  criteria: A quicktabs_instance config entity `eval_block_tabs` exists using renderer accordion_tabs
    with two block_content tabs referencing the system_powered_by_block plugin. Verified against live
    site state.
  bundle: quicktabs
  rubric_ref: rubric/quicktabs_quicktabs_build_block_tabs@1.0
  tags:
