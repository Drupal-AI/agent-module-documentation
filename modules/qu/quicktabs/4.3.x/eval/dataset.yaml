    setup: agent-module-documentation/evaluation/verify/quicktabs-intro-tabs-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/quicktabs-intro-tabs-cleanup.sh
- id: qt-intro-tab-titles
  input: 'A Quick Tabs instance `eval_intro_tabs` already exists on this Drupal site (drush available).
    Inspect the running site and tell me: what are its tab titles?'
  criteria: The quicktabs_instance `eval_intro_tabs` has three tabs titled Shipping, Returns, and Warranty
    (in that weight order).
  bundle: quicktabs
  rubric_ref: rubric/quicktabs_qt_intro_tab_titles@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    persona: drupal-expert
    setup: agent-module-documentation/evaluation/verify/quicktabs-intro-tabs-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/quicktabs-intro-tabs-cleanup.sh
- id: quicktabs-build-instance
  input: On this Drupal site (drush available), build a tabbed content widget using Quick Tabs. Create
    a Quick Tabs instance with machine name `eval_tabs` and label `Eval Tabs`, using the default tabs
    renderer, containing at least TWO tabs titled `Tab One` and `Tab Two`, each showing some content.
    Apply it to the live site so the quicktabs instance really exists; don't just describe it. One-line
    summary.
  criteria: A quicktabs_instance config entity `eval_tabs` (label Eval Tabs, renderer quick_tabs) exists
    with at least two tabs in its configuration_data. Verified against live site state.
  bundle: quicktabs
  rubric_ref: rubric/quicktabs_quicktabs_build_instance@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
