metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: queue_unique
  version: 4.0.x
  note: 'queue_unique provides the service queue_unique.database (UniqueQueueDatabaseFactory -> UniqueDatabaseQueue
    extends DatabaseQueue) which stores items in its own ''queue_unique'' table with a unique ''hash''
    key; createItem() returns FALSE and stores nothing on a duplicate. No config, no schema, no permissions,
    no admin UI, no module-specific Drush. Medium/hard cases are grounded in real live queue state: setup/reset
    scripts create/empty unique queues (qu_*) via the service and count rows in the queue_unique table
    (verify/introspection). Item counts are read from the live queue_unique table keyed by queue name.'
questions:
- id: queue_unique-get-queue
  input: In Drupal, how do I get a queue that rejects duplicate items using the queue_unique module, and
    how do I know when an item was rejected as a duplicate?
  criteria: 'Use the service: $queue = \Drupal::service(''queue_unique.database'')->get(''name''); (or
    set $settings[''queue_service_name''] = ''queue_unique.database'' in settings.php and use the normal
    queue service). createItem() returns FALSE (and stores nothing) when the item is a duplicate.'
  bundle: queue_unique
  rubric_ref: rubric/queue_unique_queue_unique_get_queue@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: queue_unique-duplicate-return
  input: With the queue_unique module, what happens when you try to add an item that is already in the
    queue?
  criteria: The duplicate is not added; createItem() returns FALSE. Uniqueness is enforced by a unique
    key on a hash column in the 'queue_unique' table (an IntegrityConstraintViolationException is caught
    and FALSE returned).
  bundle: queue_unique
  rubric_ref: rubric/queue_unique_queue_unique_duplicate_return@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: queue_unique-prefix
  input: The queue_unique module mentions a way to make queue workers use unique queues automatically
    on cron by replacing the core QueueFactory. What queue-name prefix do you use, and what class replaces
    the core queue service?
  criteria: Replace the core 'queue' service with Drupal\queue_unique\QueueFactory; then any queue name
    prefixed 'queue_unique/' (e.g. queue_unique/mymodule_work, or a @QueueWorker plugin id with that prefix)
    is served by queue_unique.database with the prefix stripped.
  bundle: queue_unique
  rubric_ref: rubric/queue_unique_queue_unique_prefix@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: queue_unique-qu-count
  input: On this Drupal site there is a unique queue named qu_known (managed by the queue_unique module).
    Inspect the live site and state how many items are currently in that queue.
  criteria: 'qu_known has 2 items. (Three inserts were attempted but one was an exact duplicate and was
    rejected by the unique queue.) Read via the queue: \Drupal::service(''queue_unique.database'')->get(''qu_known'')->numberOfItems().'
  bundle: queue_unique
  rubric_ref: rubric/queue_unique_queue_unique_qu_count@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/queue_unique-qu-count-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/queue_unique-qu-count-cleanup.sh
- id: queue_unique-qu-which
  input: This site has two unique queues, qu_alpha and qu_beta, both managed by queue_unique. Inspect
    the live queues and state which one currently holds more items.
  criteria: qu_beta holds more (3 items vs qu_alpha's 1). Compare numberOfItems() of each unique queue,
    or count rows per name in the queue_unique table.
  bundle: queue_unique
  rubric_ref: rubric/queue_unique_queue_unique_qu_which@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/queue_unique-qu-which-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/queue_unique-qu-which-cleanup.sh
