  criteria: The queue_unique table has at least one row with name=qu_task, e.g. \Drupal::service('queue_unique.database')->get('qu_task')->createItem($data).
  bundle: queue_unique
  rubric_ref: rubric/queue_unique_queue_unique_qu_add@1.0
