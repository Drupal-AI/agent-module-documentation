rubrics:
- id: queue_unique_queue_unique_get_queue
  version: '1.0'
  applicable_bundles:
  - queue_unique
  checks:
  - kind: must_contain_any
    values:
    - queue_unique.database
    - queue_service_
    - createItem
  scoring:
    combine: all_pass
- id: queue_unique_queue_unique_duplicate_return
  version: '1.0'
  applicable_bundles:
  - queue_unique
  checks:
  - kind: must_contain_any
    values:
    - 'FALSE'
    - 'false'
    - ignored
    - not added
    - no item
    - duplicate
  scoring:
    combine: all_pass
- id: queue_unique_queue_unique_prefix
  version: '1.0'
  applicable_bundles:
  - queue_unique
  checks:
  - kind: must_contain_any
    values:
    - queue_unique/
    - QueueFactory
    - Drupal\queue_unique\QueueFactory
  scoring:
    combine: all_pass
- id: queue_unique_queue_unique_qu_count
  version: '1.0'
  applicable_bundles:
  - queue_unique
  checks:
  - kind: must_contain_any
    values:
    - '2'
  scoring:
    combine: all_pass
- id: queue_unique_queue_unique_qu_which
  version: '1.0'
  applicable_bundles:
  - queue_unique
  checks:
  - kind: must_contain_any
    values:
    - qu_beta
  scoring:
    combine: all_pass
- id: queue_unique_queue_unique_qu_add
  version: '1.0'
  applicable_bundles:
  - queue_unique
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
- id: queue_unique_queue_unique_qu_dedup
  version: '1.0'
  applicable_bundles:
  - queue_unique
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
