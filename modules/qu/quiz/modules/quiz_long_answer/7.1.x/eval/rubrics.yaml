rubrics:
- id: quiz_long_answer_quiz_long_answer_manual_grading
  version: '1.0'
  applicable_bundles:
  - quiz_long_answer
  checks:
  - kind: must_contain_any
    values:
    - manual
    - setEvaluated
    - unevaluated
    - not automatic
    - evaluator
    - grader
  scoring:
    combine: all_pass
- id: quiz_long_answer_quiz_long_answer_rubric_maxscore
  version: '1.0'
  applicable_bundles:
  - quiz_long_answer
  checks:
  - kind: must_contain_any
    values:
    - long_answer_rubric
    - default_max_score
    - '10'
  scoring:
    combine: all_pass
- id: quiz_long_answer_quiz_long_answer_plugin_id
  version: '1.0'
  applicable_bundles:
  - quiz_long_answer
  checks:
  - kind: must_contain_any
    values:
    - long_answer
    - quiz.question.type.long_answer
    - QuizQuestion
  scoring:
    combine: all_pass
- id: quiz_long_answer_quiz_long_answer_read_rubric
  version: '1.0'
  applicable_bundles:
  - quiz_long_answer
  checks:
  - kind: must_contain_any
    values:
    - completeness
  scoring:
    combine: all_pass
- id: quiz_long_answer_quiz_long_answer_create
  version: '1.0'
  applicable_bundles:
  - quiz_long_answer
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
