metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: quiz_long_answer
  version: 7.1.x
  note: 'quiz_long_answer adds the ''long_answer'' (essay) Quiz question type: plugin LongAnswerQuestion
    (#[QuizQuestion(id:''long_answer'')]) + quiz.question.type.long_answer config entity (bundle of quiz_question).
    Fields: long_answer_rubric (text_long grading guidance) and answer_text_processing (boolean). Manually
    graded: LongAnswerResponse::score() calls setEvaluated(FALSE), sending answers to Quiz''s unevaluated-results
    queue; max score defaults to quiz_long_answer.settings:default_max_score (10). Medium/hard cases are
    grounded in real long_answer quiz_question entities.'
questions:
- id: quiz_long_answer-manual-grading
  input: How are Quiz 'Long answer' (essay) questions scored, and where do submitted answers go before
    they get a score?
  criteria: 'Long-answer/essay questions are graded manually: LongAnswerResponse::score() calls setEvaluated(FALSE),
    so answers land in Quiz''s ''unevaluated results'' queue until a user with scoring permission awards
    points (up to the max score).'
  bundle: quiz_long_answer
  rubric_ref: rubric/quiz_long_answer_quiz_long_answer_manual_grading@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: quiz_long_answer-rubric-maxscore
  input: In the Quiz long-answer question type, what field holds grading guidance for the evaluator, and
    what is the default maximum score?
  criteria: The long_answer_rubric (text_long) field holds the grading rubric shown to the evaluator.
    The default maximum score comes from quiz_long_answer.settings:default_max_score, shipped as 10.
  bundle: quiz_long_answer
  rubric_ref: rubric/quiz_long_answer_quiz_long_answer_rubric_maxscore@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: quiz_long_answer-plugin-id
  input: What question-type/plugin id does quiz_long_answer register with Quiz, and which config entity
    must exist for it?
  criteria: 'It registers the ''long_answer'' question plugin (LongAnswerQuestion, #[QuizQuestion(id:''long_answer'')])
    and installs the quiz.question.type.long_answer config entity, a bundle of quiz_question.'
  bundle: quiz_long_answer
  rubric_ref: rubric/quiz_long_answer_quiz_long_answer_plugin_id@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: quiz_long_answer-read-rubric
  input: This Quiz site has a Long answer question titled 'quiz_la_probe'. Inspect the live quiz_question
