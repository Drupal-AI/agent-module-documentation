rubrics:
- id: quiz_short_answer_quiz_short_answer_grading_modes
  version: '1.0'
  applicable_bundles:
  - quiz_short_answer
  checks:
  - kind: must_contain_any
    values:
    - short_answer_evaluation
    - case insensitive
    - regular expression
    - regex
    - manual
  scoring:
    combine: all_pass
- id: quiz_short_answer_quiz_short_answer_correct_field
  version: '1.0'
  applicable_bundles:
  - quiz_short_answer
  checks:
  - kind: must_contain_any
    values:
    - short_answer_correct
    - default_max_score
    - '5'
  scoring:
    combine: all_pass
- id: quiz_short_answer_quiz_short_answer_plugin_id
  version: '1.0'
  applicable_bundles:
  - quiz_short_answer
  checks:
  - kind: must_contain_any
    values:
    - short_answer
    - quiz.question.type.short_answer
    - QuizQuestion
  scoring:
    combine: all_pass
- id: quiz_short_answer_quiz_short_answer_read_answer
  version: '1.0'
  applicable_bundles:
  - quiz_short_answer
  checks:
  - kind: must_contain_any
    values:
    - Paris
  scoring:
    combine: all_pass
- id: quiz_short_answer_quiz_short_answer_create
  version: '1.0'
  applicable_bundles:
  - quiz_short_answer
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
