  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: quiz_short_answer
  version: 7.1.x
  note: 'quiz_short_answer adds the ''short_answer'' Quiz question type: plugin ShortAnswerQuestion (#[QuizQuestion(id:''short_answer'')])
