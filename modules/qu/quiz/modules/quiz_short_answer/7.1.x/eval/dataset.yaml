questions:
- id: quiz_short_answer-grading-modes
  input: In the Quiz module's Short answer question type, what grading modes are available and which field
    selects them?
  criteria: 'The short_answer_evaluation field (list_integer) selects the grading mode: 0 = automatic
    case-sensitive, 1 = automatic case-insensitive, 2 = match against a regular expression, 3 = manual
    grading. The expected answer/pattern is stored in short_answer_correct.'
  bundle: quiz_short_answer
  rubric_ref: rubric/quiz_short_answer_quiz_short_answer_grading_modes@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: quiz_short_answer-correct-field
  input: Where does a Quiz short-answer question store the expected/correct answer, and what is the default
    number of points such a question is worth?
  criteria: The expected answer is stored in the short_answer_correct text field. The default maximum
    score comes from the module setting quiz_short_answer.settings:default_max_score, shipped as 5.
  bundle: quiz_short_answer
  rubric_ref: rubric/quiz_short_answer_quiz_short_answer_correct_field@1.0
  tags:
  - mode:recipe
  - difficulty:easy
