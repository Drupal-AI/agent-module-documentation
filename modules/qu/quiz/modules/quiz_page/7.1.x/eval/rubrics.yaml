rubrics:
- id: quiz_page_quiz_page_how_implemented
  version: '1.0'
  applicable_bundles:
  - quiz_page
  checks:
  - kind: must_contain_any
    values:
    - question type
    - page
    - qqr_pid
    - not affect
    - unscored
    - no points
  scoring:
    combine: all_pass
- id: quiz_page_quiz_page_plugin_id
  version: '1.0'
  applicable_bundles:
  - quiz_page
  checks:
  - kind: must_contain_any
    values:
    - page
    - quiz.question.type.page
    - QuizPageQuestion
  scoring:
    combine: all_pass
- id: quiz_page_quiz_page_grouping_field
  version: '1.0'
  applicable_bundles:
  - quiz_page
  checks:
  - kind: must_contain_any
    values:
    - qqr_pid
    - quiz_question_relationship
    - parent
  scoring:
    combine: all_pass
- id: quiz_page_quiz_page_read_body
  version: '1.0'
  applicable_bundles:
  - quiz_page
  checks:
  - kind: must_contain_any
    values:
    - Section A intro
  scoring:
    combine: all_pass
- id: quiz_page_quiz_page_create
  version: '1.0'
  applicable_bundles:
  - quiz_page
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
