metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: quiz_page
  version: 7.1.x
  note: 'quiz_page implements pages of questions as a Quiz question type: plugin QuizPageQuestion (#[QuizQuestion(id:''page'')])
    + quiz.question.type.page config entity (bundle of quiz_question). A ''page'' is added to a quiz like
    a question; other questions are grouped onto it by setting the quiz_question_relationship parent field
    qqr_pid to the page''s relationship. Pages do NOT affect the score (QuizPageResponse awards no points).
    Medium/hard cases are grounded in real ''page'' quiz_question entities.'
questions:
- id: quiz_page-how-implemented
  input: How does the Quiz Pages (quiz_page) module implement grouping several questions onto one screen,
    and does a page affect the quiz score?
  criteria: 'Pages are implemented as a question type: the ''page'' plugin (QuizPageQuestion, #[QuizQuestion(id:''page'')])
    with quiz.question.type.page. A page is added to a quiz like a question, and other questions are attached
    to it via the quiz_question_relationship parent field qqr_pid so they render together. Pages do NOT
    affect the score.'
  bundle: quiz_page
  rubric_ref: rubric/quiz_page_quiz_page_how_implemented@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: quiz_page-plugin-id
  input: What question-type/plugin id does quiz_page register with Quiz, and which config entity must
    exist for it?
  criteria: 'It registers the ''page'' question plugin (QuizPageQuestion, #[QuizQuestion(id:''page'')])
    and installs the quiz.question.type.page config entity, a bundle of quiz_question.'
  bundle: quiz_page
  rubric_ref: rubric/quiz_page_quiz_page_plugin_id@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: quiz_page-grouping-field
  input: In Quiz, once I have a page, how are the other questions attached to it so they show on the same
    screen?
  criteria: Each child question's quiz_question_relationship record gets its parent field qqr_pid set
    to the page question's relationship, grouping those questions under the page.
  bundle: quiz_page
  rubric_ref: rubric/quiz_page_quiz_page_grouping_field@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: quiz_page-read-body
  input: This Quiz site has a page question titled 'quiz_pg_probe'. Inspect the live quiz_question entity
    and report the body/intro text configured on it.
  criteria: quiz_pg_probe (type page) has body = 'Section A intro'.
  bundle: quiz_page
  rubric_ref: rubric/quiz_page_quiz_page_read_body@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/quiz_page-probe-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/quiz_page-probe-cleanup.sh
- id: quiz_page-create
  input: On this Drupal site, create a Quiz page (a quiz_question of type page) titled exactly 'quiz_pg_task'
    that can be used to group questions onto one screen. Apply the change to the live site.
  criteria: A quiz_question of type page titled quiz_pg_task exists (QuizQuestion::create(['type'=>'page','title'=>'quiz_pg_task'])->save()).
  bundle: quiz_page
  rubric_ref: rubric/quiz_page_quiz_page_create@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/quiz_page-make-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/quiz_page-make-reset.sh
    verify: agent-module-documentation/evaluation/verify/quiz_page-make-verify.sh
