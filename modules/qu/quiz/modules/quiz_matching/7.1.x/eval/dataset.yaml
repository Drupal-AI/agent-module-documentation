metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: quiz_matching
  version: 7.1.x
  note: 'quiz_matching adds the ''matching'' Quiz question type: plugin MatchingQuestion (#[QuizQuestion(id:''matching'')])
    + quiz.question.type.matching config entity (bundle of quiz_question). Pairs are stored in the REQUIRED
    quiz_matching field (Paragraphs reference to ''quiz_matching'' paragraphs, each with matching_question
    + matching_answer). Optional choice_penalty subtracts points for wrong matches; module setting quiz_matching.settings:shuffle
    shuffles answers. getMaximumScore() returns the number of pairs. Depends on paragraphs. Medium/hard
    cases are grounded in real matching quiz_question entities with pair paragraphs.'
questions:
- id: quiz_matching-pairs-field
  input: In the Quiz module's Matching question type, how are the question/answer pairs stored, and what
    field on the question references them?
  criteria: Each pair is a 'quiz_matching' Paragraph with a matching_question (prompt) and matching_answer
    (correct match). The question references its pairs through the required quiz_matching Paragraphs field
    on the matching quiz_question bundle.
  bundle: quiz_matching
  rubric_ref: rubric/quiz_matching_quiz_matching_pairs_field@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: quiz_matching-scoring
  input: How many points is a Quiz matching question worth, and what options affect scoring/presentation?
  criteria: getMaximumScore() returns the number of pairs, so it's one point per correct match. choice_penalty
    subtracts points for wrong matches, and the quiz_matching.settings:shuffle setting shuffles the presented
    answer options.
  bundle: quiz_matching
  rubric_ref: rubric/quiz_matching_quiz_matching_scoring@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: quiz_matching-plugin-id
  input: What question-type/plugin id does quiz_matching register with Quiz, and which module (besides
    quiz) does it depend on?
  criteria: 'It registers the ''matching'' question plugin (MatchingQuestion, #[QuizQuestion(id:''matching'')])
    with the quiz.question.type.matching config entity, and depends on quiz plus paragraphs (pairs are
    quiz_matching Paragraphs).'
  bundle: quiz_matching
  rubric_ref: rubric/quiz_matching_quiz_matching_plugin_id@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: quiz_matching-count-pairs
  input: This Quiz site has a Matching question titled 'quiz_mt_probe'. Inspect the live quiz_question
    entity and report how many question/answer pairs it has.
  criteria: quiz_mt_probe has 2 pairs (France->Paris, Italy->Rome) referenced from its required quiz_matching
    Paragraphs field, so it is worth 2 points.
  bundle: quiz_matching
  rubric_ref: rubric/quiz_matching_quiz_matching_count_pairs@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/quiz_matching-probe-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/quiz_matching-probe-cleanup.sh
- id: quiz_matching-create
  input: On this Drupal site, create a Matching Quiz question (quiz_question of type matching) titled
    exactly 'quiz_mt_task' with at least two question/answer pairs (each pair having both a prompt and
    its correct answer). Apply the change to the live site.
  criteria: A quiz_question of type matching titled quiz_mt_task exists whose required quiz_matching field
    references >=2 'quiz_matching' Paragraphs, each with a non-empty matching_question and matching_answer.
  bundle: quiz_matching
  rubric_ref: rubric/quiz_matching_quiz_matching_create@1.0
  tags:
  - mode:execution
  - difficulty:hard
