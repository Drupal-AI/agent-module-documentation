metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: quiz_truefalse
  version: 7.1.x
  note: 'quiz_truefalse adds the ''truefalse'' Quiz question type: plugin TrueFalseQuestion (#[QuizQuestion(id:''truefalse'')])
    + config entity quiz.question.type.truefalse (bundle of quiz_question). Correct answer is stored in
    the list_integer field truefalse_correct (1=True, 0=False). Auto-graded by TrueFalseResponse: 1 point
    on match, else 0; getMaximumScore() always 1. Medium/hard cases are grounded in real truefalse quiz_question
    entities.'
questions:
- id: quiz_truefalse-field
  input: In the Drupal Quiz module's True/false question type (quiz_truefalse), which field stores the
    correct answer and what values represent True and False?
  criteria: The correct answer is stored in the truefalse_correct field (a list_integer on the truefalse
    quiz_question bundle) with allowed values 1 = True and 0 = False.
  bundle: quiz_truefalse
  rubric_ref: rubric/quiz_truefalse_quiz_truefalse_field@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: quiz_truefalse-scoring
  input: How is a True/false Quiz question graded, and how many points is it worth?
  criteria: 'It is auto-graded by TrueFalseResponse::score(): the taker''s answer is compared to truefalse_correct,
    awarding the maximum score (getMaximumScore() always returns 1) for a match and 0 otherwise. So each
    True/false question is worth 1 point.'
  bundle: quiz_truefalse
  rubric_ref: rubric/quiz_truefalse_quiz_truefalse_scoring@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: quiz_truefalse-plugin-id
  input: What is the plugin/question-type id that quiz_truefalse registers with the Quiz module, and what
    config entity must exist for it?
  criteria: 'It registers the ''truefalse'' question plugin (TrueFalseQuestion with #[QuizQuestion(id:''truefalse'')])
    and installs the quiz.question.type.truefalse config entity, a bundle of quiz_question.'
  bundle: quiz_truefalse
  rubric_ref: rubric/quiz_truefalse_quiz_truefalse_plugin_id@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: quiz_truefalse-read-correct
  input: This Quiz site has a True/false question titled 'quiz_tf_probe'. Inspect the live quiz_question
    entity and state whether its correct answer is True or False.
  criteria: quiz_tf_probe has truefalse_correct = 1, i.e. the correct answer is True.
  bundle: quiz_truefalse
  rubric_ref: rubric/quiz_truefalse_quiz_truefalse_read_correct@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/quiz_truefalse-probe-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/quiz_truefalse-probe-cleanup.sh
- id: quiz_truefalse-create
  input: On this Drupal site, create a True/false Quiz question (quiz_question of type truefalse) titled
    exactly 'quiz_tf_task' whose correct answer is False. Apply the change to the live site.
  criteria: A quiz_question of type truefalse titled quiz_tf_task exists with truefalse_correct = 0 (False).
  bundle: quiz_truefalse
  rubric_ref: rubric/quiz_truefalse_quiz_truefalse_create@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/quiz_truefalse-make-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/quiz_truefalse-make-reset.sh
    verify: agent-module-documentation/evaluation/verify/quiz_truefalse-make-verify.sh
