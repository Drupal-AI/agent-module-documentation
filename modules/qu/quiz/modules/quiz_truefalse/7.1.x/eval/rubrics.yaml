rubrics:
- id: quiz_truefalse_quiz_truefalse_field
  version: '1.0'
  applicable_bundles:
  - quiz_truefalse
  checks:
  - kind: must_contain_any
    values:
    - truefalse_correct
  scoring:
    combine: all_pass
- id: quiz_truefalse_quiz_truefalse_scoring
  version: '1.0'
  applicable_bundles:
  - quiz_truefalse
  checks:
  - kind: must_contain_any
    values:
    - 1 point
    - getMaximumScore
    - one point
    - automatically
    - auto
  scoring:
    combine: all_pass
- id: quiz_truefalse_quiz_truefalse_plugin_id
  version: '1.0'
  applicable_bundles:
  - quiz_truefalse
  checks:
  - kind: must_contain_any
    values:
    - truefalse
    - quiz.question.type.truefalse
    - QuizQuestion
  scoring:
    combine: all_pass
- id: quiz_truefalse_quiz_truefalse_read_correct
  version: '1.0'
  applicable_bundles:
  - quiz_truefalse
  checks:
  - kind: must_contain_any
    values:
    - 'True'
    - '1'
  scoring:
    combine: all_pass
- id: quiz_truefalse_quiz_truefalse_create
  version: '1.0'
  applicable_bundles:
  - quiz_truefalse
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
