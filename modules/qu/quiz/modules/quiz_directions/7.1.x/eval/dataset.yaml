metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: quiz_directions
  version: 7.1.x
  note: 'quiz_directions provides an unscored informational ''directions'' slot implemented as a Quiz
    question type: plugin QuizDirectionsQuestion (#[QuizQuestion(id:''directions'')]) + quiz.question.type.directions
    config entity (bundle of quiz_question). A directions item shows its body text to the taker, collects
    no answer and awards no points (QuizDirectionsResponse is informational). Medium/hard cases are grounded
    in real ''directions'' quiz_question entities.'
questions:
- id: quiz_directions-purpose
  input: What does the quiz_directions module add to Quiz, how is it implemented, and does it count toward
    the score?
  criteria: 'It adds a ''directions'' slot for showing instructions/context to takers, implemented as
    a question type (QuizDirectionsQuestion, #[QuizQuestion(id:''directions'')], quiz.question.type.directions).
    It displays its body text, collects no answer and awards no points.'
  bundle: quiz_directions
  rubric_ref: rubric/quiz_directions_quiz_directions_purpose@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: quiz_directions-plugin-id
  input: What question-type/plugin id does quiz_directions register with Quiz, and which config entity
    must exist for it?
  criteria: 'It registers the ''directions'' question plugin (QuizDirectionsQuestion, #[QuizQuestion(id:''directions'')])
    and installs the quiz.question.type.directions config entity, a bundle of quiz_question.'
  bundle: quiz_directions
  rubric_ref: rubric/quiz_directions_quiz_directions_plugin_id@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: quiz_directions-content-field
  input: Where does the text shown by a Quiz 'directions' item come from on the quiz_question entity?
  criteria: The instructions come from the quiz_question 'body' field; a directions item displays that
    body text to the taker and awards no points.
  bundle: quiz_directions
  rubric_ref: rubric/quiz_directions_quiz_directions_content_field@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: quiz_directions-read-body
  input: This Quiz site has a directions item titled 'quiz_dir_probe'. Inspect the live quiz_question
    entity and report the directions text configured on it.
  criteria: quiz_dir_probe (type directions) has body = 'Read each question carefully'.
  bundle: quiz_directions
  rubric_ref: rubric/quiz_directions_quiz_directions_read_body@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/quiz_directions-probe-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/quiz_directions-probe-cleanup.sh
- id: quiz_directions-create
  input: On this Drupal site, create a Quiz directions item (a quiz_question of type directions) titled
    exactly 'quiz_dir_task' with some non-empty instructions in its body. Apply the change to the live
    site.
  criteria: A quiz_question of type directions titled quiz_dir_task exists with a non-empty body field
    (QuizQuestion::create(['type'=>'directions','title'=>'quiz_dir_task','body'=>'...'])->save()).
  bundle: quiz_directions
  rubric_ref: rubric/quiz_directions_quiz_directions_create@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/quiz_directions-make-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/quiz_directions-make-reset.sh
    verify: agent-module-documentation/evaluation/verify/quiz_directions-make-verify.sh
