rubrics:
- id: quiz_multichoice_quiz_multichoice_alternatives_field
  version: '1.0'
  applicable_bundles:
  - quiz_multichoice
  checks:
  - kind: must_contain_any
    values:
    - alternatives
    - paragraph
    - Paragraphs
    - multichoice
  scoring:
    combine: all_pass
- id: quiz_multichoice_quiz_multichoice_multi_select
  version: '1.0'
  applicable_bundles:
  - quiz_multichoice
  checks:
  - kind: must_contain_any
    values:
    - choice_multi
    - choice_random
  scoring:
    combine: all_pass
- id: quiz_multichoice_quiz_multichoice_plugin_id
  version: '1.0'
  applicable_bundles:
  - quiz_multichoice
  checks:
  - kind: must_contain_any
    values:
    - multichoice
    - field_group
  scoring:
    combine: all_pass
- id: quiz_multichoice_quiz_multichoice_count_alternatives
  version: '1.0'
  applicable_bundles:
  - quiz_multichoice
  checks:
  - kind: must_contain_any
    values:
    - '3'
  scoring:
    combine: all_pass
- id: quiz_multichoice_quiz_multichoice_create
  version: '1.0'
  applicable_bundles:
  - quiz_multichoice
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
