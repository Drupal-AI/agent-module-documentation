metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: rrssb
  version: 2.7.x
  note: 'RRSSB configures social share/follow buttons as rrssb_button_set config entities (config prefix
    rrssb.button_set; a ''default'' set ships on install). Keys: follow (0 share / 1 follow), chosen (per-button
    enabled/username/weight), appearance (size/alignRight/...), prefix. Rendered via the rrssb_block block,
    the rrssb_buttons Views field, or a node-type third-party setting (third_party_settings.rrssb.button_set).
    Icons/CSS come from the external rrssb/rrssb-plus library. Hooks hook_rrssb_buttons()/_alter() add
    or change buttons; drush rrssb:gen-css regenerates library CSS. Medium/hard cases are grounded in
    real button-set config entities on the live site - no live social-network calls are made.'
questions:
- id: rrssb-config-entity
  input: In the Drupal RRSSB (rrssb) module, what kind of configuration object represents a group of social
    share buttons, and what is the id of the one that ships when you install the module?
  criteria: A 'button set' - a config entity of type rrssb_button_set (config prefix rrssb.button_set,
    objects named rrssb.button_set.<id>). Installing the module creates one set with id 'default'. Managed
    at /admin/config/content/rrssb.
  bundle: rrssb
  rubric_ref: rubric/rrssb_rrssb_config_entity@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: rrssb-hooks
  input: How can a custom module add a brand-new social network button (or change an existing one) to
    the RRSSB module?
  criteria: Implement hook_rrssb_buttons() to add buttons (each with svg/svgfile, share_url and/or follow_url,
    color, etc.) or hook_rrssb_buttons_alter(&$buttons) to change existing ones.
  bundle: rrssb
  rubric_ref: rubric/rrssb_rrssb_hooks@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: rrssb-drush
  input: The RRSSB module ships a Drush command. What is it and what does it do?
  criteria: drush rrssb:gen-css (alias rrssb-gen-css) regenerates css/rrssb.buttons.css inside the RRSSB+
    library from the current button configuration; run it after adding/altering buttons.
  bundle: rrssb
  rubric_ref: rubric/rrssb_rrssb_drush@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: rrssb-known-buttons
  input: This Drupal site has an RRSSB button set with the id rrssb_known. Inspect the live configuration
    and list which social buttons are enabled in it.
  criteria: The rrssb_known button set (rrssb.button_set.rrssb_known) has email and facebook enabled in
    its 'chosen' list.
  bundle: rrssb
  rubric_ref: rubric/rrssb_rrssb_known_buttons@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
