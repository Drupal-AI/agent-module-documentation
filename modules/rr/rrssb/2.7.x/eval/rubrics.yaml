rubrics:
- id: rrssb_rrssb_config_entity
  version: '1.0'
  applicable_bundles:
  - rrssb
  checks:
  - kind: must_contain_any
    values:
    - rrssb_button_set
    - button_set
    - default
  scoring:
    combine: all_pass
- id: rrssb_rrssb_hooks
  version: '1.0'
  applicable_bundles:
  - rrssb
  checks:
  - kind: must_contain_any
    values:
    - hook_rrssb_buttons
  scoring:
    combine: all_pass
- id: rrssb_rrssb_drush
  version: '1.0'
  applicable_bundles:
  - rrssb
  checks:
  - kind: must_contain_any
    values:
    - rrssb:gen-css
    - rrssb-gen-css
  scoring:
    combine: all_pass
- id: rrssb_rrssb_known_buttons
  version: '1.0'
  applicable_bundles:
  - rrssb
  checks:
  - kind: must_contain_any
    values:
    - facebook
  scoring:
    combine: all_pass
- id: rrssb_rrssb_known_follow
  version: '1.0'
  applicable_bundles:
  - rrssb
  checks:
  - kind: must_contain_any
    values:
    - acmecorp
  scoring:
    combine: all_pass
