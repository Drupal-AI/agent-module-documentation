- id: rrssb_rrssb_build_appearance
  version: '1.0'
  applicable_bundles:
  - rrssb
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
