metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: nbsp
  version: 3.1.x
  note: NBSP is a CKEditor 5 plugin (toolbar item id 'nbsp', label 'Non-breaking space', shortcut Ctrl+Space,
    ckeditor5 plugin nbsp.Nbsp, inserts a <nbsp> element) plus a text-format filter NbspCleanerFilter
    (id nbsp_cleaner_filter, title 'Cleanup NBSP markup') that converts <nbsp> and legacy <span class="nbsp">
    to a real UTF-8 non-breaking space. It has no settings page, no configure route, no permissions, no
    Drush, no config schema of its own. All state lives in the standard config entities editor.editor.<format>
    (settings.toolbar.items) and filter.format.<format> (filters.nbsp_cleaner_filter). Requires core editor
    + ckeditor5. medium/hard cases create namespaced text formats/editors (nbsp_*) and read/write those
    config entities; cleanup deletes them.
questions:
- id: nbsp-enable-steps
  input: I installed the nbsp Drupal module. How do I actually enable non-breaking-space support for a
    specific text format / CKEditor 5 editor?
  criteria: 'On the text format (/admin/config/content/formats/manage/<format>): drag the NBSP button
    into the active CKEditor 5 toolbar, enable the ''Cleanup NBSP markup'' filter (nbsp_cleaner_filter),
    and if ''Limit allowed HTML tags'' is on add <nbsp> to the allowed tags.'
  bundle: nbsp
  rubric_ref: rubric/nbsp_nbsp_enable_steps@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: nbsp-filter-id
  input: In the nbsp module, what is the machine id and title of the text-format filter it provides, and
    what does that filter do to the stored markup?
  criteria: The filter is nbsp_cleaner_filter, titled 'Cleanup NBSP markup'. On output it replaces <nbsp></nbsp>
    tags (and legacy <span class="nbsp">) with a real UTF-8 non-breaking space character.
  bundle: nbsp
  rubric_ref: rubric/nbsp_nbsp_filter_id@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: nbsp-shortcut
  input: With the nbsp module's CKEditor plugin, what keyboard shortcut inserts a non-breaking space,
    and what is the toolbar button called?
  criteria: Press Ctrl+Space, or use the 'Non-breaking space' toolbar button (toolbar item id nbsp). The
    inserted character is highlighted in blue in the editor.
  bundle: nbsp
  rubric_ref: rubric/nbsp_nbsp_shortcut@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: nbsp-filter
  input: On this Drupal site, a text format named 'nbsp_eval' has been set up to handle non-breaking spaces
    from the nbsp module. Inspect the live text-format configuration and name the filter that provides
    this.
  criteria: The filter is nbsp_cleaner_filter ('Cleanup NBSP markup'), enabled on filter.format.nbsp_eval.
  bundle: nbsp
  rubric_ref: rubric/nbsp_nbsp_filter@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/nbsp-filter-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/nbsp-filter-cleanup.sh
- id: nbsp-toolbar
  input: On this Drupal site, the CKEditor 5 editor for the text format 'nbsp_tbfmt' has the non-breaking-space
    button on its toolbar. Inspect the live editor configuration and give the toolbar item id used for
    that button.
  criteria: The toolbar item id is 'nbsp', present in editor.editor.nbsp_tbfmt settings.toolbar.items.
  bundle: nbsp
  rubric_ref: rubric/nbsp_nbsp_toolbar@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/nbsp-toolbar-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/nbsp-toolbar-cleanup.sh
- id: nbsp-enable-filter
  input: On this Drupal site there is a text format with machine name 'nbsp_task' that does not yet clean
    up non-breaking-space markup. Using the nbsp module, enable its cleanup filter on that text format.
    Apply the change to the live site.
  criteria: Enable the nbsp_cleaner_filter filter (status TRUE) on filter.format.nbsp_task (e.g. FilterFormat::load('nbsp_task')->setFilterConfig('nbsp_cleaner_filter',
    ['status' => TRUE])->save()).
  bundle: nbsp
  rubric_ref: rubric/nbsp_nbsp_enable_filter@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/nbsp-enable-filter-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/nbsp-enable-filter-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/nbsp-enable-filter-verify.sh
- id: nbsp-add-button
  input: On this Drupal site, the text format 'nbsp_tb' uses CKEditor 5 but its toolbar does not have
    the non-breaking-space button. Using the nbsp module, add the NBSP button to that editor's toolbar.
    Apply the change to the live site.
  criteria: Append 'nbsp' to editor.editor.nbsp_tb settings.toolbar.items (the CKEditor 5 active toolbar)
    and save.
  bundle: nbsp
  rubric_ref: rubric/nbsp_nbsp_add_button@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/nbsp-add-button-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/nbsp-add-button-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/nbsp-add-button-verify.sh
