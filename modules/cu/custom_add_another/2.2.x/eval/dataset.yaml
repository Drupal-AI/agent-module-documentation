    reset: agent-module-documentation/evaluation/verify/custom_add_another-set-add-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/custom_add_another-set-add-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/custom_add_another-set-add-verify.sh
