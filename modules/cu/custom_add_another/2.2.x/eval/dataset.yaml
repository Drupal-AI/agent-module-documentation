metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: custom_add_another
  version: 2.2.x
  note: 'Custom add another customises the ''Add another item'' and ''Remove'' button labels on unlimited-cardinality
    fields. It has no configure route (configure=null), no settings page, no permissions, no Drush and
    no plugins. Its only persistent state is two third-party settings on a FieldConfig entity: field.field.<entity_type>.<bundle>.<field>.third_party_settings.custom_add_another.custom_add_another
    (add-another label) and .custom_remove (remove label). The options only appear on the field-instance
    edit form when cardinality is Unlimited (-1) and the storage is unlocked. All medium/hard cases are
    grounded in that real config: introspection reads back which unlimited field has a custom label; execution
    sets the custom label on a live FieldConfig, verified via getThirdPartySetting.'
questions:
- id: custom_add_another-where-configured
  input: Using the Drupal custom_add_another module, where do I change the text of the 'Add another item'
    button for a multi-value field, and where is that text stored?
  criteria: 'There is no settings page. On the field instance edit form (Manage fields > Edit) you fill
    in ''Custom add another item button''. It is saved as a third-party setting on the FieldConfig: field.field.<entity_type>.<bundle>.<field>.third_party_settings.custom_add_another.custom_add_another.'
  bundle: custom_add_another
  rubric_ref: rubric/custom_add_another_custom_add_another_where_configured@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: custom_add_another-when-visible
  input: In the custom_add_another module, under what condition does the option to customise the button
    appear on a field? Does it work on a field limited to one value?
  criteria: The custom label fields only appear when the field's Number of values (cardinality) is Unlimited
    (-1) and the field storage is not locked. On a single- or fixed-count field there is no 'Add another'
    button, so the options do not show.
  bundle: custom_add_another
  rubric_ref: rubric/custom_add_another_custom_add_another_when_visible@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: custom_add_another-what-can-change
  input: Which button labels can the custom_add_another module change on a multi-value field?
  criteria: It can change both the 'Add another item' button label (custom_add_another key) and the 'Remove'
    button label (custom_remove key). It also relabels the upload/remove buttons on multiple managed_file
    (file/image) widgets.
  bundle: custom_add_another
  rubric_ref: rubric/custom_add_another_custom_add_another_what_can_change@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: custom_add_another-known-label
  input: On this Drupal site, the 'CAA Known' (caa_known) content type has an unlimited multi-value field
    whose 'Add another item' button has been given custom text via custom_add_another. Inspect the live
    field configuration and give the exact custom button text.
  criteria: 'The custom text is ''Add another highlight'': field.field.node.caa_known.field_caa_lbl third_party_settings.custom_add_another.custom_add_another
    = ''Add another highlight''.'
  bundle: custom_add_another
  rubric_ref: rubric/custom_add_another_custom_add_another_known_label@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/custom_add_another-known-label-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/custom_add_another-known-label-cleanup.sh
- id: custom_add_another-on-vs-off
  input: The 'CAA OnOff' (caa_onoff) content type has two unlimited fields, field_caa_on and field_caa_off.
    Exactly one has a custom 'Add another' button label set via custom_add_another. Inspect the live field
    configuration and state which field has the custom label.
  criteria: 'field_caa_on has the custom label: field.field.node.caa_onoff.field_caa_on carries third_party_settings.custom_add_another.custom_add_another,
    whereas field_caa_off has none.'
  bundle: custom_add_another
  rubric_ref: rubric/custom_add_another_custom_add_another_on_vs_off@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/custom_add_another-on-vs-off-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/custom_add_another-on-vs-off-cleanup.sh
- id: custom_add_another-set-add
  input: 'On this Drupal site, the ''CAA Add'' (caa_add) content type has an unlimited field field_caa_add.
    Using the custom_add_another module, set that field''s ''Add another item'' button text to exactly:
    Add another highlight. Apply the change to the live site.'
  criteria: Set third_party_settings.custom_add_another.custom_add_another to 'Add another highlight'
    on field.field.node.caa_add.field_caa_add (via the field edit form's 'Custom add another item button',
    or setThirdPartySetting on the FieldConfig and save).
  bundle: custom_add_another
  rubric_ref: rubric/custom_add_another_custom_add_another_set_add@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
