metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: custom_breadcrumbs
  version: 1.1.x
  note: Custom breadcrumbs defines breadcrumb trails as custom_breadcrumbs config entities (custom_breadcrumbs.custom_breadcrumbs.<id>)
    matched either by content entity (type=1, via entityType+entityBundle+language) or by URL path pattern
    (type=2, via pathPattern). Each crumb's URL and title come from the newline-separated breadcrumbPaths/breadcrumbTitles
    textareas (paired by line index), with Token replacement and special syntax <front>, <nolink>, <term_hierarchy:field_name>.
    A high-priority BreadcrumbBuilder (service custom_breadcrumbs.breadcrumb, priority 1003) applies them.
    Global settings live in the custom_breadcrumbs.settings config object (home, home_link, current_page,
    current_page_link, trim_title, admin_pages_disable, site_wide) at route custom_breadcrumbs.config
    (/admin/config/user-interface/custom-breadcrumbs). Entities managed at /admin/structure/custom-breadcrumbs.
    Requires the token module; single permission administer custom_breadcrumbs. Medium/hard cases create/read
    real custom_breadcrumbs entities (prefixed cb_) and the settings object, verified against live config.
questions:
- id: custom_breadcrumbs-what
  input: What does the Drupal Custom breadcrumbs module let you do, and how is a single breadcrumb trail
    defined/matched?
  criteria: It lets you define breadcrumb trails as custom_breadcrumbs config entities, each matched either
    by content entity type/bundle (type 1) or by a URL path pattern (type 2), with each crumb's URL and
    title built from text or Token replacement.
  bundle: custom_breadcrumbs
  rubric_ref: rubric/custom_breadcrumbs_custom_breadcrumbs_what@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: custom_breadcrumbs-special-syntax
  input: In the Drupal Custom breadcrumbs module, what special placeholder syntax can I put in a breadcrumb
    path line to (a) make a crumb with no link and (b) expand a taxonomy term's parent hierarchy?
  criteria: Use <nolink> for a crumb with no link, and <term_hierarchy:field_name> to expand a taxonomy
    term reference field into its full parent-to-child hierarchy. <front> links to the front page. Titles/paths
    also support Token replacement.
  bundle: custom_breadcrumbs
  rubric_ref: rubric/custom_breadcrumbs_custom_breadcrumbs_special_syntax@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: custom_breadcrumbs-global-settings
  input: Where are the global Custom breadcrumbs settings (like showing a Home crumb or disabling on admin
    pages) configured, and what is the settings config object name?
  criteria: At /admin/config/user-interface/custom-breadcrumbs (route custom_breadcrumbs.config), stored
    in the custom_breadcrumbs.settings config object (keys home, home_link, current_page, current_page_link,
    trim_title, admin_pages_disable, site_wide).
  bundle: custom_breadcrumbs
  rubric_ref: rubric/custom_breadcrumbs_custom_breadcrumbs_global_settings@1.0
  tags:
  - mode:recipe
  - difficulty:easy
