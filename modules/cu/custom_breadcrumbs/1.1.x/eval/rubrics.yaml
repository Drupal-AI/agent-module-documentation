rubrics:
- id: custom_breadcrumbs_custom_breadcrumbs_what
  version: '1.0'
  applicable_bundles:
  - custom_breadcrumbs
  checks:
  - kind: must_contain_any
    values:
    - config entity
    - custom_breadcrumbs
    - path
    - entity type
    - bundle
  scoring:
    combine: all_pass
- id: custom_breadcrumbs_custom_breadcrumbs_special_syntax
  version: '1.0'
  applicable_bundles:
  - custom_breadcrumbs
  checks:
  - kind: must_contain_any
    values:
    - <nolink>
    - nolink
    - <term_hierarchy
    - term_hierarchy
  scoring:
    combine: all_pass
- id: custom_breadcrumbs_custom_breadcrumbs_global_settings
  version: '1.0'
  applicable_bundles:
  - custom_breadcrumbs
  checks:
  - kind: must_contain_any
    values:
    - custom_breadcrumbs.settings
    - custom_breadcrumbs.config
    - user-interface/custom-breadcrumbs
  scoring:
    combine: all_pass
- id: custom_breadcrumbs_custom_breadcrumbs_known_pattern
  version: '1.0'
  applicable_bundles:
  - custom_breadcrumbs
  checks:
  - kind: must_contain_any
    values:
    - /cb-known
    - cb-known
  scoring:
    combine: all_pass
- id: custom_breadcrumbs_custom_breadcrumbs_home_label
  version: '1.0'
  applicable_bundles:
  - custom_breadcrumbs
  checks:
  - kind: must_contain_any
    values:
    - Start
  scoring:
    combine: all_pass
- id: custom_breadcrumbs_custom_breadcrumbs_create_path
  version: '1.0'
  applicable_bundles:
  - custom_breadcrumbs
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
- id: custom_breadcrumbs_custom_breadcrumbs_create_entity
  version: '1.0'
  applicable_bundles:
  - custom_breadcrumbs
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
