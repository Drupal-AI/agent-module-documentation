metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: custom_field
  version: 5.0.x
  note: 'Custom Field provides a single Drupal field type `custom` (class CustomItem) whose storage is
    a list of columns (subfields). Storage config: field.storage.<entity>.<field>.settings.columns is
    keyed by column machine name -> {name,type,...} where type is a custom_field_type plugin id (string,
    integer, datetime, ...). The parent field is edited with base widget custom_flex or custom_stacked
    and displayed with custom_formatter/custom_inline/custom_list/custom_table/flipped_table/custom_template.
    No settings page (configure=null), no permissions. Drush: custom_field:add-column (cf-add-column)
    / custom_field:remove-column (cf-remove-column). Service custom_field.update_manager add/removes columns
    on populated fields. All medium/hard cases are grounded in that real config on a namespaced content
    type cf_eval with field_cf_* fields (created by setup/reset, removed by cleanup) so no other agent''s
    data is touched.'
questions:
- id: custom_field-type-and-widgets
  input: In the Drupal contrib module custom_field, what is the machine name of the Drupal field type
    it provides, and what are the two base widgets used to edit the whole field on an entity form?
  criteria: 'The field type machine name is `custom` (class CustomItem). The parent field is edited with
    one of two base widgets: custom_flex (a CSS-flexbox layout) or custom_stacked.'
  bundle: custom_field
  rubric_ref: rubric/custom_field_custom_field_type_and_widgets@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: custom_field-columns-storage
  input: A custom_field field stores several subfields in one table. In the field storage configuration,
    under which setting are those subfields defined, and what must each entry specify?
  criteria: They are defined under the storage setting `columns` (field.storage.<entity>.<field>.settings.columns),
    keyed by column machine name; each entry specifies at least a `name` and a `type` (a custom_field_type
    subfield plugin id such as string or integer). Each becomes a <field>_<column> DB column.
  bundle: custom_field
  rubric_ref: rubric/custom_field_custom_field_columns_storage@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: custom_field-drush-columns
  input: Which Drush commands does custom_field add to add or remove a column on a Custom Field that already
    contains data?
  criteria: custom_field:add-column (alias cf-add-column) and custom_field:remove-column (alias cf-remove-column),
    both interactive and backed by the custom_field.update_manager service.
  bundle: custom_field
  rubric_ref: rubric/custom_field_custom_field_drush_columns@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: custom_field-known-columns
  input: On this Drupal site there is a Custom Field named field_cf_cols on the 'cf_eval' content type.
    Inspect the live field storage configuration and list the machine names of its subfield columns.
  criteria: 'field.storage.node.field_cf_cols has settings.columns with two columns: headline (type string)
    and rank (type integer).'
  bundle: custom_field
  rubric_ref: rubric/custom_field_custom_field_known_columns@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/custom_field-known-columns-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/custom_field-known-columns-cleanup.sh
- id: custom_field-known-widget
  input: On this Drupal site, the Custom Field field_cf_wid on the 'cf_eval' content type is configured
    on the default form display. Inspect the live configuration and state which base widget (custom_flex
    or custom_stacked) edits it, and which per-column widget its 'body' column uses.
  criteria: In core.entity_form_display.node.cf_eval.default the field_cf_wid component uses base widget
    type custom_flex, and its 'body' column uses the textarea widget (settings.field_settings.body.type
    = textarea).
  bundle: custom_field
  rubric_ref: rubric/custom_field_custom_field_known_widget@1.0
  tags:
