rubrics:
- id: custom_field_graphql_custom_field_graphql_purpose
  version: '1.0'
  applicable_bundles:
  - custom_field_graphql
  checks:
  - kind: must_contain_any
    values:
    - graphql_compose
    - GraphQL Compose
    - GraphQL
  scoring:
    combine: all_pass
- id: custom_field_graphql_custom_field_graphql_subfields_config
  version: '1.0'
  applicable_bundles:
  - custom_field_graphql
  checks:
  - kind: must_contain_any
    values:
    - subfields
    - name_sdl
    - enabled
  scoring:
    combine: all_pass
- id: custom_field_graphql_custom_field_graphql_name_sdl_why
  version: '1.0'
  applicable_bundles:
  - custom_field_graphql
  checks:
  - kind: must_contain_any
    values:
    - name_sdl
    - schema field name
    - underscore
    - machine name
    - camel
  scoring:
    combine: all_pass
- id: custom_field_graphql_custom_field_graphql_known_subfield
  version: '1.0'
  applicable_bundles:
  - custom_field_graphql
  checks:
  - kind: must_contain_any
    values:
    - priceAmount
  scoring:
    combine: all_pass
- id: custom_field_graphql_custom_field_graphql_disabled_subfield
  version: '1.0'
  applicable_bundles:
  - custom_field_graphql
  checks:
  - kind: must_contain_any
    values:
    - secret_note
    - secret
  scoring:
    combine: all_pass
- id: custom_field_graphql_custom_field_graphql_rename_subfield
  version: '1.0'
  applicable_bundles:
  - custom_field_graphql
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
- id: custom_field_graphql_custom_field_graphql_disable_subfield
  version: '1.0'
  applicable_bundles:
  - custom_field_graphql
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
