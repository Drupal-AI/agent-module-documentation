metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: custom_field_graphql
  version: 5.0.x
  note: 'custom_field_graphql exposes Custom Field (`custom`) fields and their subfield columns through
    GraphQL Compose. It registers GraphQL Compose FieldType/SchemaType plugins and extends graphql_compose.settings
    field_config.<entity>.<bundle>.<field> with a `subfields` map (custom_field_graphql.subfield.* = {enabled:
    bool, name_sdl: string}). IMPORTANT GROUNDING CAVEAT: this benchmark site does NOT have the graphql_compose
    project installed (and `composer require` is out of scope for this campaign), so the submodule itself
    cannot be enabled here. The easy (recipe) cases are fully valid text questions. The medium/hard cases
    are grounded in the module''s real config contract — the `subfields` structure inside graphql_compose.settings
    — and their setup/reset/verify scripts round-trip that config object; they were smoke-tested at the
    config level, but a full end-to-end GraphQL query check requires graphql_compose to be installed.
    The scripts mutate ONLY the graphql_compose.settings config object under a namespaced field path and
    restore it, touching no other module.'
questions:
- id: custom_field_graphql-purpose
  input: What does the Drupal submodule custom_field_graphql do, and which contrib project must be installed
    for it to work?
  criteria: It integrates the Custom Field module with GraphQL Compose, exposing `custom` fields and their
    subfield columns in a GraphQL schema. It depends on the graphql_compose project.
  bundle: custom_field_graphql
  rubric_ref: rubric/custom_field_graphql_custom_field_graphql_purpose@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: custom_field_graphql-subfields-config
  input: In custom_field_graphql, how can each column (subfield) of a Custom Field be individually controlled
    in the GraphQL schema, and what are the two per-subfield settings?
  criteria: 'It adds a `subfields` map to the GraphQL Compose field settings (graphql_compose.settings
    field_config.*), keyed by column machine name, with two settings per column: `enabled` (include in
    schema) and `name_sdl` (the GraphQL schema field name, used to give underscored machine names a clean
    SDL name).'
  bundle: custom_field_graphql
  rubric_ref: rubric/custom_field_graphql_custom_field_graphql_subfields_config@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: custom_field_graphql-name-sdl-why
  input: Why does custom_field_graphql provide a `name_sdl` setting for a Custom Field column, and what
    is its default?
  criteria: name_sdl sets the GraphQL/SDL field name a column is exposed as; it defaults to the column
    machine name. It exists because Custom Field column machine names often contain underscores that are
    not ideal GraphQL identifiers, so you can expose e.g. price_amount as priceAmount.
  bundle: custom_field_graphql
  rubric_ref: rubric/custom_field_graphql_custom_field_graphql_name_sdl_why@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: custom_field_graphql-known-subfield
  input: On this Drupal site, a Custom Field's GraphQL Compose settings have one column renamed for the
    schema. Inspect the graphql_compose.settings configuration for field_config.node.cfgql_eval.field_cfgql
    and report the GraphQL schema field name (name_sdl) configured for the 'price_amount' subfield.
  criteria: graphql_compose.settings field_config.node.cfgql_eval.field_cfgql.subfields.price_amount.name_sdl
    is 'priceAmount'.
  bundle: custom_field_graphql
  rubric_ref: rubric/custom_field_graphql_custom_field_graphql_known_subfield@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/custom_field_graphql-known-subfield-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/custom_field_graphql-known-subfield-cleanup.sh
- id: custom_field_graphql-disabled-subfield
  input: On this Drupal site, one subfield of a Custom Field has been excluded from the GraphQL schema.
    Inspect graphql_compose.settings field_config.node.cfgql_eval.field_cfgql and report which subfield
    has enabled = false.
  criteria: graphql_compose.settings field_config.node.cfgql_eval.field_cfgql.subfields.secret_note.enabled
    is false.
  bundle: custom_field_graphql
  rubric_ref: rubric/custom_field_graphql_custom_field_graphql_disabled_subfield@1.0
  tags:
