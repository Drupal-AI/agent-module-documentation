metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: custom_field_sdc
  version: 5.0.x
  note: 'custom_field_sdc renders an entity view mode through a Single Directory Component. Its state
    is a THIRD-PARTY SETTING on the entity_view_display config entity: provider `custom_field_sdc`, key
    `settings` = {enabled: bool, component: <sdc plugin id>, variant: string, props: sequence, slots:
    sequence}. hook_entity_view_alter() replaces the build with a #type=>component element when enabled+valid;
    the Manage-display UI (hook_form_entity_view_display_edit_form_alter) unsets the setting when disabled.
    Config schema key core.entity_view_display.*.*.*.third_party.custom_field_sdc. All live cases use
    a namespaced content type cfsdc_eval with a Custom Field field_cfsdc; the component ids used (navigation:badge,
    navigation:message, olivero:teaser) are real SDC plugins present on this site (verified via plugin.manager.sdc).
    setup/reset/cleanup create/remove only cfsdc_eval + field_cfsdc and the display third-party setting;
    no other module is touched. NOTE: the base field FORMATTER with id custom_field_sdc belongs to the
    parent custom_field module, not this submodule; these cases target the view-mode third-party setting
    this submodule actually owns.'
questions:
- id: custom_field_sdc-what-and-where
  input: What does the custom_field_sdc submodule do, and where does it store the choice of which Single
    Directory Component a view mode uses?
  criteria: It renders an entity view mode through a Single Directory Component. The binding is stored
    as a third-party setting on the entity_view_display config entity under provider custom_field_sdc,
    key `settings` (enabled + component).
  bundle: custom_field_sdc
  rubric_ref: rubric/custom_field_sdc_custom_field_sdc_what_and_where@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: custom_field_sdc-settings-keys
  input: In custom_field_sdc's third-party settings on an entity view display, which keys control whether
    a component renders and which component/props/slots are used?
  criteria: 'Under third_party_settings.custom_field_sdc.settings: `enabled` (bool) turns rendering on,
    `component` (SDC plugin id), `variant`, `props` (column->prop mappings) and `slots` (slot->field mappings).'
  bundle: custom_field_sdc
  rubric_ref: rubric/custom_field_sdc_custom_field_sdc_settings_keys@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: custom_field_sdc-render-hook
  input: How does custom_field_sdc actually render a view mode as a component at display time, and what
    happens if the sdc_display module is active?
  criteria: hook_entity_view_alter() replaces the built output with a '#type' => 'component' render element
    (mapping Custom Field columns to props and fields to slots) when enabled with a valid component; if
    the sdc_display module is enabled and controlling the display, custom_field_sdc defers to it.
  bundle: custom_field_sdc
  rubric_ref: rubric/custom_field_sdc_custom_field_sdc_render_hook@1.0
  tags:
  - mode:recipe
  - difficulty:easy
