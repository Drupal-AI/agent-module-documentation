metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: custom_field_entity_browser
  version: 5.0.x
  note: Submodule of custom_field. Provides one custom_field_widget plugin, entity_reference_entity_browser
    (class EntityReferenceBrowserWidget), for the parent's entity_reference subfield type; hardcoded cardinality
    1. Its per-column settings live on the Custom Field's base-widget form-display component at settings.fields.<col>
    and include type (the widget id), entity_browser (the Entity Browser instance id), field_widget_display
    (default 'label'), field_widget_display_settings, open, field_widget_edit/remove/replace (added to
    custom_field.field.* schema by hook_config_schema_info_alter in ConfigSchemaHooks). No config entity/route/permission/drush.
    Medium/hard cases build a Custom Field with an entity_reference column (target_type node) on a namespaced
    content type cfeb_eval (field field_cfeb_ref) and read/set the per-column widget on the live form
    display; setup/reset/cleanup create then remove the field and content type so nothing else is touched.
questions:
- id: custom_field_entity_browser-widget-id
  input: In the custom_field_entity_browser submodule, what is the machine name of the widget it adds,
    and which Custom Field subfield (column) type can use it?
  criteria: It adds the custom_field_widget plugin `entity_reference_entity_browser` (class EntityReferenceBrowserWidget),
    usable on a Custom Field column of subfield type `entity_reference`.
  bundle: custom_field_entity_browser
  rubric_ref: rubric/custom_field_entity_browser_custom_field_entity_browser_widget_id@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: custom_field_entity_browser-settings-keys
  input: When you use the Entity Browser widget on a Custom Field entity_reference column, which setting
    picks the Entity Browser instance to open, and which setting controls how selected entities are displayed?
  criteria: '`entity_browser` names the Entity Browser instance to open; `field_widget_display` (default
    `label`) controls how selected entities are shown, with `field_widget_display_settings` for that display
    plugin. These are added to the custom_field.field.* schema.'
  bundle: custom_field_entity_browser
  rubric_ref: rubric/custom_field_entity_browser_custom_field_entity_browser_settings_keys@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: custom_field_entity_browser-where-stored
  input: Where is the choice of the Entity Browser widget stored for a Custom Field column, and is the
    widget multi-value?
  criteria: It is stored on the Custom Field's base-widget component in the form display at settings.fields.<column>.type
    = entity_reference_entity_browser. The widget is hardcoded to cardinality 1 (single referenced entity
    per item).
  bundle: custom_field_entity_browser
  rubric_ref: rubric/custom_field_entity_browser_custom_field_entity_browser_where_stored@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: custom_field_entity_browser-known-widget
  input: On this site the 'cfeb_eval' content type has a Custom Field field_cfeb_ref with an entity_reference
    column named 'ref'. Inspect the live default form display and state which widget is configured for
    that column.
  criteria: In core.entity_form_display.node.cfeb_eval.default the field_cfeb_ref component has settings.fields.ref.type
    = entity_reference_entity_browser.
  bundle: custom_field_entity_browser
  rubric_ref: rubric/custom_field_entity_browser_custom_field_entity_browser_known_widget@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/custom_field_entity_browser-known-widget-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/custom_field_entity_browser-known-widget-cleanup.sh
- id: custom_field_entity_browser-known-display
  input: The Entity Browser widget on field_cfeb_ref's 'ref' column (content type cfeb_eval) is configured
    with a particular 'field widget display'. Inspect the live form display and report its value.
  criteria: settings.fields.ref.field_widget_display = rendered_entity in core.entity_form_display.node.cfeb_eval.default
    for field_cfeb_ref.
  bundle: custom_field_entity_browser
  rubric_ref: rubric/custom_field_entity_browser_custom_field_entity_browser_known_display@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/custom_field_entity_browser-known-display-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/custom_field_entity_browser-known-display-cleanup.sh
- id: custom_field_entity_browser-set-widget
  input: On this site, the Custom Field field_cfeb_ref on content type 'cfeb_eval' has an entity_reference
    column 'ref' currently edited with the plain autocomplete widget. Using custom_field_entity_browser,
    reconfigure the default form display so that the 'ref' column uses the Entity Browser widget instead.
    Apply it to the live site.
  criteria: In core.entity_form_display.node.cfeb_eval.default the field_cfeb_ref component has settings.fields.ref.type
    = entity_reference_entity_browser.
  bundle: custom_field_entity_browser
  rubric_ref: rubric/custom_field_entity_browser_custom_field_entity_browser_set_widget@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/custom_field_entity_browser-set-widget-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/custom_field_entity_browser-set-widget-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/custom_field_entity_browser-set-widget-verify.sh
- id: custom_field_entity_browser-build-ref-field
  input: On content type 'cfeb_eval', create a Custom Field named field_cfeb_ref whose storage defines
    a single entity_reference column named 'ref' that references node entities (target_type node). Apply
    it to the live site.
  criteria: field.storage.node.field_cfeb_ref is a `custom` field whose settings.columns.ref has type
    entity_reference and target_type node, instanced on cfeb_eval.
  bundle: custom_field_entity_browser
  rubric_ref: rubric/custom_field_entity_browser_custom_field_entity_browser_build_ref_field@1.0
  tags:
  - mode:execution
  - difficulty:hard
