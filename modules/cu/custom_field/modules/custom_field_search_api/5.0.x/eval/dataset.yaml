metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: custom_field_search_api
  version: 5.0.x
  note: 'custom_field_search_api is a one-subscriber glue module: SearchApiEventSubscriber listens to
    SearchApiEvents::MAPPING_FIELD_TYPES (onMappingFieldTypes) and adds $mapping[''custom_field_string_long'']
    = ''text'', so a Custom Field string_long column (property data type custom_field_string_long) can
    be indexed as Search API full-text `text`. It has no config/field/widget of its own. Live cases are
    grounded in (a) the live field-type mapping via search_api.data_type_helper->getFieldTypeMapping(),
    and (b) a namespaced Search API index `cfsapi_index` (entity:node datasource, no server needed for
    config-level checks) that indexes columns of a namespaced Custom Field field_cfsapi_desc (columns
    body:string_long, title:string) on content type cfsapi_eval. Index field_settings are read/written
    at the search_api.index.cfsapi_index config level (property_path <field>:<column>, type). This avoids
    the site''s known broken Views handler discovery (search_api index config does not use Views). setup/reset
    create the type+field+index; cleanup deletes the index entity, the field, and the content type.'
questions:
- id: custom_field_search_api-mapping
  input: What does the custom_field_search_api submodule do to make a Custom Field's long-text column
    indexable in Search API? Name the Search API event it uses and the mapping it adds.
  criteria: Its SearchApiEventSubscriber subscribes to SearchApiEvents::MAPPING_FIELD_TYPES (onMappingFieldTypes)
    and adds the field-type mapping custom_field_string_long => text, so a Custom Field string_long column
    can be indexed as Search API full-text `text`.
  bundle: custom_field_search_api
  rubric_ref: rubric/custom_field_search_api_custom_field_search_api_mapping@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: custom_field_search_api-string-long-type
  input: In Search API, what index field type does the custom_field_search_api module make available for
    a Custom Field 'string_long' (long text) column, and why is it needed?
  criteria: It maps the property data type custom_field_string_long to the Search API `text` (full-text)
    type. Without it, that property has no mapping and cannot be indexed as full text.
  bundle: custom_field_search_api
  rubric_ref: rubric/custom_field_search_api_custom_field_search_api_string_long_type@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: custom_field_search_api-property-path
  input: How is a single column of a Custom Field addressed when adding it as a field to a Search API
    index?
  criteria: By its property_path <field_name>:<column> on the entity datasource (e.g. field_desc:body),
    which points at that column of the custom field; the string_long column then gets the `text` type
    thanks to custom_field_search_api.
  bundle: custom_field_search_api
  rubric_ref: rubric/custom_field_search_api_custom_field_search_api_property_path@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: custom_field_search_api-live-mapping
