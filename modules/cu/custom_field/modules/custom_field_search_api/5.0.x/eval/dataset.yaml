    is mapped to on this site.
  criteria: search_api.data_type_helper->getFieldTypeMapping()['custom_field_string_long'] is 'text' (added
    by custom_field_search_api).
  bundle: custom_field_search_api
  rubric_ref: rubric/custom_field_search_api_custom_field_search_api_live_mapping@1.0
  tags:
