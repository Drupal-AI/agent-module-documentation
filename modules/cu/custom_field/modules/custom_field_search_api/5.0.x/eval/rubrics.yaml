rubrics:
- id: custom_field_search_api_custom_field_search_api_mapping
  version: '1.0'
  applicable_bundles:
  - custom_field_search_api
  checks:
  - kind: must_contain_any
    values:
    - MAPPING_FIELD_TYPES
    - onMappingFieldTypes
    - custom_field_string_long
    - mapping
  scoring:
    combine: all_pass
- id: custom_field_search_api_custom_field_search_api_string_long_type
  version: '1.0'
  applicable_bundles:
  - custom_field_search_api
  checks:
  - kind: must_contain_any
    values:
    - text
    - string_long
    - fulltext
    - full-text
  scoring:
    combine: all_pass
- id: custom_field_search_api_custom_field_search_api_property_path
  version: '1.0'
  applicable_bundles:
  - custom_field_search_api
  checks:
  - kind: must_contain_any
    values:
    - property_path
    - property path
    - ':'
    - field_name
    - column
  scoring:
    combine: all_pass
- id: custom_field_search_api_custom_field_search_api_live_mapping
  version: '1.0'
  applicable_bundles:
  - custom_field_search_api
  checks:
  - kind: must_contain_any
    values:
    - text
  scoring:
    combine: all_pass
- id: custom_field_search_api_custom_field_search_api_known_indexed
  version: '1.0'
  applicable_bundles:
  - custom_field_search_api
  checks:
  - kind: must_contain_any
    values:
    - field_cfsapi_desc:body
    - body
    - text
  scoring:
    combine: all_pass
- id: custom_field_search_api_custom_field_search_api_index_body
  version: '1.0'
  applicable_bundles:
  - custom_field_search_api
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
- id: custom_field_search_api_custom_field_search_api_index_title
  version: '1.0'
  applicable_bundles:
  - custom_field_search_api
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
