metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: custom_field_viewfield
  version: 5.0.x
  note: 'custom_field_viewfield is a submodule of custom_field. It registers plugins INTO custom_field''s
    plugin managers (it defines no new plugin type): CustomFieldType ''viewfield'' (a column with target_type:
    view), CustomFieldWidget ''viewfield_select'', CustomFieldFormatter ''viewfield_default'', and a CustomFieldFeedsType
    ''viewfield''. A viewfield column lives in a ''custom'' field''s storage ''columns'' setting; the
    widget/formatter are chosen per column under the Custom Field widget/formatter component''s settings.fields.<column>.
    Medium/hard cases are grounded in that live config on a namespaced content type cf_vf_eval with the
    Custom Field field_cf_vf (viewfield column ''listing''), read/written via field.storage + entity_form_display.
    Requires custom_field + core views (both enabled here).'
questions:
- id: custom_field_viewfield-plugins
  input: In the Drupal module custom_field_viewfield (a Custom Field submodule), what Custom Field plugin
    ids does it add so you can embed a View inside a custom field column? Name the field-type, widget
    and formatter ids.
  criteria: 'It registers a CustomFieldType ''viewfield'' (the column type, target_type: view), a CustomFieldWidget
    ''viewfield_select'', a CustomFieldFormatter ''viewfield_default'', and a CustomFieldFeedsType ''viewfield''
    — all consumed inside a parent ''custom'' field.'
  bundle: custom_field_viewfield
  rubric_ref: rubric/custom_field_viewfield_custom_field_viewfield_plugins@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: custom_field_viewfield-storage
  input: How is a viewfield subfield stored when using custom_field_viewfield? Where in the field configuration
    does the 'viewfield' column live, and what target_type does it use?
  criteria: 'It is a column inside a normal ''custom'' field''s storage setting: field.storage.<entity>.<field>.settings.columns.<name>
    = {type: viewfield, target_type: view}. It is not a standalone field type.'
  bundle: custom_field_viewfield
  rubric_ref: rubric/custom_field_viewfield_custom_field_viewfield_storage@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: custom_field_viewfield-deps
  input: custom_field_viewfield is a submodule. What does it depend on, and is it a standalone field or
    part of another field?
  criteria: It depends on custom_field and core views. It is not a standalone field type — it adds a 'viewfield'
    subfield/column plus its widget and formatter to the Custom Field plugin system.
  bundle: custom_field_viewfield
  rubric_ref: rubric/custom_field_viewfield_custom_field_viewfield_deps@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: custom_field_viewfield-known-column
  input: On this site the content type cf_vf_eval has a Custom Field named field_cf_vf. One of its subfield
    columns is a viewfield. Inspect the live field storage and give the machine name of the viewfield
    column.
  criteria: 'The column ''listing'' has type viewfield (target_type: view) in field.storage.node.field_cf_vf
    settings.columns.'
  bundle: custom_field_viewfield
  rubric_ref: rubric/custom_field_viewfield_custom_field_viewfield_known_column@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/custom_field_viewfield-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/custom_field_viewfield-teardown.sh
- id: custom_field_viewfield-known-widget
  input: On this site, the 'listing' viewfield column of the Custom Field field_cf_vf on content type
    cf_vf_eval has a subfield widget configured on the default form display. Inspect the live form display
    and state which Custom Field widget is used for that column.
  criteria: The 'listing' column uses widget viewfield_select — in core.entity_form_display.node.cf_vf_eval.default
    the field_cf_vf component settings.fields.listing.type is viewfield_select.
  bundle: custom_field_viewfield
  rubric_ref: rubric/custom_field_viewfield_custom_field_viewfield_known_widget@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/custom_field_viewfield-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/custom_field_viewfield-teardown.sh
- id: custom_field_viewfield-build-column
  input: On this site there is a content type cf_vf_eval but no Custom Field on it yet. Using custom_field
    and custom_field_viewfield, create a Custom Field named field_cf_vf on cf_vf_eval whose storage has
    a viewfield column (so it can embed a View). Apply it to the live site.
  criteria: 'Create field storage field.storage.node.field_cf_vf of type ''custom'' whose settings.columns
    contains a column with type ''viewfield'' (target_type: view), plus a field instance on cf_vf_eval.'
  bundle: custom_field_viewfield
  rubric_ref: rubric/custom_field_viewfield_custom_field_viewfield_build_column@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/custom_field_viewfield-build-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/custom_field_viewfield-teardown.sh
    verify: agent-module-documentation/evaluation/verify/custom_field_viewfield-build-verify.sh
- id: custom_field_viewfield-set-widget
  input: On this site the Custom Field field_cf_vf on cf_vf_eval has a viewfield column 'listing' whose
    subfield widget on the default form display is currently 'hidden'. Change that subfield's widget to
    the viewfield select widget provided by custom_field_viewfield, and apply it to the live site.
  criteria: In core.entity_form_display.node.cf_vf_eval.default set the field_cf_vf component settings.fields.listing.type
    to viewfield_select.
  bundle: custom_field_viewfield
  rubric_ref: rubric/custom_field_viewfield_custom_field_viewfield_set_widget@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/custom_field_viewfield-widget-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/custom_field_viewfield-teardown.sh
    verify: agent-module-documentation/evaluation/verify/custom_field_viewfield-widget-verify.sh
