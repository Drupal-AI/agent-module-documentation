metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: custom_field_media
  version: 5.0.x
  note: 'custom_field_media adds one Custom Field widget, media_library_widget (class MediaLibraryWidget
    extends EntityReferenceWidgetBase, category Media, field_types [''entity_reference'']), applicable
    only when the Custom Field entity_reference column''s target_type is ''media''. Per-column widget
    config lives at core.entity_form_display.<...>.content.<field>.settings.fields.<column>.type = ''media_library_widget''
    with optional settings.fields.<column>.media_types (sequence of allowed media type IDs). The column
    is a normal custom_field entity_reference column with target_type: media in the field storage columns
    setting. Medium/hard cases are grounded in that real config on a namespaced content type cfmedia_eval
    with field_cfmedia_* fields (created by setup/reset, removed by cleanup). No Views are created (a
    broken module on this site fatals Views handler discovery).'
questions:
- id: custom_field_media-widget-id
  input: In the custom_field_media submodule, what is the machine name of the widget it provides, and
    on what kind of Custom Field column can it be used?
  criteria: It provides the media_library_widget ('Media library') widget, usable on a Custom Field entity_reference
    column whose target_type is media.
  bundle: custom_field_media
  rubric_ref: rubric/custom_field_media_custom_field_media_widget_id@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: custom_field_media-target-type
  input: Which subfield (column) type must a Custom Field column be, and referencing which entity type,
    for the custom_field_media 'Media library' widget to be available?
  criteria: The column must be a custom_field entity_reference type with target_type set to media; isApplicable()
    only returns true when getTargetType() === 'media'.
  bundle: custom_field_media
  rubric_ref: rubric/custom_field_media_custom_field_media_target_type@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: custom_field_media-media-types
  input: How do you restrict which media bundles an editor can pick with the custom_field_media Media
    library widget, and where is that stored?
  criteria: Set the widget's media_types setting (a sequence of allowed media type IDs, in display order;
    empty means all allowed). It is stored on the form-display component at settings.fields.<column>.media_types,
    a schema key added to custom_field.field.* by hook_config_schema_info_alter().
  bundle: custom_field_media
  rubric_ref: rubric/custom_field_media_custom_field_media_media_types@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: custom_field_media-known-widget
  input: On this Drupal site, the Custom Field field_cfmedia_wid on the 'cfmedia_eval' content type has
    its 'image' column configured on the default form display. Inspect the live configuration and state
    which widget that column uses.
  criteria: In core.entity_form_display.node.cfmedia_eval.default the field_cfmedia_wid component's settings.fields.image.type
    is media_library_widget (with media_types ['image']).
  bundle: custom_field_media
  rubric_ref: rubric/custom_field_media_custom_field_media_known_widget@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
