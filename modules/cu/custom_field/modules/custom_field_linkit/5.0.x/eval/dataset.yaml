metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: custom_field_linkit
  version: 5.0.x
  note: 'custom_field_linkit is a Custom Field submodule. It registers plugins into custom_field''s plugin
    managers (no new plugin type): CustomFieldWidget ''linkit'' (link column) and ''linkit_url'' (uri
    column), plus CustomFieldFormatter ''linkit''/''linkit_url''. Selection is per column: the subfield
    widget id is stored in the entity form display at component.settings.fields.<column>.type, the subfield
    formatter id in the entity view display at component.settings.fields.<column>.format_type. Medium/hard
    cases are grounded on a namespaced content type cf_lk_eval with the Custom Field field_cf_lk, read/written
    via field.storage + entity_form_display. Requires custom_field + linkit (both enabled here).'
questions:
- id: custom_field_linkit-plugins
  input: In the Drupal module custom_field_linkit, which Custom Field widget ids does it add, and which
    subfield column types do they apply to?
  criteria: It adds CustomFieldWidget 'linkit' for a 'link' column and 'linkit_url' for a 'uri' column
    (and matching CustomFieldFormatter 'linkit'/'linkit_url'). They give a Linkit autocomplete inside
    a Custom Field column.
  bundle: custom_field_linkit
  rubric_ref: rubric/custom_field_linkit_custom_field_linkit_plugins@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: custom_field_linkit-storage
  input: When using custom_field_linkit, where is the choice of the Linkit widget stored for a given Custom
    Field column, and where is the formatter stored?
  criteria: The widget id is stored on the entity form display at component.settings.fields.<column>.type;
    the formatter id on the entity view display at component.settings.fields.<column>.format_type. There
    is no separate field type or config route.
  bundle: custom_field_linkit
  rubric_ref: rubric/custom_field_linkit_custom_field_linkit_storage@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: custom_field_linkit-deps
  input: What does custom_field_linkit depend on, and what capability does it add to a Custom Field link
    column?
  criteria: It depends on custom_field and linkit, and adds Linkit autocomplete (searchable internal-entity
    linking, resolved via a Linkit profile) to link/uri columns of a Custom Field.
  bundle: custom_field_linkit
  rubric_ref: rubric/custom_field_linkit_custom_field_linkit_deps@1.0
