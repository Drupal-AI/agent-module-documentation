metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: custom_pub
  version: 1.1.x
  note: Custom Publishing Options defines a config entity custom_publishing_option (config prefix custom_pub.custom_publishing_option.<id>;
    keys id, label, description, publish_under_promote_options). Creating one installs a boolean base
    field on the node entity named after the option id (postSave), deleting it uninstalls that field (postDelete).
    It provides a per-option permission 'can set node publish state to <id>' plus static 'administer custom
    publishing options', an Action plugin set_custom_publishing_option_value, a Rules action and a d7
    migrate source. Admin route entity.custom_publishing_option.collection at /admin/config/content/custom_publishing_option.
    No Drush, no plugin types. Medium/hard cases are grounded in the real config entity + the auto-installed
    node base field (cpub_known / cpub_task).
questions:
- id: custom_pub-what-happens
  input: In Drupal, when I create a Custom Publishing Option with the custom_pub module, what does it
    add to my nodes, and where in the admin UI do I manage these options?
  criteria: Each option is a custom_publishing_option config entity; creating one installs a boolean base
    field on the node entity (named after the option id) that shows as a checkbox on the node form and
    is usable in Views. Manage them at /admin/config/content/custom_publishing_option (route entity.custom_publishing_option.collection).
  bundle: custom_pub
  rubric_ref: rubric/custom_pub_custom_pub_what_happens@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: custom_pub-permission
  input: With custom_pub, how is access to setting a specific custom publishing option controlled, and
    what permission is needed to manage the options themselves?
  criteria: 'There is a dynamic per-option permission ''can set node publish state to <option_id>'' that
    controls whether that option''s checkbox shows on the node form, plus the static ''administer custom
    publishing options'' permission to create/edit/delete options. (Note: to also see core status/promote/sticky
    a role still needs ''administer nodes''.)'
  bundle: custom_pub
  rubric_ref: rubric/custom_pub_custom_pub_permission@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: custom_pub-action
  input: How can I bulk-set a custom publishing option on many nodes at once with the custom_pub module?
    Name the mechanism it provides.
  criteria: 'It ships a node Action plugin, set_custom_publishing_option_value (''Set a custom publish
    option value on a node''), configurable with an option id and a boolean value; run it from a View/VBO
    or the content overview to bulk-set the option. Programmatically the option is just a node boolean
    field: $node->set(''<id>'', TRUE).'
  bundle: custom_pub
  rubric_ref: rubric/custom_pub_custom_pub_action@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: custom_pub-known-field
  input: This Drupal site has a custom publishing option named cpub_known defined via custom_pub. Inspect
    the live site and state the machine name of the boolean node field that this option added.
  criteria: The node base field is cpub_known (same as the option id). The option config entity custom_pub.custom_publishing_option.cpub_known
    exists and its postSave installed a boolean base field named cpub_known on node.
  bundle: custom_pub
  rubric_ref: rubric/custom_pub_custom_pub_known_field@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/custom_pub-known-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/custom_pub-known-cleanup.sh
- id: custom_pub-known-promote
  input: Inspect the custom publishing option cpub_known on this site. Is it configured to appear under
    core's 'Promotion options' on the node form? Read the live config to answer.
  criteria: 'Yes: custom_pub.custom_publishing_option.cpub_known has publish_under_promote_options: true,
    so its checkbox is grouped under core''s Promotion options rather than the separate Custom Publish
    Options section.'
  bundle: custom_pub
  rubric_ref: rubric/custom_pub_custom_pub_known_promote@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/custom_pub-known-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/custom_pub-known-cleanup.sh
- id: custom_pub-create
  input: On this Drupal site, use the custom_pub module to create a new custom publishing option with
    the machine id 'cpub_task' (label 'Task State'). Apply it to the live site so that it adds its boolean
    field to nodes.
  criteria: A custom_publishing_option config entity with id cpub_task exists (custom_pub.custom_publishing_option.cpub_task)
    and its postSave installed a boolean base field named cpub_task on the node entity. Create it via
    CustomPublishingOption::create(['id'=>'cpub_task','label'=>'Task State',...])->save() or the add form
    at /admin/config/content/custom_publishing_option/add.
  bundle: custom_pub
  rubric_ref: rubric/custom_pub_custom_pub_create@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/custom_pub-create-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/custom_pub-create-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/custom_pub-create-verify.sh
- id: custom_pub-create-layman
  input: Besides 'Published', I want a new on/off marker I can tick on my content, with the internal name
    'cpub_task' and the label 'Task State'. Please add that new publishing marker to my Drupal site so
    it shows up as a checkbox on content.
  criteria: Create a custom_publishing_option with id cpub_task; its postSave installs a boolean node
    base field named cpub_task shown as a checkbox on the node form.
  bundle: custom_pub
  rubric_ref: rubric/custom_pub_custom_pub_create_layman@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: site-owner
    reset: agent-module-documentation/evaluation/verify/custom_pub-create-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/custom_pub-create-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/custom_pub-create-verify.sh
