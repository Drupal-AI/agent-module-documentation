- id: current_page_crumb-place-breadcrumb-layman
  input: I installed the Current Page Crumb module because I want the name of the page to show up in the
    little breadcrumb trail near the top of my pages. But on my site (it uses the theme called 'Canvas
    Stark') there is no breadcrumb trail showing up at all. Can you make the breadcrumbs appear on that
    theme's pages?
  criteria: 'The fix is to place and enable a Breadcrumb block in the Canvas Stark theme: an enabled block
    with plugin system_breadcrumb_block in theme canvas_stark (via /admin/structure/block ''Place block''
    -> Breadcrumbs, or drush/Block::create()). Once a breadcrumb block renders, current_page_crumb appends
    the current page title as the final crumb.'
  bundle: current_page_crumb
  rubric_ref: rubric/current_page_crumb_current_page_crumb_place_breadcrumb_layman@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: site-owner-layman
