rubrics:
- id: current_page_crumb_current_page_crumb_mechanism
  version: '1.0'
  applicable_bundles:
  - current_page_crumb
  checks:
  - kind: must_contain_any
    values:
    - <none>
    - BreadcrumbBuilder
    - PathBasedBreadcrumbBuilder
    - Link::createFromRoute
    - createFromRoute
  scoring:
    combine: all_pass
- id: current_page_crumb_current_page_crumb_admin_front_excluded
  version: '1.0'
  applicable_bundles:
  - current_page_crumb
  checks:
  - kind: must_contain_any
    values:
    - admin
    - _admin_route
    - front page
    - isFrontPage
  scoring:
    combine: all_pass
- id: current_page_crumb_current_page_crumb_title_fallback
  version: '1.0'
  applicable_bundles:
  - current_page_crumb
  checks:
  - kind: must_contain_any
    values:
    - path
    - segment
    - str_replace
    - ucfirst
    - dash
    - underscore
  scoring:
    combine: all_pass
- id: current_page_crumb_current_page_crumb_block_region
  version: '1.0'
  applicable_bundles:
  - current_page_crumb
  checks:
  - kind: must_contain_any
    values:
    - content
  scoring:
    combine: all_pass
- id: current_page_crumb_current_page_crumb_which_block_enabled
  version: '1.0'
  applicable_bundles:
  - current_page_crumb
  checks:
  - kind: must_contain_any
    values:
    - cpc_m_on
  scoring:
    combine: all_pass
- id: current_page_crumb_current_page_crumb_place_breadcrumb_expert
  version: '1.0'
  applicable_bundles:
  - current_page_crumb
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
- id: current_page_crumb_current_page_crumb_place_breadcrumb_layman
  version: '1.0'
  applicable_bundles:
  - current_page_crumb
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
