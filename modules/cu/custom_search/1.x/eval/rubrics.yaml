rubrics:
- id: custom_search_cs_block
  version: '1.0'
  applicable_bundles:
  - custom_search
  checks:
  - kind: must_contain_any
    values:
    - custom_search
    - Custom Search
    - block
  scoring:
    combine: all_pass
- id: custom_search_cs_selectors
  version: '1.0'
  applicable_bundles:
  - custom_search
  checks:
  - kind: must_contain_any
    values:
    - taxonomy
    - criteria
    - content type
  scoring:
    combine: all_pass
- id: custom_search_cs_results_config
  version: '1.0'
  applicable_bundles:
  - custom_search
  checks:
  - kind: must_contain_any
    values:
    - custom_search.settings.results
    - search page
    - Search pages
  scoring:
    combine: all_pass
- id: custom_search_cs_known_block
  version: '1.0'
  applicable_bundles:
  - custom_search
  checks:
  - kind: must_contain_any
    values:
    - custom_search
    - article
  scoring:
    combine: all_pass
- id: custom_search_cs_place_block
  version: '1.0'
  applicable_bundles:
  - custom_search
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
