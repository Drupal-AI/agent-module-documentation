metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: custom_search
  version: 1.x
  note: 'Enhances core Search. Provides the ''custom_search'' block (CustomSearchBlock, schema block.settings.custom_search:
    search_box, submit, content [types/selector/any/excluded], taxonomy, criteria, searchapi, languages)
    and alters the core search settings/results pages, seeding per-search-page config into custom_search.settings.results
    (keyed by node_search page id: advanced form types/criteria/languages, displayed info, filter). configure
    is null. Depends on search + block. Medium/hard place/inspect a custom_search block (custom_search_probe
    / custom_search_task).'
questions:
- id: cs-block
  input: With the Custom Search module, how do I add a search box that lets visitors pick which content
    type to search? What block do I place?
  criteria: Place the 'Custom Search' block (plugin id custom_search) via Block layout; in its settings
    enable a content-type selector under 'content' (types + selector) so visitors can choose which content
    type to search.
  bundle: custom_search
  rubric_ref: rubric/custom_search_cs_block@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: cs-selectors
  input: Which selectors can the Custom Search block add to a search form to narrow a search besides content
    types?
  criteria: Besides content-type selectors, the block can add taxonomy selectors (with depth) and criteria
    toggles (or / phrase / negative), and can route to a Search API page. These live under the block's
    settings (content, taxonomy, criteria, searchapi).
  bundle: custom_search
  rubric_ref: rubric/custom_search_cs_selectors@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: cs-results-config
  input: Custom Search has no single settings page. Where does it store the per-search-page customizations
    (advanced form, allowed types, displayed info) and where do you edit them?
  criteria: It seeds per-search-page settings into the config object custom_search.settings.results (keyed
    by each node_search page id). You edit them via the core Search pages settings form (Configuration
    -> Search and metadata -> Search pages), where custom_search injects its options.
  bundle: custom_search
  rubric_ref: rubric/custom_search_cs_results_config@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: cs-known-block
  input: On this site a Custom Search block has been placed and restricted to a single content type. Inspect
    the block configuration and report its block plugin id and which content type it is restricted to.
  criteria: The block custom_search_probe uses plugin id custom_search and its settings.content.types
    restricts it to the 'article' content type (read block.block.custom_search_probe).
  bundle: custom_search
  rubric_ref: rubric/custom_search_cs_known_block@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/custom_search-known-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/custom_search-known-cleanup.sh
- id: cs-place-block
  input: Place a Custom Search block on this site with the machine id 'custom_search_task' in the content
