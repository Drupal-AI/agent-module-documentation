  criteria: Create a Block config entity id custom_search_task with plugin 'custom_search' in region content
    of the default theme, status TRUE, and save. verify checks the block exists, uses plugin custom_search,
    and is enabled.
  bundle: custom_search
  rubric_ref: rubric/custom_search_cs_place_block@1.0
