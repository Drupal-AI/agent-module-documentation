metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: currency_intl
  version: 3.6.x
  note: Currency Intl is a submodule of Currency that adds exactly one amount-formatter plugin, currency_intl
    ('Unicode number patterns'), using PHP's Intl NumberFormatter. It has no routes/permissions/services/schema.
    It becomes active by being selected as the site default amount formatter, stored in config currency.amount_formatting
    -> plugin_id. The medium case reads back which formatter is the default; the hard case has the agent
    switch the default to currency_intl, verified against live config. Requires the PHP intl extension
    (present on this site).
questions:
- id: currency_intl-what-it-adds
  input: What does the Drupal currency_intl submodule add, and what is the machine id of its amount-formatter
    plugin?
  criteria: It adds one @CurrencyAmountFormatter plugin with id currency_intl (label 'Unicode number patterns')
    that formats money using PHP's Intl NumberFormatter for locale-accurate output. Nothing else.
  bundle: currency_intl
  rubric_ref: rubric/currency_intl_currency_intl_what_it_adds@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: currency_intl-how-to-enable
  input: After installing currency_intl on a Drupal site, how do I actually make it format my currency
    amounts, and where is that choice stored?
  criteria: 'Select ''Unicode number patterns'' as the default amount formatter at /admin/config/regional/currency-formatting;
    the choice is stored in config currency.amount_formatting -> plugin_id: currency_intl.'
  bundle: currency_intl
  rubric_ref: rubric/currency_intl_currency_intl_how_to_enable@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: currency_intl-requirement
  input: Which PHP extension does the Drupal currency_intl module rely on to format amounts, and how does
    it surface whether it is available?
  criteria: 'It relies on the PHP intl extension; currency_intl_requirements() adds a ''PHP Intl extension:
    Loaded/Not loaded'' line to the status report.'
  bundle: currency_intl
  rubric_ref: rubric/currency_intl_currency_intl_requirement@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: currency_intl-current-default
  input: Which amount formatter is currently configured as the site default for the Drupal currency module?
    Inspect the live configuration and give the plugin id.
  criteria: 'The default amount formatter is currency_intl: config currency.amount_formatting has plugin_id:
    currency_intl.'
  bundle: currency_intl
  rubric_ref: rubric/currency_intl_currency_intl_current_default@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/currency_intl-default-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/currency_intl-default-cleanup.sh
- id: currency_intl-set-default
  input: On this Drupal site, make the currency_intl 'Unicode number patterns' formatter the default amount
    formatter for the currency module, and apply the change to the live site.
  criteria: 'config currency.amount_formatting has plugin_id: currency_intl (e.g. drush cset currency.amount_formatting
    plugin_id currency_intl, or select ''Unicode number patterns'' on /admin/config/regional/currency-formatting).'
  bundle: currency_intl
  rubric_ref: rubric/currency_intl_currency_intl_set_default@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/currency_intl-set-default-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/currency_intl-set-default-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/currency_intl-set-default-verify.sh
