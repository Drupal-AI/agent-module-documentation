rubrics:
- id: currency_intl_currency_intl_what_it_adds
  version: '1.0'
  applicable_bundles:
  - currency_intl
  checks:
  - kind: must_contain_any
    values:
    - currency_intl
    - Unicode number patterns
    - NumberFormatter
  scoring:
    combine: all_pass
- id: currency_intl_currency_intl_how_to_enable
  version: '1.0'
  applicable_bundles:
  - currency_intl
  checks:
  - kind: must_contain_any
    values:
    - currency.amount_formatting
    - amount formatting
    - plugin_id
    - default
  scoring:
    combine: all_pass
- id: currency_intl_currency_intl_requirement
  version: '1.0'
  applicable_bundles:
  - currency_intl
  checks:
  - kind: must_contain_any
    values:
    - intl
    - Intl extension
  scoring:
    combine: all_pass
- id: currency_intl_currency_intl_current_default
  version: '1.0'
  applicable_bundles:
  - currency_intl
  checks:
  - kind: must_contain_any
    values:
    - currency_intl
  scoring:
    combine: all_pass
- id: currency_intl_currency_intl_set_default
  version: '1.0'
  applicable_bundles:
  - currency_intl
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
