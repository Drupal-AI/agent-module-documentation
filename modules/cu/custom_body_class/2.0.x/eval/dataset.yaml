metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: custom_body_class
  version: 2.0.x
  note: 'Custom body class adds two node base fields (body_class string, specific_node_class boolean)
    and a per-content-type third-party setting custom_body_class.classes on the node_type entity; custom_body_class_preprocess_html()
    appends all three to the <body> class attribute. No configure route, no permission, no config schema,
    no plugins, no Drush. Medium/hard cases are grounded in real state: the node_type third-party setting
    and a node''s body_class field value.'
questions:
- id: cbc-per-node
  input: Using the custom_body_class module, how do I add a CSS class to the <body> tag of one specific
    node?
  criteria: The module adds a `body_class` field (label 'Add CSS class(es)') to every node under 'Custom
    Body Class Settings' on the node add/edit form. Enter one or more space-separated classes; they are
    added to the body tag on that node's page.
  bundle: custom_body_class
  rubric_ref: rubric/custom_body_class_cbc_per_node@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: cbc-per-type
  input: With custom_body_class, how can I add a CSS class to the <body> of every node of a given content
    type, and where is that stored?
  criteria: On the node type edit form there is a 'Custom Body Class Settings' field ('CSS class(es)').
    Its value is stored as a third-party setting custom_body_class.classes on the node_type config entity
    and applied to every node of that bundle.
  bundle: custom_body_class
  rubric_ref: rubric/custom_body_class_cbc_per_type@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: cbc-node-type-class
  input: What does the 'If checked, add name of node type as class to body tag' checkbox (specific_node_class)
    in custom_body_class do?
  criteria: The specific_node_class boolean field, when checked on a node, adds that node's content-type
    machine name (e.g. `article`) as a class on the <body> tag of its page.
  bundle: custom_body_class
  rubric_ref: rubric/custom_body_class_cbc_node_type_class@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: cbc-type-classes
  input: On this Drupal site, the Article content type has custom body class(es) configured via the custom_body_class
    module. Inspect the live configuration and report the class string set for Article.
  criteria: Article has custom_body_class.classes = 'promo-page featured' (third-party setting on node.type.article).
  bundle: custom_body_class
  rubric_ref: rubric/custom_body_class_cbc_type_classes@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/custom_body_class-type-classes-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/custom_body_class-type-classes-cleanup.sh
- id: cbc-node-class
  input: There is an Article node titled 'CBC Known Node' on this site. Inspect that node and report the
    value of its custom body class field (added by custom_body_class).
  criteria: The node's body_class field value is 'cbc-known-class'.
  bundle: custom_body_class
  rubric_ref: rubric/custom_body_class_cbc_node_class@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/custom_body_class-node-class-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/custom_body_class-node-class-cleanup.sh
- id: cbc-type-set
  input: Using the custom_body_class module, configure the Article content type so that every Article
    page gets the body class 'campaign-2026'. Apply the change to the live site.
  criteria: 'Set the third-party setting custom_body_class.classes = ''campaign-2026'' on the Article
    node type: $type = NodeType::load(''article''); $type->setThirdPartySetting(''custom_body_class'',''classes'',''campaign-2026'')->save();'
  bundle: custom_body_class
  rubric_ref: rubric/custom_body_class_cbc_type_set@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/custom_body_class-type-set-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/custom_body_class-type-set-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/custom_body_class-type-set-verify.sh
- id: cbc-node-set
  input: Create a new Article titled 'CBC Hard Node' on this site and, using custom_body_class, give that
    one page the body class 'launch-hero'. Apply it to the live site.
  criteria: 'Create an Article node with title ''CBC Hard Node'' and set its body_class field to ''launch-hero'':
    Node::create([''type''=>''article'',''title''=>''CBC Hard Node'',''body_class''=>''launch-hero''])->save();'
  bundle: custom_body_class
  rubric_ref: rubric/custom_body_class_cbc_node_set@1.0
  tags:
  - mode:execution
