rubrics:
- id: custom_body_class_cbc_per_node
  version: '1.0'
  applicable_bundles:
  - custom_body_class
  checks:
  - kind: must_contain_any
    values:
    - body_class
    - Add CSS class
    - node form
    - node edit
  scoring:
    combine: all_pass
- id: custom_body_class_cbc_per_type
  version: '1.0'
  applicable_bundles:
  - custom_body_class
  checks:
  - kind: must_contain_any
    values:
    - third party setting
    - third_party_settings
    - node type
    - content type
  scoring:
    combine: all_pass
- id: custom_body_class_cbc_node_type_class
  version: '1.0'
  applicable_bundles:
  - custom_body_class
  checks:
  - kind: must_contain_any
    values:
    - specific_node_class
    - node type
    - machine name
    - content type
  scoring:
    combine: all_pass
- id: custom_body_class_cbc_type_classes
  version: '1.0'
  applicable_bundles:
  - custom_body_class
  checks:
  - kind: must_contain_any
    values:
    - promo-page
  scoring:
    combine: all_pass
- id: custom_body_class_cbc_node_class
  version: '1.0'
  applicable_bundles:
  - custom_body_class
  checks:
  - kind: must_contain_any
    values:
    - cbc-known-class
  scoring:
    combine: all_pass
- id: custom_body_class_cbc_type_set
  version: '1.0'
  applicable_bundles:
  - custom_body_class
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
- id: custom_body_class_cbc_node_set
  version: '1.0'
  applicable_bundles:
  - custom_body_class
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
