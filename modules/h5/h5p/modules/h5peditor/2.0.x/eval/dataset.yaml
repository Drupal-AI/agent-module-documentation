metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: h5peditor
  version: 2.0.x
  note: 'h5peditor adds the in-browser H5P authoring field widget ''h5p_editor'' (alternative to the base
    ''h5p_upload'') and AJAX endpoints (H5PEditorAJAXController on /h5peditor/{token}/{content_id}/...),
    plus permissions ''access h5p editor'' and ''install recommended h5p libraries''. No config. The external
    H5P content-type libraries/Hub are not installed, so medium/hard cases are grounded in LOCAL state:
    an h5p-type field and its entity_form_display widget (choosing h5p_editor). Namespaced with ''field_h5pe_''.'
questions:
- id: h5peditor-widget
  input: Which field widget does the h5peditor module add so editors can author H5P content in the browser
    instead of only uploading a .h5p package, and what is the base module's upload widget called?
  criteria: h5peditor adds the 'h5p_editor' widget (choose it on the H5P field in Manage form display);
    the base h5p module's upload widget is 'h5p_upload'.
  bundle: h5peditor
  rubric_ref: rubric/h5peditor_h5peditor_widget@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: h5peditor-permission
  input: Which permission must a role have to use the H5P authoring editor widget provided by h5peditor?
  criteria: The 'access h5p editor' permission. (h5peditor also adds 'install recommended h5p libraries'
    for installing Hub-recommended content types.)
  bundle: h5peditor
  rubric_ref: rubric/h5peditor_h5peditor_permission@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: h5peditor-hub-install
  input: What extra capability does h5peditor provide beyond the base H5P module, and which permission
    limits a user to installing only Hub-recommended content types?
  criteria: It provides in-browser authoring and installing content types from the H5P Hub via AJAX endpoints;
    the 'install recommended h5p libraries' permission restricts a user to Hub-recommended content types.
  bundle: h5peditor
  rubric_ref: rubric/h5peditor_h5peditor_hub_install@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: h5peditor-which-widget
  input: On this Drupal site the Article content type has an H5P field configured for in-browser authoring.
    Inspect the live default form display and state the widget type used for that field.
  criteria: The field's widget type in core.entity_form_display.node.article.default is 'h5p_editor' (the
    authoring widget).
  bundle: h5peditor
  rubric_ref: rubric/h5peditor_h5peditor_which_widget@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/h5peditor-which-widget-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/h5peditor-which-widget-cleanup.sh
- id: h5peditor-which-field
  input: On this Drupal site one H5P field on the Article type is set to use the in-browser H5P editor
    widget. Inspect the live form display and give the machine name of that field.
  criteria: The field field_h5pe_named uses the h5p_editor widget in core.entity_form_display.node.article.default.
  bundle: h5peditor
  rubric_ref: rubric/h5peditor_h5peditor_which_field@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/h5peditor-which-field-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/h5peditor-which-field-cleanup.sh
- id: h5peditor-enable-authoring
  input: On this Drupal site there is an H5P field named 'field_h5pe_task' on the Article content type.
    Configure the default form display so that this field uses the in-browser H5P authoring editor instead
    of the upload widget. Apply the change to the live site.
  criteria: In core.entity_form_display.node.article.default set the field_h5pe_task component's widget
    type to 'h5p_editor' (was 'h5p_upload') and save.
  bundle: h5peditor
  rubric_ref: rubric/h5peditor_h5peditor_enable_authoring@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/h5peditor-enable-authoring-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/h5peditor-enable-authoring-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/h5peditor-enable-authoring-verify.sh
- id: h5peditor-switch-widget
  input: On this Drupal site the Article type has an H5P field 'field_h5pe_switch' currently using the
    upload widget (h5p_upload). Switch it to the H5P editor authoring widget on the default form display.
    Apply the change to the live site.
  criteria: Change the field_h5pe_switch form-display component type from 'h5p_upload' to 'h5p_editor'
    in core.entity_form_display.node.article.default and save.
  bundle: h5peditor
  rubric_ref: rubric/h5peditor_h5peditor_switch_widget@1.0
  tags:
  - mode:execution
  - difficulty:hard
