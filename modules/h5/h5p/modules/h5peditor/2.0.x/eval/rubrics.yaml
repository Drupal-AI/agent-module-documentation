rubrics:
- id: h5peditor_h5peditor_widget
  version: '1.0'
  applicable_bundles:
  - h5peditor
  checks:
  - kind: must_contain_any
    values:
    - h5p_editor
  scoring:
    combine: all_pass
- id: h5peditor_h5peditor_permission
  version: '1.0'
  applicable_bundles:
  - h5peditor
  checks:
  - kind: must_contain_any
    values:
    - access h5p editor
  scoring:
    combine: all_pass
- id: h5peditor_h5peditor_hub_install
  version: '1.0'
  applicable_bundles:
  - h5peditor
  checks:
  - kind: must_contain_any
    values:
    - install recommended h5p libraries
    - editor
    - Hub
  scoring:
    combine: all_pass
- id: h5peditor_h5peditor_which_widget
  version: '1.0'
  applicable_bundles:
  - h5peditor
  checks:
  - kind: must_contain_any
    values:
    - h5p_editor
  scoring:
    combine: all_pass
- id: h5peditor_h5peditor_which_field
  version: '1.0'
  applicable_bundles:
  - h5peditor
  checks:
  - kind: must_contain_any
    values:
    - field_h5pe_named
  scoring:
    combine: all_pass
- id: h5peditor_h5peditor_enable_authoring
  version: '1.0'
  applicable_bundles:
  - h5peditor
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
- id: h5peditor_h5peditor_switch_widget
  version: '1.0'
  applicable_bundles:
  - h5peditor
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
