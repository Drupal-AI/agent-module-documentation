metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: h5p
  version: 2.0.x
  note: 'H5P provides an ''h5p'' field type (widget h5p_upload, formatter h5p_default) backed by an h5p_content
    entity, plus a global config object h5p.settings (h5p_export, h5p_default_path, h5p_save_content_state,
    h5p_send_usage_statistics, ...) at /admin/config/system/h5p, and a rich permission set (administer
    h5p libraries, results, copy/download/embed). The external H5P content-type libraries / Hub are NOT
    installed here, so medium/hard cases are grounded in LOCAL state only: the h5p.settings config and
    the h5p field type (creating a field needs no content-type library). Namespaced with ''field_h5p_''
    / value probes.'
questions:
- id: h5p-field-type
  input: How do you attach interactive H5P content to a Drupal content type, and what are the machine
    name of the field type and its default widget and formatter?
  criteria: Add a field of type 'h5p' (label 'Interactive Content – H5P') to the bundle; its default widget
    is h5p_upload and default formatter is h5p_default. Each value references an h5p_content entity.
  bundle: h5p
  rubric_ref: rubric/h5p_h5p_field_type@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: h5p-settings-location
  input: Where are H5P's global settings stored and at what admin path is its configuration form?
  criteria: In the config object h5p.settings; the form is at /admin/config/system/h5p (route h5p.admin.config.system.h5p,
    permission 'administer site configuration').
  bundle: h5p
  rubric_ref: rubric/h5p_h5p_settings_location@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: h5p-library-permission
  input: Which H5P permission lets a user upload, update, delete and restrict H5P content-type libraries
    at /admin/content/h5p?
  criteria: The 'administer h5p libraries' permission (restricted access) controls the H5P library administration
    page.
  bundle: h5p
  rubric_ref: rubric/h5p_h5p_library_permission@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: h5p-known-path
  input: On this Drupal site the H5P storage directory has been changed from its default. Inspect the
    live H5P configuration and state the current H5P default path value.
  criteria: h5p.settings h5p_default_path is 'lessons' (default is 'h5p'); read with `drush cget h5p.settings
    h5p_default_path`.
  bundle: h5p
  rubric_ref: rubric/h5p_h5p_known_path@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/h5p-known-path-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/h5p-known-path-cleanup.sh
- id: h5p-autosave-state
  input: On this Drupal site, is H5P currently configured to autosave learners' content state (so they
    can resume)? Inspect the live configuration and state the value of the relevant setting.
  criteria: h5p.settings h5p_save_content_state is 1 (enabled); read with `drush cget h5p.settings h5p_save_content_state`.
  bundle: h5p
  rubric_ref: rubric/h5p_h5p_autosave_state@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/h5p-autosave-state-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/h5p-autosave-state-cleanup.sh
- id: h5p-add-field
  input: On this Drupal site, add an H5P (Interactive Content) field named 'field_h5p_task' to the Article
    content type so editors can attach interactive H5P content to articles. Apply the change to the live
    site.
  criteria: Create a FieldStorageConfig (entity_type node, field_name field_h5p_task, type 'h5p') and
    a FieldConfig on bundle article; the field type 'h5p' is provided by the module (no content-type library
    needed to create the field).
  bundle: h5p
  rubric_ref: rubric/h5p_h5p_add_field@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/h5p-add-field-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/h5p-add-field-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/h5p-add-field-verify.sh
- id: h5p-hide-download
  input: On this Drupal site, configure H5P so the Download (export) button is never shown, by setting
    the H5P export display option to 0. Apply the change to the live site.
  criteria: Set h5p.settings h5p_export to 0, e.g. `drush cset h5p.settings h5p_export 0 -y` or ConfigFactory
    getEditable('h5p.settings')->set('h5p_export', 0)->save().
  bundle: h5p
  rubric_ref: rubric/h5p_h5p_hide_download@1.0
  tags:
  - mode:execution
  - difficulty:hard
