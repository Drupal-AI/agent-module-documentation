metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: core_views_facets
  version: 2.1.x
  note: 'Core Views Facets is a Facets add-on (requires facets + views). It derives a Facets facet source
    from any Views PAGE display that has an exposed and/or contextual filter: core_views_exposed_filter:<view>__<display>
    and core_views_contextual_filter:<view>__<display> (the facets_facet_source config entity id replaces
    '':'' with ''__''). The signature mandatory step is switching the facet source''s URL processor to
    core_views_url_processor. A facet''s field_identifier is the exposed filter id / contextual argument
    id. It has no settings form, permission, or Drush; state lives in facets_facet + facets_facet_source
    config plus the View. Medium/hard cases are grounded in a real fixture View (node_field_data base,
    page_1 display, exposed ''type'' filter) built by the scripts: introspection reads the derived facet
    source and a fully-built facet+source; execution has the agent add a facet on the core-views source
    and assign the required core_views_url_processor, verified against live config. All fixtures are namespaced
    cvf_eval_* and torn down after.'
questions:
- id: core_views_facets-url-processor
  input: I enabled Core Views Facets and my Views page shows up as a facet source, but adding a facet
    does nothing to the view. What is the required setup step on the facet source that people commonly
    miss?
  criteria: You must edit the facet source and change its URL processor to 'Core views url processor'
    (core_views_url_processor). It formats the query URL the way Views' exposed filters expect; without
    it the facet links don't filter the view.
  bundle: core_views_facets
  rubric_ref: rubric/core_views_facets_core_views_facets_url_processor@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: core_views_facets-source-ids
  input: With Core Views Facets, what facet source plugin id(s) does a Views page display expose, and
    how does that differ for an exposed filter versus a contextual filter?
  criteria: A page display with an exposed filter yields facet source core_views_exposed_filter:<view>__<display>;
    one with a contextual filter yields core_views_contextual_filter:<view>__<display>. A display can
    expose both. (The facets_facet_source config entity id replaces the ':' with '__'.)
  bundle: core_views_facets
  rubric_ref: rubric/core_views_facets_core_views_facets_source_ids@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: core_views_facets-prerequisites
  input: Before I can create a facet from a plain View using Core Views Facets, what must the View itself
    have? List the prerequisites.
  criteria: The View needs at least one page display, and that display must have at least one exposed
    filter and/or one contextual filter (argument). Only then does core_views_facets derive a facet source
    for it; then you add the facet on that source (and set the core_views_url_processor).
  bundle: core_views_facets
  rubric_ref: rubric/core_views_facets_core_views_facets_prerequisites@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: core_views_facets-inspect-facet
  input: 'On this Drupal site there is a facet built from a core View. Inspect the live Facets configuration
    and tell me: which URL processor is assigned to that view''s facet source, and which field (filter)
    the facet targets.'
  criteria: The facet source core_views_exposed_filter__cvf_eval_view__page_1 uses url_processor core_views_url_processor,
    and the facet cvf_eval_facet has field_identifier 'type' (the view's exposed content-type filter),
    facet_source_id core_views_exposed_filter:cvf_eval_view__page_1.
  bundle: core_views_facets
  rubric_ref: rubric/core_views_facets_core_views_facets_inspect_facet@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/core_views_facets-facet-config-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/core_views_facets-teardown.sh
- id: core_views_facets-derived-source
  input: This site has a View called cvf_eval_view with a page display and an exposed filter. Using Core
    Views Facets, what facet source does the module derive for it? Inspect the running site's facet source
    plugins to answer.
  criteria: The module derives the facet source plugin core_views_exposed_filter:cvf_eval_view__page_1
    (from the page_1 display's exposed filter). Discoverable via the plugin.manager.facets.facet_source
    definitions on the live site.
  bundle: core_views_facets
  rubric_ref: rubric/core_views_facets_core_views_facets_derived_source@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/core_views_facets-derived-source-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/core_views_facets-teardown.sh
- id: core_views_facets-add-facet
  input: This site has a View cvf_eval_view (page display path cvf-eval) with an exposed 'type' filter,
    and a Core Views Facets facet source core_views_exposed_filter__cvf_eval_view__page_1 already configured
    with the core_views_url_processor. Create a facet on that facet source that facets the view's exposed
    'type' filter. Apply it to the live site.
  criteria: Create a facets_facet whose facet_source_id is core_views_exposed_filter:cvf_eval_view__page_1
    and whose field_identifier is 'type' (e.g. Facet::create([...])->save(), or via /admin/config/search/facets/add-facet
    choosing that source and the 'type' field).
  bundle: core_views_facets
  rubric_ref: rubric/core_views_facets_core_views_facets_add_facet@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/core_views_facets-add-facet-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/core_views_facets-teardown.sh
    verify: agent-module-documentation/evaluation/verify/core_views_facets-add-facet-verify.sh
- id: core_views_facets-set-url-processor
  input: On this site the Core Views Facets facet source core_views_exposed_filter__cvf_eval_view__page_1
    is currently using the wrong URL processor, so facets won't filter the view. Configure this facet
    source to use the Core Views URL processor. Apply the change to the live site.
  criteria: Set the facets_facet_source core_views_exposed_filter__cvf_eval_view__page_1 url_processor
    to core_views_url_processor (edit the facet source in the Facets UI and choose 'Core views url processor',
    or set url_processor on the FacetSource config entity and save).
  bundle: core_views_facets
