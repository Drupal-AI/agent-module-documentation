metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: commerce_product_limits
  version: 1.0.x
  note: 'commerce_product_limits adds min/max/step order-quantity limits to Drupal Commerce product variations
    via three Commerce entity-trait plugins for commerce_product_variation: minimum_order_quantity, maximum_order_quantity,
    step_order_quantity. Enabling a trait on a product variation type installs an unsigned-integer field
    of the same name (set per variation; empty = no limit). Server-side enforcement is the AvailabilityChecker
    service (commerce_product_limits.availability_checker, tag commerce_order.availability_checker) which
    rejects order items below min / above max (counting quantity already in cart). Form alters set HTML
    #min/#max/#step. No settings page, no permissions, no config schema. On this site the product variation
    type is ''default''. Medium/hard cases enable/inspect the traits on that type via the commerce entity
    trait manager (plugin.manager.commerce_entity_trait installTrait/uninstallTrait) and the variation
    type''s traits list.'
questions:
- id: commerce_product_limits-how-enable
  input: How do you add a maximum purchase quantity limit to products with the Drupal commerce_product_limits
    module? What do you enable and where?
  criteria: Enable the 'Maximum order quantity' (maximum_order_quantity) Commerce entity trait on the
    relevant product variation type (edit the variation type and tick the trait). That installs a maximum_order_quantity
    field on the variation type; then set the value per product variation.
  bundle: commerce_product_limits
  rubric_ref: rubric/commerce_product_limits_commerce_product_limits_how_enable@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: commerce_product_limits-field-names
  input: Which fields does the commerce_product_limits module add to product variations, and what are
    their machine names?
  criteria: 'It provides three entity traits that each install an unsigned-integer field on the product
    variation: minimum_order_quantity, maximum_order_quantity, and step_order_quantity.'
  bundle: commerce_product_limits
  rubric_ref: rubric/commerce_product_limits_commerce_product_limits_field_names@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: commerce_product_limits-enforcement
  input: How does commerce_product_limits actually stop a customer from adding a quantity outside the
    allowed limits at the server side (not just the HTML min/max)?
  criteria: It registers an AvailabilityChecker (service commerce_product_limits.availability_checker,
    tagged commerce_order.availability_checker). Commerce Core's Availability Manager calls it for each
    product-variation order item; if the requested quantity (plus any matching quantity already in the
    cart) is below the minimum or above the maximum it returns AvailabilityResult::unavailable() and the
    add/update is rejected.
  bundle: commerce_product_limits
  rubric_ref: rubric/commerce_product_limits_commerce_product_limits_enforcement@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: commerce_product_limits-which-trait
  input: On this Drupal Commerce site, one of the commerce_product_limits order-quantity limit traits
    has been enabled on the 'default' product variation type. Inspect the live configuration and state
    which limit trait is enabled.
  criteria: The default product variation type has the maximum_order_quantity trait enabled (drush cget
    commerce_product_variation_type.default traits, or ProductVariationType::load('default')->getTraits()).
  bundle: commerce_product_limits
  rubric_ref: rubric/commerce_product_limits_commerce_product_limits_which_trait@1.0
  tags:
  - mode:introspection
  - difficulty:medium
