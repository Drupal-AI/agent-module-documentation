metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: config_import_single
  version: 2.0.x
  note: 'config_import_single is a command-only module: one Drush command config_import_single:single-import
    (alias cis) that imports a single config YAML file via core''s ConfigImporter, deriving the config
    object name from the filename-without-extension. No config object of its own, no permissions, no UI.
    Easy cases are recipe. Medium cases seed a real image.style config object on the live site (an image
    style is exactly the kind of single object cis imports) and require the agent to inspect live config
    and read it back. Hard cases require actually running `cis` to import an image.style YAML file, verified
    against the live config object. SHARED-SITE CAVEAT (author-time): the site''s active config currently
    contains orphaned objects (Drupal Canvas, file_entity, ... from uninstalled modules) that make core''s
    global ConfigImporter validation fail, so `cis` cannot complete on this specific site right now; the
    reset (object absent => verify FAIL) and the verify logic (object present => PASS) were smoke-tested
    by materialising the target image style via the config API, but the live `cis` build path is blocked
    by that pre-existing orphaned config, which was deliberately not modified. (image.style objects are
    used for fixtures because user.role save currently throws on this site.)'
questions:
- id: cis-command-alias
  input: Which Drush command does the config_import_single module add to import a single configuration
    file, and what is its short alias?
  criteria: 'config_import_single:single-import, alias `cis`. Usage: `drush cis path/to/file.yml`.'
  bundle: config_import_single
  rubric_ref: rubric/config_import_single_cis_command_alias@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: cis-filename-rule
  input: When using config_import_single (drush cis) to import a file, how is the target configuration
    object name determined? If I want to import the object 'image.style.thumbnail', what must the file
    be called?
  criteria: The config object name comes from the filename without its extension (Path::getFilenameWithoutExtension),
    not the file contents. To import image.style.thumbnail the file must be named image.style.thumbnail.yml.
  bundle: config_import_single
  rubric_ref: rubric/config_import_single_cis_filename_rule@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: cis-error-behaviour
  input: What happens when you run the config_import_single (cis) command with a path to a file that does
    not exist, or with no file argument at all?
  criteria: 'It throws an exception: ''No file specified.'' when no path is given, and ''File not found.''
    when the path does not exist. A failed import throws ''Failed importing file''.'
  bundle: config_import_single
  rubric_ref: rubric/config_import_single_cis_error_behaviour@1.0
  tags:
  - mode:recipe
  - difficulty:easy
