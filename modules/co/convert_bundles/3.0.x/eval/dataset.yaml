    term bundles.
  criteria: system.action.convert_bundles_on_taxonomy_term (drush config:status / config:get shows it;
    plugin convert_bundles_action_base, type taxonomy_term).
  bundle: convert_bundles
  rubric_ref: rubric/convert_bundles_convert_bundles_taxo_action_id@1.0
