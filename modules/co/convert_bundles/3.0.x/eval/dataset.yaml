- id: convert_bundles-map-field
  input: This site has content types convbnd2_from (with a text field field_convbnd_src) and convbnd2_to
    (with a text field field_convbnd_dst). A node titled 'CB Hard Two' is of type convbnd2_from with field_convbnd_src
    set to 'mango'. Convert that node to convbnd2_to and map the value of field_convbnd_src onto field_convbnd_dst,
    so the target field carries 'mango'. Apply it to the live site.
  criteria: After conversion the node 'CB Hard Two' has bundle convbnd2_to and field_convbnd_dst == 'mango'.
    In the convert_bundles field-mapping step you map the source field field_convbnd_src to the target
    field field_convbnd_dst (data types match), which copies the value across during ConvertBundles::addNewFields().
