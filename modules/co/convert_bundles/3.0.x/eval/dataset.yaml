metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: convert_bundles
  version: 3.0.x
  note: Convert Bundles changes an entity's bundle and maps the source bundle's fields onto the target
    bundle's fields. It exposes one core action per multi-bundle entity type (config id system.action.convert_bundles_on_<entity_type>,
    plugin convert_bundles_action_base), a per-entity 'Convert Bundle' tab (route entity.<type>.convert_bundles
    at /{type}/{id}/convertbundles, permission 'convert <type> bundle'), and a whole-bundle form at /admin/config/content/convert_bundles
    (route convert_bundles.admin, permission 'administer convert_bundles'). No config schema, no Drush,
    no plugin types the module defines. Static logic lives in Drupal\convert_bundles\ConvertBundles (convertBaseTables/convertFieldTables/addNewFields).
    hook_convert_bundle_alter(old,&new) fires before each save. Medium cases read the action config entities;
    hard cases actually convert namespaced test nodes (convbnd_*/convbnd2_* content types, field_convbnd_*
    fields) and verify the live bundle/field values.
questions:
- id: convert_bundles-single-entity-entry
  input: On a Drupal 11 site with the convert_bundles module enabled, how do I convert just one node from
    its current content type to a different one, without touching any other nodes?
  criteria: Use the 'Convert Bundle' local task tab that convert_bundles adds to the node page at /node/{nid}/convertbundles
    (route entity.node.convert_bundles, gated by the 'convert node bundle' permission). It opens the conversion
    wizard for just that entity, where you pick the target content type and map fields.
  bundle: convert_bundles
  rubric_ref: rubric/convert_bundles_convert_bundles_single_entity_entry@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: convert_bundles-permission
  input: The convert_bundles module defines a dynamic permission per entity type. What is the machine
    name of the permission that lets a role convert node bundles, and what other permission gates the
    whole-bundle admin form?
  criteria: The dynamic per-entity-type permission is 'convert node bundle' (pattern 'convert <entity_type>
    bundle', generated for every entity type with 2+ bundles). The whole-bundle admin form at /admin/config/content/convert_bundles
    is gated by 'administer convert_bundles'.
  bundle: convert_bundles
  rubric_ref: rubric/convert_bundles_convert_bundles_permission@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: convert_bundles-alter-hook
  input: With convert_bundles, which hook can I implement to programmatically change a converted entity
    right before it is saved (for example to set a taxonomy term's parent), and what arguments does it
    receive?
  criteria: Implement hook_convert_bundle_alter(EntityInterface $old_entity, EntityInterface &$new_entity).
    It fires once per entity in ConvertBundles::addNewFields() just before $new_entity->save(); $new_entity
    already has the new bundle and mapped fields.
  bundle: convert_bundles
  rubric_ref: rubric/convert_bundles_convert_bundles_alter_hook@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: convert_bundles-node-action-plugin
  input: This Drupal site has convert_bundles installed. Inspect the live configuration and tell me which
    action plugin the configured action that converts node bundles uses.
  criteria: 'The action config entity system.action.convert_bundles_on_node uses plugin: convert_bundles_action_base
    (drush config:get system.action.convert_bundles_on_node plugin).'
  bundle: convert_bundles
  rubric_ref: rubric/convert_bundles_convert_bundles_node_action_plugin@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/convert_bundles-node-action-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/convert_bundles-node-action-cleanup.sh
- id: convert_bundles-taxo-action-id
  input: On this site, convert_bundles auto-creates one bulk-conversion action per multi-bundle entity
