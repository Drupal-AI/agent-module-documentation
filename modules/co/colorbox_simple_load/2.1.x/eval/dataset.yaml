metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: colorbox_simple_load
  version: 2.1.x
  note: 'Colorbox Simple Load is a front-end-only module: hook_page_attachments() attaches the colorbox.attachment
    service plus its colorbox_simple_load/load library on every page, and js/colorbox-simple-load.js makes
    every link with the CSS class ''colorbox-load'' open its href in a Colorbox lightbox. Per-link options
    come from the href query string: width->innerWidth, height->innerHeight, and true/yes|false/no coerce
    to booleans. It has NO admin UI, no config, no permissions, no schema, no PHP API, and depends on
    the colorbox module for all styling/defaults. Because it has no server-side configuration of its own,
    the medium/hard cases are grounded in the real usage pattern (authoring markup with the colorbox-load
    class and URL-param options) using a custom block whose body HTML is read back from the live site.'
questions:
- id: colorbox_simple_load-how-to-trigger
  input: Using the Drupal module colorbox_simple_load, how do I make an ordinary link open its target
    inside a Colorbox lightbox? What exactly do I add to the link?
  criteria: Add the CSS class colorbox-load to the anchor, e.g. <a class="colorbox-load" href="/node/1">View</a>.
    The module's JS finds every .colorbox-load element and opens its href in a Colorbox overlay.
  bundle: colorbox_simple_load
  rubric_ref: rubric/colorbox_simple_load_colorbox_simple_load_how_to_trigger@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: colorbox_simple_load-per-link-size
  input: With colorbox_simple_load, how do I control the width and height of the lightbox for one specific
    link? Which Colorbox options do width and height map to?
  criteria: Add query parameters to the link's href, e.g. href="/node/1?width=900&height=700". The JS
    parses the query string into Colorbox options; width is renamed to innerWidth and height to innerHeight.
    Other params pass straight through, and true/yes/false/no become booleans.
  bundle: colorbox_simple_load
  rubric_ref: rubric/colorbox_simple_load_colorbox_simple_load_per_link_size@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: colorbox_simple_load-dependency-config
  input: Does colorbox_simple_load have its own settings page, and where do the lightbox style and default
    size come from? What module does it require?
  criteria: It has no configuration page of its own (configure is null). It requires the Colorbox module,
    and all lightbox styling, default sizes and mobile-detect behaviour come from Colorbox's own settings
    (colorbox.settings). This module only adds the per-link colorbox-load trigger and URL-param overrides.
  bundle: colorbox_simple_load
  rubric_ref: rubric/colorbox_simple_load_colorbox_simple_load_dependency_config@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: colorbox_simple_load-known-block
  input: This Drupal site has a custom block labelled 'csl_known' that uses colorbox_simple_load to open
    a link in a lightbox. Inspect the live block's body and state the pixel width the Colorbox lightbox
    will open at for that link.
  criteria: The block body contains a colorbox-load link with href .../?width=600&height=400, so the lightbox
    opens at width 600 (mapped by the module to Colorbox's innerWidth=600).
  bundle: colorbox_simple_load
  rubric_ref: rubric/colorbox_simple_load_colorbox_simple_load_known_block@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/colorbox_simple_load-known-block-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/colorbox_simple_load-known-block-cleanup.sh
- id: colorbox_simple_load-add-link
  input: On this Drupal site, create a custom block (a block_content entity of type 'basic') labelled
    exactly 'csl_task' whose body HTML contains a link that uses colorbox_simple_load to open /node/1
    in a Colorbox lightbox sized to a width of 800 and a height of 600. Save it to the live site.
  criteria: A block_content (info=csl_task) whose body contains an anchor with class colorbox-load and
    an href whose query string sets width=800 and height=600 (e.g. href="/node/1?width=800&height=600"),
    which the module maps to Colorbox innerWidth=800 / innerHeight=600.
  bundle: colorbox_simple_load
  rubric_ref: rubric/colorbox_simple_load_colorbox_simple_load_add_link@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/colorbox_simple_load-add-link-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/colorbox_simple_load-add-link-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/colorbox_simple_load-add-link-verify.sh
- id: colorbox_simple_load-iframe-link
  input: I want a promo box on my site with a link that pops open our signup page at /node/1 in an overlay
    window that loads it as an embedded frame, and it should be about 900 pixels wide. Using the colorbox_simple_load
    module, add a custom block called 'csl_task' with such a link and save it live.
  criteria: A block_content (info=csl_task) whose body contains an anchor with class colorbox-load and
    an href to /node/1 whose query string includes iframe=true (or iframe=yes) and width=900, e.g. href="/node/1?width=900&iframe=true".
  bundle: colorbox_simple_load
  rubric_ref: rubric/colorbox_simple_load_colorbox_simple_load_iframe_link@1.0
