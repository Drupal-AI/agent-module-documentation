metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: commerce_wishlist
  version: 3.0.x
  note: 'Commerce Wishlist = save-for-later for Drupal Commerce. Entities: commerce_wishlist (list), commerce_wishlist_item
    (line), commerce_wishlist_type (config bundle, ships ''default''). Global config commerce_wishlist.settings:
    allow_multiple, allow_anonymous_sharing, duplicate, default_type (=''default''), view_modes; edited
    at /admin/commerce/config/wishlist-settings. Services: commerce_wishlist.wishlist_provider (getWishlist/createWishlist),
    commerce_wishlist.wishlist_manager (addEntity/removeWishlistItem/emptyWishlist/merge). ''Add to wishlist''
    is injected into the Commerce add-to-cart form and product-variation field formatters (third-party
    settings show_wishlist/weight_wishlist/label_wishlist/region). Wishlist block id commerce_wishlist.
    Permissions: access wishlist, administer commerce_wishlist_type, + Commerce-generated entity perms.
    Medium cases toggle a known setting and read it back; hard cases set a setting (verified in config)
    and create a wishlist type (verified as a config entity). NOTE for scripts: drush cset with the literal
    ''false'' does NOT store boolean false on this site (use 0); ''true'' works.'
questions:
- id: commerce_wishlist-allow-multiple
  input: In Drupal Commerce Wishlist, which configuration setting lets a single customer have more than
    one wishlist, and where is it configured?
  criteria: commerce_wishlist.settings:allow_multiple (default false). Configure it on the Wishlist settings
    form at /admin/commerce/config/wishlist-settings, or drush cset commerce_wishlist.settings allow_multiple
    true.
  bundle: commerce_wishlist
  rubric_ref: rubric/commerce_wishlist_commerce_wishlist_allow_multiple@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: commerce_wishlist-add-api
  input: In Drupal Commerce Wishlist, which service and method do I use to add a purchasable entity (e.g.
    a product variation) to a wishlist in code?
  criteria: Use the commerce_wishlist.wishlist_manager service (WishlistManager) and call addEntity($wishlist,
    $purchasable_entity, $quantity, $combine, $save). Resolve/create the $wishlist first with commerce_wishlist.wishlist_provider
    (getWishlist/createWishlist).
  bundle: commerce_wishlist
  rubric_ref: rubric/commerce_wishlist_commerce_wishlist_add_api@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: commerce_wishlist-entities
  input: What entity types does the Commerce Wishlist module define, and which one is the configurable
    bundle/type?
  criteria: commerce_wishlist (the list), commerce_wishlist_item (a line referencing a purchasable entity
    + quantity), and commerce_wishlist_type (a config bundle/type, ships a 'default' type with an allowAnonymous
    flag).
  bundle: commerce_wishlist
  rubric_ref: rubric/commerce_wishlist_commerce_wishlist_entities@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: commerce_wishlist-multiple-state
  input: On this Drupal site, does Commerce Wishlist currently allow customers to have multiple wishlists?
    Inspect the live configuration and answer.
  criteria: Yes — commerce_wishlist.settings:allow_multiple is true (drush cget commerce_wishlist.settings
    allow_multiple).
  bundle: commerce_wishlist
  rubric_ref: rubric/commerce_wishlist_commerce_wishlist_multiple_state@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/commerce_wishlist-multiple-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/commerce_wishlist-multiple-cleanup.sh
- id: commerce_wishlist-sharing-state
  input: On this Drupal site, is anonymous sharing of wishlists enabled in Commerce Wishlist? Inspect
