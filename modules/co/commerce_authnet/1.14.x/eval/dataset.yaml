metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: commerce_authnet
  version: 1.14.x
  note: 'Commerce Authorize.net provides Commerce payment gateway plugins: authorizenet_acceptjs (on-site
    cards, primary), authorizenet_accept_hosted (off-site iframe), authorizenet_echeck (ACH), authorizenet_visa_checkout
    (legacy/deprecated). Each is a commerce_payment_gateway config entity whose configuration carries
    api_login, transaction_key, client_key and a Commerce mode of ''test'' or ''live'' (schema in config/schema/commerce_authnet.schema.yml;
    acceptjs adds enable_credit_card_icons, accept_hosted adds captcha_security + card_code_required,
    visa_checkout adds visa_checkout_api_key). Accept.js defines workflow payment_acceptjs. IMPORTANT:
    live charges need a real Authorize.Net account and API creds we do NOT have, so every medium/hard
    case is grounded in the commerce_payment_gateway CONFIG ENTITY (which saves/loads without contacting
    Authorize.Net) and NEVER in live transactions. All fixtures use ca_-prefixed gateway ids.'
questions:
- id: ca-gateway-plugins
  input: Which Commerce payment gateway plugins does the commerce_authnet module provide for Authorize.Net,
    and which one is the primary on-site credit card integration?
  criteria: authorizenet_acceptjs (on-site credit cards via Accept.js — the primary/recommended), authorizenet_accept_hosted
    (off-site hosted iframe form), authorizenet_echeck (ACH/eCheck), and the legacy/deprecated authorizenet_visa_checkout.
  bundle: commerce_authnet
  rubric_ref: rubric/commerce_authnet_ca_gateway_plugins@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: ca-credentials
  input: To configure a commerce_authnet payment gateway, which Authorize.Net credential settings must
    be provided, and how do you make the gateway run against a sandbox instead of taking real payments?
  criteria: Provide api_login (API Login ID), transaction_key (Transaction Key) and client_key (public
    Client Key) on the gateway's configuration, and set the Commerce gateway mode to 'test' (sandbox)
    instead of 'live'.
  bundle: commerce_authnet
  rubric_ref: rubric/commerce_authnet_ca_credentials@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: ca-hosted-vs-echeck
  input: In commerce_authnet, which gateway plugin renders an off-site hosted card form in an iframe,
    and which one takes bank-account (ACH/eCheck) payments?
  criteria: authorizenet_accept_hosted renders the off-site Accept Hosted iframe form; authorizenet_echeck
    handles ACH/eCheck payments (payment method type authnet_echeck).
  bundle: commerce_authnet
  rubric_ref: rubric/commerce_authnet_ca_hosted_vs_echeck@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: ca-known-gateway
  input: This Drupal Commerce site has an Authorize.net payment gateway with machine name ca_known. Inspect
    the live payment gateway configuration and report which commerce_authnet gateway plugin it uses and
    whether it is in test or live mode.
  criteria: ca_known uses the authorizenet_acceptjs plugin and is in test mode (commerce_payment_gateway.ca_known,
    configuration.mode = test).
  bundle: commerce_authnet
  rubric_ref: rubric/commerce_authnet_ca_known_gateway@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/commerce_authnet-known-gateway-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/commerce_authnet-known-gateway-cleanup.sh
- id: ca-known-credentials
  input: On this site there is an Authorize.net eCheck payment gateway with machine name ca_known2. Inspect
    the live configuration and report its Authorize.Net API Login ID and which gateway plugin it uses.
  criteria: ca_known2 uses the authorizenet_echeck plugin with api_login 'echeck_login_xyz' (commerce_payment_gateway.ca_known2
    configuration.api_login).
  bundle: commerce_authnet
  rubric_ref: rubric/commerce_authnet_ca_known_credentials@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/commerce_authnet-known-credentials-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/commerce_authnet-known-credentials-cleanup.sh
- id: ca-create-acceptjs
  input: On this Drupal Commerce site, create an Authorize.net payment gateway using commerce_authnet.
