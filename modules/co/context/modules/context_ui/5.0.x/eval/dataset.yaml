metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: context_ui
  version: 5.0.x
  note: 'Context UI is a thin admin-UI submodule of Context; it ships no config schema or config entities
    of its own and only edits the parent module''s `context` config entity. All cases are `recipe` (response-graded),
    probing UI-specific facts: the admin route/path, the permission, the entity forms + list builder,
    and the Context Inspector debug block.'
questions:
- id: contextui-admin-path
  input: On a Drupal 11 site with the Context UI submodule enabled, where in the admin do I go to list
    and manage contexts, and what is the URL path and machine route name? Give the path and route name.
  criteria: Administration → Structure → Context at path /admin/structure/context, route entity.context.collection
    (the module's `configure` target).
  bundle: context_ui
  rubric_ref: rubric/context_ui_contextui_admin_path@1.0
  tags:
  - mode:recipe
- id: contextui-permission
  input: Which permission does the Context UI submodule define to gate its admin screens, and which role
    setting should I grant it to so an editor role can manage contexts? Name the permission.
  criteria: The `administer contexts` permission (defined in context_ui.permissions.yml); grant it e.g.
    `drush role:perm:add site_manager 'administer contexts'`. It gates every UI route and is the context
    entity's admin_permission.
  bundle: context_ui
  rubric_ref: rubric/context_ui_contextui_permission@1.0
  tags:
  - mode:recipe
- id: contextui-inspector-block
  input: I need to debug which contexts are actually active on a given page of my Drupal site. Context
    UI provides a block for this. What block do I place, and what does it do?
  criteria: Place the Context Inspector block (src/Plugin/Block/ContextInspector.php) — it shows which
    contexts are active on the current page as a debugging aid.
  bundle: context_ui
  rubric_ref: rubric/context_ui_contextui_inspector_block@1.0
  tags:
  - mode:recipe
- id: contextui-forms-listbuilder
  input: In the Context UI submodule, which classes provide the add/edit/delete/disable/duplicate forms
    for a context and the collection listing? Name the entity form classes and the list builder.
  criteria: 'Entity forms in src/Form/: ContextAddForm, ContextEditForm, ContextDeleteForm, ContextDisableForm,
    ContextDuplicateForm (registered as the context entity''s add/edit/delete/disable/duplicate handlers),
    plus ContextListBuilder for the collection list.'
  bundle: context_ui
  rubric_ref: rubric/context_ui_contextui_forms_listbuilder@1.0
  tags:
  - mode:recipe
- id: contextui-thin-ui-layer
  input: Does the Context UI submodule define its own config entities or config schema? Explain what it
    actually adds on top of the base Context module.
  criteria: No — it ships no config schema and no config entities of its own. It is a thin UI layer over
    the base context module that only edits the parent module's `context` config entity, supplying the
    admin screens the base module deliberately omits. Depends on context:context.
  bundle: context_ui
  rubric_ref: rubric/context_ui_contextui_thin_ui_layer@1.0
  tags:
  - mode:recipe
- id: contextui-add-context-form
  input: Instead of hand-writing context.context.* config, I want to create a new context through the
    UI. What is the add-form path, and how do I attach conditions and reactions to it?
  criteria: Use the add form at /admin/structure/context/add (route entity.context.add_form), then attach
    core Condition plugins via the condition library UI and reactions (blocks, theme, body_class, page_title,
    menu, …) via the reaction library UI.
  bundle: context_ui
  rubric_ref: rubric/context_ui_contextui_add_context_form@1.0
  tags:
  - mode:recipe
- id: contextui-controller-autocomplete
  input: Which controller in the Context UI submodule serves the condition/reaction libraries, the AJAX
    add-condition/add-reaction handlers, and the context group name autocomplete?
  criteria: ContextUIController — it provides the condition/reaction libraries, addCondition/addReaction,
    and groupsAutocomplete (route context.groups.autocomplete).
  bundle: context_ui
  rubric_ref: rubric/context_ui_contextui_controller_autocomplete@1.0
  tags:
  - mode:recipe
