metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: context
  version: 5.0.x
  note: Context exposes a single `context` config entity (conditions + reactions), one plugin type (ContextReaction),
    reuse of core Condition plugins, and the context.manager service. Cases are `recipe` (response-graded)
    since they probe documented facts an agent would otherwise read source to answer; no site mutation.
    Module is 5.0.0-rc2 (release candidate).
questions:
- id: context-entity-shape
  input: On a Drupal 11 site using the Context module, what does a single `context` hold, and what config
    entity type / id represents it?
  criteria: A context is the `context` config entity (Drupal\context\Entity\Context); it holds a list
    of conditions and a list of reactions, plus name/label/group/weight and requireAllConditions.
  bundle: context
  rubric_ref: rubric/context_context_entity_shape@1.0
  tags:
  - mode:recipe
- id: context-conditions-reuse-core
  input: In the Context module, are 'conditions' a plugin type defined by Context, or do they come from
    somewhere else? Which plugin manager loads them?
  criteria: Conditions are NOT a Context plugin type; Context reuses Drupal core's Condition plugins via
    plugin.manager.condition (ConditionPluginCollection). Context adds a few of its own Condition plugins
    (request_domain, http_status_code, etc.).
  bundle: context
  rubric_ref: rubric/context_context_conditions_reuse_core@1.0
  tags:
  - mode:recipe
- id: context-reaction-plugin-type
  input: I want to write a custom reaction for the Context module. What is the plugin type, its plugin
    namespace, annotation, and base class?
  criteria: 'The ContextReaction plugin type: namespace Plugin/ContextReaction, annotation @ContextReaction
    (Drupal\context\Reaction\Annotation\ContextReaction), base class Drupal\context\ContextReactionPluginBase,
    manager plugin.manager.context_reaction.'
  bundle: context
  rubric_ref: rubric/context_context_reaction_plugin_type@1.0
  tags:
  - mode:recipe
- id: context-block-reaction
  input: Which Context reaction places blocks into theme regions per-context (an alternative to core Block
    layout), and what is its reaction plugin id?
  criteria: The blocks reaction (id `blocks`, Drupal\context\Plugin\ContextReaction\Blocks) places blocks
    into theme regions per-context.
  bundle: context
  rubric_ref: rubric/context_context_block_reaction@1.0
  tags:
  - mode:recipe
- id: context-manager-active-reactions
  input: In PHP on a Drupal 11 site, how do I get the active Context reactions of a given type (e.g. body_class)
    for the current request? Which service and method?
  criteria: Use the context.manager service (Drupal\context\ContextManager) and call getActiveReactions('body_class')
    (accepts a reaction plugin id, class name, or NULL for all), then ->execute() each.
  bundle: context
  rubric_ref: rubric/context_context_manager_active_reactions@1.0
  tags:
  - mode:recipe
- id: context-and-or-sitewide
  input: In a Context, how do I make ALL conditions required (AND) vs ANY (OR), and what happens if a
    context has no conditions?
  criteria: requireAllConditions = true means AND (all conditions must pass), false means OR (any). A
    context with no conditions is applied sitewide (always active).
  bundle: context
  rubric_ref: rubric/context_context_and_or_sitewide@1.0
  tags:
  - mode:recipe
- id: context-ui-build-route
  input: Which module/submodule provides the admin UI to build contexts, and at what path? Does the base
    Context module have a settings/config form?
  criteria: The context_ui submodule provides the UI at /admin/structure/context (route entity.context.collection).
    The base context module has no configure/settings form (configure is null).
  bundle: context
  rubric_ref: rubric/context_context_ui_build_route@1.0
  tags:
  - mode:recipe
- id: context-permission
  input: What permission gates managing contexts in the Context module?
  criteria: '''administer contexts'' (defined by the context_ui submodule) gates the context collection/add/edit/delete
    routes and is the entity admin_permission.'
  bundle: context
  rubric_ref: rubric/context_context_permission@1.0
  tags:
  - mode:recipe
