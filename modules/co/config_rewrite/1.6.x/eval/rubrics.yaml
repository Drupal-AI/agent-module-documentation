rubrics:
- id: config_rewrite_config_rewrite_directory_convention
  version: '1.0'
  applicable_bundles:
  - config_rewrite
  checks:
  - kind: must_contain_any
    values:
    - config/rewrite
  - kind: must_not_contain
    values:
    - config/install
  scoring:
    combine: all_pass
- id: config_rewrite_config_rewrite_replace_key
  version: '1.0'
  applicable_bundles:
  - config_rewrite
  checks:
  - kind: must_contain_any
    values:
    - 'config_rewrite: replace'
    - 'config_rewrite:

      '
    - 'config_rewrite: ''replace'''
    - config_rewrite key
    - '`config_rewrite`'
  scoring:
    combine: all_pass
- id: config_rewrite_config_rewrite_service_id
  version: '1.0'
  applicable_bundles:
  - config_rewrite
  checks:
  - kind: must_contain_any
    values:
    - config_rewrite.config_rewriter
  scoring:
    combine: all_pass
