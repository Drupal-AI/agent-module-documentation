rubrics:
- id: commerce_invoice_commerce_invoice_shipped_types
  version: '1.0'
  applicable_bundles:
  - commerce_invoice
  checks:
  - kind: must_contain_any
    values:
    - default
    - credit_memo
    - credit memo
  scoring:
    combine: all_pass
- id: commerce_invoice_commerce_invoice_workflow_states
  version: '1.0'
  applicable_bundles:
  - commerce_invoice
  checks:
  - kind: must_contain_any
    values:
    - draft
    - pending
    - paid
    - refunded
    - canceled
  scoring:
    combine: all_pass
- id: commerce_invoice_commerce_invoice_generator_service
  version: '1.0'
  applicable_bundles:
  - commerce_invoice
  checks:
  - kind: must_contain_any
    values:
    - commerce_invoice.invoice_generator
    - InvoiceGenerator
    - generate(
  scoring:
    combine: all_pass
- id: commerce_invoice_commerce_invoice_known_footer
  version: '1.0'
  applicable_bundles:
  - commerce_invoice
  checks:
  - kind: must_contain_any
    values:
    - Thank you for your business - CIKNOWN
  scoring:
    combine: all_pass
- id: commerce_invoice_commerce_invoice_known_pattern
  version: '1.0'
  applicable_bundles:
  - commerce_invoice
  checks:
  - kind: must_contain_any
    values:
    - invoice_credit_memo
  scoring:
    combine: all_pass
- id: commerce_invoice_commerce_invoice_create_type
  version: '1.0'
  applicable_bundles:
  - commerce_invoice
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
- id: commerce_invoice_commerce_invoice_create_duedays
  version: '1.0'
  applicable_bundles:
  - commerce_invoice
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
