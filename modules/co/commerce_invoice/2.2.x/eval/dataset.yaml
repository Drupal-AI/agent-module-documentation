metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: commerce_invoice
  version: 2.2.x
  note: 'Commerce Invoice adds the commerce_invoice content entity and its commerce_invoice_type bundle
    config entity to Drupal Commerce. Two invoice types ship: ''default'' (Invoice, numberPattern invoice_default)
    and ''credit_memo'' (Credit memo, numberPattern invoice_credit_memo); both use the invoice_default
    state-machine workflow (states draft, pending, paid, refund_pending, refunded, canceled). Invoice-type
    config keys: numberPattern, workflow, footerText, paymentTerms, dueDays, logo, sendConfirmation, confirmationBcc,
    privateSubdirectory. Invoices are created via the commerce_invoice.invoice_generator service (InvoiceGenerator::generate)
    or automatically by OrderPlacedSubscriber/OrderPaidSubscriber based on per-order-type third-party
    settings. Medium cases create a known invoice-type config and read a property back; hard cases create
    an invoice type config entity and verify it against live config. All eval scripts operate on the commerce_invoice_type
    config entity (no order/node fixtures needed).'
questions:
- id: commerce_invoice-shipped-types
  input: Which invoice types does the Drupal Commerce Invoice module ship with out of the box, and what
    are their machine names?
  criteria: 'It ships two commerce_invoice_type bundles: ''default'' (labeled Invoice) and ''credit_memo''
    (labeled Credit memo).'
  bundle: commerce_invoice
  rubric_ref: rubric/commerce_invoice_commerce_invoice_shipped_types@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: commerce_invoice-workflow-states
  input: What are the states of the default invoice workflow (invoice_default) in the Commerce Invoice
    module?
  criteria: The invoice_default workflow has states draft, pending, paid, refund_pending, refunded and
    canceled (transitions confirm, pay, refund, cancel).
  bundle: commerce_invoice
  rubric_ref: rubric/commerce_invoice_commerce_invoice_workflow_states@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: commerce_invoice-generator-service
  input: In Drupal Commerce Invoice, how do I generate an invoice from an order programmatically? Name
    the service and method.
  criteria: Use the commerce_invoice.invoice_generator service (Drupal\commerce_invoice\InvoiceGeneratorInterface)
    and call generate($orders, $store, $profile, $values, $save).
  bundle: commerce_invoice
  rubric_ref: rubric/commerce_invoice_commerce_invoice_generator_service@1.0
  tags:
  - mode:recipe
  - difficulty:easy
