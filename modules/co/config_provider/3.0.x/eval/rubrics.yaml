rubrics:
- id: config_provider_config_provider_two_plugins
  version: '1.0'
  applicable_bundles:
  - config_provider
  checks:
  - kind: must_contain_any
    values:
    - config/install
    - config/optional
  scoring:
    combine: all_pass
- id: config_provider_config_provider_collector_service
  version: '1.0'
  applicable_bundles:
  - config_provider
  checks:
  - kind: must_contain_any
    values:
    - config_provider.collector
    - addInstallableConfig
    - config_provider.storage
    - MemoryStorage
  scoring:
    combine: all_pass
- id: config_provider_config_provider_implement_plugin
  version: '1.0'
  applicable_bundles:
  - config_provider
  checks:
  - kind: must_contain_any
    values:
    - ConfigProviderBase
    - '@ConfigProvider'
    - addInstallableConfig
    - ConfigProvider
  scoring:
    combine: all_pass
- id: config_provider_config_provider_collect_node
  version: '1.0'
  applicable_bundles:
  - config_provider
  checks:
  - kind: must_contain_any
    values:
    - node.settings
    - views.view.content
    - views.view.frontpage
    - core.entity_view_mode.node.teaser
  scoring:
    combine: all_pass
- id: config_provider_config_provider_collect_user
  version: '1.0'
  applicable_bundles:
  - config_provider
  checks:
  - kind: must_contain_any
    values:
    - user.role.anonymous
    - user.role.authenticated
    - user.settings
    - user.mail
    - user.flood
  scoring:
    combine: all_pass
- id: config_provider_config_provider_collect_to_state
  version: '1.0'
  applicable_bundles:
  - config_provider
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
- id: config_provider_config_provider_collect_user_state
  version: '1.0'
  applicable_bundles:
  - config_provider
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
