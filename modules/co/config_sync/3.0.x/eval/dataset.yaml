metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: config_sync
  version: 3.0.x
  note: 'Configuration Synchronizer imports config updates shipped by modules/themes/profiles. UI is the
    config_distro ''Distribution Updates'' page (configure route config_distro.import, path /admin/config/development/distro).
    Update modes live in state config_sync.update_mode: 1 Merge (default), 2 Partial reset, 3 Full reset
    (ConfigSyncListerInterface::UPDATE_MODE_*). Snapshots use the config_snapshot ''config_sync'' snapshot
    set (CONFIG_SNAPSHOT_SET); entities named config_sync.<type>.<extension>. Drush: config-sync-list-updates
    (alias cs-list); --update-mode option on config-distro-update. No permissions, no config schema, no
    own settings form, no new plugin types (only a config_filter SyncFilter plugin instance). Medium/hard
    cases are grounded in real state + config_snapshot entities.'
questions:
- id: config_sync-what-and-where
  input: What problem does the Drupal config_sync (Configuration Synchronizer) module solve, and on which
    admin page do you apply available configuration updates from modules and themes?
  criteria: It re-imports configuration changes that updated modules/themes/profiles ship (which Drupal
    otherwise never re-applies), comparing an install-time snapshot against the currently provided config.
    You apply them on the Distribution Updates page (route config_distro.import, /admin/config/development/distro).
  bundle: config_sync
  rubric_ref: rubric/config_sync_config_sync_what_and_where@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: config_sync-update-modes
  input: What update modes does the Drupal config_sync module offer when applying configuration updates,
    and what does each do?
  criteria: 'Three modes (state config_sync.update_mode): 1 Merge (default; three-way merge keeping local
    edits), 2 Partial reset (reset only items with available updates to the provided version), 3 Full
    reset (reset all provided config to shipped defaults).'
  bundle: config_sync
  rubric_ref: rubric/config_sync_config_sync_update_modes@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: config_sync-drush
  input: Which Drush command does config_sync add to list extensions that have configuration updates available,
    and how do you pick the update mode when running a config-distro-update from Drush?
  criteria: drush config-sync-list-updates (alias cs-list) lists extensions with available config updates.
    config_sync also adds an --update-mode option to config-distro-update (e.g. drush config-distro-update
    --update-mode=3 for full reset), which writes the value to state config_sync.update_mode.
  bundle: config_sync
  rubric_ref: rubric/config_sync_config_sync_drush@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: config_sync-current-mode
  input: On this Drupal site, config_sync has been configured with a specific update mode. Inspect the
    live site and state which update mode is currently set (its number and meaning).
  criteria: 'The update mode is 2 (Partial reset): state config_sync.update_mode is 2, meaning only config
    items with available updates are reset to the provided version.'
  bundle: config_sync
  rubric_ref: rubric/config_sync_config_sync_current_mode@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/config_sync-update-mode-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/config_sync-update-mode-cleanup.sh
- id: config_sync-snapshot-name
  input: config_sync keeps a snapshot of the configuration each extension provided. On this site, inspect
    the live configuration and give the config object name of the config_sync snapshot for the external_link_popup
    module.
  criteria: config_sync uses the config_snapshot 'config_sync' snapshot set; the snapshot for external_link_popup
    is the config_snapshot entity config_sync.module.external_link_popup (config object config_snapshot.snapshot.config_sync.module.external_link_popup).
  bundle: config_sync
  rubric_ref: rubric/config_sync_config_sync_snapshot_name@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/config_sync-snapshot-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/config_sync-snapshot-cleanup.sh
- id: config_sync-set-full-reset
  input: On this Drupal site, configure config_sync so that applying distribution updates performs a FULL
    RESET of provided configuration (rather than the default merge). Apply the change to the live site.
  criteria: State config_sync.update_mode is set to 3 (UPDATE_MODE_FULL_RESET), e.g. drush state:set config_sync.update_mode
    3, or choose Full reset on the Distribution Updates form, or drush config-distro-update --update-mode=3.
  bundle: config_sync
  rubric_ref: rubric/config_sync_config_sync_set_full_reset@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/config_sync-full-reset-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/config_sync-full-reset-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/config_sync-full-reset-verify.sh
- id: config_sync-take-snapshot
  input: On this Drupal site the config_sync configuration snapshot for the 'views_migration' module has
    been removed. Use config_sync to (re)create a snapshot of the configuration the views_migration module
    provides, and apply it to the live site.
  criteria: A config_snapshot entity config_sync.module.views_migration exists again, created via the
    snapshotter, e.g. \Drupal::service('config_sync.snapshotter')->refreshExtensionSnapshot('module',
    ['views_migration'], ConfigSyncSnapshotterInterface::SNAPSHOT_MODE_INSTALL) (or createSnapshot()).
  bundle: config_sync
  rubric_ref: rubric/config_sync_config_sync_take_snapshot@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/config_sync-take-snapshot-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/config_sync-take-snapshot-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/config_sync-take-snapshot-verify.sh
