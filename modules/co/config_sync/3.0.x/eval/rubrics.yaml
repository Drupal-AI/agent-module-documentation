rubrics:
- id: config_sync_config_sync_what_and_where
  version: '1.0'
  applicable_bundles:
  - config_sync
  checks:
  - kind: must_contain_any
    values:
    - Distribution Updates
    - config_distro.import
    - /admin/config/development/distro
    - snapshot
  scoring:
    combine: all_pass
- id: config_sync_config_sync_update_modes
  version: '1.0'
  applicable_bundles:
  - config_sync
  checks:
  - kind: must_contain_any
    values:
    - merge
    - partial reset
    - full reset
  scoring:
    combine: all_pass
- id: config_sync_config_sync_drush
  version: '1.0'
  applicable_bundles:
  - config_sync
  checks:
  - kind: must_contain_any
    values:
    - config-sync-list-updates
    - cs-list
    - --update-mode
  scoring:
    combine: all_pass
- id: config_sync_config_sync_current_mode
  version: '1.0'
  applicable_bundles:
  - config_sync
  checks:
  - kind: must_contain_any
    values:
    - partial reset
    - partial
    - '2'
  scoring:
    combine: all_pass
- id: config_sync_config_sync_snapshot_name
  version: '1.0'
  applicable_bundles:
  - config_sync
  checks:
  - kind: must_contain_any
    values:
    - config_snapshot.snapshot.config_sync.module.external_link_popup
    - config_sync.module.external_link_popup
  scoring:
    combine: all_pass
- id: config_sync_config_sync_set_full_reset
  version: '1.0'
  applicable_bundles:
  - config_sync
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
- id: config_sync_config_sync_take_snapshot
  version: '1.0'
  applicable_bundles:
  - config_sync
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
