rubrics:
- id: config_ignore_readonly_config_ignore_readonly_what_hook
  version: '1.0'
  applicable_bundles:
  - config_ignore_readonly
  checks:
  - kind: must_contain_any
    values:
    - hook_config_readonly_whitelist_patterns
    - config_readonly_whitelist_patterns
    - config_ignore
    - ignored_config_entities
    - whitelist
  scoring:
    combine: all_pass
- id: config_ignore_readonly_config_ignore_readonly_make_editable
  version: '1.0'
  applicable_bundles:
  - config_ignore_readonly
  checks:
  - kind: must_contain_any
    values:
    - config_ignore
    - ignored_config_entities
    - ignore list
    - add system.site
  scoring:
    combine: all_pass
- id: config_ignore_readonly_config_ignore_readonly_limitations
  version: '1.0'
  applicable_bundles:
  - config_ignore_readonly
  checks:
  - kind: must_contain_any
    values:
    - force-import
    - force import
    - '~'
    - sub-key
    - partial
    - single key
    - all config names
  scoring:
    combine: all_pass
- id: config_ignore_readonly_config_ignore_readonly_ignored_site
  version: '1.0'
  applicable_bundles:
  - config_ignore_readonly
  checks:
  - kind: must_contain_any
    values:
    - system.site
  scoring:
    combine: all_pass
- id: config_ignore_readonly_config_ignore_readonly_ignored_contact
  version: '1.0'
  applicable_bundles:
  - config_ignore_readonly
  checks:
  - kind: must_contain_any
    values:
    - contact.form.feedback
  scoring:
    combine: all_pass
- id: config_ignore_readonly_config_ignore_readonly_editable_site
  version: '1.0'
  applicable_bundles:
  - config_ignore_readonly
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
- id: config_ignore_readonly_config_ignore_readonly_editable_glob
  version: '1.0'
  applicable_bundles:
  - config_ignore_readonly
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
