metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: config_ignore_readonly
  version: 2.2.x
  note: 'Config Ignore Readonly is a single-hook bridge: config_ignore_readonly_config_readonly_whitelist_patterns()
    returns ConfigIgnoreConfig::fromConfig(config(''config_ignore.settings''))->getFormated(''simple''),
    i.e. the flat import/update ignore list at config_ignore.settings:ignored_config_entities (simple
    mode). config_readonly treats those patterns as editable-under-readonly. No UI/settings/permissions/schema/plugins.
    Medium cases seed config_ignore.settings:ignored_config_entities with a known value and the agent
    reads it back via drush cget. Hard cases clear that list (verify FAILS because the module then forwards
    no matching pattern -- note the alter hook still injects unrelated ai_provider_amazeeio patterns,
    so verify checks specifically for system.site / a glob matching system.rss) then the agent adds the
    pattern and verify confirms the module forwards it via the invoked hook. Baseline ignored_config_entities
    is empty; cleanup/reset restore [].'
questions:
- id: config_ignore_readonly-what-hook
  input: The Drupal module config_ignore_readonly lets some config forms stay editable even when config_readonly
    has locked the site. Which Drupal hook does it implement, and how does it decide which forms remain
    editable?
  criteria: It implements hook_config_readonly_whitelist_patterns(). It reads Config Ignore's ignore list
    (config_ignore.settings:ignored_config_entities, the simple import/update patterns via ConfigIgnoreConfig::getFormated('simple'))
    and returns those patterns to config_readonly as its whitelist, so any config form whose config is
    ignored stays editable while readonly is active.
  bundle: config_ignore_readonly
  rubric_ref: rubric/config_ignore_readonly_config_ignore_readonly_what_hook@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: config_ignore_readonly-make-editable
  input: On a Drupal site with config_readonly active, I want the Basic site settings form (which edits
    system.site) to remain editable while config_ignore_readonly is enabled. What do I actually change
    to make that happen?
  criteria: Add system.site to Config Ignore's ignore list (config_ignore.settings:ignored_config_entities).
    Because config_ignore_readonly forwards the ignore list to config_readonly's whitelist, ignoring system.site
    makes the site information form submittable even under readonly. No config_ignore_readonly-specific
    setting exists.
  bundle: config_ignore_readonly
  rubric_ref: rubric/config_ignore_readonly_config_ignore_readonly_make_editable@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: config_ignore_readonly-limitations
  input: Which Config Ignore pattern styles does config_ignore_readonly NOT support when deciding which
    forms stay editable under config_readonly?
  criteria: Force-import patterns like ~webform.webform.contact are not supported, and partial/sub-key
    patterns like user.mail:register_no_approval_required.body are not supported (the whole config name
    must be ignored). Also, a form with multiple getEditableConfigNames() only becomes editable when all
    of them are ignored.
  bundle: config_ignore_readonly
  rubric_ref: rubric/config_ignore_readonly_config_ignore_readonly_limitations@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: config_ignore_readonly-ignored-site
  input: On this Drupal site, Config Ignore is configured so that exactly one configuration object stays
    editable under config_readonly (via config_ignore_readonly). Inspect the live configuration and name
    that configuration object.
  criteria: 'system.site: config_ignore.settings:ignored_config_entities is [system.site], and config_ignore_readonly
    forwards that to config_readonly''s whitelist, so the Basic site settings form stays editable under
    readonly.'
  bundle: config_ignore_readonly
  rubric_ref: rubric/config_ignore_readonly_config_ignore_readonly_ignored_site@1.0
  tags:
  - mode:introspection
  - difficulty:medium
