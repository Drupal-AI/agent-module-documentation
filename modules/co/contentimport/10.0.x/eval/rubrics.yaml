rubrics:
- id: contentimport_contentimport_mandatory_columns
  version: '1.0'
  applicable_bundles:
  - contentimport
  checks:
  - kind: must_contain_any
    values:
    - title
    - langcode
    - /admin/config/content/contentimport
  scoring:
    combine: all_pass
- id: contentimport_contentimport_update_mode
  version: '1.0'
  applicable_bundles:
  - contentimport
  checks:
  - kind: must_contain_any
    values:
    - nodeid
  scoring:
    combine: all_pass
- id: contentimport_contentimport_taxonomy_format
  version: '1.0'
  applicable_bundles:
  - contentimport
  checks:
  - kind: must_contain_any
    values:
    - 'Vocabulary: term'
    - vocabulary:term
    - auto
    - created
    - comma
  scoring:
    combine: all_pass
- id: contentimport_contentimport_article_field
  version: '1.0'
  applicable_bundles:
  - contentimport
  checks:
  - kind: must_contain_any
    values:
    - body
  scoring:
    combine: all_pass
- id: contentimport_contentimport_target_types
  version: '1.0'
  applicable_bundles:
  - contentimport
  checks:
  - kind: must_contain_any
    values:
    - article
    - page
    - blog_post
  scoring:
    combine: all_pass
- id: contentimport_contentimport_import_articles
  version: '1.0'
  applicable_bundles:
  - contentimport
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
- id: contentimport_contentimport_import_articles_layman
  version: '1.0'
  applicable_bundles:
  - contentimport
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
