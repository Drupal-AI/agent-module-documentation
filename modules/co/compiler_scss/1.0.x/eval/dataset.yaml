metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: compiler_scss
  version: 1.0.x
  note: 'SCSS Compiler registers an ''scss'' Compiler plugin (ScssCompiler, @Compiler("scss")) for the
    compiler module, backed by the swappable service compiler_scss.backend (ScssPhp, wrapping scssphp/scssphp).
    Compile via \Drupal::service(''plugin.manager.compiler'')->createInstance(''scss'')->compile($context)
    where $context is a Drupal\compiler\CompilerContext(''scss'', $options, [inputs]). It has NO per-site
    config, admin UI, routes, permissions or settings (configure=null) - it is code-driven developer infrastructure.
    Because there is no configurable state to seed, the medium (introspection) cases have the agent inspect
    the LIVE plugin registry / container to report the real registered plugin and backend class; setup/cleanup
    only rebuild caches. The hard (execution) cases exercise the module''s actual compile behavior: the
    agent compiles a known SCSS snippet and writes the resulting CSS to a file, verified by asserting
    on the compiled output (proving real compilation, not a copy). Test artifacts are namespaced /tmp/compiler_scss_eval_*.'
questions:
- id: compiler_scss-how-to-compile
  input: Using the Drupal compiler_scss (SCSS Compiler) module, how do I compile a snippet of SCSS into
    CSS from PHP?
  criteria: Get the scss compiler plugin from plugin.manager.compiler (createInstance('scss')), build
    a Drupal\compiler\CompilerContext('scss', [], [new CompilerInputDirect('...scss...')]) and call $compiler->compile($context)
    to get the CSS string.
  bundle: compiler_scss
  rubric_ref: rubric/compiler_scss_compiler_scss_how_to_compile@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: compiler_scss-backend-library
  input: What library and plugin power the compiler_scss module, and what service holds the backend?
  criteria: It uses the pure-PHP scssphp/scssphp library via the compiler_scss.backend service (ScssPhp),
    exposed as the @Compiler("scss") plugin (ScssCompiler) for the compiler module's plugin type.
  bundle: compiler_scss
  rubric_ref: rubric/compiler_scss_compiler_scss_backend_library@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: compiler_scss-schema-and-elements
  input: What config-schema data types or form elements does compiler_scss add for authoring style values?
  criteria: 'It adds config-schema types and matching form elements: compiler_scss_color, compiler_scss_font_family,
    compiler_scss_number and compiler_scss_unit.'
  bundle: compiler_scss
  rubric_ref: rubric/compiler_scss_compiler_scss_schema_and_elements@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: compiler_scss-registered-plugin
  input: On this Drupal site, inspect the live Compiler plugin registry and report which compiler plugin
    id is available and the PHP class that implements it.
  criteria: The plugin id 'scss' is registered, implemented by Drupal\compiler_scss\Plugin\Compiler\ScssCompiler
    (from plugin.manager.compiler->getDefinitions()).
  bundle: compiler_scss
  rubric_ref: rubric/compiler_scss_compiler_scss_registered_plugin@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/compiler_scss-registry-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/compiler_scss-registry-cleanup.sh
- id: compiler_scss-backend-service
  input: Inspect the live service container on this site and report which class the 'compiler_scss.backend'
    service resolves to.
  criteria: compiler_scss.backend resolves to Drupal\compiler_scss\Backend\ScssPhp (registered by CompilerScssServiceProvider).
  bundle: compiler_scss
  rubric_ref: rubric/compiler_scss_compiler_scss_backend_service@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/compiler_scss-registry-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/compiler_scss-registry-cleanup.sh
- id: compiler_scss-compile-arithmetic
  input: 'Using the compiler_scss ''scss'' compiler on this site, compile the SCSS ''$p: 10px; .box {
    padding: $p * 2; }'' and write the resulting CSS to the file /tmp/compiler_scss_eval_h1.css.'
  criteria: 'Compile with the scss plugin (plugin.manager.compiler -> createInstance(''scss''), CompilerContext
    with a CompilerInputDirect) and write the returned CSS to /tmp/compiler_scss_eval_h1.css; the output
    contains ''padding: 20px''.'
  bundle: compiler_scss
  rubric_ref: rubric/compiler_scss_compiler_scss_compile_arithmetic@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/compiler_scss-compile-arithmetic-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/compiler_scss-compile-arithmetic-reset.sh
    verify: agent-module-documentation/evaluation/verify/compiler_scss-compile-arithmetic-verify.sh
- id: compiler_scss-compile-nesting
  input: 'Using the compiler_scss ''scss'' compiler, compile the nested SCSS ''.a { .b { color: red; }
    }'' and write the resulting CSS to /tmp/compiler_scss_eval_h2.css.'
  criteria: 'Compiling the nested SCSS yields the selector ''.a .b'' with ''color: red''; write that CSS
    to /tmp/compiler_scss_eval_h2.css.'
  bundle: compiler_scss
  rubric_ref: rubric/compiler_scss_compiler_scss_compile_nesting@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/compiler_scss-compile-nesting-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/compiler_scss-compile-nesting-reset.sh
    verify: agent-module-documentation/evaluation/verify/compiler_scss-compile-nesting-verify.sh
