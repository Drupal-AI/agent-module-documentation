metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: config_views
  version: 2.1.x
  note: config_views (Configuration Entity View) exposes a Views base table per config-entity type named
    config_<prefix with . as _> (node.type -> config_node_type, user.role -> config_user_role, image.style
    -> config_image_style, system.menu -> config_system_menu, views.view -> config_views_view), backed
    by the views_config_entity_query query plugin (Entity Query API). It ships ~14 default Views (some
    enabled e.g. content_types at admin/structure/types, some disabled e.g. user_roles) and an EntityReferenceSelection
    plugin config_views. No settings form, permissions, or Drush. Medium/hard cases create/inspect namespaced
    cv_* Views on those config base tables via drush; verify checks the View's base_table.
questions:
- id: cv-base-tables
  input: Using the config_views (Configuration Entity View) Drupal module, I want to build a View that
    lists user roles. What Views base table would that View use, and how is that base-table name derived
    from the config entity type?
  criteria: config_user_role. config_views names each base table config_ + the config entity type's config
    prefix with dots replaced by underscores; user.role -> config_user_role (likewise node.type -> config_node_type,
    image.style -> config_image_style).
  bundle: config_views
  rubric_ref: rubric/config_views_cv_base_tables@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: cv-query-plugin
  input: How does config_views let Views query configuration entities that have no SQL content table?
    Name the Views query plugin it uses and what API that plugin runs.
  criteria: It provides a Views query plugin views_config_entity_query (ConfigEntityQuery) that extends
    the SQL query plugin but executes the Entity Query API against config entity storage instead of SQL.
  bundle: config_views
  rubric_ref: rubric/config_views_cv_query_plugin@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: cv-default-views
  input: Out of the box, config_views can replace some core admin listing pages with Views. Which shipped
    View takes over the Content types listing at admin/structure/types, and how do you opt into the ones
    that ship disabled (like User roles)?
  criteria: The content_types View provides admin/structure/types. Some default Views ship disabled (e.g.
    user_roles, text_formats, view_modes, views_list); enable them at Structure > Views (or drush views:enable)
    to have them take over the corresponding admin list.
  bundle: config_views
  rubric_ref: rubric/config_views_cv_default_views@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: cv-known-basetable
  input: This site has a View with machine id cv_known created with config_views. Inspect the live View
    configuration and state which Views base table it is built on (and therefore which kind of configuration
    entity it lists).
  criteria: cv_known is built on the config_image_style base table, so it lists image style configuration
    entities. (drush cget views.view.cv_known base_table)
  bundle: config_views
  rubric_ref: rubric/config_views_cv_known_basetable@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
