rubrics:
- id: config_views_cv_base_tables
  version: '1.0'
  applicable_bundles:
  - config_views
  checks:
  - kind: must_contain_any
    values:
    - config_user_role
  scoring:
    combine: all_pass
- id: config_views_cv_query_plugin
  version: '1.0'
  applicable_bundles:
  - config_views
  checks:
  - kind: must_contain_any
    values:
    - views_config_entity_query
    - Entity Query
    - EntityQuery
    - entity query
  scoring:
    combine: all_pass
- id: config_views_cv_default_views
  version: '1.0'
  applicable_bundles:
  - config_views
  checks:
  - kind: must_contain_any
    values:
    - content_types
    - admin/structure/types
  scoring:
    combine: all_pass
- id: config_views_cv_known_basetable
  version: '1.0'
  applicable_bundles:
  - config_views
  checks:
  - kind: must_contain_any
    values:
    - config_image_style
  scoring:
    combine: all_pass
- id: config_views_cv_known_roles
  version: '1.0'
  applicable_bundles:
  - config_views
  checks:
  - kind: must_contain_any
    values:
    - config_user_role
    - user role
    - role
  scoring:
    combine: all_pass
- id: config_views_cv_build_roles
  version: '1.0'
  applicable_bundles:
  - config_views
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
- id: config_views_cv_build_imagestyles
  version: '1.0'
  applicable_bundles:
  - config_views
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
