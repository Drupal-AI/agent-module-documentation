metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: commerce_shipping
  version: 3.0.x
  note: 'Commerce Shipping defines shipment/shipping-method entities, a ShippingMethod plugin type with
    flat-rate built-ins, value objects, a checkout pane, packers, and events. Cases are `recipe` (response-graded):
    they probe documented facts an agent would otherwise read source to answer. No site mutation; do not
    run.'
questions:
- id: commerce-shipping-entities
  input: In Drupal Commerce Shipping, which content entity represents an order's parcel of items to be
    shipped, and which content entity wraps a shipping-method plugin scoped to a store?
  criteria: 'commerce_shipment is the shipment (parcel) content entity; commerce_shipping_method is the
    store-scoped, plugin-backed shipping method content entity. Bundles/config: commerce_shipment_type
    and commerce_package_type.'
  bundle: commerce_shipping
  rubric_ref: rubric/commerce_shipping_commerce_shipping_entities@1.0
  tags:
  - mode:recipe
- id: commerce-shipping-plugin-type
  input: I want to add a custom carrier to Commerce Shipping. What plugin type do I implement, which attribute
    and base class do I use, and which method calculates rates?
  criteria: 'Implement a commerce_shipping_method plugin in Plugin/Commerce/ShippingMethod using the #[CommerceShippingMethod]
    attribute, extending ShippingMethodBase, and implement calculateRates() returning ShippingRate[].
    Manager: plugin.manager.commerce_shipping_method.'
  bundle: commerce_shipping
  rubric_ref: rubric/commerce_shipping_commerce_shipping_plugin_type@1.0
  tags:
  - mode:recipe
- id: commerce-shipping-builtins
  input: Which two shipping-method plugins ship with Commerce Shipping out of the box for charging a fixed
    fee?
  criteria: flat_rate (single flat fee per shipment) and flat_rate_per_item (fee multiplied by total quantity).
  bundle: commerce_shipping
  rubric_ref: rubric/commerce_shipping_commerce_shipping_builtins@1.0
  tags:
  - mode:recipe
- id: commerce-shipping-checkout-pane
  input: Which Commerce checkout pane does Commerce Shipping provide to collect a shipping address and
    let the customer pick a shipping rate, and what setting hides costs until an address is entered?
  criteria: The shipping_information checkout pane collects the shipping profile, packs the order and
    shows selectable rates; require_shipping_profile hides shipping costs until an address is entered
    (auto_recalculate recalculates on address change).
  bundle: commerce_shipping
  rubric_ref: rubric/commerce_shipping_commerce_shipping_checkout_pane@1.0
  tags:
  - mode:recipe
- id: commerce-shipping-rate-value-object
  input: In Commerce Shipping code, which value object represents a calculated shipping rate and what
    required properties must I pass to its constructor?
  criteria: ShippingRate; construct with a definition array requiring shipping_method_id, service (a ShippingService)
    and amount (a commerce_price Price); description/delivery_date optional.
  bundle: commerce_shipping
  rubric_ref: rubric/commerce_shipping_commerce_shipping_rate_value_object@1.0
  tags:
  - mode:recipe
- id: commerce-shipping-packer
  input: How do I make Commerce Shipping split one order into multiple shipments based on custom criteria
    like weight or stock location?
  criteria: Write a service implementing PackerInterface (applies() + pack() returning ProposedShipment[])
    and tag it commerce_shipping.packer; PackerManager collects packers (default DefaultPacker/AdminPacker).
  bundle: commerce_shipping
  rubric_ref: rubric/commerce_shipping_commerce_shipping_packer@1.0
  tags:
  - mode:recipe
- id: commerce-shipping-physical-weight
  input: Commerce Shipping models shipment item weight. Which module provides the Weight value used, and
    where does that weight live?
  criteria: The physical module (a dependency) provides physical\Weight; each ShipmentItem carries a Weight,
    and the shipment exposes getWeight(). Package types also use physical dimensions/weight.
  bundle: commerce_shipping
  rubric_ref: rubric/commerce_shipping_commerce_shipping_physical_weight@1.0
  tags:
  - mode:recipe
- id: commerce-shipping-conditions
  input: How do I limit a Commerce Shipping shipping method to a destination region or a weight range?
    Name the condition plugins.
  criteria: 'Attach condition plugins to the commerce_shipping_method entity: shipment_address (destination
    zone), shipment_weight (operator/weight/max_weight), also shipment_quantity and order_shipping_method.'
  bundle: commerce_shipping
  rubric_ref: rubric/commerce_shipping_commerce_shipping_conditions@1.0
  tags:
  - mode:recipe
