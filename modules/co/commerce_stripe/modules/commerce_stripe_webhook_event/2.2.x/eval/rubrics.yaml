rubrics:
- id: commerce_stripe_webhook_event_commerce_stripe_webhook_event_overview
  version: '1.0'
  applicable_bundles:
  - commerce_stripe_webhook_event
  checks:
  - kind: must_contain_any
    values:
    - /admin/commerce/config/stripe-webhook-events
    - Stripe webhook events
    - stripe-webhook-events
  scoring:
    combine: all_pass
- id: commerce_stripe_webhook_event_commerce_stripe_webhook_event_config_keys
  version: '1.0'
  applicable_bundles:
  - commerce_stripe_webhook_event
  checks:
  - kind: must_contain_any
    values:
    - queue
    - commerce_stripe_webhook_event.settings
    - AdvancedQueue
  scoring:
    combine: all_pass
- id: commerce_stripe_webhook_event_commerce_stripe_webhook_event_permissions
  version: '1.0'
  applicable_bundles:
  - commerce_stripe_webhook_event
  checks:
  - kind: must_contain_any
    values:
    - view commerce stripe webhook event
    - purge commerce stripe webhook event
  scoring:
    combine: all_pass
- id: commerce_stripe_webhook_event_commerce_stripe_webhook_event_retention_introspect
  version: '1.0'
  applicable_bundles:
  - commerce_stripe_webhook_event
  checks:
  - kind: must_contain_any
    values:
    - '111111'
  scoring:
    combine: all_pass
- id: commerce_stripe_webhook_event_commerce_stripe_webhook_event_queue_introspect
  version: '1.0'
  applicable_bundles:
  - commerce_stripe_webhook_event
  checks:
  - kind: must_contain_any
    values:
    - 'true'
    - asynchronous
    - queue
    - enabled
  scoring:
    combine: all_pass
- id: commerce_stripe_webhook_event_commerce_stripe_webhook_event_set_retention
  version: '1.0'
  applicable_bundles:
  - commerce_stripe_webhook_event
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
- id: commerce_stripe_webhook_event_commerce_stripe_webhook_event_enable_queue
  version: '1.0'
  applicable_bundles:
  - commerce_stripe_webhook_event
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
