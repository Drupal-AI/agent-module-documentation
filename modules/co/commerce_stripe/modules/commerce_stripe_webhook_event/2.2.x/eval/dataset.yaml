- id: commerce_stripe_webhook_event-enable-queue
  input: Configure commerce_stripe_webhook_event to process incoming Stripe webhook events asynchronously
    through the AdvancedQueue-backed queue, and apply the change to the live site.
  criteria: commerce_stripe_webhook_event.settings:queue == true (drush config:set commerce_stripe_webhook_event.settings
    queue 1). Events are then processed via the AdvancedQueue job type commerce_stripe_webhook_event.
  bundle: commerce_stripe_webhook_event
  rubric_ref: rubric/commerce_stripe_webhook_event_commerce_stripe_webhook_event_enable_queue@1.0
  tags:
