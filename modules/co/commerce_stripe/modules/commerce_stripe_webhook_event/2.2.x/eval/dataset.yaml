metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: commerce_stripe_webhook_event
  version: 2.2.x
  note: 'Submodule of commerce_stripe. Logs Stripe webhooks to the commerce_stripe_webhook_event DB table;
    overview UI at /admin/commerce/config/stripe-webhook-events (route commerce_stripe_webhook_event.overview,
    perm ''view commerce stripe webhook event''); purge-confirm route perm ''purge commerce stripe webhook
    event''. Config object commerce_stripe_webhook_event.settings has retention_time (default 2592000s)
    and queue (bool). Async processing uses AdvancedQueue job type commerce_stripe_webhook_event / queue
    worker commerce_stripe_webhook_event_processor. Statuses: 0 unprocessed / 1 succeeded / 2 failed /
    3 skipped. All medium/hard cases are grounded in the local settings config (no Stripe API).'
questions:
- id: commerce_stripe_webhook_event-overview
  input: The commerce_stripe_webhook_event submodule is enabled. Where in the admin UI do I go to review
    the Stripe webhook events it has logged?
  criteria: The overview is at /admin/commerce/config/stripe-webhook-events (route commerce_stripe_webhook_event.overview,
    permission 'view commerce stripe webhook event'); each row links to a details page and there is a
    purge-processed-events confirm form.
  bundle: commerce_stripe_webhook_event
  rubric_ref: rubric/commerce_stripe_webhook_event_commerce_stripe_webhook_event_overview@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: commerce_stripe_webhook_event-config-keys
  input: How do I make commerce_stripe_webhook_event process webhook events asynchronously through a queue
    instead of during the request, and which config object controls that?
  criteria: 'Enable the ''queue'' setting in the config object commerce_stripe_webhook_event.settings
    (queue: true). Then events are processed via the AdvancedQueue job type commerce_stripe_webhook_event
    (queue worker commerce_stripe_webhook_event_processor) instead of synchronously. retention_time (default
    2592000) controls how long processed events are kept.'
  bundle: commerce_stripe_webhook_event
  rubric_ref: rubric/commerce_stripe_webhook_event_commerce_stripe_webhook_event_config_keys@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: commerce_stripe_webhook_event-permissions
  input: What two permissions does commerce_stripe_webhook_event define, and what does each gate?
  criteria: '''view commerce stripe webhook event'' gates the overview and details pages; ''purge commerce
    stripe webhook event'' gates the purge-processed-events confirm form. Both are restrict access: true.'
  bundle: commerce_stripe_webhook_event
  rubric_ref: rubric/commerce_stripe_webhook_event_commerce_stripe_webhook_event_permissions@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: commerce_stripe_webhook_event-retention-introspect
  input: On this site, commerce_stripe_webhook_event has a customised retention period. Inspect the live
    config and tell me the retention time, in seconds, for processed webhook events.
  criteria: retention_time is 111111 seconds (commerce_stripe_webhook_event.settings:retention_time).
  bundle: commerce_stripe_webhook_event
  rubric_ref: rubric/commerce_stripe_webhook_event_commerce_stripe_webhook_event_retention_introspect@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/commerce_stripe_webhook_event-settings-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/commerce_stripe_webhook_event-settings-cleanup.sh
- id: commerce_stripe_webhook_event-queue-introspect
  input: Is this site configured to process Stripe webhook events synchronously or asynchronously via
    a queue? Inspect the commerce_stripe_webhook_event configuration and report the value of its queue
    setting.
  criteria: The 'queue' setting is true, so events are processed asynchronously via AdvancedQueue (commerce_stripe_webhook_event.settings:queue
    = true).
  bundle: commerce_stripe_webhook_event
  rubric_ref: rubric/commerce_stripe_webhook_event_commerce_stripe_webhook_event_queue_introspect@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/commerce_stripe_webhook_event-settings-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/commerce_stripe_webhook_event-settings-cleanup.sh
- id: commerce_stripe_webhook_event-set-retention
  input: Configure commerce_stripe_webhook_event so that processed Stripe webhook events are retained
    for only 1 day (86400 seconds). Apply the change to the live site.
  criteria: commerce_stripe_webhook_event.settings:retention_time == 86400 (drush config:set commerce_stripe_webhook_event.settings
    retention_time 86400).
  bundle: commerce_stripe_webhook_event
  rubric_ref: rubric/commerce_stripe_webhook_event_commerce_stripe_webhook_event_set_retention@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
