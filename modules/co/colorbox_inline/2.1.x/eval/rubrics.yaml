rubrics:
- id: colorbox_inline_colorbox_inline_basic_attribute
  version: '1.0'
  applicable_bundles:
  - colorbox_inline
  checks:
  - kind: must_contain_any
    values:
    - data-colorbox-inline
    - data-colorbox-inline=".user-login"
  scoring:
    combine: all_pass
- id: colorbox_inline_colorbox_inline_size_attributes
  version: '1.0'
  applicable_bundles:
  - colorbox_inline
  checks:
  - kind: must_contain_any
    values:
    - data-width
    - data-height
  scoring:
    combine: all_pass
- id: colorbox_inline_colorbox_inline_vs_load
  version: '1.0'
  applicable_bundles:
  - colorbox_inline
  checks:
  - kind: must_contain_any
    values:
    - colorbox_load
    - already on the page
    - not
  scoring:
    combine: all_pass
- id: colorbox_inline_colorbox_inline_config
  version: '1.0'
  applicable_bundles:
  - colorbox_inline
  checks:
  - kind: must_contain_any
    values:
    - 'no'
    - none
    - no configuration
    - no admin
  scoring:
    combine: all_pass
- id: colorbox_inline_colorbox_inline_dependency
  version: '1.0'
  applicable_bundles:
  - colorbox_inline
  checks:
  - kind: must_contain_any
    values:
    - colorbox
    - Colorbox module
    - colorbox library
  scoring:
    combine: all_pass
- id: colorbox_inline_colorbox_inline_hidden_source
  version: '1.0'
  applicable_bundles:
  - colorbox_inline
  checks:
  - kind: must_contain_any
    values:
    - shown
    - show
    - re-hide
    - onCleanup
    - hidden again
  scoring:
    combine: all_pass
- id: colorbox_inline_colorbox_inline_rel_group
  version: '1.0'
  applicable_bundles:
  - colorbox_inline
  checks:
  - kind: must_contain_any
    values:
    - data-rel
    - rel
  scoring:
    combine: all_pass
