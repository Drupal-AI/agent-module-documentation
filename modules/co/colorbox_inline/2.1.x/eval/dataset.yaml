metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: colorbox_inline
  version: 2.1.x
  note: 'Colorbox Inline is a tiny, config-free extension of the Colorbox module: a single JS behavior
    driven by data- attributes that opens in-page content in a lightbox. Cases are all `recipe` (response-graded);
    they probe colorbox_inline-specific markup facts and behavior documented under agent/, and never mutate
    site state.'
questions:
- id: colorbox-inline-basic-attribute
  input: On a Drupal 11 site with the Colorbox Inline module enabled, I want a link that opens a hidden
    div with class 'user-login' inside a lightbox. What HTML attribute do I put on the link and what is
    its value?
  criteria: Add data-colorbox-inline to the link and set its value to a CSS selector for the source element,
    e.g. <a data-colorbox-inline=".user-login" href="#">User Login</a>.
  bundle: colorbox_inline
  rubric_ref: rubric/colorbox_inline_colorbox_inline_basic_attribute@1.0
  tags:
  - mode:recipe
- id: colorbox-inline-size-attributes
  input: How do I control the width and height of the Colorbox Inline modal for a specific trigger link?
  criteria: Add data-width and data-height attributes to the trigger element; they override the global
    Colorbox width/height for that link.
  bundle: colorbox_inline
  rubric_ref: rubric/colorbox_inline_colorbox_inline_size_attributes@1.0
  tags:
  - mode:recipe
- id: colorbox-inline-vs-load
  input: I want a Colorbox modal whose content is fetched over AJAX rather than already rendered on the
    page. Is Colorbox Inline the right module, and if not which one?
  criteria: No — Colorbox Inline only shows content already present in the page DOM. For AJAX-loaded modal
    content use the separate colorbox_load module.
  bundle: colorbox_inline
  rubric_ref: rubric/colorbox_inline_colorbox_inline_vs_load@1.0
  tags:
  - mode:recipe
- id: colorbox-inline-config
  input: Where is the admin settings form for the Colorbox Inline module and what does it configure?
  criteria: There is no configuration UI, settings, or permissions for Colorbox Inline. Enabling the module
    is the entire setup; behavior is controlled per-element via data- attributes. Global Colorbox styling
    comes from the parent Colorbox module.
  bundle: colorbox_inline
  rubric_ref: rubric/colorbox_inline_colorbox_inline_config@1.0
  tags:
  - mode:recipe
- id: colorbox-inline-dependency
  input: What module does Colorbox Inline depend on, and what has to be installed for the lightbox to
    actually open?
  criteria: It depends on the Colorbox module (colorbox:colorbox), which in turn needs the external jQuery
    Colorbox JS library installed (e.g. via drush colorbox:plugin).
  bundle: colorbox_inline
  rubric_ref: rubric/colorbox_inline_colorbox_inline_dependency@1.0
  tags:
  - mode:recipe
- id: colorbox-inline-hidden-source
  input: If the element I target with data-colorbox-inline is styled display:none, will Colorbox Inline
    still show it, and what happens after the modal closes?
  criteria: Yes. If the target is not visible, the module shows it while the modal is open and re-hides
    it on Colorbox onCleanup, so hidden source markup is the intended pattern.
  bundle: colorbox_inline
  rubric_ref: rubric/colorbox_inline_colorbox_inline_hidden_source@1.0
  tags:
  - mode:recipe
- id: colorbox-inline-rel-group
  input: Which data- attribute groups several Colorbox Inline triggers together so the modal shows prev/next
    navigation between them?
  criteria: The data-rel attribute — give multiple triggers the same data-rel value to group them (Colorbox
    rel).
  bundle: colorbox_inline
  rubric_ref: rubric/colorbox_inline_colorbox_inline_rel_group@1.0
  tags:
  - mode:recipe
