rubrics:
- id: config_readonly_config_readonly_activate
  version: '1.0'
  applicable_bundles:
  - config_readonly
  checks:
  - kind: must_contain_any
    values:
    - settings.php
    - $settings['config_readonly'] = TRUE
    - $settings['config_readonly']
  scoring:
    combine: all_pass
- id: config_readonly_config_readonly_whitelist
  version: '1.0'
  applicable_bundles:
  - config_readonly
  checks:
  - kind: must_contain_any
    values:
    - config_readonly_whitelist_patterns
    - hook_config_readonly_whitelist_patterns
  scoring:
    combine: all_pass
- id: config_readonly_config_readonly_import_bypass
  version: '1.0'
  applicable_bundles:
  - config_readonly
  checks:
  - kind: must_contain_any
    values:
    - ConfigImporter
    - config_importer
    - lockMayBeAvailable
    - system.db_update
  scoring:
    combine: all_pass
- id: config_readonly_config_readonly_whitelist_lookup
  version: '1.0'
  applicable_bundles:
  - config_readonly
  checks:
  - kind: must_contain_any
    values:
    - views.view.cr_eval_*
  scoring:
    combine: all_pass
- id: config_readonly_config_readonly_lock_state
  version: '1.0'
  applicable_bundles:
  - config_readonly
  checks:
  - kind: must_contain_any
    values:
    - not active
    - not locked
    - writable
    - is off
    - is OFF
    - 'NULL'
    - not currently locked
  scoring:
    combine: all_pass
- id: config_readonly_config_readonly_settings_whitelist
  version: '1.0'
  applicable_bundles:
  - config_readonly
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
- id: config_readonly_config_readonly_hook_module
  version: '1.0'
  applicable_bundles:
  - config_readonly
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
