metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: country
  version: 2.2.x
  note: 'Country adds a ''country'' field type (stores a 2-letter ISO 3166 code), widgets country_default
    (select) / country_autocomplete, formatters country_default (name) / country_iso_code (raw code),
    and a per-field ''selectable_countries'' setting. No external services. All medium/hard cases are
    grounded in live Field/entity-display config on the Article content type, verifiable with drush php:eval:
    introspection reads back a field''s selectable_countries and its configured widget; execution creates
    a restricted country field and switches a field''s formatter to country_iso_code.'
questions:
- id: country-field-type
  input: What field type does the Drupal 'country' contrib module provide, and what exactly is stored
    in the database for it?
  criteria: It provides a field type with id 'country' whose stored value is a 2-character ISO 3166 alpha-2
    country code (column 'value', length 2); the human-readable name is resolved from core's country_manager
    service.
  bundle: country
  rubric_ref: rubric/country_country_field_type@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: country-formatters
  input: The country module ships two field formatters. What are their machine ids and how does each display
    the value?
  criteria: country_default renders the localized country name (the default formatter); country_iso_code
    renders the raw ISO code (e.g. US).
  bundle: country
  rubric_ref: rubric/country_country_formatters@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: country-restrict-setting
  input: With the country module, how do I limit a country field so editors can only pick from a specific
    subset of countries? Name the field setting.
  criteria: Set the field's 'selectable_countries' setting (a list of ISO codes) on the storage/field
    settings; an empty value offers all countries. The effective list is resolved by the country.field.manager
    service.
  bundle: country
  rubric_ref: rubric/country_country_restrict_setting@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: country-known-restricted
  input: The Article content type on this site has a country field whose choices are restricted to a subset
    of countries. Inspect the live field configuration and tell me the machine name of the field and which
    ISO country codes it allows.
  criteria: The field is field_ctry_known (type country); its selectable_countries setting is [US, GB,
    FR].
  bundle: country
  rubric_ref: rubric/country_country_known_restricted@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/country-restricted-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/country-restricted-cleanup.sh
- id: country-known-widget
  input: One country field on the Article content type uses a type-ahead widget rather than a dropdown.
    Inspect the live default form display and tell me the machine name of the widget it uses and the placeholder
    text configured on it.
  criteria: field_ctry_widget uses the country_autocomplete widget with placeholder 'Start typing a country'.
  bundle: country
  rubric_ref: rubric/country_country_known_widget@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/country-widget-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/country-widget-cleanup.sh
- id: country-add-restricted-field
  input: On the Article content type, add a Country field named field_ctry_task (field type from the country
    module) and configure it so editors may only choose Canada (CA) and Mexico (MX). Apply the change
    to the live site.
  criteria: Create a field storage (entity_type node, field_name field_ctry_task, type country) and a
    field on node.article with settings.selectable_countries = ['CA','MX'], then save. verify checks the
    field's type is country and its selectable_countries equals [CA, MX].
  bundle: country
  rubric_ref: rubric/country_country_add_restricted_field@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/country-addfield-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/country-addfield-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/country-addfield-verify.sh
- id: country-set-iso-formatter
  input: The Article content type has a country field field_ctry_fmt that currently displays the full
    country name. Change its default display so it shows the raw two-letter ISO country code instead,
    and apply the change to the live site.
  criteria: In core.entity_view_display.node.article.default set the field_ctry_fmt component formatter
    type to country_iso_code (instead of country_default) and save.
  bundle: country
  rubric_ref: rubric/country_country_set_iso_formatter@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/country-formatter-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/country-formatter-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/country-formatter-verify.sh
