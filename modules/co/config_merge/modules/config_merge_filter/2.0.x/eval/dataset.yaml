- id: config_merge_filter-behavior
  input: 'On this site, the config snapshot storage and the active storage both contain a config object
    ''config_merge_filter_eval.data''. Using the config_merge filter plugin, filter-read that object with
    incoming data {"n": 2, "label": "base"} and report the resulting value of ''n''.'
  criteria: The snapshot (previous) has n=1 and the active storage has n=50 (a local customization). Because
    active (50) differs from previous (1), the merge keeps the customization, so the filtered value of
    n is 50. Drive it with plugin.manager.config_filter->createInstance('config_merge')->filterRead('config_merge_filter_eval.data',
    ['n'=>2,'label'=>'base']).
  bundle: config_merge_filter
  rubric_ref: rubric/config_merge_filter_config_merge_filter_behavior@1.0
