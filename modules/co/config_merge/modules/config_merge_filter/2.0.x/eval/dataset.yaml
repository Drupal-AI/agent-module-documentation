- id: config_merge_filter-merge-kept
  input: 'On this Drupal site, the config snapshot storage and active storage both hold a config object
    ''config_merge_filter_eval.item'' (snapshot n=1, active n=99). Using the config_merge Config Filter
    plugin, filter-read that object with incoming data {"n": 2, "label": "base"} and store the filter''s
    merged result array into Drupal State under key ''config_merge_filter_eval_kept''. Apply it to the
    live site.'
  criteria: $f = \Drupal::service('plugin.manager.config_filter')->createInstance('config_merge'); \Drupal::state()->set('config_merge_filter_eval_kept',
