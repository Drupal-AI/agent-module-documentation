metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: config_merge_filter
  version: 2.0.x
  note: config_merge_filter is a submodule of config_merge. It ships one Config Filter plugin, MergeFilter
    (@ConfigFilter id 'config_merge', weight 1000, label 'Config Merge'), registered with plugin.manager.config_filter.
    filterRead($name,$data) returns ConfigMerger::mergeConfigItemStates($snapshot, $data, $active) where
    snapshot=config.storage.snapshot (previous), active=config.storage, and $data is the incoming import
    (current) - when all three exist, else passes $data through. Requires config_merge + config_filter.
    No config, no schema, no UI, no permissions, no Drush, no plugin types of its own. Medium/hard cases
    are grounded in the live plugin registry and in driving the plugin via createInstance('config_merge')->filterRead()
    against seeded snapshot+active storages; hard cases store the merged output in Drupal State, verified
    live. Behavior confirmed on the running site (customized kept, uncustomized adopts update).
questions:
- id: config_merge_filter-what-it-is
  input: What does the config_merge_filter submodule provide, and what is the id of the plugin it registers?
  criteria: It provides a Config Filter plugin, MergeFilter, with @ConfigFilter id 'config_merge' (label
    'Config Merge', weight 1000). During a config import it merges the incoming data with the site's active
    configuration using config_merge's three-way merge, instead of overwriting customizations.
  bundle: config_merge_filter
  rubric_ref: rubric/config_merge_filter_config_merge_filter_what_it_is@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: config_merge_filter-dependencies
  input: Which modules must be enabled for config_merge_filter to work, and why each?
  criteria: It depends on config_filter (which provides the ConfigFilter plugin type the MergeFilter extends)
    and config_merge (which provides the ConfigMerger three-way merge algorithm the filter calls).
  bundle: config_merge_filter
  rubric_ref: rubric/config_merge_filter_config_merge_filter_dependencies@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: config_merge_filter-storages
  input: In the config_merge filter's filterRead(), which storages provide the 'previous' and 'active'
    states for the three-way merge, and what is the 'current' state?
  criteria: previous = the config snapshot storage (config.storage.snapshot), active = the active storage
    (config.storage), and current = the incoming data ($data) being imported. filterRead returns ConfigMerger::mergeConfigItemStates(previous,
    current, active) when all three exist, else the incoming data unchanged.
  bundle: config_merge_filter
  rubric_ref: rubric/config_merge_filter_config_merge_filter_storages@1.0
  tags:
  - mode:recipe
  - difficulty:easy
