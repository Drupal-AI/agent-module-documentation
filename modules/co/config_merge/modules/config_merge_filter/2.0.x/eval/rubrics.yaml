rubrics:
- id: config_merge_filter_config_merge_filter_what_it_is
  version: '1.0'
  applicable_bundles:
  - config_merge_filter
  checks:
  - kind: must_contain_any
    values:
    - config_merge
    - ConfigFilter
    - config filter
    - MergeFilter
  scoring:
    combine: all_pass
- id: config_merge_filter_config_merge_filter_dependencies
  version: '1.0'
  applicable_bundles:
  - config_merge_filter
  checks:
  - kind: must_contain_any
    values:
    - config_filter
    - config_merge
  scoring:
    combine: all_pass
- id: config_merge_filter_config_merge_filter_storages
  version: '1.0'
  applicable_bundles:
  - config_merge_filter
  checks:
  - kind: must_contain_any
    values:
    - config.storage.snapshot
    - snapshot
    - config.storage
    - active
  scoring:
    combine: all_pass
- id: config_merge_filter_config_merge_filter_weight
  version: '1.0'
  applicable_bundles:
  - config_merge_filter
  checks:
  - kind: must_contain_any
    values:
    - '1000'
  scoring:
    combine: all_pass
- id: config_merge_filter_config_merge_filter_behavior
  version: '1.0'
  applicable_bundles:
  - config_merge_filter
  checks:
  - kind: must_contain_any
    values:
    - '50'
  scoring:
    combine: all_pass
- id: config_merge_filter_config_merge_filter_merge_kept
  version: '1.0'
  applicable_bundles:
  - config_merge_filter
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
- id: config_merge_filter_config_merge_filter_merge_update
  version: '1.0'
  applicable_bundles:
  - config_merge_filter
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
