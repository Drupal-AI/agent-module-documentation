metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: copyprevention
  version: 2.0.x
  note: 'Client-side copy deterrents. Settings form route copyprevention.settings_form (/admin/config/user-interface/copyprevention),
    permissions ''administer copy prevention'' and ''bypass copy prevention''. All state in config object
    copyprevention.settings: copyprevention_body (checkboxes selectstart/copy/contextmenu -> body on<x>=''return
    false''), copyprevention_images (contextmenu/transparentgif), copyprevention_images_min_dimension
    (int, default 150), copyprevention_images_search (httpheader/pagehead/robotstxt; robotstxt needs the
    RobotsTxt module). Enabled = truthy value at the option key (unchecked stored as 0). Medium cases
    read a seeded body option and the seeded min dimension; hard cases enable the right-click deterrent
    and the noimageindex meta tag, verified against live config.'
questions:
- id: copyprevention-what-and-where
  input: On a Drupal site, which module lets me disable right-click and text selection to make copying
    harder, and where do I configure it?
  criteria: The Copy Prevention module. Configure it at Configuration > User interface > Copy Prevention
    (/admin/config/user-interface/copyprevention, route copyprevention.settings_form). Tick the body options
    to disable text selection, copy, and/or the right-click context menu.
  bundle: copyprevention
  rubric_ref: rubric/copyprevention_copyprevention_what_and_where@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: copyprevention-image-noindex
  input: Using copyprevention, how do I stop search engines from indexing my images, and which option
    needs another module?
  criteria: 'Under ''Protect/hide images from search engines'' (config copyprevention_images_search) enable
    the X-Robots-Tag: noimageindex header (httpheader), the noimageindex robots meta tag (pagehead), and/or
    robots.txt image Disallow rules (robotstxt). The robots.txt option requires the RobotsTxt module.'
  bundle: copyprevention
  rubric_ref: rubric/copyprevention_copyprevention_image_noindex@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: copyprevention-bypass-perm
  input: In the copyprevention module, how do I make sure my editors/admins are not affected by the copy
    deterrents? Is it truly secure?
  criteria: Grant the 'bypass copy prevention' permission to trusted roles; _copyprevention_is_enabled()
    returns FALSE for them so no body attributes/JS are attached. It is only a client-side deterrent (view-source,
    devtools and direct image URLs still work), not real protection.
  bundle: copyprevention
  rubric_ref: rubric/copyprevention_copyprevention_bypass_perm@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: copyprevention-known-body
  input: This Drupal site has copyprevention configured. Inspect the live copyprevention.settings and
    state which body-level protection(s) are currently enabled (text selection, copy, and/or right-click
    context menu).
  criteria: In copyprevention.settings, copyprevention_body has copy and contextmenu enabled (selectstart
    is off), i.e. copy-to-clipboard and the right-click context menu are disabled.
  bundle: copyprevention
  rubric_ref: rubric/copyprevention_copyprevention_known_body@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/copyprevention-body-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/copyprevention-body-cleanup.sh
- id: copyprevention-known-dimension
  input: The copyprevention image overlay is active on this site. Inspect the live configuration and report
    the minimum image dimension (in pixels) at which the transparent-GIF overlay kicks in.
  criteria: copyprevention.settings.copyprevention_images_min_dimension is 300, so only images larger
    than 300px get the transparent-GIF overlay (transparentgif is enabled).
  bundle: copyprevention
  rubric_ref: rubric/copyprevention_copyprevention_known_dimension@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/copyprevention-dimension-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/copyprevention-dimension-cleanup.sh
- id: copyprevention-enable-contextmenu
  input: On this Drupal site, use the copyprevention module to disable the right-click context menu across
    the whole site (the body-level context-menu deterrent), and save the change to the live configuration.
  criteria: In copyprevention.settings the copyprevention_body option 'contextmenu' is set to a truthy
    value (e.g. tick 'Disable right-click context menu' on the settings form, or set copyprevention_body['contextmenu']='contextmenu'
    and save).
  bundle: copyprevention
  rubric_ref: rubric/copyprevention_copyprevention_enable_contextmenu@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/copyprevention-enable-contextmenu-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/copyprevention-enable-contextmenu-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/copyprevention-enable-contextmenu-verify.sh
- id: copyprevention-enable-noimageindex
  input: Using copyprevention on this site, hide images from search engines by adding the 'noimageindex'
    robots meta tag to the page head, and apply the change to the live configuration.
  criteria: In copyprevention.settings the copyprevention_images_search option 'pagehead' is set to a
    truthy value, which makes hook_page_attachments() add <meta name="robots" content="noimageindex">
    to the page head.
  bundle: copyprevention
  rubric_ref: rubric/copyprevention_copyprevention_enable_noimageindex@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/copyprevention-enable-noimageindex-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/copyprevention-enable-noimageindex-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/copyprevention-enable-noimageindex-verify.sh
