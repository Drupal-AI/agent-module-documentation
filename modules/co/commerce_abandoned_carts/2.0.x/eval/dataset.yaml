- id: cac-golive
  input: 'Configure commerce_abandoned_carts on this site to go live: set the send timeout to 4320 minutes
    and turn test mode OFF. Apply the changes to the live configuration.'
  criteria: In commerce_abandoned_carts.settings set timeout=4320 and testmode=false (e.g. drush cset
