metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: commerce_abandoned_carts
  version: 2.0.x
  note: 'Commerce Abandoned Carts sends reminder emails for abandoned Drupal Commerce draft orders from
    hook_cron(), via commerce.mail_handler, tracking sent orders in the commerce_abandoned_carts DB table.
    All behaviour is in the config object commerce_abandoned_carts.settings (keys: timeout=1440, history_limit=21600,
    batch_limit=5, from_email, from_name='''', subject=''Your order is incomplete.'', customer_service_phone_number='''',
    bcc_active=false, bcc_email, testmode=true, testmode_email). Config form route commerce_abandoned_carts.configuration
    (/admin/commerce/config/abandoned_carts), permission ''administer commerce abandoned carts''. Test
    mode is ON by default. Medium/hard cases are grounded in that real config object.'
questions:
- id: cac-how-sent
  input: How does the commerce_abandoned_carts module actually send its abandoned-cart reminder emails?
    What triggers the send, and which orders does it target?
  criteria: Sending happens in hook_cron() (commerce_abandoned_carts_cron). On each cron run it finds
    draft commerce orders with a customer email that have been idle longer than the timeout (but within
    the history limit) and not yet notified, then sends via commerce.mail_handler. There is no manual
    send button.
  bundle: commerce_abandoned_carts
  rubric_ref: rubric/commerce_abandoned_carts_cac_how_sent@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: cac-testmode
  input: I installed commerce_abandoned_carts but no customers are getting emails. It ships in a safe
    default state. What setting controls this and what do I change to actually send to customers?
  criteria: 'Test mode is ON by default (testmode: true), which routes every message to testmode_email
    and never marks orders as sent. Turn testmode off (0) in commerce_abandoned_carts.settings (Commerce
    > Configuration > Abandoned carts) to send to real customers.'
  bundle: commerce_abandoned_carts
  rubric_ref: rubric/commerce_abandoned_carts_cac_testmode@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: cac-config-location
  input: Where is the commerce_abandoned_carts configuration form, and which permission and config object
    back it?
  criteria: Form at /admin/commerce/config/abandoned_carts (route commerce_abandoned_carts.configuration),
    permission 'administer commerce abandoned carts', config object commerce_abandoned_carts.settings.
  bundle: commerce_abandoned_carts
  rubric_ref: rubric/commerce_abandoned_carts_cac_config_location@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: cac-timeout
  input: On this Drupal site, inspect the commerce_abandoned_carts configuration and report the current
    'Send timeout' value (in minutes).
  criteria: The timeout is 720 minutes (commerce_abandoned_carts.settings:timeout).
  bundle: commerce_abandoned_carts
  rubric_ref: rubric/commerce_abandoned_carts_cac_timeout@1.0
  tags:
