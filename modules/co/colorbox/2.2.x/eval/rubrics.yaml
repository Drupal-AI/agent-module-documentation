rubrics:
- id: colorbox_colorbox_image_formatter
  version: '1.0'
  applicable_bundles:
  - colorbox
  checks:
  - kind: must_contain_any
    values:
    - colorbox
    - ColorboxFormatter
  scoring:
    combine: all_pass
- id: colorbox_colorbox_library_dependency
  version: '1.0'
  applicable_bundles:
  - colorbox
  checks:
  - kind: must_contain_any
    values:
    - drush colorbox:plugin
    - colorbox:plugin
    - libraries/colorbox
  scoring:
    combine: all_pass
- id: colorbox_colorbox_settings_config
  version: '1.0'
  applicable_bundles:
  - colorbox
  checks:
  - kind: must_contain_any
    values:
    - colorbox.settings
    - custom.style
    - "custom:\n  style"
  scoring:
    combine: all_pass
- id: colorbox_colorbox_image_style_keys
  version: '1.0'
  applicable_bundles:
  - colorbox
  checks:
  - kind: must_contain_any
    values:
    - image style
    - Manage display
    - colorbox_view_modes
    - lightbox image style
  scoring:
    combine: all_pass
- id: colorbox_colorbox_programmatic_attach
  version: '1.0'
  applicable_bundles:
  - colorbox
  checks:
  - kind: must_contain_any
    values:
    - colorbox.attachment
    - colorbox.activation_check
    - ColorboxAttachment
  scoring:
    combine: all_pass
- id: colorbox_colorbox_settings_alter
  version: '1.0'
  applicable_bundles:
  - colorbox
  checks:
  - kind: must_contain_any
    values:
    - hook_colorbox_settings_alter
    - colorbox_settings_alter
  scoring:
    combine: all_pass
- id: colorbox_colorbox_admin_route
  version: '1.0'
  applicable_bundles:
  - colorbox
  checks:
  - kind: must_contain_any
    values:
    - /admin/config/media/colorbox
    - colorbox.admin_settings
  scoring:
    combine: all_pass
- id: colorbox_colorbox_gallery_id
  version: '1.0'
  applicable_bundles:
  - colorbox
  checks:
  - kind: must_contain_any
    values:
    - colorbox.gallery_id_generator
    - GalleryIdHelper
  scoring:
    combine: all_pass
