metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: colorbox
  version: 2.2.x
  note: Colorbox integrates the jQuery Colorbox lightbox via field formatters plus a single config object
    and a few services. Cases are all `recipe` (response-graded) — they probe colorbox-specific facts
    documented under agent/, and never mutate site state.
questions:
- id: colorbox-image-formatter
  input: On a Drupal 11 site I want images in an image field to open in a lightbox modal instead of navigating
    to a new page. Which Colorbox field formatter do I assign under Manage display, and what is its formatter
    machine name?
  criteria: Assign the 'Colorbox' image field formatter (machine name `colorbox`, class ColorboxFormatter)
    under the field's Manage display.
  bundle: colorbox
  rubric_ref: rubric/colorbox_colorbox_image_formatter@1.0
  tags:
  - mode:recipe
- id: colorbox-library-dependency
  input: I enabled the Colorbox module but the lightbox does not open — clicking an image just loads the
    full image page. What is missing and how do I install it on this Drupal site?
  criteria: The external Colorbox JS library is missing. Install it with `drush colorbox:plugin` (installs
    into DRUPAL_ROOT/libraries/colorbox) or download it manually into /libraries/colorbox.
  bundle: colorbox
  rubric_ref: rubric/colorbox_colorbox_library_dependency@1.0
  tags:
  - mode:recipe
- id: colorbox-settings-config
  input: In code on a Drupal 11 site, which single config object holds Colorbox's global settings, and
    which config key selects the visual style (e.g. default vs. plain)?
  criteria: The `colorbox.settings` config object; the visual style is the `custom.style` key (default
    | plain | stockholmsyndrome | none).
  bundle: colorbox
  rubric_ref: rubric/colorbox_colorbox_settings_config@1.0
  tags:
  - mode:recipe
- id: colorbox-image-style-keys
  input: Which Colorbox formatter settings control (a) the image style used to render the field trigger/node
    image and (b) the image style shown inside the lightbox, and where do I set them?
  criteria: The formatter settings under Manage display include the trigger image style and the lightbox
    image style (or responsive style for colorbox_responsive); set them in the field's formatter settings.
  bundle: colorbox
  rubric_ref: rubric/colorbox_colorbox_image_style_keys@1.0
  tags:
  - mode:recipe
- id: colorbox-programmatic-attach
  input: I want to trigger Colorbox programmatically on an arbitrary link/render array in my own module
    (not through a field formatter). Which Colorbox service attaches the Colorbox library and drupalSettings
    to a render array, and which service decides whether it should activate?
  criteria: Use the `colorbox.attachment` service (ColorboxAttachment) to attach the library + drupalSettings
    to the render array, gated by the `colorbox.activation_check` service.
  bundle: colorbox
  rubric_ref: rubric/colorbox_colorbox_programmatic_attach@1.0
  tags:
  - mode:recipe
- id: colorbox-settings-alter
  input: In a custom Drupal module I need to change the runtime Colorbox JS options (for example disable
    scalePhotos) and swap the active style on one path. Which hook do I implement?
  criteria: Implement hook_colorbox_settings_alter(array &$settings, string &$style) to mutate the JS
    $settings and/or swap the $style plugin.
  bundle: colorbox
  rubric_ref: rubric/colorbox_colorbox_settings_alter@1.0
  tags:
  - mode:recipe
- id: colorbox-admin-route
  input: Where is the Colorbox global settings form on a Drupal site — give the admin URL path and the
    route machine name.
  criteria: The settings form is at /admin/config/media/colorbox (Configuration → Media → Colorbox), route
    `colorbox.admin_settings`.
  bundle: colorbox
  rubric_ref: rubric/colorbox_colorbox_admin_route@1.0
  tags:
  - mode:recipe
- id: colorbox-gallery-id
  input: I want images across a page grouped into one browsable Colorbox gallery, scoped by a token. Which
    Colorbox service generates the gallery grouping id?
  criteria: The `colorbox.gallery_id_generator` service (GalleryIdHelper) generates token-aware gallery
    grouping ids.
  bundle: colorbox
  rubric_ref: rubric/colorbox_colorbox_gallery_id@1.0
  tags:
  - mode:recipe
