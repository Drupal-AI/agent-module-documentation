- id: coi-expose-secrets
  input: Configure Config Override Inspector so that overridden values on fields marked as secret are
    exposed (shown) rather than masked. Apply the change to the live site.
  criteria: coi.settings overridden_value.secrets is set to true (e.g. drush config:set coi.settings overridden_value.secrets
    1), so COI shows overridden values even for secret-marked elements.
  bundle: coi
