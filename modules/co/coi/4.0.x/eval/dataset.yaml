metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: coi
  version: 4.0.x
  note: 'Config Override Inspector (COI) reads the #config[''key''] hints added by config_override_core_fields,
    splits config.object:key, and calls Config::hasOverrides(). All behavior comes from one config object
    coi.settings: override_behavior (disable|noaccess|''''), message.enabled/template, overridden_value.enabled/element/secrets,
    styling.selectors/default. Shipped defaults: override_behavior=disable, message.enabled=true, message.template=''This
    field is overridden by environment specific configuration.'', overridden_value.enabled=true, element=true,
    secrets=false, styling.selectors=true, default=true. Configure route coi.settings (/admin/config/user-interface/coi);
    permission ''administer config override inspector''. Medium cases read a seeded coi.settings value;
    hard cases change coi.settings and verify on the live config. coi.settings is owned by this module,
    so cases mutate and restore only its own config.'
questions:
- id: coi-behavior-options
  input: In Config Override Inspector (COI), the override_behavior setting controls what happens to a
    config form field whose value is overridden. What are its possible values and what does each one do?
  criteria: 'override_behavior in coi.settings is ''disable'' (default; disable the element and optionally
    show the overridden value as its default), ''noaccess'' (hide the element via #access=FALSE), or ''''
    (none; only add CSS classes / a message, don''t disable or hide).'
  bundle: coi
  rubric_ref: rubric/coi_coi_behavior_options@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: coi-detection
  input: How does COI decide that a configuration form field is overridden, what does it rely on to know
    which config each field edits, and what does it do to an overridden field by default?
  criteria: 'COI reads the #config[''key''] (or #config_data_store[''key'']) hint added by config_override_core_fields,
    splits config.object:key, and calls Config::hasOverrides(key). When true, by default (override_behavior=disable)
    it disables the field and can inject the overridden value, plus adds config--overridden classes and
    an override message.'
  bundle: coi
  rubric_ref: rubric/coi_coi_detection@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: coi-known-behavior
  input: Inspect the live COI configuration on this site and state the current value of the override_behavior
    setting.
  criteria: coi.settings override_behavior is currently 'noaccess' (drush config:get coi.settings override_behavior).
  bundle: coi
  rubric_ref: rubric/coi_coi_known_behavior@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/coi-known-behavior-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/coi-known-behavior-cleanup.sh
- id: coi-known-message
  input: COI shows a message next to overridden config fields. Inspect the live coi.settings configuration
    and report the exact override message template currently configured.
  criteria: coi.settings message.template is currently 'COI known override message' (from coi.settings;
    message.enabled controls whether it is shown).
  bundle: coi
  rubric_ref: rubric/coi_coi_known_message@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/coi-message-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/coi-message-cleanup.sh
- id: coi-set-noaccess
  input: On this Drupal site, configure Config Override Inspector so that overridden config form fields
    are HIDDEN (no access) rather than merely disabled. Apply the change to the live site.
  criteria: 'coi.settings override_behavior is set to ''noaccess'' (e.g. drush config:set coi.settings
    override_behavior noaccess), which makes overridden fields get #access=FALSE.'
  bundle: coi
  rubric_ref: rubric/coi_coi_set_noaccess@1.0
  tags:
