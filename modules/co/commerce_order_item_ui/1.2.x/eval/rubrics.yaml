rubrics:
- id: commerce_order_item_ui_coiu_where_is_ui
  version: '1.0'
  applicable_bundles:
  - commerce_order_item_ui
  checks:
  - kind: must_contain_any
    values:
    - /order-items
    - order-items
    - Order Items
  scoring:
    combine: all_pass
- id: commerce_order_item_ui_coiu_access_permission
  version: '1.0'
  applicable_bundles:
  - commerce_order_item_ui
  checks:
  - kind: must_contain_any
    values:
    - administer commerce_order
    - access commerce_order overview
    - manage default commerce_order_item
    - commerce_order_item
  scoring:
    combine: all_pass
- id: commerce_order_item_ui_coiu_add_page_behavior
  version: '1.0'
  applicable_bundles:
  - commerce_order_item_ui
  checks:
  - kind: must_contain_any
    values:
    - one
    - single
    - redirect
    - target_bundles
    - variation
  scoring:
    combine: all_pass
- id: commerce_order_item_ui_coiu_count_items
  version: '1.0'
  applicable_bundles:
  - commerce_order_item_ui
  checks:
  - kind: must_contain_any
    values:
    - '2'
  scoring:
    combine: all_pass
- id: commerce_order_item_ui_coiu_manage_url
  version: '1.0'
  applicable_bundles:
  - commerce_order_item_ui
  checks:
  - kind: must_contain_any
    values:
    - /order-items
  scoring:
    combine: all_pass
- id: commerce_order_item_ui_coiu_add_item
  version: '1.0'
  applicable_bundles:
  - commerce_order_item_ui
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
- id: commerce_order_item_ui_coiu_add_titled_item
  version: '1.0'
  applicable_bundles:
  - commerce_order_item_ui
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
