metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: config_distro_ignore
  version: 2.1.x
  note: 'config_distro_ignore is a submodule of config_distro. It retains listed configuration during
    distribution imports by returning the ACTIVE value for ignored config. Its state is the config object
    config_distro_ignore.settings with three sequences: all_collections (ignored everywhere), default_collection
    (ignored in the default collection), custom_collections (per non-default collection). Entries support
    shell wildcards (*,?) and an optional ::<md5-hash> suffix. The filter plugin DistroIgnoreFilter (@ConfigFilter
    id config_distro_ignore, storages={config_distro.storage.distro}, weight 10000) applies via the config_distro_filter
    bridge. UI: configure route config_distro_ignore.settings at /admin/config/development/configuration/distro/ignore,
    plus config_distro_ignore.add_item; both use the parent''s ''synchronize distro configuration'' permission.
    Depends on config_distro + config_distro_filter; ships config schema; no Drush or own permissions.
    Medium/hard cases are grounded in the real config_distro_ignore.settings config object; scripts use
    config_distro_eval.* names and restore the shipped-default empty lists.'
questions:
- id: config_distro_ignore-what-and-config
  input: What does the config_distro_ignore submodule do, and in which configuration object are its ignore
    lists stored?
  criteria: It retains (ignores) specific configuration during Config Distro distribution imports, so
    listed items keep their active/site value instead of the distribution's. The lists are stored in config_distro_ignore.settings
    with the sequences all_collections, default_collection and custom_collections.
  bundle: config_distro_ignore
  rubric_ref: rubric/config_distro_ignore_config_distro_ignore_what_and_config@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: config_distro_ignore-filter
  input: How does config_distro_ignore actually keep an ignored config item from being changed on a distribution
    import? Name the filter plugin and describe its effect.
  criteria: It provides the DistroIgnoreFilter Config Filter plugin (@ConfigFilter id config_distro_ignore,
    storages = {config_distro.storage.distro}, weight 10000). For any config name matched by the ignore
    lists, filterRead returns the value from the active storage instead of the distribution's, so the
    site's version is retained. It runs via the config_distro_filter bridge.
  bundle: config_distro_ignore
  rubric_ref: rubric/config_distro_ignore_config_distro_ignore_filter@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: config_distro_ignore-wildcards
  input: In config_distro_ignore's ignore lists, what special syntax can an entry use beyond a plain config
    name?
  criteria: Entries may use shell wildcards (* and ?) to match groups of config names (e.g. views.view.*),
    and an optional ::<md5-hash> suffix so the item is ignored only while its data hashes to that value
    (ignore-until-changed); with no suffix it is ignored unconditionally.
  bundle: config_distro_ignore
  rubric_ref: rubric/config_distro_ignore_config_distro_ignore_wildcards@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: config_distro_ignore-all-list
  input: On this Drupal site, which configuration object is set to be permanently retained (ignored in
    all collections) by config_distro_ignore? Inspect the live settings and give its name.
  criteria: config_distro_ignore.settings has all_collections = ['config_distro_eval.ignored'] (drush
    cget config_distro_ignore.settings all_collections).
  bundle: config_distro_ignore
  rubric_ref: rubric/config_distro_ignore_config_distro_ignore_all_list@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/config_distro_ignore-all-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/config_distro_ignore-all-cleanup.sh
- id: config_distro_ignore-default-list
  input: Inspect config_distro_ignore's live configuration and report which config object is ignored specifically
