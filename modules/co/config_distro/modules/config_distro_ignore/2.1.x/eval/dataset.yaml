  input: On this Drupal site, configure config_distro_ignore so that the configuration object 'config_distro_eval.keepme'
    is permanently retained (ignored in all collections) during distribution imports. Apply the change
    to the live site.
  criteria: Add it to the all_collections list of config_distro_ignore.settings, e.g. $c = \Drupal::configFactory()->getEditable('config_distro_ignore.settings');
