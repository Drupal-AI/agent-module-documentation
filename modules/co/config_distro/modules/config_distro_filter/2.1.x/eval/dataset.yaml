- id: config_distro_filter-bridged
  input: 'On this Drupal site there is a config object ''config_distro_eval.bridgeh'' in active configuration.
    Confirm that the Config Distro distribution storage (built via config_distro_filter''s transform bridge)
    yields the same data for that object as the active storage: read it from both, and if they are identical
    store the string "BRIDGED" into Drupal State key ''config_distro_filter_eval_ok''. Apply it to the
    live site.'
  criteria: $d = \Drupal::service('config_distro.storage.distro')->read('config_distro_eval.bridgeh');
    $a = \Drupal::service('config.storage')->read('config_distro_eval.bridgeh'); if ($d === $a) \Drupal::state()->set('config_distro_filter_eval_ok',
    'BRIDGED'); — with no distribution provider the filtered transform leaves the item equal to active,
    so the stored value is BRIDGED.
  bundle: config_distro_filter
  rubric_ref: rubric/config_distro_filter_config_distro_filter_bridged@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/config_distro_filter-bridged-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/config_distro_filter-bridged-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/config_distro_filter-bridged-verify.sh
