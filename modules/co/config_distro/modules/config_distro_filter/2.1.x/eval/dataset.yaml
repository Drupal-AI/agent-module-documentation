- id: config_distro_filter-transform-names
  input: On this Drupal site, read the Config Distro distribution storage (building it runs the transform
    pipeline that config_distro_filter participates in) and store the full list of configuration object
    names it exposes into Drupal State under the key 'config_distro_filter_eval_names'. Apply it to the
    live site.
  criteria: \Drupal::state()->set('config_distro_filter_eval_names', \Drupal::service('config_distro.storage.distro')->listAll());
    — the stored array must include system.site (the distro storage mirrors active config after the transform
    subscribers, including this bridge, run).
  bundle: config_distro_filter
  rubric_ref: rubric/config_distro_filter_config_distro_filter_transform_names@1.0
