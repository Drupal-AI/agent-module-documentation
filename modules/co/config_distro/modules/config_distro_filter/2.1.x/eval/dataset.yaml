  criteria: 'config_distro_filter''s info declares lifecycle: deprecated (readable via extension.list.module->getExtensionInfo(''config_distro_filter'')[''lifecycle'']).'
  bundle: config_distro_filter
  rubric_ref: rubric/config_distro_filter_config_distro_filter_deprecated_lifecycle@1.0
