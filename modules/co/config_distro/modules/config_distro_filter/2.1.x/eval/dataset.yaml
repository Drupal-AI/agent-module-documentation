metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: config_distro_filter
  version: 2.1.x
  note: 'config_distro_filter is a DEPRECATED (lifecycle: deprecated) submodule of config_distro. It registers
    one event subscriber, ConfigDistroFilterEventSubscriber (service config_distro_filter.event_subscriber),
    on ConfigDistroEvents::TRANSFORM (config_distro.transform). onDistroTransform() gets a filtered storage
    from config_filter''s ConfigFilterStorageFactory::getFilteredStorage($storage, [''config_distro.storage.distro''])
    - i.e. Config Filter plugins bound to the distro storage such as config_distro_ignore - simulates
    the import into a temp MemoryStorage, and writes it back onto the event storage, bridging the Config
    Filter API to Config Distro''s Transform API. Requires config_distro + config_filter; config_distro_ignore
    depends on it. No config, schema, UI, permissions, Drush, or plugin types. Medium cases inspect live
    state: the registered transform listener and the module''s deprecated lifecycle from extension info.
    Hard cases exercise the transform pipeline the bridge participates in (reading config_distro.storage.distro)
    and store results in Drupal State, verified live.'
questions:
- id: config_distro_filter-what-and-deprecated
  input: What is the config_distro_filter submodule for, and what is notable about its maintenance status?
  criteria: 'It is a deprecated backwards-compatibility bridge that lets legacy Config Filter plugins
    participate in Config Distro''s transform pipeline (running them against the distribution storage).
    It is marked lifecycle: deprecated; new integrations should subscribe to config_distro.transform directly.'
  bundle: config_distro_filter
  rubric_ref: rubric/config_distro_filter_config_distro_filter_what_and_deprecated@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: config_distro_filter-event
  input: Which Config Distro event does config_distro_filter subscribe to, and what does its subscriber
    do when that event fires?
  criteria: It subscribes to ConfigDistroEvents::TRANSFORM (config_distro.transform). onDistroTransform()
    gets a filtered storage from config_filter's ConfigFilterStorageFactory for the config_distro.storage.distro
    storage, simulates the filtered import into a temporary MemoryStorage, and writes it back onto the
    event storage.
  bundle: config_distro_filter
  rubric_ref: rubric/config_distro_filter_config_distro_filter_event@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: config_distro_filter-dependencies
  input: Which modules does config_distro_filter depend on, and which other Config Distro submodule relies
    on it?
  criteria: It depends on config_distro and config_filter. config_distro_ignore depends on config_distro_filter,
    because the bridge is what applies config_distro_ignore's Config Filter plugin to the distribution
    storage.
  bundle: config_distro_filter
  rubric_ref: rubric/config_distro_filter_config_distro_filter_dependencies@1.0
  tags:
  - mode:recipe
  - difficulty:easy
