rubrics:
- id: condition_field_condition_field_field_type
  version: '1.0'
  applicable_bundles:
  - condition_field
  checks:
  - kind: must_contain_any
    values:
    - condition_field
  scoring:
    combine: all_pass
- id: condition_field_condition_field_enabled_plugins
  version: '1.0'
  applicable_bundles:
  - condition_field
  checks:
  - kind: must_contain_any
    values:
    - enabled_plugins
  scoring:
    combine: all_pass
- id: condition_field_condition_field_evaluate
  version: '1.0'
  applicable_bundles:
  - condition_field
  checks:
  - kind: must_contain_any
    values:
    - ConditionAccessResolver
    - checkAccess
    - plugin.manager.condition
  scoring:
    combine: all_pass
- id: condition_field_condition_field_known_field
  version: '1.0'
  applicable_bundles:
  - condition_field
  checks:
  - kind: must_contain_any
    values:
    - field_cf_known
  scoring:
    combine: all_pass
- id: condition_field_condition_field_add_field
  version: '1.0'
  applicable_bundles:
  - condition_field
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
