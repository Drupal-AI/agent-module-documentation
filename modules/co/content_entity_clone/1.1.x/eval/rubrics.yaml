rubrics:
- id: content_entity_clone_content_entity_clone_plugin_type
  version: '1.0'
  applicable_bundles:
  - content_entity_clone
  checks:
  - kind: must_contain_any
    values:
    - ContentEntityCloneFieldProcessor
    - field processor
    - FieldProcessor
    - copy_values
    - entity_label_clone_suffix
  scoring:
    combine: all_pass
- id: content_entity_clone_content_entity_clone_enable_where
  version: '1.0'
  applicable_bundles:
  - content_entity_clone
  checks:
  - kind: must_contain_any
    values:
    - content_entity_clone.bundle.settings
    - clone content entities
    - /admin/config/content_entity_clone
  scoring:
    combine: all_pass
- id: content_entity_clone_content_entity_clone_how_copies
  version: '1.0'
  applicable_bundles:
  - content_entity_clone
  checks:
  - kind: must_contain_any
    values:
    - entity_prepare_form
    - content_entity_clone
    - prepare_form
  scoring:
    combine: all_pass
- id: content_entity_clone_content_entity_clone_known_processor
  version: '1.0'
  applicable_bundles:
  - content_entity_clone
  checks:
  - kind: must_contain_any
    values:
    - entity_label_clone_suffix
  scoring:
    combine: all_pass
- id: content_entity_clone_content_entity_clone_known_label
  version: '1.0'
  applicable_bundles:
  - content_entity_clone
  checks:
  - kind: must_contain_any
    values:
    - Duplicate
  scoring:
    combine: all_pass
- id: content_entity_clone_content_entity_clone_enable
  version: '1.0'
  applicable_bundles:
  - content_entity_clone
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
- id: content_entity_clone_content_entity_clone_enable_layman
  version: '1.0'
  applicable_bundles:
  - content_entity_clone
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
