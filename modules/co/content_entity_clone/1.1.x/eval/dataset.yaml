metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: content_entity_clone
  version: 1.1.x
  note: 'Content Entity Clone adds a per-bundle Clone operation to content entities. Cloning is enabled
    per bundle via a config object content_entity_clone.bundle.settings.<entity_type>.<bundle> with enabled(bool),
    local_task_label, and fields.<field>.processor.{id,settings}. It defines a real plugin type: FieldProcessor
    (@ContentEntityCloneFieldProcessor, namespace Plugin/content_entity_clone/FieldProcessor, manager
    plugin.manager.content_entity_clone.field_processor, alter hook content_entity_clone_field_processor_info_alter),
    shipping copy_values, entity_label_clone_suffix (appends '' [CLONE]''), clone_referenced_entities,
    copy_layout. Admin overview content_entity_clone.overview at /admin/config/content_entity_clone. Permissions:
    ''administer entity cloning'', ''clone content entities''. Cloning runs via hook_entity_prepare_form
    reading ?content_entity_clone=<id>. No Drush. Medium/hard are grounded in the real bundle-settings
    config object (node.article / node.page).'
questions:
- id: content_entity_clone-plugin-type
  input: In the content_entity_clone module, how is it decided how each field's value is carried onto
    a clone? Name the plugin type and a couple of the processors it ships.
  criteria: Each field is handled by a FieldProcessor plugin (annotation @ContentEntityCloneFieldProcessor,
    namespace Plugin/content_entity_clone/FieldProcessor). Shipped processors include copy_values, entity_label_clone_suffix
    (appends ' [CLONE]' to the label), clone_referenced_entities, and copy_layout.
  bundle: content_entity_clone
  rubric_ref: rubric/content_entity_clone_content_entity_clone_plugin_type@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: content_entity_clone-enable-where
  input: How do I turn on cloning for a specific content type with content_entity_clone, and which permission
    lets a user actually see the Clone action? What config object stores the per-bundle setting?
  criteria: 'Enable it per bundle on the overview at /admin/config/content_entity_clone (route content_entity_clone.overview,
    needs ''administer entity cloning''); this writes content_entity_clone.bundle.settings.<entity_type>.<bundle>
    with enabled: true. A user needs the ''clone content entities'' permission to see the Clone operation/local
    task.'
  bundle: content_entity_clone
  rubric_ref: rubric/content_entity_clone_content_entity_clone_enable_where@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: content_entity_clone-how-copies
  input: When a user clicks Clone on an entity in content_entity_clone, how does the module actually pre-fill
    the new entity? What hook and request parameter drive it?
  criteria: The Clone link opens the entity creation form with a ?content_entity_clone=<source_id> query.
    hook_entity_prepare_form() (content_entity_clone_entity_prepare_form) loads the source and, for each
    configured field, runs its field processor and copies the values onto the new unsaved entity for the
    user to review and save.
  bundle: content_entity_clone
  rubric_ref: rubric/content_entity_clone_content_entity_clone_how_copies@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: content_entity_clone-known-processor
  input: On this Drupal site, content_entity_clone is enabled for one content type. Inspect the live configuration
    and state which field processor is applied to the 'title' field when cloning an Article.
  criteria: 'The title field uses the entity_label_clone_suffix processor: content_entity_clone.bundle.settings.node.article
    -> fields.title.processor.id = entity_label_clone_suffix (which appends '' [CLONE]'' to the cloned
    title).'
  bundle: content_entity_clone
  rubric_ref: rubric/content_entity_clone_content_entity_clone_known_processor@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/content_entity_clone-known-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/content_entity_clone-known-cleanup.sh
- id: content_entity_clone-known-label
  input: Inspect the content_entity_clone configuration for the Article content type on this site and
    state the clone link label (local_task_label) that has been configured.
  criteria: 'The clone link label is ''Duplicate'': content_entity_clone.bundle.settings.node.article
    -> local_task_label = Duplicate.'
  bundle: content_entity_clone
  rubric_ref: rubric/content_entity_clone_content_entity_clone_known_label@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/content_entity_clone-known-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/content_entity_clone-known-cleanup.sh
- id: content_entity_clone-enable
  input: On this Drupal site, use the content_entity_clone module to enable cloning for the Basic page
    content type (node bundle 'page'). Apply the change to the live configuration so that the Clone action
    becomes available for Basic page entities.
  criteria: 'The config object content_entity_clone.bundle.settings.node.page exists with enabled: true
    (e.g. set enabled TRUE plus a fields map and save, or enable it on the bundle settings form at /admin/config/content_entity_clone/field_settings/node/page).'
  bundle: content_entity_clone
  rubric_ref: rubric/content_entity_clone_content_entity_clone_enable@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/content_entity_clone-enable-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/content_entity_clone-enable-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/content_entity_clone-enable-verify.sh
- id: content_entity_clone-enable-layman
  input: I'd like a 'Clone' button on my Basic pages so my team can duplicate an existing page and edit
    the copy instead of starting from scratch. Please turn that on for Basic pages on the live site.
  criteria: 'Enable cloning for the node ''page'' bundle: content_entity_clone.bundle.settings.node.page
    with enabled: true, so the Clone operation/local task appears for Basic page entities.'
  bundle: content_entity_clone
  rubric_ref: rubric/content_entity_clone_content_entity_clone_enable_layman@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: site-owner
    reset: agent-module-documentation/evaluation/verify/content_entity_clone-enable-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/content_entity_clone-enable-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/content_entity_clone-enable-verify.sh
