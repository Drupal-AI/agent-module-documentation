rubrics:
- id: commerce_cart_redirection_commerce_cart_redirection_target_key
  version: '1.0'
  applicable_bundles:
  - commerce_cart_redirection
  checks:
  - kind: must_contain_any
    values:
    - redirection_route_path
    - commerce_cart_redirection.settings
  scoring:
    combine: all_pass
- id: commerce_cart_redirection_commerce_cart_redirection_which_bundles
  version: '1.0'
  applicable_bundles:
  - commerce_cart_redirection
  checks:
  - kind: must_contain_any
    values:
    - product_bundles
    - variation
    - negate_product_bundles
  scoring:
    combine: all_pass
- id: commerce_cart_redirection_commerce_cart_redirection_clear_cart
  version: '1.0'
  applicable_bundles:
  - commerce_cart_redirection
  checks:
  - kind: must_contain_any
    values:
    - clear_cart_before_add
    - Clear cart before add
  scoring:
    combine: all_pass
- id: commerce_cart_redirection_commerce_cart_redirection_known_target
  version: '1.0'
  applicable_bundles:
  - commerce_cart_redirection
  checks:
  - kind: must_contain_any
    values:
    - /ccr-thank-you
  scoring:
    combine: all_pass
- id: commerce_cart_redirection_commerce_cart_redirection_known_button
  version: '1.0'
  applicable_bundles:
  - commerce_cart_redirection
  checks:
  - kind: must_contain_any
    values:
    - Buy ticket now
  scoring:
    combine: all_pass
- id: commerce_cart_redirection_commerce_cart_redirection_redirect_to_cart
  version: '1.0'
  applicable_bundles:
  - commerce_cart_redirection
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
- id: commerce_cart_redirection_commerce_cart_redirection_clear_cart_live
  version: '1.0'
  applicable_bundles:
  - commerce_cart_redirection
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
