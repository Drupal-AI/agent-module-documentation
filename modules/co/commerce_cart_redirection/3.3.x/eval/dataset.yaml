metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: commerce_cart_redirection
  version: 3.3.x
  note: Commerce Cart Redirection has a single config object commerce_cart_redirection.settings (no config/install
    default, no schema; keys read with ?? fallbacks), one settings form at /admin/commerce/config/commerce_cart_redirection
    (permission 'configure commerce_cart_redirection'), and one event subscriber that redirects after
    CartEvents::CART_ENTITY_ADD. Matching is on commerce_product_variation bundles via product_bundles
    + negate_product_bundles. The site has commerce fully enabled with a 'default' product variation bundle.
    All medium/hard cases are grounded in that real config object; baseline is 'config object absent',
    so cleanup/reset delete it.
questions:
- id: commerce_cart_redirection-target-key
  input: In the Drupal Commerce Cart Redirection module, which config object and which key control where
    a shopper is sent after they add a product to the cart, and what are the possible target values?
  criteria: The config object commerce_cart_redirection.settings, key redirection_route_path, accepts
    'checkout' (default), 'cart', or 'other' (with redirection_route_path_other holding the custom URL).
  bundle: commerce_cart_redirection
  rubric_ref: rubric/commerce_cart_redirection_commerce_cart_redirection_target_key@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: commerce_cart_redirection-which-bundles
  input: Using Commerce Cart Redirection, how do I make the redirect apply only to certain products, and
    what does the 'Negate the bundles condition' option do? What entity's bundles are matched?
  criteria: You select commerce_product_variation bundles in product_bundles; only those redirect. negate_product_bundles
    inverts it so every bundle EXCEPT the selected ones redirects (selecting all and negating redirects
    nothing).
  bundle: commerce_cart_redirection
  rubric_ref: rubric/commerce_cart_redirection_commerce_cart_redirection_which_bundles@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: commerce_cart_redirection-clear-cart
  input: With Commerce Cart Redirection, how can I make the cart contain only the item just added (a single-item
    cart) before the shopper is redirected?
  criteria: Enable the 'Clear cart before add' advanced option (config key clear_cart_before_add = true);
    the subscriber deletes all other order items and keeps only the current one before redirecting.
  bundle: commerce_cart_redirection
  rubric_ref: rubric/commerce_cart_redirection_commerce_cart_redirection_clear_cart@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: commerce_cart_redirection-known-target
  input: On this Drupal Commerce site, Commerce Cart Redirection is already configured to send shoppers
    somewhere custom after they add a product. Inspect the live configuration and state the exact URL
    they are redirected to.
  criteria: commerce_cart_redirection.settings has redirection_route_path='other' and redirection_route_path_other='/ccr-thank-you',
    so shoppers are redirected to /ccr-thank-you.
  bundle: commerce_cart_redirection
  rubric_ref: rubric/commerce_cart_redirection_commerce_cart_redirection_known_target@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/commerce_cart_redirection-known-target-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/commerce_cart_redirection-known-target-cleanup.sh
- id: commerce_cart_redirection-known-button
  input: This site uses Commerce Cart Redirection and has customized the add-to-cart button label for
    redirected product variations. Inspect the live configuration and give the exact replacement button
    text.
  criteria: commerce_cart_redirection.settings key add_to_cart_replacement_text is 'Buy ticket now'.
  bundle: commerce_cart_redirection
  rubric_ref: rubric/commerce_cart_redirection_commerce_cart_redirection_known_button@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/commerce_cart_redirection-known-button-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/commerce_cart_redirection-known-button-cleanup.sh
- id: commerce_cart_redirection-redirect-to-cart
  input: On this Drupal Commerce site, configure the Commerce Cart Redirection module so that adding a
    product of the 'default' product variation bundle to the cart redirects the shopper to the cart page
    (not checkout). Apply the change to the live site.
  criteria: commerce_cart_redirection.settings has redirection_route_path='cart', product_bundles.default
    selected (truthy), and negate_product_bundles false. e.g. drush cset commerce_cart_redirection.settings
    redirection_route_path cart; set product_bundles.default default.
  bundle: commerce_cart_redirection
  rubric_ref: rubric/commerce_cart_redirection_commerce_cart_redirection_redirect_to_cart@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/commerce_cart_redirection-redirect-to-cart-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/commerce_cart_redirection-redirect-to-cart-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/commerce_cart_redirection-redirect-to-cart-verify.sh
- id: commerce_cart_redirection-clear-cart-live
  input: Commerce Cart Redirection is set up on this site to redirect the 'default' variation bundle to
    checkout. Change its configuration so that the cart is emptied of all other items before the new item
    is added (a single-item cart), and apply the change live.
  criteria: commerce_cart_redirection.settings key clear_cart_before_add is set to TRUE (e.g. drush cset
    commerce_cart_redirection.settings clear_cart_before_add 1).
  bundle: commerce_cart_redirection
  rubric_ref: rubric/commerce_cart_redirection_commerce_cart_redirection_clear_cart_live@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/commerce_cart_redirection-clear-cart-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/commerce_cart_redirection-clear-cart-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/commerce_cart_redirection-clear-cart-verify.sh
