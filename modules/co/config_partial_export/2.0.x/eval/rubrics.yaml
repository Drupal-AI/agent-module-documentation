rubrics:
- id: config_partial_export_config_partial_export_drush_command
  version: '1.0'
  applicable_bundles:
  - config_partial_export
  checks:
  - kind: must_contain_any
    values:
    - config-partial-export
    - cpex
  scoring:
    combine: all_pass
- id: config_partial_export_config_partial_export_wildcard
  version: '1.0'
  applicable_bundles:
  - config_partial_export
  checks:
  - kind: must_contain_any
    values:
    - '*'
    - wildcard
    - webform.webform.*
    - --changelist
    - changelist
  scoring:
    combine: all_pass
- id: config_partial_export_config_partial_export_ui_access
  version: '1.0'
  applicable_bundles:
  - config_partial_export
  checks:
  - kind: must_contain_any
    values:
    - export configuration
    - configuration synchronization
    - single/config-partial-export
    - Partial Export
    - development/configuration
  scoring:
    combine: all_pass
- id: config_partial_export_config_partial_export_exported_name
  version: '1.0'
  applicable_bundles:
  - config_partial_export
  checks:
  - kind: must_contain_any
    values:
    - config_partial_export.cpex_intro
  scoring:
    combine: all_pass
- id: config_partial_export_config_partial_export_exported_value
  version: '1.0'
  applicable_bundles:
  - config_partial_export
  checks:
  - kind: must_contain_any
    values:
    - '42'
  scoring:
    combine: all_pass
- id: config_partial_export_config_partial_export_export_single
  version: '1.0'
  applicable_bundles:
  - config_partial_export
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
- id: config_partial_export_config_partial_export_export_wildcard
  version: '1.0'
  applicable_bundles:
  - config_partial_export
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
