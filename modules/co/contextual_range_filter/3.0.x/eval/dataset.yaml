metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: contextual_range_filter
  version: 3.0.x
  note: 'Views Contextual Range Filter turns a Views contextual filter (argument) into a range filter
    driven by the URL using -- (or :) as the from--to separator (inclusive). It provides argument plugins
    numeric_range/string_range/date_range, a numeric_range argument validator, and a php_default argument-default
    plugin. Filters are converted on /admin/config/content/contextual-range-filter (route contextual_range_filter.settings,
    perm ''administer contextual range filters''); doing so records the machine name (table:field) in
    contextual_range_filter.settings under numeric_field_names / string_field_names / date_field_names
    AND rewrites the View''s argument plugin_id to the *_range variant. Its own recorded state is that
    settings config object, which the medium/hard cases are grounded in (Views-entity building is avoided
    because an unrelated broken contrib module fatals the Views plugin managers on this shared site).
    Permissions: ''administer contextual range filters'' and the restricted ''use php code for default
    contextual filter''.'
questions:
- id: contextual_range_filter-url-syntax
  input: Using the Views Contextual Range Filter module, how do I write a URL argument that filters a
    View to items with a price between 100 and 199.99, and how do I make an open-ended 'from 100 upwards'
    range?
  criteria: 'Append the range as a contextual argument using -- (or :) as the separator: /yourview/100--199.99
    for the closed range, /yourview/100-- for 100 and up, and /yourview/--199.99 for up to 199.99. All
    ranges are inclusive.'
  bundle: contextual_range_filter
  rubric_ref: rubric/contextual_range_filter_contextual_range_filter_url_syntax@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: contextual_range_filter-plugin-ids
  input: Which Views argument (contextual filter) plugins does the Views Contextual Range Filter module
    provide for numeric, alphabetic and date ranges?
  criteria: 'It provides three argument handler plugins: numeric_range (extends NumericArgument), string_range
    (extends StringArgument, case-insensitive) and date_range (extends Date). It also adds a numeric_range
    argument validator and a php_default argument-default plugin.'
  bundle: contextual_range_filter
  rubric_ref: rubric/contextual_range_filter_contextual_range_filter_plugin_ids@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: contextual_range_filter-how-to-convert
  input: There is no checkbox in the Views UI to make a contextual filter a range filter. How do I convert
    an existing contextual filter into a contextual range filter, and where does the module record that
    choice?
  criteria: Add the plain contextual filter in Views first, then go to /admin/config/content/contextual-range-filter
    (route contextual_range_filter.settings) and tick it. That records the machine name in contextual_range_filter.settings
    (numeric_field_names / string_field_names / date_field_names) and rewrites the View's argument plugin_id
    to the *_range variant.
  bundle: contextual_range_filter
  rubric_ref: rubric/contextual_range_filter_contextual_range_filter_how_to_convert@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: contextual_range_filter-known-numeric
  input: On this Drupal site, one field has been converted into a NUMERIC contextual range filter with
    the Views Contextual Range Filter module. Inspect the live contextual_range_filter configuration and
    give the field that was converted.
  criteria: 'It is node__field_crf_probe:field_crf_probe_value (i.e. field_crf_probe): contextual_range_filter.settings
    numeric_field_names lists it (drush cget contextual_range_filter.settings numeric_field_names).'
  bundle: contextual_range_filter
  rubric_ref: rubric/contextual_range_filter_contextual_range_filter_known_numeric@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/contextual_range_filter-known-numeric-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/contextual_range_filter-known-numeric-cleanup.sh
