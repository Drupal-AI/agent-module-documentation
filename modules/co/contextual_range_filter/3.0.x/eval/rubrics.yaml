    combine: all_pass
- id: contextual_range_filter_contextual_range_filter_unregister_numeric
  version: '1.0'
  applicable_bundles:
  - contextual_range_filter
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
