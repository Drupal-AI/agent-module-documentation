rubrics:
- id: contextual_range_filter_contextual_range_filter_url_syntax
  version: '1.0'
  applicable_bundles:
  - contextual_range_filter
  checks:
  - kind: must_contain_any
    values:
    - 100--199
    - 100--
    - --
  scoring:
    combine: all_pass
- id: contextual_range_filter_contextual_range_filter_plugin_ids
  version: '1.0'
  applicable_bundles:
  - contextual_range_filter
  checks:
  - kind: must_contain_any
    values:
    - numeric_range
    - string_range
    - date_range
  scoring:
    combine: all_pass
- id: contextual_range_filter_contextual_range_filter_how_to_convert
  version: '1.0'
  applicable_bundles:
  - contextual_range_filter
  checks:
  - kind: must_contain_any
    values:
    - /admin/config/content/contextual-range-filter
    - contextual_range_filter.settings
    - numeric_field_names
  scoring:
    combine: all_pass
- id: contextual_range_filter_contextual_range_filter_known_numeric
  version: '1.0'
  applicable_bundles:
  - contextual_range_filter
  checks:
  - kind: must_contain_any
    values:
    - field_crf_probe
  scoring:
    combine: all_pass
- id: contextual_range_filter_contextual_range_filter_known_string
  version: '1.0'
  applicable_bundles:
  - contextual_range_filter
  checks:
