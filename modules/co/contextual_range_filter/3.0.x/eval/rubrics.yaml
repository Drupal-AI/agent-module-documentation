  scoring:
    combine: all_pass
- id: contextual_range_filter_contextual_range_filter_register_numeric
  version: '1.0'
  applicable_bundles:
  - contextual_range_filter
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
