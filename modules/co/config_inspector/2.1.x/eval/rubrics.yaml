rubrics:
- id: config_inspector_config_inspector_drush_command
  version: '1.0'
  applicable_bundles:
  - config_inspector
  checks:
  - kind: must_contain_any
    values:
    - config:inspect
    - inspect_config
  scoring:
    combine: all_pass
- id: config_inspector_config_inspector_report_location
  version: '1.0'
  applicable_bundles:
  - config_inspector
  checks:
  - kind: must_contain_any
    values:
    - /admin/reports/config-inspector
    - config_inspector.overview
    - inspect configuration
  scoring:
    combine: all_pass
- id: config_inspector_config_inspector_validatability
  version: '1.0'
  applicable_bundles:
  - config_inspector
  checks:
  - kind: must_contain_any
    values:
    - validatab
    - constraint
    - PrimitiveType
  scoring:
    combine: all_pass
- id: config_inspector_config_inspector_noschema_status
  version: '1.0'
  applicable_bundles:
  - config_inspector
  checks:
  - kind: must_contain_any
    values:
    - No schema
    - no schema
  scoring:
    combine: all_pass
- id: config_inspector_config_inspector_read_marker
  version: '1.0'
  applicable_bundles:
  - config_inspector
  checks:
  - kind: must_contain_any
    values:
    - CI_MED_SENTINEL
  scoring:
    combine: all_pass
- id: config_inspector_config_inspector_generate_baseline
  version: '1.0'
  applicable_bundles:
  - config_inspector
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
- id: config_inspector_config_inspector_statistics_export
  version: '1.0'
  applicable_bundles:
  - config_inspector
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
