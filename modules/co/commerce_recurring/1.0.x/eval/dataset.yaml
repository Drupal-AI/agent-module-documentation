metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: commerce_recurring
  version: 1.0.x
  note: 'Commerce Recurring adds subscriptions and recurring billing to Drupal Commerce. Central config
    is the commerce_billing_schedule config entity (config prefix commerce_recurring.commerce_billing_schedule.<id>)
    with fields: billingType (prepaid|postpaid), plugin (fixed|rolling), configuration (interval {number,unit
    in day/week/month/year}, trial_interval, and for fixed start_month/start_day), prorater (proportional|full_price),
    proraterConfiguration, retrySchedule (dunning days, default [1,3,5]), unpaidSubscriptionState (default
    canceled), combineSubscriptions. Subscriptions are commerce_subscription content entities with bundle
    = subscription type plugin (product_variation|standalone), driven by the subscription_default state_machine
    workflow (pending->trial->active->expired/canceled). Renewals run via commerce_recurring_cron() into
    the commerce_recurring Advanced Queue (jobs recurring_order_close, recurring_order_renew, subscription_activate);
    there are no Drush commands. All eval cases are grounded in the billing-schedule config entity (created/read/verified
    with drush) so nothing requires a live payment gateway.'
questions:
- id: commerce_recurring-fixed-vs-rolling
  input: In Commerce Recurring's billing schedules there are two schedule plugins. What are they called
    and what is the difference between them?
  criteria: The two billing schedule plugins are 'fixed' and 'rolling'. Fixed aligns billing to a calendar
    anchor (e.g. always the 1st of the month, via start_month/start_day), while rolling counts the interval
    from each subscription's own start date.
  bundle: commerce_recurring
  rubric_ref: rubric/commerce_recurring_commerce_recurring_fixed_vs_rolling@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: commerce_recurring-billing-type
  input: A Commerce Recurring billing schedule has a 'billing type' setting. What are the two possible
    values and what do they mean?
  criteria: billingType is either 'prepaid' (default; charge in advance for the upcoming period) or 'postpaid'
    (charge after the elapsed period).
  bundle: commerce_recurring
  rubric_ref: rubric/commerce_recurring_commerce_recurring_billing_type@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: commerce_recurring-how-renewals-run
  input: In Commerce Recurring, what actually triggers recurring orders to be created and renewed on schedule?
    Is there a Drush command for it?
  criteria: commerce_recurring_cron() enqueues jobs into the 'commerce_recurring' Advanced Queue (recurring_order_close,
    recurring_order_renew, subscription_activate) which run on cron. There are no Drush commands; renewals
    depend on cron and the advancedqueue processor.
  bundle: commerce_recurring
  rubric_ref: rubric/commerce_recurring_commerce_recurring_how_renewals_run@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: commerce_recurring-known-billing-type
  input: This Drupal Commerce site has a billing schedule with the machine id 'cr_known'. Inspect the
    live configuration and state its billing type (prepaid or postpaid) and which schedule plugin (fixed
    or rolling) it uses.
  criteria: cr_known uses billingType 'postpaid' and the 'fixed' schedule plugin (config commerce_recurring.commerce_billing_schedule.cr_known).
  bundle: commerce_recurring
  rubric_ref: rubric/commerce_recurring_commerce_recurring_known_billing_type@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/commerce_recurring-known-schedule-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/commerce_recurring-known-schedule-cleanup.sh
- id: commerce_recurring-known-unpaid-state
  input: This site has a Commerce Recurring billing schedule with the machine id 'cr_dunning'. Inspect
    the live configuration and state which subscription state a subscription is moved to once its payment
    retries are exhausted (the unpaid subscription state).
  criteria: cr_dunning has unpaidSubscriptionState = 'expired' (and a retrySchedule of [2, 4, 6]); when
    retries are exhausted the subscription is expired rather than the default 'canceled'.
  bundle: commerce_recurring
  rubric_ref: rubric/commerce_recurring_commerce_recurring_known_unpaid_state@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/commerce_recurring-dunning-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/commerce_recurring-dunning-cleanup.sh
- id: commerce_recurring-create-rolling
  input: On this Drupal Commerce site, use Commerce Recurring to create a billing schedule with the machine
    id 'cr_task' that bills every 1 month on a rolling interval (counted from each subscription's start
    date) and charges prepaid. Save it to the live site.
  criteria: A commerce_billing_schedule config entity id=cr_task with plugin=rolling, configuration.interval
    = {number:1, unit:month}, billingType=prepaid (e.g. BillingSchedule::create([... 'plugin'=>'rolling',
    'configuration'=>['interval'=>['number'=>1,'unit'=>'month'],'trial_interval'=>[]], 'billingType'=>'prepaid',
    'prorater'=>'proportional'])->save()).
  bundle: commerce_recurring
  rubric_ref: rubric/commerce_recurring_commerce_recurring_create_rolling@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/commerce_recurring-create-rolling-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/commerce_recurring-create-rolling-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/commerce_recurring-create-rolling-verify.sh
- id: commerce_recurring-create-trial
  input: I sell a monthly membership and want new customers to get a 14-day free trial before their first
    charge. Using the Commerce Recurring module, create a billing schedule with the machine id 'cr_trial'
    for a monthly subscription that includes a 14-day trial period, and save it on the live site.
  criteria: A commerce_billing_schedule config entity id=cr_trial whose plugin configuration has a non-empty
    trial_interval of {number:14, unit:day} on a monthly interval (e.g. configuration.interval={number:1,unit:month},
    configuration.trial_interval={number:14,unit:day}); a non-empty trial_interval makes allowTrials()
    true so subscriptions start in the trial state.
  bundle: commerce_recurring
  rubric_ref: rubric/commerce_recurring_commerce_recurring_create_trial@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: site-owner
    reset: agent-module-documentation/evaluation/verify/commerce_recurring-create-trial-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/commerce_recurring-create-trial-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/commerce_recurring-create-trial-verify.sh
