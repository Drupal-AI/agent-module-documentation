rubrics:
- id: commerce_recurring_commerce_recurring_fixed_vs_rolling
  version: '1.0'
  applicable_bundles:
  - commerce_recurring
  checks:
  - kind: must_contain_any
    values:
    - fixed
    - rolling
  scoring:
    combine: all_pass
- id: commerce_recurring_commerce_recurring_billing_type
  version: '1.0'
  applicable_bundles:
  - commerce_recurring
  checks:
  - kind: must_contain_any
    values:
    - prepaid
    - postpaid
  scoring:
    combine: all_pass
- id: commerce_recurring_commerce_recurring_how_renewals_run
  version: '1.0'
  applicable_bundles:
  - commerce_recurring
  checks:
  - kind: must_contain_any
    values:
    - cron
    - advancedqueue
    - Advanced Queue
    - queue
  scoring:
    combine: all_pass
- id: commerce_recurring_commerce_recurring_known_billing_type
  version: '1.0'
  applicable_bundles:
  - commerce_recurring
  checks:
  - kind: must_contain_any
    values:
    - postpaid
  scoring:
    combine: all_pass
- id: commerce_recurring_commerce_recurring_known_unpaid_state
  version: '1.0'
  applicable_bundles:
  - commerce_recurring
  checks:
  - kind: must_contain_any
    values:
    - expired
  scoring:
    combine: all_pass
- id: commerce_recurring_commerce_recurring_create_rolling
  version: '1.0'
  applicable_bundles:
  - commerce_recurring
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
- id: commerce_recurring_commerce_recurring_create_trial
  version: '1.0'
  applicable_bundles:
  - commerce_recurring
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
