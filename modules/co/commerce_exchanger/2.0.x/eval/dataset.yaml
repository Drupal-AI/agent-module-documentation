    verify: agent-module-documentation/evaluation/verify/commerce_exchanger-manual-source-verify.sh
- id: commerce_exchanger-create-ecb-source
  input: My Drupal shop needs daily euro-based currency rates from the European Central Bank. Using the
    Commerce Exchanger module, set up an exchange-rate source that pulls from the ECB. Give it the machine
    name ce_manual_task. Save it on the live site.
  criteria: A commerce_exchange_rates config entity ce_manual_task exists using the 'ecb' provider plugin
    (European Central Bank). The ecb provider is base EUR and refresh_once.
  bundle: commerce_exchanger
  rubric_ref: rubric/commerce_exchanger_commerce_exchanger_create_ecb_source@1.0
