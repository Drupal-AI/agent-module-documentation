rubrics:
- id: comment_notify_comment_notify_where_configured
  version: '1.0'
  applicable_bundles:
  - comment_notify
  checks:
  - kind: must_contain_any
    values:
    - comment_notify.settings
    - bundle_types
    - /admin/config/people/comment_notify
  scoring:
    combine: all_pass
- id: comment_notify_comment_notify_subscription_modes
  version: '1.0'
  applicable_bundles:
  - comment_notify
  checks:
  - kind: must_contain_any
    values:
    - available_alerts
    - All comments
    - Replies to my comment
    - COMMENT_NOTIFY_ENTITY
    - COMMENT_NOTIFY_COMMENT
  scoring:
    combine: all_pass
- id: comment_notify_comment_notify_storage
  version: '1.0'
  applicable_bundles:
  - comment_notify
  checks:
  - kind: must_contain_any
    values:
    - comment_notify
    - user.data
    - table
    - hash
    - unsubscribe
  scoring:
    combine: all_pass
- id: comment_notify_comment_notify_default_author_subscribe
  version: '1.0'
  applicable_bundles:
  - comment_notify
  checks:
  - kind: must_contain_any
    values:
    - entity_author
  scoring:
    combine: all_pass
- id: comment_notify_comment_notify_enabled_bundles
  version: '1.0'
  applicable_bundles:
  - comment_notify
  checks:
  - kind: must_contain_any
    values:
    - node--page--comment
  scoring:
    combine: all_pass
- id: comment_notify_comment_notify_enable_page_bundle
  version: '1.0'
  applicable_bundles:
  - comment_notify
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
- id: comment_notify_comment_notify_author_default_on
  version: '1.0'
  applicable_bundles:
  - comment_notify
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
