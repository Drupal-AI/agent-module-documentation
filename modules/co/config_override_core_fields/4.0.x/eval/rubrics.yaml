rubrics:
- id: config_override_core_fields_config_override_core_fields_purpose
  version: '1.0'
  applicable_bundles:
  - config_override_core_fields
  checks:
  - kind: must_contain_any
    values:
    - '#config'
    - config.object:key
    - form_alter
    - config_data_store
  scoring:
    combine: all_pass
- id: config_override_core_fields_config_override_core_fields_site_name_key
  version: '1.0'
  applicable_bundles:
  - config_override_core_fields
  checks:
  - kind: must_contain_any
    values:
    - system.site:name
  scoring:
    combine: all_pass
- id: config_override_core_fields_config_override_core_fields_logging_map
  version: '1.0'
  applicable_bundles:
  - config_override_core_fields
  checks:
  - kind: must_contain_any
    values:
    - dblog.settings:row_limit
  scoring:
    combine: all_pass
- id: config_override_core_fields_config_override_core_fields_cron_map
  version: '1.0'
  applicable_bundles:
  - config_override_core_fields
  checks:
  - kind: must_contain_any
    values:
    - automated_cron.settings:interval
  scoring:
    combine: all_pass
- id: config_override_core_fields_config_override_core_fields_write_slogan
  version: '1.0'
  applicable_bundles:
  - config_override_core_fields
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
- id: config_override_core_fields_config_override_core_fields_write_403
  version: '1.0'
  applicable_bundles:
  - config_override_core_fields
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
