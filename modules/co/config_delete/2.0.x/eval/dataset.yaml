    Inspect the live configuration and report the value of its 'marker' key.
  criteria: config_delete_known.settings has marker = 'CD_EVAL_MARKER_42' (read it with drush cget config_delete_known.settings).
  bundle: config_delete
  rubric_ref: rubric/config_delete_cd_known_config@1.0
  tags:
