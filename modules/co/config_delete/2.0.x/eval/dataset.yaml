metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: config_delete
  version: 2.0.x
  note: 'Config Delete adds one UI form (route config_delete.delete, /admin/config/development/configuration/delete,
    a Delete tab under Configuration synchronization) to delete a single configuration object - simple
    config or a config entity - optionally cascading to the object''s declared config dependencies. Permission
    ''delete configuration'' (restrict access: true). The form extends core ConfigSingleExportForm and
    deletes via \Drupal::configFactory()->getEditable($name)->delete(); with ''Delete config dependencies''
    ticked it first deletes each name in the object''s dependencies.config. The module has no config of
    its own and no drush command, so introspection cases are grounded in the config an admin would need
    to find/inspect before deleting (a marker value, a declared dependency), and execution cases exercise
    the module''s core behavior: deleting a config object, and deleting a config object together with
    its dependency, verified against live config. All fixtures are namespaced config_delete_*.settings
    simple config objects.'
questions:
- id: cd-path
  input: What does the Drupal config_delete module let an administrator do, and at what admin path?
  criteria: It lets you delete a single configuration object (simple config or config entity) from the
    UI, at /admin/config/development/configuration/delete (a Delete tab under Configuration synchronization).
  bundle: config_delete
  rubric_ref: rubric/config_delete_cd_path@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: cd-permission
  input: Which permission gates the config_delete delete form, and is it a sensitive permission?
  criteria: 'The ''delete configuration'' permission gates the form; it is defined with restrict access:
    true, so it is a sensitive/trusted-admin permission.'
  bundle: config_delete
  rubric_ref: rubric/config_delete_cd_permission@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: cd-dependencies
  input: The config_delete delete form has a 'Delete config dependencies' checkbox. What does ticking
    it do when you delete a configuration item?
  criteria: It also deletes each configuration object listed in the target object's dependencies.config
    (its declared config dependencies), in addition to the object itself.
  bundle: config_delete
  rubric_ref: rubric/config_delete_cd_dependencies@1.0
  tags:
  - mode:recipe
  - difficulty:easy
