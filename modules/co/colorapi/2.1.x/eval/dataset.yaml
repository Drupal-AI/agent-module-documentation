metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: colorapi
  version: 2.1.x
  note: 'Color API is configured via colorapi.settings with two switches: enable_color_field (default
    true) and enable_color_entity (default false), at /admin/config/color/settings (route colorapi.admin_config,
    permission ''administer colors''). It provides the colorapi_color_field field type (columns name varchar255
    + color varchar7; formatters colorapi_color_display[default]/colorapi_text_display/colorapi_raw_hex_display/colorapi_raw_rgb_display;
    widget colorapi_color_widget), the colorapi.service (hexToRgb, isValidHexadecimalColorString, regex
    /^#([A-Fa-f0-9]{6}|[A-Fa-f0-9]{3})$/), Typed Data types colorapi_color/hexadecimal_color/rgb_color,
    and (when enabled) a colorapi_color config entity (config name colorapi.colorapi_color.<id>, keys
    id/label/color). Medium/hard cases are grounded in that live config: reading enable_color_entity,
    finding a colorapi_color_field field, creating a Color field, and creating a named Color entity. Site
    artifacts are namespaced field_cai_* and cai_* ids; scripts restore baseline (enable_color_entity=false,
    no cai_* config/fields).'
questions:
- id: colorapi-settings-switches
  input: The colorapi (Color API) module is enabled on a Drupal 11 site. What are its two configuration
    switches, what do they turn on, and where is the settings page?
  criteria: colorapi.settings has enable_color_field (default true; enables the colorapi_color_field field
    type) and enable_color_entity (default false; enables the colorapi_color config entity). Configure
    at /admin/config/color/settings (permission 'administer colors').
  bundle: colorapi
  rubric_ref: rubric/colorapi_colorapi_settings_switches@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: colorapi-field-formatters
  input: With Color API, what is the machine name of the color field type it provides, and which display
    formatters can I use to render it?
  criteria: 'Field type colorapi_color_field. Formatters: colorapi_color_display (colored block, default),
    colorapi_text_display, colorapi_raw_hex_display, colorapi_raw_rgb_display (with display_name / show_hash
    settings).'
  bundle: colorapi
  rubric_ref: rubric/colorapi_colorapi_field_formatters@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: colorapi-service-hextorgb
  input: 'How can I convert a hexadecimal color like #3366cc into its red/green/blue components using
    Color API''s service, and how does it validate that a string is a hex color?'
  criteria: Call \Drupal::service('colorapi.service')->hexToRgb($hex, 'red'|'green'|'blue') for each component;
    isValidHexadecimalColorString() validates against /^#([A-Fa-f0-9]{6}|[A-Fa-f0-9]{3})$/.
  bundle: colorapi
  rubric_ref: rubric/colorapi_colorapi_service_hextorgb@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: colorapi-entity-enabled-known
  input: On this Drupal site, inspect the Color API configuration and state whether the optional Color
    configuration entity type is enabled, and which colorapi.settings key controls that.
  criteria: 'The Color entity is enabled: colorapi.settings.enable_color_entity is true (1) — the switch
    that registers the colorapi_color config entity type.'
  bundle: colorapi
  rubric_ref: rubric/colorapi_colorapi_entity_enabled_known@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/colorapi-entity-enabled-known-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/colorapi-entity-enabled-known-cleanup.sh
- id: colorapi-known-color-field
  input: The Article content type on this site has a Color API color field attached. Inspect the live
    field configuration and give the machine name of the field whose type is colorapi_color_field.
  criteria: 'The field is field_cai_swatch: its field storage type is colorapi_color_field on node.article.'
  bundle: colorapi
  rubric_ref: rubric/colorapi_colorapi_known_color_field@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/colorapi-known-color-field-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/colorapi-known-color-field-cleanup.sh
- id: colorapi-add-color-field
  input: On this Drupal site, add a Color API color field named field_cai_color (type colorapi_color_field)
    to the Article content type. Apply the change to the live site.
  criteria: A field storage node.field_cai_color of type colorapi_color_field exists and is attached to
    the Article bundle (field.field.node.article.field_cai_color).
  bundle: colorapi
  rubric_ref: rubric/colorapi_colorapi_add_color_field@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/colorapi-add-color-field-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/colorapi-add-color-field-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/colorapi-add-color-field-verify.sh
- id: colorapi-create-color-entity
  input: 'On this Drupal site, use Color API to create a reusable named Color: enable the Color configuration
    entity type if needed, then create a Color entity with id cai_red, label ''CAI Red'' and color #FF0000.
    Apply it to the live site.'
  criteria: Config colorapi.colorapi_color.cai_red exists with color '#FF0000' (label 'CAI Red'). This
    requires enable_color_entity=true so the colorapi_color entity type is registered, then Color::create(['id'=>'cai_red','label'=>'CAI
    Red','color'=>'#FF0000'])->save().
  bundle: colorapi
  rubric_ref: rubric/colorapi_colorapi_create_color_entity@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/colorapi-create-color-entity-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/colorapi-create-color-entity-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/colorapi-create-color-entity-verify.sh
