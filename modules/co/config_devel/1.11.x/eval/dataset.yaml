# Generated from evals.json by evaluation/to_commons.py.
# Edit evals.json and rerun the script; do not edit this file.
metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: config_devel
  version: 1.11.x
  note: 'Config Devel is a developer config tool. Its persistent state is the config_devel.settings object
    with two sequences: auto_import (list of {filename, hash}, paths relative to Drupal root) and auto_export
    (list of config object names). Baseline: both empty. It ships Drush commands config:devel-export (cde),
    config:devel-import (cdi), config:devel-import-one (cdi1); export/import operate on a module''s config_devel:
    info.yml section (install/optional lists). No plugins, no own permissions (settings form uses the
    core ''import configuration'' permission). Medium cases read back a distinctive value written into
    config_devel.settings; hard cases build real state in config_devel.settings (an auto_export config-object
    name; an auto_import {filename,hash} entry) verified against active config. NB: the config:devel-import-one
    command runs a full-site ConfigImporter validation, which fails on this shared site''s pre-existing
    broken config dependencies, so it is deliberately not used as an execution case.'
questions:
- id: config_devel-drush-commands
  input: In the Drupal config_devel module, which Drush command writes a module's owned configuration
    objects out into that module's config/install directory (the Features-style export)? Give the command
    name or one of its aliases.
  criteria: 'drush config:devel-export MODULE (alias cde / cd-em) writes the config objects listed in
    the module''s config_devel: info.yml section into its config/install (and config/optional) directory.'
  bundle: config_devel
  rubric_ref: rubric/config_devel_config_devel_drush_commands@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: config_devel-settings-keys
  input: The config_devel module stores its configuration in the config_devel.settings object. What are
    its two top-level keys and what does each control?
  criteria: auto_import is a list of files (path relative to the Drupal root plus a hash) that are automatically
    imported into active storage at the start of a request when they change; auto_export is a list of
    config object names that are written back to file when they are saved through the admin UI.
  bundle: config_devel
  rubric_ref: rubric/config_devel_config_devel_settings_keys@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: config_devel-info-section
  input: To use config_devel's Drush export/import for a custom Drupal module, where do you list which
    configuration objects belong to that module, and under which subkeys?
  criteria: 'You add a config_devel: section to the module''s .info.yml, listing config object names under
    install: (exported to config/install) and optionally optional: (exported to config/optional). drush
    cde/cdi then read that list.'
  bundle: config_devel
  rubric_ref: rubric/config_devel_config_devel_info_section@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: config_devel-read-autoimport
  input: On this Drupal site, config_devel is configured to automatically import one configuration file.
    Inspect the live config_devel.settings and give the filename (path) that is wired for auto-import.
  criteria: config_devel.settings auto_import contains a single entry whose filename is modules/custom/cfgdev_probe/config/install/system.only.cfgdev_probe.yml
    (readable via `drush cget config_devel.settings auto_import`).
  bundle: config_devel
  rubric_ref: rubric/config_devel_config_devel_read_autoimport@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/config_devel-autoimport-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/config_devel-autoimport-cleanup.sh
- id: config_devel-read-autoexport
  input: On this Drupal site, config_devel is set to automatically export one configuration object whenever
    it changes in the admin UI. Inspect the live config_devel.settings and name that config object.
  criteria: config_devel.settings auto_export lists views.view.cfgdev_probe (readable via `drush cget
    config_devel.settings auto_export`).
  bundle: config_devel
  rubric_ref: rubric/config_devel_config_devel_read_autoexport@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/config_devel-autoexport-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/config_devel-autoexport-cleanup.sh
- id: config_devel-add-autoexport
  input: On this Drupal site, use the config_devel module to configure automatic export of the node.type.article
    configuration object, so that whenever it is saved in the admin UI its value is written back to file.
    Apply the change to the live site's config_devel.settings.
  criteria: config_devel.settings auto_export contains the string node.type.article, e.g. via the Config
    Devel settings form (/admin/config/development/config_devel) or by editing config_devel.settings auto_export
    directly.
  bundle: config_devel
  rubric_ref: rubric/config_devel_config_devel_add_autoexport@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/config_devel-set-autoexport-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/config_devel-set-autoexport-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/config_devel-set-autoexport-verify.sh
    unused_text_checks:
      must_not_contain: []
- id: config_devel-add-autoimport
  input: On this Drupal site, use the config_devel module to set up automatic import of the configuration
    file at modules/custom/cfgdev_task/config/install/system.only.cfgdev_task.yml (a path relative to
    the Drupal root), so that when that file changes it is imported into active storage at the start of
    the next request. Apply the change to the live site's config_devel.settings.
  criteria: config_devel.settings auto_import contains an entry with filename modules/custom/cfgdev_task/config/install/system.only.cfgdev_task.yml
    (each auto_import entry is a mapping of {filename, hash}; hash may be empty). Set via the Config Devel
    settings form (/admin/config/development/config_devel) or by editing config_devel.settings auto_import
    directly.
  bundle: config_devel
  rubric_ref: rubric/config_devel_config_devel_add_autoimport@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/config_devel-set-autoimport-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/config_devel-set-autoimport-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/config_devel-set-autoimport-verify.sh
    unused_text_checks:
      must_not_contain: []
