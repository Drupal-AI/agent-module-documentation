metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: config_split
  version: 2.0.x
  note: 'Config Split is a configuration-management deployment tool. Cases are `recipe` (response-graded)
    and probe config_split-specific facts: the config_split config entity per split, complete vs partial
    splits, the drush export/import commands, per-environment activation via settings.php or status override,
    and how splits layer on core config sync. No site mutation.'
questions:
- id: configsplit-entity-per-split
  input: In Drupal 11 with Config Split 2.x, what kind of Drupal object represents a single split, and
    how do I create/manage splits (name the entity type and the admin location)? Answer briefly.
  criteria: Each split is a `config_split` config entity (`config_split.config_split.<id>`), managed at
    the Configuration Split collection UI under Admin > Config > Development > Configuration (route entity.config_split.collection).
  bundle: config_split
  rubric_ref: rubric/config_split_configsplit_entity_per_split@1.0
  tags:
  - mode:recipe
- id: configsplit-complete-vs-partial
  input: On a Drupal site using Config Split 2.x, explain the difference between a 'complete' split and
    a 'partial' split for a piece of configuration. When would each apply?
  criteria: 'Complete split (complete_list / split modules): config is fully removed from the main sync
    and stored only in the split, so it is absent where the split is inactive (ideal for dev-only modules).
    Partial split (partial_list): base config stays in the main sync and only the per-environment differences
    are stored as a patch and merged on import.'
  bundle: config_split
  rubric_ref: rubric/config_split_configsplit_complete_vs_partial@1.0
  tags:
  - mode:recipe
- id: configsplit-drush-export-import
  input: Give the Drush commands to export a single split named 'development' into its own storage, and
    to import that split's stored config back into active configuration. Config Split 2.x on Drupal 11.
  criteria: drush config-split:export development to write the split's selected config into its storage/folder,
    and drush config-split:import development to import the split's stored config into active configuration.
  bundle: config_split
  rubric_ref: rubric/config_split_configsplit_drush_export_import@1.0
  tags:
  - mode:recipe
- id: configsplit-activate-settings-php
  input: I want the 'dev' split to be active only on my local environment and off on production, without
    changing the split entity in code that everyone shares. How do I force a split on/off per environment
    in Drupal's settings.php with Config Split 2.x? Show the override.
  criteria: Override the split entity's status as a standard config override in settings.php, e.g. $config['config_split.config_split.dev']['status']
    = TRUE; (and set the production split to FALSE locally).
  bundle: config_split
  rubric_ref: rubric/config_split_configsplit_activate_settings_php@1.0
  tags:
  - mode:recipe
- id: configsplit-status-override-runtime
  input: On a Drupal 11 site with Config Split 2.x, how do I toggle a split active/inactive at runtime
    without editing the split entity or settings.php? Name the service or the drush command.
  criteria: 'Use the runtime status override: the config_split.status_override service (StatusOverride->setSplitOverride(''dev'',
    TRUE)) which stores the flag in state, or the equivalent drush config-split:status-override (alias
    csso).'
  bundle: config_split
  rubric_ref: rubric/config_split_configsplit_status_override_runtime@1.0
  tags:
  - mode:recipe
- id: configsplit-layers-on-core-sync
  input: With Config Split 2.x installed, do I need to change my existing `drush config:export` / `config:import`
    CI pipeline to account for active splits? Explain how Config Split integrates with core config sync.
  criteria: 'No changes needed: Config Split hooks into the normal core config:export/config:import via
    an event subscriber (SplitImportExportSubscriber), so active splits are applied automatically during
    standard sync; the per-split drush commands are only for operating on one split explicitly.'
  bundle: config_split
  rubric_ref: rubric/config_split_configsplit_layers_on_core_sync@1.0
  tags:
  - mode:recipe
- id: configsplit-split-by-module
  input: I want a Config Split 2.x split that moves ALL configuration belonging to the 'devel' module
    out of the main sync so devel is only present on dev. Which field of the split entity do I use, and
    what type of split behavior does that give?
  criteria: List the module under the split entity's `module` field; config belonging to a split module
    behaves as a complete split (removed from the main export), so the module is absent on environments
    where the split is inactive.
  bundle: config_split
  rubric_ref: rubric/config_split_configsplit_split_by_module@1.0
  tags:
  - mode:recipe
