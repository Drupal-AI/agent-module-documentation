metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: content_moderation_notifications
  version: 3.9.x
  note: Content Moderation Notifications emails users on content-moderation state transitions via `content_moderation_notification`
    config entities. Cases are `recipe` (response-graded) probing documented facts an agent would otherwise
    read source (routing, entity/schema, Notification service, api.php, permissions.yml, tokens) to answer;
    no site mutation.
questions:
- id: cmn-configure-route
  input: On a Drupal 11 site with content_moderation_notifications, where do I manage notifications and
    what is the module's configure route?
  criteria: Administration → Configuration → Workflow → Content Moderation Notifications at /admin/config/workflow/notifications;
    the configure route is entity.content_moderation_notification.collection.
  bundle: content_moderation_notifications
  rubric_ref: rubric/content_moderation_notifications_cmn_configure_route@1.0
  tags:
  - mode:recipe
- id: cmn-config-entity
  input: What config entity does content_moderation_notifications define, and what does each notification
    bind to?
  criteria: It defines the content_moderation_notification config entity; each one is scoped to a single
    workflow and a chosen set of that workflow's transitions, and only fires when enabled and the entity's
    transition matches.
  bundle: content_moderation_notifications
  rubric_ref: rubric/content_moderation_notifications_cmn_config_entity@1.0
  tags:
  - mode:recipe
- id: cmn-recipients
  input: Who can content_moderation_notifications send a notification to when a moderated entity changes
    state?
  criteria: The entity author/owner, all active users in selected roles (each access-checked for view
    on the entity), ad-hoc email addresses, and users referenced by configured entity-reference user fields.
  bundle: content_moderation_notifications
  rubric_ref: rubric/content_moderation_notifications_cmn_recipients@1.0
  tags:
  - mode:recipe
- id: cmn-bcc-sitemail
  input: How does content_moderation_notifications address the outgoing email — how are recipients placed
    and what is the visible recipient, and what does the 'disable site mail' option do?
  criteria: All recipients are forced onto the Bcc header; the visible recipient is the site mail address
    unless the notification's 'disable site mail' (site_mail) flag is set, in which case no site-mail
    recipient is used.
  bundle: content_moderation_notifications
  rubric_ref: rubric/content_moderation_notifications_cmn_bcc_sitemail@1.0
  tags:
  - mode:recipe
- id: cmn-permission
  input: What permission does content_moderation_notifications add and what does it gate? Is a permission
    needed to receive a notification?
  criteria: It adds a single permission, 'administer content moderation notifications', gating the notifications
    admin UI and create/edit/delete of notifications. Receiving a notification needs no permission (recipients
    are chosen by config), though role recipients are still view-access-checked on the entity.
  bundle: content_moderation_notifications
  rubric_ref: rubric/content_moderation_notifications_cmn_permission@1.0
  tags:
  - mode:recipe
- id: cmn-alter-hook
  input: How can another module add or change the recipients of a content_moderation_notifications email
    programmatically?
  criteria: Implement hook_content_moderation_notification_mail_data_alter(EntityInterface $entity, array
    &$data) and modify $data['to']; it runs in Notification::sendNotification() before the Bcc header
    is built from $data['to'].
  bundle: content_moderation_notifications
  rubric_ref: rubric/content_moderation_notifications_cmn_alter_hook@1.0
  tags:
  - mode:recipe
- id: cmn-twig-tokens
  input: Can I make the subject/body of a content_moderation_notifications email dynamic, and what moderation-specific
    tokens does the module provide?
  criteria: Yes — subject and body support Drupal tokens and inline Twig (body also filtered through a
    chosen text format). The module adds the content_moderation_notifications token type with workflow,
    from-state, and to-state tokens.
  bundle: content_moderation_notifications
  rubric_ref: rubric/content_moderation_notifications_cmn_twig_tokens@1.0
  tags:
  - mode:recipe
- id: cmn-dependencies
  input: What modules does content_moderation_notifications depend on, and is the token module required?
  criteria: It depends on core content_moderation, text, and workflows. The token module is not a runtime
    dependency (only a dev/recommended enhancement for token support).
  bundle: content_moderation_notifications
  rubric_ref: rubric/content_moderation_notifications_cmn_dependencies@1.0
  tags:
  - mode:recipe
- id: cmn-services
  input: In content_moderation_notifications, which service is the entry point that turns an entity save
    into emails, and how does it avoid firing during migrations?
  criteria: The content_moderation_notifications.notification service (Notification::processEntity), called
    from hook_entity_insert/update; it skips entities that are syncing (e.g. migrations) before looking
    up and sending matching notifications.
  bundle: content_moderation_notifications
  rubric_ref: rubric/content_moderation_notifications_cmn_services@1.0
  tags:
  - mode:recipe
