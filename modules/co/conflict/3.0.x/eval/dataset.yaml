metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: conflict
  version: 3.0.x
  note: Conflict does field-level concurrent-edit detection and three-way merge for entities. It has NO
    admin UI, configure route, permissions, or Drush; behavior is driven by the conflict.settings config
    (a resolution_type map entity_type -> bundle -> 'inline'|'dialog', fallback .<type>.<bundle> -> .<type>.default
    -> .default.default, shipped default inline), FieldComparator plugins (@FieldComparator, manager conflict.field_comparator.manager,
    default conflict_field_comparator_default), and the entity_conflict.discovery / entity_conflict.resolve
    events. hook_conflict_paths_alter() is the only hook. Medium/hard cases are grounded in the real conflict.settings
    config (resolution_type values are plain strings, so setting them is safe); scripts restore the shipped
    default (inline).
questions:
- id: conflict-what
  input: What does the Drupal 'conflict' module do when two editors save changes to the same node at the
    same time?
  criteria: It compares the base, remote (stored) and local (submitted) versions field by field, auto-merges
    non-conflicting changes, and presents only the genuinely clashing fields for resolution (inline or
    dialog) instead of silently overwriting one editor's work.
  bundle: conflict
  rubric_ref: rubric/conflict_conflict_what@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: conflict-resolution-types
  input: In the Drupal conflict module, what are the two conflict-resolution presentation styles, and
    where is that choice configured (there is no settings form)?
  criteria: The two styles are 'inline' (embedded in the edit form) and 'dialog' (modal). There is no
    configure route; you set it in the conflict.settings config object under resolution_type.<entity_type>.<bundle>
    (falling back to resolution_type.default.default, which ships as inline).
  bundle: conflict
  rubric_ref: rubric/conflict_conflict_resolution_types@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: conflict-field-comparator
  input: How does the Drupal conflict module decide whether a particular field has changed or conflicts,
    and how could I customize that for a specific field type?
  criteria: Via FieldComparator plugins (@FieldComparator annotation, manager conflict.field_comparator.manager,
    in Plugin/Conflict/FieldComparator/). The default conflict_field_comparator_default matches everything;
    write a plugin targeting your field_type (with hasChanged()/getConflictType()) to customize comparison.
  bundle: conflict
  rubric_ref: rubric/conflict_conflict_field_comparator@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: conflict-known-strategy
  input: On this Drupal site, the conflict module has been configured with a specific resolution style
    for Article nodes. Inspect the live conflict configuration and tell me whether Article uses inline
    or dialog conflict resolution.
  criteria: 'Article uses ''dialog'': conflict.settings resolution_type.node.article is set to dialog.'
  bundle: conflict
  rubric_ref: rubric/conflict_conflict_known_strategy@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/conflict-known-strategy-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/conflict-known-strategy-cleanup.sh
- id: conflict-default-strategy
  input: On this Drupal site, what is the conflict module's site-wide DEFAULT conflict-resolution style
    (the fallback used when an entity type/bundle has no specific setting)? Inspect the live configuration.
  criteria: 'The global default is ''dialog'': conflict.settings resolution_type.default.default is set
    to dialog.'
  bundle: conflict
  rubric_ref: rubric/conflict_conflict_default_strategy@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/conflict-default-strategy-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/conflict-default-strategy-cleanup.sh
- id: conflict-set-dialog
  input: On this Drupal site, configure the conflict module so that editing conflicts on Article nodes
    are resolved in a modal dialog (dialog resolution) rather than inline. Apply the change to the live
    configuration.
  criteria: Set conflict.settings resolution_type.node.article to 'dialog' (e.g. via the config API).
    Verify checks resolution_type.node.article === 'dialog'.
  bundle: conflict
  rubric_ref: rubric/conflict_conflict_set_dialog@1.0
