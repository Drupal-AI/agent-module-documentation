metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: conflict_paragraphs
  version: 3.0.x
  note: 'Submodule of Conflict (needs conflict + paragraphs). Adds Paragraphs support to Conflict''s field-level
    merge: a FieldComparator plugin conflict_field_comparator_paragraph_ref (FieldComparatorParagraphReference,
    targeting field_type=entity_reference_revisions) and an event subscriber MergeRemoteStructure (conflict_resolution.merge_remote_paragraph_structure)
    on the parent''s entity_conflict.resolve event. No config, routes, permissions, or Drush. Medium/hard
    cases are grounded in the LIVE plugin registry and module-install state (no external API): medium
    confirms the paragraph comparator plugin is registered; hard installs the submodule so the plugin
    appears (reset uninstalls -> verify FAILs; enable -> verify PASSes). Cleanups leave it enabled (documented
    baseline).'
questions:
- id: conflict_paragraphs-what
  input: What does the Drupal conflict_paragraphs submodule add on top of the conflict module?
  criteria: 'It adds Paragraphs support to Conflict''s field-level merge: a FieldComparator plugin (conflict_field_comparator_paragraph_ref)
    that compares entity_reference_revisions (Paragraph reference) fields by nested content, plus a MergeRemoteStructure
    event subscriber that merges remote paragraph structure changes.'
  bundle: conflict_paragraphs
  rubric_ref: rubric/conflict_paragraphs_conflict_paragraphs_what@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: conflict_paragraphs-plugin-id
  input: Which FieldComparator plugin does conflict_paragraphs provide, and which field type does it target?
  criteria: The plugin conflict_field_comparator_paragraph_ref (FieldComparatorParagraphReference), targeting
    field_type = entity_reference_revisions (the field type Paragraphs use), with entity_type_id/bundle/field_name
    = '*'.
  bundle: conflict_paragraphs
  rubric_ref: rubric/conflict_paragraphs_conflict_paragraphs_plugin_id@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: conflict_paragraphs-requirements
  input: What must be installed for the conflict_paragraphs submodule to work, and does it have any configuration
    of its own?
  criteria: It requires the parent conflict module and the paragraphs module. It has no configuration,
    routes, permissions or Drush of its own - enabling it registers its comparator plugin and merge subscriber
    into the parent module's pipeline.
  bundle: conflict_paragraphs
  rubric_ref: rubric/conflict_paragraphs_conflict_paragraphs_requirements@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: conflict_paragraphs-plugin
  input: On this Drupal site, inspect the conflict module's FieldComparator plugin definitions and tell
    me whether a comparator specifically for Paragraph reference fields is registered (and its plugin
    id).
  criteria: Yes - conflict_field_comparator_paragraph_ref is registered in conflict.field_comparator.manager
    (provided by conflict_paragraphs).
  bundle: conflict_paragraphs
  rubric_ref: rubric/conflict_paragraphs_conflict_paragraphs_plugin@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/conflict_paragraphs-plugin-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/conflict_paragraphs-plugin-cleanup.sh
- id: conflict_paragraphs-field-type
  input: On this Drupal site, inspect the conflict module's FieldComparator plugin definitions for the
    Paragraph reference comparator (conflict_field_comparator_paragraph_ref) and tell me which field type
    it targets.
  criteria: It targets field_type = entity_reference_revisions (the field type Paragraph reference fields
    use). The plugin conflict_field_comparator_paragraph_ref definition has field_type 'entity_reference_revisions'.
  bundle: conflict_paragraphs
  rubric_ref: rubric/conflict_paragraphs_conflict_paragraphs_field_type@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/conflict_paragraphs-plugin-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/conflict_paragraphs-plugin-cleanup.sh
- id: conflict_paragraphs-install
  input: On this Drupal site, enable Paragraphs support for the Conflict module so that concurrent edits
    to Paragraph reference fields are handled. Apply the change to the live site.
  criteria: Enable the conflict_paragraphs submodule (drush pm:install conflict_paragraphs). Verify checks
    the module is installed and its FieldComparator plugin conflict_field_comparator_paragraph_ref is
    registered in conflict.field_comparator.manager.
  bundle: conflict_paragraphs
  rubric_ref: rubric/conflict_paragraphs_conflict_paragraphs_install@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/conflict_paragraphs-install-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/conflict_paragraphs-install-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/conflict_paragraphs-install-verify.sh
