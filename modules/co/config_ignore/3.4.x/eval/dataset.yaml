metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: config_ignore
  version: 3.4.x
  note: Config Ignore is configured through the config_ignore.settings object and settings.php overrides,
    and adds an option to core's config import/export Drush commands. All cases are `recipe` (response-graded),
    not `execution` (live-state), so they do not mutate the site.
questions:
- id: configignore-config-object-and-key
  input: On a Drupal 11 site using Config Ignore, which configuration object stores the list of ignored
    config, and what is the name of the key inside it that holds the patterns? Name both.
  criteria: Rules live in the config_ignore.settings object, under the ignored_config_entities key (plus
    a mode key).
  bundle: config_ignore
  rubric_ref: rubric/config_ignore_configignore_config_object_and_key@1.0
  tags:
  - mode:recipe
- id: configignore-wildcard-pattern
  input: Using Config Ignore, I want to protect every webform config object (names beginning with `webform.webform.`)
    from being overwritten on config import. What single line do I add to the ignore list?
  criteria: 'Add a wildcard line: webform.webform.* — the trailing * matches all names with that prefix.'
  bundle: config_ignore
  rubric_ref: rubric/config_ignore_configignore_wildcard_pattern@1.0
  tags:
  - mode:recipe
- id: configignore-force-import-prefix
  input: In Config Ignore I have ignored `webform.webform.*`, but I still want the single form `webform.webform.contact`
    to be imported normally (not ignored). How do I write that exception, and why does it win over the
    wildcard?
  criteria: 'Add a force-import exception prefixed with a tilde: ~webform.webform.contact. Exceptions
    are sorted first so they override broader wildcard ignores.'
  bundle: config_ignore
  rubric_ref: rubric/config_ignore_configignore_force_import_prefix@1.0
  tags:
  - mode:recipe
- id: configignore-how-it-preserves-prod
  input: Explain how Config Ignore keeps production-only values (like the live site name in system.site)
    from being reverted when someone runs drush config:import. What mechanism does it use?
  criteria: It subscribes to core's config storage-transform events and removes ignored items from the
    transformation, so the destination (active/target) value is kept instead of being overwritten by the
    sync value.
  bundle: config_ignore
  rubric_ref: rubric/config_ignore_configignore_how_it_preserves_prod@1.0
  tags:
  - mode:recipe
- id: configignore-drush-deactivate
  input: With Config Ignore installed, I need to do a one-off full config import that ignores nothing
    (bypasses all ignore rules for this single run). Which drush command and flag do I use?
  criteria: drush config:import --deactivate-config-ignore — the module adds this option to core's config
    import/export commands for a one-off bypass.
  bundle: config_ignore
  rubric_ref: rubric/config_ignore_configignore_drush_deactivate@1.0
  tags:
  - mode:recipe
- id: configignore-runtime-disable
  input: How do I permanently turn Config Ignore off at runtime (so ignoring never happens) via settings.php
    on a Drupal site? Give the exact setting.
  criteria: Set $settings['config_ignore_deactivate'] = TRUE; in settings.php for a permanent bypass.
  bundle: config_ignore
  rubric_ref: rubric/config_ignore_configignore_runtime_disable@1.0
  tags:
  - mode:recipe
- id: configignore-admin-route
  input: Where is the Config Ignore settings form in the Drupal admin UI, and which permission gates access
    to it? Give the path/route and the permission.
  criteria: Route config_ignore.settings at /admin/config/development/configuration/ignore; the module
    has no permission of its own, so access reuses core's `import configuration` permission.
  bundle: config_ignore
  rubric_ref: rubric/config_ignore_configignore_admin_route@1.0
  tags:
  - mode:recipe
- id: configignore-single-key
  input: In Config Ignore, I do not want to ignore an entire config object — just one key inside it, e.g.
    the register-no-approval email body inside user.mail. How is a single-key pattern written?
  criteria: 'Use colon key-targeting syntax: config.name:key.path, e.g. user.mail:register_no_approval_required.body
    — only that key is ignored, the rest of the object still imports.'
  bundle: config_ignore
  rubric_ref: rubric/config_ignore_configignore_single_key@1.0
  tags:
  - mode:recipe
