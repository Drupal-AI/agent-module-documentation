rubrics:
- id: contact_storage_export_contact_storage_export_how_export
  version: '1.0'
  applicable_bundles:
  - contact_storage_export
  checks:
  - kind: must_contain_any
    values:
    - /admin/structure/contact
    - Export
    - export contact form messages
    - CSV
  scoring:
    combine: all_pass
- id: contact_storage_export_contact_storage_export_service
  version: '1.0'
  applicable_bundles:
  - contact_storage_export
  checks:
  - kind: must_contain_any
    values:
    - contact_storage_export.exporter
    - ContactStorageExportService
    - serialize
    - encode
    - getLabels
  scoring:
    combine: all_pass
- id: contact_storage_export_contact_storage_export_since_last
  version: '1.0'
  applicable_bundles:
  - contact_storage_export
  checks:
  - kind: must_contain_any
    values:
    - key
    - keyValue
    - last_id
    - last export
    - setLastExportId
  scoring:
    combine: all_pass
- id: contact_storage_export_contact_storage_export_which_form
  version: '1.0'
  applicable_bundles:
  - contact_storage_export
  checks:
  - kind: must_contain_any
    values:
    - cse_feedback
  scoring:
    combine: all_pass
- id: contact_storage_export_contact_storage_export_last_id
  version: '1.0'
  applicable_bundles:
  - contact_storage_export
  checks:
  - kind: must_contain_any
    values:
    - '7'
  scoring:
    combine: all_pass
- id: contact_storage_export_contact_storage_export_set_watermark
  version: '1.0'
  applicable_bundles:
  - contact_storage_export
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
- id: contact_storage_export_contact_storage_export_grant_perm
  version: '1.0'
  applicable_bundles:
  - contact_storage_export
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
