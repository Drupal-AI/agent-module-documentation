metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: computed_field
  version: 4.0.x
  note: Computed Field adds read-only fields whose value is generated by a `computed_field` plugin that
    declares a core field type and implements computeValue(). A configured field is stored as a `computed_field`
    config entity (id entity_type.bundle.field_name) holding plugin_id + plugin_config; the module ships
    one usable plugin, `reverse_entity_reference` (field type entity_reference). Recipe cases are response-graded;
    medium cases add a known computed_field entity and read it back from live config; hard cases build
    a computed field on a content type and verify the config entity + resolved field type on the live
    site. Admin UI is in the computed_field_ui submodule (its own evals.json).
questions:
- id: computed_field-what-is-computed
  input: On a Drupal 11 site using the contrib `computed_field` module, where does a computed field's
    value come from, and is the value stored in the database? What core concept produces it?
  criteria: The value is generated dynamically at runtime by a computed field plugin's computeValue()
    method; nothing is stored in the database. The plugin declares a core field type so existing field
    formatters can render the value. Computed fields are read-only.
  bundle: computed_field
  rubric_ref: rubric/computed_field_computed_field_what_is_computed@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: computed_field-field-type
  input: In the `computed_field` module, when I write a computed field plugin, what does its `field_type`
    attribute property refer to, and give examples? Does the module invent its own field types?
  criteria: field_type is a normal CORE field type id (e.g. string, integer, entity_reference, text, link,
    datetime). The module does not invent field types — it reuses core ones so existing formatters/settings
    apply. No data is stored; the type only chooses display.
  bundle: computed_field
  rubric_ref: rubric/computed_field_computed_field_field_type@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: computed_field-bundled-plugin
  input: Which ready-to-use computed field plugin ships with the `computed_field` module out of the box,
    what core field type does it use, and what does its configuration (`reference_field`) look like?
  criteria: reverse_entity_reference — an entity_reference computed field listing entities that reference
    the host. Its reference_field config is in the form HOST_ENTITY_TYPE-FIELD_NAME (e.g. node-uid); computeValue()
    queries all entities whose field points at the host.
  bundle: computed_field
  rubric_ref: rubric/computed_field_computed_field_bundled_plugin@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: computed_field-known-plugin
  input: This Drupal site has a computed field named `computed_eval_backlinks` on the Article content
    type. Inspect the live site and report which computed field plugin supplies its value and what core
    field type the field resolves to.
  criteria: The computed_field config entity node.article.computed_eval_backlinks uses plugin_id reverse_entity_reference
    and resolves to core field type entity_reference (getType()).
  bundle: computed_field
  rubric_ref: rubric/computed_field_computed_field_known_plugin@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/computed_field-known-plugin-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/computed_field-known-plugin-cleanup.sh
- id: computed_field-reference-config
  input: On this live Drupal site there is a computed field `computed_eval_authored` on Article nodes,
    using the reverse entity reference plugin. What is the exact `reference_field` value stored in its
    plugin configuration?
  criteria: The plugin_config of node.article.computed_eval_authored has reference_field = node-field_eval_source
    (format HOST_ENTITY_TYPE-FIELD_NAME).
  bundle: computed_field
  rubric_ref: rubric/computed_field_computed_field_reference_config@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/computed_field-reference-config-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/computed_field-reference-config-cleanup.sh
- id: computed_field-article-backlinks
  input: On this Drupal site, add a computed field to the Article content type using the computed_field
    module's bundled `reverse_entity_reference` plugin. Use the field machine name `computed_eval_referrers`
    and configure its `reference_field` as `node-uid`. Apply it to the live site so the computed field
    exists on Article nodes.
  criteria: A computed_field config entity node.article.computed_eval_referrers now exists, with plugin_id
    reverse_entity_reference and resolving to core field type entity_reference.
  bundle: computed_field
  rubric_ref: rubric/computed_field_computed_field_article_backlinks@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/computed_field-article-backlinks-reset.sh
    verify: agent-module-documentation/evaluation/verify/computed_field-article-backlinks-verify.sh
- id: computed_field-page-referrers
  input: Add a read-only computed field to the Basic page content type on this Drupal site. It must be
    supplied by the computed_field module's `reverse_entity_reference` plugin, have machine name `computed_eval_pagerefs`,
    and use `reference_field` = `node-uid`. Persist it to the live site.
  criteria: A computed_field config entity node.page.computed_eval_pagerefs now exists, with plugin_id
    reverse_entity_reference and resolving to core field type entity_reference.
  bundle: computed_field
  rubric_ref: rubric/computed_field_computed_field_page_referrers@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/computed_field-page-referrers-reset.sh
    verify: agent-module-documentation/evaluation/verify/computed_field-page-referrers-verify.sh
