metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: computed_field_ui
  version: 4.0.x
  part_of: computed_field
  note: Computed Field UI is the admin-UI submodule of computed_field. It adds Field-UI integration (an
    'Add computed field' action, edit/delete forms, and a report) but no config of its own, so it gets
    recipe-only cases graded on response text.
questions:
- id: computed_field_ui-purpose
  input: What does the `computed_field_ui` submodule add to a Drupal site, and which two modules must
    it depend on? Does it store any configuration of its own?
  criteria: It adds a UI over the parent computed_field module — an 'Add computed field' local action
    on each bundle's Manage fields page, plus edit/delete forms and a computed-fields report. It depends
    on computed_field and core field_ui, and provides no config of its own (saving the form creates a
    computed_field config entity from the parent module).
  bundle: computed_field_ui
  rubric_ref: rubric/computed_field_ui_computed_field_ui_purpose@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: computed_field_ui-add-action
  input: With `computed_field_ui` enabled, how does a site builder add a computed field to the Article
    content type through the admin UI? What is the URL path of the add form?
  criteria: Go to the Article Manage fields page and click the 'Add computed field' local action; the
    form is at {field_ui_base}/fields/add-computed-field, e.g. /admin/structure/types/manage/article/fields/add-computed-field.
    Pick a computed field plugin, set a label, and save.
  bundle: computed_field_ui
  rubric_ref: rubric/computed_field_ui_computed_field_ui_add_action@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: computed_field_ui-report-and-prefix
  input: Where can I see a list of every computed field on a site running `computed_field_ui`, and what
    permission and machine-name prefix govern fields created through the UI?
  criteria: The 'Computed fields' report at /admin/reports/fields/computed lists them all. Managing them
    requires the 'administer computed_field entities' permission, and new field machine names get the
    computed_field.settings:field_prefix prefix (default computed_).
  bundle: computed_field_ui
  rubric_ref: rubric/computed_field_ui_computed_field_ui_report_and_prefix@1.0
  tags:
  - mode:recipe
  - difficulty:easy
