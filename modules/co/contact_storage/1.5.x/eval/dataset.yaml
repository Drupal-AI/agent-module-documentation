metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: contact_storage
  version: 1.5.x
  note: Contact Storage makes core Contact's throwaway contact_message into a stored, fieldable entity,
    adds an admin message list, per-form third-party settings, and a global send_html flag. Cases are
    `recipe` (response-graded) since they probe documented facts an agent would otherwise read source
    to answer; no site mutation.
questions:
- id: contact-storage-persists-messages
  input: On a Drupal 11 site, core's Contact module emails a submission and then discards the message.
    What does the Contact Storage module change so submissions are kept, and what entity type holds them?
  criteria: It makes the core contact_message entity storable via hook_entity_type_alter (SQL storage,
    base_table contact_message, an id key and created/uid/ip_address base fields), so each submission
    is saved as a fieldable content entity instead of being discarded.
  bundle: contact_storage
  rubric_ref: rubric/contact_storage_contact_storage_persists_messages@1.0
  tags:
  - mode:recipe
- id: contact-storage-message-list
  input: Where can an administrator see the list of stored contact messages provided by Contact Storage,
    and what is the route/permission?
  criteria: At Admin > Structure > Contact > List, path /admin/structure/contact/messages (route entity.contact_message.collection,
    a Views page named contact_messages), gated by 'administer contact forms'.
  bundle: contact_storage
  rubric_ref: rubric/contact_storage_contact_storage_message_list@1.0
  tags:
  - mode:recipe
- id: contact-storage-add-fields
  input: I want to add a custom field (e.g. a phone number) to a specific core contact form so its value
    is stored with each submission. Why is this possible with Contact Storage?
  criteria: Contact forms are bundles of the now-fieldable contact_message entity, so ordinary Drupal
    fields added to a contact form are stored on each message.
  bundle: contact_storage
  rubric_ref: rubric/contact_storage_contact_storage_add_fields@1.0
  tags:
  - mode:recipe
- id: contact-storage-per-form-settings
  input: In Contact Storage, how is a custom submit-button label or a per-user maximum submission limit
    stored on an individual contact form in code?
  criteria: As contact_storage third-party settings on the core contact form entity, e.g. $form->setThirdPartySetting('contact_storage',
    'submit_text', ...) or 'maximum_submissions_user', then save().
  bundle: contact_storage
  rubric_ref: rubric/contact_storage_contact_storage_per_form_settings@1.0
  tags:
  - mode:recipe
- id: contact-storage-send-html
  input: Which config object and key control whether Contact Storage sends contact emails as HTML, and
    what is the default?
  criteria: The send_html key (default false) on the contact_storage.settings config object; enabling
    it needs the Swiftmailer module. e.g. drush cset contact_storage.settings send_html true.
  bundle: contact_storage
  rubric_ref: rubric/contact_storage_contact_storage_send_html@1.0
  tags:
  - mode:recipe
- id: contact-storage-dependency-contact
  input: What core module must be enabled for Contact Storage to work, and what other modules does it
    depend on?
  criteria: It depends on core contact (the module it extends), plus core views, options, filter, and
    the contrib token module.
  bundle: contact_storage
  rubric_ref: rubric/contact_storage_contact_storage_dependency_contact@1.0
  tags:
  - mode:recipe
- id: contact-storage-query-messages
  input: In PHP on a Drupal 11 site with Contact Storage, how do I load all stored contact messages submitted
    through a particular contact form?
  criteria: Use \Drupal::entityQuery('contact_message') with a condition on 'contact_form' (the bundle
    = form id), then loadMultiple() via the contact_message storage.
  bundle: contact_storage
  rubric_ref: rubric/contact_storage_contact_storage_query_messages@1.0
  tags:
  - mode:recipe
