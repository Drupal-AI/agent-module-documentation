metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: config_role_split
  version: 1.0.x
  note: 'Config Role Split provides one config_filter plugin (role_split) plus a role_split config entity
    (config_prefix=role_split -> config name config_role_split.role_split.<id>) with keys id, label, weight,
    status, mode, roles. roles is a map role_id => [permission_string,...]. mode is split (default) |
    fork | exclude and controls how managed role permissions are rewritten during config import (filterRead)
    and export (filterWrite). It only acts during config sync; it has no effect on the running site. Depends
    on config_filter. One permission: ''administer config role split''. configure route entity.role_split.collection
    at /admin/config/development/configuration/config-role-split. Medium/hard cases are grounded in real
    role_split config entities using the real ''authenticated'' role and real core permissions (''access
    content'', ''access user profiles'').'
questions:
- id: config_role_split-when-acts
  input: The Drupal module config_role_split does not seem to change anything on my live site after I
    set it up. When does it actually do its work, and what other module does it build on?
  criteria: It provides a Config Filter (built on the config_filter module) and only acts during configuration
    import/export (config sync); it has no effect on a running site. It rewrites managed role permissions
    as the user.role.* config passes through the sync storage.
  bundle: config_role_split
  rubric_ref: rubric/config_role_split_config_role_split_when_acts@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: config_role_split-modes
  input: What are the modes offered by the config_role_split module, and what does the default 'split'
    mode do to a role's permissions on export and import?
  criteria: The modes are split (default), fork, and exclude. In split mode the managed permissions are
    removed from the exported role config (kept only in the split entity) and merged back onto the role
    when importing.
  bundle: config_role_split
  rubric_ref: rubric/config_role_split_config_role_split_modes@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: config_role_split-storage
  input: In config_role_split, what config entity type holds a split's settings, and how is the list of
    permissions to manage structured within it?
  criteria: Settings are stored in a role_split config entity (config_role_split.role_split.<id>) with
    keys id, label, weight, status, mode and roles. roles is a map of role id => array of permission id
    strings the filter should manage.
  bundle: config_role_split
  rubric_ref: rubric/config_role_split_config_role_split_storage@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: config_role_split-known
  input: This Drupal site has a Config Role Split configured (config_role_split module). Inspect the live
    configuration and state the split's machine name and its mode.
  criteria: The split is crs_known and its mode is 'exclude' (see config_role_split.role_split.crs_known
    -> mode).
  bundle: config_role_split
  rubric_ref: rubric/config_role_split_config_role_split_known@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/config_role_split-known-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/config_role_split-known-cleanup.sh
- id: config_role_split-perms
  input: A Config Role Split named crs_perms is configured on this site. Inspect the live configuration
    and state which permission it manages for the 'authenticated' role.
  criteria: crs_perms manages the 'access user profiles' permission on the authenticated role (config_role_split.role_split.crs_perms
    -> roles.authenticated).
  bundle: config_role_split
  rubric_ref: rubric/config_role_split_config_role_split_perms@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/config_role_split-perms-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/config_role_split-perms-cleanup.sh
- id: config_role_split-create
  input: Using the config_role_split module, create an active Role Split with machine name crs_task in
    the default 'split' mode that manages the 'access content' permission for the authenticated role.
    Apply the change to the live site.
  criteria: A role_split config entity crs_task exists with status=true, mode=split, and roles.authenticated
    containing 'access content' (config_role_split.role_split.crs_task).
  bundle: config_role_split
  rubric_ref: rubric/config_role_split_config_role_split_create@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/config_role_split-create-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/config_role_split-create-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/config_role_split-create-verify.sh
- id: config_role_split-mode
  input: This site has a Config Role Split named crs_mode currently set to 'split' mode. Change it to
    'fork' mode using the config_role_split module and apply the change to the live site.
  criteria: 'The role_split config entity crs_mode has mode=fork (config_role_split.role_split.crs_mode
    -> mode: fork).'
  bundle: config_role_split
  rubric_ref: rubric/config_role_split_config_role_split_mode@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/config_role_split-mode-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/config_role_split-mode-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/config_role_split-mode-verify.sh
