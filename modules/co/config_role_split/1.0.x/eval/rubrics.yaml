rubrics:
- id: config_role_split_config_role_split_when_acts
  version: '1.0'
  applicable_bundles:
  - config_role_split
  checks:
  - kind: must_contain_any
    values:
    - config_filter
    - config filter
    - import
    - export
    - config sync
    - ConfigFilter
  scoring:
    combine: all_pass
- id: config_role_split_config_role_split_modes
  version: '1.0'
  applicable_bundles:
  - config_role_split
  checks:
  - kind: must_contain_any
    values:
    - split
    - fork
    - exclude
  scoring:
    combine: all_pass
- id: config_role_split_config_role_split_storage
  version: '1.0'
  applicable_bundles:
  - config_role_split
  checks:
  - kind: must_contain_any
    values:
    - role_split
    - config_role_split.role_split
    - roles
    - mode
  scoring:
    combine: all_pass
- id: config_role_split_config_role_split_known
  version: '1.0'
  applicable_bundles:
  - config_role_split
  checks:
  - kind: must_contain_any
    values:
    - crs_known
    - exclude
  scoring:
    combine: all_pass
- id: config_role_split_config_role_split_perms
  version: '1.0'
  applicable_bundles:
  - config_role_split
  checks:
  - kind: must_contain_any
    values:
    - access user profiles
  scoring:
    combine: all_pass
- id: config_role_split_config_role_split_create
  version: '1.0'
  applicable_bundles:
  - config_role_split
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
- id: config_role_split_config_role_split_mode
  version: '1.0'
  applicable_bundles:
  - config_role_split
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
