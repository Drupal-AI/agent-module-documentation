metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: config_pages
  version: 2.22.x
  note: Config Pages exposes a config_pages_type config (bundle) entity, a config_pages content entity
    (the singleton values), a context plugin type, a loader service, Token/Twig integration, and Drush
    commands. Cases are `recipe` (response-graded) probing documented facts an agent would otherwise read
    source to answer; no site mutation.
questions:
- id: config-pages-two-entity-types
  input: In Drupal Config Pages, what are the two entity types involved, and which one is the config 'bundle'
    definition versus the content entity that stores the actual values?
  criteria: config_pages_type is the config entity (the bundle/type definition, exportable config); config_pages
    is the content entity that stores the actual field values as a singleton per type per context.
  bundle: config_pages
  rubric_ref: rubric/config_pages_config_pages_two_entity_types@1.0
  tags:
  - mode:recipe
- id: config-pages-add-fields
  input: How do I add fields to a Config Pages settings page on a Drupal 11 site? Where do I create the
    type and where does Field UI attach?
  criteria: Create a config page type at /admin/structure/config_pages (route entity.config_pages.collection),
    then add fields via Field UI on the type edit form (config_pages_type is a bundle of config_pages;
    field_ui_base_route is entity.config_pages_type.edit_form).
  bundle: config_pages
  rubric_ref: rubric/config_pages_config_pages_add_fields@1.0
  tags:
  - mode:recipe
- id: config-pages-read-value-service
  input: In PHP on a Drupal 11 site, which service reads a single field value from a Config Pages entity,
    and which method do I call? Show the code.
  criteria: Use the config_pages.loader service (ConfigPagesLoaderService) and call getValue($type, $field_name,
    $delta, $key), e.g. \Drupal::service('config_pages.loader')->getValue('my_settings', 'field_phone',
    0, 'value'). config_pages_config() / ConfigPages::config() also load the entity directly.
  bundle: config_pages
  rubric_ref: rubric/config_pages_config_pages_read_value_service@1.0
  tags:
  - mode:recipe
- id: config-pages-per-language-context
  input: I want the same Config Pages settings page to hold different values per language on a Drupal
    site. What feature makes that possible and which context ships with the module?
  criteria: Enable a context on the config page type; the module ships a Language context plugin (id 'language',
    of the config_pages_context plugin type) that stores a separate config_pages entity per content language,
    with an optional fallback language.
  bundle: config_pages
  rubric_ref: rubric/config_pages_config_pages_per_language_context@1.0
  tags:
  - mode:recipe
- id: config-pages-twig-render
  input: How do I render a Config Pages field inside a Twig template on a Drupal site?
  criteria: Use the config_pages_field(type, field_name, view_mode = 'full') Twig function, e.g. {{ config_pages_field('my_settings',
    'field_hero') }}; it delegates to the loader's getFieldView().
  bundle: config_pages
  rubric_ref: rubric/config_pages_config_pages_twig_render@1.0
  tags:
  - mode:recipe
- id: config-pages-token
  input: How can Config Pages field values be referenced as tokens, and what must be enabled on the type?
  criteria: Enable the 'token' flag on the config page type; the module registers a 'config_page' token
    type so values are referenced like [config_page:my_settings:field_phone].
  bundle: config_pages
  rubric_ref: rubric/config_pages_config_pages_token@1.0
  tags:
  - mode:recipe
- id: config-pages-drush-set
  input: Which Drush command sets a field value on a Config Pages entity from the CLI on a Drupal site,
    and what is its alias?
  criteria: drush config:pages-set-field-value <bundle> <field_name> <value> (alias cpsfv); it creates
    the config page if missing, supports --append, and cpgfv / config:pages-get-field-value reads a value
    back.
  bundle: config_pages
  rubric_ref: rubric/config_pages_config_pages_drush_set@1.0
  tags:
  - mode:recipe
- id: config-pages-admin-route-permission
  input: What is the configure/admin route for Config Pages, and which permission lets a developer create
    config page types and add fields?
  criteria: The configure route is entity.config_pages.collection (/admin/structure/config_pages); 'administer
    config_pages types' gates creating/editing types and their fields.
  bundle: config_pages
  rubric_ref: rubric/config_pages_config_pages_admin_route_permission@1.0
  tags:
  - mode:recipe
