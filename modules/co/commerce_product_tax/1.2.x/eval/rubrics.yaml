rubrics:
- id: commerce_product_tax_commerce_product_tax_how_to_pick_rate
  version: '1.0'
  applicable_bundles:
  - commerce_product_tax
  checks:
  - kind: must_contain_any
    values:
    - commerce_product_tax
    - commerce_tax_rate
    - Tax rate
    - product variation type
  scoring:
    combine: all_pass
- id: commerce_product_tax_commerce_product_tax_field_settings
  version: '1.0'
  applicable_bundles:
  - commerce_product_tax
  checks:
  - kind: must_contain_any
    values:
    - tax_type
    - allowed_zones
  scoring:
    combine: all_pass
- id: commerce_product_tax_commerce_product_tax_resolver
  version: '1.0'
  applicable_bundles:
  - commerce_product_tax
  checks:
  - kind: must_contain_any
    values:
    - commerce_tax.tax_rate_resolver
    - TaxRateResolver
    - priority
    - zone_id|rate_id
    - '|'
  scoring:
    combine: all_pass
- id: commerce_product_tax_commerce_product_tax_known_type
  version: '1.0'
  applicable_bundles:
  - commerce_product_tax
  checks:
  - kind: must_contain_any
    values:
    - cpt_eu_vat
  scoring:
    combine: all_pass
- id: commerce_product_tax_commerce_product_tax_known_zones
  version: '1.0'
  applicable_bundles:
  - commerce_product_tax
  checks:
  - kind: must_contain_any
    values:
    - de
    - fr
  scoring:
    combine: all_pass
- id: commerce_product_tax_commerce_product_tax_add_field
  version: '1.0'
  applicable_bundles:
  - commerce_product_tax
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
- id: commerce_product_tax_commerce_product_tax_set_zones
  version: '1.0'
  applicable_bundles:
  - commerce_product_tax
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
