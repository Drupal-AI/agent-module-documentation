- id: content_synchronizer-export-node-archive
  input: On this Drupal site there is a node whose title is 'CS Export Task Node'. Use the content_synchronizer
    module to export that node to a tar.gz archive written under the directory /tmp/cs_export_out. Apply
    it on the live site (e.g. via the Drush export command or the content_synchronizer.manager service).
  criteria: A valid gzip'd tar archive of the 'CS Export Task Node' node is produced under /tmp/cs_export_out,
    e.g. `drush content:synchronizer-export-entity node <nid> /tmp/cs_export_out` (the manager writes
    the tar.gz relative to the destination path it is given).
  bundle: content_synchronizer
  rubric_ref: rubric/content_synchronizer_content_synchronizer_export_node_archive@1.0
