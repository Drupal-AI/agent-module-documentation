metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: content_synchronizer
  version: 4.1.x
  note: 'Content Synchronizer exports content entities to a tar.gz and imports them into another site.
    Central service content_synchronizer.manager (ContentSynchronizerManagerInterface) with exportEntity(),
    launchExport(), createImportFromTarGzFilePath(), launchImport(). Two content entity types: export_entity
    (a named set of entities, members stored in table content_synchronizer_export_items; API $export->addEntity()/getEntitiesList())
    and import_entity. Drush commands content:synchronizer-export-entity (cseex), -launch-export (cslex),
    -create-import (csci), -launch-import (cslim), -clean-temporary-files (csctf). Import publish strategies
    publication_publish|publication_unpublish|publication_revision and update strategies update_if_recent|update_systematic|update_no_update
    (constants on Processors\ImportProcessor). Two plugin types: entity_processor (by entityType) and
    type_processor (by field item-list class). Medium cases create export_entity content entities with
    known names/members; hard cases produce a real tar.gz and build an Export entity, verified against
    live state.'
questions:
- id: content_synchronizer-what-format
  input: What does the Drupal content_synchronizer module let you do, and what file format does an export
    produce so you can move content to another environment?
  criteria: It exports content entities (nodes, terms, files, users, paragraphs...) into a tar.gz archive
    that you can then import into another Drupal environment, moving real content between prod/staging/dev.
  bundle: content_synchronizer
  rubric_ref: rubric/content_synchronizer_content_synchronizer_what_format@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: content_synchronizer-drush-export
  input: Using content_synchronizer's Drush commands, how do I export a single node (say node 12) to a
    tar.gz archive from the command line?
  criteria: Use `drush content:synchronizer-export-entity node 12 [destination]` (alias cseex). It exports
    the given entity type + id to a tar.gz at the optional destination path.
  bundle: content_synchronizer
  rubric_ref: rubric/content_synchronizer_content_synchronizer_drush_export@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: content_synchronizer-import-strategies
  input: When importing content with content_synchronizer, what options control (a) whether newly created
    content is published and (b) what happens to content that already exists on the target site?
  criteria: The publish strategy is publication_publish (default) / publication_unpublish / publication_revision;
    the update strategy for existing entities is update_if_recent (default) / update_systematic / update_no_update.
    On the Drush import commands these are the --publish and --update options.
  bundle: content_synchronizer
  rubric_ref: rubric/content_synchronizer_content_synchronizer_import_strategies@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: content_synchronizer-known-export-name
  input: This Drupal site has a content_synchronizer Export entity already created. Inspect the site's
    export_entity entities and tell me the name of the export that exists.
  criteria: An export_entity named 'CS Staging Bundle' exists (loadable via the export_entity storage
    / the Exports collection at /admin/structure/export_entity).
  bundle: content_synchronizer
  rubric_ref: rubric/content_synchronizer_content_synchronizer_known_export_name@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/content_synchronizer-known-export-name-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/content_synchronizer-known-export-name-cleanup.sh
- id: content_synchronizer-export-member
  input: On this site there is a content_synchronizer Export entity named 'CS Node Set' that contains
    exactly one node. Inspect the live site to determine which node it holds, and give that node's title.
  criteria: The export 'CS Node Set' contains the node titled 'CS Payload Node' (its member list, stored
    in content_synchronizer_export_items and returned by ExportEntity::getEntitiesList(), references that
    node).
  bundle: content_synchronizer
  rubric_ref: rubric/content_synchronizer_content_synchronizer_export_member@1.0
  tags:
  - mode:introspection
  - difficulty:medium
