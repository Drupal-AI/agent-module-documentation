rubrics:
- id: content_synchronizer_content_synchronizer_what_format
  version: '1.0'
  applicable_bundles:
  - content_synchronizer
  checks:
  - kind: must_contain_any
    values:
    - tar.gz
    - archive
    - export
  scoring:
    combine: all_pass
- id: content_synchronizer_content_synchronizer_drush_export
  version: '1.0'
  applicable_bundles:
  - content_synchronizer
  checks:
  - kind: must_contain_any
    values:
    - content:synchronizer-export-entity
    - cseex
  scoring:
    combine: all_pass
- id: content_synchronizer_content_synchronizer_import_strategies
  version: '1.0'
  applicable_bundles:
  - content_synchronizer
  checks:
  - kind: must_contain_any
    values:
    - publication_publish
    - publication_unpublish
    - update_if_recent
    - update_systematic
    - update_no_update
  scoring:
    combine: all_pass
- id: content_synchronizer_content_synchronizer_known_export_name
  version: '1.0'
  applicable_bundles:
  - content_synchronizer
  checks:
  - kind: must_contain_any
    values:
    - CS Staging Bundle
  scoring:
    combine: all_pass
- id: content_synchronizer_content_synchronizer_export_member
  version: '1.0'
  applicable_bundles:
  - content_synchronizer
  checks:
  - kind: must_contain_any
    values:
    - CS Payload Node
  scoring:
    combine: all_pass
- id: content_synchronizer_content_synchronizer_export_node_archive
  version: '1.0'
  applicable_bundles:
  - content_synchronizer
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
- id: content_synchronizer_content_synchronizer_build_export_entity
  version: '1.0'
  applicable_bundles:
  - content_synchronizer
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
