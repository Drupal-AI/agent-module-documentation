rubrics:
- id: content_translation_redirect_content_translation_redirect_what
  version: '1.0'
  applicable_bundles:
  - content_translation_redirect
  checks:
  - kind: must_contain_any
    values:
    - /admin/config/regional/content-translation-redirect
    - non-existent
    - missing translation
    - untranslated
    - translation
  scoring:
    combine: all_pass
- id: content_translation_redirect_content_translation_redirect_codes_modes
  version: '1.0'
  applicable_bundles:
  - content_translation_redirect
  checks:
  - kind: must_contain_any
    values:
    - '301'
    - '302'
    - translatable
    - untranslatable
    - all
  scoring:
    combine: all_pass
- id: content_translation_redirect_content_translation_redirect_ids
  version: '1.0'
  applicable_bundles:
  - content_translation_redirect
  checks:
  - kind: must_contain_any
    values:
    - default
    - __
    - bundle
    - most specific
    - entity type
  scoring:
    combine: all_pass
- id: content_translation_redirect_content_translation_redirect_known
  version: '1.0'
  applicable_bundles:
  - content_translation_redirect
  checks:
  - kind: must_contain_any
    values:
    - '302'
  scoring:
    combine: all_pass
- id: content_translation_redirect_content_translation_redirect_default
  version: '1.0'
  applicable_bundles:
  - content_translation_redirect
  checks:
  - kind: must_contain_any
    values:
    - '301'
  scoring:
    combine: all_pass
- id: content_translation_redirect_content_translation_redirect_create
  version: '1.0'
  applicable_bundles:
  - content_translation_redirect
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
- id: content_translation_redirect_content_translation_redirect_set_default
  version: '1.0'
  applicable_bundles:
  - content_translation_redirect
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
