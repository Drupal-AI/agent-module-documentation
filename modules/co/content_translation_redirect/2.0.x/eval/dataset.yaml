    cleanup: agent-module-documentation/evaluation/verify/content_translation_redirect-default-cleanup.sh
- id: content_translation_redirect-create
  input: On this Drupal site, add a content translation redirect for the Article node bundle that returns
    a 301 (Moved Permanently) and acts on all entities, redirecting to the original content. Apply it
    to the live site.
  criteria: Create a content_translation_redirect entity with id node__article, code 301, mode 'all',
    path '' (empty). E.g. via the add form at /admin/config/regional/content-translation-redirect/add
    or the content_translation_redirect entity storage.
  bundle: content_translation_redirect
  rubric_ref: rubric/content_translation_redirect_content_translation_redirect_create@1.0
