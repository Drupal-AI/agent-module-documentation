metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: content_translation_redirect
  version: 2.0.x
  note: Content Translation Redirect defines the content_translation_redirect config entity (config names
    content_translation_redirect.entity.<id>, admin at /admin/config/regional/content-translation-redirect,
    permission 'administer content translation redirects'). Ids are 'default' (locked, all types), '<entity_type>',
    or '<entity_type>__<bundle>'; keys code (300/301/302/303/304/305/307 or null=disabled), path ('' =
    redirect to original content), mode (translatable|untranslatable|all). Medium/hard cases are grounded
    in these config entities and read via the entity storage handler. The runtime redirect only fires
    on a MULTILINGUAL site (this site is currently single-language), so cases deliberately verify the
    redirect CONFIGURATION, not live redirect behaviour. Fixtures/builds use raw config writes because
    config-entity saves via the entity API are currently blocked by an unrelated broken commerce_giftcard
    field on this shared site.
questions:
- id: content_translation_redirect-what
  input: What problem does the content_translation_redirect module solve, and where do you configure it
    in Drupal?
  criteria: It redirects visitors who request a content entity in a language it has not been translated
    into, sending them to the original content (or a chosen path) with a configured HTTP status code instead
    of showing an untranslated page. Configure it at /admin/config/regional/content-translation-redirect
    (permission 'administer content translation redirects').
  bundle: content_translation_redirect
  rubric_ref: rubric/content_translation_redirect_content_translation_redirect_what@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: content_translation_redirect-codes-modes
  input: In content_translation_redirect, what does a redirect entity let you set - which status codes
    and which 'act on' translation modes are available, and what does leaving the redirect path blank
    do?
  criteria: Each redirect has a status code (300, 301, 302, 303, 304, 305 or 307; blank/null = disabled),
    an 'Act on' mode of translatable, untranslatable or all, and a redirect path. A blank path redirects
    to the same content in its original (untranslated) language.
  bundle: content_translation_redirect
  rubric_ref: rubric/content_translation_redirect_content_translation_redirect_codes_modes@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: content_translation_redirect-ids
  input: How does content_translation_redirect decide which redirect applies to a given entity - what
    is the id scheme and matching order, and what is the 'Default' redirect?
  criteria: 'Redirect ids are ''default'' (the locked Default redirect, applies to all supported types),
    ''<entity_type>'' (e.g. node), or ''<entity_type>__<bundle>'' (e.g. node__article). Matching is most-specific-first:
    bundle -> entity type -> Default. The Default redirect ships disabled (code null).'
  bundle: content_translation_redirect
  rubric_ref: rubric/content_translation_redirect_content_translation_redirect_ids@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: content_translation_redirect-known
  input: This site has a content translation redirect configured for a specific node bundle. Inspect the
    live configuration and report which entity/bundle it targets, its HTTP status code and its 'act on'
    mode.
  criteria: There is a content_translation_redirect.entity.node__article with code 302 and mode 'all'
    (targets Article nodes). Read with `drush cget content_translation_redirect.entity.node__article`
    or load the content_translation_redirect entity 'node__article'.
  bundle: content_translation_redirect
  rubric_ref: rubric/content_translation_redirect_content_translation_redirect_known@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/content_translation_redirect-known-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/content_translation_redirect-known-cleanup.sh
- id: content_translation_redirect-default
  input: On this site, the site-wide Default content translation redirect has been given a status code.
    Inspect the live configuration and state the Default redirect's HTTP status code.
  criteria: The Default redirect (content_translation_redirect.entity.default) has code 301. Read with
    `drush cget content_translation_redirect.entity.default`.
  bundle: content_translation_redirect
  rubric_ref: rubric/content_translation_redirect_content_translation_redirect_default@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
