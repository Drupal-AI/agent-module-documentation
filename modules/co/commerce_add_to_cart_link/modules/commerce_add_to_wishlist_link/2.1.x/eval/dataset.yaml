metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: commerce_add_to_wishlist_link
  version: 2.1.x
  note: 'Submodule of commerce_add_to_cart_link. It renders an add-to-wishlist LINK (GET /add-to-wishlist/{product}/{variation}/{token})
    via an ''add_to_wishlist_link'' pseudo/extra field on Commerce product & variation view displays.
    AddToWishlistLink extends the parent AddToCartLink; it has NO settings/config of its own and reuses
    the parent''s commerce_add_to_cart_link.settings (csrf_token.roles, redirect_back) and the shared
    commerce_add_to_cart_link.token service. Route requires the ''access wishlist'' permission and it
    depends on commerce_wishlist. IMPORTANT for this campaign: commerce_wishlist is NOT installed on this
    site, so the submodule cannot be enabled. Easy cases are grounded in the submodule source. Medium/hard
    cases are grounded in what IS present and what the wishlist controller actually consumes: the shared
    parent config commerce_add_to_cart_link.settings (redirect_back and csrf_token.roles) which directly
    governs the wishlist link''s redirect and token protection. Shipped baseline: csrf_token.roles=[],
    redirect_back=false.'
questions:
- id: catwl-enable-field
  input: Using commerce_add_to_wishlist_link, how do I make an 'Add to wishlist' link appear on a Commerce
    product listing view mode? What is the field called?
  criteria: Enable the 'add_to_wishlist_link' pseudo/extra field on the product (or product variation)
    view mode via Manage display (drag it out of Disabled). hook_entity_extra_field_info() adds it, hidden
    by default, to every commerce_product and commerce_product_variation bundle.
  bundle: commerce_add_to_wishlist_link
  rubric_ref: rubric/commerce_add_to_wishlist_link_catwl_enable_field@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: catwl-shared-settings
  input: Does commerce_add_to_wishlist_link have its own settings form for CSRF token protection and redirect
    behaviour? If not, what config and service control those for the wishlist link?
  criteria: No, it has no settings of its own. It reuses the parent module's commerce_add_to_cart_link.settings
    (csrf_token.roles and redirect_back) and the shared commerce_add_to_cart_link.token service. AddToWishlistController
    reads redirect_back from that config and validates tokens from that service, so you configure wishlist
    links at /admin/commerce/config/add-to-cart-link.
  bundle: commerce_add_to_wishlist_link
  rubric_ref: rubric/commerce_add_to_wishlist_link_catwl_shared_settings@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: catwl-route-and-deps
  input: What route does an add-to-wishlist link hit, what permission does it require, and what modules
    must be enabled for commerce_add_to_wishlist_link to work?
  criteria: The link hits commerce_add_to_wishlist_link.page at /add-to-wishlist/{commerce_product}/{commerce_product_variation}/{token},
    which requires the 'access wishlist' permission. The submodule depends on both commerce_add_to_cart_link
    and commerce_wishlist being enabled.
  bundle: commerce_add_to_wishlist_link
  rubric_ref: rubric/commerce_add_to_wishlist_link_catwl_route_and_deps@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: catwl-redirect-value
  input: The add-to-wishlist link's after-add redirect is governed by the same shared config as the cart
    link. Inspect the live configuration that AddToWishlistController reads for its redirect-back behaviour
    and tell me whether it is currently enabled.
  criteria: 'redirect-back is enabled: commerce_add_to_cart_link.settings:redirect_back is true, so after
    adding to the wishlist the shopper is sent back to the referring page (if valid) instead of the wishlist
    page.'
  bundle: commerce_add_to_wishlist_link
  rubric_ref: rubric/commerce_add_to_wishlist_link_catwl_redirect_value@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/commerce_add_to_wishlist_link-redirect-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/commerce_add_to_wishlist_link-redirect-cleanup.sh
- id: catwl-protected-role
  input: Add-to-wishlist links are CSRF-protected using the same shared token config as the cart link.
    Inspect the live configuration and tell me which user role currently has its links protected with
    a token.
  criteria: 'The ''content_editor'' role: commerce_add_to_cart_link.settings:csrf_token.roles = [''content_editor''],
    and the shared commerce_add_to_cart_link.token service applies that protection to add-to-wishlist
    links as well.'
  bundle: commerce_add_to_wishlist_link
  rubric_ref: rubric/commerce_add_to_wishlist_link_catwl_protected_role@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/commerce_add_to_wishlist_link-roles-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/commerce_add_to_wishlist_link-roles-cleanup.sh
- id: catwl-enable-redirect
  input: On this Drupal site, configure things so that after a shopper clicks an add-to-wishlist link
    (commerce_add_to_wishlist_link) they are returned to the page they came from instead of the wishlist
    page. Apply the change to the live site.
  criteria: Set commerce_add_to_cart_link.settings:redirect_back to true (e.g. drush cset commerce_add_to_cart_link.settings
    redirect_back true). AddToWishlistController::action() reads this shared key; when true and the referer
    is a valid internal URL it redirects there instead of to commerce_wishlist.page.
  bundle: commerce_add_to_wishlist_link
  rubric_ref: rubric/commerce_add_to_wishlist_link_catwl_enable_redirect@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/commerce_add_to_wishlist_link-redirect-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/commerce_add_to_wishlist_link-redirect-cleanup2.sh
    verify: agent-module-documentation/evaluation/verify/commerce_add_to_wishlist_link-redirect-verify.sh
- id: catwl-protect-content-editor
  input: On this Drupal site, make add-to-wishlist links (commerce_add_to_wishlist_link) CSRF-token-protected
    for users in the 'content_editor' role. Apply the change to the live site.
  criteria: Add 'content_editor' to commerce_add_to_cart_link.settings:csrf_token.roles (e.g. drush cset
    commerce_add_to_cart_link.settings csrf_token.roles.0 content_editor). The shared commerce_add_to_cart_link.token
    service then appends a CSRF token to that role's wishlist links, validated by AddToWishlistController::access().
  bundle: commerce_add_to_wishlist_link
  rubric_ref: rubric/commerce_add_to_wishlist_link_catwl_protect_content_editor@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/commerce_add_to_wishlist_link-protect-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/commerce_add_to_wishlist_link-protect-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/commerce_add_to_wishlist_link-protect-verify.sh
