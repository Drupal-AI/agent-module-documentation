rubrics:
- id: commerce_add_to_wishlist_link_catwl_enable_field
  version: '1.0'
  applicable_bundles:
  - commerce_add_to_wishlist_link
  checks:
  - kind: must_contain_any
    values:
    - add_to_wishlist_link
    - Manage display
    - pseudo
    - extra field
    - view mode
    - view display
  scoring:
    combine: all_pass
- id: commerce_add_to_wishlist_link_catwl_shared_settings
  version: '1.0'
  applicable_bundles:
  - commerce_add_to_wishlist_link
  checks:
  - kind: must_contain_any
    values:
    - commerce_add_to_cart_link.settings
    - commerce_add_to_cart_link.token
    - csrf_token
    - redirect_back
    - parent
  scoring:
    combine: all_pass
- id: commerce_add_to_wishlist_link_catwl_route_and_deps
  version: '1.0'
  applicable_bundles:
  - commerce_add_to_wishlist_link
  checks:
  - kind: must_contain_any
    values:
    - access wishlist
    - commerce_wishlist
    - /add-to-wishlist
    - commerce_add_to_wishlist_link.page
    - commerce_add_to_cart_link
  scoring:
    combine: all_pass
- id: commerce_add_to_wishlist_link_catwl_redirect_value
  version: '1.0'
  applicable_bundles:
  - commerce_add_to_wishlist_link
  checks:
  - kind: must_contain_any
    values:
    - 'true'
    - enabled
    - redirect_back
  scoring:
    combine: all_pass
- id: commerce_add_to_wishlist_link_catwl_protected_role
  version: '1.0'
  applicable_bundles:
  - commerce_add_to_wishlist_link
  checks:
  - kind: must_contain_any
    values:
    - content_editor
  scoring:
    combine: all_pass
- id: commerce_add_to_wishlist_link_catwl_enable_redirect
  version: '1.0'
  applicable_bundles:
  - commerce_add_to_wishlist_link
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
- id: commerce_add_to_wishlist_link_catwl_protect_content_editor
  version: '1.0'
  applicable_bundles:
  - commerce_add_to_wishlist_link
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
