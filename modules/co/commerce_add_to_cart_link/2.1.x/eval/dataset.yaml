    cleanup: agent-module-documentation/evaluation/verify/commerce_add_to_cart_link-display-cleanup.sh
- id: catl-show-on-product-display
  input: On this Drupal site, using commerce_add_to_cart_link, make the 'Add to cart' link appear on the
    default product view display (commerce_product.default.default) for the 'default' product type. Apply
    the change to the live site.
  criteria: Add the add_to_cart_link component to the commerce_product.default.default entity_view_display
    in a visible region, e.g. $display->setComponent('add_to_cart_link', ['weight' => 10, 'region' =>
    'content'])->save(); (or drag it out of Disabled on Manage display). getComponent('add_to_cart_link')
    must then be set (not hidden).
  bundle: commerce_add_to_cart_link
  rubric_ref: rubric/commerce_add_to_cart_link_catl_show_on_product_display@1.0
  tags:
  - mode:execution
  - difficulty:hard
