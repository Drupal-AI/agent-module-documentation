- id: catl-protect-authenticated
  input: On this Drupal site, configure commerce_add_to_cart_link so that add-to-cart links for users
    in the 'authenticated' role are protected with a CSRF token. Apply the change to the live site.
  criteria: Set commerce_add_to_cart_link.settings:csrf_token.roles to include 'authenticated' (via the
    settings form or drush cset commerce_add_to_cart_link.settings csrf_token.roles.0 authenticated).
    The token service then adds an HMAC token to those users' links.
  bundle: commerce_add_to_cart_link
  rubric_ref: rubric/commerce_add_to_cart_link_catl_protect_authenticated@1.0
