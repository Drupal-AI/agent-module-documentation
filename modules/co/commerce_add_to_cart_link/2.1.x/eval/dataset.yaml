metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: commerce_add_to_cart_link
  version: 2.1.x
  note: 'Commerce Add To Cart Link renders an add-to-cart LINK (GET /add-to-cart/{product}/{variation}/{token})
    instead of the Commerce form. Its display mechanism is an ''add_to_cart_link'' pseudo/extra field
    added by hook_entity_extra_field_info() to every commerce_product and commerce_product_variation view
    display (hidden by default) - shown by adding the component to the entity_view_display config. Its
    settings config object is commerce_add_to_cart_link.settings with keys csrf_token.roles (sequence
    of role ids whose links get a CSRF token via the commerce_add_to_cart_link.token service) and redirect_back
    (bool). It also provides a @ViewsField(''commerce_add_to_cart_link'') and a themeable Twig template.
    Medium/hard cases are grounded in real live config: introspection reads csrf_token.roles/redirect_back
    and which view display shows the pseudo field; execution shows the pseudo field on commerce_product.default.default
    and sets csrf_token.roles. Shipped baseline: csrf_token.roles=[], redirect_back=false, pseudo field
    hidden. Site has product type ''default'' and variation type ''default''.'
questions:
- id: catl-link-not-form
  input: In Drupal Commerce I want an 'Add to cart' link (not a form) on my product catalog/teaser view
    mode using the commerce_add_to_cart_link module. What is the name of the field I enable, and where
    do I enable it?
  criteria: Enable the 'add_to_cart_link' pseudo/extra field on the product (or product variation) view
    mode via Manage display (drag it out of Disabled). It is provided by hook_entity_extra_field_info()
    on every commerce_product and commerce_product_variation bundle and is hidden by default; on the product
    it links the default variation, on a variation it links that variation.
  bundle: commerce_add_to_cart_link
  rubric_ref: rubric/commerce_add_to_cart_link_catl_link_not_form@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: catl-token-protection
  input: How does the commerce_add_to_cart_link module let me stop bots from guessing the add-to-cart
    URLs, and which config controls it?
  criteria: You enable per-role CSRF token protection at Configuration -> Commerce -> Commerce Add To
    Cart Link, which writes commerce_add_to_cart_link.settings:csrf_token.roles. For users in those roles
    the commerce_add_to_cart_link.token service adds an HMAC token (private key + hash salt over the product/variation
    ids) to the link, and the controller's access() validates it. Empty roles = no protection.
  bundle: commerce_add_to_cart_link
  rubric_ref: rubric/commerce_add_to_cart_link_catl_token_protection@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: catl-settings-keys
  input: What are the two settings offered by the commerce_add_to_cart_link admin settings form, and what
    config object stores them?
  criteria: The commerce_add_to_cart_link.settings config object stores csrf_token.roles (a list of role
    ids whose links get a CSRF token) and redirect_back (a boolean; when true the shopper returns to the
    referring page after adding, otherwise to the cart page). The form is at /admin/commerce/config/add-to-cart-link.
  bundle: commerce_add_to_cart_link
  rubric_ref: rubric/commerce_add_to_cart_link_catl_settings_keys@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: catl-which-roles-protected
  input: On this Drupal site, inspect the live commerce_add_to_cart_link configuration and tell me which
    user role(s) currently have their add-to-cart links protected with a CSRF token, and whether redirect-back
    is enabled.
  criteria: The 'authenticated' role is protected (commerce_add_to_cart_link.settings:csrf_token.roles
    = ['authenticated']) and redirect_back is true.
  bundle: commerce_add_to_cart_link
  rubric_ref: rubric/commerce_add_to_cart_link_catl_which_roles_protected@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/commerce_add_to_cart_link-settings-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/commerce_add_to_cart_link-settings-cleanup.sh
- id: catl-which-display-shows-link
  input: On this site the commerce_add_to_cart_link 'add_to_cart_link' pseudo field is currently enabled
    on exactly one Commerce view display. Inspect the live view-display configuration and tell me which
    entity/view display shows it.
  criteria: 'It is shown on the product variation default view display: commerce_product_variation.default.default
    has the add_to_cart_link component in the content region (getComponent(''add_to_cart_link'') is set,
    not hidden).'
  bundle: commerce_add_to_cart_link
  rubric_ref: rubric/commerce_add_to_cart_link_catl_which_display_shows_link@1.0
  tags:
  - mode:introspection
  - difficulty:medium
