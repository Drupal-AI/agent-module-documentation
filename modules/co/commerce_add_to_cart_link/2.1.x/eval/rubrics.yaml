rubrics:
- id: commerce_add_to_cart_link_catl_link_not_form
  version: '1.0'
  applicable_bundles:
  - commerce_add_to_cart_link
  checks:
  - kind: must_contain_any
    values:
    - add_to_cart_link
    - Manage display
    - extra field
    - pseudo
    - view display
    - view mode
  scoring:
    combine: all_pass
- id: commerce_add_to_cart_link_catl_token_protection
  version: '1.0'
  applicable_bundles:
  - commerce_add_to_cart_link
  checks:
  - kind: must_contain_any
    values:
    - csrf_token
    - CSRF
    - token
    - roles
    - commerce_add_to_cart_link.settings
    - private key
  scoring:
    combine: all_pass
- id: commerce_add_to_cart_link_catl_settings_keys
  version: '1.0'
  applicable_bundles:
  - commerce_add_to_cart_link
  checks:
  - kind: must_contain_any
    values:
    - csrf_token
    - redirect_back
    - commerce_add_to_cart_link.settings
  scoring:
    combine: all_pass
- id: commerce_add_to_cart_link_catl_which_roles_protected
  version: '1.0'
  applicable_bundles:
  - commerce_add_to_cart_link
  checks:
  - kind: must_contain_any
    values:
    - authenticated
  scoring:
    combine: all_pass
- id: commerce_add_to_cart_link_catl_which_display_shows_link
  version: '1.0'
  applicable_bundles:
  - commerce_add_to_cart_link
  checks:
  - kind: must_contain_any
    values:
    - commerce_product_variation.default.default
    - commerce_product_variation
    - variation
  scoring:
    combine: all_pass
- id: commerce_add_to_cart_link_catl_show_on_product_display
  version: '1.0'
  applicable_bundles:
  - commerce_add_to_cart_link
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
- id: commerce_add_to_cart_link_catl_protect_authenticated
  version: '1.0'
  applicable_bundles:
  - commerce_add_to_cart_link
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
