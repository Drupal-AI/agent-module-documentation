rubrics:
- id: codemirror_editor_codemirror_editor_what_it_provides
  version: '1.0'
  applicable_bundles:
  - codemirror_editor
  checks:
  - kind: must_contain_any
    values:
    - codemirror_editor
    - text format
    - editor
    - filter
    - field widget
    - formatter
    - '#type'
    - codemirror
  scoring:
    combine: all_pass
- id: codemirror_editor_codemirror_editor_settings_keys
  version: '1.0'
  applicable_bundles:
  - codemirror_editor
  checks:
  - kind: must_contain_any
    values:
    - codemirror_editor.settings
    - cdn
    - theme
    - language_modes
    - /admin/config/content/codemirror
  scoring:
    combine: all_pass
- id: codemirror_editor_codemirror_editor_drush_download
  version: '1.0'
  applicable_bundles:
  - codemirror_editor
  checks:
  - kind: must_contain_any
    values:
    - codemirror:download
    - codemirror-download
  scoring:
    combine: all_pass
- id: codemirror_editor_codemirror_editor_known_theme
  version: '1.0'
  applicable_bundles:
  - codemirror_editor
  checks:
  - kind: must_contain_any
    values:
    - material
  scoring:
    combine: all_pass
- id: codemirror_editor_codemirror_editor_known_cdn
  version: '1.0'
  applicable_bundles:
  - codemirror_editor
  checks:
  - kind: must_contain_any
    values:
    - self-host
    - self host
    - self-hosted
    - cdn is false
    - 'cdn: false'
    - cdn = false
    - locally
    - not from a CDN
    - disabled
  scoring:
    combine: all_pass
- id: codemirror_editor_codemirror_editor_set_modes
  version: '1.0'
  applicable_bundles:
  - codemirror_editor
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
- id: codemirror_editor_codemirror_editor_self_host
  version: '1.0'
  applicable_bundles:
  - codemirror_editor
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
