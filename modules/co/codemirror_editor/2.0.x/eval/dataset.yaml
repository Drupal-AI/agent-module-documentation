    reset: agent-module-documentation/evaluation/verify/codemirror_editor-set-modes-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/codemirror_editor-set-modes-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/codemirror_editor-set-modes-verify.sh
- id: codemirror_editor-self-host
  input: On this Drupal site, configure the CodeMirror Editor module to stop using the CDN and instead
    serve a self-hosted, non-minified build of the CodeMirror library. Apply the change to the live site
    (you do not need to actually download the library files).
  criteria: codemirror_editor.settings has cdn set to false AND minified set to false (e.g. untick 'Load
    the library from CDN' and 'Use minified version' on the settings form, or set both booleans to false
    in config and save).
  bundle: codemirror_editor
  rubric_ref: rubric/codemirror_editor_codemirror_editor_self_host@1.0
  tags:
