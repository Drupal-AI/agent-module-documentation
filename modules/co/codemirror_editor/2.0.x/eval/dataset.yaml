metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: codemirror_editor
  version: 2.0.x
  note: 'CodeMirror Editor integrates the CodeMirror library into Drupal. Global config object codemirror_editor.settings
    has cdn (bool, default true), minified (bool, default true), theme (string, default ''default'') and
    language_modes (sequence of mode plugin ids, default [xml]); settings form at /admin/config/content/codemirror
    behind the ''administer codemirror editor'' permission. It provides plugins all id ''codemirror_editor''
    (an @Editor for text formats, a #[Filter] TYPE_TRANSFORM_IRREVERSIBLE, and a @FieldWidget + @FieldFormatter
    for string_long/text_long), a #type=>''codemirror'' render element, and a codemirror_mode YAML plugin
    type (plugin.manager.codemirror_mode, MODULE.codemirror_modes.yml; 12 modes ship). Drush command codemirror:download
    self-hosts the library when cdn is off. Medium/hard cases are grounded in the real codemirror_editor.settings
    config: introspection reads back the configured theme/modes and the cdn flag; execution changes the
    preloaded language_modes and switches to a self-hosted un-minified build, verified by pure config
    reads. Shipped defaults are restored explicitly on cleanup/reset.'
questions:
- id: codemirror_editor-what-it-provides
  input: I want syntax-highlighted code editing in Drupal using the CodeMirror Editor module. What are
    the main ways it lets me use CodeMirror (on a text format, on a field, in content, in a custom form)?
  criteria: 'It provides plugins all with id codemirror_editor: an Editor plugin for a text format''s
    editor, a Filter plugin to render code in content, and a field widget + field formatter for string_long/text_long
    fields; plus a #type => ''codemirror'' render element for custom forms and a codemirror_mode plugin
    type for language modes.'
  bundle: codemirror_editor
  rubric_ref: rubric/codemirror_editor_codemirror_editor_what_it_provides@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: codemirror_editor-settings-keys
  input: Where are the global settings for the Drupal CodeMirror Editor module, and which keys control
    loading the library from a CDN, the editor theme, and which language modes are preloaded?
  criteria: 'The settings form is at /admin/config/content/codemirror (permission ''administer codemirror
    editor'') and edits the codemirror_editor.settings config object: cdn (load from CDN, default true),
    minified (default true), theme (default ''default''), and language_modes (sequence of mode ids, default
    [xml]).'
  bundle: codemirror_editor
  rubric_ref: rubric/codemirror_editor_codemirror_editor_settings_keys@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: codemirror_editor-drush-download
  input: If I turn off the CDN option in the CodeMirror Editor module and want to self-host the CodeMirror
    library, is there a Drush command to fetch it? What is it?
  criteria: 'Yes: run `drush codemirror:download` (alias codemirror-download). It downloads the CodeMirror
    JS/CSS into libraries/codemirror so the module can self-host it when codemirror_editor.settings cdn
    is false.'
  bundle: codemirror_editor
  rubric_ref: rubric/codemirror_editor_codemirror_editor_drush_download@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: codemirror_editor-known-theme
  input: On this Drupal site the CodeMirror Editor module has a non-default editor theme configured. Inspect
    the live configuration and state which CodeMirror theme is set.
  criteria: 'The theme is ''material'': codemirror_editor.settings has theme set to material (and language_modes
    [css, javascript, twig]).'
  bundle: codemirror_editor
  rubric_ref: rubric/codemirror_editor_codemirror_editor_known_theme@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/codemirror_editor-known-theme-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/codemirror_editor-known-theme-cleanup.sh
- id: codemirror_editor-known-cdn
  input: On this Drupal site, is the CodeMirror library being loaded from a CDN or self-hosted? Inspect
    the CodeMirror Editor configuration and say which, and how you can tell.
  criteria: 'It is self-hosted, not from a CDN: codemirror_editor.settings has cdn set to false, which
    means the library must be served locally from libraries/codemirror.'
  bundle: codemirror_editor
  rubric_ref: rubric/codemirror_editor_codemirror_editor_known_cdn@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/codemirror_editor-known-cdn-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/codemirror_editor-known-cdn-cleanup.sh
- id: codemirror_editor-set-modes
  input: On this Drupal site, configure the CodeMirror Editor module so that the CSS and Twig language
    modes are preloaded globally (in addition to whatever is already there). Apply the change to the live
    site.
  criteria: codemirror_editor.settings language_modes includes both 'css' and 'twig' (e.g. add them on
    the settings form at /admin/config/content/codemirror, or set the language_modes sequence in config
    and save).
  bundle: codemirror_editor
  rubric_ref: rubric/codemirror_editor_codemirror_editor_set_modes@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
