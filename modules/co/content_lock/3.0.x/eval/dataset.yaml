metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: content_lock
  version: 3.0.x
  note: Content Lock implements pessimistic edit locking via a form_alter + the `content_lock` service,
    a `content_lock.settings` config object, two permissions, dynamically generated break-lock routes,
    a lockability hook, and events. Cases are `recipe` (response-graded) probing documented facts an agent
    would otherwise read source to answer; no site mutation.
questions:
- id: content-lock-strategy
  input: On a Drupal 11 site, what locking strategy does the Content Lock module use, and what happens
    to a second user who opens the edit form of an entity another user is already editing?
  criteria: 'Pessimistic locking: the entity is exclusively locked while the first user edits; a second
    user gets the edit form fully disabled (read-only) and a message naming the lock owner. The lock releases
    on submit or navigating away.'
  bundle: content_lock
  rubric_ref: rubric/content_lock_content_lock_strategy@1.0
  tags:
  - mode:recipe
- id: content-lock-enable-entity-type
  input: How do I make the node entity type (and optionally only certain bundles) lockable in Content
    Lock? Name the config object and the key that stores which entity types/bundles are locked.
  criteria: At /admin/config/content/content_lock (route content_lock.settings) enable the entity type
    and pick bundles; stored in the content_lock.settings config under the `types` key as types.{entity_type_id}
    = list of bundles (or '*' for all).
  bundle: content_lock
  rubric_ref: rubric/content_lock_content_lock_enable_entity_type@1.0
  tags:
  - mode:recipe
- id: content-lock-break-permission
  input: Which permission lets a user forcibly release (break) another user's content lock in the Content
    Lock module, and what is the other permission it defines?
  criteria: '''break content lock'' lets a user break someone else''s lock; ''administer content lock''
    gates the settings form. A user can always release their own lock even without ''break content lock''.'
  bundle: content_lock
  rubric_ref: rubric/content_lock_content_lock_break_permission@1.0
  tags:
  - mode:recipe
- id: content-lock-service-api
  input: In PHP on a Drupal 11 site, which service and method do I call to try to lock an entity for the
    current user, and which method releases the lock?
  criteria: Use the `content_lock` service (ContentLockInterface). locking($entity, $form_op, $uid) attempts
    the lock (returns TRUE if held by this user, FALSE if locked by another); release($entity, $form_op,
    $uid) releases it.
  bundle: content_lock
  rubric_ref: rubric/content_lock_content_lock_service_api@1.0
  tags:
  - mode:recipe
- id: content-lock-form-op-modes
  input: Content Lock can restrict locking to specific entity form operations. What are the three form-operation
    lock modes it supports?
  criteria: Disabled (0, lock on any form op), Allowlist (1, only lock the selected operations), Denylist
    (2, lock all except the selected operations) — the ContentLockInterface FORM_OP_MODE_* constants,
    stored under form_op_lock.{type}.mode.
  bundle: content_lock
  rubric_ref: rubric/content_lock_content_lock_form_op_modes@1.0
  tags:
  - mode:recipe
- id: content-lock-timeout
  input: How does Content Lock deal with stale/forgotten locks, which config key holds the timeout, and
    in what unit is it stored versus shown in the form?
  criteria: The `timeout` key on content_lock.settings stores seconds (default 1800) but the settings
    form edits it in minutes (30). Locks past the timeout are stale; releaseExpiredLocks() frees them,
    and the deprecated content_lock_timeout submodule auto-releases them.
  bundle: content_lock
  rubric_ref: rubric/content_lock_content_lock_timeout@1.0
  tags:
  - mode:recipe
- id: content-lock-lockable-hook
  input: In a custom Drupal module, which hook do I implement to make certain entities un-lockable (excluded
    from Content Lock)?
  criteria: Implement hook_content_lock_entity_lockable($entity, $config, $form_op); return FALSE to make
    the entity un-lockable (default TRUE). It is called from the service's isLockable().
  bundle: content_lock
  rubric_ref: rubric/content_lock_content_lock_lockable_hook@1.0
  tags:
  - mode:recipe
