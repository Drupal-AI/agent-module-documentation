rubrics:
- id: content_lock_content_lock_strategy
  version: '1.0'
  applicable_bundles:
  - content_lock
  checks:
  - kind: must_contain_any
    values:
    - pessimistic
    - disabled
    - '#disabled'
  - kind: must_not_contain
    values:
    - optimistic
  scoring:
    combine: all_pass
- id: content_lock_content_lock_enable_entity_type
  version: '1.0'
  applicable_bundles:
  - content_lock
  checks:
  - kind: must_contain_any
    values:
    - content_lock.settings
    - types
  scoring:
    combine: all_pass
- id: content_lock_content_lock_break_permission
  version: '1.0'
  applicable_bundles:
  - content_lock
  checks:
  - kind: must_contain_any
    values:
    - break content lock
  scoring:
    combine: all_pass
- id: content_lock_content_lock_service_api
  version: '1.0'
  applicable_bundles:
  - content_lock
  checks:
  - kind: must_contain_any
    values:
    - content_lock
    - locking(
    - release(
  scoring:
    combine: all_pass
- id: content_lock_content_lock_form_op_modes
  version: '1.0'
  applicable_bundles:
  - content_lock
  checks:
  - kind: must_contain_any
    values:
    - allowlist
    - denylist
    - FORM_OP_MODE
  scoring:
    combine: all_pass
- id: content_lock_content_lock_timeout
  version: '1.0'
  applicable_bundles:
  - content_lock
  checks:
  - kind: must_contain_any
    values:
    - timeout
    - releaseExpiredLocks
  scoring:
    combine: all_pass
- id: content_lock_content_lock_lockable_hook
  version: '1.0'
  applicable_bundles:
  - content_lock
  checks:
  - kind: must_contain_any
    values:
    - hook_content_lock_entity_lockable
    - content_lock_entity_lockable
  scoring:
    combine: all_pass
