metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: colorbox_field_formatter
  version: 2.1.x
  note: 'Colorbox Field Formatter provides three @FieldFormatter plugins assigned on Manage display (no
    admin page, configure=null; requires the Colorbox module): colorbox_field_formatter (string/computed),
    colorbox_field_formatter_image (image, adds image_style + special ''hide''), colorbox_field_formatter_entityreference
    (entity_reference, hides link_type/link). Settings live in the entity_view_display component: style
    (default|colorbox-inline|colorbox-node), link_type (content|manual), link (URI, token-aware), width,
    height, iframe, inline_selector, anchor, class, rel; image variant adds image_style. Each item renders
    as <a class="colorbox <style>"> with ?width=&height= query. Medium cases read back a live view-display
    component''s colorbox settings (a distinctive width; a manual link target); hard cases switch a field
    to the colorbox formatter and tune its popup width + iframe, verified against the live entity_view_display.'
questions:
- id: cff-what-it-does
  input: How do I make a field on my Drupal content type open in a Colorbox lightbox using the colorbox_field_formatter
    module? Where do I set it?
  criteria: On the entity's Manage display, set the field's Format to one of the module's Colorbox FF
    formatters (colorbox_field_formatter for string/computed, colorbox_field_formatter_image for image,
    colorbox_field_formatter_entityreference for entity_reference). Settings are stored in the entity_view_display
    component. Requires the Colorbox module.
  bundle: colorbox_field_formatter
  rubric_ref: rubric/colorbox_field_formatter_cff_what_it_does@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: cff-link-target
  input: With colorbox_field_formatter, can the Colorbox link point somewhere other than the entity's
    own page? What setting controls the link destination?
  criteria: Yes. The 'Link colorbox to' setting (link_type) is either 'content' (the entity's canonical
    URL) or 'manual', where you type a URI in the 'link' setting that is token-replaced when the Token
    module is enabled.
  bundle: colorbox_field_formatter
  rubric_ref: rubric/colorbox_field_formatter_cff_link_target@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: cff-image-and-rel
  input: In colorbox_field_formatter, which formatter handles image fields and lets me pick an image style,
    and which setting groups several links into one Colorbox gallery?
  criteria: colorbox_field_formatter_image handles image fields and adds an 'Image style' setting (any
    style, or 'hide' to suppress the image). The 'rel' setting assigns a Colorbox group id so matching
    links cycle as a gallery.
  bundle: colorbox_field_formatter
  rubric_ref: rubric/colorbox_field_formatter_cff_image_and_rel@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: cff-known-width
  input: On this Drupal site, the Article field field_cff_known is displayed with the Colorbox field formatter.
    Inspect the live display configuration and state the Colorbox popup width it is configured to use.
  criteria: 'Width 777: core.entity_view_display.node.article.default content.field_cff_known.settings.width
    = 777 (type colorbox_field_formatter).'
  bundle: colorbox_field_formatter
  rubric_ref: rubric/colorbox_field_formatter_cff_known_width@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/colorbox_field_formatter-known-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/colorbox_field_formatter-known-cleanup.sh
- id: cff-manual-link
  input: On this Drupal site, the Article field field_cff_link uses the Colorbox formatter with a manually
    entered link. Inspect the live display configuration and give the URL/path the Colorbox links to.
  criteria: 'It links to /cff-target-page: the component has link_type = manual and link = /cff-target-page
