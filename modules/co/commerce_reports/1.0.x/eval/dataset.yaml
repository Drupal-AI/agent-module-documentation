metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: commerce_reports
  version: 1.0.x
  note: 'Commerce Reporting adds a commerce_order_report content entity whose bundles are commerce_report_type
    plugins (built-ins: order_report, order_items_report, promotion_report, tax_report). Reports are generated
    by OrderReportGenerator on the commerce_order.place.post_transition event. UI at /admin/commerce/reports
    (perm access commerce reports); Generate-reports form at /admin/commerce/config/reports/generate-reports
    (perm generate commerce order reports). Medium introspection creates a known commerce_order_report
    entity and the agent reads back its contact email; hard execution grants the module''s two permissions
    to a role, verified on the role config. Fixtures create/delete their own report entity (by unique
    mail) and their own role.'
questions:
- id: commerce_reports-plugin-type
  input: In the commerce_reports module, what is a 'report type', and which report types ship out of the
    box?
  criteria: 'A report type is a plugin of the commerce_report_type plugin type (annotation @CommerceReportType);
    each is also a bundle of the commerce_order_report entity. Built-ins: order_report, order_items_report,
    promotion_report, tax_report.'
  bundle: commerce_reports
  rubric_ref: rubric/commerce_reports_commerce_reports_plugin_type@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: commerce_reports-when-generated
  input: How and when does commerce_reports create report records for orders, and how can you rebuild
    them for historical orders?
  criteria: An event subscriber on commerce_order.place.post_transition records placed orders and, on
    request destruction, OrderReportGenerator creates a commerce_order_report per report type. To backfill/rebuild
    for historical orders, use the 'Generate reports' form at /admin/commerce/config/reports/generate-reports
    (or the generator's refreshReports()).
  bundle: commerce_reports
  rubric_ref: rubric/commerce_reports_commerce_reports_when_generated@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: commerce_reports-view-url
  input: Where does a store admin view the Commerce reports, and what permission is required?
  criteria: At /admin/commerce/reports (each report type at /admin/commerce/reports/{report_type_id}/{type},
    default grouping month). The 'access commerce reports' permission is required.
  bundle: commerce_reports
  rubric_ref: rubric/commerce_reports_commerce_reports_view_url@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: commerce_reports-known-report
  input: This store already has one generated order report (a commerce_order_report of type order_report).
    Inspect the live site and report the contact email stored on that order report.
  criteria: The single commerce_order_report (bundle order_report) has mail = creport-known@example.test
    (load commerce_order_report entities and read the mail field).
  bundle: commerce_reports
  rubric_ref: rubric/commerce_reports_commerce_reports_known_report@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/commerce_reports-known-report-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/commerce_reports-known-report-cleanup.sh
- id: commerce_reports-grant-perms
  input: There is a role 'creports_analyst' on this site. Using the commerce_reports module's permissions,
    allow that role both to view the commerce reports and to regenerate order reports. Apply it to the
    live site.
  criteria: Role creports_analyst is granted both 'access commerce reports' and 'generate commerce order
    reports' (e.g. drush role:perm:add creports_analyst 'access commerce reports' and the same for 'generate
    commerce order reports').
  bundle: commerce_reports
  rubric_ref: rubric/commerce_reports_commerce_reports_grant_perms@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/commerce_reports-grant-perms-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/commerce_reports-grant-perms-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/commerce_reports-grant-perms-verify.sh
- id: commerce_reports-count
  input: This store has several generated order reports (commerce_order_report entities) that all record
    the contact email creport-count@example.test. Inspect the live site and report how many commerce_order_report
    entities have that contact email.
  criteria: There are 3 commerce_order_report entities whose mail field is creport-count@example.test.
    Query the commerce_order_report storage by mail.
  bundle: commerce_reports
  rubric_ref: rubric/commerce_reports_commerce_reports_count@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/commerce_reports-count-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/commerce_reports-count-cleanup.sh
- id: commerce_reports-record-report
  input: 'On this site, record a Commerce order report: create a commerce_order_report of type ''order_report''
    for order id 5150 with a total amount of 75.00 USD and contact email buyer5150@example.test. Apply
    it to the live site.'
  criteria: A commerce_order_report entity of bundle order_report exists with order_id 5150, amount 75.00
