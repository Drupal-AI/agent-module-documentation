rubrics:
- id: commerce_usps_commerce_usps_plugin_ids
  version: '1.0'
  applicable_bundles:
  - commerce_usps
  checks:
  - kind: must_contain_any
    values:
    - usps_international
    - usps
  scoring:
    combine: all_pass
- id: commerce_usps_commerce_usps_api_credentials
  version: '1.0'
  applicable_bundles:
  - commerce_usps
  checks:
  - kind: must_contain_any
    values:
    - client_id
    - Consumer key
    - secret
    - OAuth
    - mode
  scoring:
    combine: all_pass
- id: commerce_usps_commerce_usps_alter_event
  version: '1.0'
  applicable_bundles:
  - commerce_usps
  checks:
  - kind: must_contain_any
    values:
    - before_rate_request
    - BEFORE_RATE_REQUEST
    - USPSRateRequestEvent
  scoring:
    combine: all_pass
- id: commerce_usps_commerce_usps_known_label
  version: '1.0'
  applicable_bundles:
  - commerce_usps
  checks:
  - kind: must_contain_any
    values:
    - USPS Priority (known)
  scoring:
    combine: all_pass
- id: commerce_usps_commerce_usps_known_mode
  version: '1.0'
  applicable_bundles:
  - commerce_usps
  checks:
  - kind: must_contain_any
    values:
    - live
  scoring:
    combine: all_pass
- id: commerce_usps_commerce_usps_create_method
  version: '1.0'
  applicable_bundles:
  - commerce_usps
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
- id: commerce_usps_commerce_usps_set_label
  version: '1.0'
  applicable_bundles:
  - commerce_usps
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
