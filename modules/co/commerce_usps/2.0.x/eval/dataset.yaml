  criteria: The commerce_shipping_method named cusps_known uses plugin usps and its plugin configuration
    rate_label is 'USPS Priority (known)'.
  bundle: commerce_usps
  rubric_ref: rubric/commerce_usps_commerce_usps_known_label@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/commerce_usps-known-label-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/commerce_usps-known-label-cleanup.sh
