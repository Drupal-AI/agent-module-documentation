metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: commerce_usps
  version: 2.0.x
  note: 'Commerce USPS provides two @CommerceShippingMethod plugins: usps (USPSDomestic) and usps_international
    (USPSInternational), sharing USPSBase. Config is stored on a commerce_shipping_method config entity''s
    plugin configuration (schema commerce_usps.shipping_method_configuration): rate_label, api_information.{client_id,secret,mode},
    rate_options.*, options.{tracking_url,log}. 2.x uses the current USPS OAuth API (Consumer key=client_id,
    Consumer secret, mode test/live). Event USPSEvents::BEFORE_RATE_REQUEST = commerce_usps.before_rate_request
    (USPSRateRequestEvent). Requires commerce_shipping. Medium/hard cases build/read a real commerce_shipping_method
    (cusps_*) attached to a throwaway store (cusps_store); they do NOT call the live USPS API (no credentials),
    only exercise the shipping-method configuration.'
questions:
- id: commerce_usps-plugin-ids
  input: I want to add USPS shipping rates to a Drupal Commerce store. Which shipping-method plugins does
    the commerce_usps module provide, and how do they differ?
  criteria: 'Two @CommerceShippingMethod plugins: usps (USPS Domestic / USPSDomestic) for US shipments
    and usps_international (USPS International / USPSInternational) for shipments outside the US. You
    add a Commerce shipping method and choose one of these plugins.'
  bundle: commerce_usps
  rubric_ref: rubric/commerce_usps_commerce_usps_plugin_ids@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: commerce_usps-api-credentials
  input: What credentials does commerce_usps 2.x need to talk to the USPS API, and where are they entered?
    Is it the old USERID web-tools API?
  criteria: 'The 2.x branch uses the current USPS OAuth API: a Consumer key (client_id), a Consumer secret
    (secret), and a mode (test or live), entered under ''API information'' on the shipping method''s plugin
    configuration. It is not the legacy USERID web-tools API.'
  bundle: commerce_usps
  rubric_ref: rubric/commerce_usps_commerce_usps_api_credentials@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: commerce_usps-alter-event
  input: In commerce_usps, how can custom code modify the request sent to USPS before rates are fetched?
    Name the event.
  criteria: Subscribe to the USPSEvents::BEFORE_RATE_REQUEST event (event name 'commerce_usps.before_rate_request'),
    which dispatches a USPSRateRequestEvent you can use to alter the outgoing request.
  bundle: commerce_usps
  rubric_ref: rubric/commerce_usps_commerce_usps_alter_event@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: commerce_usps-known-label
  input: This Commerce site has a USPS shipping method configured (its entity name is cusps_known). Inspect
