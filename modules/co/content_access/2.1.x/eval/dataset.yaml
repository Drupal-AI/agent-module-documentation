metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: content_access
  version: 2.1.x
  note: Content Access adds role-based view/edit/delete node access per content type and optionally per
    node (and per user via ACL), on top of core node grants. Cases are `recipe` (response-graded) — they
    probe documented facts an agent would otherwise read source to answer; no site mutation.
questions:
- id: content-access-type-tab-location
  input: On Drupal 11 with Content Access enabled, where do I set the default view/edit/delete access
    by role for a whole content type? Give the tab/path.
  criteria: On the content type's 'Access control' tab at /admin/structure/types/manage/{type}/access
    (ContentAccessAdminSettingsForm); requires 'bypass node access' + 'administer content types'.
  bundle: content_access
  rubric_ref: rubric/content_access_content_access_type_tab_location@1.0
  tags:
  - mode:recipe
- id: content-access-per-node
  input: I want to override content access on one specific node instead of the whole content type. How
    do I enable and reach a node's own access settings?
  criteria: Enable 'Per content node access control' (per_node) on the content type; each node then gets
    an 'Access control' tab at /node/{node}/access to override the type defaults.
  bundle: content_access
  rubric_ref: rubric/content_access_content_access_per_node@1.0
  tags:
  - mode:recipe
- id: content-access-operations
  input: Which access operations can Content Access control per role, and which ones are the new permissions
    it adds versus reused core permissions?
  criteria: view (any), view own, update/edit (any + own), delete (any + own). The two 'view' operations
    are new; edit/delete map to core edit/delete any/own {type} content permissions.
  bundle: content_access
  rubric_ref: rubric/content_access_content_access_operations@1.0
  tags:
  - mode:recipe
- id: content-access-node-grants
  input: How does Content Access integrate with Drupal's node access grants system, and what grant realms
    does it write?
  criteria: It implements hook_node_grants() and hook_node_access_records(), writing grants in the realms
    content_access_roles (role grants) and content_access_author (author grants); grants are optimized
    so only those differing from core permissions are stored.
  bundle: content_access
  rubric_ref: rubric/content_access_content_access_node_grants@1.0
  tags:
  - mode:recipe
- id: content-access-per-user-acl
  input: I need to grant view/edit/delete on a single node to specific named users (not roles) with Content
    Access. What do I need?
  criteria: Enable the contributed ACL module and turn on per-node access for the type; the node's Access
    control tab then shows a 'User access control lists' section to grant view/edit/delete to specific
    users.
  bundle: content_access
  rubric_ref: rubric/content_access_content_access_per_user_acl@1.0
  tags:
  - mode:recipe
- id: content-access-grant-permissions
  input: Which Content Access permission lets an editor manage the per-node access tab for any node, and
    which one restricts them to their own nodes?
  criteria: '''grant content access'' gates the per-node tab for any node; ''grant own content access''
    restricts it to the user''s own nodes.'
  bundle: content_access
  rubric_ref: rubric/content_access_content_access_grant_permissions@1.0
  tags:
  - mode:recipe
- id: content-access-read-settings-api
  input: In PHP, how do I read a content type's Content Access view-role settings and save updated settings
    programmatically?
  criteria: content_access_get_settings('view', $type) reads a setting; content_access_set_settings($settings,
    $type) writes them (stored as node-type third-party settings).
  bundle: content_access
  rubric_ref: rubric/content_access_content_access_read_settings_api@1.0
  tags:
  - mode:recipe
- id: content-access-per-node-hook
  input: In a custom Drupal module I want to react when someone saves per-node Content Access settings.
    Which hook do I implement (current, non-deprecated)?
  criteria: Implement hook_content_access_per_node(array $settings, NodeInterface $node); the older hook_per_node()
    is deprecated.
  bundle: content_access
  rubric_ref: rubric/content_access_content_access_per_node_hook@1.0
  tags:
  - mode:recipe
