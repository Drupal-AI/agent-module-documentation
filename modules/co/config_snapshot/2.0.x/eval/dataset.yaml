metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: config_snapshot
  version: 2.0.x
  note: Configuration Snapshot is a developer API module (depends on core config). No UI, no configure
    route (configure=null), no permissions, no Drush, no plugin types. It stores per-extension snapshots
    of configuration as config_snapshot config entities (config_snapshot.snapshot.<set>.<type>.<name>;
    entity id <set>.<type>.<name>) and exposes each as a core StorageInterface via ConfigSnapshotStorage.
    A snapshot is addressed by snapshotSet + extensionType (module/theme) + extensionName; items are {collection,name,data}.
    Get a storage with ConfigSnapshotStorageTrait::getConfigSnapshotStorage(); ConfigSnapshotServiceProvider
    registers a service per snapshot. Medium/hard cases are grounded in real snapshot entities created
    via ConfigSnapshotStorage, namespaced cs_*.
questions:
- id: config_snapshot-what
  input: What does the Drupal config_snapshot module provide, and does it have an admin UI or Drush commands?
    What Drupal interface do its snapshots implement so you can read/write config through them?
  criteria: It is a developer API module that stores per-extension snapshots of configuration as config_snapshot
    config entities. It has no admin UI, no route, and no Drush commands. Each snapshot is exposed as
    a core StorageInterface via ConfigSnapshotStorage (read/write/listAll). Other modules like Features
    use it to detect config drift.
  bundle: config_snapshot
  rubric_ref: rubric/config_snapshot_config_snapshot_what@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: config_snapshot-get-storage
  input: In code, what is the recommended way to obtain a config snapshot storage in the config_snapshot
    module (the trait and method), and why is it preferred over just calling `new ConfigSnapshotStorage(...)`?
  criteria: Use ConfigSnapshotStorageTrait::getConfigSnapshotStorage($set, $type, $name, $collection).
    It returns the registered container service config_snapshot.<set>.<type>.<name> when available, and
    falls back to a fresh ConfigSnapshotStorage object when the service does not exist yet (e.g. right
    after an extension is installed, before the container is rebuilt).
  bundle: config_snapshot
  rubric_ref: rubric/config_snapshot_config_snapshot_get_storage@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: config_snapshot-coordinates
  input: A config_snapshot snapshot is identified by three parts. What are they, and what is the resulting
    config entity id / config object name format?
  criteria: The three parts are snapshotSet (namespace per consuming module), extensionType (module or
    theme) and extensionName. The config entity id is <set>.<type>.<name> and it is persisted as config_snapshot.snapshot.<set>.<type>.<name>.
  bundle: config_snapshot
  rubric_ref: rubric/config_snapshot_config_snapshot_coordinates@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: config_snapshot-find-id
  input: On this Drupal site there is exactly one config_snapshot snapshot present. Inspect the live configuration
    and give the config snapshot entity id (in the form snapshotSet.extensionType.extensionName).
  criteria: The snapshot entity id is cs_eval.module.cs_evalmod (stored as config object config_snapshot.snapshot.cs_eval.module.cs_evalmod).
    snapshotSet=cs_eval, extensionType=module, extensionName=cs_evalmod.
  bundle: config_snapshot
  rubric_ref: rubric/config_snapshot_config_snapshot_find_id@1.0
  tags:
  - mode:introspection
  - difficulty:medium
