rubrics:
- id: config_log_config_log_destinations
  version: '1.0'
  applicable_bundles:
  - config_log
  checks:
  - kind: must_contain_any
    values:
    - config_log
    - custom table
    - watchdog
    - dblog
    - default logging
    - mail
    - email
  scoring:
    combine: all_pass
- id: config_log_config_log_redaction
  version: '1.0'
  applicable_bundles:
  - config_log
  checks:
  - kind: must_contain_any
    values:
    - redact
    - '[redacted]'
    - redact_sensitive_config_values
    - sensitive
  scoring:
    combine: all_pass
- id: config_log_config_log_retention_cron
  version: '1.0'
  applicable_bundles:
  - config_log
  checks:
  - kind: must_contain_any
    values:
    - logs_to_keep
    - cron
    - retention
    - row limit
  scoring:
    combine: all_pass
- id: config_log_config_log_retention_value
  version: '1.0'
  applicable_bundles:
  - config_log
  checks:
  - kind: must_contain_any
    values:
    - '1000'
  scoring:
    combine: all_pass
- id: config_log_config_log_ignored_pattern
  version: '1.0'
  applicable_bundles:
  - config_log
  checks:
  - kind: must_contain_any
    values:
    - system.*
  scoring:
    combine: all_pass
- id: config_log_config_log_enable_default_destination
  version: '1.0'
  applicable_bundles:
  - config_log
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
- id: config_log_config_log_ignore_user_config
  version: '1.0'
  applicable_bundles:
  - config_log
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
