rubrics:
- id: config_log_views_config_log_views_report_path
  version: '1.0'
  applicable_bundles:
  - config_log_views
  checks:
  - kind: must_contain_any
    values:
    - admin/reports/config-log
    - config-log
    - Reports
    - diff
  scoring:
    combine: all_pass
- id: config_log_views_config_log_views_diff_field
  version: '1.0'
  applicable_bundles:
  - config_log_views
  checks:
  - kind: must_contain_any
    values:
    - config_log_diff
    - diff
    - originaldata
    - DiffFormatter
  scoring:
    combine: all_pass
- id: config_log_views_config_log_views_base_table
  version: '1.0'
  applicable_bundles:
  - config_log_views
  checks:
  - kind: must_contain_any
    values:
    - config_log
    - base table
    - hook_views_data
    - Configuration Name
  scoring:
    combine: all_pass
- id: config_log_views_config_log_views_context_value
  version: '1.0'
  applicable_bundles:
  - config_log_views
  checks:
  - kind: must_contain_any
    values:
    - '3'
  scoring:
    combine: all_pass
- id: config_log_views_config_log_views_known_row
  version: '1.0'
  applicable_bundles:
  - config_log_views
  checks:
  - kind: must_contain_any
    values:
    - clv_eval_marker.settings
    - clv_eval_marker
  scoring:
    combine: all_pass
- id: config_log_views_config_log_views_set_context
  version: '1.0'
  applicable_bundles:
  - config_log_views
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
- id: config_log_views_config_log_views_restore_view
  version: '1.0'
  applicable_bundles:
  - config_log_views
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
