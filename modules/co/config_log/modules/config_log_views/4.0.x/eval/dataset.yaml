metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: config_log_views
  version: 4.0.x
  note: 'config_log_views is the Views submodule of config_log. It registers the config_log DB table as
    a Views base table (hook_views_data), adds the config_log_diff virtual field plugin that diffs originaldata
    vs data using core DiffFormatter and the leading/trailing_context_lines from config_log.settings,
    and installs the views.view.config_log report at admin/reports/config-log. No config UI of its own
    (configure -> config_log.admin), no permissions, no plugin types. Medium/hard cases are grounded in
    real state: introspection reads the diff-context settings and a known config_log table row surfaced
    by the view; execution sets the diff context lines and restores the deleted report view, both verified
    against live config/DB.'
questions:
- id: config_log_views-report-path
  input: I enabled config_log_views. Where can I see the browsable report of configuration changes in
    the Drupal admin, and what does each row show?
  criteria: It ships the view views.view.config_log with a Page display at admin/reports/config-log (menu
    'Config Log' under Reports). Each row shows the change plus a From/To diff of the config produced
    by the config_log_diff field.
  bundle: config_log_views
  rubric_ref: rubric/config_log_views_config_log_views_report_path@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: config_log_views-diff-field
  input: In config_log_views, which Views field handler renders the configuration diff, and what does
    it compare?
  criteria: The custom Views field plugin config_log_diff (class ConfigLogDiff) compares the row's originaldata
    YAML against its data YAML using core's DiffFormatter, honouring config_log.settings leading/trailing_context_lines,
    and renders a From/To diff table.
  bundle: config_log_views
  rubric_ref: rubric/config_log_views_config_log_views_diff_field@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: config_log_views-base-table
  input: What database table does config_log_views expose to Views, and how would I build my own report
    of configuration changes filtered by config name?
  criteria: It exposes the config_log table as a Views base table via hook_views_data(), with fields clid,
    uid (relationship to users), created, data, originaldata, name (Configuration Name), old_name, and
    the config_log_diff field. Build a new view on the 'Config log' base table and add a filter/exposed
    filter on the name field.
  bundle: config_log_views
  rubric_ref: rubric/config_log_views_config_log_views_base_table@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: config_log_views-context-value
  input: The Config Log report's diff field shows some unchanged context lines around each change. Inspect
    the live configuration and state how many leading context lines the diff is currently set to show.
  criteria: config_log.settings:leading_context_lines is 3 (and trailing_context_lines is 3); the config_log_diff
    field reads these when formatting each diff.
  bundle: config_log_views
  rubric_ref: rubric/config_log_views_config_log_views_context_value@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/config_log_views-context-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/config_log_views-context-cleanup.sh
- id: config_log_views-known-row
  input: The Config Log report (config_log table) on this site already has a logged configuration change.
    Inspect the live config_log data and give the configuration object name of that logged change.
  criteria: The config_log table contains a row with name = clv_eval_marker.settings (operation update),
    which the config_log view surfaces at admin/reports/config-log.
  bundle: config_log_views
  rubric_ref: rubric/config_log_views_config_log_views_known_row@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/config_log_views-row-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/config_log_views-row-cleanup.sh
- id: config_log_views-set-context
  input: Configure the Config Log report so that each configuration diff shows 2 unchanged context lines
    before and 2 after every change. Apply the change to the live site.
  criteria: Set config_log.settings:leading_context_lines = 2 and trailing_context_lines = 2 (these drive
    the config_log_diff field's DiffFormatter).
  bundle: config_log_views
  rubric_ref: rubric/config_log_views_config_log_views_set_context@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/config_log_views-context-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/config_log_views-context-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/config_log_views-context-verify.sh
- id: config_log_views-restore-view
  input: The Config Log report view (views.view.config_log) has been deleted from this site. Restore it
    so the report is once again available at admin/reports/config-log over the config_log table. Apply
    the change to the live site.
  criteria: The views.view.config_log config entity exists again with base_table config_log and a display
