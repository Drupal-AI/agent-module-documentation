metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: consumer_image_styles
  version: 4.0.x
  note: Consumer Image Styles bridges Consumers + JSON:API. It adds an unlimited entity_reference base
    field 'image_styles' (target image_style) to the consumer entity (consumer_image_styles_entity_base_field_info),
    a normalizer decorator (serializer.normalizer.link_collection.consumer_image_styles) that adds derivative
    links to image files per the negotiated consumer's styles, a jsonapi_extras ResourceFieldEnhancer
    plugin id 'image_styles', and the service consumer_image_styles.image_styles_provider (loadStyles/buildDerivativeLink).
    No admin settings page of its own. Image styles thumbnail/medium/large exist on this site. Medium/hard
    cases create namespaced consumers (client_id cis_*) and set/read their image_styles field.
questions:
- id: consumer_image_styles-field
  input: How does consumer_image_styles let you say which image styles a decoupled consumer needs? Name
    the field it adds and the entity it adds it to.
  criteria: It adds an unlimited entity_reference base field 'image_styles' (target type image_style)
    to the consumer entity, edited on the consumer's form; each consumer lists the image styles it needs.
  bundle: consumer_image_styles
  rubric_ref: rubric/consumer_image_styles_consumer_image_styles_field@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: consumer_image_styles-enhancer
  input: consumer_image_styles can add image-style derivative links to a specific image field in JSON:API.
    What JSON:API field enhancer plugin does it provide (id), and which module configures it?
  criteria: It provides a jsonapi_extras ResourceFieldEnhancer plugin with id 'image_styles' (class ImageStyles)
    that you attach to an image field via jsonapi_extras; it adds derivative links (optionally refined
    to a custom style selection).
  bundle: consumer_image_styles
  rubric_ref: rubric/consumer_image_styles_consumer_image_styles_enhancer@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: consumer_image_styles-service
  input: Which service does consumer_image_styles provide to load a consumer's configured image styles
    and build derivative links, and what are the relevant methods?
  criteria: 'Service consumer_image_styles.image_styles_provider (ImageStylesProvider): loadStyles($consumer)
    returns the consumer''s image styles; buildDerivativeLink($uri, $imageStyle, $cacheableMetadata) returns
    a JSON:API link array with the absolute derivative URL and width/height/type meta.'
  bundle: consumer_image_styles
  rubric_ref: rubric/consumer_image_styles_consumer_image_styles_service@1.0
