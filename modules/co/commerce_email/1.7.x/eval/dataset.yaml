metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: commerce_email
  version: 1.7.x
  note: 'Commerce Email defines commerce_email config entities that send emails on Commerce events. Each
    entity binds an email event plugin (order_placed -> commerce_order.place.post_transition, order_paid
    -> commerce_order.order.paid, order_transition:*, checkout_register, etc.) to a token-replaced message.
    Recipients: toType ''email'' (address/token in ''to'') or ''role'' (toRole). queue flag defers sending
    to the commerce_email queue. Medium/hard cases create namespaced commerce_email entities (ce_*) and
    read/verify their live config via drush php:eval; cleanup/reset delete the throwaway entities.'
questions:
- id: commerce_email-which-event
  input: In the Commerce Email module, I want to email the customer when their order is placed. Which
    email event should the email use, and what Drupal Commerce (Symfony) event does it map to?
  criteria: 'Use the ''order_placed'' email event, which maps to the Symfony event commerce_order.place.post_transition
    (fired when an order is placed). Create a commerce_email entity with event: order_placed.'
  bundle: commerce_email
  rubric_ref: rubric/commerce_email_commerce_email_which_event@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: commerce_email-recipients
  input: When defining a Commerce Email, how do I control who receives it? What are the options for the
    recipient and which config keys store them?
  criteria: The 'toType' key is either 'email' (a specific address or token stored in 'to', e.g. [commerce_order:mail])
    or 'role' (all users with the role in 'toRole'). You can also set from, cc, bcc and replyTo.
  bundle: commerce_email
  rubric_ref: rubric/commerce_email_commerce_email_recipients@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: commerce_email-queue
  input: How does Commerce Email avoid sending emails synchronously during checkout, and what does it
    use to send them later?
  criteria: Turn on the email's 'queue' option; sending is then deferred to a queue processed on cron.
    If the advancedqueue module is installed it uses the 'commerce_email' Advanced Queue, otherwise the
    core 'commerce_email_queue' queue.
  bundle: commerce_email
  rubric_ref: rubric/commerce_email_commerce_email_queue@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: commerce_email-known-event
  input: On this Drupal Commerce site, there is a Commerce Email with machine name 'ce_known'. Inspect
    its live configuration and state which Commerce event triggers it.
  criteria: 'The ce_known commerce_email entity has event: order_paid (maps to commerce_order.order.paid),
    and is sent to the administrator role.'
  bundle: commerce_email
  rubric_ref: rubric/commerce_email_commerce_email_known_event@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/commerce_email-known-event-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/commerce_email-known-event-cleanup.sh
- id: commerce_email-known-recipient
  input: On this Drupal Commerce site there is a Commerce Email 'ce_recipient'. Inspect its live configuration
    and state exactly what email address (the 'to' value) it sends to.
  criteria: 'ce_recipient has toType: email and to: [commerce_order:mail] (a token that resolves to the
    order''s email address).'
  bundle: commerce_email
  rubric_ref: rubric/commerce_email_commerce_email_known_recipient@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/commerce_email-known-recipient-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/commerce_email-known-recipient-cleanup.sh
- id: commerce_email-order-confirmation
  input: On my Drupal Commerce store, set up an email so that when a customer places an order, they get
    an order-confirmation email at their own email address. Give it the machine name 'ce_confirm' and
    make it active. Apply the change to the live site.
  criteria: Create an enabled commerce_email entity id=ce_confirm with event=order_placed, toType=email
    (to=[commerce_order:mail]), a subject and body. Verified against the live config entity.
  bundle: commerce_email
  rubric_ref: rubric/commerce_email_commerce_email_order_confirmation@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: site-owner
    reset: agent-module-documentation/evaluation/verify/commerce_email-order-confirmation-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/commerce_email-order-confirmation-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/commerce_email-order-confirmation-verify.sh
- id: commerce_email-admin-paid
  input: On this Drupal Commerce site, create a Commerce Email with machine name 'ce_admin_paid' that
    fires on the 'order_paid' event and is sent to all users with the 'administrator' role. Make it enabled
    and apply it to the live site.
  criteria: Create an enabled commerce_email entity id=ce_admin_paid with event=order_paid, toType=role,
    toRole=administrator, plus subject/body. Verified against the live config entity.
  bundle: commerce_email
  rubric_ref: rubric/commerce_email_commerce_email_admin_paid@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/commerce_email-admin-paid-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/commerce_email-admin-paid-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/commerce_email-admin-paid-verify.sh
