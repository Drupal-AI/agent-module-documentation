rubrics:
- id: commerce_email_commerce_email_which_event
  version: '1.0'
  applicable_bundles:
  - commerce_email
  checks:
  - kind: must_contain_any
    values:
    - order_placed
    - commerce_order.place.post_transition
    - place
  scoring:
    combine: all_pass
- id: commerce_email_commerce_email_recipients
  version: '1.0'
  applicable_bundles:
  - commerce_email
  checks:
  - kind: must_contain_any
    values:
    - toType
    - toRole
    - role
    - email address
  scoring:
    combine: all_pass
- id: commerce_email_commerce_email_queue
  version: '1.0'
  applicable_bundles:
  - commerce_email
  checks:
  - kind: must_contain_any
    values:
    - queue
    - advancedqueue
    - commerce_email_queue
    - cron
  scoring:
    combine: all_pass
- id: commerce_email_commerce_email_known_event
  version: '1.0'
  applicable_bundles:
  - commerce_email
  checks:
  - kind: must_contain_any
    values:
    - order_paid
    - order paid
    - paid
  scoring:
    combine: all_pass
- id: commerce_email_commerce_email_known_recipient
  version: '1.0'
  applicable_bundles:
  - commerce_email
  checks:
  - kind: must_contain_any
    values:
    - '[commerce_order:mail]'
    - commerce_order:mail
  scoring:
    combine: all_pass
- id: commerce_email_commerce_email_order_confirmation
  version: '1.0'
  applicable_bundles:
  - commerce_email
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
- id: commerce_email_commerce_email_admin_paid
  version: '1.0'
  applicable_bundles:
  - commerce_email
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
