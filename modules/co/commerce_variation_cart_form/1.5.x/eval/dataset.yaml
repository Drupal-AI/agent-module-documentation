metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: commerce_variation_cart_form
  version: 1.5.x
  note: 'commerce_variation_cart_form adds an ''Add to cart form'' pseudo-field (extra field id commerce_variation_cart_form)
    to Commerce Product Variation displays; when visible it renders a per-variation AddToCartForm. A per-display
    third-party setting ''combine'' (bool, schema core.entity_view_display.*.*.*.third_party.commerce_variation_cart_form)
    controls whether identical variations merge in the cart. There is no admin settings page (configure=null).
    This site has the ''default'' commerce_product_variation type but NO commerce_order_item types, so
    all medium/hard cases are grounded on the variation view display commerce_product_variation.default.default:
    the pseudo-field component visibility + the combine third-party setting, read/written via the entity_display.repository.
    Facts grounded in commerce_variation_cart_form.module (entity_extra_field_info, hook_commerce_product_variation_view,
    the combine third-party setting) and README.'
questions:
- id: cvcf-show-form
  input: I installed commerce_variation_cart_form on my Drupal Commerce site but nothing changed. How
    do I actually make the per-variation add-to-cart form appear for a product variation type?
  criteria: It adds an 'Add to cart form' pseudo-field (id commerce_variation_cart_form) to the Product
    Variation Type's Manage display, hidden by default. Go to Commerce > Configuration > Product Variation
    Types > Manage display and set that field to visible (then typically render the product's Variations
    field as a rendered entity).
  bundle: commerce_variation_cart_form
  rubric_ref: rubric/commerce_variation_cart_form_cvcf_show_form@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: cvcf-combine-setting
  input: In commerce_variation_cart_form, there's an option about combining order items for the same variation.
    What is it, and where/how is that setting stored?
  criteria: 'It''s the ''Combine order items containing the same product variation'' checkbox on the variation
    display-edit form. When on, adding a variation merges with an identical existing cart line. It''s
    stored as a third-party setting on the entity_view_display: third_party_settings.commerce_variation_cart_form.combine
    (boolean).'
  bundle: commerce_variation_cart_form
  rubric_ref: rubric/commerce_variation_cart_form_cvcf_combine_setting@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: cvcf-form-fields
  input: How do I control which fields (e.g. the Quantity field) appear in the add-to-cart form that commerce_variation_cart_form
    renders for a variation?
  criteria: The form uses the 'Variation Cart Form' form mode (variation_cart_form) on the Commerce Order
    Item Type. Go to Commerce > Configuration > Order Item Types > Manage form display, pick the Variation
    Cart Form mode, and show only Quantity (or hide everything for a bare Add to cart button with default
    quantity 1).
  bundle: commerce_variation_cart_form
  rubric_ref: rubric/commerce_variation_cart_form_cvcf_form_fields@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: cvcf-inspect-combine-on
  input: On this Commerce site the per-variation add-to-cart form (commerce_variation_cart_form) has been
    enabled on the default product variation type's default display. Inspect the live display configuration
    and tell me whether identical variations are set to be combined into one cart line.
  criteria: 'Yes — combining is enabled: on core.entity_view_display.commerce_product_variation.default.default
    the commerce_variation_cart_form component''s third_party_settings.commerce_variation_cart_form.combine
    is TRUE.'
  bundle: commerce_variation_cart_form
  rubric_ref: rubric/commerce_variation_cart_form_cvcf_inspect_combine_on@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/commerce_variation_cart_form-combine-on-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/commerce_variation_cart_form-combine-on-cleanup.sh
- id: cvcf-inspect-combine-off
  input: The default product variation type on this site shows the commerce_variation_cart_form add-to-cart
    form. Inspect the live display config and tell me the value of its 'combine' setting.
  criteria: 'combine is FALSE: on core.entity_view_display.commerce_product_variation.default.default
    the commerce_variation_cart_form third-party setting ''combine'' is set to false, so identical variations
    are added as separate cart lines.'
  bundle: commerce_variation_cart_form
  rubric_ref: rubric/commerce_variation_cart_form_cvcf_inspect_combine_off@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/commerce_variation_cart_form-combine-off-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/commerce_variation_cart_form-combine-off-cleanup.sh
- id: cvcf-enable-with-combine
  input: On this Commerce site, use commerce_variation_cart_form to show the per-variation add-to-cart
    form on the DEFAULT product variation type's default view display, and enable the option to combine
    order items for the same variation. Apply it to the live site.
  criteria: core.entity_view_display.commerce_product_variation.default.default has the commerce_variation_cart_form
    component visible AND its third_party_settings.commerce_variation_cart_form.combine === true.
  bundle: commerce_variation_cart_form
  rubric_ref: rubric/commerce_variation_cart_form_cvcf_enable_with_combine@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/commerce_variation_cart_form-enable-combine-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/commerce_variation_cart_form-enable-combine-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/commerce_variation_cart_form-enable-combine-verify.sh
- id: cvcf-separate-lines-layman
  input: On my shop I want an Add to cart button to show on every product variation of my default variation
    type. But if a customer adds the same variation twice, I want it to appear as two separate lines in
    the cart, not merged into one. Set that up on the live site.
  criteria: core.entity_view_display.commerce_product_variation.default.default shows the commerce_variation_cart_form
    component AND its 'combine' setting is NOT enabled (false or unset), so identical variations stay
    as separate cart lines.
  bundle: commerce_variation_cart_form
  rubric_ref: rubric/commerce_variation_cart_form_cvcf_separate_lines_layman@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: site-owner
    reset: agent-module-documentation/evaluation/verify/commerce_variation_cart_form-separate-lines-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/commerce_variation_cart_form-separate-lines-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/commerce_variation_cart_form-separate-lines-verify.sh
