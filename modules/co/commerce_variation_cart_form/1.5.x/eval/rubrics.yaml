rubrics:
- id: commerce_variation_cart_form_cvcf_show_form
  version: '1.0'
  applicable_bundles:
  - commerce_variation_cart_form
  checks:
  - kind: must_contain_any
    values:
    - Manage display
    - Add to cart form
    - commerce_variation_cart_form
    - visible
    - pseudo-field
  scoring:
    combine: all_pass
- id: commerce_variation_cart_form_cvcf_combine_setting
  version: '1.0'
  applicable_bundles:
  - commerce_variation_cart_form
  checks:
  - kind: must_contain_any
    values:
    - combine
    - Combine order items
    - third party setting
    - third_party_settings
  scoring:
    combine: all_pass
- id: commerce_variation_cart_form_cvcf_form_fields
  version: '1.0'
  applicable_bundles:
  - commerce_variation_cart_form
  checks:
  - kind: must_contain_any
    values:
    - variation_cart_form
    - form display
    - form mode
    - Order Item
    - quantity
  scoring:
    combine: all_pass
- id: commerce_variation_cart_form_cvcf_inspect_combine_on
  version: '1.0'
  applicable_bundles:
  - commerce_variation_cart_form
  checks:
  - kind: must_contain_any
    values:
    - 'true'
    - enabled
    - 'yes'
    - combine
  scoring:
    combine: all_pass
- id: commerce_variation_cart_form_cvcf_inspect_combine_off
  version: '1.0'
  applicable_bundles:
  - commerce_variation_cart_form
  checks:
  - kind: must_contain_any
    values:
    - 'false'
    - disabled
    - not combined
  scoring:
    combine: all_pass
- id: commerce_variation_cart_form_cvcf_enable_with_combine
  version: '1.0'
  applicable_bundles:
  - commerce_variation_cart_form
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
- id: commerce_variation_cart_form_cvcf_separate_lines_layman
  version: '1.0'
  applicable_bundles:
  - commerce_variation_cart_form
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
