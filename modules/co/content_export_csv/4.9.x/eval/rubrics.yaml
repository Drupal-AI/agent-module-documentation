rubrics:
- id: content_export_csv_content_export_csv_where
  version: '1.0'
  applicable_bundles:
  - content_export_csv
  checks:
  - kind: must_contain_any
    values:
    - /admin/content/content-export
    - content_export_csv.export
    - access content export
    - Export Content
  scoring:
    combine: all_pass
- id: content_export_csv_content_export_csv_service
  version: '1.0'
  applicable_bundles:
  - content_export_csv
  checks:
  - kind: must_contain_any
    values:
    - content_export_csv.export
    - getNodeCsvData
    - ContentExport
  scoring:
    combine: all_pass
- id: content_export_csv_content_export_csv_options
  version: '1.0'
  applicable_bundles:
  - content_export_csv
  checks:
  - kind: must_contain_any
    values:
    - status
    - published
    - unpublished
    - strip
    - url
    - node url
  scoring:
    combine: all_pass
- id: content_export_csv_content_export_csv_who_can_export
  version: '1.0'
  applicable_bundles:
  - content_export_csv
  checks:
  - kind: must_contain_any
    values:
    - cecsv_exporter
  scoring:
    combine: all_pass
- id: content_export_csv_content_export_csv_exportable_type
  version: '1.0'
  applicable_bundles:
  - content_export_csv
  checks:
  - kind: must_contain_any
    values:
    - cecsv_survey
  scoring:
    combine: all_pass
- id: content_export_csv_content_export_csv_generate
  version: '1.0'
  applicable_bundles:
  - content_export_csv
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
- id: content_export_csv_content_export_csv_grant_access
  version: '1.0'
  applicable_bundles:
  - content_export_csv
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
