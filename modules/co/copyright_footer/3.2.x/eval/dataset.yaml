metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: copyright_footer
  version: 3.2.x
  note: Copyright Footer ships a single Block plugin (id copyright_footer) that renders 'Copyright © <year>
    <organization> <version>' with the current year computed on every build. There is no settings page
    and no configure route (configure=null); all configuration lives on the placed block instance under
    block.block.<id>.settings, validated by schema block.settings.copyright_footer with keys organization_name,
    organization_url, year_origin, year_to_date, version, version_url. Branch 3.2.x adds Drupal 12 support
    (^9 || ^10 || ^11 || ^12); block logic unchanged. Medium cases place a block with a known config for
    the agent to read back; hard cases require the agent to place and configure a block, verified against
    live block config.
questions:
- id: copyright_footer-what-block
  input: In the Drupal contrib module copyright_footer, what does it add to the site and how does the
    copyright year stay current without an editor updating it every year?
  criteria: It provides a single Block plugin (id copyright_footer) that renders a 'Copyright © <year>
    <organization> <version>' notice. The year is recomputed with PHP \DateTime on every build(), so the
    current year is always shown automatically.
  bundle: copyright_footer
  rubric_ref: rubric/copyright_footer_copyright_footer_what_block@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: copyright_footer-no-settings-page
  input: I enabled copyright_footer on Drupal 11 but I cannot find an admin configuration page for it.
    How do I actually set the organization name and where is that value stored?
  criteria: There is no settings page and configure=null. You place the 'Copyright Footer' block via Structure
    > Block layout (Place block) and set organization_name (and the other keys) in the block's own configuration
    form. It is stored on the block config entity at block.block.<id>.settings.organization_name (schema
    block.settings.copyright_footer).
  bundle: copyright_footer
  rubric_ref: rubric/copyright_footer_copyright_footer_no_settings_page@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: copyright_footer-year-range
  input: Using copyright_footer, which block settings control whether the footer shows a single year versus
    a year range like 2010-2026, and what happens if I leave the end year blank?
  criteria: year_origin and year_to_date control it. If year_origin is empty or equals the current year
    you get a single year; otherwise you get year_origin-year_to_date. If year_to_date is left blank it
    falls back to the current year.
  bundle: copyright_footer
  rubric_ref: rubric/copyright_footer_copyright_footer_year_range@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: copyright_footer-known-org
  input: This Drupal site already has a Copyright Footer block placed (block config id cf_known). Inspect
    its live configuration and tell me the organization name it is configured to display.
  criteria: The organization name is 'Acme Widgets Ltd', stored at block.block.cf_known -> settings.organization_name.
  bundle: copyright_footer
  rubric_ref: rubric/copyright_footer_copyright_footer_known_org@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/copyright_footer-known-org-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/copyright_footer-known-org-cleanup.sh
- id: copyright_footer-known-year
  input: This Drupal site has a Copyright Footer block (block config id cf_range) configured to show a
    year range. Inspect its live configuration and state the start year (year origin) it uses.
  criteria: The start year is 2011, stored at block.block.cf_range -> settings.year_origin.
  bundle: copyright_footer
  rubric_ref: rubric/copyright_footer_copyright_footer_known_year@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/copyright_footer-known-year-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/copyright_footer-known-year-cleanup.sh
- id: copyright_footer-place-block
