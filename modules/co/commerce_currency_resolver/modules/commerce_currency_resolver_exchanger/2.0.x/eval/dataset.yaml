metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: commerce_currency_resolver_exchanger
  version: 2.0.x
  note: Submodule of commerce_currency_resolver, requires commerce_exchanger. Adds ExchangerResolverPrice
    (price_resolver 999) + ExchangerOrderProcessor (order_processor 1000, replaces the parent order processor
    via a ServiceProvider). Unlocks currency_source 'auto'/'combo' and a required currency_exchange_rates
    provider selector (all stored in commerce_currency_resolver.settings). Overrides fee/promotion-offer/condition
    plugin classes. Medium reads back currency_exchange_rates; hard sets currency_source=auto verified
    from live config. Scripts stash+restore commerce_currency_resolver.settings values.
questions:
- id: ccr-exchanger-what
  input: What does the Commerce Currency Resolver exchanger submodule add, and which currency_source modes
    does it unlock?
  criteria: It adds automatic conversion via Commerce Exchanger and unlocks the 'auto' and 'combo' currency_source
    modes (plus a required exchange-rate provider selector).
  bundle: commerce_currency_resolver_exchanger
  rubric_ref: rubric/commerce_currency_resolver_exchanger_ccr_exchanger_what@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: ccr-exchanger-order-processor
  input: How does the Commerce Currency Resolver exchanger submodule change the order processing, compared
    to the base module?
  criteria: A ServiceProvider removes the base commerce_currency_resolver.order_processor and its ExchangerOrderProcessor
    (priority 1000) takes over, converting non-purchasable items, locked adjustments and VADO discounts
    into the resolved currency.
  bundle: commerce_currency_resolver_exchanger
  rubric_ref: rubric/commerce_currency_resolver_exchanger_ccr_exchanger_order_processor@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: ccr-exchanger-overrides
  input: Besides prices and orders, which Commerce plugin types does the Commerce Currency Resolver exchanger
    submodule make currency-aware?
  criteria: It overrides the fixed-amount fee plugins, the fixed-amount-off promotion offer plugins, and
    the order_total_price condition with currency-aware subclasses.
  bundle: commerce_currency_resolver_exchanger
  rubric_ref: rubric/commerce_currency_resolver_exchanger_ccr_exchanger_overrides@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: ccr-exchanger-read-provider
  input: On this Drupal site, which Commerce Exchanger provider id is Commerce Currency Resolver configured
    to use for exchange rates (the currency_exchange_rates setting)? Inspect the live configuration.
  criteria: commerce_currency_resolver.settings currency_exchange_rates is set to 'ccr_demo_rates'.
  bundle: commerce_currency_resolver_exchanger
  rubric_ref: rubric/commerce_currency_resolver_exchanger_ccr_exchanger_read_provider@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/ccr-exchanger-read-provider-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/ccr-exchanger-read-provider-cleanup.sh
- id: ccr-exchanger-set-auto
  input: On this Drupal site, using the Commerce Currency Resolver exchanger integration, switch the pricing
    strategy to fully automatic conversion (the 'auto' currency_source). Apply the change to the live
    configuration.
  criteria: Set commerce_currency_resolver.settings currency_source to 'auto' (e.g. `drush cset -y commerce_currency_resolver.settings
    currency_source auto`).
  bundle: commerce_currency_resolver_exchanger
  rubric_ref: rubric/commerce_currency_resolver_exchanger_ccr_exchanger_set_auto@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/ccr-exchanger-set-auto-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/ccr-exchanger-set-auto-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/ccr-exchanger-set-auto-verify.sh
