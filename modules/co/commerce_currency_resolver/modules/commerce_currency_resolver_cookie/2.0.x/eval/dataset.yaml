- id: ccr-cookie-what
  input: In Commerce Currency Resolver, what does the cookie submodule provide, and how does a shopper's
    chosen currency get remembered?
  criteria: It provides a currency-switcher block and a resolver that reads the choice from a cookie (set
    for one day when the shopper picks a currency).
  bundle: commerce_currency_resolver_cookie
  rubric_ref: rubric/commerce_currency_resolver_cookie_ccr_cookie_what@1.0
