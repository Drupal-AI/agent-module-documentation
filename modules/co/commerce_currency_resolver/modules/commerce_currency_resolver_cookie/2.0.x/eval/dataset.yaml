  criteria: Block plugin id commerce_currency_resolver_cookie ('Currency cookie block selector'), category
    Commerce.
  bundle: commerce_currency_resolver_cookie
  rubric_ref: rubric/commerce_currency_resolver_cookie_ccr_cookie_block_id@1.0
