metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: commerce_currency_resolver_language
  version: 2.0.x
  note: 'Submodule of commerce_currency_resolver. Resolver CurrencyResolverLanguage (tag commerce_price.currency_resolver,
    priority 800) maps current langcode -> currency via config commerce_currency_resolver_language.currency_mapping:matrix
    ({langcode: code}). Mapping form at /admin/commerce/config/commerce_currency_resolver/language, permission
    ''administer commerce currency resolver settings''. Config object is schema-only until saved. Medium
    reads back a known matrix entry; hard writes a matrix entry verified from live config. Scripts delete
    the mapping config to restore baseline (it did not exist before).'
questions:
- id: ccr-language-what
  input: In Commerce Currency Resolver, what does the language submodule do and how does it decide which
    currency to use?
  criteria: It resolves the current currency from the active interface language, looking the langcode
    up in the commerce_currency_resolver_language.currency_mapping matrix (langcode => currency code).
  bundle: commerce_currency_resolver_language
  rubric_ref: rubric/commerce_currency_resolver_language_ccr_language_what@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: ccr-language-config
  input: Which config object and key store the language-to-currency mapping for Commerce Currency Resolver,
    and at what admin path is it edited?
  criteria: The mapping lives in commerce_currency_resolver_language.currency_mapping under the 'matrix'
    key; edited at /admin/commerce/config/commerce_currency_resolver/language.
  bundle: commerce_currency_resolver_language
  rubric_ref: rubric/commerce_currency_resolver_language_ccr_language_config@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: ccr-language-priority
  input: At what priority does the Commerce Currency Resolver language resolver run in the commerce_price.currency_resolver
    chain, and how does that compare to the cookie and geoip resolvers?
  criteria: Priority 800 — below cookie (1000) and geoip/smart_ip (900); it acts as the fallback resolver.
  bundle: commerce_currency_resolver_language
  rubric_ref: rubric/commerce_currency_resolver_language_ccr_language_priority@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: ccr-language-read-matrix
  input: On this Drupal site, which currency code is mapped to the English (en) language in Commerce Currency
    Resolver's language mapping? Inspect the live configuration.
  criteria: The commerce_currency_resolver_language.currency_mapping matrix maps en => EUR.
  bundle: commerce_currency_resolver_language
  rubric_ref: rubric/commerce_currency_resolver_language_ccr_language_read_matrix@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/ccr-language-read-matrix-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/ccr-language-read-matrix-cleanup.sh
- id: ccr-language-set-matrix
  input: On this Drupal site, configure Commerce Currency Resolver so that the English (en) interface
    language resolves to US Dollars (USD), using the language submodule's mapping. Apply the change to
    the live configuration.
  criteria: Set commerce_currency_resolver_language.currency_mapping matrix.en = USD (e.g. via the mapping
    form or `drush php:eval` writing the matrix key).
  bundle: commerce_currency_resolver_language
  rubric_ref: rubric/commerce_currency_resolver_language_ccr_language_set_matrix@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/ccr-language-set-matrix-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/ccr-language-set-matrix-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/ccr-language-set-matrix-verify.sh
