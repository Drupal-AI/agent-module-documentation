rubrics:
- id: commerce_currency_resolver_language_ccr_language_what
  version: '1.0'
  applicable_bundles:
  - commerce_currency_resolver_language
  checks:
  - kind: must_contain_any
    values:
    - language
    - matrix
    - current language
  scoring:
    combine: all_pass
- id: commerce_currency_resolver_language_ccr_language_config
  version: '1.0'
  applicable_bundles:
  - commerce_currency_resolver_language
  checks:
  - kind: must_contain_any
    values:
    - commerce_currency_resolver_language.currency_mapping
    - matrix
    - /admin/commerce/config/commerce_currency_resolver/language
  scoring:
    combine: all_pass
- id: commerce_currency_resolver_language_ccr_language_priority
  version: '1.0'
  applicable_bundles:
  - commerce_currency_resolver_language
  checks:
  - kind: must_contain_any
    values:
    - '800'
    - priority
  scoring:
    combine: all_pass
- id: commerce_currency_resolver_language_ccr_language_read_matrix
  version: '1.0'
  applicable_bundles:
  - commerce_currency_resolver_language
  checks:
  - kind: must_contain_any
    values:
    - EUR
  scoring:
    combine: all_pass
- id: commerce_currency_resolver_language_ccr_language_set_matrix
  version: '1.0'
  applicable_bundles:
  - commerce_currency_resolver_language
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
