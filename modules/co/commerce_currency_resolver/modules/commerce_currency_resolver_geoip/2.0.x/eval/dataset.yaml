metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: commerce_currency_resolver_geoip
  version: 2.0.x
  note: 'Submodule of commerce_currency_resolver, requires geoip. Resolver CurrencyResolverGeoip (tag
    commerce_price.currency_resolver, priority 900) maps geolocated country -> currency via config commerce_currency_resolver_geoip.currency_mapping
    (matrix {country: code} + logic country|currency). Mapping form at /admin/commerce/config/commerce_currency_resolver/geoip,
    permission ''administer commerce currency resolver settings''. Config schema-only until saved. Medium
    reads a known matrix entry; hard writes a country mapping verified from live config. Scripts delete
    the mapping config to restore baseline.'
questions:
- id: ccr-geoip-what
  input: In Commerce Currency Resolver, what does the geoip submodule do, what module does it require,
    and how does it decide the currency?
  criteria: It resolves currency from the visitor's geolocated country (via the contrib geoip module),
    looking the country up in the commerce_currency_resolver_geoip.currency_mapping matrix.
  bundle: commerce_currency_resolver_geoip
  rubric_ref: rubric/commerce_currency_resolver_geoip_ccr_geoip_what@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: ccr-geoip-logic
  input: The Commerce Currency Resolver geoip mapping form has a 'logic' setting. What two values can
    it take and what do they mean?
  criteria: logic can be 'country' (assign a currency to each country) or 'currency' (assign multiple
    countries to each currency); both produce the same matrix (country => currency code).
  bundle: commerce_currency_resolver_geoip
  rubric_ref: rubric/commerce_currency_resolver_geoip_ccr_geoip_logic@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: ccr-geoip-priority
  input: At what priority does the Commerce Currency Resolver geoip resolver run, and which config object
    stores its country-to-currency mapping?
  criteria: Priority 900 (above language 800, below cookie 1000); mapping in commerce_currency_resolver_geoip.currency_mapping
    (matrix key).
  bundle: commerce_currency_resolver_geoip
  rubric_ref: rubric/commerce_currency_resolver_geoip_ccr_geoip_priority@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: ccr-geoip-read-matrix
  input: On this Drupal site, which currency code does Commerce Currency Resolver's geoip mapping assign
    to the country DE (Germany)? Inspect the live configuration.
  criteria: The commerce_currency_resolver_geoip.currency_mapping matrix maps DE => EUR.
  bundle: commerce_currency_resolver_geoip
  rubric_ref: rubric/commerce_currency_resolver_geoip_ccr_geoip_read_matrix@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/ccr-geoip-read-matrix-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/ccr-geoip-read-matrix-cleanup.sh
- id: ccr-geoip-set-matrix
  input: On this Drupal site, configure Commerce Currency Resolver's geoip submodule so that visitors
    from the United States (country code US) resolve to US Dollars (USD). Apply the change to the live
    configuration.
  criteria: Set commerce_currency_resolver_geoip.currency_mapping matrix.US = USD (via the geoip mapping
    form or drush).
  bundle: commerce_currency_resolver_geoip
  rubric_ref: rubric/commerce_currency_resolver_geoip_ccr_geoip_set_matrix@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/ccr-geoip-set-matrix-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/ccr-geoip-set-matrix-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/ccr-geoip-set-matrix-verify.sh
