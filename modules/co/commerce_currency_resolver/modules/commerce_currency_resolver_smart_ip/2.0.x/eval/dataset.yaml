metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: commerce_currency_resolver_smart_ip
  version: 2.0.x
  note: 'Submodule of commerce_currency_resolver. Smart IP equivalent of geoip: resolver CurrencyResolverSmartIp
    (tag commerce_price.currency_resolver, priority 900) maps smart_ip countryCode -> currency via config
    commerce_currency_resolver_smart_ip.currency_mapping:matrix. IMPORTANT: release 2.0.1 ships a broken
    route (references a non-existent controller class and reuses the geoip route/form), so enabling it
    makes the router rebuild fatal - the module cannot be enabled as shipped. Only recipe (easy) cases
    are defined: introspection/execution would require the module enabled, which is not possible in 2.0.1.
    Documented from source.'
questions:
- id: ccr-smartip-what
  input: In Commerce Currency Resolver, what does the smart_ip submodule do and how does it differ from
    the geoip submodule?
  criteria: It resolves currency from the visitor's country using the Smart IP module (countryCode) instead
    of GeoIP; otherwise it mirrors the geoip submodule (country => currency matrix, priority 900).
  bundle: commerce_currency_resolver_smart_ip
  rubric_ref: rubric/commerce_currency_resolver_smart_ip_ccr_smartip_what@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: ccr-smartip-broken
  input: Are there any known problems enabling the Commerce Currency Resolver smart_ip submodule in the
    2.0.1 release?
  criteria: Yes - in 2.0.1 its routing references a controller class that does not exist (and reuses the
    geoip route/form), so enabling it makes the router rebuild fatal with 'Class ... does not exist'.
    Use the geoip submodule instead until fixed.
  bundle: commerce_currency_resolver_smart_ip
  rubric_ref: rubric/commerce_currency_resolver_smart_ip_ccr_smartip_broken@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: ccr-smartip-config
  input: Which config object and key would hold the country-to-currency mapping for the Commerce Currency
    Resolver smart_ip submodule, and at what priority does its resolver run?
  criteria: commerce_currency_resolver_smart_ip.currency_mapping under the 'matrix' key; resolver priority
    900 in the commerce_price.currency_resolver chain.
  bundle: commerce_currency_resolver_smart_ip
  rubric_ref: rubric/commerce_currency_resolver_smart_ip_ccr_smartip_config@1.0
  tags:
  - mode:recipe
  - difficulty:easy
