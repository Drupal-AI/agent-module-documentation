metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: commerce_currency_resolver
  version: 2.0.x
  note: Commerce Currency Resolver enhances Commerce 3 multi-currency. Config object commerce_currency_resolver.settings
    has currency_source (field|auto|combo), currency_field_prefix (default field_price_), currency_exchange_rates.
    Price resolver commerce_currency_resolver.price_resolver returns the {prefix}{code} per-currency field
    (e.g. field_price_eur) when the resolved currency differs; order processor + order-load subscriber
    refresh draft, unlocked, current-user-owned orders on currency mismatch. currency_resolver cache context.
    Config UI at /admin/commerce/config/commerce_currency_resolver/settings, permission 'administer commerce
    currency resolver settings'. Medium reads back a known settings value; hard writes a settings value
    verified from live config. All eval cases operate on config only (site has only USD + no store, so
    no runtime conversion is exercised). Scripts stash the live baseline and restore it.
questions:
- id: ccr-what
  input: In Drupal Commerce, what does the Commerce Currency Resolver module do, at what admin path is
    it configured, and which permission controls that configuration?
  criteria: It enhances Commerce 3 multi-currency by resolving the visitor's currency and returning/converting
    per-currency prices. Configured at /admin/commerce/config/commerce_currency_resolver/settings, gated
    by the 'administer commerce currency resolver settings' permission.
  bundle: commerce_currency_resolver
  rubric_ref: rubric/commerce_currency_resolver_ccr_what@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: ccr-modes
  input: Which values can the currency_source setting of Commerce Currency Resolver take, and what does
    each mean?
  criteria: field = per-currency price fields only; auto = convert everything via Commerce Exchanger;
    combo = use a per-currency field if present, otherwise auto-convert.
  bundle: commerce_currency_resolver
  rubric_ref: rubric/commerce_currency_resolver_ccr_modes@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: ccr-field-naming
  input: When Commerce Currency Resolver uses per-currency price fields, how is the field name for a given
    currency built, and what is the default prefix?
  criteria: The field name is {currency_field_prefix}{lowercase currency code}. The default prefix is
    field_price_, so the Euro field is field_price_eur.
  bundle: commerce_currency_resolver
  rubric_ref: rubric/commerce_currency_resolver_ccr_field_naming@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: ccr-source-mode
  input: On this Drupal site, which pricing strategy is Commerce Currency Resolver configured to use (the
    currency_source setting)? Inspect the live configuration.
  criteria: The commerce_currency_resolver.settings currency_source is set to 'auto' (convert everything
    via Commerce Exchanger).
  bundle: commerce_currency_resolver
  rubric_ref: rubric/commerce_currency_resolver_ccr_source_mode@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/ccr-source-mode-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/ccr-source-mode-cleanup.sh
- id: ccr-prefix
  input: On this Drupal site, what currency field prefix has Commerce Currency Resolver been configured
    with (the prefix used to build per-currency price fields)? Inspect the live configuration.
  criteria: The commerce_currency_resolver.settings currency_field_prefix is 'field_ccrtest_'.
  bundle: commerce_currency_resolver
  rubric_ref: rubric/commerce_currency_resolver_ccr_prefix@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/ccr-prefix-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/ccr-prefix-cleanup.sh
- id: ccr-set-source
  input: On this Drupal site, configure Commerce Currency Resolver to use the 'combo' pricing strategy
    (use a per-currency price field if present, otherwise auto-convert). Apply the change to the live
    configuration.
  criteria: Set commerce_currency_resolver.settings currency_source to 'combo' (e.g. `drush cset -y commerce_currency_resolver.settings
    currency_source combo`).
  bundle: commerce_currency_resolver
  rubric_ref: rubric/commerce_currency_resolver_ccr_set_source@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/ccr-set-source-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/ccr-set-source-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/ccr-set-source-verify.sh
- id: ccr-set-prefix
  input: On this Drupal site, change Commerce Currency Resolver's per-currency price field prefix to 'field_money_'.
    Apply the change to the live configuration.
  criteria: Set commerce_currency_resolver.settings currency_field_prefix to 'field_money_' (e.g. `drush
    cset -y commerce_currency_resolver.settings currency_field_prefix field_money_`).
  bundle: commerce_currency_resolver
  rubric_ref: rubric/commerce_currency_resolver_ccr_set_prefix@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/ccr-set-prefix-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/ccr-set-prefix-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/ccr-set-prefix-verify.sh
