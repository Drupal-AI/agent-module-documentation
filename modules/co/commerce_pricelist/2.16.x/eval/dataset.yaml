metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: commerce_pricelist
  version: 2.16.x
  note: 'Commerce Pricelist adds two content entities: commerce_pricelist (Price list; fields name, stores,
    customers, customer_roles, start_date, end_date, weight, status; bundled per purchasable type, default
    commerce_product_variation) and commerce_pricelist_item (''price''; fields price_list_id, purchasable_entity,
    quantity, price, list_price, status). Prices are injected via the tagged service commerce_pricelist.price_resolver
    (PriceListPriceResolver, commerce_price.price_resolver priority 600) using commerce_pricelist.repository.
    Permission administer commerce_pricelist. No configure route/Drush; managed at /admin/commerce/price-lists
    with CSV import/export. Lifecycle events in PriceListEvents. Medium/hard cases are grounded in real
    price-list / price-list-item / product-variation entities created on the live site (Commerce, commerce_store,
    commerce_product are installed; variation type ''default'' exists). All setup/reset/verify scripts
    were smoke-tested.'
questions:
- id: commerce_pricelist-how-resolves
  input: How does the Drupal commerce_pricelist module make a product variation use a price from a price
    list instead of its normal price? Name the mechanism it plugs into.
  criteria: It registers a Commerce price resolver service, commerce_pricelist.price_resolver (PriceListPriceResolver),
    tagged commerce_price.price_resolver at priority 600. Because it runs at high priority ahead of the
    default variation-price resolver, a matching price list item's price overrides the base price; it
    returns NULL (falling back to the normal price) when no list matches.
  bundle: commerce_pricelist
  rubric_ref: rubric/commerce_pricelist_commerce_pricelist_how_resolves@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: commerce_pricelist-entities
  input: In the Drupal commerce_pricelist module, what are the two entity types involved, what is a 'price'
    called internally, and where in the admin UI do you manage price lists?
  criteria: 'There are two content entities: commerce_pricelist (the Price list) and commerce_pricelist_item
    (a single ''price'', called a price in the UI but named price list item internally). They are managed
    under Commerce > Price lists at /admin/commerce/price-lists, with each list''s prices offering add
    / CSV import / CSV export.'
  bundle: commerce_pricelist
  rubric_ref: rubric/commerce_pricelist_commerce_pricelist_entities@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: commerce_pricelist-conditions
  input: What conditions can a commerce_pricelist price list use to decide when its prices apply?
  criteria: A price list can be limited by stores, specific customers (users), customer_roles, and a start_date/end_date
    window, and is ordered by weight when several match. Each price list item additionally has a quantity
    threshold for tiered pricing.
  bundle: commerce_pricelist
  rubric_ref: rubric/commerce_pricelist_commerce_pricelist_conditions@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: commerce_pricelist-known-list
  input: On this Drupal Commerce site, a price list has been created with commerce_pricelist. Inspect
    the live price lists and give the name of that price list.
  criteria: The price list is named cpl_probe_list (an enabled commerce_pricelist entity, weight 37).
    Load commerce_pricelist entities to find it.
  bundle: commerce_pricelist
  rubric_ref: rubric/commerce_pricelist_commerce_pricelist_known_list@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/commerce_pricelist-known-list-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/commerce_pricelist-known-list-cleanup.sh
- id: commerce_pricelist-known-role
