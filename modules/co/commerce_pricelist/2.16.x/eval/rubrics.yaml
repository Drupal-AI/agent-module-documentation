rubrics:
- id: commerce_pricelist_commerce_pricelist_how_resolves
  version: '1.0'
  applicable_bundles:
  - commerce_pricelist
  checks:
  - kind: must_contain_any
    values:
    - price_resolver
    - PriceListPriceResolver
    - price resolver
    - commerce_price.price_resolver
    - '600'
  scoring:
    combine: all_pass
- id: commerce_pricelist_commerce_pricelist_entities
  version: '1.0'
  applicable_bundles:
  - commerce_pricelist
  checks:
  - kind: must_contain_any
    values:
    - commerce_pricelist
    - commerce_pricelist_item
    - /admin/commerce/price-lists
  scoring:
    combine: all_pass
- id: commerce_pricelist_commerce_pricelist_conditions
  version: '1.0'
  applicable_bundles:
  - commerce_pricelist
  checks:
  - kind: must_contain_any
    values:
    - customer_roles
    - customers
    - stores
    - start_date
    - end_date
    - quantity
  scoring:
    combine: all_pass
- id: commerce_pricelist_commerce_pricelist_known_list
  version: '1.0'
  applicable_bundles:
  - commerce_pricelist
  checks:
  - kind: must_contain_any
    values:
    - cpl_probe_list
  scoring:
    combine: all_pass
- id: commerce_pricelist_commerce_pricelist_known_role
  version: '1.0'
  applicable_bundles:
  - commerce_pricelist
  checks:
  - kind: must_contain_any
    values:
    - cpl_probe_role
  scoring:
    combine: all_pass
- id: commerce_pricelist_commerce_pricelist_create_list
  version: '1.0'
  applicable_bundles:
  - commerce_pricelist
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
- id: commerce_pricelist_commerce_pricelist_add_price
  version: '1.0'
  applicable_bundles:
  - commerce_pricelist
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
