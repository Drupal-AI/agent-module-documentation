metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: cookies
  version: 1.2.x
  note: 'COOKiES is a GDPR consent framework: a cookiesjsr banner, cookies_service/cookies_service_group
    config entities, a knock-out pattern that blocks scripts until consent, a JS/PHP consent API, and
    ~11 per-service cookies_* integration submodules. Cases are `recipe` (response-graded); they probe
    documented facts an agent would otherwise read source to answer. No site mutation.'
questions:
- id: cookies-show-banner
  input: On a Drupal 11 site I installed the COOKiES module. How do I actually get the GDPR consent banner
    to appear on the page?
  criteria: Place the 'COOKiES UI' block (plugin cookies_ui_block) in a region via core Block layout;
    the banner (cookiesjsr library) then renders.
  bundle: cookies
  rubric_ref: rubric/cookies_cookies_show_banner@1.0
  tags:
  - mode:recipe
- id: cookies-gate-service-entity
  input: I want to gate a custom third-party script behind a consent category in COOKiES. Which config
    entity type do I create, and which field ties it to a consent category?
  criteria: Create a cookies_service config entity; its `group` field assigns it to a cookies_service_group
    (consent category).
  bundle: cookies
  rubric_ref: rubric/cookies_cookies_gate_service_entity@1.0
  tags:
  - mode:recipe
- id: cookies-consent-categories
  input: What are the built-in consent groups/categories that ship with COOKiES, and what config entity
    represents a category?
  criteria: Categories are cookies_service_group config entities; the ones shipped are functional, performance,
    marketing, tracking, social, video (functional is the required/essential one).
  bundle: cookies
  rubric_ref: rubric/cookies_cookies_consent_categories@1.0
  tags:
  - mode:recipe
- id: cookies-knock-out
  input: How does COOKiES stop a third-party script from running before consent, and how does a bridge
    module decide whether to do this on the current page?
  criteria: The knock-out pattern rewrites the script to type="text/plain" (CookiesConstants::COOKIES_SCRIPT_KO_TYPE)
    so it does not execute; a bridge calls Drupal::service('cookies.knock_out')->doKnockOut() to decide.
  bundle: cookies
  rubric_ref: rubric/cookies_cookies_knock_out@1.0
  tags:
  - mode:recipe
- id: cookies-js-consent-api
  input: In custom JavaScript on a COOKiES site, which DOM event do I listen for to react when a user
    grants/denies a service, and which event do I dispatch to programmatically accept a service?
  criteria: Listen for cookiesjsrUserConsent (event.detail.services map); dispatch cookiesjsrSetService
    with detail {services:{id:true}} or {all:true} to grant consent.
  bundle: cookies
  rubric_ref: rubric/cookies_cookies_js_consent_api@1.0
  tags:
  - mode:recipe
- id: cookies-server-hook
  input: In a custom Drupal module I want to run server-side code when a visitor submits their COOKiES
    consent decision. Which hook do I implement?
  criteria: Implement hook_cookies_user_consent($consent); it is invoked by the /cookies/consent/callback.json
    controller via invokeAll('cookies_user_consent').
  bundle: cookies
  rubric_ref: rubric/cookies_cookies_server_hook@1.0
  tags:
  - mode:recipe
- id: cookies-per-service-submodules
  input: I want COOKiES to manage consent for Google Analytics and Matomo. Do I configure these in the
    main module, and what are the module names to enable?
  criteria: Each third-party tool is a separate cookies_* integration submodule; enable cookies_ga for
    Google Analytics and cookies_matomo for Matomo (each depends on cookies plus the tool's own module).
  bundle: cookies
  rubric_ref: rubric/cookies_cookies_per_service_submodules@1.0
  tags:
  - mode:recipe
- id: cookies-permissions
  input: Which COOKiES permission gates editing the cookies_service and cookies_service_group entities,
    versus the base configuration form?
  criteria: '''administer cookies services and service groups'' gates the service/service-group entities;
    ''configure cookies config'' gates the base configuration form (a third permission ''configure cookies
    widget texts'' gates the texts form).'
  bundle: cookies
  rubric_ref: rubric/cookies_cookies_permissions@1.0
  tags:
  - mode:recipe
