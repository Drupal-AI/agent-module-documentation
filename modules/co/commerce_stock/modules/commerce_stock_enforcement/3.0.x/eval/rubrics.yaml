rubrics:
- id: commerce_stock_enforcement_commerce_stock_enforcement_what
  version: '1.0'
  applicable_bundles:
  - commerce_stock_enforcement
  checks:
  - kind: must_contain_any
    values:
    - add to cart
    - add-to-cart
    - cart
    - checkout
    - out of stock
  scoring:
    combine: all_pass
- id: commerce_stock_enforcement_commerce_stock_enforcement_messages
  version: '1.0'
  applicable_bundles:
  - commerce_stock_enforcement
  checks:
  - kind: must_contain_any
    values:
    - commerce_stock_enforcement.settings
    - insufficient_stock_cart
    - insufficient_stock_add_to_cart_zero_in_cart
    - '%qty'
  scoring:
    combine: all_pass
- id: commerce_stock_enforcement_commerce_stock_enforcement_needs_local
  version: '1.0'
  applicable_bundles:
  - commerce_stock_enforcement
  checks:
  - kind: must_contain_any
    values:
    - always_in_stock
    - local_stock
    - commerce_stock_local
    - local
  scoring:
    combine: all_pass
- id: commerce_stock_enforcement_commerce_stock_enforcement_known_cart_msg
  version: '1.0'
  applicable_bundles:
  - commerce_stock_enforcement
  checks:
  - kind: must_contain_any
    values:
    - CSE only %qty of %name remain in stock.
  scoring:
    combine: all_pass
- id: commerce_stock_enforcement_commerce_stock_enforcement_known_atc_msg
  version: '1.0'
  applicable_bundles:
  - commerce_stock_enforcement
  checks:
  - kind: must_contain_any
    values:
    - CSE sorry, just %qty left (you asked for %qty_asked).
  scoring:
    combine: all_pass
- id: commerce_stock_enforcement_commerce_stock_enforcement_set_cart_msg
  version: '1.0'
  applicable_bundles:
  - commerce_stock_enforcement
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
- id: commerce_stock_enforcement_commerce_stock_enforcement_set_atc_msg
  version: '1.0'
  applicable_bundles:
  - commerce_stock_enforcement
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
