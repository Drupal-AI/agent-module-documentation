metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: commerce_stock_enforcement
  version: 3.0.x
  note: 'Commerce Stock Enforcement blocks over-selling by validating stock on the add-to-cart form, the
    cart page (commerce_cart_form view) and checkout, using commerce_stock.service_manager for levels
    (so real enforcement needs commerce_stock_local). Its configurable surface is the commerce_stock_enforcement.settings
    config object with three message strings: insufficient_stock_cart (%name, %qty), insufficient_stock_add_to_cart_zero_in_cart
    (%qty, %qty_asked), insufficient_stock_add_to_cart_quantity_in_cart (%qty, %qty_o), edited at /admin/commerce/config/stock/enforcement/settings
    (route commerce_stock_enforcement.settings). Medium/hard cases are grounded in that real local config,
    verified by pure reads. Cleanup/reset restore the shipped default messages explicitly.'
questions:
- id: commerce_stock_enforcement-what
  input: What does the Commerce Stock Enforcement submodule do, and at which points in the purchase flow
    does it stop a customer buying out-of-stock products?
  criteria: 'It blocks over-selling by validating available stock at three points: the add-to-cart form
    (disables the button, shows ''Out of stock''), the cart page (validates quantities), and checkout
    (redirects back to cart if anything is out of stock). Levels come from the configured stock service,
    so it needs commerce_stock_local to enforce real limits.'
  bundle: commerce_stock_enforcement
  rubric_ref: rubric/commerce_stock_enforcement_commerce_stock_enforcement_what@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: commerce_stock_enforcement-messages
  input: Where does Commerce Stock Enforcement store its out-of-stock messages, and what are the config
    keys / placeholders for the cart and add-to-cart messages?
  criteria: 'They live in commerce_stock_enforcement.settings (form at /admin/commerce/config/stock/enforcement/settings):
    insufficient_stock_cart (%name, %qty), insufficient_stock_add_to_cart_zero_in_cart (%qty, %qty_asked)
    and insufficient_stock_add_to_cart_quantity_in_cart (%qty, %qty_o).'
  bundle: commerce_stock_enforcement
  rubric_ref: rubric/commerce_stock_enforcement_commerce_stock_enforcement_messages@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: commerce_stock_enforcement-needs-local
  input: If I enable Commerce Stock Enforcement but products use the 'always in stock' service, will it
    block anything? What is required for enforcement to actually limit purchases?
  criteria: No - with always_in_stock the stock service reports effectively infinite stock, so nothing
    is blocked. Enforcement only limits purchases for variations using a finite stock service, i.e. local_stock
    from commerce_stock_local with real stock levels.
  bundle: commerce_stock_enforcement
  rubric_ref: rubric/commerce_stock_enforcement_commerce_stock_enforcement_needs_local@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: commerce_stock_enforcement-known-cart-msg
  input: On this Drupal site, Commerce Stock Enforcement has a customized cart out-of-stock message. Inspect
    the live configuration and give the exact insufficient_stock_cart message string.
  criteria: 'The message is ''CSE only %qty of %name remain in stock.'': commerce_stock_enforcement.settings
    insufficient_stock_cart is set to that string.'
  bundle: commerce_stock_enforcement
  rubric_ref: rubric/commerce_stock_enforcement_commerce_stock_enforcement_known_cart_msg@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/commerce_stock_enforcement-known-msg-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/commerce_stock_enforcement-known-msg-cleanup.sh
- id: commerce_stock_enforcement-known-atc-msg
  input: On this Drupal site, Commerce Stock Enforcement has a customized add-to-cart out-of-stock message
    (used when the cart is empty). Inspect the live configuration and give the exact insufficient_stock_add_to_cart_zero_in_cart
    message string.
  criteria: 'The message is ''CSE sorry, just %qty left (you asked for %qty_asked).'': commerce_stock_enforcement.settings
    insufficient_stock_add_to_cart_zero_in_cart is set to that string.'
  bundle: commerce_stock_enforcement
  rubric_ref: rubric/commerce_stock_enforcement_commerce_stock_enforcement_known_atc_msg@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/commerce_stock_enforcement-known-msg-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/commerce_stock_enforcement-known-msg-cleanup.sh
- id: commerce_stock_enforcement-set-cart-msg
  input: 'On this Drupal site, change the Commerce Stock Enforcement cart out-of-stock message (insufficient_stock_cart)
    to exactly: Only %qty of %name left in our warehouse. Apply the change to the live site.'
  criteria: commerce_stock_enforcement.settings insufficient_stock_cart is set to 'Only %qty of %name
    left in our warehouse.' (via the enforcement settings form or config).
  bundle: commerce_stock_enforcement
  rubric_ref: rubric/commerce_stock_enforcement_commerce_stock_enforcement_set_cart_msg@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/commerce_stock_enforcement-set-cart-msg-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/commerce_stock_enforcement-set-cart-msg-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/commerce_stock_enforcement-set-cart-msg-verify.sh
- id: commerce_stock_enforcement-set-atc-msg
  input: 'On this store, when a shopper tries to add more of an item to an empty cart than we have, I
    want the message to read exactly: Only %qty available, you asked for %qty_asked. Set that add-to-cart
    out-of-stock message for Commerce Stock Enforcement on the live site.'
  criteria: commerce_stock_enforcement.settings insufficient_stock_add_to_cart_zero_in_cart is set to
    'Only %qty available, you asked for %qty_asked.'
  bundle: commerce_stock_enforcement
  rubric_ref: rubric/commerce_stock_enforcement_commerce_stock_enforcement_set_atc_msg@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-layman
    reset: agent-module-documentation/evaluation/verify/commerce_stock_enforcement-set-atc-msg-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/commerce_stock_enforcement-set-atc-msg-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/commerce_stock_enforcement-set-atc-msg-verify.sh
