metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: commerce_stock_field
  version: 3.0.x
  note: Commerce Stock Field defines the commerce_stock_level field type plus three widgets (commerce_stock_level_simple,
    commerce_stock_level_absolute, commerce_stock_level_simple_transaction) and a formatter (commerce_stock_level_simple).
    Attaching the field to a purchasable entity type (typically commerce_product_variation) lets editors
    view/adjust stock on the entity form; the widget creates a stock transaction via the stock service
    (so real storage needs commerce_stock_local). Medium/hard cases are grounded in real field + form-display
    config on the default product variation type, verified by pure config reads. All fixtures are namespaced
    field_csf_* and removed by cleanup (scoped, never a broad field purge).
questions:
- id: commerce_stock_field-field-type
  input: Which field type does the Commerce Stock Field module provide to let editors manage a product
    variation's stock, and what widgets can I choose for it?
  criteria: The field type is commerce_stock_level. Its widgets are commerce_stock_level_simple, commerce_stock_level_absolute
    (enter the resulting level) and commerce_stock_level_simple_transaction (enter a signed adjustment);
    the formatter commerce_stock_level_simple shows the level read-only.
  bundle: commerce_stock_field
  rubric_ref: rubric/commerce_stock_field_commerce_stock_field_field_type@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: commerce_stock_field-how-attach
  input: How do I let editors edit stock on product variations using the Commerce Stock Field module,
    and what other submodule is required for the stock to actually be stored?
  criteria: Create a commerce_stock_level field on the product variation type and pick one of its widgets
    on Manage form display. The widget writes a stock transaction via the stock service, so commerce_stock_local
    (the local_stock service) must be enabled and used by that variation type for stock to be stored.
  bundle: commerce_stock_field
  rubric_ref: rubric/commerce_stock_field_commerce_stock_field_how_attach@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: commerce_stock_field-transaction-widget
  input: In the Commerce Stock Field module, which widget lets a warehouse user enter a signed stock adjustment
    (like +10 or -3) with a note, rather than typing the exact resulting quantity?
  criteria: The commerce_stock_level_simple_transaction widget lets the user enter a signed transaction/adjustment
    (with an optional note), whereas commerce_stock_level_absolute expects the exact resulting level.
  bundle: commerce_stock_field
  rubric_ref: rubric/commerce_stock_field_commerce_stock_field_transaction_widget@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: commerce_stock_field-known-widget
  input: On this Drupal site, the default product variation type has a Commerce Stock level field (field_csf_stock).
    Inspect the live form display and state which stock widget it uses.
  criteria: 'It uses the commerce_stock_level_absolute widget: core.entity_form_display.commerce_product_variation.default.default
    has content.field_csf_stock.type = commerce_stock_level_absolute.'
  bundle: commerce_stock_field
  rubric_ref: rubric/commerce_stock_field_commerce_stock_field_known_widget@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/commerce_stock_field-known-widget-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/commerce_stock_field-known-widget-cleanup.sh
- id: commerce_stock_field-known-fieldtype
  input: On this Drupal site the default product variation type has a field named field_csf_stock added
    by a Commerce Stock module. Inspect the live field storage and give its field type.
  criteria: 'The field type is commerce_stock_level: field.storage.commerce_product_variation.field_csf_stock
    has type commerce_stock_level (the stock level field from commerce_stock_field).'
  bundle: commerce_stock_field
  rubric_ref: rubric/commerce_stock_field_commerce_stock_field_known_fieldtype@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
