    cleanup: agent-module-documentation/evaluation/verify/commerce_stock_field-known-widget-cleanup.sh
- id: commerce_stock_field-attach
  input: On this Drupal site, add a Commerce Stock level field with machine name field_csf_task to the
    default product variation type (commerce_product_variation, bundle default) so editors can manage
    stock on variations. Apply the change to the live site.
  criteria: A field field_csf_task of type commerce_stock_level exists on commerce_product_variation bundle
    default (field.storage.commerce_product_variation.field_csf_task type = commerce_stock_level and the
    matching field.field config).
  bundle: commerce_stock_field
  rubric_ref: rubric/commerce_stock_field_commerce_stock_field_attach@1.0
