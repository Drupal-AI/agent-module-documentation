rubrics:
- id: commerce_stock_field_commerce_stock_field_field_type
  version: '1.0'
  applicable_bundles:
  - commerce_stock_field
  checks:
  - kind: must_contain_any
    values:
    - commerce_stock_level
    - commerce_stock_level_simple
    - commerce_stock_level_absolute
    - commerce_stock_level_simple_transaction
  scoring:
    combine: all_pass
- id: commerce_stock_field_commerce_stock_field_how_attach
  version: '1.0'
  applicable_bundles:
  - commerce_stock_field
  checks:
  - kind: must_contain_any
    values:
    - commerce_stock_level
    - commerce_product_variation
    - form display
    - commerce_stock_local
    - widget
  scoring:
    combine: all_pass
- id: commerce_stock_field_commerce_stock_field_transaction_widget
  version: '1.0'
  applicable_bundles:
  - commerce_stock_field
  checks:
  - kind: must_contain_any
    values:
    - commerce_stock_level_simple_transaction
    - transaction
  scoring:
    combine: all_pass
- id: commerce_stock_field_commerce_stock_field_known_widget
  version: '1.0'
  applicable_bundles:
  - commerce_stock_field
  checks:
  - kind: must_contain_any
    values:
    - commerce_stock_level_absolute
  scoring:
    combine: all_pass
- id: commerce_stock_field_commerce_stock_field_known_fieldtype
  version: '1.0'
  applicable_bundles:
  - commerce_stock_field
  checks:
  - kind: must_contain_any
    values:
    - commerce_stock_level
  scoring:
    combine: all_pass
- id: commerce_stock_field_commerce_stock_field_attach
  version: '1.0'
  applicable_bundles:
  - commerce_stock_field
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
- id: commerce_stock_field_commerce_stock_field_set_widget
  version: '1.0'
  applicable_bundles:
  - commerce_stock_field
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
