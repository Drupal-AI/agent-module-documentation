metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: commerce_stock_ui
  version: 3.0.x
  note: 'Commerce Stock UI provides the human-facing UI for Commerce Stock: a two-step ''Create stock
    transaction'' admin form (StockTransactions1 at /admin/commerce/config/stock/transactions1 -> StockTransactions2
    at .../transactions2), a ''Stock transactions'' admin menu item, a field widget commerce_stock_level_transaction_form_link,
    and the permission ''use commerce stock transaction form'' that gates the forms. It ships no config
    objects/entities. Because its only persistent, verifiable surface is that permission, medium/hard
    cases are grounded in real user.role config (which role holds the permission / granting it), verified
    by pure reads. All roles are namespaced csu_* and removed on cleanup.'
questions:
- id: commerce_stock_ui-permission
  input: In Commerce Stock, which permission lets a non-admin user use the stock transaction entry form
    provided by the Commerce Stock UI module, and where is that form?
  criteria: The permission is 'use commerce stock transaction form'. It gates the two-step transaction
    form at /admin/commerce/config/stock/transactions1 (select variation) and /transactions2 (enter the
    transaction), reachable from the 'Stock transactions' admin menu item. It is separate from 'administer
    commerce stock'.
  bundle: commerce_stock_ui
  rubric_ref: rubric/commerce_stock_ui_commerce_stock_ui_permission@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: commerce_stock_ui-two-step
  input: How does the Commerce Stock UI stock transaction form work - is it one page or a flow? What are
    the two routes involved?
  criteria: 'It is a two-step flow: StockTransactions1 (route commerce_stock_ui.stock_transactions1) selects
    the product variation, then StockTransactions2 (route commerce_stock_ui.stock_transactions2) enters
    and submits the actual stock transaction for that variation.'
  bundle: commerce_stock_ui
  rubric_ref: rubric/commerce_stock_ui_commerce_stock_ui_two_step@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: commerce_stock_ui-link-widget
  input: The Commerce Stock UI module adds a field widget that, instead of an inline stock editor, links
    to the stock transaction form. What is its widget id and which field type is it for?
  criteria: The widget id is commerce_stock_level_transaction_form_link ('Link to stock transaction form'),
    for commerce_stock_level fields; it renders a link to the transaction form rather than an inline editor.
  bundle: commerce_stock_ui
  rubric_ref: rubric/commerce_stock_ui_commerce_stock_ui_link_widget@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: commerce_stock_ui-known-role
  input: On this Drupal site, one role has been granted access to the Commerce Stock transaction entry
    form. Inspect the roles and name the role that can use the stock transaction form.
  criteria: 'The role is csu_known: user.role.csu_known includes the ''use commerce stock transaction
    form'' permission.'
  bundle: commerce_stock_ui
  rubric_ref: rubric/commerce_stock_ui_commerce_stock_ui_known_role@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/commerce_stock_ui-known-role-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/commerce_stock_ui-known-role-cleanup.sh
