rubrics:
- id: commerce_stock_commerce_stock_services
  version: '1.0'
  applicable_bundles:
  - commerce_stock
  checks:
  - kind: must_contain_any
    values:
    - always_in_stock
    - local_stock
    - commerce_stock_local
    - Local
  scoring:
    combine: all_pass
- id: commerce_stock_commerce_stock_choose_service
  version: '1.0'
  applicable_bundles:
  - commerce_stock
  checks:
  - kind: must_contain_any
    values:
    - commerce_stock.service_manager
    - default_service_id
    - stock_config
    - /admin/commerce/config/stock/settings
    - service_id
  scoring:
    combine: all_pass
- id: commerce_stock_commerce_stock_api
  version: '1.0'
  applicable_bundles:
  - commerce_stock
  checks:
  - kind: must_contain_any
    values:
    - commerce_stock.service_manager
    - StockServiceManager
    - getStockLevel
    - receiveStock
    - createTransaction
  scoring:
    combine: all_pass
- id: commerce_stock_commerce_stock_known_default
  version: '1.0'
  applicable_bundles:
  - commerce_stock
  checks:
  - kind: must_contain_any
    values:
    - local_stock
  scoring:
    combine: all_pass
- id: commerce_stock_commerce_stock_known_bundle_service
  version: '1.0'
  applicable_bundles:
  - commerce_stock
  checks:
  - kind: must_contain_any
    values:
    - local_stock
  scoring:
    combine: all_pass
- id: commerce_stock_commerce_stock_set_default
  version: '1.0'
  applicable_bundles:
  - commerce_stock
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
- id: commerce_stock_commerce_stock_disable_events
  version: '1.0'
  applicable_bundles:
  - commerce_stock
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
