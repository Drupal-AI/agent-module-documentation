rubrics:
- id: colorbox_load_colorbox_load_renderer_id
  version: '1.0'
  applicable_bundles:
  - colorbox_load
  checks:
  - kind: must_contain_any
    values:
    - drupal_colorbox
    - render.main_content_renderer
    - main content renderer
  scoring:
    combine: all_pass
- id: colorbox_load_colorbox_load_where_configured
  version: '1.0'
  applicable_bundles:
  - colorbox_load
  checks:
  - kind: must_contain_any
    values:
    - ng_lightbox.settings
    - /admin/config/media/ng-lightbox
    - patterns
  scoring:
    combine: all_pass
- id: colorbox_load_colorbox_load_ajax_command
  version: '1.0'
  applicable_bundles:
  - colorbox_load
  checks:
  - kind: must_contain_any
    values:
    - colorboxLoadOpen
    - OpenCommand
  scoring:
    combine: all_pass
- id: colorbox_load_colorbox_load_known_paths
  version: '1.0'
  applicable_bundles:
  - colorbox_load
  checks:
  - kind: must_contain_any
    values:
    - /cbl-demo
  scoring:
    combine: all_pass
- id: colorbox_load_colorbox_load_known_style
  version: '1.0'
  applicable_bundles:
  - colorbox_load
  checks:
  - kind: must_contain_any
    values:
    - cbl-eval-overlay
  scoring:
    combine: all_pass
- id: colorbox_load_colorbox_load_lightbox_path
  version: '1.0'
  applicable_bundles:
  - colorbox_load
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
- id: colorbox_load_colorbox_load_overlay_style
  version: '1.0'
  applicable_bundles:
  - colorbox_load
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
