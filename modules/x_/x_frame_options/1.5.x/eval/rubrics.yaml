rubrics:
- id: x_frame_options_configuration_xfo_config_and_directives
  version: '1.0'
  applicable_bundles:
  - x_frame_options_configuration
  checks:
  - kind: must_contain_any
    values:
    - x_frame_options_configuration.settings
    - DENY
    - SAMEORIGIN
    - ALLOW-FROM
  scoring:
    combine: all_pass
- id: x_frame_options_configuration_xfo_allow_all
  version: '1.0'
  applicable_bundles:
  - x_frame_options_configuration
  checks:
  - kind: must_contain_any
    values:
    - remove
    - removes
    - no header
    - not set
  scoring:
    combine: all_pass
- id: x_frame_options_configuration_xfo_mechanism
  version: '1.0'
  applicable_bundles:
  - x_frame_options_configuration
  checks:
  - kind: must_contain_any
    values:
    - x_frame_options_configuration
    - subscriber
    - response
    - XframeSubscriber
  scoring:
    combine: all_pass
- id: x_frame_options_configuration_xfo_known_directive
  version: '1.0'
  applicable_bundles:
  - x_frame_options_configuration
  checks:
  - kind: must_contain_any
    values:
    - SAMEORIGIN
  scoring:
    combine: all_pass
- id: x_frame_options_configuration_xfo_known_uri
  version: '1.0'
  applicable_bundles:
  - x_frame_options_configuration
  checks:
  - kind: must_contain_any
    values:
    - xfo-partner.example.com
  scoring:
    combine: all_pass
- id: x_frame_options_configuration_xfo_set_deny
  version: '1.0'
  applicable_bundles:
  - x_frame_options_configuration
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
- id: x_frame_options_configuration_xfo_change_to_sameorigin
  version: '1.0'
  applicable_bundles:
  - x_frame_options_configuration
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
