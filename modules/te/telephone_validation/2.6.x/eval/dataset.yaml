metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: telephone_validation
  version: 2.6.x
  note: Telephone Validation adds a validation constraint + Validator service to core telephone fields
    using giggsey/libphonenumber-for-php. Cases are `recipe` (response-graded) since they probe documented
    facts an agent would otherwise read source to answer; no site mutation.
questions:
- id: tv-library-dependency
  input: Which third-party PHP library does the Drupal telephone_validation module use to validate phone
    numbers, and how is it installed?
  criteria: It uses giggsey/libphonenumber-for-php (a PHP port of Google's libphonenumber), pulled in
    via Composer when you require drupal/telephone_validation.
  bundle: telephone_validation
  rubric_ref: rubric/telephone_validation_tv_library_dependency@1.0
  tags:
  - mode:recipe
- id: tv-enable-on-field
  input: On a Drupal 11 site, how do I turn on phone-number validation for an existing core Telephone
    field, and which two settings do I choose?
  criteria: 'On the telephone field''s settings form there is a ''Telephone validation'' fieldset: check
    Enabled, then pick a Format (E164 or National) and Country/countries. These save as the field''s telephone_validation
    third-party settings (format, country).'
  bundle: telephone_validation
  rubric_ref: rubric/telephone_validation_tv_enable_on_field@1.0
  tags:
  - mode:recipe
- id: tv-e164-vs-national
  input: In telephone_validation, what is the difference between the E164 and National validation formats,
    and when must I select a country?
  criteria: E164 expects a +countrycode number and auto-detects the region (country list is an optional
    allow-list); National has no + prefix so exactly one country must be selected to supply the default
    region.
  bundle: telephone_validation
  rubric_ref: rubric/telephone_validation_tv_e164_vs_national@1.0
  tags:
  - mode:recipe
- id: tv-validator-service
  input: Which Drupal service validates a phone number in telephone_validation, and which method checks
    validity?
  criteria: The telephone_validation.validator service (Drupal\telephone_validation\Validator); its isValid($value,
    $format, $country) method parses with PhoneNumberUtil and returns a bool.
  bundle: telephone_validation
  rubric_ref: rubric/telephone_validation_tv_validator_service@1.0
  tags:
  - mode:recipe
- id: tv-constraint-plugin
  input: What validation constraint plugin does telephone_validation add to telephone fields, and how
    does it get attached to the field type?
  criteria: The 'Telephone' constraint (TelephoneConstraint / TelephoneConstraintValidator) is attached
    to the telephone field type via hook_field_info_alter(), and only acts when the field instance has
    telephone_validation third-party settings.
  bundle: telephone_validation
  rubric_ref: rubric/telephone_validation_tv_constraint_plugin@1.0
  tags:
  - mode:recipe
- id: tv-country-dependency
  input: Which core Drupal module must be enabled for telephone_validation to work?
  criteria: The core Telephone module (drupal:telephone) — telephone_validation adds validation to its
    field type.
  bundle: telephone_validation
  rubric_ref: rubric/telephone_validation_tv_country_dependency@1.0
  tags:
  - mode:recipe
- id: tv-global-defaults
  input: Where are the site-wide default telephone validation settings stored in telephone_validation,
    and what config keys do they use?
  criteria: In the telephone_validation.settings config object (format and country keys), edited at /admin/config/content/telephone_validation;
    these defaults seed the core tel element via hook_element_info_alter().
  bundle: telephone_validation
  rubric_ref: rubric/telephone_validation_tv_global_defaults@1.0
  tags:
  - mode:recipe
