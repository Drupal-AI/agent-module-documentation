rubrics:
- id: text_summary_options_text_summary_options_what_settings
  version: '1.0'
  applicable_bundles:
  - text_summary_options
  checks:
  - kind: must_contain_any
    values:
    - show_summary
    - Show summary
    - summary_help
    - summary help
    - summary_placeholder
    - placeholder
  scoring:
    combine: all_pass
- id: text_summary_options_text_summary_options_where_stored
  version: '1.0'
  applicable_bundles:
  - text_summary_options
  checks:
  - kind: must_contain_any
    values:
    - third_party_settings
    - third party setting
    - text_summary_options
    - field.field
    - FieldConfig
    - getThirdPartySetting
  scoring:
    combine: all_pass
- id: text_summary_options_text_summary_options_field_type
  version: '1.0'
  applicable_bundles:
  - text_summary_options
  checks:
  - kind: must_contain_any
    values:
    - text_with_summary
    - Text area with a summary
    - with summary
    - attached
    - expanded
    - Edit summary
  scoring:
    combine: all_pass
- id: text_summary_options_text_summary_options_configured_field
  version: '1.0'
  applicable_bundles:
  - text_summary_options
  checks:
  - kind: must_contain_any
    values:
    - field_tso_sum
    - TSO placeholder marker one
  scoring:
    combine: all_pass
- id: text_summary_options_text_summary_options_help_text
  version: '1.0'
  applicable_bundles:
  - text_summary_options
  checks:
  - kind: must_contain_any
    values:
    - TSO help marker two text
  scoring:
    combine: all_pass
- id: text_summary_options_text_summary_options_enable_show
  version: '1.0'
  applicable_bundles:
  - text_summary_options
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
- id: text_summary_options_text_summary_options_set_placeholder
  version: '1.0'
  applicable_bundles:
  - text_summary_options
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
