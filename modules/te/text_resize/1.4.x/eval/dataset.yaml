metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: text_resize
  version: 1.4.x
  note: 'Text Resize provides a block plugin text_resize_block (+A/-A/reset links) placed via Block Layout,
    plus one config object text_resize.settings (form route text_resize_settings at /admin/config/user-interface/text_resize,
    permission ''administer text_resize''): text_resize_scope (default ''main''), text_resize_minimum
    (12), text_resize_maximum (25), text_resize_reset_button (false), text_resize_line_height_allow (false),
    _min (16), _max (36). No dependencies beyond core Block, no Drush, no plugin types. Medium/hard cases
    are grounded in the real text_resize.settings config and in a live block placement of text_resize_block
    (cleanup removes any such placement). Shipped defaults are restored explicitly.'
questions:
- id: text_resize-what
  input: I want to let visitors make the text on my Drupal site bigger or smaller with on-page buttons.
    Which module does this and what are the two steps to get it showing?
  criteria: Text Resize. Place its 'Text Resize' block (plugin text_resize_block) in a region via Block
    Layout, and configure behavior (scope, min/max size, reset button) at /admin/config/user-interface/text_resize.
  bundle: text_resize
  rubric_ref: rubric/text_resize_text_resize_what@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: text_resize-config
  input: In the Text Resize module, which config object and setting control which part of the page gets
    resized, and the minimum/maximum font size? What is the default scope?
  criteria: 'Config object text_resize.settings: text_resize_scope is the CSS selector resized (default
    ''main''), text_resize_minimum (12px) and text_resize_maximum (25px) bound the size; also text_resize_reset_button
    and the line-height options.'
  bundle: text_resize
  rubric_ref: rubric/text_resize_text_resize_config@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: text_resize-permission
  input: Which permission controls access to the Text Resize settings form?
  criteria: The 'administer text_resize' permission gates the settings form at /admin/config/user-interface/text_resize
    (route text_resize_settings).
  bundle: text_resize
  rubric_ref: rubric/text_resize_text_resize_permission@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: text_resize-tr-scope
  input: On this Drupal site, the Text Resize module's scope has been customized. Inspect the live configuration
    and state which CSS selector/scope the text resizing is applied to.
  criteria: text_resize_scope is 'main-content' in text_resize.settings (read via `drush config:get text_resize.settings
    text_resize_scope`).
  bundle: text_resize
  rubric_ref: rubric/text_resize_text_resize_tr_scope@1.0
  tags:
  - mode:introspection
  - difficulty:medium
