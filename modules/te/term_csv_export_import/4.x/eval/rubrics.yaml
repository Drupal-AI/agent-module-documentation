rubrics:
- id: term_csv_export_import_term_csv_export_import_csv_format
  version: '1.0'
  applicable_bundles:
  - term_csv_export_import
  checks:
  - kind: must_contain_any
    values:
    - parent_name
    - name,status
    - description__value
  scoring:
    combine: all_pass
- id: term_csv_export_import_term_csv_export_import_where
  version: '1.0'
  applicable_bundles:
  - term_csv_export_import
  checks:
  - kind: must_contain_any
    values:
    - admin/config/content/term-csv-import
    - term-csv-export
    - administer term_csv_export_import
  scoring:
    combine: all_pass
- id: term_csv_export_import_term_csv_export_import_export_options
  version: '1.0'
  applicable_bundles:
  - term_csv_export_import
  checks:
  - kind: must_contain_any
    values:
    - Include Term Ids
    - Include Term Headers
    - include_ids
    - include_headers
    - include extra fields
    - fields
  scoring:
    combine: all_pass
- id: term_csv_export_import_term_csv_export_import_known_parent
  version: '1.0'
  applicable_bundles:
  - term_csv_export_import
  checks:
  - kind: must_contain_any
    values:
    - tcei_Region
  scoring:
    combine: all_pass
- id: term_csv_export_import_term_csv_export_import_count_children
  version: '1.0'
  applicable_bundles:
  - term_csv_export_import
  checks:
  - kind: must_contain_any
    values:
    - '3'
    - three
  scoring:
    combine: all_pass
- id: term_csv_export_import_term_csv_export_import_import_hierarchy
  version: '1.0'
  applicable_bundles:
  - term_csv_export_import
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
- id: term_csv_export_import_term_csv_export_import_import_flat
  version: '1.0'
  applicable_bundles:
  - term_csv_export_import
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
