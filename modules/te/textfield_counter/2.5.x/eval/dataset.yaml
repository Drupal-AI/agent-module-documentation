metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: textfield_counter
  version: 2.5.x
  note: 'Textfield Counter provides five field widgets (string_textfield_with_counter/string, string_textarea_with_counter/string_long,
    text_textfield_with_counter/text, text_textarea_with_counter/text_long, text_textarea_with_summary_and_counter/text_with_summary)
    that show a live character counter and enforce a max length. No settings form (configure=null); configured
    per field on Manage form display and stored on the entity_form_display component: content.<field>.type
    + settings.{maxlength (0=disabled), counter_position before|after, js_prevent_submit, count_only_mode,
    count_html_characters, textcount_status_message, use_field_maxlength}. Server-side validation blocks
    over-limit submissions unless count_only_mode. Medium cases read back a known maxlength (140) and
    a known counter_position (before); hard cases switch a field from the core widget to the counter widget
    with a limit, and set a specific 100-char limit, verified against the live entity_form_display.'
questions:
- id: textfield_counter-widgets-list
  input: I enabled the textfield_counter module but I can't find a settings page. How do I actually add
    a character counter to a Drupal text field, and what are the widget machine names it provides?
  criteria: 'There is no settings page (configure=null). On the entity''s Manage form display, choose
    the counter widget matching the field type: string_textfield_with_counter (string), string_textarea_with_counter
    (string_long), text_textfield_with_counter (text), text_textarea_with_counter (text_long), text_textarea_with_summary_and_counter
    (text_with_summary).'
  bundle: textfield_counter
  rubric_ref: rubric/textfield_counter_textfield_counter_widgets_list@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: textfield_counter-maxlength-key
  input: For the textfield_counter widgets, which widget setting sets the character limit, and what happens
    if I set it to 0?
  criteria: The maxlength widget setting sets the character limit. Setting maxlength to 0 disables the
    counter on that field. Textfield widgets can instead reuse the field's storage max-length via use_field_maxlength.
  bundle: textfield_counter
  rubric_ref: rubric/textfield_counter_textfield_counter_maxlength_key@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: textfield_counter-enforcement
  input: Does the textfield_counter module actually stop a user from submitting text longer than the limit,
    or is the counter only visual? Which setting changes that behaviour?
  criteria: By default it enforces the limit server-side (a form validation error blocks submission when
    over maxlength). Enabling count_only_mode makes the counter informational only (no validation). js_prevent_submit
    adds an extra client-side JS guard on top of server validation.
  bundle: textfield_counter
  rubric_ref: rubric/textfield_counter_textfield_counter_enforcement@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: textfield_counter-known-maxlength
  input: On this Drupal site, the Article content type has a field field_tfc_known that uses a Textfield
    Counter widget. Inspect the live default form display and state the maximum character count configured
    for it.
  criteria: field_tfc_known uses the text_textarea_with_counter widget with settings.maxlength = 140 in
    core.entity_form_display.node.article.default.
  bundle: textfield_counter
  rubric_ref: rubric/textfield_counter_textfield_counter_known_maxlength@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/textfield_counter-known-maxlength-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/textfield_counter-known-maxlength-cleanup.sh
- id: textfield_counter-known-position
  input: The Article content type on this site has a field field_tfc_pos using a Textfield Counter widget.
    Inspect the live default form display and state where the character counter is positioned relative
    to the input (before or after).
  criteria: field_tfc_pos uses string_textarea_with_counter with settings.counter_position = 'before'
    (and maxlength 200), so the counter is shown before the input.
  bundle: textfield_counter
  rubric_ref: rubric/textfield_counter_textfield_counter_known_position@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/textfield_counter-known-position-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/textfield_counter-known-position-cleanup.sh
- id: textfield_counter-add-counter
  input: On this Drupal site, the Article content type has a formatted long-text field field_tfc_task
    that currently uses the standard textarea widget. Using the textfield_counter module, give this field
    a live character counter that limits it to 500 characters, and apply the change to the live default
    form display.
  criteria: In core.entity_form_display.node.article.default set the field_tfc_task component type to
    text_textarea_with_counter and settings.maxlength to 500 (any value >= 1). The verify checks the widget
    is text_textarea_with_counter with maxlength >= 1.
  bundle: textfield_counter
  rubric_ref: rubric/textfield_counter_textfield_counter_add_counter@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/textfield_counter-add-counter-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/textfield_counter-add-counter-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/textfield_counter-add-counter-verify.sh
- id: textfield_counter-set-limit
  input: On this Drupal site the Article field field_tfc_limit already uses a Textfield Counter widget,
    but the counter is currently disabled (no limit). Configure it to limit entries to exactly 100 characters,
    and apply the change to the live site.
  criteria: In core.entity_form_display.node.article.default set the field_tfc_limit component's settings.maxlength
    to 100 (keeping widget string_textfield_with_counter). The verify checks maxlength === 100.
  bundle: textfield_counter
  rubric_ref: rubric/textfield_counter_textfield_counter_set_limit@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/textfield_counter-set-limit-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/textfield_counter-set-limit-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/textfield_counter-set-limit-verify.sh
