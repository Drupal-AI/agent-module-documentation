rubrics:
- id: term_reference_change_term_reference_change_services
  version: '1.0'
  applicable_bundles:
  - term_reference_change
  checks:
  - kind: must_contain_any
    values:
    - term_reference_change.migrator
    - migrateReference
    - ReferenceMigrator
  scoring:
    combine: all_pass
- id: term_reference_change_term_reference_change_which_fields_count
  version: '1.0'
  applicable_bundles:
  - term_reference_change
  checks:
  - kind: must_contain_any
    values:
    - entity_reference
    - target_type
    - taxonomy_term
    - parent
  scoring:
    combine: all_pass
- id: term_reference_change_term_reference_change_limit_argument
  version: '1.0'
  applicable_bundles:
  - term_reference_change
  checks:
  - kind: must_contain_any
    values:
    - entity type
    - entity_type
    - keyed by
    - entity ids
    - entity IDs
  scoring:
    combine: all_pass
- id: term_reference_change_term_reference_change_known_usage
  version: '1.0'
  applicable_bundles:
  - term_reference_change
  checks:
  - kind: must_contain_any
    values:
    - field_trc_topic
  scoring:
    combine: all_pass
- id: term_reference_change_term_reference_change_which_field
  version: '1.0'
  applicable_bundles:
  - term_reference_change
  checks:
  - kind: must_contain_any
    values:
    - field_trc_primary
  scoring:
    combine: all_pass
- id: term_reference_change_term_reference_change_merge_all
  version: '1.0'
  applicable_bundles:
  - term_reference_change
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
- id: term_reference_change_term_reference_change_merge_limited
  version: '1.0'
  applicable_bundles:
  - term_reference_change
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
