metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: textarea_widget_for_text
  version: 1.4.x
  note: 'Textarea Widget For Text Fields is a single hook_field_widget_info_alter() that adds the ''text''
    field type to core''s text_textarea widget and the ''string'' field type to core''s string_textarea
    widget, so short text fields can use a multi-row textarea. NO configure route, no settings form, no
    config schema, no permissions, no Drush, no plugins. Its only persistent state is the widget ''type''
    on a field component in an entity_form_display config entity (string_textarea for plain, text_textarea
    for formatted). Medium/hard cases are grounded in that real form-display config: introspection reads
    back which widget a short text field uses; execution switches a short text field''s widget to the
    textarea widget, verified against the live entity_form_display.'
questions:
- id: textarea_widget_for_text-how
  input: On Drupal 11 I have a plain short text field but its edit form only shows a single-line input.
    Using the textarea_widget_for_text module, how do I let it use a multi-row textarea instead, and where
    do I change that?
  criteria: Enable the module, then on the bundle's Manage form display change the field's widget from
    Textfield to 'Text area (multiple rows)' (widget string_textarea for a plain/string field, text_textarea
    for a formatted/text field).
  bundle: textarea_widget_for_text
  rubric_ref: rubric/textarea_widget_for_text_textarea_widget_for_text_how@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: textarea_widget_for_text-field-types
  input: Which field types does the textarea_widget_for_text module enable the multi-row textarea widget
    for, and which core widgets does it extend?
  criteria: It adds the 'string' (plain) field type to core's string_textarea widget and the 'text' (formatted)
    field type to core's text_textarea widget.
  bundle: textarea_widget_for_text
  rubric_ref: rubric/textarea_widget_for_text_textarea_widget_for_text_field_types@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: textarea_widget_for_text-hook
  input: How does the textarea_widget_for_text module technically make the textarea widget available to
    short text fields, and could you do the same without the module?
  criteria: It implements hook_field_widget_info_alter(), appending 'text' to text_textarea['field_types']
    and 'string' to string_textarea['field_types']. You could replicate it with the same two-line hook
    in a custom module.
  bundle: textarea_widget_for_text
  rubric_ref: rubric/textarea_widget_for_text_textarea_widget_for_text_hook@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: textarea_widget_for_text-known-string
  input: On this Drupal site the Article content type has a plain text field field_taw_known that has
    been set to use a multi-row textarea via the textarea_widget_for_text module. Inspect the live default
    form display and give the exact widget type (machine name) it uses.
  criteria: In core.entity_form_display.node.article.default the field_taw_known component uses widget
    type string_textarea. Read via drush cget core.entity_form_display.node.article.default content.field_taw_known.
  bundle: textarea_widget_for_text
  rubric_ref: rubric/textarea_widget_for_text_textarea_widget_for_text_known_string@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/textarea_widget_for_text-known-string-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/textarea_widget_for_text-known-string-cleanup.sh
- id: textarea_widget_for_text-known-text
  input: The Article content type on this site has a formatted text field field_taw_fmt whose edit widget
    is a textarea (enabled by textarea_widget_for_text). Inspect the running form-display config and state
    the widget type machine name used for that field.
  criteria: In core.entity_form_display.node.article.default the field_taw_fmt component uses widget type
    text_textarea.
  bundle: textarea_widget_for_text
  rubric_ref: rubric/textarea_widget_for_text_textarea_widget_for_text_known_text@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/textarea_widget_for_text-known-text-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/textarea_widget_for_text-known-text-cleanup.sh
- id: textarea_widget_for_text-set-string
  input: On this Drupal site, the Article content type has a plain text field field_taw_task that currently
    uses the single-line Textfield widget. Using the textarea_widget_for_text module, change its default
    form-display widget to the multi-row Text area (string_textarea). Apply the change to the live site.
  criteria: In core.entity_form_display.node.article.default the field_taw_task component has type=string_textarea
