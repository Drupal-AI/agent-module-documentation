metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: text_field_formatter
  version: 2.0.x
  note: 'Text Field Formatter provides one field formatter, id text_field_formatter (''Text field formatter''),
    for string fields; it extends core StringFormatter and wraps the value in an HTML tag with configurable
    classes/attributes. Settings: wrap_tag (default _none; div/h1-h6/span, never ''a''), wrap_class (space/comma-separated),
    wrap_attributes (one attribute|value per line), override_link_label (token-aware, only with link_to_entity).
    Stored in core.entity_view_display.<entity>.<bundle>.<mode> -> content.<field> type text_field_formatter
    + settings. Available wrap tags are alterable via hook_default_wrap_tags_alter(). No config UI, no
    permissions, no Drush. Medium/hard cases are grounded in the real entity_view_display formatter config;
    each uses a namespaced string field on Article (field_tff_*).'
questions:
- id: tff-what-it-is
  input: What does the text_field_formatter module's field formatter do, and which field type can it be
    applied to?
  criteria: It adds a 'Text field formatter' (id text_field_formatter) for string fields that extends
    core's String formatter, wrapping the value in a chosen HTML tag with configurable CSS classes and
    attributes.
  bundle: text_field_formatter
  rubric_ref: rubric/text_field_formatter_tff_what_it_is@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: tff-settings-keys
  input: Which formatter settings does text_field_formatter add for controlling the HTML wrapper around
    a string field's value?
  criteria: 'wrap_tag (the wrapper element: div, h1-h6, span; default _none), wrap_class (space/comma-separated
    CSS classes), wrap_attributes (one attribute|value per line), plus override_link_label (used with
    link_to_entity).'
  bundle: text_field_formatter
  rubric_ref: rubric/text_field_formatter_tff_settings_keys@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: tff-alter-tags
  input: How can another module add an extra wrapper tag option (for example 'p') to the text_field_formatter,
    and is there a tag the formatter refuses to use?
  criteria: Implement hook_default_wrap_tags_alter(array &$wrappers) to add (e.g. $wrappers['p'] = t('P'))
    or remove tags. The formatter refuses the 'a' tag (it is stripped with a warning) to avoid clashing
    with the link-to-entity feature.
  bundle: text_field_formatter
  rubric_ref: rubric/text_field_formatter_tff_alter_tags@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: tff-known-tag
  input: On this Drupal site the Article content type has a string field field_tff_known displayed with
    the text_field_formatter. Inspect the live view-display configuration and report the wrapper HTML
    tag (wrap_tag) configured for it.
  criteria: In core.entity_view_display.node.article.default the field_tff_known component has type text_field_formatter
    with settings.wrap_tag = h2.
  bundle: text_field_formatter
  rubric_ref: rubric/text_field_formatter_tff_known_tag@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/tff-known-tag-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/tff-known-tag-cleanup.sh
- id: tff-known-class
  input: On this site the Article content type has a string field field_tff_class shown with the text_field_formatter.
    Inspect the live view-display configuration and report the wrapper CSS class(es) (wrap_class) configured
    for it.
  criteria: In core.entity_view_display.node.article.default the field_tff_class component (type text_field_formatter)
    has settings.wrap_class = ribbon (with wrap_tag span).
  bundle: text_field_formatter
  rubric_ref: rubric/text_field_formatter_tff_known_class@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/tff-known-class-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/tff-known-class-cleanup.sh
- id: tff-set-formatter
  input: On this Drupal site, the Article content type has a string field field_tff_task. Configure Article's
    default view display so this field is rendered with the text_field_formatter, wrapping the value in
    a <div> with the CSS class 'callout'. Apply the change to the live site.
  criteria: In core.entity_view_display.node.article.default the field_tff_task component has type text_field_formatter
    with settings.wrap_tag 'div' and settings.wrap_class containing 'callout'.
  bundle: text_field_formatter
  rubric_ref: rubric/text_field_formatter_tff_set_formatter@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/tff-set-formatter-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/tff-set-formatter-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/tff-set-formatter-verify.sh
- id: tff-set-attributes
  input: On this Drupal site, the Article content type has a string field field_tff_task2. Configure Article's
    default view display to render it with the text_field_formatter using a <span> wrapper that carries
    the HTML attribute data-role=note (via the formatter's wrapper attributes). Apply the change to the
    live site.
  criteria: In core.entity_view_display.node.article.default the field_tff_task2 component has type text_field_formatter,
    settings.wrap_tag 'span', and settings.wrap_attributes containing 'data-role|note'.
  bundle: text_field_formatter
  rubric_ref: rubric/text_field_formatter_tff_set_attributes@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/tff-set-attributes-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/tff-set-attributes-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/tff-set-attributes-verify.sh
