rubrics:
- id: term_merge_term_merge_service_api
  version: '1.0'
  applicable_bundles:
  - term_merge
  checks:
  - kind: must_contain_any
    values:
    - term_merge.term_merger
    - mergeIntoNewTerm
    - mergeIntoTerm
  scoring:
    combine: all_pass
- id: term_merge_term_merge_access_requirements
  version: '1.0'
  applicable_bundles:
  - term_merge
  checks:
  - kind: must_contain_any
    values:
    - merge taxonomy terms
    - _term_merge_access_check
    - administer taxonomy
  scoring:
    combine: all_pass
- id: term_merge_term_merge_react_to_merge
  version: '1.0'
  applicable_bundles:
  - term_merge
  checks:
  - kind: must_contain_any
    values:
    - term_merge.terms_merged
    - TermMergeEventNames
    - TermsMergedEvent
  scoring:
    combine: all_pass
- id: term_merge_term_merge_role_grant
  version: '1.0'
  applicable_bundles:
  - term_merge
  checks:
  - kind: must_contain_any
    values:
    - tm_merger
  scoring:
    combine: all_pass
- id: term_merge_term_merge_vocab_route
  version: '1.0'
  applicable_bundles:
  - term_merge
  checks:
  - kind: must_contain_any
    values:
    - tm_dupes_x9
  scoring:
    combine: all_pass
- id: term_merge_term_merge_grant_merge_role
  version: '1.0'
  applicable_bundles:
  - term_merge
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
- id: term_merge_term_merge_user_can_merge
  version: '1.0'
  applicable_bundles:
  - term_merge
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
