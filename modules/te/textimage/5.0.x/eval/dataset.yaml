metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: textimage
  version: 5.0.x
  note: 'Textimage renders text onto images by pairing Image Effects'' ''Text overlay'' effect with text
    from field values, the textimage.factory API, tokens, or direct URL generation. It ships two field
    formatters (textimage_text_field_formatter for text/text_long/text_with_summary, textimage_image_field_formatter
    for image), a settings config object textimage.settings (default_extension, url_generation.enabled/text_separator,
    default_font, debug), image-style third-party option (uri_scheme), tokens [entity:textimage-url:field]/[entity:textimage-uri:field],
    and one permission ''generate textimage url derivatives''. Medium/hard cases are grounded in real
    config that does NOT require GD/font rendering: introspection reads textimage.settings values; execution
    switches a field''s view-display formatter to textimage_text_field_formatter and flips url_generation
    on, verified against live config.'
questions:
- id: textimage-text-overlay-mechanism
  input: How does the Drupal Textimage module actually put text onto an image? Which image effect / module
    does it build on, and where does the text come from?
  criteria: 'Textimage relies on the Image Effects module''s ''Text overlay'' image effect inside an image
    style: the effect''s Default text is replaced at render time by text coming from a field value, the
    textimage.factory API, or a URL path.'
  bundle: textimage
  rubric_ref: rubric/textimage_textimage_text_overlay_mechanism@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: textimage-formatter-ids
  input: Which field formatters does the Textimage module provide, and what are their machine IDs and
    applicable field types?
  criteria: 'Two formatters: textimage_text_field_formatter (for text, text_long, text_with_summary fields)
    and textimage_image_field_formatter (for image fields). Each takes an image_style setting pointing
    to a style with a Text overlay effect.'
  bundle: textimage
  rubric_ref: rubric/textimage_textimage_formatter_ids@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: textimage-tokens
  input: In Drupal Textimage, which tokens return the location (URL or URI) of a generated Textimage image
    for a field?
  criteria: '[<entity>:textimage-url:<field>{:display}{:sequence}] for the URL and [<entity>:textimage-uri:<field>{:display}{:sequence}]
    for the URI, e.g. [node:textimage-url:field_tagline].'
  bundle: textimage
  rubric_ref: rubric/textimage_textimage_tokens@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: textimage-default-extension
  input: On this Drupal site, what image file format (extension) will Textimage generate by default for
    its derivatives? Inspect the live Textimage configuration.
  criteria: 'jpg — textimage.settings has default_extension: jpg (read via `drush cget textimage.settings
    default_extension`).'
  bundle: textimage
  rubric_ref: rubric/textimage_textimage_default_extension@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/textimage-default-extension-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/textimage-default-extension-cleanup.sh
- id: textimage-url-generation-cfg
  input: Is Textimage's direct URL-based image generation enabled on this site, and if so what is the
    configured text separator used to split URL text into separate Text overlay effects? Inspect the live
    configuration.
  criteria: 'URL generation is enabled and the text_separator is ''###'' — textimage.settings url_generation.enabled:
    true, url_generation.text_separator: ''###''.'
  bundle: textimage
  rubric_ref: rubric/textimage_textimage_url_generation_cfg@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/textimage-url-generation-cfg-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/textimage-url-generation-cfg-cleanup.sh
- id: textimage-text-formatter
  input: On this Drupal site the Article content type has a text field field_ti_head. Configure the default
    view display so this field is rendered with Textimage's text field formatter (textimage_text_field_formatter).
    Apply the change to the live site.
  criteria: 'In core.entity_view_display.node.article.default the field_ti_head component has type: textimage_text_field_formatter
    (e.g. set the component via the entity_display.repository view display and save, or pick ''Textimage''
    on Manage display).'
  bundle: textimage
  rubric_ref: rubric/textimage_textimage_text_formatter@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/textimage-text-formatter-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/textimage-text-formatter-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/textimage-text-formatter-verify.sh
- id: textimage-enable-url
  input: On this Drupal site, enable Textimage's direct URL-based image generation so images can be produced
    straight from a URL path. Apply the change to the live configuration.
  criteria: textimage.settings url_generation.enabled is set to TRUE (e.g. via configFactory getEditable('textimage.settings')->set('url_generation.enabled',
    TRUE)->save(), or tick 'Enable' on /admin/config/media/textimage).
  bundle: textimage
  rubric_ref: rubric/textimage_textimage_enable_url@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/textimage-enable-url-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/textimage-enable-url-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/textimage-enable-url-verify.sh
