rubrics:
- id: textimage_textimage_text_overlay_mechanism
  version: '1.0'
  applicable_bundles:
  - textimage
  checks:
  - kind: must_contain_any
    values:
    - Text overlay
    - image_effects
    - Image Effects
    - image effect
  scoring:
    combine: all_pass
- id: textimage_textimage_formatter_ids
  version: '1.0'
  applicable_bundles:
  - textimage
  checks:
  - kind: must_contain_any
    values:
    - textimage_text_field_formatter
    - textimage_image_field_formatter
  scoring:
    combine: all_pass
- id: textimage_textimage_tokens
  version: '1.0'
  applicable_bundles:
  - textimage
  checks:
  - kind: must_contain_any
    values:
    - textimage-url
    - textimage-uri
  scoring:
    combine: all_pass
- id: textimage_textimage_default_extension
  version: '1.0'
  applicable_bundles:
  - textimage
  checks:
  - kind: must_contain_any
    values:
    - jpg
  scoring:
    combine: all_pass
- id: textimage_textimage_url_generation_cfg
  version: '1.0'
  applicable_bundles:
  - textimage
  checks:
  - kind: must_contain_any
    values:
    - '###'
  scoring:
    combine: all_pass
- id: textimage_textimage_text_formatter
  version: '1.0'
  applicable_bundles:
  - textimage
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
- id: textimage_textimage_enable_url
  version: '1.0'
  applicable_bundles:
  - textimage
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
