rubrics:
- id: term_condition_term_condition_what_and_where
  version: '1.0'
  applicable_bundles:
  - term_condition
  checks:
  - kind: must_contain_any
    values:
    - condition
    - Condition
    - block visibility
    - Visibility
    - term
  scoring:
    combine: all_pass
- id: term_condition_term_condition_storage_key
  version: '1.0'
  applicable_bundles:
  - term_condition
  checks:
  - kind: must_contain_any
    values:
    - term_uuids
    - uuid
    - UUID
  scoring:
    combine: all_pass
- id: term_condition_term_condition_empty_behaviour
  version: '1.0'
  applicable_bundles:
  - term_condition
  checks:
  - kind: must_contain_any
    values:
    - 'TRUE'
    - 'true'
    - shown
    - displayed
    - does not restrict
    - passes
  scoring:
    combine: all_pass
- id: term_condition_term_condition_which_term_gates
  version: '1.0'
  applicable_bundles:
  - term_condition
  checks:
  - kind: must_contain_any
    values:
    - TC Gate Term
  scoring:
    combine: all_pass
- id: term_condition_term_condition_is_negated
  version: '1.0'
  applicable_bundles:
  - term_condition
  checks:
  - kind: must_contain_any
    values:
    - negate
    - negated
    - Negate
    - inverted
    - hidden
  scoring:
    combine: all_pass
- id: term_condition_term_condition_gate_block
  version: '1.0'
  applicable_bundles:
  - term_condition
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
- id: term_condition_term_condition_hide_block
  version: '1.0'
  applicable_bundles:
  - term_condition
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
