metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: telephone_formatter
  version: 1.3.x
  note: 'telephone_formatter provides ONE field formatter, `telephone_formatter` (label ''Formatted telephone''),
    for core `telephone` fields. It reformats the number with Google''s libphonenumber into International
    (format=1, default) / E164 (0) / National (2) / RFC3966 (3), and (link=TRUE by default) wraps it in
    a tel: link whose href is the RFC3966 form; an optional default_country (ISO code) parses local numbers.
    Settings persist in field.formatter.settings.telephone_formatter (keys format[int], link[bool], default_country[string]);
    there is no admin page (configure is null) — it is set per field on Manage display. Invalid numbers
    fall back to the raw value. It also exposes a reusable service telephone_formatter.formatter (Drupal\telephone_formatter\Formatter::format($input,$format,$region)).
    Easy cases are response-graded documented facts. Medium cases install a KNOWN telephone_formatter
    display on a real Article telephone field and require live drush introspection of the entity_view_display.
    Hard cases (persona drupal-expert) reset the field''s display to core basic_string, the agent configures
    telephone_formatter with specific settings, and a verify script checks the real entity_view_display
    component.'
questions:
- id: tf-which-formatter
  input: 'On a Drupal 11 site I have a core `telephone` field and want to display the number reformatted
    (International/E164/etc.) and optionally as a click-to-call tel: link. Which contrib module and which
    field formatter id do I use, and which field type does it apply to?'
  criteria: Use the Telephone Formatter module; its formatter id is telephone_formatter (label 'Formatted
    telephone') and it applies to core `telephone` field types. Select it on the entity's Manage display.
  bundle: telephone_formatter
  rubric_ref: rubric/telephone_formatter_tf_which_formatter@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: tf-settings-keys
  input: For the telephone_formatter field formatter, list the settings keys it stores and their defaults.
    Which integer `format` value gives International vs E164 vs National vs RFC3966, and does it render
    a link by default?
  criteria: 'Keys: format (integer, default 1 = International; 0 = E164, 2 = National, 3 = RFC3966), link
    (boolean, default TRUE = wrap in a tel: link whose href is the RFC3966 form), default_country (string
    ISO code, default null). Stored under field.formatter.settings.telephone_formatter.'
  bundle: telephone_formatter
  rubric_ref: rubric/telephone_formatter_tf_settings_keys@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: tf-where-configure
  input: Where do I enable and configure the 'Formatted telephone' formatter — is there an admin settings
    page for the Telephone Formatter module, and what happens if a stored number is invalid?
  criteria: There is no standalone admin page (configure is null). Set the telephone field's Format to
    'Formatted telephone' on the entity's Manage display screen and open the formatter settings. If a
    number can't be parsed/validated the formatter falls back to printing the raw stored value (it never
    fatals).
  bundle: telephone_formatter
  rubric_ref: rubric/telephone_formatter_tf_where_configure@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: tf-known-display-format
  input: 'The Article content type on this site has a telephone field (field_eval_phone) whose default
    display uses the Telephone Formatter. Inspect the live entity_view_display configuration and tell
    me which formatter it uses and its exact settings: the numeric format value (and which libphonenumber
    format that is), whether it renders a link, and the default country.'
  criteria: 'On core.entity_view_display.node.article.default, the field_eval_phone component has type=telephone_formatter
    with settings format=2 (National), link=false (no tel: link), default_country=US.'
  bundle: telephone_formatter
  rubric_ref: rubric/telephone_formatter_tf_known_display_format@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/telephone_formatter-known-display-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/telephone_formatter-known-display-cleanup.sh
- id: tf-known-display-link
  input: 'For the field_eval_phone field on the Article default display on this site, does the Telephone
    Formatter output a clickable tel: link, and is the number shown in International format? Read the
    live entity_view_display config to answer.'
  criteria: 'No — the component''s settings have link=false (so no tel: link is rendered) and format=2,
    which is National format, not International (format=1). So the number is shown as plain National-formatted
    text.'
  bundle: telephone_formatter
  rubric_ref: rubric/telephone_formatter_tf_known_display_link@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/telephone_formatter-known-display-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/telephone_formatter-known-display-cleanup.sh
- id: tf-configure-display
  input: 'On this Drupal site, configure the Article content type''s default display so that its telephone
    field field_eval_tel is rendered by the Telephone Formatter module''s formatter (id telephone_formatter)
    with the RFC3966 format and rendered as a tel: link. Concretely: set the field_eval_tel component
    on node.article.default to type telephone_formatter with settings format=3 and link=TRUE, and apply
    it to the live site.'
  criteria: The node.article.default entity_view_display's field_eval_tel component now has type=telephone_formatter
    with settings format=3 (RFC3966) and link=TRUE.
  bundle: telephone_formatter
  rubric_ref: rubric/telephone_formatter_tf_configure_display@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/telephone_formatter-configure-display-reset.sh
    verify: agent-module-documentation/evaluation/verify/telephone_formatter-configure-display-verify.sh
- id: tf-configure-display-national-nolink
  input: 'On this Drupal site''s Article default display, the telephone field field_eval_tel currently
    uses the core basic_string formatter. Switch it to the Telephone Formatter (telephone_formatter) formatter.
    Use RFC3966 output (format=3) and make the number a clickable tel: link (link=TRUE). Save the display
    to the live site.'
  criteria: node.article.default's field_eval_tel component is changed from basic_string to telephone_formatter
    with settings format=3 and link=TRUE on the live site.
  bundle: telephone_formatter
  rubric_ref: rubric/telephone_formatter_tf_configure_display_national_nolink@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/telephone_formatter-configure-display-reset.sh
    verify: agent-module-documentation/evaluation/verify/telephone_formatter-configure-display-verify.sh
