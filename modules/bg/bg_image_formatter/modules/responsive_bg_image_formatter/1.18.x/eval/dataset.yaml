metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: responsive_bg_image_formatter
  version: 1.18.x
  note: 'responsive_bg_image_formatter is a submodule of bg_image_formatter that renders an image field
    as breakpoint-specific CSS background images using a responsive image style. Cases are `recipe` (response-graded):
    they probe documented facts (formatter id, the responsive image style requirement, dependencies, where
    configured) an agent would otherwise read source to answer; no site mutation.'
questions:
- id: rbgif-what-formatter
  input: On a Drupal 11 site I want an image field to render as a CSS background that changes image per
    breakpoint (responsive). Which module/submodule and formatter do I use?
  criteria: Use the responsive_bg_image_formatter submodule of bg_image_formatter and pick the 'Responsive
    Background Image' formatter for the image field.
  bundle: responsive_bg_image_formatter
  rubric_ref: rubric/responsive_bg_image_formatter_rbgif_what_formatter@1.0
  tags:
  - mode:recipe
- id: rbgif-dependencies
  input: What must be enabled before I can use the Responsive Background Image formatter?
  criteria: Both the parent bg_image_formatter module and Drupal core's responsive_image module must be
    enabled (and at least one responsive image style defined).
  bundle: responsive_bg_image_formatter
  rubric_ref: rubric/responsive_bg_image_formatter_rbgif_dependencies@1.0
  tags:
  - mode:recipe
- id: rbgif-responsive-style
  input: In the Responsive Background Image formatter, what does the image style setting select, and what
    happens if none is chosen?
  criteria: The image_style setting selects a core responsive image style; without one selected the formatter
    produces no output.
  bundle: responsive_bg_image_formatter
  rubric_ref: rubric/responsive_bg_image_formatter_rbgif_responsive_style@1.0
  tags:
  - mode:recipe
- id: rbgif-media-query-removed
  input: The plain Background Image formatter has a manual media query field. Does the Responsive Background
    Image formatter keep it, and where do its media queries come from?
  criteria: No — the manual bg_image_media_query field is removed; media queries are derived from the
    responsive image style's breakpoints/sources.
  bundle: responsive_bg_image_formatter
  rubric_ref: rubric/responsive_bg_image_formatter_rbgif_media_query_removed@1.0
  tags:
  - mode:recipe
- id: rbgif-retina
  input: Does the Responsive Background Image formatter handle high-DPI/retina (2x) images, and how?
  criteria: 'Yes — for 2x srcset candidates it appends a retina media query (-webkit-min-device-pixel-ratio:
    2 / min-resolution: 192dpi) to that rule.'
  bundle: responsive_bg_image_formatter
  rubric_ref: rubric/responsive_bg_image_formatter_rbgif_retina@1.0
  tags:
  - mode:recipe
- id: rbgif-where-configure
  input: Where is the Responsive Background Image formatter configured — is there a dedicated admin settings
    page?
  criteria: No dedicated page (configure is null). Set the image field's Format to 'Responsive Background
    Image' on the entity's Manage display screen and edit the settings there.
  bundle: responsive_bg_image_formatter
  rubric_ref: rubric/responsive_bg_image_formatter_rbgif_where_configure@1.0
  tags:
  - mode:recipe
