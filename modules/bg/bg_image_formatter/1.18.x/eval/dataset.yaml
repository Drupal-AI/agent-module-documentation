metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: bg_image_formatter
  version: 1.18.x
  note: 'bg_image_formatter provides a single image-field formatter that renders an image as a CSS background
    on a selector. Cases are `recipe` (response-graded): they probe documented facts (formatter id, settings
    keys, where it is configured, how output is produced) an agent would otherwise read source to answer;
    no site mutation.'
questions:
- id: bgif-what-formatter
  input: On a Drupal 11 site I want an image field to render as a CSS background-image on an element instead
    of an <img> tag. Which contrib module and which field formatter do I use?
  criteria: Use the Background Images Formatter module (bg_image_formatter); pick the 'Background Image'
    formatter (id bg_image_formatter) for the image field.
  bundle: bg_image_formatter
  rubric_ref: rubric/bg_image_formatter_bgif_what_formatter@1.0
  tags:
  - mode:recipe
- id: bgif-where-configure
  input: Where do I enable and configure the Background Image formatter for an image field? Is there an
    admin settings page?
  criteria: There is no standalone admin page (configure is null). Set the image field's Format to 'Background
    Image' on the entity's Manage display screen and open the formatter settings.
  bundle: bg_image_formatter
  rubric_ref: rubric/bg_image_formatter_bgif_where_configure@1.0
  tags:
  - mode:recipe
- id: bgif-selector-setting
  input: In the Background Image formatter, which setting controls the CSS selector the background is
    applied to, and what is its default value?
  criteria: The bg_image_selector setting (under css_settings) holds the CSS selector, one per line; it
    defaults to 'body'.
  bundle: bg_image_formatter
  rubric_ref: rubric/bg_image_formatter_bgif_selector_setting@1.0
  tags:
  - mode:recipe
- id: bgif-hero-cover
  input: I'm using the Background Image formatter for a hero section and want the image to fill the container.
    Which CSS-settings key sets this and what value do I give it?
  criteria: Set bg_image_background_size to 'cover' (it maps to the CSS background-size property).
  bundle: bg_image_formatter
  rubric_ref: rubric/bg_image_formatter_bgif_hero_cover@1.0
  tags:
  - mode:recipe
- id: bgif-image-style
  input: Can the Background Image formatter apply a Drupal image style to the background image, and what
    does it do if none is chosen?
  criteria: Yes — the image_style setting selects an image style whose derivative URL is used; if left
    empty ('None (original image)') the original image URL is used.
  bundle: bg_image_formatter
  rubric_ref: rubric/bg_image_formatter_bgif_image_style@1.0
  tags:
  - mode:recipe
- id: bgif-media-query
  input: Which Background Image formatter setting lets me apply the background only within a CSS media
    query (e.g. a breakpoint), and what is its default?
  criteria: The bg_image_media_query setting wraps the rule in a media query; it defaults to 'all'.
  bundle: bg_image_formatter
  rubric_ref: rubric/bg_image_formatter_bgif_media_query@1.0
  tags:
  - mode:recipe
- id: bgif-submodule
  input: I need breakpoint-specific responsive background images (different image per screen size) rather
    than one background. Which submodule of Background Images Formatter provides that?
  criteria: The responsive_bg_image_formatter submodule provides the 'Responsive Background Image' formatter,
    which uses a responsive image style to emit one media-query rule per breakpoint.
  bundle: bg_image_formatter
  rubric_ref: rubric/bg_image_formatter_bgif_submodule@1.0
  tags:
  - mode:recipe
