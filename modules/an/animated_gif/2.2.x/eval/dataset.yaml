metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: animated_gif
  version: 2.2.x
  note: 'animated_gif renders animated GIFs without an image style (GD styles flatten them). Detection:
    service Drupal\animated_gif\Service\AnimatedGifInterface, isFileAnAnimatedGif()/isAnAnimatedGif()
    -> TRUE when an image/gif has >=2 frame headers (MINIMUM_NUMBER_OF_ANIMATED_FRAMES=2). It ships field
    formatter animated_gif_image_url (extends core image_url) and #[Hook] preprocess methods (preprocess_image_formatter/responsive_image_formatter/image_style/responsive_image)
    that strip the image style/srcset for animated GIFs, plus an image-widget warning. No settings form/configure
    route/permissions/Drush. Config-only evals grounded in the real formatter id, using image fields on
    Article. Field/view-display deletes only (no nodes), safe on this shared site.'
questions:
- id: animated_gif-detection
  input: How does the Drupal animated_gif module decide whether a GIF file is animated (and therefore
    should skip image styles)?
  criteria: Its AnimatedGif service (isFileAnAnimatedGif / isAnAnimatedGif) checks the file is image/gif
    and scans the bytes for GIF frame headers, returning TRUE when at least two frames are found (MINIMUM_NUMBER_OF_ANIMATED_FRAMES
    = 2). A single-frame or non-GIF file is not animated.
  bundle: animated_gif
  rubric_ref: rubric/animated_gif_animated_gif_detection@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: animated_gif-formatter
  input: Which field formatter does the animated_gif module provide for image fields, and how does it
    differ from core's URL-to-image formatter?
  criteria: It provides the 'animated_gif_image_url' formatter ('Animated GIF URL to image'), which extends
    core's image_url formatter but outputs the original (un-styled) file URL for animated GIFs so the
    animation is preserved, while static images keep their styled URL.
  bundle: animated_gif
  rubric_ref: rubric/animated_gif_animated_gif_formatter@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: animated_gif-bypass-styles
  input: With the animated_gif module enabled, how are animated GIFs shown so their animation isn't lost
    when a field uses an image style?
  criteria: The module's preprocess hooks (preprocess_image_formatter, preprocess_responsive_image_formatter,
    preprocess_image_style, preprocess_responsive_image) detect animated GIFs and strip the image style
    / responsive srcset, rendering the original file so the animation plays. It also warns editors on
    the image upload widget.
  bundle: animated_gif
  rubric_ref: rubric/animated_gif_animated_gif_bypass_styles@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: animated_gif-known-formatter
  input: On this Drupal site the Article content type has an image field field_ag_shown. Inspect the live
    default view display for Article and give the exact formatter (plugin id) configured for field_ag_shown.
  criteria: 'In core.entity_view_display.node.article.default the field_ag_shown component has type: animated_gif_image_url.'
  bundle: animated_gif
  rubric_ref: rubric/animated_gif_animated_gif_known_formatter@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/animated_gif-known-formatter-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/animated_gif-known-formatter-cleanup.sh
