- id: animated_gif-set-formatter
  input: On this Drupal site the Article content type has an image field field_ag_pic using the plain
    'image' formatter on the default view display. Using the animated_gif module, change field_ag_pic's
    default view-display formatter so animated GIFs are served without an image style, and apply it to
    the live site.
  criteria: Set the field_ag_pic component type in core.entity_view_display.node.article.default to animated_gif_image_url
    and save.
