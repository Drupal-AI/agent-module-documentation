rubrics:
- id: animated_gif_animated_gif_detection
  version: '1.0'
  applicable_bundles:
  - animated_gif
  checks:
  - kind: must_contain_any
    values:
    - frame
  scoring:
    combine: all_pass
- id: animated_gif_animated_gif_formatter
  version: '1.0'
  applicable_bundles:
  - animated_gif
  checks:
  - kind: must_contain_any
    values:
    - animated_gif_image_url
  scoring:
    combine: all_pass
- id: animated_gif_animated_gif_bypass_styles
  version: '1.0'
  applicable_bundles:
  - animated_gif
  checks:
