metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: animate_css
  version: 2.1.x
  note: 'Animate CSS is a pure asset-library wrapper: it registers one Drupal library (animate_css/animate)
    whose CSS is animate.css v4 at /libraries/animate.css/animate.css (from the Composer package drupal-shimmy/animate.css
    4.1.1) and attaches it on every page via hook_page_attachments(). No config, configure route, permissions,
    plugins or schema. Easy cases are grounded in the real class contract (animate__animated + animate__<effect>)
    and the library id/path. Because the module stores no per-site config, the medium introspection cases
    read stable live site state via the library.discovery service (library id + installed path). Hard
    cases exercise the real usage contract: create content that carries the correct animate.css v4 class
    names, verified against the stored node body.'
questions:
- id: animate_css-trigger-classes
  input: I have the Drupal animate_css module enabled. How do I actually make an element animate — which
    CSS classes do I add for, say, a bounce entrance? Give the exact class names for this version of the
    module.
  criteria: animate_css ships animate.css v4, which uses the double-underscore prefix. Add the base class
    animate__animated plus an effect class, e.g. class="animate__animated animate__bounce". Utility classes
    like animate__delay-2s, animate__slow and animate__infinite are also available. The pre-v3 unprefixed
    names (animated bounce) do not work.
  bundle: animate_css
  rubric_ref: rubric/animate_css_animate_css_trigger_classes@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: animate_css-library-path
  input: The animate_css Drupal module says it needs the animate.css library. Which asset library does
    it attach and where on disk must the animate.css file be placed for the module to work?
  criteria: It defines the asset library animate_css/animate whose CSS is the root-relative path /libraries/animate.css/animate.css,
    i.e. the file must live at web/libraries/animate.css/animate.css. It is provided by the Composer library
    package drupal-shimmy/animate.css 4.1.1.
  bundle: animate_css
  rubric_ref: rubric/animate_css_animate_css_library_path@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: animate_css-how-attached
  input: Does animate_css have a configuration page, and how does the animate.css stylesheet end up on
    my pages after I enable the module?
  criteria: There is no configuration page (configure is null) and no settings. The module's hook_page_attachments()
    unconditionally adds the animate_css/animate library to every page render, so the animate.css classes
    are globally available with no further setup.
  bundle: animate_css
  rubric_ref: rubric/animate_css_animate_css_how_attached@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: animate_css-attached-library
  input: On this running Drupal site, animate_css is enabled. By inspecting the live site (not documentation),
    name the asset library id that this module attaches on every page.
  criteria: The library id is animate_css/animate (defined in animate_css.libraries.yml as the 'animate'
    library of the animate_css extension). It is attached in hook_page_attachments().
  bundle: animate_css
  rubric_ref: rubric/animate_css_animate_css_attached_library@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/animate_css-attached-library-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/animate_css-attached-library-cleanup.sh
- id: animate_css-library-installed
  input: On this live Drupal site, determine whether the animate.css library that animate_css depends
    on is actually installed, and report the filesystem path (relative to the Drupal root) of the CSS
    file it loads.
  criteria: Using the library.discovery service, animate_css/animate loads libraries/animate.css/animate.css;
    checking file_exists(DRUPAL_ROOT . '/' . that path) shows it is installed on this site.
  bundle: animate_css
  rubric_ref: rubric/animate_css_animate_css_library_installed@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/animate_css-library-installed-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/animate_css-library-installed-cleanup.sh
- id: animate_css-node-bounce
  input: On this Drupal site, create a published Article node with the title 'animate_css_bounce demo'
    whose body contains an element using the correct animate.css v4 classes for a bounce animation (as
    provided by the animate_css module). Apply it to the live site.
  criteria: Create an Article node titled like 'animate_css_bounce demo' with a body containing e.g. <div
    class="animate__animated animate__bounce">…</div>. The verify checks the stored body contains both
    animate__animated and animate__bounce.
  bundle: animate_css
  rubric_ref: rubric/animate_css_animate_css_node_bounce@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/animate_css-node-bounce-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/animate_css-node-bounce-reset.sh
    verify: agent-module-documentation/evaluation/verify/animate_css-node-bounce-verify.sh
- id: animate_css-node-fadeinup
  input: On my Drupal site (which has the animate_css module) I want a new blog-style Article titled 'animate_css_fade
    demo' whose intro paragraph fades up into view when the page loads. Please create it so the fade-up
    animation from the animate library will actually run.
  criteria: Create an Article node titled like 'animate_css_fade demo' whose body wraps the intro text
    in an element with class="animate__animated animate__fadeInUp". The verify checks the stored body
    contains both animate__animated and animate__fadeInUp.
  bundle: animate_css
  rubric_ref: rubric/animate_css_animate_css_node_fadeinup@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: site-owner
    reset: agent-module-documentation/evaluation/verify/animate_css-node-fadeinup-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/animate_css-node-fadeinup-reset.sh
    verify: agent-module-documentation/evaluation/verify/animate_css-node-fadeinup-verify.sh
