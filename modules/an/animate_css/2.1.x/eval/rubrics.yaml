rubrics:
- id: animate_css_animate_css_trigger_classes
  version: '1.0'
  applicable_bundles:
  - animate_css
  checks:
  - kind: must_contain_any
    values:
    - animate__animated
    - animate__bounce
  scoring:
    combine: all_pass
- id: animate_css_animate_css_library_path
  version: '1.0'
  applicable_bundles:
  - animate_css
  checks:
  - kind: must_contain_any
    values:
    - libraries/animate.css/animate.css
    - animate_css/animate
    - drupal-shimmy/animate.css
  scoring:
    combine: all_pass
- id: animate_css_animate_css_how_attached
  version: '1.0'
  applicable_bundles:
  - animate_css
  checks:
  - kind: must_contain_any
    values:
    - hook_page_attachments
    - page_attachments
    - every page
    - no configuration
    - no settings
  scoring:
    combine: all_pass
- id: animate_css_animate_css_attached_library
  version: '1.0'
  applicable_bundles:
  - animate_css
  checks:
  - kind: must_contain_any
    values:
    - animate_css/animate
  scoring:
    combine: all_pass
- id: animate_css_animate_css_library_installed
  version: '1.0'
  applicable_bundles:
  - animate_css
  checks:
  - kind: must_contain_any
    values:
    - libraries/animate.css/animate.css
  scoring:
    combine: all_pass
- id: animate_css_animate_css_node_bounce
  version: '1.0'
  applicable_bundles:
  - animate_css
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
- id: animate_css_animate_css_node_fadeinup
  version: '1.0'
  applicable_bundles:
  - animate_css
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
