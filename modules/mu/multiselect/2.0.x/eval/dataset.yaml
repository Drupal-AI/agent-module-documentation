metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: multiselect
  version: 2.0.x
  note: Multiselect is a field widget (id 'multiselect', extends OptionsWidgetBase; field_types list_string/list_float/list_integer/entity_reference)
    plus a '#type => multiselect' Form API element. Its only persistent global state is config object
    multiselect.settings key multiselect.widths (int px, default 250). Per-field state is the entity_form_display
    component's type=multiselect. Medium cases seed a real list_string field with the multiselect widget
    and a known widths value; hard cases require switching a field's widget to multiselect and setting
    the width, both verified against live config. No permissions, no Drush, no plugin type.
questions:
- id: multiselect-field-types
  input: Which field types can the Drupal Multiselect module's widget be used on? List them.
  criteria: The multiselect widget supports list_string, list_float, list_integer, and entity_reference
    fields (it extends OptionsWidgetBase with multiple_values = TRUE).
  bundle: multiselect
  rubric_ref: rubric/multiselect_multiselect_field_types@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: multiselect-width-setting
  input: Multiselect has a single global setting for the size of its two select boxes. Which config object
    and key hold it, what does it control, and what is the default?
  criteria: Config object multiselect.settings, key multiselect.widths (integer pixels, default 250) sets
    the width of the Available/Selected select boxes; edited at /admin/config/content/multiselect and
    pushed to the browser as drupalSettings.multiselect.widths.
  bundle: multiselect
  rubric_ref: rubric/multiselect_multiselect_width_setting@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: multiselect-enable-on-field
  input: I have a List (text) field on my Article content type. How do I make it use the Multiselect two-box
    widget instead of the default select?
  criteria: 'On the bundle''s Manage form display page (e.g. /admin/structure/types/manage/article/form-display)
    choose ''Multiselect'' as that field''s widget and Save; in entity_form_display the component becomes
    type: multiselect.'
  bundle: multiselect
  rubric_ref: rubric/multiselect_multiselect_enable_on_field@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: multiselect-known-field
  input: On this Drupal site, the Article content type has one field whose edit widget is the Multiselect
    two-box selector. Inspect the live default form display for Article and give the machine name of that
    field.
  criteria: 'field_ms_known — in core.entity_form_display.node.article.default its component has type:
    multiselect.'
  bundle: multiselect
  rubric_ref: rubric/multiselect_multiselect_known_field@1.0
  tags:
  - mode:introspection
  - difficulty:medium
