rubrics:
- id: multiple_select_multiple_select_config_key
  version: '1.0'
  applicable_bundles:
  - multiple_select
  checks:
  - kind: must_contain_any
    values:
    - multiple_select.settings
    - table
    - json
  scoring:
    combine: all_pass
- id: multiple_select_multiple_select_which_widget
  version: '1.0'
  applicable_bundles:
  - multiple_select
  checks:
  - kind: must_contain_any
    values:
    - checkboxes
    - Check boxes
    - options_buttons
    - multi-value
    - cardinality
  scoring:
    combine: all_pass
- id: multiple_select_multiple_select_configure_route
  version: '1.0'
  applicable_bundles:
  - multiple_select
  checks:
  - kind: must_contain_any
    values:
    - /admin/config/content/multiple-config
    - multiple_select.admin_form
    - access multiple select config page
  scoring:
    combine: all_pass
- id: multiple_select_multiple_select_known_field
  version: '1.0'
  applicable_bundles:
  - multiple_select
  checks:
  - kind: must_contain_any
    values:
    - field_ms_known
  scoring:
    combine: all_pass
- id: multiple_select_multiple_select_two_fields
  version: '1.0'
  applicable_bundles:
  - multiple_select
  checks:
  - kind: must_contain_any
    values:
    - field_ms_a
  scoring:
    combine: all_pass
- id: multiple_select_multiple_select_enable_field
  version: '1.0'
  applicable_bundles:
  - multiple_select
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
- id: multiple_select_multiple_select_disable_field
  version: '1.0'
  applicable_bundles:
  - multiple_select
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
