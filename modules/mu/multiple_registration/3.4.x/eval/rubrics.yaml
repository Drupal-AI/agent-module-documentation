rubrics:
- id: multiple_registration_multiple_registration_per_role_url
  version: '1.0'
  applicable_bundles:
  - multiple_registration
  checks:
  - kind: must_contain_any
    values:
    - /user/register/
    - multiple_registration_list_index
    - /admin/config/people/multiple_registration
    - registration page
  scoring:
    combine: all_pass
- id: multiple_registration_multiple_registration_config_object
  version: '1.0'
  applicable_bundles:
  - multiple_registration
  checks:
  - kind: must_contain_any
    values:
    - create_registration_page_form_config
    - form_mode_register
    - redirect_path
    - path
  scoring:
    combine: all_pass
- id: multiple_registration_multiple_registration_disable_main
  version: '1.0'
  applicable_bundles:
  - multiple_registration
  checks:
  - kind: must_contain_any
    values:
    - multiple_registration_disable_main
    - disable
    - administer multiple_registration
  scoring:
    combine: all_pass
- id: multiple_registration_multiple_registration_known_path
  version: '1.0'
  applicable_bundles:
  - multiple_registration
  checks:
  - kind: must_contain_any
    values:
    - /join-mr
    - join-mr
  scoring:
    combine: all_pass
- id: multiple_registration_multiple_registration_known_redirect_setting
  version: '1.0'
  applicable_bundles:
  - multiple_registration
  checks:
  - kind: must_contain_any
    values:
    - enabled
    - '1'
    - 'yes'
    - 'true'
    - 'on'
  scoring:
    combine: all_pass
- id: multiple_registration_multiple_registration_create_page
  version: '1.0'
  applicable_bundles:
  - multiple_registration
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
- id: multiple_registration_multiple_registration_disable_main_page
  version: '1.0'
  applicable_bundles:
  - multiple_registration
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
