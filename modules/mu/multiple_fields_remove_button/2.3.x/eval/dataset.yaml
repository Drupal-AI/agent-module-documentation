metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: multiple_fields_remove_button
  version: 2.3.x
  note: Module adds a per-row Remove button to multi-value field widgets via hook_field_widget_single_element_form_alter();
    no admin UI/config. Cases are `recipe` (response-graded) probing documented facts an agent would otherwise
    read source to answer; no site mutation.
questions:
- id: mfrb-what-it-adds
  input: On a Drupal 11 node form, my unlimited multi-value text field lets editors add rows but there's
    no way to delete a single value inline. What does the Multiple Fields Remove Button module add, and
    to which fields?
  criteria: It adds a per-row 'Remove' submit button to every widget row of any field whose cardinality
    is not 1 (unlimited and fixed multi-value), which core lacks.
  bundle: multiple_fields_remove_button
  rubric_ref: rubric/multiple_fields_remove_button_mfrb_what_it_adds@1.0
  tags:
  - mode:recipe
- id: mfrb-enable-no-ui
  input: How do I turn on the per-item Remove button for a multi-value field with the Multiple Fields
    Remove Button module? Is there a third-party widget setting on Manage form display to enable it?
  criteria: There is no third-party widget setting and no admin config form. Enabling the module (drush
    en multiple_fields_remove_button -y) automatically adds the button to all supported multi-value fields;
    scoping is done via alter hooks.
  bundle: multiple_fields_remove_button
  rubric_ref: rubric/multiple_fields_remove_button_mfrb_enable_no_ui@1.0
  tags:
  - mode:recipe
- id: mfrb-form-alter-hook
  input: Which Drupal form alter hook does the multiple_fields_remove_button module implement to inject
    the Remove button into each multi-value widget row?
  criteria: hook_field_widget_single_element_form_alter() adds $element['remove_button'] when the field
    cardinality is not 1.
  bundle: multiple_fields_remove_button
  rubric_ref: rubric/multiple_fields_remove_button_mfrb_form_alter_hook@1.0
  tags:
  - mode:recipe
- id: mfrb-ajax-callback-unlimited
  input: For an unlimited-cardinality field, which submit handler and AJAX callback function does the
    Remove button use to actually delete the item and renumber the deltas?
  criteria: 'Unlimited fields use multiple_fields_remove_button_submit_handler() as #submit and multiple_fields_remove_button_js()
    as the #ajax callback, deleting the item, renumbering deltas and re-weighting rows.'
  bundle: multiple_fields_remove_button
  rubric_ref: rubric/multiple_fields_remove_button_mfrb_ajax_callback_unlimited@1.0
  tags:
  - mode:recipe
- id: mfrb-fixed-vs-unlimited
  input: Does the multiple_fields_remove_button module behave differently for a fixed (limited) cardinality
    multi-value field versus an unlimited one? What callbacks handle the fixed case?
  criteria: Yes. Fixed multi-value fields use multiple_fields_remove_button_fixed_submit_handler() and
    multiple_fields_remove_button_clear_value_js() to clear that row's value and shift the rest up, while
    unlimited fields delete the item outright.
  bundle: multiple_fields_remove_button
  rubric_ref: rubric/multiple_fields_remove_button_mfrb_fixed_vs_unlimited@1.0
  tags:
  - mode:recipe
- id: mfrb-supported-widgets
  input: Which field widgets does multiple_fields_remove_button deliberately NOT add a Remove button to,
    and how can I exclude another widget?
  criteria: It skips widgets that manage their own removal (e.g. media_library_widget, inline_entity_form_complex,
    entity_browser_entity_reference); add more via hook_multiple_field_remove_button_skip_widgets_alter().
  bundle: multiple_fields_remove_button
  rubric_ref: rubric/multiple_fields_remove_button_mfrb_supported_widgets@1.0
  tags:
  - mode:recipe
- id: mfrb-restrict-fields
  input: With multiple_fields_remove_button enabled, how do I limit the Remove button to only certain
    named fields instead of all supported multi-value fields?
  criteria: Implement hook_multiple_field_remove_button_included_fields_alter() and set $includedFields
    to the field machine names; only listed fields get a button.
  bundle: multiple_fields_remove_button
  rubric_ref: rubric/multiple_fields_remove_button_mfrb_restrict_fields@1.0
  tags:
  - mode:recipe
- id: mfrb-why-core-lacks
  input: Why do I need multiple_fields_remove_button at all — doesn't Drupal core's multi-value 'Add another
    item' widget already let editors remove a value?
  criteria: Core's multi-value widget only supports adding rows and reordering; it has no inline per-item
    remove button, so you must blank a value and save. This module adds that missing per-row Remove button.
  bundle: multiple_fields_remove_button
  rubric_ref: rubric/multiple_fields_remove_button_mfrb_why_core_lacks@1.0
  tags:
  - mode:recipe
