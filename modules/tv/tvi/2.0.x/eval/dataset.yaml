metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: tvi
  version: 2.0.x
  note: TVI overrides taxonomy term-listing pages with a chosen View, resolved per-term / per-vocabulary
    / global with a precedence chain, stored in config objects. Cases are `recipe` (response-graded) since
    they probe documented facts an agent would otherwise read source to answer; no site mutation.
questions:
- id: tvi-what-it-does
  input: On a Drupal 11 site I want a specific vocabulary's taxonomy term pages to render a custom View
    instead of the default term listing. Which contrib module does this and how does it hook into the
    term page?
  criteria: Taxonomy Views Integrator (tvi). It alters the entity.taxonomy_term.canonical route to its
    own controller (after Views) and renders the View chosen for the term/vocabulary.
  bundle: tvi
  rubric_ref: rubric/tvi_tvi_what_it_does@1.0
  tags:
  - mode:recipe
- id: tvi-per-term-vs-vocab
  input: Using Taxonomy Views Integrator, where do I set the View+display for a single taxonomy term versus
    for an entire vocabulary?
  criteria: TVI injects a settings fieldset onto the taxonomy term edit form (per term) and the vocabulary
    edit form (per vocabulary); tick 'enable override' and pick a View + display.
  bundle: tvi
  rubric_ref: rubric/tvi_tvi_per_term_vs_vocab@1.0
  tags:
  - mode:recipe
- id: tvi-config-storage
  input: In Taxonomy Views Integrator, which config objects store the View override for the global default,
    for one vocabulary, and for one term?
  criteria: tvi.global_settings (site-wide), tvi.taxonomy_vocabulary.{vid} (per vocabulary), and tvi.taxonomy_term.{tid}
    (per term).
  bundle: tvi
  rubric_ref: rubric/tvi_tvi_config_storage@1.0
  tags:
  - mode:recipe
- id: tvi-precedence
  input: With Taxonomy Views Integrator, if a term has its own View override AND its vocabulary has one,
    which wins? Describe the full precedence order used to pick the View for a term page.
  criteria: 'Highest to lowest: per-term override, then inheriting vocabulary/parent-term override (enable_override
    + inherit_settings), then global override, then the core default taxonomy_term:page_1 View (unless
    disable_default_view is set). The term''s own override wins over the vocabulary''s.'
  bundle: tvi
  rubric_ref: rubric/tvi_tvi_precedence@1.0
  tags:
  - mode:recipe
- id: tvi-inherit-children
  input: In Taxonomy Views Integrator, which setting makes a vocabulary's or parent term's chosen View
    apply to child terms that don't have their own override?
  criteria: The inherit_settings option ('Child terms will use these settings'); a vocabulary/parent override
    only cascades to children when both enable_override and inherit_settings are true.
  bundle: tvi
  rubric_ref: rubric/tvi_tvi_inherit_children@1.0
  tags:
  - mode:recipe
- id: tvi-permissions
  input: What permissions does Taxonomy Views Integrator provide, and which one controls access to the
    global settings form versus setting a View on a specific vocabulary?
  criteria: '''administer taxonomy views integrator'' gates the global settings form; dynamic per-vocabulary
    permissions ''define view for vocabulary {vid}'' and ''define view for terms in {vid}'' gate the vocabulary
    and term edit fieldsets respectively.'
  bundle: tvi
  rubric_ref: rubric/tvi_tvi_permissions@1.0
  tags:
  - mode:recipe
- id: tvi-configure-route
  input: What is the admin path and route name for the global settings form of Taxonomy Views Integrator?
  criteria: Route tvi.global_settings at /admin/config/user-interface/tvi (Admin -> Configuration -> User
    interface -> Taxonomy Views Integrator).
  bundle: tvi
  rubric_ref: rubric/tvi_tvi_configure_route@1.0
  tags:
  - mode:recipe
- id: tvi-pass-arguments
  input: In Taxonomy Views Integrator, which per-term/per-vocabulary setting sends all trailing URL arguments
    after /taxonomy/term/ to the View, and what does the View receive if it is off?
  criteria: The pass_arguments setting; when on, all args after /taxonomy/term/ are passed to the View,
    when off the View only receives the term id (tid) and tid_depth.
  bundle: tvi
  rubric_ref: rubric/tvi_tvi_pass_arguments@1.0
  tags:
  - mode:recipe
