rubrics:
- id: gdpr_fields_gdpr_fields_where_stored
  version: '1.0'
  applicable_bundles:
  - gdpr_fields
  checks:
  - kind: must_contain_any
    values:
    - gdpr_fields_config
    - bundles
    - config entity
    - gdpr_fields.gdpr_fields_config
  scoring:
    combine: all_pass
- id: gdpr_fields_gdpr_fields_rta_rtf
  version: '1.0'
  applicable_bundles:
  - gdpr_fields
  checks:
  - kind: must_contain_any
    values:
    - Right to Access
    - Right to be Forgotten
    - anonymize
    - remove
    - inc
  scoring:
    combine: all_pass
- id: gdpr_fields_gdpr_fields_permissions_report
  version: '1.0'
  applicable_bundles:
  - gdpr_fields
  checks:
  - kind: must_contain_any
    values:
    - view gdpr fields
    - edit gdpr fields
    - /admin/reports/fields/gdpr-fields
    - gdpr_fields.fields_list
  scoring:
    combine: all_pass
- id: gdpr_fields_gdpr_fields_known_field
  version: '1.0'
  applicable_bundles:
  - gdpr_fields
  checks:
  - kind: must_contain_any
    values:
    - email_anonymizer
  scoring:
    combine: all_pass
- id: gdpr_fields_gdpr_fields_configure
  version: '1.0'
  applicable_bundles:
  - gdpr_fields
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
