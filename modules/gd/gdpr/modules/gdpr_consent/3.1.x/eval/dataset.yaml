metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: gdpr_consent
  version: 3.1.x
  note: 'GDPR submodule for consent tracking. Revisionable content entity gdpr_consent_agreement (managed
    at /admin/config/gdpr/agreements; required base fields title, mode [implicit|explicit from ConsentAgreement::getModes()],
    description). Field type gdpr_user_consent + widget gdpr_consent_widget + formatter gdpr_consent_formatter.
    Plugin TYPE gdpr_consent_resolver (manager plugin.manager.gdpr_consent_resolver, annotation @GdprConsentUserResolver,
    namespace Plugin/Gdpr/ConsentUserResolver) with built-in resolvers gdpr_consent_user_resolver (user),
    gdpr_consent_node_resolver (node), gdpr_consent_profile_resolver (profile). Acceptances logged as
    message entities (template consent_agreement_accepted, view gdpr_log_messages). Permissions manage
    gdpr agreements, grant gdpr any consent, grant gdpr own consent. No single settings form (configure=null).
    Requires gdpr, token, message, entity_reference_revisions, views. Medium/hard ground in gdpr_consent_agreement
    entity CRUD (identified by title to stay robust against other agreements on the shared site). NOTE:
    this campaign completed the submodule''s entity-schema install (installEntityType) that was skipped
    during the site''s enable window.'
questions:
- id: gdpr_consent-entity-and-ui
  input: In the Drupal gdpr_consent module, what entity represents a consent agreement, is it revisionable,
    and where are agreements managed?
  criteria: A revisionable content entity gdpr_consent_agreement, managed at /admin/config/gdpr/agreements
    (add/edit/delete/revisions). Required base fields include title, mode (implicit|explicit) and description.
  bundle: gdpr_consent
  rubric_ref: rubric/gdpr_consent_gdpr_consent_entity_and_ui@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: gdpr_consent-field-type
  input: How do you collect a user's consent to an agreement with gdpr_consent - what field type, widget
    and formatter does it provide?
  criteria: Attach a gdpr_user_consent field (widget gdpr_consent_widget, formatter gdpr_consent_formatter)
    to an entity/bundle (e.g. user or webform); the widget shows the agreement and records acceptance
    (logged as a message entity).
  bundle: gdpr_consent
  rubric_ref: rubric/gdpr_consent_gdpr_consent_field_type@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: gdpr_consent-resolver-plugin
  input: gdpr_consent needs to know which user a consent record belongs to. Which plugin type provides
    this and what are the built-in resolvers?
  criteria: 'The ConsentUserResolver plugin type (manager plugin.manager.gdpr_consent_resolver, annotation
    @GdprConsentUserResolver). Built-in resolvers: gdpr_consent_user_resolver (user), gdpr_consent_node_resolver
    (node -> author), gdpr_consent_profile_resolver (profile -> owner). A gdpr_user_consent field can
    only be added to a bundle that has a resolver.'
  bundle: gdpr_consent
  rubric_ref: rubric/gdpr_consent_gdpr_consent_resolver_plugin@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: gdpr_consent-known-agreement
  input: This Drupal site has a gdpr_consent consent agreement whose title starts with 'GDPR Eval'. Inspect
    the live site and state its consent mode (implicit or explicit).
  criteria: The agreement 'GDPR Eval Consent' has mode 'explicit' (a gdpr_consent_agreement entity; mode
    field value explicit).
  bundle: gdpr_consent
  rubric_ref: rubric/gdpr_consent_gdpr_consent_known_agreement@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/gdpr_consent-known-agreement-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/gdpr_consent-known-agreement-cleanup.sh
- id: gdpr_consent-create-agreement
  input: On this Drupal site, use gdpr_consent to create a consent agreement titled exactly 'GDPR Eval
    Task' with an explicit consent mode, and save it to the live site.
  criteria: A gdpr_consent_agreement entity with title 'GDPR Eval Task' and mode 'explicit' exists. Create
    it via /admin/config/gdpr/agreements/add or with the gdpr_consent_agreement storage create([...])->save()
    (required fields title, mode, description).
  bundle: gdpr_consent
  rubric_ref: rubric/gdpr_consent_gdpr_consent_create_agreement@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/gdpr_consent-create-agreement-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/gdpr_consent-create-agreement-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/gdpr_consent-create-agreement-verify.sh
