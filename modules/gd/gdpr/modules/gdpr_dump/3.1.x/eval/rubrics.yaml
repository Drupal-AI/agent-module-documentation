rubrics:
- id: gdpr_dump_gdpr_dump_drush_command
  version: '1.0'
  applicable_bundles:
  - gdpr_dump
  checks:
  - kind: must_contain_any
    values:
    - gdpr:sql:dump
    - gdpr-sql-dump
  scoring:
    combine: all_pass
- id: gdpr_dump_gdpr_dump_config_object
  version: '1.0'
  applicable_bundles:
  - gdpr_dump
  checks:
  - kind: must_contain_any
    values:
    - gdpr_dump.table_map
    - mapping
    - empty_tables
  scoring:
    combine: all_pass
- id: gdpr_dump_gdpr_dump_uses_anonymizer
  version: '1.0'
  applicable_bundles:
  - gdpr_dump
  checks:
  - kind: must_contain_any
    values:
    - anonymizer
    - email_anonymizer
    - anonymizer_factory
    - plugin
  scoring:
    combine: all_pass
- id: gdpr_dump_gdpr_dump_known_map
  version: '1.0'
  applicable_bundles:
  - gdpr_dump
  checks:
  - kind: must_contain_any
    values:
    - email_anonymizer
  scoring:
    combine: all_pass
- id: gdpr_dump_gdpr_dump_map_column
  version: '1.0'
  applicable_bundles:
  - gdpr_dump
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
