rubrics:
- id: anonymizer_anonymizer_plugin_type
  version: '1.0'
  applicable_bundles:
  - anonymizer
  checks:
  - kind: must_contain_any
    values:
    - plugin.manager.anonymizer
    - Plugin/Anonymizer
    - '@Anonymizer'
    - AnonymizerBase
    - AnonymizerInterface
  scoring:
    combine: all_pass
- id: anonymizer_anonymizer_builtin_ids
  version: '1.0'
  applicable_bundles:
  - anonymizer
  checks:
  - kind: must_contain_any
    values:
    - email_anonymizer
    - username_anonymizer
    - clear_anonymizer
    - Faker
    - faker
  scoring:
    combine: all_pass
- id: anonymizer_anonymizer_services
  version: '1.0'
  applicable_bundles:
  - anonymizer
  checks:
  - kind: must_contain_any
    values:
    - anonymizer.faker
    - anonymizer.anonymizer_factory
    - plugin.manager.anonymizer
  scoring:
    combine: all_pass
- id: anonymizer_anonymizer_list_plugins
  version: '1.0'
  applicable_bundles:
  - anonymizer
  checks:
  - kind: must_contain_any
    values:
    - email_anonymizer
  scoring:
    combine: all_pass
- id: anonymizer_anonymizer_add_plugin
  version: '1.0'
  applicable_bundles:
  - anonymizer
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
