rubrics:
- id: gdpr_gdpr_configure_route
  version: '1.0'
  applicable_bundles:
  - gdpr
  checks:
  - kind: must_contain_any
    values:
    - checklist
    - checklistapi
    - /admin/config/gdpr/checklist
    - checklistapi.checklists.gdpr_checklist
  scoring:
    combine: all_pass
- id: gdpr_gdpr_content_mapping_config
  version: '1.0'
  applicable_bundles:
  - gdpr
  checks:
  - kind: must_contain_any
    values:
    - gdpr.content_mapping
    - links
    - privacy_policy
    - langcode
  scoring:
    combine: all_pass
- id: gdpr_gdpr_user_data_page
  version: '1.0'
  applicable_bundles:
  - gdpr
  checks:
  - kind: must_contain_any
    values:
    - /user/
    - gdpr
    - view gdpr data summary
    - gdpr.collected_user_data
  scoring:
    combine: all_pass
- id: gdpr_gdpr_known_content_link
  version: '1.0'
  applicable_bundles:
  - gdpr
  checks:
  - kind: must_contain_any
    values:
    - /privacy-policy
    - privacy-policy
    - internal:/privacy-policy
  scoring:
    combine: all_pass
- id: gdpr_gdpr_set_content_link
  version: '1.0'
  applicable_bundles:
  - gdpr
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
