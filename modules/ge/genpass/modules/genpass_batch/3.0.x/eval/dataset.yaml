metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: genpass_batch
  version: 3.0.x
  part_of: genpass
  note: 'Light-doc submodule of genpass (test-support module under tests/modules/). Recipe-only: text-graded,
    no site mutation.'
questions:
- id: genpass-batch-purpose
  input: What is the genpass_batch submodule for, and which Drupal hook does it implement to do its job?
    Name the hook.
  criteria: genpass_batch is a test-support submodule of genpass that starts a Batch API job on every
    account creation, via an OOP hook_user_insert (#[Hook('user_insert')] in UserInsertBatch), to verify
    genpass works while a batch is in flight.
  bundle: genpass_batch
  rubric_ref: rubric/genpass_batch_genpass_batch_purpose@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: genpass-batch-dependency
  input: Which module does the genpass_batch submodule depend on, and does it add any configuration, permissions,
    or routes of its own?
  criteria: genpass_batch depends on genpass (genpass:genpass) and adds no config, permissions, routes,
    or services of its own — it only registers a user_insert batch hook.
  bundle: genpass_batch
  rubric_ref: rubric/genpass_batch_genpass_batch_dependency@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: genpass-batch-api
  input: In the genpass_batch submodule, which Batch API function does its user_insert hook call to queue
    its work?
  criteria: It calls batch_set() with a single operation (batchTask) and a batchFinished callback.
  bundle: genpass_batch
  rubric_ref: rubric/genpass_batch_genpass_batch_api@1.0
  tags:
  - mode:recipe
  - difficulty:easy
