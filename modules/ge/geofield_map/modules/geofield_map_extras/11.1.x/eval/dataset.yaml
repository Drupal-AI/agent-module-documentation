metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: geofield_map_extras
  version: 11.1.x
  note: 'geofield_map_extras is a submodule of geofield_map adding static-image and iframe-embed Google
    Map formatters for geofield Points. Cases are `recipe` (response-graded): documented plugin ids, settings
    and dependency facts; no site mutation.'
questions:
- id: geofield_map_extras-static-formatter
  input: I want to display a geofield point as a cheap static Google Map image (no interactivity) on a
    Drupal 11 site. Which formatter/plugin id and which module provides it?
  criteria: The 'Geofield Google Map (static)' formatter (id geofield_static_google_map) from the geofield_map_extras
    submodule, using the Google Maps Static API.
  bundle: geofield_map_extras
  rubric_ref: rubric/geofield_map_extras_geofield_map_extras_static_formatter@1.0
  tags:
  - mode:recipe
- id: geofield_map_extras-embed-formatter
  input: Which Geofield Map Extras formatter renders a map inside an iframe with no JavaScript, and what
    is its plugin id?
  criteria: The 'Geofield Google Map (embed)' formatter (id geofield_embed_google_map), which renders
    the Google Maps Embed API inside an <iframe> with no JS.
  bundle: geofield_map_extras
  rubric_ref: rubric/geofield_map_extras_geofield_map_extras_embed_formatter@1.0
  tags:
  - mode:recipe
- id: geofield_map_extras-dependency
  input: What must be installed for the Geofield Map Extras static/embed formatters to work, including
    where the Google Maps API key comes from?
  criteria: It requires the main geofield_map module (dependency geofield_map:geofield_map) and reuses
    the Google Maps API key configured in geofield_map.settings.
  bundle: geofield_map_extras
  rubric_ref: rubric/geofield_map_extras_geofield_map_extras_dependency@1.0
  tags:
  - mode:recipe
- id: geofield_map_extras-static-settings
  input: What can I configure on the Geofield Map Extras static Google Map formatter?
  criteria: Width, height, scale, zoom, langcode, static_map_type (roadmap/satellite/...), marker_color
    and marker_size (schema field.formatter.settings.geofield_static_map).
  bundle: geofield_map_extras
  rubric_ref: rubric/geofield_map_extras_geofield_map_extras_static_settings@1.0
  tags:
  - mode:recipe
- id: geofield_map_extras-geometry-support
  input: Do the Geofield Map Extras static and embed formatters support rendering polylines and polygons?
  criteria: No — both formatters support Points only, not geometries such as polylines or polygons.
  bundle: geofield_map_extras
  rubric_ref: rubric/geofield_map_extras_geofield_map_extras_geometry_support@1.0
  tags:
  - mode:recipe
- id: geofield_map_extras-template-override
  input: Which Twig templates does Geofield Map Extras provide so I can override the static and embed
    map markup?
  criteria: Theme hooks geofield_static_google_map (geofield-static-google-map.html.twig) and geofield_embed_google_map
    (geofield-embed-google-map.html.twig), overridable in your theme.
  bundle: geofield_map_extras
  rubric_ref: rubric/geofield_map_extras_geofield_map_extras_template_override@1.0
  tags:
  - mode:recipe
