metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: geofield_map
  version: 11.1.x
  note: 'Geofield Map adds a widget, formatter and Views style for the geofield field, a Google Maps API
    key setting, and a MapThemer plugin type. Cases are `recipe` (response-graded): they probe documented
    plugin ids, config keys and dependencies an agent would otherwise read source to answer; no site mutation.'
questions:
- id: geofield_map-widget
  input: On a Drupal 11 site I have a content type with a Geofield field and want editors to set the location
    on an interactive map (click to place a marker, or geocode an address). Which widget do I select under
    Manage form display, and which module provides it?
  criteria: Under Manage form display choose the 'Geofield Map' widget (plugin id geofield_map) from the
    geofield_map module; it gives an interactive Google/Leaflet map to click-place a marker or geocode
    an address into the geofield.
  bundle: geofield_map
  rubric_ref: rubric/geofield_map_geofield_map_widget@1.0
  tags:
  - mode:recipe
- id: geofield_map-formatter
  input: Which field formatter renders a stored geofield point on an interactive Google Map, and what
    is its plugin id?
  criteria: The 'Geofield Google Map' formatter, plugin id geofield_google_map, chosen under Manage display.
  bundle: geofield_map
  rubric_ref: rubric/geofield_map_geofield_map_formatter@1.0
  tags:
  - mode:recipe
- id: geofield_map-views-style
  input: I want to plot a whole View of geolocated content on one Google Map. Which Views style do I pick
    and what field must the View include?
  criteria: Choose the 'Geofield Google Map' Views style (id geofield_google_map) and add a geofield field
    to the View's Fields list.
  bundle: geofield_map
  rubric_ref: rubric/geofield_map_geofield_map_views_style@1.0
  tags:
  - mode:recipe
- id: geofield_map-api-key
  input: Where do I set the Google Maps API key that Geofield Map uses for maps and geocoding on a Drupal
    site? Give the config object/key and the settings path.
  criteria: Set gmap_api_key on the geofield_map.settings config object via the settings form at /admin/config/system/geofield_map_settings
    (route geofield_map.settings); e.g. drush cset geofield_map.settings gmap_api_key 'KEY'. If the Key
    module is enabled the field becomes a key_select.
  bundle: geofield_map
  rubric_ref: rubric/geofield_map_geofield_map_api_key@1.0
  tags:
  - mode:recipe
- id: geofield_map-mapthemer
  input: In Geofield Map I want map markers on a View to use different icons depending on a field's value.
    What plugin type do I use, and which plugin manager service / directory implements it?
  criteria: Use a MapThemer plugin (type dir Plugin/GeofieldMapThemer, manager service plugin.manager.geofield_map.themer,
    interface MapThemerInterface), selected in the Views style's marker theming options; bundled themers
    cover List fields, taxonomy terms and entity types.
  bundle: geofield_map
  rubric_ref: rubric/geofield_map_geofield_map_mapthemer@1.0
  tags:
  - mode:recipe
- id: geofield_map-dependency
  input: What Drupal module does Geofield Map require to work, and why?
  criteria: It requires the geofield module (dependency geofield:geofield) because Geofield Map is the
    map widget/formatter/Views integration for the geofield field type.
  bundle: geofield_map
  rubric_ref: rubric/geofield_map_geofield_map_dependency@1.0
  tags:
  - mode:recipe
- id: geofield_map-formatter-alter-hook
  input: In a custom module I want to add/alter the JavaScript map settings of the Geofield Google Map
    formatter before it renders. Which hook do I implement?
  criteria: Implement hook_geofield_map_googlemap_formatter_alter(array &$map_settings, FieldItemListInterface
    &$items).
  bundle: geofield_map
  rubric_ref: rubric/geofield_map_geofield_map_formatter_alter_hook@1.0
  tags:
  - mode:recipe
- id: geofield_map-permission
  input: Which permission gates access to the Geofield Map settings form (Google Maps API key etc.)?
  criteria: The 'configure geofield_map' permission gates the geofield_map.settings form.
  bundle: geofield_map
  rubric_ref: rubric/geofield_map_geofield_map_permission@1.0
  tags:
  - mode:recipe
