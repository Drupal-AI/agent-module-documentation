metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: geophp
  version: 1.2.x
  note: 'geoPHP is a pure API/library wrapper: it exposes the geoPHP geometry library as the service geophp.geophp
    (Drupal\geophp\GeoPHPWrapper) with methods version(), load($data,$type), getAdapterMap(). No config,
    permissions, routes, plugins or Drush. The returned geometry objects have the geoPHP API (area(),
    centroid(), out($format), geometryType(), getBBox(), ...). Because the module has no persistent config
    of its own, medium cases store a known WKT in Drupal state for the agent to read back and analyse
    via the live service, and hard cases have the agent compute a geometry property with the service and
    store the result in a Drupal state key that the verify script reads. All values below were confirmed
    against the live service (version 1.1, area 100/400, GeoJSON coordinates [5,5]).'
questions:
- id: geophp-service-id
  input: In the Drupal geophp module, what service should I use to work with geometries in custom code,
    and which method parses a WKT or GeoJSON string into a geometry object?
  criteria: Use the geophp.geophp service (Drupal\geophp\GeoPHPWrapper) and call its load($data, $type)
    method (which delegates to \geoPHP::load()) to parse a WKT/GeoJSON/etc. string into a geometry object.
  bundle: geophp
  rubric_ref: rubric/geophp_geophp_service_id@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: geophp-formats
  input: Which geometry formats can the geoPHP library (wrapped by the Drupal geophp module) read and
    write, and how do I convert a geometry to GeoJSON?
  criteria: geoPHP supports WKT, EWKT, WKB, EWKB, GeoJSON, KML, GPX, GeoRSS, GeoHash and GoogleGeocode.
    Convert a geometry with $geometry->out('json') for GeoJSON (or 'wkt', 'wkb', 'kml', ...).
  bundle: geophp
  rubric_ref: rubric/geophp_geophp_formats@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: geophp-operations
  input: Using the geophp module's geometry objects, which methods give me a polygon's area and centroid,
    and what optional PHP extension speeds up advanced spatial operations?
  criteria: Call $geometry->area() for area and $geometry->centroid() for the centroid point. Advanced
    spatial operations (intersects, buffer, union, ...) are faster/available with the optional GEOS PHP
    extension.
  bundle: geophp
  rubric_ref: rubric/geophp_geophp_operations@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: geophp-known-geometry
  input: This Drupal site has a WKT geometry stored in the state key 'geophp_eval_input'. Read that value,
    load it with the geophp.geophp service, and report the area of the geometry.
  criteria: The stored geometry is POLYGON((0 0,0 20,20 20,20 0,0 0)); loading it with the geophp.geophp
    service and calling area() gives 400.
  bundle: geophp
  rubric_ref: rubric/geophp_geophp_known_geometry@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/geophp-known-geometry-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/geophp-known-geometry-cleanup.sh
- id: geophp-known-type
  input: This Drupal site has a WKT geometry stored in the state key 'geophp_eval_input2'. Read that value,
    load it with the geophp.geophp service, and report its geometry type.
  criteria: The stored geometry is LINESTRING(0 0,3 4); geometryType() returns 'LineString'.
  bundle: geophp
  rubric_ref: rubric/geophp_geophp_known_type@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/geophp-known-type-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/geophp-known-type-cleanup.sh
- id: geophp-area-to-state
  input: On this Drupal site, use the geophp.geophp service to load the WKT 'POLYGON((0 0,0 10,10 10,10
    0,0 0))', compute its area, and store the resulting numeric area in the Drupal state key 'geophp_eval_area'.
    Apply it to the live site.
  criteria: State key geophp_eval_area is set to 100 (e.g. \Drupal::state()->set('geophp_eval_area', \Drupal::service('geophp.geophp')->load('POLYGON((0
    0,0 10,10 10,10 0,0 0))','wkt')->area())).
  bundle: geophp
  rubric_ref: rubric/geophp_geophp_area_to_state@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/geophp-area-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/geophp-area-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/geophp-area-verify.sh
- id: geophp-geojson-to-state
  input: On this Drupal site, use the geophp.geophp service to convert the WKT 'POINT(5 5)' to GeoJSON
    and store the resulting GeoJSON string in the Drupal state key 'geophp_eval_geojson'. Apply it to
    the live site.
  criteria: State key geophp_eval_geojson holds the GeoJSON for POINT(5 5), i.e. {"type":"Point","coordinates":[5,5]}
    (via $geom->out('json')).
  bundle: geophp
  rubric_ref: rubric/geophp_geophp_geojson_to_state@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/geophp-geojson-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/geophp-geojson-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/geophp-geojson-verify.sh
