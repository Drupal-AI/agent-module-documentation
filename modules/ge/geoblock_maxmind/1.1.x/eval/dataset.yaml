metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: geoblock_maxmind
  version: 1.1.x
  note: geoblock_maxmind adds a MaxMind .mmdb GeoIP data source (GeoblockDataSource plugin id 'maxmind')
    to the Geoblock module. Its only config is geoblock_maxmind.settings:download_url (uri, default '');
    a Downloader service + hook_cron refresh the local db at private://geoblock_maxmind.mmdb, scheduled
    by the State key geoblock_maxmind.update_date. Configure route geoblock_maxmind.settings (/admin/config/geoblock/maxmind),
    permission 'administer geoblock'. No live GeoIP database is present on the test site, so all medium/hard
    cases are grounded in the config value and State scheduling, not in real IP lookups. Medium cases
    seed a known download_url / update_date and read them back; hard cases set or clear download_url,
    verified against live config.
questions:
- id: geoblock_maxmind-config-key
  input: In the Drupal geoblock_maxmind module, which config object and key hold the MaxMind database
    download URL, and what happens when it is left empty?
  criteria: The config object geoblock_maxmind.settings has the key download_url (a uri, default empty
    string). When empty, automatic download is disabled and you must maintain the .mmdb file yourself
    at private://geoblock_maxmind.mmdb; when set to a *.tar.gz archive URL the module downloads and extracts
    the database.
  bundle: geoblock_maxmind
  rubric_ref: rubric/geoblock_maxmind_geoblock_maxmind_config_key@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: geoblock_maxmind-db-path
  input: Where does geoblock_maxmind expect the MaxMind database file to live on disk, and what does its
    data source do if that file is missing?
  criteria: The database file is expected at private://geoblock_maxmind.mmdb (the geoblock_maxmind.database_path
    service parameter). If the file is missing/unreadable the 'maxmind' GeoblockDataSource plugin's reader
    stays null and locate() resolves no country (silently), so Geoblock gets no country for that IP.
  bundle: geoblock_maxmind
  rubric_ref: rubric/geoblock_maxmind_geoblock_maxmind_db_path@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: geoblock_maxmind-cron
  input: How does geoblock_maxmind keep the MaxMind database up to date automatically, and what controls
    when the next update happens?
  criteria: hook_cron() re-downloads the database when a valid download_url is set and the current time
    has reached the State value geoblock_maxmind.update_date; after each attempt it reschedules update_date
    about one week ahead (strtotime('1 week')). Saving the settings form with a URL also validates the
    download and seeds that State.
  bundle: geoblock_maxmind
  rubric_ref: rubric/geoblock_maxmind_geoblock_maxmind_cron@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: geoblock_maxmind-known-url
  input: On this Drupal site the geoblock_maxmind module has a MaxMind database download URL configured.
    Inspect the live configuration and report the exact URL.
  criteria: geoblock_maxmind.settings:download_url is https://mirror.example.org/geoip/GeoLite2-Country-known.tar.gz.
  bundle: geoblock_maxmind
  rubric_ref: rubric/geoblock_maxmind_geoblock_maxmind_known_url@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/geoblock_maxmind-url-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/geoblock_maxmind-url-cleanup.sh
- id: geoblock_maxmind-next-update
  input: geoblock_maxmind schedules its next automatic MaxMind database update using a State value. Inspect
    the live site and report the scheduled next-update timestamp (the raw stored value).
  criteria: The State key geoblock_maxmind.update_date is 1893456000 (a unix timestamp). Cron only downloads
    once the current time reaches this value.
  bundle: geoblock_maxmind
  rubric_ref: rubric/geoblock_maxmind_geoblock_maxmind_next_update@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/geoblock_maxmind-nextupdate-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/geoblock_maxmind-nextupdate-cleanup.sh
- id: geoblock_maxmind-set-url
  input: Configure the geoblock_maxmind module on this Drupal site to auto-download its MaxMind database
    from https://updates.example.net/maxmind/GeoLite2-Country.tar.gz . Apply the change to the live site.
  criteria: Set geoblock_maxmind.settings:download_url to exactly https://updates.example.net/maxmind/GeoLite2-Country.tar.gz
    and save (e.g. \Drupal::configFactory()->getEditable('geoblock_maxmind.settings')->set('download_url',
    '...')->save()).
  bundle: geoblock_maxmind
  rubric_ref: rubric/geoblock_maxmind_geoblock_maxmind_set_url@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/geoblock_maxmind-configure-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/geoblock_maxmind-configure-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/geoblock_maxmind-configure-verify.sh
- id: geoblock_maxmind-disable-download
  input: On this Drupal site, geoblock_maxmind is currently set to auto-download its MaxMind database
    from a URL. Turn off the automatic download so the database is managed manually instead, and apply
    the change to the live site.
  criteria: Clear geoblock_maxmind.settings:download_url (set it to an empty string) and save; with no
    URL the module no longer auto-downloads and the .mmdb is maintained manually.
  bundle: geoblock_maxmind
  rubric_ref: rubric/geoblock_maxmind_geoblock_maxmind_disable_download@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-layman
    reset: agent-module-documentation/evaluation/verify/geoblock_maxmind-disable-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/geoblock_maxmind-disable-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/geoblock_maxmind-disable-verify.sh
