rubrics:
- id: geoblock_geoblock_how_to_block_country
  version: '1.0'
  applicable_bundles:
  - geoblock
  checks:
  - kind: must_contain_any
    values:
    - restriction_type
    - restriction_country_codes
    - geoblock.settings
    - admin/config/geoblock
    - block
  scoring:
    combine: all_pass
- id: geoblock_geoblock_inert_without_data_source
  version: '1.0'
  applicable_bundles:
  - geoblock
  checks:
  - kind: must_contain_any
    values:
    - data source
    - data_source
    - GeoblockDataSource
    - geoblock_data_source
    - plugin
  scoring:
    combine: all_pass
- id: geoblock_geoblock_default_methods
  version: '1.0'
  applicable_bundles:
  - geoblock
  checks:
  - kind: must_contain_any
    values:
    - applicable_methods
    - POST
    - GET
  scoring:
    combine: all_pass
- id: geoblock_geoblock_known_block_list
  version: '1.0'
  applicable_bundles:
  - geoblock
  checks:
  - kind: must_contain_any
    values:
    - RU
  scoring:
    combine: all_pass
- id: geoblock_geoblock_known_allow_mode
  version: '1.0'
  applicable_bundles:
  - geoblock
  checks:
  - kind: must_contain_any
    values:
    - allow
  scoring:
    combine: all_pass
- id: geoblock_geoblock_configure_block
  version: '1.0'
  applicable_bundles:
  - geoblock
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
- id: geoblock_geoblock_configure_allow
  version: '1.0'
  applicable_bundles:
  - geoblock
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
