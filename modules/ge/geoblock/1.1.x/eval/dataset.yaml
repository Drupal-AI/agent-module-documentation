metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: geoblock
  version: 1.1.x
  note: 'Geoblock blocks requests by client-IP origin country via a KernelEvents::REQUEST subscriber.
    All behaviour is driven by the geoblock.settings config object: data_source (a geoblock_data_source
    plugin id; NONE ships, so the module is inert until one is provided/selected), applicable_methods
    (default CONNECT/DELETE/PATCH/POST/PUT - GET/HEAD NOT restricted by default), restriction_type (''''
    | allow | block), restriction_country_codes (ISO 3166-1 alpha-2), require_domestic_use, enable_logging.
    Country lookup is delegated to the data source plugin type; restriction strategies are CountryCodeRestriction
    and DomesticRestriction. Only one permission (administer geoblock), no drush. Because no data source
    ships, medium/hard cases are grounded in the real, inspectable geoblock.settings config (which the
    module actually consumes) rather than live traffic blocking. Scripts restore shipped defaults explicitly.'
questions:
- id: geoblock-how-to-block-country
  input: Using the Drupal geoblock module, how do I block visitors from a particular country? Name the
    config object / settings I set and the admin path.
  criteria: At /admin/config/geoblock (config geoblock.settings) set restriction_type to 'block' and add
    the country's ISO 3166-1 alpha-2 code to restriction_country_codes (and select a data source). Requests
    from that country then get a 403.
  bundle: geoblock
  rubric_ref: rubric/geoblock_geoblock_how_to_block_country@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: geoblock-inert-without-data-source
  input: I enabled the geoblock module and configured a country block list, but nothing is being blocked.
    Why might geoblock do nothing out of the box?
  criteria: Geoblock ships no geolocation data source of its own. Without a geoblock_data_source plugin
    selected in geoblock.settings (data_source), RequestHandler::isDataSourcePluginAvailable() is FALSE
    and the module is effectively disabled. You must provide/select a data source plugin.
  bundle: geoblock
  rubric_ref: rubric/geoblock_geoblock_inert_without_data_source@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: geoblock-default-methods
  input: By default, which HTTP request methods does geoblock apply its restrictions to? In particular,
    are normal GET page views blocked out of the box?
  criteria: The default applicable_methods is CONNECT, DELETE, PATCH, POST, PUT. GET and HEAD are NOT
    included by default, so ordinary GET page views are not blocked unless you add GET to applicable_methods.
  bundle: geoblock
  rubric_ref: rubric/geoblock_geoblock_default_methods@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: geoblock-known-block-list
  input: Inspect this site's live geoblock configuration. What restriction type is currently set, and
    which countries does it apply to?
  criteria: geoblock.settings has restriction_type = 'block' and restriction_country_codes = [RU, CN,
    KP], i.e. visitors from Russia, China and North Korea are blocked.
  bundle: geoblock
  rubric_ref: rubric/geoblock_geoblock_known_block_list@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/geoblock-known-block-list-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/geoblock-known-block-list-cleanup.sh
- id: geoblock-known-allow-mode
  input: Look at the live geoblock.settings on this site. Is the country restriction configured as an
    allow-list or a block-list?
  criteria: 'restriction_type is ''allow'' (an allow-list): only the listed countries (US) may access;
    all others are blocked.'
  bundle: geoblock
  rubric_ref: rubric/geoblock_geoblock_known_allow_mode@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/geoblock-known-allow-mode-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/geoblock-known-allow-mode-cleanup.sh
- id: geoblock-configure-block
  input: Configure the geoblock module on this site to block visitors from Russia (RU) and North Korea
    (KP). Apply the change to the live geoblock settings.
  criteria: geoblock.settings restriction_type = 'block' and restriction_country_codes contains both RU
    and KP.
  bundle: geoblock
  rubric_ref: rubric/geoblock_geoblock_configure_block@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/geoblock-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/geoblock-reset.sh
    verify: agent-module-documentation/evaluation/verify/geoblock-configure-block-verify.sh
- id: geoblock-configure-allow
  input: I only want people in the United States and Canada to be able to use my Drupal site; everyone
    from other countries should be turned away. Set up the geoblock module to do that.
  criteria: geoblock.settings restriction_type = 'allow' and restriction_country_codes contains US and
    CA (an allow-list limiting access to those countries).
  bundle: geoblock
  rubric_ref: rubric/geoblock_geoblock_configure_allow@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-layman
    reset: agent-module-documentation/evaluation/verify/geoblock-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/geoblock-reset.sh
    verify: agent-module-documentation/evaluation/verify/geoblock-configure-allow-verify.sh
