metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: roleassign
  version: 2.0.x
  note: RoleAssign delegates limited role assignment via a new 'assign roles' permission plus a single
    config object (roleassign.settings). Cases are `recipe` (response-graded) — they probe documented
    facts (which permission, which config key/route, how the restriction is enforced) an agent would otherwise
    read source to answer; no site mutation.
questions:
- id: roleassign-delegate-without-administer-permissions
  input: On a Drupal 11 site I want an assistant admin to be able to assign roles to users but I do NOT
    want to give them 'Administer permissions'. Which module and which permission solves this?
  criteria: The RoleAssign module and its 'assign roles' permission let a user assign a restricted set
    of roles without the core 'administer permissions' permission.
  bundle: roleassign
  rubric_ref: rubric/roleassign_roleassign_delegate_without_administer_permissions@1.0
  tags:
  - mode:recipe
- id: roleassign-two-permissions-needed
  input: With RoleAssign, which two permissions must a delegated role-manager have so they can edit users
    and assign the allowed roles on the user edit form?
  criteria: They need the 'assign roles' permission (from RoleAssign) and the core 'administer users'
    permission; only then are they restricted to the configured roles.
  bundle: roleassign
  rubric_ref: rubric/roleassign_roleassign_two_permissions_needed@1.0
  tags:
  - mode:recipe
- id: roleassign-config-assignable-roles
  input: Where does RoleAssign store the list of roles that a restricted user is allowed to assign, and
    what is the config key?
  criteria: In the roleassign.settings config object under the roleassign_roles key (a sequence of role
    machine names).
  bundle: roleassign
  rubric_ref: rubric/roleassign_roleassign_config_assignable_roles@1.0
  tags:
  - mode:recipe
- id: roleassign-configure-route
  input: As a site administrator on Drupal 11, at what admin path / route do I choose which roles are
    available for assignment through RoleAssign, and which permission is required to open it?
  criteria: People -> Role assign at /admin/people/roleassign (route roleassign.settings), gated by the
    core 'administer permissions' permission.
  bundle: roleassign
  rubric_ref: rubric/roleassign_roleassign_configure_route@1.0
  tags:
  - mode:recipe
- id: roleassign-restricts-user-form
  input: How does RoleAssign limit which roles a delegated admin sees on the user edit form?
  criteria: A hook_form_alter() replaces the roles field on user forms with an 'Assignable roles' checkbox
    set limited to the configured roleassign_roles; a hook_user_presave() enforces it server-side.
  bundle: roleassign
  rubric_ref: rubric/roleassign_roleassign_restricts_user_form@1.0
  tags:
  - mode:recipe
- id: roleassign-sticky-roles
  input: If a user already has a role that a restricted admin is not allowed to assign, what happens to
    that role when the restricted admin saves the user in RoleAssign?
  criteria: 'It is treated as a ''sticky'' role: hook_user_presave() preserves the original account''s
    unassignable roles, so a restricted admin can neither add nor remove roles outside the configured
    set.'
  bundle: roleassign
  rubric_ref: rubric/roleassign_roleassign_sticky_roles@1.0
  tags:
  - mode:recipe
- id: roleassign-vs-administer-permissions
  input: Why is granting 'assign roles' safer than granting core 'administer permissions' for delegating
    role assignment in Drupal?
  criteria: '''administer permissions'' lets the user grant any permission to any role (privilege escalation);
    ''assign roles'' only lets them assign a restricted, pre-configured subset of roles and nothing else.'
  bundle: roleassign
  rubric_ref: rubric/roleassign_roleassign_vs_administer_permissions@1.0
  tags:
  - mode:recipe
