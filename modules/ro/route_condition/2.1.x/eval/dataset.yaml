metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: route_condition
  version: 2.1.x
  note: Route Condition ships one Condition plugin (id 'route', class Drupal\route_condition\Plugin\Condition\RouteCondition)
    that matches the active ROUTE NAME (analogue of core's request_path 'Pages' condition). Single config
    key 'routes' (textarea, one route name per line); '*' is a wildcard compiled to regex '.*'; a leading
    '~' excludes a route; input is lowercased; empty routes matches everywhere; first matching line wins;
    standard 'Negate the condition' also applies. There is no config UI of its own (configure=null), no
    services, no Drush, no permissions. On a placed block the config lives at block.block.<id> -> visibility.route.routes.
    Medium/hard cases place a system_powered_by_block in the olivero theme and read/write its visibility.route
    condition (config storage only; no theme regions rendering needed).
questions:
- id: route_condition-plugin-and-key
  input: In Drupal, I want a block to appear only on certain pages based on the route NAME (like 'entity.node.canonical'),
    not the URL path. The route_condition module provides this. What is the condition plugin id it adds,
    and what single configuration key holds the list of route names?
  criteria: route_condition provides a Condition plugin with id 'route' (class RouteCondition). Its single
    config key is 'routes' — a textarea of one route name per line. On a block it is stored at block.block.<id>
    -> visibility.route.routes.
  bundle: route_condition
  rubric_ref: rubric/route_condition_route_condition_plugin_and_key@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: route_condition-wildcard-negate
  input: Using the route_condition module's 'route' condition, how do I (a) match every entity's canonical
    view route with one line, and (b) exclude a single route? Describe the wildcard and exclusion syntax.
  criteria: Use '*' as a wildcard (compiled to regex '.*'), e.g. 'entity.*.canonical' matches every entity
    canonical route. Prepend '~' (tilde) to a route name to exclude it, e.g. '~user.login'. One route
    per line; matching is case-insensitive; the first matching line wins.
  bundle: route_condition
  rubric_ref: rubric/route_condition_route_condition_wildcard_negate@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: route_condition-empty-behavior
  input: With the route_condition 'route' condition, what happens if I leave the routes field empty, and
    how does it read the current route? Does it match on the URL path or the route machine name?
  criteria: An empty 'routes' value makes evaluate() return TRUE (matches everywhere). It reads the active
    route via the current_route_match service and matches on the route MACHINE NAME (e.g. entity.node.canonical),
    not the URL path — that is what distinguishes it from core's request_path 'Pages' condition.
  bundle: route_condition
  rubric_ref: rubric/route_condition_route_condition_empty_behavior@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: route_condition-known-block
  input: On this Drupal site a block with id 'routecond_known' is placed in the olivero theme and uses
    the route_condition 'route' visibility condition to restrict where it shows. Inspect the live block
    configuration and state the exact route name it is restricted to.
  criteria: 'block.block.routecond_known has visibility.route.routes = ''entity.user.canonical'', so the
    block only shows on the user canonical (profile) route. Read it with: drush cget block.block.routecond_known
    visibility.route.routes'
  bundle: route_condition
  rubric_ref: rubric/route_condition_route_condition_known_block@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/route_condition-known-block-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/route_condition-known-block-cleanup.sh
- id: route_condition-negated-block
  input: A block with id 'routecond_neg' on this site uses the route_condition 'route' condition. Inspect
    its live visibility configuration and describe exactly which routes it targets, including any wildcard
    or exclusion it uses.
  criteria: 'block.block.routecond_neg has visibility.route.routes with two lines: ''entity.node.*'' (wildcard
    matching all node routes) and ''~entity.node.edit_form'' (tilde-excluding the node edit form route).
    So it targets node routes but not the node edit form.'
  bundle: route_condition
  rubric_ref: rubric/route_condition_route_condition_negated_block@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/route_condition-negated-block-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/route_condition-negated-block-cleanup.sh
- id: route_condition-node-canonical
  input: On this site a block with id 'routecond_task' is placed in the olivero theme but currently has
    an empty route_condition 'route' visibility (it shows everywhere). Using the route_condition module,
    configure that block's Route visibility condition so the block only appears on node canonical pages.
    Apply the change to the live site.
  criteria: Set block.block.routecond_task -> visibility.route.routes to 'entity.node.canonical' (or a
    wildcard that matches it, e.g. 'entity.node.*' or 'entity.*.canonical'), with negate false, and save.
    E.g. load the Block entity, set visibility route config, save.
  bundle: route_condition
  rubric_ref: rubric/route_condition_route_condition_node_canonical@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/route_condition-node-canonical-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/route_condition-node-canonical-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/route_condition-node-canonical-verify.sh
- id: route_condition-exclude-route
  input: On this site a block 'routecond_excl' uses the route_condition 'route' visibility condition (currently
    matching only 'entity.node.canonical'). Using the route_condition tilde-exclusion syntax, add a rule
    so the block is additionally excluded from the user login route. Apply the change to the live block
    configuration.
  criteria: Add a line '~user.login' to block.block.routecond_excl -> visibility.route.routes (the leading
    tilde excludes that route). The resulting value contains both 'entity.node.canonical' and '~user.login'.
  bundle: route_condition
  rubric_ref: rubric/route_condition_route_condition_exclude_route@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/route_condition-exclude-route-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/route_condition-exclude-route-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/route_condition-exclude-route-verify.sh
