rubrics:
- id: role_expire_role_expire_default_duration
  version: '1.0'
  applicable_bundles:
  - role_expire
  checks:
  - kind: must_contain_any
    values:
    - default duration
    - strtotime
    - role_expire_default_duration_roles
    - 1 year
  scoring:
    combine: all_pass
- id: role_expire_role_expire_api_service
  version: '1.0'
  applicable_bundles:
  - role_expire
  checks:
  - kind: must_contain_any
    values:
    - role_expire.api
    - writeRecord
    - role_expire
    - expiry_timestamp
  scoring:
    combine: all_pass
- id: role_expire_role_expire_cron_and_replacement
  version: '1.0'
  applicable_bundles:
  - role_expire
  checks:
  - kind: must_contain_any
    values:
    - cron
    - role_expire_default_roles
    - RoleExpiresEvent
    - replacement
  scoring:
    combine: all_pass
- id: role_expire_role_expire_known_duration
  version: '1.0'
  applicable_bundles:
  - role_expire
  checks:
  - kind: must_contain_any
    values:
    - 3 months
  scoring:
    combine: all_pass
- id: role_expire_role_expire_known_replacement
  version: '1.0'
  applicable_bundles:
  - role_expire
  checks:
  - kind: must_contain_any
    values:
    - authenticated
  scoring:
    combine: all_pass
- id: role_expire_role_expire_set_duration
  version: '1.0'
  applicable_bundles:
  - role_expire
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
- id: role_expire_role_expire_replacement_role
  version: '1.0'
  applicable_bundles:
  - role_expire
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
