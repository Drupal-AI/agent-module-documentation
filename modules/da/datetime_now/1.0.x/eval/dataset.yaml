metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: datetime_now
  version: 1.0.x
  note: 'Datetime Now is a zero-configuration widget enhancement: no settings, no configure route, no
    permissions, no Drush, no plugins, no config or state. It implements hook_element_info_alter() to
    append a #process callback (Drupal\datetime_now\ElementInfoAlter\DatetimeElementInfoAlter) to the
    core ''datetime'' render element, injecting a ''Now'' button (class datetime-now inside datetime-now-wrapper)
    plus the datetime_now/datetime_now JS library. Because the trigger is the datetime ELEMENT, the button
    appears on the datetime_default widget and the daterange_default widget (start+end) but NOT on datetime_datelist
    (which renders the ''datelist'' element). There is no per-field config to read, so medium cases inspect
    the live element_info / field setup, and hard cases have the agent add a datetime/daterange field
    whose widget renders the datetime element (the observable prerequisite for the Now button). Verify
    scripts assert the field+widget and that datetime_now''s callback is wired into the datetime element.'
questions:
- id: datetime_now-how-to-enable
  input: I installed the Drupal contrib module datetime_now. Where is its configuration page and how do
    I turn on the 'Now' button for my Date/time fields?
  criteria: Datetime Now has no configuration page and no configure route. Simply enabling the module
    adds a 'Now' button to every core Date/time widget that renders the 'datetime' element (datetime_default
    and the daterange_default widget) — there is nothing to configure per field.
  bundle: datetime_now
  rubric_ref: rubric/datetime_now_datetime_now_how_to_enable@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: datetime_now-mechanism
  input: How does the datetime_now module add its 'Now' button to Drupal Date/time widgets — which hook
    and which render element does it alter?
  criteria: 'It implements hook_element_info_alter() and appends a #process callback (DatetimeElementInfoAlter::process)
    to the core ''datetime'' render element. That callback adds a ''Now'' button (class datetime-now)
    and attaches the datetime_now/datetime_now JS library.'
  bundle: datetime_now
  rubric_ref: rubric/datetime_now_datetime_now_mechanism@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: datetime_now-which-widgets
  input: Does the datetime_now 'Now' button appear on the Date/time 'Select list' (datetime_datelist)
    widget? On which Date/time widgets does it actually show up?
  criteria: No. datetime_now alters the core 'datetime' render element, so the button appears on the datetime_default
    ('Date and time') widget and the Datetime Range daterange_default widget (start and end). The datetime_datelist
    ('Select list') widget renders the 'datelist' element, which datetime_now does not alter, so it gets
    no button.
  bundle: datetime_now
  rubric_ref: rubric/datetime_now_datetime_now_which_widgets@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: datetime_now-known-field
  input: On this Drupal site the Article content type has a Date/time field that will render a datetime_now
    'Now' button on its edit widget. Inspect the live default form display for Article and give the machine
    name of that field.
  criteria: 'field_dtn_known: in core.entity_form_display.node.article.default it uses the datetime_default
    widget, which renders the ''datetime'' element that datetime_now augments with a Now button.'
  bundle: datetime_now
  rubric_ref: rubric/datetime_now_datetime_now_known_field@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/datetime_now-known-field-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/datetime_now-known-field-cleanup.sh
- id: datetime_now-which-module-alters
  input: The Article field field_dtn_elem on this site renders a 'Now' button on its Date/time edit widget.
    By inspecting the running site, determine which enabled module adds that button to the datetime form
    element.
  criteria: 'The datetime_now module. Inspecting the ''datetime'' element info (plugin.manager.element_info)
    shows a #process callback whose class is Drupal\datetime_now\ElementInfoAlter\DatetimeElementInfoAlter,
    added via hook_element_info_alter().'
  bundle: datetime_now
  rubric_ref: rubric/datetime_now_datetime_now_which_module_alters@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/datetime_now-element-alter-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/datetime_now-element-alter-cleanup.sh
- id: datetime_now-add-datetime-field
  input: On this Drupal site, add a Date/time field named field_dtn_task to the Article content type and
    configure its default edit form so that, thanks to the datetime_now module, editors get a 'Now' button
    on it. Apply the change to the live site.
  criteria: Create a datetime field storage/field field_dtn_task on node/article and set its component
    in core.entity_form_display.node.article.default to the datetime_default widget (which renders the
    'datetime' element datetime_now augments with the Now button).
  bundle: datetime_now
  rubric_ref: rubric/datetime_now_datetime_now_add_datetime_field@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/datetime_now-add-datetime-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/datetime_now-add-datetime-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/datetime_now-add-datetime-verify.sh
- id: datetime_now-add-daterange-field
  input: On my Drupal site I want Article authors to enter a start and end date/time for an event, and
    I want a quick button that fills each one with the current time (the datetime_now module provides
    it). Add a date range field called field_dtn_period to Articles and set it up so those quick-fill
    buttons appear. Apply it to the live site.
  criteria: Create a Datetime Range (daterange) field field_dtn_period on node/article and set its component
    in core.entity_form_display.node.article.default to the daterange_default widget. Because that widget
    renders 'datetime' sub-elements for start and end, datetime_now adds a Now button to both.
  bundle: datetime_now
  rubric_ref: rubric/datetime_now_datetime_now_add_daterange_field@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: site-owner
    reset: agent-module-documentation/evaluation/verify/datetime_now-add-daterange-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/datetime_now-add-daterange-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/datetime_now-add-daterange-verify.sh
