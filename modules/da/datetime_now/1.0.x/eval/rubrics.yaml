rubrics:
- id: datetime_now_datetime_now_how_to_enable
  version: '1.0'
  applicable_bundles:
  - datetime_now
  checks:
  - kind: must_contain_any
    values:
    - no configuration
    - no settings
    - no configure
    - automatically
    - zero configuration
    - enabling the module
  scoring:
    combine: all_pass
- id: datetime_now_datetime_now_mechanism
  version: '1.0'
  applicable_bundles:
  - datetime_now
  checks:
  - kind: must_contain_any
    values:
    - hook_element_info_alter
    - element_info_alter
    - '#process'
    - datetime element
    - '''datetime'''
  scoring:
    combine: all_pass
- id: datetime_now_datetime_now_which_widgets
  version: '1.0'
  applicable_bundles:
  - datetime_now
  checks:
  - kind: must_contain_any
    values:
    - datetime_default
    - daterange
    - datelist
    - datetime element
  scoring:
    combine: all_pass
- id: datetime_now_datetime_now_known_field
  version: '1.0'
  applicable_bundles:
  - datetime_now
  checks:
  - kind: must_contain_any
    values:
    - field_dtn_known
  scoring:
    combine: all_pass
- id: datetime_now_datetime_now_which_module_alters
  version: '1.0'
  applicable_bundles:
  - datetime_now
  checks:
  - kind: must_contain_any
    values:
    - datetime_now
  scoring:
    combine: all_pass
- id: datetime_now_datetime_now_add_datetime_field
  version: '1.0'
  applicable_bundles:
  - datetime_now
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
- id: datetime_now_datetime_now_add_daterange_field
  version: '1.0'
  applicable_bundles:
  - datetime_now
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
