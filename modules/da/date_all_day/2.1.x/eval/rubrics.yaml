rubrics:
- id: date_all_day_date_all_day_plugin_ids
  version: '1.0'
  applicable_bundles:
  - date_all_day
  checks:
  - kind: must_contain_any
    values:
    - daterange_all_day
    - All day
  scoring:
    combine: all_pass
- id: date_all_day_date_all_day_how_stored
  version: '1.0'
  applicable_bundles:
  - date_all_day
  checks:
  - kind: must_contain_any
    values:
    - 00:00:00
    - '23:59:59'
    - isAllDay
  scoring:
    combine: all_pass
- id: date_all_day_date_all_day_date_only_format
  version: '1.0'
  applicable_bundles:
  - date_all_day
  checks:
  - kind: must_contain_any
    values:
    - date_only_format
    - date_all_day
  scoring:
    combine: all_pass
- id: date_all_day_date_all_day_known_widget
  version: '1.0'
  applicable_bundles:
  - date_all_day
  checks:
  - kind: must_contain_any
    values:
    - html_date
  scoring:
    combine: all_pass
- id: date_all_day_date_all_day_allday_node
  version: '1.0'
  applicable_bundles:
  - date_all_day
  checks:
  - kind: must_contain_any
    values:
    - DAD All Day Probe
  scoring:
    combine: all_pass
- id: date_all_day_date_all_day_formatter
  version: '1.0'
  applicable_bundles:
  - date_all_day
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
- id: date_all_day_date_all_day_allday_node_build
  version: '1.0'
  applicable_bundles:
  - date_all_day
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
