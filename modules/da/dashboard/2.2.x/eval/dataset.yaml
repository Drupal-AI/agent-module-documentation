metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: dashboard
  version: 2.2.x
  note: Dashboard exposes a `dashboard` config entity built with Layout Builder, a set of block plugins,
    dynamic per-dashboard permissions, and a login redirect. Cases are `recipe` (response-graded) probing
    documented facts an agent would otherwise read source to answer; no site mutation.
questions:
- id: dashboard-config-entity
  input: On a Drupal 11 site using the contrib Dashboard module, what kind of thing is a dashboard, and
    where is its layout stored?
  criteria: A dashboard is a `dashboard` config entity (config file dashboard.dashboard.<id>.yml) whose
    exported `layout` key holds Layout Builder sections; the entity implements SectionListInterface.
  bundle: dashboard
  rubric_ref: rubric/dashboard_dashboard_config_entity@1.0
  tags:
  - mode:recipe
- id: dashboard-place-blocks
  input: How do I add blocks to a dashboard in the contrib Dashboard module, and which subsystem is used
    to arrange them?
  criteria: Use the 'Edit layout' action which opens Layout Builder; add sections and drop blocks (Dashboard
    Text, Site Status, Placeholder, Views blocks, etc.) into regions. Depends on core layout_builder.
  bundle: dashboard
  rubric_ref: rubric/dashboard_dashboard_place_blocks@1.0
  tags:
  - mode:recipe
- id: dashboard-per-role
  input: I want editors and administrators to each see their own dashboard on this Drupal site. Using
    the Dashboard module, how do I give each role access to a specific dashboard?
  criteria: Create one dashboard per role; grant each role the dynamically generated `view <id> dashboard`
    permission for its dashboard. getDefaultDashboard() returns the first enabled dashboard (by weight)
    the user may view.
  bundle: dashboard
  rubric_ref: rubric/dashboard_dashboard_per_role@1.0
  tags:
  - mode:recipe
- id: dashboard-admin-route
  input: Where do I manage dashboards in the admin UI of the Dashboard module, and what is the configure
    route name?
  criteria: Admin -> Structure -> Dashboard at /admin/structure/dashboard; the configure route is entity.dashboard.collection
    (requires the 'administer dashboard' permission).
  bundle: dashboard
  rubric_ref: rubric/dashboard_dashboard_admin_route@1.0
  tags:
  - mode:recipe
- id: dashboard-permissions
  input: What permissions does the Dashboard module provide to control who can administer dashboards versus
    who can view a particular one?
  criteria: Static 'administer dashboard' gates building/managing dashboards; a dynamic 'view <id> dashboard'
    permission is generated per dashboard to grant viewing access.
  bundle: dashboard
  rubric_ref: rubric/dashboard_dashboard_permissions@1.0
  tags:
  - mode:recipe
- id: dashboard-login-landing
  input: With the Dashboard module, can a user be sent to their dashboard automatically after logging
    in, and what governs which dashboard?
  criteria: 'Yes: a hook_user_login handler redirects to /admin/dashboard when the user has an accessible
    dashboard (unless an explicit destination is set or on password reset). The default is the first enabled
    dashboard by weight the user may view.'
  bundle: dashboard
  rubric_ref: rubric/dashboard_dashboard_login_landing@1.0
  tags:
  - mode:recipe
- id: dashboard-core-successor
  input: Is this contrib Dashboard module related to the old Dashboard that used to be in Drupal core?
  criteria: It is the contrib successor to core's old Dashboard module (which was removed from core);
    package is 'Core', depends on layout_builder, node, views, and targets Drupal ^11.2.
  bundle: dashboard
  rubric_ref: rubric/dashboard_dashboard_core_successor@1.0
  tags:
  - mode:recipe
- id: dashboard-plugin-types
  input: Does the Dashboard module define its own plugin type, and what are its Dashboard-category blocks?
  criteria: No new plugin type/manager. It ships core Block plugins (dashboard_text_block, dashboard_site_status,
    navigation_dashboard, dashboard_placeholder) and a Layout Builder 'dashboard' section-storage plugin
    (inline blocks disabled).
  bundle: dashboard
  rubric_ref: rubric/dashboard_dashboard_plugin_types@1.0
  tags:
  - mode:recipe
