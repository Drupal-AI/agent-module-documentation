metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: datetime_extras
  version: 1.2.x
  note: 'Datetime Extras adds field-plugin surface only: a time_only_field field type (widget+formatter
    time_only_field_default), datetime widgets datetime_datelist_no_time and datatime_configurable (plus
    deprecated datatime_extras_configurable_list), and a daterange_duration widget (needs duration_field).
    No configure route, permissions, services, or Drush. All state is field storage/widget/formatter settings
    in field + entity_form_display/entity_view_display config. Introspection reads back a widget set on
    a real datetime field; execution creates a time_only_field field verified via FieldStorageConfig::getType().'
questions:
- id: datetime_extras-date-only-widget
  input: 'On a Drupal site with datetime_extras, I want a core Date-only editing experience: an editor
    should pick a date from select lists with NO time input on a core datetime field. Which field widget
    provided by datetime_extras do I choose, and what is its plugin id?'
  criteria: Use the 'Select list, no time' widget, plugin id datetime_datelist_no_time, on the datetime
    field in Manage form display. Core only offers a datelist WITH time; this widget renders the date-part
    select lists with no time element.
  bundle: datetime_extras
  rubric_ref: rubric/datetime_extras_datetime_extras_date_only_widget@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: datetime_extras-time-only-field
  input: I need to store just a time of day (like a shop opening time) with no date on a Drupal entity.
    Does datetime_extras provide a field type for that, and what is its id?
  criteria: 'Yes: datetime_extras adds the ''Time only field'' field type, id time_only_field (extends
    core DateTimeItem with datetime_type ''time''). Its default widget and formatter are both time_only_field_default.'
  bundle: datetime_extras
  rubric_ref: rubric/datetime_extras_datetime_extras_time_only_field@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: datetime_extras-duration-widget
  input: With datetime_extras, how can an editor enter a datetime_range value as a start plus a duration
    instead of an explicit end, and what extra module must be enabled for that widget to appear?
  criteria: Use the 'Date and time range with duration' widget (id daterange_duration) on a core daterange
    field; it lets editors set a start then an absolute end OR a relative duration. It requires the contrib
    duration_field module (>= 8.x-2.0-rc3) — datetime_extras hides the widget via hook_field_widget_info_alter()
    until duration_field is enabled.
  bundle: datetime_extras
  rubric_ref: rubric/datetime_extras_datetime_extras_duration_widget@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: datetime_extras-which-widget
  input: On this Drupal site, the Article content type has a Date/time field named field_dte_when. Inspect
    the live default form display and state which field widget (plugin id) is configured for that field.
  criteria: 'field_dte_when uses the datetime_extras widget datetime_datelist_no_time (''Select list,
    no time''). Discoverable via `drush cget core.entity_form_display.node.article.default content.field_dte_when`
    (type: datetime_datelist_no_time).'
  bundle: datetime_extras
  rubric_ref: rubric/datetime_extras_datetime_extras_which_widget@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/datetime_extras-notime-widget-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/datetime_extras-notime-widget-cleanup.sh
- id: datetime_extras-widget-date-order
  input: On this Drupal site, the Article field field_dte_when uses a datetime_extras 'Select list, no
    time' widget. Inspect the live default form display and report the configured date part order (the
    date_order widget setting) for that field.
  criteria: 'field_dte_when''s datetime_datelist_no_time widget has settings.date_order = ''YMD''. Discoverable
    via `drush cget core.entity_form_display.node.article.default content.field_dte_when` (settings.date_order:
    YMD).'
  bundle: datetime_extras
  rubric_ref: rubric/datetime_extras_datetime_extras_widget_date_order@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/datetime_extras-notime-widget-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/datetime_extras-notime-widget-cleanup.sh
- id: datetime_extras-add-time-only-field
  input: On this Drupal site, use the datetime_extras module to add a field named field_dte_time to the
    Article content type that stores ONLY a time of day (no date). Apply the change to the live site.
  criteria: Article has a field field_dte_time whose field storage type is time_only_field (the datetime_extras
    'Time only field' field type), e.g. FieldStorageConfig::create(['field_name'=>'field_dte_time','entity_type'=>'node','type'=>'time_only_field','settings'=>['datetime_type'=>'time']])->save()
    then a matching FieldConfig on article.
  bundle: datetime_extras
  rubric_ref: rubric/datetime_extras_datetime_extras_add_time_only_field@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/datetime_extras-timeonly-field-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/datetime_extras-timeonly-field-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/datetime_extras-timeonly-field-verify.sh
- id: datetime_extras-set-notime-widget
  input: On this Drupal site the Article type has a Date/time field field_dte_setw. Configure its editing
    form so authors pick the value from date select-list dropdowns with no time input, using datetime_extras.
    Save the change on the live site.
  criteria: The reset creates field_dte_setw as a core datetime field with the core datetime_default widget;
    the agent must set the node.article default form-display widget for field_dte_setw to datetime_datelist_no_time
    ('Select list, no time') and save.
  bundle: datetime_extras
  rubric_ref: rubric/datetime_extras_datetime_extras_set_notime_widget@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: site-owner
    reset: agent-module-documentation/evaluation/verify/datetime_extras-set-notime-widget-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/datetime_extras-set-notime-widget-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/datetime_extras-set-notime-widget-verify.sh
