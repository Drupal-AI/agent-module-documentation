metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: date_recur_modular
  version: 3.3.x
  note: 'date_recur_modular ships three @FieldWidget plugins for the date_recur field type: date_recur_modular_alpha
    (Modular: Alpha), date_recur_modular_oscar (Modular: Oscar), date_recur_modular_sierra (Modular: Sierra).
    It has no config UI/route; you ''configure'' it by choosing one of its widgets on an entity form display.
    Recipe cases are response-graded. Medium cases set a known widget on a live date_recur field''s form
    display and require live introspection of the entity_form_display. Hard cases build live config: switch
    a date_recur field''s form-display widget to a modular widget, verified against real entity_form_display
    state.'
questions:
- id: drm-widget-ids
  input: On Drupal 11, the date_recur_modular module provides friendlier form widgets for recurring-date
    fields. List the machine ids of the field widgets it bundles.
  criteria: 'Three @FieldWidget plugins: date_recur_modular_alpha (Modular: Alpha), date_recur_modular_oscar
    (Modular: Oscar), and date_recur_modular_sierra (Modular: Sierra).'
  bundle: date_recur_modular
  rubric_ref: rubric/date_recur_modular_drm_widget_ids@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: drm-field-type
  input: Which field type do the widgets bundled by the Drupal date_recur_modular module attach to, and
    which module provides that field type?
  criteria: They attach only to the `date_recur` field type (field_types = {date_recur}) provided by the
    Recurring Dates Field (date_recur) module, which date_recur_modular depends on.
  bundle: date_recur_modular
  rubric_ref: rubric/date_recur_modular_drm_field_type@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: drm-sierra-permission
  input: The Sierra widget from date_recur_modular opens a modal form. Which permission gates that modal,
    and which widget among the three bundled ones uses an interpreter to render occurrence text?
  criteria: The Sierra widget (date_recur_modular_sierra) uses a date_recur interpreter; its modal forms
    require the permission 'date_recur_modular use sierra form'. Alpha and Oscar need no extra permission.
  bundle: date_recur_modular
  rubric_ref: rubric/date_recur_modular_drm_sierra_permission@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: drm-known-sierra-widget
  input: A date_recur field named field_recur_disp has been added to the Article content type on this
    site, and a date_recur_modular widget has been selected for it on the default form display. Inspect
    the entity form display and tell me exactly which widget (its machine id and label) is configured
    for that field.
  criteria: 'The field_recur_disp component of core.entity_form_display.node.article.default uses the
    date_recur_modular_sierra widget (label ''Modular: Sierra'').'
  bundle: date_recur_modular
  rubric_ref: rubric/date_recur_modular_drm_known_sierra_widget@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/date_recur_modular-known-sierra-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/date_recur_modular-known-sierra-cleanup.sh
- id: drm-known-oscar-widget
  input: The Article content type on this site has a date_recur field named field_recur_hours, and one
    of the date_recur_modular widgets is assigned to it on the default form display. Inspect the form
    display and tell me which widget it uses and the value of that widget's distinctive boolean setting.
  criteria: 'The field_recur_hours component uses the date_recur_modular_oscar widget (label ''Modular:
    Oscar'') with its all_day_toggle setting set to FALSE (disabled).'
  bundle: date_recur_modular
  rubric_ref: rubric/date_recur_modular_drm_known_oscar_widget@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/date_recur_modular-known-oscar-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/date_recur_modular-known-oscar-cleanup.sh
- id: drm-set-alpha-widget
  input: On this Drupal site the Article content type has a date_recur field named field_eval_recur_w
    whose default form-display widget is currently the plain date_recur basic widget. Change the field's
    widget on the default entity form display to the Date Recur Modular 'Alpha' widget (date_recur_modular_alpha)
    and save it to live config.
  criteria: core.entity_form_display.node.article.default now has content.field_eval_recur_w.type = date_recur_modular_alpha.
  bundle: date_recur_modular
  rubric_ref: rubric/date_recur_modular_drm_set_alpha_widget@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/date_recur_modular-set-alpha-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/date_recur_modular-set-alpha-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/date_recur_modular-set-alpha-verify.sh
- id: drm-set-sierra-widget
  input: On this Drupal site the Article content type has a date_recur field named field_eval_recur_s.
    Configure the default entity form display so this field is edited with the Date Recur Modular 'Sierra'
    modal widget (date_recur_modular_sierra), replacing the current basic widget, and persist it to live
    config.
  criteria: core.entity_form_display.node.article.default now has content.field_eval_recur_s.type = date_recur_modular_sierra.
  bundle: date_recur_modular
  rubric_ref: rubric/date_recur_modular_drm_set_sierra_widget@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/date_recur_modular-set-sierra-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/date_recur_modular-set-sierra-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/date_recur_modular-set-sierra-verify.sh
