metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: dark_mode_toggle
  version: 2.0.x
  note: Dark Mode Toggle provides one Block plugin (dark_mode_toggle) and a theme hook; it has no settings
    form, no configure route (configure=null), no permissions, no Drush, no config schema. Its only persistent
    site state is the block placement (a block config entity with plugin dark_mode_toggle). The JS toggles
    data-dmt-mode (dark|light) and data-dmt-source (user|system) on <html> and stores the choice in localStorage
    key 'dmt-mode'. Introspection/execution cases are therefore grounded in real block placements; easy
    cases in the real attribute/localStorage contract.
questions:
- id: dark_mode_toggle-html-attribute
  input: The Drupal contrib module dark_mode_toggle switches a theme between light and dark. Which HTML
    attribute does its JavaScript set on the <html> element to indicate the active variant, and what are
    its two possible values?
  criteria: It sets data-dmt-mode on the <html> (documentElement) to either 'dark' or 'light'. It also
    sets data-dmt-source to 'user' or 'system'. The theme's CSS styles the page off the data-dmt-mode
    attribute.
  bundle: dark_mode_toggle
  rubric_ref: rubric/dark_mode_toggle_dark_mode_toggle_html_attribute@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: dark_mode_toggle-persistence
  input: In the dark_mode_toggle module, how is a visitor's Light/Dark choice remembered between page
    loads, and what happens when they pick the 'System' button?
  criteria: A manual Light/Dark choice is stored in the browser under localStorage key 'dmt-mode' (source=user).
    Picking System removes that key and follows the OS prefers-color-scheme media query (source=system),
    updating live when the OS preference changes.
  bundle: dark_mode_toggle
  rubric_ref: rubric/dark_mode_toggle_dark_mode_toggle_persistence@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: dark_mode_toggle-how-to-add
  input: I installed dark_mode_toggle but there is no settings page. How do I actually add the light/dark
    switcher to my Drupal site, and what makes the page actually change colour?
  criteria: There is no configure route. You place the 'Dark Mode Toggle' block (plugin id dark_mode_toggle)
    in a region via Structure > Block layout. The module only toggles the data-dmt-mode attribute on <html>;
    the active theme's CSS must actually restyle the page based on [data-dmt-mode=dark].
  bundle: dark_mode_toggle
  rubric_ref: rubric/dark_mode_toggle_dark_mode_toggle_how_to_add@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: dark_mode_toggle-known-region
  input: On this Drupal site the Dark Mode Toggle block has been placed in the Olivero theme. Inspect
    the live block configuration and state which region the dark_mode_toggle block is placed in.
  criteria: The block.block.dmt_eval_known placement (plugin dark_mode_toggle, theme olivero) is in the
    'sidebar' region.
  bundle: dark_mode_toggle
  rubric_ref: rubric/dark_mode_toggle_dark_mode_toggle_known_region@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
