  criteria: Yes — there is an enabled block placement whose plugin is dark_mode_toggle (block.block.dmt_eval_known
    in the olivero sidebar region), so the toggle renders on the front end.
  bundle: dark_mode_toggle
  rubric_ref: rubric/dark_mode_toggle_dark_mode_toggle_is_placed@1.0
