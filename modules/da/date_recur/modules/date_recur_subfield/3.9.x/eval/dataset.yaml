questions:
- id: drs-field-type
  input: What field type does the date_recur_subfield submodule define, which class implements it, and
    which existing field-type class does it extend?
  criteria: It defines the `date_recur_sub` field type via Drupal\date_recur_subfield\Plugin\Field\FieldType\DateRecurSubItem,
    which extends date_recur's DateRecurItem.
  bundle: date_recur_subfield
  rubric_ref: rubric/date_recur_subfield_drs_field_type@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: drs-extra-column
  input: The date_recur_subfield example subclasses the recurring-date field to add one extra stored property.
    What is that property, and which two methods does the subclass override to add it?
  criteria: 'It adds a `color` property (varchar 16) by overriding propertyDefinitions() (adds the typed-data
    property) and schema() (adds the database column), each calling parent:: first.'
  bundle: date_recur_subfield
  rubric_ref: rubric/date_recur_subfield_drs_extra_column@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: drs-widget-formatter-reuse
  input: How does the date_recur_subfield submodule make the parent date_recur widgets and formatters
    available to its new date_recur_sub field type?
  criteria: Via hook_field_widget_info_alter() and hook_field_formatter_info_alter() in date_recur_subfield.module,
    which append 'date_recur_sub' to the field_types of every widget/formatter that supports 'date_recur'.
  bundle: date_recur_subfield
  rubric_ref: rubric/date_recur_subfield_drs_widget_formatter_reuse@1.0
