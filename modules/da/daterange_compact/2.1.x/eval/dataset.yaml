metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: daterange_compact
  version: 2.1.x
  note: 'Compact Date Range Formatter adds a ''Compact'' field formatter (id daterange_compact) for daterange/datetime/timestamp
    fields that omits duplicated month/year (e.g. 24-25 January 2017). Compact rules live in the daterange_compact_format
    config entity type (config prefix daterange_compact.format.<id>; managed at Regional and language
    settings, route entity.daterange_compact_format.collection). Each format has a required default_pattern
    plus optional same-day/same-month/same-year start/end patterns and separators (PHP date tokens), and
    flags zero_minutes_omit / same_day_omit_duplicate_ampm. Two formats ship: medium_date, medium_datetime.
    The same logic is exposed via the daterange_compact.formatter service. Requires core datetime_range.
    Medium/hard cases are grounded in real config: introspection reads a seeded format''s default_pattern/separator;
    execution creates a new format config entity, or switches a daterange field''s display to the daterange_compact
    formatter, verified against live config.'
questions:
- id: dc-formatter-name
  input: I have a core date range (daterange) field showing '24 January 2017 – 25 January 2017'. Using
    the daterange_compact module, how do I display it compactly as '24–25 January 2017'?
  criteria: On the field's Manage display, set its format to 'Compact' (the daterange_compact formatter)
    and choose one of the compact date range formats. It omits the duplicated month/year.
  bundle: daterange_compact
  rubric_ref: rubric/daterange_compact_dc_formatter_name@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: dc-where-formats
  input: Where are the compact date range formats managed in the daterange_compact module, and which formats
    come preinstalled?
  criteria: 'They are daterange_compact_format config entities managed at Configuration → Regional and
    language → Compact date and time range formats (route entity.daterange_compact_format.collection).
    Two ship preinstalled: medium_date and medium_datetime.'
  bundle: daterange_compact
  rubric_ref: rubric/daterange_compact_dc_where_formats@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: dc-service
  input: How can I format a compact date range from custom code (not via a field) with the daterange_compact
    module?
  criteria: 'Use the daterange_compact.formatter service: formatDateRange(startIso, endIso, $type) for
    ISO-8601 dates or formatTimestampRange(start, end, $type) for UNIX timestamps; both return a FormattedDateTimeRange
    you cast to string. $type is a format machine id (defaults medium_date / medium_datetime).'
  bundle: daterange_compact
  rubric_ref: rubric/daterange_compact_dc_service@1.0
  tags:
  - mode:recipe
  - difficulty:easy
