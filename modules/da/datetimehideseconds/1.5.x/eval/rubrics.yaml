rubrics:
- id: datetimehideseconds_datetimehideseconds_how_it_hides
  version: '1.0'
  applicable_bundles:
  - datetimehideseconds
  checks:
  - kind: must_contain_any
    values:
    - step
    - step=60
    - step = 60
    - '"step" => 60'
  scoring:
    combine: all_pass
- id: datetimehideseconds_datetimehideseconds_where_configured
  version: '1.0'
  applicable_bundles:
  - datetimehideseconds
  checks:
  - kind: must_contain_any
    values:
    - form display
    - form-display
    - Manage form display
    - third party setting
    - third_party_settings
    - entity_form_display
  scoring:
    combine: all_pass
- id: datetimehideseconds_datetimehideseconds_which_widgets
  version: '1.0'
  applicable_bundles:
  - datetimehideseconds
  checks:
  - kind: must_contain_any
    values:
    - DateTimeWidgetBase
    - datetime_default
    - datetime_datelist
    - daterange
  scoring:
    combine: all_pass
- id: datetimehideseconds_datetimehideseconds_known_field
  version: '1.0'
  applicable_bundles:
  - datetimehideseconds
  checks:
  - kind: must_contain_any
    values:
    - field_dhs_known
  scoring:
    combine: all_pass
- id: datetimehideseconds_datetimehideseconds_enabled_vs_not
  version: '1.0'
  applicable_bundles:
  - datetimehideseconds
  checks:
  - kind: must_contain_any
    values:
    - field_dhs_on
  scoring:
    combine: all_pass
- id: datetimehideseconds_datetimehideseconds_enable_datetime
  version: '1.0'
  applicable_bundles:
  - datetimehideseconds
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
- id: datetimehideseconds_datetimehideseconds_enable_range
  version: '1.0'
  applicable_bundles:
  - datetimehideseconds
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
