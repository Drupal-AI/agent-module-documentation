metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: datetimehideseconds
  version: 1.5.x
  note: 'DateTime Hide Seconds is a widget-alteration module with no field type, no widget of its own,
    no settings form, no configure route (configure=null), no permissions, no Drush, and no plugins. Its
    entire persistent state is a single per-component third-party setting `datetimehideseconds.hide: true`
    stored on a core Date/time widget inside an entity_form_display config entity (e.g. core.entity_form_display.node.article.default
    -> content.<field>.third_party_settings.datetimehideseconds.hide). The checkbox is only offered on
    widgets extending DateTimeWidgetBase (datetime_default, datetime_datelist, and the datetime_range
    daterange widgets). All medium/hard cases are therefore grounded in that real config: introspection
    reads back which datetime field has the setting; execution creates/uses a datetime (or daterange)
    field on Article and turns the setting on, verified against the live entity_form_display.'
questions:
- id: datetimehideseconds-how-it-hides
  input: The Drupal contrib module datetimehideseconds hides the seconds in a Date/time field's edit widget.
    In practical terms, how does it stop the browser from showing a seconds control on the HTML5 time
    input? Name the HTML attribute (and its value) it sets on the time element.
  criteria: 'Its datetime process callback sets the time input''s step attribute to 60 (`#attributes[''step'']
    = 60`), so an HTML5 <input type="time"> drops the seconds spinner; it also truncates the time value
    to H:i and sets #date_time_format to ''H:i''.'
  bundle: datetimehideseconds
  rubric_ref: rubric/datetimehideseconds_datetimehideseconds_how_it_hides@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: datetimehideseconds-where-configured
  input: I enabled datetimehideseconds on a Drupal 11 site but there is no admin settings page for it.
    How do I actually turn on 'Hide seconds' for a specific datetime field, and where is that choice stored?
  criteria: 'There is no configure route (configure=null). You open the entity''s Manage form display,
    click the datetime field''s widget cog, tick ''Hide seconds'', Update and Save. It is stored as a
    third-party setting on that field''s widget component: core.entity_form_display.<entity>.<bundle>.<mode>
    -> content.<field>.third_party_settings.datetimehideseconds.hide: true.'
  bundle: datetimehideseconds
  rubric_ref: rubric/datetimehideseconds_datetimehideseconds_where_configured@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: datetimehideseconds-which-widgets
  input: On which Date/time field widgets does the datetimehideseconds 'Hide seconds' checkbox appear,
    and which base widget class controls that? Does it work on a date-only field?
  criteria: The checkbox is added by hook_field_widget_third_party_settings_form() only when the widget
    is an instance of DateTimeWidgetBase - i.e. the core datetime_default and datetime_datelist widgets
    and the datetime_range daterange widgets. It has no effect on a date-only field because there is no
    time input to alter.
  bundle: datetimehideseconds
  rubric_ref: rubric/datetimehideseconds_datetimehideseconds_which_widgets@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: datetimehideseconds-known-field
  input: On this Drupal site, the Article content type has a Date/time field whose widget has had datetimehideseconds
    'Hide seconds' enabled. Inspect the live default form display for Article and give the machine name
    of that field.
  criteria: 'The field is field_dhs_known: in core.entity_form_display.node.article.default its component
    (widget datetime_default) has third_party_settings.datetimehideseconds.hide: true.'
  bundle: datetimehideseconds
  rubric_ref: rubric/datetimehideseconds_datetimehideseconds_known_field@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/datetimehideseconds-known-field-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/datetimehideseconds-known-field-cleanup.sh
- id: datetimehideseconds-enabled-vs-not
  input: The Article content type on this site has two Date/time fields, field_dhs_on and field_dhs_off.
    Exactly one of them is configured with datetimehideseconds to hide seconds on its edit widget. Inspect
    the live form-display configuration and state which field hides seconds.
  criteria: 'field_dhs_on hides seconds: in core.entity_form_display.node.article.default its component
    has third_party_settings.datetimehideseconds.hide: true, whereas field_dhs_off has no such setting.'
  bundle: datetimehideseconds
  rubric_ref: rubric/datetimehideseconds_datetimehideseconds_enabled_vs_not@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/datetimehideseconds-enabled-vs-not-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/datetimehideseconds-enabled-vs-not-cleanup.sh
- id: datetimehideseconds-enable-datetime
  input: On this Drupal site, the Article content type has a Date/time field field_dhs_task using the
    'Date and time' (datetime_default) widget. Using the datetimehideseconds module, configure the default
    form display so that this field's widget hides the seconds on its time input. Apply the change to
    the live site.
  criteria: 'In core.entity_form_display.node.article.default the field_dhs_task component carries third_party_settings.datetimehideseconds.hide:
    true (e.g. set the component''s third_party_settings and save, or tick ''Hide seconds'' on the widget
    in Manage form display).'
  bundle: datetimehideseconds
  rubric_ref: rubric/datetimehideseconds_datetimehideseconds_enable_datetime@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/datetimehideseconds-enable-datetime-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/datetimehideseconds-enable-datetime-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/datetimehideseconds-enable-datetime-verify.sh
- id: datetimehideseconds-enable-range
  input: On this Drupal site, the Article content type has a Datetime Range field field_dhs_period using
    the daterange_default widget. Use the datetimehideseconds module to make this widget hide the seconds
    on both its start and end time inputs, and apply the change to the live default form display.
  criteria: 'In core.entity_form_display.node.article.default the field_dhs_period component carries third_party_settings.datetimehideseconds.hide:
    true; because the daterange widget extends DateTimeWidgetBase the module applies the H:i / step=60
    treatment to both the start and end time inputs.'
  bundle: datetimehideseconds
  rubric_ref: rubric/datetimehideseconds_datetimehideseconds_enable_range@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/datetimehideseconds-enable-range-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/datetimehideseconds-enable-range-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/datetimehideseconds-enable-range-verify.sh
