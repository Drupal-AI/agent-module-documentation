metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: datatables
  version: 3.0.x
  note: DataTables provides a Views style plugin (id 'datatables', class extends core Table, theme views_view_datatables)
    plus one site config object datatables.settings.use_cdn (form at /admin/config/services/datatables,
    permission 'administer site configuration'). Per-view configuration lives in the view config under
    display.*.display_options.style.type = datatables (schema views.style.datatables). Config-object cases
    (use_cdn) are fully agent-completable; the view cases are grounded in the views.view config entity
    and read via the view storage. The view fixtures/builds use raw config writes because Views config-entity
    saves via the entity/Views API are currently blocked by an unrelated broken commerce_giftcard field
    on this shared site.
questions:
- id: datatables-what
  input: How do I make a Drupal Views table use the jQuery DataTables plugin (searchable, sortable, paginated)
    with the datatables module?
  criteria: Build a view with fields, then set the display's Format/style to 'DataTables' (the datatables
    Views style plugin, id 'datatables', which extends core's Table style). The client-side DataTables
    plugin then adds search, column sorting and pagination.
  bundle: datatables
  rubric_ref: rubric/datatables_datatables_what@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: datatables-cdn-setting
  input: The datatables module needs the DataTables JavaScript library. What are my two options for providing
    it, and which setting controls that?
  criteria: Either install the DataTables library locally under /libraries (e.g. via Asset Packagist)
    or load it from a CDN. The datatables.settings config object's 'use_cdn' boolean (form at /admin/config/services/datatables,
    permission 'administer site configuration') switches between local (false) and CDN (true).
  bundle: datatables
  rubric_ref: rubric/datatables_datatables_cdn_setting@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: datatables-options
  input: What kinds of interactive features can I toggle on a DataTables-style view in Drupal (search,
    pagination, etc.)?
  criteria: The style options include a search filter box, a table-info line, state saving, TableTools
    (copy/print/export), pagination style and page length, per-column sortable/align/separator/hide-empty,
    hidden and expandable columns, and per-column search/filter types.
  bundle: datatables
  rubric_ref: rubric/datatables_datatables_options@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: datatables-known-cdn
  input: On this site, is the DataTables library being loaded from a CDN or from the local libraries folder?
    Inspect the live configuration to answer.
  criteria: The datatables.settings config object has use_cdn = true, so the DataTables library is loaded
    from the CDN. Read with `drush cget datatables.settings use_cdn`.
  bundle: datatables
  rubric_ref: rubric/datatables_datatables_known_cdn@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/datatables-cdn-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/datatables-cdn-cleanup.sh
- id: datatables-known-view
  input: One view on this site is configured to render with the DataTables style. Inspect the live view
    configuration and give the machine name of that view.
  criteria: 'The view dt_known uses the DataTables style: in views.view.dt_known its default display has
    display_options.style.type = datatables.'
  bundle: datatables
  rubric_ref: rubric/datatables_datatables_known_view@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/datatables-view-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/datatables-view-cleanup.sh
- id: datatables-enable-cdn
  input: Configure this site so the DataTables JavaScript library is loaded from the CDN rather than the
    local libraries folder. Apply the change to the live site.
  criteria: Set datatables.settings use_cdn = true (tick 'Use CDN' at /admin/config/services/datatables,
    or set the config value). Clearing the library discovery cache afterwards applies it.
  bundle: datatables
  rubric_ref: rubric/datatables_datatables_enable_cdn@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/datatables-cdn-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/datatables-cdn-reset.sh
    verify: agent-module-documentation/evaluation/verify/datatables-cdn-verify.sh
- id: datatables-build-view
  input: On this Drupal site, create a view named dt_task whose display renders using the DataTables style
    (the datatables Views style plugin). Apply it to the live site.
  criteria: Create a view (views.view.dt_task) with a display whose display_options.style.type = datatables
    (i.e. Format = DataTables).
  bundle: datatables
  rubric_ref: rubric/datatables_datatables_build_view@1.0
