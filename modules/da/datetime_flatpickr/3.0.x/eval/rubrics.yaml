rubrics:
- id: datetime_flatpickr_datetime_flatpickr_widgets
  version: '1.0'
  applicable_bundles:
  - datetime_flatpickr
  checks:
  - kind: must_contain_any
    values:
    - datetime_flatpickr
    - datetime_range_flatpickr
    - daterange
  scoring:
    combine: all_pass
- id: datetime_flatpickr_datetime_flatpickr_where_config
  version: '1.0'
  applicable_bundles:
  - datetime_flatpickr
  checks:
  - kind: must_contain_any
    values:
    - form display
    - Manage form display
    - form-display
    - widget
  scoring:
    combine: all_pass
- id: datetime_flatpickr_datetime_flatpickr_library
  version: '1.0'
  applicable_bundles:
  - datetime_flatpickr
  checks:
  - kind: must_contain_any
    values:
    - CDN
    - cdn
    - libraries/flatpickr
    - hook_library_info_alter
    - self-host
  scoring:
    combine: all_pass
- id: datetime_flatpickr_datetime_flatpickr_read_format
  version: '1.0'
  applicable_bundles:
  - datetime_flatpickr
  checks:
  - kind: must_contain_any
    values:
    - d/m/Y
  scoring:
    combine: all_pass
- id: datetime_flatpickr_datetime_flatpickr_which_field
  version: '1.0'
  applicable_bundles:
  - datetime_flatpickr
  checks:
  - kind: must_contain_any
    values:
    - field_dtf_fp
  scoring:
    combine: all_pass
- id: datetime_flatpickr_datetime_flatpickr_set_widget
  version: '1.0'
  applicable_bundles:
  - datetime_flatpickr
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
- id: datetime_flatpickr_datetime_flatpickr_enable_time
  version: '1.0'
  applicable_bundles:
  - datetime_flatpickr
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
