  criteria: It adds a Webform element plugin, flatpickr_date (label 'Flatpickr Date', category 'Date/time
    elements'), which renders a flatpickr date/time picker inside webforms.
  bundle: datetime_flatpickr_webform
  rubric_ref: rubric/datetime_flatpickr_webform_dtf_webform_element_id@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: dtf-webform-deps
  input: Which modules must be enabled to use the flatpickr_date webform element from datetime_flatpickr_webform?
  criteria: It depends on webform, datetime, and datetime_flatpickr (the parent module). It reuses the
    parent module's flatpickr settings trait.
  bundle: datetime_flatpickr_webform
  rubric_ref: rubric/datetime_flatpickr_webform_dtf_webform_deps@1.0
  tags:
