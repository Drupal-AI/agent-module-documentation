  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: datetime_flatpickr_webform
  version: 3.0.x
  note: 'Submodule of datetime_flatpickr. Provides one Webform element plugin, flatpickr_date (class FlatpickrDate
    extends WebformElementBase), category ''Date/time elements'', default dateFormat Y-m-d, reusing DateTimeFlatPickrWidgetTrait
    so the same flatpickr settings apply; prepare() renders it via the datetime_flatpickr form element.
    No config/permissions/routes. In a webform, an instance is an element with ''#type'': flatpickr_date,
    stored in webform.webform.<id>:elements (YAML). Medium/hard cases create webforms (dtf_wf_*) and add/read
    flatpickr_date elements.'
questions:
- id: dtf-webform-element-id
  input: What does the datetime_flatpickr_webform submodule add to Drupal, and what is the machine id
