metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: datetime_flatpickr_bef
  version: 3.0.x
  note: Submodule of datetime_flatpickr. Provides one Better Exposed Filters widget plugin, bef_flatpickr
    (class FlatpickrDateBef extends FilterWidgetBase, label 'Date Picker with Flatpickr'), applicable
    only to non-grouped Views Date filters. Selecting it is stored in the view display at display_options.exposed_form.type='bef'
    and exposed_form.options.bef.filter.<filter_id>.plugin_id='bef_flatpickr'. Reuses DateTimeFlatPickrWidgetTrait;
    exposedFormAlter() renders the exposed element via the datetime_flatpickr form element. No config/permissions/routes.
    Medium/hard cases build a view (dtf_bef_view) with an exposed 'created' date filter and read/set its
    BEF widget to bef_flatpickr.
questions:
- id: dtf-bef-widget-id
  input: What does the datetime_flatpickr_bef submodule add, and what is the id/label of the Better Exposed
    Filters widget it provides?
  criteria: It adds a Better Exposed Filters filter-widget plugin, bef_flatpickr (label 'Date Picker with
    Flatpickr'), which renders a Views exposed date filter as a flatpickr picker.
  bundle: datetime_flatpickr_bef
  rubric_ref: rubric/datetime_flatpickr_bef_dtf_bef_widget_id@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: dtf-bef-applicability
  input: For which kind of Views exposed filter can I choose the 'Date Picker with Flatpickr' (bef_flatpickr)
    widget, and what modules are required?
  criteria: Only for exposed Views Date filters that are not grouped (isApplicable checks for a views
    Date handler / date_handler). It requires better_exposed_filters, datetime, and datetime_flatpickr.
  bundle: datetime_flatpickr_bef
  rubric_ref: rubric/datetime_flatpickr_bef_dtf_bef_applicability@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: dtf-bef-where-stored
  input: If I select the bef_flatpickr widget for an exposed date filter in a view, where in the view
    configuration is that choice stored?
  criteria: 'In the view display''s exposed_form: type is ''bef'' and exposed_form.options.bef.filter.<filter_id>.plugin_id
    is ''bef_flatpickr'' (with the flatpickr settings alongside).'
  bundle: datetime_flatpickr_bef
  rubric_ref: rubric/datetime_flatpickr_bef_dtf_bef_where_stored@1.0
  tags:
