metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: datetime_range_timezone
  version: 1.0.x
  note: 'Datetime Range Timezone extends core datetime_range. Its daterange_timezone field type = DateRangeItem
    + a timezone varchar(255) column. Widget daterange_timezone adds a Timezone select and re-interprets
    the entered start/end in that timezone before storage (UTC). Two formatters: daterange_timezone (default;
    settings separator, format_type, display_timezone) rendered via datetime-range-timezone.html.twig,
    and daterange_timezone_single_date (settings date_field=start_date|end_date, format_type, display_timezone).
    Token integration adds start_date/end_date format tokens using the stored timezone. Config schema
    ids: field.formatter.settings.daterange_timezone(_single_date), field.storage_settings.daterange_timezone.
    No settings form (configure=null), no permissions, no Drush. medium cases inspect a live daterange_timezone
    field / formatter setting; hard cases create a daterange_timezone field or change a formatter setting,
    verified against the live field/display config.'
questions:
- id: datetime_range_timezone-plugins
  input: What field type and formatters does the Drupal datetime_range_timezone module provide, and what
    does it add on top of a normal Datetime Range field?
  criteria: 'It provides the daterange_timezone field type (extends core DateRangeItem, adding a stored
    timezone), a daterange_timezone widget with a Timezone select, and two formatters: daterange_timezone
    (default) and daterange_timezone_single_date. It lets each date range record and display the timezone
    it was entered in.'
  bundle: datetime_range_timezone
  rubric_ref: rubric/datetime_range_timezone_datetime_range_timezone_plugins@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: datetime_range_timezone-storage
  input: How does datetime_range_timezone store the timezone with a date range, and in what timezone does
    it display the dates back?
  criteria: The field type adds a 'timezone' varchar(255) column alongside the start/end values. The widget
    treats the entered dates as being in the selected timezone and core stores the values as UTC; the
    formatters then render every date using the stored timezone (not the site/viewer timezone).
  bundle: datetime_range_timezone
  rubric_ref: rubric/datetime_range_timezone_datetime_range_timezone_storage@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: datetime_range_timezone-formatter-settings
  input: Which settings do the datetime_range_timezone formatters expose — for example to hide the timezone
    label or to render only one endpoint of the range?
  criteria: The default daterange_timezone formatter has separator, format_type, and display_timezone
    (toggles the timezone label). The daterange_timezone_single_date formatter adds date_field (start_date
    or end_date) to render just one endpoint, plus format_type and display_timezone.
  bundle: datetime_range_timezone
  rubric_ref: rubric/datetime_range_timezone_datetime_range_timezone_formatter_settings@1.0
  tags:
  - mode:recipe
  - difficulty:easy
