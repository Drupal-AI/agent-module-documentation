rubrics:
- id: datetime_range_timezone_datetime_range_timezone_plugins
  version: '1.0'
  applicable_bundles:
  - datetime_range_timezone
  checks:
  - kind: must_contain_any
    values:
    - daterange_timezone
    - timezone
  scoring:
    combine: all_pass
- id: datetime_range_timezone_datetime_range_timezone_storage
  version: '1.0'
  applicable_bundles:
  - datetime_range_timezone
  checks:
  - kind: must_contain_any
    values:
    - timezone
    - column
    - UTC
    - stored
  scoring:
    combine: all_pass
- id: datetime_range_timezone_datetime_range_timezone_formatter_settings
  version: '1.0'
  applicable_bundles:
  - datetime_range_timezone
  checks:
  - kind: must_contain_any
    values:
    - display_timezone
    - date_field
    - separator
    - format_type
  scoring:
    combine: all_pass
- id: datetime_range_timezone_datetime_range_timezone_known_field
  version: '1.0'
  applicable_bundles:
  - datetime_range_timezone
  checks:
  - kind: must_contain_any
    values:
    - field_drt_known
  scoring:
    combine: all_pass
- id: datetime_range_timezone_datetime_range_timezone_single_date_endpoint
  version: '1.0'
  applicable_bundles:
  - datetime_range_timezone
  checks:
  - kind: must_contain_any
    values:
    - end_date
    - End Date
    - end
  scoring:
    combine: all_pass
- id: datetime_range_timezone_datetime_range_timezone_create_field
  version: '1.0'
  applicable_bundles:
  - datetime_range_timezone
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
- id: datetime_range_timezone_datetime_range_timezone_hide_timezone
  version: '1.0'
  applicable_bundles:
  - datetime_range_timezone
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
