metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: date_ap_style
  version: 3.0.x
  note: AP Style Date Formats provides two field formatters (timestamp_ap_style for datetime/timestamp/created/changed/published_at;
    daterange_ap_style for daterange/smartdate), the date_ap_style.formatter service (ApStyleDateFormatter::formatTimestamp/formatRange),
    and an ap_style Twig filter. Global defaults live in the date_ap_style.settings config (admin at /admin/config/regional/date-ap-style,
    permission 'administer ap style settings'); keys include always_display_year, use_today, cap_today,
    display_day, display_time, hide_date, time_before_date, display_noon_and_midnight, capitalize_noon_and_midnight,
    use_all_day, month_only, separator (to|endash|hyphen), timezone. Shipped defaults are all-false with
    separator=to and timezone=''. Medium cases write a distinctive value into date_ap_style.settings and
    read it back; hard cases build real state (enable always_display_year globally; assign the timestamp_ap_style
    formatter to a datetime field's view display) verified against live config. reset/cleanup restore
    the shipped defaults explicitly.
questions:
- id: date_ap_style-formatter-id
  input: In the date_ap_style Drupal module, what is the machine id of the field formatter that displays
    a datetime/timestamp field in AP style, and which field types can it be used on?
  criteria: The formatter id is timestamp_ap_style (label 'AP Style'); it applies to datetime, timestamp,
    created, changed and published_at fields. (Date ranges use daterange_ap_style for daterange/smartdate.)
  bundle: date_ap_style
  rubric_ref: rubric/date_ap_style_date_ap_style_formatter_id@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: date_ap_style-twig-filter
  input: Does date_ap_style offer a way to format a timestamp as AP style directly inside a Twig template?
    If so, what is it called and how is it used?
  criteria: 'Yes — a Twig filter named ap_style: {{ timestamp|ap_style }} (with an optional options array,
    e.g. {{ timestamp|ap_style({display_time: true}) }}). It wraps ApStyleDateFormatter::formatTimestamp().'
  bundle: date_ap_style
  rubric_ref: rubric/date_ap_style_date_ap_style_twig_filter@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: date_ap_style-global-settings
  input: Where are the site-wide default AP style date options stored in date_ap_style, at what admin
    path, and which permission controls that form?
  criteria: Global defaults live in the date_ap_style.settings config object, edited at /admin/config/regional/date-ap-style
    (route date_ap_style.settings), gated by the 'administer ap style settings' permission. Formatter
    instances inherit these defaults and can override them per view display.
  bundle: date_ap_style
  rubric_ref: rubric/date_ap_style_date_ap_style_global_settings@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: date_ap_style-read-separator
  input: On this Drupal site, inspect the global AP style date settings and state which date-range separator
    is currently configured.
  criteria: date_ap_style.settings separator is 'endash' (the en dash). Read via `drush cget date_ap_style.settings
    separator`.
  bundle: date_ap_style
  rubric_ref: rubric/date_ap_style_date_ap_style_read_separator@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/date_ap_style-separator-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/date_ap_style-separator-cleanup.sh
- id: date_ap_style-read-timezone
  input: On this Drupal site, inspect the global AP style date settings and state the timezone override
    that is currently configured.
  criteria: date_ap_style.settings timezone is 'America/Chicago'. Read via `drush cget date_ap_style.settings
    timezone`.
  bundle: date_ap_style
  rubric_ref: rubric/date_ap_style_date_ap_style_read_timezone@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/date_ap_style-timezone-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/date_ap_style-timezone-cleanup.sh
- id: date_ap_style-enable-always-year
  input: On this Drupal site, change the global AP Style date settings so that the year is always displayed,
    even for dates in the current year. Apply the change to the live site.
  criteria: 'Set date_ap_style.settings always_display_year to true, e.g. `drush cset date_ap_style.settings
    always_display_year 1 -y` or via the form at /admin/config/regional/date-ap-style. Verified: always_display_year
    === TRUE.'
  bundle: date_ap_style
  rubric_ref: rubric/date_ap_style_date_ap_style_enable_always_year@1.0
