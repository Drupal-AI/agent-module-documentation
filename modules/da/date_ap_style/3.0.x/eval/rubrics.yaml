rubrics:
- id: date_ap_style_date_ap_style_formatter_id
  version: '1.0'
  applicable_bundles:
  - date_ap_style
  checks:
  - kind: must_contain_any
    values:
    - timestamp_ap_style
  scoring:
    combine: all_pass
- id: date_ap_style_date_ap_style_twig_filter
  version: '1.0'
  applicable_bundles:
  - date_ap_style
  checks:
  - kind: must_contain_any
    values:
    - ap_style
    - '|ap_style'
  scoring:
    combine: all_pass
- id: date_ap_style_date_ap_style_global_settings
  version: '1.0'
  applicable_bundles:
  - date_ap_style
  checks:
  - kind: must_contain_any
    values:
    - date_ap_style.settings
    - /admin/config/regional/date-ap-style
    - administer ap style settings
  scoring:
    combine: all_pass
- id: date_ap_style_date_ap_style_read_separator
  version: '1.0'
  applicable_bundles:
  - date_ap_style
  checks:
  - kind: must_contain_any
    values:
    - endash
  scoring:
    combine: all_pass
- id: date_ap_style_date_ap_style_read_timezone
  version: '1.0'
  applicable_bundles:
  - date_ap_style
  checks:
  - kind: must_contain_any
    values:
    - America/Chicago
  scoring:
    combine: all_pass
- id: date_ap_style_date_ap_style_enable_always_year
  version: '1.0'
  applicable_bundles:
  - date_ap_style
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
- id: date_ap_style_date_ap_style_apply_formatter
  version: '1.0'
  applicable_bundles:
  - date_ap_style
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
