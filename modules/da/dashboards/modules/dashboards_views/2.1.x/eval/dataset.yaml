metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: dashboards_views
  version: 2.1.x
  note: 'Config-only submodule of Dashboards. It ships one View, dashboard_last_content (''Dashboard:
    Last content''), a node_field_data listing of recent content meant to be embedded on a dashboard via
    the base module''s Embed a view widget (dashboards_block:dashboard:view_embed with view=dashboard_last_content:<display>).
    No PHP plugins/config entity/permissions/Drush. Medium cases read the shipped view (label/description
    set by setup). Hard cases: embed the view into a dashboard (verify the dashboard''s view_embed component
    references dashboard_last_content); and re-enable the view after it is disabled (verify status). Verified
    by loading the View / dashboard config via drush.'
questions:
- id: dashboards_views-provides
  input: What does the dashboards_views submodule provide, and does it define any PHP plugins?
  criteria: 'It is config-only (no PHP plugins). It ships the View ''dashboard_last_content'' (''Dashboard:
    Last content''), a ready-made recent-content listing to embed on a dashboard.'
  bundle: dashboards_views
  rubric_ref: rubric/dashboards_views_dashboards_views_provides@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: dashboards_views-embed-how
  input: How do you show the dashboards_views 'last content' view on a dashboard? Which widget do you
    use?
  criteria: Use the base Dashboards 'Embed a view' widget (block dashboards_block:dashboard:view_embed)
    and point its 'view' setting at dashboard_last_content:<display>.
  bundle: dashboards_views
  rubric_ref: rubric/dashboards_views_dashboards_views_embed_how@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: dashboards_views-base-table
  input: What is the dashboard_last_content view (shipped by dashboards_views) based on, i.e. what kind
    of content does it list?
  criteria: It is a node_field_data-based view listing recent content (nodes); its default display is
    restricted to the 'administer nodes' permission.
  bundle: dashboards_views
  rubric_ref: rubric/dashboards_views_dashboards_views_base_table@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: dashboards_views-label
  input: On this Drupal site, the view shipped by dashboards_views has been given a custom label. Inspect
    the live view configuration and report the current label (human-readable name) of the dashboard_last_content
    view.
  criteria: The dashboard_last_content view's label is 'DV Probe Content List'. Read with `drush cget
    views.view.dashboard_last_content label`.
  bundle: dashboards_views
  rubric_ref: rubric/dashboards_views_dashboards_views_label@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/dashboards_views-label-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/dashboards_views-label-cleanup.sh
- id: dashboards_views-description
  input: Inspect the dashboard_last_content view (from dashboards_views) on this site and report the description
    that has been set on it.
  criteria: The dashboard_last_content view's description is 'DV probe recent-nodes feed'. Discoverable
    via `drush cget views.view.dashboard_last_content description`.
  bundle: dashboards_views
  rubric_ref: rubric/dashboards_views_dashboards_views_description@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/dashboards_views-desc-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/dashboards_views-desc-cleanup.sh
- id: dashboards_views-embed
  input: On this Drupal site, create a dashboard with machine id 'dv_task' that embeds the dashboards_views
    recent-content view (dashboard_last_content) using the base Dashboards 'Embed a view' widget (block
    dashboards_block:dashboard:view_embed with its 'view' setting referencing dashboard_last_content).
    Apply it to the live site.
  criteria: Dashboard dv_task has a Layout Builder section component with id 'dashboards_block:dashboard:view_embed'
    whose configuration.view starts with 'dashboard_last_content'.
  bundle: dashboards_views
  rubric_ref: rubric/dashboards_views_dashboards_views_embed@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/dashboards_views-embed-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/dashboards_views-embed-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/dashboards_views-embed-verify.sh
    unused_text_checks:
      must_not_contain: []
- id: dashboards_views-enable
  input: The recent-content view that the dashboards_views module provides (dashboard_last_content) has
    been disabled, so its dashboard panel is empty. Re-enable that view and apply the change to the live
    site.
  criteria: The dashboard_last_content View is enabled (status TRUE), e.g. `drush php:eval 'Drupal\views\Entity\View::load("dashboard_last_content")->setStatus(TRUE)->save();'`
    or `drush cset views.view.dashboard_last_content status true`.
  bundle: dashboards_views
  rubric_ref: rubric/dashboards_views_dashboards_views_enable@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: site-owner
    reset: agent-module-documentation/evaluation/verify/dashboards_views-enable-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/dashboards_views-enable-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/dashboards_views-enable-verify.sh
    unused_text_checks:
      must_not_contain: []
