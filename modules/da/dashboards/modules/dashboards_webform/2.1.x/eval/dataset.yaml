metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: dashboards_webform
  version: 2.1.x
  note: 'Submodule of Dashboards. Provides one Dashboard plugin, webform_submissions (''Submission statistic.'',
    category Webform), a time-series chart of webform submission counts from the webform_submission table.
    Settings: webform (optional filter), period (hour|day|week|month), date (range), chart_type. Exposed
    as block dashboards_block:dashboard:webform_submissions, placed in a dashboard''s Layout Builder.
    Medium/hard cases build/read a dashboard whose section contains that widget block (and its period
    setting), verified by loading the dashboard storage and scanning section component configuration via
    drush.'
questions:
- id: dashboards_webform-widget
  input: What dashboard widget does the dashboards_webform submodule add, and what does it chart?
  criteria: 'The ''webform_submissions'' Dashboard plugin (''Submission statistic.'', category Webform):
    a time-series chart of webform submission counts (from the webform_submission table).'
  bundle: dashboards_webform
  rubric_ref: rubric/dashboards_webform_dashboards_webform_widget@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: dashboards_webform-block-id
  input: As which block plugin id is the dashboards_webform submissions widget placed onto a dashboard?
  criteria: It is placed as block dashboards_block:dashboard:webform_submissions in the dashboard's Layout
    Builder.
  bundle: dashboards_webform
  rubric_ref: rubric/dashboards_webform_dashboards_webform_block_id@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: dashboards_webform-settings
  input: Which settings does the dashboards_webform submissions widget expose to control what it charts?
  criteria: webform (optional single-webform filter), period (hour|day|week|month buckets), date (today,
    yesterday, this_week, this_month, last_three_months, last_six_months, year), and chart_type (bar/line/…).
  bundle: dashboards_webform
  rubric_ref: rubric/dashboards_webform_dashboards_webform_settings@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: dashboards_webform-which-widget
  input: On this site a dashboard (id dw_probe) has been built with a dashboards_webform widget. Inspect
    the dashboard configuration and give the block plugin id of the webform widget it contains.
  criteria: dw_probe contains block dashboards_block:dashboard:webform_submissions. Read via `drush cget
    dashboards.dashboard.dw_probe` or by scanning the dashboard's sections.
  bundle: dashboards_webform
  rubric_ref: rubric/dashboards_webform_dashboards_webform_which_widget@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/dashboards_webform-widget-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/dashboards_webform-widget-cleanup.sh
- id: dashboards_webform-widget-setting
  input: Inspect the dw_probe dashboard and report the 'period' setting configured on its dashboards_webform
    submissions widget.
  criteria: The webform_submissions component on dw_probe has period = week.
  bundle: dashboards_webform
  rubric_ref: rubric/dashboards_webform_dashboards_webform_widget_setting@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/dashboards_webform-widget-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/dashboards_webform-widget-cleanup.sh
- id: dashboards_webform-place-widget
  input: On this Drupal site, create a dashboard with machine id 'dw_task_a' and add the dashboards_webform
    submissions widget (block dashboards_block:dashboard:webform_submissions) to it in a Layout Builder
    section. Apply it to the live site.
  criteria: Dashboard dw_task_a exists with a Layout Builder section component whose configuration id
    is 'dashboards_block:dashboard:webform_submissions'.
  bundle: dashboards_webform
  rubric_ref: rubric/dashboards_webform_dashboards_webform_place_widget@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/dashboards_webform-hard-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/dashboards_webform-hard-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/dashboards_webform-place-verify.sh
    unused_text_checks:
      must_not_contain: []
- id: dashboards_webform-configure-widget
  input: On this Drupal site, create a dashboard with machine id 'dw_task_b' containing the dashboards_webform
    submissions widget (dashboards_block:dashboard:webform_submissions) configured to bucket submissions
    by WEEK (its period setting set to 'week'). Apply it live.
  criteria: Dashboard dw_task_b has a dashboards_block:dashboard:webform_submissions component whose configuration.period
    === 'week'.
  bundle: dashboards_webform
  rubric_ref: rubric/dashboards_webform_dashboards_webform_configure_widget@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/dashboards_webform-hard-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/dashboards_webform-hard-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/dashboards_webform-configure-verify.sh
    unused_text_checks:
      must_not_contain: []
