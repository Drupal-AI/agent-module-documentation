  module: dashboards_comments
  version: 2.1.x
  note: Submodule of Dashboards. Provides one Dashboard plugin, comments_statistic ('Comment per node
    type.', category Statistics), a chart of comment count per content type (settings key 'count' = totalcount|daycount)
