rubrics:
- id: dashboards_dashboards_plugin_type
  version: '1.0'
  applicable_bundles:
  - dashboards
  checks:
  - kind: must_contain_any
    values:
    - Dashboard plugin
    - plugin.manager.dashboard
    - DashboardBase
    - dashboards_block
    - buildRenderArray
  scoring:
    combine: all_pass
- id: dashboards_dashboards_entity_and_route
  version: '1.0'
  applicable_bundles:
  - dashboards
  checks:
  - kind: must_contain_any
    values:
    - dashboard
    - /admin/structure/dashboards
    - entity.dashboard.collection
  scoring:
    combine: all_pass
- id: dashboards_dashboards_permissions
  version: '1.0'
  applicable_bundles:
  - dashboards
  checks:
  - kind: must_contain_any
    values:
    - administer dashboards
    - can view
    - can override
  scoring:
    combine: all_pass
- id: dashboards_dashboards_known_dashboard
  version: '1.0'
  applicable_bundles:
  - dashboards
  checks:
  - kind: must_contain_any
    values:
    - Ops Reporting
  scoring:
    combine: all_pass
- id: dashboards_dashboards_colormap
  version: '1.0'
  applicable_bundles:
  - dashboards
  checks:
  - kind: must_contain_any
    values:
    - viridis
  scoring:
    combine: all_pass
- id: dashboards_dashboards_create_dashboard
  version: '1.0'
  applicable_bundles:
  - dashboards
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
- id: dashboards_dashboards_frontend_dashboard
  version: '1.0'
  applicable_bundles:
  - dashboards
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
