metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: dashboards
  version: 2.1.x
  note: 'Dashboards builds Layout Builder-based dashboard pages populated with pluggable Dashboard widgets
    that are also exposed as blocks. It defines: the ''dashboard'' config entity (config names dashboards.dashboard.<id>;
    fields admin_label, category, sections, frontend, weight; collection /admin/structure/dashboards;
    canonical /dashboard/{dashboard}); the Dashboard plugin type (manager plugin.manager.dashboard, base
    DashboardBase, each plugin exposed as block dashboards_block:dashboard:<plugin_id>); the dashboards.settings
    config (colormap/alpha/shades for chart colors); and permissions ''administer dashboards'' plus dynamic
    per-dashboard ''can view <id> dashboard'' / ''can override <id> dashboard''. Medium/hard cases read/create
    dashboard entities and read the colormap setting, verified by loading the dashboard storage / config
    via drush.'
questions:
- id: dashboards-plugin-type
  input: In the dashboards module, what plugin type do you implement to add a dashboard widget, and how
    does that widget become placeable in a dashboard's Layout Builder?
  criteria: You implement a Dashboard plugin (@Dashboard annotation, extend DashboardBase, implement buildRenderArray());
    the manager is plugin.manager.dashboard. Each Dashboard plugin is exposed as a block via a deriver,
    so in Layout Builder you place block dashboards_block:dashboard:<plugin_id>.
  bundle: dashboards
  rubric_ref: rubric/dashboards_dashboards_plugin_type@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: dashboards-entity-and-route
  input: What entity type does the dashboards module use for a dashboard, and where do you manage dashboards
    in the admin UI?
  criteria: A 'dashboard' config entity (config names dashboards.dashboard.<id>) with Layout Builder sections.
    Manage them at /admin/structure/dashboards (route entity.dashboard.collection, the module's configure
    route); a dashboard renders at /dashboard/{dashboard}.
  bundle: dashboards
  rubric_ref: rubric/dashboards_dashboards_entity_and_route@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: dashboards-permissions
  input: How does the dashboards module control access — what is the global admin permission and what
    per-dashboard permissions are generated?
  criteria: 'The global ''administer dashboards'' permission governs the admin UI/forms/settings. DashboardsPermissions
    generates two permissions per dashboard: ''can view <id> dashboard'' and ''can override <id> dashboard''
    (the latter enables the personal ''Personalize'' override).'
  bundle: dashboards
  rubric_ref: rubric/dashboards_dashboards_permissions@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: dashboards-known-dashboard
  input: This Drupal site has a dashboard (entity id dashboards_probe) created with the dashboards module.
    Inspect the live configuration and state the category it is assigned to.
  criteria: dashboards_probe has admin_label 'KPI Probe' and category 'Ops Reporting'. Read with `drush
    cget dashboards.dashboard.dashboards_probe` or by loading the dashboard entity.
  bundle: dashboards
  rubric_ref: rubric/dashboards_dashboards_known_dashboard@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/dashboards-known-dashboard-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/dashboards-known-dashboard-cleanup.sh
- id: dashboards-colormap
  input: On this site the dashboards module's chart color settings have been changed from the default.
    Inspect the live dashboards configuration and report which colormap is currently selected for dashboard
    charts.
  criteria: colormap is 'viridis' in dashboards.settings (default is 'summer'). Discoverable via `drush
    cget dashboards.settings colormap`.
  bundle: dashboards
  rubric_ref: rubric/dashboards_dashboards_colormap@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/dashboards-colormap-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/dashboards-colormap-cleanup.sh
