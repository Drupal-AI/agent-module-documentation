rubrics:
- id: date_augmenter_date_augmenter_plugin_type
  version: '1.0'
  applicable_bundles:
  - date_augmenter
  checks:
  - kind: must_contain_any
    values:
    - plugin.manager.dateaugmenter
    - Plugin/DateAugmenter
    - DateAugmenterInterface
    - augmentOutput
  scoring:
    combine: all_pass
- id: date_augmenter_date_augmenter_register_plugin
  version: '1.0'
  applicable_bundles:
  - date_augmenter
  checks:
  - kind: must_contain_any
    values:
    - '#[DateAugmenter'
    - Attribute\DateAugmenter
    - DateAugmenterBase
    - attribute
  scoring:
    combine: all_pass
- id: date_augmenter_date_augmenter_formatter_optin
  version: '1.0'
  applicable_bundles:
  - date_augmenter
  checks:
  - kind: must_contain_any
    values:
    - supportsDateAugmenter
    - third_party_settings
    - third-party setting
    - third party setting
  scoring:
    combine: all_pass
- id: date_augmenter_date_augmenter_known_field
  version: '1.0'
  applicable_bundles:
  - date_augmenter
  checks:
  - kind: must_contain_any
    values:
    - field_da_known
  scoring:
    combine: all_pass
- id: date_augmenter_date_augmenter_enabled_vs_not
  version: '1.0'
  applicable_bundles:
  - date_augmenter
  checks:
  - kind: must_contain_any
    values:
    - field_da_on
  scoring:
    combine: all_pass
- id: date_augmenter_date_augmenter_enable_on_field
  version: '1.0'
  applicable_bundles:
  - date_augmenter
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
- id: date_augmenter_date_augmenter_enable_on_rule_set
  version: '1.0'
  applicable_bundles:
  - date_augmenter
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
