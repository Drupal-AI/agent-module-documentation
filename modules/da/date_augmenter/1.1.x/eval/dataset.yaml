metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: date_augmenter
  version: 1.1.x
  note: 'Date Augmenter API is a plugin API (no settings form, no configure route, no permissions, no
    Drush). Plugin type: manager plugin.manager.dateaugmenter, discovery dir Plugin/DateAugmenter, attribute
    Drupal\date_augmenter\Attribute\DateAugmenter, interface DateAugmenterInterface::augmentOutput().
    A formatter opts in via a supportsDateAugmenter() method; the chosen config is stored as third_party_settings.date_augmenter
    on the entity view display formatter component (schema field.formatter.third_party.date_augmenter,
    with instances/rule sets; each set has status/weights/settings). The actual augmenter plugins ship
    in separate contrib modules, so getDefinitions() is empty here; medium/hard cases therefore ground
    in the module''s real third-party-settings config surface, seeded/verified directly on node.article.default
    view display. Fields are namespaced field_da_* and removed by name in cleanup (no field_purge_batch).'
questions:
- id: date_augmenter-plugin-type
  input: In the Drupal date_augmenter module, what plugin type does it define — name the manager service,
    the plugin directory, and the interface method a plugin must implement.
  criteria: 'It defines the DateAugmenter plugin type: manager service plugin.manager.dateaugmenter, plugins
    live in src/Plugin/DateAugmenter/, and each implements DateAugmenterInterface::augmentOutput(array
    &$output, DrupalDateTime $start, ?DrupalDateTime $end, array $options).'
  bundle: date_augmenter
  rubric_ref: rubric/date_augmenter_date_augmenter_plugin_type@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: date_augmenter-register-plugin
  input: How do I register a new date augmenter plugin on Drupal 11 with date_augmenter? Show the PHP
    attribute and the base class to extend.
  criteria: 'Add a class in src/Plugin/DateAugmenter/ extending DateAugmenterBase and annotate it with
    the #[DateAugmenter(id: ..., label: ..., description: ..., weight: ...)] attribute (Drupal\date_augmenter\Attribute\DateAugmenter);
    a legacy @DateAugmenter annotation also works.'
  bundle: date_augmenter
  rubric_ref: rubric/date_augmenter_date_augmenter_register_plugin@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: date_augmenter-formatter-optin
  input: With date_augmenter, how does a date field formatter opt in to showing the augmenter configuration
    UI, and where are the chosen augmenter settings stored?
  criteria: The formatter plugin must implement a supportsDateAugmenter() method returning a truthy value
    (or an array of set names). The module then injects the augmenter UI and stores the selection as third_party_settings
    under the 'date_augmenter' namespace on the formatter component (schema field.formatter.third_party.date_augmenter).
  bundle: date_augmenter
  rubric_ref: rubric/date_augmenter_date_augmenter_formatter_optin@1.0
  tags:
  - mode:recipe
  - difficulty:easy
