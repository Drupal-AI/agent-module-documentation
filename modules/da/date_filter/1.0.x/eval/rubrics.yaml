rubrics:
- id: date_filter_date_filter_alter_hook
  version: '1.0'
  applicable_bundles:
  - date_filter
  checks:
  - kind: must_contain_any
    values:
    - hook_views_plugins_filter_alter
    - views_plugins_filter_alter
  scoring:
    combine: all_pass
- id: date_filter_date_filter_filter_type_option
  version: '1.0'
  applicable_bundles:
  - date_filter
  checks:
  - kind: must_contain_any
    values:
    - Date and time
    - datetime
  scoring:
    combine: all_pass
- id: date_filter_date_filter_whole_day_semantics
  version: '1.0'
  applicable_bundles:
  - date_filter
  checks:
  - kind: must_contain_any
    values:
    - '23:59:59'
    - 00:00:00
  scoring:
    combine: all_pass
