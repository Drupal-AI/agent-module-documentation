metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: bibcite
  version: 3.1.x
  note: 'Bibcite core renders CSL bibliographic data to citations and defines two plugin types (bibcite_processor
    - citation renderers, shipped ''citeproc-php''; bibcite_format - YAML import/export formats). Its
    writable state is the config object bibcite.settings (processor, default_style, convert_urls) and
    bibcite_csl_style config entities (the CSL styles). Medium/hard cases are grounded in those: setting/reading
    bibcite.settings and creating/reading a bibcite_csl_style config entity (both router-safe on this
    site). NOTE: on this shared site the module''s shipped default config did not install (bibcite.settings
    was null, no CSL styles present) and serialization/route-rebuilds fatal, so cases assert on the config
    object value / config entity presence rather than on rendered citations; cleanup restores the intended
    shipped defaults (processor=citeproc-php, default_style=apa).'
questions:
- id: bibcite-default-style-howto
  input: On a Drupal site using the bibcite (Bibliography & Citation) module, how do I change the default
    citation style used to render references, and which config object/keys control the citation processor
    and default style?
  criteria: 'Edit the config object bibcite.settings: default_style is the id of the default bibcite_csl_style
    (e.g. apa, chicago_author_date) and processor is the bibcite_processor plugin id (default citeproc-php).
    Set at /admin/config/bibcite or via drush cset bibcite.settings default_style <id>.'
  bundle: bibcite
  rubric_ref: rubric/bibcite_bibcite_default_style_howto@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: bibcite-plugin-types
  input: Which plugin types does the bibcite core module define, and what is each used for?
  criteria: 'Two: bibcite_processor (attribute/annotation plugins that render CSL data into a citation
    string - the shipped one is citeproc-php) and bibcite_format (YAML-declared import/export formats
    whose encoder class implements Symfony Encoder/Decoder - provided by the bibtex/endnote/marc/ris submodules).'
  bundle: bibcite
  rubric_ref: rubric/bibcite_bibcite_plugin_types@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: bibcite-default-style-introspect
  input: On this Drupal site, which citation style is configured as the site-wide default in the bibcite
    settings? Inspect the live configuration to answer.
  criteria: 'The default style is Chicago author-date: bibcite.settings:default_style is ''chicago_author_date''.'
  bundle: bibcite
  rubric_ref: rubric/bibcite_bibcite_default_style_introspect@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/bibcite-default-style-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/bibcite-default-style-cleanup.sh
- id: bibcite-known-style-introspect
  input: This site has a custom CSL citation style installed via bibcite. Inspect the bibcite_csl_style
    configuration entities and give the machine id of the custom style.
  criteria: The custom style is bibcite_known_style (label 'Bibcite Known Style'), a bibcite_csl_style
    config entity with custom = true.
  bundle: bibcite
  rubric_ref: rubric/bibcite_bibcite_known_style_introspect@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/bibcite-known-style-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/bibcite-known-style-cleanup.sh
- id: bibcite-set-default
  input: On this Drupal site, configure bibcite so that the default citation style is APA and citations
    linkify URLs (convert URLs on). Apply the change to the live site.
  criteria: Set bibcite.settings:default_style to 'apa' and bibcite.settings:convert_urls to true (e.g.
    drush cset bibcite.settings default_style apa; drush cset bibcite.settings convert_urls 1, or via
    configFactory).
  bundle: bibcite
  rubric_ref: rubric/bibcite_bibcite_set_default@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/bibcite-set-default-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/bibcite-default-style-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/bibcite-set-default-verify.sh
- id: bibcite-create-style
  input: On this Drupal site, register a new CSL citation style in bibcite with machine id 'bibcite_harvard'
    and label 'Harvard'. Apply it to the live site.
  criteria: 'Create a bibcite_csl_style config entity: Drupal\bibcite\Entity\CslStyle::create([''id''
    => ''bibcite_harvard'', ''label'' => ''Harvard'', ''csl'' => ''<CSL XML>'', ''custom'' => TRUE])->save();
    (or add it via the CSL styles collection UI at /admin/config/bibcite/settings/csl_style).'
  bundle: bibcite
  rubric_ref: rubric/bibcite_bibcite_create_style@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/bibcite-create-style-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/bibcite-create-style-reset.sh
    verify: agent-module-documentation/evaluation/verify/bibcite-create-style-verify.sh
