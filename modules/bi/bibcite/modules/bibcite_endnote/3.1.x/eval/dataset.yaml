metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: bibcite_endnote
  version: 3.1.x
  note: 'bibcite_endnote is a trivial ''format handler'' submodule of Bibcite. It declares bibcite_format
    plugin(s) (endnote7, endnote8, tagged) in bibcite_endnote.bibcite_format.yml backed by the EndnoteEncoder
    encoder (Encoder+Decoder, so import and export), and ships a bibcite_entity.mapping.endnote7 config
    mapping EndNote record types/fields to bibcite reference types / bibcite_* fields. No config UI, permissions,
    routes, Drush or plugin types of its own. The single writable/verifiable state grounded to this submodule
    is the bibcite_entity.mapping.endnote7 config object, so the medium and hard cases read/write it (router-safe).
    NOTE: actual EndNote encode/decode uses the Symfony serializer which fatals on this broken shared
    site, so cases assert on the mapping config and the registered format plugin, not on serialized output.'
questions:
- id: bibcite_endnote-format-basics
  input: What import/export format does the bibcite_endnote module add to Bibcite, what is the bibcite_format
    plugin id and file extension, and which encoder class backs it?
  criteria: 'It adds the EndNote format: bibcite_format plugin id(s) endnote7, endnote8, tagged (declared
    in bibcite_endnote.bibcite_format.yml), file extension xml, backed by the \Drupal\bibcite_endnote\Encoder\EndnoteEncoder
    encoder.'
  bundle: bibcite_endnote
  rubric_ref: rubric/bibcite_endnote_bibcite_endnote_format_basics@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: bibcite_endnote-import-export
  input: Can the bibcite_endnote format be used for both importing and exporting bibcite references, and
    why?
  criteria: Both. The EndnoteEncoder class implements Symfony's EncoderInterface and DecoderInterface,
    so the format appears in the format manager's getExportDefinitions() (export) and getImportDefinitions()
    (import).
  bundle: bibcite_endnote
  rubric_ref: rubric/bibcite_endnote_bibcite_endnote_import_export@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: bibcite_endnote-mapping-purpose
  input: Where does bibcite_endnote define how EndNote record types and fields correspond to Bibcite reference
    types and fields?
  criteria: 'In the config object bibcite_entity.mapping.endnote7: a ''format'' key plus ''types'' (mapping
    EndNote record types to bibcite_reference_type ids) and ''fields'' (mapping EndNote fields to bibcite_*
    fields).'
  bundle: bibcite_endnote
  rubric_ref: rubric/bibcite_endnote_bibcite_endnote_mapping_purpose@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: bibcite_endnote-mapping-introspect
  input: On this Drupal site, inspect the bibcite_endnote format mapping and state which Bibcite reference
    type the EndNote 'Book' record type is mapped to.
  criteria: 'The EndNote ''Book'' type maps to the ''book'' bibcite reference type (bibcite_entity.mapping.endnote7:
    types.Book = book).'
  bundle: bibcite_endnote
  rubric_ref: rubric/bibcite_endnote_bibcite_endnote_mapping_introspect@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/bibcite_endnote-mapping-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/bibcite_endnote-mapping-cleanup.sh
- id: bibcite_endnote-create-mapping
  input: On this Drupal site, configure the bibcite_endnote (EndNote) format mapping so that the EndNote
    'Book' record type imports as the 'book' Bibcite reference type. Apply the change to the live site.
  criteria: Set the bibcite_entity.mapping.endnote7 config object with format 'endnote7' and a types entry
    mapping 'Book' to 'book' (e.g. configFactory getEditable('bibcite_entity.mapping.endnote7') set('format','endnote7')
    set('types', ['Book' => 'book']) save()).
  bundle: bibcite_endnote
  rubric_ref: rubric/bibcite_endnote_bibcite_endnote_create_mapping@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/bibcite_endnote-create-mapping-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/bibcite_endnote-create-mapping-reset.sh
    verify: agent-module-documentation/evaluation/verify/bibcite_endnote-create-mapping-verify.sh
