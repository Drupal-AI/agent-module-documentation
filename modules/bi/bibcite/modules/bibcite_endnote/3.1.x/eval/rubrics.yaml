rubrics:
- id: bibcite_endnote_bibcite_endnote_format_basics
  version: '1.0'
  applicable_bundles:
  - bibcite_endnote
  checks:
  - kind: must_contain_any
    values:
    - endnote7
    - xml
    - EndnoteEncoder
  scoring:
    combine: all_pass
- id: bibcite_endnote_bibcite_endnote_import_export
  version: '1.0'
  applicable_bundles:
  - bibcite_endnote
  checks:
  - kind: must_contain_any
    values:
    - import
    - export
    - Encoder
    - Decoder
  scoring:
    combine: all_pass
- id: bibcite_endnote_bibcite_endnote_mapping_purpose
  version: '1.0'
  applicable_bundles:
  - bibcite_endnote
  checks:
  - kind: must_contain_any
    values:
    - bibcite_entity.mapping.endnote7
    - mapping
    - types
    - fields
  scoring:
    combine: all_pass
- id: bibcite_endnote_bibcite_endnote_mapping_introspect
  version: '1.0'
  applicable_bundles:
  - bibcite_endnote
  checks:
  - kind: must_contain_any
    values:
    - book
  scoring:
    combine: all_pass
- id: bibcite_endnote_bibcite_endnote_create_mapping
  version: '1.0'
  applicable_bundles:
  - bibcite_endnote
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
