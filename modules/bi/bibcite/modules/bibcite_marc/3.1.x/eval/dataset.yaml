metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: bibcite_marc
  version: 3.1.x
  note: 'bibcite_marc is a trivial ''format handler'' submodule of Bibcite. It declares bibcite_format
    plugin(s) (marc) in bibcite_marc.bibcite_format.yml backed by the MarcEncoder encoder (Encoder+Decoder,
    so import and export), and ships a bibcite_entity.mapping.marc config mapping Marc record types/fields
    to bibcite reference types / bibcite_* fields. No config UI, permissions, routes, Drush or plugin
    types of its own. The single writable/verifiable state grounded to this submodule is the bibcite_entity.mapping.marc
    config object, so the medium and hard cases read/write it (router-safe). NOTE: actual Marc encode/decode
    uses the Symfony serializer which fatals on this broken shared site, so cases assert on the mapping
    config and the registered format plugin, not on serialized output.'
questions:
- id: bibcite_marc-format-basics
  input: What import/export format does the bibcite_marc module add to Bibcite, what is the bibcite_format
    plugin id and file extension, and which encoder class backs it?
  criteria: 'It adds the Marc format: bibcite_format plugin id(s) marc (declared in bibcite_marc.bibcite_format.yml),
    file extension mrc, backed by the \Drupal\bibcite_marc\Encoder\MarcEncoder encoder.'
  bundle: bibcite_marc
  rubric_ref: rubric/bibcite_marc_bibcite_marc_format_basics@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: bibcite_marc-import-export
  input: Can the bibcite_marc format be used for both importing and exporting bibcite references, and
    why?
  criteria: Both. The MarcEncoder class implements Symfony's EncoderInterface and DecoderInterface, so
    the format appears in the format manager's getExportDefinitions() (export) and getImportDefinitions()
    (import).
  bundle: bibcite_marc
  rubric_ref: rubric/bibcite_marc_bibcite_marc_import_export@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: bibcite_marc-mapping-purpose
  input: Where does bibcite_marc define how Marc record types and fields correspond to Bibcite reference
    types and fields?
  criteria: 'In the config object bibcite_entity.mapping.marc: a ''format'' key plus ''types'' (mapping
    Marc record types to bibcite_reference_type ids) and ''fields'' (mapping Marc fields to bibcite_*
    fields).'
  bundle: bibcite_marc
  rubric_ref: rubric/bibcite_marc_bibcite_marc_mapping_purpose@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: bibcite_marc-mapping-introspect
  input: On this Drupal site, inspect the bibcite_marc format mapping and state which Bibcite reference
    type the Marc 'book' record type is mapped to.
  criteria: 'The Marc ''book'' type maps to the ''book'' bibcite reference type (bibcite_entity.mapping.marc:
    types.book = book).'
  bundle: bibcite_marc
  rubric_ref: rubric/bibcite_marc_bibcite_marc_mapping_introspect@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/bibcite_marc-mapping-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/bibcite_marc-mapping-cleanup.sh
- id: bibcite_marc-create-mapping
  input: On this Drupal site, configure the bibcite_marc (Marc) format mapping so that the Marc 'book'
    record type imports as the 'book' Bibcite reference type. Apply the change to the live site.
  criteria: Set the bibcite_entity.mapping.marc config object with format 'marc' and a types entry mapping
    'book' to 'book' (e.g. configFactory getEditable('bibcite_entity.mapping.marc') set('format','marc')
    set('types', ['book' => 'book']) save()).
  bundle: bibcite_marc
  rubric_ref: rubric/bibcite_marc_bibcite_marc_create_mapping@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/bibcite_marc-create-mapping-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/bibcite_marc-create-mapping-reset.sh
    verify: agent-module-documentation/evaluation/verify/bibcite_marc-create-mapping-verify.sh
