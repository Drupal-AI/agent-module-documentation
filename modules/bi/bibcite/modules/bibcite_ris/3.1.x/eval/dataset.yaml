metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: bibcite_ris
  version: 3.1.x
  note: 'bibcite_ris is a trivial ''format handler'' submodule of Bibcite. It declares bibcite_format
    plugin(s) (ris) in bibcite_ris.bibcite_format.yml backed by the RISEncoder encoder (Encoder+Decoder,
    so import and export), and ships a bibcite_entity.mapping.ris config mapping RIS record types/fields
    to bibcite reference types / bibcite_* fields. No config UI, permissions, routes, Drush or plugin
    types of its own. The single writable/verifiable state grounded to this submodule is the bibcite_entity.mapping.ris
    config object, so the medium and hard cases read/write it (router-safe). NOTE: actual RIS encode/decode
    uses the Symfony serializer which fatals on this broken shared site, so cases assert on the mapping
    config and the registered format plugin, not on serialized output.'
questions:
- id: bibcite_ris-format-basics
  input: What import/export format does the bibcite_ris module add to Bibcite, what is the bibcite_format
    plugin id and file extension, and which encoder class backs it?
  criteria: 'It adds the RIS format: bibcite_format plugin id(s) ris (declared in bibcite_ris.bibcite_format.yml),
    file extension ris, backed by the \Drupal\bibcite_ris\Encoder\RISEncoder encoder.'
  bundle: bibcite_ris
  rubric_ref: rubric/bibcite_ris_bibcite_ris_format_basics@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: bibcite_ris-import-export
  input: Can the bibcite_ris format be used for both importing and exporting bibcite references, and why?
  criteria: Both. The RISEncoder class implements Symfony's EncoderInterface and DecoderInterface, so
    the format appears in the format manager's getExportDefinitions() (export) and getImportDefinitions()
    (import).
  bundle: bibcite_ris
  rubric_ref: rubric/bibcite_ris_bibcite_ris_import_export@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: bibcite_ris-mapping-purpose
  input: Where does bibcite_ris define how RIS record types and fields correspond to Bibcite reference
    types and fields?
  criteria: 'In the config object bibcite_entity.mapping.ris: a ''format'' key plus ''types'' (mapping
    RIS record types to bibcite_reference_type ids) and ''fields'' (mapping RIS fields to bibcite_* fields).'
  bundle: bibcite_ris
  rubric_ref: rubric/bibcite_ris_bibcite_ris_mapping_purpose@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: bibcite_ris-mapping-introspect
  input: On this Drupal site, inspect the bibcite_ris format mapping and state which Bibcite reference
    type the RIS 'BOOK' record type is mapped to.
  criteria: 'The RIS ''BOOK'' type maps to the ''book'' bibcite reference type (bibcite_entity.mapping.ris:
    types.BOOK = book).'
  bundle: bibcite_ris
  rubric_ref: rubric/bibcite_ris_bibcite_ris_mapping_introspect@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/bibcite_ris-mapping-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/bibcite_ris-mapping-cleanup.sh
- id: bibcite_ris-create-mapping
  input: On this Drupal site, configure the bibcite_ris (RIS) format mapping so that the RIS 'BOOK' record
    type imports as the 'book' Bibcite reference type. Apply the change to the live site.
  criteria: Set the bibcite_entity.mapping.ris config object with format 'ris' and a types entry mapping
    'BOOK' to 'book' (e.g. configFactory getEditable('bibcite_entity.mapping.ris') set('format','ris')
    set('types', ['BOOK' => 'book']) save()).
  bundle: bibcite_ris
  rubric_ref: rubric/bibcite_ris_bibcite_ris_create_mapping@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/bibcite_ris-create-mapping-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/bibcite_ris-create-mapping-reset.sh
    verify: agent-module-documentation/evaluation/verify/bibcite_ris-create-mapping-verify.sh
