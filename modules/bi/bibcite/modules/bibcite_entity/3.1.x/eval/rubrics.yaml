rubrics:
- id: bibcite_entity_bibent_entities
  version: '1.0'
  applicable_bundles:
  - bibcite_entity
  checks:
  - kind: must_contain_any
    values:
    - bibcite_reference
    - bibcite_contributor
    - bibcite_keyword
    - bibcite_reference_type
  scoring:
    combine: all_pass
- id: bibcite_entity_bibent_link_plugin
  version: '1.0'
  applicable_bundles:
  - bibcite_entity
  checks:
  - kind: must_contain_any
    values:
    - doi
    - pubmed
    - google_scholar
    - bibcite_link
  scoring:
    combine: all_pass
- id: bibcite_entity_bibent_known_type
  version: '1.0'
  applicable_bundles:
  - bibcite_entity
  checks:
  - kind: must_contain_any
    values:
    - bibcite_known_type
  scoring:
    combine: all_pass
- id: bibcite_entity_bibent_citekey_pattern
  version: '1.0'
  applicable_bundles:
  - bibcite_entity
  checks:
  - kind: must_contain_any
    values:
    - known_[bibcite_reference:id]
    - known_
  scoring:
    combine: all_pass
- id: bibcite_entity_bibent_create_type
  version: '1.0'
  applicable_bundles:
  - bibcite_entity
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
- id: bibcite_entity_bibent_create_role
  version: '1.0'
  applicable_bundles:
  - bibcite_entity
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
