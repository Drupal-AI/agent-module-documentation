metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: bibcite_entity
  version: 3.1.x
  note: 'bibcite_entity is the Bibcite data model: content entities bibcite_reference (bundled by bibcite_reference_type),
    bibcite_contributor, bibcite_keyword; config entities bibcite_reference_type, bibcite_contributor_role,
    bibcite_contributor_category; config objects bibcite_entity.reference.settings (citekey.pattern etc.)
    and bibcite_entity.contributor.settings; plugin type bibcite_link (doi/google_scholar/pubmed/pubmedcentral).
    Medium/hard cases are grounded in the config entities and config objects (creating/reading reference
    types, contributor roles, and the citekey pattern) - all router-safe on this site. NOTE: on this shared
    site bibcite_entity''s field-storage tables were not fully installed, so creating bibcite_reference
    CONTENT fails (missing tables); cases therefore use the config entities/settings, not content references.'
questions:
- id: bibent-entities
  input: Which content entity types does the bibcite_entity module provide for storing bibliographic data,
    and what config entity provides the reference 'bundles'?
  criteria: Content entities bibcite_reference (bibliographic records), bibcite_contributor (authors/editors)
    and bibcite_keyword (subject tags). Reference bundles are bibcite_reference_type config entities (book,
    journal_article, thesis, ...).
  bundle: bibcite_entity
  rubric_ref: rubric/bibcite_entity_bibent_entities@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: bibent-link-plugin
  input: What is the bibcite_link plugin type in bibcite_entity for, and which link plugins ship with
    it?
  criteria: 'bibcite_link plugins add external links to a rendered reference. Shipped plugins: doi, google_scholar,
    pubmed, pubmedcentral (manager plugin.manager.bibcite_link, discovery Plugin/bibcite/link).'
  bundle: bibcite_entity
  rubric_ref: rubric/bibcite_entity_bibent_link_plugin@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: bibent-known-type
  input: On this Drupal site, a custom bibliographic reference type has been added via bibcite. Inspect
    the bibcite_reference_type configuration entities and give the machine id of the custom reference
    type.
  criteria: The reference type is bibcite_known_type (label 'Bibcite Known Type'), a bibcite_reference_type
    config entity.
  bundle: bibcite_entity
  rubric_ref: rubric/bibcite_entity_bibent_known_type@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/bibcite_entity-known-type-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/bibcite_entity-known-type-cleanup.sh
- id: bibent-citekey-pattern
  input: What citation-key (citekey) pattern is currently configured for bibcite references on this site?
    Inspect the live bibcite reference settings to answer.
  criteria: The citekey pattern is known_[bibcite_reference:id] (bibcite_entity.reference.settings:citekey.pattern).
  bundle: bibcite_entity
  rubric_ref: rubric/bibcite_entity_bibent_citekey_pattern@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/bibcite_entity-citekey-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/bibcite_entity-citekey-cleanup.sh
- id: bibent-create-type
  input: On this Drupal site, add a new bibliographic reference type to bibcite with machine id 'bibcite_task_type'
    and label 'Working Paper'. Apply it to the live site.
  criteria: 'Create a bibcite_reference_type config entity: Drupal\bibcite_entity\Entity\ReferenceType::create([''id''
    => ''bibcite_task_type'', ''label'' => ''Working Paper''])->save(); (or via the reference types admin
    UI).'
  bundle: bibcite_entity
  rubric_ref: rubric/bibcite_entity_bibent_create_type@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/bibcite_entity-create-type-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/bibcite_entity-create-type-reset.sh
    verify: agent-module-documentation/evaluation/verify/bibcite_entity-create-type-verify.sh
- id: bibent-create-role
  input: On this Drupal site, add a new bibcite contributor role with machine id 'bibcite_reviewer' and
    label 'Reviewer'. Apply it to the live site.
  criteria: 'Create a bibcite_contributor_role config entity: Drupal\bibcite_entity\Entity\ContributorRole::create([''id''
    => ''bibcite_reviewer'', ''label'' => ''Reviewer'', ''weight'' => 0])->save();'
  bundle: bibcite_entity
  rubric_ref: rubric/bibcite_entity_bibent_create_role@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/bibcite_entity-create-role-reset.sh
