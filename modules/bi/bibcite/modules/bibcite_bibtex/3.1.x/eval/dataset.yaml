metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: bibcite_bibtex
  version: 3.1.x
  note: 'bibcite_bibtex is a trivial ''format handler'' submodule of Bibcite. It declares bibcite_format
    plugin(s) (bibtex) in bibcite_bibtex.bibcite_format.yml backed by the BibtexEncoder encoder (Encoder+Decoder,
    so import and export), and ships a bibcite_entity.mapping.bibtex config mapping BibTeX record types/fields
    to bibcite reference types / bibcite_* fields. No config UI, permissions, routes, Drush or plugin
    types of its own. The single writable/verifiable state grounded to this submodule is the bibcite_entity.mapping.bibtex
    config object, so the medium and hard cases read/write it (router-safe). NOTE: actual BibTeX encode/decode
    uses the Symfony serializer which fatals on this broken shared site, so cases assert on the mapping
    config and the registered format plugin, not on serialized output.'
questions:
- id: bibcite_bibtex-format-basics
  input: What import/export format does the bibcite_bibtex module add to Bibcite, what is the bibcite_format
    plugin id and file extension, and which encoder class backs it?
  criteria: 'It adds the BibTeX format: bibcite_format plugin id(s) bibtex (declared in bibcite_bibtex.bibcite_format.yml),
    file extension bib, backed by the \Drupal\bibcite_bibtex\Encoder\BibtexEncoder encoder.'
  bundle: bibcite_bibtex
  rubric_ref: rubric/bibcite_bibtex_bibcite_bibtex_format_basics@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: bibcite_bibtex-import-export
  input: Can the bibcite_bibtex format be used for both importing and exporting bibcite references, and
    why?
  criteria: Both. The BibtexEncoder class implements Symfony's EncoderInterface and DecoderInterface,
    so the format appears in the format manager's getExportDefinitions() (export) and getImportDefinitions()
    (import).
  bundle: bibcite_bibtex
  rubric_ref: rubric/bibcite_bibtex_bibcite_bibtex_import_export@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: bibcite_bibtex-mapping-purpose
  input: Where does bibcite_bibtex define how BibTeX record types and fields correspond to Bibcite reference
    types and fields?
  criteria: 'In the config object bibcite_entity.mapping.bibtex: a ''format'' key plus ''types'' (mapping
    BibTeX record types to bibcite_reference_type ids) and ''fields'' (mapping BibTeX fields to bibcite_*
    fields).'
  bundle: bibcite_bibtex
  rubric_ref: rubric/bibcite_bibtex_bibcite_bibtex_mapping_purpose@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: bibcite_bibtex-mapping-introspect
  input: On this Drupal site, inspect the bibcite_bibtex format mapping and state which Bibcite reference
    type the BibTeX 'article' record type is mapped to.
  criteria: 'The BibTeX ''article'' type maps to the ''journal_article'' bibcite reference type (bibcite_entity.mapping.bibtex:
    types.article = journal_article).'
  bundle: bibcite_bibtex
  rubric_ref: rubric/bibcite_bibtex_bibcite_bibtex_mapping_introspect@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/bibcite_bibtex-mapping-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/bibcite_bibtex-mapping-cleanup.sh
- id: bibcite_bibtex-create-mapping
  input: On this Drupal site, configure the bibcite_bibtex (BibTeX) format mapping so that the BibTeX
    'article' record type imports as the 'journal_article' Bibcite reference type. Apply the change to
    the live site.
  criteria: Set the bibcite_entity.mapping.bibtex config object with format 'bibtex' and a types entry
    mapping 'article' to 'journal_article' (e.g. configFactory getEditable('bibcite_entity.mapping.bibtex')
    set('format','bibtex') set('types', ['article' => 'journal_article']) save()).
  bundle: bibcite_bibtex
  rubric_ref: rubric/bibcite_bibtex_bibcite_bibtex_create_mapping@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/bibcite_bibtex-create-mapping-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/bibcite_bibtex-create-mapping-reset.sh
    verify: agent-module-documentation/evaluation/verify/bibcite_bibtex-create-mapping-verify.sh
