metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: bibcite_import
  version: 3.1.x
  note: 'bibcite_import imports bibcite_reference entities from uploaded files via bibcite_format decoders,
    as a batch. Its config object bibcite_import.settings has a nested settings mapping with two booleans:
    contributor_deduplication and keyword_deduplication (both default true). Import form /admin/content/bibcite/reference/import
    (permission bibcite import + administer bibcite); populate form /admin/content/bibcite/reference/populate
    (bibcite populate + administer bibcite); settings form route bibcite_import.settings. Medium/hard
    cases read/write bibcite_import.settings (router-safe config object). NOTE: actual file import is
    not exercised because the file decoders use the Symfony serializer, which fatals on this broken shared
    site; cases assert on the deduplication config values instead.'
questions:
- id: bibimp-dedup-settings
  input: In bibcite_import, which settings control whether imported authors and keywords are deduplicated
    against existing entities, and where are they stored?
  criteria: bibcite_import.settings has settings.contributor_deduplication and settings.keyword_deduplication
    (both default true). When on, imported authors/keywords are matched to existing bibcite_contributor
    / bibcite_keyword entities rather than duplicated. Edited at /admin/config/bibcite/settings/import.
  bundle: bibcite_import
  rubric_ref: rubric/bibcite_import_bibimp_dedup_settings@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: bibimp-routes
  input: How do you import a BibTeX or RIS file of references with bibcite_import, and what permission
    does the import form require?
  criteria: 'Use the import form at /admin/content/bibcite/reference/import (permission ''bibcite import''
    plus ''administer bibcite''): upload the file, choose its format, and it batch-creates reference entities.
    Import formats are bibcite_format plugins whose encoder is a DecoderInterface.'
  bundle: bibcite_import
  rubric_ref: rubric/bibcite_import_bibimp_routes@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: bibimp-contrib-dedup-state
  input: On this Drupal site, is bibcite_import currently configured to deduplicate contributors (authors)
    when importing references? Inspect the live import settings to answer.
  criteria: 'No - contributor deduplication is OFF: bibcite_import.settings:settings.contributor_deduplication
    is false (keyword deduplication remains true).'
  bundle: bibcite_import
  rubric_ref: rubric/bibcite_import_bibimp_contrib_dedup_state@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/bibcite_import-contributor-dedup-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/bibcite_import-contributor-dedup-cleanup.sh
- id: bibimp-keyword-dedup-state
  input: Does this site's bibcite_import configuration deduplicate keywords on import? Inspect the live
    import settings and answer.
  criteria: 'No - keyword deduplication is OFF: bibcite_import.settings:settings.keyword_deduplication
    is false.'
  bundle: bibcite_import
  rubric_ref: rubric/bibcite_import_bibimp_keyword_dedup_state@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/bibcite_import-keyword-dedup-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/bibcite_import-keyword-dedup-cleanup.sh
- id: bibimp-disable-dedup
  input: On this Drupal site, configure bibcite_import so that NEITHER contributors NOR keywords are deduplicated
    when importing references (both deduplication options off). Apply the change to the live site.
  criteria: Set bibcite_import.settings:settings.contributor_deduplication and settings.keyword_deduplication
    both to false (drush cset bibcite_import.settings settings.contributor_deduplication 0; ...keyword_deduplication
    0, or via configFactory / the import settings form).
  bundle: bibcite_import
  rubric_ref: rubric/bibcite_import_bibimp_disable_dedup@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/bibcite_import-disable-dedup-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/bibcite_import-contributor-dedup-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/bibcite_import-disable-dedup-verify.sh
- id: bibimp-contrib-only-dedup
  input: When importing references on this site, I want duplicate authors to be merged but duplicate keywords
    to be kept separate. Configure bibcite_import so contributor deduplication is on and keyword deduplication
    is off. Apply the change to the live site.
  criteria: Set bibcite_import.settings:settings.contributor_deduplication to true and settings.keyword_deduplication
    to false.
  bundle: bibcite_import
  rubric_ref: rubric/bibcite_import_bibimp_contrib_only_dedup@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
