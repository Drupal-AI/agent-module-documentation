rubrics:
- id: bibcite_import_bibimp_dedup_settings
  version: '1.0'
  applicable_bundles:
  - bibcite_import
  checks:
  - kind: must_contain_any
    values:
    - contributor_deduplication
    - keyword_deduplication
    - bibcite_import.settings
  scoring:
    combine: all_pass
- id: bibcite_import_bibimp_routes
  version: '1.0'
  applicable_bundles:
  - bibcite_import
  checks:
  - kind: must_contain_any
    values:
    - /admin/content/bibcite/reference/import
    - bibcite import
    - ImportForm
  scoring:
    combine: all_pass
- id: bibcite_import_bibimp_contrib_dedup_state
  version: '1.0'
  applicable_bundles:
  - bibcite_import
  checks:
  - kind: must_contain_any
    values:
    - 'false'
    - 'off'
    - 'no'
    - disabled
  scoring:
    combine: all_pass
- id: bibcite_import_bibimp_keyword_dedup_state
  version: '1.0'
  applicable_bundles:
  - bibcite_import
  checks:
  - kind: must_contain_any
    values:
    - 'false'
    - 'off'
    - 'no'
    - disabled
  scoring:
    combine: all_pass
- id: bibcite_import_bibimp_disable_dedup
  version: '1.0'
  applicable_bundles:
  - bibcite_import
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
- id: bibcite_import_bibimp_contrib_only_dedup
  version: '1.0'
  applicable_bundles:
  - bibcite_import
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
