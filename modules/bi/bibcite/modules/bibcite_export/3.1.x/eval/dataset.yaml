metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: bibcite_export
  version: 3.1.x
  note: 'bibcite_export exports bibcite_reference entities in any registered bibcite_format. Single-reference
    route /bibcite/export/{bibcite_format}/{entity_type}/{entity} (permission access bibcite export +
    entity view). Bulk Action plugins over bibcite_reference: bibcite_export_multiple (''Export reference'')
    and bibcite_export_multiple_vbo (''Download Selected Citations''). Ships permission access bibcite
    export and action config entity system.action.bibcite_export_multiple. Since the module has no config
    object and actual export serialization is unreliable on this broken shared site, medium/hard cases
    are grounded in the module''s real Action config entities (create/read - router-safe). NOTE: real
    export streaming uses the Symfony serializer which fatals here (broken commerce_cart_api normalizer),
    so cases assert on the action config entities rather than exported files.'
questions:
- id: bibexp-url-pattern
  input: With bibcite_export enabled, what is the URL pattern to download a single bibcite reference in
    a given format (e.g. BibTeX), and what permission is required?
  criteria: GET /bibcite/export/{bibcite_format}/{entity_type}/{entity} (e.g. /bibcite/export/bibtex/bibcite_reference/12).
    Requires the 'access bibcite export' permission plus view access to the reference.
  bundle: bibcite_export
  rubric_ref: rubric/bibcite_export_bibexp_url_pattern@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: bibexp-bulk
  input: How can editors bulk-export bibcite references, and which action plugins does bibcite_export
    provide for that?
  criteria: Via the export-all form (/admin/content/bibcite/reference/export), the export-selection form,
    or the bulk Action plugins bibcite_export_multiple ('Export reference') and bibcite_export_multiple_vbo
    ('Download Selected Citations', for Views Bulk Operations).
  bundle: bibcite_export
  rubric_ref: rubric/bibcite_export_bibexp_bulk@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: bibexp-formats
  input: Which bibliographic formats can bibcite_export write references to, and where do those formats
    come from?
  criteria: Any enabled bibcite_format plugin whose encoder is a Symfony EncoderInterface - BibTeX, RIS,
    EndNote (7/X3/tagged), MARC - provided by the format submodules (bibcite_bibtex, bibcite_ris, bibcite_endnote,
    bibcite_marc). List via the format manager's getExportDefinitions().
  bundle: bibcite_export
  rubric_ref: rubric/bibcite_export_bibexp_formats@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: bibexp-known-action
  input: On this Drupal site there is a bibcite_export bulk action for exporting references. Inspect the
    action configuration and state which entity type it applies to.
  criteria: 'It applies to bibcite_reference: the action bibcite_export_multiple (label ''Export reference'',
    plugin bibcite_export_multiple, type bibcite_reference).'
  bundle: bibcite_export
  rubric_ref: rubric/bibcite_export_bibexp_known_action@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/bibcite_export-known-action-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/bibcite_export-known-action-cleanup.sh
- id: bibexp-vbo-action
  input: A Views Bulk Operations export action for bibcite references exists on this site. Inspect the
    action configuration and give its exact label.
  criteria: Its label is 'Download Selected Citations' (an action using the bibcite_export_multiple_vbo
    plugin over bibcite_reference).
  bundle: bibcite_export
  rubric_ref: rubric/bibcite_export_bibexp_vbo_action@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/bibcite_export-vbo-action-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/bibcite_export-vbo-action-cleanup.sh
- id: bibexp-create-action
  input: On this Drupal site, create the bibcite_export bulk action that exports selected references (the
    'Export reference' action using the bibcite_export_multiple plugin over bibcite_reference). Apply
    it to the live site.
  criteria: 'Create an action config entity: id bibcite_export_multiple, label ''Export reference'', type
    bibcite_reference, plugin bibcite_export_multiple, empty configuration (Drupal\system\Entity\Action::create([...])->save()).
    This is the module''s shipped action.'
  bundle: bibcite_export
  rubric_ref: rubric/bibcite_export_bibexp_create_action@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/bibcite_export-create-action-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/bibcite_export-create-action-reset.sh
    verify: agent-module-documentation/evaluation/verify/bibcite_export-create-action-verify.sh
- id: bibexp-create-vbo
  input: Create a Views Bulk Operations action on this site that downloads selected bibcite references
    (using the bibcite_export_multiple_vbo plugin over bibcite_reference). Apply it to the live site.
  criteria: Create an action config entity using plugin bibcite_export_multiple_vbo, type bibcite_reference
    (e.g. id bibcite_export_multiple_vbo, label 'Download Selected Citations'), then save.
  bundle: bibcite_export
  rubric_ref: rubric/bibcite_export_bibexp_create_vbo@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/bibcite_export-create-vbo-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/bibcite_export-create-vbo-reset.sh
    verify: agent-module-documentation/evaluation/verify/bibcite_export-create-vbo-verify.sh
