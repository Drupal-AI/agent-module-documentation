rubrics:
- id: bigmenu_bigmenu_overridden_route
  version: '1.0'
  applicable_bundles:
  - bigmenu
  checks:
  - kind: must_contain_any
    values:
    - /admin/structure/menu/manage
    - entity.menu.edit_form
    - BigMenuForm
    - hook_entity_type_alter
    - setFormClass
  scoring:
    combine: all_pass
- id: bigmenu_bigmenu_setting_key
  version: '1.0'
  applicable_bundles:
  - bigmenu
  checks:
  - kind: must_contain_any
    values:
    - max_depth
    - /admin/config/bigmenu
    - bigmenu.settings
  scoring:
    combine: all_pass
- id: bigmenu_bigmenu_drilldown_behavior
  version: '1.0'
  applicable_bundles:
  - bigmenu
  checks:
  - kind: must_contain_any
    values:
    - Edit child items
    - menu_link
    - drill
    - child
  scoring:
    combine: all_pass
- id: bigmenu_bigmenu_known_depth
  version: '1.0'
  applicable_bundles:
  - bigmenu
  checks:
  - kind: must_contain_any
    values:
    - '4'
  scoring:
    combine: all_pass
- id: bigmenu_bigmenu_levels_shown
  version: '1.0'
  applicable_bundles:
  - bigmenu
  checks:
  - kind: must_contain_any
    values:
    - '3'
  scoring:
    combine: all_pass
- id: bigmenu_bigmenu_zero_fallback
  version: '1.0'
  applicable_bundles:
  - bigmenu
  checks:
  - kind: must_contain_any
    values:
    - '1'
  scoring:
    combine: all_pass
- id: bigmenu_bigmenu_set_depth_three
  version: '1.0'
  applicable_bundles:
  - bigmenu
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
- id: bigmenu_bigmenu_set_depth_five
  version: '1.0'
  applicable_bundles:
  - bigmenu
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
- id: bigmenu_bigmenu_top_level_only
  version: '1.0'
  applicable_bundles:
  - bigmenu
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
