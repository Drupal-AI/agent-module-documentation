rubrics:
- id: honeypot_honeypot_two_techniques
  version: '1.0'
  applicable_bundles:
  - honeypot
  checks:
  - kind: must_contain_any
    values:
    - honeypot field
    - hidden field
    - time_limit
    - time restriction
    - time limit
  scoring:
    combine: all_pass
- id: honeypot_honeypot_protect_all_drush
  version: '1.0'
  applicable_bundles:
  - honeypot
  checks:
  - kind: must_contain_any
    values:
    - config:set honeypot.settings protect_all_forms true
    - protect_all_forms true
    - config:set honeypot.settings protect_all_forms
  scoring:
    combine: all_pass
- id: honeypot_honeypot_config_keys
  version: '1.0'
  applicable_bundles:
  - honeypot
  checks:
  - kind: must_contain_any
    values:
    - honeypot.settings
    - time_limit
    - element_name
  scoring:
    combine: all_pass
- id: honeypot_honeypot_admin_route_permission
  version: '1.0'
  applicable_bundles:
  - honeypot
  checks:
  - kind: must_contain_any
    values:
    - administer honeypot
    - honeypot.config
    - /admin/config/content/honeypot
  scoring:
    combine: all_pass
- id: honeypot_honeypot_protect_custom_form
  version: '1.0'
  applicable_bundles:
  - honeypot
  checks:
  - kind: must_contain_any
    values:
    - addFormProtection
    - \Drupal::service('honeypot')
    - honeypot
  scoring:
    combine: all_pass
- id: honeypot_honeypot_alter_protections_hook
  version: '1.0'
  applicable_bundles:
  - honeypot
  checks:
  - kind: must_contain_any
    values:
    - hook_honeypot_form_protections_alter
    - honeypot_form_protections_alter
  scoring:
    combine: all_pass
- id: honeypot_honeypot_bypass_permission
  version: '1.0'
  applicable_bundles:
  - honeypot
  checks:
  - kind: must_contain_any
    values:
    - bypass honeypot protection
    - bypass honeypot
  scoring:
    combine: all_pass
- id: honeypot_honeypot_extra_time_hook
  version: '1.0'
  applicable_bundles:
  - honeypot
  checks:
  - kind: must_contain_any
    values:
    - hook_honeypot_time_limit
    - honeypot_time_limit
  scoring:
    combine: all_pass
- id: honeypot_honeypot_protect_all_4s
  version: '1.0'
  applicable_bundles:
  - honeypot
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
- id: honeypot_honeypot_protect_login_form
  version: '1.0'
  applicable_bundles:
  - honeypot
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
