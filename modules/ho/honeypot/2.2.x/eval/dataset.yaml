metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: honeypot
  version: 2.2.x
  note: 'Recipe cases (easy) are response-graded against load-bearing config keys, the service API, hooks,
    permissions, and the admin route. Two hard (execution) cases drive honeypot.settings on the live site
    and verify it: site-wide protection with a custom time limit, and single-form (login) per-form protection.'
questions:
- id: honeypot-two-techniques
  input: How does the Honeypot module block spam without showing a CAPTCHA? Name its two invisible anti-spam
    techniques.
  criteria: 'Two techniques: a hidden honeypot field (default machine name `url`) that only bots fill
    in, and a minimum time-to-complete restriction (time_limit, default 5 seconds) rejecting submissions
    completed too fast.'
  bundle: honeypot
  rubric_ref: rubric/honeypot_honeypot_two_techniques@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: honeypot-protect-all-drush
  input: On this Drupal 11 site, turn on Honeypot protection for every form site-wide using a single drush
    command. Give the command.
  criteria: drush config:set honeypot.settings protect_all_forms true
  bundle: honeypot
  rubric_ref: rubric/honeypot_honeypot_protect_all_drush@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: honeypot-config-keys
  input: Which Drupal config object holds Honeypot's settings, and which keys control the minimum submit
    time and the name of the hidden field?
  criteria: Config object honeypot.settings; `time_limit` sets the minimum seconds before a submission
    is accepted (default 5, 0 disables) and `element_name` sets the hidden honeypot field machine name
    (default `url`).
  bundle: honeypot
  rubric_ref: rubric/honeypot_honeypot_config_keys@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: honeypot-admin-route-permission
  input: Where is Honeypot configured in the Drupal admin UI, and which permission is required to reach
    the settings form?
  criteria: Settings form at /admin/config/content/honeypot (route honeypot.config), gated by the `administer
    honeypot` permission.
  bundle: honeypot
  rubric_ref: rubric/honeypot_honeypot_admin_route_permission@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: honeypot-protect-custom-form
  input: In a custom Drupal 11 module I have a form and I want to force Honeypot protection on it in code.
    Which service and method do I call in buildForm()? Show the call.
  criteria: 'Call the `honeypot` service''s addFormProtection(): \Drupal::service(''honeypot'')->addFormProtection($form,
    $form_state, [''honeypot'', ''time_restriction'']);'
  bundle: honeypot
  rubric_ref: rubric/honeypot_honeypot_protect_custom_form@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: honeypot-alter-protections-hook
  input: In a Drupal module, which hook do I implement to change which Honeypot protections ('honeypot'
    and/or 'time_restriction') are applied to a given form? Name the hook.
  criteria: hook_honeypot_form_protections_alter(array &$options, array $form) — add or remove 'honeypot'
    / 'time_restriction' entries in $options.
  bundle: honeypot
  rubric_ref: rubric/honeypot_honeypot_alter_protections_hook@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: honeypot-bypass-permission
  input: Trusted editors on my Drupal site sometimes submit forms very fast and get blocked by Honeypot.
    Which permission exempts a role from all Honeypot checks?
  criteria: Grant the `bypass honeypot protection` permission; those users are exempt from both the hidden
    field and time restriction checks.
  bundle: honeypot
  rubric_ref: rubric/honeypot_honeypot_bypass_permission@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: honeypot-extra-time-hook
  input: I want to add extra required seconds to Honeypot's time limit for forms that spammers hammer.
    Which hook returns additional seconds to add to the time limit? Name it.
  criteria: hook_honeypot_time_limit($honeypot_time_limit, array $form_values, $number) — return extra
    seconds to add to the computed time limit.
  bundle: honeypot
  rubric_ref: rubric/honeypot_honeypot_extra_time_hook@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: honeypot-protect-all-4s
  input: On this Drupal 11 site, turn on Honeypot spam protection for every form across the whole site,
    and require visitors to spend at least 4 seconds filling out a form before it will be accepted. Make
    the change stick on the live site.
  criteria: 'honeypot.settings has protect_all_forms = true and time_limit = 4. Verified by reading the
    live config: protect_all_forms === TRUE and time_limit === 4.'
  bundle: honeypot
  rubric_ref: rubric/honeypot_honeypot_protect_all_4s@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/honeypot-protect-all-reset.sh
    verify: agent-module-documentation/evaluation/verify/honeypot-protect-all-verify.sh
- id: honeypot-protect-login-form
  input: I do not want Honeypot running on every form. Enable Honeypot protection for just the user login
    form on this Drupal 11 site, and leave all other forms unprotected by the site-wide setting. Apply
    it to the live site.
  criteria: 'Per-form protection: honeypot.settings.protect_all_forms = false and form_settings.user_login_form
    = true, so the honeypot service''s getProtectedForms() includes user_login_form. Verified against
    live config.'
  bundle: honeypot
  rubric_ref: rubric/honeypot_honeypot_protect_login_form@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/honeypot-login-form-reset.sh
    verify: agent-module-documentation/evaluation/verify/honeypot-login-form-verify.sh
