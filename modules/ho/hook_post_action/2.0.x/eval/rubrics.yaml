rubrics:
- id: hook_post_action_hook_post_action_hooks_list
  version: '1.0'
  applicable_bundles:
  - hook_post_action
  checks:
  - kind: must_contain_any
    values:
    - hook_entity_postinsert
    - hook_entity_postsave
    - postsave
    - postinsert
    - hook_node_postinsert
  scoring:
    combine: all_pass
- id: hook_post_action_hook_post_action_mechanism
  version: '1.0'
  applicable_bundles:
  - hook_post_action
  checks:
  - kind: must_contain_any
    values:
    - shutdown
    - drupal_register_shutdown_function
    - invokeAll
  scoring:
    combine: all_pass
- id: hook_post_action_hook_post_action_signatures
  version: '1.0'
  applicable_bundles:
  - hook_post_action
  checks:
  - kind: must_contain_any
    values:
    - $op
    - insert
    - postsave
  scoring:
    combine: all_pass
- id: hook_post_action_hook_post_action_implementers
  version: '1.0'
  applicable_bundles:
  - hook_post_action
  checks:
  - kind: must_contain_any
    values:
    - hook_post_action_example
  scoring:
    combine: all_pass
- id: hook_post_action_hook_post_action_example_channel
  version: '1.0'
  applicable_bundles:
  - hook_post_action
  checks:
  - kind: must_contain_any
    values:
    - hook_post_action_test
  scoring:
    combine: all_pass
- id: hook_post_action_hook_post_action_implement_postinsert
  version: '1.0'
  applicable_bundles:
  - hook_post_action
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
- id: hook_post_action_hook_post_action_implement_node_postupdate
  version: '1.0'
  applicable_bundles:
  - hook_post_action
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
