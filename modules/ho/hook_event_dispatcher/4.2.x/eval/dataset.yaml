metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: hook_event_dispatcher
  version: 4.2.x
  note: hook_event_dispatcher lets you handle Drupal hooks as typed Symfony events. The base module is
    only the dispatch mechanism; ~10 per-subsystem submodules ship the actual events. Cases are `recipe`
    (response-graded) probing documented facts an agent would otherwise read source for; no site mutation.
questions:
- id: hed-subscribe-vs-hook
  input: On a Drupal 11 site using hook_event_dispatcher, how do I react to an entity being inserted without
    writing hook_entity_insert()? Show the subscriber and its service registration.
  criteria: 'Implement EventSubscriberInterface, map EntityHookEvents::ENTITY_INSERT to a method in getSubscribedEvents(),
    type-hint EntityInsertEvent, and register the class as a service tagged { name: event_subscriber }.'
  bundle: hook_event_dispatcher
  rubric_ref: rubric/hook_event_dispatcher_hed_subscribe_vs_hook@1.0
  tags:
  - mode:recipe
- id: hed-which-submodule
  input: I want to subscribe to entity, form and theme hook events with hook_event_dispatcher. Which submodule
    must I enable, and does the base hook_event_dispatcher module provide these events on its own?
  criteria: Enable core_event_dispatcher (it depends on hook_event_dispatcher). The base module ships
    no events itself; each subsystem's events live in a separate submodule.
  bundle: hook_event_dispatcher
  rubric_ref: rubric/hook_event_dispatcher_hed_which_submodule@1.0
  tags:
  - mode:recipe
- id: hed-event-naming
  input: In hook_event_dispatcher, how are event names referenced in getSubscribedEvents(), and what prefix
    do they share? Give the entity-insert example.
  criteria: Reference constants on a *HookEvents class (e.g. EntityHookEvents::ENTITY_INSERT) rather than
    raw strings; every event name is prefixed with 'hook_event_dispatcher.' (HookEventDispatcherInterface::PREFIX).
  bundle: hook_event_dispatcher
  rubric_ref: rubric/hook_event_dispatcher_hed_event_naming@1.0
  tags:
  - mode:recipe
- id: hed-submodule-split
  input: Which hook_event_dispatcher submodules do I enable to subscribe to (a) Views hooks and (b) user
    hooks?
  criteria: views_event_dispatcher for Views hooks and user_event_dispatcher for user hooks; each core
    subsystem's hooks are wrapped by its own *_event_dispatcher submodule.
  bundle: hook_event_dispatcher
  rubric_ref: rubric/hook_event_dispatcher_hed_submodule_split@1.0
  tags:
  - mode:recipe
- id: hed-preprocess
  input: I want to alter template preprocess variables using events instead of hook_preprocess_HOOK()
    on a Drupal site with hook_event_dispatcher. Which submodule provides that?
  criteria: Enable preprocess_event_dispatcher, which dispatches events for template_preprocess_* / hook_preprocess_HOOK
    so you subscribe to a preprocess event instead of implementing the hook.
  bundle: hook_event_dispatcher
  rubric_ref: rubric/hook_event_dispatcher_hed_preprocess@1.0
  tags:
  - mode:recipe
- id: hed-dispatch-mechanism
  input: How does a hook_event_dispatcher submodule turn a Drupal hook into an event that my subscriber
    receives? Which service is involved?
  criteria: The submodule implements the hook, builds a typed event object, and calls the hook_event_dispatcher.manager
    service's register(), which forwards it to core's event_dispatcher; the base module also decorates
    module_handler.
  bundle: hook_event_dispatcher
  rubric_ref: rubric/hook_event_dispatcher_hed_dispatch_mechanism@1.0
  tags:
  - mode:recipe
- id: hed-return-hook
  input: With hook_event_dispatcher, how do events handle hooks that must return a value (like altering
    data the hook returns)?
  criteria: Return-style hooks use events implementing HookReturnInterface (or a specific getter like
    ThemeEvent::getNewThemes()); you set your value on the event and the submodule feeds it back into
    the hook's return.
  bundle: hook_event_dispatcher
  rubric_ref: rubric/hook_event_dispatcher_hed_return_hook@1.0
  tags:
  - mode:recipe
- id: hed-generator
  input: Does hook_event_dispatcher provide any Drush tooling to scaffold an event subscriber, or a configuration
    UI?
  criteria: It ships a Drush v2 code generator (hook_event_dispatcher.generator) to scaffold a subscriber;
    there is no configuration UI, no permissions, and no config for the base module.
  bundle: hook_event_dispatcher
  rubric_ref: rubric/hook_event_dispatcher_hed_generator@1.0
  tags:
  - mode:recipe
