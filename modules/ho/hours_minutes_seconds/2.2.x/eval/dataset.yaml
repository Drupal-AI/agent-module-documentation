metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: hours_minutes_seconds
  version: 2.2.x
  note: 'Hours Minutes Seconds defines the core Field API plugin `hour_minutes_seconds` (int seconds storage),
    widget `hour_minutes_seconds_default`, and four formatters: hour_minutes_seconds_default_formatter,
    hour_minutes_seconds_countdown_formatter, hour_minutes_seconds_natural_language_formatter, hour_minutes_seconds_iso_duration_formatter.
    Conversion service id hours_minutes_seconds.hour_minutes_seconds (secondsToFormatted/formattedToSeconds/toIso8601/fromIso8601/toArray).
    No configure route, no permissions, no Drush, no custom plugin manager. Field-instance settings min/max
    (seconds); widget setting `format`. Medium cases read real field config (min/max) and real form-display
    widget format; hard cases set the view-display formatter (ISO / countdown), all verified against live
    core.entity_*_display config.'
questions:
- id: hours_minutes_seconds-storage
  input: How does the Drupal hours_minutes_seconds field type store its value in the database, and what
    is the field type's machine id?
  criteria: The field type id is `hour_minutes_seconds`; it stores a single column `value` as a (nullable,
    signed) integer representing the total number of seconds. Negative durations are supported. Widgets/formatters
    convert to and from that integer.
  bundle: hours_minutes_seconds
  rubric_ref: rubric/hours_minutes_seconds_hours_minutes_seconds_storage@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: hours_minutes_seconds-formatters
  input: Which display formatters does the hours_minutes_seconds module provide for its duration field?
    Name the one that outputs an ISO 8601 duration and the one that shows a live countdown.
  criteria: 'Four formatters: hour_minutes_seconds_default_formatter (with optional live count-up timer),
    hour_minutes_seconds_countdown_formatter (live countdown), hour_minutes_seconds_natural_language_formatter,
    and hour_minutes_seconds_iso_duration_formatter (outputs e.g. PT2H30M45S).'
  bundle: hours_minutes_seconds
  rubric_ref: rubric/hours_minutes_seconds_hours_minutes_seconds_formatters@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: hours_minutes_seconds-service
  input: In code, how do I convert a raw number of seconds into an ISO 8601 duration (and a formatted
    h:mm:ss string) using the hours_minutes_seconds module? Which service and methods?
  criteria: 'Use the service `hours_minutes_seconds.hour_minutes_seconds`: $hms->toIso8601(9045) => ''PT2H30M45S'',
    $hms->secondsToFormatted(9045,''h:mm:ss'') => ''2:30:45'', and $hms->formattedToSeconds(''2:30:45'',''h:mm:ss'')
    => 9045.'
  bundle: hours_minutes_seconds
  rubric_ref: rubric/hours_minutes_seconds_hours_minutes_seconds_service@1.0
  tags:
  - mode:recipe
  - difficulty:easy
