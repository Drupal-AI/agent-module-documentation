rubrics:
- id: hours_minutes_seconds_hours_minutes_seconds_storage
  version: '1.0'
  applicable_bundles:
  - hours_minutes_seconds
  checks:
  - kind: must_contain_any
    values:
    - seconds
    - integer
    - int
    - hour_minutes_seconds
  scoring:
    combine: all_pass
- id: hours_minutes_seconds_hours_minutes_seconds_formatters
  version: '1.0'
  applicable_bundles:
  - hours_minutes_seconds
  checks:
  - kind: must_contain_any
    values:
    - hour_minutes_seconds_iso_duration_formatter
    - ISO 8601
    - hour_minutes_seconds_countdown_formatter
    - countdown
    - natural language
  scoring:
    combine: all_pass
- id: hours_minutes_seconds_hours_minutes_seconds_service
  version: '1.0'
  applicable_bundles:
  - hours_minutes_seconds
  checks:
  - kind: must_contain_any
    values:
    - hours_minutes_seconds.hour_minutes_seconds
    - toIso8601
    - secondsToFormatted
    - formattedToSeconds
  scoring:
    combine: all_pass
- id: hours_minutes_seconds_hours_minutes_seconds_known_minmax
  version: '1.0'
  applicable_bundles:
  - hours_minutes_seconds
  checks:
  - kind: must_contain_any
    values:
    - '3600'
  scoring:
    combine: all_pass
- id: hours_minutes_seconds_hours_minutes_seconds_known_widget_format
  version: '1.0'
  applicable_bundles:
  - hours_minutes_seconds
  checks:
  - kind: must_contain_any
    values:
    - d:h:mm:ss
  scoring:
    combine: all_pass
- id: hours_minutes_seconds_hours_minutes_seconds_iso_display
  version: '1.0'
  applicable_bundles:
  - hours_minutes_seconds
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
- id: hours_minutes_seconds_hours_minutes_seconds_countdown_display
  version: '1.0'
  applicable_bundles:
  - hours_minutes_seconds
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
