rubrics:
- id: hotkeys_for_save_hotkeys_for_save_keys
  version: '1.0'
  applicable_bundles:
  - hotkeys_for_save
  checks:
  - kind: must_contain_any
    values:
    - Ctrl+S
    - Cmd+S
    - ctrlKey
    - metaKey
  scoring:
    combine: all_pass
- id: hotkeys_for_save_hotkeys_for_save_button_priority
  version: '1.0'
  applicable_bundles:
  - hotkeys_for_save
  checks:
  - kind: must_contain_any
    values:
    - edit-save-continue
    - edit-continue
    - edit-next
    - edit-submit
    - data-drupal-selector
  scoring:
    combine: all_pass
- id: hotkeys_for_save_hotkeys_for_save_permission
  version: '1.0'
  applicable_bundles:
  - hotkeys_for_save
  checks:
  - kind: must_contain_any
    values:
    - use hotkeys for save
  scoring:
    combine: all_pass
- id: hotkeys_for_save_hotkeys_for_save_which_role
  version: '1.0'
  applicable_bundles:
  - hotkeys_for_save
  checks:
  - kind: must_contain_any
    values:
    - hfs_role
  scoring:
    combine: all_pass
- id: hotkeys_for_save_hotkeys_for_save_which_perm
  version: '1.0'
  applicable_bundles:
  - hotkeys_for_save
  checks:
  - kind: must_contain_any
    values:
    - use hotkeys for save
  scoring:
    combine: all_pass
- id: hotkeys_for_save_hotkeys_for_save_grant
  version: '1.0'
  applicable_bundles:
  - hotkeys_for_save
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
- id: hotkeys_for_save_hotkeys_for_save_revoke
  version: '1.0'
  applicable_bundles:
  - hotkeys_for_save
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
