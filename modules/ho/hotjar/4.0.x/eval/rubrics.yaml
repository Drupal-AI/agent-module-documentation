rubrics:
- id: hotjar_hotjar_where_id
  version: '1.0'
  applicable_bundles:
  - hotjar
  checks:
  - kind: must_contain_any
    values:
    - hotjar.settings
    - account
    - /admin/config/system/hotjar
    - hotjar.admin_settings_form
  scoring:
    combine: all_pass
- id: hotjar_hotjar_visibility_modes
  version: '1.0'
  applicable_bundles:
  - hotjar
  checks:
  - kind: must_contain_any
    values:
    - visibility_pages
    - except
    - only
    - '0'
    - '1'
    - '2'
  scoring:
    combine: all_pass
- id: hotjar_hotjar_attachment_modes
  version: '1.0'
  applicable_bundles:
  - hotjar
  checks:
  - kind: must_contain_any
    values:
    - build
    - drupal_settings
    - drupalSettings
    - snippet_path
    - html_head
  scoring:
    combine: all_pass
- id: hotjar_hotjar_known_account
  version: '1.0'
  applicable_bundles:
  - hotjar
  checks:
  - kind: must_contain_any
    values:
    - '1234567'
  scoring:
    combine: all_pass
- id: hotjar_hotjar_known_visibility
  version: '1.0'
  applicable_bundles:
  - hotjar
  checks:
  - kind: must_contain_any
    values:
    - /landing
    - /promo
    - only
  scoring:
    combine: all_pass
- id: hotjar_hotjar_set_id
  version: '1.0'
  applicable_bundles:
  - hotjar
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
- id: hotjar_hotjar_restrict_pages
  version: '1.0'
  applicable_bundles:
  - hotjar
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
