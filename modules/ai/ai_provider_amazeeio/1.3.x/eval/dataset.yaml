metadata:
  name: amazee.ai AI Provider
  data_name: ai_provider_amazeeio
  module: ai_provider_amazeeio
  version: 1.3.x
  skill_name: drupal-module-docs
  note: 'ai_provider_amazeeio registers the ''amazeeio'' AiProvider plugin (AmazeeioAiProvider, extending
    AI Core''s OpenAiBasedProviderClientBase) plus an ''amazeeio_vector_db'' AiVdbProvider over Postgres/pgvector,
    for the AI (AI Core) module. It defines no plugin types, no permissions, no drush. LIMITATION: live
    chat/embeddings calls require a provisioned amazee.ai key (via the multi-step trial/email settings
    form), so medium/hard cases are grounded entirely in ai_provider_amazeeio.settings config that builds
    and verifies WITHOUT calling the amazee.ai API. easy = recipe (response-graded, no mutation); medium
    = introspection (setup writes known config, agent reads it back, cleanup restores); hard = execution
    (reset clears config, agent writes the config, verify reads live config, exit 0 = pass).'
questions:
- id: aipamazeeio-what-it-is
  input: On a Drupal 11 site running the AI (AI Core) module, what does the ai_provider_amazeeio module
    add, and what is the machine id of the AiProvider plugin it registers?
  criteria: It registers the 'amazeeio' AiProvider plugin (AmazeeioAiProvider, extending AI Core's OpenAiBasedProviderClientBase)
    that adapts amazee.ai's OpenAI-compatible LiteLLM gateway (default https://api.amazee.ai) to AI Core.
    It also registers an 'amazeeio_vector_db' AiVdbProvider over Postgres/pgvector. Depends on the ai
    and key modules.
  bundle: ai_provider_amazeeio
  rubric_ref: rubric/ai_provider_amazeeio_aipamazeeio_what_it_is@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: aipamazeeio-operation-types
  input: Which AI Core operation types does the amazee.ai provider (ai_provider_amazeeio) support?
  criteria: 'getSupportedOperationTypes() returns chat, chat_with_complex_json, chat_with_image_vision,
    chat_with_structured_response, chat_with_tools, and embeddings. Capabilities: StreamChatOutput and
    ChatFiberSupport.'
  bundle: ai_provider_amazeeio
  rubric_ref: rubric/ai_provider_amazeeio_aipamazeeio_operation_types@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: aipamazeeio-key-and-config
  input: How is the amazee.ai API key set up for ai_provider_amazeeio, where is the settings form, and
    what config object holds its settings?
  criteria: You authenticate via the multi-step amazee.ai AI Authentication form at /admin/config/ai/providers/amazeeio
    (route ai_provider_amazeeio.settings_form, permission 'administer ai providers'), which starts a free
    trial or verifies your email and provisions the token into the auto-created 'amazeeio_ai' Key entity
    (and a 'amazeeio_ai_database' Key for the VectorDB). Settings live in the ai_provider_amazeeio.settings
    config object; only the Key ids are stored (api_key, postgres_password), never raw secrets.
  bundle: ai_provider_amazeeio
  rubric_ref: rubric/ai_provider_amazeeio_aipamazeeio_key_and_config@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: aipamazeeio-vdb-host-introspect
  input: This site's amazee.ai provider already has its VectorDB Postgres connection configured. Inspect
    the live configuration and tell me the Postgres host, port, database name, and username it will use
    for the amazee.ai vector store.
  criteria: 'Reading ai_provider_amazeeio.settings (e.g. `drush cget ai_provider_amazeeio.settings`):
    postgres_host = vdb.eval.amazee.internal, postgres_port = 6543, postgres_default_database = eval_vectors,
    postgres_username = eval_reader. (The password comes from the amazeeio_ai_database Key entity.)'
  bundle: ai_provider_amazeeio
  rubric_ref: rubric/ai_provider_amazeeio_aipamazeeio_vdb_host_introspect@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
