metadata:
  name: OpenAI Provider
  data_name: ai_provider_openai
  module: ai_provider_openai
  version: 1.2.x
  note: ai_provider_openai registers the 'openai' AiProvider plugin for the AI (AI Core) module and implements
    six operation-type interfaces. It defines no plugin types, no permissions, no drush. Cases are `recipe`
    (response-graded) since they probe documented facts an agent would otherwise read source to answer;
    no site mutation.
questions:
- id: aipopenai-what-it-is
  input: On a Drupal 11 site running the AI (AI Core) module, what does the ai_provider_openai module
    add, and what plugin does it register?
  criteria: It registers the 'openai' AiProvider plugin (OpenAiProvider) for AI Core, adapting OpenAI
    (and OpenAI-compatible/Azure) endpoints to AI Core's operation-type interfaces. It depends on the
    ai and key modules.
  bundle: ai_provider_openai
  rubric_ref: rubric/ai_provider_openai_aipopenai_what_it_is@1.0
  tags:
  - mode:recipe
- id: aipopenai-operation-types
  input: Which AI Core operation types does the OpenAI provider (ai_provider_openai) support?
  criteria: getSupportedOperationTypes() returns chat, embeddings, moderation, text_to_image, text_to_speech,
    speech_to_text.
  bundle: ai_provider_openai
  rubric_ref: rubric/ai_provider_openai_aipopenai_operation_types@1.0
  tags:
  - mode:recipe
- id: aipopenai-api-key-via-key
  input: How do I configure the OpenAI API key for the ai_provider_openai module, and where is the settings
    form?
  criteria: Store the key as a Key entity (key module) and select it in the OpenAI Authentication form
    at /admin/config/ai/providers/openai (route ai_provider_openai.settings_form). Only the Key id is
    saved in ai_provider_openai.settings (api_key), never the raw key.
  bundle: ai_provider_openai
  rubric_ref: rubric/ai_provider_openai_aipopenai_api_key_via_key@1.0
  tags:
  - mode:recipe
- id: aipopenai-azure-host
  input: I want the OpenAI provider in Drupal to talk to an Azure OpenAI or other OpenAI-compatible endpoint
    instead of api.openai.com. Which setting controls this?
  criteria: Set the host key in ai_provider_openai.settings (e.g. drush cset ai_provider_openai.settings
    host <host>); empty means api.openai.com/v1. There is no host field on the form.
  bundle: ai_provider_openai
  rubric_ref: rubric/ai_provider_openai_aipopenai_azure_host@1.0
  tags:
  - mode:recipe
- id: aipopenai-default-provider
  input: How do I make OpenAI the site-wide default AI provider for chat on a Drupal site using AI Core?
  criteria: Set the provider/model per operation type at AI Core's settings (ai.settings_form, /admin/config/ai/settings,
    default_providers). Saving the OpenAI key seeds these via defaultIfNone (chat -> gpt-5.2).
  bundle: ai_provider_openai
  rubric_ref: rubric/ai_provider_openai_aipopenai_default_provider@1.0
  tags:
  - mode:recipe
- id: aipopenai-call-from-code
  input: In PHP, how do I run a chat completion through OpenAI on a Drupal AI Core site? Show the service
    and pattern.
  criteria: 'Use the ai.provider service (AiProviderPluginManager): resolve getDefaultProviderForOperationType(''chat'')
    or createInstance(''openai''), then call ->chat($input, $model_id, $tags). Never instantiate the OpenAI
    SDK directly.'
  bundle: ai_provider_openai
  rubric_ref: rubric/ai_provider_openai_aipopenai_call_from_code@1.0
  tags:
  - mode:recipe
- id: aipopenai-moderation
  input: The OpenAI provider in Drupal runs a moderation check before text calls. What model does it use,
    how do I disable it, and what happens on a flagged prompt?
  criteria: It runs omni-moderation-latest before text calls when the moderation config flag is on (default
    true). Bypass a single call with the skip_moderation tag (or disableModeration()); a flagged prompt
    throws AiUnsafePromptException.
  bundle: ai_provider_openai
  rubric_ref: rubric/ai_provider_openai_aipopenai_moderation@1.0
  tags:
  - mode:recipe
- id: aipopenai-embeddings-size
  input: Which OpenAI embedding models does the provider know the vector size for, and what are the sizes?
  criteria: embeddingsVectorSize() returns 1536 for text-embedding-ada-002 and text-embedding-3-small,
    and 3072 for text-embedding-3-large.
  bundle: ai_provider_openai
  rubric_ref: rubric/ai_provider_openai_aipopenai_embeddings_size@1.0
  tags:
  - mode:recipe
