rubrics:
- id: ai_provider_openai_aipopenai_what_it_is
  version: '1.0'
  applicable_bundles:
  - ai_provider_openai
  checks:
  - kind: must_contain_any
    values:
    - AiProvider
    - openai
    - provider
  scoring:
    combine: all_pass
- id: ai_provider_openai_aipopenai_operation_types
  version: '1.0'
  applicable_bundles:
  - ai_provider_openai
  checks:
  - kind: must_contain_any
    values:
    - chat
    - embeddings
    - moderation
    - text_to_image
    - text_to_speech
    - speech_to_text
  scoring:
    combine: all_pass
- id: ai_provider_openai_aipopenai_api_key_via_key
  version: '1.0'
  applicable_bundles:
  - ai_provider_openai
  checks:
  - kind: must_contain_any
    values:
    - key
    - Key
    - key_select
    - /admin/config/ai/providers/openai
    - ai_provider_openai.settings
  scoring:
    combine: all_pass
- id: ai_provider_openai_aipopenai_azure_host
  version: '1.0'
  applicable_bundles:
  - ai_provider_openai
  checks:
  - kind: must_contain_any
    values:
    - host
    - ai_provider_openai.settings
  scoring:
    combine: all_pass
- id: ai_provider_openai_aipopenai_default_provider
  version: '1.0'
  applicable_bundles:
  - ai_provider_openai
  checks:
  - kind: must_contain_any
    values:
    - ai.settings
    - default_providers
    - /admin/config/ai/settings
    - getSetupData
    - defaultIfNone
  scoring:
    combine: all_pass
- id: ai_provider_openai_aipopenai_call_from_code
  version: '1.0'
  applicable_bundles:
  - ai_provider_openai
  checks:
  - kind: must_contain_any
    values:
    - ai.provider
    - createInstance
    - AiProviderPluginManager
    - getDefaultProviderForOperationType
  scoring:
    combine: all_pass
- id: ai_provider_openai_aipopenai_moderation
  version: '1.0'
  applicable_bundles:
  - ai_provider_openai
  checks:
  - kind: must_contain_any
    values:
    - omni-moderation-latest
    - moderation
    - skip_moderation
    - AiUnsafePromptException
  scoring:
    combine: all_pass
- id: ai_provider_openai_aipopenai_embeddings_size
  version: '1.0'
  applicable_bundles:
  - ai_provider_openai
  checks:
  - kind: must_contain_any
    values:
    - embeddingsVectorSize
    - text-embedding-3-small
    - '1536'
    - '3072'
  scoring:
    combine: all_pass
