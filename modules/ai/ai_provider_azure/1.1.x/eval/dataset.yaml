metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: ai_provider_azure
  version: 1.1.x
  note: 'ai_provider_azure is an AI-module provider plugin (id ''azure'', AzureProvider extends AiProviderClientBase).
    It needs real Azure OpenAI credentials to make live calls, which this site does not have, so every
    case is grounded in the provider definition and local config, NOT live API calls. Supported operation
    types: chat, embeddings, text_to_image, speech_to_text, text_to_speech; capability StreamChatOutput;
    hasPredefinedModels=FALSE. Configure route ai_provider_azure.settings_form -> /admin/config/ai/providers/azure
    (permission ''administer ai providers'', from the ai module). The API key is a Key-module entity chosen
    via key_select; each model has an endpoint + connect_header (api-key/authorization/other). The module''s
    own config is ai_provider_azure.settings; model definitions live in ai.settings.models.azure.* (owned
    by the ai module, so cases do NOT mutate it). Medium/hard cases ground in the module''s OWN config
    (ai_provider_azure.settings) and in Key entities (the documented credential setup), verified against
    live config/entities. Fixtures use namespaced azure_api_* keys.'
questions:
- id: apaz-operation-types
  input: The Drupal module ai_provider_azure adds Azure as a provider for the AI module. Which AI operation
    types does the Azure provider support?
  criteria: getSupportedOperationTypes() returns chat, embeddings, text_to_image, speech_to_text and text_to_speech.
    Its advertised capability is streamed chat (StreamChatOutput).
  bundle: ai_provider_azure
  rubric_ref: rubric/ai_provider_azure_apaz_operation_types@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: apaz-setup-route-key
  input: How do I configure the Azure AI provider (ai_provider_azure) in Drupal? Where is its setup form,
    what permission is needed, and how is the Azure API key supplied?
  criteria: At /admin/config/ai/providers/azure (route ai_provider_azure.settings_form), which requires
    the 'administer ai providers' permission. The API key is supplied by selecting a Key module entity
    (key_select) that holds the Azure key; each model also needs an Endpoint (the Azure Target URI).
  bundle: ai_provider_azure
  rubric_ref: rubric/ai_provider_azure_apaz_setup_route_key@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: apaz-model-fields
  input: The Azure AI provider has no predefined models - you add each one. When adding an Azure model
    in ai_provider_azure, what does the 'Endpoint' field expect, and what are the options for the connection/header
    type?
  criteria: The Endpoint is the Azure Target URI (the one ending in .../completions etc.), from which
    the base URI and query params are derived. The connect header type (connect_header) options are api-key
    (OpenAI-style header), authorization (generic Authorization header), or other (a custom header name).
  bundle: ai_provider_azure
  rubric_ref: rubric/ai_provider_azure_apaz_model_fields@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: apaz-known-key
  input: On this Drupal site, a Key (Key module) entity has been created to hold the Microsoft Azure AI
    provider's API key. Inspect the live Key configuration and report the machine id of that key.
  criteria: The Key entity is azure_api_known (an authentication key type), the one that would be selected
    as the Azure provider's api_key.
  bundle: ai_provider_azure
  rubric_ref: rubric/ai_provider_azure_apaz_known_key@1.0
  tags:
  - mode:introspection
  - difficulty:medium
