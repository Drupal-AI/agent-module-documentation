rubrics:
- id: ai_provider_azure_apaz_operation_types
  version: '1.0'
  applicable_bundles:
  - ai_provider_azure
  checks:
  - kind: must_contain_any
    values:
    - chat
    - embeddings
    - text_to_image
    - speech_to_text
    - text_to_speech
  scoring:
    combine: all_pass
- id: ai_provider_azure_apaz_setup_route_key
  version: '1.0'
  applicable_bundles:
  - ai_provider_azure
  checks:
  - kind: must_contain_any
    values:
    - /admin/config/ai/providers/azure
    - administer ai providers
    - Key
    - key_select
    - ai_provider_azure.settings_form
  scoring:
    combine: all_pass
- id: ai_provider_azure_apaz_model_fields
  version: '1.0'
  applicable_bundles:
  - ai_provider_azure
  checks:
  - kind: must_contain_any
    values:
    - endpoint
    - Target URI
    - api-key
    - authorization
    - connect_header
  scoring:
    combine: all_pass
- id: ai_provider_azure_apaz_known_key
  version: '1.0'
  applicable_bundles:
  - ai_provider_azure
  checks:
  - kind: must_contain_any
    values:
    - azure_api_known
  scoring:
    combine: all_pass
- id: ai_provider_azure_apaz_known_settings
  version: '1.0'
  applicable_bundles:
  - ai_provider_azure
  checks:
  - kind: must_contain_any
    values:
    - AZURE_PROFILE_MARKER_42
  scoring:
    combine: all_pass
- id: ai_provider_azure_apaz_create_key
  version: '1.0'
  applicable_bundles:
  - ai_provider_azure
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
- id: ai_provider_azure_apaz_record_deployment
  version: '1.0'
  applicable_bundles:
  - ai_provider_azure
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
