metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: ai_image_bulk_alt_text
  version: 1.0.x
  note: 'Submodule of ai_image_alt_text: a single admin form to bulk-generate alt text for images missing
    it. Cases are `recipe` (response-graded), probing documented facts; no site mutation.'
questions:
- id: aibulk-purpose
  input: On a Drupal 11 site I want to fill in missing alt text for many images at once using AI. Which
    module/submodule provides that and where is its form?
  criteria: The ai_image_bulk_alt_text submodule of AI Image Alt Text; its form is at /admin/config/media/ai_image_bulk_alt_text
    (Config → Media → Bulk Generate Alt Text with AI).
  bundle: ai_image_bulk_alt_text
  rubric_ref: rubric/ai_image_bulk_alt_text_aibulk_purpose@1.0
  tags:
  - mode:recipe
- id: aibulk-dependency
  input: What does the ai_image_bulk_alt_text submodule depend on to actually generate alt text?
  criteria: It depends on the parent ai_image_alt_text module (and through it AI Core / drupal/ai); it
    has no AI code of its own and reuses the parent's AI chat_with_image_vision generation.
  bundle: ai_image_bulk_alt_text
  rubric_ref: rubric/ai_image_bulk_alt_text_aibulk_dependency@1.0
  tags:
  - mode:recipe
- id: aibulk-permission
  input: Which permission controls access to the bulk alt-text form in ai_image_bulk_alt_text?
  criteria: The 'batch fix ai images alt text' permission gates the bulk form.
  bundle: ai_image_bulk_alt_text
  rubric_ref: rubric/ai_image_bulk_alt_text_aibulk_permission@1.0
  tags:
  - mode:recipe
- id: aibulk-what-it-lists
  input: How does the ai_image_bulk_alt_text form decide which images to show?
  criteria: It scans content entity types/bundles for image fields with alt text enabled (alt_field) and
    lists field items whose alt value is empty (capped at 50 per load).
  bundle: ai_image_bulk_alt_text
  rubric_ref: rubric/ai_image_bulk_alt_text_aibulk_what_it_lists@1.0
  tags:
  - mode:recipe
- id: aibulk-save-flow
  input: In the bulk alt-text form, are AI suggestions saved automatically, and how do changes get written
    to the images?
  criteria: No. Suggestions populate editable textareas; only when you press 'Save changes' does it load
    each entity, set the field's alt value, and save — keeping a human in the loop.
  bundle: ai_image_bulk_alt_text
  rubric_ref: rubric/ai_image_bulk_alt_text_aibulk_save_flow@1.0
  tags:
  - mode:recipe
- id: aibulk-no-config
  input: Does the ai_image_bulk_alt_text submodule have its own settings/config for prompt and model?
  criteria: No — it defines no config, schema, or services. Prompt, image style, and provider/model all
    come from the parent ai_image_alt_text module's settings.
  bundle: ai_image_bulk_alt_text
  rubric_ref: rubric/ai_image_bulk_alt_text_aibulk_no_config@1.0
  tags:
  - mode:recipe
