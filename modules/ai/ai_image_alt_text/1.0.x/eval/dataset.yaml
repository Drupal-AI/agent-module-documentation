metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: ai_image_alt_text
  version: 1.0.x
  note: AI Image Alt Text adds an AI 'Generate' button to image widgets and calls AI Core to write alt
    text. Cases are `recipe` (response-graded) probing documented facts an agent would otherwise read
    source for; no site mutation.
questions:
- id: aiat-purpose-and-dependency
  input: On a Drupal 11 site, which contrib module do I need in order to auto-generate image alt text
    with AI, and what does it depend on to actually talk to an AI model?
  criteria: The AI Image Alt Text (ai_image_alt_text) module; it depends on core 'image' and on the AI
    / AI Core module (drupal/ai), which supplies the actual AI provider.
  bundle: ai_image_alt_text
  rubric_ref: rubric/ai_image_alt_text_aiat_purpose_and_dependency@1.0
  tags:
  - mode:recipe
- id: aiat-operation-type
  input: Which AI Core operation type does the AI Image Alt Text module use to generate alt text from
    an image?
  criteria: It uses AI Core's chat operation with a vision-capable model — it resolves the default provider
    for the 'chat_with_image_vision' operation type and sends a ChatInput carrying the image as an ImageFile.
  bundle: ai_image_alt_text
  rubric_ref: rubric/ai_image_alt_text_aiat_operation_type@1.0
  tags:
  - mode:recipe
- id: aiat-generate-button
  input: How does AI Image Alt Text expose alt-text generation to editors, and what controls whether the
    button shows up on an image field?
  criteria: A 'Generate with AI' button is injected into image field widgets via hook_field_widget_single_element_form_alter.
    It appears only when the field has alt text enabled, the user has the 'generate ai alt tags' permission,
    an image is uploaded, and a working AI provider is configured.
  bundle: ai_image_alt_text
  rubric_ref: rubric/ai_image_alt_text_aiat_generate_button@1.0
  tags:
  - mode:recipe
- id: aiat-permission
  input: Which permission gates who can trigger AI alt-text generation in the ai_image_alt_text module?
  criteria: The 'generate ai alt tags' permission gates both the button and the generate route.
  bundle: ai_image_alt_text
  rubric_ref: rubric/ai_image_alt_text_aiat_permission@1.0
  tags:
  - mode:recipe
- id: aiat-settings
  input: Where do I configure the AI Image Alt Text module, and what are the main settings (prompt, model,
    image preprocessing, autogenerate)?
  criteria: 'At /admin/config/ai/ai_image_alt_text (route ai_image_alt_text.settings_form, config ai_image_alt_text.settings).
    Keys: prompt (Twig, tokens {{ entity_lang_name }} and {{ filename }}), image_style (default ai_image_alt_text,
    downscales before sending), ai_model (empty = site default chat_with_image_vision model), autogenerate,
    hide_button.'
  bundle: ai_image_alt_text
  rubric_ref: rubric/ai_image_alt_text_aiat_settings@1.0
  tags:
  - mode:recipe
- id: aiat-language
  input: Can AI Image Alt Text generate alt text in the content's language rather than always English,
    and how?
  criteria: Yes. The content entity's language is passed to the generate route (lang_code) and rendered
    into the prompt via the {{ entity_lang_name }} Twig token, so the model responds in that language.
  bundle: ai_image_alt_text
  rubric_ref: rubric/ai_image_alt_text_aiat_language@1.0
  tags:
  - mode:recipe
- id: aiat-provider-fallback
  input: If I don't pick a specific model in AI Image Alt Text's settings, how does it decide which AI
    provider/model to use?
  criteria: The ProviderHelper (ai_image_alt_text.provider service) falls back to AI Core's default provider
    for the 'chat_with_image_vision' operation type via getDefaultProviderForOperationType(); if none
    is set no button/generation is available.
  bundle: ai_image_alt_text
  rubric_ref: rubric/ai_image_alt_text_aiat_provider_fallback@1.0
  tags:
  - mode:recipe
- id: aiat-bulk-submodule
  input: Which submodule of AI Image Alt Text lets me fill in missing alt text for many images at once?
  criteria: The ai_image_bulk_alt_text submodule adds a bulk 'Bulk Generate Alt Text with AI' form listing
    image fields missing alt text so you can generate and save them en masse.
  bundle: ai_image_alt_text
  rubric_ref: rubric/ai_image_alt_text_aiat_bulk_submodule@1.0
  tags:
  - mode:recipe
