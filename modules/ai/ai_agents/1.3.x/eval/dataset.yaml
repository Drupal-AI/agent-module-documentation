metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: ai_agents
  version: 1.3.x
  note: 'Difficulty-tiered. easy/recipe (response-graded, no AI provider/API key needed) probes ai_agents-specific
    architecture facts an unfamiliar agent would have to read source to answer. medium/introspection asks
    about the CURRENT live setup: a setup script saves a KNOWN ai_agent config entity (eval_known_agent)
    and the model must inspect the running site with drush to read its tools, system prompt, and max_loops
    back; a cleanup script deletes it after. hard/execution requires the model to actually BUILD a working,
    tool-enabled AI agent on the live site (verified against site state), not just answer questions.'
questions:
- id: aiagents-agent-plugin-type
  input: In the Drupal ai_agents module, what is the plugin type (and its Plugin/ namespace) for writing
    a code-based agent? Name it.
  criteria: The AiAgent plugin type (namespace Plugin/AiAgent, attribute-based).
  bundle: ai_agents
  rubric_ref: rubric/ai_agents_aiagents_agent_plugin_type@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: aiagents-tool-plugin-type
  input: In ai_agents, agents act through 'tools'. What plugin type are those tools, and which module
    actually DEFINES that plugin type?
  criteria: Tools are AiFunctionCall plugins; that plugin type is defined by the ai (AI Core) module,
    not ai_agents.
  bundle: ai_agents
  rubric_ref: rubric/ai_agents_aiagents_tool_plugin_type@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: aiagents-override-entity
  input: In ai_agents, which config entity type lets you modify an existing agent's prompt and tools WITHOUT
    forking or editing the original? Give the entity type id.
  criteria: The ai_agent_override config entity.
  bundle: ai_agents
  rubric_ref: rubric/ai_agents_aiagents_override_entity@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: aiagents-admin-permission
  input: In ai_agents, which permission machine name gates administering AI agents? Give the exact permission.
  criteria: administer ai_agent
  bundle: ai_agents
  rubric_ref: rubric/ai_agents_aiagents_admin_permission@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: aiagents-explorer
  input: In the ai_agents ecosystem, how do I interactively RUN and DEBUG an agent from the UI — which
    submodule provides it and at what admin path?
  criteria: The ai_agents_explorer submodule, at /admin/config/ai/agents/explore.
  bundle: ai_agents
  rubric_ref: rubric/ai_agents_aiagents_explorer@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: aiagents-known-tools-medium
  input: This Drupal site (drush available) already has an AI agent configured with the machine name `eval_known_agent`.
    Inspect the live configuration and tell me which tool(s) — AiFunctionCall / function-call plugins
    — that agent grants. Give the exact tool plugin id(s).
  criteria: The eval_known_agent grants exactly one tool, ai_agent:html_to_markdown. Read back from the
    live ai_agents.ai_agent.eval_known_agent config.
  bundle: ai_agents
  rubric_ref: rubric/ai_agents_aiagents_known_tools_medium@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    persona: drupal-expert
    setup: agent-module-documentation/evaluation/verify/ai_agents-known-agent-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/ai_agents-known-agent-cleanup.sh
- id: aiagents-known-prompt-medium
  input: On this Drupal site the AI agent with machine name `eval_known_agent` is already configured.
    Inspect its live configuration with drush and quote the distinctive protocol that its system prompt
    instructs it to always cite before answering.
  criteria: The system_prompt of eval_known_agent tells it to always cite the 'Kumquat Protocol'. Read
    back from the live config.
  bundle: ai_agents
  rubric_ref: rubric/ai_agents_aiagents_known_prompt_medium@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    persona: drupal-expert
    setup: agent-module-documentation/evaluation/verify/ai_agents-known-agent-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/ai_agents-known-agent-cleanup.sh
- id: aiagents-known-maxloops-medium
  input: The AI agent `eval_known_agent` on this site is configured with a maximum loop count (max_loops)
    to prevent infinite loops. Inspect the live configuration with drush and tell me the exact max_loops
    value it is set to.
  criteria: 'eval_known_agent is configured with max_loops: 9. Read back from the live ai_agents.ai_agent.eval_known_agent
    config.'
  bundle: ai_agents
  rubric_ref: rubric/ai_agents_aiagents_known_maxloops_medium@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    persona: drupal-expert
    setup: agent-module-documentation/evaluation/verify/ai_agents-known-agent-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/ai_agents-known-agent-cleanup.sh
- id: aiagents-build-agent-expert
  input: On this Drupal site (drush available), the ai_agents module is installed. Build and SAVE a new
    AI agent config entity that helps editors create and improve content. Give it a label, a description,
    and a system prompt, and grant it at least one tool (an AiFunctionCall / function-call plugin) so
    it can actually act on the site — an agent with no tools can only chat. Apply it to the running site
    via drush/config; do not just describe it. Reply with one line naming the agent you created and its
    tool(s).
  criteria: A new, enabled ai_agent config entity exists on the live site with a non-empty system_prompt
    and at least one tool in its `tools` list. Verified against live site state, not the response text.
  bundle: ai_agents
  rubric_ref: rubric/ai_agents_aiagents_build_agent_expert@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/ai_agents-reset.sh
    verify: agent-module-documentation/evaluation/verify/ai_agents-build-agent.sh
- id: aiagents-build-agent-layman
  input: On my Drupal website I want an AI helper that can actually DO things for me — an assistant that
    can create and edit content on my behalf, not just answer questions. Please set one up on the site
    so it appears in my list of AI agents, give it sensible instructions, and make sure it's allowed to
    use the tools it needs to actually make changes. Tell me in one line what you set up.
  criteria: 'Same verified end state as the expert variant: an enabled ai_agent config entity with a system
    prompt and at least one tool. The agent must map the plain-English request onto the ai_agents module
    and build a real, tool-enabled agent.'
  bundle: ai_agents
  rubric_ref: rubric/ai_agents_aiagents_build_agent_layman@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: layman
    reset: agent-module-documentation/evaluation/verify/ai_agents-reset.sh
    verify: agent-module-documentation/evaluation/verify/ai_agents-build-agent.sh
- id: aiagents-build-router-expert
  input: 'On this Drupal site (drush available, ai_agents installed) build and SAVE a new AI agent config
    entity with the machine name `eval_router`. Its system prompt must make it a routing assistant whose
    job is to decide which other agent should handle an incoming request. Grant it EXACTLY ONE tool: the
    `ai_agent:html_to_markdown` function-call plugin — and no other tools. Apply it to the running site
    via drush/config; do not just describe it. Reply with one line naming the agent and its single tool.'
  criteria: 'An enabled ai_agent config entity with id eval_router exists on the live site, has a non-empty
    routing system_prompt, and grants exactly one tool: ai_agent:html_to_markdown. Verified against live
    site state, not the response text.'
  bundle: ai_agents
  rubric_ref: rubric/ai_agents_aiagents_build_router_expert@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/ai_agents-eval-router-reset.sh
    verify: agent-module-documentation/evaluation/verify/ai_agents-eval-router-verify.sh
