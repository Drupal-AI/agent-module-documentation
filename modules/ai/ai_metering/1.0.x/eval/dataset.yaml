metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: ai_metering
  version: 1.0.x
  note: All recipe (response-graded) — no AI provider/API key needed. These probe module-specific facts
    an agent unfamiliar with ai_metering would have to read source to answer, which is where routing to
    the distilled docs should help.
questions:
- id: aim-set-budget
  input: On this Drupal site using the ai_metering module, what is the exact Drush command (or its alias)
    to set a specific user's monthly AI token budget? Answer with the command.
  criteria: 'drush ai-metering:set-user-budget <uid> <tokens>  (alias: aim-budget)'
  bundle: ai_metering
  rubric_ref: rubric/ai_metering_aim_set_budget@1.0
  tags:
  - mode:recipe
- id: aim-dashboard-permission
  input: In the ai_metering module, which permission machine name lets a user view the AI cost/usage dashboard?
    Give the exact permission.
  criteria: view ai metering dashboard
  bundle: ai_metering
  rubric_ref: rubric/ai_metering_aim_dashboard_permission@1.0
  tags:
  - mode:recipe
- id: aim-pricing-plugin
  input: In ai_metering, what is the plugin type I implement to add a custom source of per-model pricing?
    Name the plugin type.
  criteria: A PricingSource plugin (Plugin/PricingSource, annotation-based).
  bundle: ai_metering
  rubric_ref: rubric/ai_metering_aim_pricing_plugin@1.0
  tags:
  - mode:recipe
- id: aim-record-hook
  input: In ai_metering, which Drupal hook lets me alter a usage record before it is written to the database?
    Give the exact hook function name.
  criteria: hook_ai_metering_record_alter(array &$record)
  bundle: ai_metering
  rubric_ref: rubric/ai_metering_aim_record_hook@1.0
  tags:
  - mode:recipe
- id: aim-usage-table
  input: Where does the ai_metering module store its per-AI-call usage log — name the database table.
  criteria: The ai_metering_usage table (quotas live in ai_metering_quota).
  bundle: ai_metering
  rubric_ref: rubric/ai_metering_aim_usage_table@1.0
  tags:
  - mode:recipe
