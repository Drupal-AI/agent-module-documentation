metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: ai_dashboard
  version: 1.0.x
  note: 'ai_dashboard has no route/permission/config-form of its own: a RouteSubscriber overrides AI Core''s
    ai.settings.menu route (/admin/config/ai, permission ''administer ai'') to render the ''ai_dashboard''
    Dashboard config entity (config dashboard.dashboard.ai_dashboard). Real, drush-manageable state used
    by the cases: (a) that dashboard config entity and its component block settings (Extensions block
    ''module_list_packages'' -> packages; Documentation block ''ai_documentation'' -> soft_limit/hard_limit);
    (b) the ''ai_dashboard_recommended'' Project Browser source installed by hook_install into project_browser.admin_settings.enabled_sources
    (uri + ttl). Introspection cases read those back; execution cases rebuild them and verify live. Components
    are keyed by uuid, so scripts target them by block id, not array index. No fabrication: every fact
    is from src/, config/install, and the .info/.services yml.'
questions:
- id: ai_dashboard-what-it-shows
  input: On a Drupal 11 site, what does the ai_dashboard module do, and what does its dashboard page show?
    Name at least three of the blocks/sections it presents.
  criteria: 'It turns the AI configuration page into a single dashboard for the drupal/ai ecosystem. The
    ''ai_dashboard'' Dashboard config entity lays out six blocks: Setup (add an AI provider + API key),
    Features (recommended AI recipes via Project Browser), Status (provider/operation capability status),
    Extensions (AI module packages list), Configuration (AI admin menu links), and Documentation (AI doc
    links).'
  bundle: ai_dashboard
  rubric_ref: rubric/ai_dashboard_ai_dashboard_what_it_shows@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: ai_dashboard-route-permission
  input: The ai_dashboard module ships no *.routing.yml. At what URL do you reach the AI Dashboard, which
    permission gates it, and how is that page wired up?
  criteria: It has no route of its own. A RouteSubscriber overrides AI Core's ai.settings.menu route (path
    /admin/config/ai, permission 'administer ai') and swaps its controller to AiDashboard::index, which
    renders the ai_dashboard Dashboard config entity. So the dashboard appears at /admin/config/ai, gated
    by 'administer ai'.
  bundle: ai_dashboard
  rubric_ref: rubric/ai_dashboard_ai_dashboard_route_permission@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: ai_dashboard-doc-plugin-type
  input: How can a module add a link to the AI Dashboard's Documentation block without writing PHP? What
    file and which required keys?
  criteria: Ship a {module}.ai_documentation.yml file in the module root. It defines ai_documentation
    YAML plugins discovered by AiDocumentationManager (plugin.manager.ai_documentation); each entry requires
    a 'label' and a 'url' (a 'description' is optional). Missing label/url throws a PluginException.
  bundle: ai_dashboard
  rubric_ref: rubric/ai_dashboard_ai_dashboard_doc_plugin_type@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: ai_dashboard-extensions-packages
  input: On this Drupal site, the AI Dashboard's 'Extensions' block (block plugin module_list_packages,
    on the ai_dashboard dashboard) filters the module list to a specific set of packages. Inspect the
    live dashboard configuration and tell me exactly which package names are currently configured for
    that block.
  criteria: 'In dashboard.dashboard.ai_dashboard the module_list_packages component''s ''packages'' setting
    has been set to: AI, AI Providers, AI Utilities (newline-separated). The distinctive one is ''AI Utilities''.'
  bundle: ai_dashboard
  rubric_ref: rubric/ai_dashboard_ai_dashboard_extensions_packages@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/ai_dashboard-extensions-packages-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/ai_dashboard-extensions-packages-cleanup.sh
- id: ai_dashboard-recommended-source-ttl
  input: The ai_dashboard module registers a Project Browser source named 'ai_dashboard_recommended' (used
    by the dashboard's Features block). Inspect the live site and tell me the cache TTL currently configured
    for that source, and the URI it fetches its recommended recipes from.
  criteria: In project_browser.admin_settings the enabled_sources.ai_dashboard_recommended entry has ttl
    = 4242 and uri = https://git.drupalcode.org/api/v4/projects/196945/repository/files/ai_dashboard_recommended_recipes.yml/raw?ref=HEAD.
  bundle: ai_dashboard
  rubric_ref: rubric/ai_dashboard_ai_dashboard_recommended_source_ttl@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/ai_dashboard-recommended-source-ttl-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/ai_dashboard-recommended-source-ttl-cleanup.sh
- id: ai_dashboard-doc-limit
  input: On this site, the AI Dashboard's Documentation block (block plugin ai_documentation) has been
    customised to change how many links show before the 'show more' toggle. Inspect the live dashboard
    config and tell me the current soft_limit value for that block.
  criteria: In dashboard.dashboard.ai_dashboard the ai_documentation component's soft_limit has been set
    to 7 (default is 4).
  bundle: ai_dashboard
  rubric_ref: rubric/ai_dashboard_ai_dashboard_doc_limit@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/ai_dashboard-doc-limit-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/ai_dashboard-doc-limit-cleanup.sh
- id: ai_dashboard-add-package
  input: On this Drupal site the AI Dashboard is installed. Configure the dashboard's 'Extensions' block
    (the module_list_packages block on the ai_dashboard Dashboard config entity, config dashboard.dashboard.ai_dashboard)
    so that its package filter ALSO includes the package 'AI Tools' in addition to whatever it already
    lists. Apply the change to the live config.
  criteria: The module_list_packages component in dashboard.dashboard.ai_dashboard has 'AI Tools' present
    in its 'packages' setting (the reset removes it, leaving only AI / AI (Experimental) / AI Providers;
    the agent must add it back).
  bundle: ai_dashboard
  rubric_ref: rubric/ai_dashboard_ai_dashboard_add_package@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/ai_dashboard-add-package-reset.sh
    verify: agent-module-documentation/evaluation/verify/ai_dashboard-add-package-verify.sh
- id: ai_dashboard-register-source
  input: 'On this Drupal site the AI Dashboard''s recommended-recipes Project Browser source has been
    removed from configuration. Re-register the ''ai_dashboard_recommended'' source in project_browser.admin_settings
    (enabled_sources) exactly as ai_dashboard''s hook_install does: uri https://git.drupalcode.org/api/v4/projects/196945/repository/files/ai_dashboard_recommended_recipes.yml/raw?ref=HEAD
    and ttl 1. Apply it to the live site.'
  criteria: project_browser.admin_settings.enabled_sources.ai_dashboard_recommended exists with uri =
    the git.drupalcode.org raw ai_dashboard_recommended_recipes.yml URL and ttl = 1 (an integer >= 1).
  bundle: ai_dashboard
  rubric_ref: rubric/ai_dashboard_ai_dashboard_register_source@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/ai_dashboard-register-source-reset.sh
    verify: agent-module-documentation/evaluation/verify/ai_dashboard-register-source-verify.sh
- id: ai_dashboard-set-doc-limit
  input: On this Drupal site, configure the AI Dashboard's Documentation block (the ai_documentation block
    on the ai_dashboard Dashboard config entity, config dashboard.dashboard.ai_dashboard) so that it shows
    6 links before the 'show more' toggle — i.e. set that block's soft_limit to 6. Apply the change to
    the live config.
  criteria: The ai_documentation component in dashboard.dashboard.ai_dashboard has soft_limit = 6 (the
    reset restores it to the default 4; the agent must change it to 6).
  bundle: ai_dashboard
  rubric_ref: rubric/ai_dashboard_ai_dashboard_set_doc_limit@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/ai_dashboard-set-doc-limit-reset.sh
    verify: agent-module-documentation/evaluation/verify/ai_dashboard-set-doc-limit-verify.sh
