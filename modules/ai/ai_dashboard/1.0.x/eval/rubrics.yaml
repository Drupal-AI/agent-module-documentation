rubrics:
- id: ai_dashboard_ai_dashboard_what_it_shows
  version: '1.0'
  applicable_bundles:
  - ai_dashboard
  checks:
  - kind: must_contain_any
    values:
    - Setup
    - provider
    - Extensions
    - Documentation
    - Status
    - Features
    - recommended
  scoring:
    combine: all_pass
- id: ai_dashboard_ai_dashboard_route_permission
  version: '1.0'
  applicable_bundles:
  - ai_dashboard
  checks:
  - kind: must_contain_any
    values:
    - /admin/config/ai
    - admin/config/ai
    - administer ai
    - ai.settings.menu
    - RouteSubscriber
  scoring:
    combine: all_pass
- id: ai_dashboard_ai_dashboard_doc_plugin_type
  version: '1.0'
  applicable_bundles:
  - ai_dashboard
  checks:
  - kind: must_contain_any
    values:
    - ai_documentation.yml
    - ai_documentation
    - label
    - url
  scoring:
    combine: all_pass
- id: ai_dashboard_ai_dashboard_extensions_packages
  version: '1.0'
  applicable_bundles:
  - ai_dashboard
  checks:
  - kind: must_contain_any
    values:
    - AI Utilities
    - AI Providers
  scoring:
    combine: all_pass
- id: ai_dashboard_ai_dashboard_recommended_source_ttl
  version: '1.0'
  applicable_bundles:
  - ai_dashboard
  checks:
  - kind: must_contain_any
    values:
    - '4242'
    - git.drupalcode.org
    - ai_dashboard_recommended_recipes.yml
  scoring:
    combine: all_pass
- id: ai_dashboard_ai_dashboard_doc_limit
  version: '1.0'
  applicable_bundles:
  - ai_dashboard
  checks:
  - kind: must_contain_any
    values:
    - '7'
    - seven
  scoring:
    combine: all_pass
- id: ai_dashboard_ai_dashboard_add_package
  version: '1.0'
  applicable_bundles:
  - ai_dashboard
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
- id: ai_dashboard_ai_dashboard_register_source
  version: '1.0'
  applicable_bundles:
  - ai_dashboard
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
- id: ai_dashboard_ai_dashboard_set_doc_limit
  version: '1.0'
  applicable_bundles:
  - ai_dashboard
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
