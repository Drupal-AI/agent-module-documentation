rubrics:
- id: ai_provider_anthropic_aipanthropic_what_it_is
  version: '1.0'
  applicable_bundles:
  - ai_provider_anthropic
  checks:
  - kind: must_contain_any
    values:
    - AiProvider
    - anthropic
    - Claude
    - provider
  scoring:
    combine: all_pass
- id: ai_provider_anthropic_aipanthropic_operation_types
  version: '1.0'
  applicable_bundles:
  - ai_provider_anthropic
  checks:
  - kind: must_contain_any
    values:
    - chat
    - chat only
    - only chat
  scoring:
    combine: all_pass
- id: ai_provider_anthropic_aipanthropic_api_key_via_key
  version: '1.0'
  applicable_bundles:
  - ai_provider_anthropic
  checks:
  - kind: must_contain_any
    values:
    - key
    - Key
    - key_select
    - /admin/config/ai/providers/anthropic
    - ai_provider_anthropic.settings
  scoring:
    combine: all_pass
- id: ai_provider_anthropic_aipanthropic_moderation
  version: '1.0'
