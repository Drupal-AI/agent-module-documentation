# Generated from evals.json by evaluation/to_commons.py.
# Edit evals.json and rerun the script; do not edit this file.
metadata:
  name: Anthropic Provider
  data_name: ai_provider_anthropic
  module: ai_provider_anthropic
  version: 1.2.x
  note: ai_provider_anthropic registers the 'anthropic' AiProvider plugin for the AI (AI Core) module
    and implements the single 'chat' operation type. It defines no plugin types, no permissions, no drush.
    Cases are `recipe` (response-graded) since they probe documented facts an agent would otherwise read
    source to answer; no site mutation.
questions:
- id: aipanthropic-what-it-is
  input: On a Drupal 11 site running the AI (AI Core) module, what does the ai_provider_anthropic module
    add, and what plugin does it register?
  criteria: It registers the 'anthropic' AiProvider plugin (AnthropicProvider) for AI Core, adapting Anthropic's
    Claude API (api.anthropic.com/v1) to AI Core's operation-type interfaces. It depends on the ai and
    key modules.
  bundle: ai_provider_anthropic
  rubric_ref: rubric/ai_provider_anthropic_aipanthropic_what_it_is@1.0
  tags:
  - mode:recipe
- id: aipanthropic-operation-types
  input: Which AI Core operation types does the Anthropic provider (ai_provider_anthropic) support?
  criteria: getSupportedOperationTypes() returns only 'chat' — Anthropic here is a chat-only provider
    (no embeddings, moderation, image, or speech operations).
  bundle: ai_provider_anthropic
  rubric_ref: rubric/ai_provider_anthropic_aipanthropic_operation_types@1.0
  tags:
  - mode:recipe
- id: aipanthropic-api-key-via-key
  input: How do I configure the Anthropic API key for the ai_provider_anthropic module, and where is the
    settings form?
  criteria: Store the key as a Key entity (key module) and select it in the Anthropic Authentication form
    at /admin/config/ai/providers/anthropic (route ai_provider_anthropic.settings_form, permission 'administer
    ai providers'). Only the Key id is saved in ai_provider_anthropic.settings (api_key), never the raw
    key.
  bundle: ai_provider_anthropic
  rubric_ref: rubric/ai_provider_anthropic_aipanthropic_api_key_via_key@1.0
  tags:
  - mode:recipe
- id: aipanthropic-moderation
  input: Does the Anthropic provider in Drupal do content moderation before a call? How is moderation
    handled?
  criteria: Anthropic has no native moderation endpoint. The optional openai_moderation flag routes prompts
    through the AI External Moderation module using OpenAI's moderation (requires ai_provider_openai +
    ai_external_moderation enabled). If moderation is off, the form makes you acknowledge the ban risk.
  bundle: ai_provider_anthropic
  rubric_ref: rubric/ai_provider_anthropic_aipanthropic_moderation@1.0
  tags:
  - mode:recipe
- id: aipanthropic-default-models
  input: When I save the Anthropic key, which default Claude models does ai_provider_anthropic seed for
    AI Core operation types?
  criteria: 'getSetupData() seeds (via defaultIfNone, only if unset): chat and chat_with_image_vision
    -> a Claude Sonnet 4.5 model (fallback claude-sonnet-4-5-20250929); chat_with_complex_json, chat_with_tools,
    chat_with_structured_response -> a Claude Opus 4.5 model (fallback claude-opus-4-5-20251101).'
  bundle: ai_provider_anthropic
  rubric_ref: rubric/ai_provider_anthropic_aipanthropic_default_models@1.0
  tags:
  - mode:recipe
- id: aipanthropic-model-discovery
  input: How does ai_provider_anthropic know which Claude models are available, and can I control caching?
  criteria: 'It fetches models live from https://api.anthropic.com/v1/models (header anthropic-version:
    2023-06-01) and caches them under ai_provider_anthropic:models for models_cache_ttl seconds (default
    86400). getConfiguredModels() returns them; clearModelsCache() forces a refresh. On failure it returns
    an empty list.'
  bundle: ai_provider_anthropic
  rubric_ref: rubric/ai_provider_anthropic_aipanthropic_model_discovery@1.0
  tags:
  - mode:recipe
- id: aipanthropic-top-p
  input: Why does the Anthropic provider drop the top_p setting for newer Claude models?
  criteria: getModelSettings() unsets top_p for Claude 4.x+ model ids because Anthropic's API does not
    allow temperature and top_p to be specified together.
  bundle: ai_provider_anthropic
  rubric_ref: rubric/ai_provider_anthropic_aipanthropic_top_p@1.0
  tags:
  - mode:recipe
- id: aipanthropic-call-from-code
  input: In PHP, how do I run a chat completion through Anthropic (Claude) on a Drupal AI Core site? Show
    the service and pattern.
  criteria: 'Use the ai.provider service (AiProviderPluginManager): resolve getDefaultProviderForOperationType(''chat'')
    or createInstance(''anthropic''), then call ->chat($input, $model_id, $tags). Never instantiate an
    Anthropic SDK directly.'
  bundle: ai_provider_anthropic
  rubric_ref: rubric/ai_provider_anthropic_aipanthropic_call_from_code@1.0
  tags:
  - mode:recipe
