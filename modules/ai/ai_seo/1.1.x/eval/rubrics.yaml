rubrics:
- id: ai_seo_ai_seo_report_type_entity
  version: '1.0'
  applicable_bundles:
  - ai_seo
  checks:
  - kind: must_contain_any
    values:
    - ai_seo_report_type
    - report type
    - full
    - ai_citability
  scoring:
    combine: all_pass
- id: ai_seo_ai_seo_provider_setting
  version: '1.0'
  applicable_bundles:
  - ai_seo
  checks:
  - kind: must_contain_any
    values:
    - provider_and_model
    - ai_seo.settings
  scoring:
    combine: all_pass
- id: ai_seo_ai_seo_permissions
  version: '1.0'
  applicable_bundles:
  - ai_seo
  checks:
  - kind: must_contain_any
    values:
    - create seo reports
    - view seo reports
  scoring:
    combine: all_pass
- id: ai_seo_ai_seo_which_disabled
  version: '1.0'
  applicable_bundles:
  - ai_seo
  checks:
  - kind: must_contain_any
    values:
    - link_analysis
  scoring:
    combine: all_pass
- id: ai_seo_ai_seo_current_provider
  version: '1.0'
  applicable_bundles:
  - ai_seo
  checks:
  - kind: must_contain_any
    values:
    - evalprovider__evalmodel
    - evalprovider
  scoring:
    combine: all_pass
- id: ai_seo_ai_seo_create_report_type
  version: '1.0'
  applicable_bundles:
  - ai_seo
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
- id: ai_seo_ai_seo_disable_report_type
  version: '1.0'
  applicable_bundles:
  - ai_seo
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
