metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: ai
  version: 1.4.x
  note: All recipe (response-graded) — no AI provider/API key needed, so these run in CI without mutating
    the site or spending on an LLM vendor. Each probes an ai (AI Core) architecture fact an unfamiliar
    agent would otherwise have to read src/ to answer.
questions:
- id: ai-provider-service
  input: In the Drupal ai (AI Core) module, I want to call an LLM from custom code without hard-coding
    a vendor. Which service do I ask for a provider, and what plugin type does that service manage? Name
    both.
  criteria: The ai.provider service (AiProviderPluginManager), which manages AiProvider plugins.
  bundle: ai
  rubric_ref: rubric/ai_ai_provider_service@1.0
  tags:
  - mode:recipe
- id: ai-operation-types
  input: In AI Core (ai), capabilities like chat, embeddings and text-to-image are modeled as a plugin
    type so every provider exposes them the same way. What is that plugin type called?
  criteria: OperationType plugins (e.g. chat, embeddings, text_to_image, moderation), each with a typed
    input/output under src/OperationType/.
  bundle: ai
  rubric_ref: rubric/ai_ai_operation_types@1.0
  tags:
  - mode:recipe
- id: ai-chat-input
  input: In the ai module, to send a chat request you build a typed input object holding message objects,
    then call ->chat() on the provider. Name the input class and the message class.
  criteria: Build a ChatInput containing ChatMessage(role, text) objects, then $provider->chat($input,
    $model_id).
  bundle: ai
  rubric_ref: rubric/ai_ai_chat_input@1.0
  tags:
  - mode:recipe
- id: ai-default-provider-method
  input: In the ai module's provider plugin manager (ai.provider service), which method returns the site's
    configured default provider id and model id for a given operation type such as 'chat'? Give the method
    name.
  criteria: getDefaultProviderForOperationType('chat'), which returns ['provider_id' => ..., 'model_id'
    => ...] or NULL.
  bundle: ai
  rubric_ref: rubric/ai_ai_default_provider_method@1.0
  tags:
  - mode:recipe
- id: ai-keys-via-key-module
  input: Where should AI provider API keys be stored for the Drupal ai module — should I put them in ai.settings
    config? What is the required dependency that handles this?
  criteria: Not in config — ai depends on the Key module; store the API key as a Key entity and select
    it in the provider settings, keeping secrets out of exported config.
  bundle: ai
  rubric_ref: rubric/ai_ai_keys_via_key_module@1.0
  tags:
  - mode:recipe
- id: ai-extend-events-not-hooks
  input: I want to inspect or alter every AI request the ai (AI Core) module makes, just before it calls
    the provider. Does ai provide an ai.api.php hook for this? What is the mechanism and name the relevant
    event.
  criteria: There is no ai.api.php / hook API; use Symfony events. Subscribe to PreGenerateResponseEvent
    (and PostGenerateResponseEvent for the response).
  bundle: ai
  rubric_ref: rubric/ai_ai_extend_events_not_hooks@1.0
  tags:
  - mode:recipe
- id: ai-guardrails-global
  input: In the ai module, I want a content policy applied to EVERY AI request site-wide without writing
    an event subscriber. Which config entity groups the policy, and which ai.settings key applies it globally?
  criteria: Create an ai_guardrail_set (of ai_guardrail entities) and list it under ai.settings:global_guardrails.
  bundle: ai
  rubric_ref: rubric/ai_ai_guardrails_global@1.0
  tags:
  - mode:recipe
- id: ai-function-call-plugin
  input: In AI Core (ai), to expose a piece of Drupal logic as a 'tool' the LLM can invoke via function
    calling, which plugin type do I implement and in which Plugin/ namespace do the classes live?
  criteria: 'Implement a FunctionCall plugin (attribute #[FunctionCall]) under Plugin/AiFunctionCall.'
  bundle: ai
  rubric_ref: rubric/ai_ai_function_call_plugin@1.0
  tags:
  - mode:recipe
- id: ai-allowed-hosts
  input: In the ai module's ai.settings, which setting key restricts the outbound hosts that AI providers
    are permitted to call (an allow-list for egress)? Name the exact key.
  criteria: The allowed_hosts setting in ai.settings (an array; empty by default).
  bundle: ai
  rubric_ref: rubric/ai_ai_allowed_hosts@1.0
  tags:
  - mode:recipe
- id: ai-drush-chat
  input: On this Drupal site with the ai module, what is the drush command to send a one-off message to
    the default chat provider and print the reply? Give the command.
  criteria: 'drush ai:chat "your message" (aliases: drush chat / drush ai; --provider, --model, --system
    override the defaults).'
  bundle: ai
  rubric_ref: rubric/ai_ai_drush_chat@1.0
  tags:
  - mode:recipe
