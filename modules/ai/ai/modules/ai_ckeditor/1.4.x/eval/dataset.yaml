metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: ai_ckeditor
  version: 1.4.x
  note: All recipe (response-graded) — no AI provider/API key needed. Each probes an ai_ckeditor architecture
    fact an unfamiliar agent would otherwise have to read src/ and the *.yml to answer.
questions:
- id: aickeditor-plugin-type
  input: In the Drupal ai_ckeditor module, I want to add my own AI action to the editor (e.g. 'Expand').
    What plugin type do I implement, in which Plugin/ namespace, and which attribute annotates it?
  criteria: 'Implement an AiCKEditor plugin under Plugin/AiCKEditor with the #[AiCKEditor] attribute;
    extend AiCKEditorPluginBase. Managed by plugin.manager.ai_ckeditor.'
  bundle: ai_ckeditor
  rubric_ref: rubric/ai_ckeditor_aickeditor_plugin_type@1.0
  tags:
  - mode:recipe
- id: aickeditor-enable-in-format
  input: How do I turn on the AI tools in a specific text format in ai_ckeditor? Is there a dedicated
    /admin/config/ai settings page for it?
  criteria: No dedicated route (configure is null). Edit a CKEditor 5 text format at /admin/config/content/formats,
    drag the 'AI CKEditor' button into the active toolbar, then enable individual action plugins in the
    'AI tools' section.
  bundle: ai_ckeditor
  rubric_ref: rubric/ai_ckeditor_aickeditor_enable_in_format@1.0
  tags:
  - mode:recipe
- id: aickeditor-permission
  input: In ai_ckeditor, which permission machine name must a role have to use the AI editor tools? Give
    the exact string.
  criteria: use ai ckeditor — it is the _permission on the ai_ckeditor.dialog and ai_ckeditor.do_request
    routes.
  bundle: ai_ckeditor
  rubric_ref: rubric/ai_ckeditor_aickeditor_permission@1.0
  tags:
  - mode:recipe
- id: aickeditor-provider-resolution
  input: When an editor triggers an ai_ckeditor action, how is the AI provider/model chosen? What happens
    if the action has no provider configured?
  criteria: The controller uses the per-action provider stored in the editor config; if none is set it
    falls back to AI Core's default 'chat' provider via getDefaultProviderForOperationType('chat').
  bundle: ai_ckeditor
  rubric_ref: rubric/ai_ckeditor_aickeditor_provider_resolution@1.0
  tags:
  - mode:recipe
- id: aickeditor-request-route
  input: In ai_ckeditor, which route/controller actually performs the AI request and streams text back
    to the editor, and what operation type does it call?
  criteria: Route ai_ckeditor.do_request (/api/ai-ckeditor/request/{editor}/{ai_ckeditor_plugin}) -> Controller\AiRequest::doRequest
    builds a ChatInput/ChatMessage and calls the chat operation, streaming the response.
  bundle: ai_ckeditor
  rubric_ref: rubric/ai_ckeditor_aickeditor_request_route@1.0
  tags:
  - mode:recipe
- id: aickeditor-module-dependencies
  input: Two of the built-in ai_ckeditor action plugins only appear when another module is installed.
    Which plugins, and what makes them conditionally available?
  criteria: 'Tone (ai_ckeditor_tone) and Translate (ai_ckeditor_translate) declare module_dependencies:
    [''taxonomy'']; the plugin manager''s findDefinitions() drops plugins whose module_dependencies aren''t
    installed.'
  bundle: ai_ckeditor
  rubric_ref: rubric/ai_ckeditor_aickeditor_module_dependencies@1.0
  tags:
  - mode:recipe
- id: aickeditor-prompts-config
  input: Where are the default prompt templates for the ai_ckeditor actions (summarize, translate, tone,
    etc.) stored, and how would I edit the summarize prompt?
  criteria: 'In the ai_ckeditor.settings config object under the ''prompts'' mapping (keys: complete,
    modify_prompt, reformat, spellfix, summarise, tone, translate). Edit e.g. drush config:set ai_ckeditor.settings
    prompts.summarise ''...''.'
  bundle: ai_ckeditor
  rubric_ref: rubric/ai_ckeditor_aickeditor_prompts_config@1.0
  tags:
  - mode:recipe
- id: aickeditor-balloon-menu
  input: Besides the toolbar button, ai_ckeditor offers another way to reach AI actions from a text selection.
    What is it and how is it enabled?
  criteria: A contextual balloon menu (ai_ckeditor_balloon_menu / 'AI Balloon Menu' toolbar item, CKEditor5
    plugin ai_balloon_menu.AiBalloonMenu) that appears when text is selected; enabled by adding its button
    to the text format's CKEditor 5 toolbar.
  bundle: ai_ckeditor
  rubric_ref: rubric/ai_ckeditor_aickeditor_balloon_menu@1.0
  tags:
  - mode:recipe
