rubrics:
- id: ai_observability_aiobs_settings_route
  version: '1.0'
  applicable_bundles:
  - ai_observability
  checks:
  - kind: must_contain_any
    values:
    - /admin/config/ai/observability
    - ai_observability.settings
  scoring:
    combine: all_pass
- id: ai_observability_aiobs_two_destinations
  version: '1.0'
  applicable_bundles:
  - ai_observability
  checks:
  - kind: must_contain_any
    values:
    - Drupal Logger
    - OpenTelemetry
  scoring:
    combine: all_pass
- id: ai_observability_aiobs_enable_otel_modules
  version: '1.0'
  applicable_bundles:
  - ai_observability
  checks:
  - kind: must_contain_any
    values:
    - opentelemetry
  scoring:
    combine: all_pass
- id: ai_observability_aiobs_input_output_default_off
  version: '1.0'
  applicable_bundles:
  - ai_observability
  checks:
  - kind: must_contain_any
    values:
    - log_input
    - log_output
  scoring:
    combine: all_pass
- id: ai_observability_aiobs_event_types
  version: '1.0'
  applicable_bundles:
