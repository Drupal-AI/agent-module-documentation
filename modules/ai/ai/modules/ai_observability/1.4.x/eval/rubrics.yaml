  version: '1.0'
  applicable_bundles:
  - ai_observability
  checks:
  - kind: must_contain_any
    values:
    - fallback_log_message_mode
    - placeholder
  scoring:
    combine: all_pass
- id: ai_observability_aiobs_permission
  version: '1.0'
  applicable_bundles:
