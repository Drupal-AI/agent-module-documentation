metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: ai_observability
  version: 1.4.x
  note: All recipe (response-graded) — no AI provider/API key needed. Each probes an ai_observability-specific
    fact an unfamiliar agent would otherwise have to read src/ or config to answer.
questions:
- id: aiobs-settings-route
  input: In the Drupal ai_observability module, at what admin path (and route name) do I configure AI
    logging and OpenTelemetry export?
  criteria: The AI Observability settings form at /admin/config/ai/observability (route ai_observability.settings),
    gated by the 'administer ai observability' permission.
  bundle: ai_observability
  rubric_ref: rubric/ai_observability_aiobs_settings_route@1.0
  tags:
  - mode:recipe
- id: aiobs-two-destinations
  input: Where does the ai_observability module send AI request telemetry — name the two destinations
    it can emit to.
  criteria: It logs AI requests to the Drupal Logger (channel ai_observability) and can export them to
    OpenTelemetry (spans and token-usage metrics).
  bundle: ai_observability
  rubric_ref: rubric/ai_observability_aiobs_two_destinations@1.0
  tags:
  - mode:recipe
- id: aiobs-enable-otel-modules
  input: In ai_observability, I want to export AI requests to OpenTelemetry. Turning on otel_enabled isn't
    enough — which contrib module(s) must be installed for spans and for metrics respectively?
  criteria: Spans require the contrib 'opentelemetry' module; metrics require the 'opentelemetry_metrics'
    module. The OTEL subscribers are only registered when those modules are installed, and the form disables
    the checkboxes otherwise.
  bundle: ai_observability
  rubric_ref: rubric/ai_observability_aiobs_enable_otel_modules@1.0
  tags:
  - mode:recipe
- id: aiobs-input-output-default-off
  input: Does the ai_observability module log the raw prompt input and provider output by default? Which
    config keys control this?
  criteria: No — log_input and log_output both default to false, so raw prompts/responses are not persisted
    unless you opt in via those ai_observability.settings keys.
  bundle: ai_observability
  rubric_ref: rubric/ai_observability_aiobs_input_output_default_off@1.0
  tags:
  - mode:recipe
- id: aiobs-event-types
  input: Which AI Core events can ai_observability be configured to log via its log_event_types setting?
  criteria: PreGenerateResponseEvent, PostGenerateResponseEvent, PostStreamingResponseEvent, and ProviderDisabledEvent
    (the AiLogEventType enum). The first three are enabled by default.
  bundle: ai_observability
  rubric_ref: rubric/ai_observability_aiobs_event_types@1.0
  tags:
  - mode:recipe
- id: aiobs-token-metrics
  input: In ai_observability, what does the OpenTelemetry metrics export actually measure, and by what
    dimensions is it broken down?
  criteria: It exports token usage as OpenTelemetry counters (meter ai_observability.token_usage, metric
    prefix ai_token_usage), with attributes uid, provider, operation_type, and model.
  bundle: ai_observability
  rubric_ref: rubric/ai_observability_aiobs_token_metrics@1.0
  tags:
  - mode:recipe
- id: aiobs-fallback-placeholder-mode
  input: In ai_observability, what does the fallback_log_message_mode setting do, and when should I turn
    it off?
  criteria: When on (default) it writes Drupal-style @placeholder log messages compatible with the core
    logger; turn it off to use PSR-3 {placeholder} style, which is smaller/faster with a structured logger
    such as Logger or Extended Logger.
  bundle: ai_observability
  rubric_ref: rubric/ai_observability_aiobs_fallback_placeholder_mode@1.0
  tags:
  - mode:recipe
- id: aiobs-permission
  input: Which permission machine name gates the ai_observability settings form?
  criteria: 'administer ai observability (restrict access: true).'
  bundle: ai_observability
  rubric_ref: rubric/ai_observability_aiobs_permission@1.0
  tags:
  - mode:recipe
