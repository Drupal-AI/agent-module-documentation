rubrics:
- id: ai_search_ai_search_backend_plugin_id
  version: '1.0'
  applicable_bundles:
  - ai_search
  checks:
  - kind: must_contain_any
    values:
    - search_api_ai_search
  scoring:
    combine: all_pass
- id: ai_search_ai_search_needs_vdb_provider
  version: '1.0'
  applicable_bundles:
  - ai_search
  checks:
  - kind: must_contain_any
    values:
    - AiVdbProvider
    - ai.vdb_provider
  scoring:
    combine: all_pass
- id: ai_search_ai_search_embedding_strategy_plugin_type
  version: '1.0'
  applicable_bundles:
  - ai_search
  checks:
  - kind: must_contain_any
    values:
    - EmbeddingStrategy
  scoring:
    combine: all_pass
- id: ai_search_ai_search_default_strategy
  version: '1.0'
  applicable_bundles:
  - ai_search
  checks:
  - kind: must_contain_any
    values:
    - contextual_chunks
  scoring:
    combine: all_pass
- id: ai_search_ai_search_embeddings_operation_type
  version: '1.0'
  applicable_bundles:
