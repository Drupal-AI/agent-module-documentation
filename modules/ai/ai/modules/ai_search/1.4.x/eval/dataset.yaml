metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: ai_search
  version: 1.4.x
  note: All recipe (response-graded) — no AI provider, vector DB, or API key needed, so these run in CI
    without mutating the site or spending on an LLM/VDB vendor. Each probes an ai_search architecture
    fact an unfamiliar agent would otherwise have to read src/ to answer.
questions:
- id: ai_search-backend-plugin-id
  input: In the Drupal ai_search module I want semantic search. Which Search API backend plugin do I select
    when creating a server, and what does it store content in?
  criteria: Create a Search API server using the AI Search backend (plugin id search_api_ai_search), which
    indexes content into a vector database.
  bundle: ai_search
  rubric_ref: rubric/ai_search_ai_search_backend_plugin_id@1.0
  tags:
  - mode:recipe
- id: ai_search-needs-vdb-provider
  input: Does ai_search store vectors itself, or does it depend on something from AI Core? Which AI Core
    plugin type supplies the actual vector database, and which service manages it?
  criteria: It does not store vectors itself. It delegates to an AiVdbProvider plugin from AI Core (managed
    by the ai.vdb_provider service); you install a VDB provider like Milvus, Pinecone or pgvector separately.
  bundle: ai_search
  rubric_ref: rubric/ai_search_ai_search_needs_vdb_provider@1.0
  tags:
  - mode:recipe
- id: ai_search-embedding-strategy-plugin-type
  input: ai_search defines its own plugin type for how content is chunked and vectorized before indexing.
    What is that plugin type called, and in which Plugin/ namespace do implementations live?
  criteria: 'The EmbeddingStrategy plugin type (attribute #[EmbeddingStrategy]); implementations live
    under Plugin/EmbeddingStrategy and are discovered by the ai_search.embedding_strategy manager.'
  bundle: ai_search
  rubric_ref: rubric/ai_search_ai_search_embedding_strategy_plugin_type@1.0
  tags:
  - mode:recipe
- id: ai_search-default-strategy
  input: In ai_search, which built-in embedding strategy is the default, and what is the id of the alternative
    that produces a single averaged vector per item?
  criteria: Default is contextual_chunks (Enriched Embedding Strategy, one vector per chunk); the single-averaged-vector
    alternative is average_pool (Enriched Composite Embedding).
  bundle: ai_search
  rubric_ref: rubric/ai_search_ai_search_default_strategy@1.0
  tags:
  - mode:recipe
- id: ai_search-embeddings-operation-type
  input: How does ai_search turn a query string into a vector at search time — which AI Core operation
    type and which input class does it use?
  criteria: It uses AI Core's embeddings operation type on the configured provider, building an EmbeddingsInput
    and calling ->embeddings() to get the query vector (the same engine used to index).
  bundle: ai_search
  rubric_ref: rubric/ai_search_ai_search_embeddings_operation_type@1.0
  tags:
  - mode:recipe
- id: ai_search-rag-tool
  input: In ai_search, which FunctionCall (tool) can an LLM/agent invoke to retrieve indexed content for
    RAG, and what is its plugin id?
  criteria: The RAG/Vector Search tool, a FunctionCall plugin with id ai_search:rag_search (function name
    ai_search_rag_search); there is also a rag_action for the AI Assistant API.
  bundle: ai_search
  rubric_ref: rubric/ai_search_ai_search_rag_tool@1.0
  tags:
  - mode:recipe
- id: ai_search-field-indexing-options
  input: After adding fields to an AI Search index in the Search API Fields tab, ai_search asks you to
    pick an indexing role per field. Where is that stored and what module concept controls it?
  criteria: ai_search overrides the Search API index Fields form (AiSearchIndexFieldsForm) to set per-field
    indexing options (main content / contextual / filterable metadata), stored in simple config ai_search.index.<index_id>
    under indexing_options.
  bundle: ai_search
  rubric_ref: rubric/ai_search_ai_search_field_indexing_options@1.0
  tags:
  - mode:recipe
- id: ai_search-access-checks
  input: Does an ai_search vector search respect per-entity view access, and which query option turns
    that off?
  criteria: By default the backend checks entity 'view' access per result for the current user; set the
    query option search_api_bypass_access = TRUE to skip access checks.
  bundle: ai_search
  rubric_ref: rubric/ai_search_ai_search_access_checks@1.0
  tags:
  - mode:recipe
