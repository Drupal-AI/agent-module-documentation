metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: ai_api_explorer
  version: 1.4.x
  note: All recipe (response-graded) — no AI provider/API key needed. Probes ai_api_explorer-specific
    facts (plugin type, routes, permission, purpose) an unfamiliar agent would have to read source to
    answer.
questions:
- id: aiapiexplorer-plugin-type
  input: In the Drupal ai_api_explorer module, what is the plugin type (and its Plugin/ namespace) used
    to add a new explorer form? Name it.
  criteria: 'The AiApiExplorer plugin type (attribute #[AiApiExplorer], namespace Plugin/AiApiExplorer),
    discovered via the plugin.manager.ai_api_explorer manager.'
  bundle: ai_api_explorer
  rubric_ref: rubric/ai_api_explorer_aiapiexplorer_plugin_type@1.0
  tags:
  - mode:recipe
- id: aiapiexplorer-landing-route
  input: In ai_api_explorer, at what admin path do I find the list of AI API explorers, and what is that
    route name?
  criteria: The landing page is /admin/config/ai/explorers, route ai_api_explorer.list_page (ExplorerSetupList::list).
  bundle: ai_api_explorer
  rubric_ref: rubric/ai_api_explorer_aiapiexplorer_landing_route@1.0
  tags:
  - mode:recipe
- id: aiapiexplorer-permission
  input: Which permission machine name gates access to the AI API Explorer forms in the ai_api_explorer
    module? Give the exact permission.
  criteria: access ai prompt
  bundle: ai_api_explorer
  rubric_ref: rubric/ai_api_explorer_aiapiexplorer_permission@1.0
  tags:
  - mode:recipe
- id: aiapiexplorer-dynamic-routes
  input: In ai_api_explorer, how are the individual explorer form routes created, and what path pattern
    do they follow?
  criteria: A route subscriber (AiApiExplorerRouteSubscriber) iterates the AiApiExplorer plugins and registers
    one route per plugin, ai_api_explorer.form.<plugin_id>, at /admin/config/ai/explorers/<plugin_id>.
  bundle: ai_api_explorer
  rubric_ref: rubric/ai_api_explorer_aiapiexplorer_dynamic_routes@1.0
  tags:
  - mode:recipe
- id: aiapiexplorer-purpose
  input: What is the ai_api_explorer submodule for, and is it meant for production use?
  criteria: It provides developer explorer forms to test AI operations (chat, embeddings, moderation,
    image generation, etc.) against configured providers and copy boilerplate code. It is intended for
    development only, not production.
  bundle: ai_api_explorer
  rubric_ref: rubric/ai_api_explorer_aiapiexplorer_purpose@1.0
  tags:
  - mode:recipe
- id: aiapiexplorer-hides-explorers
  input: In ai_api_explorer, why might a given explorer form not appear on the list page, and which plugin
    method controls that?
  criteria: An explorer is hidden when its plugin's isActive() returns FALSE — typically because no installed
    provider supports that operation type. The list page and the access checker both skip inactive explorers.
  bundle: ai_api_explorer
  rubric_ref: rubric/ai_api_explorer_aiapiexplorer_hides_explorers@1.0
  tags:
  - mode:recipe
- id: aiapiexplorer-config-form
  input: Does the ai_api_explorer module provide its own settings/config form or config entities?
  criteria: No. The module has no settings form, no configure route, and no config entities; its behavior
    is driven entirely by which AI providers/operation types are installed.
  bundle: ai_api_explorer
  rubric_ref: rubric/ai_api_explorer_aiapiexplorer_config_form@1.0
  tags:
  - mode:recipe
