metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: ai_assistant_api
  version: 1.4.x
  note: All recipe (response-graded) — no AI provider/API key needed, so these run in CI without an LLM
    vendor. Each probes an ai_assistant_api-specific fact an unfamiliar agent would otherwise have to
    read src/ to answer.
questions:
- id: aiassistant-config-entity
  input: In the Drupal ai_assistant_api module, what is the config entity type id used to define an assistant,
    and at what admin path (route) do you manage them?
  criteria: The ai_assistant config entity, managed at /admin/config/ai/ai-assistant (route entity.ai_assistant.collection).
  bundle: ai_assistant_api
  rubric_ref: rubric/ai_assistant_api_aiassistant_config_entity@1.0
  tags:
  - mode:recipe
- id: aiassistant-runner-service
  input: In ai_assistant_api, which service do I use to run an assistant from custom code, and which method
    executes one turn and returns the response?
  criteria: The ai_assistant_api.runner service (AiAssistantApiRunner); set the assistant and a UserMessage,
    then call process() which returns a ChatOutput.
  bundle: ai_assistant_api
  rubric_ref: rubric/ai_assistant_api_aiassistant_runner_service@1.0
  tags:
  - mode:recipe
- id: aiassistant-action-plugin-type
  input: In ai_assistant_api, to let the LLM trigger a piece of Drupal logic, which plugin type do I implement
    and in which Plugin/ namespace do the classes live?
  criteria: 'Implement an AiAssistantAction plugin (attribute #[AiAssistantAction]) under Plugin/AiAssistantAction;
    the manager is ai_assistant_api.action_plugin.manager.'
  bundle: ai_assistant_api
  rubric_ref: rubric/ai_assistant_api_aiassistant_action_plugin_type@1.0
  tags:
  - mode:recipe
- id: aiassistant-permission
  input: In ai_assistant_api, which permission machine name gates administering AI Assistants? Give the
    exact permission.
  criteria: administer ai_assistant
  bundle: ai_assistant_api
  rubric_ref: rubric/ai_assistant_api_aiassistant_permission@1.0
  tags:
  - mode:recipe
- id: aiassistant-default-provider
  input: In an ai_assistant_api assistant, what value do I set for the llm_provider field so the assistant
    uses the site's configured default chat provider/model instead of a fixed one?
  criteria: Set llm_provider to __default__; the runner then resolves it via ai.provider getDefaultProviderForOperationType('chat').
  bundle: ai_assistant_api
  rubric_ref: rubric/ai_assistant_api_aiassistant_default_provider@1.0
  tags:
  - mode:recipe
- id: aiassistant-system-prompt-override
  input: I edited an ai_assistant's system_prompt but the module keeps using its own bundled prompt from
    resources/system_prompt.txt. Which site setting must I enable so my stored system prompt is used?
  criteria: Set $settings['ai_assistant_custom_prompts'] = TRUE; otherwise the runner overrides the entity's
    system_prompt with the module's resources/system_prompt.txt.
  bundle: ai_assistant_api
  rubric_ref: rubric/ai_assistant_api_aiassistant_system_prompt_override@1.0
  tags:
  - mode:recipe
- id: aiassistant-system-role-event
  input: In ai_assistant_api I want to rewrite the assistant's final system prompt at runtime without
    subclassing. Does it expose an .api.php hook? What mechanism and which event should I use?
  criteria: No .api.php hook; subscribe to the Symfony event AiAssistantSystemRoleEvent (event name ai_assistant.change_assistant_message).
  bundle: ai_assistant_api
  rubric_ref: rubric/ai_assistant_api_aiassistant_system_role_event@1.0
  tags:
  - mode:recipe
- id: aiassistant-agent-delegation
  input: In ai_assistant_api, which entity field makes an assistant delegate its turn to an ai_agents
    agent, and which service performs that delegation?
  criteria: Set the assistant's ai_agent field (requires the ai_agents module); the runner then delegates
    to the ai_assistant_api.agent_runner service (AgentRunner::runAsAgent).
  bundle: ai_assistant_api
  rubric_ref: rubric/ai_assistant_api_aiassistant_agent_delegation@1.0
  tags:
  - mode:recipe
