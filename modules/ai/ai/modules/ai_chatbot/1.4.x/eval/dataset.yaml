metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: ai_chatbot
  version: 1.4.x
  note: All recipe (response-graded) — no AI provider/API key needed, so these run in CI without mutating
    the site or spending on an LLM vendor. Each probes an ai_chatbot-specific fact an unfamiliar agent
    would otherwise have to read the submodule source to answer.
questions:
- id: aichatbot-block-plugin-id
  input: In the Drupal ai_chatbot module, I want to add the chatbot to a page. What is the block plugin
    id I place, and where do I place it (there is no dedicated settings page)?
  criteria: Place the ai_deepchat_block block ("AI DeepChat Chatbot", category AI) via the core Block
    layout UI at /admin/structure/block; there is no admin settings form of its own.
  bundle: ai_chatbot
  rubric_ref: rubric/ai_chatbot_aichatbot_block_plugin_id@1.0
  tags:
  - mode:recipe
- id: aichatbot-requires-assistant
  input: The ai_chatbot module is a frontend only. Which module/entity actually supplies the AI behaviour
    that a chatbot block talks to, and is it a hard dependency?
  criteria: It fronts the ai_assistant_api submodule (a hard dependency); each block is pointed at an
    ai_assistant config entity you create there.
  bundle: ai_chatbot
  rubric_ref: rubric/ai_chatbot_aichatbot_requires_assistant@1.0
  tags:
  - mode:recipe
- id: aichatbot-permission
  input: In ai_chatbot, which permission machine name gates the AJAX endpoints the chat widget POSTs to
    (e.g. /api/deepchat)? Give the exact permission.
  criteria: access deepchat api
  bundle: ai_chatbot
  rubric_ref: rubric/ai_chatbot_aichatbot_permission@1.0
  tags:
  - mode:recipe
- id: aichatbot-commonmark
  input: Chatbot replies from ai_chatbot show up as raw Markdown instead of formatted text. Which optional
    library must I install to fix this?
  criteria: Install league/commonmark (composer require league/commonmark); ai_chatbot uses it to convert
    assistant Markdown to HTML.
  bundle: ai_chatbot
  rubric_ref: rubric/ai_chatbot_aichatbot_commonmark@1.0
  tags:
  - mode:recipe
- id: aichatbot-deepchat-frontend
  input: What third-party JavaScript chat component does the ai_chatbot module render its widget with,
    and how is it configured from Drupal?
  criteria: 'The Deep Chat web component (bundled deepchat.bundle.js), configured from PHP via the block''s
    #deepchat_settings render array plus drupalSettings.ai_deepchat.*.'
  bundle: ai_chatbot
  rubric_ref: rubric/ai_chatbot_aichatbot_deepchat_frontend@1.0
  tags:
  - mode:recipe
- id: aichatbot-style-yaml
  input: In ai_chatbot, how do I add a custom visual style (like the bundled chatgpt/bing presets) that
    shows up in the block's Style select — from my theme?
  criteria: 'Add a YAML file with name: and parameters: keys under a deepchat_styles/ folder in your theme
    (or a module registered via hook_ai_chatbot_style_modules); it is auto-scanned and offered as a style
    option.'
  bundle: ai_chatbot
  rubric_ref: rubric/ai_chatbot_aichatbot_style_yaml@1.0
  tags:
  - mode:recipe
- id: aichatbot-settings-hook
  input: In ai_chatbot, which hook lets me alter the attributes/styles passed to the Deep Chat element
    without overriding the block or template?
  criteria: Implement hook_deepchat_settings(array &$deepchat_settings) (also hook_deepchat_buttons_alter
    and hook_deepchat_prepend_message).
  bundle: ai_chatbot
  rubric_ref: rubric/ai_chatbot_aichatbot_settings_hook@1.0
  tags:
  - mode:recipe
- id: aichatbot-toolbar-placement
  input: In the ai_chatbot block, what placement options are available for the chat window, and what happens
    when placement is 'toolbar'?
  criteria: Placement can be toolbar, bottom-right, or bottom-left. Toolbar adds an admin toolbar/top-bar
    button (via hook_toolbar/preprocess_top_bar) that opens the chat and forces the bundled toolbar.yml
    style at 100%/auto size.
  bundle: ai_chatbot
  rubric_ref: rubric/ai_chatbot_aichatbot_toolbar_placement@1.0
  tags:
  - mode:recipe
