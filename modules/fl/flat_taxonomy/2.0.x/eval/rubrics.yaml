rubrics:
- id: flat_taxonomy_flat_taxonomy_how_set
  version: '1.0'
  applicable_bundles:
  - flat_taxonomy
  checks:
  - kind: must_contain_any
    values:
    - Flat taxonomy
    - vocabulary
    - third_party_settings
    - flat_taxonomy
    - taxonomy.vocabulary
  scoring:
    combine: all_pass
- id: flat_taxonomy_flat_taxonomy_enforcement
  version: '1.0'
  applicable_bundles:
  - flat_taxonomy
  checks:
  - kind: must_contain_any
    values:
    - parent
    - Add child
    - drag
    - presave
  scoring:
    combine: all_pass
- id: flat_taxonomy_flat_taxonomy_flatten_existing
  version: '1.0'
  applicable_bundles:
  - flat_taxonomy
  checks:
  - kind: must_contain_any
    values:
    - flatten
    - flat_taxonomy.taxonomy_flattener
    - Flattener
  scoring:
    combine: all_pass
- id: flat_taxonomy_flat_taxonomy_which_vocab
  version: '1.0'
  applicable_bundles:
  - flat_taxonomy
  checks:
  - kind: must_contain_any
    values:
    - flattax_known
  scoring:
    combine: all_pass
- id: flat_taxonomy_flat_taxonomy_is_flat
  version: '1.0'
  applicable_bundles:
  - flat_taxonomy
  checks:
  - kind: must_contain_any
    values:
    - '1'
    - flat
    - 'yes'
    - 'true'
  scoring:
    combine: all_pass
- id: flat_taxonomy_flat_taxonomy_make_flat
  version: '1.0'
  applicable_bundles:
  - flat_taxonomy
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
- id: flat_taxonomy_flat_taxonomy_flatten
  version: '1.0'
  applicable_bundles:
  - flat_taxonomy
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
