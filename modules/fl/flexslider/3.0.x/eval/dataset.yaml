metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: flexslider
  version: 3.0.x
  note: FlexSlider exposes a config entity (optionset), an image field formatter and a Views style (both
    in bundled submodules), a config settings object, and an external JS library requirement. Cases are
    `recipe` (response-graded) since they probe documented facts an agent would otherwise read source
    to answer; no site mutation.
questions:
- id: flexslider-optionset-entity
  input: On a Drupal 11 site, what config entity does the FlexSlider module use to store slider settings,
    and what are its config objects named? How would I create one in code?
  criteria: The `flexslider` config entity (an 'optionset', config prefix `optionset`, so config objects
    are flexslider.optionset.{id}). Create with \Drupal\flexslider\Entity\Flexslider::create(['id'=>...,
    'label'=>...])->save(); create() merges defaults.
  bundle: flexslider
  rubric_ref: rubric/flexslider_flexslider_optionset_entity@1.0
  tags:
  - mode:recipe
- id: flexslider-image-formatter
  input: I want to display a multi-value image field as a FlexSlider slideshow on a node. Which module/formatter
    do I use and what is a key restriction on the field?
  criteria: Enable flexslider_fields and set the field's display format to FlexSlider (formatter id `flexslider`,
    extends core ImageFormatter). It only applies to multi-value image fields.
  bundle: flexslider
  rubric_ref: rubric/flexslider_flexslider_image_formatter@1.0
  tags:
  - mode:recipe
- id: flexslider-views-style
  input: How do I display Views results in a FlexSlider on a Drupal site, and what does the style let
    me choose?
  criteria: Enable flexslider_views and set the view's Format to FlexSlider (style plugin id `flexslider`).
    You choose an optionset, an optional caption field, and a container element ID. Do not also set the
    image field's own formatter to FlexSlider.
  bundle: flexslider
  rubric_ref: rubric/flexslider_flexslider_views_style@1.0
  tags:
  - mode:recipe
- id: flexslider-js-library
  input: FlexSlider isn't working because the JavaScript library is missing. Where must the FlexSlider
    library be installed, and how can I add it with Composer?
  criteria: The external JS library must live at [DRUPAL ROOT]/libraries/flexslider (files jquery.flexslider-min.js,
    flexslider.css). It is suggested via Composer as woothemes/flexslider:~2.0 (or install the woocommerce/flexslider
    library package).
  bundle: flexslider
  rubric_ref: rubric/flexslider_flexslider_js_library@1.0
  tags:
  - mode:recipe
- id: flexslider-carousel-options
  input: Which optionset options do I set to make FlexSlider render a multi-item carousel instead of a
    single-slide-at-a-time slider?
  criteria: Set a non-zero itemWidth and itemMargin (optionally minItems/maxItems) in the optionset to
    create a carousel.
  bundle: flexslider
  rubric_ref: rubric/flexslider_flexslider_carousel_options@1.0
  tags:
  - mode:recipe
- id: flexslider-animation-slideshow
  input: In a FlexSlider optionset, which options control the animation type (fade vs slide) and the auto-advancing
    slideshow, and what are their defaults?
  criteria: animation (default 'fade', or 'slide') sets the transition; slideshow (default true) auto-advances;
    slideshowSpeed (default 7000ms) sets the delay; animationSpeed (default 600ms) the transition duration.
  bundle: flexslider
  rubric_ref: rubric/flexslider_flexslider_animation_slideshow@1.0
  tags:
  - mode:recipe
- id: flexslider-permission
  input: What permission gates administering FlexSlider optionsets and settings on a Drupal site?
  criteria: The single 'administer flexslider' permission gates all optionset admin routes and the advanced
    settings form.
  bundle: flexslider
  rubric_ref: rubric/flexslider_flexslider_permission@1.0
  tags:
  - mode:recipe
- id: flexslider-configure-route
  input: What is the admin path and route for managing FlexSlider optionsets, and where are the debug/CSS
    toggles?
  criteria: Optionsets are managed at /admin/config/media/flexslider (route entity.flexslider.collection,
    the module's configure route). Debug (unminified JS) and CSS toggles are on the advanced settings
    form at /admin/config/media/flexslider/advanced (flexslider.settings).
  bundle: flexslider
  rubric_ref: rubric/flexslider_flexslider_configure_route@1.0
  tags:
  - mode:recipe
