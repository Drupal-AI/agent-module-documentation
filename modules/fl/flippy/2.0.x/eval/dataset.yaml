metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: flippy
  version: 2.0.x
  note: 'Flippy adds a per-content-type prev/next(/first/last/random) node pager. It has NO configure
    route and NO central settings page: every option is set on the content type''s edit form and stored
    in the flippy.settings config object as per-type keys (flippy_<type>, flippy_head_<type>, flippy_prev_label_<type>,
    flippy_custom_sorting_<type>/flippy_sort_<type>/flippy_order_<type>, etc.). Links are computed by
    the flippy.pager service; a buildFlippyQuery event lets others alter the queries; there is also a
    flippy_block block and a flippy theme hook. Medium/hard cases are grounded in flippy.settings: introspection
    reads a configured label and custom sort; execution turns the pager on for Article and enables head
    rel-links, verified against live config.'
questions:
- id: flippy-enable-where
  input: How do I turn on a Flippy previous/next pager for a content type in Drupal, and is there a central
    settings page for it?
  criteria: There is no central settings page and no configure route. You enable it on each content type's
    edit form (/admin/structure/types/manage/<type>) in the 'Flippy settings' section; the choice is saved
    as flippy_<type> in the flippy.settings config object.
  bundle: flippy
  rubric_ref: rubric/flippy_flippy_enable_where@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: flippy-placement
  input: Once Flippy is enabled for the Article content type, how do I control where the previous/next
    pager appears on the node?
  criteria: Enabling Flippy exposes a flippy_pager pseudo-field on the bundle's Manage display page; drag
    it where you want it among the fields. Alternatively place the 'Flippy Block' (flippy_block) in a
    region.
  bundle: flippy
  rubric_ref: rubric/flippy_flippy_placement@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: flippy-service
  input: Which service does Flippy provide to compute the previous/next nodes programmatically, and which
    method returns the neighbour node list?
  criteria: The flippy.pager service (Drupal\flippy\FlippyPager). flippy_build_list($node) returns an
    array keyed first/prev/next/last (and random) of neighbour node ids/titles; flippy_use_pager($node)
    says whether to show it; flippy_generate_link($nid, $label) builds a link.
  bundle: flippy
  rubric_ref: rubric/flippy_flippy_service@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: flippy-prev-label
  input: On this site the Article content type has a Flippy pager configured. Inspect the live Flippy
    configuration and state the label used for the Previous link on Article.
  criteria: flippy.settings:flippy_prev_label_article is 'Older eval post' (and flippy_article is enabled).
  bundle: flippy
  rubric_ref: rubric/flippy_flippy_prev_label@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/flippy-prevlabel-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/flippy-prevlabel-cleanup.sh
- id: flippy-custom-sort
  input: The Article Flippy pager on this site uses a custom sort instead of post date. Inspect the live
    Flippy configuration and state which field it sorts by and in which direction.
  criteria: flippy.settings has flippy_custom_sorting_article true, flippy_sort_article = field_eval_sort,
    flippy_order_article = DESC (descending).
  bundle: flippy
  rubric_ref: rubric/flippy_flippy_custom_sort@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/flippy-sort-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/flippy-sort-cleanup.sh
- id: flippy-enable-article
  input: On this Drupal site, enable a Flippy previous/next pager for the Article content type. Apply
    the change to the live site.
  criteria: flippy.settings:flippy_article is set truthy (e.g. via the Article content type edit form's
    Flippy settings, or drush cset flippy.settings flippy_article 1).
  bundle: flippy
  rubric_ref: rubric/flippy_flippy_enable_article@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/flippy-enable-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/flippy-enable-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/flippy-enable-verify.sh
- id: flippy-head-links
  input: The Article content type already has a Flippy pager. Configure it so that Flippy also adds semantic
    previous/next <link> tags (rel=prev / rel=next) to the HTML document head. Apply the change to the
    live site.
  criteria: flippy.settings:flippy_head_article is set truthy (the 'Add semantic previous and next links
    to the document HEAD' option), with flippy_article still enabled.
  bundle: flippy
  rubric_ref: rubric/flippy_flippy_head_links@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/flippy-head-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/flippy-head-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/flippy-head-verify.sh
