metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: flexible_permissions
  version: 2.0.x
  note: 'Flexible permissions is a developer API (no UI, no config, no permissions, no plugin manager).
    Cases are `recipe` (response-graded): they probe documented facts an agent would otherwise read source
    to answer — the extensibility mechanism (tagged service / Access Policy), the scope + calculated-permission
    value objects, the chain calculator and checker services, VariationCache caching, and that Group depends
    on it. No site mutation.'
questions:
- id: flexperm-register-calculator
  input: On a Drupal 11 site using Flexible permissions, how do I register a custom permission calculator
    so the chain picks it up? Name the interface to implement and the service tag.
  criteria: There is no annotation/attribute plugin type. Implement PermissionCalculatorInterface (or
    extend PermissionCalculatorBase) and tag the service `flexible_permission_calculator` so the service_collector
    adds it to flexible_permissions.chain_calculator; in 2.0.x you can instead provide a core Access Policy
    tagged `access_policy`.
  bundle: flexible_permissions
  rubric_ref: rubric/flexible_permissions_flexperm_register_calculator@1.0
  tags:
  - mode:recipe
- id: flexperm-plugin-type
  input: Does Flexible permissions define a Drupal plugin type (annotation/attribute plugin with a plugin
    manager) for its permission calculators?
  criteria: No. Calculators are plain tagged services (tag flexible_permission_calculator) gathered by
    a service_collector into the ChainPermissionCalculator — there is no plugin manager, annotation or
    attribute; 2.0.x also bridges to core's Access Policy API.
  bundle: flexible_permissions
  rubric_ref: rubric/flexible_permissions_flexperm_plugin_type@1.0
  tags:
  - mode:recipe
- id: flexperm-scope-item
  input: In Flexible permissions, what does a CalculatedPermissionsItem hold, and what is a 'scope'? Include
    its constructor arguments.
  criteria: 'A CalculatedPermissionsItem holds a scope name, an identifier within that scope, a list of
    permission strings, and an isAdmin flag (admin grants everything in the scope). Constructor: new CalculatedPermissionsItem($scope,
    $identifier, $permissions, $is_admin = FALSE). A scope is a string namespace for permissions (e.g.
    Group''s group_outsider/group_insider/group_individual).'
  bundle: flexible_permissions
  rubric_ref: rubric/flexible_permissions_flexperm_scope_item@1.0
  tags:
  - mode:recipe
- id: flexperm-check-service
  input: On a Drupal site with Flexible permissions, which service and method do I call to check whether
    an account has a given permission within a scope and identifier?
  criteria: Use the flexible_permissions.checker service (PermissionChecker) and call hasPermissionInScope($permission,
    $scope, $identifier, $account).
  bundle: flexible_permissions
  rubric_ref: rubric/flexible_permissions_flexperm_check_service@1.0
  tags:
  - mode:recipe
- id: flexperm-chain-service
  input: Which service in Flexible permissions runs all registered calculators and returns the calculated
    permissions for an account in a scope, and what does it return?
  criteria: The flexible_permissions.chain_calculator service (ChainPermissionCalculator); call calculatePermissions($account,
    $scope), which returns an immutable CalculatedPermissions (CalculatedPermissionsInterface).
  bundle: flexible_permissions
  rubric_ref: rubric/flexible_permissions_flexperm_chain_service@1.0
  tags:
  - mode:recipe
- id: flexperm-caching
  input: How does Flexible permissions cache calculated permissions so that conditional (e.g. office-hours)
    permissions are served correctly, and how do I flush them all?
  criteria: It uses core's VariationCache, varying by the persistent cache contexts each calculator declares
    in getPersistentCacheContexts(); every result carries the `flexible_permissions` cache tag, so invalidating
    that tag flushes all calculated permissions.
  bundle: flexible_permissions
  rubric_ref: rubric/flexible_permissions_flexperm_caching@1.0
  tags:
  - mode:recipe
- id: flexperm-scope-exception
  input: In Flexible permissions, what happens during the build pass if a permission calculator returns
    items for a scope other than the one it was asked to calculate?
  criteria: The ChainPermissionCalculator throws a CalculatedPermissionsScopeException; a calculator may
    only return items for the requested scope (an empty result is allowed).
  bundle: flexible_permissions
  rubric_ref: rubric/flexible_permissions_flexperm_scope_exception@1.0
  tags:
  - mode:recipe
- id: flexperm-group-consumer
  input: Which well-known Drupal contrib module relies on Flexible permissions for its access layer, and
    since when?
  criteria: The Group module relies on Flexible permissions, since Group version 2.0.0, using scopes such
    as group_outsider, group_insider and group_individual.
  bundle: flexible_permissions
  rubric_ref: rubric/flexible_permissions_flexperm_group_consumer@1.0
  tags:
  - mode:recipe
