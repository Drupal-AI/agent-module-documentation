rubrics:
- id: flexible_permissions_flexperm_register_calculator
  version: '1.0'
  applicable_bundles:
  - flexible_permissions
  checks:
  - kind: must_contain_any
    values:
    - flexible_permission_calculator
    - PermissionCalculatorInterface
    - PermissionCalculatorBase
    - access_policy
  scoring:
    combine: all_pass
- id: flexible_permissions_flexperm_plugin_type
  version: '1.0'
  applicable_bundles:
  - flexible_permissions
  checks:
  - kind: must_contain_any
    values:
    - service
    - tag
    - no plugin
    - service_collector
    - collector
  scoring:
    combine: all_pass
- id: flexible_permissions_flexperm_scope_item
  version: '1.0'
  applicable_bundles:
  - flexible_permissions
  checks:
  - kind: must_contain_any
    values:
    - scope
    - identifier
    - isAdmin
    - is_admin
  scoring:
    combine: all_pass
- id: flexible_permissions_flexperm_check_service
  version: '1.0'
  applicable_bundles:
  - flexible_permissions
  checks:
  - kind: must_contain_any
    values:
    - flexible_permissions.checker
    - hasPermissionInScope
    - PermissionChecker
  scoring:
    combine: all_pass
- id: flexible_permissions_flexperm_chain_service
  version: '1.0'
  applicable_bundles:
  - flexible_permissions
  checks:
  - kind: must_contain_any
    values:
    - flexible_permissions.chain_calculator
    - ChainPermissionCalculator
    - calculatePermissions
  scoring:
    combine: all_pass
- id: flexible_permissions_flexperm_caching
  version: '1.0'
  applicable_bundles:
  - flexible_permissions
  checks:
  - kind: must_contain_any
    values:
    - VariationCache
    - getPersistentCacheContexts
    - flexible_permissions
  scoring:
    combine: all_pass
- id: flexible_permissions_flexperm_scope_exception
  version: '1.0'
  applicable_bundles:
  - flexible_permissions
  checks:
  - kind: must_contain_any
    values:
    - CalculatedPermissionsScopeException
    - exception
    - requested scope
  scoring:
    combine: all_pass
- id: flexible_permissions_flexperm_group_consumer
  version: '1.0'
  applicable_bundles:
  - flexible_permissions
  checks:
  - kind: must_contain_any
    values:
    - Group
    - group
  scoring:
    combine: all_pass
