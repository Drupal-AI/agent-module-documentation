metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: flysystem
  version: 2.3.x
  note: Flysystem is configured entirely through settings.php ($settings['flysystem'][<scheme>] = ['driver'=>...,
    'config'=>[...]]) - there is NO Drupal config object and NO configure route (configure=null). To keep
    the eval grounded in LOCAL config with no external service, every medium/hard case uses the built-in
    'local' driver. The setup/reset/cleanup scripts add or remove a clearly-marked block in web/sites/default/settings.php
    via the helper evaluation/verify/flysystem-settings-edit.py and run `drush cr`; they normalise the
    file end so the baseline is restored byte-for-byte. Introspection/verify read live state through the
    flysystem_factory service (getSchemes()/getSettings()) or Settings::get('flysystem'). Scheme names
    may not contain underscores, which is why the scheme ids are flyknown/flyroot/flytask/flypub.
questions:
- id: flysystem-where-configured
  input: I installed the Drupal flysystem module but there is no admin settings page for adding a filesystem
    backend. Where do I declare a Flysystem stream-wrapper scheme, and what is the basic structure (which
    keys) of that declaration?
  criteria: 'Schemes are declared in settings.php: $settings[''flysystem''][''myscheme''] = [''driver''
    => ''<adapter id>'', ''config'' => [...]]. There is no configure route; after editing settings.php
    run `drush cr`. Each key is the stream-wrapper name (no underscores).'
  bundle: flysystem
  rubric_ref: rubric/flysystem_flysystem_where_configured@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: flysystem-builtin-drivers
  input: Which filesystem adapter drivers does the flysystem module ship with out of the box (without
    installing an extra contrib module), and what is the 'driver' value used for a plain local directory?
  criteria: Built-in drivers are 'local' and 'ftp' (FTP needs the PHP ftp extension). A local directory
    uses 'driver' => 'local'. Remote backends like s3v2, sftp, dropbox, gcs come from separate contrib
    modules.
  bundle: flysystem
  rubric_ref: rubric/flysystem_flysystem_builtin_drivers@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: flysystem-adapter-plugin-type
  input: In the flysystem module, how do you add support for a brand-new storage backend in code? What
    plugin type / annotation and interface do you implement, and where does the class live?
  criteria: 'Create an adapter plugin: a class in your module''s src/Flysystem/ annotated with @Adapter(id
    = "...") implementing Drupal\flysystem\Plugin\FlysystemPluginInterface (getAdapter/getExternalUrl/ensure),
    discovered by plugin.manager.flysystem. Sites then reference it via ''driver'' => ''yourid''.'
  bundle: flysystem
  rubric_ref: rubric/flysystem_flysystem_adapter_plugin_type@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: flysystem-scheme-known
  input: This Drupal site has exactly one Flysystem scheme configured. Inspect the running site and state
    the scheme (stream-wrapper) name and which driver it uses.
  criteria: The scheme is 'flyknown' and it uses the 'local' driver. Find it with `drush php:eval 'print
    implode(",", \Drupal::service("flysystem_factory")->getSchemes());'` and read its driver from Settings::get('flysystem')['flyknown']['driver'].
  bundle: flysystem
  rubric_ref: rubric/flysystem_flysystem_scheme_known@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/flysystem-scheme-known-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/flysystem-scheme-known-cleanup.sh
- id: flysystem-scheme-root
  input: A Flysystem scheme named 'flyroot' is configured on this site using the local driver. Inspect
    the live configuration and state the root directory path it is configured to use.
  criteria: flyroot's local root is 'sites/default/files/flysystem-eval-data'. Read it from Settings::get('flysystem')['flyroot']['config']['root']
    or flysystem_factory->getSettings('flyroot').
  bundle: flysystem
  rubric_ref: rubric/flysystem_flysystem_scheme_root@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/flysystem-scheme-root-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/flysystem-scheme-root-cleanup.sh
- id: flysystem-create-local
  input: On this Drupal site, configure a Flysystem stream-wrapper scheme named 'flytask' that uses the
    built-in local driver (root it at sites/default/files/flysystem-flytask). Apply the change so the
    running site recognises the scheme.
  criteria: 'Add to settings.php: $settings[''flysystem''][''flytask''] = [''driver'' => ''local'', ''config''
    => [''root'' => ''sites/default/files/flysystem-flytask'']]; then `drush cr`. flysystem_factory->getSchemes()
    then contains ''flytask'' with driver ''local''.'
  bundle: flysystem
  rubric_ref: rubric/flysystem_flysystem_create_local@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/flysystem-create-local-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/flysystem-create-local-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/flysystem-create-local-verify.sh
- id: flysystem-create-public
  input: On this Drupal site, create a PUBLIC Flysystem scheme named 'flypub' using the local driver,
    rooted at sites/default/files/flysystem-pub, so its files are served at browser-accessible URLs. Apply
    the change to the running site.
  criteria: 'Add to settings.php: $settings[''flysystem''][''flypub''] = [''driver'' => ''local'', ''config''
    => [''root'' => ''sites/default/files/flysystem-pub'', ''public'' => TRUE]]; then `drush cr`. The
    scheme must exist with driver ''local'', config.public TRUE and the given root.'
  bundle: flysystem
  rubric_ref: rubric/flysystem_flysystem_create_public@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/flysystem-create-public-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/flysystem-create-public-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/flysystem-create-public-verify.sh
