metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: feature_toggle
  version: 3.0.x
  note: 'Feature Toggle: feature definitions (name/label/description) live in config feature_toggle.features
    (features.<name>); on/off status lives in the key-value store (collection feature_toggle, key flags
    = [name => bool]), NOT config or state. Services: feature_toggle.feature_manager (FeatureManagerInterface
    - CRUD of Feature value objects) and feature_toggle.feature_status (FeatureStatusInterface - getStatus/setStatus,
    dispatches feature_toggle.update event, clears cache tags feature_toggle_list / feature_toggle:<name>).
    configure route feature_toggle.feature_toggle_form (/admin/config/system/feature_toggle). Drush feature_toggle:set
    NAME 0|1 (alias ftset). Twig feature_toggle_status(). Consumers: Condition plugin feature_toggle,
    Views access plugins feature_toggle_feature/perm_feature/role_feature, route requirement _feature_toggle,
    drupalSettings.feature_toggle.enabled. Permissions: administer feature_toggle, modify feature_toggle
    status. Medium/hard cases create namespaced features (ft_*) via the manager service and read/write
    their config definition and key-value status.'
questions:
- id: feature_toggle-drush-command
  input: On a Drupal site using the feature_toggle module, what Drush command turns a feature on or off
    from the command line, and what arguments does it take?
  criteria: drush feature_toggle:set <name> <value> (alias drush ftset), where <name> is the feature machine
    name and <value> is 1 (on) or 0 (off), e.g. drush feature_toggle:set beta_checkout 1.
  bundle: feature_toggle
  rubric_ref: rubric/feature_toggle_feature_toggle_drush_command@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: feature_toggle-twig
  input: How do I check whether a feature_toggle feature is enabled from inside a Twig template?
  criteria: Use the Twig function feature_toggle_status('feature_name'), which returns a boolean, e.g.
    {% if feature_toggle_status('beta_checkout') %}...{% endif %}.
  bundle: feature_toggle
  rubric_ref: rubric/feature_toggle_feature_toggle_twig@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: feature_toggle-storage-split
  input: In the feature_toggle module, where are feature definitions stored versus where is each feature's
    on/off status stored?
  criteria: Feature definitions (name/label/description) are stored in the config object feature_toggle.features
    under features.<name>. The on/off status is stored separately in the key-value store (collection feature_toggle,
    key 'flags' = [name => bool]) - so toggling a feature is not a config change.
  bundle: feature_toggle
  rubric_ref: rubric/feature_toggle_feature_toggle_storage_split@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: feature_toggle-feature-status
  input: This site has a feature_toggle feature with the machine name ft_known. Inspect the running site
    and state whether ft_known is currently enabled or disabled.
  criteria: ft_known is enabled (on). Its status flag is true in the key-value store (collection feature_toggle,
    key flags), i.e. FeatureStatusInterface::getStatus('ft_known') returns TRUE.
  bundle: feature_toggle
  rubric_ref: rubric/feature_toggle_feature_toggle_feature_status@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/feature_toggle-feature-status-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/feature_toggle-feature-status-cleanup.sh
- id: feature_toggle-which-enabled
  input: This site defines two feature_toggle features, ft_on and ft_off. Inspect the running site and
    state which of the two is currently enabled.
  criteria: ft_on is enabled and ft_off is disabled (per the key-value 'flags' map / FeatureStatusInterface::getStatus).
  bundle: feature_toggle
  rubric_ref: rubric/feature_toggle_feature_toggle_which_enabled@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/feature_toggle-which-enabled-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/feature_toggle-which-enabled-cleanup.sh
- id: feature_toggle-create-feature
  input: Using the feature_toggle module on this site, define a new feature with the machine name ft_task
    (give it a human-readable label). Apply the change to the live site.
  criteria: Add the feature via the feature manager, e.g. \Drupal::service('feature_toggle.feature_manager')->addFeature(new
    Drupal\feature_toggle\Feature('ft_task', 'Task Feature')); (or the UI at /admin/config/system/feature_toggle/add).
    Afterwards FeatureManagerInterface::featureExists('ft_task') is TRUE (config feature_toggle.features.features.ft_task
    exists).
  bundle: feature_toggle
  rubric_ref: rubric/feature_toggle_feature_toggle_create_feature@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/feature_toggle-create-feature-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/feature_toggle-create-feature-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/feature_toggle-create-feature-verify.sh
- id: feature_toggle-enable-feature
  input: This site has a feature_toggle feature ft_switch that is currently turned off. Turn it on and
    apply the change to the live site.
  criteria: Enable it, e.g. drush feature_toggle:set ft_switch 1 (or FeatureStatusInterface::setStatus($feature,
    TRUE)). Afterwards FeatureStatusInterface::getStatus('ft_switch') returns TRUE (the key-value flag
    is true).
  bundle: feature_toggle
  rubric_ref: rubric/feature_toggle_feature_toggle_enable_feature@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/feature_toggle-enable-feature-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/feature_toggle-enable-feature-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/feature_toggle-enable-feature-verify.sh
