metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: fences_presets
  version: 3.0.x
  note: fences_presets is a submodule of fences. It adds a `fences_preset` config entity bundling the
    eight Fences wrapper values under a name, plus a non-persisted 'Select Preset' dropdown injected into
    each field's Fences settings via hook_fences_field_formatter_third_party_settings_form_alter. Cases
    are `recipe` (response-graded documented facts); no site mutation.
questions:
- id: fences-presets-what
  input: On a Drupal site using the Fences module, I keep setting the same wrapper tags on many fields.
    Which Fences submodule lets me save a reusable named bundle of those tag settings, what entity type
    does it add, and where do I manage them?
  criteria: Enable the fences_presets submodule (part of the fences project). It adds a `fences_preset`
    config entity; manage them at Configuration > User interface > Fences > Presets (route entity.fences_preset.collection),
    gated by the `administer fences_preset` permission.
  bundle: fences_presets
  rubric_ref: rubric/fences_presets_fences_presets_what@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: fences-presets-defaults
  input: Which presets does the Fences Presets submodule ship out of the box, and what does the 'Inline'
    preset do to a field's markup?
  criteria: 'It ships four default presets: default, inline, inline_label, and none. The ''inline'' preset
    sets the field tag to `span` and the item, label, and items-wrapper tags to `none`, so multiple inline
    fields render next to each other with no block wrappers.'
  bundle: fences_presets
  rubric_ref: rubric/fences_presets_fences_presets_defaults@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: fences-presets-not-persisted
  input: When I pick a preset from the 'Select Preset' dropdown on a field's Fences settings, is the field
    permanently linked to that preset? How does applying a preset actually work in fences_presets?
  criteria: No — the preset selector is not persisted (it is rendered via an inline_template specifically
    so its value is not saved). Selecting a preset just runs JavaScript that copies the preset's tag values
    into the field's real Fences settings controls, which you then save normally. It is a one-shot template,
    not a live link, so editing the preset later does not change fields that used it. The selector and
    preset data are injected via hook_fences_field_formatter_third_party_settings_form_alter.
  bundle: fences_presets
  rubric_ref: rubric/fences_presets_fences_presets_not_persisted@1.0
  tags:
  - mode:recipe
  - difficulty:easy
