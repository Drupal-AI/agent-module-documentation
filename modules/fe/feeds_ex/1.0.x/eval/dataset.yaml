metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: feeds_ex
  version: 1.0.x
  note: feeds_ex is a beta add-on that provides Feeds Parser plugins (XPath XML/HTML, JSONPath, JMESPath,
    QueryPath) plus expression-driven custom sources. It defines no plugin type and no admin route; parsers
    are configured on a Feeds feed type. Cases are `recipe` (response-graded) probing documented facts
    an agent would otherwise read source to answer; no site mutation.
questions:
- id: feeds_ex-what-parsers
  input: On a Drupal 11 site with the feeds_ex module, which parser plugin do I choose on a Feeds feed
    type to import a non-RSS XML document using XPath, and to import a JSON API response? Give the parser
    ids.
  criteria: The `xml` parser (XML via XPath) for XML; for JSON use `jsonpath` (JSONPath) or `jmespath`
    (JMESPath). `html` handles HTML via XPath.
  bundle: feeds_ex
  rubric_ref: rubric/feeds_ex_feeds_ex_what_parsers@1.0
  tags:
  - mode:recipe
- id: feeds_ex-context-vs-source
  input: How does a feeds_ex parser know which repeating item to import versus how to fill each field?
    Describe the two kinds of expression.
  criteria: A single `context` expression selects the repeating item (each match = one imported item);
    a per-mapping-source `value` expression, evaluated relative to the context item, extracts each field.
  bundle: feeds_ex
  rubric_ref: rubric/feeds_ex_feeds_ex_context_vs_source@1.0
  tags:
  - mode:recipe
- id: feeds_ex-depends-on-feeds
  input: What module must be installed for feeds_ex to work, and does feeds_ex define its own parser plugin
    type?
  criteria: It depends on the Feeds module (feeds:feeds) and does NOT define a plugin type — it provides
    @FeedsParser plugin instances for Feeds' existing `parser` plugin type.
  bundle: feeds_ex
  rubric_ref: rubric/feeds_ex_feeds_ex_depends_on_feeds@1.0
  tags:
  - mode:recipe
- id: feeds_ex-jsonpath-library
  input: The JSONPath parsers in feeds_ex need an external PHP library. Which Composer package provides
    it, and what happens if it is missing?
  criteria: softcreatr/jsonpath (namespace Flow\JSONPath). If missing, the parser throws a RuntimeException
    that the JSONPath library is not installed. Installing feeds_ex via Composer pulls it in.
  bundle: feeds_ex
  rubric_ref: rubric/feeds_ex_feeds_ex_jsonpath_library@1.0
  tags:
  - mode:recipe
- id: feeds_ex-jmespath-library
  input: Which external library do the feeds_ex JMESPath parsers (`jmespath`, `jmespathlines`) require,
    and what Composer command adds it?
  criteria: mtdowling/jmespath.php (^2.0), e.g. `composer require mtdowling/jmespath.php:^2.0`. QueryPath
    parsers instead need gravitypdf/querypath.
  bundle: feeds_ex
  rubric_ref: rubric/feeds_ex_feeds_ex_jmespath_library@1.0
  tags:
  - mode:recipe
- id: feeds_ex-json-lines
  input: I have a JSON-Lines (newline-delimited JSON) feed. Which feeds_ex parsers handle it, and which
    setting caps how many lines are read?
  criteria: Use `jsonpathlines` (JSONPath) or `jmespathlines` (JMESPath); the `line_limit` setting (default
    100) controls how many lines/rows are read per batch.
  bundle: feeds_ex
  rubric_ref: rubric/feeds_ex_feeds_ex_json_lines@1.0
  tags:
  - mode:recipe
- id: feeds_ex-settings-keys
  input: Where is a feeds_ex parser configured (is there a dedicated admin page?), and which parser setting
    runs libtidy on messy HTML before parsing?
  criteria: There is no dedicated admin route (configure is null); parsers are configured on the Feeds
    feed type. The `use_tidy` setting (XML/HTML parsers) runs libtidy before parsing; only available when
    PHP's tidy extension is loaded.
  bundle: feeds_ex
  rubric_ref: rubric/feeds_ex_feeds_ex_settings_keys@1.0
  tags:
  - mode:recipe
- id: feeds_ex-querypath-selectors
  input: Which feeds_ex parsers let me extract fields from XML/HTML using CSS/QueryPath selectors instead
    of XPath, and which library do they need?
  criteria: '`querypathxml` and `querypathhtml` use QueryPath/CSS selectors and require the gravitypdf/querypath
    library.'
  bundle: feeds_ex
  rubric_ref: rubric/feeds_ex_feeds_ex_querypath_selectors@1.0
  tags:
  - mode:recipe
