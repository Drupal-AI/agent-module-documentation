metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: features
  version: 3.16.x
  note: 'Features packages configuration into modules via assignment/generation method plugins, a features_bundle
    config entity, the features.manager service, and a set of Drush commands. Cases are `recipe` (response-graded):
    they probe documented facts an agent would otherwise read source to answer; no site mutation.'
questions:
- id: features-export-import-drush
  input: On a Drupal 11 site using the Features module, which drush command exports my active configuration
    into a feature module on disk, and which one re-applies (reverts) that module's config back onto a
    site?
  criteria: drush features:export (aliases fex/fu) writes packages to disk; drush features:import (aliases
    fim/fr) applies/reverts a feature's config back onto the site. features:import:all reverts all overridden
    features.
  bundle: features
  rubric_ref: rubric/features_features_export_import_drush@1.0
  tags:
  - mode:recipe
- id: features-diff-command
  input: Using the Features module, how do I see the difference between a site's active configuration
    and what a feature module has stored in code?
  criteria: drush features:diff <feature> (alias fd) shows active-vs-stored config; red = import would
    overwrite active with code, green = export would update code from active.
  bundle: features
  rubric_ref: rubric/features_features_diff_command@1.0
  tags:
  - mode:recipe
- id: features-bundle-entity
  input: In the Features module, what config entity type namespaces a set of features and stores how the
    assignment pipeline runs, and how do I target a specific one from Drush?
  criteria: The features_bundle config entity (config prefix features.bundle., default bundle shipped
    in config/install). Pass --bundle=<machine_name> to any drush features:* command to act within that
    bundle.
  bundle: features
  rubric_ref: rubric/features_features_bundle_entity@1.0
  tags:
  - mode:recipe
- id: features-assignment-vs-generation
  input: The Features module defines two plugin types. Which plugin type decides which configuration goes
    into which package, and which one writes packages out to disk or an archive? Give the plugin type
    ids and namespaces.
  criteria: Assignment methods (features_assignment_method, Drupal\features\Plugin\FeaturesAssignment)
    group config into packages; generation methods (features_generation_method, Drupal\features\Plugin\FeaturesGeneration)
    write them out — 'write' to disk, 'archive' to a tar.
  bundle: features
  rubric_ref: rubric/features_features_assignment_vs_generation@1.0
  tags:
  - mode:recipe
- id: features-manager-service
  input: In custom PHP on a Drupal 11 site, which Features service do I call to build the config collection,
    load packages, and detect whether a feature's active config has been overridden?
  criteria: 'The features.manager service (Drupal\features\FeaturesManagerInterface): getConfigCollection(),
    getPackages()/loadPackage(), and detectOverrides()/detectMissing() to find drift.'
  bundle: features
  rubric_ref: rubric/features_features_manager_service@1.0
  tags:
  - mode:recipe
- id: features-implement-assignment-method
  input: How do I add a custom rule for how my project's configuration gets grouped into Features packages?
    Which plugin do I implement and where does it live?
  criteria: Implement a features_assignment_method plugin in src/Plugin/FeaturesAssignment extending FeaturesAssignmentMethodBase
    (interface FeaturesAssignmentMethodInterface), with an assignPackages() method; managed by plugin.manager.features_assignment_method.
  bundle: features
  rubric_ref: rubric/features_features_implement_assignment_method@1.0
  tags:
  - mode:recipe
- id: features-vs-core-cmi
  input: On a modern Drupal 11 site, when should I use the Features module versus core configuration sync
    (CMI) with Config Split for moving configuration between environments?
  criteria: Core config sync (CMI) plus Config Split is generally preferred for syncing a whole site between
    environments; Features is best for bundling reusable, distributable config (e.g. for distributions/install
    profiles) into feature modules.
  bundle: features
  rubric_ref: rubric/features_features_vs_core_cmi@1.0
  tags:
  - mode:recipe
- id: features-dependencies
  input: What are the module dependencies of the Drupal Features module (3.16.x)?
  criteria: Depends on core config and the contrib config_update module (drupal/config_update ^2), which
    provides the diff/revert engine Features builds on.
  bundle: features
  rubric_ref: rubric/features_features_dependencies@1.0
  tags:
  - mode:recipe
