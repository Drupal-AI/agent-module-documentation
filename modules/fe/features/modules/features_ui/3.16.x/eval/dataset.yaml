metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: features
  version: 3.16.x
  submodule: features_ui
  note: 'Features UI is the optional admin front end for the Features module: the /admin/config/development/features
    screens for exporting, editing, diffing and downloading feature modules and configuring bundles. Cases
    are `recipe` (response-graded), probing documented UI facts; no site mutation.'
questions:
- id: features-ui-path
  input: After enabling the Features UI submodule on a Drupal 11 site, at what admin path do I manage
    and export feature packages?
  criteria: Admin → Configuration → Development → Features, at /admin/config/development/features (route
    features.export, form FeaturesExportForm).
  bundle: features
  rubric_ref: rubric/features_features_ui_path@1.0
  tags:
  - mode:recipe
- id: features-ui-enable
  input: I have the Features module but see no admin screens for it. How do I get the browser UI for packaging
    configuration?
  criteria: Enable the features_ui submodule (drush en features_ui -y); it is the optional UI and depends
    on features:features. The base module ships no UI of its own.
  bundle: features
  rubric_ref: rubric/features_features_ui_enable@1.0
  tags:
  - mode:recipe
- id: features-ui-diff-screen
  input: Which Features UI screen shows the difference between a site's active configuration and what
    a feature module stores, and what route serves it?
  criteria: The Differences screen (route features.diff, form FeaturesDiffForm) at /admin/config/development/features/diff/{featurename}.
  bundle: features
  rubric_ref: rubric/features_features_ui_diff_screen@1.0
  tags:
  - mode:recipe
- id: features-ui-edit-contents
  input: In the Features admin UI, how do I add or remove individual configuration items from a feature
    package before exporting it?
  criteria: Use the Edit screen (route features.edit, form FeaturesEditForm) at /admin/config/development/features/edit/{featurename};
    the 'Create new feature' action link also routes there.
  bundle: features
  rubric_ref: rubric/features_features_ui_edit_contents@1.0
  tags:
  - mode:recipe
- id: features-ui-bundle-config-route
  input: Which route is the configure/settings entry point of the Features UI submodule for editing feature
    bundles?
  criteria: features.assignment (Configure Bundles, AssignmentConfigureForm) at /admin/config/development/features/bundle/{bundle_name};
    per-method forms (_alter, _base, _core, _exclude, _optional, _profile, _site) branch from it.
  bundle: features
  rubric_ref: rubric/features_features_ui_bundle_config_route@1.0
  tags:
  - mode:recipe
- id: features-ui-permissions
  input: Which permissions gate the Features UI screens? Does the submodule define its own permissions?
  criteria: It defines no permissions of its own; it reuses core permissions — 'export configuration'
    for the main export/download screens and 'administer site configuration' for editing features and
    bundles.
  bundle: features
  rubric_ref: rubric/features_features_ui_permissions@1.0
  tags:
  - mode:recipe
- id: features-ui-download
  input: Can I get a feature module as a downloadable archive from the Features UI instead of writing
    it to disk?
  criteria: Yes — the UI serves a tar archive via the base module's features.export_download route (/admin/config/development/features/download/{uri}),
    using the 'archive' generation method.
  bundle: features
  rubric_ref: rubric/features_features_ui_download@1.0
  tags:
  - mode:recipe
