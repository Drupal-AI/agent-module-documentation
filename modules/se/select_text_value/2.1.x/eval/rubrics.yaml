rubrics:
- id: select_text_value_select_text_value_widget_ids
  version: '1.0'
  applicable_bundles:
  - select_text_value
  checks:
  - kind: must_contain_any
    values:
    - select_string_textfield
    - select_string_textarea
    - select_text_textfield
    - select_text_textarea
  scoring:
    combine: all_pass
- id: select_text_value_select_text_value_select_types
  version: '1.0'
  applicable_bundles:
  - select_text_value
  checks:
  - kind: must_contain_any
    values:
    - checkboxes
    - cardinality
    - multi-value
    - multivalue
  scoring:
    combine: all_pass
- id: select_text_value_select_text_value_custom_value
  version: '1.0'
  applicable_bundles:
  - select_text_value
  checks:
  - kind: must_contain_any
    values:
    - custom_value_label
    - Custom value label
    - Other
  scoring:
    combine: all_pass
- id: select_text_value_select_text_value_known_widget
  version: '1.0'
  applicable_bundles:
  - select_text_value
  checks:
  - kind: must_contain_any
    values:
    - radios
    - radio
  scoring:
    combine: all_pass
- id: select_text_value_select_text_value_custom_vs_locked
  version: '1.0'
  applicable_bundles:
  - select_text_value
  checks:
  - kind: must_contain_any
    values:
    - field_stv_open
  scoring:
    combine: all_pass
- id: select_text_value_select_text_value_set_select
  version: '1.0'
  applicable_bundles:
  - select_text_value
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
- id: select_text_value_select_text_value_set_checkboxes
  version: '1.0'
  applicable_bundles:
  - select_text_value
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
