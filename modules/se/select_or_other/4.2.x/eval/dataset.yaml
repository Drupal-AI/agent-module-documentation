metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: select_or_other
  version: 4.2.x
  note: 'Select (or other) provides two Forms API #type elements and two field widgets, plus per-widget
    settings. Cases are `recipe` (response-graded) probing documented facts an agent would otherwise read
    source to answer; no site mutation.'
questions:
- id: select-or-other-widget-field-types
  input: On a Drupal 11 site I want a select list with an 'Other' write-in option on my fields. Which
    two field widgets does the select_or_other module provide and which field types does each support?
  criteria: select_or_other_list for list_integer/list_float/list_string fields; select_or_other_reference
    for entity_reference fields. Both are labeled 'Select or Other' on Manage form display.
  bundle: select_or_other
  rubric_ref: rubric/select_or_other_select_or_other_widget_field_types@1.0
  tags:
  - mode:recipe
- id: select-or-other-render-elements
  input: 'In a custom Drupal module form I want a select box (or radios/checkboxes) that has an ''Other''
    free-text option. Which Forms API #type values does select_or_other provide?'
  criteria: '#type => ''select_or_other_select'' (renders a <select>) and #type => ''select_or_other_buttons''
    (renders radios for single or checkboxes for multiple).'
  bundle: select_or_other
  rubric_ref: rubric/select_or_other_select_or_other_render_elements@1.0
  tags:
  - mode:recipe
- id: select-or-other-list-allowed-values
  input: Using the select_or_other list widget on a List (text) field, which setting controls whether
    values typed into the 'Other' box get added to the field's allowed values list, and what is its default?
  criteria: The add_other_value_to_allowed_values setting (default true) on the select_or_other_list widget
    adds entered 'other' values to the field storage's allowed_values.
  bundle: select_or_other
  rubric_ref: rubric/select_or_other_select_or_other_list_allowed_values@1.0
  tags:
  - mode:recipe
- id: select-or-other-select-element-type-setting
  input: I want the select_or_other field widget to render as radio buttons/checkboxes instead of a dropdown.
    Which widget setting do I change and what are its two possible values?
  criteria: Set the select_element_type widget setting to select_or_other_buttons (Check boxes/radio buttons);
    the default is select_or_other_select (Select list).
  bundle: select_or_other
  rubric_ref: rubric/select_or_other_select_or_other_select_element_type_setting@1.0
  tags:
  - mode:recipe
- id: select-or-other-reference-autocreate
  input: With the select_or_other reference widget on an entity_reference field, under what condition
    is the 'Other' option offered and what happens when a user enters a value that is not in the list?
  criteria: The 'Other' option is offered only when the field's entity-reference selection handler has
    auto_create enabled and the user has create access; entering a new value auto-creates the referenced
    entity (e.g. a new taxonomy term).
  bundle: select_or_other
  rubric_ref: rubric/select_or_other_select_or_other_reference_autocreate@1.0
  tags:
  - mode:recipe
- id: select-or-other-other-textfield-reveal
  input: How does the select_or_other element show the free-text 'Other' field only after the user selects
    the Other option, and why does the multi-value select case need special handling?
  criteria: 'It uses Form API #states to make the ''other'' textfield visible when the ''- Other -'' choice
    is selected; because core #states does not support multi-value selects, the select variant attaches
    the select_or_other/multiple_select_states_hack JS library instead.'
  bundle: select_or_other
  rubric_ref: rubric/select_or_other_select_or_other_other_textfield_reveal@1.0
  tags:
  - mode:recipe
- id: select-or-other-merged-values
  input: In the select_or_other Forms API element, which property makes the element return a single flat
    array combining the chosen select values and the typed 'other' value?
  criteria: 'Set #merged_values => TRUE so valueCallback returns one flat array merging the select values
    and the ''other'' text (otherwise it returns [''select'' => [...], ''other'' => [...]]).'
  bundle: select_or_other
  rubric_ref: rubric/select_or_other_select_or_other_merged_values@1.0
  tags:
  - mode:recipe
