metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: session_limit
  version: 2.0.x
  note: Session Limit exposes a config settings object, an event-subscriber enforcement service, three
    events, and per-role limits, but defines no permissions or plugins. Cases are `recipe` (response-graded)
    since they probe documented facts an agent would otherwise read source to answer; no site mutation.
questions:
- id: session-limit-purpose
  input: On a Drupal 11 site I want to stop a single user account from being logged in on more than a
    set number of devices at once. Which contrib module does this and what config object holds its settings?
  criteria: The Session Limit module caps simultaneous active sessions per user; settings live in the
    session_limit.settings config object, configured at /admin/config/people/session-limit.
  bundle: session_limit
  rubric_ref: rubric/session_limit_session_limit_purpose@1.0
  tags:
  - mode:recipe
- id: session-limit-max-and-default
  input: Which Session Limit setting sets the site-wide default maximum number of concurrent sessions
    per user, what is its default value, and what value means unlimited?
  criteria: The session_limit_max key on session_limit.settings (default 1) sets the default max sessions;
    0 means unlimited.
  bundle: session_limit
  rubric_ref: rubric/session_limit_session_limit_max_and_default@1.0
  tags:
  - mode:recipe
- id: session-limit-behaviour
  input: In Session Limit, which setting controls what happens when the limit is exceeded, and which value
    blocks the new login versus ending the oldest session versus asking the user?
  criteria: 'session_limit_behaviour on session_limit.settings: 0 = ask the user which session to end
    (default), 1 = drop the oldest session(s), 2 = prevent/block the new session.'
  bundle: session_limit
  rubric_ref: rubric/session_limit_session_limit_behaviour@1.0
  tags:
  - mode:recipe
- id: session-limit-per-role
  input: How do I give a specific role a different (or unlimited) session limit in Session Limit, and
    how is the effective limit chosen when a user has several roles?
  criteria: Per-role overrides are stored in session_limit_roles (role id -> integer limit, -1 = unlimited);
    a user gets the largest applicable role limit, or unlimited if any role is -1, otherwise the default
    session_limit_max.
  bundle: session_limit
  rubric_ref: rubric/session_limit_session_limit_per_role@1.0
  tags:
  - mode:recipe
- id: session-limit-enforcement-service
  input: In Session Limit, which service enforces the limit, what event does it dispatch when a user has
    too many sessions, and on which kernel event does it run?
  criteria: The session_limit service (Drupal\session_limit\Services\SessionLimit) subscribes to KernelEvents::REQUEST
    (priority 32) and dispatches the session_limit.collision event when active sessions exceed the max.
  bundle: session_limit
  rubric_ref: rubric/session_limit_session_limit_enforcement_service@1.0
  tags:
  - mode:recipe
- id: session-limit-bypass-event
  input: I want to programmatically skip the Session Limit check for certain requests in a custom Drupal
    module. Which event do I subscribe to and which method do I call?
  criteria: Subscribe to the session_limit.bypass event (SessionLimitBypassEvent) and call $event->setBypass(TRUE)
    to skip the check for that request.
  bundle: session_limit
  rubric_ref: rubric/session_limit_session_limit_bypass_event@1.0
  tags:
  - mode:recipe
- id: session-limit-disconnect-event
  input: In Session Limit, how can custom code prevent a particular session from being ended, or change
    the logout message a user sees? Which event and methods?
  criteria: Subscribe to session_limit.disconnect (SessionLimitDisconnectEvent); call preventDisconnect(TRUE)
    to keep the session, or setMessage() to change the logout message.
  bundle: session_limit
  rubric_ref: rubric/session_limit_session_limit_disconnect_event@1.0
  tags:
  - mode:recipe
- id: session-limit-permission-and-user1
  input: Which permission gates the Session Limit settings form, and how do I make the limit also apply
    to the User 1 super-admin account?
  criteria: The settings form (route session_limit.config_form) is gated by the core 'administer site
    configuration' permission (the module defines none of its own); enable session_limit_admin_inclusion
    to also limit User 1, who is otherwise never checked.
  bundle: session_limit
  rubric_ref: rubric/session_limit_session_limit_permission_and_user1@1.0
  tags:
  - mode:recipe
