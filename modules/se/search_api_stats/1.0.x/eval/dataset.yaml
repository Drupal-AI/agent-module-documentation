metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: search_api_stats
  version: 1.0.x
  note: 'Search API Stats logs every non-empty-keyword Search API query into its own `search_api_stats`
    DB table via hook_search_api_results_alter(), and registers that table as a Views base table (hook_views_data)
    with a relationship to users. It has no settings form, no configure route, no Drush, no plugin types.
    Its only alter hook is hook_search_api_stats_record_alter() (the ->alter(''search_api_stats_record'',
    $fields) call before insert). The shipped default view is Drupal-7-era code that does NOT load on
    D11, so reporting means building your own View on the search_api_stats base table. All medium/hard
    cases are grounded in that real table/columns and the Views base table: introspection reads back seeded
    rows (a known result count / the top keyword by count); execution builds a View whose base_table is
    search_api_stats, and clears the log table.'
questions:
- id: search_api_stats-how-recorded
  input: On a Drupal 11 site with the search_api_stats module, how does a visitor's keyword search end
    up recorded, and where is it stored? Name the hook that triggers the recording and the database table
    rows are inserted into.
  criteria: search_api_stats implements hook_search_api_results_alter(); after a Search API query with
    non-empty keywords, it inserts one row (server, index, keywords, numfound, uid, timestamp, language,
    ...) into the search_api_stats table.
  bundle: search_api_stats
  rubric_ref: rubric/search_api_stats_search_api_stats_how_recorded@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: search_api_stats-view-reports
  input: I enabled search_api_stats on Drupal 11 but I do not see any search report page. How am I supposed
    to view the recorded statistics, and why is there no ready-made report out of the box?
  criteria: The module exposes the search_api_stats table as a Views base table (hook_views_data) so you
    build your own View on it (e.g. group by keywords for top terms). The bundled default view uses the
    Drupal 7 hook_views_default_views() API and does not load on Drupal 11, so there is no working out-of-the-box
    report.
  bundle: search_api_stats
  rubric_ref: rubric/search_api_stats_search_api_stats_view_reports@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: search_api_stats-record-alter
  input: With search_api_stats, which hook lets another module modify the fields of a search-statistics
    row before it is written to the database (for example to hash the session id or drop a keyword)?
  criteria: 'hook_search_api_stats_record_alter(array &$fields): the module calls \Drupal::moduleHandler()->alter(''search_api_stats_record'',
    $fields) just before the insert, so implementers can rewrite the s_name/i_name/keywords/uid/sid/etc.
    array.'
  bundle: search_api_stats
  rubric_ref: rubric/search_api_stats_search_api_stats_record_alter@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: search_api_stats-known-search
  input: This site's search_api_stats log contains a recorded search for the exact keyword 'sasneedle_zorp'.
    Inspect the live database and tell me how many results (numfound) that recorded search returned.
  criteria: 77 - the row in the search_api_stats table with keywords='sasneedle_zorp' has numfound=77.
  bundle: search_api_stats
  rubric_ref: rubric/search_api_stats_search_api_stats_known_search@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/search_api_stats-known-search-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/search_api_stats-known-search-cleanup.sh
- id: search_api_stats-top-term
  input: Using the search_api_stats log on this site, for the Search API index whose i_name is 'sas_topidx',
    which keyword has been searched the most times? Inspect the live search_api_stats table and give that
    keyword.
  criteria: sasterm_alpha - grouping the search_api_stats rows where i_name='sas_topidx' by keywords and
    counting, sasterm_alpha appears 3 times vs sasterm_beta once.
  bundle: search_api_stats
  rubric_ref: rubric/search_api_stats_search_api_stats_top_term@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/search_api_stats-top-term-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/search_api_stats-top-term-cleanup.sh
- id: search_api_stats-build-view
  input: On this Drupal 11 site, search_api_stats records searches but ships no working report. Create
    a View with the machine id 'sas_report' whose base table is the module's search_api_stats table (so
