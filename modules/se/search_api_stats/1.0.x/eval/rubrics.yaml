rubrics:
- id: search_api_stats_search_api_stats_how_recorded
  version: '1.0'
  applicable_bundles:
  - search_api_stats
  checks:
  - kind: must_contain_any
    values:
    - hook_search_api_results_alter
    - search_api_results_alter
    - search_api_stats
  scoring:
    combine: all_pass
- id: search_api_stats_search_api_stats_view_reports
  version: '1.0'
  applicable_bundles:
  - search_api_stats
  checks:
  - kind: must_contain_any
    values:
    - Views
    - base table
    - views_data
    - search_api_stats
  scoring:
    combine: all_pass
- id: search_api_stats_search_api_stats_record_alter
  version: '1.0'
  applicable_bundles:
  - search_api_stats
  checks:
  - kind: must_contain_any
    values:
    - hook_search_api_stats_record_alter
    - search_api_stats_record
  scoring:
    combine: all_pass
- id: search_api_stats_search_api_stats_known_search
  version: '1.0'
  applicable_bundles:
  - search_api_stats
  checks:
  - kind: must_contain_any
    values:
    - '77'
  scoring:
    combine: all_pass
- id: search_api_stats_search_api_stats_top_term
  version: '1.0'
  applicable_bundles:
  - search_api_stats
  checks:
  - kind: must_contain_any
    values:
    - sasterm_alpha
  scoring:
    combine: all_pass
- id: search_api_stats_search_api_stats_build_view
  version: '1.0'
  applicable_bundles:
  - search_api_stats
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
- id: search_api_stats_search_api_stats_clear_log
  version: '1.0'
  applicable_bundles:
  - search_api_stats
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
