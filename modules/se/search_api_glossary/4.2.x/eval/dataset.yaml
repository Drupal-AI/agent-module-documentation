metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: search_api_glossary
  version: 4.2.x
  note: 'Search API AZ Glossary adds an A-Z first-letter glossary facet to Search API. Its Search API
    processor (id ''glossary'') exposes hidden computed fields glossaryaz_<field> (prefix glossaryaz_)
    holding the first letter/group of a source field, computed by the search_api_glossary.helper service;
    group labels are in config search_api_glossary.settings -> group_prefix (alpha ''A-Z'', numeric ''0-9'',
    special ''#''). It also provides Facets plugins: widget ''glossaryaz'' and processors glossaryaz_all_items_processor
    / glossaryaz_pad_items_processor / glossaryaz_widget_order, plus hook_search_api_glossary_source_alter().
    Depends on search_api + facets. Medium/hard cases are grounded in (a) the group_prefix config object
    (plain config, route-neutral, reliable) and (b) a namespaced Search API index ''sag_glossary_index''
    (db backend, node datasource) on which the glossary processor is enabled - no live index server/query
    is required, only the index+processor config, per the campaign brief.'
questions:
- id: search_api_glossary-processor-field
  input: How does the search_api_glossary module make an A-Z glossary value available to Search API, and
    what is the id of the Search API processor and the naming of the computed field it creates?
  criteria: It provides a Search API processor with id 'glossary' (Glossary processor). For each source
    field you flag as 'glossary' it exposes a hidden computed field named glossaryaz_<field> (prefix glossaryaz_)
    whose value is the uppercased first letter or group of the source value.
  bundle: search_api_glossary
  rubric_ref: rubric/search_api_glossary_search_api_glossary_processor_field@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: search_api_glossary-group-prefix
  input: In the search_api_glossary module, which config object holds the glossary group labels, and what
    are the default labels for alphabetic, numeric and other first characters?
  criteria: 'The search_api_glossary.settings config object holds group_prefix with defaults alpha: ''A-Z'',
    numeric: ''0-9'', special: ''#''. These labels are used when alpha/numeric/other grouping is enabled.'
  bundle: search_api_glossary
  rubric_ref: rubric/search_api_glossary_search_api_glossary_group_prefix@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: search_api_glossary-facets-and-hook
  input: What Facets widget does search_api_glossary provide for rendering the A-Z bar, and which hook
    lets me normalise accented first letters (e.g. so À groups under A)?
  criteria: It provides the Facets widget 'glossaryaz' (Glossary AZ), plus facet processors glossaryaz_all_items_processor,
    glossaryaz_pad_items_processor and glossaryaz_widget_order. Accent/first-letter normalisation is done
    by implementing hook_search_api_glossary_source_alter(&$source_value).
  bundle: search_api_glossary
  rubric_ref: rubric/search_api_glossary_search_api_glossary_facets_and_hook@1.0
  tags:
  - mode:recipe
  - difficulty:easy
