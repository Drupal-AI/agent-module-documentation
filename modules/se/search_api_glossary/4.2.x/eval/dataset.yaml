  criteria: In search_api_glossary.settings, group_prefix.alpha is 'Alphabet' (the label shown for alphabetic
    first letters).
  bundle: search_api_glossary
  rubric_ref: rubric/search_api_glossary_search_api_glossary_introspect_prefix@1.0
