rubrics:
- id: search_api_glossary_search_api_glossary_processor_field
  version: '1.0'
  applicable_bundles:
  - search_api_glossary
  checks:
  - kind: must_contain_any
    values:
    - glossary
    - glossaryaz_
    - processor
  scoring:
    combine: all_pass
- id: search_api_glossary_search_api_glossary_group_prefix
  version: '1.0'
  applicable_bundles:
  - search_api_glossary
  checks:
  - kind: must_contain_any
    values:
    - search_api_glossary.settings
    - group_prefix
    - A-Z
    - 0-9
  scoring:
    combine: all_pass
- id: search_api_glossary_search_api_glossary_facets_and_hook
  version: '1.0'
  applicable_bundles:
  - search_api_glossary
  checks:
  - kind: must_contain_any
    values:
    - glossaryaz
    - Glossary AZ
    - hook_search_api_glossary_source_alter
  scoring:
    combine: all_pass
- id: search_api_glossary_search_api_glossary_introspect_prefix
  version: '1.0'
  applicable_bundles:
  - search_api_glossary
  checks:
  - kind: must_contain_any
    values:
    - Alphabet
  scoring:
    combine: all_pass
- id: search_api_glossary_search_api_glossary_introspect_index
  version: '1.0'
  applicable_bundles:
  - search_api_glossary
  checks:
  - kind: must_contain_any
    values:
    - sag_glossary_index
  scoring:
    combine: all_pass
- id: search_api_glossary_search_api_glossary_enable_processor
  version: '1.0'
  applicable_bundles:
  - search_api_glossary
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
- id: search_api_glossary_search_api_glossary_localise_prefix
  version: '1.0'
  applicable_bundles:
  - search_api_glossary
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
