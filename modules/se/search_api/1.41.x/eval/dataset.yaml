metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: search_api
  version: 1.41.x
  note: 'Search API is a framework module; the load-bearing facts are its two config entities (server/index),
    its plugin type ids + namespaces, the search_api_db backend id, drush command names, and the admin
    permission. Cases span three difficulty tiers: `recipe` (easy, response-graded), `introspection` (medium,
    a setup script installs a known eval_intro_* config and the agent reads it back live), and `execution`
    (hard, the agent builds config that is graded against live site state). Introspection and execution
    cases only ever touch eval_intro_* / eval_* entities — never the site''s existing Solr/Pantheon search
    config.'
questions:
- id: search_api-build-db-index
  input: On this Drupal site (drush available), stand up a working Search API setup backed by the database.
    Create a Search API server named `eval_db_server` using the Database backend, and an index named `eval_index`
    that indexes Article nodes (the node datasource for the article bundle) with at least the node title
    added as an indexed field. Apply it live and index the content; don't just describe it. One-line summary.
  criteria: A search_api_server `eval_db_server` (backend search_api_db) and an enabled search_api_index
    `eval_index` exist, the index writes to that server, uses the entity:node datasource, and has the
    node title added as an indexed field (property path title, type text/string). Verified against live
    site state.
  bundle: search_api
  rubric_ref: rubric/search_api_search_api_build_db_index@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/search_api-reset.sh
    verify: agent-module-documentation/evaluation/verify/search_api-db-index.sh
- id: search_api-index2-title-body
  input: 'On this Drupal site (drush available), stand up a fresh database-backed Search API setup: create
    a server named `eval_server2` (Database backend) and an index named `eval_index2` on the node datasource
    that indexes BOTH the Article title AND the Article body (the rendered/body field) as indexed fields.
    Apply it live and index the content so items are actually indexed; don''t just describe it. One-line
    summary.'
  criteria: A search_api_server `eval_server2` (backend search_api_db) and an enabled search_api_index
    `eval_index2` exist; the index uses the entity:node datasource and has indexed fields for both the
    node title (property path title) and the body (property path body, or a rendered_item), and at least
    one item is indexed. Verified against live site state.
  bundle: search_api
  rubric_ref: rubric/search_api_search_api_index2_title_body@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/search_api-index2-reset.sh
    verify: agent-module-documentation/evaluation/verify/search_api-index2-verify.sh
