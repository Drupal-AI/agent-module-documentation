- id: searchapi-config-entities
  input: In Search API on Drupal 11, which two config entity types tie a search setup together, and what
    does each one hold? Name the entity type machine ids.
  criteria: The Server config entity (search_api_server) chooses a backend plugin + connection settings;
    the Index config entity (search_api_index) chooses datasource(s), the server to write to, a tracker,
    fields, and the processor pipeline.
  bundle: search_api
  rubric_ref: rubric/search_api_searchapi_config_entities@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: searchapi-backend-plugin
  input: I want to write a custom Search API backend for a new search engine. What is the plugin type
    id, the base class I extend, and which directory / namespace does the plugin class live in?
  criteria: 'Plugin type id search_api_backend, extend BackendPluginBase (attribute #[SearchApiBackend]),
    placed in Plugin/search_api/backend/ of the module (namespace Drupal\<module>\Plugin\search_api\backend).'
  bundle: search_api
  rubric_ref: rubric/search_api_searchapi_backend_plugin@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: searchapi-plugin-types
  input: Besides backends, name the Search API plugin types used to (a) provide the source of indexable
    items, (b) transform data at index/search time, and (c) queue which items still need indexing. Give
    the plugin type ids.
  criteria: Datasources (search_api_datasource), processors (search_api_processor), and trackers (search_api_tracker).
  bundle: search_api
  rubric_ref: rubric/search_api_searchapi_plugin_types@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: searchapi-db-backend-id
  input: I want a search server that stores its index in the site's database using the submodule that
    ships with Search API, without installing Solr. Which submodule do I enable and what is its backend
    plugin id that I select on the server?
  criteria: Enable the search_api_db submodule and choose the search_api_db backend on the Server.
  bundle: search_api
  rubric_ref: rubric/search_api_searchapi_db_backend_id@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: searchapi-drush-index-clear
  input: On this Drupal site, give the drush commands to (1) index all tracked items for an index and
    (2) delete/wipe all indexed data for an index.
  criteria: drush search-api:index [INDEX] to index tracked items, and drush search-api:clear [INDEX]
    to delete all indexed data for the index.
  bundle: search_api
  rubric_ref: rubric/search_api_searchapi_drush_index_clear@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: searchapi-permission
  input: Which single permission gates the entire Search API admin UI (creating/configuring servers, indexes,
    fields, processors, trackers)? Give its machine name.
  criteria: The 'administer search_api' permission (defined in search_api.permissions.yml) gates the whole
    admin UI at /admin/config/search/search-api.
  bundle: search_api
  rubric_ref: rubric/search_api_searchapi_permission@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: searchapi-run-query
  input: In PHP on a Drupal 11 site, how do I build and run a Search API keyword search against an index
    config entity named 'default_index' and get the result items? Show the key calls.
  criteria: Load the search_api_index entity, call $index->query() to get a QueryInterface, chain keys()/addCondition()/sort()/range(),
    then $query->execute() returns a ResultSetInterface whose getResultItems() you iterate.
  bundle: search_api
  rubric_ref: rubric/search_api_searchapi_run_query@1.0
  tags:
  - mode:recipe
  - difficulty:easy
