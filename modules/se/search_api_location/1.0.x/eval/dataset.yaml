metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: search_api_location
  version: 1.0.x
  note: 'Search API Location adds geospatial search to Search API. It registers two Search API data types:
    ''location'' (Latitude/Longitude, for search_api_location_views) and ''rpt'' (Spatial Recursive Prefix
    Tree, for facets_map_widget heatmaps); both convert a geofield WKT value to ''lat,lon'' via geoPHP
    centroid at index time. It defines a ''location_input'' plugin type (manager plugin.manager.search_api_location.location_input,
    annotation @LocationInput, base LocationInputPluginBase) with plugins raw and geocode_map (the geocoder
    submodule adds ''geocode''). Distance units km/mi via search_api_location_get_units(); hooks hook_search_api_location_units_alter
    and hook_search_api_location_input_info_alter. The backend must support the data types (Solr known-good;
    DB backend does not). No settings form (configure=search_api.overview); everything is configured on
    a Search API index''s Fields page. Medium/hard cases are grounded in a self-contained Search API index
    (sal_test_index, no server) indexing a geofield (field_sal_geo) as the location/rpt data types - no
    external map/geocoder libraries required.'
questions:
- id: search_api_location-data-types
  input: Which Search API data types does the search_api_location module add, and what is each one used
    for?
  criteria: 'It adds two data types: ''location'' (Latitude/Longitude) used for Views distance filtering/sorting
    (search_api_location_views), and ''rpt'' (Spatial Recursive Prefix Tree) used for facet heatmaps (facets_map_widget).
    Both convert a geofield value to a lat,lon string via geoPHP.'
  bundle: search_api_location
  rubric_ref: rubric/search_api_location_search_api_location_data_types@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: search_api_location-index-geofield
  input: How do I make a geofield searchable by proximity with search_api_location, and what backend requirement
    must I be aware of?
  criteria: On the Search API index's Fields page, add the geofield and set its Type to Latitude/longitude
    (location) for Views, and/or Recursive Prefix Tree (rpt) for heatmap facets. The backend must support
    these spatial data types - Search API Solr does; the database backend does not.
  bundle: search_api_location
  rubric_ref: rubric/search_api_location_search_api_location_index_geofield@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: search_api_location-input-plugins
  input: In search_api_location, how does an end user specify the point to search from, what plugin type
    governs that, and which input plugins ship out of the box?
  criteria: A Location Input plugin (plugin type 'location_input', annotation @LocationInput, manager
    plugin.manager.search_api_location.location_input). The base module ships 'raw' (type lat,lon) and
    'geocode_map' (pick on a map); the search_api_location_geocoder submodule adds 'geocode' (geocode
    an address).
  bundle: search_api_location
  rubric_ref: rubric/search_api_location_search_api_location_input_plugins@1.0
  tags:
  - mode:recipe
  - difficulty:easy
