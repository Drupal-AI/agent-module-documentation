rubrics:
- id: search_api_location_search_api_location_data_types
  version: '1.0'
  applicable_bundles:
  - search_api_location
  checks:
  - kind: must_contain_any
    values:
    - location
    - rpt
    - Latitude/Longitude
    - Recursive Prefix Tree
  scoring:
    combine: all_pass
- id: search_api_location_search_api_location_index_geofield
  version: '1.0'
  applicable_bundles:
  - search_api_location
  checks:
  - kind: must_contain_any
    values:
    - geofield
    - Latitude
    - location
    - rpt
    - Solr
  scoring:
    combine: all_pass
- id: search_api_location_search_api_location_input_plugins
  version: '1.0'
  applicable_bundles:
  - search_api_location
  checks:
  - kind: must_contain_any
    values:
    - location_input
    - raw
    - geocode_map
    - LocationInput
  scoring:
    combine: all_pass
- id: search_api_location_search_api_location_known_location_field
  version: '1.0'
  applicable_bundles:
  - search_api_location
  checks:
  - kind: must_contain_any
    values:
    - sal_loc
  scoring:
    combine: all_pass
- id: search_api_location_search_api_location_known_rpt_field
  version: '1.0'
  applicable_bundles:
  - search_api_location
  checks:
  - kind: must_contain_any
    values:
    - sal_rpt
  scoring:
    combine: all_pass
- id: search_api_location_search_api_location_set_location_type
  version: '1.0'
  applicable_bundles:
  - search_api_location
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
- id: search_api_location_search_api_location_add_rpt_field
  version: '1.0'
  applicable_bundles:
  - search_api_location
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
