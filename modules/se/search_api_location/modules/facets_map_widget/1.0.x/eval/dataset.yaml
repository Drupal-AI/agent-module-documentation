metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: facets_map_widget
  version: 1.0.x
  note: 'Facets Map Widget is a Facets submodule of search_api_location providing an interactive Leaflet
    heatmap facet. It supplies three Facets plugins: a widget (id rpt, ''Interactive map showing the clustered
    heatmap'', getQueryType=search_api_rpt, requires the rpt processor), a processor (id rpt, ''Facets
    Map Processor'', appends the map bounding box to result URLs as (geom:__GEOM__)), and a query type
    (id search_api_rpt). hook_facets_search_api_query_type_mapping_alter registers search_api_rpt only
    when the backend supportsDataType(''rpt''), so it needs an rpt-typed field and a Solr backend. Leaflet
    libraries load from external CDNs. Medium/hard cases are grounded in a locally-created facets_facet
    config entity (salf_heatmap) using the rpt widget/processor - verified by config inspection (widget.type
    and processor_configs), no live map/Solr needed.'
questions:
- id: facets_map_widget-plugins
  input: What does facets_map_widget add to a Search API + Facets site, and what are the ids of the Facets
    widget and query type it provides?
  criteria: It adds an interactive Leaflet map facet showing a clustered heatmap. It provides a Facets
    widget (id rpt, 'Interactive map showing the clustered heatmap'), a Facets processor (id rpt, 'Facets
    Map Processor'), and a Facets query type (id search_api_rpt).
  bundle: facets_map_widget
  rubric_ref: rubric/facets_map_widget_facets_map_widget_plugins@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: facets_map_widget-requirements
  input: What must be true about my Search API index field and backend for the facets_map_widget heatmap
    facet to work?
  criteria: The source field must be indexed with search_api_location's rpt (Spatial Recursive Prefix
    Tree) data type, and the backend must support it - hook_facets_search_api_query_type_mapping_alter
    only registers the search_api_rpt query type when the backend supportsDataType('rpt'). Search API
    Solr is the supported backend.
  bundle: facets_map_widget
  rubric_ref: rubric/facets_map_widget_facets_map_widget_requirements@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: facets_map_widget-map-library
  input: How does the facets_map_widget render its map, which JS library does it use, and how does the
    map narrow the search?
  criteria: The rpt widget outputs a div.facets-map and attaches the facets_map_widget/facets_map library
    (Leaflet + MarkerCluster + geostats + leaflet-hash from external CDNs). The rpt processor appends
    the map's bounding box to result URLs as (geom:__GEOM__), and the search_api_rpt query type converts
    that bounding box into a spatial Search API query.
  bundle: facets_map_widget
  rubric_ref: rubric/facets_map_widget_facets_map_widget_map_library@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: facets_map_widget-known-facet
  input: On this Drupal site, one Facets facet is configured to display results as an interactive map
    heatmap (facets_map_widget). Inspect the facet configuration and give the machine name of that facet.
  criteria: The facet salf_heatmap uses the facets_map_widget map heatmap widget (its widget.type is 'rpt').
  bundle: facets_map_widget
  rubric_ref: rubric/facets_map_widget_facets_map_widget_known_facet@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/facets_map_widget-facet-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/facets_map_widget-facet-cleanup.sh
- id: facets_map_widget-known-widget
  input: On this Drupal site there is a Facets facet named salf_heatmap. Inspect its configuration and
    state which widget type it uses to render.
  criteria: The salf_heatmap facet uses the widget type 'rpt' (the facets_map_widget interactive map heatmap
    widget).
  bundle: facets_map_widget
  rubric_ref: rubric/facets_map_widget_facets_map_widget_known_widget@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/facets_map_widget-facet-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/facets_map_widget-facet-cleanup.sh
- id: facets_map_widget-set-widget
  input: On this Drupal site there is a Facets facet salf_heatmap that currently renders as a plain list
    of links. Using facets_map_widget, change it to display as the interactive map heatmap instead, and
    apply the change to the live site.
  criteria: Set the salf_heatmap facet's widget to the facets_map_widget map widget (widget.type = 'rpt').
    The verify checks the facet's widget.type is 'rpt'.
  bundle: facets_map_widget
  rubric_ref: rubric/facets_map_widget_facets_map_widget_set_widget@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/facets_map_widget-set-widget-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/facets_map_widget-set-widget-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/facets_map_widget-set-widget-verify.sh
- id: facets_map_widget-enable-processor
  input: On this Drupal site, the Facets facet salf_heatmap is set to the interactive map heatmap widget,
    but the map doesn't narrow the search because the required Facets Map Processor is not enabled. Enable
    it and apply the change to the live site.
  criteria: Enable the 'rpt' (Facets Map Processor) processor on the salf_heatmap facet (add it to processor_configs).
    The verify checks the facet's processor_configs contains 'rpt'.
  bundle: facets_map_widget
  rubric_ref: rubric/facets_map_widget_facets_map_widget_enable_processor@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/facets_map_widget-enable-processor-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/facets_map_widget-enable-processor-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/facets_map_widget-enable-processor-verify.sh
