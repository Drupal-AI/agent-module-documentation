rubrics:
- id: facets_map_widget_facets_map_widget_plugins
  version: '1.0'
  applicable_bundles:
  - facets_map_widget
  checks:
  - kind: must_contain_any
    values:
    - rpt
    - search_api_rpt
    - heatmap
    - map
  scoring:
    combine: all_pass
- id: facets_map_widget_facets_map_widget_requirements
  version: '1.0'
  applicable_bundles:
  - facets_map_widget
  checks:
  - kind: must_contain_any
    values:
    - rpt
    - Solr
    - supportsDataType
    - Recursive Prefix Tree
  scoring:
    combine: all_pass
- id: facets_map_widget_facets_map_widget_map_library
  version: '1.0'
  applicable_bundles:
  - facets_map_widget
  checks:
  - kind: must_contain_any
    values:
    - Leaflet
    - leaflet
    - facets_map
    - bounding box
  scoring:
    combine: all_pass
- id: facets_map_widget_facets_map_widget_known_facet
  version: '1.0'
  applicable_bundles:
  - facets_map_widget
  checks:
  - kind: must_contain_any
    values:
    - salf_heatmap
  scoring:
    combine: all_pass
- id: facets_map_widget_facets_map_widget_known_widget
  version: '1.0'
  applicable_bundles:
  - facets_map_widget
  checks:
  - kind: must_contain_any
    values:
    - rpt
  scoring:
    combine: all_pass
- id: facets_map_widget_facets_map_widget_set_widget
  version: '1.0'
  applicable_bundles:
  - facets_map_widget
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
- id: facets_map_widget_facets_map_widget_enable_processor
  version: '1.0'
  applicable_bundles:
  - facets_map_widget
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
