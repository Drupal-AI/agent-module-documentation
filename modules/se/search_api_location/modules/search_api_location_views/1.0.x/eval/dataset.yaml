metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: search_api_location_views
  version: 1.0.x
  note: Search API Location Views adds Views handlers to Search API index fields of data type 'location',
    via hook_views_data_alter. On the location field it exposes a filter (id search_api_location) and
    an argument (search_api_location_point); on the backend-defined <field>__distance pseudo-field it
    exposes a sort (search_api_location_distance) and argument (search_api_location_radius) - the pseudo-field
    only exists on backends like Solr. Medium/hard cases are grounded in a self-contained Search API index
    (salv_index, no server) indexing a geofield (field_salv_geo) as a location field, and are verified
    live by reading the index's Views data (\Drupal::service('views.views_data')->get('search_api_index_salv_index')[...]['filter'|'argument']['id']).
    No external map/geocoder library is required.
questions:
- id: search_api_location_views-handlers
  input: Once a Search API index field is indexed as a location type, which Views handlers does search_api_location_views
    make available for building a proximity search view?
  criteria: 'On the location field: a proximity filter (id search_api_location) and a contextual filter/argument
    (search_api_location_point). On the <field>__distance pseudo-field (Solr): a sort (search_api_location_distance)
    and a radius argument (search_api_location_radius).'
  bundle: search_api_location_views
  rubric_ref: rubric/search_api_location_views_search_api_location_views_handlers@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: search_api_location_views-auto-integration
  input: How does search_api_location_views decide which fields get the proximity Views filter and sort
    - do I configure it anywhere?
  criteria: There is no config UI. It implements hook_views_data_alter() and automatically attaches the
    handlers to every Search API index field whose data type is 'location'. Just set a field's type to
    Latitude/longitude and the handlers appear on that index's Views table.
  bundle: search_api_location_views
  rubric_ref: rubric/search_api_location_views_search_api_location_views_auto_integration@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: search_api_location_views-distance-field
  input: In search_api_location_views, how is the per-result distance sorted, and what is the special
    pseudo-field involved? Why might the distance sort not appear on some backends?
  criteria: The module targets a distance pseudo-field aliased '<field_id>__distance' and puts the search_api_location_distance
    sort (and search_api_location_radius argument) on it. That pseudo-field only exists if the backend
    defines it (e.g. Solr's getBackendDefinedFields); on backends that don't expose it the distance sort
    isn't attached.
  bundle: search_api_location_views
  rubric_ref: rubric/search_api_location_views_search_api_location_views_distance_field@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: search_api_location_views-known-filter
  input: On this Drupal site there is a Search API index salv_index with a location field salv_loc. Inspect
    the site's Views data and state the id of the Views filter handler that search_api_location_views
    exposes for that field.
  criteria: The salv_loc field's Views filter handler id is 'search_api_location' (in the search_api_index_salv_index
    Views table).
  bundle: search_api_location_views
  rubric_ref: rubric/search_api_location_views_search_api_location_views_known_filter@1.0
