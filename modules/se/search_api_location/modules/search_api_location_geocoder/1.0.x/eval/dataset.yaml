metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: search_api_location_geocoder
  version: 1.0.x
  note: 'Search API Location Geocoder adds one Search API Location ''location_input'' plugin: geocode
    (''Geocoded input''), class Geocode extends LocationInputPluginBase + ContainerFactoryPluginInterface,
    injecting the geocoder service, config.factory and the geocoder_provider entity storage. getParsedInput()
    geocodes the typed address via geocoder->geocode() using the enabled providers (checked, ordered by
    weight, first valid wins) and returns ''lat,lon''. Its config form lists geocoder_provider entities
    as a draggable checkbox table (stored inside the host filter/facet config). It requires the geocoder
    module and at least one geocoder_provider entity. Medium/hard cases are grounded in locally-created
    geocoder_provider config entities (id prefix salg_) using the offline ''random'' geocoder plugin -
    no external geocoding service is called, and only salg_* providers are touched.'
questions:
- id: search_api_location_geocoder-what
  input: What does the search_api_location_geocoder submodule add to Search API Location, and how does
    a user search with it?
  criteria: It adds a Location Input plugin 'geocode' ('Geocoded input') that lets a user type an address;
    the plugin geocodes it to lat,lon (via the Geocoder module) before running the proximity search. Select
    it as the input method on a location filter/facet.
  bundle: search_api_location_geocoder
  rubric_ref: rubric/search_api_location_geocoder_search_api_location_geocoder_what@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: search_api_location_geocoder-providers
  input: How does the geocode ('Geocoded input') plugin turn a typed address into coordinates, and how
    are multiple geocoder providers handled?
  criteria: getParsedInput() calls the geocoder service with the enabled geocoder_provider entities selected
    in the plugin config. Providers are checked and ordered by weight in a draggable table; the first
    provider to return a valid coordinate wins, and the plugin returns 'lat,lon'.
  bundle: search_api_location_geocoder
  rubric_ref: rubric/search_api_location_geocoder_search_api_location_geocoder_providers@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: search_api_location_geocoder-plugin-type
  input: In search_api_location_geocoder, what is the machine id of the location input plugin it provides,
    and which plugin type/base class does it build on?
  criteria: The plugin id is 'geocode', an @LocationInput plugin (Search API Location's location_input
    plugin type) whose class extends LocationInputPluginBase and implements ContainerFactoryPluginInterface
    to inject the geocoder service.
  bundle: search_api_location_geocoder
  rubric_ref: rubric/search_api_location_geocoder_search_api_location_geocoder_plugin_type@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: search_api_location_geocoder-known-provider
  input: On this Drupal site, a geocoder provider has been set up for the search_api_location_geocoder
    'Geocoded input' to use. Inspect the geocoder provider configuration and give the machine name of
    the provider whose id starts with 'salg_'.
  criteria: The geocoder_provider entity salg_random is configured (it uses the offline 'random' geocoder
    plugin).
  bundle: search_api_location_geocoder
  rubric_ref: rubric/search_api_location_geocoder_search_api_location_geocoder_known_provider@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/search_api_location_geocoder-provider-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/search_api_location_geocoder-provider-cleanup.sh
- id: search_api_location_geocoder-known-plugin
  input: On this Drupal site there is a geocoder provider with machine name salg_random. Inspect its configuration
    and state which underlying geocoder plugin it uses.
  criteria: The salg_random geocoder_provider uses the 'random' geocoder plugin.
  bundle: search_api_location_geocoder
  rubric_ref: rubric/search_api_location_geocoder_search_api_location_geocoder_known_plugin@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/search_api_location_geocoder-provider-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/search_api_location_geocoder-provider-cleanup.sh
- id: search_api_location_geocoder-create-provider
  input: On this Drupal site, the search_api_location_geocoder 'Geocoded input' has no geocoder provider
    to use, so it cannot resolve addresses. Create a geocoder provider (give it the machine name salg_geocoder)
    so the Geocoded input can geocode addresses, and apply the change to the live site.
  criteria: Create a geocoder_provider config entity with an id starting 'salg_' (e.g. salg_geocoder)
    using any available geocoder plugin. The verify checks that at least one salg_-prefixed geocoder_provider
    exists.
  bundle: search_api_location_geocoder
  rubric_ref: rubric/search_api_location_geocoder_search_api_location_geocoder_create_provider@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/search_api_location_geocoder-create-provider-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/search_api_location_geocoder-create-provider-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/search_api_location_geocoder-create-provider-verify.sh
- id: search_api_location_geocoder-random-provider
  input: On this Drupal site, for local testing of the search_api_location_geocoder 'Geocoded input' without
    calling an external service, create a geocoder provider (machine name starting salg_) that uses the
    offline Random geocoder plugin, and apply the change to the live site.
  criteria: Create a geocoder_provider config entity with an id starting 'salg_' whose plugin is 'random'.
    The verify checks a salg_-prefixed geocoder_provider using the 'random' plugin exists.
  bundle: search_api_location_geocoder
  rubric_ref: rubric/search_api_location_geocoder_search_api_location_geocoder_random_provider@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/search_api_location_geocoder-random-provider-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/search_api_location_geocoder-random-provider-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/search_api_location_geocoder-random-provider-verify.sh
