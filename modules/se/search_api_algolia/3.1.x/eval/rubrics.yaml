rubrics:
- id: search_api_algolia_sapia_add_server
  version: '1.0'
  applicable_bundles:
  - search_api_algolia
  checks:
  - kind: must_contain_any
    values:
    - search_api_algolia
    - Algolia
    - Application ID
    - application_id
    - Write API Key
    - api_key
  scoring:
    combine: all_pass
- id: search_api_algolia_sapia_settings_keys
  version: '1.0'
  applicable_bundles:
  - search_api_algolia
  checks:
  - kind: must_contain_any
    values:
    - search_api_algolia.settings
    - debug
    - wait_for_delete
  scoring:
    combine: all_pass
- id: search_api_algolia_sapia_drush_and_splitter
  version: '1.0'
  applicable_bundles:
  - search_api_algolia
  checks:
  - kind: must_contain_any
    values:
    - sapia-d
    - search_api_algolia:delete
    - algolia_item_splitter
    - batch-size
  scoring:
    combine: all_pass
- id: search_api_algolia_sapia_debug_known
  version: '1.0'
  applicable_bundles:
  - search_api_algolia
  checks:
  - kind: must_contain_any
    values:
    - debug
    - 'true'
    - enabled
    - 'yes'
  scoring:
    combine: all_pass
- id: search_api_algolia_sapia_known_server
  version: '1.0'
  applicable_bundles:
  - search_api_algolia
  checks:
  - kind: must_contain_any
    values:
    - search_api_algolia
    - APPID_KNOWN_123
    - Algolia
  scoring:
    combine: all_pass
- id: search_api_algolia_sapia_enable_debug
  version: '1.0'
  applicable_bundles:
  - search_api_algolia
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
- id: search_api_algolia_sapia_create_server
  version: '1.0'
  applicable_bundles:
  - search_api_algolia
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
