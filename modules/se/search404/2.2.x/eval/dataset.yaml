metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: search404
  version: 2.2.x
  note: Search 404 has no content entity and no permissions of its own; it is a config object plus a 404
    controller. Cases are `recipe` (response-graded) probing documented facts an agent would otherwise
    read source to answer; no site mutation.
questions:
- id: search404-what-it-does
  input: On a Drupal 11 site I don't want visitors to see a bare 'Page not found' page. How can Search
    404 help, and how does it decide what to search for?
  criteria: 'Search 404 replaces the site''s 404 page: it extracts keywords from the requested URL path
    and shows search results (or jumps to a match) instead of a plain 404. It sets system.site page.404
    to /search404.'
  bundle: search404
  rubric_ref: rubric/search404_search404_what_it_does@1.0
  tags:
  - mode:recipe
- id: search404-backend-core-vs-searchapi
  input: Out of the box which search backend does Search 404 use, and how do I make it use Search API
    or a View instead?
  criteria: By default it uses the core Search module's default search page. To use Search API / a View,
    enable search404_do_custom_search and set search404_custom_search_path (e.g. myview/@keys) where @keys
    is replaced by the parsed keywords.
  bundle: search404
  rubric_ref: rubric/search404_search404_backend_core_vs_searchapi@1.0
  tags:
  - mode:recipe
- id: search404-jump-to-first
  input: I want Search 404 to send the visitor straight to the page when the keyword search returns only
    one result. Which setting controls that, and which one jumps to the first of many results?
  criteria: search404_jump redirects to the result when there is exactly one; search404_first redirects
    to the first result even when there are several (optionally limited by search404_first_on_paths).
  bundle: search404
  rubric_ref: rubric/search404_search404_jump_to_first@1.0
  tags:
  - mode:recipe
- id: search404-abort-file-extensions
  input: Requests for missing image and PDF files are triggering pointless searches on my Drupal site.
    Which Search 404 setting aborts the search for URLs ending in a file extension, and what is its default?
  criteria: search404_deny_all_file_extensions (default true) aborts the search on any path ending in
    a file extension; search404_deny_specific_file_extensions lists specific extensions to abort on when
    the 'all' option is off.
  bundle: search404
  rubric_ref: rubric/search404_search404_abort_file_extensions@1.0
  tags:
  - mode:recipe
- id: search404-301-redirect
  input: When Search 404 jumps directly to a result it uses a 302 by default. Which setting makes it a
    301 redirect instead?
  criteria: Enable search404_redirect_301 on search404.settings to use a 301 instead of the default 302
    for the jump/redirect.
  bundle: search404
  rubric_ref: rubric/search404_search404_301_redirect@1.0
  tags:
  - mode:recipe
- id: search404-custom-text
  input: How do I set a custom title and a custom error message on the Search 404 results page? Give the
    config keys.
  criteria: search404_page_title sets the page title, search404_page_text adds HTML above the results,
    and search404_custom_error_message replaces the default message (with @keys for the query). search404_disable_error_message
    hides it.
  bundle: search404
  rubric_ref: rubric/search404_search404_custom_text@1.0
  tags:
  - mode:recipe
- id: search404-dependency
  input: For Search 404 to actually show search results on the 404 page using the default configuration,
    which core module must be enabled?
  criteria: The core Search module must be enabled (Search 404 uses search.search_page_repository / the
    default core search page); the user also needs the 'search content' permission. Search 404 declares
    no hard module dependency.
  bundle: search404
  rubric_ref: rubric/search404_search404_dependency@1.0
  tags:
  - mode:recipe
- id: search404-settings-route
  input: What is the admin path and route name for the Search 404 settings form, and which permission
    gates it?
  criteria: Route search404.settings at /admin/config/search/search404, gated by the core 'administer
    search' permission.
  bundle: search404
  rubric_ref: rubric/search404_search404_settings_route@1.0
  tags:
  - mode:recipe
