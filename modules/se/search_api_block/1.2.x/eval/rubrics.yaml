rubrics:
- id: search_api_block_search_api_block_plugin_id
  version: '1.0'
  applicable_bundles:
  - search_api_block
  checks:
  - kind: must_contain_any
    values:
    - search_api_form_block
  scoring:
    combine: all_pass
- id: search_api_block_search_api_block_settings_keys
  version: '1.0'
  applicable_bundles:
  - search_api_block
  checks:
  - kind: must_contain_any
    values:
    - action_url
    - input_name
  scoring:
    combine: all_pass
- id: search_api_block_search_api_block_clean_get
  version: '1.0'
  applicable_bundles:
  - search_api_block
  checks:
  - kind: must_contain_any
    values:
    - form_build_id
    - form_token
    - form_id
  scoring:
    combine: all_pass
- id: search_api_block_search_api_block_known_action_url
  version: '1.0'
  applicable_bundles:
  - search_api_block
  checks:
  - kind: must_contain_any
    values:
    - /sab-search
  scoring:
    combine: all_pass
- id: search_api_block_search_api_block_known_input_name
  version: '1.0'
  applicable_bundles:
  - search_api_block
  checks:
  - kind: must_contain_any
    values:
    - custom_keys
  scoring:
    combine: all_pass
- id: search_api_block_search_api_block_place_get
  version: '1.0'
  applicable_bundles:
  - search_api_block
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
- id: search_api_block_search_api_block_place_post_params
  version: '1.0'
  applicable_bundles:
  - search_api_block
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
