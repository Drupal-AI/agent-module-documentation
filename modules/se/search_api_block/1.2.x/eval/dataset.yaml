metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: search_api_block
  version: 1.2.x
  note: 'Search API block provides one Block plugin ''search_api_form_block'' rendering a search input
    that submits (GET by default) to an existing Search API view page. There is no settings form/configure
    route; all state is on the placed block config entity block.block.<id> under settings (schema block.settings.search_api_form_block):
    action_url (Search page path, must start with /), action_method (get/post), input_name (exposed filter
    machine name, defaults to keys), input_placeholder, submit_value, input_label, input_label_visibility,
    pass_get_params. Medium cases place a fixed block sab_known and read its settings back via drush;
    hard cases have the agent place a block and verify the config entity''s plugin+settings. All fixtures
    are namespaced sab_* / block.block.sab_* and removed on cleanup/reset.'
questions:
- id: search_api_block-plugin-id
  input: On a Drupal site using Search API, I want to add a search input block that submits to my Search
    API search view. Which block plugin does the search_api_block module provide (its plugin id), and
    does it run the search itself?
  criteria: It provides the block plugin 'search_api_form_block' (admin label 'Search API form'). It does
    not run the search itself; it submits (GET by default) to an existing Search API view page whose path
    you configure as the block's action_url.
  bundle: search_api_block
  rubric_ref: rubric/search_api_block_search_api_block_plugin_id@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: search_api_block-settings-keys
  input: In the search_api_block 'Search API form' block, which two settings control the search page path
    it submits to and the name of the search input, and what does the input name need to match?
  criteria: 'action_url (the ''Search page'' path, must start with a slash) and input_name (the name of
    the search input, which should match the target view''s exposed keyword filter machine name, e.g.
    keys). Also selectable: action_method (get/post) and pass_get_params.'
  bundle: search_api_block
  rubric_ref: rubric/search_api_block_search_api_block_settings_keys@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: search_api_block-clean-get
  input: The search_api_block search form submits via GET but its result URLs stay clean. Which form fields
    does the module hide so they do not end up in the search URL?
  criteria: 'search_api_block_form_search_api_form_alter() sets #access = FALSE on form_build_id, form_token
    and form_id, so a GET submit does not carry those into the resulting search-page URL.'
  bundle: search_api_block
  rubric_ref: rubric/search_api_block_search_api_block_clean_get@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: search_api_block-known-action-url
  input: This site has a placed Search API form block whose block id is 'sab_known'. Inspect its live
    configuration and report the Search page path (action_url) it submits to.
  criteria: 'block.block.sab_known settings.action_url is ''/sab-search'' (plugin search_api_form_block).
    Read it with: drush cget block.block.sab_known settings.'
  bundle: search_api_block
  rubric_ref: rubric/search_api_block_search_api_block_known_action_url@1.0
  tags:
  - mode:introspection
  - difficulty:medium
