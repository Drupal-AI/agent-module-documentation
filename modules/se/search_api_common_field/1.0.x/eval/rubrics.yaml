rubrics:
- id: search_api_common_field_search_api_common_field_what_processor
  version: '1.0'
  applicable_bundles:
  - search_api_common_field
  checks:
  - kind: must_contain_any
    values:
    - common_field
    - processor
    - datasource
    - merge
    - same name
  scoring:
    combine: all_pass
- id: search_api_common_field_search_api_common_field_how_add
  version: '1.0'
  applicable_bundles:
  - search_api_common_field
  checks:
  - kind: must_contain_any
    values:
    - Add fields
    - Common field
    - two
    - multiple datasources
    - more than one datasource
  scoring:
    combine: all_pass
- id: search_api_common_field_search_api_common_field_where_stored
  version: '1.0'
  applicable_bundles:
  - search_api_common_field
  checks:
  - kind: must_contain_any
    values:
    - search_api.index
    - field_settings
    - property_name
    - common_field
    - property_path
  scoring:
    combine: all_pass
- id: search_api_common_field_search_api_common_field_known_field
  version: '1.0'
  applicable_bundles:
  - search_api_common_field
  checks:
  - kind: must_contain_any
    values:
    - langcode
  scoring:
    combine: all_pass
- id: search_api_common_field_search_api_common_field_add_field
  version: '1.0'
  applicable_bundles:
  - search_api_common_field
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
