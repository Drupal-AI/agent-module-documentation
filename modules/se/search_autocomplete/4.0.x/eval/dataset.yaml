metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: search_autocomplete
  version: 4.0.x
  note: 'Search Autocomplete adds typeahead suggestions via the config entity type autocompletion_configuration
    (config prefix search_autocomplete.autocompletion_configuration.*). Each entity maps a CSS selector
    to a suggestion source (a callback URI, or view_id::display_id) and tunes minChar/maxSuggestions/autoSubmit/autoRedirect/no-result
    & more-result labels/theme/editable/deletable. Three configs ship enabled: search_block (nodes callback),
    search_form_content (words callback), search_form_users (users callback). It also provides Views display/row/style
    plugins (AutocompletionCallback / CallbackFieldRow / CallbackSerializer) to build JSON suggestion
    endpoints. Permissions: ''administer search autocomplete'', ''use search autocomplete''. Medium/hard
    cases read/create autocompletion_configuration entities, verified by loading them via drush. Verify
    scans by CSS selector so the agent may choose any config id.'
questions:
- id: search_autocomplete-entity-type
  input: In the search_autocomplete module, what configuration entity type do you create to add typeahead
    suggestions to a field, and what two things does each one connect?
  criteria: You create an 'autocompletion_configuration' config entity. Each one connects a target field
    (a CSS 'selector') to a suggestion 'source' (a callback URI or a view_id::display_id), plus behavior
    like minChar, maxSuggestions, autoSubmit, autoRedirect.
  bundle: search_autocomplete
  rubric_ref: rubric/search_autocomplete_search_autocomplete_entity_type@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: search_autocomplete-defaults
  input: Which autocompletion configurations does the search_autocomplete module ship with, enabled out
    of the box?
  criteria: 'Three: search_block (source autocompletion_callbacks_nodes::nodes_autocompletion_callback),
    search_form_content (words callback), and search_form_users (users callback).'
  bundle: search_autocomplete
  rubric_ref: rubric/search_autocomplete_search_autocomplete_defaults@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: search_autocomplete-permissions
  input: Which permissions does the search_autocomplete module define?
  criteria: '''administer search autocomplete'' (admin UI at /admin/config/search/search_autocomplete
    and the add/edit/delete forms) and ''use search autocomplete'' (use autocompletion on configured fields).'
  bundle: search_autocomplete
  rubric_ref: rubric/search_autocomplete_search_autocomplete_permissions@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: search_autocomplete-known-selector
  input: On this Drupal site an extra autocompletion configuration (id sa_probe) has been added with search_autocomplete.
    Inspect the live configuration and state the CSS selector of the field it autocompletes.
  criteria: 'sa_probe targets selector #probe-field (minChar 4). Read with `drush cget search_autocomplete.autocompletion_configuration.sa_probe`.'
  bundle: search_autocomplete
  rubric_ref: rubric/search_autocomplete_search_autocomplete_known_selector@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/search_autocomplete-known-selector-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/search_autocomplete-known-selector-cleanup.sh
