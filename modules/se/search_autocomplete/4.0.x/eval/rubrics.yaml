rubrics:
- id: search_autocomplete_search_autocomplete_entity_type
  version: '1.0'
  applicable_bundles:
  - search_autocomplete
  checks:
  - kind: must_contain_any
    values:
    - autocompletion_configuration
  scoring:
    combine: all_pass
- id: search_autocomplete_search_autocomplete_defaults
  version: '1.0'
  applicable_bundles:
  - search_autocomplete
  checks:
  - kind: must_contain_any
    values:
    - search_block
    - search_form_content
    - search_form_users
  scoring:
    combine: all_pass
- id: search_autocomplete_search_autocomplete_permissions
  version: '1.0'
  applicable_bundles:
  - search_autocomplete
  checks:
  - kind: must_contain_any
    values:
    - administer search autocomplete
    - use search autocomplete
  scoring:
    combine: all_pass
- id: search_autocomplete_search_autocomplete_known_selector
  version: '1.0'
  applicable_bundles:
  - search_autocomplete
  checks:
  - kind: must_contain_any
    values:
    - '#probe-field'
  scoring:
    combine: all_pass
- id: search_autocomplete_search_autocomplete_known_source
  version: '1.0'
  applicable_bundles:
  - search_autocomplete
  checks:
  - kind: must_contain_any
    values:
    - autocompletion_callbacks_users
  scoring:
    combine: all_pass
- id: search_autocomplete_search_autocomplete_create_config
  version: '1.0'
  applicable_bundles:
  - search_autocomplete
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
- id: search_autocomplete_search_autocomplete_enable_searchbox
  version: '1.0'
  applicable_bundles:
  - search_autocomplete
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
