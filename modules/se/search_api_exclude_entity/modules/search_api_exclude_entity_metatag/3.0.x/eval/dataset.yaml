metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: search_api_exclude_entity_metatag
  version: 3.0.x
  note: Submodule of search_api_exclude_entity. Ships one Search API processor that excludes published
    entities whose Metatag robots value contains noindex. Cases are `recipe` probing documented facts;
    no site mutation.
questions:
- id: saem-purpose
  input: I want pages I already marked noindex for search engines to also be dropped from my Drupal Search
    API index. Which module/processor does that?
  criteria: The Search API Exclude Entity - Metatag submodule; enable its processor 'search_api_exclude_entity_processor_metatag'
    on the index.
  bundle: search_api_exclude_entity_metatag
  rubric_ref: rubric/search_api_exclude_entity_metatag_saem_purpose@1.0
  tags:
  - mode:recipe
- id: saem-trigger
  input: What condition makes the Search API Exclude Entity Metatag processor remove an item from the
    index?
  criteria: When the entity's Metatag 'robots' value contains 'noindex' (and the entity is published),
    the item is unset from the index.
  bundle: search_api_exclude_entity_metatag
  rubric_ref: rubric/search_api_exclude_entity_metatag_saem_trigger@1.0
  tags:
  - mode:recipe
- id: saem-published
  input: Does the Search API Exclude Entity Metatag processor act on unpublished entities?
  criteria: No — it only considers entities implementing EntityPublishedInterface (published entities);
    others are skipped.
  bundle: search_api_exclude_entity_metatag
  rubric_ref: rubric/search_api_exclude_entity_metatag_saem_published@1.0
  tags:
  - mode:recipe
- id: saem-deps
  input: What are the dependencies of the Search API Exclude Entity - Metatag submodule?
  criteria: It depends on the metatag module and on the parent search_api_exclude_entity module.
  bundle: search_api_exclude_entity_metatag
  rubric_ref: rubric/search_api_exclude_entity_metatag_saem_deps@1.0
  tags:
  - mode:recipe
- id: saem-setup
  input: Is there a settings form to configure the Search API Exclude Entity Metatag processor?
  criteria: No settings form and no config schema — enabling the processor on the index is all that is
    required, then reindex.
  bundle: search_api_exclude_entity_metatag
  rubric_ref: rubric/search_api_exclude_entity_metatag_saem_setup@1.0
  tags:
  - mode:recipe
