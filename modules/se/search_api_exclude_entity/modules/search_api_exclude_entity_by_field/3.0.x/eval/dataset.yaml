metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: search_api_exclude_entity_by_field
  version: 3.0.x
  note: Submodule of search_api_exclude_entity. Ships one Search API processor that excludes items when
    an indexed field matches a configured value. Cases are `recipe` probing documented facts; no site
    mutation.
questions:
- id: saebf-processor-id
  input: On a Drupal Search API index I want to exclude items whose existing indexed field equals a certain
    value, without adding a new field. Which processor and which module do I use?
  criteria: Enable the Search API Exclude Entity By Field module and its processor 'search_api_exclude_entity_by_field_processor'
    on the index.
  bundle: search_api_exclude_entity_by_field
  rubric_ref: rubric/search_api_exclude_entity_by_field_saebf_processor_id@1.0
  tags:
  - mode:recipe
- id: saebf-settings
  input: How do I tell the Search API Exclude Entity By Field processor which value should exclude an
    item?
  criteria: In the processor settings there is one textfield per index field; enter the value that should
    trigger exclusion for that field. Blank fields are ignored.
  bundle: search_api_exclude_entity_by_field
  rubric_ref: rubric/search_api_exclude_entity_by_field_saebf_settings@1.0
  tags:
  - mode:recipe
- id: saebf-boolean
  input: In Search API Exclude Entity By Field, how do I match a boolean field that should be excluded
    when it is false?
  criteria: Enter the literal string 'false' — sanitizeFilterString() converts 'true'/'false' to the boolean
    TRUE/FALSE before comparing; other strings compare literally.
  bundle: search_api_exclude_entity_by_field
  rubric_ref: rubric/search_api_exclude_entity_by_field_saebf_boolean@1.0
  tags:
  - mode:recipe
- id: saebf-dependency
  input: What does the Search API Exclude Entity By Field submodule depend on?
  criteria: It depends on the parent module search_api_exclude_entity (which in turn requires search_api).
  bundle: search_api_exclude_entity_by_field
  rubric_ref: rubric/search_api_exclude_entity_by_field_saebf_dependency@1.0
  tags:
  - mode:recipe
- id: saebf-stage
  input: At which Search API processing stage does the Exclude Entity By Field processor drop items?
  criteria: The alter_items stage (weight -50); alterIndexedItems() unsets matching items so they never
    reach the backend.
  bundle: search_api_exclude_entity_by_field
  rubric_ref: rubric/search_api_exclude_entity_by_field_saebf_stage@1.0
  tags:
  - mode:recipe
