metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: search_api_exclude_entity
  version: 3.0.x
  note: Search API Exclude Entity ships a boolean field type/widget/formatter plus a Search API alter_items
    processor; there is no admin config route. Cases are `recipe` (response-graded) probing documented
    facts an agent would otherwise read source for; no site mutation.
questions:
- id: sae-mechanism
  input: On a Drupal 11 site with Search API, how does the Search API Exclude Entity module keep an individual
    node out of a search index? Name the field type and the processor.
  criteria: You add a boolean 'search_api_exclude_entity' field to the bundle; editors tick it; the search_api_exclude_entity_processor
    (alter_items stage, weight -50) unsets those items during indexing so they never reach the backend.
  bundle: search_api_exclude_entity
  rubric_ref: rubric/search_api_exclude_entity_sae_mechanism@1.0
  tags:
  - mode:recipe
- id: sae-enable-processor
  input: I added the Search API Exclude Entity field to my Article type. What else must I do so excluded
    articles are actually dropped from my Search API index?
  criteria: Enable the 'Search API Exclude Entity' processor on the index (Processors tab) and, in its
    settings, tick which exclude field(s) control exclusion for that entity type.
  bundle: search_api_exclude_entity
  rubric_ref: rubric/search_api_exclude_entity_sae_enable_processor@1.0
  tags:
  - mode:recipe
- id: sae-permission
  input: Which permission controls who can toggle the exclude checkbox on entities in the Search API Exclude
    Entity module?
  criteria: The 'edit search api exclude entity' permission; hook_entity_field_access() forbids editing
    the search_api_exclude_entity field without it.
  bundle: search_api_exclude_entity
  rubric_ref: rubric/search_api_exclude_entity_sae_permission@1.0
  tags:
  - mode:recipe
- id: sae-multiple-fields
  input: Can I have more than one Search API Exclude Entity exclude field on the same content type, and
    why would I?
  criteria: Yes. Because it is a normal field you can add several exclude fields on one bundle, e.g. one
    per index/server, and each index's processor is configured to honor its own field(s).
  bundle: search_api_exclude_entity
  rubric_ref: rubric/search_api_exclude_entity_sae_multiple_fields@1.0
  tags:
  - mode:recipe
- id: sae-configure-route
  input: What is the admin settings/configure route for the Search API Exclude Entity module?
  criteria: There is none (configure is null). Configuration happens on the Field UI (add the field) and
    on the Search API index's Processors tab, not a dedicated settings form.
  bundle: search_api_exclude_entity
  rubric_ref: rubric/search_api_exclude_entity_sae_configure_route@1.0
  tags:
  - mode:recipe
- id: sae-widget-container
  input: How do I make the Search API Exclude Entity checkbox appear in the node form's advanced sidebar,
    and what is the default checkbox label?
  criteria: 'Keep the widget''s ''use_details_container'' setting enabled (default true) — it renders
    the checkbox in a details element in the ''advanced'' group. Default label: ''Yes, exclude this entity
    from the search indexes.'''
  bundle: search_api_exclude_entity
  rubric_ref: rubric/search_api_exclude_entity_sae_widget_container@1.0
  tags:
  - mode:recipe
- id: sae-submodules
  input: Which Search API Exclude Entity submodule excludes items by an arbitrary field value, and which
    excludes entities whose Metatag robots value is noindex?
  criteria: search_api_exclude_entity_by_field excludes items when an indexed field matches a configured
    value; search_api_exclude_entity_metatag excludes published entities whose Metatag robots contains
    noindex.
  bundle: search_api_exclude_entity
  rubric_ref: rubric/search_api_exclude_entity_sae_submodules@1.0
  tags:
  - mode:recipe
