rubrics:
- id: semanticviews_semanticviews_plugin_ids
  version: '1.0'
  applicable_bundles:
  - semanticviews
  checks:
  - kind: must_contain_any
    values:
    - semanticviews_style
    - semanticviews_row
    - Semantic Views Style
    - Semantic Views Row
  scoring:
    combine: all_pass
- id: semanticviews_semanticviews_attribute_syntax
  version: '1.0'
  applicable_bundles:
  - semanticviews
  checks:
  - kind: must_contain_any
    values:
    - attribute|value
    - '|'
    - one per line
    - one value per line
    - row_index
    - '{{ row_index }}'
  scoring:
    combine: all_pass
- id: semanticviews_semanticviews_html_list
  version: '1.0'
  applicable_bundles:
  - semanticviews
  checks:
  - kind: must_contain_any
    values:
    - li
    - ul
    - list
    - element_type
    - row element
  scoring:
    combine: all_pass
- id: semanticviews_semanticviews_known_row_element
  version: '1.0'
  applicable_bundles:
  - semanticviews
  checks:
  - kind: must_contain_any
    values:
    - article
  scoring:
    combine: all_pass
- id: semanticviews_semanticviews_known_list_element
  version: '1.0'
  applicable_bundles:
  - semanticviews
  checks:
  - kind: must_contain_any
    values:
    - ol
    - ordered list
  scoring:
    combine: all_pass
- id: semanticviews_semanticviews_set_style
  version: '1.0'
  applicable_bundles:
  - semanticviews
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
- id: semanticviews_semanticviews_set_row
  version: '1.0'
  applicable_bundles:
  - semanticviews
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
