rubrics:
- id: search_api_html_element_filter_search_api_html_element_filter_plugin_id
  version: '1.0'
  applicable_bundles:
  - search_api_html_element_filter
  checks:
  - kind: must_contain_any
    values:
    - html_element_filter
  scoring:
    combine: all_pass
- id: search_api_html_element_filter_search_api_html_element_filter_settings
  version: '1.0'
  applicable_bundles:
  - search_api_html_element_filter
  checks:
  - kind: must_contain_any
    values:
    - css_selectors
    - one per line
    - new line
    - newline
    - enable_postprocess_query
  scoring:
    combine: all_pass
- id: search_api_html_element_filter_search_api_html_element_filter_stages
  version: '1.0'
  applicable_bundles:
  - search_api_html_element_filter
  checks:
  - kind: must_contain_any
    values:
    - preprocess_index
    - postprocess_query
    - DomCrawler
    - dom crawler
  scoring:
    combine: all_pass
- id: search_api_html_element_filter_search_api_html_element_filter_known_selector
  version: '1.0'
  applicable_bundles:
  - search_api_html_element_filter
  checks:
  - kind: must_contain_any
    values:
    - .sidebar-filters
  scoring:
    combine: all_pass
- id: search_api_html_element_filter_search_api_html_element_filter_postprocess_off
  version: '1.0'
  applicable_bundles:
  - search_api_html_element_filter
  checks:
  - kind: must_contain_any
    values:
    - 'off'
    - 'false'
    - disabled
    - not enabled
    - 'no'
  scoring:
    combine: all_pass
- id: search_api_html_element_filter_search_api_html_element_filter_add_processor
  version: '1.0'
  applicable_bundles:
  - search_api_html_element_filter
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
- id: search_api_html_element_filter_search_api_html_element_filter_strip_selector
  version: '1.0'
  applicable_bundles:
  - search_api_html_element_filter
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
