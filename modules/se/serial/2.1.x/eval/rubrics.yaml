rubrics:
- id: serial_serial_what_field
  version: '1.0'
  applicable_bundles:
  - serial
  checks:
  - kind: must_contain_any
    values:
    - serial
    - auto increment
    - auto-increment
    - Serial
  scoring:
    combine: all_pass
- id: serial_serial_storage_settings
  version: '1.0'
  applicable_bundles:
  - serial
  checks:
  - kind: must_contain_any
    values:
    - start_value
    - starting value
    - init_existing_entities
    - existing entities
  scoring:
    combine: all_pass
- id: serial_serial_atomic_mechanism
  version: '1.0'
  applicable_bundles:
  - serial
  checks:
  - kind: must_contain_any
    values:
    - assistant table
    - AUTO_INCREMENT
    - auto increment
    - serial_
    - serial.sql_storage
  scoring:
    combine: all_pass
- id: serial_serial_inspect_start_value
  version: '1.0'
  applicable_bundles:
  - serial
  checks:
  - kind: must_contain_any
    values:
    - '1000'
  scoring:
    combine: all_pass
- id: serial_serial_identify_field
  version: '1.0'
  applicable_bundles:
  - serial
  checks:
  - kind: must_contain_any
    values:
    - field_srl_auto
  scoring:
    combine: all_pass
- id: serial_serial_create_field
  version: '1.0'
  applicable_bundles:
  - serial
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
- id: serial_serial_display_field
  version: '1.0'
  applicable_bundles:
  - serial
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
