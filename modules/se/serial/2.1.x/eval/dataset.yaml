metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: serial
  version: 2.1.x
  note: 'serial defines an atomic auto-increment field type ''serial'' (SerialItem) with a hidden widget
    serial_default_widget and formatter serial_default_formatter. Storage settings: start_value (default
    1) and init_existing_entities (0/1), schema field.storage_settings.serial. Value allocated in preSave()
    via the serial.sql_storage service using a per-field AUTO_INCREMENT assistant table serial_<md5(entityType_bundle_field)>;
    creating/deleting a serial FieldConfig auto-creates/drops that table (serial_field_config_create/delete).
    No admin page, permissions, Drush, or plugin types (configure=null). Medium cases create serial fields
    (field_srl_*) with known settings and the agent reads field.storage config back; hard cases create
    serial fields (start_value / with display formatter) verified against live field + display config.
    Only this module''s own field_srl_* storages are ever created/deleted by name (never a broad field
    purge).'
questions:
- id: serial-what-field
  input: I need each new node of a content type to get an automatic sequential number (like an invoice
    number) in Drupal. Which contrib module/field type gives me that, and how do editors enter the value?
  criteria: 'Use the Serial module''s ''serial'' field type: add a Serial field to the bundle. Editors
    do NOT enter it — the widget is ''Hidden (Automatic)'' (serial_default_widget) and the next number
    is assigned automatically on save.'
  bundle: serial
  rubric_ref: rubric/serial_serial_what_field@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: serial-storage-settings
  input: What options can I configure when creating a Serial field in Drupal, e.g. the number it starts
    at and back-filling existing content? Name the storage settings.
  criteria: 'Two storage settings set at field-creation time: start_value (default 1, the first number)
    and init_existing_entities (No/Yes — whether to assign serial values to entities that already exist
    in the bundle). Both are locked once the field has data.'
  bundle: serial
  rubric_ref: rubric/serial_serial_storage_settings@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: serial-atomic-mechanism
  input: How does the Drupal Serial module guarantee unique, atomic sequential numbers even under concurrent
    entity creation? What does it create per field?
  criteria: For each serial field it creates a dedicated 'assistant' table named serial_<md5(entityType_bundle_field)>
    with a real database AUTO_INCREMENT (sid) column. To allocate a number the serial.sql_storage service
    inserts a temporary row inside a transaction and returns the DB-generated sid, so allocation is atomic
    and race-free.
  bundle: serial
  rubric_ref: rubric/serial_serial_atomic_mechanism@1.0
  tags:
  - mode:recipe
  - difficulty:easy
