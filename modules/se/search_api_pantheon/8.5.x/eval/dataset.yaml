metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: search_api_pantheon
  version: 8.5.x
  note: Runtime Solr behavior requires Pantheon env vars (PANTHEON_ENVIRONMENT, PANTHEON_INDEX_*) that
    are absent off-platform, so all cases are `recipe` (response-graded), probing the installed config
    entities, the connector's env-var override, the Drush schema/diagnostic commands, and setup prerequisites.
questions:
- id: sap-what-installs
  input: After enabling the Search API Pantheon module on Drupal, what Search API server and index does
    it create, and which Solr connector plugin does the server use?
  criteria: It installs a Search API server 'Pantheon Search' (id pantheon_search, backend search_api_solr)
    using the 'pantheon' SolrConnector, plus a 'Primary' index (id primary) linked to that server.
  bundle: search_api_pantheon
  rubric_ref: rubric/search_api_pantheon_sap_what_installs@1.0
  tags:
  - mode:recipe
- id: sap-env-vars
  input: How does Search API Pantheon know the Solr host, port and core to connect to on Pantheon? Do
    I enter them by hand?
  criteria: No hand-entry. The 'pantheon' connector force-overrides the connection at runtime from Pantheon
    environment variables (PANTHEON_INDEX_SCHEME/HOST/PORT/PATH/CORE), gated by PANTHEON_ENVIRONMENT,
    so each environment uses its own Solr core automatically.
  bundle: search_api_pantheon
  rubric_ref: rubric/search_api_pantheon_sap_env_vars@1.0
  tags:
  - mode:recipe
- id: sap-post-schema-cmd
  input: On a Pantheon Drupal site, which Drush command uploads the Solr schema after I configure my index,
    and what does it do to the core afterward?
  criteria: drush search-api-pantheon:postSchema (alias sapps) [path]. It uploads the generated (or custom/jump-start)
    config-set and automatically reloads the Solr core so the schema does not revert.
  bundle: search_api_pantheon
  rubric_ref: rubric/search_api_pantheon_sap_post_schema_cmd@1.0
  tags:
  - mode:recipe
- id: sap-diagnose-commands
  input: Search on my Pantheon site is broken. Which Search API Pantheon drush commands can I run to check
    the Solr connection and prove indexing works end to end?
  criteria: Use search-api-pantheon:diagnose (sapd) to check every piece of the install, search-api-pantheon:ping
    (sapp) to confirm the host is reachable, and search-api-pantheon:test-index-and-query (sap-tiq) to
    index one item and query it back.
  bundle: search_api_pantheon
  rubric_ref: rubric/search_api_pantheon_sap_diagnose_commands@1.0
  tags:
  - mode:recipe
- id: sap-prerequisites
  input: What must be set up on the Pantheon side before Search API Pantheon will work, including the
    pantheon.yml entry?
  criteria: 'Enable the Solr add-on in the Pantheon dashboard and add ''search: version: 9'' (or 8) to
    pantheon.yml. The module only functions on Pantheon where PANTHEON_ENVIRONMENT and the index env vars
    are present.'
  bundle: search_api_pantheon
  rubric_ref: rubric/search_api_pantheon_sap_prerequisites@1.0
  tags:
  - mode:recipe
- id: sap-single-server
  input: Can I create multiple Search API servers using the Pantheon connector in one environment?
  criteria: No — only one Pantheon-connector server per environment is supported. Additional Pantheon
    servers all point at the same Solr core, causing schema conflicts or unexpected indexing behavior.
  bundle: search_api_pantheon
  rubric_ref: rubric/search_api_pantheon_sap_single_server@1.0
  tags:
  - mode:recipe
- id: sap-dependency
  input: Which contrib module does Search API Pantheon depend on and build upon, and what Solr versions
    does Pantheon provide?
  criteria: It depends on Search API Solr (search_api_solr ^4.3), whose StandardSolrConnector it extends.
    Pantheon provides Apache Solr 8 or 9 (selected via pantheon.yml).
  bundle: search_api_pantheon
  rubric_ref: rubric/search_api_pantheon_sap_dependency@1.0
  tags:
  - mode:recipe
- id: sap-force-cleanup
  input: My Pantheon Solr index looks corrupted and I want to wipe all its contents from the CLI. Which
    Search API Pantheon drush command does that?
  criteria: drush search-api-pantheon:force-cleanup (alias sapfc) deletes all contents of the Solr server
    regardless of hash or index_id.
  bundle: search_api_pantheon
  rubric_ref: rubric/search_api_pantheon_sap_force_cleanup@1.0
  tags:
  - mode:recipe
