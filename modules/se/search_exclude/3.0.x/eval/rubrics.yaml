rubrics:
- id: search_exclude_search_exclude_plugin_id
  version: '1.0'
  applicable_bundles:
  - search_exclude
  checks:
  - kind: must_contain_any
    values:
    - search_exclude_node_search
    - Content (Exclude)
    - NodeSearch
  scoring:
    combine: all_pass
- id: search_exclude_search_exclude_how_to_use
  version: '1.0'
  applicable_bundles:
  - search_exclude
  checks:
  - kind: must_contain_any
    values:
    - search page
    - /admin/config/search/pages
    - excluded_bundles
    - search.page
  scoring:
    combine: all_pass
- id: search_exclude_search_exclude_index_effect
  version: '1.0'
  applicable_bundles:
  - search_exclude
  checks:
  - kind: must_contain_any
    values:
    - updateIndex
    - NOT IN
    - re-index
    - reindex
  scoring:
    combine: all_pass
- id: search_exclude_search_exclude_known_exclusions
  version: '1.0'
  applicable_bundles:
  - search_exclude
  checks:
  - kind: must_contain_any
    values:
    - se_known_type
  scoring:
    combine: all_pass
- id: search_exclude_search_exclude_which_page
  version: '1.0'
  applicable_bundles:
  - search_exclude
  checks:
  - kind: must_contain_any
    values:
    - se_alpha
  scoring:
    combine: all_pass
- id: search_exclude_search_exclude_create_page
  version: '1.0'
  applicable_bundles:
  - search_exclude
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
- id: search_exclude_search_exclude_make_default
  version: '1.0'
  applicable_bundles:
  - search_exclude
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
