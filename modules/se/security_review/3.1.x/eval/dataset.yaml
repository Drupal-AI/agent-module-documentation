metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: security_review
  version: 3.1.x
  note: Security Review is a reporting/checklist module. Cases are `recipe` (response-graded) grounded
    in the module's routes, permissions, Drush command, plugin type, config, and alter hooks.
questions:
- id: secrev-drush-run
  input: On a Drupal 11 site with the Security Review module enabled, give the single Drush command to
    run the security checklist and store the results.
  criteria: drush secrev --store (aliases security:review / security-review), which runs the checklist
    and writes results.
  bundle: security_review
  rubric_ref: rubric/security_review_secrev_drush_run@1.0
  tags:
  - mode:recipe
- id: secrev-ci-exit-code
  input: I want to fail a CI pipeline when a Security Review check fails on this Drupal site. Which command
    do I run and what signals the failure?
  criteria: Run drush secrev; it returns a non-zero exit code when any check result is FAIL, which fails
    the CI job.
  bundle: security_review
  rubric_ref: rubric/security_review_secrev_ci_exit_code@1.0
  tags:
  - mode:recipe
- id: secrev-custom-check
  input: How do I add a custom security check to the Security Review checklist in my Drupal 11 module?
    Name the plugin mechanism and base class.
  criteria: 'Create a plugin in Plugin/SecurityCheck extending SecurityCheckBase with the #[SecurityCheck(...)]
    attribute, implementing doRun().'
  bundle: security_review
  rubric_ref: rubric/security_review_secrev_custom_check@1.0
  tags:
  - mode:recipe
- id: secrev-permissions
  input: Which permissions does the Security Review module define to control access to its pages and to
    running checks?
  criteria: '''access security review list'' (view pages/settings) and ''run security checks'' (run the
    checks); grant to trusted users only.'
  bundle: security_review
  rubric_ref: rubric/security_review_secrev_permissions@1.0
  tags:
  - mode:recipe
- id: secrev-settings-route
  input: What is the admin path (and route name) for the Security Review settings form on a Drupal 11
    site, where I mark roles as untrusted?
  criteria: /admin/config/security-review (route security_review.settings), the SettingsForm where untrusted
    roles, logging, and skipped checks are configured.
  bundle: security_review
  rubric_ref: rubric/security_review_secrev_settings_route@1.0
  tags:
  - mode:recipe
- id: secrev-untrusted-roles
  input: In Security Review, which config key stores the roles treated as untrusted, and what are the
    default values?
  criteria: security_review.settings:untrusted_roles, defaulting to [anonymous, authenticated].
  bundle: security_review
  rubric_ref: rubric/security_review_secrev_untrusted_roles@1.0
  tags:
  - mode:recipe
- id: secrev-alter-extensions
  input: How can another module add an extra file extension to the list Security Review considers unsafe
    for upload? Name the alter hook.
  criteria: Implement hook_security_review_unsafe_extensions_alter(array &$variable) and append the extension.
  bundle: security_review
  rubric_ref: rubric/security_review_secrev_alter_extensions@1.0
  tags:
  - mode:recipe
- id: secrev-not-a-fixer
  input: Does enabling the Security Review module automatically harden or fix my Drupal site's security
    issues?
  criteria: No. It reports/raises awareness of issues; you must act on the findings and secure the site
    manually.
  bundle: security_review
  rubric_ref: rubric/security_review_secrev_not_a_fixer@1.0
  tags:
  - mode:recipe
