metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: select2_all
  version: 1.6.x
  note: 'Select2 (select2_all) is a front-end module with NO config, schema, permissions, or Drush. hook_element_info_alter()
    adds Select2::preRenderSelect as a #pre_render on the ''select'' element type (and types starting
    select_ / ending _select); it attaches the select2_all/drupal.select2 library (which depends on select2_all/select2)
    mainly in admin context. Per-element opt-in/out uses the #select2 FAPI property or the select2-enable
    / select2-disable CSS classes. The only server-observable, module-specific state is which source the
    ''select2'' library resolves to: hook_library_info_alter() replaces the CDN (jsDelivr select2@4.1.0-rc.0)
    with a LOCAL copy when DRUPAL_ROOT/libraries/select2/dist exists, pointing js/css at /libraries/select2/dist/...
    . medium cases inspect the resolved library (local vs CDN) via \Drupal::service(''library.discovery'');
    hard cases install the library locally and verify the ''select2'' library JS resolves to /libraries/select2/dist.
    easy cases are grounded in the opt-in/out mechanism and targeting rules.'
questions:
- id: select2_all-targeting
  input: How does the Drupal select2_all module decide which form elements get the Select2 widget, and
    in what context does it apply by default?
  criteria: 'It uses hook_element_info_alter() to add a #pre_render callback (Select2::preRenderSelect)
    to the ''select'' element type (plus types starting select_ or ending _select). By default it applies
    in admin context — an admin route, or when the active theme is the admin theme.'
  bundle: select2_all
  rubric_ref: rubric/select2_all_select2_all_targeting@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: select2_all-opt-out
  input: I want one specific select element to NOT be turned into a Select2 widget by select2_all. What
    is the recommended way to opt a single element out (and how would I force one in)?
  criteria: 'Opt out by setting the FAPI property #select2 => FALSE or adding the CSS class ''select2-disable''
    to the element (preRenderSelect returns early and attaches no library). Force it on with #select2
    => TRUE or the class ''select2-enable''.'
  bundle: select2_all
  rubric_ref: rubric/select2_all_select2_all_opt_out@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: select2_all-library-source
  input: Where does select2_all load the Select2 JavaScript library from by default, and how do I make
    Drupal serve it locally instead?
  criteria: By default the 'select2' library loads from the jsDelivr CDN (select2@4.1.0-rc.0). hook_library_info_alter()
    switches to a local copy if DRUPAL_ROOT/libraries/select2/dist exists, pointing js/css at /libraries/select2/dist/js/select2.min.js
    and .../css/select2.min.css. Place the library there and rebuild caches.
  bundle: select2_all
  rubric_ref: rubric/select2_all_select2_all_library_source@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: select2_all-detect-local
  input: On this site, inspect the resolved select2_all 'select2' library definition and state whether
    the Select2 JavaScript is currently being served from the external CDN or from a local path.
  criteria: 'It is served locally: \Drupal::service(''library.discovery'')->getLibraryByName(''select2_all'',''select2'')
    resolves the JS to /libraries/select2/dist/js/select2.min.js, because select2_all_library_info_alter()
    found web/libraries/select2/dist.'
  bundle: select2_all
  rubric_ref: rubric/select2_all_select2_all_detect_local@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/select2_all-local-lib-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/select2_all-local-lib-cleanup.sh
- id: select2_all-local-js-path
  input: The Select2 library on this site is being served from a local copy. Inspect the live library
    definition and give the exact JavaScript path (URL) that the select2_all 'select2' library now resolves
    to.
  criteria: The JS resolves to /libraries/select2/dist/js/select2.min.js (from getLibraryByName('select2_all','select2')
    -> js[0]['data']).
  bundle: select2_all
  rubric_ref: rubric/select2_all_select2_all_local_js_path@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/select2_all-local-lib-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/select2_all-local-lib-cleanup.sh
- id: select2_all-serve-local-expert
  input: Configure this site so the select2_all module serves the Select2 library from a LOCAL copy instead
    of the jsDelivr CDN. Place the library where select2_all_library_info_alter() expects it (DRUPAL_ROOT/libraries/select2/dist,
    with js/select2.min.js and css/select2.min.css) and rebuild caches so the 'select2' library resolves
    to the local files.
  criteria: After placing web/libraries/select2/dist/js/select2.min.js (and css/select2.min.css) and running
    drush cr, getLibraryByName('select2_all','select2') resolves its JS to /libraries/select2/dist/js/select2.min.js
    instead of the external CDN URL.
  bundle: select2_all
  rubric_ref: rubric/select2_all_select2_all_serve_local_expert@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/select2_all-serve-local-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/select2_all-serve-local-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/select2_all-serve-local-verify.sh
- id: select2_all-serve-local-layman
  input: Our site can't load scripts from outside CDNs. Make the searchable dropdowns (the Select2 module)
    load their JavaScript from our own server instead of the internet, and make the change take effect.
  criteria: 'Same end state as the expert case: the Select2 library is installed locally under web/libraries/select2/dist
    and, after a cache rebuild, the select2_all ''select2'' library serves its JS from /libraries/select2/dist/js/select2.min.js
    (no external CDN).'
  bundle: select2_all
  rubric_ref: rubric/select2_all_select2_all_serve_local_layman@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: site-owner
    reset: agent-module-documentation/evaluation/verify/select2_all-serve-local-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/select2_all-serve-local-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/select2_all-serve-local-verify.sh
