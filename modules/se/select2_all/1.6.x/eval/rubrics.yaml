rubrics:
- id: select2_all_select2_all_targeting
  version: '1.0'
  applicable_bundles:
  - select2_all
  checks:
  - kind: must_contain_any
    values:
    - element_info_alter
    - select
    - pre_render
    - preRenderSelect
    - admin
  scoring:
    combine: all_pass
- id: select2_all_select2_all_opt_out
  version: '1.0'
  applicable_bundles:
  - select2_all
  checks:
  - kind: must_contain_any
    values:
    - select2-disable
    - '#select2'
    - select2-enable
  scoring:
    combine: all_pass
- id: select2_all_select2_all_library_source
  version: '1.0'
  applicable_bundles:
  - select2_all
  checks:
  - kind: must_contain_any
    values:
    - libraries/select2/dist
    - CDN
    - jsDelivr
    - library_info_alter
  scoring:
    combine: all_pass
- id: select2_all_select2_all_detect_local
  version: '1.0'
  applicable_bundles:
  - select2_all
  checks:
  - kind: must_contain_any
    values:
    - local
    - /libraries/select2/dist
  scoring:
    combine: all_pass
- id: select2_all_select2_all_local_js_path
  version: '1.0'
  applicable_bundles:
  - select2_all
  checks:
  - kind: must_contain_any
    values:
    - /libraries/select2/dist/js/select2.min.js
  scoring:
    combine: all_pass
- id: select2_all_select2_all_serve_local_expert
  version: '1.0'
  applicable_bundles:
  - select2_all
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
- id: select2_all_select2_all_serve_local_layman
  version: '1.0'
  applicable_bundles:
  - select2_all
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
