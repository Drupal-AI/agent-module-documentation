metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: sendgrid_integration
  version: 2.3.x
  note: SendGrid Integration provides a MailInterface plugin, a config settings object, a resend queue,
    and send hooks. Cases are `recipe` (response-graded) — they probe documented facts an agent would
    otherwise read source to answer; no site mutation.
questions:
- id: sendgrid-mail-plugin-id
  input: On a Drupal 11 site, how do I make Drupal send its email through SendGrid using this module?
    Name the mail plugin id and the module that selects it as the mail system.
  criteria: The module provides a Mail plugin with id `sendgrid_integration` (SendGridMail, MailInterface);
    use the required Mailsystem module to select it as the site-wide or per-module mail system.
  bundle: sendgrid_integration
  rubric_ref: rubric/sendgrid_integration_sendgrid_mail_plugin_id@1.0
  tags:
  - mode:recipe
- id: sendgrid-api-key-config
  input: Where does SendGrid Integration read the API key from, and what config object/key holds it?
  criteria: The `apikey` key on the `sendgrid_integration.settings` config object. It is either the raw
    secret, or (when the Key module is enabled) the id of a Key entity resolved via key.repository.
  bundle: sendgrid_integration
  rubric_ref: rubric/sendgrid_integration_sendgrid_api_key_config@1.0
  tags:
  - mode:recipe
- id: sendgrid-key-module
  input: I have the Key module enabled. How does SendGrid Integration use it to get the API key?
  criteria: When the key module exists, the stored apikey value is treated as a Key id and resolved with
    \Drupal::service('key.repository')->getKey()->getKeyValue().
  bundle: sendgrid_integration
  rubric_ref: rubric/sendgrid_integration_sendgrid_key_module@1.0
  tags:
  - mode:recipe
- id: sendgrid-retry-queue
  input: What happens when a SendGrid send fails with a temporary error like a 503 or timeout in this
    module?
  criteria: On retryable codes (-110, 404, 408, 500, 502, 503, 504) the message is queued to the SendGridResendQueue
    queue worker and re-sent on cron (60-minute window).
  bundle: sendgrid_integration
  rubric_ref: rubric/sendgrid_integration_sendgrid_retry_queue@1.0
  tags:
  - mode:recipe
- id: sendgrid-template
  input: How do I send an email through this module using a SendGrid dynamic template with substitution
    values? Which message array keys control it?
  criteria: Set $message['sendgrid']['template_id'] for the template and $message['sendgrid']['substitutions']
    (key/value) for the substitutions.
  bundle: sendgrid_integration
  rubric_ref: rubric/sendgrid_integration_sendgrid_template@1.0
  tags:
  - mode:recipe
- id: sendgrid-categories-hook
  input: In a custom module I want to change the SendGrid categories used to tag outgoing mail. Which
    hook do I implement?
  criteria: Implement hook_sendgrid_integration_categories_alter($message, $categories) and return the
    modified categories array (default categories are site name, module, message id).
  bundle: sendgrid_integration
  rubric_ref: rubric/sendgrid_integration_sendgrid_categories_hook@1.0
  tags:
  - mode:recipe
- id: sendgrid-permission
  input: What permission gates the SendGrid Integration settings and test forms?
  criteria: The 'administer sendgrid settings' permission gates both the settings form and the test email
    form.
  bundle: sendgrid_integration
  rubric_ref: rubric/sendgrid_integration_sendgrid_permission@1.0
  tags:
  - mode:recipe
- id: sendgrid-test-form
  input: How can I verify my SendGrid configuration works from the admin UI on a Drupal site?
  criteria: Use the test form at /admin/config/services/sendgrid/test (route sendgrid_integration.test_form)
    to send a trial email.
  bundle: sendgrid_integration
  rubric_ref: rubric/sendgrid_integration_sendgrid_test_form@1.0
  tags:
  - mode:recipe
