metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: sendgrid_integration_reports
  version: 2.3.x
  note: 'Reports submodule of sendgrid_integration: a stats dashboard and an Api service over SendGrid''s
    v3 stats endpoints, with a dedicated cache bin. Cases are `recipe` (response-graded) — documented
    facts an agent would otherwise read source to answer; no site mutation.'
questions:
- id: sgr-dashboard-route
  input: Where is the SendGrid statistics dashboard in the Drupal admin, and what permission is needed
    to view it?
  criteria: The dashboard is at /admin/reports/sendgrid (route sendgrid_integration_reports.reports),
    viewable with the 'access site reports' permission.
  bundle: sendgrid_integration_reports
  rubric_ref: rubric/sendgrid_integration_reports_sgr_dashboard_route@1.0
  tags:
  - mode:recipe
- id: sgr-api-service
  input: Which service do I call to fetch SendGrid statistics programmatically in this submodule, and
    which method returns the global stats?
  criteria: Use the sendgrid_integration_reports.api service (Drupal\sendgrid_integration_reports\Api);
    getStats() returns the global (or category) stats array.
  bundle: sendgrid_integration_reports
  rubric_ref: rubric/sendgrid_integration_reports_sgr_api_service@1.0
  tags:
  - mode:recipe
- id: sgr-api-key-source
  input: Does the SendGrid Reports submodule have its own API key setting, or where does it get the key?
  criteria: It has no key of its own; it reads apikey from the parent module's sendgrid_integration.settings
    config (resolved via the Key module when enabled).
  bundle: sendgrid_integration_reports
  rubric_ref: rubric/sendgrid_integration_reports_sgr_api_key_source@1.0
  tags:
  - mode:recipe
- id: sgr-cache-bin
  input: SendGrid Reports caches its API responses. What cache bin does it use, and how can I move it
    to Redis or Memcache?
  criteria: A dedicated 'sendgrid_integration_reports' cache bin (service cache.sendgrid_integration_reports,
    tagged cache.bin); override that backend to use Redis/Memcache.
  bundle: sendgrid_integration_reports
  rubric_ref: rubric/sendgrid_integration_reports_sgr_cache_bin@1.0
  tags:
  - mode:recipe
- id: sgr-settings-keys
  input: What date range and aggregation does the SendGrid reports settings form control, and what are
    the defaults?
  criteria: start_date, end_date, and aggregated_by (day/week/month) on sendgrid_integration_reports.settings;
    defaults to the last 30 days aggregated by day.
  bundle: sendgrid_integration_reports
  rubric_ref: rubric/sendgrid_integration_reports_sgr_settings_keys@1.0
  tags:
  - mode:recipe
- id: sgr-bounces-subusers
  input: Which Api methods let me get bounce data and the list of SendGrid subusers?
  criteria: getBouncesBySubuser() (suppression/bounces endpoint) for bounces and getSubusers() (subusers
    endpoint) for the subuser list.
  bundle: sendgrid_integration_reports
  rubric_ref: rubric/sendgrid_integration_reports_sgr_bounces_subusers@1.0
  tags:
  - mode:recipe
