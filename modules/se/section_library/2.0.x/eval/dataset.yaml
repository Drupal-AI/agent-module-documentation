metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: section_library
  version: 2.0.x
  note: 'Section Library saves Layout Builder sections as reusable CONTENT: each saved section/page is
    a `section_library_template` content entity (base table `section_library_template`) with a `label`,
    a `type` of `section` or `template`, and the serialized layout in an unlimited-cardinality `layout_section`
    field. There is no plugin type and no Drush; the only config object is `section_library.settings`
    (two relabel keys). Easy `recipe` cases (response-graded) probe the entity/data model, the save/reuse
    flow, and the permission machine names. Medium `introspection` cases install two known templates and
    ask the agent to read the live library. Hard `execution` cases have the agent create a specific template
    entity, verified against live state.'
questions:
- id: sl-entity-type
  input: In the Section Library module on Drupal 11, when an editor saves a Layout Builder section to
    the library, what kind of thing is stored (config or content?), what is its entity type id, and where
    are saved templates managed in the admin?
  criteria: Each saved section/page is stored as a `section_library_template` CONTENT entity (not config;
    base table `section_library_template`), managed at Admin -> Content -> Section library (`/admin/content/section-library`).
  bundle: section_library
  rubric_ref: rubric/section_library_sl_entity_type@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: sl-section-vs-template
  input: Section Library can save either a single section or a whole page of sections. In the section_library_template
    entity, which field distinguishes the two and what are its two allowed values? Which field holds the
    actual serialized Layout Builder layout?
  criteria: The `type` field (a list_string) with allowed values `section` (a single section) and `template`
    (a whole page). The serialized Layout Builder section(s) live in the unlimited-cardinality `layout_section`
    field.
  bundle: section_library
  rubric_ref: rubric/section_library_sl_section_vs_template@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: sl-permissions
  input: List the machine names of the Section Library permissions, in particular the one required to
    import a saved template into a layout and the one that grants full administration of the template
    entities.
  criteria: 'Six permissions: `import template from section library` (import into a layout), `view section
    library templates`, `add section library templates`, `edit section library templates`, `delete section
    library templates`, and `administer section library template entities` (full admin).'
  bundle: section_library
  rubric_ref: rubric/section_library_sl_permissions@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: sl-intro-list
  input: This Drupal site already has some Section Library templates saved. Inspect the live site (drush
    is available) and tell me the label of every saved section_library_template entity, and for each whether
    it is a single 'section' or a whole-page 'template'.
  criteria: 'Two saved templates: ''Eval Landing Page'' (type=template, a whole page) and ''Eval Promo
    Section'' (type=section, a single section).'
  bundle: section_library
  rubric_ref: rubric/section_library_sl_intro_list@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    persona: drupal-expert
    setup: agent-module-documentation/evaluation/verify/section_library-intro-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/section_library-intro-cleanup.sh
- id: sl-intro-detail
  input: On this site, look at the saved Section Library template labelled 'Eval Landing Page'. How many
    Layout Builder sections does its layout_section field hold, and what is the layout id of its first
    section?
  criteria: '''Eval Landing Page'' holds 2 sections in its layout_section field; the first section''s
    layout id is `layout_onecol` (the second is `layout_twocol_section`).'
  bundle: section_library
  rubric_ref: rubric/section_library_sl_intro_detail@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    persona: drupal-expert
    setup: agent-module-documentation/evaluation/verify/section_library-intro-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/section_library-intro-cleanup.sh
- id: sl-build-hero
  input: On this Drupal site, create a Section Library entry so editors can reuse it. Add a `section_library_template`
    content entity labelled exactly 'Homepage Hero' that is a whole-page template (type `template`) and
    contains a single one-column Layout Builder section (layout id `layout_onecol`). Save it to the live
    site so it appears in the section library.
  criteria: Create a `section_library_template` entity with label 'Homepage Hero', type 'template', and
    one `layout_section` value that is a Layout Builder Section with layout id `layout_onecol` (e.g. via
    drush php:eval using \Drupal\layout_builder\Section and the entity storage), then save it.
  bundle: section_library
  rubric_ref: rubric/section_library_sl_build_hero@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/section_library-build-reset.sh
    verify: agent-module-documentation/evaluation/verify/section_library-hero-verify.sh
- id: sl-build-promo
  input: 'On this Drupal site, add a reusable single section to the Section Library: create a `section_library_template`
    content entity labelled exactly ''Promo Banner'' with type `section` (a single section, not a whole
    page) whose layout is a two-column Layout Builder section (layout id `layout_twocol_section`). Persist
    it to the running site.'
  criteria: Create a `section_library_template` entity with label 'Promo Banner', type 'section', and
    one `layout_section` value that is a Layout Builder Section with layout id `layout_twocol_section`,
    then save it.
  bundle: section_library
  rubric_ref: rubric/section_library_sl_build_promo@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/section_library-build-reset.sh
    verify: agent-module-documentation/evaluation/verify/section_library-promo-verify.sh
