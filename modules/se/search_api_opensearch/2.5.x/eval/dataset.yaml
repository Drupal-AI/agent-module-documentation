  criteria: It uses the 'basicauth' connector pointing at https://os-medium.example.com:9200 - search_api.server.sao_med_conn
    backend_config.connector = basicauth, connector_config.url = https://os-medium.example.com:9200.
  bundle: search_api_opensearch
  rubric_ref: rubric/search_api_opensearch_search_api_opensearch_connector_introspection@1.0
