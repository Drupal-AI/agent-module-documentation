metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: search_api_opensearch
  version: 2.5.x
  note: 'Search API OpenSearch provides a Search API backend plugin (id ''opensearch'') that indexes into
    and searches an OpenSearch cluster via connector plugins (standard, basicauth, aws_signature). Backend
    config = connector + connector_config (url, ssl_verification, ...) + advanced (fuzziness, prefix,
    synonyms). It defines two plugin types: opensearch_connector and opensearch_analyser (ngram, edge_ngram),
    plus extra Search API data types and events. IMPORTANT: this shared site has NO live OpenSearch cluster,
    so all cases are grounded in search_api.server backend/config, NOT live queries or indexing. Introspection
    reads a server''s connector/url/prefix from backend_config; execution creates an opensearch-backed
    server and switches its connector, verified against the live search_api.server config entity. Servers
    are namespaced sao_*.'
questions:
- id: search_api_opensearch-backend-id
  input: To use OpenSearch as a search backend in Drupal with Search API and the search_api_opensearch
    module, what is the machine id of the Search API backend plugin you select on the server, and at a
    high level how do you wire it up?
  criteria: Create a Search API server and choose the 'OpenSearch' backend (plugin id 'opensearch'); configure
    a connector with the cluster URL, then create an index pointing at that server.
  bundle: search_api_opensearch
  rubric_ref: rubric/search_api_opensearch_search_api_opensearch_backend_id@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: search_api_opensearch-connectors
  input: Which connector plugins does search_api_opensearch provide for reaching an OpenSearch cluster,
    and which one would you use for a cluster protected by HTTP basic authentication?
  criteria: standard (no auth) and basicauth (HTTP basic auth) ship in the module, and aws_signature comes
    from the AWS Signature submodule. For HTTP basic auth use the 'basicauth' connector (url + username
    + password).
  bundle: search_api_opensearch
  rubric_ref: rubric/search_api_opensearch_search_api_opensearch_connectors@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: search_api_opensearch-advanced-settings
  input: In the search_api_opensearch backend configuration, which 'advanced' settings let you control
    default query typo-tolerance, prefix index names, and provide related-term matching?
  criteria: backend_config.advanced has fuzziness (default query fuzziness, e.g. 'auto'), prefix (prepended
    to index names on the server), and synonyms (list applied at query time).
  bundle: search_api_opensearch
  rubric_ref: rubric/search_api_opensearch_search_api_opensearch_advanced_settings@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: search_api_opensearch-connector-introspection
