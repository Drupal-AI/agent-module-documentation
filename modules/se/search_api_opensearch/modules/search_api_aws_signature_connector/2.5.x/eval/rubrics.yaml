rubrics:
- id: search_api_aws_signature_connector_search_api_aws_signature_connector_purpose
  version: '1.0'
  applicable_bundles:
  - search_api_aws_signature_connector
  checks:
  - kind: must_contain_any
    values:
    - aws_signature
    - AWS Signature
    - Signature v4
    - SigV4
  scoring:
    combine: all_pass
- id: search_api_aws_signature_connector_search_api_aws_signature_connector_config_keys
  version: '1.0'
  applicable_bundles:
  - search_api_aws_signature_connector
  checks:
  - kind: must_contain_any
    values:
    - aws_region
    - api_key
    - api_secret
  scoring:
    combine: all_pass
- id: search_api_aws_signature_connector_search_api_aws_signature_connector_requirement
  version: '1.0'
  applicable_bundles:
  - search_api_aws_signature_connector
  checks:
  - kind: must_contain_any
    values:
    - aws/aws-sdk-php
    - aws-sdk-php
    - settings.php
  scoring:
    combine: all_pass
- id: search_api_aws_signature_connector_search_api_aws_signature_connector_region_introspection
  version: '1.0'
  applicable_bundles:
  - search_api_aws_signature_connector
  checks:
  - kind: must_contain_any
    values:
    - eu-west-1
  scoring:
    combine: all_pass
- id: search_api_aws_signature_connector_search_api_aws_signature_connector_use_connector
  version: '1.0'
  applicable_bundles:
  - search_api_aws_signature_connector
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
