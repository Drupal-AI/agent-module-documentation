metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: search_api_opensearch_location
  version: 2.5.x
  note: 'Submodule of search_api_opensearch. Provides a Search API data type plugin with id ''location''
    (label Geopoint, GeoPointDataType, uses geofield.geophp) and a DataTypeEventSubscriber that answers
    the parent module''s SupportsDataTypeEvent to mark ''location'' supported by the OpenSearch backend.
    Depends on search_api_opensearch + geofield. No settings/permissions/config schema. This site has
    no live OpenSearch cluster, so medium/hard cases are grounded in a real search_api.index config: a
    geofield on node indexed with the ''location'' data type. Introspection reads the field''s data type;
    execution changes an index field''s data type to ''location''. Artifacts namespaced field_saol_geo
    / saol_*.'
questions:
- id: search_api_opensearch_location-datatype
  input: What does the search_api_opensearch_location module add to Search API OpenSearch, and what is
    the machine id of the data type it provides?
  criteria: It adds a Search API data type with id 'location' (label 'Geopoint') that indexes geofield
    latitude/longitude values into OpenSearch as a geo_point.
  bundle: search_api_opensearch_location
  rubric_ref: rubric/search_api_opensearch_location_search_api_opensearch_location_datatype@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: search_api_opensearch_location-dependency
  input: Which contrib module must be installed for search_api_opensearch_location, and what kind of field
    data does it turn into a searchable geopoint?
  criteria: It depends on the geofield module (plus search_api_opensearch) and turns geofield latitude/longitude
    values into an OpenSearch geo_point.
  bundle: search_api_opensearch_location
  rubric_ref: rubric/search_api_opensearch_location_search_api_opensearch_location_dependency@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: search_api_opensearch_location-support-event
  input: How does search_api_opensearch_location make the OpenSearch backend accept its 'location' data
    type?
  criteria: A DataTypeEventSubscriber subscribes to the parent module's SupportsDataTypeEvent and calls
    setIsSupported(TRUE) when the type is 'location', so the OpenSearch backend maps it to a geo_point.
  bundle: search_api_opensearch_location
  rubric_ref: rubric/search_api_opensearch_location_search_api_opensearch_location_support_event@1.0
  tags:
  - mode:recipe
  - difficulty:easy
