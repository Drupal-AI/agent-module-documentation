rubrics:
- id: search_api_opensearch_location_search_api_opensearch_location_datatype
  version: '1.0'
  applicable_bundles:
  - search_api_opensearch_location
  checks:
  - kind: must_contain_any
    values:
    - location
    - geopoint
    - geo_point
    - Geopoint
  scoring:
    combine: all_pass
- id: search_api_opensearch_location_search_api_opensearch_location_dependency
  version: '1.0'
  applicable_bundles:
  - search_api_opensearch_location
  checks:
  - kind: must_contain_any
    values:
    - geofield
  scoring:
    combine: all_pass
- id: search_api_opensearch_location_search_api_opensearch_location_support_event
  version: '1.0'
  applicable_bundles:
  - search_api_opensearch_location
  checks:
  - kind: must_contain_any
    values:
    - SupportsDataTypeEvent
    - event subscriber
    - setIsSupported
    - geo_point
  scoring:
    combine: all_pass
- id: search_api_opensearch_location_search_api_opensearch_location_datatype_introspection
  version: '1.0'
  applicable_bundles:
  - search_api_opensearch_location
  checks:
  - kind: must_contain_any
    values:
    - location
  scoring:
    combine: all_pass
- id: search_api_opensearch_location_search_api_opensearch_location_set_datatype
  version: '1.0'
  applicable_bundles:
  - search_api_opensearch_location
  checks:
