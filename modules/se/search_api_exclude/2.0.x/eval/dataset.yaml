metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: search_api_exclude
  version: 2.0.x
  note: 'search_api_exclude is a small Search API add-on: a per-node exclude checkbox (a sae_exclude base
    field), a per-bundle third-party enable setting, and a node_exclude processor that drops excluded
    nodes at index time. Cases are `recipe` (response-graded) probing documented facts an agent would
    otherwise read source to answer; no site mutation.'
questions:
- id: sae-per-node-checkbox
  input: On a Drupal 11 site using Search API Exclude, how does an editor keep a single node out of the
    search index, and what field stores that flag?
  criteria: Check the 'Prevent this node from being indexed.' checkbox in the Search API Exclude group
    on the node form; it writes the sae_exclude boolean base field on the node.
  bundle: search_api_exclude
  rubric_ref: rubric/search_api_exclude_sae_per_node_checkbox@1.0
  tags:
  - mode:recipe
- id: sae-enable-per-bundle
  input: The exclude checkbox does not appear on my Article node form with Search API Exclude installed.
    How do I enable it for that content type, and where is that stored?
  criteria: Enable the 'Search API Exclude → Enabled' checkbox on the content-type form; it stores node.type.{bundle}
    third_party_settings.search_api_exclude.enabled = true. Only then does the per-node checkbox show.
  bundle: search_api_exclude
  rubric_ref: rubric/search_api_exclude_sae_enable_per_bundle@1.0
  tags:
  - mode:recipe
- id: sae-processor
  input: Which Search API processor enforces Search API Exclude's per-node exclusions, and at what stage
    does it run?
  criteria: The node_exclude processor (label 'Node exclude'), running in the alter_items stage, removes
    excluded node items before they reach the backend.
  bundle: search_api_exclude
  rubric_ref: rubric/search_api_exclude_sae_processor@1.0
  tags:
  - mode:recipe
- id: sae-enable-on-index
  input: I set the exclude checkbox on some nodes but they still show up in Search API results. What must
    I enable on the index for exclusion to take effect?
  criteria: Enable the 'Node exclude' (node_exclude) processor on the index's Processors tab, then reindex;
    without the processor the sae_exclude flag is not honored.
  bundle: search_api_exclude
  rubric_ref: rubric/search_api_exclude_sae_enable_on_index@1.0
  tags:
  - mode:recipe
- id: sae-dependency
  input: What module does Search API Exclude depend on, and what version constraint does its composer.json
    declare?
  criteria: It depends on Search API (search_api:search_api in info.yml); composer.json requires drupal/search_api
    ^1.3.
  bundle: search_api_exclude
  rubric_ref: rubric/search_api_exclude_sae_dependency@1.0
  tags:
  - mode:recipe
- id: sae-permission
  input: Which permission lets a user set the 'exclude from index' flag on a node with Search API Exclude?
  criteria: Search API Exclude defines no custom permission; any user with edit access to a node of an
    exclusion-enabled bundle can set the flag. Enabling exclusion per bundle uses core 'administer content
    types'.
  bundle: search_api_exclude
  rubric_ref: rubric/search_api_exclude_sae_permission@1.0
  tags:
  - mode:recipe
- id: sae-processor-support
  input: The node_exclude processor from Search API Exclude does not appear as an option on my Search
    API index. Why might that be?
  criteria: The processor's supportsIndex() only returns TRUE when the index has a datasource covering
    the node entity type; on non-node indexes it is unavailable.
  bundle: search_api_exclude
  rubric_ref: rubric/search_api_exclude_sae_processor_support@1.0
  tags:
  - mode:recipe
