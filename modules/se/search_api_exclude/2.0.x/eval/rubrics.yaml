rubrics:
- id: search_api_exclude_sae_per_node_checkbox
  version: '1.0'
  applicable_bundles:
  - search_api_exclude
  checks:
  - kind: must_contain_any
    values:
    - sae_exclude
    - Prevent this node from being indexed
  scoring:
    combine: all_pass
- id: search_api_exclude_sae_enable_per_bundle
  version: '1.0'
  applicable_bundles:
  - search_api_exclude
  checks:
  - kind: must_contain_any
    values:
    - third_party
    - search_api_exclude
    - Enabled
  scoring:
    combine: all_pass
- id: search_api_exclude_sae_processor
  version: '1.0'
  applicable_bundles:
  - search_api_exclude
  checks:
  - kind: must_contain_any
    values:
    - node_exclude
    - alter_items
    - Node exclude
  scoring:
    combine: all_pass
- id: search_api_exclude_sae_enable_on_index
  version: '1.0'
  applicable_bundles:
  - search_api_exclude
  checks:
  - kind: must_contain_any
    values:
    - processor
    - node_exclude
    - Node exclude
  scoring:
    combine: all_pass
- id: search_api_exclude_sae_dependency
  version: '1.0'
  applicable_bundles:
  - search_api_exclude
  checks:
  - kind: must_contain_any
    values:
    - search_api
    - ^1.3
  scoring:
    combine: all_pass
- id: search_api_exclude_sae_permission
  version: '1.0'
  applicable_bundles:
  - search_api_exclude
  checks:
  - kind: must_contain_any
    values:
    - edit
    - no custom permission
    - node edit
    - administer content types
  scoring:
    combine: all_pass
- id: search_api_exclude_sae_processor_support
  version: '1.0'
  applicable_bundles:
  - search_api_exclude
  checks:
  - kind: must_contain_any
    values:
    - node
    - datasource
    - supportsIndex
  scoring:
    combine: all_pass
