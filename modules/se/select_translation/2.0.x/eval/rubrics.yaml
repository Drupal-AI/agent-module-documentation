rubrics:
- id: select_translation_select_translation_plugin_id
  version: '1.0'
  applicable_bundles:
  - select_translation
  checks:
  - kind: must_contain_any
    values:
    - select_translation_filter
  scoring:
    combine: all_pass
- id: select_translation_select_translation_modes
  version: '1.0'
  applicable_bundles:
  - select_translation
  checks:
  - kind: must_contain_any
    values:
    - original
    - default
    - fallback
    - list
  scoring:
    combine: all_pass
- id: select_translation_select_translation_priority_tokens
  version: '1.0'
  applicable_bundles:
  - select_translation
  checks:
  - kind: must_contain_any
    values:
    - current
    - default
    - original
  scoring:
    combine: all_pass
- id: select_translation_select_translation_filter_mode
  version: '1.0'
  applicable_bundles:
  - select_translation
  checks:
  - kind: must_contain_any
    values:
    - fr,en,current
    - list
    - custom
  scoring:
    combine: all_pass
- id: select_translation_select_translation_unpublished_fallback
  version: '1.0'
  applicable_bundles:
  - select_translation
  checks:
  - kind: must_contain_any
    values:
    - 'yes'
    - enabled
    - include_content_with_unpublished_translation
    - is enabled
    - turned on
  - kind: must_not_contain
    values:
    - not enabled
    - is disabled
    - not set
  scoring:
    combine: all_pass
- id: select_translation_select_translation_add_original
  version: '1.0'
  applicable_bundles:
  - select_translation
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
- id: select_translation_select_translation_custom_priority
  version: '1.0'
  applicable_bundles:
  - select_translation
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
