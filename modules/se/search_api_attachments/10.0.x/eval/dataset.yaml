metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: search_api_attachments
  version: 10.0.x
  note: Search API Attachments defines a TextExtractor plugin type, a Search API processor that adds a
    per-file-field attachments field, an extractor/cache config object, and two hooks. Cases are `recipe`
    (response-graded) since they probe documented facts an agent would otherwise read source to answer;
    no site mutation.
questions:
- id: saa-purpose-and-dependency
  input: On a Drupal 11 site I want the text inside uploaded PDFs and Office files to be full-text searchable
    in my Search API index. Which contrib module does this, and which module must be enabled for it?
  criteria: Search API Attachments (search_api_attachments) extracts text from attached files and indexes
    it; it depends on and requires the search_api module.
  bundle: search_api_attachments
  rubric_ref: rubric/search_api_attachments_saa_purpose_and_dependency@1.0
  tags:
  - mode:recipe
- id: saa-processor-and-field
  input: How do I actually get attachment content into a Search API index with Search API Attachments?
    Which processor do I enable and what field does it expose per file field?
  criteria: Enable the 'file_attachments' processor on the index; it exposes a string property saa_<field_name>
    per file field (and saa_file_entity for an entity:file datasource) that you add as a Field and reindex.
  bundle: search_api_attachments
  rubric_ref: rubric/search_api_attachments_saa_processor_and_field@1.0
  tags:
  - mode:recipe
- id: saa-choose-extractor
  input: Which text extraction backends does Search API Attachments support, and where do I select and
    configure the one to use?
  criteria: It ships Tika App (tika_extractor), Tika Server (tika_server_extractor), Solr (solr_extractor),
    pdftotext, python pdf2txt, and docconv extractors; choose one via extraction_method at /admin/config/search/search_api_attachments,
    stored in search_api_attachments.admin_config.
  bundle: search_api_attachments
  rubric_ref: rubric/search_api_attachments_saa_choose_extractor@1.0
  tags:
  - mode:recipe
- id: saa-textextractor-plugin
  input: I want to add my own file text-extraction backend to Search API Attachments. What plugin type
    do I implement, which base class/annotation and namespace, and which method must I write?
  criteria: 'Implement the TextExtractor plugin type: a class in Plugin/search_api_attachments annotated
    @SearchApiAttachmentsTextExtractor extending TextExtractorPluginBase, implementing extract(File $file)
    to return the text.'
  bundle: search_api_attachments
  rubric_ref: rubric/search_api_attachments_saa_textextractor_plugin@1.0
  tags:
  - mode:recipe
- id: saa-extraction-limits
  input: In Search API Attachments, which processor settings control the maximum file size that gets indexed,
    the excluded file extensions, and how much extracted text is stored?
  criteria: 'On the file_attachments processor: max_filesize (skip larger files, default 0/no limit),
    excluded_extensions (space-separated list mapped to MIME types), and number_first_bytes (byte cap
    on stored extracted text, default 1 MB).'
  bundle: search_api_attachments
  rubric_ref: rubric/search_api_attachments_saa_extraction_limits@1.0
  tags:
  - mode:recipe
- id: saa-exclude-file-hook
  input: In a custom Drupal module, how do I prevent certain attached files from being indexed by Search
    API Attachments? Which hook do I implement and what return value skips a file?
  criteria: Implement hook_search_api_attachments_indexable($file, ItemInterface $item, $field_name) and
    return FALSE to skip indexing that file.
  bundle: search_api_attachments
  rubric_ref: rubric/search_api_attachments_saa_exclude_file_hook@1.0
  tags:
  - mode:recipe
- id: saa-tika-config
  input: I'm using the Tika App extractor with Search API Attachments. Which config object and keys hold
    the path to the Tika jar and the java executable?
  criteria: The search_api_attachments.admin_config config object holds tika_extractor_configuration with
    tika_path (the Tika .jar) and java_path (default 'java').
  bundle: search_api_attachments
  rubric_ref: rubric/search_api_attachments_saa_tika_config@1.0
  tags:
  - mode:recipe
- id: saa-permission
  input: Which permission gates access to the Search API Attachments settings form where the extraction
    command is configured?
  criteria: The 'administer search_api_attachments' permission gates the settings form (search_api_attachments.admin_form)
    where the extractor is configured.
  bundle: search_api_attachments
  rubric_ref: rubric/search_api_attachments_saa_permission@1.0
  tags:
  - mode:recipe
