metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: seo_checklist
  version: 5.2.x
  note: 'SEO Checklist is a Checklist API consumer: it registers one checklist via hook_checklistapi_checklist_info()
    and provides no config form, permissions, services, or Drush of its own. Cases are `recipe` (response-graded)
    probing documented facts an agent would otherwise read source to answer; no site mutation.'
questions:
- id: seo_checklist-what-it-is
  input: On a Drupal 11 site, what does the SEO Checklist module actually provide, and which module does
    it depend on to work?
  criteria: A persistent, fillable checklist of SEO tasks/recommended modules; it provides little on its
    own and depends on Checklist API (checklistapi:checklistapi).
  bundle: seo_checklist
  rubric_ref: rubric/seo_checklist_seo_checklist_what_it_is@1.0
  tags:
  - mode:recipe
- id: seo_checklist-where-it-lives
  input: Where do I open the SEO Checklist in the admin UI, and what is its configure route name?
  criteria: At /admin/config/search/seo-checklist (Admin > Configuration > Search and metadata > SEO Checklist);
    the configure route is checklistapi.checklists.seo_checklist, provided by Checklist API.
  bundle: seo_checklist
  rubric_ref: rubric/seo_checklist_seo_checklist_where_it_lives@1.0
  tags:
  - mode:recipe
- id: seo_checklist-info-hook
  input: How does the SEO Checklist module define its list of SEO tasks in code? Which hook does it implement?
  criteria: 'It implements hook_checklistapi_checklist_info() (seo_checklist_checklistapi_checklist_info)
    to register the ''seo_checklist'' checklist, with a #callback returning the grouped items.'
  bundle: seo_checklist
  rubric_ref: rubric/seo_checklist_seo_checklist_info_hook@1.0
  tags:
  - mode:recipe
- id: seo_checklist-augmented-keys
  input: In the SEO Checklist item definitions, which custom key marks a recommended contrib module (and
    pre-checks the item if it is installed), and which key points to that module's configuration route?
  criteria: '#module is the recommended module''s project/machine name (pre-checks via #default_value
    when installed and adds Download/Install links); #configure is the route name of that module''s settings
    page, rendered as a Configure link.'
  bundle: seo_checklist
  rubric_ref: rubric/seo_checklist_seo_checklist_augmented_keys@1.0
  tags:
  - mode:recipe
- id: seo_checklist-progress-storage
  input: Where does the SEO Checklist store which items have been completed, and what happens to that
    data when the module is uninstalled?
  criteria: Progress is stored by Checklist API in the config object checklistapi.progress.seo_checklist;
    hook_uninstall() deletes it when the module is uninstalled.
  bundle: seo_checklist
  rubric_ref: rubric/seo_checklist_seo_checklist_progress_storage@1.0
  tags:
  - mode:recipe
- id: seo_checklist-alter
  input: From a custom module I want to add an extra task to the SEO Checklist. Which hook do I implement?
  criteria: Implement hook_checklistapi_checklist_info_alter() (provided by Checklist API) and modify
    $definitions['seo_checklist'].
  bundle: seo_checklist
  rubric_ref: rubric/seo_checklist_seo_checklist_alter@1.0
  tags:
  - mode:recipe
- id: seo_checklist-provides
  input: Does the SEO Checklist module define its own permissions, config settings form, or Drush commands?
  criteria: No — it defines no permissions, no settings form, no services, and no Drush commands of its
    own; the route, permissions, UI, and persistence come from Checklist API.
  bundle: seo_checklist
  rubric_ref: rubric/seo_checklist_seo_checklist_provides@1.0
  tags:
  - mode:recipe
