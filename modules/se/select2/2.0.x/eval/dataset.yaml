metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: select2
  version: 2.0.x
  note: Select2 exposes two field widgets, a `select2` render element, an AJAX autocomplete route + matcher
    service, and an alter hook. It depends on the external Select2 JS library. Cases are `recipe` (response-graded)
    since they probe documented facts an agent would otherwise read source to answer; no site mutation.
questions:
- id: select2-widget-ids
  input: On a Drupal 11 site with the Select2 module, which field-widget plugin id do I choose in Manage
    form display for (a) a list_string select field and (b) an entity_reference field?
  criteria: The `select2` widget for list fields (list_integer/list_float/list_string) and `select2_entity_reference`
    for entity_reference fields.
  bundle: select2
  rubric_ref: rubric/select2_select2_widget_ids@1.0
  tags:
  - mode:recipe
- id: select2-render-element
  input: 'In a custom Drupal form I want a searchable Select2 dropdown. What #type do I use for the render
    element, and which module provides it?'
  criteria: Use '#type' => 'select2' (the Drupal\select2\Element\Select2 render element, which extends
    core Select) provided by the Select2 module.
  bundle: select2
  rubric_ref: rubric/select2_select2_render_element@1.0
  tags:
  - mode:recipe
- id: select2-autocomplete-ajax
  input: I have an entity reference field with thousands of possible targets and want the Select2 widget
    to lazy-load options over AJAX instead of rendering them all. Which widget setting enables this, and
    which route serves the matches?
  criteria: Enable the `autocomplete` widget setting; matches are fetched from the select2.entity_autocomplete
    route (/select2_autocomplete/{target_type}/{selection_handler}/{selection_settings_key}). match_operator
    (CONTAINS/STARTS_WITH) and match_limit tune it.
  bundle: select2
  rubric_ref: rubric/select2_select2_autocomplete_ajax@1.0
  tags:
  - mode:recipe
- id: select2-autocreate-tags
  input: How do I let editors create new taxonomy terms on the fly by typing them into a Select2 entity
    reference field (tags behaviour)?
  criteria: 'Enable the entity reference field handler''s ''Create referenced entities if they don''t
    already exist'' (auto_create) setting; the Select2 widget then turns on Select2 tags mode (#autocreate)
    and creates the entity on save. For the render element, set #autocreate => [''bundle'' => ''tags''].'
  bundle: select2
  rubric_ref: rubric/select2_select2_autocreate_tags@1.0
  tags:
  - mode:recipe
- id: select2-js-library-dependency
  input: The Select2 widgets aren't styled/working after enabling the module. Which external library must
    be installed and where, and which Drupal asset library does the module attach?
  criteria: The external Select2 JS library (>=4.0.x) must be installed at web/libraries/select2 (dist/js/select2.min.js
    + dist/css/select2.min.css). The module attaches the select2/select2 asset library (which depends
    on select2/select2.min and core/sortable).
  bundle: select2
  rubric_ref: rubric/select2_select2_js_library_dependency@1.0
  tags:
  - mode:recipe
- id: select2-override-config
  input: 'I want to override a raw Select2 JavaScript option (e.g. allowClear or minimumInputLength) on
    a #type select2 render element. Which element property do I use?'
  criteria: Use the '#select2' property (an array of Select2 options) — it is merged into data-select2-config
    and overrides the module's defaults.
  bundle: select2
  rubric_ref: rubric/select2_select2_override_config@1.0
  tags:
  - mode:recipe
- id: select2-matches-alter-hook
  input: In a custom Drupal module I want to annotate or modify the autocomplete match results the Select2
    module returns. Which hook do I implement?
  criteria: Implement hook_select2_autocomplete_matches_alter(array &$matches, array $options); it is
    invoked by the select2.autocomplete_matcher service (EntityAutocompleteMatcher::getMatches()).
  bundle: select2
  rubric_ref: rubric/select2_select2_matches_alter_hook@1.0
  tags:
  - mode:recipe
- id: select2-submodules
  input: Which Select2 submodule adds a Select2 widget to the Facets module, and which one shows the published
    status of referenced entities in the dropdown?
  criteria: select2_facets provides a Select2 facet widget; select2_publish indicates the published/unpublished
    status of referenced entities.
  bundle: select2
  rubric_ref: rubric/select2_select2_submodules@1.0
  tags:
  - mode:recipe
