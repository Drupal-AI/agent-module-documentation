    values:
    - select2_entity_reference
  scoring:
    combine: all_pass
- id: select2_select2_render_element
  version: '1.0'
  applicable_bundles:
  - select2
  checks:
  - kind: must_contain_any
    values:
    - '''select2'''
    - '#type'
    - select2
  scoring:
    combine: all_pass
- id: select2_select2_autocomplete_ajax
  version: '1.0'
  applicable_bundles:
  - select2
  checks:
  - kind: must_contain_any
