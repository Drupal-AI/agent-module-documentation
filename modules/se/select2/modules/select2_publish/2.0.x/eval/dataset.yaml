metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: select2_publish
  version: 2.0.x
  note: Submodule of select2. Marks referenced entities in a Select2 widget with their published status
    via two hooks and an asset library; no configuration. Cases are `recipe` (response-graded); no site
    mutation.
questions:
- id: select2-publish-purpose
  input: On a Drupal 11 site I want editors to see which referenced entities are unpublished directly
    in a Select2 entity reference dropdown. Which module provides this and how much configuration does
    it need?
  criteria: The Select2 Publish (select2_publish) submodule; it needs no configuration — enable it and
    Select2 entity reference widgets gain published/unpublished indicators.
  bundle: select2_publish
  rubric_ref: rubric/select2_publish_select2_publish_purpose@1.0
  tags:
  - mode:recipe
- id: select2-publish-dependencies
  input: Which modules does Select2 Publish depend on, and why does it need form_options_attributes?
  criteria: It depends on select2 and form_options_attributes; form_options_attributes renders the data-published
    attribute onto each <option> element.
  bundle: select2_publish
  rubric_ref: rubric/select2_publish_select2_publish_dependencies@1.0
  tags:
  - mode:recipe
- id: select2-publish-autocomplete-hook
  input: How does Select2 Publish flag published status on lazily-loaded (autocomplete/AJAX) Select2 suggestions?
  criteria: It implements hook_select2_autocomplete_matches_alter() to add a `published` flag to each
    autocomplete match returned by the Select2 matcher.
  bundle: select2_publish
  rubric_ref: rubric/select2_publish_select2_publish_autocomplete_hook@1.0
  tags:
  - mode:recipe
- id: select2-publish-rendered-options
  input: How does Select2 Publish add the published status to rendered (non-AJAX) Select2 options?
  criteria: 'Via hook_element_info_alter() it adds a StatusProperties::preRender pre-render callback to
    the select2 element that sets #options_attributes[...][''data-published''] on each option.'
  bundle: select2_publish
  rubric_ref: rubric/select2_publish_select2_publish_rendered_options@1.0
  tags:
  - mode:recipe
- id: select2-publish-entity-scope
  input: Which referenced entity types does Select2 Publish decorate with status indicators?
  criteria: Only entity types whose class implements EntityPublishedInterface (publishable entity types);
    others are left untouched.
  bundle: select2_publish
  rubric_ref: rubric/select2_publish_select2_publish_entity_scope@1.0
  tags:
  - mode:recipe
- id: select2-publish-library
  input: What styles the unpublished options differently in the Select2 dropdown once Select2 Publish
    is enabled?
  criteria: The select2_publish/select2.publish asset library (CSS + JS) attached automatically by the
    pre-render, consuming the data-published attributes.
  bundle: select2_publish
  rubric_ref: rubric/select2_publish_select2_publish_library@1.0
  tags:
  - mode:recipe
