metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: select2_facets
  version: 2.0.x
  note: Submodule of select2. Registers a `select2` Facets widget with optional AJAX autocomplete of facet
    values. Cases are `recipe` (response-graded); no site mutation.
questions:
- id: select2-facets-purpose
  input: On a Drupal 11 site using the Facets module, how do I make a facet render as a searchable Select2
    dropdown? Which module and which facet widget?
  criteria: Enable the Select2 Facets (select2_facets) submodule and set the facet's Widget to Select2
    (FacetsWidget id `select2`).
  bundle: select2_facets
  rubric_ref: rubric/select2_facets_select2_facets_purpose@1.0
  tags:
  - mode:recipe
- id: select2-facets-widget-id
  input: What is the FacetsWidget plugin id provided by Select2 Facets?
  criteria: The widget id is `select2` (Drupal\select2_facets\Plugin\facets\widget\Select2Widget).
  bundle: select2_facets
  rubric_ref: rubric/select2_facets_select2_facets_widget_id@1.0
  tags:
  - mode:recipe
- id: select2-facets-dependencies
  input: Which two modules must be enabled for Select2 Facets to work?
  criteria: It depends on the Facets module (facets) and the Select2 main module (select2).
  bundle: select2_facets
  rubric_ref: rubric/select2_facets_select2_facets_dependencies@1.0
  tags:
  - mode:recipe
- id: select2-facets-autocomplete
  input: A facet has thousands of values. How do I make the Select2 facet widget lazy-load values over
    AJAX, and which route serves them?
  criteria: Enable the widget's `autocomplete` config setting; values are fetched over AJAX from the select2_facets.facet_autocomplete
    route (/select2_facets_autocomplete/{facetsource_id}/{facet_id}/{selection_settings_key}).
  bundle: select2_facets
  rubric_ref: rubric/select2_facets_select2_facets_autocomplete@1.0
  tags:
  - mode:recipe
- id: select2-facets-single-multi
  input: How does the Select2 facet widget decide between single-select and multi-select?
  criteria: 'It uses the facet''s ''show only one result'' setting: when that is on the widget is single-select
    (#multiple off), otherwise multi-select.'
  bundle: select2_facets
  rubric_ref: rubric/select2_facets_select2_facets_single_multi@1.0
  tags:
  - mode:recipe
- id: select2-facets-config-keys
  input: Which configuration keys does the Select2 facet widget expose on its widget config form?
  criteria: width, autocomplete, and match_operator (STARTS_WITH/CONTAINS), backed by the facet.widget.config.select2
    schema.
  bundle: select2_facets
  rubric_ref: rubric/select2_facets_select2_facets_config_keys@1.0
  tags:
  - mode:recipe
