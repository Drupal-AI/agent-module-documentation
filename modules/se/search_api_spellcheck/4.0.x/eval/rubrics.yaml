rubrics:
- id: search_api_spellcheck_sais_did_you_mean_plugins
  version: '1.0'
  applicable_bundles:
  - search_api_spellcheck
  checks:
  - kind: must_contain_any
    values:
    - search_api_spellcheck_did_you_mean
    - Did You Mean
    - search_api_spellcheck_suggestions
    - Suggestions
  scoring:
    combine: all_pass
- id: search_api_spellcheck_sais_backend_requirement
  version: '1.0'
  applicable_bundles:
  - search_api_spellcheck
  checks:
  - kind: must_contain_any
    values:
    - supportsFeature
    - search_api_spellcheck
    - Solr
    - solr
  scoring:
    combine: all_pass
- id: search_api_spellcheck_sais_options
  version: '1.0'
  applicable_bundles:
  - search_api_spellcheck
  checks:
  - kind: must_contain_any
    values:
    - search_api_spellcheck_hide_on_result
    - hide_on_result
    - search_api_spellcheck_count
    - search_api_spellcheck_collate
  scoring:
    combine: all_pass
- id: search_api_spellcheck_sais_known_handler
  version: '1.0'
  applicable_bundles:
  - search_api_spellcheck
  checks:
  - kind: must_contain_any
    values:
    - search_api_spellcheck_did_you_mean
  scoring:
    combine: all_pass
- id: search_api_spellcheck_sais_footer_suggestions
  version: '1.0'
  applicable_bundles:
  - search_api_spellcheck
  checks:
  - kind: must_contain_any
    values:
    - footer
  scoring:
    combine: all_pass
- id: search_api_spellcheck_sais_add_did_you_mean
  version: '1.0'
  applicable_bundles:
  - search_api_spellcheck
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
- id: search_api_spellcheck_sais_add_suggestions
  version: '1.0'
  applicable_bundles:
  - search_api_spellcheck
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
