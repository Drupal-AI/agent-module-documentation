metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: rules
  version: 4.0.x
  note: Rules exposes the event-condition-action reaction model, several plugin types (RulesAction, Condition,
    RulesExpression, RulesEvent, RulesDataProcessor), two config entities, and an expression engine built
    on typed_data. Cases are `recipe` (response-graded) probing documented facts an agent would otherwise
    read source to answer; no site mutation.
questions:
- id: rules-eca-model
  input: On a Drupal 11 site with the Rules module, describe the three-part model a Reaction Rule uses
    to automate behavior when something happens on the site.
  criteria: A reaction rule reacts to an event, evaluates conditions, and if they pass runs actions (the
    event-condition-action / ECA model).
  bundle: rules
  rubric_ref: rubric/rules_rules_eca_model@1.0
  tags:
  - mode:recipe
- id: rules-plugin-types-namespaces
  input: In the Rules module, which plugin namespace do I put a custom action class in, and which base
    class and attribute does it use?
  criteria: A custom action goes in Plugin/RulesAction, extends RulesActionBase, and is declared with
    the RulesAction attribute (or @RulesAction annotation); implement doExecute().
  bundle: rules
  rubric_ref: rubric/rules_rules_plugin_types_namespaces@1.0
  tags:
  - mode:recipe
- id: rules-reaction-vs-component
  input: Rules provides two config entity types. Which one is bound to events and runs automatically,
    and which one is reusable logic invoked by something else? Give both machine names.
  criteria: rules_reaction_rule is triggered automatically by its events; rules_component is standalone
    reusable logic invoked from other rules or code.
  bundle: rules
  rubric_ref: rubric/rules_rules_reaction_vs_component@1.0
  tags:
  - mode:recipe
- id: rules-typed-data-dep
  input: Which contributed module is a required dependency of Rules and underpins how it passes data between
    conditions and actions via context definitions?
  criteria: The typed_data module (typed_data:typed_data) is required; Rules context definitions and data
    selectors are built on it.
  bundle: rules
  rubric_ref: rubric/rules_rules_typed_data_dep@1.0
  tags:
  - mode:recipe
- id: rules-expression-engine
  input: In code I want to build a rule programmatically with the Rules expression manager. Which service
    do I use and what are the expression plugin IDs for a rule, an AND condition group, and a loop?
  criteria: Use the plugin.manager.rules_expression (ExpressionManager) service; expression IDs include
    rules_rule, rules_and (also rules_or), and rules_loop, plus rules_action / rules_condition / rules_action_set.
  bundle: rules
  rubric_ref: rubric/rules_rules_expression_engine@1.0
  tags:
  - mode:recipe
- id: rules-configure-route
  input: What admin path and configure route does Rules use to list and manage reaction rules on a Drupal
    site?
  criteria: The Rules listing is at /admin/config/workflow/rules, configure route entity.rules_reaction_rule.collection
    (Admin > Configuration > Workflow > Rules).
  bundle: rules
  rubric_ref: rubric/rules_rules_configure_route@1.0
  tags:
  - mode:recipe
- id: rules-permissions
  input: Which Rules permissions separately gate administering reaction rules versus administering reusable
    components, and which permission grants full Rules administration?
  criteria: '''administer rules reactions'' gates reaction rules, ''administer rules components'' gates
    components, and ''administer rules'' grants full Rules administration (plus ''bypass rules access''
    and ''access rules debug'').'
  bundle: rules
  rubric_ref: rubric/rules_rules_permissions@1.0
  tags:
  - mode:recipe
- id: rules-drush-list
  input: Which Drush command lists the reaction rules and components on a Rules-enabled site, and which
    commands enable or disable a reaction rule?
  criteria: drush rules:list lists rules/components; drush rules:enable and drush rules:disable toggle
    a reaction rule (rules:delete removes one).
  bundle: rules
  rubric_ref: rubric/rules_rules_drush_list@1.0
  tags:
  - mode:recipe
