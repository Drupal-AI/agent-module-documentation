metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: range_slider
  version: 2.1.x
  note: Range Slider provides a range_slider form element (extends core Range), a field widget id 'range_slider'
    for core integer/decimal/float fields, and a Webform element. Widget settings (schema field.widget.settings.range_slider)
    are orientation (horizontal|vertical) and output (_none_|below|above|left|right), stored on the entity_form_display
    component. No permissions, no Drush, no configure route. Medium creates an integer field on Article
    with the range_slider widget (orientation=vertical, output=above) and reads it back; hard switches
    an existing integer field's form-display component to the range_slider widget, verified against live
    config. All fixture fields are namespaced field_rs_*.
questions:
- id: range_slider-field-types
  input: The Drupal Range Slider module adds a field widget. On which core field types can the range_slider
    widget be used, and what is the widget's plugin id?
  criteria: 'The widget plugin id is range_slider and it can be used on core numeric fields: integer,
    decimal, and float.'
  bundle: range_slider
  rubric_ref: rubric/range_slider_range_slider_field_types@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: range_slider-settings
  input: What two settings does the Range Slider field widget expose, and what values can each take?
  criteria: orientation (horizontal or vertical) and output (none / _none_, below, above, left, or right).
    They are stored under field.widget.settings.range_slider on the form-display component.
  bundle: range_slider
  rubric_ref: rubric/range_slider_range_slider_settings@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: range_slider-form-element
  input: How do I render a Range Slider directly in a custom Drupal form or render array (not via a field),
    and how do I show the current value with a unit suffix?
  criteria: 'Use a render element with ''#type'' => ''range_slider'' (class Element\RangeSlider extends
    core Range), set #min/#max, and set #output to below/above/left/right plus #output__field_prefix /
    #output__field_suffix (e.g. ''$'' … ''USD'') to print the live value with units.'
  bundle: range_slider
  rubric_ref: rubric/range_slider_range_slider_form_element@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: range_slider-known-widget
  input: On this site, the Article content type has a number field whose form widget is the Range Slider.
    Inspect the live default form display and give the machine name of that field and its Range Slider
    orientation setting.
  criteria: The field is field_rs_known; in core.entity_form_display.node.article.default its component
    uses type range_slider with settings.orientation = vertical (and settings.output = above).
  bundle: range_slider
  rubric_ref: rubric/range_slider_range_slider_known_widget@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/range_slider-known-widget-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/range_slider-known-widget-cleanup.sh
- id: range_slider-set-widget
  input: On this site the Article content type has an integer field field_rs_task that currently uses
    the plain number widget. Switch its widget on the default form display to the Range Slider widget
    and apply the change to the live site.
  criteria: In core.entity_form_display.node.article.default the field_rs_task component has type = range_slider
    (e.g. setComponent('field_rs_task', ['type' => 'range_slider', 'region' => 'content', 'settings' =>
    [...]])->save()).
  bundle: range_slider
  rubric_ref: rubric/range_slider_range_slider_set_widget@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/range_slider-set-widget-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/range_slider-set-widget-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/range_slider-set-widget-verify.sh
