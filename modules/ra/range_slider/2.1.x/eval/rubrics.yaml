rubrics:
- id: range_slider_range_slider_field_types
  version: '1.0'
  applicable_bundles:
  - range_slider
  checks:
  - kind: must_contain_any
    values:
    - integer
    - decimal
    - float
    - range_slider
  scoring:
    combine: all_pass
- id: range_slider_range_slider_settings
  version: '1.0'
  applicable_bundles:
  - range_slider
  checks:
  - kind: must_contain_any
    values:
    - orientation
    - output
  scoring:
    combine: all_pass
- id: range_slider_range_slider_form_element
  version: '1.0'
  applicable_bundles:
  - range_slider
  checks:
  - kind: must_contain_any
    values:
    - '''#type'' => ''range_slider'''
    - range_slider
    - '#output'
    - '#output__field_suffix'
  scoring:
    combine: all_pass
- id: range_slider_range_slider_known_widget
  version: '1.0'
  applicable_bundles:
  - range_slider
  checks:
  - kind: must_contain_any
    values:
    - field_rs_known
  scoring:
    combine: all_pass
- id: range_slider_range_slider_set_widget
  version: '1.0'
  applicable_bundles:
  - range_slider
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
