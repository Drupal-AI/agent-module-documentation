metadata:
  module: raven
  version: 7.4.x
  skill_name: drupal-module-docs
  note: Raven is a Sentry logging/monitoring integration. Its entire configurable surface is the single
    raven.settings config object (surfaced on the core system.logging_settings form) plus two Drush commands
    and two events; it defines no config or content entities and no plugin manager (the CspReportingHandler
    it ships implements the CSP module's plugin type). All medium and hard cases are therefore grounded
    in real raven.settings keys taken from config/schema/raven.schema.yml.
