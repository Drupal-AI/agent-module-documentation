metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: ratio_crop
  version: 2.1.x
  note: Ratio Crop provides one configurable core image effect, image_crop_ratio ('Ratio crop'), plus
    a bundled GD toolkit operation gd_crop_ratio (operation 'crop_ratio'). It has no configure route,
    no permissions, no services and no settings form; all state lives inside an image style config entity
    (image.style.<name>) as an effect with data.aspect_ratio ('W:H') and data.anchor. Medium/hard cases
    are grounded in real image styles created/inspected on the live site; everything is local (no external
    services).
questions:
- id: ratio_crop-effect-id
  input: On a Drupal 11 site I want to crop images to a fixed aspect ratio using the ratio_crop module.
    Which image effect plugin do I add to an image style, and what is the machine name I would see in
    the exported image style config?
  criteria: 'You add the ''Ratio crop'' effect, whose plugin id is image_crop_ratio, to an image style
    at /admin/config/media/image-styles. In exported config it appears under effects.<uuid>.id: image_crop_ratio.'
  bundle: ratio_crop
  rubric_ref: rubric/ratio_crop_ratio_crop_effect_id@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: ratio_crop-config-keys
  input: What configuration does the ratio_crop 'Ratio crop' image effect take, and in what format is
    the aspect ratio entered?
  criteria: 'It takes two keys: aspect_ratio, a ''W:H'' string like 16:9 (validated against ^[0-9]+:[0-9]+$,
    default 1:1), and anchor, one of the nine grid positions (left-top ... center-center ... right-bottom,
    default center-center) that decides which part of the image is kept.'
  bundle: ratio_crop
  rubric_ref: rubric/ratio_crop_ratio_crop_config_keys@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: ratio_crop-gd-operation
  input: The ratio_crop module's image effect does not crop pixels itself. Which image toolkit operation
    does it delegate to, and which core module does ratio_crop depend on?
  criteria: The effect calls the bundled GD toolkit operation gd_crop_ratio (operation name crop_ratio),
    which subclasses core's GD Crop and uses PHP imagecrop(). The module depends only on core's image
    module.
  bundle: ratio_crop
  rubric_ref: rubric/ratio_crop_ratio_crop_gd_operation@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: ratio_crop-known-ratio
  input: This Drupal site has an image style named ratiocrop_known that uses the ratio_crop module. Inspect
    the live image style configuration and state the aspect ratio its Ratio crop effect is set to.
  criteria: The ratiocrop_known image style has an image_crop_ratio effect with data.aspect_ratio '4:3'
    (anchor left-top).
  bundle: ratio_crop
  rubric_ref: rubric/ratio_crop_ratio_crop_known_ratio@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/ratio_crop-known-ratio-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/ratio_crop-known-ratio-cleanup.sh
- id: ratio_crop-known-anchor
  input: The image style ratiocrop_anchor on this site crops to a fixed ratio with the ratio_crop module.
    Inspect the live configuration and state which anchor (which part of the image is kept) its Ratio
    crop effect uses.
  criteria: The ratiocrop_anchor image style's image_crop_ratio effect has data.anchor 'right-bottom'.
  bundle: ratio_crop
  rubric_ref: rubric/ratio_crop_ratio_crop_known_anchor@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/ratio_crop-known-anchor-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/ratio_crop-known-anchor-cleanup.sh
- id: ratio_crop-build-16x9
  input: On this Drupal site, create an image style with the machine name ratiocrop_task that uses the
    ratio_crop module to crop images to a 16:9 aspect ratio, keeping the centre of the image (anchor center-center).
    Apply the change to the live site.
  criteria: An image style image.style.ratiocrop_task exists with an effect id image_crop_ratio whose
    data.aspect_ratio is '16:9' and data.anchor is 'center-center'.
  bundle: ratio_crop
  rubric_ref: rubric/ratio_crop_ratio_crop_build_16x9@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/ratio_crop-build-16x9-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/ratio_crop-build-16x9-reset.sh
    verify: agent-module-documentation/evaluation/verify/ratio_crop-build-16x9-verify.sh
- id: ratio_crop-build-square-top
  input: I need square thumbnails on my Drupal site, but faces at the top of portrait photos keep getting
    cut off. Using the ratio_crop module, create an image style called ratiocrop_square that crops to
    a square and keeps the top-centre of each image. Save it on the site.
  criteria: An image style image.style.ratiocrop_square exists with an image_crop_ratio effect whose data.aspect_ratio
    is '1:1' and data.anchor is 'center-top'.
  bundle: ratio_crop
  rubric_ref: rubric/ratio_crop_ratio_crop_build_square_top@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: site-owner
    reset: agent-module-documentation/evaluation/verify/ratio_crop-build-square-top-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/ratio_crop-build-square-top-reset.sh
    verify: agent-module-documentation/evaluation/verify/ratio_crop-build-square-top-verify.sh
