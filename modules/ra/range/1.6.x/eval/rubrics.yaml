rubrics:
- id: range_range_field_types
  version: '1.0'
  applicable_bundles:
  - range
  checks:
  - kind: must_contain_any
    values:
    - range_integer
    - range_decimal
    - range_float
  scoring:
    combine: all_pass
- id: range_range_combine_setting
  version: '1.0'
  applicable_bundles:
  - range
  checks:
  - kind: must_contain_any
    values:
    - range_combine
    - Combine equivalent values
  scoring:
    combine: all_pass
- id: range_range_constraints
  version: '1.0'
  applicable_bundles:
  - range
  checks:
  - kind: must_contain_any
    values:
    - RangeFromGreaterTo
    - RangeBothValuesRequired
    - The FROM value is higher than the TO value
    - Both range values (FROM and TO) are required
  scoring:
    combine: all_pass
- id: range_range_known_field_settings
  version: '1.0'
  applicable_bundles:
  - range
  checks:
  - kind: must_contain_any
    values:
    - '5000'
  scoring:
    combine: all_pass
- id: range_range_formatter_settings
  version: '1.0'
  applicable_bundles:
  - range
  checks:
  - kind: must_contain_any
    values:
    - range_integer_sprintf
    - '%03d'
  scoring:
    combine: all_pass
- id: range_range_widget_labels
  version: '1.0'
  applicable_bundles:
  - range
  checks:
  - kind: must_contain_any
    values:
    - Shortest
  scoring:
    combine: all_pass
- id: range_range_create_field
  version: '1.0'
  applicable_bundles:
  - range
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
- id: range_range_combine_formatter_layman
  version: '1.0'
  applicable_bundles:
  - range
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
