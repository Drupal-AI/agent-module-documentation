rubrics:
- id: rate_rate_widget_entity
  version: '1.0'
  applicable_bundles:
  - rate
  checks:
  - kind: must_contain_any
    values:
    - rate_widget
    - /admin/structure/rate_widgets
    - config entity
  scoring:
    combine: all_pass
- id: rate_rate_templates
  version: '1.0'
  applicable_bundles:
  - rate
  checks:
  - kind: must_contain_any
    values:
    - fivestar
    - thumbs
    - yesno
    - emotion
    - numberupdown
  scoring:
    combine: all_pass
- id: rate_rate_vote_permission
  version: '1.0'
  applicable_bundles:
  - rate
  checks:
  - kind: must_contain_any
    values:
    - cast rate vote
  scoring:
    combine: all_pass
- id: rate_rate_which_template
  version: '1.0'
  applicable_bundles:
  - rate
  checks:
  - kind: must_contain_any
    values:
    - fivestar
  scoring:
    combine: all_pass
- id: rate_rate_bot_threshold
  version: '1.0'
  applicable_bundles:
  - rate
  checks:
  - kind: must_contain_any
    values:
    - '7'
  scoring:
    combine: all_pass
- id: rate_rate_create_widget
  version: '1.0'
  applicable_bundles:
  - rate
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
- id: rate_rate_make_readonly
  version: '1.0'
  applicable_bundles:
  - rate
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
