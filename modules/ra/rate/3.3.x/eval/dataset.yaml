metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: rate
  version: 3.3.x
  note: 'Rate provides AJAX voting widgets stored via VotingAPI. Each widget is a rate_widget config entity
    (config prefix rate_widget -> rate.rate_widget.<id>; fields template, value_type, options[], entity_types[],
    comment_types[], voting{}, display{}, results{}); managed at /admin/structure/rate_widgets. Global
    bot-detection settings live in rate.settings (bot_minute_threshold, bot_hour_threshold, botscout_key,
    disable_log) at /admin/config/search/votingapi/rate. Voting permission is dynamic: cast rate vote
    on <entity_type> of <bundle>. Medium cases seed a known rate_widget and a distinctive bot threshold
    and read them back via drush; hard cases create a rate_widget attached to node.article and flip an
    existing widget''s display.readonly, verified against the live config entities. No AI/network needed.'
questions:
- id: rate-widget-entity
  input: In the Drupal Rate module (version 3.x), how is an individual voting widget stored and where
    do you manage them in the admin UI?
  criteria: Each widget is a rate_widget config entity (config prefix rate_widget, config names rate.rate_widget.<id>)
    managed at Structure -> Rate widgets (/admin/structure/rate_widgets). Add at /admin/structure/rate/add.
  bundle: rate
  rubric_ref: rubric/rate_rate_widget_entity@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: rate-templates
  input: What widget styles (templates) does the Rate module ship with for its voting widgets?
  criteria: 'The template field selects a built-in style: custom, fivestar, numberupdown, emotion, thumbsup,
    thumbsupdown, yesno. New styles can be added with hook_rate_templates().'
  bundle: rate
  rubric_ref: rubric/rate_rate_templates@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: rate-vote-permission
  input: In the Rate module, which permission must a role have to actually cast a vote on a given content
    type, and how is that permission created?
  criteria: A dynamically generated permission 'cast rate vote on <entity_type> of <bundle>' (e.g. 'cast
    rate vote on node of article'), produced by RatePermissions::permissions for every bundle a widget
    is attached to. New widgets grant no voting rights until you assign it.
  bundle: rate
  rubric_ref: rubric/rate_rate_vote_permission@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: rate-which-template
  input: On this Drupal site there is a Rate widget with the machine name 'rate_probe'. Inspect the live
    configuration and tell me which widget template it uses and which content bundle it is attached to.
  criteria: 'rate_probe uses the fivestar template and is attached to node.article: rate.rate_widget.rate_probe
    has template: fivestar and entity_types containing node.article. Discoverable via drush cget rate.rate_widget.rate_probe.'
  bundle: rate
  rubric_ref: rubric/rate_rate_which_template@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/rate-widget-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/rate-widget-cleanup.sh
- id: rate-bot-threshold
  input: On this site the Rate module's bot-detection has been tuned. Inspect the live Rate settings and
    tell me the current per-minute vote threshold used to flag an IP as a bot.
  criteria: 'The per-minute bot threshold is 7: rate.settings bot_minute_threshold = ''7''. Discoverable
    via drush cget rate.settings bot_minute_threshold.'
  bundle: rate
  rubric_ref: rubric/rate_rate_bot_threshold@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/rate-threshold-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/rate-threshold-cleanup.sh
- id: rate-create-widget
  input: On this Drupal site, create a new Rate voting widget with the machine name 'rate_task' and attach
    it to the Article (node.article) content type. Apply the change to the live site.
  criteria: A rate_widget config entity with id rate_task whose entity_types includes 'node.article'.
    Create via the Add rate widget form (/admin/structure/rate/add) or RateWidget::create([...])->save().
  bundle: rate
  rubric_ref: rubric/rate_rate_create_widget@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/rate-create-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/rate-create-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/rate-create-verify.sh
- id: rate-make-readonly
  input: On this site there is a Rate widget 'rate_ro' attached to Article. Configure it to be read-only
    (show results but block voting) and apply the change to the live site.
  criteria: 'The rate_ro widget''s display.readonly is set to 1 (config rate.rate_widget.rate_ro display:
    readonly: 1). Set via the widget''s Display settings (''Read only'') on the edit form, or by editing
    the config entity.'
  bundle: rate
  rubric_ref: rubric/rate_rate_make_readonly@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/rate-readonly-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/rate-readonly-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/rate-readonly-verify.sh
