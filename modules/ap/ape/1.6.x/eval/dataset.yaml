metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: ape
  version: 1.6.x
  note: 'Advanced Page Expiration (APE) gives per-path and per-status-code control of the Cache-Control
    max-age header. Settings live in the ape.settings config object: alternatives (path list), exclusions
    (path list denied caching), lifetime.alternatives, lifetime.301, lifetime.302, lifetime.404 (ints);
    the global default is core system.performance cache.page.max_age. Admin form at /admin/config/development/performance/ape
    (route ape.admin, permission ''administer ape'', form id ape_settings). Behaviour is applied by ApeSubscriber
    (KernelEvents::RESPONSE priority -1024) which writes ''public, max-age=N'' on cacheable responses,
    with status overrides (301/302/404 use their lifetimes, 403 forced to 0), and by the ExcludePages
    page_cache_response_policy. Extension points: ape_cache_set() (pre-set an age, used by Rules) and
    hook_ape_cache_alter(&$max_age,$original). No default ape.settings ships. Medium/hard cases are grounded
    in real ape.settings config: introspection reads a live lifetime/exclusion; execution sets the 404
    lifetime and adds an excluded path, verified against live ape.settings config.'
questions:
- id: ape-where-configured
  input: The Drupal ape (Advanced Page Expiration) module controls the Cache-Control max-age header. Where
    do you configure it (route/path), which config object stores its settings, and what permission guards
    the admin form?
  criteria: Configure it at /admin/config/development/performance/ape (route ape.admin, permission 'administer
    ape'). Its settings are stored in the ape.settings config object (the global default lifetime stays
    in system.performance cache.page.max_age).
  bundle: ape
  rubric_ref: rubric/ape_ape_where_configured@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: ape-status-lifetimes
  input: With the ape module, how do I give 301 redirects, 302 redirects and 404 responses their own cache
    lifetimes, and what happens to a 403 response's cache time? Name the config keys.
  criteria: Set ape.settings lifetime.301, lifetime.302 and lifetime.404 (seconds) for those status codes;
    a 403 response is always forced to max-age 0 (never cached) by ApeSubscriber.
  bundle: ape
  rubric_ref: rubric/ape_ape_status_lifetimes@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: ape-alter-and-exclude
  input: In the ape module, how can I (a) stop specific paths from being cached at all, and (b) programmatically
    change the computed max-age from custom code?
  criteria: (a) Add the paths to ape.settings 'exclusions' (enforced by the ExcludePages page_cache_response_policy,
    which denies caching). (b) Implement hook_ape_cache_alter(&$max_age, $original_max_age), or pre-set
    a value with ape_cache_set().
  bundle: ape
  rubric_ref: rubric/ape_ape_alter_and_exclude@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: ape-known-404
  input: On this Drupal site, ape is configured. Inspect the live ape.settings configuration and report
    the cache lifetime (in seconds) that ape applies to 404 Not Found responses.
  criteria: ape.settings lifetime.404 is 600 (seconds).
  bundle: ape
  rubric_ref: rubric/ape_ape_known_404@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/ape-known-404-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/ape-known-404-cleanup.sh
- id: ape-known-exclusions
  input: On this Drupal site, ape is configured to exclude certain paths from page caching. Inspect the
    live ape.settings configuration and name a path that is excluded from caching.
  criteria: ape.settings exclusions lists /ape_exclude and /user/* — those paths are excluded from page
    caching.
  bundle: ape
  rubric_ref: rubric/ape_ape_known_exclusions@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/ape-known-exclusions-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/ape-known-exclusions-cleanup.sh
- id: ape-set-404
  input: On this Drupal site, use the ape module to set the cache lifetime for 404 Not Found responses
    to 300 seconds (5 minutes). Apply the change to the live site.
  criteria: ape.settings lifetime.404 is 300 (e.g. \Drupal::configFactory()->getEditable('ape.settings')->set('lifetime.404',
    300)->save(), or set it on the APE settings form).
  bundle: ape
  rubric_ref: rubric/ape_ape_set_404@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/ape-set-404-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/ape-set-404-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/ape-set-404-verify.sh
- id: ape-exclude-path
  input: On this Drupal site, use the ape module to exclude the path /ape_exclude from page caching (add
    it to APE's list of excluded pages). Apply the change to the live site.
  criteria: ape.settings 'exclusions' contains /ape_exclude (one path per line), so the ExcludePages policy
    denies caching for it.
  bundle: ape
  rubric_ref: rubric/ape_ape_exclude_path@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/ape-exclude-path-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/ape-exclude-path-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/ape-exclude-path-verify.sh
