rubrics:
- id: ape_ape_where_configured
  version: '1.0'
  applicable_bundles:
  - ape
  checks:
  - kind: must_contain_any
    values:
    - ape.settings
    - ape.admin
    - /admin/config/development/performance/ape
    - administer ape
  scoring:
    combine: all_pass
- id: ape_ape_status_lifetimes
  version: '1.0'
  applicable_bundles:
  - ape
  checks:
  - kind: must_contain_any
    values:
    - lifetime.301
    - lifetime.302
    - lifetime.404
    - '403'
    - max-age=0
    - '0'
  scoring:
    combine: all_pass
- id: ape_ape_alter_and_exclude
  version: '1.0'
  applicable_bundles:
  - ape
  checks:
  - kind: must_contain_any
    values:
    - exclusions
    - hook_ape_cache_alter
    - ape_cache_set
    - ExcludePages
  scoring:
    combine: all_pass
- id: ape_ape_known_404
  version: '1.0'
  applicable_bundles:
  - ape
  checks:
  - kind: must_contain_any
    values:
    - '600'
  scoring:
    combine: all_pass
- id: ape_ape_known_exclusions
  version: '1.0'
  applicable_bundles:
  - ape
  checks:
  - kind: must_contain_any
    values:
    - /ape_exclude
    - /user
  scoring:
    combine: all_pass
- id: ape_ape_set_404
  version: '1.0'
  applicable_bundles:
  - ape
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
- id: ape_ape_exclude_path
  version: '1.0'
  applicable_bundles:
  - ape
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
