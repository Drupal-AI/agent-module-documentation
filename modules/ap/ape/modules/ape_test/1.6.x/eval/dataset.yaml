metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: ape_test
  version: 1.6.x
  note: 'ape_test is a test-only submodule of ape. It ships only routing + one controller (ApeTestController),
    with no config, permissions, services, schema or hooks. Its five public routes (all _access TRUE):
    ape.redirect.301 (/ape_redirect_301, 301 -> /ape_redirect_landing), ape.redirect.302 (/ape_redirect_302,
    302 -> landing), ape.redirect.landing (/ape_redirect_landing, renders ''Arrived at your final destination.''),
    ape.alternative (/ape_alternative) and ape.exclude (/ape_exclude) — stable paths to list in APE''s
    alternatives/exclusions and assert the Cache-Control header. It ships disabled. Because it has no
    config surface, medium/hard cases are grounded in its live state: introspection reads its enablement
    and its registered routes/paths; execution enables and uninstalls it, verified against core.extension.
    Note: on this shared site module enable/uninstall can hang on terminate due to an unrelated broken
    module, but the operation still persists.'
questions:
- id: apet-what-endpoints
  input: What does the ape_test submodule provide, and name at least two of the URL paths (endpoints)
    it registers.
  criteria: 'It provides test-only endpoints (a controller + routes) to exercise APE''s Cache-Control
    behaviour: /ape_redirect_301, /ape_redirect_302, /ape_redirect_landing, /ape_alternative and /ape_exclude.'
  bundle: ape_test
  rubric_ref: rubric/ape_test_apet_what_endpoints@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: apet-redirect-behaviour
  input: In the ape_test module, what does requesting /ape_redirect_301 do, and where does it send the
    user?
  criteria: /ape_redirect_301 (ApeTestController::redirect301) issues a 301 redirect to /ape_redirect_landing,
    which renders 'Arrived at your final destination.' This lets a test assert the Cache-Control header
    APE applies to 301s.
  bundle: ape_test
  rubric_ref: rubric/ape_test_apet_redirect_behaviour@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: apet-purpose
  input: Why would I enable ape_test, and should it be enabled on a production site?
  criteria: It exists only to test/verify APE's Cache-Control behaviour (redirects, alternative pages,
    excluded pages) with stable endpoints; enable it in test/dev, not production.
  bundle: ape_test
  rubric_ref: rubric/ape_test_apet_purpose@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: apet-is-enabled
  input: On this Drupal site, is the ape_test module enabled? If so, what URL path does its ape.redirect.301
    route serve? Inspect the running site to answer.
  criteria: ape_test is enabled and its ape.redirect.301 route serves the path /ape_redirect_301.
  bundle: ape_test
  rubric_ref: rubric/ape_test_apet_is_enabled@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/ape_test-enabled-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/ape_test-enabled-cleanup.sh
- id: apet-list-routes
  input: The ape_test module is enabled on this site. Inspect the running site's routing and list the
    test paths it registers (besides /ape_redirect_301).
  criteria: Besides /ape_redirect_301, ape_test registers /ape_redirect_302, /ape_redirect_landing, /ape_alternative
    and /ape_exclude.
  bundle: ape_test
  rubric_ref: rubric/ape_test_apet_list_routes@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/ape_test-enabled-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/ape_test-enabled-cleanup.sh
- id: apet-enable
  input: On this Drupal site, enable the ape_test module (the APE testing submodule with the redirect/landing
    endpoints). Apply the change to the live site.
  criteria: ape_test is enabled (appears in core.extension; e.g. drush en ape_test -y), so its /ape_redirect_*
    endpoints resolve.
  bundle: ape_test
  rubric_ref: rubric/ape_test_apet_enable@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/ape_test-enable-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/ape_test-enable-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/ape_test-enable-verify.sh
- id: apet-uninstall
  input: On this Drupal site the ape_test module is currently enabled. Uninstall it (leave the parent
    ape module untouched). Apply the change to the live site.
  criteria: ape_test is no longer enabled (absent from core.extension; e.g. drush pmu ape_test -y), while
    ape remains enabled.
  bundle: ape_test
  rubric_ref: rubric/ape_test_apet_uninstall@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/ape_test-uninstall-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/ape_test-uninstall-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/ape_test-uninstall-verify.sh
