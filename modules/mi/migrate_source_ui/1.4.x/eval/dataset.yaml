metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: migrate_source_ui
  version: 1.4.x
  note: 'Migrate Source UI adds an admin form (/admin/content/migrate_source_ui, perm ''access migrate
    source ui'') to upload a CSV/XML/JSON file and run an existing file-based migration against it, plus
    a settings form (/admin/config/content/migrate_source_ui, perm ''administer migrate source ui'') with
    a single config key file_temp_directory in migrate_source_ui.settings. It defines NO migrations of
    its own and adds no Drush; it lists migrations whose source is CSV (migrate_source_csv), Url/JSON+XML
    (migrate_plus) or Spreadsheet (migrate_spreadsheet), allowed extensions csv/json/xml. Actually running
    a migration mutates content and needs an authored migration + uploaded file, so the eval cases are
    grounded in the module''s inspectable/config surface instead: medium reads the configured file_temp_directory
    / which role can access the UI; hard sets file_temp_directory and grants a role the access permission
    - all verified via drush cget / Role::hasPermission, no migration executed. Baseline: migrate_source_ui.settings.file_temp_directory
    unset; cleanup clears it and deletes any role created.'
questions:
- id: migrate_source_ui-what
  input: What does the Migrate Source UI module let a site builder do, and at what admin path do you upload
    a file and run a migration with it?
  criteria: It provides an admin form at /admin/content/migrate_source_ui to upload a CSV/XML/JSON source
    file, pick an existing file-based migration, and run it - no drush or code needed. It defines no migrations
    itself; it only supplies the source file at run time.
  bundle: migrate_source_ui
  rubric_ref: rubric/migrate_source_ui_migrate_source_ui_what@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: migrate_source_ui-filetypes
  input: Which source file types / migration source plugins does Migrate Source UI support, and what file
    extensions does it accept?
  criteria: 'It supports migrations whose source reads an uploaded file: CSV (migrate_source_csv), Url
    for JSON/XML (migrate_plus), and Spreadsheet (migrate_spreadsheet). The accepted extensions are csv,
    json, and xml.'
  bundle: migrate_source_ui
  rubric_ref: rubric/migrate_source_ui_migrate_source_ui_filetypes@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: migrate_source_ui-permissions
  input: Which permissions does Migrate Source UI define, and which one is needed to actually upload a
    file and run a migration from its UI?
  criteria: 'Two permissions: ''access migrate source ui'' (run the upload/run form at /admin/content/migrate_source_ui)
    and ''administer migrate source ui'' (edit the settings). Running a migration needs ''access migrate
    source ui''.'
  bundle: migrate_source_ui
  rubric_ref: rubric/migrate_source_ui_migrate_source_ui_permissions@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: migrate_source_ui-tempdir
  input: On this Drupal site, where does Migrate Source UI save uploaded source files? Inspect the live
    configuration to answer.
  criteria: Uploaded files are saved to private://migrate_source_ui_eval - migrate_source_ui.settings:file_temp_directory
    is set to that stream URI.
  bundle: migrate_source_ui
  rubric_ref: rubric/migrate_source_ui_migrate_source_ui_tempdir@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/migrate_source_ui-tempdir-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/migrate_source_ui-tempdir-cleanup.sh
- id: migrate_source_ui-role
  input: On this site, which user role has been granted permission to use the Migrate Source UI upload/run
    form? Inspect the live roles/permissions to answer.
  criteria: The migsui_operator role has the 'access migrate source ui' permission (check user roles /
    Role::hasPermission).
  bundle: migrate_source_ui
  rubric_ref: rubric/migrate_source_ui_migrate_source_ui_role@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/migrate_source_ui-role-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/migrate_source_ui-role-cleanup.sh
- id: migrate_source_ui-set-tempdir
  input: Configure Migrate Source UI so that files uploaded through its form are stored in the directory
    'private://migrate_source_ui_uploads' instead of the default temporary scheme. Apply the change to
    the live configuration.
  criteria: 'Set migrate_source_ui.settings file_temp_directory = ''private://migrate_source_ui_uploads''
    (via the settings form /admin/config/content/migrate_source_ui or drush config): ->set(''file_temp_directory'',''private://migrate_source_ui_uploads'')->save();'
  bundle: migrate_source_ui
  rubric_ref: rubric/migrate_source_ui_migrate_source_ui_set_tempdir@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/migrate_source_ui-set-tempdir-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/migrate_source_ui-set-tempdir-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/migrate_source_ui-set-tempdir-verify.sh
- id: migrate_source_ui-grant-role
  input: On this site there is a role 'migsui_task' that should be allowed to upload files and run migrations
    through the Migrate Source UI. Grant that role the appropriate Migrate Source UI permission. Apply
    the change to the live site.
  criteria: 'Grant the migsui_task role the ''access migrate source ui'' permission (which gates the upload/run
    form): drush role:perm:add migsui_task ''access migrate source ui'' (or via the permissions UI / user.role
    config).'
  bundle: migrate_source_ui
  rubric_ref: rubric/migrate_source_ui_migrate_source_ui_grant_role@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/migrate_source_ui-grant-role-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/migrate_source_ui-grant-role-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/migrate_source_ui-grant-role-verify.sh
