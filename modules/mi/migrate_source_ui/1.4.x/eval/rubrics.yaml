rubrics:
- id: migrate_source_ui_migrate_source_ui_what
  version: '1.0'
  applicable_bundles:
  - migrate_source_ui
  checks:
  - kind: must_contain_any
    values:
    - /admin/content/migrate_source_ui
    - upload
    - migration
    - source file
  scoring:
    combine: all_pass
- id: migrate_source_ui_migrate_source_ui_filetypes
  version: '1.0'
  applicable_bundles:
  - migrate_source_ui
  checks:
  - kind: must_contain_any
    values:
    - CSV
    - JSON
    - XML
    - csv
  scoring:
    combine: all_pass
- id: migrate_source_ui_migrate_source_ui_permissions
  version: '1.0'
  applicable_bundles:
  - migrate_source_ui
  checks:
  - kind: must_contain_any
    values:
    - access migrate source ui
    - administer migrate source ui
  scoring:
    combine: all_pass
- id: migrate_source_ui_migrate_source_ui_tempdir
  version: '1.0'
  applicable_bundles:
  - migrate_source_ui
  checks:
  - kind: must_contain_any
    values:
    - private://migrate_source_ui_eval
    - migrate_source_ui_eval
  scoring:
    combine: all_pass
- id: migrate_source_ui_migrate_source_ui_role
  version: '1.0'
  applicable_bundles:
  - migrate_source_ui
  checks:
  - kind: must_contain_any
    values:
    - migsui_operator
  scoring:
    combine: all_pass
- id: migrate_source_ui_migrate_source_ui_set_tempdir
  version: '1.0'
  applicable_bundles:
  - migrate_source_ui
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
- id: migrate_source_ui_migrate_source_ui_grant_role
  version: '1.0'
  applicable_bundles:
  - migrate_source_ui
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
