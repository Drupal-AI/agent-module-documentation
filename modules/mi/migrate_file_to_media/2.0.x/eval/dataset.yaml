metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: migrate_file_to_media
  version: 2.0.x
  note: 'Migrate File To Media migrates file/image fields to core Media entities with binary-hash duplicate
    detection. It has no config object; you drive it with Drush commands + migrate_plus migrations. Key
    command: drush migrate:file-media-fields <entity_type> <bundle> <source_field_type> <target_media_bundle>
    (alias mf2m) creates a <field>_media entity_reference field (target media) for each matching file
    field, and adds it to the bundle''s displays (the bundle must have default form/view displays or the
    command errors). drush migrate:duplicate-file-detection <migration> fills the migrate_file_to_media_mapping
    table with binary hashes (run before importing step 1); migrate:duplicate-media-detection fills migrate_file_to_media_mapping_media.
    Migrations run in two steps: step1 source media_entity_generator creates media (dedupe via check_duplicate/check_media_duplicate);
    step2 source content_entity:<type> + process file_id_lookup links media onto <field>_media. Generator:
    drush generate mf2m_media. Medium/hard cases use namespaced content types (with displays) so the scoped
    command is safe; hard verify checks the generated media reference field exists.'
questions:
- id: migrate_file_to_media-generate-command
  input: Using the Migrate File To Media module, what Drush command generates the media reference fields
    from an entity's existing image fields, and what does it name the new fields? Give an example for
    the Article content type migrating to the 'image' media type.
  criteria: 'drush migrate:file-media-fields node article image image (alias: drush mf2m ...). For every
    image field it creates a new entity-reference field named <field>_media targeting the image media
    type, e.g. field_image_media.'
  bundle: migrate_file_to_media
  rubric_ref: rubric/migrate_file_to_media_migrate_file_to_media_generate_command@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: migrate_file_to_media-duplicate-detection
  input: Migrate File To Media de-duplicates identical files. Which Drush command computes the binary
    hashes, in which database table are they stored, and when must it run relative to importing?
  criteria: drush migrate:duplicate-file-detection <migration> computes a binary hash for each file and
    stores it in the migrate_file_to_media_mapping table. It must be run before importing step 1 (the
    media_entity_generator source).
  bundle: migrate_file_to_media
  rubric_ref: rubric/migrate_file_to_media_migrate_file_to_media_duplicate_detection@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: migrate_file_to_media-two-step
  input: How is a Migrate File To Media migration structured - what does step 1 do versus step 2, and
    which source plugin does each use?
  criteria: Step 1 uses the media_entity_generator source to create one media entity per referenced file
    (deduped). Step 2 uses the content_entity:<type> source and the file_id_lookup process plugin to populate
    each source entity's <field>_media reference with the media created in step 1.
  bundle: migrate_file_to_media
  rubric_ref: rubric/migrate_file_to_media_migrate_file_to_media_two_step@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: migrate_file_to_media-known-field
