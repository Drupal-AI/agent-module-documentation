    called mf2m_kt that has an image field field_mf2m_known. Inspect the live field configuration and
    give the machine name of the media reference field it generated.
  criteria: The generated field is field_mf2m_known_media (an entity_reference field targeting media),
    created on node.mf2m_kt by migrate:file-media-fields.
  bundle: migrate_file_to_media
  rubric_ref: rubric/migrate_file_to_media_migrate_file_to_media_known_field@1.0
  tags:
