metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: migrate_file_to_media_example
  version: 2.0.x
  note: 'Migrate File To Media Example is a worked example submodule of migrate_file_to_media. Enabling
    it installs an Article content type with image fields field_image and field_image2 (via config/optional)
    and three migrate_plus migrations (via config_devel), migration group ''media'': step1 (source media_entity_generator,
    fields field_image+field_image2, toggle_media_mapping:true) creates deduped media entities; step1_de
    adds translations; step2 (source content_entity:node, process file_id_lookup) populates field_image_media/field_image2_media
    on the Articles. A step1_rokka variant demos the rokka.io CDN. It is a copy-me template, not for production.
    The medium case inspects the shipped step1 migration config; the hard case creates the two media reference
    fields (field_image_media, field_image2_media) the step2 migration writes into.'
questions:
- id: migrate_file_to_media_example-what-it-ships
  input: What does the migrate_file_to_media_example submodule provide, and what is the id of its step-1
    migration?
  criteria: It is a worked example that installs an Article content type with image fields and three migrate_plus
    migrations. The step-1 migration id is migrate_file_to_media_example_article_images_step1 (which creates
    the media entities); step 2 links them back onto the Articles.
  bundle: migrate_file_to_media_example
  rubric_ref: rubric/migrate_file_to_media_example_migrate_file_to_media_example_what_it_ships@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: migrate_file_to_media_example-fields
  input: Which image fields on the Article content type does the migrate_file_to_media_example step-1
    migration convert to media?
  criteria: The example migrates the Article image fields field_image and field_image2 (listed under the
    media_entity_generator source's field_names).
  bundle: migrate_file_to_media_example
  rubric_ref: rubric/migrate_file_to_media_example_migrate_file_to_media_example_fields@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: migrate_file_to_media_example-plugins
  input: In the migrate_file_to_media_example, which migrate source plugin does step 1 use, and how does
    step 2 attach the created media entities back onto the Article nodes?
  criteria: Step 1 uses the media_entity_generator source to create the media entities; step 2 uses the
    content_entity:node source with the file_id_lookup process plugin to set field_image_media / field_image2_media
    on the Articles.
  bundle: migrate_file_to_media_example
