  criteria: The step-1 migration's source.plugin is media_entity_generator (drush cget migrate_plus.migration.migrate_file_to_media_example_article_images_step1
    source.plugin).
  bundle: migrate_file_to_media_example
  rubric_ref: rubric/migrate_file_to_media_example_migrate_file_to_media_example_known_source@1.0
