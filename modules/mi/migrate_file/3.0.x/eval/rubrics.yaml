rubrics:
- id: migrate_file_migrate_file_plugin_ids
  version: '1.0'
  applicable_bundles:
  - migrate_file
  checks:
  - kind: must_contain_any
    values:
    - file_import
    - image_import
    - file_remote_url
    - file_remote_image
  scoring:
    combine: all_pass
- id: migrate_file_migrate_file_file_import_options
  version: '1.0'
  applicable_bundles:
  - migrate_file
  checks:
  - kind: must_contain_any
    values:
    - destination
    - uid
    - file_exists
    - skip_on_missing_source
  scoring:
    combine: all_pass
- id: migrate_file_migrate_file_vs_core_file_copy
  version: '1.0'
  applicable_bundles:
  - migrate_file
  checks:
  - kind: must_contain_any
    values:
    - file entity
    - target_id
    - creates a
    - managed file
  scoring:
    combine: all_pass
- id: migrate_file_migrate_file_inspect_plugin
  version: '1.0'
  applicable_bundles:
  - migrate_file
  checks:
  - kind: must_contain_any
    values:
    - image_import
  scoring:
    combine: all_pass
- id: migrate_file_migrate_file_inspect_destination
  version: '1.0'
  applicable_bundles:
  - migrate_file
  checks:
  - kind: must_contain_any
    values:
    - eval-images
    - skip_on_missing_source
  scoring:
    combine: all_pass
- id: migrate_file_migrate_file_inspect_uid
  version: '1.0'
  applicable_bundles:
  - migrate_file
  checks:
  - kind: must_contain_any
    values:
    - uid
    - '1'
  scoring:
    combine: all_pass
- id: migrate_file_migrate_file_build_file_import
  version: '1.0'
  applicable_bundles:
  - migrate_file
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
- id: migrate_file_migrate_file_build_image_import
  version: '1.0'
  applicable_bundles:
  - migrate_file
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
- id: migrate_file_migrate_file_build_remote_url
  version: '1.0'
  applicable_bundles:
  - migrate_file
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
