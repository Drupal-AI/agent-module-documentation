metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: miniorange_saml
  version: 3.1.x
  note: 'miniOrange SAML SP is an external SAML SSO integration, but every setting persists locally in
    the miniorange_saml.settings config object, so all cases are grounded in local config (no external
    IdP or network needed). Key facts: SP-initiated login /samllogin, ACS /samlassertion, SP metadata
    /saml_metadata; configure route miniorange_saml.sp_setup; IdP keys miniorange_saml_idp_name/_idp_issuer/_idp_login_url/_idp_x509_certificate;
    attribute mapping miniorange_saml_username_attribute/_email_attribute default ''NameID''; default
    NameID format urn:oasis:names:tc:SAML:1.1:nameid-format:unspecified. Medium cases seed known IdP/attribute
    values and read them back; hard cases write specific IdP details / attribute mappings, verified against
    live config. Baselines (shipped install defaults: idp_* = '''', attributes = ''NameID'') are restored
    explicitly.'
questions:
- id: miniorange-saml-login-path
  input: On a Drupal 11 site with the miniOrange SAML SP module, what is the URL/path a user hits to start
    SP-initiated SAML single sign-on, and what does it do?
  criteria: /samllogin (route miniorange_saml.saml_login) builds a SAML AuthnRequest and redirects the
    user to the configured IdP login URL. The IdP posts the assertion back to the ACS at /samlassertion.
  bundle: miniorange_saml
  rubric_ref: rubric/miniorange_saml_miniorange_saml_login_path@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: miniorange-saml-idp-keys
  input: In the miniOrange SAML SP module, which config object stores its settings, and which key holds
    the external IdP's SSO/login URL that AuthnRequests are sent to?
  criteria: Settings live in the miniorange_saml.settings config object; the IdP SSO URL is miniorange_saml_idp_login_url
    (alongside miniorange_saml_idp_issuer, _idp_name and _idp_x509_certificate).
  bundle: miniorange_saml
  rubric_ref: rubric/miniorange_saml_miniorange_saml_idp_keys@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: miniorange-saml-default-attribute
  input: Out of the box, which SAML attribute does the miniOrange SAML SP module use to determine a user's
    Drupal username and email?
  criteria: Both miniorange_saml_username_attribute and miniorange_saml_email_attribute default to NameID.
  bundle: miniorange_saml
  rubric_ref: rubric/miniorange_saml_miniorange_saml_default_attribute@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: miniorange-saml-known-idp-url
  input: This Drupal site has the miniOrange SAML SP module configured to talk to an external Identity
    Provider. Inspect the live configuration and give the IdP's SSO/login URL that the module sends SAML
    AuthnRequests to.
  criteria: miniorange_saml.settings.miniorange_saml_idp_login_url is https://acme.okta.com/app/mo-known/sso/saml.
  bundle: miniorange_saml
  rubric_ref: rubric/miniorange_saml_miniorange_saml_known_idp_url@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/miniorange_saml-known-idp-url-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/miniorange_saml-known-idp-url-cleanup.sh
- id: miniorange-saml-known-email-attr
  input: On this site the miniOrange SAML SP attribute mapping has been customised. Inspect the live configuration
    and state which SAML attribute is mapped to the Drupal user's email address.
  criteria: miniorange_saml.settings.miniorange_saml_email_attribute is urn:oid:0.9.2342.19200300.100.1.3-known
    (not the default NameID).
  bundle: miniorange_saml
  rubric_ref: rubric/miniorange_saml_miniorange_saml_known_email_attr@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/miniorange_saml-known-email-attr-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/miniorange_saml-known-email-attr-cleanup.sh
- id: miniorange-saml-configure-idp
  input: 'Configure the miniOrange SAML SP module to trust an external Identity Provider with these details:
    IdP name ''Corp IdP'', IdP entity id / issuer ''https://idp.corp-h1.example.com/entity'', and IdP
    SSO login URL ''https://idp.corp-h1.example.com/sso''. Apply the change to the live site.'
  criteria: In miniorange_saml.settings set miniorange_saml_idp_name='Corp IdP', miniorange_saml_idp_issuer='https://idp.corp-h1.example.com/entity',
    miniorange_saml_idp_login_url='https://idp.corp-h1.example.com/sso'.
  bundle: miniorange_saml
  rubric_ref: rubric/miniorange_saml_miniorange_saml_configure_idp@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/miniorange_saml-configure-idp-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/miniorange_saml-configure-idp-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/miniorange_saml-configure-idp-verify.sh
