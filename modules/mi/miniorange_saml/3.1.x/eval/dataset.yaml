  input: Configure the miniOrange SAML SP attribute mapping so that the SAML attribute 'EmailAddress'
    is used for the Drupal email and the SAML attribute 'Username' is used for the Drupal username. Apply
    the change to the live site.
  criteria: In miniorange_saml.settings set miniorange_saml_email_attribute='EmailAddress' and miniorange_saml_username_attribute='Username'.
  bundle: miniorange_saml
  rubric_ref: rubric/miniorange_saml_miniorange_saml_map_attributes@1.0
