metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: migrate_skip_on_404
  version: 1.1.x
  note: 'migrate_skip_on_404 provides one migrate process plugin, skip_on_404 (class SkipOn404), plus
    hook_migration_plugins_alter() that auto-adds it to core D7 file migrations (d7_file, d7_file_private,
    upgrade_d7_file, upgrade_d7_file_private). No config, routes, permissions, schema or Drush. method:row
    throws MigrateSkipRowException; method:process calls stopPipeline(). Existence check: external URLs
    via http_client HEAD, local via file_exists(). Medium/hard cases are grounded in a real migrate_plus.migration
    config entity that references skip_on_404 in its process pipeline: introspection reads which guard
    plugin a migration uses; execution builds a migration whose file process uses skip_on_404, verified
    by reading the migration config.'
questions:
- id: migrate_skip_on_404-plugin-id
  input: 'In a Drupal migration, which process plugin does the migrate_skip_on_404 module provide to skip
    a file when it is missing rather than fail the migration, and what does method: row versus method:
    process do?'
  criteria: 'The plugin is skip_on_404. method: row throws a MigrateSkipRowException so the whole record
    is skipped (and a message is logged); method: process calls stopPipeline() so only the current property''s
    pipeline stops while the rest of the row is kept.'
  bundle: migrate_skip_on_404
  rubric_ref: rubric/migrate_skip_on_404_migrate_skip_on_404_plugin_id@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: migrate_skip_on_404-auto-migrations
  input: After I enable migrate_skip_on_404, which core Drupal-7 file migrations does it automatically
    modify so missing files are skipped, and do I need to configure anything?
  criteria: Via hook_migration_plugins_alter() it auto-injects skip_on_404 into the source_full_path chain
    of d7_file, d7_file_private, upgrade_d7_file and upgrade_d7_file_private. No configuration is needed
    - enabling the module is enough.
  bundle: migrate_skip_on_404
  rubric_ref: rubric/migrate_skip_on_404_migrate_skip_on_404_auto_migrations@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: migrate_skip_on_404-existence-check
  input: How does the migrate_skip_on_404 skip_on_404 plugin decide whether a source file exists for an
    external URL versus a local path?
  criteria: For external URLs it issues a Guzzle HEAD request via the http_client service and treats a
    RequestException as missing; for local paths it uses PHP file_exists().
  bundle: migrate_skip_on_404
  rubric_ref: rubric/migrate_skip_on_404_migrate_skip_on_404_existence_check@1.0
  tags:
  - mode:recipe
  - difficulty:easy
