rubrics:
- id: micon_micon_render_icon
  version: '1.0'
  applicable_bundles:
  - micon
  checks:
  - kind: must_contain_any
    values:
    - micon('fa-user')
    - micon("fa-user")
    - micon_icon
    - '''#theme'' => ''micon'
  scoring:
    combine: all_pass
- id: micon_micon_icon_field
  version: '1.0'
  applicable_bundles:
  - micon
  checks:
  - kind: must_contain_any
    values:
    - string_micon
  scoring:
    combine: all_pass
- id: micon_micon_iconize_text
  version: '1.0'
  applicable_bundles:
  - micon
  checks:
  - kind: must_contain_any
    values:
    - setIcon
    - MiconIconize
    - MiconIconizeTrait
    - micon('Save')
    - micon("Save")
  scoring:
    combine: all_pass
- id: micon_micon_known_package
  version: '1.0'
  applicable_bundles:
  - micon
  checks:
  - kind: must_contain_any
    values:
    - fa
  scoring:
    combine: all_pass
- id: micon_micon_stored_icon
  version: '1.0'
  applicable_bundles:
  - micon
  checks:
  - kind: must_contain_any
    values:
    - fa-heart
  scoring:
    combine: all_pass
- id: micon_micon_create_field
  version: '1.0'
  applicable_bundles:
  - micon
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
- id: micon_micon_restrict_packages
  version: '1.0'
  applicable_bundles:
  - micon
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
