metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: micon
  version: 2.1.x
  note: 'Micon is an IcoMoon icon manager. Icon packages are `micon` config entities (config_prefix micon
    -> micon.micon.<id>); the shipped Font Awesome package has id `fa`, so icons are addressed by selector
    fa-<name> (fa-user, fa-star). Icons resolve via the micon.icon.manager service (MiconIconManager::getIconMatch).
    Rendering: Twig micon(''fa-user''), render #theme micon_icon (icon only) / micon (icon + #title, #position,
    #icon_only), the #type => ''micon'' form element (#packages), and the global micon() function returning
    a MiconIconize (setIcon/setIconOnly/setIconAfter/addMatchPrefix). Field: type/widget/formatter all
    id `string_micon` (label Icon); widget setting `packages` = list of micon ids ([] = all). A separate
    YAML plugin type micon_icons (*.micon.icons.yml, alter hook micon_icons) maps text/regex strings to
    icon ids. Drush: `drush micon <path>` writes _micon.scss. Medium/hard cases are grounded in the real
    string_micon field type and its form-display widget `packages` setting on the standard Article content
    type.'
questions:
- id: micon-render-icon
  input: 'On a Drupal site using the Micon module, how do I output the Font Awesome user icon (fa-user)
    in (a) a Twig template and (b) a render array? Give the Twig function and the render array #theme
    key.'
  criteria: 'Twig: {{ micon(''fa-user'') }} (Micon''s Twig function). Render array: [''#theme'' => ''micon_icon'',
    ''#icon'' => ''fa-user''] for icon-only, or ''#theme'' => ''micon'' with ''#icon'' and ''#title''
    for icon+label.'
  bundle: micon
  rubric_ref: rubric/micon_micon_render_icon@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: micon-icon-field
  input: I want editors to pick an icon and store it on a content type using the Micon module. What is
    the field type (and its widget/formatter) I should add, and what does its main widget setting control?
  criteria: Add a field of type string_micon (label 'Icon'); its default widget and formatter are also
    string_micon. The widget's `packages` setting is a list of micon package ids to offer in the picker
    (empty = all active packages).
  bundle: micon
  rubric_ref: rubric/micon_micon_icon_field@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: micon-iconize-text
  input: Using Micon, how do I programmatically attach an icon to a translatable label like 'Save' in
    PHP so it renders as an icon plus the text? Name the function/method used.
  criteria: 'Use the global micon() function (or MiconIconizeTrait::micon() in a class): micon(''Save'')->setIcon(''fa-check'').
    It returns a MiconIconize (a TranslatableMarkup subclass); fluent helpers include setIcon(), setIconOnly(),
    setIconAfter(), setIconBefore().'
  bundle: micon
  rubric_ref: rubric/micon_micon_iconize_text@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: micon-known-package
  input: This Drupal site has an Icon (string_micon) field named field_micon_known on the Article content
    type. Its icon-picker widget has been restricted to a single Micon package. Inspect the live default
    form display for Article and state which package id the widget is limited to.
  criteria: 'The widget is restricted to the `fa` (Font Awesome) package: in core.entity_form_display.node.article.default
    the field_micon_known component (widget string_micon) has settings.packages containing only `fa`.'
  bundle: micon
  rubric_ref: rubric/micon_micon_known_package@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/micon-known-package-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/micon-known-package-cleanup.sh
