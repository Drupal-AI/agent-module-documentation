metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: micon_content_type
  version: 2.1.x
  note: 'Micon submodule: adds an Icon (#type micon) picker to the node type form and stores the chosen
    icon selector as a third-party setting on the node_type config entity: third_party_settings.micon_content_type.icon
    (e.g. fa-file). No settings form, no configure route. Read via micon_content_type_icon($type) or $type->getThirdPartySetting(''micon_content_type'',''icon'').
    It also registers content_type.<label>/content_type.<machine_name> micon_icons definitions via hook_micon_icons_alter().
    Medium/hard cases are grounded in that real third-party setting on a node type.'
questions:
- id: micon_content_type-where-stored
  input: With the micon_content_type module, where is a content type's chosen Micon icon stored, and under
    which third-party settings key?
  criteria: 'It is stored on the node_type config entity as a third-party setting: third_party_settings.micon_content_type.icon
    = the icon selector (e.g. fa-file). Read it with micon_content_type_icon($type) or $type->getThirdPartySetting(''micon_content_type'',''icon'').'
  bundle: micon_content_type
  rubric_ref: rubric/micon_content_type_micon_content_type_where_stored@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: micon_content_type-set-in-php
  input: How do I set the Micon icon fa-file on the Article content type in PHP using the micon_content_type
    module?
  criteria: 'Load the node type and set the third-party setting: NodeType::load(''article'')->setThirdPartySetting(''micon_content_type'',''icon'',''fa-file'')->save()
    (setThirdPartySetting then save).'
  bundle: micon_content_type
  rubric_ref: rubric/micon_content_type_micon_content_type_set_in_php@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: micon_content_type-string-match
  input: The micon_content_type module lets me reference a content type's icon by a string through Micon's
    icon-matching system. What string(s) resolve to the Article type's icon?
  criteria: Via hook_micon_icons_alter() it registers content_type.<machine_name> and content_type.<lowercased
    label>, so micon('content_type.article') resolves to the Article type's icon.
  bundle: micon_content_type
  rubric_ref: rubric/micon_content_type_micon_content_type_string_match@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: micon_content_type-known-icon
  input: This site has a content type with machine name micon_ct_med that was given a Micon icon via the
    micon_content_type module. Inspect the live site and report the icon selector stored for it.
  criteria: 'The stored icon is fa-flag: node.type.micon_ct_med has third_party_settings.micon_content_type.icon
    = fa-flag.'
  bundle: micon_content_type
  rubric_ref: rubric/micon_content_type_micon_content_type_known_icon@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/micon_content_type-known-icon-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/micon_content_type-known-icon-cleanup.sh
- id: micon_content_type-set-icon
  input: On this site there is a content type with machine name micon_ct_task that currently has no Micon
    icon. Using the micon_content_type module, set its icon to fa-star and apply the change to the live
    site.
  criteria: node.type.micon_ct_task has third_party_settings.micon_content_type.icon = fa-star (set via
    setThirdPartySetting('micon_content_type','icon','fa-star') and save, or by picking the icon on the
    content type edit form).
  bundle: micon_content_type
  rubric_ref: rubric/micon_content_type_micon_content_type_set_icon@1.0
