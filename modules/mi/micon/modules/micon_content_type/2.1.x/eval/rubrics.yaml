rubrics:
- id: micon_content_type_micon_content_type_where_stored
  version: '1.0'
  applicable_bundles:
  - micon_content_type
  checks:
  - kind: must_contain_any
    values:
    - third_party
    - third party
    - micon_content_type
    - node.type
  scoring:
    combine: all_pass
- id: micon_content_type_micon_content_type_set_in_php
  version: '1.0'
  applicable_bundles:
  - micon_content_type
  checks:
  - kind: must_contain_any
    values:
    - setThirdPartySetting
    - micon_content_type
  scoring:
    combine: all_pass
- id: micon_content_type_micon_content_type_string_match
  version: '1.0'
  applicable_bundles:
  - micon_content_type
  checks:
  - kind: must_contain_any
    values:
    - content_type.article
    - content_type.
  scoring:
    combine: all_pass
- id: micon_content_type_micon_content_type_known_icon
  version: '1.0'
  applicable_bundles:
  - micon_content_type
  checks:
  - kind: must_contain_any
    values:
    - fa-flag
  scoring:
    combine: all_pass
- id: micon_content_type_micon_content_type_set_icon
  version: '1.0'
  applicable_bundles:
  - micon_content_type
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
