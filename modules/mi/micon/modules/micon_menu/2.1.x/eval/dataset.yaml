metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: micon_menu
  version: 2.1.x
  note: 'Micon submodule: lets editors set a Micon icon on menu links. Forces the menu_link_content link
    field form widget to micon_menu; also adds an icon control to the node form Menu settings and the
    menu-link-edit form, gated by the `use micon menu` permission. Icon is stored on the menu link''s
    link value at options.attributes.data-icon (position at data-icon-position). hook_preprocess_menu()
    iconizes items at render. Global config micon_menu.config.packages limits offered packages (form /admin/structure/micon/link,
    permission administer micon). Requires menu_link_content, menu_ui, micon_link. Medium reads back a
    menu link''s stored icon; hard sets a data-icon on a menu link. Grounded in real menu_link_content
    link options.'
questions:
- id: micon_menu-where-stored
  input: With micon_menu, where on a menu link is the chosen Micon icon stored?
  criteria: 'On the menu_link_content link value: link.options.attributes.data-icon (and data-icon-position
    for before/after/icon_only).'
  bundle: micon_menu
  rubric_ref: rubric/micon_menu_micon_menu_where_stored@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: micon_menu-permission
  input: Which permission does micon_menu add to control who can add icons to menu links?
  criteria: The `use micon menu` permission ('Allow adding icons to menu items') gates the icon control
    on the node Menu settings and the menu-link-edit form.
  bundle: micon_menu
  rubric_ref: rubric/micon_menu_micon_menu_permission@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: micon_menu-render
  input: How does micon_menu get the icon to actually appear in a themed menu, without editing templates?
  criteria: hook_preprocess_menu() iterates menu items and, where the item's Url has a data-icon option,
    replaces the title with MiconIconize (honoring after/icon_only) - no template override needed.
  bundle: micon_menu
  rubric_ref: rubric/micon_menu_micon_menu_render@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: micon_menu-known-icon
  input: This site has a menu link titled 'Micon Menu Med' (in the main menu) that was given a Micon icon
    via micon_menu. Inspect the live site and report the icon selector stored on that menu link.
  criteria: 'The icon is fa-home: the menu_link_content item''s link.options.attributes.data-icon = fa-home.'
  bundle: micon_menu
  rubric_ref: rubric/micon_menu_micon_menu_known_icon@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/micon_menu-known-icon-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/micon_menu-known-icon-cleanup.sh
- id: micon_menu-set-icon
  input: This site has a menu link titled 'Micon Menu Task' in the main menu with no icon. Using micon_menu's
    storage convention, set its Micon icon to fa-star and apply the change to the live site.
  criteria: The 'Micon Menu Task' menu_link_content item's link.options.attributes.data-icon = fa-star.
  bundle: micon_menu
  rubric_ref: rubric/micon_menu_micon_menu_set_icon@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/micon_menu-set-icon-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/micon_menu-set-icon-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/micon_menu-set-icon-verify.sh
