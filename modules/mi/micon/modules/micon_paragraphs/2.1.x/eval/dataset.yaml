metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: micon_paragraphs
  version: 2.1.x
  note: 'Micon submodule: adds an Icon (#type micon) picker to the paragraphs_type form (hiding the core
    icon_file upload) and stores the chosen icon selector as a third-party setting on the paragraphs_type
    config entity: third_party_settings.micon_paragraphs.icon (e.g. fa-cube). No settings form/route.
    Read via micon_paragraphs_icon($type) or getThirdPartySetting(''micon_paragraphs'',''icon''). Registers
    paragraphs.<label>/paragraphs.<machine_name> micon_icons via hook_micon_icons_alter(). Requires contrib
    paragraphs. Medium/hard grounded in that third-party setting on a paragraphs type.'
questions:
- id: micon_paragraphs-where-stored
  input: With the micon_paragraphs module, where is a paragraph type's chosen Micon icon stored, and under
    which key?
  criteria: 'On the paragraphs_type config entity as a third-party setting: third_party_settings.micon_paragraphs.icon
    = the icon selector (e.g. fa-cube). Read with micon_paragraphs_icon($type).'
  bundle: micon_paragraphs
  rubric_ref: rubric/micon_paragraphs_micon_paragraphs_where_stored@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: micon_paragraphs-hides-iconfile
  input: The micon_paragraphs module changes the Paragraphs type form. What does it do to the default
    Paragraphs icon upload, and what does it add instead?
  criteria: It hides the core icon_file upload ($form['icon_file']['#access'] = FALSE) and adds a Micon
    icon picker (#type => 'micon') whose value is saved as the micon_paragraphs.icon third-party setting.
  bundle: micon_paragraphs
  rubric_ref: rubric/micon_paragraphs_micon_paragraphs_hides_iconfile@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: micon_paragraphs-set-in-php
  input: How do I set the Micon icon fa-cube on a Paragraphs type in PHP using micon_paragraphs?
  criteria: ParagraphsType::load($id)->setThirdPartySetting('micon_paragraphs','icon','fa-cube')->save().
  bundle: micon_paragraphs
  rubric_ref: rubric/micon_paragraphs_micon_paragraphs_set_in_php@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: micon_paragraphs-known-icon
  input: This site has a Paragraphs type with machine name micon_pg_med given a Micon icon via micon_paragraphs.
    Inspect the live site and report the icon selector stored for it.
  criteria: 'The stored icon is fa-cube: paragraphs.paragraphs_type.micon_pg_med has third_party_settings.micon_paragraphs.icon
    = fa-cube.'
  bundle: micon_paragraphs
  rubric_ref: rubric/micon_paragraphs_micon_paragraphs_known_icon@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/micon_paragraphs-known-icon-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/micon_paragraphs-known-icon-cleanup.sh
- id: micon_paragraphs-set-icon
  input: On this site there is a Paragraphs type with machine name micon_pg_task that has no Micon icon.
    Using micon_paragraphs, set its icon to fa-star and apply the change to the live site.
  criteria: paragraphs.paragraphs_type.micon_pg_task has third_party_settings.micon_paragraphs.icon =
    fa-star.
  bundle: micon_paragraphs
  rubric_ref: rubric/micon_paragraphs_micon_paragraphs_set_icon@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/micon_paragraphs-set-icon-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/micon_paragraphs-set-icon-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/micon_paragraphs-set-icon-verify.sh
