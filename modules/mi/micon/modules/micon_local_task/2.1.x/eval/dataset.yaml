  module: micon_local_task
  version: 2.1.x
  note: 'Micon submodule: auto-icons local-task tabs via hook_menu_local_tasks_alter(), setting each tab
    title to micon($title)->addMatchPrefix(''local_task'')->setIconOnly($config->get(''icon_only'')).
    Ships micon_local_task.micon.icons.yml mapping local_task.view->fa-eye, local_task.edit->fa-edit,
    local_task.delete(regex)->fa-trash, etc. One config: micon_local_task.config.icon_only (bool, default
    false), edited at /admin/structure/micon/local-task (permission administer micon). Medium reads the
    live icon_only value; hard sets icon_only to true. Grounded in the real config object.'
questions:
- id: micon_local_task-config-key
  input: What single setting does micon_local_task expose, what does it do, and where is it configured?
  criteria: 'micon_local_task.config -> icon_only (boolean, default false): when true, local-task tabs
    render icon-only, otherwise icon + label. Configured at /admin/structure/micon/local-task (permission
    administer micon).'
  bundle: micon_local_task
  rubric_ref: rubric/micon_local_task_micon_local_task_config_key@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: micon_local_task-mechanism
  input: How does micon_local_task decide which icon to put on a local task tab like 'Edit'?
  criteria: hook_menu_local_tasks_alter() sets the tab title to micon($title)->addMatchPrefix('local_task'),
    so Micon looks up local_task.<title> in the shipped micon_local_task.micon.icons.yml definitions (e.g.
    local_task.edit -> fa-edit).
  bundle: micon_local_task
  rubric_ref: rubric/micon_local_task_micon_local_task_mechanism@1.0
  tags:
  - mode:recipe
  - difficulty:easy
