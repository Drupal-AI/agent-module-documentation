metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: micon_linkit
  version: 2.1.x
  note: 'Micon submodule: one field widget `micon_linkit` (label ''Linkit (with icon)'') for the core
    `link` field type, extending Linkit''s LinkitWidget + micon_link''s MiconLinkWidgetTrait. Requires
    contrib linkit and micon_link. Icon stored on the link value at options.attributes.data-icon; same
    widget settings as micon_link. No formatter, no settings form/route. Medium reads back a link field''s
    widget id; hard switches a link field''s form-display widget to micon_linkit. Grounded in the core.entity_form_display
    component type.'
questions:
- id: micon_linkit-widget-id
  input: Which field widget does micon_linkit add, for which field type, and where do I enable it?
  criteria: It adds the micon_linkit widget ('Linkit (with icon)') for the core `link` field type; select
    it on the field's Manage form display.
  bundle: micon_linkit
  rubric_ref: rubric/micon_linkit_micon_linkit_widget_id@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: micon_linkit-extends
  input: What does the micon_linkit widget combine, and what modules must be enabled for it?
  criteria: It combines Linkit autocomplete (extends LinkitWidget) with Micon's icon controls (MiconLinkWidgetTrait);
    requires the contrib linkit module and micon_link.
  bundle: micon_linkit
  rubric_ref: rubric/micon_linkit_micon_linkit_extends@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: micon_linkit-icon-storage
  input: Where does the micon_linkit widget store the icon an editor chooses for a link?
  criteria: On the link value at options.attributes.data-icon (same as micon_link).
  bundle: micon_linkit
  rubric_ref: rubric/micon_linkit_micon_linkit_icon_storage@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: micon_linkit-known-widget
  input: On this site the Article content type has a Link field field_micon_lkt_med. Inspect the live
    default form display and report which widget it uses.
  criteria: 'It uses the micon_linkit widget, per core.entity_form_display.node.article.default component
    field_micon_lkt_med (type: micon_linkit).'
  bundle: micon_linkit
  rubric_ref: rubric/micon_linkit_micon_linkit_known_widget@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/micon_linkit-known-widget-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/micon_linkit-known-widget-cleanup.sh
- id: micon_linkit-set-widget
  input: On this site the Article content type has a Link field field_micon_lkt_task using the plain core
    link widget. Using micon_linkit, switch that field's form-display widget to the Micon Linkit widget
    (micon_linkit) and apply the change to the live site.
  criteria: In core.entity_form_display.node.article.default the field_micon_lkt_task component has widget
    type micon_linkit.
  bundle: micon_linkit
  rubric_ref: rubric/micon_linkit_micon_linkit_set_widget@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/micon_linkit-set-widget-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/micon_linkit-set-widget-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/micon_linkit-set-widget-verify.sh
