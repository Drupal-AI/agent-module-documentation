metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: micon_vocabulary
  version: 2.1.x
  note: 'Micon submodule: adds an Icon (#type micon) picker to the taxonomy vocabulary form and stores
    the chosen icon selector as a third-party setting on the taxonomy_vocabulary config entity: third_party_settings.micon_vocabulary.icon
    (e.g. fa-tags). No settings form/route, no list builder. Read via micon_vocabulary_icon($vocabulary)
    or getThirdPartySetting(''micon_vocabulary'',''icon''). Registers vocabulary.<lowercased label> micon_icons
    via hook_micon_icons_alter(). Medium/hard grounded in that third-party setting on a vocabulary.'
questions:
- id: micon_vocabulary-where-stored
  input: With the micon_vocabulary module, where is a taxonomy vocabulary's chosen Micon icon stored,
    and under which key?
  criteria: 'On the taxonomy_vocabulary config entity as a third-party setting: third_party_settings.micon_vocabulary.icon
    = the icon selector (e.g. fa-tags). Read with micon_vocabulary_icon($vocabulary).'
  bundle: micon_vocabulary
  rubric_ref: rubric/micon_vocabulary_micon_vocabulary_where_stored@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: micon_vocabulary-set-in-php
  input: How do I set the Micon icon fa-tags on the Tags vocabulary in PHP using micon_vocabulary?
  criteria: Vocabulary::load('tags')->setThirdPartySetting('micon_vocabulary','icon','fa-tags')->save().
  bundle: micon_vocabulary
  rubric_ref: rubric/micon_vocabulary_micon_vocabulary_set_in_php@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: micon_vocabulary-string-match
  input: How can I reference a vocabulary's Micon icon by a string through Micon's icon matcher when using
    micon_vocabulary?
  criteria: Via hook_micon_icons_alter() it registers vocabulary.<lowercased label>, so micon('vocabulary.tags')
    resolves to that vocabulary's icon.
  bundle: micon_vocabulary
  rubric_ref: rubric/micon_vocabulary_micon_vocabulary_string_match@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: micon_vocabulary-known-icon
  input: This site has a taxonomy vocabulary with machine name (vid) micon_vocab_med given a Micon icon
    via micon_vocabulary. Inspect the live site and report the icon selector stored for it.
  criteria: 'The stored icon is fa-tags: taxonomy.vocabulary.micon_vocab_med has third_party_settings.micon_vocabulary.icon
    = fa-tags.'
  bundle: micon_vocabulary
  rubric_ref: rubric/micon_vocabulary_micon_vocabulary_known_icon@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/micon_vocabulary-known-icon-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/micon_vocabulary-known-icon-cleanup.sh
- id: micon_vocabulary-set-icon
  input: On this site there is a taxonomy vocabulary with vid micon_vocab_task that has no Micon icon.
    Using micon_vocabulary, set its icon to fa-star and apply the change to the live site.
  criteria: taxonomy.vocabulary.micon_vocab_task has third_party_settings.micon_vocabulary.icon = fa-star.
  bundle: micon_vocabulary
  rubric_ref: rubric/micon_vocabulary_micon_vocabulary_set_icon@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/micon_vocabulary-set-icon-reset.sh
