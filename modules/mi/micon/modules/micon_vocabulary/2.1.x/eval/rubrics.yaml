rubrics:
- id: micon_vocabulary_micon_vocabulary_where_stored
  version: '1.0'
  applicable_bundles:
  - micon_vocabulary
  checks:
  - kind: must_contain_any
    values:
    - third_party
    - third party
    - micon_vocabulary
    - taxonomy.vocabulary
    - vocabulary
  scoring:
    combine: all_pass
- id: micon_vocabulary_micon_vocabulary_set_in_php
  version: '1.0'
  applicable_bundles:
  - micon_vocabulary
  checks:
  - kind: must_contain_any
    values:
    - setThirdPartySetting
    - micon_vocabulary
  scoring:
    combine: all_pass
- id: micon_vocabulary_micon_vocabulary_string_match
  version: '1.0'
  applicable_bundles:
  - micon_vocabulary
  checks:
  - kind: must_contain_any
    values:
    - vocabulary.
    - hook_micon_icons_alter
    - micon_icons
  scoring:
    combine: all_pass
- id: micon_vocabulary_micon_vocabulary_known_icon
  version: '1.0'
  applicable_bundles:
  - micon_vocabulary
  checks:
  - kind: must_contain_any
    values:
    - fa-tags
  scoring:
    combine: all_pass
- id: micon_vocabulary_micon_vocabulary_set_icon
  version: '1.0'
  applicable_bundles:
  - micon_vocabulary
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
