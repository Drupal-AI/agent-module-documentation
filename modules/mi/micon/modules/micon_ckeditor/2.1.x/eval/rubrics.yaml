rubrics:
- id: micon_ckeditor_micon_ckeditor_what_it_does
  version: '1.0'
  applicable_bundles:
  - micon_ckeditor
  checks:
  - kind: must_contain_any
    values:
    - ckeditor_css_alter
    - hook_ckeditor_css_alter
    - style.css
    - stylesheet
    - css
  scoring:
    combine: all_pass
- id: micon_ckeditor_micon_ckeditor_config
  version: '1.0'
  applicable_bundles:
  - micon_ckeditor
  checks:
  - kind: must_contain_any
    values:
    - no config
    - no configuration
    - enabling
    - none
    - micon
  scoring:
    combine: all_pass
- id: micon_ckeditor_micon_ckeditor_which_packages
  version: '1.0'
  applicable_bundles:
  - micon_ckeditor
  checks:
  - kind: must_contain_any
    values:
    - active
    - loadActive
    - published
  scoring:
    combine: all_pass
- id: micon_ckeditor_micon_ckeditor_active_packages
  version: '1.0'
  applicable_bundles:
  - micon_ckeditor
  checks:
  - kind: must_contain_any
    values:
    - fa
  scoring:
    combine: all_pass
- id: micon_ckeditor_micon_ckeditor_enable
  version: '1.0'
  applicable_bundles:
  - micon_ckeditor
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
