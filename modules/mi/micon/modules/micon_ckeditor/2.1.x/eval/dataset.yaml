metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: micon_ckeditor
  version: 2.1.x
  note: 'Micon submodule (trivial glue): its only code is hook_ckeditor_css_alter(), which appends every
    active Micon package''s generated style.css (Micon::loadActive() + file_url_generator) to the CKEditor
    editor stylesheets, so icon fonts render inside the editing area. No config, field, widget, permission,
    or configure route - enabling it is the whole setup. Depends on micon. Medium: read which active Micon
    packages get injected (out of the box: fa). Hard: enable the module (verify moduleExists).'
questions:
- id: micon_ckeditor-what-it-does
  input: What does the micon_ckeditor module do, and via which hook?
  criteria: It implements hook_ckeditor_css_alter() to append each active Micon package's generated style.css
    to the CKEditor editing area's stylesheets, so icon fonts render while editing.
  bundle: micon_ckeditor
  rubric_ref: rubric/micon_ckeditor_micon_ckeditor_what_it_does@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: micon_ckeditor-config
  input: How much configuration does micon_ckeditor require, and what does it depend on?
  criteria: None - it has no settings, field, widget, permission, or configure route; enabling the module
    is the entire setup. It depends only on the micon module.
  bundle: micon_ckeditor
  rubric_ref: rubric/micon_ckeditor_micon_ckeditor_config@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: micon_ckeditor-which-packages
  input: Which Micon icon packages does micon_ckeditor add to the editor?
  criteria: Every active/published Micon package (Micon::loadActive()); it adds each such package's style.css
    to the editor.
  bundle: micon_ckeditor
  rubric_ref: rubric/micon_ckeditor_micon_ckeditor_which_packages@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: micon_ckeditor-active-packages
  input: micon_ckeditor injects the stylesheet of every active Micon package into CKEditor. Inspect this
    live site and name the active Micon package(s) whose CSS it therefore adds to the editor.
  criteria: The active package is `fa` (Font Awesome), the shipped Micon package (Micon::loadActiveLabels()
    returns fa), so micon_ckeditor adds the fa package's style.css to the editor.
  bundle: micon_ckeditor
  rubric_ref: rubric/micon_ckeditor_micon_ckeditor_active_packages@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/micon_ckeditor-active-packages-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/micon_ckeditor-active-packages-cleanup.sh
- id: micon_ckeditor-enable
  input: On this Drupal site, make Micon icon fonts render inside the CKEditor editing area by enabling
    the appropriate Micon submodule. Apply the change to the live site.
  criteria: The micon_ckeditor module is enabled (drush en micon_ckeditor), so its hook_ckeditor_css_alter()
    adds Micon package CSS to the editor.
  bundle: micon_ckeditor
  rubric_ref: rubric/micon_ckeditor_micon_ckeditor_enable@1.0
  tags:
  - mode:execution
  - difficulty:hard
