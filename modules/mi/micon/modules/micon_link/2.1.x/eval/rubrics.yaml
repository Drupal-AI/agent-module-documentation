rubrics:
- id: micon_link_micon_link_plugin_ids
  version: '1.0'
  applicable_bundles:
  - micon_link
  checks:
  - kind: must_contain_any
    values:
    - micon_link
  scoring:
    combine: all_pass
- id: micon_link_micon_link_where_icon_stored
  version: '1.0'
  applicable_bundles:
  - micon_link
  checks:
  - kind: must_contain_any
    values:
    - data-icon
    - options
    - attributes
  scoring:
    combine: all_pass
- id: micon_link_micon_link_widget_settings
  version: '1.0'
  applicable_bundles:
  - micon_link
  checks:
  - kind: must_contain_any
    values:
    - packages
    - position
    - target
    - icon
  scoring:
    combine: all_pass
- id: micon_link_micon_link_known_widget
  version: '1.0'
  applicable_bundles:
  - micon_link
  checks:
  - kind: must_contain_any
    values:
    - fa-star
  scoring:
    combine: all_pass
- id: micon_link_micon_link_set_widget
  version: '1.0'
  applicable_bundles:
  - micon_link
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
