metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: micon_link
  version: 2.1.x
  note: 'Micon submodule: provides the `micon_link` widget (extends core LinkWidget) and `micon_link`
    formatter (extends core LinkFormatter) for the core `link` field type. Widget adds a #type micon picker;
    icon is stored on the link value at options.attributes.data-icon (position at data-icon-position).
    Widget settings: packages, icon (default), position (bool), target (bool). No settings form/configure
    route - configured on Manage form display / Manage display. Medium sets a link field''s form-display
    widget to micon_link with a default icon; hard switches a link field''s widget to micon_link. Both
    grounded in the core.entity_form_display component type.'
questions:
- id: micon_link-plugin-ids
  input: Using micon_link, what widget and formatter should I select for a core Link field to let editors
    attach an icon, and where do I select them?
  criteria: Select the 'Link (with icon)' widget (id micon_link) on Manage form display and the 'Link
    (with icon)' formatter (id micon_link) on Manage display of the link field. Both are for the core
    `link` field type.
  bundle: micon_link
  rubric_ref: rubric/micon_link_micon_link_plugin_ids@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: micon_link-where-icon-stored
  input: When an editor picks an icon on a micon_link link widget, where is that icon actually stored
    on the field value?
  criteria: 'On the link item''s options: options.attributes.data-icon (and options.attributes.data-icon-position
    for before/after/icon_only).'
  bundle: micon_link
  rubric_ref: rubric/micon_link_micon_link_where_icon_stored@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: micon_link-widget-settings
  input: What settings does the micon_link widget expose besides the icon picker?
  criteria: packages (which packages to offer), icon (a default/fallback icon), position (allow before/after/icon-only
    selection), and target (allow an open-in-new-window checkbox).
  bundle: micon_link
  rubric_ref: rubric/micon_link_micon_link_widget_settings@1.0
  tags:
  - mode:recipe
  - difficulty:easy
