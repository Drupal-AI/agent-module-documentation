rubrics:
- id: migmag_migmag_what_provides
  version: '1.0'
  applicable_bundles:
  - migmag
  checks:
  - kind: must_contain_any
    values:
    - no configuration
    - no config
    - utility
    - utilities
    - no admin
    - no settings
  scoring:
    combine: all_pass
- id: migmag_migmag_array_util
  version: '1.0'
  applicable_bundles:
  - migmag
  checks:
  - kind: must_contain_any
    values:
    - MigMagArrayUtility
    - insertAfterKey
  scoring:
    combine: all_pass
- id: migmag_migmag_submodules
  version: '1.0'
  applicable_bundles:
  - migmag
  checks:
  - kind: must_contain_any
    values:
    - migmag_rollbackable
    - migmag_process
  scoring:
    combine: all_pass
- id: migmag_migmag_rollback_table_probe
  version: '1.0'
  applicable_bundles:
  - migmag
  checks:
  - kind: must_contain_any
    values:
    - migmag_eval_probe
  scoring:
    combine: all_pass
- id: migmag_migmag_config_dest_class
  version: '1.0'
  applicable_bundles:
  - migmag
  checks:
  - kind: must_contain_any
    values:
    - RollbackableConfig
  scoring:
    combine: all_pass
- id: migmag_migmag_enable_rollbackable_replace
  version: '1.0'
  applicable_bundles:
  - migmag
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
- id: migmag_migmag_enable_lookup_replace
  version: '1.0'
  applicable_bundles:
  - migmag
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
