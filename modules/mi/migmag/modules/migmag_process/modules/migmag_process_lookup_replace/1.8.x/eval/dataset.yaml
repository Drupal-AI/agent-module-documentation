metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: migmag_process_lookup_replace
  version: 1.8.x
  note: 'Glue submodule: a single hook_migrate_process_info_alter() that sets core migration_lookup''s
    class to MigMagLookup (from migmag_process). No config/UI/permissions/Drush/plugins. Verified via
    the core process plugin manager (works on this site; the migration plugin manager is broken by pathauto
    but is not needed). Baseline: this module DISABLED (migration_lookup = core MigrationLookup). Introspection
    reads migration_lookup''s class with the override on; execution toggles the override on (class ->
    MigMagLookup) and off (class -> core MigrationLookup).'
questions:
- id: migmag_lr-what
  input: What does the Drupal module migmag_process_lookup_replace do, and which core migrate process
    plugin does it affect?
  criteria: It implements hook_migrate_process_info_alter() to set core's migration_lookup process plugin
    class to Drupal\migmag_process\Plugin\migrate\process\MigMagLookup, so every migration using migration_lookup
    gets the improved lookup without editing YAML.
  bundle: migmag_process_lookup_replace
  rubric_ref: rubric/migmag_process_lookup_replace_migmag_lr_what@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: migmag_lr-dependency
  input: Which module provides the MigMagLookup class that migmag_process_lookup_replace forces core's
    migration_lookup to use, i.e. what is its dependency?
  criteria: migmag_process_lookup_replace depends on migmag_process, which provides the MigMagLookup class
    (the migmag_lookup process plugin).
  bundle: migmag_process_lookup_replace
  rubric_ref: rubric/migmag_process_lookup_replace_migmag_lr_dependency@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: migmag_lr-alternative
  input: If I only want ONE specific migration to use Migrate Magician's improved lookup instead of overriding
    migration_lookup globally, what should I do instead of enabling migmag_process_lookup_replace?
  criteria: 'Don''t enable migmag_process_lookup_replace; instead set that migration''s process step to
    ''plugin: migmag_lookup'' directly. The lookup_replace module is only for a global override of core
    migration_lookup.'
  bundle: migmag_process_lookup_replace
  rubric_ref: rubric/migmag_process_lookup_replace_migmag_lr_alternative@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: migmag_lr-active-class
  input: On this Drupal site, migmag_process_lookup_replace has been enabled. Inspect the migrate process
    plugin manager and report the implementing class of the migration_lookup process plugin.
  criteria: migration_lookup's class is Drupal\migmag_process\Plugin\migrate\process\MigMagLookup (read
    via plugin.manager.migrate.process getDefinition('migration_lookup')['class']).
  bundle: migmag_process_lookup_replace
  rubric_ref: rubric/migmag_process_lookup_replace_migmag_lr_active_class@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/migmag-lookupreplace-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/migmag-lookupreplace-cleanup.sh
- id: migmag_lr-provider
  input: On this Drupal site the forced-lookup override is active. Inspecting the running site, which
    Migrate Magician module provides the class that migration_lookup now uses (i.e. what is enabled alongside
    it)?
  criteria: migmag_process provides the MigMagLookup class; it is enabled as a dependency of migmag_process_lookup_replace
    (the enabled override module).
  bundle: migmag_process_lookup_replace
  rubric_ref: rubric/migmag_process_lookup_replace_migmag_lr_provider@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/migmag-lookupreplace-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/migmag-lookupreplace-cleanup.sh
- id: migmag_lr-enable-override
  input: On this Drupal site, force core's migration_lookup process plugin to use Migrate Magician's MigMagLookup
    implementation globally (no YAML edits). Apply the change to the live site.
  criteria: Enable migmag_process_lookup_replace (drush en migmag_process_lookup_replace -y). migration_lookup's
    class becomes Drupal\migmag_process\Plugin\migrate\process\MigMagLookup.
  bundle: migmag_process_lookup_replace
  rubric_ref: rubric/migmag_process_lookup_replace_migmag_lr_enable_override@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/migmag-lookupreplace-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/migmag-lookupreplace-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/migmag-lookupreplace-verify.sh
- id: migmag_lr-remove-override
  input: On this Drupal site the global forced-lookup override is currently active (migration_lookup uses
    MigMagLookup). Remove the override so that core's migration_lookup process plugin uses core's own
    MigrationLookup class again. Apply the change to the live site.
  criteria: Uninstall migmag_process_lookup_replace (drush pmu migmag_process_lookup_replace -y). migration_lookup's
    class returns to Drupal\migrate\Plugin\migrate\process\MigrationLookup.
  bundle: migmag_process_lookup_replace
  rubric_ref: rubric/migmag_process_lookup_replace_migmag_lr_remove_override@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/migmag-lookupreplace-remove-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/migmag-lookupreplace-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/migmag-lookupreplace-remove-verify.sh
