metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: migmag_menu_link_migrate
  version: 1.8.x
  note: 'Alters core''s D7 menu-link migrations (via hook_migration_plugins_alter + hook_migrate_prepare_row
    calling MigMagMenuLinkMigrate) so more menu links migrate; ships a trap migration. No config/UI/permissions/Drush/plugins.
    Its runtime effect needs the core migration plugin manager to enumerate/run migrations, which is BROKEN
    on this site by pathauto - so evals do NOT run migrations. They are grounded only in module-enable
    state and the module''s declared dependency on migmag_process, which are inspectable. Baseline: this
    module DISABLED. Introspection/execution toggle its enabled state and confirm migmag_process is pulled
    in.'
questions:
- id: migmag_ml-what
  input: What does the Drupal module migmag_menu_link_migrate do during a Drupal 7 upgrade?
  criteria: It modifies core's menu-link migrations (via hook_migration_plugins_alter and hook_migrate_prepare_row,
    using MigMagMenuLinkMigrate) so that as many source menu links as possible migrate - including links
    core would otherwise skip - and traps genuinely unmigratable links.
  bundle: migmag_menu_link_migrate
  rubric_ref: rubric/migmag_menu_link_migrate_migmag_ml_what@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: migmag_ml-hooks
  input: Which two hooks does migmag_menu_link_migrate implement to fix core's menu-link migrations, and
    which helper class do they call?
  criteria: hook_migration_plugins_alter() -> MigMagMenuLinkMigrate::applyMenuLinkMigrationConfigurationFixes();
    hook_migrate_prepare_row() -> MigMagMenuLinkMigrate::prepareMenuLinkStubMigration().
  bundle: migmag_menu_link_migrate
  rubric_ref: rubric/migmag_menu_link_migrate_migmag_ml_hooks@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: migmag_ml-deps
  input: Which Migrate Magician modules does migmag_menu_link_migrate depend on?
  criteria: It depends on migmag and migmag_process (it relies on the improved lookup/stub behaviour from
    migmag_process).
  bundle: migmag_menu_link_migrate
  rubric_ref: rubric/migmag_menu_link_migrate_migmag_ml_deps@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: migmag_ml-enabled-state
  input: On this Drupal site, has migmag_menu_link_migrate been enabled, and is its dependency migmag_process
    enabled? Inspect the running site and report both.
  criteria: migmag_menu_link_migrate is enabled and its dependency migmag_process is enabled too (check
    with 'drush pm:list --status=enabled' / moduleExists).
  bundle: migmag_menu_link_migrate
  rubric_ref: rubric/migmag_menu_link_migrate_migmag_ml_enabled_state@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/migmag-menulink-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/migmag-menulink-cleanup.sh
- id: migmag_ml-pulled-dep
  input: On this Drupal site migmag_menu_link_migrate has just been enabled. Inspecting the site, which
    Migrate Magician process module was pulled in as its dependency so its lookup/stub improvements are
    available?
  criteria: migmag_process was enabled as a dependency of migmag_menu_link_migrate.
  bundle: migmag_menu_link_migrate
  rubric_ref: rubric/migmag_menu_link_migrate_migmag_ml_pulled_dep@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/migmag-menulink-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/migmag-menulink-cleanup.sh
- id: migmag_ml-enable
  input: On this Drupal site, enable Migrate Magician's menu-link migration fixes so that core's D7 menu-link
    migrations will migrate as many links as possible. Apply the change to the live site.
  criteria: Enable migmag_menu_link_migrate (drush en migmag_menu_link_migrate -y). It and its dependency
    migmag_process are then enabled; its hooks patch the core menu-link migrations at run time.
  bundle: migmag_menu_link_migrate
  rubric_ref: rubric/migmag_menu_link_migrate_migmag_ml_enable@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/migmag-menulink-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/migmag-menulink-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/migmag-menulink-verify.sh
- id: migmag_ml-remove
  input: On this Drupal site migmag_menu_link_migrate is currently enabled. Disable its menu-link migration
    fixes so the module is no longer installed. Apply the change to the live site.
  criteria: Uninstall migmag_menu_link_migrate (drush pmu migmag_menu_link_migrate -y); afterwards the
    module is no longer enabled.
  bundle: migmag_menu_link_migrate
  rubric_ref: rubric/migmag_menu_link_migrate_migmag_ml_remove@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/migmag-menulink-remove-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/migmag-menulink-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/migmag-menulink-remove-verify.sh
