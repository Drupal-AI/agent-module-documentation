rubrics:
- id: migmag_menu_link_migrate_migmag_ml_what
  version: '1.0'
  applicable_bundles:
  - migmag_menu_link_migrate
  checks:
  - kind: must_contain_any
    values:
    - menu link
    - menu links
    - as many
  scoring:
    combine: all_pass
- id: migmag_menu_link_migrate_migmag_ml_hooks
  version: '1.0'
  applicable_bundles:
  - migmag_menu_link_migrate
  checks:
  - kind: must_contain_any
    values:
    - hook_migration_plugins_alter
    - hook_migrate_prepare_row
    - MigMagMenuLinkMigrate
  scoring:
    combine: all_pass
- id: migmag_menu_link_migrate_migmag_ml_deps
  version: '1.0'
  applicable_bundles:
  - migmag_menu_link_migrate
  checks:
  - kind: must_contain_any
    values:
    - migmag_process
    - migmag
  scoring:
    combine: all_pass
- id: migmag_menu_link_migrate_migmag_ml_enabled_state
  version: '1.0'
  applicable_bundles:
  - migmag_menu_link_migrate
