    cleanup: agent-module-documentation/evaluation/verify/migmag-callback-cleanup.sh
- id: migmag_cu-why-inert
  input: On this Drupal 11 site migmag_callback_upgrade is enabled but appears to have no effect on migrations.
    Inspect the site (its core version) and explain why the module is inert here.
  criteria: Because Drupal core here is >= 9.2 (Drupal 11), the module's version gate (version_compare
