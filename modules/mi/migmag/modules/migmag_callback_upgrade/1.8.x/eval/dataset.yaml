metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: migmag_callback_upgrade
  version: 1.8.x
  note: 'Backport module: hook_migrate_process_info_alter() swaps the ''callback'' process plugin class
    to MigMagCallback ONLY when core < 9.2.0. On this Drupal 11 site the gate is false, so the module
    is a deliberate NO-OP - the callback plugin class stays core Callback. Evals are honest about this:
    they are grounded in module-enable state and the (unchanged) callback plugin class read via the core
    process plugin manager (which works; the migration plugin manager is broken by pathauto but is not
    needed). Baseline: this module DISABLED. Execution ''enable'' verifies the module is enabled AND that
    callback is still core Callback (inert); ''remove'' verifies it is uninstalled.'
questions:
- id: migmag_cu-what
  input: What does the Drupal module migmag_callback_upgrade do, and on which Drupal core versions does
    it actually change anything?
  criteria: It backports core 9.2's 'callback' process plugin (which adds the unpack_source option) to
    older cores by swapping the callback plugin's class to MigMagCallback - but only when core is older
    than 9.2.0. On 9.2+/10/11 it is a deliberate no-op.
  bundle: migmag_callback_upgrade
  rubric_ref: rubric/migmag_callback_upgrade_migmag_cu_what@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: migmag_cu-gate
  input: What is the exact version condition migmag_callback_upgrade checks before replacing the core
    'callback' process plugin class, and what does that mean on Drupal 11?
  criteria: It only swaps the class when version_compare(\Drupal::VERSION, '9.2.0', 'lt') is true (core
    older than 9.2.0). On Drupal 11 that is false, so it changes nothing.
  bundle: migmag_callback_upgrade
  rubric_ref: rubric/migmag_callback_upgrade_migmag_cu_gate@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: migmag_cu-class
  input: Which class does migmag_callback_upgrade provide as the replacement callback process plugin,
    and what feature does it add?
  criteria: MigMagCallback (extends core Callback). It adds the unpack_source option, which spreads a
    source array as separate arguments to the callable.
  bundle: migmag_callback_upgrade
  rubric_ref: rubric/migmag_callback_upgrade_migmag_cu_class@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: migmag_cu-inert-class
  input: On this Drupal 11 site migmag_callback_upgrade has been enabled. Inspect the migrate process
    plugin manager and report the implementing class of the 'callback' process plugin - has migmag_callback_upgrade
    changed it?
  criteria: The callback plugin class is still core Drupal\migrate\Plugin\migrate\process\Callback - migmag_callback_upgrade
    did NOT change it, because this core is >= 9.2 so the module is inert.
  bundle: migmag_callback_upgrade
  rubric_ref: rubric/migmag_callback_upgrade_migmag_cu_inert_class@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
