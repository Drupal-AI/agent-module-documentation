rubrics:
- id: migmag_callback_upgrade_migmag_cu_what
  version: '1.0'
  applicable_bundles:
  - migmag_callback_upgrade
  checks:
  - kind: must_contain_any
    values:
    - '9.2'
    - no-op
    - backport
    - unpack_source
  scoring:
    combine: all_pass
- id: migmag_callback_upgrade_migmag_cu_gate
  version: '1.0'
  applicable_bundles:
  - migmag_callback_upgrade
  checks:
  - kind: must_contain_any
    values:
    - '9.2'
    - less than
    - lt
  scoring:
    combine: all_pass
- id: migmag_callback_upgrade_migmag_cu_class
  version: '1.0'
  applicable_bundles:
  - migmag_callback_upgrade
  checks:
  - kind: must_contain_any
    values:
    - MigMagCallback
    - unpack_source
  scoring:
    combine: all_pass
- id: migmag_callback_upgrade_migmag_cu_inert_class
  version: '1.0'
  applicable_bundles:
  - migmag_callback_upgrade
  checks:
  - kind: must_contain_any
    values:
    - Drupal\migrate\Plugin\migrate\process\Callback
    - unchanged
    - no-op
    - not changed
    - core Callback
  scoring:
    combine: all_pass
