metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: migmag_rollbackable
  version: 1.8.x
  note: 'Provides rollback-capable migrate destination plugins (ids prefixed migmag_rollbackable_) and,
    on install, two DB tables (migmag_rollbackable_data, migmag_rollbackable_new_targets). No config/UI/permissions/Drush.
    Destination plugins are discoverable via the core destination plugin manager (plugin.manager.migrate.destination),
    which works even though the migration plugin manager is broken by pathauto - so evals are grounded
    in that manager, the DB schema, module state, and a known rollback-data row, never a migration run.
    Baseline: migmag_rollbackable ENABLED (tables present), migmag_rollbackable_replace DISABLED. Introspection
    reads a known migmag_rollbackable_data row and the live plugin/table list; execution enables the module
    (creating tables+plugins) and enables its child migmag_rollbackable_replace to swap core ''config''
    destination to RollbackableConfig.'
questions:
- id: migmag_rb-what
  input: What problem does the Drupal module migmag_rollbackable solve, and how are its destination plugin
    ids named?
  criteria: It provides rollback-capable versions of core migrate destination plugins that core cannot
    roll back (config, color, theme settings, display components, default langcode, shortcut set users).
    The rollbackable plugin ids are prefixed migmag_rollbackable_ (e.g. migmag_rollbackable_config).
  bundle: migmag_rollbackable
  rubric_ref: rubric/migmag_rollbackable_migmag_rb_what@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: migmag_rb-tables
  input: Which database tables does migmag_rollbackable create to support rolling migrations back, and
    what does the main one store?
  criteria: It creates migmag_rollbackable_data (previous config values keyed by migration_plugin_id,
    target_id, langcode, component) and migmag_rollbackable_new_targets (targets a migration newly created,
    so rollback can delete them).
  bundle: migmag_rollbackable
  rubric_ref: rubric/migmag_rollbackable_migmag_rb_tables@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: migmag_rb-config-id
  input: If a migration uses core's 'config' destination and I want it to be rollback-capable via migmag_rollbackable,
    which destination plugin id would I reference in the migration's destination?
  criteria: 'Use ''plugin: migmag_rollbackable_config'' as the migration''s destination (or enable migmag_rollbackable_replace
    to swap core ''config'' automatically).'
  bundle: migmag_rollbackable
  rubric_ref: rubric/migmag_rollbackable_migmag_rb_config_id@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: migmag_rb-data-probe
  input: On this Drupal site the migmag_rollbackable rollback storage contains a record. Inspect the database
    and report the target_id stored in the migmag_rollbackable_data table for the probe record.
  criteria: The migmag_rollbackable_data table has a row (migration_plugin_id migmag_eval_probe) whose
    target_id is 'system.site'. Query e.g. 'drush sqlq "SELECT migration_plugin_id, target_id FROM migmag_rollbackable_data"'.
  bundle: migmag_rollbackable
  rubric_ref: rubric/migmag_rollbackable_migmag_rb_data_probe@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/migmag-rbdata-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/migmag-rbdata-cleanup.sh
- id: migmag_rb-list-plugins
