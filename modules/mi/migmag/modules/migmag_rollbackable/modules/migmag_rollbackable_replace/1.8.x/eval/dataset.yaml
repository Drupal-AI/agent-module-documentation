metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: migmag_rollbackable_replace
  version: 1.8.x
  note: 'Glue submodule: a single hook_migrate_destination_info_alter() that swaps the class of core destinations
    (config, color, default_langcode, component_entity_display, component_entity_form_display, shortcut_set_users,
    d7_theme_settings) to the Rollbackable* classes from migmag_rollbackable; the plugin ids stay the
    same. No config/UI/permissions/Drush/plugins. Verified via the core destination plugin manager (works
    on this site; migration plugin manager is broken by pathauto but not needed). Baseline: this module
    DISABLED (config = core Config). Introspection reads the ''config'' destination class with the override
    on; execution toggles it on (config -> RollbackableConfig) and off (config -> core Config).'
questions:
- id: migmag_rr-what
  input: What does the Drupal module migmag_rollbackable_replace do, and does it change the destination
    plugin ids used in migrations?
  criteria: It implements hook_migrate_destination_info_alter() to swap the implementing class of core
    destinations (config, color, default_langcode, etc.) to the Rollbackable* classes from migmag_rollbackable.
    The plugin ids stay the same (still 'config', 'color', ...) - only the class changes.
  bundle: migmag_rollbackable_replace
  rubric_ref: rubric/migmag_rollbackable_replace_migmag_rr_what@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: migmag_rr-config-class
  input: After enabling migmag_rollbackable_replace, which class does core's 'config' migrate destination
    plugin resolve to?
  criteria: Drupal\migmag_rollbackable\Plugin\migrate\destination\RollbackableConfig.
  bundle: migmag_rollbackable_replace
  rubric_ref: rubric/migmag_rollbackable_replace_migmag_rr_config_class@1.0
  tags:
  - mode:recipe
  - difficulty:easy
