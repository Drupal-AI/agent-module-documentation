metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: migrate_drupal_d8
  version: 1.2.x
  note: 'migrate_drupal_d8 provides ONE migrate source plugin, d8_entity (class ContentEntity extends
    SqlBase), that reads content entities and their Field API values directly from another Drupal 8+ site''s
    database. Required source keys: key (source DB connection from settings.php) and entity_type; optional
    bundle. Sub-field columns use a delta index (body/0/value). Deprecated pre-typed aliases: d8_node,
    d8_user, d8_file, d8_taxonomy_term. The module has no config, permissions, routes, services, or Drush.
    Medium/hard cases use migrate_plus Migration config entities (the authentic way to reference the source):
    setup/reset enable migrate_plus and (medium) create a known migration using d8_entity, or (hard) require
    the agent to build one. Verified against live migration config.'
questions:
- id: migrate_drupal_d8-source-id-keys
  input: In the Drupal migrate_drupal_d8 module, what is the id of the migrate source plugin it provides,
    and which two source configuration keys are required to use it in a migration?
  criteria: The source plugin id is d8_entity. Required source keys are `key` (the source database connection
    from settings.php) and `entity_type`; `bundle` is optional.
  bundle: migrate_drupal_d8
  rubric_ref: rubric/migrate_drupal_d8_migrate_drupal_d8_source_id_keys@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: migrate_drupal_d8-subfield-delta
  input: When migrating with the d8_entity source from migrate_drupal_d8, how do you map a field that
    has sub-fields, such as a node's body value? Show the source key you would use in the process pipeline.
  criteria: 'Sub-field columns must be addressed with a delta index even for single-value fields, e.g.
    ''body/value'': ''body/0/value'' (and body/0/summary, body/0/format).'
  bundle: migrate_drupal_d8
  rubric_ref: rubric/migrate_drupal_d8_migrate_drupal_d8_subfield_delta@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: migrate_drupal_d8-deprecated-alias
  input: A colleague's Drupal-to-Drupal migration uses the d8_node source plugin from migrate_drupal_d8.
    Is that the recommended plugin, and if not what should be used instead?
  criteria: 'd8_node is deprecated (as are d8_user, d8_file, d8_taxonomy_term). Use d8_entity directly
    with an explicit entity_type: node.'
  bundle: migrate_drupal_d8
  rubric_ref: rubric/migrate_drupal_d8_migrate_drupal_d8_deprecated_alias@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: migrate_drupal_d8-known-migration
  input: This Drupal site has a migration configured that uses the migrate_drupal_d8 d8_entity source
    plugin. Inspect the live migration configuration and state which source entity type and bundle it
    reads.
  criteria: 'The migration mdd8_known has source.plugin d8_entity with entity_type: node and bundle: article
    (drush php:eval loading the migrate_plus migration, or inspecting migrate_plus.migration.mdd8_known
    config).'
  bundle: migrate_drupal_d8
  rubric_ref: rubric/migrate_drupal_d8_migrate_drupal_d8_known_migration@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/migrate_drupal_d8-known-migration-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/migrate_drupal_d8-known-migration-cleanup.sh
- id: migrate_drupal_d8-build-migration
  input: On this Drupal site (migrate_plus is enabled), create a migration with id `mdd8_task` that uses
    the migrate_drupal_d8 `d8_entity` source plugin to read `node` entities of bundle `page` from a source
    database whose connection key is `mdd8_src`. A minimal process (map title) and an entity:node destination
    are fine. Save it to the live site.
  criteria: 'Create a migrate_plus Migration config entity mdd8_task with source: {plugin: d8_entity,
    key: mdd8_src, entity_type: node, bundle: page}. Verified: source.plugin === d8_entity and source.entity_type
    === node.'
  bundle: migrate_drupal_d8
  rubric_ref: rubric/migrate_drupal_d8_migrate_drupal_d8_build_migration@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/migrate_drupal_d8-build-migration-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/migrate_drupal_d8-build-migration-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/migrate_drupal_d8-build-migration-verify.sh
- id: migrate_drupal_d8-known-source-key
  input: This Drupal site has a migration that uses the migrate_drupal_d8 d8_entity source plugin to read
    from a legacy Drupal database. Inspect the live migration configuration and state the source database
    connection key it uses.
  criteria: The migration mdd8_key has source.key = legacy_d8_db (the source database connection key defined
    in settings.php and referenced by the d8_entity source).
  bundle: migrate_drupal_d8
  rubric_ref: rubric/migrate_drupal_d8_migrate_drupal_d8_known_source_key@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/migrate_drupal_d8-known-key-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/migrate_drupal_d8-known-key-cleanup.sh
- id: migrate_drupal_d8-build-user-migration
  input: On this Drupal site (migrate_plus is enabled), create a migration with id `mdd8_users` that uses
    the migrate_drupal_d8 `d8_entity` source plugin to migrate `user` entities from a source database
    (choose any connection key). A minimal process and an entity:user destination are fine. Save it to
    the live site.
  criteria: 'Create a migrate_plus Migration config entity mdd8_users with source: {plugin: d8_entity,
    key: <any>, entity_type: user}. Verified: source.plugin === d8_entity and source.entity_type === user.'
  bundle: migrate_drupal_d8
  rubric_ref: rubric/migrate_drupal_d8_migrate_drupal_d8_build_user_migration@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/migrate_drupal_d8-build-user-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/migrate_drupal_d8-build-user-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/migrate_drupal_d8-build-user-verify.sh
