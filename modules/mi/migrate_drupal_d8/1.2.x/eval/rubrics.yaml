rubrics:
- id: migrate_drupal_d8_migrate_drupal_d8_source_id_keys
  version: '1.0'
  applicable_bundles:
  - migrate_drupal_d8
  checks:
  - kind: must_contain_any
    values:
    - d8_entity
    - entity_type
    - key
  scoring:
    combine: all_pass
- id: migrate_drupal_d8_migrate_drupal_d8_subfield_delta
  version: '1.0'
