rubrics:
- id: migrate_upgrade_migrate_upgrade_commands
  version: '1.0'
  applicable_bundles:
  - migrate_upgrade
  checks:
  - kind: must_contain_any
    values:
    - migrate:upgrade
    - migrate-upgrade
    - mup
  scoring:
    combine: all_pass
- id: migrate_upgrade_migrate_upgrade_source_db_options
  version: '1.0'
  applicable_bundles:
  - migrate_upgrade
  checks:
  - kind: must_contain_any
    values:
    - --legacy-db-url
    - --legacy-db-key
  scoring:
    combine: all_pass
- id: migrate_upgrade_migrate_upgrade_configure_only
  version: '1.0'
  applicable_bundles:
  - migrate_upgrade
  checks:
  - kind: must_contain_any
    values:
    - config entit
    - migrate_plus
    - does not run
    - without running
    - upgrade_
  scoring:
    combine: all_pass
- id: migrate_upgrade_migrate_upgrade_configured_group
  version: '1.0'
  applicable_bundles:
  - migrate_upgrade
  checks:
  - kind: must_contain_any
    values:
    - migrate_drupal_7
  scoring:
    combine: all_pass
- id: migrate_upgrade_migrate_upgrade_upgrade_marker
  version: '1.0'
  applicable_bundles:
  - migrate_upgrade
  checks:
  - kind: must_contain_any
    values:
    - migrate_drupal_ui.performed
  scoring:
    combine: all_pass
- id: migrate_upgrade_migrate_upgrade_configure_group
  version: '1.0'
  applicable_bundles:
  - migrate_upgrade
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
- id: migrate_upgrade_migrate_upgrade_prefixed_migration
  version: '1.0'
  applicable_bundles:
  - migrate_upgrade
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
