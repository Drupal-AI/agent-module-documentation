rubrics:
- id: migrate_devel_migrate_devel_see_rows
  version: '1.0'
  applicable_bundles:
  - migrate_devel
  checks:
  - kind: must_contain_any
    values:
    - --migrate-debug
    - migrate-debug
  scoring:
    combine: all_pass
- id: migrate_devel_migrate_devel_debug_plugin
  version: '1.0'
  applicable_bundles:
  - migrate_devel
  checks:
  - kind: must_contain_any
    values:
    - debug
    - dump
    - destination
    - source
  scoring:
    combine: all_pass
- id: migrate_devel_migrate_devel_pre_vs_post
  version: '1.0'
  applicable_bundles:
  - migrate_devel
  checks:
  - kind: must_contain_any
    values:
    - --migrate-debug-pre
    - migrate-debug-pre
    - PRE_ROW_SAVE
    - before
    - POST_ROW_SAVE
  scoring:
    combine: all_pass
- id: migrate_devel_migrate_devel_debug_config
  version: '1.0'
  applicable_bundles:
  - migrate_devel
  checks:
  - kind: must_contain_any
    values:
    - body
    - source
  scoring:
    combine: all_pass
- id: migrate_devel_migrate_devel_debug_label
  version: '1.0'
  applicable_bundles:
  - migrate_devel
  checks:
  - kind: must_contain_any
    values:
    - 'MIGDEV-TRACE:'
    - MIGDEV-TRACE
  scoring:
    combine: all_pass
- id: migrate_devel_migrate_devel_add_debug
  version: '1.0'
  applicable_bundles:
  - migrate_devel
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
- id: migrate_devel_migrate_devel_dump_destination
  version: '1.0'
  applicable_bundles:
  - migrate_devel
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
