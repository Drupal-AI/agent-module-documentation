metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: migrate_source_yaml
  version: 1.5.x
  note: 'Migrate Source YAML provides one Migrate API source plugin, id ''yaml'' (class Drupal\migrate_source_yaml\Plugin\migrate\source\Yaml,
    extends SourcePluginBase). Required source settings: file (path, parsed with Symfony Yaml::parse into
    an ArrayIterator) and ids (unique-key definition); optional fields. The YAML top level must be a list
    of row-maps. Missing file or ids throws MigrateException at construct time. No UI/config/permission/drush/schema.
    Site has migrate_plus + migrate_tools enabled, so cases use migrate_plus.migration.* config entities.
    Medium cases seed a real migration config using source yaml and read its source settings back; hard
    cases build real live state - a migration config, and a full YAML->node import verified by the created
    nodes.'
questions:
- id: migrate_source_yaml-plugin-and-keys
  input: I want to use a YAML file as the source of a Drupal migration with the migrate_source_yaml module.
    What is the source plugin id, and which source settings are required?
  criteria: 'Set source.plugin: yaml. The required source settings are ''file'' (path to the YAML file)
    and ''ids'' (the unique-key definition). ''fields'' is optional (documentational).'
  bundle: migrate_source_yaml
  rubric_ref: rubric/migrate_source_yaml_migrate_source_yaml_plugin_and_keys@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: migrate_source_yaml-file-shape
  input: How must the YAML file be structured for the migrate_source_yaml 'yaml' source plugin to read
    it as migration rows?
  criteria: The whole file is parsed with Yaml::parse() and wrapped in an ArrayIterator, so the top level
    must be a list/sequence where each item is a mapping of field name to value; each list item becomes
    one source row.
  bundle: migrate_source_yaml
  rubric_ref: rubric/migrate_source_yaml_migrate_source_yaml_file_shape@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: migrate_source_yaml-missing-settings
  input: With the migrate_source_yaml 'yaml' source plugin, what happens if I forget to declare the file
    path or the ids in the source configuration?
  criteria: The plugin's constructor throws a MigrateException if 'file' is empty ('You must declare the
    "file" ...') or if 'ids' is empty ('You must declare "ids" ...').
  bundle: migrate_source_yaml
  rubric_ref: rubric/migrate_source_yaml_migrate_source_yaml_missing_settings@1.0
  tags:
  - mode:recipe
