metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: minifyhtml
  version: 2.0.x
  note: Minify Source HTML exposes a single config object and one kernel response subscriber; no plugins,
    no API, no hooks, no admin route of its own. Cases are `recipe` (response-graded) probing documented
    facts an agent would otherwise read source to answer; no site mutation.
questions:
- id: minifyhtml-enable-drush
  input: On a Drupal 11 site with the minifyhtml module installed, how do I turn HTML minification on
    from the command line? Minification is off by default.
  criteria: 'Set the minify key (default false) on the minifyhtml.config object: drush cset minifyhtml.config
    minify true.'
  bundle: minifyhtml
  rubric_ref: rubric/minifyhtml_minifyhtml_enable_drush@1.0
  tags:
  - mode:recipe
- id: minifyhtml-settings-location
  input: Where in the Drupal admin UI are the Minify Source HTML settings, and what config object stores
    them? The module does not add its own admin page.
  criteria: On the core Performance form (system.performance_settings, Admin > Configuration > Development
    > Performance) under Bandwidth optimization; settings stored in the minifyhtml.config config object.
  bundle: minifyhtml
  rubric_ref: rubric/minifyhtml_minifyhtml_settings_location@1.0
  tags:
  - mode:recipe
- id: minifyhtml-config-keys
  input: What are the three settings keys in the minifyhtml.config object and their default values?
  criteria: minify (boolean, default false), strip_comments (boolean, default true), exclude_pages (string,
    default '/admin*').
  bundle: minifyhtml
  rubric_ref: rubric/minifyhtml_minifyhtml_config_keys@1.0
  tags:
  - mode:recipe
- id: minifyhtml-strip-comments
  input: Which minifyhtml setting removes HTML comments (and multi-line comments inside script/style tags),
    and does it also strip IE conditional comments?
  criteria: The strip_comments key (default true) removes HTML comments plus /* */ comments in script/style;
    IE conditional comments are preserved.
  bundle: minifyhtml
  rubric_ref: rubric/minifyhtml_minifyhtml_strip_comments@1.0
  tags:
  - mode:recipe
- id: minifyhtml-exclude-pages
  input: How do I stop Minify Source HTML from minifying certain paths, and what is excluded by default?
  criteria: The exclude_pages setting takes newline-separated path patterns (leading /, * wildcard, <front>
    token); it defaults to /admin* so admin pages are skipped.
  bundle: minifyhtml
  rubric_ref: rubric/minifyhtml_minifyhtml_exclude_pages@1.0
  tags:
  - mode:recipe
- id: minifyhtml-subscriber
  input: How does minifyhtml minify the page, and at what point does it run? Name the class and the event.
  criteria: The MinifyHTMLExit event subscriber runs on KernelEvents::RESPONSE at priority -10000, minifying
    HtmlResponse and BigPipeResponse content.
  bundle: minifyhtml
  rubric_ref: rubric/minifyhtml_minifyhtml_subscriber@1.0
  tags:
  - mode:recipe
- id: minifyhtml-page-cache
  input: Does minifyhtml add per-request overhead when Drupal's page cache is serving anonymous pages?
    Explain when minification runs relative to the cache.
  criteria: Minification runs on the RESPONSE event (priority -10000) before the response is stored in
    the internal page cache, so the cached copy is already minified and cache hits have effectively no
    minification cost.
  bundle: minifyhtml
  rubric_ref: rubric/minifyhtml_minifyhtml_page_cache@1.0
  tags:
  - mode:recipe
- id: minifyhtml-preserved-tags
  input: Will minifyhtml collapse the whitespace inside a <pre> or <textarea> block? Which tags does it
    protect from minification?
  criteria: No. <textarea>, <pre>, <iframe>, <script> and <style> blocks are swapped for placeholder tokens
    before minifying and restored afterward, so their contents are preserved (ld+json scripts kept byte-safe).
  bundle: minifyhtml
  rubric_ref: rubric/minifyhtml_minifyhtml_preserved_tags@1.0
  tags:
  - mode:recipe
