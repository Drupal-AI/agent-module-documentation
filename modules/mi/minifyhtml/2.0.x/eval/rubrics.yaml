rubrics:
- id: minifyhtml_minifyhtml_enable_drush
  version: '1.0'
  applicable_bundles:
  - minifyhtml
  checks:
  - kind: must_contain_any
    values:
    - drush cset minifyhtml.config minify true
    - minifyhtml.config
  scoring:
    combine: all_pass
- id: minifyhtml_minifyhtml_settings_location
  version: '1.0'
  applicable_bundles:
  - minifyhtml
  checks:
  - kind: must_contain_any
    values:
    - system.performance_settings
    - Performance
    - Bandwidth optimization
  scoring:
    combine: all_pass
- id: minifyhtml_minifyhtml_config_keys
  version: '1.0'
  applicable_bundles:
  - minifyhtml
  checks:
  - kind: must_contain_any
    values:
    - minify
    - strip_comments
    - exclude_pages
  scoring:
    combine: all_pass
- id: minifyhtml_minifyhtml_strip_comments
  version: '1.0'
  applicable_bundles:
  - minifyhtml
  checks:
  - kind: must_contain_any
    values:
    - strip_comments
  scoring:
    combine: all_pass
- id: minifyhtml_minifyhtml_exclude_pages
  version: '1.0'
  applicable_bundles:
  - minifyhtml
  checks:
  - kind: must_contain_any
    values:
    - exclude_pages
    - /admin*
  scoring:
    combine: all_pass
- id: minifyhtml_minifyhtml_subscriber
  version: '1.0'
  applicable_bundles:
  - minifyhtml
  checks:
  - kind: must_contain_any
    values:
    - MinifyHTMLExit
    - KernelEvents::RESPONSE
    - response subscriber
    - '-10000'
  scoring:
    combine: all_pass
- id: minifyhtml_minifyhtml_page_cache
  version: '1.0'
  applicable_bundles:
  - minifyhtml
  checks:
  - kind: must_contain_any
    values:
    - before
    - page cache
    - cache hit
    - '-10000'
  scoring:
    combine: all_pass
- id: minifyhtml_minifyhtml_preserved_tags
  version: '1.0'
  applicable_bundles:
  - minifyhtml
  checks:
  - kind: must_contain_any
    values:
    - textarea
    - pre
    - iframe
    - placeholder
  scoring:
    combine: all_pass
