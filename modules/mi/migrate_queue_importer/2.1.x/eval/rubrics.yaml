rubrics:
- id: migrate_queue_importer_migrate_queue_importer_how
  version: '1.0'
  applicable_bundles:
  - migrate_queue_importer
  checks:
  - kind: must_contain_any
    values:
    - cron
    - queue
    - Queue API
    - migrations_importer
    - hook_cron
  scoring:
    combine: all_pass
- id: migrate_queue_importer_migrate_queue_importer_entity
  version: '1.0'
  applicable_bundles:
  - migrate_queue_importer
  checks:
  - kind: must_contain_any
    values:
    - cron_migration
    - time
    - interval
    - migration
    - update
    - sync
    - ignore_dependencies
  scoring:
    combine: all_pass
- id: migrate_queue_importer_migrate_queue_importer_flags
  version: '1.0'
  applicable_bundles:
  - migrate_queue_importer
  checks:
  - kind: must_contain_any
    values:
    - migrations_importer
    - update
    - sync
    - prepareUpdate
    - syncSource
  scoring:
    combine: all_pass
