rubrics:
- id: disable_language_disable_language_how_it_disables
  version: '1.0'
  applicable_bundles:
  - disable_language
  checks:
  - kind: must_contain_any
    values:
    - third_party
    - third-party
    - disable_language
  - kind: must_not_contain
    values:
    - deletes the language
    - uninstalls the language
  scoring:
    combine: all_pass
- id: disable_language_disable_language_permission
  version: '1.0'
  applicable_bundles:
  - disable_language
  checks:
  - kind: must_contain_any
    values:
    - view disabled languages
  scoring:
    combine: all_pass
- id: disable_language_disable_language_admin_still_sees
  version: '1.0'
  applicable_bundles:
  - disable_language
  checks:
  - kind: must_contain_any
    values:
    - view disabled languages
    - redirect
  - kind: must_not_contain
    values:
    - removed for everyone
    - deleted for all users
  scoring:
    combine: all_pass
- id: disable_language_disable_language_known_disabled
  version: '1.0'
