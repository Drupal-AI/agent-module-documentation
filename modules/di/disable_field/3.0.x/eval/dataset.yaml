metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: disable_field
  version: 3.0.x
  note: 'Disable Field adds per-field ''Disable Field Settings'' to the field-config / base-field-override
    edit forms (gated by the ''administer disable field settings'' permission) and disables a field''s
    widget on the add and/or edit entity form via #disabled. State is stored as third-party settings on
    the field''s config entity: disable_field.add_disable / edit_disable (one of none|all|roles|roles_enable)
    plus add_roles / edit_roles (arrays of role ids). No configure route, Drush, or plugins. Medium/hard
    cases are grounded in those real third-party settings: introspection reads which field is disabled
    on which form; execution sets edit_disable=all and add_disable=roles (for a seeded role) on a field,
    verified against the live FieldConfig.'
questions:
- id: df-where-configured
  input: I enabled the disable_field module but there is no admin settings page for it. How do I make
    a specific field read-only (disabled) on the node edit form, and where is that choice stored?
  criteria: 'There is no configure route. Edit the field itself (the field-config edit form, or base-field-override
    form for base fields like title), open ''Disable Field Settings'', and set the edit-form mode to ''Disable
    for all users''. It is stored as a third-party setting on the field''s config entity: field.field.<entity>.<bundle>.<field>.third_party_settings.disable_field.edit_disable.'
  bundle: disable_field
  rubric_ref: rubric/disable_field_df_where_configured@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: df-modes
  input: For each of the add and edit forms, what are the possible disable modes offered by the disable_field
    module?
  criteria: 'Four modes per form, stored in add_disable / edit_disable: none (enable for all users), all
    (disable for all users), roles (disable for the selected roles), roles_enable (enable only for the
    selected roles, disabled for everyone else). Selected roles go in add_roles / edit_roles.'
  bundle: disable_field
  rubric_ref: rubric/disable_field_df_modes@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: df-permission
  input: Which permission does the disable_field module define, and what does it control?
  criteria: 'It defines ''administer disable field settings'' (restrict access: TRUE). It controls whether
    the ''Disable Field Settings'' fieldset appears on the field-config / base-field-override edit forms;
    it does not itself gate whether fields are disabled on content forms.'
  bundle: disable_field
  rubric_ref: rubric/disable_field_df_permission@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: df-which-edit-disabled
  input: 'On this Drupal site the Article content type has two fields configured with disable_field: field_df_on
    and field_df_add. Inspect the live field configuration and state which field is disabled on the EDIT
    content form for all users.'
  criteria: 'field_df_on: its FieldConfig third-party settings have disable_field.edit_disable = all (field_df_add
    instead disables the add form).'
  bundle: disable_field
  rubric_ref: rubric/disable_field_df_which_edit_disabled@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/disable_field-intro-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/disable_field-intro-cleanup.sh
