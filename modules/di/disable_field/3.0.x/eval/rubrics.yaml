rubrics:
- id: disable_field_df_where_configured
  version: '1.0'
  applicable_bundles:
  - disable_field
  checks:
  - kind: must_contain_any
    values:
    - third_party_settings
    - third party setting
    - field edit
    - Field Settings
    - field config
  scoring:
    combine: all_pass
- id: disable_field_df_modes
  version: '1.0'
  applicable_bundles:
  - disable_field
  checks:
  - kind: must_contain_any
    values:
    - roles_enable
    - all
    - none
    - roles
  scoring:
    combine: all_pass
- id: disable_field_df_permission
  version: '1.0'
  applicable_bundles:
  - disable_field
  checks:
  - kind: must_contain_any
    values:
    - administer disable field settings
  scoring:
    combine: all_pass
- id: disable_field_df_which_edit_disabled
  version: '1.0'
  applicable_bundles:
  - disable_field
  checks:
  - kind: must_contain_any
    values:
    - field_df_on
  scoring:
    combine: all_pass
- id: disable_field_df_which_add_disabled
  version: '1.0'
  applicable_bundles:
  - disable_field
  checks:
  - kind: must_contain_any
    values:
    - field_df_add
  scoring:
    combine: all_pass
- id: disable_field_df_disable_edit_all
  version: '1.0'
  applicable_bundles:
  - disable_field
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
- id: disable_field_df_disable_add_roles
  version: '1.0'
  applicable_bundles:
  - disable_field
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
