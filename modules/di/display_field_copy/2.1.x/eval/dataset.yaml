metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: display_field_copy
  version: 2.1.x
  note: 'Display Field Copy is a Display Suite add-on. It has no settings form (configure=null), no permissions,
    no Drush, and defines no plugin TYPE - it provides one DsField plugin ''display_field_copy'' derived
    per configured copy. A copy is a Display Suite dynamic field stored as a SIMPLE config object ds.field.<id>
    with type=display_field_copy and properties.field_id=<entity_type>[.<bundle>].<field>. Medium/hard
    cases are grounded in that real config: introspection reads the source field of a known copy; execution
    builds a copy and verifies the ds.field.* object. Requires the ds module (enabled).'
questions:
- id: display_field_copy-what-it-does
  input: In Drupal, what does the display_field_copy module let you do, and which contrib module does
    it require to work?
  criteria: It is a Display Suite (ds) add-on that lets you render the same entity field more than once
    on a display, each copy using its own formatter and settings. It requires the Display Suite (ds) module.
  bundle: display_field_copy
  rubric_ref: rubric/display_field_copy_display_field_copy_what_it_does@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: display_field_copy-where-stored
  input: A display_field_copy field 'copy' is not a settings form. Where is a copy stored in Drupal configuration,
    and what identifies it as a display_field_copy rather than another Display Suite field?
  criteria: 'Each copy is a simple config object named ds.field.<id> with type: display_field_copy and
    properties.field_id pointing at the source field (<entity_type>.<field> or <entity_type>.<bundle>.<field>).
    There is no configure route.'
  bundle: display_field_copy
  rubric_ref: rubric/display_field_copy_display_field_copy_where_stored@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: display_field_copy-how-create-ui
  input: How do I create a copy of a field with display_field_copy through the admin UI, and where do
    I then choose its formatter?
  criteria: Go to Structure > Display Suite > Fields (/admin/structure/ds/fields), click 'Create a copy
    of a field', pick the source field and save; then on the entity's Manage display the copy appears
    as a DS field where you enable it and choose a formatter.
  bundle: display_field_copy
  rubric_ref: rubric/display_field_copy_display_field_copy_how_create_ui@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: display_field_copy-known-copy
  input: This Drupal site has a Display Suite field copy created with display_field_copy, named dfc_known.
    Inspect the live configuration and state which source field it copies (the field_id).
  criteria: 'ds.field.dfc_known has type display_field_copy and properties.field_id: node.article.body,
    i.e. it copies the Article body field.'
  bundle: display_field_copy
  rubric_ref: rubric/display_field_copy_display_field_copy_known_copy@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/display_field_copy-known-copy-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/display_field_copy-known-copy-cleanup.sh
- id: display_field_copy-create-copy
  input: On this Drupal site, use display_field_copy to create a Display Suite field copy named dfc_task
    that copies the Article node's body field (source field id node.article.body). Apply the change to
    the live site so the copy exists in configuration.
  criteria: 'A simple config object ds.field.dfc_task exists with type: display_field_copy and properties.field_id:
    node.article.body (plus label, type_label ''Copy field'', entities: {node: node}). Create it by saving
    that config or via Structure > Display Suite > Fields > Create a copy of a field.'
  bundle: display_field_copy
  rubric_ref: rubric/display_field_copy_display_field_copy_create_copy@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/display_field_copy-create-copy-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/display_field_copy-create-copy-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/display_field_copy-create-copy-verify.sh
