rubrics:
- id: display_field_copy_display_field_copy_what_it_does
  version: '1.0'
  applicable_bundles:
  - display_field_copy
  checks:
  - kind: must_contain_any
    values:
    - Display Suite
    - ds
    - formatter
    - twice
    - copy
  scoring:
    combine: all_pass
- id: display_field_copy_display_field_copy_where_stored
  version: '1.0'
  applicable_bundles:
  - display_field_copy
  checks:
  - kind: must_contain_any
    values:
    - ds.field
    - display_field_copy
    - properties
    - field_id
  scoring:
    combine: all_pass
- id: display_field_copy_display_field_copy_how_create_ui
  version: '1.0'
  applicable_bundles:
  - display_field_copy
  checks:
  - kind: must_contain_any
    values:
    - Display Suite
    - /admin/structure/ds/fields
    - Create a copy of a field
    - Manage display
  scoring:
    combine: all_pass
- id: display_field_copy_display_field_copy_known_copy
  version: '1.0'
  applicable_bundles:
  - display_field_copy
  checks:
  - kind: must_contain_any
    values:
    - node.article.body
    - body
  scoring:
    combine: all_pass
- id: display_field_copy_display_field_copy_create_copy
  version: '1.0'
  applicable_bundles:
  - display_field_copy
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
