rubrics:
- id: disqus_disqus_shortname_key
  version: '1.0'
  applicable_bundles:
  - disqus
  checks:
  - kind: must_contain_any
    values:
    - disqus_domain
    - shortname
    - disqus.settings
  scoring:
    combine: all_pass
- id: disqus_disqus_enable_on_bundle
  version: '1.0'
  applicable_bundles:
  - disqus
  checks:
  - kind: must_contain_any
    values:
    - disqus_comment
    - field
    - Disqus comments
  scoring:
    combine: all_pass
- id: disqus_disqus_blocks
  version: '1.0'
  applicable_bundles:
  - disqus
  checks:
  - kind: must_contain_any
    values:
    - disqus_recent_comments
    - disqus_popular_threads
    - disqus_top_commenters
    - disqus_combination_widget
  scoring:
    combine: all_pass
- id: disqus_disqus_known_shortname
  version: '1.0'
  applicable_bundles:
  - disqus
  checks:
  - kind: must_contain_any
    values:
    - dqmodtest
  scoring:
    combine: all_pass
- id: disqus_disqus_known_field
  version: '1.0'
  applicable_bundles:
  - disqus
  checks:
  - kind: must_contain_any
    values:
    - field_disqus_known
  scoring:
    combine: all_pass
- id: disqus_disqus_set_shortname
  version: '1.0'
  applicable_bundles:
  - disqus
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
- id: disqus_disqus_add_field
  version: '1.0'
  applicable_bundles:
  - disqus
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
