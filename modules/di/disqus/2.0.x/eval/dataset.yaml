metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: disqus
  version: 2.0.x
  note: 'Disqus integrates the hosted third-party Disqus commenting service. All evals are grounded in
    LOCAL Drupal config/fields only - never a live Disqus API call. Settings live in the disqus.settings
    config object; the required value is disqus_domain (the Disqus site ''shortname''). Commenting is
    enabled per bundle by attaching a ''disqus_comment'' field type (field/widget/formatter all share
    id disqus_comment); each entity then gets a Disqus thread keyed entityType/entityId. Display blocks:
    disqus_recent_comments, disqus_popular_threads, disqus_top_commenters, disqus_combination_widget.
    Medium cases set a known shortname / attach a known disqus_comment field and read it back; hard cases
    set the shortname and attach a disqus_comment field, verified against live config (no Disqus servers
    contacted).'
questions:
- id: disqus-shortname-key
  input: In the Drupal Disqus module, what configuration value must you set for Disqus threads to render,
    and in which config object does it live?
  criteria: You must set your Disqus site 'shortname' in disqus.settings under the key disqus_domain (e.g.
    example.disqus.com -> 'example').
  bundle: disqus
  rubric_ref: rubric/disqus_disqus_shortname_key@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: disqus-enable-on-bundle
  input: How do you turn on Disqus comments for a content type in Drupal? There is no per-content-type
    checkbox.
  criteria: Attach a 'Disqus comments' field (field type disqus_comment) to the bundle; the presence of
    that field is what enables the Disqus thread (with the disqus_comment widget/formatter).
  bundle: disqus
  rubric_ref: rubric/disqus_disqus_enable_on_bundle@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: disqus-blocks
  input: Which display blocks does the Drupal Disqus module provide?
  criteria: disqus_recent_comments, disqus_popular_threads, disqus_top_commenters and disqus_combination_widget.
  bundle: disqus
  rubric_ref: rubric/disqus_disqus_blocks@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: disqus-known-shortname
  input: On this Drupal site, the Disqus site shortname has been configured. Inspect the live Disqus configuration
    and give the exact shortname value.
  criteria: disqus.settings:disqus_domain is 'dqmodtest'.
  bundle: disqus
  rubric_ref: rubric/disqus_disqus_known_shortname@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/disqus-known-shortname-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/disqus-known-shortname-cleanup.sh
- id: disqus-known-field
  input: On this Drupal site, the Article content type has a Disqus comments field attached. Inspect the
    live field configuration and give the machine name of the disqus_comment field on Article.
  criteria: 'The field is field_disqus_known: node.article has a field of type disqus_comment named field_disqus_known.'
  bundle: disqus
  rubric_ref: rubric/disqus_disqus_known_field@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/disqus-known-field-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/disqus-known-field-cleanup.sh
- id: disqus-set-shortname
  input: On this Drupal site, configure the Disqus module to use the site shortname 'acmeblog'. Apply
    the change to the live configuration. (Do not contact Disqus's servers.)
  criteria: Set disqus.settings:disqus_domain to 'acmeblog' (e.g. drush cset disqus.settings disqus_domain
    acmeblog -y, or via the settings form at /admin/config/services/disqus).
  bundle: disqus
  rubric_ref: rubric/disqus_disqus_set_shortname@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/disqus-set-shortname-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/disqus-set-shortname-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/disqus-set-shortname-verify.sh
- id: disqus-add-field
  input: On this Drupal site, enable Disqus comments on the Article content type by attaching a Disqus
    comments field named 'field_disqus_task' to it. Apply the change to the live site.
  criteria: Create a field of type disqus_comment named field_disqus_task on node.article, e.g. FieldStorageConfig::create(['field_name'=>'field_disqus_task','entity_type'=>'node','type'=>'disqus_comment'])->save();
    then FieldConfig::create(['field_name'=>'field_disqus_task','entity_type'=>'node','bundle'=>'article','label'=>'Comments'])->save();
  bundle: disqus
  rubric_ref: rubric/disqus_disqus_add_field@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/disqus-add-field-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/disqus-add-field-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/disqus-add-field-verify.sh
