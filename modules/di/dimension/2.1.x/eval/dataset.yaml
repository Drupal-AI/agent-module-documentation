metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: dimension
  version: 2.1.x
  note: 'Dimension provides three calculated field types: length_field_type (component length), area_field_type
    (width, height), volume_field_type (length, width, height). Each stores a computed ''value'' = product
    of (component x its factor) rounded to value_scale. Per-component FieldConfig settings are factor/min/max/prefix/suffix;
    storage settings are <key>_precision/<key>_scale. Medium cases read known field settings (an area
    field''s width factor; a length field''s min). Hard cases create a namespaced area field and a length
    field with a factor of 10. All fields are namespaced field_dim_* and removed by cleanup/reset. No
    drush cr (config/entity reads are live) to avoid an unrelated shared-site group-module cache-rebuild
    fault.'
questions:
- id: dimension-field-types
  input: What field types does the Drupal 'dimension' module provide, and what does each measure?
  criteria: 'Three calculated field types: length_field_type (length), area_field_type (width x height),
    and volume_field_type (length x width x height).'
  bundle: dimension
  rubric_ref: rubric/dimension_dimension_field_types@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: dimension-calculation
  input: In the dimension module, how is the stored dimension value of an Area field computed from what
    the editor enters?
  criteria: 'In preSave() the value is the product of each component times its configurable factor, rounded
    to value_scale: for Area, value = width x width.factor x height x height.factor. Volume multiplies
    all three components; Length is length x length.factor.'
  bundle: dimension
  rubric_ref: rubric/dimension_dimension_calculation@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: dimension-formatters
  input: Besides showing the computed total, how can the dimension module display the individual width/height
    components of an Area field, and what formatter does that?
  criteria: 'Use the ''Dimension: Area Components'' formatter (area_components_field_formatter), which
    renders the raw components via the area-components template as ''{{ width }} x {{ height }}''. The
    plain area_field_formatter instead shows the computed value (with the value prefix/suffix).'
  bundle: dimension
  rubric_ref: rubric/dimension_dimension_formatters@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: dimension-width-factor
  input: The Article content type has a dimension Area field named field_dim_known_area. Inspect its live
    field configuration and state the factor that is applied to the Width component.
  criteria: The Width component's factor is 2, in FieldConfig node.article.field_dim_known_area settings.width.factor.
  bundle: dimension
  rubric_ref: rubric/dimension_dimension_width_factor@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/dimension-width-factor-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/dimension-width-factor-cleanup.sh
- id: dimension-length-min
  input: The Article content type has a dimension Length field named field_dim_known_len with a minimum
    value constraint configured. Inspect the live field configuration and state the minimum allowed length.
  criteria: The Length component's min is 5, in FieldConfig node.article.field_dim_known_len settings.length.min.
  bundle: dimension
  rubric_ref: rubric/dimension_dimension_length_min@1.0
  tags:
  - mode:introspection
  - difficulty:medium
