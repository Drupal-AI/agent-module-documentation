metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: disable_user_1_edit
  version: 1.7.x
  note: 'Disable user 1 edit is a single access hook. Code-grounded facts: disable_user_1_edit_user_access
    (hook_ENTITY_TYPE_access for user) forbids entity access to user id 1 when active, via AccessResult::forbiddenIf()
    guarded by a non-existent permission (always forbidden); it does NOT filter $operation so update/delete/view
    are all blocked. Protection is controlled by config disable_user_1_edit.settings:disabled (integer,
    default 0) with INVERTED semantics: 0 = restriction ACTIVE (user 1 locked), 1 = restriction OFF (user
    1 editable). Settings form route disable_user_1_edit.config_form at /admin/config/people/disable_user_1_edit,
    permission ''administer disable user 1 edit'' (restrict access). No dependencies, drush, or plugins.
    Medium cases install a known live state (restriction off / on) discoverable via drush cget. Hard cases
    build real state verified against BOTH the config value AND the live access-hook result (User::load(1)
    access): make user 1 editable, and re-lock it. Every reset/cleanup restores the shipped default disabled=0
    so the shared site stays protected.'
questions:
- id: d1e-what-and-flag
  input: What does the disable_user_1_edit module do, and which config value controls it? Be careful to
    explain the meaning of the value (which value locks user 1 and which unlocks it).
  criteria: 'It blocks entity access to user 1 (the superuser) even for accounts with ''administer users''.
    It is controlled by config disable_user_1_edit.settings:disabled (default 0). The semantics are inverted:
    disabled=0 means the restriction is ACTIVE (user 1 locked); disabled=1 means the restriction is OFF
    (user 1 editable again).'
  bundle: disable_user_1_edit
  rubric_ref: rubric/disable_user_1_edit_d1e_what_and_flag@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: d1e-route-perm
  input: In the disable_user_1_edit module, at what admin path do you toggle the protection and which
    permission is required?
  criteria: 'The settings form is at /admin/config/people/disable_user_1_edit (route disable_user_1_edit.config_form)
    and requires the ''administer disable user 1 edit'' permission (which is restrict access: true). It
    has a single ''Disable restriction'' checkbox.'
  bundle: disable_user_1_edit
  rubric_ref: rubric/disable_user_1_edit_d1e_route_perm@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: d1e-mechanism
  input: How does the disable_user_1_edit module actually stop user 1 from being edited, and does it only
    affect the edit operation?
  criteria: 'It implements hook_ENTITY_TYPE_access for the user entity (disable_user_1_edit_user_access):
    when the entity id is 1 and the restriction is active it returns AccessResult::forbiddenIf() guarded
    by a permission that no role can hold, so access is always forbidden. It does not check $operation,
    so it forbids update, delete AND view of user 1 - not just editing.'
  bundle: disable_user_1_edit
  rubric_ref: rubric/disable_user_1_edit_d1e_mechanism@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: d1e-known-off
  input: On this Drupal site the disable_user_1_edit module is installed. Inspect the live configuration
    and state whether editing of user 1 is currently RESTRICTED or currently ALLOWED (and back it up with
    the setting value).
  criteria: 'User 1 editing is currently ALLOWED: disable_user_1_edit.settings:disabled is 1, which turns
    the restriction OFF (readable via `drush cget disable_user_1_edit.settings disabled`).'
  bundle: disable_user_1_edit
  rubric_ref: rubric/disable_user_1_edit_d1e_known_off@1.0
