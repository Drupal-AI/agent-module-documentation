- id: d1e-make-editable
  input: On this Drupal site the disable_user_1_edit module is currently locking user 1 so administrators
    cannot edit it. A legitimate change to user 1 is needed - reconfigure the module so user 1 becomes
    editable again (turn the restriction off). Apply the change to the live site.
  criteria: Set disable_user_1_edit.settings:disabled to 1 (tick 'Disable restriction' on the settings
