metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: disable_html5_validation
  version: 2.0.x
  note: disable_html5_validation is a single hook_form_alter() that sets $form['#attributes']['novalidate']
    = 'novalidate' on every form. No config, no configure route, no permissions, no schema, no services,
    no plugins. Its effect is a rendered <form> attribute and is observable by building any form via entity.form_builder
    and reading $form['#attributes']['novalidate']. Medium cases create a namespaced content type (field_/type
    prefix dhv_) and read the attribute back off the live rendered form; the hard override case has the
    agent write a hook_form_FORM_ID_alter that unsets the attribute for a single form. No dblog is used
    (watchdog writes are unreliable under drush php:eval on this site).
questions:
- id: disable-html5-validation-attribute
  input: What does the Drupal contrib module disable_html5_validation do to forms, and specifically which
    HTML attribute does it add to the <form> element to achieve it?
  criteria: It implements hook_form_alter() and sets $form['#attributes']['novalidate'] = 'novalidate'
    on every form, so the rendered <form> carries the HTML5 novalidate attribute and the browser skips
    native client-side validation; Drupal server-side validation is unchanged.
  bundle: disable_html5_validation
  rubric_ref: rubric/disable_html5_validation_disable_html5_validation_attribute@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: disable-html5-validation-hook
  input: Which Drupal hook does the disable_html5_validation module implement to disable HTML5 validation,
    and does it target specific forms or all of them?
  criteria: It implements hook_form_alter() (disable_html5_validation_form_alter). The hook runs for every
    form and unconditionally adds novalidate, so it affects all forms site-wide with no allow/deny list
    and no configuration.
  bundle: disable_html5_validation
  rubric_ref: rubric/disable_html5_validation_disable_html5_validation_hook@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: disable-html5-validation-exclude-one
  input: disable_html5_validation removes HTML5 browser validation from all forms, but I want the browser
    validation back on just one form (say the user login form). How do I re-enable it for a single form?
  criteria: There is no per-form setting. Implement your own hook_form_FORM_ID_alter() (e.g. MYMODULE_form_user_login_form_alter)
    and unset($form['#attributes']['novalidate']); FORM_ID alters run after the generic hook_form_alter,
    so this restores native validation for that one form.
  bundle: disable_html5_validation
  rubric_ref: rubric/disable_html5_validation_disable_html5_validation_exclude_one@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: disable-html5-validation-known-type
  input: On this Drupal site there is a content type with machine name dhv_known. Inspect the live site
    and determine what HTML attribute the disable_html5_validation module puts on the dhv_known node add/edit
    form's <form> element to switch off browser validation.
  criteria: 'The dhv_known node form''s #attributes contains ''novalidate'' => ''novalidate'' (added by
    disable_html5_validation_form_alter), so the rendered <form> has the novalidate attribute.'
  bundle: disable_html5_validation
  rubric_ref: rubric/disable_html5_validation_disable_html5_validation_known_type@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/disable_html5_validation-known-type-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/disable_html5_validation-known-type-cleanup.sh
- id: disable-html5-validation-scope
  input: This site has disable_html5_validation enabled and a test content type dhv_scope. Confirm from
    the live site whether the module's effect is global by checking both the dhv_scope node form and the
    core user login form (user_login_form). What attribute appears on each form?
  criteria: 'Both the dhv_scope node form and the user_login_form carry #attributes[''novalidate''] =
    ''novalidate''. hook_form_alter runs for every form, so the novalidate attribute is present on both,
    confirming the effect is global.'
  bundle: disable_html5_validation
  rubric_ref: rubric/disable_html5_validation_disable_html5_validation_scope@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/disable_html5_validation-scope-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/disable_html5_validation-scope-cleanup.sh
- id: disable-html5-validation-newtype
  input: On this site disable_html5_validation is enabled. Create a new content type with machine name
    dhv_task (label 'DHV Task'). Because the module is enabled, its node add/edit form must be rendered
    with browser HTML5 validation disabled. Apply the change to the live site.
  criteria: 'A content type node.dhv_task exists and its default form (built via entity.form_builder)
    has #attributes[''novalidate''] = ''novalidate'', supplied automatically by disable_html5_validation_form_alter.'
  bundle: disable_html5_validation
  rubric_ref: rubric/disable_html5_validation_disable_html5_validation_newtype@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/disable_html5_validation-newtype-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/disable_html5_validation-newtype-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/disable_html5_validation-newtype-verify.sh
- id: disable-html5-validation-override
  input: disable_html5_validation is enabled and adds novalidate to every form on this site, including
    the user login form. Re-enable native HTML5 browser validation for ONLY the user login form (user_login_form)
    while leaving it disabled everywhere else. Do this by creating a small custom module named dhv_login_override
    that implements hook_form_user_login_form_alter() to unset the novalidate attribute. Enable your module.
  criteria: A module dhv_login_override is enabled implementing dhv_login_override_form_user_login_form_alter()
    that unsets $form['#attributes']['novalidate']. On the live site the built user_login_form no longer
    has the novalidate attribute, while other forms (e.g. the article node form) still do.
  bundle: disable_html5_validation
  rubric_ref: rubric/disable_html5_validation_disable_html5_validation_override@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/disable_html5_validation-override-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/disable_html5_validation-override-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/disable_html5_validation-override-verify.sh
