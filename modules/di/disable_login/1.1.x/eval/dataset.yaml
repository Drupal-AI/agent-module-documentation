metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: disable_login
  version: 1.1.x
  note: 'Disable Login Page adds a route access check to user.login / user.login.http that forbids the
    login page unless the request carries ?<querystring>=<secret>. Config object disable_login.settings
    has three keys: disable_login (bool master switch), querystring (parameter name), secret (required
    value). Configure route disable_login.settings_form (/admin/config/security/disable-login), core ''administer
    site configuration'' permission. No config/install ships, so protection is off until configured. Secret
    can be altered via hook_disable_login_key_alter(&$secret). Cases are grounded in these keys; medium/hard
    scripts set and read them and always disable protection on cleanup/reset so login is never left locked.'
questions:
- id: disable_login-access-url
  input: With the disable_login module protecting my Drupal login page using querystring name 'key' and
    secret value 'abc123', what URL lets an authorised user reach the login form, and what happens without
    it?
  criteria: Visit /user/login?key=abc123 to reach the form; /user/login without the correct querystring/value
    returns Access Denied (403).
  bundle: disable_login
  rubric_ref: rubric/disable_login_disable_login_access_url@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: disable_login-config-keys
  input: Which configuration values does the disable_login module use to protect the login page, and where
    is the settings page?
  criteria: Config object disable_login.settings with keys disable_login (on/off), querystring (parameter
    name) and secret (required value). Settings at Configuration > Security > Disable Login Page (/admin/config/security/disable-login).
  bundle: disable_login
  rubric_ref: rubric/disable_login_disable_login_config_keys@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: disable_login-key-hook
  input: How can a developer make the disable_login secret key change automatically (for example rotate
    it monthly) instead of hard-coding one value?
  criteria: Implement hook_disable_login_key_alter(&$secret) in a custom module and assign the computed
    value to $secret (it is passed by reference); the access check uses the altered value.
  bundle: disable_login
  rubric_ref: rubric/disable_login_disable_login_key_hook@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: disable_login-current-key
  input: This Drupal site has the login page protected by the disable_login module. Inspect the live configuration
    and give the exact URL an authorised user must use to reach /user/login.
  criteria: disable_login.settings has disable_login=true, querystring=entry, secret=sesame, so the URL
    is /user/login?entry=sesame.
  bundle: disable_login
  rubric_ref: rubric/disable_login_disable_login_current_key@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/disable_login-protected-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/disable_login-protected-cleanup.sh
- id: disable_login-is-protected
  input: Is anonymous access to the /user/login page currently restricted by the disable_login module
    on this site? Inspect the live configuration to answer yes/no and explain.
  criteria: 'Yes: disable_login.settings -> disable_login is true, so the access check forbids /user/login
    unless the request has ?entry=sesame.'
  bundle: disable_login
  rubric_ref: rubric/disable_login_disable_login_is_protected@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/disable_login-protected-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/disable_login-protected-cleanup.sh
- id: disable_login-enable-protection
  input: On this Drupal site, use the disable_login module to block anonymous access to /user/login unless
    the request includes the querystring parameter 'gate' with the value 'openup'. Apply the change to
    the live site.
  criteria: 'Set disable_login.settings: disable_login=true, querystring=''gate'', secret=''openup'' (e.g.
    drush cset disable_login.settings disable_login 1; ... querystring gate; ... secret openup). Then
    /user/login?gate=openup reaches the form.'
  bundle: disable_login
  rubric_ref: rubric/disable_login_disable_login_enable_protection@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/disable_login-enable-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/disable_login-enable-reset.sh
    verify: agent-module-documentation/evaluation/verify/disable_login-enable-verify.sh
- id: disable_login-change-key
  input: This Drupal site already protects /user/login with the disable_login module. Rotate the credentials
    so the login page now requires the querystring parameter 'pass' with the value 'letmein' (keeping
    protection enabled). Apply the change to the live site.
  criteria: Keep disable_login.settings:disable_login=true and set querystring='pass', secret='letmein',
    so the working URL becomes /user/login?pass=letmein.
  bundle: disable_login
  rubric_ref: rubric/disable_login_disable_login_change_key@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/disable_login-change-key-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/disable_login-change-key-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/disable_login-change-key-verify.sh
