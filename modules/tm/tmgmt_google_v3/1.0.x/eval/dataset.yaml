metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: tmgmt_google_v3
  version: 1.0.x
  note: 'tmgmt_google_v3 adds ONE TMGMT translator plugin, id ''google_v3'' (Drupal\tmgmt_google_v3\Plugin\tmgmt\Translator\GoogleV3Translator,
    UI GoogleV3TranslatorUi), sending jobs to the Google Cloud Translation v3 API. No settings page (configure=null),
    no permissions, no Drush; all config lives on a tmgmt_translator (provider) config entity using this
    plugin. Settings: location (default global), api_project (Google project id), google_credentials (managed
    JSON key in private://), glossary_mappings (per-langcode glossary id). LIVE translation needs a real
    Google service-account key which this environment does NOT have, so medium/hard cases are grounded
    ONLY in the provider config the agent can set without a key: creating the tmgmt_translator with plugin
    google_v3 and setting its location / api_project. Providers are namespaced tmgmtg_*. Extension point:
    PostTranslationEvent (''post_translation'').'
questions:
- id: tmgmt_google_v3-provider-setup
  input: How do I set up Google Cloud Translation v3 as a machine-translation provider in TMGMT using
    the tmgmt_google_v3 module? What do I create, and which settings must I supply?
  criteria: Create a TMGMT Translator (translation provider) that uses the Google V3 plugin (id google_v3)
    and set its Location (default global), Project ID (api_project) and upload the Google service-account
    JSON credentials (stored in the private file system). There is no separate module settings page.
  bundle: tmgmt_google_v3
  rubric_ref: rubric/tmgmt_google_v3_tmgmt_google_v3_provider_setup@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: tmgmt_google_v3-credentials-private
  input: The tmgmt_google_v3 translator asks me to upload a Google API credentials JSON file. Where is
    that file stored, and what filesystem must be enabled for it to work?
  criteria: The credentials JSON key is uploaded as a managed file to the private filesystem (private://),
    so the private file system must be enabled. The file is marked permanent on save and only .json is
    allowed.
  bundle: tmgmt_google_v3
  rubric_ref: rubric/tmgmt_google_v3_tmgmt_google_v3_credentials_private@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: tmgmt_google_v3-glossary-event
  input: In tmgmt_google_v3, how can I enforce consistent domain terminology per language, and how would
    a custom module post-process each string returned by Google before it is saved?
  criteria: Use the translator's Glossary mappings (glossary_mappings) to map a Drupal language to a Google
    glossary id. To post-process output, subscribe to PostTranslationEvent (event name 'post_translation')
    and use getTranslatedText()/setTranslatedText().
  bundle: tmgmt_google_v3
  rubric_ref: rubric/tmgmt_google_v3_tmgmt_google_v3_glossary_event@1.0
  tags:
  - mode:recipe
  - difficulty:easy
