rubrics:
- id: tmgmt_google_v3_tmgmt_google_v3_provider_setup
  version: '1.0'
  applicable_bundles:
  - tmgmt_google_v3
  checks:
  - kind: must_contain_any
    values:
    - translator
    - provider
    - google_v3
    - api_project
    - project
    - credentials
  scoring:
    combine: all_pass
- id: tmgmt_google_v3_tmgmt_google_v3_credentials_private
  version: '1.0'
  applicable_bundles:
  - tmgmt_google_v3
  checks:
  - kind: must_contain_any
    values:
    - private
    - private://
    - private file
  scoring:
    combine: all_pass
- id: tmgmt_google_v3_tmgmt_google_v3_glossary_event
  version: '1.0'
  applicable_bundles:
  - tmgmt_google_v3
  checks:
  - kind: must_contain_any
    values:
    - glossary
    - glossary_mappings
    - PostTranslationEvent
    - post_translation
  scoring:
    combine: all_pass
- id: tmgmt_google_v3_tmgmt_google_v3_known_project
  version: '1.0'
  applicable_bundles:
  - tmgmt_google_v3
  checks:
  - kind: must_contain_any
    values:
    - tmgmtg-probe-project
  scoring:
    combine: all_pass
- id: tmgmt_google_v3_tmgmt_google_v3_known_plugin
  version: '1.0'
  applicable_bundles:
  - tmgmt_google_v3
  checks:
  - kind: must_contain_any
    values:
    - google_v3
  scoring:
    combine: all_pass
- id: tmgmt_google_v3_tmgmt_google_v3_create_provider
  version: '1.0'
  applicable_bundles:
  - tmgmt_google_v3
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
- id: tmgmt_google_v3_tmgmt_google_v3_set_project
  version: '1.0'
  applicable_bundles:
  - tmgmt_google_v3
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
