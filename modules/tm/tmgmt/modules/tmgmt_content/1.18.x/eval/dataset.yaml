metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: tmgmt_content
  version: 1.18.x
  note: tmgmt_content is a TMGMT source submodule registering the 'content' source plugin over core content_translation.
    Cases are `recipe` (response-graded) probing documented facts; no site mutation.
questions:
- id: tmgmt-content-source-id
  input: On a Drupal 11 TMGMT site, what is the source plugin id used to translate a node, and how do
    I add node 5 to a job in code with it?
  criteria: The source plugin id is 'content' (ContentEntitySource); $job->addItem('content', 'node',
    5).
  bundle: tmgmt_content
  rubric_ref: rubric/tmgmt_content_tmgmt_content_source_id@1.0
  tags:
  - mode:recipe
- id: tmgmt-content-writeback
  input: When a TMGMT translation of a node is accepted, how does tmgmt_content store the result, and
    what core module does it build on?
  criteria: It writes the accepted values back as a core entity translation, building on core content_translation.
  bundle: tmgmt_content
  rubric_ref: rubric/tmgmt_content_tmgmt_content_writeback@1.0
  tags:
  - mode:recipe
- id: tmgmt-content-embedded
  input: I want referenced paragraphs to be translated in the same TMGMT job as the parent node. Which
    tmgmt_content config setting controls which reference fields are pulled in, and in which config object?
  criteria: The embedded_fields setting in the tmgmt_content.settings config object lists reference fields
    whose targets are embedded into the same job.
  bundle: tmgmt_content
  rubric_ref: rubric/tmgmt_content_tmgmt_content_embedded@1.0
  tags:
  - mode:recipe
- id: tmgmt-content-field-processor
  input: A custom field type serializes incorrectly when sent to TMGMT. Which tmgmt_content interface
    do I implement to control how a field is extracted and written back?
  criteria: Implement Drupal\tmgmt_content\FieldProcessorInterface (like DefaultFieldProcessor / LinkFieldProcessor
    / PathFieldProcessor / MetatagsFieldProcessor).
  bundle: tmgmt_content
  rubric_ref: rubric/tmgmt_content_tmgmt_content_field_processor@1.0
  tags:
  - mode:recipe
- id: tmgmt-content-deps
  input: Which modules must be enabled for tmgmt_content to work, and which project is it part of?
  criteria: It depends on tmgmt, core content_translation and block; it is part of the tmgmt project.
  bundle: tmgmt_content
  rubric_ref: rubric/tmgmt_content_tmgmt_content_deps@1.0
  tags:
  - mode:recipe
