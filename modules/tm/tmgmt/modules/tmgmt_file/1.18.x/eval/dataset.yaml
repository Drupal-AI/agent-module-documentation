metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: tmgmt_file
  version: 1.18.x
  note: 'tmgmt_file is the TMGMT ''file'' translator: export a job to XLIFF/HTML and import the translation
    back; it defines a pluggable Format sub-type. Cases are `recipe` (response-graded) probing documented
    facts; no site mutation.'
questions:
- id: tmgmt-file-plugin-id
  input: I want to send TMGMT content to an outside agency as a file and import their translation back.
    Which translator plugin id / submodule provides this?
  criteria: 'The ''file'' translator plugin (FileTranslator) from tmgmt_file: submitting exports a file,
    uploading the translated file imports it back.'
  bundle: tmgmt_file
  rubric_ref: rubric/tmgmt_file_tmgmt_file_plugin_id@1.0
  tags:
  - mode:recipe
- id: tmgmt-file-formats
  input: Which file formats can tmgmt_file export/import out of the box, and how do I add a new one?
  criteria: Ships xlf (XLIFF) and html formats; add a new one by implementing a FormatPlugin (FormatInterface)
    in Plugin/tmgmt_file/Format, discovered by plugin.manager.tmgmt_file.format.
  bundle: tmgmt_file
  rubric_ref: rubric/tmgmt_file_tmgmt_file_formats@1.0
  tags:
  - mode:recipe
- id: tmgmt-file-default-format
  input: What is the default export format for the tmgmt_file provider, and which setting lets the requester
    pick a different format per job?
  criteria: Default export_format is 'xlf'; allow_override (default true) lets the requester choose the
    format per job. Settings live in tmgmt.translator.settings.file.
  bundle: tmgmt_file
  rubric_ref: rubric/tmgmt_file_tmgmt_file_default_format@1.0
  tags:
  - mode:recipe
- id: tmgmt-file-scheme
  input: Which tmgmt_file provider setting controls where exported translation files are stored (which
    stream wrapper), and what is its default?
  criteria: The 'scheme' setting sets the stream wrapper (default 'public'), e.g. change to private://
    for restricted files.
  bundle: tmgmt_file
  rubric_ref: rubric/tmgmt_file_tmgmt_file_scheme@1.0
  tags:
  - mode:recipe
- id: tmgmt-file-drush
  input: Does tmgmt_file offer a way to script export/import from the command line?
  criteria: Yes — it registers Drush commands (tmgmt_file.commands / TmgmtFileCommands) for scripting
    export/import.
  bundle: tmgmt_file
  rubric_ref: rubric/tmgmt_file_tmgmt_file_drush@1.0
  tags:
  - mode:recipe
