rubrics:
- id: tmgmt_file_tmgmt_file_plugin_id
  version: '1.0'
  applicable_bundles:
  - tmgmt_file
  checks:
  - kind: must_contain_any
    values:
    - '''file'''
    - file
    - FileTranslator
    - tmgmt_file
  scoring:
    combine: all_pass
- id: tmgmt_file_tmgmt_file_formats
  version: '1.0'
  applicable_bundles:
  - tmgmt_file
  checks:
  - kind: must_contain_any
    values:
    - xlf
    - xliff
    - html
    - FormatInterface
    - FormatPlugin
  scoring:
    combine: all_pass
- id: tmgmt_file_tmgmt_file_default_format
  version: '1.0'
  applicable_bundles:
  - tmgmt_file
  checks:
  - kind: must_contain_any
    values:
    - export_format
    - allow_override
  scoring:
    combine: all_pass
- id: tmgmt_file_tmgmt_file_scheme
  version: '1.0'
  applicable_bundles:
  - tmgmt_file
  checks:
  - kind: must_contain_any
    values:
    - scheme
    - public
  scoring:
    combine: all_pass
- id: tmgmt_file_tmgmt_file_drush
  version: '1.0'
  applicable_bundles:
  - tmgmt_file
  checks:
  - kind: must_contain_any
    values:
    - drush
    - TmgmtFileCommands
    - commands
  scoring:
    combine: all_pass
