metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: tmgmt_local
  version: 1.18.x
  note: tmgmt_local is the TMGMT 'local' translator that lets Drupal users translate content in-site via
    tasks. Cases are `recipe` (response-graded) probing documented facts; no site mutation.
questions:
- id: tmgmt-local-plugin-id
  input: I want TMGMT jobs to be translated by in-house Drupal users instead of an API. Which translator
    plugin id do I use for the provider, and which submodule provides it?
  criteria: The 'local' translator plugin (LocalTranslator), provided by tmgmt_local; configure a Provider
    that uses it.
  bundle: tmgmt_local
  rubric_ref: rubric/tmgmt_local_tmgmt_local_plugin_id@1.0
  tags:
  - mode:recipe
- id: tmgmt-local-task-entities
  input: When a job is submitted to a local TMGMT provider, what entities represent the work the translator
    sees, and at what path do translators find their work?
  criteria: A tmgmt_local_task content entity with tmgmt_local_task_item children; translators work under
    /translate.
  bundle: tmgmt_local
  rubric_ref: rubric/tmgmt_local_tmgmt_local_task_entities@1.0
  tags:
  - mode:recipe
- id: tmgmt-local-permissions
  input: Which two tmgmt_local permissions gate being able to perform translation tasks versus managing/assigning
    all tasks?
  criteria: '''provide translation services'' makes a user eligible to receive/do tasks; ''administer
    translation tasks'' manages and assigns all tasks.'
  bundle: tmgmt_local
  rubric_ref: rubric/tmgmt_local_tmgmt_local_permissions@1.0
  tags:
  - mode:recipe
- id: tmgmt-local-language-combination
  input: How does tmgmt_local ensure a translation task is only offered to a user who can actually translate
    that language pair? Which required submodule provides that data?
  criteria: Eligibility uses the language-combination field from the required tmgmt_language_combination
    submodule, recording each user's source-to-target pairs.
  bundle: tmgmt_local
  rubric_ref: rubric/tmgmt_local_tmgmt_local_language_combination@1.0
  tags:
  - mode:recipe
- id: tmgmt-local-assignment
  input: In tmgmt_local, how can a translation task be handed to a translator? Name at least two assignment
    routes/paths.
  criteria: Tasks can be assigned to a user (/translate/{task}/assign), self-assigned (/assign_to_me),
    unassigned, or bulk-assigned (/translate/assign-multiple).
  bundle: tmgmt_local
  rubric_ref: rubric/tmgmt_local_tmgmt_local_assignment@1.0
  tags:
  - mode:recipe
