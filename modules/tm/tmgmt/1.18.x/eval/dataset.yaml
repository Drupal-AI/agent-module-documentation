metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: tmgmt
  version: 1.18.x
  note: 'TMGMT is a translation framework: job/job-item/message content entities, a tmgmt_translator config
    entity, Translator + Source plugin types, a review UI, and a Job API. Cases are `recipe` (response-graded)
    probing documented facts an agent would otherwise read source to answer; no site mutation.'
questions:
- id: tmgmt-entities
  input: On a Drupal 11 site using TMGMT, which entity represents one translation task per language, which
    represents a single translated thing inside it, and are they content or config entities?
  criteria: tmgmt_job (the per-language job) and tmgmt_job_item (one item per source thing) are both content
    entities; tmgmt_message logs events. Providers are the tmgmt_translator config entity.
  bundle: tmgmt
  rubric_ref: rubric/tmgmt_tmgmt_entities@1.0
  tags:
  - mode:recipe
- id: tmgmt-plugin-types
  input: I want to add a new translation provider to TMGMT that calls an external API. Which plugin type
    and namespace do I implement, and which attribute annotates the class?
  criteria: 'Implement a Translator plugin in Plugin/tmgmt/Translator, extending TranslatorPluginBase
    and annotated with #[TranslatorPlugin(...)] (Drupal\tmgmt\Attribute\TranslatorPlugin); managed by
    plugin.manager.tmgmt.translator.'
  bundle: tmgmt
  rubric_ref: rubric/tmgmt_tmgmt_plugin_types@1.0
  tags:
  - mode:recipe
- id: tmgmt-source-plugin
  input: In TMGMT, which plugin type exposes translatable text (nodes, config, strings) to the system,
    and in which src namespace do such plugins live?
  criteria: 'Source plugins (Plugin/tmgmt/Source, #[SourcePlugin], SourcePluginBase, plugin.manager.tmgmt.source)
    expose translatable data via getData().'
  bundle: tmgmt
  rubric_ref: rubric/tmgmt_tmgmt_source_plugin@1.0
  tags:
  - mode:recipe
- id: tmgmt-create-job-in-code
  input: In PHP on a Drupal 11 TMGMT site, programmatically create a translation job from English to German,
    add node 1 via the content source, and request translation. Show the key calls.
  criteria: Job::create(['source_language'=>'en','target_language'=>'de','translator'=>...]); $job->save();
    $job->addItem('content','node',1); $job->requestTranslation().
  bundle: tmgmt
  rubric_ref: rubric/tmgmt_tmgmt_create_job_in_code@1.0
  tags:
  - mode:recipe
- id: tmgmt-review-ui
  input: Where in TMGMT does an editor review a returned translation and accept it, and what route/path
    serves a single job item review form?
  criteria: The job-item form (entity.tmgmt_job_item.canonical, /admin/tmgmt/items/{tmgmt_job_item}) shows
    source vs translation; accepting moves REVIEW to ACCEPTED and saves the translation (JobItem::acceptTranslation()).
  bundle: tmgmt
  rubric_ref: rubric/tmgmt_tmgmt_review_ui@1.0
  tags:
  - mode:recipe
- id: tmgmt-auto-accept
  input: How do I make a TMGMT provider skip manual review and automatically accept finished translations?
    Which config key on which entity controls it?
  criteria: Set auto_accept on the tmgmt_translator (Provider) config entity — 'Auto accept finished translations'.
  bundle: tmgmt
  rubric_ref: rubric/tmgmt_tmgmt_auto_accept@1.0
  tags:
  - mode:recipe
- id: tmgmt-checkout-hooks
  input: Which TMGMT hooks let a custom module act right before and right after a job is handed to its
    translation provider?
  criteria: hook_tmgmt_job_before_request_translation(JobInterface $job) and hook_tmgmt_job_after_request_translation(JobInterface
    $job); checkout also has hook_tmgmt_job_checkout_before/after_alter().
  bundle: tmgmt
  rubric_ref: rubric/tmgmt_tmgmt_checkout_hooks@1.0
  tags:
  - mode:recipe
- id: tmgmt-permissions
  input: Which TMGMT permission gates accepting/rejecting translations versus full administration, and
    where are they defined?
  criteria: tmgmt.permissions.yml defines 'administer tmgmt' (restricted, full admin), plus 'create translation
    jobs', 'submit translation jobs', 'accept translation jobs' (accept/reject), and 'delete translation
    jobs'.
  bundle: tmgmt
  rubric_ref: rubric/tmgmt_tmgmt_permissions@1.0
  tags:
  - mode:recipe
