rubrics:
- id: tmgmt_tmgmt_entities
  version: '1.0'
  applicable_bundles:
  - tmgmt
  checks:
  - kind: must_contain_any
    values:
    - tmgmt_job
    - tmgmt_job_item
  scoring:
    combine: all_pass
- id: tmgmt_tmgmt_plugin_types
  version: '1.0'
  applicable_bundles:
  - tmgmt
  checks:
  - kind: must_contain_any
    values:
    - Plugin/tmgmt/Translator
    - TranslatorPlugin
  scoring:
    combine: all_pass
- id: tmgmt_tmgmt_source_plugin
  version: '1.0'
  applicable_bundles:
  - tmgmt
  checks:
  - kind: must_contain_any
    values:
    - Plugin/tmgmt/Source
    - SourcePlugin
    - SourceManager
  scoring:
    combine: all_pass
- id: tmgmt_tmgmt_create_job_in_code
  version: '1.0'
  applicable_bundles:
  - tmgmt
  checks:
  - kind: must_contain_any
    values:
    - Job::create(
    - addItem(
    - requestTranslation(
  scoring:
    combine: all_pass
- id: tmgmt_tmgmt_review_ui
  version: '1.0'
  applicable_bundles:
  - tmgmt
  checks:
  - kind: must_contain_any
    values:
    - entity.tmgmt_job_item.canonical
    - /admin/tmgmt/items/
    - acceptTranslation
  scoring:
    combine: all_pass
- id: tmgmt_tmgmt_auto_accept
  version: '1.0'
  applicable_bundles:
  - tmgmt
  checks:
  - kind: must_contain_any
    values:
    - auto_accept
    - tmgmt_translator
  scoring:
    combine: all_pass
- id: tmgmt_tmgmt_checkout_hooks
  version: '1.0'
  applicable_bundles:
  - tmgmt
  checks:
  - kind: must_contain_any
    values:
    - hook_tmgmt_job_before_request_translation
    - hook_tmgmt_job_after_request_translation
  scoring:
    combine: all_pass
- id: tmgmt_tmgmt_permissions
  version: '1.0'
  applicable_bundles:
  - tmgmt
  checks:
  - kind: must_contain_any
    values:
    - accept translation jobs
    - administer tmgmt
  scoring:
    combine: all_pass
