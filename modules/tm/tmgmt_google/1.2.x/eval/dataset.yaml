metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: tmgmt_google
  version: 1.2.x
  note: 'tmgmt_google provides one TMGMT translator plugin, ''google'' (GoogleTranslator), configured
    via a tmgmt_translator config entity (config tmgmt.translator.<id>) with plugin: google and settings
    api_key (required), auto_accept, url (hidden test override). It calls Google Translate API v2 (https://www.googleapis.com/language/translate/v2)
    in chunks of 5. This site has NO Google API key, so all medium/hard cases are grounded in the translator/provider
    PLUGIN CONFIG (the tmgmt_translator entity and its settings) and never trigger a live translation.
    Scripts create/read/delete a tmgmt_translator entity; cleanup/reset remove it to restore baseline.
    The site already has an unrelated translator ''tmgmtg_cfg'' (plugin google_v3) which the scripts do
    not touch.'
questions:
- id: tmgmt_google-plugin-id
  input: The Drupal module tmgmt_google adds a machine translator to TMGMT. What is the translator plugin
    id it registers, and which setting holds the Google credential it needs?
  criteria: It registers the TMGMT translator plugin id 'google' (GoogleTranslator). The credential is
    stored in the translator's api_key setting (the Google Cloud Translation API key).
  bundle: tmgmt_google
  rubric_ref: rubric/tmgmt_google_tmgmt_google_plugin_id@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: tmgmt_google-availability
  input: In tmgmt_google, what must be configured before the Google translator reports itself as available
    for TMGMT jobs, and how is that value checked when saving the provider?
  criteria: 'An api_key (Google API key) must be set: checkAvailable() returns yes only when api_key is
    present. On saving the provider the UI validates the key by fetching Google''s supported languages
    and errors if none come back.'
  bundle: tmgmt_google
  rubric_ref: rubric/tmgmt_google_tmgmt_google_availability@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: tmgmt_google-endpoint
  input: Which Google service/endpoint does tmgmt_google use to translate TMGMT job data, and how does
    it batch the source strings?
  criteria: It calls Google Translate API v2 at https://www.googleapis.com/language/translate/v2, sending
    source strings in chunks of 5 (qChunkSize) with source/target/q parameters.
  bundle: tmgmt_google
  rubric_ref: rubric/tmgmt_google_tmgmt_google_endpoint@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: tmgmt_google-plugin-read
  input: On this Drupal site there is a TMGMT translator (provider) named tmgg_eval. Inspect the live
    configuration and report which translator plugin it uses.
  criteria: 'It uses the ''google'' plugin: the tmgmt_translator entity tmgg_eval (config tmgmt.translator.tmgg_eval)
    has plugin: google.'
  bundle: tmgmt_google
  rubric_ref: rubric/tmgmt_google_tmgmt_google_plugin_read@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/tmgmt_google-plugin-read-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/tmgmt_google-plugin-read-cleanup.sh
- id: tmgmt_google-auto-accept-read
  input: On this Drupal site, the TMGMT Google translator named tmgg_auto_eval has been configured. Inspect
    its live settings and report whether it automatically accepts translations (the auto_accept setting).
  criteria: 'Yes, it auto-accepts: tmgmt.translator.tmgg_auto_eval has settings.auto_accept = true.'
  bundle: tmgmt_google
  rubric_ref: rubric/tmgmt_google_tmgmt_google_auto_accept_read@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/tmgmt_google-auto-accept-read-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/tmgmt_google-auto-accept-read-cleanup.sh
- id: tmgmt_google-create-translator
  input: On this Drupal site, add a TMGMT translation provider that uses the Google Translator (plugin
    'google'), with machine name tmgg_task, and set its Google API key to 'EVAL-KEY-123'. Apply the change
    to the live site. (Do not attempt a live translation.)
  criteria: A tmgmt_translator entity tmgg_task exists with plugin 'google' and settings.api_key = 'EVAL-KEY-123'
    (e.g. Translator::create(['name'=>'tmgg_task','plugin'=>'google','settings'=>['api_key'=>'EVAL-KEY-123']])
    or the Add provider UI).
  bundle: tmgmt_google
  rubric_ref: rubric/tmgmt_google_tmgmt_google_create_translator@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/tmgmt_google-create-translator-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/tmgmt_google-create-translator-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/tmgmt_google-create-translator-verify.sh
- id: tmgmt_google-enable-auto-accept
  input: On this Drupal site there is a TMGMT Google translator with machine name tmgg_autotask (plugin
    'google'). Configure it to automatically accept translations, and apply the change to the live site.
  criteria: tmgmt.translator.tmgg_autotask has settings.auto_accept = true (set the auto_accept setting
    on the tmgmt_translator entity).
  bundle: tmgmt_google
  rubric_ref: rubric/tmgmt_google_tmgmt_google_enable_auto_accept@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/tmgmt_google-enable-auto-accept-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/tmgmt_google-enable-auto-accept-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/tmgmt_google-enable-auto-accept-verify.sh
