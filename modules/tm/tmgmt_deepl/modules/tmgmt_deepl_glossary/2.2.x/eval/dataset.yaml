metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: tmgmt_deepl_glossary
  version: 2.2.x
  note: Submodule of tmgmt_deepl. Manages DeepL glossaries in Drupal via content entities deepl_glossary
    (classic single-pair; base table tmgmt_deepl_glossary; fields label, source_lang, target_lang, tmgmt_translator,
    glossary_id, ready, entry_count, entries [field type deepl_glossary_item with subject/definition]),
    deepl_ml_glossary and deepl_ml_glossary_dictionary (multilingual). Configure route is the overview
    View view.tmgmt_deepl_glossary.page_1; fetch form at /admin/tmgmt/deepl_glossaries/fetch; dedicated
    permissions (administer/add/edit/delete deepl_glossary entities, edit deepl_glossary glossary entries,
    access deepl_glossary overview); API service classes DeeplGlossaryApi/DeeplMultilingualGlossaryApi.
    Syncing/creating glossaries ON DeepL needs the parent module's auth key, so ALL medium/hard cases
    are grounded in the local deepl_glossary content entity (create/read/add entries does NOT call DeepL).
    Scripts key on the entity label (ids autoincrement) and delete their own Eval/Legal/Product glossaries.
questions:
- id: tmgmt_deepl_glossary-what
  input: What does the Drupal tmgmt_deepl_glossary submodule let me do, and how does it help DeepL translations?
  criteria: It lets you create and manage DeepL glossaries (lists of source->target term pairs) in Drupal
    so DeepL translates those terms consistently, supporting classic single-language-pair glossaries and
    DeepL multilingual glossaries.
  bundle: tmgmt_deepl_glossary
  rubric_ref: rubric/tmgmt_deepl_glossary_tmgmt_deepl_glossary_what@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: tmgmt_deepl_glossary-entities
  input: Which entities and field type does tmgmt_deepl_glossary add for storing glossary data?
  criteria: It adds content entities deepl_glossary (classic single-pair), deepl_ml_glossary and deepl_ml_glossary_dictionary
    (multilingual), plus a field type deepl_glossary_item whose items store a subject (source term) and
    definition (target term).
  bundle: tmgmt_deepl_glossary
  rubric_ref: rubric/tmgmt_deepl_glossary_tmgmt_deepl_glossary_entities@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: tmgmt_deepl_glossary-permissions
  input: What permission controls full administration of DeepL glossaries in tmgmt_deepl_glossary, and
    how can a non-admin translator be allowed just to edit glossary term entries?
  criteria: '''administer deepl_glossary entities'' grants full glossary administration (it is the entity
    admin_permission). Give a translator ''edit deepl_glossary glossary entries'' (and ''access deepl_glossary
    overview'') to let them edit term entries without full admin rights.'
  bundle: tmgmt_deepl_glossary
  rubric_ref: rubric/tmgmt_deepl_glossary_tmgmt_deepl_glossary_permissions@1.0
  tags:
  - mode:recipe
  - difficulty:easy
