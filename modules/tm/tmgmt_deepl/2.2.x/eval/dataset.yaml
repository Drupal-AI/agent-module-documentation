metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: tmgmt_deepl
  version: 2.2.x
  note: 'tmgmt_deepl adds DeepL as a TMGMT translator via two @TranslatorPlugin plugins deepl_free and
    deepl_pro (shared base DeeplTranslator, ui DeeplTranslatorUi). A provider is a tmgmt_translator config
    entity (tmgmt.translator.<name>) with plugin deepl_free|deepl_pro and settings (schema tmgmt_deepl_settings:
    auth_key, url, url_usage, formality, split_sentences, tag_handling, ignore_tags, (non_)splitting_tags,
    preserve_formatting, outline_detection, auto_accept, test_url/test_url_usage). Configure route entity.tmgmt_translator.collection
    (/admin/tmgmt/translators); cron queue worker deepl_translate_worker; alter hooks + DeeplReceivedDataEvent;
    no permissions/Drush. Actual translation calls the DeepL API (needs an auth key), so ALL medium/hard
    cases are grounded in the tmgmt_translator config entity itself (creating/reading a provider and its
    settings does NOT call DeepL) using a placeholder auth_key; scripts create/delete their own tdeepl_*
    providers.'
questions:
- id: tmgmt_deepl-what
  input: What does the Drupal tmgmt_deepl module do, and which two translator options does it add to TMGMT?
  criteria: 'It integrates the DeepL machine-translation API into TMGMT as translator providers, adding
    two translator plugins: deepl_free (DeepL API Free) and deepl_pro (DeepL API Pro).'
  bundle: tmgmt_deepl
  rubric_ref: rubric/tmgmt_deepl_tmgmt_deepl_what@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: tmgmt_deepl-where
  input: On a Drupal site, how do I set up DeepL translation with tmgmt_deepl - where do I add the provider
    and what do I need to enter?
  criteria: Add a TMGMT translator/provider at /admin/tmgmt/translators (route entity.tmgmt_translator.collection),
    choose DeepL API Free or Pro, and enter your DeepL auth key (plus optional settings like formality).
    It is stored as a tmgmt_translator config entity.
  bundle: tmgmt_deepl
  rubric_ref: rubric/tmgmt_deepl_tmgmt_deepl_where@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: tmgmt_deepl-formality
  input: The tmgmt_deepl DeepL translator has a 'formality' setting. What values can it take and what
    does it control?
  criteria: 'formality controls whether DeepL leans formal or informal. Values: default, more, less, prefer_more,
    prefer_less (the prefer_* options fall back to default when the target language does not support formality).'
  bundle: tmgmt_deepl
  rubric_ref: rubric/tmgmt_deepl_tmgmt_deepl_formality@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: tmgmt_deepl-known-translator
  input: This Drupal site has a DeepL TMGMT translation provider configured. Inspect the live tmgmt translator
    configuration and tell me the value of its DeepL 'formality' setting.
  criteria: 'formality is ''prefer_more'': tmgmt.translator.tdeepl_known (plugin deepl_free) has settings.formality
    = prefer_more.'
  bundle: tmgmt_deepl
  rubric_ref: rubric/tmgmt_deepl_tmgmt_deepl_known_translator@1.0
  tags:
  - mode:introspection
  - difficulty:medium
