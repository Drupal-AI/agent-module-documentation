metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: epp
  version: 1.7.x
  note: 'Entity Prepopulate (epp) has no config entity, permission, plugin, admin page, or configure route.
    Its entire persistent state is two third-party settings on a field config (field.field.<entity>.<bundle>.<field>):
    epp.value (a YAML string that may contain tokens) and epp.on_update (bool). epp_form_alter() adds
    the ''Entity Prepopulate'' fieldset to field_config_edit_form/base_field_override_edit_form; epp_entity_prepare_form()
    (hook_entity_prepare_form) applies the value on new entities (or on update when on_update is TRUE),
    but only if every token resolves and the value validates. Medium/hard cases are grounded in that real
    config: introspection reads back a field''s epp.value and its on_update flag; execution sets epp.value
    on a field and turns on_update on, verified against the live FieldConfig third-party settings. Fixtures
    use namespaced field_epp_* fields on Article.'
questions:
- id: epp-tps-keys
  input: The Drupal module epp (Entity Prepopulate) stores its per-field configuration as third-party
    settings on the field. What are the two third-party setting keys it uses (under the 'epp' namespace)
    and what does each do?
  criteria: 'Under the epp third-party-settings namespace on the field config: ''value'' (a YAML string,
    may contain tokens, that is prefilled onto the entity) and ''on_update'' (boolean; when TRUE the value
    is also applied on entity update, not just on create).'
  bundle: epp
  rubric_ref: rubric/epp_epp_tps_keys@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: epp-when-applied
  input: With the epp module, when is a field's prepopulate value actually applied to an entity form,
    and what conditions must hold for it to take effect? Is there an admin settings page?
  criteria: There is no admin settings page (configure=null); you set it per field. epp_entity_prepare_form()
    applies the value when the entity is new (or when epp.on_update is TRUE), and only if every token
    in the value resolves (it compares a normal token replace against one with clear=TRUE) and the resulting
    value passes entity validation; otherwise it is not applied.
  bundle: epp
  rubric_ref: rubric/epp_epp_when_applied@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: epp-where-configure
  input: Using epp on a Drupal 11 site, where do I enter the prepopulate value for a field (there's no
    /admin config page), and where does that value get stored in configuration?
  criteria: On the field's own settings form (Manage fields -> edit the field), in the 'Entity Prepopulate'
    fieldset (Value + 'Also on update'). It is stored as third_party_settings.epp.value / epp.on_update
    on the field config entity field.field.<entity>.<bundle>.<field>.
  bundle: epp
  rubric_ref: rubric/epp_epp_where_configure@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: epp-known-value
  input: On this Drupal site, one field on the Article content type has an epp (Entity Prepopulate) prepopulate
    value configured. Inspect the live field configuration and report the field's machine name and the
    exact epp value string.
  criteria: The field field_epp_known on node.article has third_party_settings.epp.value = 'Prefilled
    EPP Marker' (on_update false).
  bundle: epp
  rubric_ref: rubric/epp_epp_known_value@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/epp-known-value-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/epp-known-value-cleanup.sh
- id: epp-on-update-known
  input: 'On this site the Article field field_epp_update has epp prepopulation configured. Inspect the
    live configuration: does its prepopulate value get reapplied when an existing node is updated, or
    only when a node is first created?'
  criteria: 'It is reapplied on update: field_epp_update has third_party_settings.epp.on_update = true
    (plus a value), so epp applies it both on create and on update.'
  bundle: epp
  rubric_ref: rubric/epp_epp_on_update_known@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/epp-on-update-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/epp-on-update-cleanup.sh
- id: epp-set-value
  input: On this Drupal site the Article content type has a text field field_epp_task. Using the epp (Entity
    Prepopulate) module, configure this field so new Article nodes are prepopulated with a default value
    (any non-empty value). Apply the change to the live configuration.
  criteria: field_epp_task on node.article carries a non-empty third_party_settings.epp.value (e.g. $fc->setThirdPartySetting('epp','value','...')->save(),
    or entered in the field's Entity Prepopulate fieldset).
  bundle: epp
  rubric_ref: rubric/epp_epp_set_value@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/epp-set-value-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/epp-set-value-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/epp-set-value-verify.sh
- id: epp-enable-on-update
  input: On this site the Article field field_epp_task already has an epp prepopulate value, but it only
    applies to newly created nodes. Reconfigure it with the epp module so the value is ALSO reapplied
    whenever an existing Article node is updated. Apply the change live.
  criteria: field_epp_task on node.article has third_party_settings.epp.on_update = true (in addition
    to its value) - i.e. tick 'Also on update' or $fc->setThirdPartySetting('epp','on_update',TRUE)->save().
  bundle: epp
  rubric_ref: rubric/epp_epp_enable_on_update@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/epp-on-update-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/epp-on-update-exec-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/epp-on-update-verify.sh
