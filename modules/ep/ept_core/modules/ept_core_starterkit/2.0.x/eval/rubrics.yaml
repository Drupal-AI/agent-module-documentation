rubrics:
- id: ept_core_starterkit_ept_core_starterkit_generator_name
  version: '1.0'
  applicable_bundles:
  - ept_core_starterkit
  checks:
  - kind: must_contain_any
    values:
    - ept:module
    - ept-module
    - drush generate
  scoring:
    combine: all_pass
- id: ept_core_starterkit_ept_core_starterkit_drush_requirement
  version: '1.0'
  applicable_bundles:
  - ept_core_starterkit
  checks:
  - kind: must_contain_any
    values:
    - Drush 12
    - Drush
    - '12'
  scoring:
    combine: all_pass
- id: ept_core_starterkit_ept_core_starterkit_generated_output
  version: '1.0'
  applicable_bundles:
  - ept_core_starterkit
  checks:
  - kind: must_contain_any
    values:
    - ept_core
    - paragraphs_type
    - paragraphs
  scoring:
    combine: all_pass
- id: ept_core_starterkit_ept_core_starterkit_generator_available
  version: '1.0'
  applicable_bundles:
  - ept_core_starterkit
  checks:
  - kind: must_contain_any
    values:
    - ept:module
    - ept-module
  scoring:
    combine: all_pass
- id: ept_core_starterkit_ept_core_starterkit_generate_module
  version: '1.0'
  applicable_bundles:
  - ept_core_starterkit
  checks:
  - kind: command
    command: bash {{ metadata.verify }}
    expect: exit_zero
    sandbox: ddev
  scoring:
    combine: all_pass
