metadata:
  skill_name: drupal-module-docs
  skill_file: .agents/skills/drupal-module-docs/SKILL.md
  module: ept_core_starterkit
  version: 2.0.x
  note: EPT Starterkit is a submodule of EPT Core whose only substance is a DrupalCodeGenerator command,
    ept:module (alias ept-module, class EptGenerator), surfaced through Drush's generate command. It scaffolds
    a complete new EPT paragraph module (info.yml depending on ept_core + paragraphs, a paragraphs_type,
    field.field instances for the shared EPT fields, form/view displays, template, composer.json, test).
    It requires Drush 12+ (hook_requirements). No routes/permissions/services/config. The medium case
    verifies the generator is discoverable on the live site; the hard case generates a new module into
    web/modules/custom/ept_test_hero, verified by the presence of its info.yml depending on ept_core (the
    generated module is never enabled, so no orphaned-module risk).
questions:
- id: ept_core_starterkit-generator-name
  input: How do I scaffold a brand-new Extra Paragraph Types (EPT) paragraph module with the EPT Starterkit?
    Give the exact Drush generator name.
  criteria: Run drush generate ept:module (alias ept-module); it asks for the machine name and human name
    and writes a complete new EPT paragraph module from boilerplate.
  bundle: ept_core_starterkit
  rubric_ref: rubric/ept_core_starterkit_ept_core_starterkit_generator_name@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: ept_core_starterkit-drush-requirement
  input: What tool and minimum version does the EPT Starterkit require to generate a new EPT module?
  criteria: It requires Drush 12 or newer; ept_core_starterkit_requirements() blocks install/use on older
    Drush versions.
  bundle: ept_core_starterkit
  rubric_ref: rubric/ept_core_starterkit_ept_core_starterkit_drush_requirement@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: ept_core_starterkit-generated-output
  input: When the EPT Starterkit generates a new EPT module, what key things does it create, and what
    does the generated module depend on?
  criteria: It generates the module's info.yml (package 'Extra Paragraph Types', depending on ept_core
    and paragraphs), a paragraphs_type config entity, field.field instances for field_ept_settings/field_ept_text/field_ept_title,
    default form/view displays, a paragraph Twig template, composer.json and a functional test.
  bundle: ept_core_starterkit
  rubric_ref: rubric/ept_core_starterkit_ept_core_starterkit_generated_output@1.0
  tags:
  - mode:recipe
  - difficulty:easy
- id: ept_core_starterkit-generator-available
  input: On this Drupal site, which Drush generator is available for scaffolding a new Extra Paragraph
    Types module? Inspect the live site (e.g. the list of drush generators) and give its name.
  criteria: The ept:module generator (alias ept-module), provided by the enabled ept_core_starterkit module;
    it appears in `drush generate` output.
  bundle: ept_core_starterkit
  rubric_ref: rubric/ept_core_starterkit_ept_core_starterkit_generator_available@1.0
  tags:
  - mode:introspection
  - difficulty:medium
  metadata:
    setup: agent-module-documentation/evaluation/verify/ept_core_starterkit-generator-setup.sh
    cleanup: agent-module-documentation/evaluation/verify/ept_core_starterkit-generator-cleanup.sh
- id: ept_core_starterkit-generate-module
  input: On this Drupal site, use the EPT Starterkit to generate a new EPT paragraph module named 'EPT
    Test Hero' with machine name ept_test_hero, into web/modules/custom/ept_test_hero. Do not enable it
    — just generate the module files.
  criteria: web/modules/custom/ept_test_hero/ept_test_hero.info.yml exists and depends on ept_core, e.g.
    via `drush generate ept:module --answer=ept_test_hero --answer='EPT Test Hero' --destination=modules/custom/ept_test_hero`.
  bundle: ept_core_starterkit
  rubric_ref: rubric/ept_core_starterkit_ept_core_starterkit_generate_module@1.0
  tags:
  - mode:execution
  - difficulty:hard
  metadata:
    persona: drupal-expert
    reset: agent-module-documentation/evaluation/verify/ept_core_starterkit-generate-reset.sh
    cleanup: agent-module-documentation/evaluation/verify/ept_core_starterkit-generate-cleanup.sh
    verify: agent-module-documentation/evaluation/verify/ept_core_starterkit-generate-verify.sh
